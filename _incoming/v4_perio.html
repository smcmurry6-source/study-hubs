function renderUnderstoryScene(){
  var panel = document.getElementById('panel-game');
  var scene = understorySVG();
  var html = '<div class="game-hud section-block">' +
    '<div class="hud-tile"><b>'+STATE.totalCorrect+'</b> / '+QUESTIONS.length+' correct across the course</div>' +
    '<div class="hud-tile"><b>'+STATE.bestStreak+'</b> best streak</div>' +
    '<div class="hud-tile"><b>'+Object.keys(STATE.achievements).length+'</b> / '+ACHIEVEMENTS.length+' achievements</div>' +
    '</div>';
  html += '<div class="game-scene-wrap"><div class="game-scene-inner" style="min-width:'+scene.w+'px;">';
  html += '<svg viewBox="0 0 '+scene.w+' '+scene.h+'" style="width:100%;display:block;" class="atlas-svg">' + scene.svg + '</svg>';

  GALLERIES.forEach(function(w){
    var prog = galleryProgress(w);
    var leftPct, x1, x2;
    if(w.id==='gallery-taproot'){ x1=80; x2=420; }
    else if(w.id==='gallery-crater'){ x1=620; x2=900; }
    else { x1=960; x2=1240; }
    leftPct = ((x1+x2)/2 / scene.w * 100).toFixed(2);
    html += '<button type="button" class="game-hotspot" style="left:'+leftPct+'%;top:'+(360/scene.h*100).toFixed(2)+'%;" data-open-gallery="'+w.id+'" data-cleared="'+prog.cleared+'">' +
      '<span class="gh-label">'+escHtml(w.room)+'</span>' +
      '<span class="gh-progress mono">'+prog.correct+'/'+prog.total+'</span>' +
      '</button>';
  });
  CHECKPOINTS.forEach(function(cp){
    var x1, x2;
    if(cp.id==='checkpoint-midterm'){ x1=460; x2=560; } else { x1=1280; x2=1380; }
    var leftPct = ((x1+x2)/2 / scene.w * 100).toFixed(2);
    var cpProg = checkpointProgress(cp);
    html += '<button type="button" class="game-hotspot is-boss" style="left:'+leftPct+'%;top:'+(360/scene.h*100).toFixed(2)+'%;" data-open-checkpoint="'+cp.id+'" data-cleared="'+cpProg.cleared+'">' +
      '<span class="gh-label">'+escHtml(cp.name)+'</span>' +
      '<span class="gh-progress mono">'+(cpProg.cleared?'Cleared':cpProg.correct+'/'+cpProg.total)+'</span>' +
      '</button>';

  html += '</div></div>';

function buildEncounterPool(){
  if(GAME_VIEW.lecId){
    GAME_ENCOUNTER_POOL.key = GAME_VIEW.lecId;
    GAME_ENCOUNTER_POOL.list = QUESTIONS_BY_LECTURE[GAME_VIEW.lecId].slice();
  } else if(GAME_VIEW.checkpointId){
    var cp = CHECKPOINT_BY_ID[GAME_VIEW.checkpointId];
    var pool = [];
    cp.wards.forEach(function(lecId){ pool = pool.concat(QUESTIONS_BY_LECTURE[lecId]); });
    GAME_ENCOUNTER_POOL.key = GAME_VIEW.checkpointId;
    GAME_ENCOUNTER_POOL.list = shuffled(pool).slice(0, cp.count);
  }
}
function renderEncounter(){
  var panel = document.getElementById('panel-game');
  var isCheckpoint = !!GAME_VIEW.checkpointId;
  if(GAME_ENCOUNTER_POOL.key !== (GAME_VIEW.lecId || GAME_VIEW.checkpointId)) buildEncounterPool();
  var html = '';
  if(isCheckpoint){
    var cp = CHECKPOINT_BY_ID[GAME_VIEW.checkpointId];
    html += '<div class="atlas-back"><button type="button" data-game-back="scene">&larr; Understory</button></div>';
    html += '<div class="card section-block"><span class="eyebrow">Checkpoint</span><h2>'+escHtml(cp.name)+'</h2>' +
      '<p style="color:var(--ink-soft);">A fresh, shuffled draw of '+GAME_ENCOUNTER_POOL.list.length+' questions from '+(cp.wards.length)+' session'+(cp.wards.length===1?'':'s')+'. Come back any time for a new draw.</p></div>';
  } else {
    var l = LECTURE_BY_ID[GAME_VIEW.lecId];
    var w = galleryOf(l.id);
    html += '<div class="atlas-back"><button type="button" data-game-back="gallery" data-gallery-id="'+w.id+'">&larr; '+escHtml(w.room)+'</button></div>';
    var prog = lectureProgress(l.id);
    html += '<div class="card section-block"><span class="eyebrow"><span class="tag-chip tag-'+l.tag+'"><span class="tag-dot"></span>Session '+l.num+'</span></span><h2>'+escHtml(l.title)+'</h2>' +
      '<div class="encounter-progress mono">'+prog.correct+' / '+prog.total+' correct</div></div>';
  }
  html += '<div id="encounterList">' + GAME_ENCOUNTER_POOL.list.map(qCardHTML).join('') + '</div>';
  panel.innerHTML = html;
  wireGamePanel(panel);
  wireQuestionContainer(document.getElementById('encounterList'));
}

/* ---------- Cutscene overlay ---------- */
var CUTSCENE_STATE = null;
function playCutscene(lecId){
  var cs = CUTSCENES[lecId];
  if(!cs) return;
  CUTSCENE_STATE = { lecId:lecId, idx:0 };
  renderCutsceneOverlay();
}
function renderCutsceneOverlay(){
  var existing = document.getElementById('cutsceneOverlay');
  if(existing) existing.remove();
  if(!CUTSCENE_STATE) return;
  var cs = CUTSCENES[CUTSCENE_STATE.lecId];
  var beat = cs.beats[CUTSCENE_STATE.idx];
  var isLast = CUTSCENE_STATE.idx === cs.beats.length - 1;
  var lineHtml = '';
  if(beat.kind === 'doc'){
    lineHtml = '<div class="cutscene-line doc">'+escHtml(beat.text)+'</div>';
  } else if(beat.kind === 'dialogue'){
    lineHtml = '<div class="cutscene-line"><span class="cutscene-speaker">'+escHtml(beat.speaker)+'</span>'+escHtml(beat.text)+'</div>';
  } else {
    lineHtml = '<div class="cutscene-line" style="font-style:italic;opacity:.85;">'+escHtml(beat.text)+'</div>';
  }
  var overlay = document.createElement('div');
  overlay.className = 'cutscene-overlay';
  overlay.id = 'cutsceneOverlay';
  overlay.innerHTML = '<div class="cutscene-box">' + lineHtml +
    '<div class="cutscene-nav"><button type="button" id="cutsceneNextBtn">'+(isLast?'Close':'Continue')+'</button></div>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('cutsceneNextBtn').addEventListener('click', function(){
    if(isLast){ CUTSCENE_STATE = null; overlay.remove(); return; }
    CUTSCENE_STATE.idx += 1;
    renderCutsceneOverlay();
  });
}
document.addEventListener('perio:answered', function(e){
  var lecId = e.detail.lec;
  if(!lecId || !CUTSCENES[lecId]) return;
  if(isLectureCleared(lecId) && !STATE.game.cutscenesSeen[lecId]){
    STATE.game.cutscenesSeen[lecId] = true;
    saveState();
    setTimeout(function(){ playCutscene(lecId); }, 300);
  }
});

function wireGamePanel(panel){
  if(panel.__wired) return;
  panel.__wired = true;
  panel.addEventListener('click', function(e){
    var galleryBtn = e.target.closest('[data-open-gallery]');
    if(galleryBtn){ GAME_VIEW = { mode:'gallery', galleryId:galleryBtn.getAttribute('data-open-gallery'), lecId:null, checkpointId:null }; renderGame(); return; }
    var cpBtn = e.target.closest('[data-open-checkpoint]');
    if(cpBtn){ GAME_VIEW = { mode:'encounter', galleryId:null, lecId:null, checkpointId:cpBtn.getAttribute('data-open-checkpoint') }; renderGame(); return; }
    var encBtn = e.target.closest('[data-open-encounter]');
    if(encBtn){ GAME_VIEW = { mode:'encounter', galleryId:null, lecId:encBtn.getAttribute('data-open-encounter'), checkpointId:null }; renderGame(); return; }
    var replayBtn = e.target.closest('[data-replay-cutscene]');
    if(replayBtn){ playCutscene(replayBtn.getAttribute('data-replay-cutscene')); return; }
    var backBtn = e.target.closest('[data-game-back]');
    if(backBtn){
      var target = backBtn.getAttribute('data-game-back');
      if(target === 'scene'){ GAME_VIEW = { mode:'scene', galleryId:null, lecId:null, checkpointId:null }; }
      else if(target === 'gallery'){ GAME_VIEW = { mode:'gallery', galleryId:backBtn.getAttribute('data-gallery-id'), lecId:null, checkpointId:null }; }
      renderGame();
      return;
    }
  });
}

/* ====================================================================
   BOOT / MODE SWITCHING
   ==================================================================== */
var CURRENT_MODE = 'compendium';
var MODE_RENDERERS = { compendium: renderCompendium, atlas: renderAtlas, game: renderGame };

function switchMode(mode){
  if(mode === CURRENT_MODE) return;
  CURRENT_MODE = mode;
  document.querySelectorAll('#modeSwitch button').forEach(function(b){
    b.setAttribute('aria-selected', String(b.getAttribute('data-mode') === mode));
  });
  document.querySelectorAll('.mode-panel').forEach(function(p){
    p.hidden = p.getAttribute('data-mode-panel') !== mode;
  });
  MODE_RENDERERS[mode]();
}

function boot(){
  renderHeaderMeta();
  document.getElementById('modeSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if(btn) switchMode(btn.getAttribute('data-mode'));
  });
  renderCompendium();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

/* Published for the shared widget (search + toughest-questions labels) —
   see widget/v3.js. QUESTIONS/LECTURES are static array literals populated
   above, not built asynchronously, so this is safe to publish once here.
   Note: this hub's question text field is "stem", not "q" like the others. */
window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id: l.id, title: l.title }; }),
  questions: QUESTIONS.map(function(q){
    var hint = q.type === 'mcq' && q.choices && typeof q.answer === 'number' ? q.choices[q.answer] : (q.answerText || '');
    if (q.ex) hint = hint ? (hint + ' — ' + q.ex) : q.ex;
    return { id: q.id, lec: q.lec, text: q.stem || q.q || '', hint: hint };
  })
};
