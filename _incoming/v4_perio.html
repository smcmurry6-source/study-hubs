</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============ TOKENS ============ */
:root{
  --ink:#16211D;
  --ink-soft:#4B5A53;
  --paper:#F4F6F0;
  --surface:#FFFFFF;
  --surface-2:#EDF1E9;
  --line:rgba(22,33,29,0.13);
  --line-strong:rgba(22,33,29,0.24);
  --teal:#0E6B58;
  --teal-ink:#08402F;
  --teal-soft:#DCEEE7;
  --flag:#B9791B;
  --flag-ink:#7A4E0B;
  --flag-soft:#FBEBCB;
  --alert:#A63A32;
  --alert-ink:#7A241D;
  --alert-soft:#F6DEDB;
  --tag-teal:#0E6B58;   --tag-teal-soft:#DCEEE7;
  --tag-rose:#B23A5C;   --tag-rose-soft:#F5DEE4;
  --tag-amber:#B9791B;  --tag-amber-soft:#FBEBCB;
  --tag-blue:#2B5FA6;   --tag-blue-soft:#DCE7F5;
  --tag-violet:#6B4FA0; --tag-violet-soft:#E7DEF3;
  --tag-slate:#51606B;  --tag-slate-soft:#DEE4E7;
  --shadow:0 1px 2px rgba(22,33,29,0.06), 0 8px 24px -12px rgba(22,33,29,0.18);
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --font-display:'Newsreader',ui-serif,Georgia,serif;
  --font-body:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9F1EB;
    --ink-soft:#AEBDB4;
    --paper:#101713;
    --surface:#17211C;
    --surface-2:#1D2822;
    --line:rgba(233,241,235,0.14);
    --line-strong:rgba(233,241,235,0.26);
    --teal:#4FBFA0;
    --teal-ink:#BEEBDC;
    --teal-soft:rgba(79,191,160,0.16);
    --flag:#E8B15A;
    --flag-ink:#F6DDA8;
    --flag-soft:rgba(232,177,90,0.16);
    --alert:#E2827B;
    --alert-ink:#F3C3BE;
    --alert-soft:rgba(226,130,123,0.16);
    --tag-teal:#4FBFA0;   --tag-teal-soft:rgba(79,191,160,0.16);
    --tag-rose:#E38FAA;   --tag-rose-soft:rgba(227,143,170,0.16);
    --tag-amber:#E8B15A;  --tag-amber-soft:rgba(232,177,90,0.16);
    --tag-blue:#8FB4E8;   --tag-blue-soft:rgba(143,180,232,0.16);
    --tag-violet:#B49BE0; --tag-violet-soft:rgba(180,155,224,0.16);
    --tag-slate:#9DB0BC;  --tag-slate-soft:rgba(157,176,188,0.16);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --ink:#E9F1EB;
  --ink-soft:#AEBDB4;
  --paper:#101713;
  --surface:#17211C;
  --surface-2:#1D2822;
  --line:rgba(233,241,235,0.14);
  --line-strong:rgba(233,241,235,0.26);
  --teal:#4FBFA0;
  --teal-ink:#BEEBDC;
  --teal-soft:rgba(79,191,160,0.16);
  --flag:#E8B15A;
  --flag-ink:#F6DDA8;
  --flag-soft:rgba(232,177,90,0.16);
  --alert:#E2827B;
  --alert-ink:#F3C3BE;
  --alert-soft:rgba(226,130,123,0.16);
  --tag-teal:#4FBFA0;   --tag-teal-soft:rgba(79,191,160,0.16);
  --tag-rose:#E38FAA;   --tag-rose-soft:rgba(227,143,170,0.16);
  --tag-amber:#E8B15A;  --tag-amber-soft:rgba(232,177,90,0.16);
  --tag-blue:#8FB4E8;   --tag-blue-soft:rgba(143,180,232,0.16);
  --tag-violet:#B49BE0; --tag-violet-soft:rgba(180,155,224,0.16);
  --tag-slate:#9DB0BC;  --tag-slate-soft:rgba(157,176,188,0.16);
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
}

/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box;}
html{color-scheme:light dark;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:600;
  line-height:1.15;
  margin:0 0 .4em;
  text-wrap:balance;
  color:var(--ink);
}
h1{font-size:2.1rem;font-weight:600;}
h2{font-size:1.5rem;}
h3{font-size:1.15rem;}
p{margin:0 0 .8em;}
a{color:var(--teal);}
button{font-family:inherit;}
::selection{background:var(--flag-soft);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

/* chart-grid watermark, subject motif: periodontal charting grid */
.chart-grid-bg{
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:26px 26px;
  background-position:-1px -1px;
}

/* ============ APP SHELL ============ */
#app{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

.hub-header{
  position:sticky;top:0;z-index:40;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:14px 20px 0;
  margin:0 calc(50% - 50vw);
  padding-left:calc(50vw - 50% + 20px);
  padding-right:calc(50vw - 50% + 20px);
}
.hub-header-top{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  max-width:1180px;margin:0 auto;flex-wrap:wrap;
}
.hub-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.hub-title h1{font-size:1.5rem;margin:0;}
.hub-subtitle{color:var(--ink-soft);font-size:.85rem;font-family:var(--font-mono);}
.hub-meta{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--ink-soft);}
.streak-pill{
  font-family:var(--font-mono);background:var(--teal-soft);color:var(--teal-ink);
  border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;
}

/* Chart-tab style mode switcher */
#modeSwitch{
  display:flex;gap:2px;max-width:1180px;margin:14px auto 0;
  border-bottom:1px solid var(--line);
}
#modeSwitch button{
  appearance:none;border:1px solid transparent;border-bottom:none;
  background:transparent;color:var(--ink-soft);
  padding:10px 18px;font-size:.92rem;font-weight:600;
  border-radius:var(--radius-s) var(--radius-s) 0 0;
  cursor:pointer;position:relative;top:1px;
  font-family:var(--font-body);
}
#modeSwitch button:hover{color:var(--ink);background:var(--surface-2);}
#modeSwitch button[aria-selected="true"]{
  color:var(--teal-ink);background:var(--surface);
  border-color:var(--line) var(--line) var(--surface);
}
#modeSwitch button .mode-icon{margin-right:6px;}

.mode-panel{padding-top:26px;}
.mode-panel[hidden]{display:none!important;}

/* ============ SUB-NAV (within compendium/atlas) ============ */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
.subnav button{
  appearance:none;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-soft);padding:7px 14px;border-radius:999px;font-size:.82rem;
  font-weight:600;cursor:pointer;font-family:var(--font-body);
}
.subnav button:hover{border-color:var(--line-strong);color:var(--ink);}
.subnav button[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff;}

/* ============ CARDS / SECTIONS ============ */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);
  padding:22px 24px;box-shadow:var(--shadow);
}
.section-block{margin-bottom:34px;}
.section-block:last-child{margin-bottom:0;}
.eyebrow{
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--teal-ink);font-weight:600;margin-bottom:6px;display:block;
}

.tag-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;
  padding:2px 9px;border-radius:999px;font-family:var(--font-mono);white-space:nowrap;
}
.tag-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.tag-teal{background:var(--tag-teal-soft);color:var(--tag-teal);}
.tag-rose{background:var(--tag-rose-soft);color:var(--tag-rose);}
.tag-amber{background:var(--tag-amber-soft);color:var(--tag-amber);}
.tag-blue{background:var(--tag-blue-soft);color:var(--tag-blue);}
.tag-violet{background:var(--tag-violet-soft);color:var(--tag-violet);}
.tag-slate{background:var(--tag-slate-soft);color:var(--tag-slate);}
.tag-teal .tag-dot{background:var(--tag-teal);}
.tag-rose .tag-dot{background:var(--tag-rose);}
.tag-amber .tag-dot{background:var(--tag-amber);}
.tag-blue .tag-dot{background:var(--tag-blue);}
.tag-violet .tag-dot{background:var(--tag-violet);}
.tag-slate .tag-dot{background:var(--tag-slate);}

/* Lecture grid (course info + lecture list) */
.lecture-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.lecture-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:16px 16px 14px;cursor:pointer;text-align:left;font-family:inherit;
  display:flex;flex-direction:column;gap:8px;min-width:0;
  border-top:3px solid var(--lec-color,var(--teal));
}
.lecture-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);}
.lecture-card .lec-num{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);}
.lecture-card h4{margin:0;font-size:1.02rem;}
.lecture-card .lec-who{font-size:.78rem;color:var(--ink-soft);}
.lecture-card .lec-status{margin-top:auto;}
.lecture-card .tag-chip{white-space:normal;text-align:left;line-height:1.3;border-radius:8px;}

.milestone-row{
  display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--ink-soft);
  font-family:var(--font-mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;
}
.milestone-row::before,.milestone-row::after{content:"";flex:1;height:1px;background:var(--line-strong);}

/* ============ TABLES (chart-style) ============ */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-m);margin-bottom:16px;}
table.chart-table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:560px;}
table.chart-table th,table.chart-table td{
  padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;
}
table.chart-table thead th{
  background:var(--surface-2);font-family:var(--font-mono);font-size:.72rem;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:600;
}
table.chart-table tbody tr:last-child td{border-bottom:none;}
table.chart-table td.mono,table.chart-table th.mono{font-family:var(--font-mono);}
table.chart-table tbody tr:hover{background:var(--surface-2);}

/* ============ READING PANE ============ */
.reading-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.level-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);}
.level-toggle button{
  appearance:none;border:none;background:transparent;color:var(--ink-soft);
  padding:5px 13px;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--font-body);
}
.level-toggle button[aria-pressed="true"]{background:var(--teal);color:#fff;}
.reading-prose{max-width:72ch;}
.reading-prose h5{font-family:var(--font-display);font-size:1.02rem;margin:1.3em 0 .3em;color:var(--teal-ink);}
.reading-prose p{margin:0 0 .85em;}
.reading-prose ul{margin:0 0 .85em;padding-left:1.3em;}
.reading-prose li{margin-bottom:.3em;}
.pearl{
  background:var(--flag-soft);border-left:3px solid var(--flag);border-radius:0 var(--radius-s) var(--radius-s) 0;
  padding:10px 14px;margin:1em 0;font-size:.92rem;
}
.pearl b{color:var(--flag-ink);}

/* ============ QUESTION CARDS (shared renderer target) ============ */
.qbank-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.qbank-toolbar input[type="search"]{
  flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:.88rem;
}
.qbank-toolbar select{
  padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:.85rem;
}
.qbank-count{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft);white-space:nowrap;}

.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:16px 18px;margin-bottom:12px;
}
.qcard-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px;}
.qcard-stem{font-weight:500;flex:1;}
.qcard-meta{display:flex;gap:6px;flex-wrap:wrap;}
.qcard-choices{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.qcard-choice{
  text-align:left;appearance:none;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:8px 12px;border-radius:var(--radius-s);cursor:pointer;font-size:.9rem;
  font-family:inherit;display:flex;gap:8px;
}
.qcard-choice:hover{border-color:var(--line-strong);}
.qcard-choice[data-state="correct"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink);}
.qcard-choice[data-state="incorrect"]{background:var(--alert-soft);border-color:var(--alert);color:var(--alert-ink);}
.qcard-choice[disabled]{cursor:default;}
.qcard-explain{
  margin-top:10px;padding:10px 12px;border-radius:var(--radius-s);background:var(--surface-2);
  font-size:.85rem;color:var(--ink-soft);display:none;
}
.qcard-explain.shown{display:block;}
.qcard-reveal-btn,.qcard-grade-btns{margin-top:10px;}
.qcard-reveal-btn button,.qcard-grade-btns button{
  appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 14px;border-radius:var(--radius-s);cursor:pointer;font-size:.85rem;font-family:inherit;font-weight:600;
  margin-right:8px;
}
.qcard-grade-btns button.good{border-color:var(--teal);color:var(--teal-ink);}
.qcard-grade-btns button.bad{border-color:var(--alert);color:var(--alert-ink);}
.qcard-seq-steps,.qcard-match-cols{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.qcard-seq-steps button{
  appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 12px;border-radius:var(--radius-s);cursor:pointer;font-size:.85rem;font-family:inherit;
}
.qcard-seq-steps button[data-picked="true"]{background:var(--teal-soft);border-color:var(--teal);}
.qcard-match-cols{justify-content:space-between;gap:20px;}
.qcard-match-col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:140px;}
.qcard-match-item{
  appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 10px;border-radius:var(--radius-s);cursor:pointer;font-size:.83rem;text-align:left;font-family:inherit;
}
.qcard-match-item[data-selected="true"]{border-color:var(--teal);background:var(--teal-soft);}
.qcard-match-item[data-state="correct"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink);}
.qcard-match-item[data-state="incorrect"]{border-color:var(--alert);background:var(--alert-soft);color:var(--alert-ink);}

/* Achievements / toast */
#toastHost{position:fixed;bottom:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--radius-m);
  font-size:.85rem;box-shadow:var(--shadow);max-width:280px;display:flex;gap:8px;align-items:center;
  animation:toastIn .25s ease-out;
}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Cram sheet */
.cram-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.cram-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;}
.cram-card h5{margin:0 0 8px;font-family:var(--font-display);font-size:1rem;color:var(--teal-ink);}
.cram-card ul{margin:0;padding-left:1.1em;font-size:.85rem;}
.cram-card li{margin-bottom:5px;}

/* Exam hints */
.hint-item{
  border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:10px;
  background:var(--surface);
}
.hint-item.emphasize{border-left:4px solid var(--flag);}
.hint-item.deemphasize{border-left:4px solid var(--ink-soft);}
.hint-quote{font-family:var(--font-display);font-style:italic;font-size:1rem;margin:0 0 8px;color:var(--ink);}
.hint-take{font-size:.86rem;color:var(--ink-soft);margin:0;}

/* ============ ATLAS ============ */
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:22px;}
.atlas-tile{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-m);
  padding:14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);
}
.atlas-tile:hover{border-color:var(--line-strong);box-shadow:var(--shadow);}
.atlas-tile h4{margin:0 0 4px;font-size:.95rem;}
.atlas-tile p{margin:0;font-size:.78rem;color:var(--ink-soft);}
.atlas-stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px;}
.atlas-diagram-wrap{overflow-x:auto;}
.atlas-svg-box{min-width:640px;}
.hotspot-dot{cursor:pointer;fill:var(--flag);stroke:var(--surface);stroke-width:2;}
.hotspot-dot:hover{fill:var(--teal);}
.hotspot-dot[data-active="true"]{fill:var(--teal);stroke-width:3;}
.atlas-svg text{fill:var(--ink-soft);font-family:var(--font-mono);}
.atlas-svg .diagram-label{fill:var(--ink);font-family:var(--font-body);font-weight:600;}
.atlas-caption{font-size:.78rem;color:var(--ink-soft);text-anchor:middle;}
.atlas-label-panel{
  margin-top:14px;padding:12px 14px;background:var(--surface-2);border-radius:var(--radius-s);
  font-size:.88rem;min-height:1.6em;
}
.atlas-back{margin-bottom:14px;}
.atlas-back button{
  appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 13px;border-radius:999px;cursor:pointer;font-size:.82rem;font-family:inherit;font-weight:600;
}

/* ============ GAME ============ */
.game-scene-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-l);position:relative;background:var(--surface);}
.game-scene-inner{position:relative;min-width:900px;}
.game-hotspot{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--surface);border:2px solid var(--line-strong);border-radius:var(--radius-m);
  padding:7px 10px;cursor:pointer;font-family:var(--font-body);color:var(--ink);
  box-shadow:var(--shadow);min-width:96px;text-align:center;
}
.game-hotspot:hover{border-color:var(--teal);}
.game-hotspot[data-cleared="true"]{border-color:var(--teal);background:var(--teal-soft);}
.game-hotspot .gh-label{font-size:.76rem;font-weight:600;line-height:1.2;}
.game-hotspot .gh-progress{font-family:var(--font-mono);font-size:.68rem;color:var(--ink-soft);}
.game-hotspot[data-cleared="true"] .gh-progress{color:var(--teal-ink);}

var QUESTIONS = [

/* ===== Lecture 1 — Diagnosis, Classification & Treatment Planning ===== */
{ id:'q1-01', lec:'diagnosis-tx-planning', type:'mcq', stem:"A periodontal probe reads 5 mm from the gingival margin to the base of the pocket. What is this measurement called?", choices:['Probing depth (PD)','Clinical attachment level (CAL)','Gingival recession (GR)','Radiographic bone loss'], answer:0, ex:"PD runs from the gingival margin to the base of the pocket. CAL adds recession to PD; GR runs from the CEJ to the gingival margin.", src:'lecture' },
{ id:'q1-02', lec:'diagnosis-tx-planning', type:'mcq', stem:"Probing depth is 7 mm, and the CEJ is felt 4 mm apical to the gingival margin (no visible recession). What is the clinical attachment level?", choices:['3 mm','7 mm','11 mm','4 mm'], answer:0, ex:"CAL = PD + GR using signed GR. Here GR = -4 (CEJ is subgingival), so CAL = 7 + (-4) = 3 mm of attachment loss.", src:'lecture' },
{ id:'q1-03', lec:'diagnosis-tx-planning', type:'mcq', stem:"Tooth X: 2 mm probing depth with 4 mm of visible recession (CAL 6 mm). Tooth Y: 7 mm probing depth, CEJ felt 4 mm subgingival (CAL 3 mm). Which tooth is more maintainable for the patient, despite its higher attachment loss?", choices:['Tooth X — the shallow pocket','Tooth Y — the deep pocket','Both are equally maintainable','Neither can be maintained'], answer:0, ex:"Recession makes CAL look worse on paper, but a shallow, accessible 2 mm pocket is far easier for a patient to brush and floss than a deep 7 mm pocket.", src:'lecture' },
{ id:'q1-04', lec:'diagnosis-tx-planning', type:'mcq', stem:"Which radiograph is preferred over a horizontal bitewing when screening for periodontal bone loss, and why?", choices:['Vertical bitewing — less likely to miss bone loss on one arch','Panoramic — gives the most site-specific detail','Occlusal film — best shows interproximal bone','Horizontal bitewing — faster to interpret'], answer:0, ex:"A horizontal bitewing can fail to capture bone loss on one of the two arches; vertical bitewings extend the field and are preferred when bone loss is a concern.", src:'lecture' },
{ id:'q1-05', lec:'diagnosis-tx-planning', type:'recall', stem:"Name the two findings that must both be present for a bleeding 5 mm probing depth to represent periodontitis rather than gingivitis.", answer:"Attachment loss AND radiographic bone loss at that site. A deep probing depth alone can occur in plaque-induced gingivitis (which can reach 4–5 mm) without any attachment or bone loss — so probing depth by itself never proves periodontitis.", src:'lecture' },
{ id:'q1-06', lec:'diagnosis-tx-planning', type:'mcq', stem:"A tooth has 1 mm of mesial and 1 mm of distal recession (some interproximal attachment loss present), but 6 mm of buccal recession — clearly more than either interproximal measurement. What recession type is this?", choices:['RT2','RT1','RT3','Cannot be determined'], answer:0, ex:"Interproximal attachment loss is present, ruling out RT1. Buccal loss (6 mm) exceeds interproximal loss (1 mm), which is the definition of RT2.", src:'lecture' },
{ id:'q1-07', lec:'diagnosis-tx-planning', type:'mcq', stem:"Which recession type is not treated with a root-coverage attempt, because it will not succeed?", choices:['RT3','RT1','RT2','All types are treated the same way'], answer:0, ex:"In RT3, interproximal attachment loss exceeds buccal loss — coverage cannot be achieved and is not attempted.", src:'lecture' },
{ id:'q1-08', lec:'diagnosis-tx-planning', type:'match', stem:"Match each recession type to its definition.", pairs:[['RT1','No loss of interproximal attachment'],['RT2','Interproximal CAL ≤ buccal CAL'],['RT3','Interproximal CAL > buccal CAL']], ex:"Jepsen, Caton et al., 2018 World Workshop, Workgroup 3.", src:'lecture' },
{ id:'q1-09', lec:'diagnosis-tx-planning', type:'mcq', stem:"Under the 2018 World Workshop classification, what replaced the older separate categories of 'chronic periodontitis' and 'aggressive periodontitis'?", choices:['A single "Periodontitis" category, staged and graded','Two new categories: "slow" and "fast" periodontitis','Nothing — the old terms are still used clinically','"Necrotizing periodontitis" covering both'], answer:0, ex:"Both old terms were merged into one Periodontitis category; individualized severity/behavior is now captured through staging and grading instead.", src:'lecture' },
{ id:'q1-10', lec:'diagnosis-tx-planning', type:'mcq', stem:"What bleeding-on-probing threshold is used before a case is called gingivitis, to account for inter-examiner probing variability?", choices:['≥10% of sites','Any bleeding at all','≥50% of sites','≥25% of sites'], answer:0, ex:"Two or three bleeding spots on a full-mouth chart are not, by themselves, enough to diagnose gingivitis.", src:'lecture' },
{ id:'q1-11', lec:'diagnosis-tx-planning', type:'recall', stem:"A patient on a calcium channel blocker has gingival overgrowth. Does the medication cause this by itself?", answer:"No. Drug-associated gingival overgrowth (calcium channel blockers, cyclosporine) only develops in the presence of existing plaque and poor oral hygiene — the medication alone does not cause it.", src:'lecture' },
{ id:'q1-12', lec:'diagnosis-tx-planning', type:'mcq', stem:"A treated periodontitis patient is stable on 3-month maintenance with no bleeding and shallow probing depths, though radiographs show old bone loss. What is the correct diagnosis today?", choices:['Health on a reduced periodontium (stable periodontitis patient)','Active Stage 3 periodontitis','Gingivitis on an intact periodontium','Necrotizing periodontitis'], answer:0, ex:"A stable, well-maintained patient is not re-staged — they are described as healthy on a reduced periodontium.", src:'lecture' },
{ id:'q1-13', lec:'diagnosis-tx-planning', type:'mcq', stem:"Which statement about reversibility is correct?", choices:['Gingivitis can return fully to health; periodontitis cannot fully return to its original attachment level','Both gingivitis and periodontitis are fully reversible','Neither condition is reversible','Periodontitis is reversible, gingivitis is not'], answer:0, ex:"There is a point of no return between the two: gingivitis resolves completely with plaque control, while periodontitis leaves permanent attachment loss even after successful treatment.", src:'lecture' },
{ id:'q1-14', lec:'diagnosis-tx-planning', type:'mcq', stem:"What distinguishes necrotizing periodontal disease from typical gingivitis or periodontitis?", choices:['It is very painful and brings patients in for urgent care','It never occurs in immunocompromised patients','It is completely painless','It only affects the maxilla'], answer:0, ex:"Ordinary periodontitis and gingivitis are not painful; necrotizing disease is, with decapitated papillae and a grayish pseudomembrane. Severely compromised patients include those with HIV/AIDS and CD4 <200.", src:'lecture' },
{ id:'q1-15', lec:'diagnosis-tx-planning', type:'mcq', stem:"A patient has a vertical bone defect measuring 4 mm. What does this make the case automatically, regardless of the CAL numbers?", choices:['At least Stage 3','Stage 1','Grade C','Necrotizing periodontitis'], answer:0, ex:"Vertical bone loss ≥3 mm is one of three automatic Stage 3/4 triggers, alongside Class II–III furcation involvement and tooth loss due to periodontitis.", src:'lecture' },
{ id:'q1-16', lec:'diagnosis-tx-planning', type:'mcq', stem:"What grade should a clinician assume by default, before looking for evidence to shift it up or down?", choices:['Grade B','Grade A','Grade C','There is no default'], answer:0, ex:"Clinicians should initially assume Grade B (moderate progression) and seek specific evidence to move to A or C.", src:'lecture' },
{ id:'q1-17', lec:'diagnosis-tx-planning', type:'mcq', stem:"A 30-year-old patient has 50% bone loss on their worst tooth. What does that bone-loss/age ratio suggest on its own?", choices:['Ratio > 1 → suggests Grade C','Ratio < 0.25 → suggests Grade A','Ratio = 1 exactly → always Grade B','Not enough information to say'], answer:0, ex:"50% ÷ 30 years ≈ 1.7, well above the 1.0 cutoff that points toward rapid progression, Grade C.", src:'lecture' },
{ id:'q1-18', lec:'diagnosis-tx-planning', type:'mcq', stem:"Case A (30-year-old, systemically healthy) has isolated bone loss into the middle third of the root at #30 with a 7 mm probing depth, and no smoking or diabetes. What is her diagnosis?", choices:['Localized Stage 3 Grade C Periodontitis','Generalized Stage 4 Grade B Periodontitis','Gingivitis on an intact periodontium','Localized Stage 1 Grade A Periodontitis'], answer:0, ex:"Middle-third bone loss and a 7 mm pocket put her in Stage 3; her bone-loss/age ratio exceeds 1, which is Grade C even without smoking or diabetes as modifiers.", src:'lecture' },
{ id:'q1-19', lec:'diagnosis-tx-planning', type:'mcq', stem:"Case B, a 41-year-old heavy smoker, has bone loss confined to #2 and #15, with a bone-loss/age ratio that is borderline Grade B on its own. What pushes his grade up to C?", choices:['Heavy smoking (>10 cigarettes/day)','Diabetes','Furcation involvement','Missing teeth'], answer:0, ex:"Heavy smoking is a grade modifier that automatically pushes the case to Grade C, regardless of the bone-loss/age calculation.", src:'lecture' },
{ id:'q1-20', lec:'diagnosis-tx-planning', type:'mcq', stem:"Case E has an HbA1c of 6.1%. Why does her periodontitis stay Grade B instead of moving to Grade C?", choices:['Her HbA1c is below the 7% threshold that would push a case to Grade C','Diabetes never affects periodontal grading','Grade C only applies to smokers','Her age protects her from Grade C'], answer:0, ex:"The diabetes grade modifier only applies at HbA1c ≥7%. At 6.1%, her control is good enough that diabetes is not acting as a modifier.", src:'lecture' },
{ id:'q1-21', lec:'diagnosis-tx-planning', type:'sequence', stem:"Put the 4-step approach to diagnosing periodontitis in order.", steps:['Initial screening of full-mouth radiographs, probing depths, and missing teeth','Fine-tune the stage using maximum CAL/RBL and case complexity','Determine the grade from progression evidence and modifiers','Build the treatment plan from the stage and grade'], ex:"Kornman & Papapanou's 4-step practical approach, 2018.", src:'lecture' },
{ id:'q1-22', lec:'diagnosis-tx-planning', type:'mcq', stem:"At flap reflection, bone remains on the buccal wall, the lingual wall, and against the neighboring tooth — only the involved root surface itself lacks bone. How many walls does this defect have, and what does that mean for regeneration?", choices:['3 walls — the best prognosis for regeneration','1 wall — the worst prognosis','2 walls — a crater','4 walls — an unusual finding'], answer:0, ex:"The more walls remaining around a defect, the better the case for regrowing bone, PDL, and cementum.", src:'lecture' },
{ id:'q1-23', lec:'diagnosis-tx-planning', type:'mcq', stem:"Bone is lost on both proximal root surfaces of a defect, leaving only the buccal and lingual walls. What is this specific 2-wall pattern called?", choices:['A crater','A trench','A furcation','A dehiscence'], answer:0, ex:"When both neighboring teeth have lost bone at the same site, the resulting 2-wall defect is called a crater.", src:'lecture' },
{ id:'q1-24', lec:'diagnosis-tx-planning', type:'recall', stem:"Why are the coronal/middle/apical thirds of the root measured from where bone should be in health, rather than from the CEJ itself?", answer:"In health, bone already sits about 1.5–2 mm apical to the CEJ. Starting the thirds at the CEJ would overestimate how much destruction has actually occurred.", src:'lecture' },
{ id:'q1-25', lec:'diagnosis-tx-planning', type:'mcq', stem:"A patient needs both a crown and periodontal therapy on the same tooth. What is the correct sequence?", choices:['Temporary crown → complete periodontal therapy → definitive crown','Definitive crown first, then periodontal therapy','Skip the crown until therapy is finished, no temporary needed','Temporary and definitive crowns can both be placed alongside SRP'], answer:0, ex:"Never place a permanent crown before periodontal therapy is complete — a temporary bridges the gap, and the same logic applies to a final RPD.", src:'lecture' },
{ id:'q1-26', lec:'diagnosis-tx-planning', type:'mcq', stem:"Where does caries control fit in the treatment sequence?", choices:['It is part of Phase I therapy, alongside SRP','It only happens after all surgical therapy is finished','It is unrelated to periodontal treatment planning','It always follows delivery of the final RPD'], answer:0, ex:"A cavitated surface is harder to instrument and harder for the patient to keep clean, so restoring it is bundled into Phase I rather than deferred.", src:'lecture' },
{ id:'q1-27', lec:'diagnosis-tx-planning', type:'mcq', stem:"At which appointment is the final decision about surgical (Phase II) therapy actually made?", choices:['The Phase I re-evaluation appointment','The initial comprehensive exam','A maintenance visit','The midterm exam'], answer:0, ex:"Re-evaluation shows how well the patient healed and complied — that is when the definitive surgical plan is set, not at the first visit.", src:'lecture' },
{ id:'q1-28', lec:'diagnosis-tx-planning', type:'recall', stem:"How does periodontal maintenance differ from a routine prophylaxis?", answer:"Maintenance is for patients who have had periodontal disease and treatment and need closer recall — often every 3 months — to catch recurrence early and reinforce risk-factor control. Prophylaxis is for patients without periodontitis risk, typically on a 6-month recall. They are not the same visit.", src:'lecture' },
{ id:'q1-29', lec:'diagnosis-tx-planning', type:'mcq', stem:"In the classic Becker et al. data cited in lecture, which group lost teeth at roughly double the rate of patients who kept their maintenance visits?", choices:['Patients who were treated but did not return for maintenance','Patients who refused all treatment','Patients on antibiotics','Patients with gingivitis only'], answer:0, ex:"Treated-without-maintenance patients lost about 0.22 teeth/year versus 0.11 teeth/year for treated-with-maintenance patients — roughly double.", src:'lecture' },
{ id:'q1-30', lec:'diagnosis-tx-planning', type:'mcq', stem:"Under which CDT code does periodontal charting/screening fall, as part of a new-patient exam?", choices:['D0150 — Comprehensive Oral Evaluation','D0120 — Periodic Oral Evaluation','D4341 — Periodontal Scaling and Root Planing','D0210 — Full Mouth Radiographs'], answer:0, ex:"D0150 is a thorough evaluation of extraoral/intraoral hard and soft tissue, including periodontal screening and/or charting.", src:'lecture' },

/* ===== Lecture 2 — Incisions, Flaps & Sutures ===== */
{ id:'q2-01', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which suture material is natural, monofilament, resorbs fastest (7–10 days), but handles very poorly?", choices:['Chromic gut','Poly-Glycolic Acid (PGA)','Silk','PTFE'], answer:0, ex:"Chromic gut: natural monofilament, 7–10 day resorption, low strength, mild reaction, very bad handling.", src:'lecture' },
{ id:'q2-02', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which suture material is synthetic and braided, resorbs slowest of the resorbable options (55–70 days), and is used for ridge and sinus augmentation?", choices:['Poly-Glycolic Acid (PGA)','Chromic gut','Poly-Propylene','PTFE'], answer:0, ex:"PGA: synthetic braided resorbable, 55–70 days, moderate strength, bad tissue reaction, great handling.", src:'lecture' },
{ id:'q2-03', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which non-resorbable suture is described as having no adherence to tissue, similar to nylon?", choices:['Poly-Propylene','Silk','PTFE','Poly-Glycolide (PGCL)'], answer:0, ex:"Poly-Propylene: synthetic monofilament, non-resorbable, high strength, great tissue reaction, bad handling.", src:'lecture' },
{ id:'q2-04', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which material causes the worst tissue reaction of all six sutures taught, despite handling very well?", choices:['Silk','Poly-Glycolide (PGCL)','PTFE','Chromic gut'], answer:0, ex:"Silk: natural braided non-resorbable, high strength, very bad tissue reaction, great handling — and must be removed at 7 days.", src:'lecture' },
{ id:'q2-05', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which non-resorbable suture must be physically removed, and at what interval?", choices:['Silk, at 7 days','PTFE, at 7 days','Poly-Propylene, at 10 days','Silk, at 14 days'], answer:0, ex:"Silk is non-resorbable and is specifically noted as removed at 7 days.", src:'lecture' },
{ id:'q2-06', lec:'incisions-flaps-sutures', type:'match', stem:"Match each suture material to its construction.", pairs:[['Chromic Gut','Natural monofilament'],['Poly-Glycolic Acid','Synthetic braided'],['Silk','Natural braided'],['PTFE','Synthetic monofilament']], src:'lecture' },
{ id:'q2-07', lec:'incisions-flaps-sutures', type:'mcq', stem:"What does a reverse cutting needle do differently from a standard cutting needle?", choices:['Its flat side faces the tissue on the upward pass, reducing tearing','It only cuts on the downward pass','It has no cutting edge at all','It is used only with non-resorbable sutures'], answer:0, src:'lecture' },
{ id:'q2-08', lec:'incisions-flaps-sutures', type:'mcq', stem:"A larger needle-curvature arc produces what kind of bite?", choices:['A deeper bite','A shallower bite','No difference in bite depth','It only changes suture length'], answer:0, src:'lecture' },
{ id:'q2-09', lec:'incisions-flaps-sutures', type:'mcq', stem:"In suture sizing, what does a larger number mean, and what does that require?", choices:['Smaller diameter, needing more knots for security','Larger diameter, needing fewer knots','Larger diameter, needing more knots','Smaller diameter, needing fewer knots'], answer:0, src:'lecture' },
{ id:'q2-10', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which technique is essential for larger bone-augmentation procedures and prevents flap-margin inversion, but can constrict blood supply and cause necrosis if overtightened?", choices:['Horizontal mattress','Vertical mattress','Continuous locking','Sling'], answer:0, src:'lecture' },
{ id:'q2-11', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which technique approximates papillae in the esthetic zone and can also close oro-antral communications?", choices:['Vertical mattress','Horizontal mattress','Criss-cross','Periosteal anchorage'], answer:0, src:'lecture' },
{ id:'q2-12', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which technique risks the entire suture line coming undone if a single throw fails, especially with monofilament or high-glide material?", choices:['Continuous / continuous locking','Single interrupted','Vertical mattress','Sling'], answer:0, ex:"Used for edentulous long-span areas, alveoloplasties, and apicoectomies — the bites sit close together for a good seal, but the whole line depends on every throw holding.", src:'lecture' },
{ id:'q2-13', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which flap design offers limited access and is difficult to advance because of lateral attachment, making it best for minor augmentation or simple implant placement?", choices:['Sulcular flap','Trapezoidal flap','Split-thickness flap','Papilla-sparing flap'], answer:0, src:'lecture' },
{ id:'q2-14', lec:'incisions-flaps-sutures', type:'mcq', stem:"A flap that leaves periosteum on the bone and reflects only the mucosa and submucosa is called what?", choices:['Split-thickness flap','Full-thickness flap','Sulcular flap','Pyramidal flap'], answer:0, src:'lecture' },
{ id:'q2-15', lec:'incisions-flaps-sutures', type:'mcq', stem:"Flap designs are classified along three axes. Which of these is NOT one of them?", choices:['Suture material used to close the flap','Bone exposure after flap reflection','Placement of the flap after surgery relative to the CEJ','Management of the papillae'], answer:0, src:'lecture' },
{ id:'q2-16', lec:'incisions-flaps-sutures', type:'recall', stem:"List the 5 surgical principles for incisions and flap design given in this lecture.", answer:"1) Firm, continuous incision stroke. 2) Incision at a distance from the lesion/bony defect. 3) Vertical incisions at the line angle of the tooth. 4) Periosteum reflected as an integral part of the flap. 5) The flap base as wide as its free edge.", src:'lecture' },
{ id:'q2-17', lec:'incisions-flaps-sutures', type:'mcq', stem:"Why must the base of a flap be at least as wide as its free edge?", choices:["To protect the flap's blood supply", 'To make suturing easier', 'To reduce total incision length', 'To avoid touching the periosteum'], answer:0, src:'lecture' },
{ id:'q2-18', lec:'incisions-flaps-sutures', type:'mcq', stem:"A surgeon performs the exact same sulcus-following incision around tooth #8, which is present, and along an edentulous ridge where tooth #9 used to be. What are these two incisions called?", choices:['Intrasulcular at #8, crestal at #9 — same technique, named by tooth presence','Crestal at #8, intrasulcular at #9','Both are called vertical incisions','Both are called pouch incisions'], answer:0, ex:"Intrasulcular and crestal are the same physical incision. The name changes based only on whether a tooth is present at that site, not on any difference in technique.", src:'lecture' },
{ id:'q2-19', lec:'incisions-flaps-sutures', type:'mcq', stem:"Why would a surgeon drop a vertical incision instead of just extending the intrasulcular incision to more teeth?", choices:["To gain more apical exposure without including teeth that don't need to be involved","Because vertical incisions heal faster than intrasulcular ones","Vertical incisions are required by law to be used before any bone graft","To avoid ever having to place a suture"], answer:0, src:'lecture' },
{ id:'q2-20', lec:'incisions-flaps-sutures', type:'mcq', stem:"A root-coverage case needs a soft-tissue graft placed without disturbing the papillae at all. Which flap design fits?", choices:['Envelope (pouch) flap','Trapezoidal flap','Full-thickness flap exposing bone','Sulcular flap extended to 4 teeth'], answer:0, ex:"The envelope/pouch flap elevates only the buccal tissue and never reflects the papillae — exactly what a root-coverage graft needs.", src:'lecture' },
{ id:'q2-21', lec:'incisions-flaps-sutures', type:'mcq', stem:"A major vertical ridge-augmentation graft needs the flap to advance coronally with zero tension over the graft. Which flap design is built for that?", choices:['Trapezoidal flap (two vertical incisions)','Sulcular flap (no vertical incisions)','Pyramidal flap (one vertical incision)','Envelope flap (no reflection of the papillae)'], answer:0, ex:"Two releasing incisions, one on each side of the defect, let the flap stretch coronally without tension — a single vertical often can't reach that far without tearing.", src:'lecture' },
{ id:'q2-22', lec:'incisions-flaps-sutures', type:'mcq', stem:"An implant needs onlay bone grafting around it, and the surgeon wants more access than a sulcular flap gives without opening both sides of the site. What's the fit?", choices:['Pyramidal flap — one vertical plus intrasulcular across three teeth','Trapezoidal flap — two verticals','Sulcular flap only','Envelope flap only'], answer:0, src:'lecture' },

var READINGS = {};

READINGS['diagnosis-tx-planning'] = `
<p>Every periodontal diagnosis starts with the same three numbers. Probing depth (PD) is measured from the gingival margin to the base of the pocket. Gingival recession (GR) is measured from the CEJ to the gingival margin. Clinical attachment level (CAL) — the number that actually matters for staging — is the sum of the two, effectively the distance from the CEJ to the base of the pocket. When the CEJ sits below the margin (no visible recession), GR is recorded as a negative number and CAL comes out smaller than PD; when recession is visible, GR is positive and CAL comes out larger than PD. A 7 mm pocket with the CEJ felt 4 mm subgingival is only 3 mm of attachment loss, while a shallow 2 mm pocket sitting on 4 mm of visible recession is 6 mm of attachment loss — more attachment loss on paper, but a far more maintainable tooth, because the patient can actually reach it with a brush.</p>
<p>Radiographs fill in what a probe cannot reach. Periapicals plus <b>vertical</b> bitewings are preferred over horizontal bitewings, because a horizontal film can miss bone loss on one of the two arches entirely. A panoramic gives a useful global view but is not detailed enough to diagnose periodontal disease on its own.</p>
<h5>Health, gingivitis, or periodontitis</h5>
<p>Health means no probing depth beyond 3 mm, no bleeding, and no attachment or bone loss. Plaque-induced gingivitis can still show probing depths of 4–5 mm and bleeding on probing, but critically <b>no</b> attachment loss and <b>no</b> bone loss — it is contained entirely within the gingiva and is fully reversible with plaque control. A 10% bleeding-on-probing threshold across the full mouth is used before calling a case gingivitis, since probing pressure varies enough between examiners that two or three isolated bleeding sites should not trigger the diagnosis on their own. Periodontitis is different: attachment loss <b>and</b> bone loss are both present, pockets often reach 6 mm or more, and — unlike gingivitis — the disease is not fully reversible. Treatment can stabilize a periodontitis patient, but the best achievable outcome is health on a <i>reduced</i> periodontium, not a full return to the original attachment level.</p>
<p>The periodontium itself can be intact or reduced, independent of disease activity. An intact periodontium can be healthy or have gingivitis. A reduced periodontium — from prior periodontitis, crown lengthening, or simple recession — can also be healthy or inflamed. A previously treated periodontitis patient who is stable on maintenance is diagnosed as healthy on a reduced periodontium, not re-staged, unless disease recurs; if pockets deepen and bleeding returns at a later maintenance visit, the diagnosis shifts back toward periodontitis depending on how widespread the change is.</p>
<h5>Recession is a sign, not a diagnosis</h5>
<p>Recession can occur in tissue that has never had periodontitis, so it is classified separately by how much interproximal attachment is also lost. RT1 has no interproximal loss at all and predicts full root coverage. RT2 has some interproximal loss, but buccal recession still exceeds it, predicting partial coverage. RT3 has interproximal loss that exceeds the buccal recession, and root coverage is not attempted because it will not succeed.</p>
<h5>Staging and grading</h5>
<p>Staging captures how severe the disease is and how complex it will be to manage, using interdental CAL as the gold standard (radiographic bone loss as a second choice). Stage 1 and 2 track rising CAL and bone loss in the coronal third of the root; Stage 3 and 4 both involve CAL ≥5 mm and bone loss into the middle third or beyond — the two are separated not by more attachment loss, but by tooth loss count (≤4 teeth lost pushes Stage 3, ≥5 pushes Stage 4) and by whether the case needs complex, multidisciplinary rehabilitation. Three findings force a case straight to Stage 3/4 regardless of the CAL math: vertical bone loss ≥3 mm, Class II–III furcation involvement, and any tooth loss attributable to periodontitis. A recurring pitfall: a deep probing depth by itself never proves periodontitis — without confirmed bone loss, a mouthful of 4s and 5s could just be generalized gingivitis.</p>
<p>Grading estimates how fast the disease is moving and how the patient is likely to respond. The default assumption is Grade B (moderate), shifted up or down only with evidence. Where serial records exist, direct evidence of progression over time is the gold standard; otherwise, percent bone loss on the worst tooth divided by the patient's age gives a ratio — under 0.25 suggests Grade A, 0.25–1.0 suggests Grade B, and over 1.0 suggests Grade C. Two modifiers can only push the grade <i>up</i>: heavy smoking (more than 10 cigarettes a day) and an HbA1c of 7% or higher both bump a case to Grade C outright, even if the bone-loss/age ratio alone would suggest B. A patient never earns a downgrade simply for not smoking or not having diabetes. Only one stage and one grade are assigned per patient — the stage comes from the single worst site in the mouth, and the grade from progression evidence plus modifiers.</p>
<h5>Reading a bone defect</h5>
<p>At flap reflection, a defect is described by how many bony walls remain around the affected root — picture standing inside the defect and counting the walls visible around you. A 3-wall defect (buccal, lingual, and the wall against the neighboring tooth, with only the involved root bare) has the best prognosis for regeneration. A 2-wall defect has lost one of those walls; when bone is gone from both neighboring proximal surfaces and only buccal and lingual walls remain, that specific pattern is called a crater. A 1-wall defect has the worst prognosis. Radiographs can be deceptive here — thick cortical bone, especially on the mandibular buccal/lingual, can mask a defect that only becomes obvious once the flap is raised.</p>
<h5>From diagnosis to treatment plan</h5>
<p>Every patient starts with Phase I (non-surgical) therapy, regardless of stage: oral hygiene instruction, scaling and root planing, smoking-cessation counseling, replacement of plaque-retentive restorative margins, and — easy to forget — caries control, restored before or alongside SRP rather than deferred, since a cavitated surface is harder to clean and instrument. Any permanent crown or final RPD waits until periodontal therapy is complete; a temporary crown bridges the gap. The Phase I re-evaluation appointment, not the initial exam, is where the definitive call on surgical (Phase II) therapy gets made, based on how much the tissue improved and how well the patient complied. Stage 1–2 cases often resolve with Phase I alone and move straight to maintenance; Stage 3–4 cases more often need Phase II — resective surgery to recontour bone into a physiologic, cleansable shape, or regenerative surgery to rebuild a favorable defect. Every plan ends in maintenance, and the evidence for it is stark: patients who refuse treatment lose roughly three times as many teeth as treated patients, and even treated patients who skip maintenance lose teeth at about twice the rate of those who keep their recall visits.</p>
`;

READINGS['incisions-flaps-sutures'] = `
<p>Every periodontal surgery sits somewhere on one spectrum: a simple extraction might need no incision and no flap at all; a soft-tissue graft over a recession needs a small flap with limited reflection; a sinus or ridge augmentation needs a large flap opened by multiple incisions. The choice of incision and flap design is genuinely clinician-dependent — Dr. Basma was upfront that two surgeons can disagree on the best approach to the same case — but a small, fixed set of designs covers nearly everything.</p>
<h5>Naming an incision: it's about the tooth, not the technique</h5>
<p>The most-missed distinction in this session is that <b>intrasulcular</b> and <b>crestal</b> describe the same physical incision, named differently only by whether a tooth is present. If a tooth is there, the blade is inserted in the sulcus to separate the gingival fibers from the tooth — all the way around, buccal, lingual, and through the papillae — and that's called intrasulcular. If the site is edentulous, there's no sulcus, so the identical straight incision along the crest of the ridge is instead called a crestal incision. More teeth included in the intrasulcular/crestal incision means more flap and better access, but including teeth you don't need to compromises esthetics for no benefit.</p>
<p>When intrasulcular or crestal alone doesn't give enough exposure — most major augmentations — a <b>vertical (releasing) incision</b> is dropped at the line angle of a tooth to open a bigger flap without having to include more teeth in the horizontal incision. One vertical incision plus intrasulcular across three teeth (say, distal of #7 with intrasulcular on 7-8-9) makes a triangular <b>pyramidal flap</b> — enough exposure for implant placement with an onlay graft. Two verticals, one on each side of the defect, make a <b>trapezoidal flap</b>, needed for major vertical augmentation because two releases let the flap coronally advance with passive, tension-free closure over a graft — something a single vertical often can't stretch to do without tearing.</p>
<p>There's one more incision family that skips reflection almost entirely: the <b>envelope (pouch) flap</b>. The papillae are never touched — only the buccal tissue is elevated, giving just enough release to coronally advance the flap over a soft-tissue graft (autogenous or allograft) while leaving the interdental architecture completely intact. This is the design of choice for pure root-coverage cases, where disturbing the papilla would work against the esthetic goal.</p>
<h5>Reading a flap design</h5>
<p>Beyond how it's opened, a flap is classified along three more axes: how much bone is exposed on reflection (full-thickness, taking the periosteum with it, versus split-thickness, leaving periosteum on the bone), where it's repositioned after surgery (coronal to the CEJ for soft-tissue augmentation, or apical for crown lengthening and osseous surgery), and whether the papilla is preserved intact or not. A <b>sulcular flap</b> — intrasulcular incision only, no vertical release — gives the most limited access of the group and is hard to advance because the tissue stays attached laterally; it's the first, smallest option, reached for on minor augmentation or a single implant. Extending it to include one more tooth on each side (still no vertical) buys moderate additional access without escalating to a releasing incision at all.</p>
<h5>Choosing a suture material</h5>
<p>At the broadest level, sutures split into <b>absorbable</b> (degrade in the body via hydrolysis or enzymatic cleavage — gut, chromic gut, and the synthetic Vicryl/Monocryl family) and <b>non-absorbable</b> (must be physically removed by the clinician, typically 10–14 days out, or left long-term — silk, ePTFE, polypropylene/Prolene, nylon). Plain gut resorbs fastest (7–10 days); chromic gut, treated with chromium salts, lasts a bit longer (10–14 days); synthetic absorbables like Vicryl hold tensile strength for 2–3 weeks and fully resorb over a longer stretch. Absorbables are the natural choice for quick pediatric cases or simple extractions where a suture-removal visit is a burden; non-absorbables like ePTFE are favored over major bone grafts specifically because they resist plaque attraction, hold high tensile strength, and won't break down prematurely on you.</p>
<p>The course's own material comparison chart sorts six specific materials along the same two axes — natural vs. synthetic, monofilament vs. braided — plus resorption time, strength, tissue reaction, and handling (full chart in Reference Tables). Chromic gut is natural, monofilament, and resorbs fastest (7–10 days) but handles very poorly; it's reached for at extraction sites, implants without additional grafting, or to stabilize a collagen membrane. The two synthetic resorbables split by construction: PGA is braided, resorbs slowest of the resorbables (55–70 days), handles beautifully, but irritates tissue — a fit for ridge and sinus augmentation where healing takes a while. PGCL is monofilament, resorbs faster (22–55 days), and is gentler on tissue, making it the choice for soft-tissue grafting and esthetic crown lengthening. Among the non-resorbables, poly-propylene behaves like nylon with no tissue adherence; silk handles beautifully but causes the worst tissue reaction of any material on the list and must be physically removed at 7 days; PTFE is the highest-cost option and is used across nearly every surgery type except pure soft-tissue grafts.</p>
<p>Needle geometry matters as much as the thread. A reverse cutting needle keeps its flat side toward the tissue on the upward pass, reducing tear-through compared to a standard cutting needle. Larger curvature (a bigger arc of the circle) takes a deeper bite; a larger needle diameter passes through more tissue but demands more hand rotation. In suture sizing, a larger number means a smaller diameter — and a smaller-diameter thread needs more knots to hold securely.</p>
<h5>Choosing a technique</h5>
<p>Single interrupted sutures (with the figure-8 variant) are the general-purpose default, each throw tied independently. Horizontal mattress sutures are essential for larger bone-augmentation procedures and prevent flap-margin inversion, but overtightening constricts blood supply to the incision edge and risks bone necrosis and dehiscence. Vertical mattress sutures maximize tissue approximation and eversion, and are the go-to for approximating papillae in the esthetic zone or closing an oro-antral communication. Continuous and continuous-locking sutures place bites close together for a strong seal, but the entire line can come undone if a single throw fails — a real risk with monofilament or other high-glide materials — and are typically reserved for edentulous long-span areas, alveoloplasties, and apicoectomies. Sling and periosteal-anchorage sutures round out the technique list for repositioning a flap around a single tooth or anchoring it apically or laterally.</p>
<h5>Five surgical principles</h5>
<p>Every incision and flap in this course answers to the same five rules: a firm, continuous stroke rather than several tentative passes; keeping the incision at a distance from the actual lesion or bony defect rather than cutting directly over it; placing vertical incisions at the line angle of the tooth; reflecting the periosteum as an integral part of the flap; and keeping the base of the flap at least as wide as its free edge, since a narrow base starves the flap of the only blood supply it has left once it's reflected.</p>
`;

READINGS['resective-furcation'] = `
<p>This session has not been lectured yet — the notes below come only from the class exam-review guide.</p>
<p>Furcation anatomy differs meaningfully by tooth. On maxillary molars, the mesial furcation entrance sits 3 mm from the CEJ, the buccal entrance 3.5 mm and is the narrowest of the three, and the distal entrance the furthest out at 5 mm; the first molar's root trunk is shorter than the second molar's, so its furcation is reached sooner. On mandibular molars, the buccal entrance is closer to the CEJ (just over 3 mm) and narrower (under 0.75 mm), while the lingual entrance sits both farther apical (over 4 mm) and wider (over 0.75 mm); the mesial root is wider bucco-lingually, giving an hourglass cross-section, and concavities are also possible on the distal root. Maxillary premolars are bifurcated about 40% of the time, with a shallow 0.5 mm concavity in the buccal root's furcation area, an entrance roughly 8 mm from the CEJ, and an entrance width around 0.7 mm.</p>
<p>Treatment escalates with furcation class: Class I responds to SRP and furcation plasty; Class II adds tunnel preparation, root resection, extraction, or — specifically on mandibular molars — GTR; Class III is managed with tunnel preparation, root resection, or extraction. Bone architecture around a tooth is described as positive (interdental bone coronal to the facial/lingual margins — the normal pattern), flat, or reverse/negative (interdental bone apical to the facial/lingual margins, producing an osseous crater) — reverse architecture is the pattern resective surgery is built to correct.</p>

READINGS['periodontal-regeneration'] = `

READINGS['implants-perio'] = `
<p>This session has not been lectured yet — the notes below come only from the class exam-review guide.</p>
<p>A successful implant is immobile, free of peri-implant radiolucency, free of pain, infection, paresthesia, or neuropathy, and loses less than 0.2 mm of vertical bone per year once it has been in function for a year. Three patient factors weigh on that outcome. Smoking works against implants on three fronts: microbiologically, by making A. actinomycetemcomitans, P. gingivalis, and B. forsythus harder to eradicate; immunologically, by impairing neutrophil chemotaxis and phagocytosis, lowering T-helper and B-cell counts, and raising IL-6, TNF-alpha, and collagenase activity; and physiologically, because nicotine impairs revascularization in both soft and hard tissue and directly raises implant-failure risk. Diabetes only becomes a problem when control is poor — implants carry no added risk with optimal glycemic control, but are contraindicated when control is poor. Genetics adds a multiplier: IL-1 gene polymorphisms are linked to a hyper-responsive inflammatory reaction to microbial challenge, and a positive IL-1 genotype combined with smoking produces a synergistic — not just additive — jump in peri-implantitis risk.</p>

READINGS['antibiotics-host-mod'] = `
<p>This session has not been lectured yet — the notes below come only from the class exam-review guide.</p>
<p>Antibiotics in periodontics are always adjunctive — to acute infection, aggressive or refractory periodontitis, or surgical/non-surgical therapy — never a stand-alone treatment. Amoxicillin and its resistance-resistant partner Augmentin cover gram +/− bacteria bactericidally; cephalosporins work similarly. Clindamycin binds the 50S ribosomal subunit and carries a well-known risk of pseudomembranous colitis. Tetracycline is bacteriostatic, binds the 30S subunit, and is specifically indicated when A. actinomycetemcomitans is the prominent pathogen — though its absorption is blocked by dairy and antacids, and it stains developing teeth. The macrolides (erythromycin, azithromycin, clarithromycin) bind 50S and are bacteriostatic; azithromycin is taken away from food, while clarithromycin is avoided in pregnancy. Metronidazole stands apart: bactericidal, active only against obligate anaerobes like spirochetes, and the specific drug for ANUG, often paired with amoxicillin. Ciprofloxacin inhibits bacterial DNA gyrase, is absorbed better with food (the opposite of azithromycin), and carries a phototoxicity risk.</p>
<p>Local drug delivery is reserved for sites that failed to respond to Phase I therapy or isolated sites in an otherwise stable maintenance patient: PerioChip (chlorhexidine in a gelatin matrix), Atridox (doxycycline in a biodegradable polymer, avoid brushing/flossing/eating at the site for 7 days), and Arestin (minocycline microspheres, avoid brushing for 12 hours and flossing for 10 days). Host modulation works through different mechanisms entirely — NSAIDs block PGE2-driven bone resorption but need daily dosing, bisphosphonates inhibit resorption at the cost of osteonecrosis risk, and Periostat is a sub-antimicrobial doxycycline dose that works by inhibiting collagenase rather than by killing bacteria.</p>
`;

READINGS['perio-plastic-esthetics'] = `
<p>This session has not been lectured yet — the notes below come only from the class exam-review guide.</p>
<p>Recession increases with age and shows up most often on the buccal of maxillary molars and mandibular incisors — graded with the same RT1/RT2/RT3 system introduced in the first lecture, since that classification is what decides whether root coverage is worth attempting. Soft-tissue grafting splits into autografts, harvested from the patient's own palate — a connective tissue graft (CTG, no epithelium, covered by a flap) or a free gingival graft (FGG, epithelium and connective tissue, left exposed) — and allografts, most commonly an acellular dermal matrix, which perform slightly less well than autografts but spare the patient a second surgical site. A deep palatal vault gives the most room for harvesting error, and clinicians sometimes deliberately harvest FGG-thickness tissue while using it as a CTG, since a thicker piece is easier to harvest and heals with the covered technique.</p>
<p>Gingival excess is matched to its cause: a pseudopocket needs only better hygiene and scaling; drug-induced enlargement needs gingivectomy, better hygiene, and a conversation about the causative medication; inconsistent margins or excessive gingival display call for gingivectomy or an apically positioned flap. Altered passive eruption is read on two axes — gingival dimension (Type 1: wide, MGJ apical to the crest; Type 2: normal, MGJ at the CEJ) and how close the osseous crest sits to the CEJ (Subcategory A: more than 1 mm away; Subcategory B: close). Only Type 1A responds to gingivectomy alone and only Type 2A to an apically positioned flap alone — both B subcategories need an apically positioned flap plus osseous surgery, because the bone itself is the limiting factor. On the esthetic side, an increased lower-facial-third proportion suggests vertical maxillary excess; upper lip length at rest runs about 20–22 mm in women and 22–24 mm in men, with roughly 6–8 mm of mobility on a full smile; the lateral incisor's gingival margin sits about 1 mm coronal to the central-incisor/canine line; and tooth width narrows from about 1.6 units at the central incisor to 1 unit at the lateral to 0.6 units for half the canine. Altered passive eruption is treated with crown lengthening and restorative work, vertical maxillary excess with orthodontics, orthognathic surgery, or perio surgery depending on severity, a hypermobile lip with Botox or lip-repositioning surgery — and a structurally short upper lip, honestly, has no reliably good fix.</p>
`;

var STATE_KEY = 'perio-d2-compendium-state-v1';

function defaultState(){
  return {
    answered:{},          // qid -> {correct:bool, seen:int, lastCorrect:bool}
    streak:0,
    bestStreak:0,
    totalCorrect:0,
    totalSeen:0,
    achievements:{},      // achId -> true
    theme:null,           // 'light' | 'dark' | null (system)
    lastActiveDate:null,
    activeDates:{},        // 'YYYY-MM-DD' -> true, for streak-day pill
    game:{ cutscenesSeen:{} }
  };
}
function loadState(){
  var d = defaultState();
  try{
    var raw = localStorage.getItem(STATE_KEY);
    if(raw){
      var saved = JSON.parse(raw);
      for(var k in d){ if(saved.hasOwnProperty(k)) d[k] = saved[k]; }
    }
  }catch(e){ /* ignore corrupt/blocked storage */ }
  if(!d.game) d.game = { cutscenesSeen:{} };
  if(!d.game.cutscenesSeen) d.game.cutscenesSeen = {};
  return d;
}
function saveState(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }catch(e){ /* storage unavailable */ }
}
var STATE = loadState();

function todayKey(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function touchActiveDay(){
  var k = todayKey();
  if(!STATE.activeDates[k]){ STATE.activeDates[k] = true; }
  STATE.lastActiveDate = k;
}
function currentStreakDays(){
  // count consecutive days ending today present in activeDates
  var n = 0, d = new Date();
  while(true){
    var k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(STATE.activeDates[k]){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

function lectureProgress(lecId){
  var qs = QUESTIONS_BY_LECTURE[lecId] || [];
  var correct = 0;
  qs.forEach(function(q){ var a = STATE.answered[q.id]; if(a && a.correct) correct++; });
  return { correct:correct, total:qs.length, pct: qs.length ? Math.round(100*correct/qs.length) : 0 };
}
function isLectureCleared(lecId){
  var p = lectureProgress(lecId);
  return p.total > 0 && p.correct === p.total;
}
function allLecturesCleared(){
  return LECTURES.every(function(l){ return isLectureCleared(l.id); });
}

function checkAchievements(){
  var newly = [];
  ACHIEVEMENTS.forEach(function(a){
    if(STATE.achievements[a.id]) return;
    var met = false;
    if(a.cond.type === 'totalCorrect') met = STATE.totalCorrect >= a.cond.value;
    else if(a.cond.type === 'streak') met = STATE.streak >= a.cond.value;
    else if(a.cond.type === 'topicPercent') met = lectureProgress(a.cond.lec).pct >= a.cond.value && lectureProgress(a.cond.lec).total>0;
    else if(a.cond.type === 'allCleared') met = allLecturesCleared();
    if(met){ STATE.achievements[a.id] = true; newly.push(a); }
  });
  if(newly.length){
    saveState();
    newly.forEach(function(a){ showToast('Achievement unlocked — ' + a.name); });
    renderHeaderMeta();
  }
  return newly;
}

/* ---------- CORE ANSWER RECORDER (every mode routes through this) ---------- */
function recordAnswer(qid, lecId, correct){
  touchActiveDay();
  var prev = STATE.answered[qid] || {correct:false, seen:0, lastCorrect:null};
  prev.seen += 1;
  prev.lastCorrect = correct;
  if(correct && !prev.correct){ STATE.totalCorrect += 1; }
  if(!correct && prev.correct){ /* keep historical correct credit; do not decrement */ }
  if(correct) prev.correct = true;
  STATE.answered[qid] = prev;
  STATE.totalSeen += 1;
  if(correct){ STATE.streak += 1; STATE.bestStreak = Math.max(STATE.bestStreak, STATE.streak); }
  else { STATE.streak = 0; }
  saveState();
  checkAchievements();
  renderHeaderMeta();
  document.dispatchEvent(new CustomEvent('perio:answered', { detail:{ qid:qid, lec:lecId, correct:correct } }));
}

/* ---------- SHUFFLE UTIL ---------- */
function shuffled(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ====================================================================
   SHARED QUESTION CARD RENDERER + DELEGATED HANDLER
   ==================================================================== */
var SEQ_STATE = {};   // qid -> [] of original indices picked in order
var MATCH_STATE = {}; // qid -> { selected:{side,idx}|null, matched:{} }

function qMeta(q){
  var lec = LECTURE_BY_ID[q.lec];
  var srcLabel = q.src === 'exam-review' ? 'Exam-review guide' : 'Lecture';
  return '<span class="qcard-meta">' +
    '<span class="tag-chip tag-'+lec.tag+'"><span class="tag-dot"></span>S'+lec.num+'</span>' +
    '<span class="tag-chip tag-slate">'+srcLabel+'</span>' +
    '</span>';
}

function qCardHTML(q){
  var body = '';
  if(q.type === 'mcq'){
    body += '<div class="qcard-choices" data-qtype="mcq">';
    q.choices.forEach(function(c, idx){
      body += '<button type="button" class="qcard-choice" data-qid="'+q.id+'" data-idx="'+idx+'">'+escHtml(c)+'</button>';
    });
    body += '</div>';
    body += '<div class="qcard-explain" data-role="explain" id="explain-'+q.id+'">'+(q.ex? escHtml(q.ex):'')+'</div>';
  } else if(q.type === 'recall'){
    body += '<div class="qcard-reveal-btn" data-role="reveal-wrap">' +
      '<button type="button" class="btn" data-action="reveal" data-qid="'+q.id+'">Show answer</button>' +
      '</div>' +
      '<div class="qcard-explain" data-role="explain" id="explain-'+q.id+'">'+escHtml(q.answer)+(q.ex?('<br><br>'+escHtml(q.ex)):'')+'</div>' +
      '<div class="qcard-grade-btns" data-role="grade-wrap" style="display:none">' +
      '<button type="button" class="good" data-action="grade" data-grade="good" data-qid="'+q.id+'">I had it right</button>' +
      '<button type="button" class="bad" data-action="grade" data-grade="bad" data-qid="'+q.id+'">I missed it</button>' +
      '</div>';
  } else if(q.type === 'sequence'){
    var order = shuffled(q.steps.map(function(s,i){ return i; }));
    body += '<div class="qcard-seq-steps" data-qtype="sequence" data-qid="'+q.id+'">';
    order.forEach(function(origIdx){
      body += '<button type="button" class="qcard-choice" data-step-idx="'+origIdx+'" data-qid="'+q.id+'">'+escHtml(q.steps[origIdx])+'</button>';
    });
    body += '</div>';
    body += '<div class="qcard-explain" data-role="explain" id="explain-'+q.id+'">'+(q.ex? escHtml(q.ex):'')+'</div>';
  } else if(q.type === 'match'){
    var leftOrder = shuffled(q.pairs.map(function(p,i){ return i; }));
    var rightOrder = shuffled(q.pairs.map(function(p,i){ return i; }));
    body += '<div class="qcard-match-cols" data-qtype="match" data-qid="'+q.id+'">';
    body += '<div class="qcard-match-col" data-side="left">';
    leftOrder.forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-side="left" data-pair-idx="'+i+'" data-qid="'+q.id+'">'+escHtml(q.pairs[i][0])+'</button>'; });
    body += '</div><div class="qcard-match-col" data-side="right">';
    rightOrder.forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-side="right" data-pair-idx="'+i+'" data-qid="'+q.id+'">'+escHtml(q.pairs[i][1])+'</button>'; });
    body += '</div></div>';
    body += '<div class="qcard-explain" data-role="explain" id="explain-'+q.id+'">'+(q.ex? escHtml(q.ex):'')+'</div>';
  }
  return '<div class="qcard" data-qid="'+q.id+'" data-qtype="'+q.type+'">' +
    '<div class="qcard-head"><div class="qcard-stem">'+escHtml(q.stem)+'</div></div>' +
    qMeta(q) + body +
    '</div>';
}

function markExplain(qid, show){
  var el = document.getElementById('explain-'+qid);
  if(el && show) el.classList.add('shown');
}

/* One delegated listener, attached per container that renders qCardHTML output. */
function wireQuestionContainer(container){
  if(!container || container.__wired) return;
  container.__wired = true;
  container.addEventListener('click', function(e){
    var mcqBtn = e.target.closest('.qcard-choices[data-qtype="mcq"] .qcard-choice');
    if(mcqBtn){
      var qid = mcqBtn.getAttribute('data-qid');
      var q = QUESTIONS_BY_ID[qid];
      var wrap = mcqBtn.closest('.qcard-choices');
      if(wrap.getAttribute('data-answered') === 'true') return;
      wrap.setAttribute('data-answered','true');
      var idx = parseInt(mcqBtn.getAttribute('data-idx'),10);
      var correct = idx === q.answer;
      wrap.querySelectorAll('.qcard-choice').forEach(function(b){
        b.disabled = true;
        var bIdx = parseInt(b.getAttribute('data-idx'),10);
        if(bIdx === q.answer) b.setAttribute('data-state','correct');
        else if(b === mcqBtn) b.setAttribute('data-state','incorrect');
      });
      markExplain(qid, true);
      recordAnswer(qid, q.lec, correct);
      return;
    }
    var seqBtn = e.target.closest('.qcard-seq-steps[data-qtype="sequence"] .qcard-choice');
    if(seqBtn){
      var sqid = seqBtn.getAttribute('data-qid');
      var sq = QUESTIONS_BY_ID[sqid];
      if(seqBtn.getAttribute('data-picked') === 'true') return;
      SEQ_STATE[sqid] = SEQ_STATE[sqid] || [];
      var origIdx = parseInt(seqBtn.getAttribute('data-step-idx'),10);
      SEQ_STATE[sqid].push(origIdx);
      var pos = SEQ_STATE[sqid].length;
      seqBtn.setAttribute('data-picked','true');
      seqBtn.disabled = true;
      seqBtn.textContent = pos + '. ' + sq.steps[origIdx];
      if(SEQ_STATE[sqid].length === sq.steps.length){
        var seqCorrect = SEQ_STATE[sqid].every(function(v,i){ return v === i; });
        var wrap2 = seqBtn.closest('.qcard-seq-steps');
        wrap2.querySelectorAll('.qcard-choice').forEach(function(b){
          var bi = parseInt(b.getAttribute('data-step-idx'),10);
          var order = SEQ_STATE[sqid].indexOf(bi);
          b.setAttribute('data-state', order === bi ? 'correct' : 'incorrect');
        });
        markExplain(sqid, true);
        recordAnswer(sqid, sq.lec, seqCorrect);
      }
      return;
    }
    var matchBtn = e.target.closest('.qcard-match-cols[data-qtype="match"] .qcard-match-item');
    if(matchBtn){
      var mqid = matchBtn.getAttribute('data-qid');
      var mq = QUESTIONS_BY_ID[mqid];
      if(matchBtn.getAttribute('data-state') === 'correct') return;
      var st = MATCH_STATE[mqid] = MATCH_STATE[mqid] || { selected:null, matched:{} };
      var side = matchBtn.getAttribute('data-side');
      var pairIdx = parseInt(matchBtn.getAttribute('data-pair-idx'),10);
      if(st.matched[pairIdx] && st.matched[pairIdx][side]) return;
      if(!st.selected){
        st.selected = { side:side, idx:pairIdx, el:matchBtn };
        matchBtn.setAttribute('data-selected','true');
        return;
      }
      if(st.selected.side === side){
        st.selected.el.removeAttribute('data-selected');
        st.selected = { side:side, idx:pairIdx, el:matchBtn };
        matchBtn.setAttribute('data-selected','true');
        return;
      }
      var otherEl = st.selected.el, otherIdx = st.selected.idx;
      var isMatch = otherIdx === pairIdx;
      if(isMatch){
        otherEl.setAttribute('data-state','correct'); otherEl.disabled = true; otherEl.removeAttribute('data-selected');
        matchBtn.setAttribute('data-state','correct'); matchBtn.disabled = true;
        st.matched[pairIdx] = { left:true, right:true };
        st.selected = null;
        var wrap3 = matchBtn.closest('.qcard-match-cols');
        var totalPairs = mq.pairs.length;
        var doneCount = Object.keys(st.matched).length;
        if(doneCount === totalPairs){
          markExplain(mqid, true);
          recordAnswer(mqid, mq.lec, true);
        }
      } else {
        otherEl.setAttribute('data-state','incorrect');
        matchBtn.setAttribute('data-state','incorrect');
        (function(a,b,selRef){
          setTimeout(function(){
            a.removeAttribute('data-state'); a.removeAttribute('data-selected');
            b.removeAttribute('data-state');
          }, 550);
        })(otherEl, matchBtn, st);
        st.selected = null;
      }
      return;
    }
    var actionBtn = e.target.closest('[data-action]');
    if(actionBtn){
      var action = actionBtn.getAttribute('data-action');
      var aqid = actionBtn.getAttribute('data-qid');
      var aq = QUESTIONS_BY_ID[aqid];
      var card = actionBtn.closest('.qcard');
      if(action === 'reveal'){
        markExplain(aqid, true);
        card.querySelector('[data-role="reveal-wrap"]').style.display = 'none';
        card.querySelector('[data-role="grade-wrap"]').style.display = 'block';
      } else if(action === 'grade'){
        var grade = actionBtn.getAttribute('data-grade');
        card.querySelectorAll('[data-action="grade"]').forEach(function(b){ b.disabled = true; });
        recordAnswer(aqid, aq.lec, grade === 'good');
      }
      return;
    }
  });
}

function renderAtlas(){

    html += '<button type="button" class="atlas-tile" data-open-atlas="'+v.id+'"><h4>'+escHtml(v.title)+'</h4><p>'+escHtml(v.blurb)+'</p>' +
      '<span class="tag-chip tag-'+l.tag+'" style="margin-top:8px;"><span class="tag-dot"></span>S'+l.num+'</span></button>';
  });
  html += '</div>';
  panel.innerHTML = html;

function renderAtlasDiagram(){
  var panel = document.getElementById('panel-atlas');
  var v = ATLAS_VIEWS.find(function(v){ return v.id === ATLAS_VIEW_ID; });
  var d = ATLAS_RENDERERS[v.id]();
  var hsMarkup = d.hotspots.map(function(h,i){ return hotspotCircle(i,h); }).join('');
  var html = '<div class="atlas-back"><button type="button" data-atlas-back="1">&larr; All diagrams</button></div>';
  html += '<div class="atlas-stage"><h3 style="margin-bottom:4px;">'+escHtml(v.title)+'</h3>';
  if(d.caption) html += '<p style="color:var(--ink-soft);font-size:.85rem;margin-bottom:14px;">'+escHtml(d.caption)+'</p>';
  html += '<div class="atlas-diagram-wrap"><svg class="atlas-svg atlas-svg-box" viewBox="0 0 '+d.w+' '+d.h+'" style="width:100%;height:auto;min-width:'+d.w+'px;">' + d.svg + hsMarkup + '</svg></div>';
  html += '<div class="atlas-label-panel" id="atlasLabelPanel">Click a numbered marker above for details.</div>';
  html += '</div>';
  panel.innerHTML = html;
  wireAtlasPanel(panel);
}
function wireAtlasPanel(panel){
  if(panel.__wired) return;
  panel.__wired = true;
  panel.addEventListener('click', function(e){
    var tile = e.target.closest('[data-open-atlas]');
    if(tile){ ATLAS_VIEW_ID = tile.getAttribute('data-open-atlas'); renderAtlasDiagram(); return; }
    var back = e.target.closest('[data-atlas-back]');
    if(back){ ATLAS_VIEW_ID = null; renderAtlas(); return; }
    var dot = e.target.closest('.hotspot-dot');
    if(dot){
      panel.querySelectorAll('.hotspot-dot').forEach(function(c){ c.removeAttribute('data-active'); });
      dot.setAttribute('data-active','true');
      var lbl = dot.getAttribute('data-label'), txt = dot.getAttribute('data-text');
      document.getElementById('atlasLabelPanel').innerHTML = '<b>'+lbl+'.</b> ' + txt;
      return;
    }
  });
}

function caveMouthPoints(x1, y1, x2, y2){
  // an irregular cave-mouth silhouette in place of a sharp rectangle — deterministic, no external randomness
  var w = x2-x1;
  var j = Math.min(14, w*0.035);
  var pts = [
    [x1+j, y1], [x1+w*0.42, y1-j*0.5], [x2-j*1.3, y1+j*0.4], [x2, y1+j*1.7],
    [x2-j*0.4, y2-j*1.3], [x2-w*0.36, y2+j*0.35], [x1+j*1.3, y2-j*0.25], [x1, y2-j*1.9]
  ];
  return pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
}
