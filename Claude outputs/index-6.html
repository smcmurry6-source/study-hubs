const EXAM_HINTS = [
{ group:'Work Authorizations & the Law', tag:'clinical', lec:'work-auth', items:[
  { hint:"The required information for work authorization form.", note:"(Think about your prescription-writing assignment)", a:`
    <p>This is about the <em>clinical content</em> a lab order needs, not the legal minimum &mdash; UAB's own work authorization form asks for more than the law strictly requires. A complete authorization spells out:</p>
    <ul>
      <li>A general description of the restoration to be made</li>
      <li>Material specification (e.g. "anatomic contour zirconia")</li>
      <li>Desired occlusal scheme</li>
      <li>Connector design, for a fixed partial denture</li>
      <li>Pontic design, including material specification for tissue contact</li>
      <li>Substructure design, for metal-ceramic restorations (e.g. "no more than 1.5mm of unsupported porcelain")</li>
      <li>Shade and esthetic information</li>
      <li>Proposed removable partial denture design, if the case involves one</li>
      <li>The date of the patient's next appointment and what stage of completion is needed by then</li>
    </ul>
    <p>This is exactly what the prescription-writing assignment (the "Ima Person" case) walks through: patient name and chart number, the lab's full name and address, the technician's name (often left blank), the appointment date, a description of the work with the tooth circled on the odontogram, shade information, a note about which articulator the lab should mount to, and the prescribing faculty's printed name and license number in place of a signature.</p>` },
  { hint:"Law part of the work authorization.", a:`
    <p>This is Alabama's Dental Practice Act, §34&#8209;9&#8209;21 &mdash; the first dental law in the country, dating to 1848. It requires every prescription to a commercial dental lab or private technician to include exactly six elements:</p>
    <ol style="padding-left:1.3em;margin:0 0 1em;">
      <li>The name and address of the lab or technician</li>
      <li>The patient's name or an identification number (if a number is used, the name must still appear on the dentist's retained duplicate)</li>
      <li>The date the prescription was written</li>
      <li>A description of the work to be done, with a diagram if necessary</li>
      <li>A specification of the type and quality of materials to be used</li>
      <li>The signature of the dentist and their license number</li>
    </ol>
    <p>The prescription is made in duplicate: the dentist keeps one copy, the lab keeps the other, and <strong>both</strong> must be retained on permanent file for <strong>two years</strong>, open to inspection by the state board at any reasonable time. Failing to keep those records is, by the statute's own language, prima facie evidence of a violation &mdash; and is punishable as a misdemeanor.</p>` },
]},

{ group:'PFM & Complete-Metal Restorations', tag:'porcelain', lec:'metal-ceramic', items:[
  { hint:"The situation when the subgingival finish line is indicated.", a:`
    <p>UAB's own student clinic defaults to a <strong>supragingival</strong> margin &mdash; it's easier to control, easier to get a clean impression or scan of, and the fundamentals are what a D2 is building. A subgingival margin needs an actual reason to justify going below the gumline:</p>
    <ul>
      <li>Existing caries, fracture, erosion, or abrasion that extends under the gum</li>
      <li>Obtaining <strong>ferrule</strong> on an endodontically treated tooth (extra retention/resistance form when there isn't enough sound coronal structure &mdash; minimum abutment height is roughly 4mm posterior, 3mm anterior)</li>
      <li>Following the margin of a previous restoration that was already subgingival</li>
      <li>Esthetics &mdash; hiding the margin, especially a metal margin on a PFM</li>
    </ul>
    <p>When it is indicated, the margin should stay within about <strong>0.5&ndash;1.0mm</strong> of the free gingival margin &mdash; deep enough to hide it, shallow enough to respect <strong>biologic width</strong> (roughly 2.04mm of junctional epithelium + connective tissue attachment that always sits above the alveolar crest). Violate that width and the body responds with chronic inflammation or, over time, bone remodeling to re-establish it.</p>` },
  { hint:"General steps of fabricating a PFM restoration.", a:`
    <p>Following the conventional lost-wax workflow: <strong>wax-up</strong> the coping to full tooth contour on the die, then <strong>cut back</strong> the wax (to roughly 1.2mm+ of clearance, checked with a putty matrix) to leave room for porcelain, <strong>invest and cast</strong> the metal framework, then try the casting back on the model to check fit and make any adjustments. Any grinding at this stage removes some of the oxide layer, so the coping goes back in the oven at a lower temperature to <strong>re-grow the oxide layer</strong> the porcelain will bond to.</p>
    <p>Porcelain is then built up in layers: an <strong>opaque</strong> layer first (masks the metal's dark color and gives a white base to build on), then <strong>body/dentin and enamel</strong> porcelain shaped to the final tooth contour (built deliberately larger than the target size, since porcelain shrinks 27&ndash;45% when fired). A <strong>bisque-bake try-in</strong> lets the dentist check contour and occlusion while the surface is still rough and easy to adjust, before a final <strong>glaze</strong> (or hand polish) finishes the restoration.</p>` },
  { hint:"Bonding mechanism between metal and porcelain; factors that can cause failure of bonding, and the failure patterns.", a:`
    <p>Three bonding mechanisms, ranked strongest to weakest: <strong>chemical bonding</strong> between the porcelain and the alloy's surface oxide layer is by far the most significant; <strong>mechanical retention</strong> from sandblasting-induced roughness on the coping is a distant second; <strong>van der Waals forces</strong> contribute almost nothing on their own. A bonus mechanism, <strong>compression bonding</strong>, comes from engineering the alloy's thermal expansion slightly higher than the porcelain's, so the alloy contracts a bit more on cooling and squeezes the porcelain into beneficial residual compression.</p>
    <p>Failures split into two families. <strong>Adhesive failure</strong> is a clean separation at an interface &mdash; caused by a coefficient-of-thermal-expansion mismatch, surface contamination (dust or oils on the metal before firing), or improper oxidation (either too little oxide to bond to, or too much, since a thick oxide layer is itself weak and fracture-prone). <strong>Cohesive failure</strong> is a true fracture <em>within</em> one material &mdash; for instance snapping inside an overgrown, weak oxide layer, or within the porcelain itself &mdash; rather than at a boundary between layers.</p>` },
  { hint:"Indication/ advantages/ disadvantages of complete metal & PFM restorations.", a:`
    <p><strong>Complete cast metal</strong> &mdash; advantages: the best-proven longevity of any fixed restoration, excellent wear characteristics (won't abrade the opposing dentition), extremely tight and predictable margins (down to a true feather-edge under 0.2mm), low hypersensitivity, and repairable by soldering if something needs correcting. Disadvantage: it's metal-colored, not tooth-colored &mdash; purely an esthetics limitation, which is why it's fallen to roughly 3&ndash;5% of crowns placed today. Indicated for a heavy bruxer in a non-esthetic zone.</p>
    <p><strong>PFM</strong> &mdash; advantages: 40+ years of proven durability, high strength (Type IV alloy handles long-span bridges well), and an excellent, accurate fit. Disadvantages: the metal margin can show through a thin gingival biotype, the opaquer needed to mask the metal limits translucency, the porcelain-to-metal bond can fail, and it needs more aggressive reduction than a monolithic ceramic. PFM's share of restorations fell from roughly 83% in 2005 to about 27% by 2020. Still indicated for long-span bridges (metal resists flex better than ceramic), thin resin-bonded Maryland bridges (a base-metal wing needs less reduction than zirconia), and when a patient specifically wants and can afford a metal restoration.</p>` },
  { hint:"Requirement of preparation/ thickness for PFM & complete metal crowns. Types of finish line, width...", a:`
    <p><strong>Complete cast crown:</strong> 1.5mm occlusal reduction on the functional cusp, 1.0mm on the non-functional cusp, 1.0mm axial reduction, roughly 6&deg; ideal total occlusal convergence (15&ndash;20&deg; realistically), 0.5mm minimum chamfer margin, Type III alloy (single crowns) or Type IV (long spans/thin sections).</p>
    <p><strong>PFM:</strong> wherever porcelain sits over metal, combined reduction needs to be at least <strong>1.5mm</strong> (0.3mm metal + 1.2mm porcelain) &mdash; checked chairside with a <strong>green</strong> clearance tab, versus the <strong>pink</strong> tab used for a 1mm all-zirconia reduction. A metal-only margin (typically the hidden lingual surface) can be as thin as <strong>0.7&ndash;1.0mm</strong>; a porcelain-veneered margin needs <strong>1.5&ndash;2.0mm</strong>.</p>
    <p><strong>Finish line types:</strong> a <strong>shoulder</strong> (a flat 90&deg; step against the unprepared tooth) is favored on the facial to support a porcelain-butt technique, since it gives porcelain the most room to run to the margin unsupported by metal; a <strong>chamfer</strong> suits metal-only portions and complete cast crowns; a <strong>120&deg; sloped shoulder</strong> trades a little porcelain strength to reduce unsupported enamel; a <strong>beveled shoulder</strong> is reserved for a metal-collar margin, not a ceramic one &mdash; it's largely obsolete because an open margin there is hard to detect with an explorer even though it's still open.</p>` },
  { hint:"Principles of adjusting the porcelain on a PFM crown.", a:`
    <p>Adjust under a continuous <strong>water/air spray</strong> to keep the restoration cool and avoid micro-fracturing the porcelain from frictional heat. Use only a <strong>fine-grit (red-striped) diamond bur</strong> &mdash; never a carbide/tungsten-carbide bur, which chips ceramic outright, and never a coarse (black or green) diamond, which leaves a rough surface that's slow to recover. A <strong>football-shaped bur</strong> is the right choice for occlusal and lingual surfaces; a <strong>tapered bur</strong> is the ideal choice for axial surfaces.</p>
    <p>If adjustment removes the surface glaze, the fix doesn't have to be another firing cycle: simply <strong>polishing</strong> the porcelain back to a shine (using a graduated polishing kit &mdash; coarse to fine) is an acceptable substitute for reglazing, especially for a single crown or minor touch-up. Glazing itself matters beyond looks &mdash; it fills the small voids and surface irregularities left after firing, and is cited as strengthening porcelain by reducing the flaws that can initiate a fracture; an unglazed surface retains more plaque and is more fracture-prone.</p>` },
  { hint:"Strengths of metal vs ceramic.", a:`
    <p>On a stress-strain curve, metal has a real yield point: it deforms plastically (bends, dents) before it ever breaks. Ceramic has essentially no ductility &mdash; it behaves elastically right up until a crack reaches critical length, then fails catastrophically all at once. The professor's own analogy: crunch down hard on a gold crown and the worst case is it deforms; crunch down on a ceramic crown and it can pop off in pieces &mdash; like a car crash where the metal body dents but the glass shatters.</p>
    <p>The underlying property is <strong>toughness</strong> &mdash; a material's ability to resist a crack propagating through it. Every material has microscopic flaws (invisible cracks); in metal, a crack tip gets <strong>blunted</strong> as it travels, so it can take an enormous number of cycles (sometimes a thousand-plus) before it finally shears off. In ceramic, the crack tip stays sharp and concentrates stress, so once a crack becomes critical it can shatter the whole piece. That difference is also why metal has dramatically better <strong>fatigue life</strong> under repeated chewing loads. Clinically: a heavy bruxer in a non-esthetic zone is often better served by a PFM or full-metal crown than by a monolithic ceramic like lithium disilicate.</p>` },
  { hint:"Porcelain: how do amorphous and crystalline phases affect its properties?", a:`
    <p>Fired porcelain has two coexisting microscopic phases. The <strong>amorphous (glassy) phase</strong> is what gives porcelain its lifelike, light-transmitting translucency &mdash; but it's mechanically weak on its own. The <strong>crystalline phase</strong> is made of tightly-ordered leucite crystals dispersed through that glassy matrix; those crystals deflect and arrest crack propagation (a mechanism called <strong>dispersion strengthening</strong>), directly increasing toughness. The crystalline phase also raises porcelain's coefficient of thermal expansion enough to make it compatible with a metal substructure during firing and cooling.</p>
    <p>In practice this is a built-in trade-off every porcelain formulation balances: more glassy phase buys more translucency and esthetics at the cost of strength; more crystalline (leucite) content buys strength and thermal compatibility at some cost to how translucent, and therefore lifelike, the final restoration looks.</p>` },
]},

{ group:'Alloy Classification & Properties', tag:'alloy', lec:'alloy-systems', items:[
  { hint:"Classification of alloys: the criteria of differentiating high noble/ noble/ base metal alloys. Indications for Type I-IV alloys.", a:`
    <p>ADA Specification No. 5 classifies alloys two independent ways. By <strong>noble metal content</strong>: <strong>High Noble</strong> requires &ge;60% total noble metal content <em>and</em>, specifically, &ge;40% gold; <strong>Noble</strong> requires &ge;25% of any noble metal(s) &mdash; gold, platinum, palladium, iridium, rhodium, osmium, or ruthenium &mdash; with no gold requirement at all; <strong>Predominantly Base</strong> is &lt;25% noble content; <strong>Titanium and titanium alloys</strong> get their own category (&ge;85% titanium). The classic exam trap: a composition that gives a gold percentage without a total-noble percentage is testing whether you know the &ge;40% gold threshold is what separates High Noble from plain Noble specifically.</p>
    <p>By <strong>mechanical type</strong> (ANSI/ADA Spec No. 5): <strong>Type I</strong>, low strength (&ge;80 MPa yield, &ge;18% elongation) &mdash; light-stress uses like inlays. <strong>Type II</strong>, medium strength (&ge;180 MPa, &ge;12%) &mdash; moderate-stress inlays and onlays. <strong>Type III</strong>, high strength (&ge;240 MPa, &ge;12%) &mdash; high-stress onlays, pontics, full crowns, short-span FPDs. <strong>Type IV</strong>, extra-high strength (&ge;300 MPa, &ge;10%) &mdash; thin cross-sections: bars, thin veneer crowns, long-span FPDs, RPD frameworks. A higher type can always be used where a lower type is indicated; the reverse is never true.</p>` },
  { hint:"Properties of noble metal vs base metal alloys.", a:`
    <p><strong>Noble alloys</strong>: passive and more biocompatible; lower strength, modulus, and hardness than base alloys; form lighter, more easily-masked oxide layers (better for porcelain esthetics); better castability thanks to higher density (fine detail, tight margins); easier to finish and polish; more expensive.</p>
    <p><strong>Base alloys</strong>: relatively more corrosive than noble alloys; higher strength, modulus, and hardness; form darker oxide layers that are harder to mask under porcelain; harder to cast (higher melting range, more reactive, lower density); harder to finish and polish; economical.</p>
    <p>Representative figures (Ni-Cr / Co-Cr base alloys vs. noble alloys): melting temperature 1400&ndash;1500&deg;C (base) vs. 800&ndash;1050&deg;C (noble); density 7&ndash;8 g/cm&sup3; (base) vs. 10.6&ndash;18.4 g/cm&sup3; (noble); elongation 1.5&ndash;2.4% (base) vs. 8&ndash;30% (noble); modulus of elasticity and hardness both run noticeably higher for base than noble. That higher modulus is exactly why a base alloy is the pick for a long-span (4+ unit) bridge that needs to resist flexing &mdash; at the cost of a darker oxide that's harder to hide, so base-metal frameworks are steered toward the posterior.</p>` },
]},

{ group:'Investments, Casting, Soldering & Welding', tag:'alloy', lec:'investments', items:[
  { hint:"Investment: how is the expansion of the investment materials being controlled? Which components in the investment materials will expand, and which will contract? Manipulative conditions of CaSO4 materials?", a:`
    <p>Inside a gypsum-bonded investment, the two main components pull in opposite directions as it heats: the <strong>refractory</strong> (quartz, cristobalite, tridymite, or fused quartz) <em>expands</em> through <strong>displacive transition</strong>, while the calcium-sulfate-hemihydrate <strong>binder</strong> actually <em>contracts</em> as temperature rises. Left uncompensated, the binder's contraction would dominate &mdash; a net contraction of up to roughly 2.8% is possible. Two mechanisms compensate for that and for the alloy's own casting shrinkage (1.25&ndash;2.5%): the refractory's thermal (displacive) expansion during burnout, and <strong>hygroscopic expansion</strong> &mdash; letting the invested ring set immersed in water instead of on the bench, which can add up to about <strong>2%</strong> more expansion (setting expansion is Curve A, hygroscopic expansion is Curve B on the classic expansion graph).</p>
    <p>The professor's own "Other Manipulative Conditions" table is worth memorizing exactly as given:</p>
    <div class="tbl-wrap"><table><thead><tr><th>Factor</th><th>Setting &amp; Hygroscopic Expansion</th><th>Thermal Expansion</th></tr></thead><tbody>
    <tr><td>W/P ratio</td><td colspan="2">Affects both &mdash; more water = weaker set <em>and</em> less expansion; follow the manufacturer's exact ratio (e.g. 40mL per 100g)</td></tr>
    <tr><td>Spatulation (mixing time)</td><td>More spatulation &rarr; more expansion</td><td><strong>No effect</strong></td></tr>
    <tr><td>Temperature</td><td>Warmer &rarr; more expansion</td><td><strong>No effect</strong></td></tr>
    </tbody></table></div>` },
  { hint:"Definition: displacive transition/ hygroscopic expansion/ brazing/ soldering/ welding/ fracture toughness/ fatigue/ dislocations/ solid solution alloys/ ...", a:`
    <dl style="margin:0;">
    <p><strong>Displacive transition</strong> &mdash; a non-chemical rearrangement of an existing crystal lattice at a specific transition temperature (e.g. &alpha;-quartz &rarr; &beta;-quartz), producing a sudden, non-linear jump in volume.</p>
    <p><strong>Hygroscopic expansion</strong> &mdash; extra mold expansion (up to ~2%) gained by letting investment set while immersed in water rather than open air.</p>
    <p><strong>Brazing</strong> &mdash; joining two metal parts with a third, dissimilar filler metal, above 450&deg;C.</p>
    <p><strong>Soldering</strong> &mdash; the identical process to brazing, below 450&deg;C; almost everything called "soldering" in dentistry is technically brazing by temperature, but the word stuck anyway.</p>
    <p><strong>Welding</strong> &mdash; fusing the parent metals directly, with or without a filler of the <em>same</em> alloy &mdash; no third, dissimilar metal. Used for titanium because its reactive oxide layer makes brazing unreliable.</p>
    <p><strong>Fracture toughness</strong> &mdash; a material's resistance to crack propagation; metals blunt a crack tip as it travels, ceramics don't and can shatter once a crack reaches critical length.</p>
    <p><strong>Fatigue</strong> &mdash; progressive damage and eventual failure from repeated cyclic loading, well below the material's ultimate strength in any single event.</p>
    <p><strong>Dislocations</strong> &mdash; line defects in a crystal lattice (missing or extra rows of atoms) that let crystal planes slip past each other under stress; alloying elements interfere with dislocation movement, which is exactly why alloying increases strength at some cost to ductility.</p>
    <p><strong>Solid solution alloys</strong> &mdash; two or more metals completely miscible in both solid and liquid states, forming one uniform phase (e.g. gold-copper); the most biocompatible but softest of the three cast alloy systems.</p>
    </dl>` },
  { hint:"Flux vs anti-flux; pre-ceramic vs post-ceramic soldering", a:`
    <p><strong>Flux</strong> dissolves the metal oxides coating every surface before a joint is soldered, so the join is clean, reactive, and ready to bond &mdash; borax-based flux for noble/high-noble alloys, potassium-fluoride-based flux for chromium-containing base-metal alloys, whose chromium oxide is tougher to dissolve. <strong>Anti-flux</strong> (a graphite pencil mark, rouge/iron oxide, or chalk) is painted around the joint <em>beforehand</em>, specifically to confine the flux &mdash; and the molten solder it draws &mdash; to only where the joint is actually needed, keeping it from flowing across the rest of the casting.</p>
    <p><strong>Pre-ceramic soldering</strong> happens before porcelain is added to the framework, so it can run hot (roughly 1000&ndash;1150&deg;C). <strong>Post-ceramic soldering</strong> happens after porcelain has already been fired on, so the solder has to stay safely below the porcelain's softening (pyroplastic-flow) temperature &mdash; around 982&deg;C for some systems &mdash; or it will slump the porcelain that's already there. For PFM frameworks specifically, silver and copper are avoided in the solder because both discolor porcelain green.</p>` },
  { hint:"Binder in the investment materials- their classifications, and their indications for different types of metal.", a:`
    <div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Binder</th><th>Ceiling</th><th>Used for</th></tr></thead><tbody>
    <tr><td>Gypsum-bonded</td><td>&alpha;-calcium sulfate hemihydrate</td><td>&lt;700&deg;C</td><td>Low-fusing gold alloys only</td></tr>
    <tr><td>Phosphate-bonded</td><td>NH&#8324;H&#8322;PO&#8324; + MgO (acid&ndash;base reaction), mixed with a colloidal-silica liquid</td><td>High-fusing</td><td>Metal-ceramic (PFM) alloys, some base metals, pressed ceramics</td></tr>
    <tr><td>Silica (ethyl silicate)-bonded</td><td>Silica gel &rarr; reverts to cristobalite on heating</td><td>High-fusing</td><td>RPD framework base-metal alloys (Co-Cr, ~1300&deg;C)</td></tr>
    </tbody></table></div>
    <p>Above 700&deg;C, gypsum's calcium sulfate binder decomposes into sulfur dioxide and sulfur trioxide gases, which embrittles the casting &mdash; exactly why PFM and RPD frameworks need a different binder chemistry entirely. RPD frameworks specifically use silica-bonded investment because there's no way to "pick up" a full-arch wax-up off a single die the way an individual crown pattern can be &mdash; the whole duplicated refractory cast has to be invested as one unit.</p>` },
]},

{ group:'FPDs: Pontics, Connectors & Abutments', tag:'clinical', lec:'fpd-pontic', items:[
  { hint:"Pontic design: advantages/ disadvantages/ indications/ design features of all different types of pontic.", a:`
    <div class="tbl-wrap"><table><thead><tr><th>Design</th><th>Tissue contact</th><th>Advantage / disadvantage</th><th>Typical use</th></tr></thead><tbody>
    <tr><td>Sanitary / hygienic</td><td>None &mdash; 2mm cleaning space beneath</td><td>Easiest to keep clean; looks like a bridge, not a tooth</td><td>Posterior, all-metal, non-esthetic zones; connector &ge;3mm</td></tr>
    <tr><td>Saddle / full ridge lap</td><td>Concave, wraps facial + lingual</td><td>Best esthetics of the "wrap" designs, but uncleanable</td><td>Avoid &mdash; chronic tissue inflammation risk</td></tr>
    <tr><td>Modified ridge lap</td><td>Facial overlap only</td><td>Best balance of esthetics and cleanability</td><td>Most-used design &mdash; anterior &amp; premolar esthetic zones</td></tr>
    <tr><td>Conical</td><td>Single point at ridge crest</td><td>Simple, cleanable; less esthetic</td><td>Mandibular posterior, minimal esthetic demand</td></tr>
    <tr><td>Ovate</td><td>Convex form seated in a conditioned tissue hollow</td><td>Best esthetics of all &mdash; but technique-sensitive, needs advance planning</td><td>High-esthetic zones; needs socket preservation/grafting timed to extraction</td></tr>
    </tbody></table></div>
    <p>Clinical summary from lecture: posterior cases lean conical, modified ridge lap, or ovate depending on the situation; anterior cases lean modified ridge lap or ovate (sanitary is never used where it would show).</p>` },
  { hint:"Connector: rigid vs non-rigid", a:`
    <p>Connectors default to <strong>rigid</strong> &mdash; a solid, non-flexing junction between pontic and retainer, which is what actually protects porcelain from chipping under the flex a longer span produces. <strong>Non-rigid</strong> connectors (a key-and-keyway attachment design) are, in the professor's own words, "going into history" &mdash; used only in narrow, specific clinical situations: an unusually long span where Ante's Law can't otherwise be satisfied and there's genuinely no other option, or a case involving a removable prosthesis where a rigid one-piece framework isn't workable. Outside those edge cases, rigid is always the default.</p>` },
  { hint:"The factors that control deflection of FPD; rule of 27.", a:`
    <p>Span length is the dominant driver of flex, and the relationship isn't linear: going from 1 pontic to 2 increases flex roughly <strong>8&times;</strong>; going from 1 pontic to 3 increases it roughly <strong>27&times;</strong>. Every flex cycle risks chipping or cracking the restoration, so connector cross-section is the main lever available to counteract it. For an all-metal or metal-ceramic framework, connector height needs to be at least <strong>3mm</strong> to resist flexing.</p>
    <p>For zirconia FPDs specifically, load-carrying capacity is proportional to height&sup2; &times; width &mdash; formalized as the <strong>Rule of 27</strong>: connector height, squared, times width, must be &ge; 27. A connector 2mm tall and 4mm wide scores only 16 (2&sup2; &times; 4) &mdash; insufficient; because height is squared and width isn't, adding height is the far more efficient fix. Minimum connector areas are also specified by location: &ge;7mm&sup2; anterior, &ge;9mm&sup2; posterior &mdash; but connector size always has to be balanced against leaving enough embrasure space for hygiene access and a natural-looking silhouette, not maximized blindly.</p>` },
  { hint:"Abutments' considerations: crown/ root ration, mesially tipped abutment, Ante's Law, path of insertion...", a:`
    <p>Every abutment gets evaluated on five fronts: remaining coronal tooth structure, periodontal support, pulp status (vital, or endodontically sound), <strong>crown:root ratio</strong>, and abutment inclination. Crown:root ratio compares the portion of the tooth above the alveolar crest to the portion still supported by bone &mdash; ideal is roughly <strong>1:2</strong>, with <strong>1:1</strong> as the minimum acceptable, always interpreted alongside periodontal health and the overall treatment plan.</p>
    <p>A <strong>mesially tipped abutment</strong> &mdash; a tooth that's drifted into a long-edentulous space &mdash; complicates the shared path of insertion a multi-unit FPD needs. Forcing a single path across a tilted tooth and an upright one can require over-preparing the tilted tooth, risking pulp exposure or excessive reduction; when the tipping is significant, orthodontic uprighting is the better fix rather than sacrificing tooth structure to force a path.</p>
    <p><strong>Ante's Law</strong> &mdash; traditional, not research-validated, but still widely followed &mdash; states the periodontal (root) surface area of the abutment teeth should equal or exceed that of the teeth being replaced by pontics; it's a fast sanity check on whether a span is biomechanically reasonable before committing to treatment.</p>
    <p><strong>Path of insertion</strong> is the single direction a fixed prosthesis must be able to seat along without interference or undercut; every abutment in a multi-unit case has to share that same path, which is checked clinically by sighting down the preparations with a mirror and confirming an even, continuous margin view from the chosen draw direction.</p>` },
]},

{ group:'Digital Scanning', tag:'digital', lec:'trios', items:[
  { hint:"Scanning: the scanning sequence, isolation/ retraction, “Tips to Obtaining a Good Scan”.", a:`
    <p><strong>Preparation:</strong> warm up the scanner cart/PC for about 10 minutes before use (a heater light going out signals it's reached temperature); place retraction cord(s) so the margin stands out clearly against the tissue; make sure the scanner tip itself is warm, to avoid condensation fogging the mirror.</p>
    <p><strong>Scanning:</strong> dry the teeth with compressed air, including between contacts, and isolate with a saliva ejector and/or cotton rolls. Get a good start by beginning at the prep (or the first molar, if scanning the opposing arch first) and waiting about 5 scanner "clicks" before moving, to build a solid starting alignment. Keep the scanner head <strong>0&ndash;5mm</strong> from the teeth &mdash; occasional light contact is fine &mdash; and move slowly and smoothly; a faster, steadier clicking sound is the cue that tracking is solid. Keep lips, cheeks, and tongue out of the scanner's view.</p>
    <p><strong>Sequence for a crown case:</strong> scan the opposing arch first, which buys time for the retraction cord to work, then the prep arch &mdash; starting at the occlusal (molar toward canine on a lower arch), then rolling to the lingual, then the buccal. Capture the margin either by pulling the cord and scanning the exposed margin immediately before the tissue collapses back (then <strong>locking</strong> that margin data so later passes don't overwrite it), or by leaving the cord in, scanning normally, then trimming and re-scanning just the margin area after the cord comes out.</p>
    <p><strong>Bite scan:</strong> start at the second molar (or canine for an anterior case) and capture only 3&ndash;4 teeth in the mesial direction &mdash; enough for the software to snap a solid alignment. Scan one arch's gingiva and teeth first, let it auto-align, then move to the opposing arch until it aligns too.</p>
    <p><strong>Good color capture:</strong> avoid the dental chair light shining directly into the mouth during a shade scan, and scan from several angles to average out shadows and discoloration.</p>
    <p>Running through all of this: the lecture's core message is that the scanner is not "the final key factor" &mdash; isolation, retraction, and actually knowing where the margin is still determine whether a scan is usable. A subgingival margin the naked eye can't see is one the scanner can't capture either.</p>` },
]},
];

/* One delegated handler, attached per container that renders qcards */
function attachQuestionHandlers(container){
  container.addEventListener('click', (e) => {
    const card = e.target.closest('.qcard');
    if(!card) return;
    const qid = card.dataset.qid, lec = card.dataset.lec, type = card.dataset.type;

    if(type === 'mcq'){
      const btn = e.target.closest('.qchoice');
      if(!btn || btn.disabled) return;
      const answer = +card.dataset.answer;
      const i = +btn.dataset.i;
      const correct = i === answer;
      card.querySelectorAll('.qchoice').forEach(b=>{
        b.disabled = true;
        if(+b.dataset.i === answer) b.classList.add('is-correct');
        else if(b === btn) b.classList.add('is-wrong');
      });
      card.querySelector('.qcard-explain').hidden = false;
      recordAnswer(qid, lec, correct);
    }

    else if(type === 'recall'){
      const reveal = e.target.closest('.recall-reveal');
      if(reveal){
        card.querySelector('.recall-body').hidden = true;
        card.querySelector('.recall-payload').hidden = false;
        return;
      }
      const gotIt = e.target.closest('.got-it');
      if(gotIt && !gotIt.disabled){
        const ok = gotIt.dataset.ok === '1';
        card.querySelectorAll('.got-it').forEach(b=>b.disabled=true);
        gotIt.style.outline = '2px solid var(--ink)';
        recordAnswer(qid, lec, ok);
      }
    }

    else if(type === 'sequence'){
      if(e.target.closest('.seq-reset')){
        card.querySelectorAll('.seq-item').forEach(li=>{ li.classList.remove('placed','correct','wrong'); li.removeAttribute('data-order'); });
        card.querySelectorAll('.seq-item .num').forEach(n=>n.remove());
        return;
      }
      const item = e.target.closest('.seq-item');
      if(!item || item.classList.contains('placed')) return;
      const placedCount = card.querySelectorAll('.seq-item.placed').length;
      const num = document.createElement('span');
      num.className = 'num'; num.textContent = placedCount+1;
      item.prepend(num);
      item.classList.add('placed');
      item.dataset.order = placedCount;
      const len = +card.dataset.len;
      if(placedCount+1 === len){
        const placed = [...card.querySelectorAll('.seq-item.placed')];
        let allCorrect = true;
        placed.forEach((li,idx)=>{
          const isRight = (+li.dataset.correctI === idx);
          li.classList.add(isRight ? 'correct' : 'wrong');
          if(!isRight) allCorrect = false;
        });
        card.querySelector('.qcard-explain').hidden = false;
        recordAnswer(qid, lec, allCorrect);
      }
    }

    else if(type === 'match'){
      const item = e.target.closest('.match-item');
      if(!item || item.classList.contains('matched')) return;
      const side = item.dataset.side;
      const already = card.querySelector('.match-item.sel[data-side="'+side+'"]');
      if(already) already.classList.remove('sel');
      if(already === item) return;
      item.classList.add('sel');
      const otherSide = side === 'l' ? 'r' : 'l';
      const otherSel = card.querySelector('.match-item.sel[data-side="'+otherSide+'"]');
      if(otherSel){
        if(otherSel.dataset.pairI === item.dataset.pairI){
          item.classList.remove('sel'); otherSel.classList.remove('sel');
          item.classList.add('matched'); otherSel.classList.add('matched');
          const done = (+card.dataset.matched) + 1;
          card.dataset.matched = done;
          const total = +card.dataset.pairs;
          if(done === total){
            card.querySelector('.qcard-explain').hidden = false;
            recordAnswer(qid, lec, true);
          }
        } else {
          item.classList.add('shake'); otherSel.classList.add('shake');
          setTimeout(()=>{
            item.classList.remove('sel','shake'); otherSel.classList.remove('sel','shake');
          }, 480);
        }
      }
    }
  });
}

const WINGS = [
  { id:'foundry', name:'The Foundry',      tag:'alloy',     boss:'Final Pour Review',
    flavor:'Wax becomes metal here — sprue formers, investment rings, the crucible. Precision from pour to bench.',
    wards:['cast-crowns','investments','solder-weld','alloy-systems'] },
  { id:'kiln',    name:'The Kiln Room',     tag:'porcelain', boss:'Firing Log Check',
    flavor:'Porcelain builds, bakes and cools under biology’s rules — shade, contour and margin all get inspected here.',
    wards:['pfm-bio','metal-ceramic'] },
  { id:'desk',    name:'The Records Desk',  tag:'clinical',  boss:'Case File Audit',
    flavor:'Every case starts with a signed work authorization and a defensible pontic design.',
    wards:['work-auth','fpd-pontic'] },
  { id:'scanbay', name:'The Scan Bay',      tag:'digital',   boss:'Calibration Pass',
    flavor:'One careful optical impression at a time.',
    wards:['trios'] },
];
const WINGS_BY_ID = {};
WINGS.forEach(w => WINGS_BY_ID[w.id] = w);

/* Defensive catch-all: a lecture id not claimed by any wing above still
   gets a home, so a future lecture never silently disappears from the map. */
(function ensureAllLecturesMapped(){
  const claimed = new Set(WINGS.flatMap(w => w.wards));
  const orphans = LECTURES.filter(l => !claimed.has(l.id)).map(l => l.id);
  if(orphans.length){
    const extra = { id:'annex', name:'The Annex', tag:'clinical', boss:'Annex Review',
      flavor:'Recently added material, not yet assigned to a bench.', wards:orphans };
    WINGS.push(extra);
    WINGS_BY_ID[extra.id] = extra;
  }
})();

const ZONE_GLOW = { alloy:'rgba(227,177,92,.16)', porcelain:'rgba(228,141,104,.16)', clinical:'rgba(111,187,172,.16)', digital:'rgba(134,183,222,.16)' };
const RANKS = ['Apprentice','Bench Technician','Lab Technician II','Senior Technician','Master Technician'];

function bossQuestionIds(wing){
  if(wing.wards.length === 1) return (QUESTIONS_BY_LECTURE[wing.wards[0]] || []).map(q=>q.id);
  return wing.wards.flatMap(id => (QUESTIONS_BY_LECTURE[id] || []).slice(0,3).map(q=>q.id));

  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  return QUESTIONS.filter(q => STATE.seen[q.id] && !STATE.correctEver[q.id]);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
let inspectionSet = null;
function newInspection(){
  inspectionSet = shuffle(QUESTIONS).slice(0, INSPECTION_SIZE).map(q=>q.id);
}
function checkInspectionAchievement(){
  const a = ACHIEVEMENTS.find(x=>x.id==='ready-for-sunrise');
  if(!a || !inspectionSet || STATE.achievements[a.id]) return;
  const correct = inspectionSet.filter(id=>STATE.correctEver[id]).length;
  if(inspectionSet.length && correct/inspectionSet.length >= 0.9){
    STATE.achievements[a.id] = Date.now();
    saveState();
    showAchievementToast(a);
  }
}

      </div>
      ${qs.length
        ? `<div class="game-quiz-wrap">${qs.map(qCardHTML).join('')}</div>`
        : `<p class="empty-note">Nothing in the queue right now — miss a question anywhere in the lab and it lands here for a rework.</p>`}
    </div>`;
  }
  if(scene.type === 'inspection'){
    if(!inspectionSet) newInspection();
    const qs = inspectionSet.map(id=>QUESTIONS_BY_ID[id]).filter(Boolean);
    const correct = qs.filter(q=>STATE.correctEver[q.id]).length;
    const attempted = qs.filter(q=>STATE.seen[q.id]).length;
    return `<div class="scene">
      <div class="scene-head">
        <div>
          <h3 class="scene-title">Sunrise Inspection</h3>
          <p class="scene-flavor">A ${qs.length}-question sweep pulled at random from the whole bank — a full mock run.</p>
        </div>
        <div class="scene-progress" id="sceneProgress">${correct}/${qs.length} correct</div>
      </div>
      <button type="button" class="btn ghost small" data-action="reroll-inspection" style="margin-bottom:16px;">New Inspection</button>
      ${attempted === qs.length && qs.length ? inspectionResultHTML(qs) : ''}
      <div class="game-quiz-wrap">${qs.map(qCardHTML).join('')}</div>
    </div>`;
  }
  return '';
}
function renderGame(){
  const panel = document.getElementById('panel-game');
  panel.innerHTML = `
    <div class="game-intro">
      <div class="game-eyebrow">After Hours &middot; Union Dental Laboratory</div>
      <h2>The building's empty. The kilns are still warm.</h2>
      <p>Every bench is open from the start — nothing here is locked behind anything else. Work whatever you're weakest on, then see how you hold up under the Sunrise Inspection.</p>
    </div>
    ${gameHudHTML()}
    ${toolRowHTML()}
    ${labSceneHTML()}
    <div id="gameSceneWrap"></div>
    <div class="night-panel" style="margin-top:26px;">
      <h3>Commendations</h3>
      <div class="ach-grid" id="gameAchGrid">${ACHIEVEMENTS.map(achItemHTML).join('')}</div>
    </div>
  `;

  const last = STATE.game.lastZone;
  if(last === 'rework'){ gameScene = {type:'rework'}; }
  else if(last === 'inspection'){ gameScene = {type:'inspection'}; newInspection(); }
  else if(last){
    const [type, id] = last.split(':');
    if(type === 'zone' && WINGS_BY_ID[id]) gameScene = {type:'zone', wingId:id};
    else if(type === 'lecture' && LECTURE_BY_ID[id]) gameScene = {type:'lecture', id};
    else if(type === 'boss' && WINGS_BY_ID[id]) gameScene = {type:'boss', wingId:id};
  }
  document.getElementById('gameSceneWrap').innerHTML = sceneHTML(gameScene);
  if(gameScene && gameScene.type === 'inspection') checkInspectionAchievement();

  attachQuestionHandlers(panel);
  panel.addEventListener('click', (e)=>{
    const reroll = e.target.closest('[data-action="reroll-inspection"]');
    if(reroll){
      newInspection();
      const wrap = document.getElementById('gameSceneWrap');
      wrap.innerHTML = sceneHTML(gameScene);
      return;
    }
    const btn = e.target.closest('[data-scene]');
    if(!btn) return;
    const key = btn.dataset.scene;
    if(key === 'rework'){ gameScene = {type:'rework'}; }
    else if(key === 'inspection'){ gameScene = {type:'inspection'}; if(!inspectionSet) newInspection(); }
    else{
      const [type, id] = key.split(':');
      if(type === 'zone') gameScene = {type:'zone', wingId:id};
      else if(type === 'lecture') gameScene = {type:'lecture', id};
      else if(type === 'boss') gameScene = {type:'boss', wingId:id};
    }
    STATE.game.lastZone = key;
    saveState();
    const wrap = document.getElementById('gameSceneWrap');
    wrap.innerHTML = sceneHTML(gameScene);
    if(gameScene.type === 'inspection') checkInspectionAchievement();
    wrap.scrollIntoView({behavior: prefersReducedMotion() ? 'auto' : 'smooth', block:'nearest'});
  });
}

/* --------------------------------------------------------------------
   SHARED PROGRESS REFRESH — one listener, fired by recordAnswer's
   'lostwax:answered' event, keeps Compendium and Game chrome in sync
   without ever rebuilding a live question card mid-interaction.
   -------------------------------------------------------------------- */
function refreshSharedProgressUI(){
  const strip = document.getElementById('compStatStrip');
  if(strip){
    const s = overallStats();
    strip.innerHTML = `
      <div class="stat-box"><div class="n tabular">${s.correct}/${s.total}</div><div class="l">Questions cleared</div></div>
      <div class="stat-box"><div class="n tabular">${s.pct}%</div><div class="l">Overall mastery</div></div>
      <div class="stat-box"><div class="n tabular">${STATE.bestStreak}</div><div class="l">Best streak</div></div>
      <div class="stat-box"><div class="n tabular">${Object.keys(STATE.achievements).length}/${ACHIEVEMENTS.length}</div><div class="l">Achievements</div></div>
    `;
  }
  document.querySelectorAll('.comp-nav a[data-lec]').forEach(a=>{
    const st = lecStats(a.dataset.lec);
    const sib = a.nextElementSibling;
    if(sib && sib.classList.contains('comp-nav-progress')) sib.textContent = st.correct+'/'+st.total+' cleared';
  });

  const panel = document.getElementById('panel-game');
  if(!panel || panel.hidden || !panel.innerHTML) return;
  const hud = panel.querySelector('.game-hud');
  if(hud) hud.outerHTML = gameHudHTML();
  const reworkCount = document.getElementById('reworkCount');
  if(reworkCount) reworkCount.textContent = missedQuestions().length;
  panel.querySelectorAll('.lab-hotspot[data-hotspot^="zone:"]').forEach(hs=>{
    const wing = WINGS_BY_ID[hs.dataset.hotspot.split(':')[1]];
    if(wing) hs.classList.toggle('is-clear', zoneFullyClear(wing));
  });
  const reworkTool = panel.querySelector('.tool-card[data-hotspot="rework"]');
  if(reworkTool) reworkTool.classList.toggle('is-clear', missedQuestions().length===0);
  panel.querySelectorAll('.topic-card[data-lec]').forEach(tc=>{
    const lec = LECTURE_BY_ID[tc.dataset.lec];
    if(!lec) return;
    const st = lecStats(lec.id);
    tc.classList.toggle('is-clear', st.total>0 && st.correct===st.total);
    const pctEl = tc.querySelector('.tc-pct'); if(pctEl) pctEl.textContent = st.total ? st.correct+'/'+st.total : '—';
  });
  panel.querySelectorAll('.topic-card[data-boss]').forEach(tc=>{
    const wing = WINGS_BY_ID[tc.dataset.boss];
    if(!wing) return;
    const ids = bossQuestionIds(wing);
    const correct = ids.filter(id=>STATE.correctEver[id]).length;
    tc.classList.toggle('is-clear', ids.length>0 && correct===ids.length);
    const pctEl = tc.querySelector('.tc-pct'); if(pctEl) pctEl.textContent = ids.length ? correct+'/'+ids.length : '—';
  });
  const ach = document.getElementById('gameAchGrid');
  if(ach) ach.innerHTML = ACHIEVEMENTS.map(achItemHTML).join('');
  const prog = document.getElementById('sceneProgress');
  if(prog && gameScene){
    const banner = document.getElementById('sceneClearBanner');
    if(gameScene.type === 'zone'){
      const wing = WINGS_BY_ID[gameScene.wingId];
      if(wing){
        const ids = [...new Set(wing.wards.flatMap(id=>(QUESTIONS_BY_LECTURE[id]||[]).map(q=>q.id)).concat(bossQuestionIds(wing)))];
        const correct = ids.filter(id=>STATE.correctEver[id]).length;
        prog.textContent = correct+'/'+ids.length+' cleared';
      }
    } else if(gameScene.type === 'lecture'){
      const st = lecStats(gameScene.id);
      prog.textContent = st.correct+'/'+st.total+' cleared · '+st.pct+'%';
      if(banner) banner.hidden = !(st.total>0 && st.correct===st.total);
    } else if(gameScene.type === 'boss'){
      const wing = WINGS_BY_ID[gameScene.wingId];
      const ids = bossQuestionIds(wing);
      const correct = ids.filter(id=>STATE.correctEver[id]).length;
      prog.textContent = correct+'/'+ids.length+' cleared';
      if(banner) banner.hidden = !(ids.length>0 && correct===ids.length);
    } else if(gameScene.type === 'rework'){
      prog.textContent = missedQuestions().length+' to rework';
    } else if(gameScene.type === 'inspection' && inspectionSet){
      const qs = inspectionSet.map(id=>QUESTIONS_BY_ID[id]).filter(Boolean);
      const correct = qs.filter(q=>STATE.correctEver[q.id]).length;
      prog.textContent = correct+'/'+qs.length+' correct';
      const attempted = qs.filter(q=>STATE.seen[q.id]).length;
      if(attempted === qs.length && qs.length && !document.querySelector('#gameSceneWrap .inspect-result')){
        const rerollBtn = document.querySelector('#gameSceneWrap [data-action="reroll-inspection"]');
        if(rerollBtn) rerollBtn.insertAdjacentHTML('afterend', inspectionResultHTML(qs));
      }
      checkInspectionAchievement();
    }
  }
}
document.addEventListener('lostwax:answered', refreshSharedProgressUI);

/* ======================================================================
   MODE ROUTER + BOOTSTRAP
   ====================================================================== */
let gameInitialized = false;
function switchMode(mode){
  document.querySelectorAll('#modeSwitch button[data-mode]').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.mode===mode ? 'true' : 'false');
  });
  document.getElementById('panel-compendium').hidden = mode !== 'compendium';
  document.getElementById('panel-game').hidden = mode !== 'game';
  if(mode === 'game' && !gameInitialized){ renderGame(); gameInitialized = true; }
}
document.getElementById('modeSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  switchMode(btn.dataset.mode);
});

renderCompendium();

/* Published for the shared widget (search + toughest-questions labels) —
   see widget/v3.js. QUESTIONS/LECTURES are static array literals populated
   above, not built asynchronously, so this is safe to publish once here. */
window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id: l.id, title: l.title }; }),
  questions: QUESTIONS.map(function(q){
    var hint = q.type === 'mcq' && q.choices && typeof q.answer === 'number' ? q.choices[q.answer] : (q.answerText || '');
    if (q.ex) hint = hint ? (hint + ' — ' + q.ex) : q.ex;
    return { id: q.id, lec: q.lec, text: q.q || '', hint: hint };
  })
};
