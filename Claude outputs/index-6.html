const LECTURE_NOTES = {

'work-auth': `
<h4>Why this lecture is really about liability</h4>
<p>A work authorization (what everyone calls a "lab script" or "prescription") is a legal document, not paperwork. Alabama's Dental Practice Act — the first in the country, dating to 1848 — makes it a misdemeanor for a dentist or lab to skip it or fail to keep records. Every state has some version of this law, and it exists because dental laboratories are treated as health-entity providers: a dentist can share protected patient information with a lab without a separate HIPAA business-associates agreement specifically because the work authorization is the recognized, regulated channel for that communication.</p>

<h4>The six required elements (Alabama §34-9-21)</h4>
<ul>
<li><strong>Name and address</strong> of the commercial lab or private technician.</li>
<li><strong>Patient's name or ID number</strong> (if a number is used, the name must still be on the dentist's retained duplicate).</li>
<li><strong>Date</strong> the prescription was written.</li>
<li><strong>Description of the work</strong>, with a diagram if necessary — pictures carry real weight in crown-and-bridge shade/contour instructions.</li>
<li><strong>Specification of the type and quality of materials</strong> — this is the field that protects a dentist if a lab substitutes a cheaper alloy without telling them.</li>
<li><strong>Signature and license number</strong> of the dentist.</li>
</ul>
<p>Both the dentist's duplicate and the lab's original must be kept on permanent file for <strong>two years</strong> and are open to inspection by the state board at any reasonable time.</p>

<h4>Mutual responsibility — it runs both directions</h4>
<div class="tbl-wrap"><table><thead><tr><th>Dentist</th><th>Lab technician</th></tr></thead><tbody>
<tr><td>Provide clear written instructions, retain a duplicate</td><td>Follow written instructions, retain the original</td></tr>
<tr><td>Provide an accurate impression/cast/bite registration</td><td>Return the case if the mounting or bite is questionable</td></tr>
<tr><td>Identify margins, palatal seal, denture borders, RPD design</td><td>Match the requested shade</td></tr>
<tr><td>Furnish shade, photo, drawing information</td><td>If a case can't proceed within 2 working days, communicate before continuing</td></tr>
<tr><td>Give written/verbal approval before proceeding or changing anything</td><td>Tell the dentist if a material needs to change</td></tr>
<tr><td>Follow infection-control protocols, disinfect and pack properly</td><td>Disclose if the case is being subcontracted elsewhere</td></tr>
<tr><td>If the prosthesis doesn't fit, return everything to the lab</td><td>Never bill the patient directly except where law allows</td></tr>
</tbody></table></div>

<h4>Where it actually breaks down</h4>
<p>Lecture cites lab QA data bluntly: roughly <strong>60% of items labs receive are contaminated</strong>, and the two most common technical complaints are (1) deficient impressions — margins that aren't clearly captured, distortion, or missing structures like the opposing arch — and (2) inadequate interocclusal (bite) records. Both are entirely within the dentist's control chairside.</p>
<p>Subcontracting became a flashpoint once digital workflows spread: some labs quietly sent work to cheaper outside labs and re-labeled it as their own. Guidance now requires the lab disclose subcontracting to the dentist. Relatedly, dental lab fees cannot be billed to the patient separately from the dentist's own fee (unlike medical lab work) — the payment routes through the dentist unless a state specifically allows otherwise.</p>

<h4>"Rush" isn't really a word — it's R-U-$-H</h4>
<p>Every lab publishes standard turnaround times (a single crown at UAB is roughly 5–10 working days depending on the lab; an RPD framework runs longer). Asking for faster turnaround is a "rush," and UAB's clinical policy is simple: they do not pay for expedited work. Plan the treatment sequence around real lab timelines rather than around a compressed appointment schedule.</p>

<h4>Anatomy of a real work authorization</h4>
<p>A complete authorization for, say, a zirconia crown includes the mounting instructions (articulator type, which diagnostic casts to reference), the design guidance (contours from a diagnostic wax-up, contact type, centric holding contacts by cusp), and full shade detail down to internal staining (e.g., "Vita shade D2 with white frosting on cusp tips, D3 in the cervical third, olive stain into the interproximal"). The more descriptive the authorization, the less the lab has to guess — and guessing is exactly what produces a remake.</p>
`,

'cast-crowns': `
<h4>Terminology worth being precise about</h4>
<p>"Full" and "complete" both just mean the opposite of partial coverage — the entire coronal surface is covered by a single material with no other veneer over it. "Gold," "alloy," and "metal" get used interchangeably in casual speech, but a complete gold crown is never actually pure gold — pure gold is far too soft and ductile to survive occlusal forces. It's always an alloy, historically of gold with platinum, palladium, silver, and/or copper.</p>

<h4>A restoration with an unmatched track record</h4>
<p>Dr. William H. Taggart presented the lost-wax casting technique to the New York Odontological Group in 1907, using a compressed-air "blowpipe" to push molten gold into a mold — the direct ancestor of the centrifugal and induction-coil casting machines used today. Properly made, a complete cast gold crown has the best longevity of any fixed restoration dentistry has ever produced: excellent wear characteristics (it doesn't abrade the opposing dentition the way some ceramics historically did), predictable margins down to a true feather edge, and very low hypersensitivity. It remains the textbook indication for a heavy bruxer in a non-esthetic zone.</p>
<p>Its near-disappearance from practice (roughly 3–5% of U.S. crown-and-bridge today, versus most practitioners' personal pick if they needed a crown themselves) is purely about esthetics and cost — not performance.</p>

<h4>Preparation requirements</h4>
<div class="tbl-wrap"><table><thead><tr><th>Parameter</th><th>Spec</th></tr></thead><tbody>
<tr><td>Occlusal reduction</td><td>1.5mm functional cusp / 1.0mm non-functional cusp</td></tr>
<tr><td>Axial reduction</td><td>1.0mm</td></tr>
<tr><td>Total occlusal convergence (taper)</td><td>Textbook ideal 6° — clinical target realistically 15–20°</td></tr>
<tr><td>Chamfer margin width</td><td>0.5mm minimum</td></tr>
<tr><td>Recommended alloy type</td><td>Type III (single units, short spans) or Type IV (long spans, thin sections)</td></tr>
</tbody></table></div>
<p>Second-plane reduction of the buccal wall avoids an over-contoured crown, but is often skippable on mandibular molars whose buccal profile is already fairly straight or slightly lingually inclined. Because gold can be cast and finished thinner than any ceramic — down to a true feather-edge margin under 0.2mm — margin design has more flexibility than with zirconia, which fractures under cementation forces below roughly 0.2mm and therefore needs a heavier chamfer instead.</p>

<h4>The casting sequence</h4>
<p>Wax the crown over the prepared die → attach a sprue to the bulkiest portion → surround the pattern with investment inside a casting ring → burn the wax out in an oven, leaving a hollow mold → while still hot, sling molten alloy into the mold by centrifugal (or induction/vacuum) force → let it cool, then divest → cut off the sprue and finish/polish. If contacts or fit need correcting afterward, soldering can add material or rejoin a sectioned casting — a repair option unique to metal that isn't available with monolithic ceramics.</p>
<p>Milling has largely replaced casting for gold crowns today: CAD/CAM avoids most casting-specific errors (though it introduces its own), and cost is now comparable to casting.</p>
`,

'pfm-bio': `
<h4>What "porcelain fused to metal" actually means</h4>
<p>A PFM restoration is a deliberate hybrid: an alloy coping (0.4–0.5mm) provides mechanical strength, and layered porcelain veneers it for esthetics. It has been the workhorse restoration for the better part of a century, only recently ceding ground to lithium disilicate and zirconia. The core engineering problem the whole lecture circles back to is simple: metal and ceramic have to be forced to behave like one material through their firing cycle, even though they're fundamentally different substances (metallic bonding vs. covalent/ionic bonding).</p>

<h4>Dental porcelain's tri-axial composition</h4>
<p>Porcelain is a specific family of ceramic defined by three required ingredients: <strong>kaolin</strong> (clay, ≤3%), <strong>quartz</strong> (refractory, 12–22%), and <strong>feldspar</strong> (a potassium or sodium aluminum silicate, 75–85% — the bulk). Leave any one out and, by definition, it isn't porcelain. Manufacturers heat this blend to roughly 2000°F, quench it rapidly in chilled liquid, and the resulting shattered material — <strong>frit</strong> — is ball-milled into the fine powder dental technicians build restorations from.</p>
<p>Firing produces two microscopic phases inside the fired porcelain: a <strong>glassy (amorphous) phase</strong>, which is what gives porcelain its lifelike translucency but is mechanically weak on its own, and a <strong>crystalline leucite phase</strong>, tightly-ordered crystals that deflect crack propagation (dispersion strengthening) and — just as importantly — raise porcelain's thermal expansion enough to make it compatible with metal. Firing porcelain to a dense, void-free mass is called <strong>sintering</strong> (roughly 850–1300°C); doing it under vacuum instead of open air is the single biggest lever for minimizing porosity.</p>

<h4>What the alloy substructure has to deliver</h4>
<ul>
<li><strong>Bond to porcelain</strong> — via a thin, stable surface oxide.</li>
<li><strong>Thermal compatibility</strong> — a coefficient of thermal expansion close to, but slightly higher than, the porcelain's.</li>
<li><strong>Sag resistance</strong> — it must not deform at the porcelain's firing temperature (up to ~1300°C).</li>
<li><strong>Adequate mechanical properties</strong> (yield strength, modulus) and <strong>biocompatibility</strong> — always ask patients about metal allergies before committing to a PFM or gold restoration.</li>
</ul>

<h4>Bonding mechanisms, ranked</h4>
<p><strong>Chemical bonding</strong> between the porcelain and the alloy's surface oxide is by far the strongest contributor. Because high-noble alloys (pure gold/platinum/palladium) barely oxidize on their own, trace elements like <strong>indium and tin</strong> are deliberately added just to grow that bondable oxide layer — thin and uniform is the goal, since a thick oxide layer is itself a weak, fracture-prone interface. <strong>Mechanical retention</strong> (roughness from sandblasting the coping) is a distant second, and <strong>van der Waals forces</strong> are negligible on their own.</p>
<p>A fourth effect, <strong>compression bonding</strong>, comes from thermal mismatch itself: because the alloy's coefficient of thermal expansion is engineered slightly higher than the porcelain's, the alloy contracts a bit more on cooling and squeezes the porcelain into residual compressive stress. Porcelain resists compression far better than tension or shear, so this "preload" makes the finished crown meaningfully more fracture-resistant.</p>
`,

'fpd-pontic': `
<h4>Terminology, precisely</h4>
<p>A <strong>fixed dental prosthesis (FDP)</strong> is the broad umbrella — anything permanently attached to teeth or implants that the patient cannot remove, from a single crown to a full-arch implant reconstruction. A <strong>fixed partial denture (FPD)</strong> — what everyone calls a "bridge" — specifically replaces one or more missing teeth using natural teeth, roots, or implants for support. An FPD has three components: <strong>retainers</strong> (the crowns on the abutment teeth), a <strong>pontic</strong> (the artificial tooth filling the gap), and <strong>connectors</strong> (where pontic meets retainer). A three-unit bridge has two retainers, one pontic, two connectors.</p>

<h4>Is this abutment tooth actually a good idea?</h4>
<p>Every abutment tooth is evaluated on five fronts before treatment planning proceeds: remaining <strong>coronal tooth structure</strong> (enough for retention/resistance form), <strong>periodontal support</strong> (attached gingiva, shallow probing depths, no mobility, active disease controlled first), <strong>pulp status</strong> (must be vital, or endodontically sound if not), <strong>crown-to-root ratio</strong> (ideal 1:2, minimum acceptable 1:1), and <strong>abutment inclination</strong> (a badly tipped tooth may need orthodontic uprighting rather than an over-aggressive prep to force a shared path of insertion).</p>
<p><strong>Ante's Law</strong> — a traditional guideline, not a research-validated one, but still followed — states that the periodontal (root) surface area of the abutment teeth should equal or exceed that of the teeth being replaced by pontics. It's a fast sanity check on whether a span is biomechanically reasonable before committing to treatment.</p>

<h4>Residual ridge and the five pontic designs</h4>
<p>Before designing the pontic itself, the residual ridge gets its own workup using the <strong>Siebert classification</strong>: Class I is faciolingual (width) loss with normal height; Class II is height loss with normal width; Class III is both combined. A ridge deficient enough may need grafting or an extended pontic-plus-pink-porcelain approach before a bridge can look natural.</p>
<div class="tbl-wrap"><table><thead><tr><th>Design</th><th>Tissue contact</th><th>Typical use</th></tr></thead><tbody>
<tr><td>Sanitary / hygienic</td><td>None — 2mm cleaning space, connector ≥3mm</td><td>Posterior, all-metal, non-esthetic</td></tr>
<tr><td>Saddle / (full) ridge lap</td><td>Concave, wraps facial + lingual</td><td>Avoid — cannot be cleaned</td></tr>
<tr><td>Modified ridge lap</td><td>Facial overlap only, resembles a letter "T"</td><td>Most-used — anterior & premolar esthetic zones</td></tr>
<tr><td>Conical</td><td>Single point at ridge crest</td><td>Mandibular posterior, minimal esthetic demand</td></tr>
<tr><td>Ovate</td><td>Convex form seated in a conditioned tissue hollow</td><td>Highest esthetics — needs socket preservation planning ahead of extraction</td></tr>
</tbody></table></div>
<p>The ovate design needs the most planning: ideally the extraction socket is conditioned at the time of extraction (or later via soft-tissue grafting), and the provisional restoration itself shapes the healing tissue. After roughly a month, the pontic is recontoured to leave 1–1.5mm of relief — a lingering sharp point on the tissue side causes blanching and, eventually, bone resorption instead of a healthy contact.</p>

<h4>Connector design and the Rule of 27</h4>
<p>Connectors default to <strong>rigid</strong>; non-rigid designs are reserved for relieving stress on unusually long spans or accommodating poorly angulated abutments. A metal-ceramic FPD framework needs a connector height of at least <strong>3mm</strong> to resist flexing (which chips porcelain). For zirconia FPDs, load-carrying capacity is proportional to height² × width, and the <strong>Rule of 27</strong> sets the minimum: height² × width must be ≥ 27. A connector 2mm tall and 4mm wide scores only 16 (2² × 4) — insufficient, and the fix is usually to add height rather than width, since height is squared and width isn't.</p>
`,

'trios': `
<h4>Why go digital at all</h4>
<p>Digital impressions with the 3Shape TRIOS scanner trade PVS impression material for a wanded intraoral scan, gaining accuracy, efficiency, and — very concretely — patient comfort. But the lecture is emphatic on one point: the scanner does not replace fundamentals. Soft-tissue management, retraction, isolation, and knowing where your margin actually is still determine whether a scan is usable — "the tool is not the final key factor." A subgingival margin the naked eye can't see is one the scanner can't capture either.</p>

<h4>The scanning sequence</h4>
<p>Calibration should be checked roughly every 7 days (3D) and every 30 days (color) — the software reminds automatically. For an actual scan: wait for about 5 scanner "clicks" before moving, to build a solid starting alignment, then keep the tip 0–5mm from the tooth, moving slowly and smoothly. The lower arch is always scanned first (whether or not it's the prep arch), starting at the occlusal of the first molar — "home base" — then rolling to the lingual (getting past tongue/saliva interference early) before circling back to the buccal. The upper arch follows the same occlusal start, but tackles the buccal first — "the most annoying part," fighting past the lip — before finishing at the lingual/palatal.</p>
<p>For a crown prep specifically: scan the opposing arch first (buying time for retraction cord to work), then the prep arch, capturing the margin either immediately after removing the cord (before the tissue collapses back) or by scanning with the cord still in and trimming that area digitally before a fast final margin pass. Bite scans start from the second molar (or canine, for an anterior case) and only need to capture 3–4 teeth for a solid alignment snap.</p>

<h4>Reading the Analyze screen</h4>
<ul>
<li><strong>Direction</strong> — auto-detects or lets you set a path of insertion, flagging undercuts (essential for RPD retentive areas and crown preps alike).</li>
<li><strong>Margin</strong> — lets you manually trace the margin line when it isn't crisp enough for the software to infer automatically.</li>
<li><strong>Clearance</strong> — color-codes interocclusal space; green means adequate room for the material, red flags where more reduction is needed before the file can go to the lab.</li>
<li><strong>Shade measurement</strong> — captures multiple points (cervical, body, incisal) since no natural tooth is one uniform color, though translucent incisal areas will always be a weak point for any optical shade system, TRIOS included.</li>
</ul>
<p>Final margin placement in the PCD lab is kept <strong>1mm supragingival</strong> for both anterior and posterior teeth — deliberately conservative while students are still building fundamentals — with real subgingival technique reserved for clinic.</p>
`,

'investments': `
<h4>What an investment actually is</h4>
<p>An investment is a ceramic material engineered to form a mold that molten alloy (or hot-pressed ceramic) gets cast into. Every investment is built from three components: a <strong>refractory material</strong> (almost always a polymorph of silica — quartz, tridymite, cristobalite, or fused quartz), a <strong>binder</strong> that holds the refractory together as a coherent, workable mass, and small amounts of <strong>other chemicals</strong> (sodium chloride, potassium sulphate, graphite, copper powder, magnesium oxide) that fine-tune specific properties. A good investment has to be easily manipulated, strong enough to survive molten alloy being flung into it, stable at high heat, sufficiently porous (to vent burnout gases), able to expand the right amount, easy to divest, and inexpensive.</p>

<h4>Three binders, three very different jobs</h4>
<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Binder</th><th>Ceiling</th><th>Used for</th></tr></thead><tbody>
<tr><td>Gypsum-bonded</td><td>α-calcium sulfate hemihydrate</td><td>&lt; 700°C</td><td>Low-fusing gold alloys only</td></tr>
<tr><td>Phosphate-bonded</td><td>NH₄H₂PO₄ + MgO (acid–base reaction), mixed with a special colloidal-silica liquid</td><td>High-fusing</td><td>Metal-ceramic (PFM) alloys, some base metals, pressed ceramics (Empress)</td></tr>
<tr><td>Silica (ethyl silicate)-bonded</td><td>Silica gel → reverts to cristobalite on heating</td><td>High-fusing</td><td>RPD framework base-metal alloys</td></tr>
</tbody></table></div>
<p>Above 700°C, gypsum's calcium sulfate decomposes into sulfur dioxide and sulfur trioxide, which embrittles the casting — that ceiling is exactly why PFM and RPD frameworks need a different binder chemistry entirely. RPD frameworks specifically use silica-bonded investment because there's no way to "pick up" a full-arch wax-up off a single die the way you can with an individual crown pattern — the whole duplicated refractory cast has to be invested as one unit.</p>

<h4>The expansion-compensation problem</h4>
<p>Every casting alloy shrinks roughly <strong>1.25–2.5%</strong> as it solidifies and cools — small in absolute terms, but enormous relative to the ~50-micron fit tolerance a crown margin needs. The mold has to be engineered to expand by a compensating amount, through two mechanisms working together: <strong>thermal (displacive) expansion</strong> of the refractory material, and — for some investments — <strong>hygroscopic expansion</strong>, which happens if the mold is allowed to set under water rather than on the bench.</p>
<p>Displacive transition is a genuine materials-science curiosity: at a specific temperature, the refractory's crystal lattice flips from a low-temperature <strong>alpha form</strong> to a high-temperature <strong>beta form</strong> — a rearrangement of existing atomic bonds, not a chemical reaction — and that flip produces a sudden, non-linear jump in volume. Cristobalite has the highest thermal expansion of the silica polymorphs, fused quartz the lowest. Base metal alloys shrink more than noble metal alloys during casting, so investments used for base metals (phosphate- and silica-bonded) are specifically engineered for greater expansion.</p>
<p>Manipulative variables matter here too: increasing the water/powder ratio beyond spec weakens the set investment and reduces the expansion it can deliver; more spatulation time or a warmer mixing temperature both increase expansion. None of this is optional precision — it's the difference between a crown that seats and one that doesn't.</p>
`,

'solder-weld': `
<h4>Setting up a casting: sprue, reservoir, ring</h4>
<p>The sprue is a sacrificial channel — it's attached to the <strong>bulkiest portion</strong> of the wax pattern (a cusp, typically), flared at the point of contact, and angled so molten alloy reaches every margin without turbulence. On a bridge, a parallel bar often connects multiple units and doubles as a <strong>reservoir</strong>: extra molten alloy that stays liquid longest, continuously feeding the margin as it shrinks so the margin — not the reservoir — is the first area to fully solidify. The wax pattern should sit within about <strong>6mm</strong> of the open end of the casting ring so burnout gases have somewhere to escape.</p>

<h4>Casting problems and their causes</h4>
<div class="tbl-wrap"><table><thead><tr><th>Problem</th><th>Cause</th></tr></thead><tbody>
<tr><td>Suckback porosity</td><td>Wrong solidification sequence — the margin shrank before the reservoir finished feeding it</td></tr>
<tr><td>Black castings</td><td>Incomplete wax elimination, ring left in the oven too long, an oxidizing torch flame, or too little deoxidizer in the investment</td></tr>
<tr><td>Casting fins</td><td>Investment cracked from uneven heating (a cold ring placed directly into a preheated oven) — molten alloy fills the crack</td></tr>
</tbody></table></div>
<p>Melting the alloy itself depends on reading the oxyacetylene torch's flame correctly: it has four zones — mixing, combustion, reducing, and oxidation — and the alloy must be melted in the <strong>reducing zone</strong> (zone 3), where available oxygen has already been consumed. Melt in the oxidation zone by mistake and the result is a dull, blackened casting. After casting, <strong>pickling</strong> — dropping the still-oxidized casting into an acid bath (roughly 50% sulfuric acid for noble metals), handled with rubber-coated or Teflon tweezers — dissolves surface oxides and contamination before finishing.</p>

<h4>Soldering, brazing, welding — not the same word</h4>
<p>The three terms have precise, temperature-defined meanings that the industry's casual language blurs. <strong>Brazing</strong> joins two metal components with a third, dissimilar filler metal above 450°C; <strong>soldering</strong> is the identical process below 450°C. Nearly everything dentistry calls "soldering" is technically brazing, since dental joins run well above 450°C — but the word "soldering" sticks anyway. <strong>Welding</strong> is different in kind, not just temperature: it fuses the parent metals directly, with or without a filler of the <em>same</em> alloy — no dissimilar third metal. Titanium is joined by welding specifically because its reactive oxide layer makes brazing unreliable.</p>
<p>Two solder families dominate: <strong>gold solders</strong> (alloys of gold, copper, silver, tin, zinc — copper adds strength and lowers melting point, silver increases flow; higher fineness means more tarnish resistance but lower strength), and <strong>silver solders</strong> (eutectic alloys, limited to stainless steel wires and a few base-metal alloys, melting range 700–750°C). For PFM frameworks specifically, silver and copper are avoided in the solder because they discolor porcelain green. Solder timing splits into <strong>pre-ceramic soldering</strong> (before porcelain is added, so it can run hot — 1000–1150°C) and <strong>post-ceramic soldering</strong> (after porcelain is fired, so it must stay safely below the porcelain's pyroplastic-flow temperature, around 982°C for some systems).</p>

<h4>Flux and anti-flux</h4>
<p>Flux dissolves the metal oxides that coat every surface, so the joint is clean, active, and ready to bond — borax-based fluxes for noble/high-noble alloys, potassium-fluoride-based fluxes for chromium-containing base-metal alloys, whose chromium oxide is tougher to dissolve. Anti-flux (graphite pencil, rouge/iron oxide, or chalk) is painted around the joint beforehand specifically to keep the flux — and the molten solder it draws — confined to where the join is actually needed, rather than flowing across the whole casting.</p>
`,

'alloy-systems': `
<h4>Why alloy at all</h4>
<p>Pure metals are too weak and deform too easily to survive the oral environment — even pure gold is far too soft. Alloying two or more metals together improves strength, can lower the melting point (beryllium shaves roughly 100°C off some Ni-Cr formulas), improves biocompatibility (chromium's protective oxide layer in Co-Cr and stainless steel), and can enable porcelain bonding (tin added to Au-Pt-Pd alloys, specifically to grow a bondable oxide). At the atomic level, alloying elements interfere with <strong>dislocations</strong> — the row-of-missing-or-extra-atoms flaws that let metal crystal planes slide past each other — which is exactly why alloying increases strength at the cost of some ductility.</p>

<h4>Three cast alloy systems</h4>
<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>What's happening</th><th>Dental example</th></tr></thead><tbody>
<tr><td>Solid solution</td><td>Complete miscibility of both elements in solid and liquid states — a single phase</td><td>Gold–copper; most inlay/crown/bridge alloys — most biocompatible, but softest of the three</td></tr>
<tr><td>Eutectic</td><td>Incomplete solid-state solubility — multiple phases, a single sharp melting point at the eutectic composition</td><td>High-copper amalgam powder, Ni-Cr Maryland bridge frameworks, Co-Cr RPD alloys</td></tr>
<tr><td>Peritectic</td><td>Alloying elements react to form a genuinely new intermetallic compound</td><td>Set (triturated, final) dental amalgam — the most brittle, hardest material seen in dentistry</td></tr>
</tbody></table></div>
<p>Wrought alloys are a separate axis entirely — a cast structure that's been mechanically deformed (rolling, swaging, wire-drawing) to eliminate internal voids/cracks and reorient its grain into a fibrous structure. This is called <strong>cold working</strong> when done at room temperature, and it's why orthodontic wires and RPD clasps have far better fatigue life and yield strength than a cast structure of the same alloy. The trade-off: heat a wrought structure too much and it <strong>recrystallizes</strong> back into ordinary grains, quietly destroying the advantage cold-working built in.</p>

<h4>The ADA classification, cold</h4>
<p>Alloys are classified two ways simultaneously: by <strong>noble metal content</strong> (High Noble ≥60% noble metal with ≥40% gold specifically; Noble ≥25% of any noble metal(s), no gold requirement; Predominantly Base <25% noble content; Titanium and its alloys get their own category, ≥85% titanium) and by <strong>mechanical type</strong> (Type I low strength through Type IV extra-high strength, with a Type IV alloy always usable where a Type III is specified, but never the reverse).</p>
<p>The seven noble metals are gold, platinum, palladium, iridium, rhodium, osmium, and ruthenium. Silver is deliberately excluded — despite being economically "precious," it corrodes too readily in the oral cavity to count as chemically noble. Gold, platinum, and palladium form the structural matrix of virtually every noble dental alloy; iridium, ruthenium, and rhodium show up only in trace (parts-per-million) amounts as <strong>grain refiners</strong> — their very high melting points let them act as nucleation sites during solidification, forcing a finer grain structure that measurably improves strength.</p>
<p><strong>Carat</strong> (1/24ths) and <strong>fineness</strong> (parts per 1000) both describe an alloy's gold content specifically — not its overall noble content. 18 carat = 750 fine = 75% gold by weight; fineness is simply the more precise scale of the two.</p>

<h4>Titanium, on its own</h4>
<p>Titanium is biocompatible because it spontaneously forms a stable TiO₂ oxide layer — so reactive with oxygen that "commercially pure" titanium is the practical ceiling of purity available. It's light, low-density, low-modulus, and strong, but casting it is genuinely difficult: a melting point near 1700°C, expensive equipment, and high reactivity with oxygen, hydrogen, nitrogen, and even the investment material itself. Most titanium dental work today is milled rather than cast for exactly that reason. <strong>Ti-6Al-4V</strong> — titanium alloyed with aluminum and vanadium as phase stabilizers — balances both the α and β crystal phases to optimize mechanical properties.</p>
`,

'metal-ceramic': `
<h4>A restoration in decline, but not obsolete</h4>
<p>Commercial-lab data cited in lecture shows PFM's share of indirect restorations collapsing from roughly 83% in 2005 to about 27% by 2020, as all-ceramic materials took over. UAB rarely fabricates PFM or full-metal crowns today — but the material still earns real clinical indications: long-span bridges where a metal framework resists flexing better than any ceramic, resin-bonded (Maryland) bridges where a thin metal wing needs less reduction than a comparable zirconia wing, and any case where a patient specifically wants (and can afford) a metal restoration.</p>
<div class="tbl-wrap"><table><thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td>Proven durability (40+ years); well-established technique</td><td>Metal margins can show through thin gingival biotype</td></tr>
<tr><td>High strength — ideal for long-span bridges (Type IV alloy)</td><td>Opaquer needed to mask metal makes translucency hard to achieve</td></tr>
<tr><td>Excellent, highly accurate fit</td><td>Porcelain-to-metal bond can fail; demands more aggressive reduction than monolithic ceramics</td></tr>
</tbody></table></div>

<h4>Alloy choice by application</h4>
<p>Resin-bonded (Maryland) bridges lean on <strong>base alloys</strong> (e.g., Ni-Cr-Be) specifically because their higher strength allows a much thinner framework — connector area only 1.0mm, proximal line angle and lingual surface only 0.6mm, versus the 3mm-plus a metal-ceramic connector needs. Single crowns and conventional FPDs use either base alloy or noble/high-noble alloy (Au, Pt, Pd, Ag) depending on esthetic zone and budget; implant restorations often build on a metal substructure regardless of the visible material on top.</p>

<h4>Preparation and margin design</h4>
<p>Anywhere porcelain sits over metal, the minimum combined reduction is <strong>1.5mm</strong> (0.3mm metal + 1.2mm porcelain) — checked clinically with a green clearance tab rather than the pink tab used for a 1mm zirconia reduction. Alloy-only margins (commonly the lingual, out of sight) can be as thin as 0.7–1.0mm; a porcelain-veneered margin needs 1.5–2.0mm. A <strong>shoulder</strong> margin (90° to the unprepared tooth) is favored on the facial specifically to support a porcelain-butt technique; a <strong>chamfer</strong> suits the metal-only portions and complete cast crowns; a <strong>120° sloped shoulder</strong> trades a little porcelain strength to reduce unsupported enamel; a <strong>beveled shoulder</strong> is reserved for cases planning a metal collar, not a ceramic margin.</p>
<p>Subgingival margins need a real indication (existing caries, needing ferrule, esthetics, following a prior restoration's margin) and should stay within 0.5–1.0mm of the free gingival margin — deep enough to hide the margin, shallow enough to respect the roughly 2.04mm <strong>biologic width</strong> above the alveolar crest. Violate that width and the body responds with inflammation or, over time, bone remodeling.</p>
<p><strong>Conventional margin</strong> design lets porcelain meet the metal right at the margin edge (simpler, but the metal itself is still visible as a thin dark line, especially with recession). The <strong>porcelain-butt margin</strong> requires a shoulder prep because the ceramic there is unsupported by metal, but it eliminates the gray metal line entirely and reads far better through thin or receding tissue.</p>

<h4>Fabrication and where bonds fail</h4>
<p>The metal coping is most commonly built by lost-wax casting (wax-up → cutback → invest → cast), whether the wax pattern itself was hand-carved or CAD-CAM milled/printed as a burnout pattern; copings can also be milled or 3D-printed (selective laser melting) directly in the final alloy. Porcelain is then built up conventionally (brush, powder, liquid — with 27–45% shrinkage after firing, so technicians deliberately over-build the contour) or via a press-on-metal technique using a pressed ceramic ingot.</p>
<p>Bond failures split into two families: <strong>adhesive failures</strong>, where the porcelain never properly bonded — from a coefficient-of-thermal-expansion mismatch, surface contamination (fixed with a 5-minute ultrasonic bath, never touching the metal again after cleaning), or improper oxidation (too little oxide, or too much); and <strong>cohesive failures</strong>, true fractures within the bonded assembly. A <strong>coping try-in</strong> catches margin-fit problems before the expensive, irreversible porcelain build-up begins; a <strong>bisque-bake try-in</strong> lets gross occlusal adjustments happen on the easy-to-mark matte surface before the final glaze goes on. Zirconia can't use this same "reglaze to fix a rough spot" trick the way porcelain can — once a worn zirconia glaze exposes the ceramic underneath, only true mechanical polishing restores the surface.</p>
`,

'work-auth': `
<h4>The big idea</h4>
<p>A "work authorization" is just the official name for what everyone calls a lab script or prescription &mdash; the paper that goes with a crown case telling the lab exactly what to make. It sounds like paperwork, but it's a legal document. Alabama has a law (dating back to 1848, the first dental law in the country) that makes it a misdemeanor to skip it or fail to keep records. That law exists because sending a lab patient information would normally need its own HIPAA agreement &mdash; but the work authorization system is the recognized, legal channel for that information instead.</p>

<h4>The six things the law says must be on it</h4>
<ul>
<li>The lab's (or technician's) name and address</li>
<li>The patient's name or an ID number (if you use a number, the name still has to be on the dentist's own copy)</li>
<li>The date it was written</li>
<li>What work needs doing &mdash; with a drawing if that helps explain it</li>
<li>What type and quality of material to use</li>
<li>The dentist's signature and license number</li>
</ul>
<p>Both the dentist and the lab keep their copy on file for <strong>two years</strong>, and the state board can ask to inspect those records any time.</p>

<h4>Who's responsible for what</h4>
<p>It runs both directions. The dentist sends clear instructions, a good impression, and details like shade and margins, and has to approve anything before it changes. The lab follows those instructions, uses the material that was actually asked for (or says something if it needs to change), and flags a bite registration that looks wrong instead of guessing. If a case can't be finished within a couple of working days, the lab is supposed to speak up rather than stay quiet.</p>

<h4>Where things actually go wrong</h4>
<p>The professor's own numbers are blunt: roughly 60% of what labs receive is contaminated in some way, and the two biggest complaints from labs are impressions that don't clearly show the margins, and bad bite registrations &mdash; both entirely under the dentist's control at the chair. There's also a modern wrinkle: some labs quietly send cases to a cheaper subcontractor lab and relabel it as their own work &mdash; current guidance says a lab has to disclose that. And lab fees always route through the dentist; they can't be billed to the patient directly the way some medical labs can.</p>

<h4>"Rush" jobs</h4>
<p>Every lab has a normal turnaround &mdash; a single crown usually takes somewhere around 5&ndash;10 working days. Asking to skip that line is a "rush," and UAB's policy is simple: they don't pay extra for it. Plan appointments around the lab's real timeline instead of hoping they'll hurry.</p>

<h4>What a real one looks like</h4>
<p>A complete authorization for something like a zirconia crown spells out how to mount the models, what the contours and contacts should look like, and detailed shade info &mdash; sometimes down to exactly where to place staining. The more detail the lab gets, the less they have to guess, and guessing is exactly what causes a remake.</p>

'cast-crowns': `
<h4>What we're even talking about</h4>
<p>A "complete" or "full" cast crown just means a crown that covers the whole tooth in one solid piece of metal, no other material on top. People say "gold crown," "alloy crown," and "metal crown" like they're the same thing &mdash; and basically they are &mdash; but it's never pure gold. Pure gold is too soft to survive chewing, so it always gets mixed with other metals (platinum, palladium, silver, copper) to make it strong enough.</p>

<h4>Why dentists still love this crown</h4>
<p>In 1907, Dr. Taggart showed off the "lost-wax" casting technique that's still the basis for how these crowns are made today. Done well, a full gold crown might be the best restoration in dentistry, period: it wears extremely well (it won't grind down the teeth it bites against), the edges can be made incredibly tight, and patients rarely get sensitivity from one. A lot of dentists would pick this crown for themselves. The only reason it's fallen to maybe 3&ndash;5% of crowns placed today is that it's metal-colored, not tooth-colored &mdash; a looks problem, not a performance problem.</p>

<h4>How much tooth structure comes off</h4>
<ul>
<li>1.5mm off the biting surface where the hardest-working cusp sits (the "functional cusp"), 1.0mm off the other cusp</li>
<li>1.0mm off the side walls (axial reduction)</li>
<li>Side walls taper toward each other by about 6&deg; in a perfect world &mdash; 15&ndash;20&deg; is what most dentists actually hit in practice</li>
<li>The edge (margin) needs to be at least 0.5mm wide</li>
<li>Type III alloy for a single crown, Type IV for something spanning several teeth</li>
</ul>
<p>Because metal can be cast and polished thinner than any ceramic &mdash; down to a paper-thin "feather edge" under 0.2mm &mdash; the margin has a lot more design flexibility than zirconia, which cracks if it's thinner than about 0.2mm when it's cemented. That's exactly why zirconia crowns need a heavier, more obvious edge instead.</p>

<h4>How it actually gets made</h4>
<p>The wax pattern gets a small rod (a sprue) attached to its thickest part, gets surrounded by a plaster-like material inside a metal ring, then goes into an oven that burns the wax away, leaving a hollow mold shaped exactly like the crown. While the mold is still hot, molten metal gets flung into it (usually by a spinning machine), fills every detail, and cools into the finished shape. One trick unique to metal: if the fit is slightly off afterward, a technician can cut it apart and solder it back together &mdash; not possible with a one-piece ceramic crown. A lot of "gold" crowns today are actually milled by computer instead of cast the old way, since milling skips some of casting's failure points and costs about the same.</p>
`,

'pfm-bio': `
<h4>What "porcelain fused to metal" really means</h4>
<p>A PFM crown is two materials splitting the work: a thin metal shell underneath (about 0.4&ndash;0.5mm) handles strength, and porcelain layered on top handles looking like a tooth. It's been the default crown for decades, only recently losing ground to newer all-ceramic materials. The whole trick is getting metal and porcelain &mdash; two totally different kinds of material &mdash; to behave like one solid piece through an entire baking cycle.</p>

<h4>What makes porcelain "porcelain"</h4>
<p>Dental porcelain needs three ingredients by definition: a little clay (kaolin), some quartz, and mostly feldspar (75&ndash;85% of it). Manufacturers melt the mix at extreme heat, quench it fast, shatter it, and grind the shattered glass into the powder a technician actually builds a crown from.</p>
<p>When that powder is fired, two things form inside it: a glassy part, which gives porcelain its lifelike, see-through look but is mechanically weak on its own, and tiny crystals (leucite), which act like rebar &mdash; they stop cracks from spreading and also nudge the porcelain's heat-expansion rate closer to metal's, keeping the two compatible. Baking porcelain until it's a solid, bubble-free mass is called sintering; doing it in a vacuum instead of open air is the best way to avoid trapped air bubbles.</p>

<h4>What the metal underneath has to be able to do</h4>
<ul>
<li>Bond to the porcelain &mdash; through a thin oxide layer that forms on its surface</li>
<li>Expand and contract with heat at close to the same rate as the porcelain, but very slightly more (on purpose &mdash; see below)</li>
<li>Not sag or warp at porcelain's firing temperature (up to around 1300&deg;C)</li>
<li>Be strong enough and body-safe &mdash; always ask about metal allergies before a PFM or gold crown</li>
</ul>

<h4>How porcelain actually sticks to metal</h4>
<p>The strongest bond by far is chemical, between the porcelain and a thin oxide layer on the metal's surface. Some metals (pure gold, platinum, palladium) barely oxidize on their own, so tiny amounts of other elements (indium, tin) get added specifically to grow that layer &mdash; but it has to stay thin, since a thick oxide layer is actually the weak point. A distant second contributor is mechanical roughness (the coping gets sandblasted before porcelain goes on); a nearly negligible third is a weak physical pull called van der Waals force.</p>
<p>There's a bonus effect worth knowing: because the metal is engineered to shrink very slightly more than the porcelain while everything cools after firing, it ends up squeezing the porcelain &mdash; like a hoop tightening around a barrel. That squeeze puts the porcelain under compression, and porcelain resists compression very well (it's pulling, bending, and shearing forces that break it easily), so the squeeze measurably toughens the finished crown.</p>
`,

'fpd-pontic': `
<h4>Getting the vocabulary straight</h4>
<p>"Fixed dental prosthesis" is the umbrella term for anything cemented or bonded in permanently, from a single crown to a full mouth of implant work. A "fixed partial denture" (FPD) &mdash; what everyone calls a bridge &mdash; specifically replaces one or more missing teeth using the teeth (or implants) next to the gap for support. Every bridge has three parts: retainers (the crowns holding it up), a pontic (the fake tooth filling the gap), and connectors (where pontic meets retainer). A typical 3-unit bridge = 2 retainer crowns + 1 pontic + 2 connectors.</p>

<h4>Is this tooth actually strong enough to hold a bridge?</h4>
<p>Before committing to a bridge, five things about each supporting (abutment) tooth get checked: how much healthy tooth structure is left, how healthy the gum and bone around it are, whether the nerve is healthy or already stable after a root canal, the ratio of crown length to root length (ideally about 1:2, with 1:1 as the bare minimum), and whether the tooth is tilted in a way that would make a shared path of insertion hard to pull off.</p>
<p>One handy rule of thumb, not proven by research but widely followed anyway &mdash; Ante's Law &mdash; says the total root surface area of the abutment teeth should be at least as much as the surface area of the teeth being replaced. It's a fast gut-check on whether a bridge is biomechanically reasonable before treatment even starts.</p>

<h4>What shape should the fake tooth be?</h4>
<p>First, the ridge (the gum and bone where the tooth used to be) gets sized up &mdash; did it lose width, height, or both? That affects how natural the final pontic can look without extra grafting. Then there are five basic pontic shapes:</p>
<ul>
<li><strong>Sanitary/hygienic</strong> &mdash; doesn't touch the gum at all, easiest to keep clean, but looks like a bridge (used only where nobody will see it, in the back)</li>
<li><strong>Saddle/ridge lap</strong> &mdash; wraps over the ridge on both sides &mdash; avoid this one, it traps plaque and can't be cleaned properly</li>
<li><strong>Modified ridge lap</strong> &mdash; touches the ridge on the visible (front) side only &mdash; the most common design, a good balance of natural looks and cleanability</li>
<li><strong>Conical</strong> &mdash; a single rounded point touching the ridge &mdash; simple, easy to clean, used where looks matter less</li>
<li><strong>Ovate</strong> &mdash; sits in a custom-shaped dimple in the tissue so it looks like a tooth is actually growing out of the gum &mdash; the best-looking option, but needs real planning (usually shaping the tissue with a temporary for about a month before the final crown)</li>
</ul>

<h4>How big should the connector be?</h4>
<p>Connectors (where pontic meets retainer) should almost always be rigid, not flexible. Every extra tooth a bridge spans makes it flex more when you bite: 2 pontics flex roughly 8&times; more than one, and 3 pontics flex around 27&times; more &mdash; and that flex is exactly what chips porcelain. Metal-based bridges need a connector at least 3mm tall to resist it. For zirconia bridges there's a simple formula, the Rule of 27: connector height, squared, times width &mdash; that number has to be 27 or higher. Since height is squared, adding a little height helps far more than adding width.</p>
`,

'trios': `
<h4>Why scan instead of taking a goopy impression?</h4>
<p>The TRIOS scanner swaps the traditional putty impression for a quick wand-based scan &mdash; more accurate, faster, and a lot more comfortable for the patient. But the professor is very clear about one thing: the scanner is a tool, not a fix for bad fundamentals. Skip good isolation, retraction, or not knowing exactly where your margin is, and the scan comes out just as unusable as a sloppy impression would've been. If your own eye can't see a margin under the gum, the scanner can't either.</p>

<h4>How you actually scan a tooth</h4>
<p>Check calibration regularly &mdash; the software nags every 7 days for 3D calibration and every 30 days for color calibration. When scanning starts, hold still and wait for about 5 "clicks" from the scanner before moving &mdash; that builds a solid starting point. Then keep the tip within about 0&ndash;5mm of the tooth, moving slowly and smoothly (occasional light contact is fine). The lower arch always gets scanned first no matter which arch has the prep, starting at the back molar's chewing surface, then rolling to the tongue side first (before saliva becomes a problem), then finishing on the cheek side. The upper arch follows the same starting point but flips the order &mdash; cheek side first (the annoying part, fighting past the lip), roof-of-mouth side last.</p>
<p>For a crown specifically: scan the opposite arch first (that buys time for the retraction cord to work), then scan the prep. Either pull the cord and scan the exposed margin right away before the gum closes back up, or leave the cord in, scan around it, then trim and re-scan just the margin once the cord is out. For a bite scan, start around the second molar (or canine for a front-tooth case) &mdash; only 3&ndash;4 teeth are needed for the software to line everything up.</p>

<h4>What the software shows before you send it off</h4>
<ul>
<li><strong>Direction</strong> &mdash; shows the path the crown would seat along, and flags any undercuts in the way</li>
<li><strong>Margin</strong> &mdash; lets you manually trace the edge if the software can't find it on its own</li>
<li><strong>Clearance</strong> &mdash; color-codes how much room there is for the crown material: green is plenty, red means more tooth needs to come off</li>
<li><strong>Shade</strong> &mdash; measures color at several spots, since no natural tooth is one flat color (the see-through biting edge is always the hardest part for any scanner)</li>
</ul>
<p>In the student clinic, margins are deliberately kept just above the gumline (about 1mm supragingival) while students build basic skills &mdash; trickier below-the-gum technique comes later, in real clinic.</p>
`,

'investments': `
<h4>What is an "investment," really?</h4>
<p>An investment is the plaster-like material that forms the mold molten metal gets cast into. Every investment mixes three things: a refractory material (a form of quartz/sand that survives extreme heat without melting), a binder that holds all that material together in a workable mass, and small amounts of other chemicals that fine-tune how it behaves. A good investment has to be easy to work with, tough enough to survive molten metal hitting it, stable at high heat, breathable enough to let burnout gases escape, expand by just the right amount, break away easily afterward, and not cost too much.</p>

<h4>Three "glues" for three different jobs</h4>
<ul>
<li><strong>Gypsum-bonded</strong> &mdash; the same family of material as plaster of Paris. Can't handle temperatures above about 700&deg;C (it breaks down into gases and weakens the casting above that), so it's limited to low-fusing gold alloys.</li>
<li><strong>Phosphate-bonded</strong> &mdash; a different binder that handles much higher heat. Used for PFM alloys and some pressed ceramics.</li>
<li><strong>Silica-bonded</strong> &mdash; also high-heat, used specifically for cast partial denture (RPD) frameworks, which need especially high casting temperatures.</li>
</ul>

<h4>Why the mold has to "grow" on purpose</h4>
<p>Every metal shrinks a little cooling from molten to solid, usually 1.25&ndash;2.5% &mdash; small in absolute terms, but a crown margin needs to fit within a tiny fraction of a millimeter, so it matters a lot. To compensate, the mold is built to expand by roughly a matching amount before the metal even goes in, through two tricks working together: heat-driven expansion (the sand-like refractory material actually snaps into a slightly larger crystal shape at one specific temperature, similar to how ice takes up more room than the water it froze from), and, for some investments, an extra trick called hygroscopic expansion &mdash; letting the invested ring set while sitting in water instead of just on the table swells it a bit more (up to about 2% extra). Base-metal alloys shrink more than gold-type alloys as they cool, so their investments are deliberately built to expand more, to match.</p>
<p>A few things change how much a mix actually expands: more water than the recipe calls for makes the set material weaker and gives less expansion (always follow the manufacturer's exact water amount); mixing it longer gives more expansion; mixing with warmer water also gives more expansion. None of this is a minor detail &mdash; get it wrong and the crown simply won't seat.</p>
`,

'solder-weld': `
<h4>Setting up a casting</h4>
<p>Before a wax pattern is cast into metal, a small rod (a sprue) gets attached to its thickest part &mdash; the channel molten metal flows through. On a bridge, a thicker connecting bar often doubles as a reservoir: extra metal that stays melted longest, continuously feeding the margin as everything shrinks, so the margin (not the reservoir) is the last part to fully harden. The whole wax pattern needs to sit close to the open end of the casting ring (within about 6mm) so burnout gas has somewhere to escape.</p>

<h4>What goes wrong, and why</h4>
<ul>
<li><strong>Bubbles near the margin</strong> &mdash; the margin hardened before the reservoir finished feeding it extra metal</li>
<li><strong>Black, dull castings</strong> &mdash; the wax wasn't fully burned out, the ring sat in the oven too long, the torch flame was set wrong, or there wasn't enough deoxidizer in the mix</li>
<li><strong>Thin metal fins on the casting</strong> &mdash; the mold cracked from uneven heating (like putting a cold ring straight into a hot oven), and metal leaked into the crack</li>
</ul>
<p>Melting metal with a torch depends on aiming for the right part of the flame &mdash; there's a specific zone (the reducing zone) where the flame has already used up its oxygen, and that's where metal needs to melt; melt it in the wrong zone and you get a dull, oxidized casting. Afterward, the casting gets dropped in an acid bath ("pickling") to dissolve the oxide layer that built up on its surface.</p>

<h4>Soldering vs. brazing vs. welding &mdash; not actually the same thing</h4>
<p>These words get used interchangeably in everyday speech, but they have precise, temperature-based definitions. Brazing joins two metal pieces using a third, different metal, above 450&deg;C. Soldering is the exact same process below 450&deg;C. Since almost everything in a dental lab happens well above 450&deg;C, most of what dentistry casually calls "soldering" is technically brazing &mdash; the word just stuck. Welding is different in kind, not just temperature: it fuses the original metal pieces directly together, with or without adding more of that same metal (never a different one). Titanium specifically has to be welded, not brazed, because its surface reacts so strongly with oxygen that a filler metal can't bond to it reliably.</p>
<p>Two solder families exist: gold solders (mixes of gold, copper, silver, tin, zinc &mdash; copper adds strength and lowers the melting point, silver helps it flow) and silver solders (used for things like stainless steel wires). For PFM frameworks, silver and copper are avoided in the solder because they can turn the porcelain a greenish color. Soldering done before porcelain goes on can run hotter; soldering done after porcelain is already there has to stay cooler, or it melts the porcelain that's already baked on.</p>

<h4>Flux and anti-flux</h4>
<p>Flux dissolves the oxide coating that naturally builds up on metal, so the joint can actually bond cleanly &mdash; different flux types exist because some oxides (like the ones on chromium-containing metals) are tougher to dissolve than others. Anti-flux is basically the opposite tool: painted around the joint beforehand to keep flux (and the melted solder that follows it) from spreading anywhere it isn't wanted.</p>
`,

'alloy-systems': `
<h4>Why mix metals together at all?</h4>
<p>Pure metals are almost always too soft or weak for dental use &mdash; even pure gold. Mixing (alloying) two or more metals together makes the result stronger, can lower the melting point, can make it safer for the body, and can help it bond to porcelain. At a microscopic level, alloying works by getting in the way of "dislocations" &mdash; tiny defects in a metal's crystal structure that let layers of atoms slide past each other. Block that sliding and the metal gets stronger, usually at some cost to how bendy it is.</p>

<h4>Three kinds of metal mixtures</h4>
<ul>
<li><strong>Solid solution</strong> &mdash; the metals dissolve completely into each other, like sugar in water, forming one uniform material (gold-copper is the classic dental example). Most biocompatible of the three, but also the softest.</li>
<li><strong>Eutectic</strong> &mdash; the metals don't fully dissolve into each other; you get a mixture of different zones, but still one clean melting point.</li>
<li><strong>Peritectic</strong> &mdash; the metals actually react chemically to form a brand-new compound. The hardest, most brittle option &mdash; set dental amalgam is the classic example.</li>
</ul>
<p>Separately, "wrought" metal is metal that's been physically worked &mdash; rolled, bent, or drawn into wire &mdash; instead of just cast into shape. Doing that at room temperature (cold working) rearranges the internal grain structure and makes the metal noticeably tougher and more fatigue-resistant, which is why orthodontic wires and clasps are made this way instead of cast. Heat it too much afterward, though, and it resets back to a regular, weaker grain structure, undoing the benefit.</p>

<h4>How alloys get classified</h4>
<p>Two systems apply at once. By noble metal content: High Noble needs at least 60% noble metal total, and at least 40% of that specifically has to be gold. Noble just needs 25%+ of any noble metal (gold, platinum, palladium, and a few others), no gold requirement. Predominantly Base means under 25% noble content. (Silver doesn't count as "noble" in dentistry, even though it's valuable &mdash; it corrodes too easily in the mouth.) Titanium gets its own category.</p>
<p>By mechanical strength (Type I through IV): Type I is soft and low-strength, Type IV is strong and used for the most demanding, thin, or long-span situations. A stronger type can always substitute where a weaker one is called for, never the reverse.</p>
<p>Two more terms describe gold purity specifically, not overall alloy content: carat (out of 24 &mdash; 18 carat = 18/24 = 75% gold) and fineness (out of 1000 &mdash; 750 fine = 75% gold, more precise than carat).</p>
`,

'metal-ceramic': `
<h4>Falling out of fashion, but not gone</h4>
<p>PFM crowns used to be everywhere &mdash; about 83% of indirect restorations back in 2005 &mdash; but that share dropped to around 27% by 2020 as all-ceramic materials took over. UAB barely uses PFM or full-metal crowns anymore in most cases, but it's still the right call sometimes: long bridges (a metal frame resists bending better than ceramic), thin resin-bonded "Maryland" bridges (a thin metal wing needs less tooth reduction than a comparable zirconia wing), and cases where the patient specifically wants, and can afford, a metal restoration.</p>

<h4>Trade-offs, plainly</h4>
<p>The upside: decades of proven track record, very high strength (great for long bridges), and an excellent, tight fit. The downside: the metal edge can peek through with thin gums, the opaque layer needed to hide the metal makes a natural see-through look harder to get, the bond between porcelain and metal can fail, and it needs more tooth removed than an all-ceramic crown would.</p>

<h4>How much tooth needs to come off</h4>
<p>Anywhere porcelain sits on top of metal, at least 1.5mm total room is needed (0.3mm for the metal, 1.2mm for the porcelain on top) &mdash; checked in the mouth with a green measuring tab (a plain zirconia crown only needs 1mm, checked with a pink tab). Where it's metal-only, usually the tongue side since nobody sees it, the edge can be as thin as 0.7&ndash;1.0mm; where porcelain covers the margin, it needs 1.5&ndash;2.0mm. A "shoulder" margin (a flat 90&deg; step) is the go-to on the visible side because it gives porcelain room to run all the way to the edge without any metal showing; a "chamfer" works for metal-only areas; a couple of other variations trade a little strength for less tooth removal.</p>
<p>Going below the gumline needs an actual reason: decay, a cracked tooth, needing extra grip for a root-canaled tooth, matching an old crown's margin, or purely for looks. It should also stay shallow, about 0.5&ndash;1.0mm below the gum, to avoid crowding the natural buffer zone of gum and bone right around the tooth (roughly 2mm), which inflames or recedes if it's disturbed.</p>

<h4>How it's actually built, and where it can fail</h4>
<p>The metal base is usually made the traditional way &mdash; wax it up, cast it in metal &mdash; though it can also be milled or 3D-printed today. Porcelain then gets layered on by hand (brush, powder, and liquid, built up bigger than the final size since it shrinks 27&ndash;45% when fired) or pressed on using a pre-made ceramic ingot. When the bond between porcelain and metal fails, it's either an "adhesive" failure (a clean separation between layers, usually from mismatched expansion rates, a dirty surface, or a bad oxide layer) or a "cohesive" failure (an actual fracture inside one of the materials). Along the way, a "coping try-in" checks the bare metal fits before the expensive porcelain goes on, and a "bisque bake try-in" lets the dentist check and adjust the bite while the porcelain is still rough and unglazed &mdash; much easier to adjust than after the final shiny glaze is fired on.</p>
`,
