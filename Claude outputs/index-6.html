<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style><title>Fixed Prosthodontics Compendium</title>
<meta name="description" content="A written compendium, searchable question bank, and an after-hours lab practice game for PCD D2 Exam 2: fixed prosthodontics, alloys, casting, and porcelain.">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --paper:#EDE7DA;
  --surface:#F7F3EA;
  --surface-raised:#FFFDF7;
  --ink:#2B2620;
  --ink-soft:#5B5346;
  --ink-faint:#8A8071;
  --line:#D9D0BC;
  --line-strong:#C4B99E;
  --gold:#A87C2E;
  --gold-soft:#EFE0BE;
  --gold-ink:#5C4213;
  --patina:#2F6B62;
  --patina-soft:#DCEAE4;
  --patina-ink:#173E38;
  --clay:#A94E34;
  --clay-soft:#F3DED4;
  --clay-ink:#5C2415;
  --steel:#33628A;
  --steel-soft:#DCE6EE;
  --steel-ink:#1B3A54;
  --good:#3C7A3E;
  --good-soft:#DCEBDC;
  --bad:#B33A2E;
  --bad-soft:#F5DEDA;

  /* "After Hours" game mode — a fixed night palette, deliberately constant
     across both light and dark host themes (it's always night in the lab). */
  --night-bg:#15100A;
  --night-bg2:#0E0B07;
  --night-panel:#211A11;
  --night-panel-raised:#2A2116;
  --night-line:#40331F;
  --night-ink:#F1E7D2;
  --night-ink-soft:#BCAE93;
  --night-ink-faint:#8C7F68;
  --night-gold:#E3B15C;
  --night-clay:#E48D68;
  --night-patina:#6FBBAC;
  --night-steel:#86B7DE;
  --night-good:#7FBE81;
  --night-bad:#E38375;

  --shadow: 2px 3px 0 rgba(43,38,32,0.08);
  --shadow-lift: 4px 6px 0 rgba(43,38,32,0.10);
  --radius:3px;
  --font-display:'Bitter',Georgia,'Times New Roman',serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1712;
    --surface:#242019;
    --surface-raised:#2B261E;
    --ink:#ECE4D3;
    --ink-soft:#B9AE99;
    --ink-faint:#867C6B;
    --line:#3A3327;
    --line-strong:#4C4433;
    --gold:#D3A44F;
    --gold-soft:#3B2F17;
    --gold-ink:#EFD79B;
    --patina:#66B0A2;
    --patina-soft:#1B342F;
    --patina-ink:#B7E4D8;
    --clay:#DE8262;
    --clay-soft:#3B241C;
    --clay-ink:#F2C3AE;
    --steel:#7FB0DA;
    --steel-soft:#1E2E3D;
    --steel-ink:#C5DDF2;
    --good:#7FBE81;
    --good-soft:#213822;
    --bad:#E38375;
    --bad-soft:#3C211D;
    --shadow: 2px 3px 0 rgba(0,0,0,0.35);
    --shadow-lift: 4px 6px 0 rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --paper:#1B1712;
  --surface:#242019;
  --surface-raised:#2B261E;
  --ink:#ECE4D3;
  --ink-soft:#B9AE99;
  --ink-faint:#867C6B;
  --line:#3A3327;
  --line-strong:#4C4433;
  --gold:#D3A44F;
  --gold-soft:#3B2F17;
  --gold-ink:#EFD79B;
  --patina:#66B0A2;
  --patina-soft:#1B342F;
  --patina-ink:#B7E4D8;
  --clay:#DE8262;
  --clay-soft:#3B241C;
  --clay-ink:#F2C3AE;
  --steel:#7FB0DA;
  --steel-soft:#1E2E3D;
  --steel-ink:#C5DDF2;
  --good:#7FBE81;
  --good-soft:#213822;
  --bad:#E38375;
  --bad-soft:#3C211D;
  --shadow: 2px 3px 0 rgba(0,0,0,0.35);
  --shadow-lift: 4px 6px 0 rgba(0,0,0,0.4);
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
}

/* ============================= BASE ============================= */
*,*::before,*::after{box-sizing:border-box;}
html{color-scheme:light dark;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0 0 .5em;text-wrap:balance;color:var(--ink);}
p{margin:0 0 1em;}
a{color:var(--patina);}
button{font-family:inherit;}
.tabular{font-variant-numeric:tabular-nums;}
.mono{font-family:var(--font-mono);}
::selection{background:var(--gold-soft);color:var(--gold-ink);}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ============================= SHELL ============================= */
#shell{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

#topbar{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:2px solid var(--ink);padding:14px 20px;
}
#topbar-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand-mark{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;
  background:var(--ink);color:var(--paper);padding:3px 6px;border-radius:2px;
}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em;}
.brand-sub{font-size:12px;color:var(--ink-faint);font-family:var(--font-mono);}

#modeSwitch{
  display:flex;gap:3px;background:var(--surface);border:1.5px solid var(--line-strong);
  border-radius:9px;padding:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);
}
#modeSwitch button{
  appearance:none;border:none;background:transparent;
  color:var(--ink-soft);padding:8px 18px;font-size:13.5px;font-weight:700;cursor:pointer;
  border-radius:6px;font-family:var(--font-body);letter-spacing:.01em;transition:none;
}
#modeSwitch button[aria-selected="true"]{background:var(--ink);color:var(--paper);box-shadow:1px 2px 0 rgba(0,0,0,.25);}
#modeSwitch button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--surface-raised);}
#modeSwitch button:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}

.mode-panel{padding-top:26px;}
.mode-panel[hidden]{display:none;}

/* ============================= SHARED UI ============================= */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
.card{background:var(--surface-raised);border:1.5px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;
  padding:3px 8px;border-radius:20px;border:1px solid currentColor;letter-spacing:.02em;
}
.btn{
  appearance:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:3px;font-weight:600;font-size:14px;cursor:pointer;font-family:var(--font-body);
}
.btn:hover{opacity:.85;}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.small{padding:6px 11px;font-size:12.5px;}
.btn:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* tag colors: alloy / porcelain / clinical / digital */
.tag-alloy{color:var(--gold-ink);background:var(--gold-soft);}
.tag-porcelain{color:var(--clay-ink);background:var(--clay-soft);}
.tag-clinical{color:var(--patina-ink);background:var(--patina-soft);}
.tag-digital{color:var(--steel-ink);background:var(--steel-soft);}
.dot-alloy{color:var(--gold);}
.dot-porcelain{color:var(--clay);}
.dot-clinical{color:var(--patina);}
.dot-digital{color:var(--steel);}
.bar-alloy{background:var(--gold);}
.bar-porcelain{background:var(--clay);}
.bar-clinical{background:var(--patina);}
.bar-digital{background:var(--steel);}

table{border-collapse:collapse;width:100%;}
.tbl-wrap{overflow-x:auto;border:1.5px solid var(--line-strong);border-radius:var(--radius);}
.tbl-wrap table{min-width:520px;}
.tbl-wrap th,.tbl-wrap td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;}
.tbl-wrap thead th{background:var(--surface);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);border-bottom:2px solid var(--line-strong);}
.tbl-wrap tbody tr:last-child td{border-bottom:none;}
.tbl-wrap tbody tr:hover{background:var(--surface);}

.ref-block{margin-bottom:40px;}
.ref-block:last-child{margin-bottom:0;}
.ref-block h4{font-size:15.5px;margin:0 0 12px;color:var(--ink);}

/* Question card (shared across modes) */
.qcard{background:var(--surface-raised);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.qcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.qcard-type{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);}
.qcard-q{font-size:15.5px;font-weight:600;margin:0 0 12px;line-height:1.4;}
.qcard-choices{display:flex;flex-direction:column;gap:7px;}
.qchoice{
  text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:9px 12px;border-radius:3px;cursor:pointer;font-size:14px;font-family:var(--font-body);
}
.qchoice:hover:not(:disabled){border-color:var(--ink-soft);}
.qchoice.is-correct{background:var(--good-soft);border-color:var(--good);color:var(--ink);}
.qchoice.is-wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink);}
.qchoice:disabled{cursor:default;}
.qcard-explain{margin-top:12px;padding:11px 13px;background:var(--surface);border-left:3px solid var(--gold);font-size:13.5px;color:var(--ink-soft);border-radius:0 3px 3px 0;}
.qcard-src{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-top:8px;display:block;}
.qcard-foot{display:flex;gap:8px;margin-top:12px;}

.seq-list{display:flex;flex-direction:column;gap:6px;margin:0 0 10px;padding:0;list-style:none;}
.seq-item{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:3px;padding:9px 12px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center;}
.seq-item .num{font-family:var(--font-mono);font-size:12px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.seq-item.placed{background:var(--gold-soft);border-color:var(--gold);}
.seq-item.correct{background:var(--good-soft);border-color:var(--good);}
.seq-item.wrong{background:var(--bad-soft);border-color:var(--bad);}

.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:10px;}
.match-item{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:3px;padding:8px 10px;cursor:pointer;font-size:13.5px;text-align:left;}
.match-item.sel{border-color:var(--steel);background:var(--steel-soft);}
.match-item.matched{border-color:var(--good);background:var(--good-soft);cursor:default;}
.match-item.shake{border-color:var(--bad);background:var(--bad-soft);}

.recall-reveal{border:1.5px dashed var(--line-strong);border-radius:3px;padding:12px;text-align:center;color:var(--ink-faint);cursor:pointer;font-size:13.5px;background:var(--surface);}
.recall-answer{background:var(--surface);border-radius:3px;padding:12px 14px;margin-top:4px;}
.recall-answer strong{color:var(--patina-ink);}

/* Toast / achievement */
#toastWrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{
  background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:4px;box-shadow:var(--shadow-lift);
  font-size:13.5px;max-width:300px;display:flex;gap:10px;align-items:center;
  animation:toast-in .25s ease-out;
}
@keyframes toast-in{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.toast .ic{font-size:20px;}
.toast b{display:block;font-family:var(--font-display);font-size:14px;}

/* Progress bits reused across modes */
.progress-track{height:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;border-radius:6px;}

[hidden]{display:none!important;}

/* ============================= COMPENDIUM ============================= */
#compSubnav{display:flex;gap:2px;margin-bottom:22px;border-bottom:1.5px solid var(--line-strong);flex-wrap:wrap;}
#compSubnav button{
  appearance:none;border:none;background:transparent;color:var(--ink-soft);padding:9px 4px;margin-right:20px;
  font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;font-family:var(--font-body);
}
#compSubnav button:hover{color:var(--ink);}
#compSubnav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);}
.comp-view[hidden]{display:none;}

.comp-layout{display:grid;grid-template-columns:230px 1fr;gap:32px;align-items:start;}
.comp-layout>*{min-width:0;}
@media (max-width:760px){ .comp-layout{grid-template-columns:1fr;} }
.comp-nav{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px;}
.comp-nav a{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:3px;text-decoration:none;color:var(--ink-soft);
  font-size:13px;border-left:3px solid transparent;min-width:0;
}
.comp-nav a>span:last-child{min-width:0;overflow-wrap:break-word;}
.comp-nav a:hover{background:var(--surface);color:var(--ink);}
.comp-nav a.active{background:var(--surface);color:var(--ink);font-weight:600;}
.comp-nav .navnum{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);width:26px;flex-shrink:0;}
.comp-nav .navdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.comp-nav-progress{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-left:34px;margin-top:1px;}

.lecture-section{margin-bottom:52px;padding-bottom:8px;border-bottom:1px dashed var(--line);scroll-margin-top:90px;}
.lecture-section:last-child{border-bottom:none;}
.lecture-kicker{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.lecture-kicker .chip{text-transform:uppercase;}
.lecture-meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-bottom:18px;}
.lecture-section h4{font-size:15.5px;margin-top:1.8em;color:var(--ink);}
.lecture-section h4:first-of-type{margin-top:0;}
.lecture-section ul{padding-left:1.2em;margin:0 0 1em;}
.lecture-section li{margin-bottom:.4em;}
.lecture-section strong{color:var(--ink);}

.bank-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
.bank-search{flex:1;min-width:180px;padding:9px 12px;border:1.5px solid var(--line-strong);border-radius:3px;background:var(--surface-raised);color:var(--ink);font-size:14px;font-family:var(--font-body);}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
.filter-chip{cursor:pointer;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:20px;}
.filter-chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.bank-count{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-bottom:14px;}

.cram-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.cram-card{background:var(--surface-raised);border:1.5px solid var(--line-strong);border-radius:var(--radius);padding:16px 18px;}
.cram-card h5{font-family:var(--font-display);font-size:14.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
.cram-card ul{margin:0;padding-left:1.1em;font-size:13px;color:var(--ink-soft);}
.cram-card li{margin-bottom:.5em;}

.stat-strip{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:28px;padding:16px 20px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:var(--radius);}
.stat-box{min-width:90px;}
.stat-box .n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;}
.stat-box .l{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}

/* ---- Lecture Notes detail-level toggle ---- */
.lecture-mode-toggle{display:inline-flex;gap:3px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:20px;padding:3px;margin-bottom:22px;}
.lecture-mode-toggle button{
  appearance:none;border:none;background:transparent;color:var(--ink-soft);padding:7px 16px;border-radius:16px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);
}
.lecture-mode-toggle button[aria-selected="true"]{background:var(--ink);color:var(--paper);}
.lecture-mode-toggle button:hover:not([aria-selected="true"]){color:var(--ink);}

/* ---- Exam Hints tab ---- */
.hints-intro{color:var(--ink-soft);margin-bottom:20px;max-width:70ch;font-size:13.5px;}
.hint-group{margin-bottom:36px;}
.hint-group:last-child{margin-bottom:0;}
.hint-group-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:6px;border-bottom:1.5px solid var(--line-strong);}
.hint-group-head h4{font-size:15.5px;margin:0;color:var(--ink);}
.hint-card{background:var(--surface-raised);border:1.5px solid var(--line-strong);border-left:4px solid var(--gold);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
.hint-card:last-child{margin-bottom:0;}
.hint-card.tag-alloy{border-left-color:var(--gold);}
.hint-card.tag-porcelain{border-left-color:var(--clay);}
.hint-card.tag-clinical{border-left-color:var(--patina);}
.hint-card.tag-digital{border-left-color:var(--steel);}
.hint-num{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.hint-q{font-family:var(--font-display);font-size:14.5px;font-weight:700;color:var(--ink);margin:0 0 4px;line-height:1.4;}
.hint-q-note{font-size:12px;color:var(--ink-faint);font-style:italic;margin:0 0 12px;}
.hint-a{font-size:13.5px;color:var(--ink-soft);}
.hint-a p{margin:0 0 .8em;}
.hint-a p:last-child{margin-bottom:0;}
.hint-a ul,.hint-a ol{margin:.4em 0 .8em;padding-left:1.3em;}
.hint-a li{margin-bottom:.4em;}
.hint-a strong{color:var(--ink);}
.hint-a .tbl-wrap{margin:.6em 0;}

/* ============================= AFTER HOURS (Game) =============================
   A deliberately fixed "night lab" world — constant across both light and
   dark host themes, since it's always night in this scene. */
#panel-game{
  background:
    radial-gradient(ellipse 900px 460px at 12% -6%, rgba(227,177,92,0.12), transparent 60%),
    radial-gradient(ellipse 700px 420px at 88% 4%, rgba(111,187,172,0.09), transparent 58%),
    linear-gradient(180deg, var(--night-bg) 0%, var(--night-bg2) 100%);
  margin:-26px calc(-1 * max(20px, (100% - 1180px)/2 + 20px)) -80px;
  padding:34px max(20px, (100% - 1180px)/2 + 20px) 70px;
  color:var(--night-ink);
}
.game-intro{margin-bottom:22px;}
.game-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--night-gold);}
.game-intro h2{font-size:21px;margin:4px 0 4px;color:var(--night-ink);}
.game-intro p{margin:0;font-size:13px;color:var(--night-ink-soft);max-width:64ch;}

.game-hud{
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;
  padding:14px 18px;background:var(--night-panel);border:1px solid var(--night-line);border-radius:var(--radius);
}
.hud-stat{display:flex;flex-direction:column;}

<script>
'use strict';
/* =====================================================================
   FIXED PROSTHODONTICS COMPENDIUM — shared data layer
   ===================================================================== */

const LECTURES = [
  { id:'work-auth',     num:'09',   title:'Work Authorizations & Lab Law',        who:'Dr. Givan',   tag:'clinical',   source:'8/10 transcript + slides 16', status:'core' },
  { id:'cast-crowns',   num:'08',   title:'Complete Cast Alloy Crowns',           who:'Dr. Givan',   tag:'alloy',      source:'8/10 transcript + slides 05', status:'core' },
  { id:'pfm-bio',       num:'10',   title:'PFM Biomaterials: Porcelain',          who:'Dr. Chavali', tag:'porcelain',  source:'8/10 transcript', status:'core' },
  { id:'fpd-pontic',    num:'11',   title:'Intro to FDPs & Pontic Design',        who:'Dr. Fu',      tag:'clinical',   source:'8/17 transcript', status:'core' },
  { id:'trios',         num:'12',   title:'3Shape TRIOS Scanner',                 who:'Dr. Fu',      tag:'digital',    source:'8/17 transcript + TRIOS review PDF', status:'core' },
  { id:'investments',   num:'13-1', title:'Casting Investments',                  who:'Dr. Chavali', tag:'alloy',      source:'8/24 transcript + slides', status:'core' },
  { id:'solder-weld',   num:'13-2', title:'Casting, Soldering & Welding',         who:'Dr. Chavali', tag:'alloy',      source:'8/24 transcript + slides', status:'core' },
  { id:'alloy-systems', num:'13-3', title:'Alloy Systems in Dentistry',           who:'Dr. Chavali', tag:'alloy',      source:'8/24 transcript + slides', status:'core' },
  { id:'metal-ceramic', num:'14',   title:'Metal Ceramic Restorations (Clinic)',  who:'Dr. Chen',    tag:'porcelain',  source:'8/31 transcript + slides', status:'core' },
];

const TAG_LABEL = { alloy:'Alloys & Casting', porcelain:'Porcelain & PFM', clinical:'Clinical Planning', digital:'Digital Workflow' };

/* --------------------------------------------------------------------
   QUESTIONS — every question traces to course material.
   src: 'exam-hints' = professor's 9/1 exam email · 'study-guide' = student
   PCD D2 Exam 2 Study Guide (Google Doc) · 'lecture' = transcript/slide-deck only
   -------------------------------------------------------------------- */
const QUESTIONS = [

// ===== work-auth (09) =====
{id:'wa1', lec:'work-auth', type:'mcq', q:"What is the correct legal term for what dentists informally call a “lab script”?", choices:["Work authorization","Treatment plan","Laboratory referral","Prosthetic order"], answer:0, ex:"It's colloquially called a lab script or prescription, but legally — under the Alabama Dental Practice Act and every state's Dental Practice Act — it is a work authorization.", src:'lecture'},
{id:'wa2', lec:'work-auth', type:'mcq', q:"Under §34-9-21 of the Alabama Dental Practice Act, how long must both the dentist and the laboratory retain permanent files of work authorizations?", choices:["6 months","1 year","2 years","5 years"], answer:2, ex:"Both the dentist's duplicate and the lab's original must be kept on permanent file for two years and are open to inspection by the Board.", src:'exam-hints'},
{id:'wa3', lec:'work-auth', type:'recall', q:"Alabama's Dental Practice Act (§34-9-21) requires six specific elements on every work authorization. Name as many as you can before revealing.", answer:"(1) Name & address of the lab/technician · (2) Patient name or ID number · (3) Date the prescription was written · (4) Description of the work, with a diagram if necessary · (5) Specification of the type and quality of materials used · (6) Signature of the dentist and their license number.", ex:"This is the 'law part of the work authorization' the professor's exam email flags directly — know all six.", src:'exam-hints'},
{id:'wa4', lec:'work-auth', type:'mcq', q:"Alabama was the first U.S. state to pass a Dental Practice Act. In what year, per lecture?", choices:["1848","1901","1922","1950"], answer:0, ex:"Not because Alabama is first alphabetically — it just happened to be first, in 1848.", src:'lecture'},
{id:'wa5', lec:'work-auth', type:'mcq', q:"Per lab QA survey data cited in lecture, roughly what share of cases labs receive from dentists arrive contaminated?", choices:["10%","25%","40%","60%"], answer:3, ex:"About 60% — a stat the lecture calls 'totally unacceptable,' underscoring the dentist's infection-control responsibility before shipping a case.", src:'lecture'},
{id:'wa6', lec:'work-auth', type:'mcq', q:"What is cited as the single most common problem labs have with items dentists send them?", choices:["Wrong shade requested","Deficient/inaccurate impressions","Missing signature","Late pickup"], answer:1, ex:"Impressions that don't clearly capture the margin, are distorted, or omit needed structures (like the opposing arch) are the #1 complaint — inadequate interocclusal (bite) records are #2.", src:'lecture'},
{id:'wa7', lec:'work-auth', type:'mcq', q:"A dentist wants a crown back faster than the lab's standard turnaround (e.g., 5 working days). What is this request called, and what is UAB's stated policy on it?", choices:["A rush; UAB will pay extra for it","A rush; UAB does not pay for expedited work","A recall; free of charge","A priority order; charged to the patient"], answer:1, ex:"Remember it as R-U-S-H with the S replaced by a dollar sign — and the answer at UAB is no, they don't pay to expedite. Plan your work and work your plan.", src:'lecture'},
{id:'wa8', lec:'work-auth', type:'mcq', q:"Per ADA guidance, can a dental laboratory bill the patient directly for its portion of a restoration's cost?", choices:["Yes, always, itemized separately from the dentist's fee","No, generally payment routes through the dentist unless applicable law allows otherwise","Yes, but only for implant cases","No, the lab must bill the dentist's malpractice insurer"], answer:1, ex:"Unlike medical lab work, dental lab fees are folded into the dentist's fee — the lab does not bill the patient separately except where law specifically allows it.", src:'lecture'},
{id:'wa9', lec:'work-auth', type:'mcq', q:"If a laboratory decides to subcontract a case to another lab (common with milled full-metal or implant components), what does ADA guidance require?", choices:["Nothing — subcontracting is invisible to the dentist by design","The lab must inform the dentist that the case was subcontracted","The subcontracting lab must contact the patient directly","The original lab must refund 50% of the fee"], answer:1, ex:"This became an issue when labs quietly shipped work overseas to cut costs; guidance now requires the dentist be told when a case is subcontracted.", src:'lecture'},
{id:'wa10', lec:'work-auth', type:'match', q:"Match each responsibility to whether it belongs to the dentist or the laboratory technician.", pairs:[["Provide clear written instructions & retain a duplicate copy","Dentist"],["Return the case if a question arises on mounting/bite","Lab Technician"],["Identify crown margins, palatal seal, denture borders","Dentist"],["Match the requested shade","Lab Technician"]], ex:"Both sides carry real obligations — the relationship is explicitly described as a two-way street in lecture.", src:'lecture'},
{id:'wa11', lec:'work-auth', type:'mcq', q:"Why does a work authorization need to specify the exact material/alloy type (e.g., 'type 3 full gold crown alloy') rather than leaving it blank?", choices:["It's optional decoration for the lab's records","It creates a legal record protecting the dentist if the wrong material is used and causes harm","It only matters for insurance billing codes","Labs ignore this field in practice"], answer:1, ex:"There's a history of alloys being substituted without the dentist's knowledge; specifying materials in writing closes that liability gap if a patient reaction occurs.", src:'lecture'},
{id:'wa12', lec:'work-auth', type:'recall', q:"What phrase from lecture captures why a dentist needs a working understanding of lab procedures, even though they'll rarely fabricate a crown themselves after school?", answer:"“If you don't have an idea [what the technician does], you're going to have a very hard time as a professional” — understanding the lab's process, restrictions, and challenges lets a dentist give the lab what it actually needs to succeed.", ex:"The lecture frames the lab technician as 'the magician who makes the magic' — but one who can only work with what the dentist gives them.", src:'lecture'},

// ===== cast-crowns (08) =====
{id:'cc1', lec:'cast-crowns', type:'mcq', q:"Who is credited with introducing the lost-wax casting technique for dental crowns, presenting it to the New York Odontological Group in 1907?", choices:["Dr. G.V. Black","Dr. William H. Taggart","Dr. Charles Goodacre","Dr. John Burgess"], answer:1, ex:"Taggart's compressed-air 'blowpipe' pushed molten gold into a mold — the ancestor of the modern centrifugal/induction casting machine.", src:'lecture'},
{id:'cc2', lec:'cast-crowns', type:'mcq', q:"Roughly what share of all crown-and-bridge restorations placed in the U.S. today are still complete (full) metal crowns?", choices:["Less than 1%","About 3–5%","About 15–20%","About 30–35%"], answer:1, ex:"Small but real — full PFM is cited separately at ~30–35% of restorations nationally, while complete metal crowns sit at only 3–5%.", src:'lecture'},
{id:'cc3', lec:'cast-crowns', type:'mcq', q:"What occlusal reduction is recommended for the functional cusp vs. the non-functional cusp on a complete cast crown prep?", choices:["1.0mm functional / 1.5mm non-functional","1.5mm functional / 1.0mm non-functional","2.0mm functional / 1.5mm non-functional","Equal 1.0mm for both"], answer:1, ex:"The functional (holding) cusp bears more occlusal load and needs more clearance — 1.5mm vs. 1.0mm on the non-functional cusp.", src:'exam-hints'},
{id:'cc4', lec:'cast-crowns', type:'mcq', q:"What is the textbook-ideal total occlusal convergence (taper) for a complete cast crown preparation?", choices:["2 degrees","6 degrees","15 degrees","25 degrees"], answer:1, ex:"6° is the textbook ideal; clinically the realistic target quoted in lecture is closer to 15–20°.", src:'lecture'},
{id:'cc5', lec:'cast-crowns', type:'mcq', q:"What is the minimum recommended chamfer margin width for a complete cast (gold) crown?", choices:["0.2mm","0.5mm","1.0mm","1.5mm"], answer:1, ex:"0.5mm minimum — an insufficient chamfer forces the technician to over-contour the restoration, a common contributor to periodontal problems.", src:'lecture'},
{id:'cc6', lec:'cast-crowns', type:'recall', q:"Why can a complete gold crown be finished to a true feather-edge margin (under ~0.2mm), while a zirconia crown cannot?", answer:"Gold is ductile and can be cast and finished extremely thin without fracturing; zirconia milled that thin will fracture from the hydraulic forces of cementation, so zirconia needs a heavier chamfer for strength.", ex:"This is why feather-edge margins are a metal-specific option — not available with all-ceramic materials.", src:'lecture'},
{id:'cc7', lec:'cast-crowns', type:'mcq', q:"Per ANSI/ADA Specification No. 5, which alloy strength type is recommended for full crowns, pontics, and short-span fixed partial dentures?", choices:["Type I (low strength)","Type II (medium strength)","Type III (high strength)","Type IV (extra high strength)"], answer:2, ex:"Type III covers high-stress single units and short spans; Type IV steps up for long-span FPDs, thin veneer crowns, and RPD frameworks.", src:'exam-hints'},
{id:'cc8', lec:'cast-crowns', type:'mcq', q:"A type IV casting alloy can be substituted for a type III application. Is the reverse true?", choices:["Yes, they're interchangeable in both directions","No — a type III alloy cannot be used for a type IV application","No alloy type can ever substitute for another","Only for anterior teeth"], answer:1, ex:"Type IV has the higher yield strength, so it covers type III uses; a weaker type III alloy is not strong enough for type IV's long-span/thin-section demands.", src:'lecture'},
{id:'cc9', lec:'cast-crowns', type:'sequence', q:"Put the lost-wax casting steps for a complete gold crown in the correct order.", steps:["Wax the crown pattern on the master die","Attach a wax sprue to the pattern and sprue base","Surround the pattern with investment inside the casting ring","Heat the ring in the burnout oven to eliminate the wax","Cast molten alloy into the mold under centrifugal force","Divest, cut off the sprue, finish and polish"], ex:"This is the loop the lecture calls out repeatedly: pattern → sprue → invest → burn out → cast → divest → finish.", src:'lecture'},
{id:'cc10', lec:'cast-crowns', type:'mcq', q:"Why is a properly made complete gold crown described in lecture as “by far our best, our best material” despite being rarely chosen today?", choices:["It is the cheapest option available","It has unmatched longevity and wears its opposing dentition the least of any restorative material","It requires no laboratory fabrication","It bonds chemically to enamel"], answer:1, ex:"Gold's wear compatibility with opposing teeth and multi-decade track record is why bruxers are still a textbook indication for a complete gold crown in a non-esthetic zone.", src:'lecture'},
{id:'cc11', lec:'cast-crowns', type:'mcq', q:"On a complete cast crown, when is a second-plane reduction of the buccal axial wall often unnecessary?", choices:["Only on maxillary canines","On mandibular molars with a relatively straight or slightly lingually inclined buccal profile","On all posterior teeth regardless of anatomy","Never — it is always required"], answer:1, ex:"Two-plane reduction avoids an over- or under-contoured crown by following the tooth's natural buccal contour; some mandibular molars don't need the extra plane.", src:'lecture'},
{id:'cc12', lec:'cast-crowns', type:'mcq', q:"What alternative to casting is now commonly used to fabricate complete gold crowns, at comparable or slightly lower cost?", choices:["3D printing (additive) of the final crown","Milling (subtractive CAD/CAM) of the gold alloy","Hand-carving from a gold ingot","Sintering gold powder like porcelain"], answer:1, ex:"Milling is subtractive (like zirconia) vs. 3D printing which is additive; full-arch metal printing exists for RPD frameworks but not yet routinely for crown-and-bridge gold.", src:'lecture'},

// ===== pfm-bio (10) =====
{id:'pb1', lec:'pfm-bio', type:'mcq', q:"Dental porcelain's “tri-axial composition” refers to a mandatory blend of three ingredients. What are they?", choices:["Zirconia, alumina, silica","Kaolin, quartz, feldspar","Gold, platinum, palladium","Gypsum, phosphate, silica"], answer:1, ex:"Kaolin (clay, up to ~3%), quartz (refractory, ~12–22%), and feldspar (~75–85%, the bulk) — leave one out and it isn't porcelain by definition.", src:'study-guide'},
{id:'pb2', lec:'pfm-bio', type:'mcq', q:"Which ingredient makes up the large majority (roughly 75–85%) of dental porcelain's tri-axial composition?", choices:["Kaolin","Quartz","Feldspar","Zirconium dioxide"], answer:2, ex:"Feldspar (a potassium or sodium aluminum silicate) is the bulk ingredient and the source of porcelain's leucite-forming, thermally-compatible chemistry.", src:'lecture'},
{id:'pb3', lec:'pfm-bio', type:'mcq', q:"After the tri-axial blend is fired to ~2000°F and quenched in chilled liquid, it shatters into small fragments. What is this raw material called before it's ball-milled into powder?", choices:["Frit","Slag","Clinker","Sinter"], answer:0, ex:"Frit is ball-milled down into the fine powder dental technicians mix with liquid to build up porcelain layer by layer.", src:'lecture'},
{id:'pb4', lec:'pfm-bio', type:'mcq', q:"Which of porcelain's two microscopic phases is responsible for dispersion strengthening — deflecting crack propagation through the material?", choices:["The glassy (amorphous) phase","The leucite (crystalline) phase","The oxide phase","The eutectic phase"], answer:1, ex:"Leucite crystals are so tightly ordered a crack can't pass through them and must deflect — the same principle as adding grain refiners to a metal.", src:'lecture'},
{id:'pb5', lec:'pfm-bio', type:'mcq', q:"Which porcelain phase gives the material its lifelike translucency, but is mechanically weak on its own?", choices:["The glassy (amorphous) phase","The leucite (crystalline) phase","The frit phase","The opaque phase"], answer:0, ex:"Light passes through the disordered, less-dense glass matrix — great for esthetics, but it needs the leucite phase for strength.", src:'lecture'},
{id:'pb6', lec:'pfm-bio', type:'mcq', q:"The process of firing porcelain into one continuous, void-free mass is called:", choices:["Annealing","Sintering","Pickling","Investing"], answer:1, ex:"Sintering happens roughly 850–1300°C; done under vacuum, it minimizes porosity far better than an open-air furnace.", src:'study-guide'},
{id:'pb7', lec:'pfm-bio', type:'mcq', q:"What is the single most effective way to minimize porosity when sintering porcelain?", choices:["Firing at the lowest possible temperature","Firing in open air for maximum oxygen exposure","Firing under vacuum","Firing without a coping present"], answer:2, ex:"Vacuum firing pulls trapped gas out of the porcelain as it sinters, versus open-air firing which locks porosity in.", src:'lecture'},
{id:'pb8', lec:'pfm-bio', type:'mcq', q:"For proper compression bonding between an alloy coping and its porcelain veneer, the alloy's coefficient of thermal expansion should be:", choices:["Identical to the porcelain's","Slightly lower than the porcelain's","Slightly higher than the porcelain's","Irrelevant to bond strength"], answer:2, ex:"On cooling, the alloy contracts slightly more than the porcelain, squeezing it into residual compressive stress — porcelain resists compression far better than tension or shear.", src:'study-guide'},
{id:'pb9', lec:'pfm-bio', type:'mcq', q:"Of the three porcelain–metal bonding mechanisms, which is the strongest?", choices:["Van der Waals forces","Mechanical retention (sandblasted roughness)","Chemical bonding through the oxide layer","Compression bonding alone"], answer:2, ex:"Chemical bonding between the metal's surface oxide and the opaque porcelain layer is by far the most significant contributor to bond strength.", src:'study-guide'},
{id:'pb10', lec:'pfm-bio', type:'sequence', q:"Rank the three porcelain–metal bonding mechanisms from strongest to weakest.", steps:["Chemical bonding (oxide layer)","Mechanical retention (surface roughness)","Van der Waals forces"], ex:"All three contribute, but chemical bonding through a thin, stable oxide layer does the most work.", src:'study-guide'},
{id:'pb11', lec:'pfm-bio', type:'mcq', q:"Trace elements like indium and tin are added to high-noble PFM alloys (which otherwise resist oxidation) mainly to:", choices:["Lower the alloy's density","Form the surface oxide layer that porcelain chemically bonds to","Whiten the alloy's color","Increase the alloy's ductility"], answer:1, ex:"Pure gold/platinum/palladium barely oxidize on their own — without a trace oxide-forming element, there'd be nothing for the porcelain to chemically bond to.", src:'lecture'},
{id:'pb12', lec:'pfm-bio', type:'recall', q:"Why must the oxide layer on a PFM coping be thin rather than thick, even though an oxide layer is required for bonding?", answer:"A thick oxide layer is itself the weakest link in the system — it can fracture internally (a cohesive failure within the oxide) and delaminate the porcelain, so the goal is a thin, uniform, stable oxide.", ex:"The lecture calls this a deliberate paradox: you need the oxide layer, but you don't want too much of it.", src:'lecture'},

// ===== fpd-pontic (11) =====
{id:'pd1', lec:'fpd-pontic', type:'mcq', q:"What does Ante's Law state?", choices:["The pontic span must never exceed 2 units","The periodontal (root) surface area of the abutment teeth should equal or exceed that of the teeth being replaced by pontics","Connectors must be at least 3mm in every dimension","Retainers must always outnumber pontics 2:1"], answer:1, ex:"Not evidence-based in the research sense, but a traditional, widely-followed clinical guideline for judging whether abutments can support a given span.", src:'exam-hints'},
{id:'pd2', lec:'fpd-pontic', type:'mcq', q:"What is the ideal crown-to-root ratio for an FPD abutment tooth, and what is the minimum acceptable ratio?", choices:["Ideal 1:1, minimum 2:1","Ideal 1:2, minimum 1:1","Ideal 2:1, minimum 1:2","Ideal 1:3, minimum 1:2"], answer:1, ex:"1:2 (more root in bone than crown above it) is ideal; 1:1 is the floor of acceptability, always weighed alongside periodontal health.", src:'lecture'},
{id:'pd3', lec:'fpd-pontic', type:'match', q:"Match each Siebert residual ridge defect class to its description.", pairs:[["Class I","Faciolingual (width) tissue loss, normal ridge height"],["Class II","Loss of ridge height, normal ridge width"],["Class III","Combined loss of both height and width"]], ex:"These classes help decide whether ridge augmentation is needed before an ovate or modified ridge-lap pontic will look natural.", src:'lecture'},
{id:'pd4', lec:'fpd-pontic', type:'mcq', q:"Which pontic design has zero tissue contact, a 2mm cleaning space underneath, and needs a connector at least 3mm tall?", choices:["Ovate","Conical","Sanitary / hygienic","Modified ridge lap"], answer:2, ex:"Best suited to non-esthetic, posterior, all-metal situations where oral hygiene access matters more than appearance.", src:'study-guide'},
{id:'pd5', lec:'fpd-pontic', type:'mcq', q:"Which pontic design should generally be avoided because its concave tissue-side surface can't be adequately cleaned?", choices:["Conical","Saddle / (full) ridge lap","Sanitary","Ovate"], answer:1, ex:"It overlaps the ridge on both facial and lingual sides, trapping plaque in a concavity that floss and brushes can't reach.", src:'lecture'},
{id:'pd6', lec:'fpd-pontic', type:'mcq', q:"Which is the most widely used pontic design, combining facial ridge overlap for esthetics with an accessible lingual surface?", choices:["Sanitary","Conical","Modified ridge lap","Saddle / full ridge lap"], answer:2, ex:"Its tissue contact should resemble the letter T — broad on the facial, narrowing to a point contact at the ridge crest.", src:'study-guide'},
{id:'pd7', lec:'fpd-pontic', type:'mcq', q:"Which pontic design contacts the ridge at a single central point and is generally reserved for mandibular posterior sites?", choices:["Ovate","Conical","Modified ridge lap","Sanitary"], answer:1, ex:"Its convex form is easy to keep clean, but on a broad ridge that single point contact can leave room for food impaction on either side.", src:'lecture'},
{id:'pd8', lec:'fpd-pontic', type:'mcq', q:"Which pontic design gives the most natural emergence profile — appearing to grow directly out of the gingiva — but requires socket preservation or soft-tissue conditioning ahead of time?", choices:["Sanitary","Saddle","Ovate","Conical"], answer:2, ex:"Its convex tissue surface sits in a conditioned soft-tissue depression; the provisional restoration is used to shape that depression during healing.", src:'study-guide'},
{id:'pd9', lec:'fpd-pontic', type:'recall', q:"After roughly one month of healing under an ovate pontic, how much relief (mm) should be created from the tissue when recontouring, and why is a sharp point on the tissue side a problem before then?", answer:"Recontour to roughly 1–1.5mm of relief. A point left on the tissue side concentrates pressure on the gingiva and bone, causing blanching and eventually bone resorption instead of healthy contact.", ex:"The tissue side is initially placed ~2.5mm apical to the facial gingival margin to shape the socket, then relieved once healing has stabilized.", src:'study-guide'},
{id:'pd10', lec:'fpd-pontic', type:'mcq', q:"What is the “Rule of 27” used to evaluate?", choices:["Minimum bone density for implant placement","Minimum connector cross-section for a zirconia FPD (height² × width ≥ 27)","Maximum number of pontics allowed in one arch","Minimum working days a lab needs for an FPD"], answer:1, ex:"It's a quick treatment-planning check: square the connector height, multiply by the width, and the FPD is only viable if that number clears 27.", src:'exam-hints'},
{id:'pd11', lec:'fpd-pontic', type:'mcq', q:"A BruxZir bridge connector measures 2mm high × 4mm wide. Using the Rule of 27 (height² × width), is this connector adequate?", choices:["Yes — the result is 32, above 27","No — the result is 16, below 27","Yes — height and width don't matter, only total volume","It cannot be evaluated without knowing the alloy type"], answer:1, ex:"2² × 4 = 16, which is under the 27 threshold — this connector needs to be redesigned (usually by adding height, since it's squared).", src:'study-guide'},
{id:'pd12', lec:'fpd-pontic', type:'mcq', q:"What is the minimum recommended connector height for a metal-ceramic (PFM) fixed partial denture framework?", choices:["1mm","3mm","5mm","7mm"], answer:1, ex:"Below ~3mm, a metal-ceramic connector risks flexing enough under function to chip the overlying porcelain.", src:'lecture'},
{id:'pd13', lec:'fpd-pontic', type:'mcq', q:"When are non-rigid connectors indicated instead of the standard rigid connector?", choices:["Whenever esthetics is the top priority","To relieve stress on long-span prostheses or accommodate poorly angulated abutments","Only in fully edentulous arches","Never — all FPD connectors must be rigid"], answer:1, ex:"Rigid connectors are the default; non-rigid designs are a workaround for specific mechanical situations, not a first choice.", src:'lecture'},
{id:'pd14', lec:'fpd-pontic', type:'mcq', q:"What must be true of the path of insertion when two abutment teeth on either end of an FPD have different long-axis inclinations?", choices:["It doesn't matter — each retainer can have its own path","Both preparations must be modified to share a single common path of insertion","Only the more tipped tooth needs modification","The FPD should be cemented in two separate pieces"], answer:1, ex:"An FPD is one rigid piece, so both retainers must seat along the same path — verified clinically with a mirror checking for an even 360° margin gap.", src:'lecture'},

// ===== trios (12) =====
{id:'tr1', lec:'trios', type:'mcq', q:"How often should a TRIOS scanner be 3D-calibrated under normal use?", choices:["Every day","Every 7 days","Every 30 days","Only once, at installation"], answer:1, ex:"The software auto-reminds after 7 days; color calibration has its own 30-day validity window before shade measurement is disabled.", src:'lecture'},
{id:'tr2', lec:'trios', type:'mcq', q:"On a mandibular arch scan, which surface is scanned right after the occlusal, and why is it tackled early?", choices:["Buccal, because it's easiest","Lingual, because it has tongue and saliva interference to manage","Facial, because of lip obstruction","Distal, because patients open widest early on"], answer:1, ex:"For the lower arch you go occlusal → lingual (deal with the tongue/saliva challenge first) → back around to buccal.", src:'lecture'},
{id:'tr3', lec:'trios', type:'mcq', q:"For a maxillary arch scan, what is described as “the most annoying part” that you should get out of the way first?", choices:["The palate","The lip","The lingual of the molars","The incisal edges"], answer:1, ex:"Upper arch order is occlusal → buccal (fight past the lip) → circle back to the lingual/palatal.", src:'lecture'},
{id:'tr4', lec:'trios', type:'recall', q:"How many scanner “clicks” should you wait for before moving the scanner, to establish a good starting point?", answer:"About 5 clicks (roughly 3–5 in the TRIOS review PDF) before beginning to move the scanner steadily.", ex:"Rushing this step is a common reason a scan loses its alignment early and has to restart.", src:'lecture'},
{id:'tr5', lec:'trios', type:'mcq', q:"What is the recommended distance to keep the TRIOS scanner tip from the tooth surface while scanning?", choices:["Touching the tooth at all times","0–5mm","10–15mm","20mm or more"], answer:1, ex:"0–5mm, moving slowly and smoothly — occasional light contact with the tooth is acceptable.", src:'lecture'},
{id:'tr6', lec:'trios', type:'mcq', q:"What does the TRIOS “Direction” tool primarily help you evaluate?", choices:["Shade match accuracy","Undercuts and path of insertion","Occlusal contact timing","Margin depth below the gingiva"], answer:1, ex:"Especially useful for RPD retentive areas and for spotting undercuts on crown preps before the case is sent to the lab.", src:'lecture'},
{id:'tr7', lec:'trios', type:'mcq', q:"On the TRIOS Analyze screen, what does a red area indicate when using the Clearance tool?", choices:["Excess unscanned tissue","Insufficient interocclusal clearance for the restorative material","A detected margin line","An area with a good shade match"], answer:1, ex:"Green typically shows adequate clearance (e.g., ~2mm); red flags where more reduction is needed before the material can be fabricated to spec.", src:'lecture'},
{id:'tr8', lec:'trios', type:'sequence', q:"Put these steps of a single-crown TRIOS scan workflow in order.", steps:["Set up the case (patient, tooth, anatomy, material) in the software","Scan the opposing (antagonist) arch first","Scan the prep arch: occlusal, then lingual/buccal, capturing the margin","Mark the preparation (Mark Tooth) and fill any flagged gaps","Take the bite scan to align both arches","Analyze clearance and mark the margin line, then post-process and send"], ex:"Scanning the opposing arch first buys time for retraction cord/hemostatic methods to work before you scan the prep itself.", src:'lecture'},

// ===== investments (13-1) =====
{id:'inv1', lec:'investments', type:'mcq', q:"Every dental investment material is composed of which three components?", choices:["Refractory material, binder, other chemical modifiers","Gypsum, wax, water","Silica, gold, phosphate","Quartz, porcelain, resin"], answer:0, ex:"The refractory (usually a silica polymorph) provides high-temperature stability and expansion; the binder holds it together as a coherent mass; small chemical additives fine-tune behavior.", src:'study-guide'},
{id:'inv2', lec:'investments', type:'mcq', q:"Gypsum-bonded investment is limited to alloys that cast below what temperature?", choices:["500°C","700°C","900°C","1300°C"], answer:1, ex:"Above 700°C the calcium sulfate binder decomposes into sulfur dioxide/trioxide gases, embrittling the casting — that's why gypsum-bonded investment is limited to low-fusing gold alloys.", src:'exam-hints'},
{id:'inv3', lec:'investments', type:'mcq', q:"Which investment type uses an acid–base reaction between monoammonium phosphate and magnesia (MgO) as its binder, and is used for high-fusing metal-ceramic alloys?", choices:["Gypsum-bonded investment","Phosphate-bonded investment","Silica (ethyl silicate)-bonded investment","Agar-bonded investment"], answer:1, ex:"Phosphate-bonded investment is mixed with a special colloidal-silica liquid (not plain water) to achieve the extra mold expansion base-metal alloys need.", src:'study-guide'},
{id:'inv4', lec:'investments', type:'mcq', q:"Which investment type is used specifically for fabricating high-fusing base-metal removable partial denture frameworks?", choices:["Gypsum-bonded investment","Phosphate-bonded investment","Silica (ethyl silicate)-bonded investment","Alginate-bonded investment"], answer:2, ex:"An RPD wax-up on a refractory cast can't be 'picked up' off a die the way a crown pattern can, so the whole cast is invested — typically in an ethyl-silicate-bonded material.", src:'lecture'},
{id:'inv5', lec:'investments', type:'mcq', q:"Investment mold expansion compensates for alloy solidification shrinkage through which two mechanisms?", choices:["Sublimation and oxidation","Thermal (displacive) expansion of the refractory, and hygroscopic expansion","Vacuum firing and pickling","Sandblasting and cold working"], answer:1, ex:"The refractory's phase-transition (displacive) expansion at high temperature, plus hygroscopic expansion if the mold sets underwater, both counteract the binder's contraction and the alloy's shrinkage.", src:'study-guide'},
{id:'inv6', lec:'investments', type:'mcq', q:"What is the typical shrinkage range for most dental casting alloys as they solidify and cool to room temperature?", choices:["0.1–0.3%","1.25–2.5%","5–10%","15–20%"], answer:1, ex:"Small in absolute terms, but large relative to the ~50-micron fit tolerance dentistry demands — hence all the engineering around compensating expansion.", src:'study-guide'},
{id:'inv7', lec:'investments', type:'mcq', q:"Base metal alloys shrink ___ during casting compared to noble metal alloys, requiring investments with more expansion to compensate.", choices:["Less","About the same","More","Shrinkage direction is reversed"], answer:2, ex:"Base metal alloys shrink more, which is exactly why phosphate- and silica-bonded investments (used for base metals) are engineered for greater mold expansion.", src:'lecture'},
{id:'inv8', lec:'investments', type:'recall', q:"Name the four polymorphic forms of silica (SiO₂) that can serve as the refractory component of a dental investment.", answer:"Quartz, tridymite, cristobalite, and fused quartz.", ex:"Same chemical formula, different atomic arrangements — cristobalite has the highest thermal expansion of the group, fused quartz the lowest.", src:'lecture'},
{id:'inv9', lec:'investments', type:'mcq', q:"The sudden, non-linear expansion of quartz/cristobalite at a specific temperature is called “displacive transition.” What is actually happening at the atomic level?", choices:["Atoms are being added to the lattice from the binder","A phase change from the low-temperature alpha form to the high-temperature beta form, without breaking interatomic bonds","The material melts and re-solidifies","Oxygen is stripped from the silica lattice"], answer:1, ex:"It's a rearrangement of the existing lattice (alpha → beta), not a chemical reaction — which is why it can be relied on repeatably for expansion.", src:'lecture'},
{id:'inv10', lec:'investments', type:'mcq', q:"If a technician uses more water than the manufacturer specifies when mixing gypsum-bonded investment, what is the main consequence?", choices:["Faster setting and more expansion","Weaker investment and reduced expansion","No measurable effect on the mix","The investment cannot be poured"], answer:1, ex:"Just like dental stone, exceeding the specified water/powder ratio weakens the set material and undermines the controlled expansion the casting depends on.", src:'lecture'},
{id:'inv11', lec:'investments', type:'mcq', q:"Ethyl-silicate (silica-bonded) investment is chosen for RPD frameworks mainly because:", choices:["It is the cheapest investment available","Cobalt-chromium's high fusing temperature and the impossibility of 'picking up' a full-arch wax-up require investing the whole refractory cast","It sets faster than gypsum-bonded investment","It doesn't require a burnout oven"], answer:1, ex:"An RPD wax-up covers the whole arch on a duplicated refractory cast — unlike a single crown die, there's no way to lift just the pattern free before investing.", src:'lecture'},
{id:'inv12', lec:'investments', type:'mcq', q:"Which investment property is being tested when a technician checks that the mold can withstand the molten alloy being flung into it without cracking?", choices:["Porosity","Sufficient strength / high-impact resistance","Ease of divestment","Setting expansion"], answer:1, ex:"One of the core requirement properties of any investment — alongside easy manipulation, high-temperature stability, adequate expansion, porosity, a smooth resulting surface, and low cost.", src:'study-guide'},

// ===== solder-weld (13-2) =====
{id:'sw1', lec:'solder-weld', type:'mcq', q:"What is the functional purpose of a sprue in the casting process?", choices:["It forms the crown's occlusal anatomy","It provides a conduit/channel for molten alloy to flow into the mold space","It measures the die spacer thickness","It anchors the casting ring to the bench"], answer:1, ex:"The sprue is sacrificial — it's cut off and polished away after casting, having done its one job of channeling molten alloy in.", src:'study-guide'},
{id:'sw2', lec:'solder-weld', type:'mcq', q:"Where should the sprue be attached to the wax pattern?", choices:["At the margin, for easiest removal","At the bulkiest portion of the pattern (e.g., a cusp tip)","At the thinnest portion, to save material","Anywhere — placement doesn't affect the casting"], answer:1, ex:"Attaching at the bulkiest area gives the alloy unobstructed access to all margins and reduces turbulence as it flows in.", src:'study-guide'},
{id:'sw3', lec:'solder-weld', type:'mcq', q:"How far (maximum) should the top of the wax pattern sit from the open end of the casting ring, to let burnout gases escape?", choices:["2mm","6mm","12mm","20mm"], answer:1, ex:"Too much investment bulk above the pattern traps burnout gases; 6mm keeps the ring compact enough for them to vent.", src:'study-guide'},
{id:'sw4', lec:'solder-weld', type:'mcq', q:"“Suckback porosity” at a crown margin is caused by:", choices:["Using too little investment liquid","An improper solidification sequence — the margin should freeze first, not the sprue/reservoir","Overheating the casting ring too slowly","Using a gypsum-bonded investment for a base metal alloy"], answer:1, ex:"The reservoir bulb is designed to be the LAST area to solidify, continuously feeding molten alloy to the margin so it freezes first and doesn't pull away (shrink) from the die.", src:'lecture'},
{id:'sw5', lec:'solder-weld', type:'mcq', q:"“Casting fins” — thin flashes of alloy on an otherwise clean casting — are caused by:", choices:["Too much wax elimination time","Cracks in the investment from uneven heating (e.g., placing a cold ring straight into a preheated oven)","Using the reducing zone of the torch","Overpolishing the final casting"], answer:1, ex:"Investment is a poor heat conductor; if the outer ring heats and expands faster than the core, the mismatch cracks the investment and molten alloy fills the crack.", src:'study-guide'},
{id:'sw6', lec:'solder-weld', type:'mcq', q:"In an oxyacetylene torch flame, which zone should the alloy be melted in?", choices:["Zone 1, the mixing zone","Zone 2, the combustion zone","Zone 3, the reducing zone","Zone 4, the oxidation zone"], answer:2, ex:"The reducing zone has used up available oxygen, so the molten alloy isn't oxidized while melting — melt it in the oxidation zone and you get a dull, blackened casting.", src:'lecture'},
{id:'sw7', lec:'solder-weld', type:'mcq', q:"What is the precise temperature-based distinction between brazing and soldering?", choices:["Brazing uses a filler metal, soldering does not","Brazing occurs above 450°C, soldering below 450°C — both use a third filler metal","Soldering is only for gold, brazing only for base metals","There is no real distinction; the terms are unrelated"], answer:1, ex:"Almost everything called 'soldering' in dentistry is technically brazing by this definition, since dental joins are done well above 450°C.", src:'exam-hints'},
{id:'sw8', lec:'solder-weld', type:'mcq', q:"How does welding differ from brazing/soldering?", choices:["Welding always requires a flux, brazing never does","Welding fuses the parent metals directly (with or without a filler of the SAME alloy); brazing/soldering always uses a dissimilar third filler metal","Welding only works below 450°C","Welding cannot be used on titanium"], answer:1, ex:"Titanium is the classic dental welding case — its reactive oxide layer makes brazing unreliable, so the parent metal itself is fused.", src:'exam-hints'},
{id:'sw9', lec:'solder-weld', type:'mcq', q:"Which elements should be avoided in a solder used on a PFM framework, because they discolor the porcelain green?", choices:["Gold and platinum","Silver and copper","Tin and zinc","Palladium and indium"], answer:1, ex:"Ag and Cu interacting with the ceramic during firing cause the 'greening' effect — a cosmetic failure mode specific to PFM soldering.", src:'lecture'},
{id:'sw10', lec:'solder-weld', type:'mcq', q:"Pre-ceramic soldering of a PFM framework is performed at a ___ melting temperature than post-ceramic soldering.", choices:["Lower","Higher","Identical","Random, alloy-dependent"], answer:1, ex:"Pre-ceramic solder can run hot (roughly 1000–1150°C) since no porcelain is on the framework yet; post-ceramic solder must stay well below the porcelain's pyroplastic-flow temperature so it doesn't melt the ceramic that's already fired.", src:'lecture'},
{id:'sw11', lec:'solder-weld', type:'mcq', q:"What is the purpose of a flux in a soldering/brazing procedure?", choices:["To limit the flow of solder to a small area","To reduce oxidation, dissolve existing oxides/impurities, and increase wetting of the solder on the metal","To harden the finished joint","To color-match the solder to the alloy"], answer:1, ex:"Flux is chosen by alloy family: borax-based fluxes for noble alloys, potassium-fluoride-based fluxes to dissolve the tougher chromium oxide on base-metal alloys.", src:'study-guide'},
{id:'sw12', lec:'solder-weld', type:'mcq', q:"What is the purpose of an anti-flux (e.g., graphite pencil, rouge, or chalk) in soldering?", choices:["To increase flux penetration into the joint","To prevent the flux (and molten solder) from spreading beyond the intended joint area","To clean the metal surface before fluxing","To speed up torch heating"], answer:1, ex:"Anti-flux is painted around the joint so the flux — and the solder it draws in — stays confined to where the join is actually needed.", src:'study-guide'},
{id:'sw13', lec:'solder-weld', type:'mcq', q:"What material is used to “pick up” sectioned PFM copings intraorally (verifying passive fit) before they're re-invested and soldered in the lab?", choices:["Impression plaster","GC pattern resin (a fast-setting acrylic, similar to jet acrylic)","Alginate","Casting wax"], answer:1, ex:"The copings are joined chairside with pattern resin, picked up in a PVS impression, and poured up — guaranteeing the lab's new model reflects a passive, accurate fit rather than the shrinkage-distorted original casting.", src:'lecture'},
{id:'sw14', lec:'solder-weld', type:'recall', q:"What is “pickling,” and which acid is typically used for noble alloys?", answer:"Pickling is dropping the freshly cast, oxide-covered restoration into an acid bath to dissolve surface oxides/impurities before finishing; noble metals are commonly pickled in dilute (about 50%) sulfuric acid.", ex:"Use rubber-coated or Teflon tweezers — metal tweezers dropped in the pickle can plate onto the casting.", src:'lecture'},

// ===== alloy-systems (13-3) =====
{id:'as1', lec:'alloy-systems', type:'mcq', q:"What minimum weight-percent of gold is required for a dental alloy to be classified “high noble” under the ADA system?", choices:["25%","40%","60%","85%"], answer:1, ex:"High noble also requires ≥60% total noble metal content — the gold-specific threshold is what trips up test questions that just give total noble %.", src:'exam-hints'},
{id:'as2', lec:'alloy-systems', type:'mcq', q:"What is the minimum noble-metal content required for an alloy to qualify simply as “noble” (not high noble), with no gold requirement?", choices:["10%","25%","40%","50%"], answer:1, ex:"≥25% of ANY noble metal(s) — gold, platinum, palladium, iridium, rhodium, osmium, or ruthenium — qualifies as noble; below that, it's a predominantly base metal alloy.", src:'exam-hints'},
{id:'as3', lec:'alloy-systems', type:'recall', q:"Name all seven metals classified as “noble” in dentistry.", answer:"Gold (Au), Platinum (Pt), Palladium (Pd), Iridium (Ir), Rhodium (Rh), Osmium (Os), Ruthenium (Ru).", ex:"Silver is a precious metal but is deliberately excluded from this list.", src:'study-guide'},
{id:'as4', lec:'alloy-systems', type:'mcq', q:"Why is silver NOT classified as a noble metal in dentistry, despite being a precious metal?", choices:["It's too soft to be useful in alloys","It corrodes/tarnishes considerably in the oral cavity","It's too expensive to include","It doesn't melt at oral-relevant temperatures"], answer:1, ex:"Nobility in this context means chemically non-reactive/resistant to corrosion — silver fails that test in the mouth, even though it's economically 'precious.'", src:'study-guide'},
{id:'as5', lec:'alloy-systems', type:'mcq', q:"Iridium, ruthenium, and rhodium are added to noble alloys in very small (parts-per-million) quantities. What is their role?", choices:["Grain refiners — they seed smaller grains that improve mechanical properties","Oxide formers — they create the bonding layer for porcelain","Flux agents — they lower the alloy's melting point","Colorants — they control the alloy's final hue"], answer:0, ex:"Their very high melting points let them act as nucleating sites during solidification, refining grain size and boosting tensile strength.", src:'exam-hints'},
{id:'as6', lec:'alloy-systems', type:'mcq', q:"What effect does a smaller grain size generally have on a cast dental alloy's mechanical properties?", choices:["Weakens it and increases porosity","Improves strength/mechanical properties","Has no measurable effect","Only affects color, not strength"], answer:1, ex:"This is the whole rationale for adding grain refiners — finer grains resist deformation and crack propagation better than coarse ones.", src:'lecture'},
{id:'as7', lec:'alloy-systems', type:'mcq', q:"What does “fineness” measure, and how is it more precise than the carat system?", choices:["Grain size, measured in microns","Parts of gold per 1000 parts of the alloy (vs. carat's coarser 24ths)","Surface roughness after polishing","The percentage of base metal content"], answer:1, ex:"750 fine = 750/1000 = 75% gold by weight, exactly matching 18 karat — but fineness can express finer gradations than the 24-step carat scale.", src:'study-guide'},
{id:'as8', lec:'alloy-systems', type:'mcq', q:"A solder is stamped “809 fine.” What percentage of the alloy, by weight, is gold?", choices:["8.09%","80.9%","0.809%","809%, expressed as a ratio"], answer:1, ex:"Fineness is parts-per-1000, so 809 fine = 80.9% gold, with the remainder split among silver, copper, tin, and zinc.", src:'lecture'},
{id:'as9', lec:'alloy-systems', type:'match', q:"Match each cast alloy system type to a dental application associated with it.", pairs:[["Solid solution alloy","Gold–copper crown/inlay alloys — highly biocompatible, single phase"],["Eutectic alloy","High-copper amalgam powder & Ni–Cr Maryland bridge frameworks"],["Peritectic alloy","Set (final, triturated) dental amalgam — the most brittle phase seen in dentistry"]], ex:"Solid solution = one phase, fully miscible; eutectic = multiple phases with a single sharp melting point; peritectic = a new intermetallic compound forms.", src:'study-guide'},
{id:'as10', lec:'alloy-systems', type:'mcq', q:"What defines a solid solution alloy like gold–copper at the microscopic level?", choices:["Complete miscibility of the alloying elements in both the solid and liquid states (single phase)","Two distinct grain populations, one of each metal","A brittle intermetallic compound forming between the two metals","Alloying elements that separate completely on cooling"], answer:0, ex:"Because it stays a single, uniform phase even after solidifying, it's the most biocompatible cast alloy category — but also the softest/most ductile of the three types.", src:'study-guide'},

/* --------------------------------------------------------------------
   STATE — one versioned object, one write path
   -------------------------------------------------------------------- */
const STATE_KEY = 'lost-wax-state-v1';
function defaultState(){
  return {
    seen:{}, correctEver:{}, lastCorrect:{},
    streak:0, bestStreak:0, totalCorrect:0, totalAttempts:0,
    perLecture:{}, achievements:{},
    game:{ visited:{}, cleared:{}, xp:0, lastZone:null },
    theme:'system',
  };
}
function loadState(){
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); }catch(e){ saved = {}; }
  const base = defaultState();
  const merged = Object.assign({}, base, saved);
  merged.perLecture = Object.assign({}, base.perLecture, saved.perLecture || {});
  merged.game = Object.assign({}, base.game, saved.game || {});
  merged.achievements = Object.assign({}, base.achievements, saved.achievements || {});
  return merged;
}
function saveState(){
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }catch(e){ /* private mode etc. */ }
}
let STATE = loadState();

function lecStats(lecId){
  const qs = QUESTIONS_BY_LECTURE[lecId] || [];
  const correct = qs.filter(q => STATE.correctEver[q.id]).length;
  return { total: qs.length, correct, pct: qs.length ? Math.round(100*correct/qs.length) : 0 };
}
function overallStats(){
  const total = QUESTIONS.length;
  const correct = QUESTIONS.filter(q => STATE.correctEver[q.id]).length;
  return { total, correct, pct: total ? Math.round(100*correct/total) : 0 };
}

function recordAnswer(qid, lecId, correct){
  STATE.seen[qid] = (STATE.seen[qid]||0) + 1;
  STATE.lastCorrect[qid] = correct;
  if(correct) STATE.correctEver[qid] = true;
  STATE.totalAttempts++;
  if(correct){ STATE.totalCorrect++; STATE.streak++; STATE.bestStreak = Math.max(STATE.bestStreak, STATE.streak); }
  else { STATE.streak = 0; }
  if(!STATE.perLecture[lecId]) STATE.perLecture[lecId] = {attempts:0, correct:0};
  STATE.perLecture[lecId].attempts++;
  if(correct) STATE.perLecture[lecId].correct++;
  saveState();
  const unlocked = checkAchievements();
  document.dispatchEvent(new CustomEvent('lostwax:answered', {detail:{qid, lecId, correct}}));
  unlocked.forEach(showAchievementToast);
}

function checkAchievements(){
  const newly = [];
  ACHIEVEMENTS.forEach(a => {
    if(STATE.achievements[a.id]) return;
    let met = false;
    const c = a.cond;
    if(c.type === 'totalCorrect') met = STATE.totalCorrect >= c.n;
    else if(c.type === 'streak') met = STATE.bestStreak >= c.n;
    else if(c.type === 'topicPercent') met = c.lecs.every(lec => lecStats(lec).pct >= c.pct && lecStats(lec).total > 0);
    else if(c.type === 'allCleared') met = QUESTIONS.every(q => STATE.correctEver[q.id]);
    else if(c.type === 'questionSet') met = c.ids.every(id => STATE.correctEver[id]);
    if(met){ STATE.achievements[a.id] = Date.now(); newly.push(a); }
  });
  if(newly.length) saveState();
  return newly;
}
function showAchievementToast(a){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="ic">'+a.icon+'</span><span><b>Achievement unlocked</b>'+a.name+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 5200);
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function qCardHTML(q){
  const lec = LECTURE_BY_ID[q.lec];
  const srcLabel = SRC_LABEL[q.src] || q.src;
  const head = '<div class="qcard-head"><span class="qcard-type">'+q.type+' &middot; <span class="dot-'+lec.tag+'">&#9679;</span> '+esc(lec.title)+'</span></div>';
  const foot = '<span class="qcard-src">Source: '+esc(srcLabel)+'</span>';

  if(q.type === 'mcq'){
    const choices = q.choices.map((c,i)=>'<button class="qchoice" data-i="'+i+'">'+esc(c)+'</button>').join('');
    return '<div class="qcard" data-qid="'+q.id+'" data-lec="'+q.lec+'" data-type="mcq" data-answer="'+q.answer+'">'+head+
      '<p class="qcard-q">'+esc(q.q)+'</p><div class="qcard-choices">'+choices+'</div>'+
      '<div class="qcard-explain" hidden>'+esc(q.ex)+'</div>'+foot+'</div>';
  }
  if(q.type === 'recall'){
    return '<div class="qcard" data-qid="'+q.id+'" data-lec="'+q.lec+'" data-type="recall">'+head+
      '<p class="qcard-q">'+esc(q.q)+'</p>'+
      '<div class="recall-body"><button class="recall-reveal">Reveal answer</button></div>'+
      '<div class="recall-payload" hidden><strong>'+esc(q.answer)+'</strong><div class="qcard-explain">'+esc(q.ex)+'</div>'+
      '<div class="qcard-foot"><button class="btn small got-it" data-ok="1">I had it right</button><button class="btn small ghost got-it" data-ok="0">I missed it</button></div></div>'+
      foot+'</div>';
  }
  if(q.type === 'sequence'){
    const shuffled = q.steps.map((s,i)=>({s,i})).sort(()=>Math.random()-0.5);
    const items = shuffled.map(o=>'<li class="seq-item" data-correct-i="'+o.i+'">'+esc(o.s)+'</li>').join('');
    return '<div class="qcard" data-qid="'+q.id+'" data-lec="'+q.lec+'" data-type="sequence" data-len="'+q.steps.length+'">'+head+
      '<p class="qcard-q">'+esc(q.q)+' <span style="font-weight:400;color:var(--ink-faint);font-size:12.5px;">(click in the correct order)</span></p>'+
      '<ol class="seq-list">'+items+'</ol>'+
      '<div class="qcard-foot"><button class="btn small seq-reset">Reset order</button></div>'+
      '<div class="qcard-explain" hidden>'+esc(q.ex)+'</div>'+foot+'</div>';
  }
  if(q.type === 'match'){
    const lefts = q.pairs.map((p,i)=>({t:p[0], i})).sort(()=>Math.random()-0.5);
    const rights = q.pairs.map((p,i)=>({t:p[1], i})).sort(()=>Math.random()-0.5);
    const lcol = lefts.map(o=>'<button class="match-item" data-side="l" data-pair-i="'+o.i+'">'+esc(o.t)+'</button>').join('');
    const rcol = rights.map(o=>'<button class="match-item" data-side="r" data-pair-i="'+o.i+'">'+esc(o.t)+'</button>').join('');
    return '<div class="qcard" data-qid="'+q.id+'" data-lec="'+q.lec+'" data-type="match" data-pairs="'+q.pairs.length+'" data-matched="0">'+head+
      '<p class="qcard-q">'+esc(q.q)+'</p>'+
      '<div class="match-grid"><div class="match-col">'+lcol+'</div><div class="match-col">'+rcol+'</div></div>'+
      '<div class="qcard-explain" hidden>'+esc(q.ex)+'</div>'+foot+'</div>';
  }
  return '';
}
