/* ===================================================================
   MSK EXAM 4 HUB — tokens
   Palette "dermis & myoglobin": a warm skin-toned ground, myoglobin crimson accent, melanin amber.
   Type: Newsreader (display, quotes) · Instrument Sans (body) · IBM Plex Mono (labels).
   =================================================================== */
:root{
  color-scheme: light;
  --bg:#f7f1ee; --surface:#fffcfa; --surface-2:#f2e6e0; --surface-3:#e9d9d0;
  --ink:#26191c; --ink-soft:#634f53; --ink-faint:#76626a; --line:#e5d3cb; --line-strong:#cfb7ac;
  --accent:#8f2d4c; --accent-ink:#7a2440; --accent-soft:#f5dbe3;
  --good:#2f7a4f; --good-soft:#dcefe2; --bad:#b33a2c; --bad-soft:#f7ded8; --caution:#9a6412; --caution-soft:#f6e8c9;
  --tag-amber:#b0741a; --tag-sage:#57834f; --tag-blue:#3c6c9c; --tag-teal:#23807b; --tag-violet:#6f52a3; --tag-red:#b13a2e; --tag-green:#4d7a22; --tag-rose:#bb4369;
  --tag-amber-soft:#f5e6c8; --tag-sage-soft:#e1ecdc; --tag-blue-soft:#dce7f2; --tag-teal-soft:#d6ecea; --tag-violet-soft:#e7e0f2; --tag-red-soft:#f5dcd8; --tag-green-soft:#e2ecd2; --tag-rose-soft:#f5dbe3;
  --shadow:0 1px 2px rgba(70,30,40,.06), 0 4px 14px rgba(70,30,40,.07);
  --radius:12px;
  --font-display:'Newsreader', Georgia, serif;
  --font-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --font-arcade:'Press Start 2P', 'Courier New', monospace;
  /* Arcade: one fixed world regardless of theme */
  --ar-bg:#120f24; --ar-panel:#1d1838; --ar-panel-2:#282050; --ar-ink:#f4f1ff; --ar-dim:#a79fcf; --ar-line:#3b3270;
  --ar-yellow:#ffd23f; --ar-pink:#ff5c8a; --ar-cyan:#3fe0d0; --ar-green:#7ee36b; --ar-orange:#ff9b3f; --ar-violet:#a98bff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#171113; --surface:#21191c; --surface-2:#2b2125; --surface-3:#372a2f;
    --ink:#f3e9eb; --ink-soft:#c3b0b4; --ink-faint:#9c888f;--lec-num-ink:#1a1114; --line:#3d2f34; --line-strong:#524047;
    --accent:#ec8aa6; --accent-ink:#f5a6bd; --accent-soft:#45212d;
    --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
    --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9d8; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6;
    --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3a; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#171113; --surface:#21191c; --surface-2:#2b2125; --surface-3:#372a2f;
  --ink:#f3e9eb; --ink-soft:#c3b0b4; --ink-faint:#9c888f;--lec-num-ink:#1a1114; --line:#3d2f34; --line-strong:#524047;
  --accent:#ec8aa6; --accent-ink:#f5a6bd; --accent-soft:#45212d;
  --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
  --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9d8; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6;
  --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3a; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important;} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--font-mono)}
[hidden]{display:none!important}

/* ---------- header ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.hub-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px;padding:12px 20px 0}
.hub-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hub-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.hub-title h1{font-family:var(--font-display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;margin:0}
.hub-subtitle{color:var(--ink-soft);font-size:.86rem}
.hub-back-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;align-self:center;text-decoration:none;transition:border-color .15s,color .15s}
.hub-back-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-back-btn svg{width:16px;height:16px}
.hub-name-pill{appearance:none;cursor:pointer;font-family:var(--font-body);background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.hub-name-pill:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
.pill.countdown{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:30px;cursor:pointer}
#modeSwitch{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
#modeSwitch::-webkit-scrollbar{display:none}
#modeSwitch button{border:0;background:transparent;padding:9px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px;white-space:nowrap}
#modeSwitch button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#modeSwitch button:hover{color:var(--ink)}
#modeSwitch .mode-icon{font-size:1.05rem}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{border-bottom-color:var(--ar-pink)}
main{padding-top:20px}
.hub-footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.82rem}

/* ---------- sub-tabs ---------- */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.subtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink-soft)}
.subtab.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border:1px solid var(--caution);background:var(--caution-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.notice b{color:var(--caution)}

/* ---------- lecture notes ---------- */
.notes-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
.lec-nav{display:flex;flex-direction:column;gap:6px;min-width:0;position:sticky;top:66px;align-self:start}
.lec-nav button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;cursor:pointer;min-width:0}
.lec-nav button.is-active{border-color:var(--ink);box-shadow:var(--shadow)}
.lec-num{font-family:var(--font-mono);font-size:.75rem;font-weight:700;padding:2px 6px;border-radius:6px;color:var(--lec-num-ink,#fff);flex:none;margin-top:2px}
.lec-nav .t{font-size:.86rem;font-weight:600;line-height:1.3}
.lec-nav .w{font-size:.74rem;color:var(--ink-faint)}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);min-width:0}
.reading h2{font-family:var(--font-display);font-size:1.6rem;margin:0 0 4px;line-height:1.2}
.reading .meta{color:var(--ink-faint);font-size:.82rem;margin-bottom:16px}
.reading h4{font-family:var(--font-display);font-size:1.12rem;margin:22px 0 6px}
.reading p{margin:0 0 12px;max-width:74ch}
.reading-note{background:var(--caution-soft);border-left:3px solid var(--caution);padding:8px 12px;border-radius:6px;font-size:.88rem}
.reading-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.status-badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.status-badge.taught{background:var(--good-soft);color:var(--good)}
.status-badge.slides{background:var(--caution-soft);color:var(--caution)}

/* tag colors */
.tag-amber{--t:var(--tag-amber);--ts:var(--tag-amber-soft)} .tag-sage{--t:var(--tag-sage);--ts:var(--tag-sage-soft)} .tag-blue{--t:var(--tag-blue);--ts:var(--tag-blue-soft)} .tag-teal{--t:var(--tag-teal);--ts:var(--tag-teal-soft)}
.tag-violet{--t:var(--tag-violet);--ts:var(--tag-violet-soft)} .tag-red{--t:var(--tag-red);--ts:var(--tag-red-soft)} .tag-green{--t:var(--tag-green);--ts:var(--tag-green-soft)} .tag-rose{--t:var(--tag-rose);--ts:var(--tag-rose-soft)}
.lec-num{background:var(--t)}
.lec-chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ts);color:var(--t);white-space:nowrap}

/* ---------- question cards ---------- */
.qfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qfilters select,.qfilters input{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0}
.qfilters input{flex:1 1 200px}
.qcount{color:var(--ink-faint);font-size:.84rem;margin-bottom:10px}
.rv-set{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:var(--accent-soft,var(--surface-2));border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.rv-set b{display:block}
.rv-set span{color:var(--ink-soft)}
.qlist{display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--t, var(--line))}
.qcard-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.src-chip{font-family:var(--font-mono);font-size:.68rem;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-soft)}
.qcard-stem{font-weight:600;margin:0 0 12px}
.qcard-choices,.qcard-seq-steps{display:flex;flex-direction:column;gap:7px}
.qcard-choice,.qcard-match-item{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;line-height:1.35}
.qcard-choice:hover,.qcard-match-item:hover{border-color:var(--ink)}
.qcard-choice.is-correct,.qcard-match-item.is-matched{background:var(--good-soft);border-color:var(--good)}
.qcard-choice.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.qcard-choice.is-picked{background:var(--surface-2);border-color:var(--ink)}
.qcard-choice .ord{font-family:var(--font-mono);font-weight:700;margin-right:8px;color:var(--accent-ink)}
.qcard-seq-tools{display:flex;gap:8px;margin-top:8px}
.qcard-seq-tools[hidden],.qcard.is-answered .qcard-seq-tools{display:none}
.qcard-seq-tools button{font:inherit;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.qcard-seq-tools button:hover{border-color:var(--ink)}
.qcard-choice:disabled{cursor:default}
.qcard-match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard-match-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.qcard-match-item.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qcard-match-item.is-wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qcard-hint{font-size:.8rem;color:var(--ink-faint);margin-bottom:8px}
.qcard-explain{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.qcard.is-answered .qcard-explain{display:block}
.qx-cue{display:none;margin-top:9px;padding:8px 11px;border-radius:8px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.qx-cue svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:var(--accent-ink)}
.qx-cue b{color:var(--accent-ink)}
.qcard.is-missed .qx-cue{display:block}
.qcard-verdict{font-weight:700;margin-right:6px}
.qcard-verdict.ok{color:var(--good)} .qcard-verdict.bad{color:var(--bad)}
.qcard-classdata-row{margin-top:8px}
.qcard-classdata-result{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)}
.qcard-classdata-result.is-bad{color:var(--bad)} .qcard-classdata-result.is-ok{color:var(--good)}
.qcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent-ink);cursor:pointer;font-size:.82rem;padding:0;text-decoration:underline}

/* ---------- hints & cram ---------- */
.hint-group{margin-bottom:34px}
.hint-group h3,.cram-card h3{font-family:var(--font-display);margin:0 0 10px;display:flex;align-items:center;gap:10px;font-size:1.2rem}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;border-left:4px solid var(--t)}
.hint blockquote{margin:0 0 6px;font-family:var(--font-display);font-style:italic;font-size:1.02rem;line-height:1.45}
.hint .take{font-size:.88rem;color:var(--ink-soft)}
.kind{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px}
.kind.emphasize{background:var(--good-soft);color:var(--good)} .kind.deemphasize{background:var(--caution-soft);color:var(--caution)}
.cram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cram-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.cram-card ul{margin:0;padding-left:18px}
.cram-card li{margin-bottom:5px;font-size:.9rem}

/* ---------- review ---------- */
.review-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.review-top input{flex:1 1 240px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;font:inherit;color:var(--ink);min-width:0}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.toggle .sw{width:30px;height:17px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:15px}
.group-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.group-chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.group-chip .n{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint)}
.group-chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)} .group-chip.is-active .n{color:var(--bg);opacity:.7}
.group-head h2{font-family:var(--font-display);font-size:1.7rem;margin:4px 0 4px}
.group-head p{color:var(--ink-soft);margin:0 0 20px;max-width:80ch}
.rv-section{margin-bottom:38px}
.rv-section > h3{font-family:var(--font-display);font-size:1.18rem;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--t);display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-card h4{margin:0;font-size:1.02rem;line-height:1.25}
.rv-card .sub{font-size:.8rem;color:var(--ink-soft);margin-top:-2px}
.rv-card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:.87rem}
.rv-card dt{font-weight:700;color:var(--t);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;white-space:nowrap}
.rv-card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rv-tip{margin-top:4px;font-size:.8rem;font-weight:600;background:var(--ts);color:var(--t);padding:5px 9px;border-radius:7px;align-self:flex-start}
.rv-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.rv-table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
table.rv-table th{background:var(--surface-2);text-align:left;padding:9px 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);position:sticky;top:0}
table.rv-table td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.rv-table td:first-child{font-weight:700}
table.rv-table tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 40%, transparent)}
.rv-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rv-list li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.9rem}
.flows{display:grid;gap:16px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--t)}
.flow h4{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow li{display:flex;align-items:center;gap:6px;font-size:.85rem}
.flow li .st{background:var(--ts);color:var(--ink);border:1px solid color-mix(in srgb, var(--t) 40%, transparent);border-radius:8px;padding:5px 9px}
.flow li .st b{font-family:var(--font-mono);color:var(--t);margin-right:5px}
.flow li:not(:last-child)::after{content:"→";color:var(--ink-faint)}
/* recall mode: hide answers until tapped */
.recall .rv-card dd,.recall table.rv-table td:not(:first-child),.recall .flow li .st span{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
.recall .rv-card dd.shown,.recall table.rv-table td.shown,.recall .flow li .st span.shown{filter:none}
.rv-empty{color:var(--ink-faint);padding:30px 0;text-align:center}
mark{background:var(--caution-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- toast ---------- */
#toastHost{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem;animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===================================================================
   ARCADE (fixed dark world)
   =================================================================== */
#panel-arcade{background:var(--ar-bg);color:var(--ar-ink);margin:-16px -20px 0;padding:24px 20px 40px;min-height:70vh;border-radius:0 0 18px 18px;position:relative;overflow:hidden}
#panel-arcade::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);background-size:22px 22px;pointer-events:none}
.ar-wrap{position:relative;max-width:1060px;margin:0 auto}
.ar-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ar-logo{font-family:var(--font-arcade);font-size:1.35rem;line-height:1.5;color:var(--ar-yellow);text-shadow:3px 3px 0 var(--ar-pink);margin:0}
.ar-logo small{display:block;font-size:.55rem;color:var(--ar-dim);text-shadow:none;margin-top:6px;letter-spacing:.06em}
.ar-stats{display:flex;gap:8px;flex-wrap:wrap}
.ar-stat{background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 12px;font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-stat b{color:var(--ar-ink);font-size:.95rem;margin-left:4px}
.ar-mute{cursor:pointer;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 10px;color:var(--ar-ink)}
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ar-tile{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, border-color .15s;cursor:pointer;text-align:left;padding:0;color:var(--ar-ink)}
.ar-tile:hover,.ar-tile:focus-visible{transform:translateY(-4px);border-color:var(--c)}
.ar-thumb{height:170px;background:var(--ar-panel-2);display:block;width:100%}
.ar-thumb svg{display:block;width:100%;height:100%}
.ar-tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ar-tile h3{font-family:var(--font-arcade);font-size:.85rem;color:var(--c);margin:0;line-height:1.5}
.ar-tile p{margin:0;font-size:.88rem;color:var(--ar-dim)}
.ar-tile .ar-tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.ar-play{font-family:var(--font-arcade);font-size:.65rem;background:var(--c);color:var(--ar-bg);padding:9px 14px;border-radius:8px;box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, #000)}
.ar-best{font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-how{margin-top:26px;background:var(--ar-panel);border:2px dashed var(--ar-line);border-radius:14px;padding:14px 18px;font-size:.88rem;color:var(--ar-dim)}
.ar-how b{color:var(--ar-ink)}

/* game shell */
.gm{display:flex;flex-direction:column;gap:12px}
.gm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-back{font-family:var(--font-arcade);font-size:.6rem;background:var(--ar-panel);border:2px solid var(--ar-line);color:var(--ar-ink);padding:9px 12px;border-radius:8px;cursor:pointer}
.gm-title{font-family:var(--font-arcade);font-size:.8rem;color:var(--c);margin-right:auto}
.gm-hud{display:flex;gap:8px;flex-wrap:wrap}
.gm-hud span{font-family:var(--font-mono);font-size:.8rem;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:8px;padding:5px 10px}
.gm-hud b{color:var(--ar-yellow)}
.gm-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm-select label{font-size:.82rem;color:var(--ar-dim)}
.gm-select select{background:var(--ar-panel);color:var(--ar-ink);border:2px solid var(--ar-line);border-radius:8px;padding:6px 10px;font:inherit;font-size:.86rem;max-width:100%}
.gm-stage{position:relative;background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.gm-overlay{position:absolute;inset:0;background:rgba(10,8,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5;overflow-y:auto}
.gm-overlay h2{font-family:var(--font-arcade);font-size:1rem;color:var(--c);margin:0;line-height:1.6}
.gm-overlay p{margin:0;color:var(--ar-dim);max-width:52ch;font-size:.92rem}
.gm-big{font-family:var(--font-arcade);font-size:1.6rem;color:var(--ar-yellow)}
.gm-btn{font-family:var(--font-arcade);font-size:.7rem;background:var(--c);color:var(--ar-bg);border:0;padding:12px 18px;border-radius:10px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn.alt{background:var(--ar-panel-2);color:var(--ar-ink);box-shadow:0 5px 0 #0a0818}
.gm-missed{width:100%;max-width:560px;text-align:left;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 14px;max-height:240px;overflow-y:auto;font-size:.84rem}
.gm-missed h4{margin:0 0 6px;font-family:var(--font-arcade);font-size:.6rem;color:var(--ar-pink)}
.gm-missed li{margin-bottom:6px;color:var(--ar-ink)}
.gm-missed li span{color:var(--ar-green)}
.gm-keys{font-size:.78rem;color:var(--ar-dim);text-align:center}
.gm-keys kbd{font-family:var(--font-mono);background:var(--ar-panel-2);border:1px solid var(--ar-line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--ar-ink)}

/* Sort Storm */
.ss-stage{height:470px}
.ss-banner{position:absolute;top:12px;left:0;right:0;text-align:center;font-family:var(--font-arcade);font-size:.7rem;color:var(--ar-cyan);line-height:1.6;padding:0 12px;z-index:2}
.ss-card{position:absolute;left:50%;top:0;transform:translate(-50%,0);background:var(--ar-yellow);color:#1a1433;font-weight:800;padding:14px 18px;border-radius:12px;min-width:170px;max-width:78%;text-align:center;font-size:1.02rem;box-shadow:0 6px 0 #b8901c, 0 10px 24px rgba(0,0,0,.4);z-index:3;will-change:transform}
.ss-card.fly-l{transition:transform .22s ease-in, opacity .22s;opacity:.2}
.ss-bins{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.ss-bin{height:110px;border-radius:14px;border:3px dashed var(--bc);background:color-mix(in srgb, var(--bc) 14%, transparent);color:var(--ar-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1rem;cursor:pointer;text-align:center;padding:6px}
.ss-bin kbd{font-family:var(--font-mono);font-size:.72rem;background:var(--ar-bg);border:1px solid var(--ar-line);border-radius:5px;padding:1px 6px;color:var(--ar-dim);font-weight:400}
.ss-bin.flash-good{background:color-mix(in srgb, var(--ar-green) 45%, transparent);border-style:solid;border-color:var(--ar-green)}
.ss-bin.flash-bad{background:color-mix(in srgb, var(--ar-pink) 45%, transparent);border-style:solid;border-color:var(--ar-pink)}
.ss-danger{position:absolute;left:0;right:0;bottom:130px;border-top:2px dashed rgba(255,92,138,.5)}
.ss-pop{position:absolute;font-family:var(--font-arcade);font-size:.75rem;pointer-events:none;animation:pop .8s ease-out forwards;z-index:4}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}

/* Snake */
.sn-prompt{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:14px;padding:12px 16px;font-weight:700;font-size:1rem;min-height:64px;display:flex;align-items:center;gap:10px}
.sn-prompt .lec-chip{flex:none}
.sn-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sn-opt{display:flex;align-items:center;gap:10px;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:8px 12px;font-size:.9rem;min-width:0}
.sn-opt i{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--font-arcade);font-size:.6rem;color:#120f24}
.sn-opt span{min-width:0;overflow-wrap:anywhere}
.sn-opt.is-right{border-color:var(--ar-green);background:color-mix(in srgb, var(--ar-green) 22%, var(--ar-panel))}
.sn-opt.is-wrong{border-color:var(--ar-pink);background:color-mix(in srgb, var(--ar-pink) 22%, var(--ar-panel));text-decoration:line-through}
.sn-board{display:flex;justify-content:center;background:#1d1838}
.sn-canvas{display:block;width:100%;max-width:min(100%, calc(44vh * 1.571));height:auto;image-rendering:pixelated}
.sn-pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center}
.sn-pad button{background:var(--ar-panel-2);border:2px solid var(--ar-line);border-radius:10px;color:var(--ar-ink);font-size:1.2rem;cursor:pointer}
.sn-pad .up{grid-column:2} .sn-pad .left{grid-column:1;grid-row:2} .sn-pad .down{grid-column:2;grid-row:2} .sn-pad .right{grid-column:3;grid-row:2}
@media (hover:none){ .sn-pad{display:grid} }

/* Stack Attack */
.sa-stage{height:520px;display:grid;grid-template-rows:auto 1fr auto}
.sa-head{padding:12px 16px;border-bottom:2px solid var(--ar-line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.sa-head h3{margin:0;font-size:1.02rem}
.sa-next{font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.sa-timer{height:6px;background:var(--ar-bg);border-radius:4px;overflow:hidden;width:100%;margin-top:6px}
.sa-timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ar-green),var(--ar-yellow),var(--ar-pink));transform-origin:left}
.sa-base{width:min(460px,96%);margin:0 auto;height:10px;border-radius:5px;background:var(--ar-line);flex:none}
.sa-empty{color:var(--ar-dim);font-family:var(--font-arcade);font-size:.55rem;margin-bottom:6px;opacity:.7}
.sa-tower{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:5px;padding:10px;overflow:hidden}
.sa-block{background:var(--bc);color:#120f24;font-weight:800;border-radius:9px;padding:9px 14px;font-size:.9rem;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35);width:min(420px,92%);animation:drop .28s cubic-bezier(.3,1.6,.5,1)}
.sa-block b{font-family:var(--font-mono);margin-right:6px;opacity:.7}
@keyframes drop{from{transform:translateY(-120px);opacity:.3}to{transform:none;opacity:1}}
.sa-belt{position:relative;height:96px;background:repeating-linear-gradient(90deg,#2a2255 0 26px,#231c48 26px 52px);border-top:3px solid var(--ar-line);overflow:hidden}
.sa-item{position:absolute;top:16px;height:62px;min-width:120px;max-width:220px;padding:6px 10px;border-radius:10px;background:var(--ar-cyan);color:#120f24;font-weight:800;font-size:.8rem;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 0 #1f8a80;border:0;text-align:left;line-height:1.2}
.sa-item kbd{flex:none;font-family:var(--font-arcade);font-size:.55rem;background:#120f24;color:var(--ar-cyan);border-radius:5px;padding:4px 5px}
.sa-item.bad{animation:shake .3s;background:var(--ar-pink);box-shadow:0 4px 0 #a8284f}

/* ---------- responsive ---------- */
@media (max-width: 860px){
  .notes-layout{grid-template-columns:minmax(0,1fr)}
  .lec-nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .lec-nav button{flex:none;width:210px}
  .reading{padding:18px 16px}
}
@media (max-width: 520px){
  #app{padding:0 16px 50px}
  .hub-header{margin:0 -16px;padding:10px 16px 0}
  #panel-arcade{margin:-16px -16px 0;padding:18px 12px 30px}
  .hub-title h1{font-size:1.2rem}
  .hub-subtitle{display:none}
  #streakPill,#progressSummary{display:none}
  .hub-header-top{flex-wrap:nowrap}
  .pill.countdown{font-size:.72rem;padding:3px 8px}
  .qcard-match-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sn-legend{grid-template-columns:minmax(0,1fr)}
  .ss-stage{height:430px}
  .ar-logo{font-size:1rem}
  .rv-cards{grid-template-columns:minmax(0,1fr)}
  .cram-grid{grid-template-columns:minmax(0,1fr)}
}

/* ---------- custom icon set ---------- */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.theme-btn .ic{width:15px;height:15px}
.group-chip .ic{width:17px;height:17px;color:var(--accent)}
.group-chip.is-active .ic{color:var(--bg)}
.group-head h2{display:flex;align-items:center;gap:10px}
.group-head h2 .ic{width:26px;height:26px;color:var(--accent);padding:4px;border-radius:8px;background:var(--accent-soft);box-sizing:content-box}
.rv-tip{display:inline-flex;gap:6px;align-items:center}
.toast{display:flex;gap:8px;align-items:center}
.ar-mute{display:inline-flex;align-items:center}
.ar-mute .ic{width:18px;height:18px}
.ar-play{display:inline-flex;align-items:center;gap:6px}
.ar-play .ic,.gm-back .ic{width:11px;height:11px}
.gm-back{display:inline-flex;align-items:center;gap:6px}
.gm-overlay p .ic{color:var(--ar-yellow)}
.sn-pad button{display:inline-flex;align-items:center;justify-content:center}
.sn-pad .ic{width:20px;height:20px}
.hrt{display:inline-flex;margin-right:3px;color:var(--ar-pink)}
.hrt .px-heart{width:14px;height:12px;vertical-align:-1px}
.hrt.lost{color:var(--ar-line)}

/* ---------- compact single-row ribbon ---------- */
.hub-header{padding:6px 20px}
.hub-header-top{flex-wrap:nowrap;gap:14px}
.hub-title{align-items:center;gap:8px;flex:none}
.hub-title h1{font-size:1.12rem;white-space:nowrap}
.hub-back-btn{width:30px;height:30px}
#modeSwitch{margin:0;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;flex:0 1 auto;min-width:0}
#modeSwitch button{padding:5px 12px;border:0;border-radius:999px;font-size:.86rem;gap:6px}
#modeSwitch button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{color:var(--ar-pink)}
#modeSwitch .mode-icon{display:inline-flex}
#modeSwitch .mode-icon .ic{width:16px;height:16px}
.hub-meta{margin-left:auto;flex-wrap:nowrap;gap:6px}
.pill{padding:3px 9px;font-size:.76rem}
.theme-btn{width:28px;height:26px}
main{padding-top:16px}
@media (max-width: 760px){
  .hub-title h1{font-size:1rem}
  #progressSummary{display:none}
  #modeSwitch button{padding:5px 9px}
}
@media (max-width: 560px){
  .hub-header{padding:6px 12px}
  .hub-header-top{gap:8px}
  .mode-label{display:none}
  #modeSwitch button{padding:6px 11px}
  .pill.countdown{font-size:.7rem;padding:3px 7px}
  .hub-back-btn{width:28px;height:28px}
}
@media (max-width: 380px){ .hub-title h1{display:none} }

/* ---------- arcade leaderboards ---------- */
.ar-boards{margin-top:26px}
.ar-sub{font-family:var(--font-arcade);font-size:.72rem;color:var(--ar-yellow);display:flex;align-items:center;gap:8px;margin:0 0 12px}
.ar-sub .ic{width:18px;height:18px}
.ar-board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ar-board{background:var(--ar-panel);border:3px solid var(--ar-line);border-top-color:var(--c);border-radius:14px;padding:12px 14px}
.ar-board h4{margin:0 0 8px;font-family:var(--font-arcade);font-size:.62rem;color:var(--c)}
.lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-family:var(--font-mono);font-size:.8rem}
.lb-list li{display:flex;gap:10px;align-items:center;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.03)}
.lb-list li.me{background:color-mix(in srgb, var(--ar-yellow) 18%, transparent);color:var(--ar-yellow)}
.lb-list li.lb-gap{background:none;justify-content:center;color:var(--ar-dim);padding:0}
.lb-rk{width:22px;color:var(--ar-dim);text-align:right;flex:none}
.lb-list li:nth-child(1) .lb-rk{color:var(--ar-yellow)} .lb-list li:nth-child(2) .lb-rk{color:#d8d4f0} .lb-list li:nth-child(3) .lb-rk{color:var(--ar-orange)}
.lb-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ar-ink)}
.lb-list li.me .lb-nm{color:var(--ar-yellow)}
.lb-sc{color:var(--ar-yellow);flex:none}
.lb-empty{color:var(--ar-dim);font-size:.82rem;padding:6px 2px}
.gm-lb{width:100%;max-width:420px;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 12px;text-align:left}
.gm-lb h4{margin:0 0 6px;font-family:var(--font-arcade);font-size:.58rem;color:var(--ar-yellow)}

/* ---------- fullscreen arcade ---------- */
.gm-fs{margin-left:auto;order:3}
.gm-bar .gm-title{margin-right:0}
.gm-bar .gm-hud{order:4}
.ar-wrap:fullscreen,.ar-wrap:-webkit-full-screen{background:var(--ar-bg);padding:18px 24px;max-width:none;overflow:auto;color:var(--ar-ink)}
.ar-wrap.is-fs{position:fixed;inset:0;z-index:200;background:var(--ar-bg);padding:18px 24px;max-width:none;overflow:auto}
.ar-wrap.fs-on .gm{max-width:1400px;margin:0 auto}
.ar-wrap.fs-on .ss-stage{height:calc(100vh - 190px)}
.ar-wrap.fs-on .sa-stage{height:calc(100vh - 190px)}
.ar-wrap.fs-on .sn-canvas{max-width:min(100%, calc((100vh - 330px) * 1.5))}
.ar-wrap.fs-on .mm-stage,.ar-wrap.fs-on .hm-stage,.ar-wrap.fs-on .ff-stage{min-height:calc(100vh - 190px)}
.ar-wrap.fs-on .gm-keys{display:none}

/* ---------- Marrow Match ---------- */
.mm-stage{min-height:470px;display:flex;flex-direction:column}
.mm-head{padding:12px 16px;border-bottom:2px solid var(--ar-line)}
.mm-head h3{margin:0;font-size:1rem;display:flex;justify-content:space-between;gap:10px}
.mm-grid{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px;align-content:center}
.mm-card{position:relative;min-height:96px;border-radius:12px;border:3px solid var(--ar-line);background:var(--ar-panel-2);color:var(--ar-dim);cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.86rem;line-height:1.25;transition:transform .15s,background .15s}
.mm-card .mm-face{display:none;color:#120f24}
.mm-card .mm-back .ic{width:30px;height:30px}
.mm-card.up{background:#f4f1ff;border-color:var(--ar-violet);transform:scale(1.03)}
.mm-card.side-1.up{border-color:var(--ar-cyan)}
.mm-card.up .mm-face{display:block}.mm-card.up .mm-back{display:none}
.mm-card.done{background:color-mix(in srgb, var(--ar-green) 30%, #f4f1ff);border-color:var(--ar-green);cursor:default}

/* ---------- Bone to Pick ---------- */
.hm-stage{min-height:470px;display:flex;flex-direction:column;gap:12px;padding:14px}
.hm-clue{border-width:2px}
.hm-mid{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;flex:1}
.hm-bone{width:130px;color:var(--ar-ink)}
.hm-bone svg{width:100%;height:auto}
.hm-bone g{transition:opacity .25s} .hm-bone g.off{opacity:.12;color:var(--ar-pink)}
.hm-word{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px}
.hm-word b{width:30px;height:40px;border-bottom:4px solid var(--ar-orange);display:flex;align-items:flex-end;justify-content:center;font-family:var(--font-arcade);font-size:.95rem;color:var(--ar-ink);padding-bottom:4px}
.hm-word b.ok{color:var(--ar-green)} .hm-word b.bad{color:var(--ar-pink)}
.hm-word .sp{width:14px}
.hm-left{text-align:center;color:var(--ar-dim);font-size:.82rem;margin-top:10px;font-family:var(--font-mono)}
.hm-keys{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:5px}
.hm-key{background:var(--ar-panel-2);border:2px solid var(--ar-line);border-radius:7px;color:var(--ar-ink);font-family:var(--font-mono);font-weight:700;padding:8px 0;cursor:pointer}
.hm-key.hit{background:color-mix(in srgb, var(--ar-green) 35%, var(--ar-panel));border-color:var(--ar-green)}
.hm-key.miss{opacity:.35}

/* ---------- Fact or Fracture ---------- */
.ff-stage{min-height:470px;display:flex;flex-direction:column}
.ff-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px}
.ff-card{background:#f4f1ff;color:#120f24;border-radius:16px;padding:20px 24px;width:min(560px,100%);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 8px 0 #3b3270;transition:transform .15s,background .15s}
.ff-card.ok{background:color-mix(in srgb, var(--ar-green) 45%, #f4f1ff);transform:scale(1.03)}
.ff-card.bad{background:color-mix(in srgb, var(--ar-pink) 45%, #f4f1ff);animation:shake .3s}
.ff-name{font-weight:800;font-size:1.25rem}
.ff-label{font-family:var(--font-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#5f5890}
.ff-val{font-weight:700;font-size:1.05rem;line-height:1.35}
.ff-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.ff-btn{border:0;border-radius:12px;padding:14px;font-family:var(--font-arcade);font-size:.7rem;color:#120f24;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.ff-btn .ic{width:18px;height:18px}
.ff-btn kbd{font-family:var(--font-mono);font-size:.62rem;background:rgba(18,15,36,.15);border-radius:4px;padding:1px 5px}
.ff-btn.t{background:var(--ar-green);box-shadow:0 5px 0 #4a9e3c} .ff-btn.f{background:var(--ar-pink);box-shadow:0 5px 0 #a8284f}
.gm-select-note{font-size:.82rem;color:var(--ar-dim)}
@media (max-width:560px){
  .mm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hm-keys{grid-template-columns:repeat(9,minmax(0,1fr))}
  .hm-word b{width:22px;height:32px;font-size:.75rem}
  .gm-fs{order:2;margin-left:0}
}

.gm-hud .hrt{border:0;padding:0;background:none;border-radius:0}
.gm-hud b[data-hud="lives"]{display:inline-flex;align-items:center}

/* ---------- Clast Blaster ---------- */
.cb-canvas{cursor:crosshair}
.ar-wrap.fs-on .cb-canvas{max-width:min(100%, calc((100vh - 330px) * 1.636))}

/* ---------- Bone Search ---------- */
.bs-stage{min-height:470px;display:flex;flex-direction:column}
.bs-body{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:18px;padding:14px;align-items:start}
.bs-grid{display:grid;grid-template-columns:repeat(12,34px);gap:3px;justify-content:center}
.bs-cell{width:34px;height:34px;border-radius:7px;border:0;background:var(--ar-panel-2);color:var(--ar-ink);font-family:var(--font-mono);font-weight:700;font-size:.95rem;cursor:pointer;padding:0}
.bs-cell:hover{background:#3b3270}
.bs-cell.sel{background:var(--ar-yellow);color:#120f24}
.bs-cell.found{background:color-mix(in srgb, var(--ar-cyan) 55%, var(--ar-panel-2));color:#120f24}
.bs-clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:c}
.bs-clues li{background:var(--ar-panel-2);border:2px solid var(--ar-line);border-radius:10px;padding:8px 10px;font-size:.86rem;display:flex;flex-direction:column;gap:4px}
.bs-clues li.found{border-color:var(--ar-cyan)}
.bs-clue{color:var(--ar-ink)}
.bs-ans{font-family:var(--font-mono);font-size:.76rem;color:var(--ar-dim)}
.bs-clues li.found .bs-ans{color:var(--ar-cyan)}
.bs-clues .lec-chip{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-wrap.fs-on .bs-grid{grid-template-columns:repeat(12,clamp(34px, 5vh, 52px))}
.ar-wrap.fs-on .bs-cell{width:clamp(34px, 5vh, 52px);height:clamp(34px, 5vh, 52px);font-size:1.1rem}

/* ---------- Whack-a-Clast ---------- */
.wa-stage{min-height:470px;display:flex;flex-direction:column;padding:14px;gap:14px}
.wa-target{background:var(--ar-orange);color:#120f24;border-radius:12px;padding:10px 14px;font-family:var(--font-arcade);font-size:.68rem;line-height:1.6;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wa-target b{font-size:.8rem}
.wa-target span{font-family:var(--font-body);font-size:.8rem;margin-left:auto;opacity:.75}
.wa-grid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wa-hole{position:relative;min-height:110px;border:0;border-radius:14px;background:radial-gradient(ellipse 40% 20% at 50% 86%, #120f24 0 98%, transparent 100%), #f1e7d0;cursor:pointer;overflow:hidden;padding:0;touch-action:manipulation}
.wa-hole kbd{position:absolute;top:6px;left:8px;font-family:var(--font-mono);font-size:.62rem;color:#8b7d5e}
.wa-mole{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);width:82%;min-height:70%;border-radius:40px 40px 12px 12px;background:var(--ar-violet);display:flex;align-items:center;justify-content:center;padding:8px;transition:bottom .12s ease-out;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.wa-mole::before,.wa-mole::after{content:"";position:absolute;top:10px;width:7px;height:7px;border-radius:50%;background:rgba(18,15,36,.45)}
.wa-mole::before{left:32%}.wa-mole::after{right:32%}
.wa-mole span{font-weight:800;font-size:.82rem;color:#120f24;text-align:center;line-height:1.2;margin-top:10px}
.wa-hole.up .wa-mole{bottom:8%}
.wa-hole.hit{background:radial-gradient(ellipse 40% 20% at 50% 86%, #120f24 0 98%, transparent 100%), color-mix(in srgb, var(--ar-green) 55%, #f1e7d0)}
.wa-hole.miss{background:radial-gradient(ellipse 40% 20% at 50% 86%, #120f24 0 98%, transparent 100%), color-mix(in srgb, var(--ar-pink) 55%, #f1e7d0)}
.ar-wrap.fs-on .wa-hole{min-height:calc((100vh - 330px) / 3)}
@media (max-width:760px){
  .bs-body{grid-template-columns:minmax(0,1fr)}
  .bs-grid{grid-template-columns:repeat(12,minmax(0,1fr));width:100%}
  .bs-cell{width:auto;height:auto;aspect-ratio:1;font-size:.72rem}
  .wa-hole{min-height:90px}
  .wa-mole span{font-size:.7rem}
}

/* ---------- Listen (shared widget TTS) ---------- */
.reading .meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.reading .meta-row .meta{margin:0}
/* the shared widget styles the Listen button with --card, which this hub doesn't define; map it to this hub's tokens so it follows light/dark */
.sh-tts-btn:not([data-state="playing"]):not([data-state="paused"]){background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.sh-tts-btn:not([data-state="playing"]):not([data-state="paused"]):hover{background:var(--surface-2)}
body .sh-tts-voice-picker{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}

/* ---------- reading level switch ---------- */
.level-switch{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:4px 0 14px}
.level-switch button{border:0;background:none;color:var(--ink-soft);font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
.level-switch button:hover{color:var(--ink)}
.level-switch button.is-active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}


/* ---------- phone header: mode tabs get their own labeled row so none are hidden past the edge ---------- */
.lec-chip{white-space:normal;max-width:100%;min-width:0}
.qcard-top{flex-wrap:wrap}
.flow h4 .lec-chip{flex:0 1 auto}
@media (max-width: 560px){
  .hub-header-top{flex-wrap:wrap;row-gap:4px}
  .hub-title{flex:1 1 auto}
  #modeSwitch{order:3;flex:1 0 100%;margin-top:2px;overflow:visible}
  #modeSwitch button{flex:1 1 0;justify-content:center;padding:7px 4px 9px;font-size:.84rem;gap:5px}
  #modeSwitch .mode-label{display:inline}
}

/* ---------- weak spots + mind map ---------- */
.mmap-block{margin:18px 0 4px}
#sh-mmap-container{margin-top:12px}
.weak-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.weak-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--t, var(--line));border-radius:12px;background:var(--surface)}
.weak-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.weak-main span{font-size:.85rem;color:var(--ink-soft)}
.weak-meter{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.weak-meter i{display:block;height:100%;background:var(--t, var(--accent));border-radius:99px}

/* ---------- Exam 4 additions: Patient Box, select-all, quick start, "what's tested" ---------- */
.pbox{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:10px 14px;margin:0 0 12px}
.pbox-head{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.pbox-head .ic{width:14px;height:14px}
.pbox dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;margin:0;font-size:.9rem}
.pbox dt{font-weight:700;color:var(--ink-soft)}
.pbox dd{margin:0;color:var(--ink)}
@media (max-width:560px){.pbox dl{grid-template-columns:1fr}.pbox dd{margin-bottom:6px}}
.qcard-choice.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qcard-choice.is-missed-right{border-color:var(--good);border-style:dashed}
.multi-check{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.multi-score{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-soft)}
.quick-start{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.qs-btn{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.qs-btn:hover{border-color:var(--accent)}
.qs-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .qs-btn.primary{color:#1a1114}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qs-btn.primary{color:#1a1114} }
.qs-btn .qs-ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb, currentColor 12%, transparent)}
.qs-btn .qs-ic .ic{width:20px;height:20px}
.qs-btn b{display:block;font-size:1rem}
.qs-btn small{display:block;font-size:.8rem;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-btn span{min-width:0}
@media (max-width:720px){.quick-start{grid-template-columns:minmax(0,1fr);gap:8px}.qs-btn{padding:11px 14px}}
.tested{border:1px solid color-mix(in srgb, var(--t, var(--accent)) 40%, var(--line));background:color-mix(in srgb, var(--ts, var(--accent-soft)) 60%, var(--surface));border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:.92rem}
.tested b{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--t, var(--accent-ink))}
.tested ul{margin:6px 0 0;padding-left:18px}
.tested li{margin-bottom:2px}
.reading-prose .rv-table-wrap{margin:10px 0 32px}
.reading-prose table.rv-table{min-width:520px}
.exam-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:10px;padding:10px 14px;margin:0 0 20px;font-size:.92rem}
.exam-banner b{color:var(--accent-ink)}
</style>

/* Pixel heart for the arcade HUD (drawn on a 7x6 grid). */
function pixelHeart(){
  var rows = ['0110110','1111111','1111111','0111110','0011100','0001000'], r = '';
  rows.forEach(function(row, y){ for(var x=0;x<7;x++) if(row[x]==='1') r += '<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'; });
  return '<svg class="ic px-heart" viewBox="0 0 7 6" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges">'+r+'</svg>';
}

/* =================================================================== L28 HISTOLOGY OF SKIN */
mcq('sk-kc95','skin','deck','Which cell type makes up about 95% of the cells of the epidermis?',
  ['Keratinocytes','Melanocytes','Langerhans cells','Merkel cells'],
  'Keratinocytes are ~95% of epidermal cells. Melanocytes (1-3%) sit in the stratum basale, Langerhans cells (1-3%) in the stratum spinosum, and Merkel cells are a small sensory population.',
  { cue:'"95% keratin-ocytes": the epidermis is almost all keratin factories.' });
mcq('sk-mc13','skin','deck','Which epidermal cell type makes up only 1-3% of epidermal cells, sits in the stratum basale, and transfers pigment to its neighbors?',
  ['Melanocyte','Langerhans cell','Merkel cell','Keratinocyte'],
  'Melanocytes are 1-3% of epidermal cells, rest on the basement membrane of the stratum basale, and send dendritic processes into the stratum spinosum. Langerhans cells are also 1-3% but live in the spinosum and present antigen; they make no pigment.');
mcq('sk-corneum-out','skin','deck','Which is the outermost layer of the epidermis?',
  ['Stratum corneum','Stratum lucidum','Stratum granulosum','Stratum spinosum'],
  'Deep to superficial: basale, spinosum, granulosum, lucidum (thick skin only), corneum. "Before Signing, Get Legal Counsel." The lucidum is the tempting pick, but it sits just under the corneum and only in thick skin.');
mcq('sk-corneum-dead','skin','hub','The layer of skin that contains the most dead keratinocytes is the:',
  ['Stratum corneum','Stratum lucidum','Stratum granulosum','Stratum basale'],
  'The corneum is made of flattened, anucleate corneocytes: dead keratinocytes packed with keratin and sealed by lipid. It also varies the most in thickness. The lucidum is only a pale subdivision of the corneum in thick skin.');
seq('sk-layers','skin','hub','Put the epidermal layers of thick skin in order from deepest to most superficial.',
  ['Stratum basale','Stratum spinosum','Stratum granulosum','Stratum lucidum','Stratum corneum'],
  '"Before Signing, Get Legal Counsel": basale, spinosum, granulosum, lucidum, corneum. Thin skin has no distinct lucidum.',
  { cue:'Before Signing, Get Legal Counsel (Basale, Spinosum, Granulosum, Lucidum, Corneum).' });
mcq('sk-lucidum','skin','hub','Which epidermal layer is found only in thick skin and is considered a subdivision of the stratum corneum?',
  ['Stratum lucidum','Stratum granulosum','Stratum spinosum','Papillary layer'],
  'The stratum lucidum is a pale, translucent band between the granulosum and corneum, present in thick skin (palms, soles). Dr. Herr: "let\'s not worry about it too much."');
mcq('sk-thinnest','skin','hub','Where is the epidermis thinnest, and where is it thickest?',
  ['Eyelid thinnest; soles of the feet thickest','Scalp thinnest; palms thickest','Lips thinnest; back thickest','Fingertips thinnest; eyelid thickest'],
  'The epidermis ranges from about 0.04 mm (eyelid) to about 1.6 mm (soles). Thick skin (palms and soles) has a thick stratum corneum, a lucidum, no hair follicles, and eccrine glands.');
mcq('sk-thin-clue','skin','hub','You are shown a section of skin with hair follicles and sebaceous glands. What kind of skin is it?',
  ['Thin skin','Thick skin','Oral mucosa','Palmar skin'],
  'Slide clue: hair follicle present = thin skin. Thick skin (palms, soles) is hairless. "Thick" and "thin" describe the epidermis, especially the stratum corneum, not the whole skin.');
mcq('sk-granulosum','skin','hub','Keratohyalin granules, which stain intensely basophilic and contain the filaggrin precursor profilaggrin, identify which layer?',
  ['Stratum granulosum','Stratum spinosum','Stratum basale','Stratum lucidum'],
  'The granulosum (1-3 cells thick in thin skin) is easy to spot because of its dark keratohyalin granules. Filaggrin aggregates keratin filaments into fibrils. "Basale divides; spinosum connects; granulosum packages; corneum protects."');
mcq('sk-spinosum','skin','hub','Cells with a "prickle-like" appearance, held together by desmosomes attached to tonofibrils, are characteristic of which layer?',
  ['Stratum spinosum','Stratum basale','Stratum granulosum','Stratum corneum'],
  'The "spines" are desmosome sites that stay attached while the cells shrink during processing. Tonofibrils (bundled keratin filaments) anchor to the desmosomes and give the spinosum its mechanical strength. Langerhans cells also live here.');
mcq('sk-hemides','skin','deck','Basal keratinocytes attach to the basement membrane by which junction?',
  ['Hemidesmosomes','Desmosomes','Gap junctions','Tight junctions'],
  'Exam distinction from the slides: desmosomes join cell to cell; hemidesmosomes join basal cells to the basement membrane (with type XVII collagen, BP180). Antibodies to hemidesmosomes cause bullous pemphigoid; antibodies to desmosomes cause pemphigus.',
  { cue:'"Hemi" = half: half a desmosome, with the other half being the basement membrane.' });
mcq('sk-col17','skin','hub','Dr. Herr said the thing to remember about the dermoepidermal junction is attachment to the basement membrane via hemidesmosomes and which collagen?',
  ['Type XVII collagen','Type I collagen','Type II collagen','Type IV collagen'],
  'Type XVII collagen (BP180) is the hemidesmosome protein he named. It is also the bullous pemphigoid antigen, which is why the blister in pemphigoid splits below the basal layer. Type I is the reticular dermis; type IV is the basement membrane itself.');
mcq('sk-lamellar','skin','deck','Lamellar bodies that contain glycosphingolipids, phospholipids and ceramides are produced by which cells?',
  ['Keratinocytes','Melanocytes','Fibroblasts','Langerhans cells'],
  'Keratinocytes make lamellar (membrane-coating) bodies from the Golgi and secrete them between the stratum granulosum and stratum corneum, forming the lipid "mortar" of the water barrier.');
mcq('sk-barrier-site','skin','hub','Where is the lipid content of lamellar bodies released to form the epidermal water barrier?',
  ['Between the stratum granulosum and stratum corneum','Between the stratum basale and the basement membrane','Between the papillary and reticular dermis','Into the lumen of eccrine sweat glands'],
  'The barrier sits between the last two living and dead layers: lamellar body lipids fill the intercellular space, and insoluble proteins line the inner plasma membrane. Water barrier = cell envelope + lipid envelope ("bricks and mortar").');
mcq('sk-keratinization','skin','hub','Which statement about keratinization is correct?',
  ['It is programmed cell death in which the DNA fragments but the cell does not','It begins in the stratum corneum and moves downward','It produces cells that keep their nuclei for UV protection','It is driven by melanocytes releasing keratin into keratinocytes'],
  'Keratinization (cornification) is terminal differentiation by controlled apoptosis: DNA fragments, the nucleus is lost, but the cell stays intact and becomes ~85% keratin. It starts in the stratum basale as daughter cells move up.');
mcq('sk-desquam','skin','hub','What regulates the normal shedding (desquamation) of corneocytes from the skin surface?',
  ['Proteolytic breakdown of desmosomes, triggered by the falling pH near the surface','Contraction of arrector pili muscles that tug the surface cells loose from below','UV energy absorbed by melanin that cracks the keratin plates at the surface','Sebum from the hair follicles dissolving the lamellar body lipids between cells'],
  'As the pH drops toward the acidic surface, proteases (KLK) chew through the desmosomes holding corneocytes together, opposed by the inhibitor LEKTI. Dr. Herr: you do not need the names KLK and LEKTI, just the idea.');
mcq('sk-callus','skin','hub','Why does a callus form on a guitarist\'s fingertips?',
  ['Rubbing and pressure stimulate keratin synthesis','Melanocytes proliferate in response to friction','Fibroblasts lay down extra type III collagen in the epidermis','Sebaceous glands enlarge and harden the surface'],
  'Friction and pressure drive extra keratin production, hardening the skin into a callus. Too much friction too fast gives a blister instead, and a callus goes away if the activity stops.');
mcq('sk-tyrosinase','skin','deck','Which enzyme converts tyrosine to DOPA in melanocytes?',
  ['Tyrosinase','Tyrosine hydroxylase','DOPA decarboxylase','Monoamine oxidase'],
  'Melanin synthesis: tyrosine → DOPA → (dopaquinone) → melanin, catalyzed by tyrosinase inside melanosomes. Tyrosinase activity occurs only in melanocytes. Tyrosine hydroxylase is the catecholamine enzyme in neurons and adrenal medulla.',
  { cue:'Tyr → DOPA → melanin, and the enzyme is named for its starting material: tyrosin-ase.' });
seq('sk-melanin-seq','skin','hub','Order the steps of skin pigmentation.',
  ['Tyrosinase oxidizes tyrosine to DOPA','Melanin accumulates as premelanosomes mature','Melanosomes travel out the dendritic processes','Keratinocytes take up melanin by cytocrine transfer','Melanin caps the keratinocyte nucleus'],
  'Melanin is made in melanosomes, which mature and move to the tips of dendrites, get "pinched off" into ~36 neighboring keratinocytes (cytocrine secretion), and settle above the nucleus as a supranuclear umbrella against UV.');
mcq('sk-cap','skin','hub','Inside a keratinocyte, where does transferred melanin position itself?',
  ['Above the nucleus, like an umbrella','Evenly through the cytoplasm','At the basal pole, below the nucleus','In the lamellar bodies'],
  'Melanin forms a supranuclear cap over the nucleus, absorbing UV energy and shielding the DNA from UV mutagenesis. Damaged melanin is turned over in lysosomes.');
mcq('sk-pigment-why','skin','hub','Darker skin pigmentation is mainly the result of:',
  ['More melanin production and slower melanosome degradation','More melanocytes per square millimeter of basal epidermis','More Langerhans cells packed into the stratum spinosum','A thicker stratum corneum that holds more keratin pigment'],
  'Dr. Herr\'s take-home point: differences in pigmentation are NOT due to the number of melanocytes. People have similar melanocyte numbers at a given site; the difference is how much melanin is made and how fast melanosomes are degraded (more degradation = fairer skin).',
  { cue:'Same number of factories, different output: color is melanin made and kept, not melanocytes counted.' });
mcq('sk-melanin-unit','skin','hub','About how many keratinocytes does one melanocyte supply with melanin (the epidermal melanin unit)?',
  ['About 36','About 4','About 100','About 1,000'],
  'One melanocyte to ~36 keratinocytes is the melanin unit. The notes also quote a melanocyte:keratinocyte ratio of 1:4 to 1:10 in the basal layer; Dr. Herr flagged the mismatch and said it is "not that big of a point."');
mcq('sk-neural-crest','skin','hub','Melanocytes are derived from which embryonic source?',
  ['Neural crest cells','Bone marrow precursors','Surface ectoderm of the epidermis','Mesoderm of the dermis'],
  'Melanocytes come from migrated neural crest cells (they arrive around week 8) and self-renew in place with UV. Langerhans cells, by contrast, come from bone marrow precursors and seed the epidermis at about 12 weeks.');
mcq('sk-langerhans','skin','deck','Which cells are the antigen-presenting cells of the epidermis?',
  ['Langerhans cells','Merkel cells','Melanocytes','Mast cells'],
  'Langerhans cells express MHC class I and II, reside in the stratum spinosum, survey the epidermis, and when activated migrate through lymphatics to activate the adaptive immune response. Mast cells are dermal (histamine).');
mcq('sk-merkel','skin','deck','Which modified epithelial cells function in cutaneous sensation (sustained light touch)?',
  ['Merkel cells','Langerhans cells','Melanocytes','Pacinian corpuscles'],
  'Merkel cell–nerve complexes in the basal epidermis detect sustained light touch. Pacinian corpuscles are encapsulated nerve endings deep in the dermis, not modified epithelial cells.');
mcq('sk-pacinian','skin','deck','Encapsulated nerve endings deep in the dermis and hypodermis that respond to pressure and vibration are:',
  ['Pacinian corpuscles','Meissner corpuscles','Free nerve endings','Merkel discs'],
  'Pacinian corpuscles are large, onion-like and deep; their capsule lamellae deform with pressure and vibration. Meissner corpuscles are small, sit in the dermal papillae and sense light touch at low frequencies.',
  { cue:'Pacinian = Pressure, deeP, onion. Meissner = Mini, in the papillae, light touch.' });
mcq('sk-meissner','skin','hub','Small touch receptors that sit within the dermal papillae and respond best to low-frequency stimuli are:',
  ['Meissner corpuscles','Pacinian corpuscles','Merkel cells','Free nerve endings'],
  'Meissner corpuscles explain fingertip sensitivity. Free nerve endings (the most numerous receptors in the epidermis) carry pain, temperature, itch and crude touch.');
mcq('sk-papillary','skin','hub','Which describes the papillary layer of the dermis?',
  ['Thin, loose connective tissue with type I and III collagen, capillary loops and nerve endings','Thick, dense irregular tissue of coarse type I collagen bundles that forms Langer\'s lines','Adipose lobules with skin ligaments anchoring to deep fascia','Avascular stratified squamous epithelium'],
  'Papillary dermis: thin, loose, cellular, types I and III collagen, capillary loops serving (but not entering) the epidermis. Reticular dermis: thicker, less cellular, mostly coarse type I collagen and elastic fibers that form Langer\'s lines.');
mcq('sk-langer','skin','hub','A surgeon makes a skin incision parallel to Langer\'s lines. What is the expected result, and which layer forms these lines?',
  ['A less noticeable scar; collagen and elastic fibers of the reticular dermis','A less noticeable scar; keratin filaments of the stratum corneum','A wider scar; collagen of the papillary dermis','A wider scar; fat lobules of the hypodermis'],
  'Langer\'s lines are tension lines from the collagen and elastic fibers of the reticular dermis. Cutting along them leaves a less pronounced scar; cutting perpendicular gives a more pronounced one.');
mcq('sk-fibroblast','skin','hub','Which constituent of the dermis produces collagen, elastin and proteoglycans?',
  ['Fibroblasts','Mast cells','Langerhans cells','Keratinocytes'],
  'Fibroblasts make and remodel the dermal matrix (support, elasticity, wound healing). Mast cells release histamine; Langerhans cells are epidermal antigen-presenters; keratinocytes are epidermal.');
mcq('sk-hypodermis','skin','deck','Which region is composed primarily of fat cells and loose connective tissue, and lets the skin move over deep fascia?',
  ['Hypodermis (subcutaneous layer)','Reticular layer of the dermis','Papillary layer of the dermis','Stratum basale of the epidermis'],
  'The hypodermis has adipocyte lobules separated by septa with vessels and nerves, skin ligaments to the deep fascia, and Pacinian corpuscles. It insulates, cushions and stores energy, and it is not technically part of the skin proper.');
mcq('sk-avascular','skin','hub','A paper cut that only nicks the surface still bleeds. Why?',
  ['Capillary loops in the dermal papillae reach up just beneath the avascular epidermis','The epidermis has its own fine capillary network running through the stratum spinosum','Eccrine sweat ducts carry small amounts of blood to the skin surface','The stratum corneum is perfused by lymphatic vessels that also carry red cells'],
  'The epidermis is avascular and fed by diffusion from capillary loops in the dermal papillae. A cut through the few epidermal layers reaches those loops. The same loops dilate for heat loss (and blushing).');
mcq('sk-thermo','skin','hub','During heat exposure, how does the skin help cool the body?',
  ['Vasodilation of cutaneous vessels plus eccrine sweating','Vasoconstriction and arteriovenous shunting','Contraction of arrector pili muscles','Increased melanin transfer to keratinocytes'],
  'Warm = vasodilation (heat lost by radiation and convection) and sweating (evaporation). Cold = vasoconstriction and shunting. Arrector pili contraction (goosebumps) is a cold/fear response.');
mcq('sk-eccrine','skin','deck','Which sweat glands are found over most of the body and secrete a watery, hypotonic sweat for thermoregulation?',
  ['Eccrine','Apocrine','Sebaceous','Holocrine'],
  'Eccrine glands are everywhere except the lips and parts of the external genitalia, open directly onto the skin, and make acidic (pH 4.5-5.5), hypotonic sweat (the duct reabsorbs sodium). Sebaceous glands make sebum.');
mcq('sk-apocrine-stim','skin','hub','Which sweat glands respond to emotional and sensory stimuli but NOT to heat?',
  ['Apocrine','Eccrine','Sebaceous','Merocrine eccrine'],
  'Apocrine glands are limited to the axilla, areola and nipple, perianal skin and external genitalia, open into hair follicles, and respond to emotional and sensory stimuli, not heat. Eccrine sweating can be thermoregulatory or emotional.');
mcq('sk-apocrine-mero','skin','hub','Apocrine sweat glands were once thought to secrete by apocrine secretion. What secretion do they actually use?',
  ['Merocrine','Holocrine','Apocrine','Endocrine'],
  'Dr. Herr: "let\'s just highlight the word merocrine secretion here." The name is a misnomer. Holocrine (whole cell breaks down) belongs to sebaceous glands.',
  { cue:'Apocrine is a misnomer: it secretes MERO-crine. Only the name is apocrine.' });
mcq('sk-sebaceous','skin','deck','Sebaceous glands release sebum by which mode of secretion?',
  ['Holocrine','Merocrine','Apocrine','Eccrine'],
  'In holocrine secretion the whole mature sebocyte disintegrates and becomes sebum, which exits through the pilosebaceous canal into the hair follicle. Sebaceous glands grow out of the external root sheath of the follicle.');
mcq('sk-arrector','skin','hub','Which describes the arrector pili muscle?',
  ['Smooth muscle under sympathetic control that raises the hair (goosebumps)','Skeletal muscle under voluntary control attached to the dermis','Myoepithelium wrapped around eccrine sweat glands','Smooth muscle under parasympathetic control that empties sebaceous glands'],
  'Arrector pili connect the deep hair follicle to the superficial dermis. You don\'t control them voluntarily, so they are smooth muscle, and Dr. Herr said fear and cold act through sympathetic signaling.');
mcq('sk-nail','skin','hub','Why is nail keratin "hard" keratin?',
  ['Nail cells do not desquamate and are high in sulfur','Nail cells contain lamellar bodies full of ceramide','The nail plate is mineralized with hydroxyapatite','Melanocytes in the nail bed cross-link the keratin'],
  'Nails are hard plates of keratinized cells made by the stem cells of the nail matrix near the root. They do not shed and are rich in sulfur, giving hard keratin.');
mcq('sk-vitd','skin','hub','Which biotransformation function belongs to the skin?',
  ['Synthesizing vitamin D3 from 7-dehydrocholesterol after UV exposure','Converting 25-hydroxyvitamin D to calcitriol by 1-alpha hydroxylation','Producing bile acids from cholesterol for fat absorption','Activating angiotensinogen to angiotensin I for blood pressure'],
  'The skin makes vitamin D3 from 7-dehydrocholesterol with UV and has cytochrome P450 enzymes for detoxification. The kidney does the final 1-alpha hydroxylation to calcitriol.');
match('sk-cells-match','skin','hub','Match each skin cell to its job.',
  [['Keratinocyte','Barrier and keratin'],['Melanocyte','Pigment to neighbors'],['Langerhans cell','Antigen presentation'],['Merkel cell','Light-touch sensing']],
  'Keratinocytes ~95% (basale to corneum); melanocytes 1-3% (basale); Langerhans 1-3% (spinosum, MHC I and II, migrate to lymphatics); Merkel cells (basale, with nerve endings).');
mcq('sk-ex-thick','skin','hub','All of the following describe thick skin EXCEPT:',
  ['Abundant hair follicles','A visible stratum lucidum','A very thick stratum corneum','Found on the palms and soles'],
  'Thick skin is hairless; hair follicles mean thin skin. Thick skin has a prominent corneum, a lucidum, eccrine glands and dermal ridges (fingerprints).');
mcq('sk-ex-apocrine','skin','hub','Apocrine sweat glands are found in all of the following locations EXCEPT:',
  ['The palms','The axilla','Skin around the anus','The areola and nipple'],
  'Apocrine glands are limited to the axilla, areola/nipple, perianal skin and external genitalia. The palms have eccrine glands (where emotional sweating starts).');
mcq('sk-ex-func','skin','hub','All of the following are functions of the skin EXCEPT:',
  ['Producing bile for fat digestion','Thermoregulation through blood flow and sweat','Synthesizing vitamin D3 with UV light','First-line immune defense'],
  'The skin\'s listed functions: barrier and protection, immunologic, sensation, thermoregulation, water regulation, exocrine (sweat, sebum), endocrine, biotransformation (vitamin D3, P450), and social/sexual identity. Bile is hepatic.');
mcq('sk-ridges','skin','hub','Fingerprints (dermatoglyphics) come from which structures?',
  ['Dermal ridges interlocking with epidermal (rete) ridges in thick skin','Langer\'s lines formed by collagen bundles of the reticular dermis','Folds of the stratum lucidum that form only on the palms and soles','The fixed spacing of eccrine duct openings across the skin surface'],
  'Downward epidermal (rete) ridges interlock with upward dermal ridges and papillae, strengthening the junction and producing unique friction ridges that stay stable for life.');

/* =================================================================== L29 DERMATOLOGICAL PHARMACOLOGY */
mcq('dp-conc','dermpharm','lecture-quiz','A 28-year-old woman with mild psoriasis on her elbows is prescribed a topical corticosteroid. After limited improvement, the physician switches to a higher concentration of the same corticosteroid to increase efficacy. Which pharmacologic principle explains this approach?',
  ['Concentration gradient','Vehicle effect','Regional variation in penetration','Occlusion'],
  'Raising the concentration raises the gradient, so more drug crosses per unit time (e.g. 0.5% to 2% hydrocortisone). Dr. Fasinu: if the dose went up because the NEW lesion was on thicker skin, that would be regional variation in penetration; same spot, higher strength = concentration gradient.',
  { cue:'Same spot, stronger cream = gradient. New spot, thicker skin = regional variation.' });
mcq('dp-occlusion','dermpharm','lecture-quiz','A 42-year-old man with chronic dermatitis is told to apply his topical medication under plastic wrap overnight, which increases penetration by hydrating the stratum corneum. Which factor is being used?',
  ['Occlusion','Dosing schedule','Skin pH','Partition coefficient'],
  'Occlusion (a wrap, a dressing, or an oily ointment base) keeps the drug on the skin and hydrates the corneum, increasing penetration.');
mcq('dp-lice','dermpharm','lecture-quiz','A 7-year-old has intense scalp itching; live lice and nits are seen on the hair shafts. Which of the following is the most appropriate drug?',
  ['Permethrin','Acyclovir','Isotretinoin','Crotamiton'],
  'Permethrin 1% cream rinse (Nix) is the pediculosis product on the slide (wash off after 10 minutes); 5% (Elimite) is for scabies. Crotamiton is a scabies-only cream, acyclovir is antiviral, isotretinoin is for acne. Heads up: in the recording Dr. Fasinu also said "for head lice, we use ivermectin" (Sklice lotion); ivermectin is not an option here, and the slide key is permethrin.');
multi('dp-toenail','dermpharm','lecture-quiz','A 45-year-old man has thickened, discolored, brittle toenails that have worsened over a year, with discomfort while walking. Which are good treatment options for his condition? Select all that apply.',
  ['Terbinafine','Ciclopirox','Clotrimazole','Retapamulin'], [0,1],
  'Onychomycosis. Terbinafine (Lamisil) is the go-to: given orally it distributes to the extremities and is built into the new nail as it grows out ("Whenever you see it... you should go for it"). Ciclopirox (a nail paint) is also listed for onychomycosis, and the study deck keys both. Clotrimazole is an OTC azole for skin fungi that doesn\'t penetrate nail well; retapamulin is an antibiotic.');
mcq('dp-tretinoin','dermpharm','lecture-quiz','A 16-year-old has open and closed comedones on his face. The dermatologist prescribes a topical agent that decreases cohesion between epidermal cells and increases epidermal cell turnover, expelling comedones. Which drug fits?',
  ['Tretinoin','Tacrolimus','Clindamycin','Azelaic acid'],
  'Tretinoin (retinoic acid, a vitamin A derivative) loosens epidermal cohesion and speeds turnover, expelling open comedones and turning closed ones into open ones. Apply to dry skin and keep it off the eyes, nose corners, mouth and mucosa.');
mcq('dp-isotret','dermpharm','lecture-quiz','A 22-year-old woman is being considered for oral therapy for severe cystic acne unresponsive to antibiotics and topical retinoids. The drug requires a negative serum pregnancy test and effective contraception before and during therapy because it is teratogenic. Which drug fits?',
  ['Isotretinoin','Tretinoin','Adapalene','Azelaic acid'],
  'Isotretinoin (Accutane) is oral, for recalcitrant severe cystic acne, shrinks the sebaceous glands, and is an established teratogen managed through iPLEDGE. Tretinoin is its topical isomer and is not under iPLEDGE.',
  { cue:'"I-PLEDGE for ISO": the I in isotretinoin is the pledge.' });
mcq('dp-brimonidine','dermpharm','lecture-quiz','A 40-year-old man has persistent facial erythema from rosacea. His dermatologist prescribes a topical alpha-2 adrenergic agonist gel that works by vasoconstriction. Which medication?',
  ['Brimonidine','Azelaic acid','Metronidazole','Ivermectin'],
  'Brimonidine 0.33% gel (Mirvaso) is an alpha-2 agonist that reduces rosacea redness by direct vasoconstriction; the same drug is used as eye drops. Azelaic acid, metronidazole and ivermectin treat rosacea too, but none is an alpha-2 agonist.');
multi('dp-impetigo','dermpharm','lecture-quiz','A 7-year-old boy has impetigo caused by Staphylococcus aureus. The physician wants a topical antibiotic that inhibits bacterial protein synthesis. Which are appropriate? Select all that apply.',
  ['Mupirocin','Retapamulin','Bacitracin','Gramicidin'], [0,1],
  'Dr. Fasinu: "I would say both option B and D are correct." Mupirocin and retapamulin (50S) both inhibit protein synthesis and both treat impetigo. Bacitracin blocks cell-wall synthesis; gramicidin disrupts the membrane.');
mcq('dp-topical-vs-trans','dermpharm','hub','A patient wears a fentanyl patch for chronic back pain. This is an example of:',
  ['Transdermal delivery for a systemic effect','Topical delivery for a local effect','Occlusion therapy for dermatitis','A keratolytic agent'],
  'Topical = applied to skin for a local effect. Transdermal = applied to skin so the drug crosses into the blood for a systemic effect, like swallowing a tablet (fentanyl, nicotine, hormone or scopolamine patches).');
mcq('dp-reservoir','dermpharm','hub','A topical drug with a 2-hour systemic half-life only needs once-daily application. Why?',
  ['The stratum corneum acts as a reservoir, so the "local half-life" is long','The drug is metabolized more slowly in skin than in liver','Topical drugs are always given as prodrugs','The dermis lacks blood vessels, trapping the drug'],
  'The avascular upper layers hold drug and release it slowly toward the dermal vessels, a built-in delayed release. That lets the dosing schedule be stretched. The dermis does have vessels; that is where absorption happens.');
mcq('dp-regional','dermpharm','hub','Which sites are far more permeable to topical drugs than the forearm?',
  ['Scrotum, face, axilla and scalp','Palms and soles','Elbows and knees','Upper back and shoulders'],
  'Regional variation in penetration: thin-skinned sites (scrotum, face, axilla, scalp) absorb much more. So low-potency corticosteroids go on the face and skin folds, and high-potency ones are reserved for palms and soles.');
mcq('dp-face-steroid','dermpharm','hub','A patient has eczema on the face and on the palms. How should topical corticosteroid potency be chosen?',
  ['Low potency on the face; high potency on the palms','High potency on the face; low potency on the palms','The same mid potency at both sites','Avoid corticosteroids on both sites'],
  'Thin facial skin absorbs readily, so use low potency there; thick palmar skin absorbs very little, so a high-potency steroid is needed to work. This is regional variation in penetration.');
