mcq('dp-ointment','dermpharm','hub','A patient with dry, cracked, psoriatic skin needs a topical vehicle. Which is best, and why?',
  ['An ointment, because its oily base is occlusive and keeps moisture in','A lotion, because its high water content is absorbed the fastest','A gel, because its alcohol base dries and flattens the scaly plaques','A powder, because it absorbs excess moisture and reduces friction'],
  'Ointments are oil-based, greasy and occlusive with slow release: best for chronic, dry conditions like psoriasis. Lotions are water-based and evaporate; Dr. Fasinu said not to give a dry-skin patient a lotion.');
match('dp-vehicles','dermpharm','hub','Match each vehicle to its best use.',
  [['Ointment','Dry, cracked skin'],['Gel','Acne-prone, oily skin'],['Paste','Diaper rash protection'],['Foam','Scalp and hairy areas']],
  'Ointment = oil-based and occlusive. Gel = water-based, may contain alcohol, dries quickly. Paste = lots of powder in a fatty base, forms a protective layer. Foam = air whipped into solution, spreads easily over hair. Dr. Fasinu said formulations are not high yield, so these are mostly for boards.');
mcq('dp-suspension','dermpharm','hub','How does a suspension differ from an emulsion?',
  ['A suspension is a solid dispersed in a liquid it can\'t dissolve in; an emulsion is two immiscible liquids','A suspension is two immiscible liquids mixed together; an emulsion is a solid fully dissolved in a liquid','Both are clear solutions of a dissolved drug, and they differ only in the pH of the vehicle','A suspension is always oil-in-water; an emulsion is always water-in-oil with an added powder'],
  'If the solid dissolves it is a solution; if not, it is a suspension (shake to redisperse with the suspending agent). An emulsion is oil in water or water in oil. Creams are emulsions.');
mcq('dp-irritation','dermpharm','hub','What is the most common adverse reaction to topical dermatologic medications?',
  ['Irritation','Allergic contact dermatitis','Photoallergic dermatitis','Systemic organ toxicity'],
  'Irritation (nonallergic) is the top local reaction. Dr. Fasinu: for a topical drug, think local cutaneous reactions first, not the systemic toxicity the drug is known for when given systemically.');
mcq('dp-local-not-systemic','dermpharm','hub','A patient applies a thin layer of topical gentamicin to a skin lesion. Which adverse effect should you think about first on an exam?',
  ['Local irritation at the application site','Nephrotoxicity from the aminoglycoside','Ototoxicity from systemic absorption','Neuromuscular blockade at high levels'],
  'Dr. Fasinu warned: when a drug is used topically, "don\'t be thinking nephrotoxicity." Systemic levels are too low. Look for local cutaneous reactions, with irritation first.');
mcq('dp-contact-urticaria','dermpharm','hub','Which local reaction to a topical drug is IgE-mediated (type I) and can progress to anaphylaxis?',
  ['Immunologic contact urticaria','Allergic contact dermatitis','Nonimmunologic contact urticaria','Photoirritation'],
  'Allergic and photoallergic contact dermatitis are type IV (delayed). Immunologic contact urticaria is type I (IgE). Nonimmunologic contact urticaria is the most common contact urticaria and needs no prior sensitization.');
mcq('dp-imiquimod','dermpharm','hub','Imiquimod (Aldara 5% cream) is used for external genital and perianal warts. How does it work?',
  ['It stimulates immune cells to release interferon-alpha, IL-1, IL-6, IL-8 and TNF-alpha','It inhibits calcineurin in T lymphocytes, so NFAT stays phosphorylated and inactive','It is a guanine analog that is phosphorylated and blocks the viral DNA polymerase','It decreases cohesion between epidermal cells and speeds up epidermal turnover'],
  'Imiquimod is a topical immunostimulant (immunomodulator). Uses: genital/perianal warts (5%), actinic keratoses of the face and scalp (lower strength, Zyclara 2.5-3.75%), superficial BCC. Side effects: local reactions.');
mcq('dp-tacro','dermpharm','hub','Topical tacrolimus and pimecrolimus are used for atopic dermatitis in patients over 2 years. What is their mechanism?',
  ['Calcineurin inhibition, blocking T-lymphocyte activation','Interferon induction in mononuclear cells','Inhibition of fungal ergosterol synthesis','Alpha-2 adrenergic agonism'],
  'They are calcineurin inhibitors (immunomodulators). Dr. Fasinu: remember "calcineurin inhibitors" as a broad class; they are high yield because the same drugs (with cyclosporine) prevent organ rejection. Topical caution: a black box warning about long-term tumorigenicity (animal data).');
seq('dp-calcineurin','dermpharm','hub','Order the T-cell pathway that calcineurin inhibitors block.',
  ['TCR binds antigen; intracellular Ca2+ rises','Ca2+-calmodulin activates calcineurin','Calcineurin dephosphorylates NFAT','NFAT enters the nucleus','IL-2 transcription drives T-cell activation'],
  'Calcineurin is a phosphatase (protein phosphatase 2B). It removes phosphate from NFAT, the opposite of a kinase, and activated NFAT turns on IL-2. Tacrolimus, pimecrolimus and cyclosporine block calcineurin.',
  { cue:'"Calcium calls calcineurin, calcineurin clips the phosphate, NFAT knocks on the nucleus, IL-2 answers."' });
mcq('dp-calcineurin-enzyme','dermpharm','hub','What kind of enzyme is calcineurin?',
  ['A protein phosphatase that activates NFAT by dephosphorylating it','A kinase that activates NFAT by phosphorylating it','A protease that cleaves NFAT from the membrane','A lipase that releases arachidonic acid'],
  'Dr. Fasinu contrasted it with kinases: calcineurin removes a phosphate to activate nuclear factor of activated T cells (NFAT).');
mcq('dp-acne-causes','dermpharm','hub','Which three factors cause acne vulgaris and guide its drug therapy?',
  ['Sebum overproduction, follicular hyperkeratinization and acne-causing bacteria','Melanocyte proliferation, dermal edema and mast cell degranulation','Fungal overgrowth, hair loss and sweat gland blockage','Autoimmune attack on desmosomes, IgG deposition and blistering'],
  'Each cause has a drug: reduce sebum (isotretinoin), normalize keratinization/turnover (retinoids such as tretinoin, adapalene, tazarotene), and fight bacteria (clindamycin, erythromycin, metronidazole). A blocked comedo that stays closed is a whitehead; open, a blackhead.');
mcq('dp-isotret-moa','dermpharm','hub','Which mechanism belongs to isotretinoin?',
  ['Inhibits sebaceous gland size and function','Decreases cohesion between epidermal cells','Inhibits bacterial protein synthesis','Inhibits calcineurin in T cells'],
  'Isotretinoin targets the sebum overproduction of acne by shrinking the sebaceous glands. Decreased cohesion and faster turnover is tretinoin\'s mechanism. Dr. Fasinu: exams ask about isotretinoin "because of the safety issues around it," not its mechanism.');
mcq('dp-ipledge','dermpharm','hub','Which iPLEDGE requirement for isotretinoin is stated in the lecture?',
  ['A negative serum pregnancy test within 2 weeks before starting','A monthly complete blood count before each refill','Starting therapy only in the week before menses','A single negative urine test after the first dose'],
  'FDA mandates: effective contraception from at least 1 month before, during, and 1+ cycles after therapy; a negative serum pregnancy test within 2 weeks before starting; start on day 2-3 of the next normal period; patient and pharmacist registration. Monthly blood counts are a REMS example for a different drug class (antipsychotics).');
mcq('dp-adapalene','dermpharm','hub','Which acne preparation is an OTC 1% gel for mild to moderate acne?',
  ['Adapalene (Differin)','Isotretinoin (Accutane)','Tazarotene (Tazorac)','Brimonidine (Mirvaso)'],
  'Adapalene 1% gel is available over the counter. Tazarotene comes as 0.1% gel, cream and foam by prescription. Brimonidine is for rosacea redness, isotretinoin is oral and restricted.');
mcq('dp-azelaic','dermpharm','hub','Which drug is listed for both acne vulgaris (Azelex) and acne rosacea (Finacea)?',
  ['Azelaic acid','Brimonidine','Tretinoin','Mupirocin'],
  'Azelaic acid covers both. Brimonidine is only for the persistent redness of rosacea.');
mcq('dp-metronidazole','dermpharm','hub','Topical metronidazole helps inflammatory acne and rosacea partly through which non-antibiotic action?',
  ['An anti-inflammatory effect on neutrophil function','Alpha-2 mediated vasoconstriction of facial vessels','Shrinking the sebaceous glands and their sebum','Blocking calcineurin and IL-2 in skin T cells'],
  'The slide: metronidazole acts as an anti-inflammatory agent by a direct effect on neutrophil cellular function, in addition to being anti-infective.');
mcq('dp-clinda','dermpharm','hub','Clindamycin is a common topical antibiotic for mild to moderate inflammatory acne. What is its mechanism?',
  ['Inhibits bacterial protein synthesis','Inhibits bacterial cell wall synthesis','Disrupts the bacterial cell membrane','Competitively blocks PABA utilization'],
  'Clindamycin (like erythromycin) inhibits protein synthesis. Note: the slide groups it with the macrolides, but Dr. Fasinu pointed out it is "actually not a macrolide, strictly speaking" (it\'s a lincosamide). Sodium sulfacetamide is the PABA blocker.');
match('dp-abx-moa','dermpharm','hub','Match each topical antibiotic to its mechanism.',
  [['Bacitracin','Cell wall synthesis'],['Gramicidin','Membrane disruption'],['Mupirocin','Protein synthesis'],['Sodium sulfacetamide','Blocks PABA use']],
  'Bacitracin (peptide; cuts, burns, scrapes), gramicidin (inserts into gram-positive membranes; topical combos only), mupirocin (impetigo), sodium sulfacetamide (sulfonamide, competitive PABA inhibition). Retapamulin, neomycin and gentamicin are protein-synthesis inhibitors too.');
mcq('dp-mrsa','dermpharm','hub','Which topical antibiotic is also given as an intranasal ointment for MRSA carriers?',
  ['Retapamulin','Bacitracin','Gramicidin','Clotrimazole'],
  'Retapamulin (50S protein synthesis inhibitor) treats skin and skin-structure infections and impetigo, with an intranasal ointment for MRSA carriers.');
mcq('dp-azoles','dermpharm','hub','How do the topical azole antifungals (miconazole, clotrimazole, ketoconazole) work?',
  ['They inhibit fungal ergosterol synthesis','They inhibit fungal cell wall glucan synthesis','They bind ergosterol and form membrane pores','They inhibit fungal protein synthesis at the 50S subunit'],
  'Azoles block ergosterol synthesis and are active against dermatophytes (Epidermophyton, Microsporum, Trichophyton) and yeasts (Candida). Most topical azoles are OTC; fluconazole tablets are prescription (candidiasis, thrush).');
mcq('dp-terb-pk','dermpharm','hub','Why does oral terbinafine work for toenail onychomycosis when most topicals fail?',
  ['It distributes widely to the extremities and is incorporated into the new nail as it grows','It dissolves the infected nail plate directly and kills the fungus trapped inside it','It is converted to an azole in the nail bed, which then blocks ergosterol synthesis','It stimulates the nail matrix to grow twice as fast so the fungus is pushed out'],
  'The nail is essentially nonliving and grows slowly, so creams can\'t penetrate it. Terbinafine (and the older griseofulvin) has a large volume of distribution and is built into newly formed nail; the infected nail grows out over months (up to ~6 months to see good improvement).');
mcq('dp-acyclovir','dermpharm','hub','Acyclovir, valacyclovir, penciclovir and famciclovir treat herpes simplex skin infections. What are they?',
  ['Synthetic guanine analogs that inhibit herpesvirus replication','Neuraminidase inhibitors that block release of new virions','Immunostimulants that induce interferon-alpha in the skin','Calcineurin inhibitors that calm the T-cell response to virus'],
  'They are guanine analogs active against the herpesvirus family (HSV-1 and -2). Valacyclovir lasts longer because it is better absorbed.');
mcq('dp-scabies','dermpharm','hub','A patient has scabies. Which product is applied from the neck down and left on 8-14 hours?',
  ['Permethrin 5% cream (Elimite)','Permethrin 1% cream rinse (Nix)','Ivermectin 0.5% lotion (Sklice)','Benzyl alcohol 5% lotion (Ulesfia)'],
  'Scabies: permethrin 5% from the neck down for 8-14 hours, or crotamiton (Eurax) 10% from the chin down, twice 24 hours apart. Nix, Sklice and Ulesfia are head-lice products rinsed off after about 10 minutes.');
match('dp-ecto','dermpharm','hub','Match each ectoparasiticide to the infestation it is listed for.',
  [['Crotamiton','Scabies only'],['Ivermectin lotion','Head lice'],['Malathion','Lice; comb out nits after 4-6 h'],['Spinosad','Head lice, 10-min suspension']],
  'Permethrin covers both (1% lice, 5% scabies). Crotamiton is scabies only. Ivermectin (Sklice), spinosad (Natroba) and benzyl alcohol (Ulesfia) are head-lice products. Malathion (Ovide) is applied to dry hair for pediculosis.');
mcq('dp-ex-ecto','dermpharm','hub','All of the following are listed treatments for head lice EXCEPT:',
  ['Crotamiton','Permethrin 1% (Nix)','Spinosad','Benzyl alcohol'],
  'Crotamiton (Eurax) is listed for scabies only. Permethrin 1%, spinosad, ivermectin lotion, malathion and benzyl alcohol are pediculosis products.');
mcq('dp-ex-protein','dermpharm','hub','All of the following topical antibiotics inhibit bacterial protein synthesis EXCEPT:',
  ['Bacitracin','Mupirocin','Retapamulin','Neomycin'],
  'Bacitracin inhibits cell-wall synthesis. Mupirocin, retapamulin, neomycin and gentamicin all inhibit protein synthesis.');
mcq('dp-ex-factors','dermpharm','hub','All of the following are physicochemical properties of a drug that affect skin absorption EXCEPT:',
  ['Skin temperature','Lipophilicity','Molecular weight','Volatility'],
  'Skin temperature is a SKIN condition factor (with hydration, pH, trauma). Drug properties: particle size/molecular weight, lipophilicity, volatility, pH/pKa and partition coefficients.');

/* =================================================================== L30 PATHOLOGY OF THE SKIN */
mcq('pa-macule','dermpath','hub','A flat, usually colored lesion that is not raised is a:',
  ['Macule','Papule','Plaque','Nodule'],
  'Macule = flat. Papule (<5 mm) and nodule (>5 mm) are dome-shaped and solid. Plaque = elevated but flat-topped.');
mcq('pa-plaque','dermpath','deck','An elevated, flat-topped lesion is a:',
  ['Plaque','Macule','Papule','Vesicle'],
  'A plaque is raised but flat on top (psoriasis plaques). A macule is not raised at all; a papule is dome-shaped.');
mcq('pa-bulla','dermpath','deck','A fluid-filled lesion larger than 5 mm is a:',
  ['Bulla','Vesicle','Pustule','Nodule'],
  'Vesicle <5 mm, bulla >5 mm. A pustule is a vesicle or bulla filled with pus. A nodule is a solid dome >5 mm.',
  { cue:'Vesicle is the "very small" blister; bulla is the big bubble.' });
mcq('pa-lichenif','dermpath','deck','Thickened, rough skin with prominent skin markings, usually from chronic rubbing, is called:',
  ['Lichenification','Excoriation','Scale','Hyperkeratosis'],
  'Lichenification follows repeated trauma or friction. Excoriation is a traumatic break in the epidermis (scratch). Scale is a dry platelike excrescence. Hyperkeratosis is the histologic term for a thick corneum.');
match('pa-gross-match','dermpath','hub','Match each gross term to its definition.',
  [['Papule','Solid dome under 5 mm'],['Nodule','Solid dome over 5 mm'],['Pustule','Pus-filled blister'],['Excoriation','Traumatic break in epidermis']],
  'Size splits: papule vs nodule, vesicle vs bulla, both at 5 mm.');
mcq('pa-acanthosis','dermpath','deck','Epidermal hyperplasia is also known as:',
  ['Acanthosis','Parakeratosis','Spongiosis','Papillomatosis'],
  'Acanthosis = a thickened (hyperplastic) epidermis. Parakeratosis = nuclei retained in the corneum. Spongiosis = intercellular edema. Papillomatosis = elongated dermal papillae.');
mcq('pa-spongiosis','dermpath','deck','Intercellular edema of the epidermis, which spaces the keratinocytes apart, is called:',
  ['Spongiosis','Acanthosis','Hyperkeratosis','Lichenification'],
  'Spongiosis is the hallmark histology of eczematous (acute) dermatitis.');
mcq('pa-parakerat','dermpath','hub','Retention of nuclei within the stratum corneum is called:',
  ['Parakeratosis','Hyperkeratosis','Acanthosis','Dyskeratosis'],
  'Parakeratosis means the epidermis is turning over so fast the corneum keeps its nuclei (psoriasis, actinic keratosis, friction). Hyperkeratosis is just a thickened corneum.');
mcq('pa-vitiligo-def','dermpath','deck','Which common disorder shows partial or complete loss of pigment-producing melanocytes within the epidermis?',
  ['Vitiligo','Ephelis (freckle)','Solar lentigo','Nevocellular nevus'],
  'Vitiligo: flat, well-demarcated depigmented macules from apparent autoimmune destruction of melanocytes; S-100 staining shows no melanocytes in the patches. Freckles and lentigines are hyperpigmented.');
mcq('pa-vitiligo-case','dermpath','hub','What is the most likely diagnosis?',
  ['Vitiligo','Oculocutaneous albinism','Piebaldism','Solar lentigo'],
  'Autoimmune melanocyte destruction fits a patient with another autoimmune disease. Albinism has melanocytes present but defective melanin synthesis (often tyrosinase), from birth and generalized. Piebaldism is a congenital, localized absence (white forelock), autosomal dominant.',
  { pbox:[['Patient','20-year-old woman'],['History','Graves disease'],['Skin','Depigmented, sharply demarcated white macules on face, neck and hands'],['Biopsy','S-100 stain: no melanocytes in the basal layer of the patches']] });
mcq('pa-freckle','dermpath','hub','A freckle (ephelis) is caused by:',
  ['Increased melanin in basal keratinocytes after sun exposure','A benign linear proliferation of basal melanocytes','Nests of melanocytes at the dermoepidermal junction','Loss of melanocytes from the epidermis'],
  'Freckles are the most common pigmented lesion of childhood in light-skinned people: more melanin, not more melanocytes. Solar lentigo (age/liver spots) IS more melanocytes in a linear basal proliferation. Nests = nevus.');
mcq('pa-lentigo','dermpath','hub','"Liver spots" on the backs of an older person\'s hands are solar lentigines. What do they show?',
  ['A benign proliferation of basal melanocytes in a linear fashion','Increased melanin in keratinocytes with normal melanocyte numbers','Keratin-filled horn cysts within basaloid cells','Atypical melanocytes with pagetoid spread'],
  'Solar lentigo = more melanocytes (a benign linear basal proliferation) from years of sun damage. Benign, but a marker of sun-damaged skin.');
mcq('pa-nevus','dermpath','deck','A benign neoplasm of melanocytes (a mole) is a:',
  ['Nevocellular nevus','Lentigo','Ephelis','Seborrheic keratosis'],
  'Nevi are tan to brown, uniformly pigmented, small macules or papules with smooth borders, congenital or acquired, made of nests of melanocytes (junctional nevus = nests at the dermoepidermal junction).');
mcq('pa-oral-pigment','dermpath','hub','A patient has a flat, uniformly dark macule on the gingiva next to an old amalgam restoration. Biopsy shows black foreign material in the connective tissue. What is it?',
  ['Amalgam tattoo','Melanotic macule','Junctional nevus','Oral melanoma'],
  'Benign non-neoplastic oral pigmentations: amalgam tattoo (after dental work), graphite tattoo (pencil injury), and melanotic macule (a true melanocytic, often post-trauma lesion with pigmentary incontinence). Foreign material next to an amalgam = amalgam tattoo.');
mcq('pa-abcd','dermpath','hub','Which change in a pre-existing mole most warrants a biopsy for melanoma?',
  ['It has become asymmetric with irregular borders, mixed color and a diameter over 6 mm','It is uniformly tan with smooth borders and has been unchanged for many years','It is a soft, skin-colored tag hanging from the neck on a slender stalk','It is a "stuck on," greasy brown plaque that shows horn cysts on biopsy'],
  'ABCD: Asymmetry, Border irregularity, Color variegation, Diameter >6 mm, plus enlargement, new pain or itching, or a new pigmented lesion in adult life. Dr. Dababneh: "The most important to remember is the A, B, C, D." (Dr. Herr said he would not test the ABCDEs in histology.)');
mcq('pa-melanoma-depth','dermpath','hub','In malignant melanoma, what best predicts the probability of metastasis?',
  ['Depth of invasion beneath the granular layer (vertical growth)','The darkness and number of colors within the lesion','Whether the patient had many freckles as a child','How far the lesion spreads radially across the surface'],
  'Melanoma has radial (across) and vertical (down) growth phases; depth of invasion (T stage) predicts metastasis. Most cases are now caught early enough to cure by excision; BRAF-mutated tumors can get targeted therapy.');
mcq('pa-mimicker','dermpath','hub','A pathologist sees an undifferentiated tumor that does not look squamous or glandular. Which tumor must always be ruled out?',
  ['Melanoma','Basal cell carcinoma','Seborrheic keratosis','Dermatofibroma'],
  'Dr. Dababneh: melanoma metastasizes almost anywhere and "can mimic any cancer in the body... It\'s the great mimicker." Melanoma can also arise in the eye (uveal) and oral cavity (gingiva, palate).');
mcq('pa-pagetoid','dermpath','hub','Melanoma cells spreading upward through the epidermis as single cells is called:',
  ['Pagetoid spread','Peripheral palisading','Pigmentary incontinence','Koilocytosis'],
  'Upward (pagetoid) spread is a sign of malignancy in a melanocytic lesion, with atypical melanocytes that have large red nucleoli. Peripheral palisading belongs to BCC; koilocytes to HPV.');
mcq('pa-sk-case','dermpath','hub','What is the most likely diagnosis?',
  ['Seborrheic keratosis','Actinic keratosis','Basal cell carcinoma','Solar lentigo'],
  'Seborrheic keratosis: a common benign epidermal tumor of middle-aged and older people on the trunk, head and neck, with a velvety "stuck on" look. Horn cysts are very specific for it. A sudden eruption of many SKs (sign of Leser-Trelat) can be paraneoplastic.',
  { pbox:[['Patient','80-year-old man'],['Skin','Many sharply demarcated, light-brown, flat-topped lesions on the trunk, varying in size; "stuck on" appearance'],['Biopsy','Exophytic sheets of small basaloid cells, some melanin; surface keratin; numerous small keratin-filled cysts']], cue:'Horn cysts = seborrheic keratosis. "Stuck on, cysts within."' });
mcq('pa-leser','dermpath','deck','A middle-aged patient suddenly develops dozens of seborrheic keratoses over a few months. What should you consider?',
  ['A paraneoplastic sign (Leser-Trelat) of an internal malignancy','Melanoma arising within the existing keratoses','A normal effect of cumulative sun exposure with age','Contact dermatitis from a new soap or lotion'],
  'Seborrheic keratoses are common in middle-aged and older people, but an abrupt eruption of many can be paraneoplastic (sign of Leser-Trelat). Dr. Dababneh: make sure the patient doesn\'t have a cancer somewhere that is eliciting the reaction.');
mcq('pa-skin-tag','dermpath','hub','A soft, bag-like tumor attached to the skin by a slender stalk, with a fibrovascular core under benign squamous epithelium, is a:',
  ['Fibroepithelial polyp (acrochordon)','Verruca vulgaris','Squamous papilloma','Seborrheic keratosis'],
  'A skin tag: common in middle-aged and older people, often more prominent in pregnancy, harmless.');
mcq('pa-wart-hpv','dermpath','deck','The most common type of wart, verruca vulgaris, is caused by which HPV types?',
  ['HPV 2 and 4','HPV 6 and 11','HPV 3 and 10','HPV 16 and 18'],
  'Vulgaris: HPV 2 and 4 (hands, pebbly). Plana (flat, face/hands): 3 and 10. Plantaris/palmaris: 1 (and 60 per the slide). Condyloma acuminatum: 6 and 11. All are low-risk types; 16 and 18 are high-risk.',
  { cue:'Common wart = 2 and 4 ("too-four common"). Genital = 6 and 11.' });
match('pa-warts-match','dermpath','hub','Match each wart to its HPV types.',
  [['Verruca vulgaris','HPV 2 and 4'],['Verruca plana','HPV 3 and 10'],['Verruca plantaris','HPV 1'],['Condyloma acuminatum','HPV 6 and 11']],
  'All are low-risk HPV, spread by direct contact, and usually regress in 6 months to 2 years. Condylomas are cauliflower-like genital warts.');
mcq('pa-koilocyte','dermpath','hub','Which histologic features identify a verruca?',
  ['Epidermal hyperplasia, koilocytes and prominent keratohyalin granules','Band-like lymphocytes at the dermoepidermal junction','Peripheral palisading with clefting','Neutrophilic microabscesses in the dermal papillae'],
  'Warts show papillary epidermal hyperplasia, heavy keratin, hypergranulosis with big keratohyalin granules, and koilocytes (clear cytoplasm, wrinkled raisinoid nucleus from HPV). The oral counterpart is the squamous papilloma.');
mcq('pa-papilloma','dermpath','hub','What is the oral-mucosa counterpart of a cutaneous verruca?',
  ['Squamous papilloma','Melanotic macule','Fibroepithelial polyp','Geographic tongue'],
  'Dr. Dababneh\'s memory aid: verruca happens in the skin, squamous papilloma in the mucosa. Both are low-risk HPV, benign papillary proliferations.');
mcq('pa-ak','dermpath','hub','A rough, sandpaper-like, scaly red-brown lesion on the sun-exposed forearm of a fair-skinned 65-year-old shows basal keratinocyte atypia, parakeratosis and solar elastosis. What is it, and what can it become?',
  ['Actinic keratosis; it may progress to squamous cell carcinoma','Seborrheic keratosis; it may progress to melanoma','Psoriasis; it may progress to psoriatic arthritis','Lentigo; it may progress to basal cell carcinoma'],
  'Actinic (solar) keratosis is premalignant: atypical basal keratinocytes, parakeratosis, loss of the granular layer, and bluish solar elastosis in the dermis. Some form cutaneous horns. Treat by curettage, freezing or topical chemotherapy.');
mcq('pa-scc-common','dermpath','deck','What is the most common tumor arising on sun-exposed sites in older individuals? Most are cured by resection.',
  ['Squamous cell carcinoma','Basal cell carcinoma','Melanoma','Merkel cell carcinoma'],
  'Per Dr. Dababneh\'s slides: SCC is the most common tumor on sun-exposed sites in older people, most are cured by resection, and only ~5% have metastasized at discovery. (Dr. Taylor\'s slides call BCC the most common skin cancer overall; the two claims are about different things.)');
mcq('pa-scc-ear','dermpath','hub','Dr. Dababneh noted that many cutaneous squamous cell carcinomas reaching the pathology lab come from which site, because people skip sunscreen there?',
  ['The ear','The palm','The scalp under hair','The axilla'],
  'The ears and nose are very common SCC sites. Invasion through the basement membrane into the dermis is what defines malignancy.');
mcq('pa-oral-scc','dermpath','hub','What is the most important risk factor for squamous cell carcinoma inside the oral cavity (not the lip)?',
  ['Tobacco','Sun exposure','HPV 6 and 11','Immunosuppression'],
  'Skin SCC is sun; oral cavity SCC is tobacco (smoked and smokeless), alcohol, repeated trauma and proliferative verrucous leukoplakia. Sun matters only for the lip.');
mcq('pa-bcc','dermpath','hub','Which feature distinguishes basal cell carcinoma from squamous cell carcinoma?',
  ['It is locally aggressive but rarely metastasizes','It arises only in the oral mucosa','It is usually caused by HPV','It shows keratin pearls and koilocytes'],
  'BCC: pearly papules with telangiectasias, rolled borders and ulceration when advanced; histology shows basaloid cells with peripheral palisading and clefting. It drills locally but almost never metastasizes, and it is restricted to the skin. SCC can invade lymphatics and metastasize.',
  { cue:'"Basal is bad, but it stays home." BCC drills down, it doesn\'t travel.' });
mcq('pa-bcc-histo','dermpath','hub','Basaloid tumor islands whose outer cells line up like soldiers, separated from the stroma by a white space, describe:',
  ['Basal cell carcinoma (peripheral palisading and clefting)','Squamous cell carcinoma (keratin pearls and invasion)','Melanoma (pagetoid spread of atypical melanocytes)','Lichen planus (band-like infiltrate at the interface)'],
  'Peripheral palisading and retraction clefts are classic for BCC, not SCC.');
mcq('pa-urticaria','dermpath','hub','Which acute inflammatory dermatosis is IgE-mediated (type I) and caused by localized mast cell degranulation?',
  ['Urticaria','Acute eczematous dermatitis','Erythema multiforme','Psoriasis'],
  'Urticaria (hives): edematous wheals that develop and fade within hours, triggered by pollens, foods, drugs (opiates, antibiotics), venoms. Treat with antihistamines or epinephrine. Histology: superficial dermal edema with a few eosinophils.');
mcq('pa-eczema','dermpath','hub','Red, papulovesicular, oozing, crusted lesions after poison ivy contact, with spongiosis and a superficial perivascular lymphocytic infiltrate, are:',
  ['Acute eczematous dermatitis','Urticaria','Erythema multiforme','Dermatitis herpetiformis'],
  'Eczema types: allergic contact, atopic, drug-related, photoeczematous, primary irritant. Spongiosis is the histologic hallmark.');
mcq('pa-em','dermpath','deck','A self-limited hypersensitivity response to certain infections (herpes simplex, Mycoplasma) and drugs (sulfonamides, penicillin), with target-like lesions, is:',
  ['Erythema multiforme','Urticaria','Pemphigus vulgaris','Lichen planus'],
  'Erythema multiforme: targetoid lesions, 25-50% involve the oral mucosa, may recur; EM major is severe (30% mortality) with extensive mucosal involvement.');
mcq('pa-psoriasis-case','dermpath','hub','What is the most likely diagnosis?',
  ['Psoriasis','Lichen simplex chronicus','Bullous pemphigoid','Dermatitis herpetiformis'],
  'Psoriasis: a chronic T-cell-mediated dermatosis (1-2% of the U.S.), extensor surfaces, scalp, lumbosacral area; nail changes in 30%; Auspitz sign (bleeding because the dermal papillae with their vessels reach up under a thin epidermis).',
  { pbox:[['Patient','20-year-old woman'],['Skin','Well-demarcated circular plaques with silvery scale over red skin on the elbows and knees (extensor surfaces)'],['Exam','Scraping off a scale leaves pinpoint bleeding'],['Family history','Several relatives with a similar rash']] });
mcq('pa-auspitz','dermpath','deck','Auspitz sign (pinpoint bleeding when a scale is scraped off) is characteristic of:',
  ['Psoriasis','Lichen planus','Pemphigus vulgaris','Urticaria'],
  'In psoriasis the dermal papillae and their vessels extend up close to the surface under a thinned suprapapillary epidermis, so removing the scale makes them bleed.',
  { cue:'Auspitz = Points of blood on Psoriasis.' });
mcq('pa-psoriasis-histo','dermpath','hub','Which histologic pattern is "psoriasiform"?',
  ['Acanthosis with elongated dermal papillae reaching up under a thinned epidermis, parakeratosis and neutrophils','A dense band of lymphocytes hugging the dermoepidermal junction, with destruction of the basal cell layer','Suprabasal acantholysis that leaves a single row of "tombstone" basal cells along the basement membrane','Neutrophilic microabscesses at the tips of dermal papillae with subepidermal vesicles and IgA deposits'],
  'Psoriasis: thick (acanthotic) epidermis with long rete, dermal papillae pushing up with vessels and lymphocytes, thick parakeratotic scale, neutrophils/pustules. The band of lymphocytes is lichen planus; tombstones are pemphigus; papillary microabscesses are dermatitis herpetiformis.');
mcq('pa-geographic','dermpath','hub','A patient has red, map-like patches on the dorsum of the tongue where the filiform papillae are lost; biopsy shows psoriasiform hyperplasia. What is the most likely diagnosis?',
  ['Migratory glossitis (geographic tongue)','Oral psoriasis of the dorsal tongue','Oral lichen planus with Wickham striae','Pemphigus vulgaris with ruptured bullae'],
  'Dr. Dababneh: "Psoriasis involving an oral cavity is extremely rare, so migratory glossitis would be the first one." It looks psoriasiform under the microscope but is a separate condition. Watch for this trap: Dr. Taylor\'s slide lists geographic tongue under psoriasis\' oral findings.',
  { cue:'Map on the tongue = geographic tongue, not psoriasis, even though it looks psoriasiform.' });
mcq('pa-lp','dermpath','hub','What is the most likely diagnosis?',
  ['Lichen planus','Psoriasis','Erythema multiforme','Pemphigus vulgaris'],
  'Lichen planus: the four Ps (purple, pruritic, planar papules), Wickham striae, symmetric distribution, oral lesions in 70%. Histology: band-like (lichenoid) lymphocytic infiltrate that destroys the basal layer. Usually self-limited in 1-2 years.',
  { pbox:[['Skin','Itchy, purple, flat-topped papules with fine white lines on both wrists'],['Oral','White, lace-like (reticular) lines on the right AND left buccal mucosa'],['Biopsy','Band of lymphocytes hugging the epithelial-connective tissue junction; basal layer indistinct']] });
mcq('pa-lp-dysplasia','dermpath','hub','A unilateral, sharply demarcated white oral lesion shows a lymphocytic band at the interface. Why should the pathologist be careful about calling it lichenoid mucositis?',
  ['Dysplasia can provoke a lymphocytic host response, and a clonal process is abrupt and one-sided','Lichen planus is always unilateral and sharply demarcated, while dysplasia is always bilateral','A lymphocytic band at the interface rules out dysplasia, so no further workup is ever needed','Dysplasia never involves the epithelial-connective tissue interface, so the band must be lichen planus'],
  'Dr. Dababneh: the body responds to dysplasia with lymphocytes, so a lymphocytic band can hide dysplasia. Bilateral, poorly demarcated, lace-like = lichen planus; abrupt, one-sided = suspicious for a clonal, premalignant process.');
mcq('pa-pemphigus','dermpath','hub','Which describes pemphigus vulgaris?',
  ['IgG against desmosomes causes suprabasal (intraepidermal) blisters that rupture easily','IgG against hemidesmosomes causes tense subepidermal blisters that rarely rupture','IgA deposits in the dermal papillae cause grouped, intensely itchy vesicles','IgE-mediated mast cell degranulation causes wheals that fade within hours'],
  'Pemphigus: type II hypersensitivity; IgG attacks the intercellular attachments (desmosomes), so keratinocytes lose cohesion (acantholysis) above the basal layer, leaving "tombstone" basal cells. Direct immunofluorescence: IgG in a fishnet pattern between cells. Flaccid blisters burst into erosions.');
mcq('pa-pemphigoid','dermpath','deck','Bullous pemphigoid is a type II hypersensitivity reaction with antibodies against:',
  ['Hemidesmosomes of the basal cell layer','Desmosomes between keratinocytes','Reticulin in the anchoring fibrils','IgE receptors on mast cells'],
  'Pemphigoid splits BELOW the epidermis (subepidermal), so the roof is the whole epidermis: tense bullae that don\'t rupture easily and heal with scarring, in elderly patients; ~30% oral. DIF: a straight linear band of IgG and complement along the basement membrane.',
  { cue:'Pemphig-OID = Out, In the Deep: below the epidermis, tense. Pemphig-US = Up above, it Splits easily.' });
match('pa-blister-match','dermpath','hub','Match each blistering disease to its immunofluorescence or histology.',
  [['Pemphigus vulgaris','IgG fishnet between cells'],['Bullous pemphigoid','Linear IgG at basement membrane'],['Dermatitis herpetiformis','Neutrophil microabscesses, IgA'],['Erythema multiforme','Targetoid lesions after infection']],
  'Where the antibody binds decides where the blister forms: desmosomes (pemphigus, intraepidermal), hemidesmosomes (pemphigoid, subepidermal), anchoring fibrils/reticulin with IgA (DH, neutrophils in the papillae).');
mcq('pa-dh','dermpath','hub','What is the diagnosis, and what treats both his skin and GI problems?',
  ['Dermatitis herpetiformis; a gluten-free diet','Herpes simplex infection; acyclovir','Bullous pemphigoid; topical steroids','Psoriasis; tacrolimus'],
  'DH is linked to celiac disease: IgA (and IgG) antibodies to gluten cross-react with reticulin in the anchoring fibrils, and neutrophilic microabscesses form in the dermal papillae. It has nothing to do with herpes despite the name. A gluten-free diet reverses both.',
  { pbox:[['Patient','30-year-old man'],['Skin','Intensely itchy, grouped vesicles in a symmetric pattern on elbows, knees, upper back and buttocks'],['GI','Chronic diarrhea and bloating after eating bread and pasta']] });
mcq('pa-scleroderma','dermpath','deck','Systemic sclerosis is also known as:',
  ['Scleroderma','Lichen sclerosus','Morphea profunda','Sclerotic lupus'],
  'Scleroderma (systemic sclerosis) is excess collagen deposition. Dr. Taylor\'s oral findings: microstomia, limited opening, xerostomia and widening of the PDL space.');
mcq('pa-ex-sun','dermpath','hub','All of the following are caused mainly by sun (UV) exposure EXCEPT:',
  ['Seborrheic keratosis eruption as a paraneoplastic sign','Actinic keratosis on the backs of the hands and forearms','Squamous cell carcinoma of the helix of the ear','Basal cell carcinoma with a rolled border on the nose'],
  'Actinic keratosis, SCC and BCC are the classic sun-damage trio. A sudden eruption of many seborrheic keratoses is a paraneoplastic (Leser-Trelat) sign, not a sun effect.');
mcq('pa-ex-acute','dermpath','hub','All of the following are acute inflammatory dermatoses EXCEPT:',
  ['Lichen planus','Urticaria','Acute eczematous dermatitis','Erythema multiforme'],
  'Acute: urticaria, acute eczematous dermatitis, erythema multiforme. Chronic: psoriasis and lichen planus.');

/* =================================================================== L31 SKELETAL MUSCLE */
mcq('mu-sarcomere','muscle','deck','A sarcomere is the area within a myofibril located between two:',
  ['Z lines','M lines','H bands','A bands'],
  'The sarcomere is the smallest repeating contractile unit, extending from Z line to Z line. Actin anchors at the Z line; myosin is organized at the M line in the middle.',
  { cue:'Sarcomere goes from Z to Z, like the alphabet ends at Z.' });
mcq('mu-zline','muscle','deck','At which structure are the thin (actin) filaments of skeletal muscle attached?',
  ['Z line','M line','H band','Sarcoplasmic reticulum'],
  'Thin filaments are anchored at one end to the Z line and extend toward the center of the sarcomere. Thick filaments are held at the M line.');
mcq('mu-aband','muscle','deck','In skeletal muscle, the thick filaments occupy which band of the sarcomere?',
  ['A band','I band','H band only','Z line'],
  'The A (dark) band marks the full length of the myosin thick filaments, so it never changes length. The I (light) band is thin filament only. The H band is the part of the A band with myosin but no actin.',
  { cue:'A band = dArk, myosin, Always the same length. I band = lIght, thIn.' });
mcq('mu-contract-bands','muscle','hub','During contraction, what happens to the bands of a sarcomere?',
  ['The I and H bands shorten; the A band stays the same','The A band shortens; the I band stays the same','All bands shorten equally','The H band widens while the I band shortens'],
  'Filaments slide; they don\'t shorten. The A band always equals the thick-filament length. I and H bands narrow on contraction and widen on stretch.');
mcq('mu-tnc','muscle','hub','During skeletal muscle contraction, calcium binds to which of the following?',
  ['Troponin C','Tropomyosin','Calmodulin','Myosin light chain'],
  'In skeletal muscle Ca2+ binds troponin C, which shifts troponin and tropomyosin off the myosin-binding sites on actin. Calmodulin is the smooth-muscle Ca2+ sensor (and the calcineurin activator in the derm pharm lecture).');
match('mu-troponin','muscle','hub','Match each troponin subunit to its job.',
  [['Troponin T','Attaches to tropomyosin'],['Troponin C','Binds calcium'],['Troponin I','Inhibits actin-myosin binding']],
  'TnT tethers, TnC catches calcium, TnI inhibits. Tropomyosin covers the myosin sites on actin at rest.');
mcq('mu-myosin-head','muscle','hub','Which part of the myosin II molecule has the ATPase activity and the actin-binding site?',
  ['The S1 head of the heavy chain','The regulatory light chains','The long tail of the heavy chains','The S2 lever arm region'],
  'Myosin II = 2 heavy chains + 2 pairs of light chains. The S1 heads carry the ATP-binding site with ATPase and motor activity plus the actin-binding site.');
mcq('mu-filament-size','muscle','hub','Which pair of measurements matches skeletal muscle filaments?',
  ['Thin: ~1 µm long, 8 nm wide; thick: ~1.6 µm long, 15 nm wide','Thin: ~1.6 µm long, 15 nm wide; thick: ~1 µm long, 8 nm wide','Both ~1 µm long; thin 15 nm, thick 8 nm wide','Thin: 10 µm long; thick: 30 µm long'],
  'Thin (actin, tropomyosin, troponin) ~1 µm × 8 nm; thick (myosin II) ~1.6 µm × 15 nm.');
mcq('mu-triad','muscle','deck','The complex of one T tubule flanked by two terminal cisternae of sarcoplasmic reticulum is the:',
  ['Triad','Dyad','Motor end plate','Sarcomere'],
  'The triad (at the A-I junction in skeletal muscle) is where T-tubule depolarization is passed to the SR. Two T tubules supply each sarcomere.');
mcq('mu-dhpr','muscle','hub','How does T-tubule depolarization open the SR calcium channels in skeletal muscle?',
  ['Voltage-sensing dihydropyridine receptors physically open ryanodine receptors','Acetylcholine diffuses into the T tubule and binds the ryanodine receptor','Calcium entering through the sarcolemma triggers SERCA','IP3 generated at the sarcolemma opens IP3 receptors'],
  'DHP receptors in the T tubule sit directly against ryanodine receptors (RyR) in the SR; their conformational change opens RyR by protein-protein contact, releasing Ca2+.');
seq('mu-ecc','muscle','hub','Put excitation-contraction coupling in order.',
  ['ACh opens nicotinic receptors; sarcolemma depolarizes','Action potential travels down the T tubules','DHP receptors open ryanodine receptors at the triad','Ca2+ binds troponin C','Myosin heads bind actin (cross-bridges)'],
  'Relaxation reverses it: SERCA pumps Ca2+ back into the SR (calsequestrin stores it) and tropomyosin covers the binding sites again.');
mcq('mu-serca','muscle','hub','What returns calcium to the sarcoplasmic reticulum so the muscle relaxes?',
  ['SERCA, the SR Ca2+-ATPase','The ryanodine receptor','Calsequestrin pumping Ca2+ inward','The dihydropyridine receptor'],
  'SERCA actively pumps Ca2+ back in. Calsequestrin is the low-affinity storage protein inside the SR that keeps a steep gradient; it doesn\'t pump.');
mcq('mu-rigor','muscle','deck','Which of the following causes rigor in skeletal muscle?',
  ['A decrease in ATP level','An increase in ATP level','No action potential from motor neurons','A decrease in intracellular Ca2+'],
  'ATP is needed to detach myosin from actin. After death ATP is depleted, pumps fail, Ca2+ rises, and actin and myosin lock together (rigor mortis, 2-6 h after death) until lysosomal enzymes break the cross-bridges 1-2 days later.',
  { cue:'No ATP, no letting go: ATP is the release key, not the squeeze.' });
mcq('mu-rigor-term','muscle','deck','Actin and myosin permanently locked together after death is called:',
  ['Rigor mortis','Tetany','Fasciculation','Malignant hyperthermia'],
  'Rigor mortis typically develops within 2-6 hours of death and persists 1-2 days.');
mcq('mu-syncytium','muscle','deck','A multinucleated cell formed by fusion of many cells, like a skeletal muscle fiber, is a:',
  ['Syncytium','Myoblast','Satellite cell','Fascicle'],
  'Myoblasts fuse end to end into multinucleated myotubes, which mature into muscle fibers with peripheral nuclei: a syncytium. Myoblasts that don\'t fuse become satellite cells.');
mcq('mu-functional-syncytium','muscle','hub','Which muscle types act as a functional syncytium (cells coupled electrically through gap junctions)?',
  ['Cardiac and smooth muscle','Skeletal muscle only','Skeletal and cardiac muscle','All three muscle types'],
  'Cardiac and (single-unit) smooth muscle are coupled by gap junctions so they contract as a unit. Skeletal muscle is an anatomical syncytium (one multinucleated cell per fiber), but each fiber is driven by its own motor nerve ending.');
mcq('mu-satellite','muscle','deck','What are the myogenic stem cells of skeletal muscle?',
  ['Satellite cells','Myoepithelial cells','Pericytes','Fibroblasts'],
  'Satellite cells sit between the sarcolemma and external lamina, are quiescent normally, and after injury or tension proliferate and fuse to repair fibers or form new ones. Their numbers fall with age. Massive damage heals with scar.');
mcq('mu-endomysium','muscle','deck','Which connective tissue sheath surrounds each individual muscle fiber?',
  ['Endomysium','Perimysium','Epimysium','Periosteum'],
  'Endomysium (basal lamina + reticular fibers) surrounds each fiber; perimysium surrounds a fascicle and carries vessels and nerves; epimysium surrounds the whole muscle.',
  { cue:'ENDO = each fiber (inside), PERI = a bundle (around), EPI = the whole muscle (on top).' });
mcq('mu-fascicle','muscle','deck','What is a bundle of muscle fibers within a skeletal muscle called?',
  ['Fascicle','Myofibril','Sarcomere','Myofilament'],
  'Muscle → fascicles (wrapped in perimysium) → fibers/cells (endomysium) → myofibrils → myofilaments (actin, myosin).');
seq('mu-hierarchy','muscle','hub','Order skeletal muscle organization from largest to smallest.',
  ['Whole muscle','Fascicle','Muscle fiber','Myofibril','Myofilament'],
  'Epimysium wraps the muscle, perimysium the fascicle, endomysium the fiber. Myofibrils are made of repeating sarcomeres of thick and thin myofilaments.');
mcq('mu-myoglobin','muscle','deck','Which oxygen-binding protein is expressed mainly in slow-twitch (type I) muscle and makes it dark red?',
  ['Myoglobin','Hemoglobin','Calsequestrin','Troponin'],
  'Myoglobin stores O2 for the high oxidative phosphorylation of sustained contraction. Muscles that work for long periods (soleus, postural muscles) have more.');
mcq('mu-type1','muscle','hub','Which describes type I (slow oxidative) fibers?',
  ['High myoglobin and mitochondria, fatigue resistant, energy from oxidative phosphorylation of fatty acids','Low myoglobin and few mitochondria, fatigue prone, energy from glycolysis of glycogen to lactate','Moderate myoglobin with glycogen stores, fast myosin ATPase, resistant to fatigue at peak tension','The fastest myosin ATPase and the largest SR, used mainly for brief bursts of powerful contraction'],
  'Type I: slow myosin ATPase, red, fatigue resistant (soleus: ~90 ms to peak tension). Type IIb: fast glycolytic, white, fatigue prone (rare in humans). Type IIa: fast oxidative-glycolytic, intermediate.');
mcq('mu-speed','muscle','hub','What determines whether a muscle fiber contracts fast or slowly?',
  ['The myosin isoform\'s ATPase rate','The number of nuclei in the fiber','The length of the thin filaments','The amount of perimysium'],
  'Fast-twitch fibers carry myosin heavy chains that hydrolyze ATP quickly; slow fibers hydrolyze slowly. Fast fibers also have a more developed SR for bigger, faster Ca2+ transients. Lateral rectus peaks in ~8 ms, gastrocnemius ~40 ms, soleus ~90 ms.');
match('mu-fibers-match','muscle','hub','Match each fiber type to its profile.',
  [['Type I','Slow, red, fatigue resistant'],['Type IIa','Fast, oxidative-glycolytic'],['Type IIb','Fast, white, fatigue prone']],
  'Oxidative capacity and myoglobin: I high, IIa moderate, IIb low. Glycolytic capacity: I moderate, IIa and IIb high.');
mcq('mu-endurance','muscle','hub','Which change is expected after endurance training?',
  ['More capillaries, mitochondria and myoglobin, with possible type IIx to IIa conversion','Fiber hypertrophy with more myofibrils and possible type IIa to IIx conversion','Loss of satellite cells and replacement of damaged fibers by scar tissue','A switch from oxidative to purely glycolytic metabolism in every fiber'],
  'Endurance: capillaries, mitochondria, myoglobin up; IIx may convert to IIa. Resistance: mitochondria and myofibrils up, hypertrophy, IIa may convert to IIx.');
mcq('mu-hypertrophy','muscle','hub','What is the primary stimulus for skeletal muscle hypertrophy?',
  ['Increased muscle tension','Increased myoglobin','Decreased ATP','Denervation'],
  'Tension triggers protein synthesis and satellite-cell proliferation; satellite cells fuse with existing fibers or each other. Skeletal muscle has only limited hyperplasia.');
mcq('mu-sarcopenia','muscle','hub','Age-related loss of muscle mass and strength is called:',
  ['Sarcopenia','Rhabdomyolysis','Myasthenia','Atrophic dystrophy'],
  'Sarcopenia comes from altered innervation, hormones, inflammation and calorie/protein intake. Resistance training raises muscle and bone mass and eases osteoarthritis, depression, type 2 diabetes, osteoporosis and cardiovascular disease.');
mcq('mu-glut4','muscle','hub','After a meal, insulin stimulates glucose uptake into skeletal muscle by moving which transporter to the sarcolemma and T tubules?',
  ['GLUT4','GLUT1','GLUT2','SGLT1'],
  'Skeletal muscle holds ~80% of the body\'s stored glucose. Insulin (and, separately, exercise via AMPK) drives GLUT4 vesicles to the membrane.');
mcq('mu-phosphocreatine','muscle','hub','What rapidly replenishes ATP in skeletal muscle during intense exercise?',
  ['Phosphocreatine','Myoglobin','Calsequestrin','Glucose-6-phosphatase'],
  'The ATP pool is tiny (a few contractions). Phosphocreatine regenerates ATP fastest; then fatty acids and glucose (glycogen granules) for longer activity.');
mcq('mu-il6','muscle','hub','Which myokine mediates the anti-inflammatory effects of exercise?',
  ['IL-6','TNF-alpha','IL-1','Histamine'],
  'Skeletal muscle is an endocrine organ: myokines act on brain, fat, bone, liver and more. IL-6 released with exercise has anti-inflammatory effects (it inhibits TNF and raises IL-1ra and IL-10). Myostatin inhibits hypertrophy.');
mcq('mu-spindle','muscle','deck','Which proprioceptor is made of intrafusal fibers and senses muscle stretch?',
  ['Muscle spindle','Golgi tendon organ','Pacinian corpuscle','Motor end plate'],
  'Muscle spindles (intrafusal fibers inside the muscle) sense stretch. Golgi tendon organs sit at the muscle-tendon junction and sense tension. Both appear in Dr. Latimer\'s objectives.');
mcq('mu-ap-short','muscle','hub','The skeletal muscle action potential lasts under 5 ms. Why does that matter?',
  ['Repeated stimulation can summate twitches into a stronger, sustained (tetanic) contraction','It prevents calcium release from the SR until the next action potential arrives','It lets skeletal muscle fibers act as a functional syncytium through gap junctions','It allows the fiber to contract without using ATP for the first few milliseconds'],
  'Because the AP is so short relative to the twitch (Ca2+ peaks ~20 ms), repeated firing raises force. Increasing tension by repetitive stimulation is tetany.');
mcq('mu-ex-thin','muscle','hub','All of the following are components of the thin filament EXCEPT:',
  ['Myosin II','F-actin','Tropomyosin','Troponin'],
  'Thin filament = actin (F-actin from G-actin), tropomyosin and the troponin complex. Myosin II makes the thick filament.');

/* =================================================================== L32 NMJ PHARMACOLOGY */
mcq('nm-hyperK','nmj','lecture-quiz','After surgery, a man with a history of limb denervation injury has a potassium of 5.6 mEq/L. Which perioperative drug most likely contributed to the hyperkalemia?',
  ['Succinylcholine (Anectine)','Glycopyrrolate (Robinul)','Rocuronium','Cisatracurium'],
  'Succinylcholine\'s prolonged depolarization lets K+ leave cells. Denervation, burns, massive trauma, acidosis and neuromuscular disease raise the risk (risk of cardiac arrest), so avoid it there. Nondepolarizers and glycopyrrolate don\'t raise K+.');
mcq('nm-reversal-moa','nmj','lecture-quiz','Reversal of skeletal muscle blockade from rocuronium can be accomplished by a drug with which mechanism?',
  ['Inhibition of acetylcholinesterase','Cleavage of SNARE docking protein','Inhibition of pseudocholinesterase','Activation of GABA-B receptors'],
  'Neostigmine inhibits AChE so more ACh competes with the nondepolarizer at the nicotinic receptor. (Sugammadex is the other rocuronium reverser: it binds the drug.) SNARE cleavage is botulinum toxin; GABA-B agonism is baclofen.');
mcq('nm-spasticity','nmj','lecture-quiz','After an ischemic stroke, a patient has increased tone and painful involuntary spasms of the right arm with marked spasticity. Which drug is most likely to help?',
  ['Tizanidine (Zanaflex)','Methocarbamol (Robaxin)','Cyclobenzaprine (Flexeril)','Rocuronium'],
  'Spasticity of central origin (stroke, MS, cerebral palsy, spinal injury) is treated with spasmolytics: tizanidine, baclofen, diazepam, botulinum toxin. Methocarbamol, cyclobenzaprine and carisoprodol are for ACUTE spasm from injury, not spasticity from CNS disease.',
  { cue:'Spasticity from the brain or cord: "Baclofen, Tizanidine, Diazepam, Botox." Pulled muscle: "Flexeril, Robaxin, Soma."' });
mcq('nm-sux-class','nmj','hub','Succinylcholine is classified as a:',
  ['Depolarizing neuromuscular blocker (nicotinic agonist)','Nondepolarizing competitive nicotinic antagonist','Acetylcholinesterase inhibitor','Central GABA-B agonist'],
  'Succinylcholine opens the nicotinic channel like ACh but isn\'t broken down by AChE at the junction, so the end plate stays depolarized, the perijunctional Na+ channels stay inactivated, and the muscle goes flaccid after initial fasciculations.');
mcq('nm-sux-intub','nmj','hub','A surgical team will intubate a 55-year-old patient and wants a depolarizing neuromuscular blocker with a very rapid onset and short duration. Which is a good choice?',
  ['Succinylcholine','Atracurium','Neostigmine','Cyclobenzaprine'],
  'Succinylcholine: onset 30-60 s, duration usually under 10 min, often used for intubation. Atracurium-type drugs are nondepolarizing; neostigmine is a reversal agent; cyclobenzaprine treats acute muscle spasm.');
seq('nm-sux-seq','nmj','hub','Order the events of a succinylcholine (phase I) block.',
  ['Binds and opens the nicotinic receptor','Perijunctional Na+ channels fire: fasciculations','Not broken down by AChE: end plate stays depolarized','Na+ inactivation gates stay closed: flaccid paralysis'],
  'The Na+ channels\' inactivation gates won\'t reset until the membrane repolarizes, which can\'t happen while succinylcholine sits on the receptor. It is cleared by plasma pseudocholinesterase.');
mcq('nm-pseudo','nmj','hub','A patient recovers from succinylcholine paralysis much more slowly than expected. What is the most likely reason?',
  ['A slow-metabolizing variant of plasma pseudocholinesterase','Excess acetylcholinesterase at the end plate','Rapid hepatic clearance','Pretreatment with sugammadex'],
  'Succinylcholine is metabolized by pseudocholinesterase (butyrylcholinesterase, plasma cholinesterase), not AChE at the junction. Atypical, slow variants ("dibucaine resistant" phenotype) prolong the block.');
mcq('nm-sux-ach','nmj','deck','What is the depolarizing agent that activates ACh receptors at the motor end plate?',
  ['Succinylcholine','Rocuronium','Vecuronium','Cisatracurium'],
  'Succinylcholine is the only depolarizing blocker in the lecture. The "-curium/-curonium" drugs are nondepolarizing competitive antagonists.');
mcq('nm-myalgia','nmj','hub','Postoperative myalgia after succinylcholine likely comes from the fasciculations it causes. Which drug given in the OR can prevent this?',
  ['A small pretreatment dose of a nondepolarizer such as cisatracurium','Baclofen given orally the night before surgery','Dantrolene given intravenously at induction','Lidocaine injected around each major muscle group'],
  'A small "defasciculating" dose of a nondepolarizing blocker before succinylcholine blunts the fasciculations that cause the myalgia. Dantrolene is for malignant hyperthermia; baclofen for spasticity.');
mcq('nm-mh','nmj','hub','What is the mechanism of this reaction, and what is the treatment?',
  ['Uncontrolled Ca2+ release from the SR (ryanodine receptor); dantrolene','Excess ACh at the end plate from blocked AChE; neostigmine','Hyperkalemia from prolonged depolarization; sugammadex','Massive histamine release from mast cells; diphenhydramine'],
  'Malignant hyperthermia: usually succinylcholine plus a volatile halogenated anesthetic triggers uncontrolled SR Ca2+ release through the ryanodine receptor, causing contracture, heat, acidosis and tachycardia. Dantrolene blocks the RyR channel and decreases SR Ca2+ release.',
  { pbox:[['Setting','General anesthesia: desflurane, succinylcholine for intubation'],['Minutes later','Jaw and limb rigidity, rising end-tidal CO2, temperature climbing, tachycardia'],['Labs','Metabolic acidosis']] });
mcq('nm-dantrolene','nmj','deck','Which direct-acting spasmolytic is used to treat malignant hyperthermia?',
  ['Dantrolene','Baclofen','Tizanidine','Diazepam'],
  'Dantrolene acts on the muscle itself, blocking the ryanodine receptor Ca2+ channel in the SR. Baclofen, tizanidine and diazepam act in the CNS.',
  { cue:'DANTROlene shuts the SR Door: it is the ryanodine receptor blocker.' });
mcq('nm-sux-cv','nmj','hub','Succinylcholine can cause bradycardia. Why?',
  ['It stimulates cardiac muscarinic receptors and vagal activity','It blocks cardiac beta-1 adrenergic receptors at the SA node','It depletes ATP in cardiac pacemaker cells within minutes','It causes hypokalemia that slows conduction through the AV node'],
  'Succinylcholine stimulates all ACh receptors to some degree, including cardiac muscarinic receptors in the SA node (bradycardia) and autonomic ganglia; higher doses can raise sympathetic activity, tachycardia and hypertension.');
mcq('nm-ndb','nmj','hub','How do rocuronium, vecuronium and cisatracurium work?',
  ['They competitively block ACh at the nicotinic receptor of the end plate','They open the nicotinic channel and hold the end plate depolarized','They block ACh release from the motor nerve terminal','They inhibit acetylcholinesterase'],
  'Nondepolarizing blockers are competitive nicotinic antagonists (prototype tubocurarine). Clue to the names: they end in "-curium" or "-curonium."');
mcq('nm-fade','nmj','hub','Why do nondepolarizing blockers show "fade" with train-of-four stimulation?',
  ['They also block prejunctional nicotinic receptors that normally boost ACh release during repeated firing','They are metabolized faster by pseudocholinesterase with each successive nerve stimulus','They depolarize the end plate a little more with each stimulus until the Na+ channels close','They deplete calcium from the sarcoplasmic reticulum so later twitches have less Ca2+'],
  'Prejunctional ACh receptors provide positive feedback to mobilize ACh during sustained firing. Blocking them makes each successive response weaker. (TOF > 0.9 is needed to extubate; the monitoring slide is marked FYI.)');
mcq('nm-neostigmine','nmj','hub','Neostigmine is given to reverse a nondepolarizing blocker. Why is it NOT used to reverse succinylcholine?',
  ['More ACh would add to the depolarization and prolong or intensify the block','Neostigmine is metabolized by pseudocholinesterase','Succinylcholine has no effect on nicotinic receptors','Neostigmine only works on smooth muscle'],
  'Against a competitive antagonist, extra ACh wins the receptor back. Against a depolarizing blocker, extra ACh just adds depolarization.');
mcq('nm-atropine','nmj','hub','At the end of surgery, a low dose of atropine is given just before pyridostigmine to reverse a nondepolarizing relaxant. What is the main reason for the atropine?',
  ['To block cardiac muscarinic receptors from the extra ACh','To enhance the action of the cholinesterase inhibitor','To provide postoperative analgesia','To reverse the muscle relaxant directly'],
  'AChE inhibitors raise ACh everywhere, causing bradycardia and bronchospasm through muscarinic receptors. An antimuscarinic (atropine or glycopyrrolate) is given first to block those effects; the nicotinic reversal still happens.');
mcq('nm-mg','nmj','hub','A 42-year-old man with myasthenia gravis gets stronger on an acetylcholinesterase inhibitor. Why?',
  ['More ACh remains at the muscle end plates','More ACh is released from the motor nerves','More ACh receptors are made on the end plates','Less norepinephrine is released at the junction'],
  'Myasthenia gravis antibodies block or destroy nicotinic receptors. AChE inhibitors don\'t add receptors or release; they let each ACh molecule linger and compete for the remaining receptors.');
mcq('nm-ache','nmj','deck','Which enzyme degrades acetylcholine at the neuromuscular junction?',
  ['Acetylcholinesterase','Pseudocholinesterase','Choline acetyltransferase','Monoamine oxidase'],
  'AChE in the synaptic cleft terminates the signal. Pseudocholinesterase is the plasma enzyme that metabolizes succinylcholine. Choline acetyltransferase makes ACh.');
mcq('nm-ache-i','nmj','deck','Which of these is an acetylcholinesterase inhibitor?',
  ['Neostigmine','Sugammadex','Glycopyrrolate','Dantrolene'],
  'AChE inhibitors from the deck: neostigmine, pyridostigmine, physostigmine (and the dementia drugs rivastigmine, galantamine, donepezil). Sugammadex binds steroidal blockers; glycopyrrolate is antimuscarinic.');
mcq('nm-sugammadex','nmj','hub','Which agent reverses rocuronium or vecuronium by binding the drug and reducing the amount available at the nicotinic receptor?',
  ['Sugammadex','Neostigmine','Edrophonium','Physostigmine'],
  'Sugammadex is a modified gamma-cyclodextrin that encapsulates the steroidal blockers. AEs: bradycardia, anaphylaxis/hypersensitivity. Interaction: it can interfere with hormonal contraceptives.',
  { cue:'SUGAmmadex is a SUGAr ring (cyclodextrin) that swallows -curonium.' });
mcq('nm-sugammadex-ddi','nmj','hub','A 26-year-old woman on oral contraceptives received sugammadex during surgery. What should she be told?',
  ['It can reduce the effectiveness of her hormonal contraceptive','It permanently inactivates acetylcholinesterase','She must avoid succinylcholine for 30 days','It causes malignant hyperthermia with estrogen'],
  'Sugammadex can bind and interfere with hormonal contraceptives, so backup contraception is advised. Other AEs: bradycardia, anaphylaxis.');
mcq('nm-baclofen','nmj','hub','Which drug is a GABA-B agonist used orally or intrathecally for spasticity?',
  ['Baclofen','Tizanidine','Diazepam','Dantrolene'],
  'Baclofen acts at pre- and postsynaptic GABA-B receptors: less glutamate release and a hyperpolarized postsynaptic neuron. AEs: weakness, sedation (less than benzodiazepines), hypotonia, confusion. Diazepam is a GABA-A drug.');
mcq('nm-baclofen-case','nmj','deck','A soccer player keeps missing matches because of recurrent muscle spasm. Which drug from this lecture is most helpful?',
  ['Baclofen','Ibuprofen','Cisatracurium','Succinylcholine'],
  'From the study deck\'s key. Of these options baclofen, a spasmolytic, is the only muscle relaxant for outpatient use; the blockers are for anesthesia. In the lecture\'s scheme, acute spasm from an injury is also treated with cyclobenzaprine, methocarbamol or carisoprodol.');
mcq('nm-tizanidine','nmj','hub','Which spasmolytic is a central alpha-2 agonist that causes drowsiness, hypotension, dry mouth and hepatotoxicity, and causes rebound hypertension if stopped suddenly?',
  ['Tizanidine','Baclofen','Botulinum toxin','Cyclobenzaprine'],
  'Tizanidine (Zanaflex): alpha-2 agonist, presynaptic inhibition of motor neurons, oral; less muscle weakness than other spasmolytics; additive with CNS depressants; taper to avoid rebound hypertension.');
mcq('nm-botox','nmj','hub','How does botulinum toxin paralyze a muscle?',
  ['It cleaves SNARE proteins needed for ACh vesicle release','It blocks the nicotinic receptor competitively','It inhibits acetylcholinesterase','It blocks the ryanodine receptor'],
  'Botulinum toxin cleaves SNARE docking proteins so ACh vesicles can\'t fuse. Uses: cervical dystonia, hyperhidrosis, strabismus, blepharospasm, urge incontinence, chronic migraine, wrinkles, and possibly refractory bruxism (temporalis and masseter injections). AEs: dysphagia, weakness, dyspnea.');
mcq('nm-botox-deck','nmj','deck','Which toxin blocks the release of acetylcholine from motor nerves?',
  ['Botulinum toxin','Tetrodotoxin','Alpha-bungarotoxin','Curare'],
  'Botulinum toxin works presynaptically on the SNARE machinery. Curare and alpha-bungarotoxin block the receptor; tetrodotoxin blocks Na+ channels.');
mcq('nm-acute-spasm','nmj','hub','Which drug is used for acute muscle spasm after an injury, works by a poorly understood central sedative mechanism, and has antimuscarinic effects?',
  ['Cyclobenzaprine (Flexeril)','Tizanidine (Zanaflex)','Baclofen (Lioresal)','Dantrolene'],
  'The "other central skeletal muscle relaxants": cyclobenzaprine (antimuscarinic AEs), methocarbamol, and carisoprodol (dependence potential). They treat spasm from injury or inflammation, not spasticity from neurologic disease.');
mcq('nm-uses','nmj','hub','Neuromuscular blocking drugs are used for all of these EXCEPT:',
  ['Treating chronic spasticity after stroke','Surgery under general anesthesia','Mechanical ventilation in the ICU','Electroconvulsive therapy'],
  'Paralytics are for surgery, ventilation, ECT and severe seizure activity. Chronic spasticity gets spasmolytics (baclofen, tizanidine, diazepam, botulinum toxin).');
match('nm-drugs-match','nmj','hub','Match each drug to its mechanism.',
  [['Rocuronium','Competitive nicotinic antagonist'],['Sugammadex','Encapsulates steroidal blocker'],['Baclofen','GABA-B agonist'],['Dantrolene','Blocks ryanodine receptor']],
  'Plus: succinylcholine (depolarizing nicotinic agonist), neostigmine (AChE inhibitor), tizanidine (central alpha-2 agonist), botulinum toxin (cleaves SNARE).');
mcq('nm-ex-sux','nmj','hub','All of the following are adverse effects of succinylcholine EXCEPT:',
  ['Hypokalemia','Myalgia','Increased intraocular pressure','Malignant hyperthermia with volatile anesthetics'],
  'Succinylcholine causes HYPERkalemia, plus myalgia, raised intraocular and intragastric pressure, hypersensitivity, bradycardia, and malignant hyperthermia with volatile anesthetics.');

/* =================================================================== CA MSK & SKIN: CLINICAL APPLICATION FOR DENTISTRY */
mcq('ca-lat-pteryg','clinical','hub','Which is the only muscle of mastication associated with opening the mouth?',
  ['Lateral pterygoid','Medial pterygoid','Masseter','Temporalis'],
  'Masseter, temporalis and medial pterygoid elevate (close); the lateral pterygoid protrudes and opens. Accessory openers: digastric, mylohyoid, geniohyoid.',
  { cue:'"Lateral Lowers": the lateral pterygoid is the one that opens.' });
mcq('ca-accessory','clinical','hub','Which group lists accessory muscles that help open the jaw?',
  ['Digastric, mylohyoid, geniohyoid','Masseter, temporalis, buccinator','Medial pterygoid, masseter, platysma','Orbicularis oris, mentalis, risorius'],
  'The suprahyoids (digastric, mylohyoid, geniohyoid) depress the mandible along with the lateral pterygoid.');
mcq('ca-tmj','clinical','hub','The TMJ is classified as a:',
  ['Ginglymoarthrodial joint','Pure hinge joint','Fibrous syndesmosis','Ball-and-socket joint'],
  'Ginglymoarthrodial = hinge (ginglymus) plus gliding (arthrodial) movement.');
mcq('ca-osteoporosis','clinical','hub','Which describes osteoporosis?',
  ['Bone resorption exceeds formation, lowering bone mass and raising fracture risk','Defective mineralization of osteoid from vitamin D deficiency softens the bone','Chaotic remodeling builds disorganized bone with cotton-wool radiographs','Infection of the bone leads to a draining fistula and sequestrum formation'],
  'Osteoporosis: low bone mass and microarchitecture deterioration, measured by DEXA (hip, spine). Risks: aging, postmenopausal estrogen loss, smoking, corticosteroids, vitamin D deficiency, hyperparathyroidism. Osteomalacia is the mineralization defect.');
mcq('ca-osteomalacia','clinical','hub','A child with vitamin D deficiency has delayed tooth eruption and enamel hypoplasia. In an adult, the same defect in osteoid mineralization is called:',
  ['Osteomalacia','Osteoporosis','Paget disease','Osteomyelitis'],
  'Rickets (children) and osteomalacia (adults): low vitamin D → less calcium absorption → poorly mineralized, soft bone. Oral: delayed eruption, enamel hypoplasia, more caries, malocclusion; films show low density and thin cortices.');
mcq('ca-paget','clinical','hub','What is the most likely diagnosis?',
  ['Paget disease of bone','Osteoporosis','Osteomalacia','Scleroderma'],
  'Paget: increased osteoclast AND osteoblast activity with disorganized bone; maxilla more than mandible. Dental implications: hypercementosis, difficult extractions, more bleeding in surgery.',
  { pbox:[['Patient','68-year-old man'],['Complaint','Upper denture no longer fits; facial bones look larger'],['Exam','Enlarged maxilla; increased spacing between remaining teeth'],['Radiographs','Patchy "cotton wool" radiopacities; hypercementosis of the roots']] });
mcq('ca-osteomyelitis','clinical','hub','Osteomyelitis of the jaws is usually odontogenic. Which finding is the dead bone that can separate from living bone?',
  ['Sequestrum','Involucrum','Osteophyte','Torus'],
  'Osteomyelitis: pain, fever, swelling, draining fistula, sequestrum (dead bone), persistent infection. Risk factors: diabetes, immunosuppression, radiation, MRONJ. Sources: necrotic teeth, untreated abscesses, trauma.');
mcq('ca-mronj-bp','clinical','hub','How do bisphosphonates predispose to medication-related osteonecrosis of the jaw (MRONJ)?',
  ['They bind hydroxyapatite and are taken up by osteoclasts, causing osteoclast apoptosis','They act as an IgG2 antibody against RANKL, so osteoclasts never differentiate','They stimulate osteoblasts to overgrow the healing socket and wall off blood supply','They block 1-alpha hydroxylation of vitamin D in the kidney, softening the jaw'],
  'Bisphosphonates have high affinity for hydroxyapatite; resorbing osteoclasts ingest them and die, so the jaw can\'t remodel and heal after trauma. Denosumab is the RANKL-inhibiting IgG2 antibody that stops osteoclast differentiation.');
mcq('ca-mronj-risk','clinical','hub','Which patient on antiresorptive therapy has the highest MRONJ risk?',
  ['One receiving IV bisphosphonate therapy','One taking oral alendronate for 1 year','One who finished all extractions before starting therapy','One taking vitamin D supplements only'],
  'Highest risk is with IV therapy. Before starting: eliminate infection, complete extractions, keep excellent hygiene; during therapy use atraumatic technique and be cautious with extractions and surgery.');
mcq('ca-pre-bp','clinical','hub','A patient is about to start an osteoporosis medication. What is the best dental plan?',
  ['Complete needed extractions and eliminate infection before the drug is started','Delay all dental care until the drug has been taken for at least 6 months','Extract the hopeless teeth only after the first IV dose has been given','Avoid hygiene visits during therapy to limit trauma to the gingiva'],
  'Treat before starting: eliminate sources of infection, complete extractions, establish excellent oral hygiene, then use atraumatic techniques.');
mcq('ca-oa-ra','clinical','hub','A patient has rheumatoid arthritis with severe TMJ involvement. Which occlusal change may develop?',
  ['Anterior open bite','Class III crossbite from mandibular overgrowth','Deep overbite from condylar enlargement','Bilateral posterior crossbite from maxillary growth'],
  'RA is autoimmune with cartilage destruction and bone erosion; condylar loss can produce an anterior open bite. OA is degenerative cartilage loss with osteophytes, more common in weight-bearing joints.');
mcq('ca-tmd-class','clinical','hub','Myofascial pain with trigger points and referred pain belongs to which TMD category?',
  ['Muscle disorders','Disc disorders','Joint disorders','Developmental disorders'],
  'Muscle disorders: myalgia, myofascial pain. Disc disorders: displacement with or without reduction. Joint disorders: OA, RA, ankylosis, synovitis, capsulitis.');
mcq('ca-tmd-tx','clinical','hub','Which is a conservative first step in TMD treatment?',
  ['Rest with a soft diet and limited use','Open joint surgery on the affected side','Arthroscopy of the joint space','Condylectomy with disc replacement'],
  'TMJ treatment ladder: rest (soft diet, limit use), physical therapy, NSAIDs and muscle relaxants, splints, then surgery (arthrocentesis, arthroscopy, open joint surgery); Botox is also listed.');
mcq('ca-tmj-xray','clinical','hub','Which radiographic finding fits degenerative TMJ disease?',
  ['Flattening of the condyle with osteophytes and joint space narrowing','A widened joint space with a smooth, enlarged round condyle','Cotton-wool radiopacities scattered through the ramus','A sequestrum of dead bone in the condylar neck'],
  'Radiographic TMD findings: condylar flattening, osteophytes, narrowed joint space, subchondral sclerosis. Signs: pain, clicking, popping, crepitus.');
mcq('ca-oral-vs-skin','clinical','hub','How does oral mucosa differ from skin?',
  ['It has no hair follicles or sweat glands and variable keratinization','It has a thicker epithelium than skin','It always has a stratum lucidum','It contains eccrine glands but no sebaceous glands'],
  'Skin: keratinized surface, hair follicles, sweat glands, thicker epidermis. Oral mucosa: variable keratinization, no hair follicles, no sweat glands, thinner epithelium.');
mcq('ca-pemph-oral','clinical','hub','In pemphigus vulgaris, which oral feature is emphasized for dentists?',
  ['Oral lesions commonly appear before skin lesions','Oral lesions are rare and appear only late','Oral blisters are tense and rarely rupture','It never causes desquamative gingivitis'],
  'Pemphigus: autoantibodies to desmosomes, intraepithelial blisters; oral painful ulcers, fragile bullae and desquamative gingivitis, often before the skin. Dentists may see it first. (Slides disagree on how often the mouth is involved: Dr. Dababneh\'s slide says 10%, his talk said nearly all; the textbook figure is most patients.)');
mcq('ca-pemphigoid-oral','clinical','hub','Mucous membrane/bullous pemphigoid in the mouth typically shows:',
  ['Desquamative gingivitis, ulcers and erythematous mucosa from subepithelial blisters','Lace-like white Wickham striae on both buccal mucosae from a lymphocytic band','A map-like tongue with lost filiform papillae and psoriasiform histology','Diffuse brown pigmentation of the gingiva from adrenal insufficiency'],
  'Pemphigoid: autoantibodies against basement-membrane components (hemidesmosomes) cause subepithelial blisters; orally, ulcers, desquamative gingivitis and red mucosa.');
mcq('ca-lupus','clinical','hub','A patient with a butterfly facial rash, arthritis and renal disease has oral ulcers and white striae. Which dental consideration is most important?',
  ['Immunosuppressive and steroid therapy raise infection risk','The jaw is at high risk for MRONJ after any extraction','Local anesthetic with epinephrine is contraindicated','Fluoride varnish must be avoided because of renal disease'],
  'SLE: oral ulcers, erythematous lesions, white striae. Dental considerations: immunosuppressive medications, steroid use and higher infection risk.');
mcq('ca-scleroderma','clinical','hub','Which oral finding is classic for scleroderma (systemic sclerosis)?',
  ['Microstomia with limited opening and a widened PDL space','Diffuse brown gingival pigmentation and fatigue','A map-like tongue with migrating red patches','Cotton-wool radiopacities with hypercementosis'],
  'Excess collagen deposition: microstomia, limited mouth opening, xerostomia, uniform widening of the PDL space on radiographs.');
mcq('ca-addison','clinical','hub','A patient has fatigue, low blood pressure and diffuse brown pigmentation of the gingiva and buccal mucosa. Which condition should you suspect?',
  ['Addison disease (adrenal insufficiency)','Vitiligo with oral involvement','A large amalgam tattoo','Oral lichen planus'],
  'Addison disease causes diffuse mucosal and gingival pigmentation, and oral pigmentation may be an early sign. Vitiligo depigments (oral mucosa and lips). An amalgam tattoo is focal next to a restoration.');
mcq('ca-vitiligo-oral','clinical','hub','Which oral finding fits vitiligo?',
  ['Depigmented oral mucosa and lips','Diffuse brown gingival pigmentation','Microstomia','Desquamative gingivitis'],
  'Vitiligo is autoimmune destruction of melanocytes, so oral involvement is depigmentation (often the lips). Diffuse brown pigmentation suggests Addison disease.');
mcq('ca-eczema','clinical','hub','Which dental concern goes with eczema?',
  ['Higher rates of allergy, including latex and medication allergies','Microstomia that limits access to the posterior teeth','MRONJ risk from the bisphosphonates used to treat it','Enamel hypoplasia and delayed eruption from vitamin D loss'],
  'Eczema: chronic inflammatory, itchy skin disease with increased allergy prevalence (possible asthma association), so screen for latex sensitivity and medication allergies.');
mcq('ca-acne-dental','clinical','hub','Which oral side effect is listed for isotretinoin (Accutane)?',
  ['Xerostomia, cheilitis and mucosal dryness','Fibrous gingival enlargement and bleeding','Black hairy tongue and candidiasis','Desquamative gingivitis and bullae'],
