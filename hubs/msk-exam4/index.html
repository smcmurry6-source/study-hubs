skin: `
<div class="tested"><b>What's tested</b><ul><li>The five epidermal layers in order and what each one does</li><li>The four epidermal cells, their percentages and layers (keratinocytes 95%)</li><li>Keratinization, the water barrier, and desmosomes vs hemidesmosomes</li><li>Melanin: tyrosinase, the melanin unit, and why skin color differs</li><li>Papillary vs reticular dermis, sensory receptors, eccrine vs apocrine vs sebaceous glands</li></ul></div>
<p>Skin is the body's largest organ: about 2 m², 8-10 lb, on average 3 mm thick. Each square centimeter packs about 10 hair follicles, 100 sweat glands, meters of capillaries and nerve fibers, and up to 2,500 sensory cells in a fingertip. Dr. Herr called it the organ that "just does everything": <b>barrier and protection</b> (mechanical, thermal, chemical, UV, water loss), <b>immunologic</b> defense, <b>sensation</b>, <b>thermoregulation</b>, water and electrolyte balance, <b>exocrine</b> (sweat, sebum) and <b>endocrine</b> (cytokines, growth factors) functions, <b>biotransformation</b> (vitamin D3 from 7-dehydrocholesterol with UV; cytochrome P450 detoxification), and social identity.</p>
<h4>Three regions</h4>
<p>The <b>epidermis</b> is keratinized stratified squamous epithelium, 0.04 mm (eyelid) to 1.6 mm (soles) thick, and <b>avascular</b>: it is fed by diffusion from the dermis. The <b>dermis</b> (1.5-4 mm) is connective tissue, about 75% collagen by dry weight, carrying vessels, lymphatics, nerves and the appendages. The <b>hypodermis</b> (subcutaneous layer) is loose connective tissue and fat; it anchors skin to deeper structures and lets it slide over the deep fascia, but it is not technically part of the skin. Recognition order on a slide: epithelium → dense connective tissue → adipose.</p>
<p><b>Thick skin</b> (palms and soles only) has a very thick stratum corneum, a stratum lucidum, eccrine glands and no hair. <b>Thin skin</b> covers everything else and has hair follicles and sebaceous glands. Slide clue: hair follicle present = thin skin. "Thick" and "thin" describe the epidermis, especially the corneum, not total skin thickness.</p>
<h4>The epidermal layers</h4>
<p>Deep to superficial: <b>"Before Signing, Get Legal Counsel."</b></p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Layer</th><th>What defines it</th></tr></thead><tbody>
<tr><td>Stratum basale</td><td>Single layer of mitotically active stem cells on the basal lamina; contains melanin and melanocytes; attached to neighbors by desmosomes and to the basal lamina by <b>hemidesmosomes</b></td></tr>
<tr><td>Stratum spinosum</td><td>Several layers of larger, flatter "prickle" cells joined by <b>desmosomes</b> anchored to tonofibrils (mechanical strength); home of Langerhans cells</td></tr>
<tr><td>Stratum granulosum</td><td>1-3 cells thick in thin skin; intensely basophilic <b>keratohyalin granules</b> (filaggrin precursor profilaggrin); lamellar bodies release lipid here</td></tr>
<tr><td>Stratum lucidum</td><td>Thick skin only; pale, translucent subdivision of the corneum</td></tr>
<tr><td>Stratum corneum</td><td>Most differentiated: dead, flattened, anucleate keratinized cells with an extracellular lipid layer (the water barrier); varies the most in thickness</td></tr>
</tbody></table></div>
<p>Slide summary: <b>basale divides; spinosum connects; granulosum packages; corneum protects.</b> The "spines" of the spinosum are desmosome sites that stay attached while the cells shrink during processing. Exam distinction: <b>desmosomes join cell to cell; hemidesmosomes join basal cells to the basement membrane.</b></p>
<h4>Keratinocytes and keratinization</h4>
<p><b>Keratinocytes</b> are about 95% of epidermal cells. They make keratins, cross-linking enzymes and lipids, take up melanin to protect their nuclei from UV, constantly renew and shed, and release cytokines to signal a barrier breach. <b>Keratinization</b> (cornification) is terminal differentiation by programmed cell death: the DNA fragments but the cell does not, the nucleus and organelles are lost, and the finished cell is about 85% keratin. In the granulosum, filaggrin aggregates keratin filaments into fibrils. The pH falls from about neutral to acidic toward the surface, and that drop activates proteases that chew through desmosomes so corneocytes flake off (Dr. Herr: you don't need the names KLK or LEKTI).</p>
<p>The <b>water barrier</b> comes from <b>lamellar bodies</b> (Golgi-derived granules of glycosphingolipids, phospholipids and ceramides) secreted between the stratum granulosum and stratum corneum, plus insoluble proteins laid on the inner face of the plasma membrane: a cell envelope plus a lipid envelope, "bricks and mortar." Rubbing and pressure stimulate keratin synthesis and form a <b>callus</b>; too much friction too fast makes a blister, and a callus fades if the activity stops.</p>
<h4>Melanocytes and pigment</h4>
<p><b>Melanocytes</b> (1-3% of epidermal cells, 800-2,300/mm²) come from <b>neural crest</b>, arrive around week 8, and self-renew with UV. Their cell bodies sit in the stratum basale on the basement membrane, with dendritic processes reaching into the spinosum. They form <b>no desmosomes</b> with neighbors, so they look pale on H&E. In melanosomes, <b>tyrosinase</b> oxidizes tyrosine to <b>DOPA</b>, then melanin (tyrosinase works only in melanocytes). Melanosomes mature, travel to the dendrite tips, and are pinched off into about <b>36 keratinocytes</b> (one melanin unit) by <b>cytocrine</b> transfer. In the keratinocyte, melanin sits <b>above the nucleus like an umbrella</b>, absorbing UV and scavenging free radicals. (The notes also give a 1:4-1:10 melanocyte:keratinocyte ratio; Dr. Herr said the mismatch is "not that big of a point.")</p>
<p>Take-home: <b>skin color is not the number of melanocytes.</b> People have similar numbers at the same site. Darker skin makes more melanin (eumelanin is brown-black, phaeomelanin yellow-red) in larger, more dispersed melanosomes that persist longer; lighter skin degrades melanosomes sooner. Disorders: <b>albinism</b> (autosomal recessive; melanocytes present but melanin synthesis impaired, sometimes tyrosinase), <b>piebaldism</b> (autosomal dominant; patches with no melanocytes, e.g. a white forelock), and <b>melanoma</b>.</p>
<h4>Langerhans and Merkel cells</h4>
<p><b>Langerhans cells</b> (1-3%) are antigen-presenting dendritic cells with MHC I and II in the <b>stratum spinosum</b>. They come from bone marrow, seed the epidermis at about 12 weeks of gestation, help in acute wound healing, and self-renew. Resting cells survey; activated cells leave through lymphatics to activate the adaptive immune system. Don't confuse their dendritic shape with melanocytes: melanocytes make pigment, Langerhans cells present antigen. <b>Merkel cells</b> are modified epithelial cells in the basal layer that, with their nerve endings, sense sustained light touch.</p>
<h4>Dermoepidermal junction and dermis</h4>
<p>The junction attaches epidermis to dermis, gives tensile strength, lets nutrients and O2 diffuse up to the avascular epidermis, and separated ectoderm from mesoderm in development. What to remember: <b>hemidesmosomes and type XVII collagen</b> (BP180, with integrin α6β4) anchor basal cells to the basement membrane. (Don't memorize the AI-drawn diagram.) Downward <b>epidermal (rete) ridges</b> interlock with upward <b>dermal papillae</b>, resisting shear; in thick skin these form fingerprints.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Papillary dermis</th><th>Reticular dermis</th></tr></thead><tbody>
<tr><td>Thickness</td><td>Thin, superficial</td><td>Much thicker, deep</td></tr>
<tr><td>Tissue</td><td>Loose connective tissue, more cellular</td><td>Dense irregular, less cellular</td></tr>
<tr><td>Collagen</td><td>Types I and III</td><td>Mostly coarse type I + coarse elastic fibers</td></tr>
<tr><td>Contents</td><td>Capillary loops and nerve endings serving the epidermis; Meissner corpuscles</td><td>Hair follicle bases, arrector pili, sweat glands, larger vessels; forms <b>Langer's lines</b></td></tr>
</tbody></table></div>
<p><b>Fibroblasts</b> make collagen, elastin and proteoglycans and remodel in healing; <b>mast cells</b> release histamine; macrophages and lymphocytes are recruited. <b>Langer's lines</b> are tension lines of reticular collagen and elastic fibers: incisions along them scar less. A shallow cut bleeds because capillary loops reach up into the dermal papillae. Those loops also run <b>thermoregulation</b>: in heat they dilate (radiation, convection) and eccrine sweat evaporates; in cold, vessels constrict and blood is shunted (blushing and paling are the same vessels).</p>
<p>The <b>hypodermis</b> has fat lobules with septa carrying vessels and nerves, and skin ligaments to the deep fascia; it stores energy and insulates, and its thickness varies with body habitus.</p>
<h4>Sensory receptors</h4>
<p>Nerves can end in the dermis or epidermis. <b>Free nerve endings</b> are the most numerous (pain, temperature, itch, crude touch). Of the encapsulated endings (no need to memorize the A-F diagram):</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Meissner corpuscle</th><th>Pacinian corpuscle</th></tr></thead><tbody>
<tr><td>Where</td><td>Dermal papillae (superficial)</td><td>Deep dermis and hypodermis</td></tr>
<tr><td>Looks like</td><td>Small, oval</td><td>Large, onion-like concentric lamellae</td></tr>
<tr><td>Senses</td><td>Light touch, low-frequency stimuli (fingertip sensitivity)</td><td>Pressure and vibration (capsule displacement)</td></tr>
</tbody></table></div>
<h4>Appendages</h4>
<p><b>Hair</b> grows from the matrix around the dermal papilla of the bulb; it is entirely hard keratin, its color comes from melanin, and growth is hormonal (distribution follows sex hormones; scalp hair thins with age, genetics and androgen sensitivity). <b>Arrector pili</b> are smooth muscle from the deep follicle to the superficial dermis; sympathetic signaling in cold or fear raises goosebumps.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Eccrine</th><th>Apocrine</th><th>Sebaceous</th></tr></thead><tbody>
<tr><td>Where</td><td>Almost everywhere except lips and parts of external genitalia</td><td>Axilla, areola/nipple, perianal skin, external genitalia</td><td>With hair follicles (outgrowth of the external root sheath)</td></tr>
<tr><td>Opens to</td><td>Skin surface directly</td><td>Hair follicle</td><td>Pilosebaceous canal of the follicle</td></tr>
<tr><td>Secretion mode</td><td>Merocrine</td><td><b>Merocrine</b> (the name "apocrine" is a misnomer)</td><td><b>Holocrine</b> (whole cell becomes sebum)</td></tr>
<tr><td>Responds to</td><td>Heat and emotion (sympathetic cholinergic)</td><td>Emotional and sensory stimuli, NOT heat</td><td>Hormones</td></tr>
<tr><td>Product</td><td>Watery hypotonic sweat, pH 4.5-5.5 (inhibits bacteria), 2-3 L/h on a warm day</td><td>Protein- and lipid-rich, odor after bacteria act on it</td><td>Sebum coating hair and skin</td></tr>
</tbody></table></div>
<p>Eccrine sweat is made isotonic, then the duct reabsorbs sodium, making it hypotonic. Thermoregulatory sweating starts on the forehead and scalp; emotional sweating starts on the palms and soles. <b>Nails</b> are hard plates of keratinized cells made by the stem cells of the <b>nail matrix</b> near the buried root; nail cells don't desquamate and are high in sulfur, giving hard keratin.</p>
<p class="reading-note">Dr. Herr: "There's not going to be any histology on the exam." Know the structures and what they do; you won't be identifying slides.</p>

dermpharm: `
<div class="tested"><b>What's tested</b><ul><li>Topical vs transdermal, and the factors that change absorption (concentration gradient vs regional variation vs occlusion)</li><li>Local reactions: irritation first; don't jump to systemic toxicity for a topical drug</li><li>Imiquimod, calcineurin inhibitors (tacrolimus, pimecrolimus)</li><li>Acne: tretinoin vs isotretinoin (iPLEDGE), brimonidine, the anti-infectives</li><li>Antibacterials, antifungals (terbinafine for nails), antivirals, ectoparasiticides</li></ul></div>
<p>Dr. Fasinu framed the lecture as a review of drugs that keep coming back in every system, focused on what is high yield for dental and optometry boards. Skin is both a <b>target</b> (diseases of the skin) and a <b>route of administration</b>. <b>Topical</b> means applied for a local effect. <b>Transdermal</b> means applied so the drug crosses into the blood for a systemic effect, just like swallowing a tablet (fentanyl, nicotine, hormone, scopolamine patches). The stratum corneum has no vessels: drug moves slowly through it, which makes the upper skin a <b>reservoir</b>, until it reaches dermal vessels and is absorbed.</p>
<h4>What changes the response to a skin-applied drug</h4>
<p><b>Drug properties:</b> small, lipophilic molecules cross best; volatile drugs evaporate; <b>pH/pKa</b> matters because inflamed skin changes pH, and an ionized drug stays local (good for a local lesion, bad for distribution); partition coefficients (oil:water, formulation:skin) guide formulation.</p>
<p><b>Regional variation in penetration</b> (skin thickness): scrotum, face, axilla and scalp are far more permeable than the forearm. So: low-potency corticosteroids on the face and skin folds, high-potency on palms and soles. <b>Concentration gradient:</b> a higher concentration moves more drug per unit time (0.5% to 2% hydrocortisone at the same site). <b>Dosing schedule:</b> the skin reservoir gives a long "local half-life," so a drug with a short systemic half-life can be applied once a day. <b>Vehicles and occlusion:</b> the right vehicle maximizes penetration of the outer skin; occlusion (a wrap, or an oily ointment) hydrates the corneum and holds drug in place. <b>Skin condition:</b> hydration, pH, temperature, trauma and disease. Don't apply topicals to broken skin: absorption jumps.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Scenario</th><th>Principle</th></tr></thead><tbody>
<tr><td>Same psoriasis plaque, switch from 0.5% to 2% of the same steroid</td><td>Concentration gradient</td></tr>
<tr><td>New lesion on thicker skin (palm), so a stronger product</td><td>Regional variation in penetration</td></tr>
<tr><td>Apply under plastic wrap overnight to hydrate the corneum</td><td>Occlusion</td></tr>
<tr><td>Short half-life drug, but once-daily application works</td><td>Dosing schedule (skin reservoir)</td></tr>
</tbody></table></div>
<h4>Vehicles (not high yield, but know the logic)</h4>
<p><b>Creams</b> are semi-solid emulsions (oil-in-water or water-in-oil), light and well absorbed: moisturizing, eczema, acne, rashes. <b>Ointments</b> are oil-based, greasy and <b>occlusive</b> with slow release: chronic dry conditions (psoriasis, dermatitis), cracked skin. Don't give a dry-skin patient a water-based lotion. That is also why there's eye ointment but no eye cream. <b>Lotions</b> are thin and water-based (large hairy areas); <b>gels</b> are water-based and may contain alcohol, quick-drying (acne, oily skin, scalp). <b>Pastes</b> are lots of powder in a fatty base, protective (diaper rash); <b>foams</b> are air whipped into solution (scalp). <b>Patches</b> are adhesive reservoirs for slow systemic release. <b>Powders</b> dry moisture. A <b>suspension</b> is a solid in a liquid it can't dissolve in (shake before use); an <b>emulsion</b> is two immiscible liquids.</p>
<h4>Local reactions: think skin, not kidney</h4>
<p>Dr. Fasinu: when a drug is applied topically, "in the exam condition, don't be thinking nephrotoxicity." Systemic levels are too low. Look for <b>local cutaneous reactions</b>, and the most common is <b>irritation</b> (nonallergic). Others: photoirritation (usually UVA), allergic and photoallergic contact dermatitis (type IV), immunologic contact urticaria (IgE, type I, can cause anaphylaxis), and nonimmunologic contact urticaria (the most common urticaria, no prior sensitization).</p>
<h4>Topical immunomodulators</h4>
<p><b>Imiquimod</b> (Aldara 5%) is an immunostimulant: it makes mononuclear cells release interferon-α and macrophages make IL-1, IL-6, IL-8 and TNF-α. Uses: external genital and perianal warts (5%, 3x/week, 6-10 h then wash), actinic keratoses of the face and scalp (lower strengths 2.5-3.75%, Zyclara), superficial BCC on the trunk and limbs. Side effects: local reactions.</p>
<p><b>Tacrolimus</b> (0.03%, 0.1% ointment) and <b>pimecrolimus</b> (1% cream) are <b>calcineurin inhibitors</b> for atopic dermatitis in patients over 2 years. They carry a black box warning on long-term safety (animal tumorigenicity). Dr. Fasinu wants the class name remembered "the same way you remember alpha blockers or beta blockers," and stressed they're high yield because (with cyclosporine) they prevent transplant rejection. Pathway: T-cell receptor activation raises intracellular Ca2+ → Ca2+-calmodulin activates <b>calcineurin</b>, a <b>phosphatase</b> → calcineurin <b>dephosphorylates NFAT</b> → NFAT enters the nucleus → IL-2 and other cytokines drive T-cell activation.</p>
<h4>Acne</h4>
<p>Acne vulgaris is obstruction and inflammation of pilosebaceous units (face, upper trunk, adolescents) from three causes, each a drug target: <b>sebum overproduction</b>, <b>follicular hyperkeratinization</b>, and <b>acne bacteria</b>. A closed comedo is a whitehead; an open one is a blackhead.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Tretinoin</th><th>Isotretinoin (Accutane)</th></tr></thead><tbody>
<tr><td>Form</td><td>Topical retinoic acid (vitamin A derivative)</td><td>Oral synthetic retinoid; an isomer of tretinoin</td></tr>
<tr><td>Mechanism</td><td>Decreases cohesion between epidermal cells, increases turnover: expels open comedones, opens closed ones</td><td>Inhibits sebaceous gland size and function</td></tr>
<tr><td>Use</td><td>Common acne; apply to dry skin, away from eyes, nose corners, mouth, mucosa</td><td>Severe, recalcitrant cystic acne</td></tr>
<tr><td>Safety</td><td>Not restricted</td><td><b>Teratogen</b>: iPLEDGE; contraception from 1 month before through 1+ cycle after; negative serum pregnancy test within 2 weeks before starting; start on day 2-3 of the next period; patient and pharmacist registered</td></tr>
</tbody></table></div>
<p>Dr. Fasinu: isotretinoin shows up on exams "not because they're interested in the mechanism of action, but because of the safety issues around it." Other acne drugs: <b>adapalene</b> (Differin 1% gel, OTC), <b>tazarotene</b> (0.1% gel, cream, foam), <b>azelaic acid</b> (acne vulgaris and rosacea), and <b>brimonidine</b> (Mirvaso 0.33% gel), an <b>α2-adrenergic agonist</b> that reduces the persistent facial redness of rosacea by direct vasoconstriction (the same drug is an eye drop). Anti-infectives for acne: <b>clindamycin</b> and <b>erythromycin</b> (protein synthesis; the slide calls clindamycin a macrolide, but Dr. Fasinu noted it isn't one strictly speaking), <b>metronidazole</b> (also anti-inflammatory through a direct effect on neutrophils), <b>sodium sulfacetamide</b> (blocks PABA use), and <b>ivermectin</b> (inflammatory rosacea lesions).</p>
<h4>Skin infections</h4>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Drug</th><th>Mechanism</th><th>Use</th></tr></thead><tbody>
<tr><td>Bacitracin</td><td>Cell wall synthesis inhibitor (peptide)</td><td>Minor cuts, burns, scrapes; alone or with neomycin/polymyxin B</td></tr>
<tr><td>Gramicidin</td><td>Inserts into and disrupts bacterial membranes (gram-positive)</td><td>Topical only, in combinations</td></tr>
<tr><td>Mupirocin</td><td>Protein synthesis inhibitor</td><td>Impetigo (S. aureus, group A strep)</td></tr>
<tr><td>Retapamulin</td><td>Protein synthesis inhibitor (50S)</td><td>Impetigo, skin infections; intranasal for MRSA carriers</td></tr>
<tr><td>Neomycin, gentamicin</td><td>Aminoglycosides, protein synthesis</td><td>Susceptible skin infections</td></tr>
</tbody></table></div>
<p>For impetigo needing a protein-synthesis inhibitor, Dr. Fasinu said <b>both mupirocin and retapamulin are correct.</b> <b>Azoles</b> (miconazole, clotrimazole, ketoconazole, econazole, efinaconazole and more) inhibit fungal <b>ergosterol synthesis</b> and cover dermatophytes and yeasts; most topical azoles are OTC, while fluconazole tablets are prescription (candidiasis, thrush). <b>Terbinafine</b> (Lamisil) is the drug for toenail <b>onychomycosis</b>: oral, a large volume of distribution, it reaches the extremities and is built into the new nail as it grows, so the infected nail grows out (up to ~6 months to see improvement). "Whenever you see it... you should go for it." Griseofulvin works the same way; <b>ciclopirox</b> (a paint) covers nails, candidiasis and tinea versicolor; tavaborole, butenafine and tolnaftate are other topicals. <b>Acyclovir, valacyclovir, penciclovir, famciclovir</b> are guanine analogs for herpes simplex (valacyclovir is better absorbed and lasts longer).</p>
<h4>Ectoparasites</h4>
<p><b>Permethrin</b> (Nix 1% cream rinse for lice, wash off after 10 minutes; Elimite 5% for scabies from the neck down, 8-14 hours). <b>Crotamiton</b> (Eurax 10%) is for <b>scabies</b>, chin down, two applications 24 hours apart. Head lice: <b>ivermectin</b> lotion (Sklice 0.5%), <b>spinosad</b> (Natroba), <b>malathion</b> (Ovide), <b>benzyl alcohol</b> (Ulesfia).</p>
<p class="reading-note">Lice vs scabies: in the recording Dr. Fasinu said "Permethrin is for scabies... for head lice, we use ivermectin," but his own slide lists permethrin 1% (Nix) for lice and the lecture question keys permethrin. Know both: permethrin covers lice and scabies; crotamiton is scabies only; ivermectin lotion is a lice product.</p>

dermpath: `
<div class="tested"><b>What's tested</b><ul><li>Gross terms (macule, papule, plaque, vesicle, bulla...) and histologic terms (acanthosis, spongiosis, parakeratosis...)</li><li>Pigment lesions: vitiligo, freckle, lentigo, nevus, melanoma (ABCD)</li><li>Seborrheic keratosis, skin tag, warts (HPV types); actinic keratosis → SCC; BCC vs SCC</li><li>Acute (urticaria, eczema, EM) vs chronic (psoriasis, lichen planus) dermatoses</li><li>Pemphigus vs pemphigoid vs dermatitis herpetiformis, and the oral look-alikes</li></ul></div>
<p>Dr. Dababneh (head and neck pathology) taught from a punch biopsy: epidermis on top (basal, spinous, granular, keratin layers; thicker keratin on palms and soles), appendages and vessels in the dermis below.</p>
<h4>Vocabulary</h4>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Gross term</th><th>Meaning</th><th>Histologic term</th><th>Meaning</th></tr></thead><tbody>
<tr><td>Macule</td><td>Flat, colored</td><td>Hyperkeratosis</td><td>Thick stratum corneum</td></tr>
<tr><td>Papule / nodule</td><td>Solid dome &lt;5 mm / &gt;5 mm</td><td>Parakeratosis</td><td>Nuclei kept in the corneum (fast turnover)</td></tr>
<tr><td>Plaque</td><td>Elevated, flat-topped</td><td>Acanthosis</td><td>Epidermal hyperplasia</td></tr>
<tr><td>Vesicle / bulla</td><td>Fluid &lt;5 mm / &gt;5 mm</td><td>Papillomatosis</td><td>Elongated dermal papillae</td></tr>
<tr><td>Pustule</td><td>Pus-filled vesicle or bulla</td><td>Spongiosis</td><td>Intercellular edema of the epidermis</td></tr>
<tr><td>Scale / lichenification / excoriation</td><td>Dry plate / thick rough skin from rubbing / traumatic break</td><td></td><td></td></tr>
</tbody></table></div>
<h4>Pigment and melanocytes</h4>
<p><b>Vitiligo</b>: autoimmune destruction of melanocytes, flat well-demarcated white macules; an S-100 stain shows no melanocytes in the patch. <b>Freckle (ephelis)</b>: the most common pigmented lesion of childhood in light-skinned people, 1-10 mm macules after sun, from <b>more melanin</b> in basal keratinocytes. <b>Solar lentigo</b> ("liver" or age spots): <b>more melanocytes</b> in a benign linear basal proliferation, a sign of sun-damaged skin. Benign oral pigmentations: <b>amalgam tattoo</b>, <b>graphite tattoo</b>, and <b>melanotic macule</b> (often after trauma, with pigment dropped into the submucosa: pigmentary incontinence).</p>
<p><b>Nevus</b> (mole): a benign neoplasm of melanocytes in nests, tan-brown, uniform, smooth borders, congenital or acquired; junctional nevi sit at the dermoepidermal junction (also gingiva); blue nevus is another type (palate). Any change in a nevus is suspicious. <b>Melanoma</b> is always malignant. Watch for <b>ABCD</b>: Asymmetry, Border irregularity, Color variegation, Diameter &gt;6 mm, plus enlargement, pain or itching of a mole, or a new pigmented lesion in adult life. Histology: atypical melanocytes with big red nucleoli climbing upward (<b>pagetoid spread</b>) and infiltrating down. It grows radially then vertically; <b>depth of invasion</b> predicts metastasis. It metastasizes almost anywhere and is "the great mimicker," so pathologists rule it out in any undifferentiated tumor. It also arises in the eye (uveal) and mouth (gingiva). Most are now caught early and cured by excision; BRAF-mutant tumors have targeted therapy.</p>
<h4>Benign epithelial tumors</h4>
<p><b>Seborrheic keratosis</b>: common in middle-aged and older people on the trunk, head and neck; round, flat, tan to dark brown, velvety, <b>"stuck on."</b> Histology: exophytic basaloid cells, variable melanin, and <b>keratin-filled horn cysts</b> (very specific). A sudden eruption of many can be paraneoplastic (<b>sign of Leser-Trelat</b>). <b>Fibroepithelial polyp</b> (acrochordon, skin tag): soft bag on a stalk, fibrovascular core, more prominent in pregnancy. <b>Verruca</b> (wart): low-risk HPV by direct contact, regresses in 6 months to 2 years; histology shows epidermal hyperplasia, big keratohyalin granules and <b>koilocytes</b> (clear cytoplasm, wrinkled nucleus).</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Wart</th><th>HPV</th><th>Where / look</th></tr></thead><tbody>
<tr><td>Verruca vulgaris (most common)</td><td>2, 4</td><td>Anywhere, mostly hands; rough pebbly papules</td></tr>
<tr><td>Verruca plana</td><td>3, 10</td><td>Face, dorsal hands; small flat papules</td></tr>
<tr><td>Verruca plantaris / palmaris</td><td>1 (60)</td><td>Soles and palms; rough, scaly</td></tr>
<tr><td>Condyloma acuminatum</td><td>6, 11</td><td>Genital/perianal; cauliflower masses</td></tr>
</tbody></table></div>
<p>Memory aid: <b>verruca in the skin, squamous papilloma in the mucosa</b> (the oral counterpart, also low-risk HPV).</p>
<h4>Premalignant and malignant (sun damage)</h4>
<p><b>Actinic (solar) keratosis</b> is premalignant: rough, sandpaper-like, red-brown, on sun-damaged skin of light-skinned people, sometimes forming cutaneous horns. Histology: atypical basal keratinocytes, parakeratosis, lost granular layer, and bluish <b>solar elastosis</b> in the dermis. Left alone it can become SCC. Treated by curettage, freezing or topical chemotherapy.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Squamous cell carcinoma</th><th>Basal cell carcinoma</th></tr></thead><tbody>
<tr><td>Typical patient/site</td><td>Most common tumor on sun-exposed sites in older people; ears and nose are classic</td><td>Chronically sun-exposed skin of light-skinned people; face, upper lip</td></tr>
<tr><td>Look</td><td>In situ: red scaly plaque. Invasive: nodular, keratin, may ulcerate</td><td>Pearly papule, telangiectasias, rolled border, ulcerates</td></tr>
<tr><td>Histology</td><td>Atypical squamous cells invading through the basement membrane</td><td>Basaloid (blue) islands with <b>peripheral palisading</b> and <b>clefting</b></td></tr>
<tr><td>Behavior</td><td>Can invade vessels and metastasize; only ~5% have at discovery; most cured by resection</td><td>Locally aggressive, rarely metastasizes; skin only</td></tr>
<tr><td>Other risks</td><td>Carcinogens, chronic ulcers, radiation, tobacco (oral), immunosuppression</td><td>Immunosuppression</td></tr>
</tbody></table></div>
<p>Oral cavity SCC is not a sun cancer (except the lip): <b>tobacco</b> (including smokeless), alcohol, repeated trauma and proliferative verrucous leukoplakia.</p>
<h4>Inflammatory dermatoses</h4>
<p><b>Acute:</b> <b>Urticaria</b> (hives) is edematous wheals that come and go within hours, from <b>IgE-mediated (type I) mast cell degranulation</b> (pollens, foods, drugs such as opiates and antibiotics, venoms); histology is only superficial dermal edema with a few eosinophils; treat with antihistamines or epinephrine. <b>Acute eczematous dermatitis</b> is red, papulovesicular, oozing then scaling (poison ivy); types are allergic contact, atopic, drug-related, photoeczematous and primary irritant; histology is <b>spongiosis</b> with perivascular lymphocytes. <b>Erythema multiforme</b> is a self-limited hypersensitivity to infections (herpes simplex, Mycoplasma, histoplasmosis, coccidioidomycosis, leprosy) and drugs (sulfonamides, penicillin, barbiturates, salicylates, antimalarials), with <b>targetoid</b> lesions; 25-50% involve the mouth; EM major is severe (30% mortality).</p>
<p><b>Chronic:</b> <b>Psoriasis</b> affects 1-2% of the U.S.: well-demarcated pink plaques with silver-white scale on <b>extensor surfaces</b> (elbows, knees), scalp, lumbosacral area; nail changes in 30%; <b>Auspitz sign</b> (scrape off scale → pinpoint bleeding); <b>T-cell mediated</b>. Histology (psoriasiform): acanthosis, dermal papillae with vessels pushing up under a thin epidermis (why it bleeds), parakeratotic scale, neutrophils. <b>Lichen planus</b>: itchy, purple, flat-topped papules with <b>Wickham striae</b>, symmetric, oral lesions in 70% (white, lacy, reticular, bilateral buccal mucosa), probably autoimmune, self-limited in 1-2 years. Histology: a <b>band-like lymphocytic infiltrate</b> at the epidermal-dermal junction that destroys the basal layer ("lichenoid"). In the mouth, an abrupt, one-sided lesion with lymphocytes might be dysplasia with a host response; bilateral, lacy and poorly demarcated favors lichen planus.</p>
<p class="reading-note">Geographic tongue: psoriasiform under the microscope, but "Psoriasis involving an oral cavity is extremely rare, so migratory glossitis would be the first one" (Dr. Dababneh). A map-like tongue = migratory glossitis.</p>
<h4>Blistering (bullous) diseases</h4>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Pemphigus vulgaris</th><th>Bullous pemphigoid</th><th>Dermatitis herpetiformis</th></tr></thead><tbody>
<tr><td>Antibody target</td><td>IgG to desmosomes (intercellular)</td><td>IgG to <b>hemidesmosomes</b> (basal layer)</td><td>IgA (and IgG) to gluten, cross-reacting with reticulin in anchoring fibrils</td></tr>
<tr><td>Split</td><td>Intraepidermal, suprabasal (acantholysis; "tombstone" basal row)</td><td>Subepidermal</td><td>Subepidermal, from neutrophil microabscesses in the papillae</td></tr>
<tr><td>Blisters</td><td>Flaccid, rupture easily → erosions</td><td>Tense, don't rupture easily, heal with scarring</td><td>Itchy grouped vesicles, symmetric on extensors, upper back, buttocks</td></tr>
<tr><td>DIF</td><td>Fishnet IgG between cells</td><td>Linear IgG/C3 along basement membrane</td><td>IgA in the papillae</td></tr>
<tr><td>Who / mouth</td><td>Rare; mouth often first (slide says 10%, talk said nearly all)</td><td>Elderly; ~30% oral</td><td>Men in their 30s-40s; celiac disease; reverses with a gluten-free diet</td></tr>
</tbody></table></div>
<p>Pemphigus and pemphigoid are both <b>type II hypersensitivity</b>. Dermatitis herpetiformis has nothing to do with herpes; it was named for how it looks.</p>

muscle: `
<div class="tested"><b>What's tested</b><ul><li>Muscle organization (epi-, peri-, endomysium; fascicle, fiber, myofibril)</li><li>The sarcomere: Z to Z, A band = myosin, I band = actin only; what shortens</li><li>Thin and thick filaments; troponin C binds Ca2+</li><li>T tubules, SR, the triad, DHP and ryanodine receptors, SERCA; rigor mortis</li><li>Fiber types I, IIa, IIb; myoglobin; satellite cells, hypertrophy, exercise, aging</li></ul></div>
<p>Skeletal muscle moves the skeleton across joints like a lever and is voluntary: posture, locomotion, speech, respiration. It is <b>striated</b> because actin and myosin are arranged in register. During development, mesenchymal <b>myoblasts</b> fuse end to end into multinucleated <b>myotubes</b> that become <b>muscle fibers</b>: each fiber is a <b>syncytium</b>, up to 30 cm long and 10-100 µm wide, with <b>peripheral nuclei</b> under the sarcolemma. Myoblasts that don't fuse become <b>satellite cells</b>.</p>
<h4>Organization</h4>
<p>Whole muscle (wrapped in <b>epimysium</b>) → <b>fascicles</b> (wrapped in <b>perimysium</b>, which carries vessels and nerves) → muscle <b>fibers</b> (each wrapped in <b>endomysium</b>: basal lamina and reticular fibers) → <b>myofibrils</b> → <b>myofilaments</b> (thick myosin, thin actin).</p>
<h4>The sarcomere</h4>
<p>The <b>sarcomere</b> is the smallest repeating unit, from <b>Z line to Z line</b>. Dark <b>A bands</b> (crossed by the M line) are the length of the thick filaments; light <b>I bands</b> (crossed by the Z line) are thin filaments only. The pale <b>H band</b> in the middle of the A band has myosin but no actin overlap; the <b>M line</b> holds the thick filaments in register. Thin filaments are anchored at the Z line; each thick filament sits in a hexagon of thin filaments.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Band</th><th>Contains</th><th>On contraction</th></tr></thead><tbody>
<tr><td>A band (dark)</td><td>Whole thick filament (+ overlap)</td><td><b>Stays the same</b></td></tr>
<tr><td>I band (light)</td><td>Thin filaments only</td><td>Shortens</td></tr>
<tr><td>H band</td><td>Thick filaments only</td><td>Shortens (gone at full contraction)</td></tr>
<tr><td>Z to Z (sarcomere)</td><td>One unit</td><td>Shortens</td></tr>
</tbody></table></div>
<p><b>Thin filaments</b> (~1 µm × 8 nm): F-actin (two strands of G-actin), <b>tropomyosin</b> (covers the myosin-binding sites), and <b>troponin</b>: <b>TnT</b> attaches to tropomyosin, <b>TnC binds calcium</b>, <b>TnI</b> inhibits actin-myosin interaction. <b>Thick filaments</b> (~1.6 µm × 15 nm) are <b>myosin II</b>: two heavy chains and two pairs of light chains; the S1 head has the ATP-binding site (ATPase, motor) and the actin-binding site.</p>
<h4>Excitation-contraction coupling</h4>
<p>An alpha motor neuron (cell body in the ventral horn) ends on each fiber at a <b>motor end plate</b>. Its terminal holds mitochondria and ACh vesicles; the sarcolemma is thrown into junctional folds that hold nicotinic ACh receptors; a Schwann cell caps the terminal. ACh opens the receptors (Na+ in, K+ out), the sarcolemma depolarizes, voltage-gated Na+ channels fire an action potential (under 5 ms), and <b>acetylcholinesterase</b> ends the signal.</p>
<p>The AP runs down the <b>T tubules</b> (invaginations of the sarcolemma at each A-I junction, two per sarcomere). A T tubule flanked by two terminal cisternae of <b>sarcoplasmic reticulum</b> is a <b>triad</b>. There, voltage-sensing <b>dihydropyridine receptors</b> physically open the SR's <b>ryanodine receptors</b>, and Ca2+ floods out (peaking ~20 ms) and binds <b>troponin C</b>; troponin-tropomyosin shift off the binding sites and myosin heads form cross-bridges. The cycle: ATP binds (myosin releases), ATP is hydrolyzed (head cocks), weak binding, Pi release, <b>power stroke</b>, ADP release. To relax, <b>SERCA</b> pumps Ca2+ back into the SR, where <b>calsequestrin</b> stores it at high concentration. Repeated stimulation raises tension (<b>tetany</b>).</p>
<p><b>Rigor mortis</b>: after death ATP runs out and ion pumps stop, intracellular Ca2+ rises, and actin and myosin lock because there's no ATP to release them. It develops within 2-6 hours and lasts 1-2 days, until lysosomal enzymes break the cross-bridges.</p>
<h4>Energy and fiber types</h4>
<p>The ATP pool lasts only a few contractions. <b>Phosphocreatine</b> refills it fastest; fatty acids, glucose and <b>glycogen granules</b> sustain it. Muscle holds ~80% of stored glucose; insulin (and exercise via AMPK) moves <b>GLUT4</b> to the membrane. <b>Myoglobin</b> stores O2 and makes slow muscle dark red. Twitch speed follows the <b>myosin ATPase</b> isoform: lateral rectus peaks in ~8 ms, gastrocnemius ~40 ms (mixed), soleus ~90 ms (slow).</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Type I (slow oxidative, red)</th><th>Type IIa (fast oxidative-glycolytic)</th><th>Type IIb (fast glycolytic, white)</th></tr></thead><tbody>
<tr><td>Myosin ATPase</td><td>Slow</td><td>Fast</td><td>Fast</td></tr>
<tr><td>Mitochondria, myoglobin</td><td>High</td><td>Moderate</td><td>Low</td></tr>
<tr><td>Glycolytic capacity</td><td>Moderate</td><td>High</td><td>High</td></tr>
<tr><td>Fuel</td><td>Oxidative phosphorylation of fatty acids</td><td>Myoglobin + glycogen</td><td>Glycogen → lactate</td></tr>
<tr><td>Fatigue</td><td>Resistant; continuous slow contraction</td><td>Resistant at peak tension</td><td>Prone; rapid bursts (rare in humans)</td></tr>
</tbody></table></div>
<h4>Growth, repair, exercise and aging</h4>
<p><b>Tension</b> is the main stimulus for <b>hypertrophy</b>: more protein synthesis and satellite-cell proliferation. <b>Satellite cells</b> (small mononucleated cells between the sarcolemma and external lamina) are quiescent myogenic stem cells; after injury or tension they proliferate and fuse to repair fibers or form new ones (limited hyperplasia). Their numbers decline with age; massive damage heals with scar. <b>Endurance</b> training adds capillaries, mitochondria and myoglobin (IIx may become IIa); <b>resistance</b> training adds mitochondria and myofibrils, causes hypertrophy (IIa may become IIx). <b>Sarcopenia</b> is age-related loss of muscle mass and strength (innervation, hormones, inflammation, diet); resistance training helps muscle, bone, osteoarthritis, depression, type 2 diabetes, osteoporosis and cardiovascular disease.</p>
<p>Muscle is also an <b>endocrine organ</b>: myokines act on brain, fat, bone, liver, gut, pancreas, vessels and skin. <b>IL-6</b> mediates exercise's anti-inflammatory effects; myostatin inhibits hypertrophy. Muscle <b>spindles</b> (intrafusal fibers) sense stretch and <b>Golgi tendon organs</b> sense tension.</p>

nmj: `
<div class="tested"><b>What's tested</b><ul><li>Succinylcholine: depolarizing mechanism, pseudocholinesterase, hyperkalemia, malignant hyperthermia (dantrolene)</li><li>Nondepolarizers (-curium/-curonium): competitive antagonists, fade</li><li>Reversal: neostigmine (+ atropine/glycopyrrolate) vs sugammadex</li><li>Spasticity drugs (baclofen, tizanidine, botulinum toxin) vs acute spasm drugs (cyclobenzaprine, methocarbamol, carisoprodol)</li></ul></div>
<p>At the neuromuscular junction, ACh released from the motor nerve opens <b>nicotinic receptors</b> on the end plate, and <b>acetylcholinesterase (AChE)</b> breaks it down. AChE inhibitors raise synaptic ACh and are used to reverse some blockers. Neuromuscular blockers (paralytics) are used for <b>surgery, mechanical ventilation, electroconvulsive therapy and severe seizures</b>.</p>
<h4>Depolarizing blocker: succinylcholine</h4>
<p><b>Succinylcholine</b> (Anectine) is a nicotinic <b>agonist</b>. It opens the channel, the perijunctional voltage-gated Na+ channels fire and the muscle <b>fasciculates</b>; but AChE at the junction doesn't break it down, so the end plate stays depolarized, the Na+ channels' inactivation gates stay shut, and the muscle goes <b>flaccid</b>. It is cleared by plasma <b>pseudocholinesterase</b> (butyrylcholinesterase). Onset 30-60 s, duration usually under 10 min: often used for <b>intubation</b>. People with slow pseudocholinesterase variants (e.g. "dibucaine resistant") recover slowly.</p>
<p>Adverse effects: it stimulates all ACh receptors somewhat, so <b>bradycardia</b> (cardiac muscarinic receptors at the SA node) or, at higher doses, tachycardia and hypertension. <b>Hyperkalemia</b>: prolonged depolarization lets K+ leave cells; risk of cardiac arrest in massive trauma, acidosis, burns, denervation and neuromuscular disease (avoid). Also <b>myalgia</b> (from fasciculations; a small pretreatment dose of a nondepolarizer prevents it), raised intraocular and intragastric pressure, hypersensitivity. <b>Malignant hyperthermia</b>: usually succinylcholine plus a volatile halogenated anesthetic (e.g. desflurane) triggers uncontrolled Ca2+ release from the SR through the <b>ryanodine receptor</b>: contracture, rigidity, heat, metabolic acidosis, tachycardia. Treatment: <b>dantrolene</b>, which blocks the ryanodine receptor channel.</p>
<h4>Nondepolarizing blockers</h4>
<p><b>Cisatracurium</b> (Nimbex), <b>rocuronium</b> (Zemuron) and <b>vecuronium</b> (Norcuron) are <b>competitive nicotinic antagonists</b> (prototype tubocurarine). Name clue: <b>-curium / -curonium</b>. They also block <b>prejunctional</b> nicotinic receptors that normally boost ACh mobilization during repeated firing, so responses <b>fade</b> with train-of-four stimulation (FYI: TOF 0.15-0.25 for surgical paralysis, &gt;0.9 to extubate).</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th></th><th>Succinylcholine</th><th>Rocuronium / vecuronium / cisatracurium</th></tr></thead><tbody>
<tr><td>Action at nicotinic receptor</td><td>Agonist (depolarizing)</td><td>Competitive antagonist (nondepolarizing)</td></tr>
<tr><td>Before paralysis</td><td>Fasciculations</td><td>None</td></tr>
<tr><td>Cleared by</td><td>Plasma pseudocholinesterase</td><td>(Not by AChE)</td></tr>
<tr><td>Train of four</td><td>No fade (phase I)</td><td>Fade (prejunctional block)</td></tr>
<tr><td>Neostigmine</td><td><b>Worsens</b> the block</td><td>Reverses it</td></tr>
<tr><td>Signature risks</td><td>Hyperkalemia, malignant hyperthermia, bradycardia, myalgia</td><td>Reversal with sugammadex (roc/vec) can affect contraceptives</td></tr>
</tbody></table></div>
<h4>Reversal</h4>
<p><b>Neostigmine</b> (Prostigmin), an AChE inhibitor, raises ACh so it outcompetes a nondepolarizer. It is not used with succinylcholine (more ACh prolongs and intensifies that block). AChE inhibitors can cause <b>bradycardia and bronchospasm</b>, so an antimuscarinic, <b>atropine</b> or <b>glycopyrrolate</b> (Robinul), is given first. In myasthenia gravis, AChE inhibitors help the same way: more ACh lingers at the end plate. <b>Sugammadex</b> reverses <b>rocuronium and vecuronium</b> by binding (encapsulating) the drug; it is a modified γ-cyclodextrin. AEs: bradycardia, anaphylaxis/hypersensitivity. Interaction: it can interfere with <b>hormonal contraceptives</b>.</p>
<h4>Spasticity and spasm</h4>
<p><b>Spasticity</b> comes from losing descending inhibition of alpha motor neurons: more tonic stretch reflexes, flexor spasms and weakness, in spinal injury, cerebral palsy, MS and stroke. Goal: less tone without losing strength. Major therapies: <b>diazepam</b> (GABA-A, not discussed), <b>baclofen</b>, <b>tizanidine</b>, <b>botulinum toxin</b>.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Drug</th><th>Mechanism</th><th>Key points</th></tr></thead><tbody>
<tr><td>Baclofen (Lioresal)</td><td><b>GABA-B agonist</b>, pre- and postsynaptic: less glutamate release, hyperpolarized neurons</td><td>Oral or intrathecal; weakness, sedation (less than benzodiazepines), hypotonia, confusion</td></tr>
<tr><td>Tizanidine (Zanaflex)</td><td>Central <b>α2 agonist</b>: presynaptic inhibition of motor neurons</td><td>Oral; drowsiness, hypotension, asthenia, xerostomia, bradycardia, hepatotoxicity; less weakness; taper (rebound hypertension)</td></tr>
<tr><td>Botulinum toxin A (Botox)</td><td><b>Cleaves SNARE</b> docking protein: no ACh release</td><td>Injected; dystonia, hyperhidrosis, strabismus, blepharospasm, urge incontinence, migraine, wrinkles, refractory bruxism (temporalis/masseter); dysphagia, weakness, dyspnea</td></tr>
<tr><td>Dantrolene</td><td>Blocks the SR ryanodine receptor</td><td>Malignant hyperthermia</td></tr>
</tbody></table></div>
<p><b>Acute muscle spasm</b> from injury or inflammation (not neurologic spasticity) gets the "other central skeletal muscle relaxants," sedating by a poorly understood mechanism: <b>cyclobenzaprine</b> (Flexeril; antimuscarinic effects), <b>methocarbamol</b> (Robaxin), <b>carisoprodol</b> (Soma; dependence potential).</p>
<p class="reading-note">Lecture key: Q1 succinylcholine (hyperkalemia after denervation), Q2 inhibition of acetylcholinesterase (reversing rocuronium), Q3 tizanidine (post-stroke spasticity).</p>

clinical: `
<div class="tested"><b>What's tested</b><ul><li>Muscles of mastication (lateral pterygoid opens), TMJ type, TMD categories and treatment ladder</li><li>Osteoporosis vs osteomalacia/rickets, Paget, osteomyelitis; MRONJ prevention</li><li>Oral manifestations of skin and connective tissue disease (psoriasis, pemphigus, pemphigoid, lupus, scleroderma, vitiligo, Addison)</li><li>Dermatologic medications and their dental concerns</li></ul></div>
<p>Dr. Taylor's lecture ties the MSK and skin units to the dental chair: what the disease does, what you see in the mouth, and what changes in treatment.</p>
<h4>Craniofacial bone, joints and muscles</h4>
<p>Bone biology recap: cortical vs trabecular bone, osteoblasts and osteoclasts, the remodeling cycle, and calcium homeostasis by PTH, vitamin D and calcitonin. Craniofacial bones: maxilla, mandible, nasal, frontal, temporal, zygomatic, ethmoid, sphenoid; alveolar bone supports the teeth. The <b>TMJ</b> is a <b>ginglymoarthrodial</b> joint (hinge plus glide). Muscles of mastication: masseter, temporalis and medial pterygoid close; the <b>lateral pterygoid</b> is the only one associated with <b>opening</b>; accessory openers are the digastric, mylohyoid and geniohyoid. Muscle physiology recap: epi-, peri- and endomysium, sarcomeres, the NMJ (ACh, calcium), ATP-dependent contraction.</p>
<h4>Bone disorders</h4>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Disorder</th><th>What's wrong</th><th>Dental relevance</th></tr></thead><tbody>
<tr><td>Osteoporosis</td><td>Resorption exceeds formation: low mass, poor microarchitecture, fractures; DEXA (hip, spine). Risks: age, postmenopausal estrogen loss, smoking, corticosteroids, low vitamin D, hyperparathyroidism</td><td>Less alveolar density, more ridge resorption after extraction, implant challenges; patients on bisphosphonates or denosumab (MRONJ)</td></tr>
<tr><td>Osteomalacia / rickets</td><td>Vitamin D deficiency: less Ca absorption, unmineralized osteoid, soft bone (rickets in children)</td><td>Delayed eruption, enamel hypoplasia, more caries, malocclusion; films show low density, thin cortices</td></tr>
<tr><td>Paget disease</td><td>Overactive osteoclasts AND osteoblasts: disorganized bone; maxilla more than mandible</td><td>Enlarging facial bones, spacing, denture changes, "cotton wool" films, hypercementosis, hard extractions, more bleeding</td></tr>
<tr><td>Osteomyelitis</td><td>Bone infection, usually odontogenic (necrotic teeth, abscesses, trauma)</td><td>Pain, fever, swelling, draining fistula, <b>sequestrum</b>; risks: diabetes, immunosuppression, radiation, MRONJ</td></tr>
</tbody></table></div>
<h4>MRONJ</h4>
<p><b>Bisphosphonates</b> have high affinity for hydroxyapatite and are ingested by osteoclasts, which then undergo apoptosis. <b>Denosumab</b> is an IgG2 monoclonal antibody against <b>RANKL</b> that blocks osteoclast differentiation. Both impair remodeling, so be cautious with extractions and surgery. For patients <b>starting</b> these drugs: eliminate sources of infection, <b>complete extractions first</b>, keep excellent hygiene, use atraumatic technique. Risk is highest with <b>IV</b> therapy.</p>
<h4>Arthritis and TMD</h4>
<p><b>Osteoarthritis</b>: cartilage degeneration and osteophytes, more in weight-bearing joints. <b>Rheumatoid arthritis</b>: autoimmune cartilage destruction and bone erosion; severe TMJ involvement can cause an <b>anterior open bite</b>. TMD causes: parafunction (bruxism, clenching), trauma, psychological, occlusal and systemic factors. Signs: pain, clicking, popping, crepitus. Radiographs: condylar flattening, osteophytes, joint-space narrowing, subchondral sclerosis. Exam: range of motion and palpation of the joint and muscles. Categories: <b>muscle</b> (myalgia; myofascial pain with trigger points and referred pain), <b>disc</b> (displacement with or without reduction), <b>joint</b> (OA, RA, ankylosis, synovitis, capsulitis). Treatment: rest (soft diet, limit use), physical therapy, NSAIDs and muscle relaxants, splints, surgery (arthrocentesis, arthroscopy, open joint surgery), Botox. Drugs: analgesics (acetaminophen, NSAIDs), anti-inflammatories (corticosteroids, DMARDs), muscle relaxants (general CNS depressants that reduce polysynaptic reflexes; GABA enhancers), Botox (blocks ACh release at the NMJ).</p>
<h4>Skin vs oral mucosa, and oral signs of skin disease</h4>
<p>Skin has a keratinized surface, hair follicles, sweat glands and a thicker epidermis; oral mucosa has variable keratinization, no hair or sweat glands, and a thinner epithelium.</p>
<div class="rv-table-wrap"><table class="rv-table"><thead><tr><th>Condition</th><th>Mechanism</th><th>Oral / dental</th></tr></thead><tbody>
<tr><td>Psoriasis</td><td>Chronic autoimmune; keratinocyte overproliferation</td><td>Slide: geographic and fissured tongue, red lesions; immunosuppressive drugs, infection risk (see note)</td></tr>
<tr><td>Eczema</td><td>Chronic itchy inflammation</td><td>More allergies (latex, medications); asthma link</td></tr>
<tr><td>Acne vulgaris</td><td>Sebum, follicular obstruction, bacteria</td><td>Tetracyclines; isotretinoin dryness, xerostomia</td></tr>
<tr><td>Pemphigus vulgaris</td><td>Antibodies to desmosomes; intraepithelial blisters</td><td>Painful ulcers, fragile bullae, desquamative gingivitis; <b>oral lesions often come first</b></td></tr>
<tr><td>Pemphigoid</td><td>Antibodies to basement membrane; subepithelial blisters</td><td>Ulcers, desquamative gingivitis, red mucosa</td></tr>
<tr><td>Lupus (SLE)</td><td>Systemic autoimmune; butterfly rash, arthritis, renal disease</td><td>Ulcers, red lesions, white striae; steroids and immunosuppressants, infection risk</td></tr>
<tr><td>Scleroderma</td><td>Excess collagen</td><td><b>Microstomia</b>, limited opening, xerostomia, <b>widened PDL space</b></td></tr>
<tr><td>Vitiligo</td><td>Autoimmune melanocyte loss</td><td>Depigmented mucosa, lips</td></tr>
<tr><td>Addison disease</td><td>Adrenal insufficiency</td><td>Diffuse mucosal and gingival pigmentation, may be an early sign</td></tr>
<tr><td>BCC / SCC</td><td>BCC: most common skin cancer, rarely metastasizes, upper lip and face. SCC: UV, tobacco, alcohol</td><td>Skin of lip/face; SCC in the oral cavity</td></tr>
</tbody></table></div>
<p class="reading-note">Psoriasis and the tongue: Dr. Taylor's slide lists geographic tongue under psoriasis, but Dr. Dababneh stressed that true oral psoriasis is extremely rare and a map-like tongue is migratory glossitis (psoriasiform only under the microscope). If an exam shows a geographic tongue and offers both, pick migratory glossitis.</p>
<h4>Dermatologic medications in your patients</h4>
<p><b>Corticosteroids</b>: delayed healing, adrenal suppression, infection risk. <b>Methotrexate</b>: ulcerations, mucositis. <b>Biologics</b> (etanercept, infliximab): immunosuppression, infection risk. <b>Isotretinoin</b>: xerostomia, cheilitis, mucosal dryness.</p>

var READINGS_PLAIN = {
skin: `
<h4>The big picture</h4>
<p>Skin is your biggest organ: about 2 square meters and 8 to 10 pounds. It does a bit of everything. It keeps things out (germs, chemicals, UV) and keeps water in. It feels touch, pain, heat and vibration. It cools you down with sweat and blood flow. It makes sweat and oil, makes vitamin D3 when sunlight hits it, and even breaks down some chemicals.</p>
<p>Skin has three parts. The <b>epidermis</b> on top is a stack of flattened cells with <b>no blood vessels</b>; it gets its food by seeping up from below. The <b>dermis</b> under it is tough connective tissue (mostly collagen) holding the vessels, nerves, glands and hair roots. The <b>hypodermis</b> underneath is mostly fat; it lets your skin slide over muscle and isn't counted as true skin.</p>
<p><b>Thick skin</b> is only on your palms and soles: a very thick outer layer, an extra clear layer, sweat glands, and no hair. Everywhere else is <b>thin skin</b>, which has hair and oil glands. If you see a hair follicle, it's thin skin. "Thick" and "thin" are about the epidermis, not the whole skin.</p>
<h4>The five layers of the epidermis</h4>
<p>From the bottom up, remember <b>"Before Signing, Get Legal Counsel."</b></p>
<ul>
<li><b>Basale</b> (bottom): one row of dividing stem cells. It holds the pigment cells, and its cells are glued to the basement membrane underneath by <b>hemidesmosomes</b>.</li>
<li><b>Spinosum</b>: several rows of cells that look spiky because they hold hands with each other through <b>desmosomes</b>, anchored to strong keratin bundles (tonofibrils). The immune Langerhans cells live here.</li>
<li><b>Granulosum</b>: 1-3 rows of cells full of dark <b>keratohyalin granules</b> (they contain profilaggrin, which becomes filaggrin and bundles the keratin). This is also where the waterproofing fat is released.</li>
<li><b>Lucidum</b>: a thin, pale, see-through band, only in thick skin.</li>
<li><b>Corneum</b> (top): flat, dead cells packed with keratin and sealed with fat. It's the actual barrier, and its thickness varies the most.</li>
</ul>
<p>Short version: the basale <b>divides</b>, the spinosum <b>connects</b>, the granulosum <b>packages</b>, and the corneum <b>protects</b>. Desmosomes glue cell to cell; hemidesmosomes glue the bottom cells to the basement membrane.</p>
<h4>How a skin cell becomes a dead shield</h4>
<p>About <b>95%</b> of epidermal cells are <b>keratinocytes</b>. As they move up, they fill with keratin and fat, flatten out, and die on purpose (programmed death): the DNA falls apart and the nucleus disappears, but the cell stays in one piece. A finished cell is about 85% keratin. This is called <b>keratinization</b>. Near the surface the skin gets more acidic, which switches on enzymes that dissolve the desmosomes, so the dead cells flake off. You don't need the enzyme names.</p>
<p>The waterproof seal is like <b>bricks and mortar</b>: the dead cells are the bricks, and the mortar is fat (ceramides and other lipids) from <b>lamellar bodies</b>, which keratinocytes release in the gap between the granulosum and the corneum. Rubbing makes skin make more keratin, which is how you get a <b>callus</b> (rub too hard too fast and you get a blister instead). Calluses fade when you stop.</p>
<h4>Pigment</h4>
<p><b>Melanocytes</b> are only 1-3% of epidermal cells. They come from the <b>neural crest</b>, sit on the bottom layer, and reach long arms up into the spinosum. They don't glue to their neighbors. Inside them the enzyme <b>tyrosinase</b> turns tyrosine into <b>DOPA</b> and then into melanin (only melanocytes have this enzyme). The pigment is packed into little bags that travel to the arm tips and get handed to about <b>36 keratinocytes</b> each. In each keratinocyte the melanin sits <b>on top of the nucleus like an umbrella</b>, soaking up UV so the DNA doesn't get damaged.</p>
<p>The key point: <b>darker skin does not have more melanocytes.</b> Everyone has about the same number. Darker skin makes more melanin and breaks it down more slowly; lighter skin breaks it down sooner. There are two melanin types: brown-black eumelanin and yellow-red phaeomelanin. In <b>albinism</b> (recessive) the melanocytes are there but can't make normal pigment. In <b>piebaldism</b> (dominant) some patches have no melanocytes at all, like a white forelock. <b>Melanoma</b> is cancer of melanocytes. (The notes give two different cell ratios; Dr. Herr said it isn't a big deal.)</p>
<h4>The other two epidermal cells</h4>
<p><b>Langerhans cells</b> (1-3%) are the skin's lookouts. They live in the spinosum, come from bone marrow (arriving around week 12 of pregnancy), and show bits of germs to the immune system (MHC I and II). When they find trouble they travel through the lymph vessels to switch on the body's defenses. <b>Merkel cells</b> sit at the bottom with nerve endings and sense steady light touch.</p>
<h4>Where epidermis meets dermis</h4>
<p>The junction holds the two layers together and lets food and oxygen pass up. Remember <b>hemidesmosomes and type XVII collagen</b> as the anchors. The bottom of the epidermis has downward ridges that lock into upward bumps of dermis (<b>dermal papillae</b>), like puzzle pieces. On fingertips this pattern makes your fingerprints.</p>
<p>The dermis has two parts. The <b>papillary</b> layer on top is thin and loose (collagen types I and III) with little loops of capillaries and nerve endings that feed the epidermis. That's why even a shallow cut bleeds. The <b>reticular</b> layer below is thick and dense (mostly coarse type I collagen plus elastic fibers). It holds the hair roots, glands and bigger vessels, and its fibers make <b>Langer's lines</b>: cutting along them leaves a smaller scar. <b>Fibroblasts</b> make the collagen, elastin and proteoglycans; <b>mast cells</b> release histamine.</p>
<p>Temperature: when you're hot, the skin's vessels widen to dump heat and you sweat; when you're cold, they narrow and blood is shunted away from the surface. Blushing and going pale are the same vessels. The fatty <b>hypodermis</b> stores energy, insulates and cushions.</p>
<h4>Touch sensors</h4>
<p><b>Free nerve endings</b> are the most common and sense pain, temperature, itch and rough touch. <b>Meissner corpuscles</b> are small, sit up in the dermal papillae, and sense light touch (why fingertips are so sensitive). <b>Pacinian corpuscles</b> are big onion-shaped sensors deep in the dermis and fat that sense pressure and vibration.</p>
<h4>Hair, glands and nails</h4>
<p>Hair is hard keratin made at the bulb; its color comes from melanin and its growth from hormones. The little <b>arrector pili</b> muscle is smooth muscle; when you're cold or scared, sympathetic nerves make it pull the hair up (goosebumps).</p>
<ul>
<li><b>Eccrine sweat glands</b> are almost everywhere (not the lips or parts of the genitals). They open straight onto the skin and make watery, slightly acidic, salt-poor sweat that cools you (2-3 liters an hour on a hot day) and keeps bacteria down. They respond to heat and to emotion. Heat sweat starts on the forehead; nervous sweat starts on the palms and soles.</li>
<li><b>Apocrine sweat glands</b> are only in the armpits, nipples, around the anus and genitals. They empty into hair follicles and respond to emotion and senses, <b>not heat</b>. Despite the name, they actually use <b>merocrine</b> secretion.</li>
<li><b>Sebaceous glands</b> grow off the hair follicle and make oil (sebum) by <b>holocrine</b> secretion: the whole cell bursts and becomes the oil.</li>
</ul>
<p><b>Nails</b> are hard plates of keratin made by the stem cells of the nail matrix near the root. Nail cells don't flake off and are high in sulfur, which makes them hard.</p>
<p class="reading-note">Dr. Herr said there won't be any histology pictures on the exam. Know the parts and what they do.</p>
`,
dermpharm: `
<h4>Two ways to use skin</h4>
<p>Skin can be the <b>thing you're treating</b> (a rash, an infection) or a <b>doorway</b> into the body. <b>Topical</b> means you put the drug on the skin to work right there. <b>Transdermal</b> means you put it on the skin so it soaks into the blood and works everywhere, like a fentanyl, nicotine, hormone or motion-sickness patch. The top dead layer has no blood vessels, so drugs move through it slowly and it acts like a <b>storage tank</b> before they reach the vessels in the dermis.</p>
<h4>What makes a skin drug work better or worse</h4>
<p>Small, fat-loving drugs get in best; drugs that evaporate don't. Inflamed skin changes its acidity, which can lock a drug in place (charged drugs stay put). <b>Thin skin soaks up more</b>: the scrotum, face, armpit and scalp absorb far more than the forearm. So mild steroids go on the face and skin folds, and strong steroids are saved for palms and soles. Using a <b>stronger concentration</b> on the same spot pushes more drug in (that's the <b>concentration gradient</b>). Because the skin stores drug, some short-acting drugs only need to go on <b>once a day</b>. Covering the skin with plastic wrap or using a greasy base (<b>occlusion</b>) hydrates the outer layer and drives more drug in. Never put a topical on broken skin: much more gets into the blood.</p>
<p>Quick guide: same spot, stronger cream = <b>concentration gradient</b>. New spot on thicker skin, stronger cream = <b>regional variation</b>. Plastic wrap overnight = <b>occlusion</b>. Short-acting drug but once a day = <b>dosing schedule</b> (skin storage).</p>
<h4>Creams, ointments and the rest</h4>
<p>Dr. Fasinu said these aren't high yield, but the logic helps. <b>Ointments</b> are greasy and oily; they seal in moisture and release drug slowly, so they're best for dry, cracked skin like psoriasis (and why eye medicine comes as ointment, not cream). <b>Creams</b> are oil-and-water mixes that rub in and moisturize. <b>Lotions</b> are thin and watery (they evaporate, so not for dry skin). <b>Gels</b> are watery, sometimes with alcohol, and dry fast (good for acne and oily skin). <b>Pastes</b> are thick and gritty and protect (diaper rash). <b>Foams</b> spread easily through hair. <b>Patches</b> release drug slowly into the blood. A <b>suspension</b> is a powder floating in a liquid it can't dissolve in (shake it); an <b>emulsion</b> is two liquids that don't mix, like oil and water.</p>
<h4>Side effects: think skin first</h4>
<p>When a drug goes on the skin, the main worry is the <b>skin</b>, not the organ damage the drug can cause when swallowed or injected. Dr. Fasinu's example: topical gentamicin is not a kidney problem. The most common reaction is plain <b>irritation</b>. Others: sun-triggered irritation, allergic rashes that show up later (type IV), and hives, which can be allergic (IgE, could cause anaphylaxis) or, more often, not allergic at all.</p>
<h4>Immune-adjusting creams</h4>
<p><b>Imiquimod</b> (Aldara) <b>revs up</b> the immune system (interferon, interleukins, TNF). It treats genital and anal warts (5%, three times a week, washed off after 6-10 hours), sun-damage spots on the face and scalp (weaker strengths, Zyclara), and a superficial type of basal cell skin cancer. Its side effects are local.</p>
<p><b>Tacrolimus</b> and <b>pimecrolimus</b> do the opposite: they calm T cells by blocking <b>calcineurin</b>. They're used for eczema (atopic dermatitis) in kids over 2 and adults, and carry a boxed warning about long-term cancer risk (from animal data). Here's how calcineurin works: when a T cell is triggered, calcium rises; calcium plus calmodulin switches on calcineurin; calcineurin <b>pulls a phosphate off</b> a messenger called NFAT; NFAT goes into the nucleus and turns on IL-2, which revs up T cells. These "calcineurin inhibitors" (with cyclosporine) are also the drugs that stop transplant rejection, which is why they're high yield.</p>
<h4>Acne</h4>
<p>Acne comes from three things: <b>too much oil</b>, <b>clogged follicles</b> (too much keratin), and <b>bacteria</b>. Closed bumps are whiteheads; open ones are blackheads. Each cause has drugs.</p>
<p><b>Tretinoin</b> (a vitamin A cream) loosens the cells and speeds up turnover, pushing out clogs. Put it on dry skin, away from the eyes, nose corners and mouth. <b>Isotretinoin</b> (Accutane) is a pill version of the same molecule (an isomer) that <b>shrinks the oil glands</b>. It's for severe cystic acne that nothing else fixed. It causes birth defects, so it runs through <b>iPLEDGE</b>: birth control from a month before until at least a cycle after, a negative blood pregnancy test within 2 weeks before starting, starting on day 2-3 of a period, and both patient and pharmacist registered. Exams ask about it for that safety program, not its mechanism.</p>
<p>Other acne drugs: <b>adapalene</b> (Differin gel, over the counter), <b>tazarotene</b>, <b>azelaic acid</b> (for acne and rosacea), and <b>brimonidine</b> gel, which squeezes blood vessels (an alpha-2 agonist) to calm the redness of rosacea; it's also an eye drop. Germ fighters: <b>clindamycin</b> and <b>erythromycin</b> (block bacterial protein making; the slide calls clindamycin a macrolide, but it's technically not), <b>metronidazole</b> (also calms neutrophils), <b>sodium sulfacetamide</b>, and <b>ivermectin</b> (for rosacea bumps).</p>
<h4>Infections</h4>
<p>Bacteria: <b>bacitracin</b> breaks the cell wall (cuts and scrapes), <b>gramicidin</b> pokes holes in the membrane (only in combination creams), and <b>mupirocin</b>, <b>retapamulin</b>, neomycin and gentamicin stop bacteria from making proteins. For impetigo, Dr. Fasinu said <b>mupirocin and retapamulin are both right</b>. Retapamulin also goes in the nose for MRSA carriers.</p>
<p>Fungi: the <b>azoles</b> (miconazole, clotrimazole, ketoconazole and others) block the fungus's cell-membrane building block, ergosterol; most creams are over the counter, while fluconazole pills need a prescription (thrush). For <b>toenail fungus</b>, <b>terbinafine</b> (Lamisil) is the star: taken by mouth, it travels to the toes and gets built into the new nail as it grows, so the bad nail grows out over months. Dr. Fasinu: if you see it as an option, pick it. <b>Ciclopirox</b> is a nail paint that also works. Viruses: <b>acyclovir</b> and its cousins (valacyclovir lasts longer) treat herpes.</p>
<p>Bugs: <b>permethrin</b> works for both lice (1% Nix rinse, 10 minutes) and scabies (5% cream, neck down, 8-14 hours). <b>Crotamiton</b> is for scabies only. <b>Ivermectin lotion</b>, <b>spinosad</b>, <b>malathion</b> and <b>benzyl alcohol</b> are for head lice.</p>
<p class="reading-note">Heads up: in the recording Dr. Fasinu said ivermectin is the head-lice drug and permethrin is for scabies, but his slide lists permethrin for both and keys permethrin as the lice answer. Permethrin covers both.</p>

dermpath: `
<h4>Words to know</h4>
<p>What you see on the skin: a <b>macule</b> is flat. A <b>papule</b> is a small dome (under 5 mm) and a <b>nodule</b> a bigger one. A <b>plaque</b> is raised but flat on top. A <b>vesicle</b> is a small blister and a <b>bulla</b> a big one (over 5 mm); a <b>pustule</b> has pus. A <b>scale</b> is a dry flake. <b>Lichenification</b> is thick, rough skin from rubbing, and an <b>excoriation</b> is a scratch through the skin.</p>
<p>What the pathologist sees: <b>hyperkeratosis</b> = too much dead top layer. <b>Parakeratosis</b> = the top layer still has nuclei because cells are moving up too fast. <b>Acanthosis</b> = the epidermis is too thick. <b>Papillomatosis</b> = the dermal bumps are stretched long. <b>Spongiosis</b> = fluid between the cells pushing them apart.</p>
<h4>Pigment problems</h4>
<p><b>Vitiligo</b>: the immune system kills melanocytes, leaving sharp white patches (a special stain shows no melanocytes there). <b>Freckles</b>: more pigment, same number of melanocytes, after sun, common in fair-skinned kids. <b>Age spots</b> (solar lentigo): more melanocytes from years of sun; harmless but a sign of sun damage. In the mouth, harmless dark spots include an <b>amalgam tattoo</b> (filling material in the tissue), a <b>graphite tattoo</b> (pencil lead), and a <b>melanotic macule</b> (a flat brown spot, often after injury).</p>
<p>A <b>mole</b> (nevus) is a harmless clump of melanocytes: small, even color, smooth edges. It can be in the mouth too. Any change is suspicious. <b>Melanoma</b> is always cancer. Watch the <b>ABCDs</b>: <b>A</b>symmetry, irregular <b>B</b>orders, mixed <b>C</b>olors, <b>D</b>iameter over 6 mm, plus a mole that grows, hurts or itches, or a new one appearing in adulthood. Under the microscope the bad cells climb up through the skin and dig down. How <b>deep</b> it goes predicts spread. It can spread almost anywhere and look like any other cancer ("the great mimicker"), and it also happens in the eye and mouth. Most are now caught early and cut out.</p>
<h4>Harmless growths</h4>
<p><b>Seborrheic keratosis</b>: the common "stuck on" brown spot of middle-aged and older people, often on the trunk. Under the microscope there are little keratin-filled cysts (<b>horn cysts</b>), which basically clinch it. A sudden crop of many can be a warning sign of a hidden cancer. A <b>skin tag</b> is a floppy bit of extra skin on a stalk. <b>Warts</b> come from low-risk HPV spread by touch and usually go away in months to two years. Common warts (hands) are HPV 2 and 4; flat warts (face, hands) 3 and 10; plantar/palmar warts (soles, palms) 1; genital warts (cauliflower-like) 6 and 11. Wart cells have a clear, wrinkled look (koilocytes). Memory trick: <b>wart in the skin, squamous papilloma in the mouth</b>.</p>
<h4>Sun-damage cancers</h4>
<p><b>Actinic keratosis</b> is a rough, sandpapery spot on sun-damaged skin. It's a <b>precancer</b> and can turn into squamous cell carcinoma, so it's frozen, scraped or treated with cream. <b>Squamous cell carcinoma</b> (SCC) is the most common tumor on sun-exposed skin of older people; ears and nose are classic (people skip sunscreen there). It's cancer once it breaks through the basement membrane. Most are cured by cutting them out, and only about 5% have spread when found. Inside the mouth, SCC is mainly from <b>tobacco</b> (and alcohol), not sun, except on the lip. <b>Basal cell carcinoma</b> (BCC) is a pearly bump with tiny visible vessels and a rolled edge; under the microscope its edge cells line up like soldiers. It digs in locally but <b>almost never spreads</b>, and it only happens in skin.</p>
<h4>Rashes that come and go</h4>
<p><b>Hives</b> (urticaria) are itchy swollen welts that come and go within hours: an <b>IgE allergy</b> making mast cells dump histamine (foods, pollen, drugs, stings). Treat with antihistamines, or epinephrine if severe. <b>Acute eczema</b> (like poison ivy) is red, bumpy, oozing, then scaly; under the microscope there's fluid between the cells (spongiosis). <b>Erythema multiforme</b> is a reaction to infections (often herpes) or drugs (sulfa, penicillin) with <b>target-shaped</b> spots; it often involves the mouth and can come back. The severe form can be deadly.</p>
<h4>Long-lasting rashes</h4>
<p><b>Psoriasis</b> (1-2% of people) gives sharp pink plaques with silvery scale on the <b>outside of the elbows and knees</b>, scalp and low back, and changes the nails in about 30%. Scrape a scale and it bleeds in tiny dots (<b>Auspitz sign</b>) because the blood vessels sit right under a thin layer. It's a <b>T-cell</b> problem, not an allergy. <b>Lichen planus</b> gives purple, itchy, flat-topped bumps with fine white lines (<b>Wickham striae</b>), on both sides of the body; 70% have lacy white lines in the mouth, usually on both cheeks. Under the microscope there's a <b>band of lymphocytes</b> right at the bottom of the epithelium. A one-sided, sharp-edged white patch in the mouth with lymphocytes could be a precancer instead.</p>
<p class="reading-note">A red, map-like tongue is <b>geographic tongue</b> (migratory glossitis). It looks like psoriasis under the microscope, but real psoriasis in the mouth is extremely rare, so pick geographic tongue.</p>
<h4>Blistering diseases</h4>
<p>In <b>pemphigus</b>, antibodies (IgG) attack the <b>glue between skin cells</b>, so the blister forms inside the epidermis. The roof is thin, so blisters pop easily and leave raw sores. The bottom row of cells is left standing like tombstones, and the antibody test looks like a fishnet. The mouth is often hit first. In <b>bullous pemphigoid</b>, antibodies attack the <b>anchors at the bottom</b> (hemidesmosomes), so the whole epidermis lifts off as the roof: tense blisters that don't pop easily, in older people; the antibody test is a straight line. Both are type II reactions. <b>Dermatitis herpetiformis</b> has nothing to do with herpes: very itchy clusters of tiny blisters on the elbows, knees, back and buttocks, linked to <b>celiac disease</b> (IgA against gluten). It clears up on a gluten-free diet.</p>
`,
muscle: `
<h4>What a muscle is made of</h4>
<p>Skeletal muscle is the muscle you control: it pulls on bones to move, holds posture, and helps you talk and breathe. It looks striped because its proteins line up in neat rows. Early in development, small cells called <b>myoblasts</b> fuse into one long cell with many nuclei: a <b>muscle fiber</b> (a <b>syncytium</b>), which can be up to 30 cm long, with its nuclei pushed to the edges. Myoblasts that don't fuse stay behind as <b>satellite cells</b>, the muscle's backup stem cells.</p>
<p>Think of it like a cable. The whole muscle is wrapped in <b>epimysium</b>. Inside are bundles called <b>fascicles</b>, each wrapped in <b>perimysium</b> (where vessels and nerves run). Each fiber in a bundle is wrapped in <b>endomysium</b>. Inside each fiber are <b>myofibrils</b>, made of thin (actin) and thick (myosin) <b>filaments</b>.</p>
<h4>The sarcomere</h4>
<p>The <b>sarcomere</b> is the basic unit that shortens. It runs from one <b>Z line</b> to the next. The thin actin filaments are tied to the Z lines and reach toward the middle; the thick myosin filaments sit in the middle, held by the <b>M line</b>. The dark <b>A band</b> is exactly as long as the myosin, so it <b>never changes length</b>. The light <b>I band</b> is actin only, and the <b>H band</b> is myosin only. When the muscle contracts, the filaments <b>slide</b> past each other: the I and H bands shrink, the A band stays the same.</p>
<p>The thin filament has three parts: <b>actin</b>, <b>tropomyosin</b> (a strand that covers actin's grab spots at rest), and <b>troponin</b>, which has three pieces: <b>T</b> ties to tropomyosin, <b>C catches calcium</b>, and <b>I</b> inhibits. Thin filaments are about 1 µm long and 8 nm wide. The thick filament is <b>myosin II</b> (about 1.6 µm × 15 nm): two heavy chains and two pairs of light chains, with heads that grab actin and split ATP.</p>
<h4>From nerve to squeeze</h4>
<p>A motor nerve ends on each fiber at the <b>motor end plate</b> and releases <b>acetylcholine</b>. That opens channels, sodium rushes in, and an electrical signal races along the fiber (it lasts under 5 ms). <b>Acetylcholinesterase</b> then cleans up the acetylcholine. The signal dives into the fiber through tunnels called <b>T tubules</b>. Each T tubule sits between two calcium storage tanks (the <b>sarcoplasmic reticulum</b>, SR); together they form a <b>triad</b>. A sensor in the tubule (the <b>DHP receptor</b>) physically yanks open a calcium gate in the SR (the <b>ryanodine receptor</b>). Calcium pours out, grabs <b>troponin C</b>, tropomyosin moves aside, and the myosin heads grab actin and pull (the power stroke). To relax, a pump called <b>SERCA</b> moves calcium back into the SR, where a protein (calsequestrin) stores it. Firing over and over adds up to a stronger, steady squeeze (tetany).</p>
<p><b>Rigor mortis</b>: myosin needs ATP to <b>let go</b> of actin. After death ATP runs out, calcium leaks up, and the heads lock on. Stiffness starts 2-6 hours after death and lasts 1-2 days until the proteins break down.</p>
<h4>Fuel and fiber types</h4>
<p>Muscle only keeps enough ATP for a few contractions. <b>Phosphocreatine</b> refills it fastest; then fat, glucose and stored glycogen take over. Muscle stores most of the body's glucose, and insulin (and exercise) moves the <b>GLUT4</b> transporter to the surface to pull glucose in. <b>Myoglobin</b> stores oxygen and makes slow muscle dark red.</p>
<ul>
<li><b>Type I (slow, red)</b>: slow myosin, lots of mitochondria and myoglobin, burns fat with oxygen, doesn't tire. Postural muscles like the soleus.</li>
<li><b>Type IIa (fast, in-between)</b>: fast, uses oxygen and glycogen, holds up at peak effort.</li>
<li><b>Type IIb (fast, white)</b>: fast, little myoglobin, burns glycogen to lactate in quick bursts, tires fast (rare in humans).</li>
</ul>
<p>How fast a fiber twitches depends on how fast its myosin splits ATP. An eye muscle peaks in about 8 ms, the calf's soleus in about 90 ms.</p>
<h4>Growing, healing and aging</h4>
<p><b>Tension</b> (lifting) is the main signal to grow (<b>hypertrophy</b>): more protein and more satellite cells. Satellite cells sit just outside the fiber's membrane, sleep until injury or strain, then multiply and fuse to repair or build fibers. There are fewer with age, and big injuries heal with scar. <b>Endurance</b> training adds capillaries, mitochondria and myoglobin; <b>weight</b> training adds mitochondria and contractile proteins and makes fibers bigger. <b>Sarcopenia</b> is muscle loss with age; resistance training fights it and also helps bones, arthritis, mood, diabetes and the heart. Muscle even acts like a gland, releasing <b>myokines</b>; <b>IL-6</b> from exercise calms inflammation, and myostatin limits growth. <b>Muscle spindles</b> sense stretch; <b>Golgi tendon organs</b> sense tension.</p>
