nmj: `
<h4>The junction</h4>
<p>A motor nerve releases <b>acetylcholine (ACh)</b>, which opens <b>nicotinic receptors</b> on the muscle so it fires. The enzyme <b>acetylcholinesterase (AChE)</b> breaks ACh down to end the signal. Drugs that block AChE leave more ACh around, which can undo some paralyzing drugs. Paralyzing drugs are used for <b>surgery</b>, <b>breathing machines</b>, <b>electroconvulsive therapy</b> and <b>severe seizures</b>.</p>
<h4>Succinylcholine: the one that "turns it on and leaves it on"</h4>
<p><b>Succinylcholine</b> acts like ACh and opens the receptor, so muscles first <b>twitch</b> (fasciculations). But AChE at the junction can't break it down, so the muscle stays switched on and stuck; the sodium channels can't reset, and the muscle goes limp. A blood enzyme, <b>pseudocholinesterase</b>, clears it. It works in 30-60 seconds and wears off in under 10 minutes, which makes it popular for putting in a breathing tube. People with a slow version of pseudocholinesterase stay paralyzed much longer.</p>
<p>Problems: it can slow the heart (it touches the heart's muscarinic receptors) or, at high doses, speed it up. It lets <b>potassium</b> leak out of cells, which can stop the heart in people with burns, big trauma, nerve injury, acidosis or nerve-muscle disease, so avoid it there. The twitching causes <b>sore muscles</b> afterward (a tiny dose of a nondepolarizing drug first prevents this). It raises eye and stomach pressure. And with certain gas anesthetics it can set off <b>malignant hyperthermia</b>: the muscle's calcium gate (the ryanodine receptor) floods the cell with calcium, causing rigid muscles, a soaring temperature, a racing heart and acid buildup. The fix is <b>dantrolene</b>, which shuts that calcium gate.</p>
<h4>The "-curonium" drugs: block the door</h4>
<p><b>Rocuronium</b>, <b>vecuronium</b> and <b>cisatracurium</b> sit in the receptor and <b>block</b> ACh (competitive antagonists), so there's no twitching first. Name clue: <b>-curium / -curonium</b>. They also block helper receptors on the nerve that keep ACh coming during repeated firing, so on a nerve-stimulator test each twitch gets weaker (<b>fade</b>).</p>
<h4>Waking the muscles back up</h4>
<p><b>Neostigmine</b> blocks AChE so more ACh builds up and wins the receptor back from the "-curonium" drug. Never use it after succinylcholine; more ACh just makes that block worse. Because extra ACh also slows the heart and tightens airways, <b>atropine</b> or <b>glycopyrrolate</b> is given first to block those side effects. (Myasthenia gravis patients get stronger on these drugs for the same reason: more ACh hangs around.) <b>Sugammadex</b> is a sugar ring that <b>swallows</b> rocuronium or vecuronium so it can't reach the receptor. Side effects: slow heart rate, allergic reactions, and it can make <b>birth control pills</b> less reliable.</p>
<h4>Spasticity vs a pulled muscle</h4>
<p><b>Spasticity</b> happens when the brain or spinal cord stops calming the motor nerves (stroke, MS, cerebral palsy, spinal injury): tight, jerky, weak muscles. The goal is less tightness without losing strength. Drugs:</p>
<ul>
<li><b>Baclofen</b>: turns on GABA-B receptors to quiet nerves (by mouth or into the spinal fluid). Side effects: weakness, sleepiness (less than benzos), floppiness, confusion.</li>
<li><b>Tizanidine</b>: an alpha-2 agonist in the spinal cord. Side effects: drowsiness, low blood pressure, dry mouth, slow heart, liver damage; less weakness; stopping suddenly can spike blood pressure.</li>
<li><b>Botulinum toxin</b> (Botox): cuts the SNARE proteins so the nerve can't release ACh. Injected for neck spasms, sweating, crossed eyes, eyelid spasm, bladder, migraine, wrinkles, and maybe severe grinding (masseter and temporalis). Side effects: trouble swallowing, weakness, breathing trouble.</li>
<li><b>Diazepam</b> (GABA-A) is also used.</li>
</ul>
<p>For an ordinary <b>muscle spasm from an injury</b>, use the sedating "muscle relaxers": <b>cyclobenzaprine</b> (Flexeril; dry-mouth type side effects), <b>methocarbamol</b> (Robaxin), <b>carisoprodol</b> (Soma; can be habit-forming).</p>
<p class="reading-note">Lecture key: Q1 succinylcholine (high potassium after nerve injury), Q2 blocking acetylcholinesterase (undoing rocuronium), Q3 tizanidine (spasticity after a stroke).</p>
`,
clinical: `
<h4>Jaws, joints and chewing muscles</h4>
<p>This lecture connects the unit to the dental chair. Quick bone review: compact and spongy bone, osteoblasts build and osteoclasts eat, bone is always remodeling, and calcium is controlled by PTH, vitamin D and calcitonin. The face bones include the maxilla, mandible, nasal, frontal, temporal, zygomatic, ethmoid and sphenoid. The <b>TMJ</b> both hinges and slides (a <b>ginglymoarthrodial</b> joint). Three chewing muscles close the mouth (masseter, temporalis, medial pterygoid). The <b>lateral pterygoid</b> is the only chewing muscle that <b>opens</b> it, helped by the digastric, mylohyoid and geniohyoid.</p>
<h4>Bone diseases you'll see</h4>
<ul>
<li><b>Osteoporosis</b>: bone is torn down faster than it's built, so there's less of it and it breaks easily (measured with a DEXA scan). Risks: age, menopause, smoking, steroids, low vitamin D, overactive parathyroid. In the mouth: thinner jawbone, more ridge shrinkage after extractions, harder implants, and patients on bisphosphonates or denosumab.</li>
<li><b>Osteomalacia / rickets</b>: not enough vitamin D, so new bone doesn't harden (rickets in kids). In the mouth: late tooth eruption, thin enamel, more cavities, bite problems; x-rays look less dense with thin cortex.</li>
<li><b>Paget disease</b>: bone is torn down and rebuilt chaotically, more in the maxilla. Face bones enlarge, teeth spread, dentures stop fitting, x-rays show "cotton wool," roots thicken (hypercementosis), extractions are hard and surgery bleeds more.</li>
<li><b>Osteomyelitis</b>: infected bone, usually from a dead tooth or abscess. Pain, fever, swelling, a draining tract, and a piece of dead bone (<b>sequestrum</b>). Higher risk with diabetes, weak immunity, radiation and MRONJ.</li>
</ul>
<h4>Bone drugs and the jaw (MRONJ)</h4>
<p><b>Bisphosphonates</b> stick to bone mineral; osteoclasts swallow them and die. <b>Denosumab</b> is an antibody that blocks RANKL so osteoclasts never form. Either way the jaw can't remodel and heal well, so dead jawbone (<b>MRONJ</b>) can follow an extraction. Before someone starts these drugs: <b>clear infections and finish extractions first</b>, keep their hygiene excellent, and be gentle with surgery. The risk is highest with <b>IV</b> drugs.</p>
<h4>Arthritis and TMJ problems</h4>
<p><b>Osteoarthritis</b> is wear-and-tear cartilage loss with bone spurs, mostly in weight-bearing joints. <b>Rheumatoid arthritis</b> is the immune system eating cartilage and bone; if it hits the TMJ hard, the front teeth may no longer meet (<b>anterior open bite</b>). TMJ problems come from grinding and clenching, injury, stress, the bite or body-wide disease. Signs: pain, clicking, popping, grating. X-rays: a flattened condyle, spurs, narrowed joint space, hardened bone under the cartilage. There are three kinds: <b>muscle</b> problems (muscle pain, or trigger points that refer pain elsewhere), <b>disc</b> problems (the disc slips and does or doesn't pop back), and <b>joint</b> problems (arthritis, fusion, inflammation). Start gentle: soft food and rest, physical therapy, NSAIDs and muscle relaxers, a splint; surgery is last (washing out the joint, scope, open surgery); Botox is an option. Drugs include pain relievers (acetaminophen, NSAIDs), anti-inflammatories (steroids, DMARDs), muscle relaxers (general sedatives, GABA boosters), and Botox (blocks ACh release).</p>
<h4>Skin diseases that show up in the mouth</h4>
<p>Skin is keratinized with hair and sweat glands and a thick epidermis; the inside of the mouth has variable keratin, no hair or sweat glands and thinner lining.</p>
<ul>
<li><b>Psoriasis</b>: an autoimmune overgrowth of skin cells. The slide lists geographic and fissured tongue and red patches; these patients often take immune-lowering drugs, so watch for infection.</li>
<li><b>Eczema</b>: itchy, inflamed skin, more allergies (watch for latex and drug allergies), linked with asthma.</li>
<li><b>Acne</b>: oil, clogs and bacteria; patients may be on tetracyclines, and isotretinoin dries the mouth.</li>
<li><b>Pemphigus</b>: antibodies against the glue between cells, so blisters form inside the lining: painful sores, fragile blisters, peeling gums. <b>Mouth sores often come first</b>, so dentists may spot it before anyone else.</li>
<li><b>Pemphigoid</b>: antibodies against the bottom anchors, so blisters form under the lining: sores, peeling gums, red tissue.</li>
<li><b>Lupus</b>: butterfly rash, arthritis, kidney disease; mouth sores, red patches, white lines; on steroids and immune-lowering drugs, so infection risk is up.</li>
<li><b>Scleroderma</b>: too much collagen makes the face tight: a <b>small mouth</b> that won't open far, dry mouth, and a widened ligament space around the teeth on x-rays.</li>
<li><b>Vitiligo</b>: white patches, including the lips and mouth.</li>
<li><b>Addison disease</b> (adrenal failure): <b>brown patches</b> all over the gums and cheeks, sometimes the first sign.</li>
<li><b>Skin cancer</b>: basal cell is the most common skin cancer, rarely spreads, and often shows up on the upper lip and face. Squamous cell is tied to sun, tobacco and alcohol, in the skin and the mouth.</li>
</ul>
<p class="reading-note">Careful with psoriasis and the tongue: real psoriasis in the mouth is extremely rare. A map-like tongue is geographic tongue (migratory glossitis), even though it looks psoriasis-like under the microscope.</p>
<h4>Skin medicines in your patients' charts</h4>
<p><b>Steroids</b> slow healing, can suppress the adrenal glands and raise infection risk. <b>Methotrexate</b> can cause mouth sores and mucositis. <b>Biologics</b> like etanercept and infliximab lower immunity, so infections are more likely. <b>Isotretinoin</b> causes dry mouth, cracked lips and dry mucosa.</p>
`

  return { v:1, seen:{}, streak:0, bestStreak:0, totalCorrect:0, totalAnswered:0, lecStats:{}, days:[], ach:{},
    ui:{ mode:'compendium', sub:'notes', lec:'skin', level:'full', group:'drugs', recall:false, qlec:'all', qsrc:'all', qstatus:'all' },

function loadState(){
  var base = defaultState();
  try{
    var raw = localStorage.getItem(STATE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      Object.keys(s).forEach(function(k){
        if(s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])){
          Object.keys(s[k]).forEach(function(k2){
            if(s[k][k2] && typeof s[k][k2]==='object' && !Array.isArray(s[k][k2]) && base[k][k2] && typeof base[k][k2]==='object') base[k][k2] = Object.assign(base[k][k2], s[k][k2]);
            else base[k][k2] = s[k][k2];
          });
        } else base[k] = s[k];
      });
    }
  }catch(e){ /* storage unavailable */ }
  return base;
}

];
function checkAchievements(){
  ACHIEVEMENTS.forEach(function(a){
    if(STATE.ach[a.id]) return;
    var c = a.cond, ok = false;
    if(c.type === 'totalCorrect') ok = STATE.totalCorrect >= c.n;
    else if(c.type === 'streak') ok = STATE.streak >= c.n;
    else if(c.type === 'lecPct'){ var st = STATE.lecStats[c.lec]; ok = !!(st && st.a >= c.min && (st.c / st.a) * 100 >= c.pct); }
    else if(c.type === 'allSeen') ok = QUESTIONS.every(function(q){ return STATE.seen[q.id]; });
    if(ok){ STATE.ach[a.id] = todayStr(); toast('Achievement: ' + a.name, a.icon); }
  });
}

/* ---------- the one answer choke point ---------- */
function recordAnswer(qid, lecId, correct, ctx, choice){
  var s = STATE.seen[qid] || { n:0, c:0, last:null };
  s.n++; if(correct) s.c++; s.last = !!correct; STATE.seen[qid] = s;
  STATE.totalAnswered++;
  if(correct){ STATE.totalCorrect++; STATE.streak++; if(STATE.streak > STATE.bestStreak) STATE.bestStreak = STATE.streak; } else STATE.streak = 0;
  var ls = STATE.lecStats[lecId] || { a:0, c:0 }; ls.a++; if(correct) ls.c++; STATE.lecStats[lecId] = ls;
  var d = todayStr(); if(STATE.days.indexOf(d) === -1) STATE.days.push(d);
  checkAchievements();
  saveState();
  renderHeaderStats();
  document.dispatchEvent(new CustomEvent('msk4:answered', { detail:{ qid:qid, lec:lecId, correct:!!correct, ctx:ctx||'bank', choice:(typeof choice === 'number' ? choice : null) } }));
}

/* ---------- header ---------- */
function dayStreak(){
  var set = {}; STATE.days.forEach(function(d){ set[d] = 1; });
  var n = 0, d = new Date();
  var k0 = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(!set[k0]) d.setDate(d.getDate()-1); /* not studied yet today: the streak is still alive from yesterday */
  for(;;){ var k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(set[k]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
function renderHeaderStats(){
  var seenCount = QUESTIONS.filter(function(q){ return STATE.seen[q.id]; }).length;
  var el = document.getElementById('progressSummary'); if(el) el.textContent = seenCount + '/' + QUESTIONS.length;
  var sp = document.getElementById('streakPill'); if(sp){ var n = dayStreak(); sp.textContent = n + ' day streak'; sp.hidden = n < 2; }
  var cd = document.getElementById('countdownPill');
  if(cd){
    var ex = new Date(EXAM_DATE + 'T08:00:00'); var now = new Date();
    var days = Math.ceil((ex - now) / 864e5);
    cd.textContent = days > 1 ? (days + ' days to exam') : days === 1 ? 'Exam tomorrow' : days === 0 ? 'Exam day!' : 'Exam done';
  }
}

/* ---------- question card renderer (shared by every mode) ---------- */
var SEQ_STATE = {}, MATCH_STATE = {};
var RENDER_SEQ = 0;
function qCardHTML(q, opts){
  opts = opts || {};
  var rid = 'r' + (++RENDER_SEQ);
  var body = '';
  if(q.type === 'mcq'){
    body += '<div class="qcard-choices">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="mcq" data-idx="'+i+'" data-answer="'+(i===q.answer?1:0)+'">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div>';
  } else if(q.type === 'sequence'){
    SEQ_STATE[rid] = { picks:[] };
    body += '<div class="qcard-hint">Tap the steps in order, first to last.</div><div class="qcard-seq-steps">';
    shuffled(q.steps.map(function(s,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="seq" data-step-idx="'+i+'">'+escHtml(q.steps[i])+'</button>';
    });
    /* undo / start over for a wrong tap (student suggestion #3, 2026-10-02); the last step is forced, so grading on it stays */
    body += '</div><div class="qcard-seq-tools" data-role="seq-tools" hidden><button type="button" data-act="seq-undo">Undo last step</button><button type="button" data-act="seq-clear">Start over</button></div>';
  } else if(q.type === 'match'){
    MATCH_STATE[rid] = { sel:null, matched:0, errors:0 };
    body += '<div class="qcard-hint">Tap an item on the left, then its partner on the right.</div><div class="qcard-match-cols"><div class="qcard-match-col">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-act="match" data-side="left" data-pair-idx="'+i+'">'+escHtml(q.pairs[i][0])+'</button>'; });
    body += '</div><div class="qcard-match-col">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-act="match" data-side="right" data-pair-idx="'+i+'">'+escHtml(q.pairs[i][1])+'</button>'; });
    body += '</div></div>';
  } else if(q.type === 'multi'){
    MULTI_STATE[rid] = { picks:[] };
    body += '<div class="qcard-hint">Select every correct answer, then check. Partial credit.</div><div class="qcard-choices">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="multi" data-multi-idx="'+i+'" aria-pressed="false">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div><div class="multi-check" data-role="multi-check"><button type="button" class="btn" data-act="multi-check">Check answer</button></div>';
  }
  var seen = STATE.seen[q.id];
  var status = seen ? (seen.last ? '<span class="src-chip" style="color:var(--good)">last: right</span>' : '<span class="src-chip" style="color:var(--bad)">last: missed</span>') : '';
  return '<div class="qcard tag-'+tagOf(q.lec)+'" data-qid="'+q.id+'" data-rid="'+rid+'" data-qtype="'+q.type+'"'+(opts.ctx?' data-ctx="'+opts.ctx+'"':'')+'>' +
    '<div class="qcard-top">'+lecChip(q.lec)+'<span class="src-chip">'+escHtml(SRC_LABEL[q.src]||q.src)+'</span>'+status+'</div>' +
    pboxHTML(q) + '<p class="qcard-stem">'+escHtml(q.stem)+'</p>' + body +
    '<div class="qcard-explain" data-role="explain"><span class="qcard-verdict"></span>'+(q.type==='sequence' ? '<b>Order:</b> '+q.steps.map(function(s,i){ return (i+1)+'. '+escHtml(s); }).join(' → ')+'<br>' : '')+escHtml(q.ex)+cueHTML(q)+
      '<div class="qcard-classdata-row"><span class="qcard-classdata-result" data-role="classdata-result">Loading class data…</span></div></div>' +
  '</div>';
}
/* Patient Box rows render above the stem */
function pboxHTML(q){
  if(!q.pbox) return '';
  return '<div class="pbox"><div class="pbox-head">'+icon('notes')+'Patient box</div><dl>' + q.pbox.map(function(r){ return '<dt>'+escHtml(r[0])+'</dt><dd>'+escHtml(r[1])+'</dd>'; }).join('') + '</dl></div>';
}
/* select-all partial credit (Canvas-style): +1/n per right pick, -1/n per wrong pick, floor 0; full credit counts as correct */
var MULTI_STATE = {};
function multiScore(q, picks){ var hit = picks.filter(function(i){ return q.correct.indexOf(i) > -1; }).length; return Math.max(0, (hit - (picks.length - hit)) / q.correct.length); }
/* memory cue (q.cue): a mnemonic or hook, shown only after a miss (student suggestion, 2026-10-02) */
function cueHTML(q){ return q.cue ? '<div class="qx-cue" data-role="cue">'+icon('bulb')+'<b>Remember it:</b> '+escHtml(q.cue)+'</div>' : ''; }
function finishCard(card, correct){
  card.classList.add('is-answered'); if(!correct) card.classList.add('is-missed');
  var v = card.querySelector('.qcard-verdict'); if(v){ v.textContent = correct ? 'Correct.' : 'Not quite.'; v.className = 'qcard-verdict ' + (correct ? 'ok' : 'bad'); }
  var q = QUESTIONS_BY_ID[card.getAttribute('data-qid')];
  var pk = card.getAttribute('data-pick');
  if(q) recordAnswer(q.id, q.lec, correct, card.getAttribute('data-ctx') || 'bank', pk === null ? null : +pk);
}
function wireQuestionContainer(container){
  if(container.__wired) return; container.__wired = true;
  container.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]'); if(!btn || btn.disabled) return;
    var card = btn.closest('.qcard'); if(!card || card.classList.contains('is-answered')) return;
    var q = QUESTIONS_BY_ID[card.getAttribute('data-qid')]; if(!q) return;
    var rid = card.getAttribute('data-rid');
    var act = btn.getAttribute('data-act');
    if(act === 'mcq'){
      var ok = btn.getAttribute('data-answer') === '1';
      card.querySelectorAll('.qcard-choice').forEach(function(b){ b.disabled = true; if(b.getAttribute('data-answer') === '1') b.classList.add('is-correct'); });
      if(!ok) btn.classList.add('is-wrong');
      card.setAttribute('data-pick', btn.getAttribute('data-idx'));
      finishCard(card, ok);
    } else if(act === 'multi'){
      var mst = MULTI_STATE[rid]; if(!mst) return;
      var mi = +btn.getAttribute('data-multi-idx'), at = mst.picks.indexOf(mi);
      if(at > -1){ mst.picks.splice(at, 1); btn.classList.remove('is-selected'); btn.setAttribute('aria-pressed','false'); }
      else { mst.picks.push(mi); btn.classList.add('is-selected'); btn.setAttribute('aria-pressed','true'); }
    } else if(act === 'multi-check'){
      var mc = MULTI_STATE[rid]; if(!mc) return;
      if(!mc.picks.length){ btn.textContent = 'Pick at least one'; return; }
      var sc = multiScore(q, mc.picks);
      card.querySelectorAll('[data-act="multi"]').forEach(function(b){
        b.disabled = true; b.classList.remove('is-selected');
        var bi = +b.getAttribute('data-multi-idx'), isC = q.correct.indexOf(bi) > -1, was = mc.picks.indexOf(bi) > -1;
        if(isC && was) b.classList.add('is-correct'); else if(isC) b.classList.add('is-missed-right'); else if(was) b.classList.add('is-wrong');
      });
      var wrapC = card.querySelector('[data-role="multi-check"]'); if(wrapC) wrapC.innerHTML = '<span class="multi-score">Partial credit: '+Math.round(sc*100)+'%. Dashed = a right answer you missed.</span>';
      finishCard(card, sc === 1);
    } else if(act === 'seq-undo' || act === 'seq-clear'){
      var us = SEQ_STATE[rid]; if(!us) return;
      var drop = act === 'seq-clear' ? us.picks.splice(0) : us.picks.splice(-1);
      drop.forEach(function(i){ var b = card.querySelector('[data-act="seq"][data-step-idx="'+i+'"]'); if(!b) return; b.disabled = false; b.classList.remove('is-picked'); var o = b.querySelector('.ord'); if(o) o.remove(); });
      var ut = card.querySelector('[data-role="seq-tools"]'); if(ut) ut.hidden = !us.picks.length;
    } else if(act === 'seq'){
      var st = SEQ_STATE[rid]; if(!st) return;
      st.picks.push(+btn.getAttribute('data-step-idx'));
      btn.disabled = true; btn.classList.add('is-picked');
      btn.insertAdjacentHTML('afterbegin', '<span class="ord">'+st.picks.length+'</span>');
      var tools = card.querySelector('[data-role="seq-tools"]'); if(tools) tools.hidden = false;
      if(st.picks.length === q.steps.length){
        var good = st.picks.every(function(v,i){ return v === i; }), inPlace = st.picks.filter(function(v,i){ return v === i; }).length;
        card.querySelectorAll('[data-act="seq"]').forEach(function(b){ var i = +b.getAttribute('data-step-idx'); var pos = st.picks.indexOf(i); b.classList.remove('is-picked'); b.classList.add(pos === i ? 'is-correct' : 'is-wrong'); });
        finishCard(card, good);
        var sv = card.querySelector('.qcard-verdict'); if(sv && !good) sv.textContent = 'Not quite: ' + inPlace + ' of ' + q.steps.length + ' in the right spot.';
      }
    } else if(act === 'match'){
      var ms = MATCH_STATE[rid]; if(!ms || btn.classList.contains('is-matched')) return;
      var side = btn.getAttribute('data-side');
      if(side === 'left'){ card.querySelectorAll('.qcard-match-item[data-side="left"]').forEach(function(b){ b.classList.remove('is-selected'); }); btn.classList.add('is-selected'); ms.sel = +btn.getAttribute('data-pair-idx'); return; }
      if(ms.sel === null) return;
      var r = +btn.getAttribute('data-pair-idx');
      var leftBtn = card.querySelector('.qcard-match-item[data-side="left"][data-pair-idx="'+ms.sel+'"]');
      if(r === ms.sel){
        btn.classList.add('is-matched'); leftBtn.classList.add('is-matched'); leftBtn.classList.remove('is-selected'); btn.disabled = true; leftBtn.disabled = true;
        ms.matched++; ms.sel = null;
        if(ms.matched === q.pairs.length) finishCard(card, ms.errors === 0);
      } else {
        ms.errors++; btn.classList.remove('is-wrong'); void btn.offsetWidth; btn.classList.add('is-wrong');
      }
    }
  });
}

  var body = document.getElementById('compBody');

}

/* ===================================================================
   MIND MAPS: built from each lecture's own notes (section headings as
   branches, the bolded key terms under each as leaves), drawn by the
   shared window.shMindMap renderer
   =================================================================== */
function mindMapFor(lec){
  var d = document.createElement('div'); d.innerHTML = READINGS[lec.id] || '';
  var branches = [], cur = { label:null, children:[] }, seen = {}; /* the intro paragraph before the first heading is left out */
  Array.prototype.forEach.call(d.children, function(el){
    if(/^H[34]$/.test(el.tagName)){ if(cur.label && cur.children.length) branches.push(cur); cur = { label:el.textContent.trim(), children:[] }; return; }
    if(!cur.label) return;
    Array.prototype.forEach.call(el.querySelectorAll('b, strong'), function(x){
      var t = x.textContent.trim(), k = t.toLowerCase();
      if(t.length < 2 || t.length > 38 || seen[k] || cur.children.length >= 6) return;
      seen[k] = 1; cur.children.push({ label:t });
    });
  });
  if(cur.label && cur.children.length) branches.push(cur);
  return { label:lecLabel(lec) + ' ' + lec.title, children:branches };
}

var WEAK_DRILL = null;

    var missed = [], fresh = [];
    lecs.forEach(function(id){ (QUESTIONS_BY_LECTURE[id] || []).forEach(function(q){ var s = STATE.seen[q.id]; if(s && s.last === false) missed.push(q); else if(!s && WEAK_DRILL !== 'all') fresh.push(q); }); });
    var list = shuffled(missed).concat(shuffled(fresh)).slice(0, 20);
    var l = LECTURE_BY_ID[WEAK_DRILL];
    body.innerHTML = '<div class="qfilters" style="padding:4px 0"><button type="button" class="btn" id="weakBack">'+icon('back')+'All lectures</button><span class="pill">'+(l ? ''+lecLabel(l)+' '+escHtml(l.title) : 'Everything you missed')+'</span><span class="pill">'+missed.length+' missed last time'+(fresh.length ? ' · '+fresh.length+' not tried' : '')+'</span></div>' +
      (list.length ? '<div class="qlist" id="weakList">' + list.map(function(q){ return qCardHTML(q, { ctx:'weak' }); }).join('') + '</div>' : '<div class="rv-empty">Nothing to drill here: no misses and nothing untried. Nice.</div>');
    var wl = document.getElementById('weakList'); if(wl) wireQuestionContainer(wl);
    document.getElementById('weakBack').onclick = function(){ WEAK_DRILL = null; renderWeak(body); window.scrollTo(0,0); };

  }
  var rows = LECTURES.map(function(l){
    var qs = QUESTIONS_BY_LECTURE[l.id] || [], tried = 0, missed = 0;
    qs.forEach(function(q){ var s = STATE.seen[q.id]; if(s){ tried++; if(s.last === false) missed++; } });
    var st = STATE.lecStats[l.id] || { a:0, c:0 };
    return { l:l, total:qs.length, tried:tried, missed:missed, a:st.a, pct: st.a ? Math.round(st.c / st.a * 100) : null };
  });
  var started = rows.filter(function(r){ return r.a >= 3; }).sort(function(a, b){ return a.pct - b.pct; });
  var notYet = rows.filter(function(r){ return r.a < 3; });

  function row(r){
    return '<div class="weak-row tag-'+r.l.tag+'"><span class="lec-num">'+lecLabel(r.l)+'</span><div class="weak-main"><b>'+escHtml(r.l.title)+'</b><span>'+(r.pct === null ? r.tried+' of '+r.total+' tried' : r.pct+'% correct · '+r.tried+' of '+r.total+' tried'+(r.missed ? ' · '+r.missed+' missed last time' : ''))+'</span>' +
      (r.pct !== null ? '<span class="weak-meter"><i style="width:'+r.pct+'%"></i></span>' : '') + '</div><button type="button" class="btn'+(r.missed ? ' primary' : '')+'" data-drill="'+r.l.id+'">Drill</button></div>';
  }
  body.innerHTML = '<div class="reading" style="max-width:860px"><h2>Weak spots</h2><p>Lectures ranked by your accuracy on this device (3+ answers needed). Drill a lecture to get the questions you missed last time, then the ones you haven\'t tried.</p>' +
    '<div class="reading-actions" style="margin:6px 0 14px"><button type="button" class="btn primary" data-sh-drill="weak">'+icon('bolt')+'Daily drill</button>' + (totalMissed ? '<button type="button" class="btn" data-drill="all">Drill everything I missed ('+totalMissed+')</button>' : '') + '</div>' +
    (started.length ? '<div class="weak-list">' + started.map(row).join('') + '</div>' : '<p class="rv-empty">Answer a few questions in the bank or mock exam and your weak spots show up here.</p>') +
    (notYet.length ? '<h3 style="margin-top:22px">Not started yet</h3><div class="weak-list">' + notYet.map(row).join('') + '</div>' : '') + '</div>';
  body.querySelectorAll('[data-drill]').forEach(function(b){ b.onclick = function(){ WEAK_DRILL = b.getAttribute('data-drill'); renderWeak(body); window.scrollTo(0,0); }; });
}

function bankFiltered(search){
  var s = (search||'').toLowerCase().trim();
  return QUESTIONS.filter(function(q){
    if(STATE.ui.qlec !== 'all' && q.lec !== STATE.ui.qlec) return false;
    if(STATE.ui.qsrc !== 'all' && q.src !== STATE.ui.qsrc) return false;
    var seen = STATE.seen[q.id];
    if(STATE.ui.qstatus === 'unseen' && seen) return false;
    if(STATE.ui.qstatus === 'missed' && !(seen && seen.last === false)) return false;
    if(s){ var hay = (q.stem + ' ' + (q.choices||q.steps||[]).join(' ') + ' ' + (q.pairs ? q.pairs.map(function(p){return p.join(' ');}).join(' ') : '') + ' ' + q.ex + ' ' + (q.pbox ? q.pbox.map(function(r){ return r.join(' '); }).join(' ') : '')).toLowerCase(); if(hay.indexOf(s) === -1) return false; }
    return true;
  });
}

/* ===================================================================
   REVIEW (grouped reference)
   =================================================================== */
function sectionCount(sec){
  if(sec.type === 'cards' || sec.type === 'list') return sec.items.length;
  if(sec.type === 'table') return sec.rows.length;
  if(sec.type === 'flows') return SEQUENCES.length;
  return 0;
}
function groupCount(g){ return g.sections.reduce(function(n, s){ return n + sectionCount(s); }, 0); }
function hl(text, term){
  var safe = escHtml(text);
  if(!term) return safe;
  var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}
function cardHTML(c, term){
  return '<div class="rv-card tag-'+tagOf(c.lec)+'"><h4>'+hl(c.name, term)+'</h4>'+(c.sub?'<div class="sub">'+hl(c.sub, term)+'</div>':'')+
    '<dl>'+c.facts.map(function(f){ return '<dt>'+escHtml(f[0])+'</dt><dd>'+hl(f[1], term)+'</dd>'; }).join('')+'</dl>'+
    (c.tip?'<div class="rv-tip">'+icon('bulb')+escHtml(c.tip)+'</div>':'')+
    '<div>'+lecChip(c.lec)+'</div></div>';
}
function tableHTML(sec, rows, term){
  return '<div class="rv-table-wrap"><table class="rv-table"><thead><tr>'+sec.head.map(function(h){ return '<th>'+escHtml(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr>'+r.map(function(cell, i){
      if(sec.head[i] === 'Lecture' && LECTURE_BY_ID[cell]) return '<td>'+lecChip(cell)+'</td>';
      return '<td>'+hl(cell, term)+'</td>'; }).join('')+'</tr>'; }).join('')+
  '</tbody></table></div>';
}
function flowsHTML(seqs, term){
  return '<div class="flows">' + seqs.map(function(s){
    return '<div class="flow tag-'+tagOf(s.lec)+'"><h4>'+hl(s.title, term)+' '+lecChip(s.lec)+'</h4><ol>'+s.steps.map(function(st, i){ return '<li><span class="st"><b>'+(i+1)+'</b><span>'+hl(st, term)+'</span></span></li>'; }).join('')+'</ol></div>';
  }).join('') + '</div>';
}
function sectionHTML(sec, term){
  var t = term ? term.toLowerCase() : '';
  function m(s){ return !t || String(s).toLowerCase().indexOf(t) !== -1; }
  var inner = '';
  if(sec.type === 'cards'){
    var items = sec.items.filter(function(c){ return m(c.name) || m(c.sub) || c.facts.some(function(f){ return m(f[0]) || m(f[1]); }) || m(c.tip); });
    if(!items.length) return '';
    inner = '<div class="rv-cards">' + items.map(function(c){ return cardHTML(c, term); }).join('') + '</div>';
  } else if(sec.type === 'table'){
    var rows = sec.rows.filter(function(r){ return r.some(m); });
    if(!rows.length) return '';
    inner = tableHTML(sec, rows, term);
  } else if(sec.type === 'list'){
    var li = sec.items.filter(m); if(!li.length) return '';
    inner = '<ul class="rv-list">' + li.map(function(x){ return '<li>'+hl(x, term)+'</li>'; }).join('') + '</ul>';
  } else if(sec.type === 'flows'){
    var seqs = SEQUENCES.filter(function(s){ return m(s.title) || s.steps.some(m); }); if(!seqs.length) return '';
    inner = flowsHTML(seqs, term);
  }
  return '<section class="rv-section">' + (sec.title ? '<h3>'+escHtml(sec.title)+'</h3>' : '') + inner + '</section>';
}

/* ===================================================================

var MOCK_BLUEPRINT = { skin:7, dermpharm:7, dermpath:8, muscle:7, nmj:7, clinical:4 };
function buildMock(){
  var ids = [];
  Object.keys(MOCK_BLUEPRINT).forEach(function(lec){
    var pool = (QUESTIONS_BY_LECTURE[lec]||[]).filter(function(q){ return q.type === 'mcq'; });
    var fresh = shuffled(pool.filter(function(q){ return !STATE.seen[q.id] || STATE.seen[q.id].last === false; }));
    var rest = shuffled(pool.filter(function(q){ return fresh.indexOf(q) === -1; }));
    fresh.concat(rest).slice(0, MOCK_BLUEPRINT[lec]).forEach(function(q){ ids.push(q.id); });
  });
  var order = {}; ids.forEach(function(id){ order[id] = shuffled(QUESTIONS_BY_ID[id].choices.map(function(c,k){ return k; })); });
  STATE.mock = { ids: shuffled(ids), t0: Date.now(), picks: {}, order: order, res: {}, submitted: false };
  saveState();

    '<button type="button" class="btn" id="mockNew">New mock</button></div>';
  if(m.submitted){
    h += '<div class="rv-table-wrap" style="margin-bottom:24px"><table class="rv-table"><thead><tr><th>Lecture</th><th>Correct</th><th>Score</th></tr></thead><tbody>' +
      Object.keys(MOCK_BLUEPRINT).map(function(lec){
        var qs = m.ids.filter(function(id){ return QUESTIONS_BY_ID[id] && QUESTIONS_BY_ID[id].lec === lec; });

      }).join('') + '</tbody></table></div>';
  }
  h += '<div class="qlist" id="mockList">' + m.ids.map(function(id, i){
    var q = QUESTIONS_BY_ID[id]; if(!q) return '';
    if(m.submitted && m.onlyMissed && m.res[id]) return '';
    var pick = (id in m.picks) ? m.picks[id] : null;
    var order = (m.order && m.order[id]) || q.choices.map(function(c,k){ return k; });
    var choices = order.map(function(k){
      var cls = 'qcard-choice';
      if(m.submitted){ if(k === q.answer) cls += ' is-correct'; else if(k === pick) cls += ' is-wrong'; }
      else if(k === pick) cls += ' is-picked';

    }).join('');
    var verdict = !m.submitted ? '' : pick === null ? '<span class="qcard-verdict bad">Not answered.</span>' : m.res[id] ? '<span class="qcard-verdict ok">Correct.</span>' : '<span class="qcard-verdict bad">Missed.</span>';
    return '<div><div class="qcount" style="margin:0 0 4px">Question '+(i+1)+'</div>' +
      '<div class="qcard tag-'+tagOf(q.lec)+(m.submitted?' is-answered':'')+(m.submitted && !m.res[id]?' is-missed':'')+'" data-qid="'+q.id+'" data-qtype="mcq">' +
      '<div class="qcard-top">'+lecChip(q.lec)+'<span class="src-chip">'+escHtml(SRC_LABEL[q.src]||q.src)+'</span></div>' +
      pboxHTML(q) + '<p class="qcard-stem">'+escHtml(q.stem)+'</p><div class="qcard-choices">'+choices+'</div>' +
      '<div class="qcard-explain" data-role="explain">'+verdict+escHtml(q.ex||'')+cueHTML(q)+
        '<div class="qcard-classdata-row"><span class="qcard-classdata-result" data-role="classdata-result">Loading class data…</span></div></div>' +
      '</div></div>';
  }).join('') + '</div>';

    list.addEventListener('click', function(e){
      var b = e.target.closest('[data-mock-pick]'); if(!b) return;

      m.submitted = true; m.tEnd = Date.now(); m.res = {};
      m.ids.forEach(function(id){

      var nRight = m.ids.filter(function(id){ return m.res[id]; }).length;
      document.dispatchEvent(new CustomEvent('sh:mock-done', { detail:{ correct:nRight, total:m.ids.length } }));

  }
  document.getElementById('mockNew').onclick = function(){ STATE.mock = null; saveState(); renderMock(body); };
  var clock = document.getElementById('mockClock');
  function tick(){ if(!document.body.contains(clock)){ clearInterval(mockTimer); return; } var end = m.tEnd || Date.now(); var sec = Math.floor((end - m.t0)/1000); clock.innerHTML = icon('clock') + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
  tick(); if(!m.submitted) mockTimer = setInterval(tick, 1000);
}

  /* =================================================================== OSTEO SNAKE */
  function Snake(){
    var g = GAMES[1], root, canvas, ctx, legend, promptEl, timer = null;
    var COLS = 18, ROWS = 12, CELL = 32;
    var FOOD_COLORS = ['#ffd23f','#ff5c8a','#3fe0d0','#a98bff'], LETTERS = ['A','B','C','D'];

        if(lec !== 'all' && q.lec !== lec) return false;

      });
    }
    function freeCell(avoid){
      for(var tries=0; tries<400; tries++){
        var x = Math.floor(Math.random()*COLS), y = Math.floor(Math.random()*ROWS);
        if(st.snake.some(function(s){ return s.x===x && s.y===y; })) continue;
        if(avoid.some(function(f){ return Math.abs(f.x-x) + Math.abs(f.y-y) < 3; })) continue;

    }

      var q = st.deck.shift(); st.q = q; st.answered = false;
      var wrong = shuffled(q.choices.slice(1)).slice(0, 3);
      var opts = shuffled([{ text:q.choices[0], right:true }].concat(wrong.map(function(t){ return { text:t, right:false }; })));
      st.foods = [];

      promptEl.innerHTML = lecChip(q.lec) + '<span>' + escHtml(q.stem) + '</span>';
      legend.innerHTML = st.foods.map(function(f){ return '<div class="sn-opt" data-opt="'+f.i+'"><i style="background:'+FOOD_COLORS[f.i]+'">'+LETTERS[f.i]+'</i><span>'+escHtml(f.text)+'</span></div>'; }).join('');

      if(food){
        var optEl = legend.querySelector('[data-opt="'+food.i+'"]');
          if(!st.answered){ st.answered = true; recordAnswer(st.q.id, st.q.lec, food.right, 'snake'); }
        if(food.right){
          st.correct++; st.grow += 2; var pts = 100 + st.snake.length * 5; st.score += pts; sGood();
          if(optEl) optEl.classList.add('is-right');
          st.level = 1 + Math.floor(st.correct / 5);

          st.pausedUntil = Date.now() + 550;

        } else {
          if(optEl) optEl.classList.add('is-wrong');
          var rightF = st.foods.filter(function(f){ return f.right; })[0];

          st.missed.push({ q: st.q.stem, a: st.q.choices[0] });
          loseLife('WRONG!');
          if(!st.running) return;
          st.pausedUntil = Date.now() + 1500;
          setTimeout(function(){ if(st && st.running) nextQuestion(); }, 1450);

    function draw(){

      if(!st) return;
      canvas.setAttribute('data-state', JSON.stringify({ head:st.snake[0], dir:st.dir, foods:st.foods.map(function(f){ return { x:f.x, y:f.y, right:f.right }; }) }));
      st.foods.forEach(function(f){

      });

    }

  /* =================================================================== MARROW MATCH (memory pairs) */
  function pairSets(){

      var rows = sec.rows.filter(function(r){ return r[0] && r[1] && String(r[0]).length <= 46 && String(r[1]).length <= 60 && r[1] !== '-' && r[1] !== ''; });
      if(rows.length >= 6) sets.push({ id: g.id + ':' + sec.title, title: sec.title, lec: null, pairs: rows.map(function(r){ return [String(r[0]), String(r[1])]; }) });
    }); });
    QUESTIONS.filter(function(q){ return q.type === 'match'; }).forEach(function(q){ sets.push({ id:q.id, title:q.stem.replace(/^Match /,'').replace(/\.$/,''), lec:q.lec, pairs:q.pairs }); });
    return sets;
  }
  function MarrowMatch(){

  /* =================================================================== BONE TO PICK (hangman) */
  function hangmanPool(lec){
    return QUESTIONS.filter(function(q){
      if((q.type !== 'mcq' || q.pbox)) return false;
      if(lec !== 'all' && q.lec !== lec) return false;
      var a = q.choices[0];
      return /^[A-Za-z][A-Za-z '\-]{2,24}$/.test(a) && a.split(' ').length <= 3 && q.stem.length <= 200;
    });
  }

      draw();
    }
    function masked(){ return st.word.split('').map(function(ch){ return /[A-Z]/.test(ch) ? (st.guessed[ch] ? ch : '_') : ch; }); }

      root.querySelector('#hmKeys').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function(L){ var used = st.guessed[L]; var cls = used ? (st.word.indexOf(L) !== -1 ? 'hit' : 'miss') : ''; return '<button type="button" class="hm-key '+cls+'" data-l="'+L+'"'+(used?' disabled':'')+'>'+L+'</button>'; }).join('');

      root.querySelector('#hmLeft').textContent = (MAXMISS - st.miss) + ' misses left';

        '<path d="M60 36v40"/><path d="M50 46h20M52 54h16M54 62h12"/>',

  /* =================================================================== FACT OR FRACTURE (true/false rush) */

  /* =================================================================== CLAST BLASTER (shooter on real MCQs) */

  /* =================================================================== BONE SEARCH (word search on crossword answers) */
  function searchPool(lec){
    return QUESTIONS.filter(function(q){
      if((q.type !== 'mcq' || q.pbox)) return false;
      if(lec !== 'all' && q.lec !== lec) return false;
      var a = q.choices[0]; if(!/^[A-Za-z ]+$/.test(a)) return false;
      var w = a.replace(/ /g,''); return w.length >= 4 && w.length <= 11 && q.stem.length <= 150;
    });
  }
  function BoneSearch(){
    var g = GAMES[7], root, stage, timer = null, st = null, N = 12;

      var pool = shuffled(searchPool(STATE.arcade.searchLec)), words = [], grid = [];
      for(var y=0;y<N;y++){ grid.push([]); for(var x=0;x<N;x++) grid[y].push(''); }
      for(var i=0; i<pool.length && words.length < 6; i++){
        var q = pool[i], w = q.choices[0].replace(/ /g,'').toUpperCase();
        if(words.some(function(o){ return o.word === w; })) continue;
        var placed = false;
        for(var tries=0; tries<120 && !placed; tries++){
          var d = DIRS[Math.floor(Math.random()*DIRS.length)], sx = Math.floor(Math.random()*N), sy = Math.floor(Math.random()*N);
          var ex = sx + d[0]*(w.length-1), ey = sy + d[1]*(w.length-1);
          if(ex < 0 || ex >= N || ey < 0 || ey >= N) continue;
          var ok = true;
          for(var k=0;k<w.length;k++){ var c = grid[sy+d[1]*k][sx+d[0]*k]; if(c && c !== w[k]){ ok = false; break; } }
          if(!ok) continue;
          for(k=0;k<w.length;k++) grid[sy+d[1]*k][sx+d[0]*k] = w[k];
          words.push({ word:w, q:q, sx:sx, sy:sy, d:d, found:false }); placed = true;
        }
      }
      var AL = 'ABCDEFGHIJKLMNOPRSTUEAIO';
      for(y=0;y<N;y++) for(x=0;x<N;x++) if(!grid[y][x]) grid[y][x] = AL[Math.floor(Math.random()*AL.length)];
      st.grid = grid; st.words = words; st.sel = null;
      render();
    }
    function render(){
      var gh = '';
      for(var y=0;y<N;y++) for(var x=0;x<N;x++) gh += '<button type="button" class="bs-cell" data-x="'+x+'" data-y="'+y+'">'+st.grid[y][x]+'</button>';
      root.querySelector('#bsGrid').innerHTML = gh;
      root.querySelector('#bsClues').innerHTML = st.words.map(function(w, i){ return '<li data-w="'+i+'" class="'+(w.found?'found':'')+'">'+lecChip(w.q.lec)+'<span class="bs-clue">'+escHtml(w.q.stem)+'</span><b class="bs-ans">'+(w.found ? escHtml(w.q.choices[0]) : w.word.length + ' letters')+'</b></li>'; }).join('');

    function mark(w){ for(var k=0;k<w.word.length;k++){ var c = cell(w.sx + w.d[0]*k, w.sy + w.d[1]*k); if(c) c.classList.add('found'); } }

      if(!st.sel){ st.sel = { x:x, y:y }; cell(x, y).classList.add('sel'); return; }
      var a = st.sel; st.sel = null;
      root.querySelectorAll('.bs-cell.sel').forEach(function(c){ c.classList.remove('sel'); });
      var dx = x - a.x, dy = y - a.y, len = Math.max(Math.abs(dx), Math.abs(dy)) + 1;

        hud(root, { score: st.score });
        render();
        if(st.words.every(function(o){ return o.found; })){ st.round++; st.time = Math.min(st.limit, st.time + 45); hud(root, { level: st.round + 1 }); toast('Board cleared!'); setTimeout(function(){ if(st && st.running) build(); }, 700); }
      } else { st.combo = 0; sBad(); }
    }
    function tick(){
      if(!st || !st.running) return;
      st.time -= 0.25;
      root.querySelector('#bsTime i').style.transform = 'scaleX(' + Math.max(0, st.time / st.limit) + ')';
      if(st.time <= 0) return over();
      timer = setTimeout(tick, 250);
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      if(searchPool(STATE.arcade.searchLec).length < 3){ toast('Not enough short answers for that lecture; try All lectures'); return; }
      st = { running:true, score:0, round:0, combo:0, limit:150, time:150, missed:[] };
      hud(root, { score:0, lives:'—', level:1 });
      build(); tick();
    }
    function over(){
      st.running = false; clearTimeout(timer);
      st.words.forEach(function(w){ if(!w.found) st.missed.push({ q: w.q.stem, a: w.q.choices[0] }); });
      var best = finish(g, st.score);
      stage.insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){ if((!st || !st.running) && (e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } }
    return {
      mount: function(p){
        var opts = '<option value="all">All lectures</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+(STATE.arcade.searchLec===l.id?' selected':'')+'>'+lecLabel(l)+' '+escHtml(l.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="bsLec">Words from:</label><select id="bsLec">'+opts+'</select>',
          '<div class="gm-stage bs-stage"><div class="mm-head"><h3>Find the answer to every clue</h3><div class="sa-timer" id="bsTime"><i></i></div></div><div class="bs-body"><div class="bs-grid" id="bsGrid"></div><ol class="bs-clues" id="bsClues"></ol></div>' +
            overlayHTML(g, 'DERMA SEARCH', 'Six answers are hidden in the letter grid: across, down or diagonal, forward or backward. Read a clue, find its answer, then tap the first and last letter. Clear the board to add time.', 'START') + '</div>',
          'Tap the first letter, then the last letter of a word');
        root = p.querySelector('.gm'); stage = p.querySelector('.bs-stage');
        bindCommon(root);
        stage.addEventListener('click', function(e){ if(e.target.closest('[data-start]')) return start(); var c = e.target.closest('.bs-cell'); if(c) pick(+c.getAttribute('data-x'), +c.getAttribute('data-y')); });
        p.querySelector('#bsLec').addEventListener('change', function(e){ STATE.arcade.searchLec = e.target.value; saveState(); });
        document.addEventListener('keydown', onKey);
      },
      stop: function(){ if(st) st.running = false; clearTimeout(timer); document.removeEventListener('keydown', onKey); }
    };
  }

  /* =================================================================== WHACK-A-CLAST (whack-a-mole on sort sets) */
  function WhackAClast(){
    var g = GAMES[8], root, stage, timer = null, st = null, KEYS = ['1','2','3','4','5','6','7','8','9'];
    function newTarget(){
      var c = STATE.arcade.whackSet;
      var set = SORT_SETS.filter(function(x){ return x.id === c; })[0] || SORT_SETS[Math.floor(Math.random()*SORT_SETS.length)];
      st.set = set; st.bin = Math.floor(Math.random()*set.bins.length); st.popsLeft = 10;
      root.querySelector('#waTarget').innerHTML = 'WHACK ONLY: <b>' + escHtml(set.bins[st.bin]) + '</b><span>' + escHtml(set.title) + '</span>';
    }
    function pop(){
      if(!st || !st.running) return;
      if(st.popsLeft <= 0) newTarget();
      var free = []; for(var i=0;i<9;i++) if(!st.holes[i]) free.push(i);
      if(free.length){
        var h = free[Math.floor(Math.random()*free.length)];
        var targets = st.set.items.filter(function(it){ return it[1] === st.bin; }), others = st.set.items.filter(function(it){ return it[1] !== st.bin; });
        var item = (Math.random() < 0.55 ? targets : others); item = item[Math.floor(Math.random()*item.length)];
        var life = Math.max(1.1, 2.2 - st.level * 0.12);
        st.holes[h] = { text:item[0], ib:item[1], good:item[1] === st.bin, until: Date.now() + life*1000, set:st.set, bin:st.bin };
        st.popsLeft--;
        var el = root.querySelector('.wa-hole[data-h="'+h+'"]');
        el.querySelector('.wa-mole span').textContent = item[0]; el.classList.remove('hit','miss'); el.classList.add('up');
      }
      timer = setTimeout(pop, Math.max(420, 900 - st.level * 55));
    }
    function sweep(){
      if(!st || !st.running) return;
      var now = Date.now();
      st.holes.forEach(function(m, i){
        if(m && now > m.until){ st.holes[i] = null; root.querySelector('.wa-hole[data-h="'+i+'"]').classList.remove('up'); if(m.good){ st.combo = 0; st.escaped++; } }
      });
      st.sweep = setTimeout(sweep, 100);
    }
    function whack(i){
      if(!st || !st.running) return;
      var m = st.holes[i], el = root.querySelector('.wa-hole[data-h="'+i+'"]');
      if(!m) return;
      st.holes[i] = null; el.classList.remove('up');
      if(m.good){ st.combo++; st.hits++; var pts = 40 + st.combo * 10; st.score += pts; sGood(); el.classList.add('hit'); if(st.hits % 8 === 0){ st.level++; hud(root, { level: st.level }); } }
      else { st.combo = 0; st.lives--; sBad(); el.classList.add('miss'); st.missed.push({ q: m.text + ' (' + m.set.title.replace('?','') + ')', a: m.set.bins[m.ib] }); hud(root, { lives: hearts(st.lives) }); if(st.lives <= 0) return over(); }
      hud(root, { score: st.score });
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      st = { running:true, score:0, lives:3, level:1, combo:0, hits:0, escaped:0, holes:[null,null,null,null,null,null,null,null,null], missed:[] };
      root.querySelectorAll('.wa-hole').forEach(function(h){ h.classList.remove('up','hit','miss'); });
      hud(root, { score:0, lives:hearts(3), level:1 });
      newTarget(); pop(); sweep();
    }
    function over(){
      st.running = false; clearTimeout(timer); clearTimeout(st.sweep);
      var best = finish(g, st.score);
      stage.insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){
      if(!st || !st.running){ if((e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } return; }
      var k = KEYS.indexOf(e.key); if(k !== -1){ e.preventDefault(); whack(k); }
    }
    return {
      mount: function(p){
        var opts = '<option value="mix">Shuffle all topics</option>' + SORT_SETS.map(function(s){ return '<option value="'+s.id+'"'+(STATE.arcade.whackSet===s.id?' selected':'')+'>'+escHtml(s.title)+'</option>'; }).join('');
        var holes = ''; for(var i=0;i<9;i++) holes += '<button type="button" class="wa-hole" data-h="'+i+'"><kbd>'+KEYS[i]+'</kbd><span class="wa-mole"><span></span></span><span class="wa-pit"></span></button>';
        p.innerHTML = shell(g, '<label for="waSet">Topic:</label><select id="waSet">'+opts+'</select>',
          '<div class="gm-stage wa-stage"><div class="wa-target" id="waTarget">Ready?</div><div class="wa-grid">'+holes+'</div>' +
            overlayHTML(g, 'WHACK-A-MOLE', 'Moles pop out of the skin carrying a term. The banner tells you which kind to whack (for example, every scabies product). Whack the right ones fast; whacking a wrong one costs a life. The target changes every 10 pops.', 'START') + '</div>',
          'Tap a mole, or press <kbd>1</kbd>–<kbd>9</kbd> (top-left to bottom-right)');
        root = p.querySelector('.gm'); stage = p.querySelector('.wa-stage');
        bindCommon(root);
        stage.addEventListener('pointerdown', function(e){ if(e.target.closest('[data-start]')) return; var h = e.target.closest('.wa-hole'); if(h) whack(+h.getAttribute('data-h')); });
        stage.addEventListener('click', function(e){ if(e.target.closest('[data-start]')) start(); });
        p.querySelector('#waSet').addEventListener('change', function(e){ STATE.arcade.whackSet = e.target.value; saveState(); });
        document.addEventListener('keydown', onKey);
      },
      stop: function(){ if(st){ st.running = false; clearTimeout(st.sweep); } clearTimeout(timer); document.removeEventListener('keydown', onKey); }
    };
  }

  return { renderLobby:renderLobby, stopAll:stopAll, startGame:startGame, current:function(){ return active ? activeId : null; } };
})();

/* ---------- theme toggle ---------- */
function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
}
function boot(){
  /* sh_theme is the site-wide choice shared with the dashboard */
  var saved = null; try{ saved = localStorage.getItem('sh_theme'); }catch(e){}
  if(saved !== 'light' && saved !== 'dark') saved = null;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  applyTheme(saved);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = !cur ? 'light' : cur === 'light' ? 'dark' : null;
    try{ localStorage.setItem('sh_theme', next || ''); }catch(e){}
    applyTheme(next);
  });
  document.querySelectorAll('#modeSwitch [data-mode]').forEach(function(b){ b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); }); });
  renderHeaderStats();
  var m = STATE.ui.mode; if(['compendium','review','arcade'].indexOf(m) === -1) m = 'compendium';
  setMode(m);
}
/* Section label for the shared widget's per-section time tracking (adds the arcade game). */
window.SH_SECTION = function(){
  var m = STATE.ui.mode;
  if(m === 'compendium') return 'compendium/' + STATE.ui.sub;
  if(m === 'review') return 'review/' + STATE.ui.group;
  if(m === 'arcade') return 'arcade/' + (ARCADE.current() || 'lobby');
  return m;
};
/* the markup above is already parsed, so render now; the deferred widget and supabase scripts load after */
boot();

/* ---------- full-content search for the shared widget: every note paragraph, review row,
   exam hint and cram line, each with a place to jump to (window.SH_GOTO) ---------- */
function shSearchSections(){
  var out = [];
  function frag(html){ var d = document.createElement('div'); d.innerHTML = html || ''; return d; }
  function clean(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  LECTURES.forEach(function(l){
    var where = lecLabel(l) + ' ' + l.title;
    Array.prototype.forEach.call(frag(READINGS[l.id]).querySelectorAll('p, li, h3, h4'), function(el, k){
      var t = clean(el.textContent); if(t.length > 2) out.push({ kind:'Notes', where:where, text:t, lec:l.id, go:{ v:'notes', lec:l.id, k:k } });
    });
    (CRAM[l.id] || []).forEach(function(b){ out.push({ kind:'Cram sheet', where:where, text:b, lec:l.id, go:{ v:'cram', lec:l.id } }); });
  });
  HINTS.forEach(function(x){ var l = LECTURE_BY_ID[x.lec]; out.push({ kind:'Exam hints', where:l ? ''+lecLabel(l)+' '+l.title : '', text:clean(x.quote + ' ' + x.take), lec:x.lec, go:{ v:'hints', lec:x.lec } }); });
  REVIEW.forEach(function(g){
    g.sections.forEach(function(sec){
      if(sec.type === 'cards') sec.items.forEach(function(c){ out.push({ kind:'Review', where:g.title, title:c.name, text:clean(c.name + ' ' + c.sub + ' ' + c.facts.map(function(f){ return f[0] + ': ' + f[1]; }).join('; ') + ' ' + c.tip), go:{ v:'review', q:c.name } }); });
      else if(sec.type === 'table') sec.rows.forEach(function(r){ out.push({ kind:'Review', where:g.title + (sec.title ? ' · ' + sec.title : ''), title:r[0], text:clean(r.join(' · ')), go:{ v:'review', q:r[0] } }); });
      else if(sec.type === 'list') sec.items.forEach(function(it){ out.push({ kind:'Review', where:g.title, text:clean(it), go:{ v:'review', q:clean(it).split(' ').slice(0, 4).join(' ') } }); });
    });
  });
  SEQUENCES.forEach(function(sq){ out.push({ kind:'Review', where:'Processes', title:sq.title, text:clean(sq.title + ': ' + sq.steps.join(' → ')), go:{ v:'review', q:sq.title } }); });
  return out;
}
function shFlashIn(sel){ setTimeout(function(){ var el = typeof sel === 'string' ? document.querySelector(sel) : sel(); if(el && window.shFlash) window.shFlash(el); }, 60); }
window.SH_GOTO = function(g){
  if(!g) return;
  if(g.v === 'notes'){ STATE.ui.lec = g.lec; STATE.ui.sub = 'notes'; STATE.ui.level = 'full'; saveState(); setMode('compendium');
    shFlashIn(function(){ var p = document.querySelector('#compBody .reading-prose'); return p && p.querySelectorAll('p, li, h3, h4')[g.k]; }); }
  else if(g.v === 'cram'){ STATE.ui.sub = 'cram'; saveState(); setMode('compendium'); shFlashIn('#cram-' + g.lec); }
  else if(g.v === 'hints'){ STATE.ui.sub = 'hints'; saveState(); setMode('compendium');
    shFlashIn(function(){ var a = document.querySelector('#compBody .hint-group [data-lec="' + g.lec + '"]'); return a && a.closest('.hint-group'); }); }
  else if(g.v === 'review'){ reviewSearch = g.q || ''; setMode('review'); }
  else if(g.v === 'bank'){ STATE.ui.sub = 'bank'; STATE.ui.qlec = 'all'; STATE.ui.qsrc = 'all'; STATE.ui.qstatus = 'all'; bankSearch = g.q || ''; bankShown = BANK_PAGE; saveState(); setMode('compendium'); }
};

/* Daily drill (widget/drill.js): the widget picks each day's questions from this pool and asks the hub to
   draw each card, so answers go through recordAnswer like anywhere else. */
var DRILL_HY = { 'lecture-quiz':'a self-check question from the lecture slides', deck:'from the class study deck' };
window.SH_DRILL = {
  pool: function(){
    return QUESTIONS.map(function(q){ var s = STATE.seen[q.id]; return { id:q.id, lec:q.lec, last: s ? !!s.last : null, hy: DRILL_HY[q.src] || '' }; });
  },
  render: function(el, qid){ var q = QUESTIONS_BY_ID[qid]; if(!q) return false; el.innerHTML = qCardHTML(q, { ctx:'drill' }); wireQuestionContainer(el); return true; }
};

/* Published for the shared widget (search + toughest-questions labels) — see widget/v3.js. */
window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id:l.id, title:''+lecLabel(l)+' ' + l.title, who:l.who, status:l.status }; }),
  questions: QUESTIONS.map(function(q){
    var hint = q.type === 'mcq' ? q.choices[q.answer] : q.type === 'multi' ? q.correct.map(function(k){ return q.choices[k]; }).join('; ') : q.type === 'sequence' ? q.steps.join(' → ') : q.pairs.map(function(p){ return p.join(': '); }).join('; ');
    if(q.ex) hint += ' — ' + q.ex;
    return { id:q.id, lec:q.lec, text:q.stem, hint:hint, choices:q.choices || null, answer:(q.type === 'mcq' ? q.answer : null) };
  }),
  sections: shSearchSections(),
  hints: HINTS.map(function(x){ return { lec:x.lec, quote:x.quote }; }),
  exams: [ { label:'Exam 4', date:EXAM_DATE } ]
};

})();
