/* ===================================================================
   SPECIAL PATIENT CARE HUB — tokens
   Palette "Sparks": deep clinic teal on a warm paper ground, with a coral accent for the things to remember.
   Type: DM Serif Text (display) · Source Sans 3 (body) · JetBrains Mono (labels).
   =================================================================== */
:root{
  color-scheme: light;
  --bg:#f5f4ef; --surface:#fffefb; --surface-2:#eeede6; --surface-3:#e2e1d8;
  --ink:#16302e; --ink-soft:#44585a; --ink-faint:#5f7173; --line:#dfded5; --line-strong:#c6c6ba;
  --accent:#1d6b66; --accent-ink:#155a55; --accent-soft:#d8ebe8;
  --good:#2f7a4f; --good-soft:#dcefe2; --bad:#b8322f; --bad-soft:#f7dcd8; --caution:#9a6412; --caution-soft:#f6e8c9;
  --tag-amber:#a8701a; --tag-sage:#57834f; --tag-blue:#2f62a8; --tag-teal:#1f7f78; --tag-violet:#6a4fa5; --tag-red:#b3352d; --tag-green:#4d7a22; --tag-rose:#b9436a; --tag-plum:#8e3f86; --tag-indigo:#3d4fa8;
  --tag-amber-soft:#f5e6c8; --tag-sage-soft:#e1ecdc; --tag-blue-soft:#dce6f4; --tag-teal-soft:#d5ecea; --tag-violet-soft:#e7e0f3; --tag-red-soft:#f6dbd7; --tag-green-soft:#e2ecd2; --tag-rose-soft:#f5dbe3; --tag-plum-soft:#f2dff0; --tag-indigo-soft:#dfe3f6;
  --shadow:0 1px 2px rgba(22,48,46,.06), 0 4px 14px rgba(22,48,46,.07);
  --radius:12px;
  --font-display:'DM Serif Text', Georgia, serif;
  --font-body:'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --font-arcade:'Press Start 2P', 'Courier New', monospace;
  /* Arcade: one fixed world regardless of theme, the clinic after hours */
  --ar-bg:#0c201f; --ar-panel:#12302e; --ar-panel-2:#1a403d; --ar-ink:#f3fbf9; --ar-dim:#9fc4bf; --ar-line:#2b5a56;
  --ar-yellow:#ffd166; --ar-pink:#ff8a6b; --ar-cyan:#7fd8f0; --ar-green:#8fe3b5; --ar-orange:#ffa75a; --ar-violet:#b59bff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101716; --surface:#16201f; --surface-2:#1e2a29; --surface-3:#273534;
    --ink:#e9f1ef; --ink-soft:#b7c6c3; --ink-faint:#93a4a1;--lec-num-ink:#101716; --line:#2c3b3a; --line-strong:#41524f;
    --accent:#6fcfc4; --accent-ink:#8fdcd3; --accent-soft:#183634;
    --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
    --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
    --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101716; --surface:#16201f; --surface-2:#1e2a29; --surface-3:#273534;
  --ink:#e9f1ef; --ink-soft:#b7c6c3; --ink-faint:#93a4a1;--lec-num-ink:#101716; --line:#2c3b3a; --line-strong:#41524f;
  --accent:#6fcfc4; --accent-ink:#8fdcd3; --accent-soft:#183634;
  --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
  --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
  --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
/* DM Serif Text comes in one weight: never fake a bold */
html{font-synthesis:none}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important;} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--font-mono)}
[hidden]{display:none!important}

/* ---------- header ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.hub-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px;padding:12px 20px 0}
.hub-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hub-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.hub-title h1{font-family:var(--font-display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;margin:0}
.hub-subtitle{color:var(--ink-soft);font-size:.86rem}
.hub-back-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;align-self:center;text-decoration:none;transition:border-color .15s,color .15s}
.hub-back-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-back-btn svg{width:16px;height:16px}
.hub-name-pill{appearance:none;cursor:pointer;font-family:var(--font-body);background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.hub-name-pill:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
.pill.countdown{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:30px;cursor:pointer}
#modeSwitch{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
#modeSwitch::-webkit-scrollbar{display:none}
#modeSwitch button{border:0;background:transparent;padding:9px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px;white-space:nowrap}
#modeSwitch button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#modeSwitch button:hover{color:var(--ink)}
#modeSwitch .mode-icon{font-size:1.05rem}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{border-bottom-color:var(--ar-pink)}
main{padding-top:20px}
.hub-footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.82rem}

/* ---------- sub-tabs ---------- */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.subtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink-soft)}
.subtab.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border:1px solid var(--caution);background:var(--caution-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.notice b{color:var(--caution)}

/* ---------- lecture notes ---------- */
.notes-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
.lec-nav{display:flex;flex-direction:column;gap:6px;min-width:0;position:sticky;top:66px;align-self:start}
.lec-nav button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;cursor:pointer;min-width:0}
.lec-nav button.is-active{border-color:var(--ink);box-shadow:var(--shadow)}
.lec-num{font-family:var(--font-mono);font-size:.75rem;font-weight:700;padding:2px 6px;border-radius:6px;color:var(--lec-num-ink,#fff);flex:none;margin-top:2px}
.lec-nav .t{font-size:.86rem;font-weight:600;line-height:1.3}
.lec-nav .w{font-size:.74rem;color:var(--ink-faint)}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);min-width:0}
.reading h2{font-family:var(--font-display);font-size:1.6rem;margin:0 0 4px;line-height:1.2}
.reading .meta{color:var(--ink-faint);font-size:.82rem;margin-bottom:16px}
.reading h4{font-family:var(--font-display);font-size:1.12rem;margin:22px 0 6px}
.reading p{margin:0 0 12px;max-width:74ch}
.reading-note{background:var(--caution-soft);border-left:3px solid var(--caution);padding:8px 12px;border-radius:6px;font-size:.88rem}
.reading-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.status-badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.status-badge.taught{background:var(--good-soft);color:var(--good)}
.status-badge.slides{background:var(--caution-soft);color:var(--caution)}

/* tag colors */
.tag-amber{--t:var(--tag-amber);--ts:var(--tag-amber-soft)} .tag-sage{--t:var(--tag-sage);--ts:var(--tag-sage-soft)} .tag-blue{--t:var(--tag-blue);--ts:var(--tag-blue-soft)} .tag-teal{--t:var(--tag-teal);--ts:var(--tag-teal-soft)}
.tag-violet{--t:var(--tag-violet);--ts:var(--tag-violet-soft)} .tag-red{--t:var(--tag-red);--ts:var(--tag-red-soft)} .tag-green{--t:var(--tag-green);--ts:var(--tag-green-soft)} .tag-rose{--t:var(--tag-rose);--ts:var(--tag-rose-soft)}
.lec-num{background:var(--t)}
.lec-chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ts);color:var(--t);white-space:nowrap}

/* ---------- question cards ---------- */
.qfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qfilters select,.qfilters input{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0}
.qfilters input{flex:1 1 200px}
.likely-box{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:10px 14px;margin:0 0 16px}
.likely-box > summary{display:flex;gap:8px;align-items:flex-start;cursor:pointer;list-style:none}
.likely-box > summary .ic{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent-ink)}
.likely-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.likely-lec{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.likely-lec h4{margin:0 0 6px;font-size:.95rem}
.likely-lec h4 .lec-num,.likely-lec h4 .snum{margin-right:6px}
.likely-lec h4 small{display:block;font-weight:600;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.likely-lec ol{margin:0 0 10px;padding-left:20px;font-size:.88rem}
.likely-lec li{margin:3px 0}
.likely-basis{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-soft);background:var(--surface-2);border-radius:4px;padding:1px 5px;white-space:nowrap}
.likely-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink)}
.likely-chip .ic,.likely-chip svg{width:12px;height:12px}
/* lecture picker (tick the lectures to practice), order toggle and the Pinned button */
.lp{position:relative}
.lp-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer;max-width:100%}
.lp-btn svg{width:14px;height:14px;flex:none}
.lp-btn[aria-expanded="true"]{border-color:var(--accent)}
.lp-sum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28ch}
.lp-pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:10px}
.lp-quick{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.lp-quick button,.lp-done{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;padding:4px 11px;font:inherit;font-size:.8rem;font-weight:600;color:var(--ink);cursor:pointer}
.lp-list{max-height:min(52vh,380px);overflow:auto}
.lp-row{display:flex;align-items:flex-start;gap:8px;padding:7px 6px;border-radius:8px;cursor:pointer;font-size:.88rem}
.lp-row:hover{background:var(--surface-2)}
.lp-row input{margin:3px 0 0;accent-color:var(--accent);flex:none}
.lp-t{flex:1;min-width:0}
.lp-n{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-faint);flex:none;margin-top:2px}
.lp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line);margin-top:6px;font-size:.8rem;color:var(--ink-faint)}
.qorder{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.qorder button{border:0;background:none;padding:7px 11px;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink-soft);cursor:pointer}
.qorder button+button{border-left:1px solid var(--line-strong)}
.qorder button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.qpinned{display:inline-flex;align-items:center;gap:6px}
.qpinned svg{width:14px;height:14px}
.qpinned[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:560px){.lp,.lp-btn{width:100%}.lp-sum{max-width:none;flex:1;text-align:left}}
.qcount{color:var(--ink-faint);font-size:.84rem;margin-bottom:10px}
.rv-set{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:var(--accent-soft,var(--surface-2));border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.rv-set b{display:block}
.rv-set span{color:var(--ink-soft)}
.qlist{display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--t, var(--line))}
.qcard-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qcard.is-retry{border-style:dashed}
.retry-chip{display:inline-flex;align-items:center;gap:4px;color:var(--accent);white-space:normal;max-width:100%;text-align:left}
.retry-chip svg{width:13px;height:13px}
.src-chip{font-family:var(--font-mono);font-size:.68rem;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-soft)}
.qcard-stem{font-weight:600;margin:0 0 12px;white-space:pre-line}
.qcard-choices,.qcard-seq-steps{display:flex;flex-direction:column;gap:7px}
.qcard-choice,.qcard-match-item{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;line-height:1.35}
.qcard-choice:hover,.qcard-match-item:hover{border-color:var(--ink)}
.qcard-choice.is-correct,.qcard-match-item.is-matched{background:var(--good-soft);border-color:var(--good)}
.qcard-choice.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.qcard-choice.is-picked{background:var(--surface-2);border-color:var(--ink)}
.qcard-choice .ord{font-family:var(--font-mono);font-weight:700;margin-right:8px;color:var(--accent-ink)}
.qcard-seq-tools{display:flex;gap:8px;margin-top:8px}
.qcard-seq-tools[hidden],.qcard.is-answered .qcard-seq-tools{display:none}
.qcard-seq-tools button{font:inherit;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.qcard-seq-tools button:hover{border-color:var(--ink)}
.qcard-choice:disabled{cursor:default}
.qcard-match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard-match-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.qcard-match-item.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qcard-match-item.is-wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qcard-hint{font-size:.8rem;color:var(--ink-faint);margin-bottom:8px}
.qcard-explain{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.qcard.is-answered .qcard-explain{display:block}
.qx-cue{display:none;margin-top:9px;padding:8px 11px;border-radius:8px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.qx-cue svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:var(--accent-ink)}
.qx-cue b{color:var(--accent-ink)}
.qcard.is-missed .qx-cue{display:block}
.qcard-verdict{font-weight:700;margin-right:6px}
.qcard-verdict.ok{color:var(--good)} .qcard-verdict.bad{color:var(--bad)}
.qcard-classdata-row{margin-top:8px}
.qcard-classdata-result{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)}
.qcard-classdata-result.is-bad{color:var(--bad)} .qcard-classdata-result.is-ok{color:var(--good)}
.qcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent-ink);cursor:pointer;font-size:.82rem;padding:0;text-decoration:underline}

/* ---------- hints & cram ---------- */
.hint-group{margin-bottom:34px}
.hint-group h3,.cram-card h3{font-family:var(--font-display);margin:0 0 10px;display:flex;align-items:center;gap:10px;font-size:1.2rem}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;border-left:4px solid var(--t)}
.hint blockquote{margin:0 0 6px;font-family:var(--font-display);font-style:italic;font-size:1.02rem;line-height:1.45}
.hint .take{font-size:.88rem;color:var(--ink-soft)}
.kind{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px}
.kind.emphasize{background:var(--good-soft);color:var(--good)} .kind.deemphasize{background:var(--caution-soft);color:var(--caution)}
.cram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cram-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.cram-card ul{margin:0;padding-left:18px}
.cram-card li{margin-bottom:5px;font-size:.9rem}

/* ---------- review ---------- */
.review-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.review-top input{flex:1 1 240px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;font:inherit;color:var(--ink);min-width:0}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.toggle .sw{width:30px;height:17px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:15px}
.group-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.group-chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.group-chip .n{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint)}
.group-chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)} .group-chip.is-active .n{color:var(--bg);opacity:.7}
.gc-lec{font-family:var(--font-mono);font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ts);color:var(--t)}
.group-chip.is-active .gc-lec{background:var(--bg);color:var(--ink)}
.group-lec{margin:4px 0 6px}
.group-head h2{font-family:var(--font-display);font-size:1.7rem;margin:4px 0 4px}
.group-head p{color:var(--ink-soft);margin:0 0 20px;max-width:80ch}
.rv-parts{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 22px}
.rv-part-link{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.rv-part-link:hover{border-color:var(--accent);color:var(--accent)}
.rv-part{font-family:var(--font-display);font-size:1.35rem;margin:6px 0 16px;padding-top:4px;scroll-margin-top:90px;color:var(--accent)}
.rv-section{margin-bottom:38px}
.rv-section > h3{font-family:var(--font-display);font-size:1.18rem;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--t);display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-card h4{margin:0;font-size:1.02rem;line-height:1.25}
.rv-card .sub{font-size:.8rem;color:var(--ink-soft);margin-top:-2px}
.rv-card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:.87rem}
.rv-card dt{font-weight:700;color:var(--t);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;white-space:nowrap}
.rv-card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rv-tip{margin-top:4px;font-size:.8rem;font-weight:600;background:var(--ts);color:var(--t);padding:5px 9px;border-radius:7px;align-self:flex-start}
.rv-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.rv-table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
table.rv-table th{background:var(--surface-2);text-align:left;padding:9px 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);position:sticky;top:0}
table.rv-table td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.rv-table td:first-child{font-weight:700}
table.rv-table tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 40%, transparent)}
.rv-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rv-list li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.9rem}
.flows{display:grid;gap:16px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--t)}
.flow h4{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow li{display:flex;align-items:center;gap:6px;font-size:.85rem}
.flow li .st{background:var(--ts);color:var(--ink);border:1px solid color-mix(in srgb, var(--t) 40%, transparent);border-radius:8px;padding:5px 9px}
.flow li .st b{font-family:var(--font-mono);color:var(--t);margin-right:5px}
.flow li:not(:last-child)::after{content:"→";color:var(--ink-faint)}
/* recall mode: hide answers until tapped */
.recall .rv-card dd,.recall table.rv-table td:not(:first-child),.recall .flow li .st span{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
.recall .rv-card dd.shown,.recall table.rv-table td.shown,.recall .flow li .st span.shown{filter:none}
.rv-empty{color:var(--ink-faint);padding:30px 0;text-align:center}
mark{background:var(--caution-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- toast ---------- */
#toastHost{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem;animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===================================================================
   ARCADE (fixed dark world)
   =================================================================== */
#panel-arcade{background:var(--ar-bg);color:var(--ar-ink);margin:-16px -20px 0;padding:24px 20px 40px;min-height:70vh;border-radius:0 0 18px 18px;position:relative;overflow:hidden}
#panel-arcade::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);background-size:22px 22px;pointer-events:none}
.ar-wrap{position:relative;max-width:1060px;margin:0 auto}
.ar-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;min-height:220px;padding:22px 24px;border-radius:18px;border:2px solid var(--ar-line);background:linear-gradient(90deg, var(--ar-bg) 0 26%, rgba(12,32,31,.5) 48%, transparent 66%), url(img/arcade-hero.webp) right center/auto 100% no-repeat, var(--ar-bg)}
@media (max-width: 760px){ .ar-hero{min-height:170px;padding:16px;background:linear-gradient(90deg, var(--ar-bg) 0 40%, rgba(12,32,31,.6) 70%, rgba(12,32,31,.3)), url(img/arcade-hero.webp) right center/auto 100% no-repeat, var(--ar-bg)} }
.ar-logo{font-family:var(--font-arcade);font-size:1.35rem;line-height:1.5;color:var(--ar-yellow);text-shadow:3px 3px 0 var(--ar-pink);margin:0}
.ar-logo small{display:block;font-size:.55rem;color:var(--ar-dim);text-shadow:none;margin-top:6px;letter-spacing:.06em}
.ar-stats{display:flex;gap:8px;flex-wrap:wrap}
.ar-stat{background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 12px;font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-stat b{color:var(--ar-ink);font-size:.95rem;margin-left:4px}
.ar-mute{cursor:pointer;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 10px;color:var(--ar-ink)}
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ar-tile{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, border-color .15s;cursor:pointer;text-align:left;padding:0;color:var(--ar-ink)}
.ar-tile:hover,.ar-tile:focus-visible{transform:translateY(-4px);border-color:var(--c)}
.ar-thumb{height:170px;background:var(--ar-panel-2);display:block;width:100%}
.ar-thumb svg{display:block;width:100%;height:100%}
.ar-tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ar-tile h3{font-family:var(--font-arcade);font-size:.85rem;color:var(--c);margin:0;line-height:1.5}
.ar-tile p{margin:0;font-size:.88rem;color:var(--ar-dim)}
.ar-tile .ar-tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.ar-play{font-family:var(--font-arcade);font-size:.65rem;background:var(--c);color:var(--ar-bg);padding:9px 14px;border-radius:8px;box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, #000)}
.ar-best{font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-how{margin-top:26px;background:var(--ar-panel);border:2px dashed var(--ar-line);border-radius:14px;padding:14px 18px;font-size:.88rem;color:var(--ar-dim)}
.ar-how b{color:var(--ar-ink)}

/* game shell */
.gm{display:flex;flex-direction:column;gap:12px}
.gm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-back{font-family:var(--font-arcade);font-size:.6rem;background:var(--ar-panel);border:2px solid var(--ar-line);color:var(--ar-ink);padding:9px 12px;border-radius:8px;cursor:pointer}
.gm-title{font-family:var(--font-arcade);font-size:.8rem;color:var(--c);margin-right:auto}
.gm-hud{display:flex;gap:8px;flex-wrap:wrap}
.gm-hud span{font-family:var(--font-mono);font-size:.8rem;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:8px;padding:5px 10px}
.gm-hud b{color:var(--ar-yellow)}
.gm-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm-select label{font-size:.82rem;color:var(--ar-dim)}
.gm-select select{background:var(--ar-panel);color:var(--ar-ink);border:2px solid var(--ar-line);border-radius:8px;padding:6px 10px;font:inherit;font-size:.86rem;max-width:100%}
.gm-stage{position:relative;background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.gm-overlay{position:absolute;inset:0;background:rgba(10,8,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5;overflow-y:auto}
.gm-overlay h2{font-family:var(--font-arcade);font-size:1rem;color:var(--c);margin:0;line-height:1.6}
.gm-overlay p{margin:0;color:var(--ar-dim);max-width:52ch;font-size:.92rem}
.gm-big{font-family:var(--font-arcade);font-size:1.6rem;color:var(--ar-yellow)}
.gm-btn{font-family:var(--font-arcade);font-size:.7rem;background:var(--c);color:var(--ar-bg);border:0;padding:12px 18px;border-radius:10px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn.alt{background:var(--ar-panel-2);color:var(--ar-ink);box-shadow:0 5px 0 #0a0818}
.gm-missed{width:100%;max-width:560px;text-align:left;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 14px;max-height:240px;overflow-y:auto;font-size:.84rem}
.gm-missed h4{margin:0 0 6px;font-family:var(--font-arcade);font-size:.6rem;color:var(--ar-pink)}
.gm-missed li{margin-bottom:6px;color:var(--ar-ink)}
.gm-missed li span{color:var(--ar-green)}
.gm-keys{font-size:.78rem;color:var(--ar-dim);text-align:center}
.gm-keys kbd{font-family:var(--font-mono);background:var(--ar-panel-2);border:1px solid var(--ar-line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--ar-ink)}

/* Sort Storm */
.ss-stage{height:470px}
.ss-banner{position:absolute;top:12px;left:0;right:0;text-align:center;font-family:var(--font-arcade);font-size:.7rem;color:var(--ar-cyan);line-height:1.6;padding:0 12px;z-index:2}
.ss-card{position:absolute;left:50%;top:0;transform:translate(-50%,0);background:var(--ar-yellow);color:#1a1433;font-weight:800;padding:14px 18px;border-radius:12px;min-width:170px;max-width:78%;text-align:center;font-size:1.02rem;box-shadow:0 6px 0 #b8901c, 0 10px 24px rgba(0,0,0,.4);z-index:3;will-change:transform}
.ss-card.fly-l{transition:transform .22s ease-in, opacity .22s;opacity:.2}
.ss-bins{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.ss-bin{height:110px;border-radius:14px;border:3px dashed var(--bc);background:color-mix(in srgb, var(--bc) 14%, transparent);color:var(--ar-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1rem;cursor:pointer;text-align:center;padding:6px}
.ss-bin kbd{font-family:var(--font-mono);font-size:.72rem;background:var(--ar-bg);border:1px solid var(--ar-line);border-radius:5px;padding:1px 6px;color:var(--ar-dim);font-weight:400}
.ss-bin.flash-good{background:color-mix(in srgb, var(--ar-green) 45%, transparent);border-style:solid;border-color:var(--ar-green)}
.ss-bin.flash-bad{background:color-mix(in srgb, var(--ar-pink) 45%, transparent);border-style:solid;border-color:var(--ar-pink)}
.ss-danger{position:absolute;left:0;right:0;bottom:130px;border-top:2px dashed rgba(255,92,138,.5)}
.ss-pop{position:absolute;font-family:var(--font-arcade);font-size:.75rem;pointer-events:none;animation:pop .8s ease-out forwards;z-index:4}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}

@media (hover:none){ .sn-pad{display:grid} }

@keyframes drop{from{transform:translateY(-120px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- responsive ---------- */
@media (max-width: 860px){
  .notes-layout{grid-template-columns:minmax(0,1fr)}
  .lec-nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .lec-nav button{flex:none;width:210px}
  .reading{padding:18px 16px}
}
@media (max-width: 520px){
  #app{padding:0 16px 50px}
  .hub-header{margin:0 -16px;padding:10px 16px 0}
  #panel-arcade{margin:-16px -16px 0;padding:18px 12px 30px}
  .hub-title h1{font-size:1.2rem}
  .hub-subtitle{display:none}
  #streakPill,#progressSummary{display:none}
  .hub-header-top{flex-wrap:nowrap}
  .pill.countdown{font-size:.72rem;padding:3px 8px}
  .qcard-match-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ss-stage{height:430px}
  .ar-logo{font-size:1rem}
  .rv-cards{grid-template-columns:minmax(0,1fr)}
  .cram-grid{grid-template-columns:minmax(0,1fr)}
}

/* ---------- custom icon set ---------- */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.theme-btn .ic{width:15px;height:15px}
.group-chip .ic{width:17px;height:17px;color:var(--accent)}
.group-chip.is-active .ic{color:var(--bg)}
.group-head h2{display:flex;align-items:center;gap:10px}
.group-head h2 .ic{width:26px;height:26px;color:var(--accent);padding:4px;border-radius:8px;background:var(--accent-soft);box-sizing:content-box}
.rv-tip{display:inline-flex;gap:6px;align-items:center}
.toast{display:flex;gap:8px;align-items:center}
.ar-mute{display:inline-flex;align-items:center}
.ar-mute .ic{width:18px;height:18px}
.ar-play{display:inline-flex;align-items:center;gap:6px}
.ar-play .ic,.gm-back .ic{width:11px;height:11px}
.gm-back{display:inline-flex;align-items:center;gap:6px}
.gm-overlay p .ic{color:var(--ar-yellow)}
.hrt{display:inline-flex;margin-right:3px;color:var(--ar-pink)}
.hrt .px-heart{width:14px;height:12px;vertical-align:-1px}
.hrt.lost{color:var(--ar-line)}

/* ---------- compact single-row ribbon ---------- */
.hub-header{padding:6px 20px}
.hub-header-top{flex-wrap:nowrap;gap:14px}
.hub-title{align-items:center;gap:8px;flex:none}
.hub-title h1{font-size:1.12rem;white-space:nowrap}
.hub-back-btn{width:30px;height:30px}
#modeSwitch{margin:0;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;flex:0 1 auto;min-width:0}
#modeSwitch button{padding:5px 12px;border:0;border-radius:999px;font-size:.86rem;gap:6px}
#modeSwitch button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{color:var(--ar-pink)}
#modeSwitch .mode-icon{display:inline-flex}
#modeSwitch .mode-icon .ic{width:16px;height:16px}
.hub-meta{margin-left:auto;flex-wrap:nowrap;gap:6px}
.pill{padding:3px 9px;font-size:.76rem}
.theme-btn{width:28px;height:26px}
main{padding-top:16px}
@media (max-width: 760px){
  .hub-title h1{font-size:1rem}
  #progressSummary{display:none}
  #modeSwitch button{padding:5px 9px}
}
@media (max-width: 560px){
  .hub-header{padding:6px 12px}
  .hub-header-top{gap:8px}
  .mode-label{display:none}
  #modeSwitch button{padding:6px 11px}
  .pill.countdown{font-size:.7rem;padding:3px 7px}
  .hub-back-btn{width:28px;height:28px}
}
@media (max-width: 380px){ .hub-title h1{display:none} }

/* ---------- arcade leaderboards ---------- */
.ar-boards{margin-top:26px}
.ar-sub{font-family:var(--font-arcade);font-size:.72rem;color:var(--ar-yellow);display:flex;align-items:center;gap:8px;margin:0 0 12px}
.ar-sub .ic{width:18px;height:18px}
.ar-board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ar-board{background:var(--ar-panel);border:3px solid var(--ar-line);border-top-color:var(--c);border-radius:14px;padding:12px 14px}
.ar-board h4{margin:0 0 8px;font-family:var(--font-arcade);font-size:.62rem;color:var(--c)}
.lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-family:var(--font-mono);font-size:.8rem}
.lb-list li{display:flex;gap:10px;align-items:center;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.03)}
.lb-list li.me{background:color-mix(in srgb, var(--ar-yellow) 18%, transparent);color:var(--ar-yellow)}
.lb-list li.lb-gap{background:none;justify-content:center;color:var(--ar-dim);padding:0}
.lb-rk{width:22px;color:var(--ar-dim);text-align:right;flex:none}
.lb-list li:nth-child(1) .lb-rk{color:var(--ar-yellow)} .lb-list li:nth-child(2) .lb-rk{color:#d8d4f0} .lb-list li:nth-child(3) .lb-rk{color:var(--ar-orange)}
.lb-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ar-ink)}
.lb-list li.me .lb-nm{color:var(--ar-yellow)}
.lb-sc{color:var(--ar-yellow);flex:none}
.lb-empty{color:var(--ar-dim);font-size:.82rem;padding:6px 2px}

/* ---------- QUESTIONS ----------
   Correct choice is authored first (answer:0); qCardHTML shuffles display order, except two-statement, true/false and
   numbered-statement items, whose choices keep a fixed order (choiceOrder).
   src: rec = what Dr. Mitchell said in the recorded lecture (or showed on its slides); module = the autism module;

   Every multiple-choice item carries a "why" for each choice: mq() takes [choice, why] pairs; two(), tf() and nums()
   build theirs. No graded quiz, exam or earlier-year content is used. */
var QUESTIONS = [];
function mcq(id, lec, src, stem, choices, ex, extra){ var q = { id:id, lec:lec, type:'mcq', stem:stem, choices:choices, answer:0, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
function seq(id, lec, src, stem, steps, ex, extra){ var q = { id:id, lec:lec, type:'sequence', stem:stem, steps:steps, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
function match(id, lec, src, stem, pairs, ex, extra){ var q = { id:id, lec:lec, type:'match', stem:stem, pairs:pairs, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
function multi(id, lec, src, stem, choices, correct, ex, extra){ var q = { id:id, lec:lec, type:'multi', stem:stem, choices:choices, correct:correct, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
/* Two-statement (fmt '2stmt') and true/false (fmt 'tf') items keep their choices in a fixed order (choiceOrder), so the
   answer is not authored first. Their "why each choice" lines are built here instead of in QUESTION_WHY:
   two() takes one reason per statement, tf() one line for True and one for False. */
var TWO_CHOICES = ['Both statements are true','Both statements are false','Statement 1 is true; statement 2 is false','Statement 1 is false; statement 2 is true'];
function two(id, lec, src, s1, s2, t1, t2, ex, r1, r2, extra){
  var claims = [[true,true],[false,false],[true,false],[false,true]], tv = function(b){ return b ? 'true' : 'false'; };
  var why = claims.map(function(c){
    if(c[0] === t1 && c[1] === t2) return 'Statement 1 is ' + tv(t1) + ': ' + r1 + ' Statement 2 is ' + tv(t2) + ': ' + r2;
    var out = [];
    if(c[0] !== t1) out.push('Statement 1 is ' + tv(t1) + ', not ' + tv(c[0]) + ': ' + r1);
    if(c[1] !== t2) out.push('Statement 2 is ' + tv(t2) + ', not ' + tv(c[1]) + ': ' + r2);
    return out.join(' ');
  });
  mcq(id, lec, src, 'Read the two statements.\n1. ' + s1 + '\n2. ' + s2, TWO_CHOICES.slice(), ex, extra);
  var q = QUESTIONS[QUESTIONS.length - 1]; q.fmt = '2stmt'; q.answer = claims.findIndex(function(c){ return c[0] === t1 && c[1] === t2; }); q.why = why;
}
function tf(id, lec, src, statement, isTrue, ex, whyTrue, whyFalse, extra){
  mcq(id, lec, src, 'True or false: ' + statement, ['True','False'], ex, extra);
  var q = QUESTIONS[QUESTIONS.length - 1]; q.fmt = 'tf'; q.answer = isTrue ? 0 : 1; q.why = [whyTrue, whyFalse];
}
function numList(set){ return set.length === 1 ? String(set[0]) : set.slice(0, -1).join(', ') + ' and ' + set[set.length - 1]; }
function numLabel(set){ return set.length === 1 ? set[0] + ' only' : set.length === 2 ? set[0] + ' and ' + set[1] + ' only' : numList(set); }
function nums(id, lec, src, lead, stmts, truth, wrong, ex, reasons, extra){
  var right = [], falses = [];
  truth.forEach(function(t, i){ (t ? right : falses).push(i + 1); });
  var sets = [right].concat(wrong).sort(function(a, b){
    for(var i = 0; i < Math.min(a.length, b.length); i++) if(a[i] !== b[i]) return a[i] - b[i];
    return a.length - b.length;
  });
  var why = sets.map(function(set){
    if(set === right) return (falses.length ? (right.length === 1 ? 'Only statement ' + right[0] + ' is true. ' : 'Statements ' + numList(right) + ' are true. ') +
      falses.map(function(k){ return 'Statement ' + k + ' is false: ' + reasons[k - 1]; }).join(' ') : 'All ' + truth.length + ' statements are true.');
    var out = [];
    set.forEach(function(k){ if(!truth[k - 1]) out.push('It includes ' + k + ', which is false: ' + reasons[k - 1]); });
    right.forEach(function(k){ if(set.indexOf(k) < 0) out.push('It leaves out ' + k + ', which is true: ' + reasons[k - 1]); });
    return out.join(' ');
  });
  mcq(id, lec, src, lead + '\n' + stmts.map(function(t, i){ return (i + 1) + '. ' + t; }).join('\n'), sets.map(numLabel), ex, extra);
  var q = QUESTIONS[QUESTIONS.length - 1]; q.fmt = 'numbered'; q.answer = sets.indexOf(right); q.why = why;
}
/* Patient cases: one Patient Box (and its drawn findings) shared by every question on that patient. pc(key) gives
/* mq(): a multiple-choice question whose choices carry their own "why" line: [[choice, why], ...], key first */
function mq(id, lec, src, stem, pairs, ex, extra){ mcq(id, lec, src, stem, pairs.map(function(p){ return p[0]; }), ex, extra); QUESTIONS[QUESTIONS.length - 1].why = pairs.map(function(p){ return p[1]; }); }

mq("bg-mal", "behavior", "rec", "What does \"maladaptive behavior\" mean in this course?",
  [["The patient cannot adapt to the treatment conditions in a dental office","He called it the academic term for not behaving well in the chair."],
   ["Any behavior caused by a medication side effect","Not the definition he gave."],
   ["Behavior seen in every patient with IDD","It applies to only a subset; many adapt very well."],
   ["A planned behavior the patient uses on purpose to get attention from the caregiver","That sounds like a tantrum, not maladaptive behavior."]],
  "Maladaptive behavior: the patient can't adapt to treatment conditions in a dental office. It applies to a subset of the IDD population and can be unpredictable.");
mq("bg-limits", "behavior", "rec", "According to Dr. Mitchell, quality care for patients with IDD should be limited only by:",
  [["Their ability to benefit from and to tolerate the treatment","Those are the two limits."],
   ["Their insurance coverage and the length of appointment the office can give","Not the limits he named."],
   ["The caregiver's preference for esthetics","Caregivers are included, but these aren't the limits."],
   ["Their IQ score","Intellect alone doesn't limit care."]],
  "Patients with IDD deserve quality care limited only by their ability to benefit from the treatment and their ability to tolerate it.");
mq("bg-benefit", "behavior", "rec", "A profoundly disabled patient has stained but healthy anterior enamel. Esthetic crowns would mean a long, emotionally taxing process. Which limit does this case illustrate?",
  [["Ability to benefit from the treatment","Does the patient actually gain from the crowns?"],
   ["Ability to tolerate the treatment","Tolerance is the second limit; this example was about benefit."],
   ["Contingent escape","That's a behavior term, not a limit on care."],
   ["Implied consent","Consent isn't the issue here."]],
  "Dr. Mitchell used this example (and a CP patient with a severe gag reflex and a denture) for the ability to benefit.");
mq("bg-tolerate", "behavior", "rec", "A tooth could be saved with a cast crown, but the patient's maladaptive behavior makes restoring it dangerous, so it is extracted. Which limit is this?",
  [["Ability to tolerate the treatment","The patient couldn't safely tolerate the restorative care."],
   ["Ability to benefit from the treatment","The patient would benefit; tolerating it is the problem."],
   ["Beneficence","Beneficence guides decisions for incompetent patients; this example was about tolerance."],
   ["Non-contingent escape","A behavior technique, not a limit on care."]],
  "Tooth-colored restorations a patient can't keep clean, or a crown that is too dangerous to place: both illustrate the ability to tolerate treatment.");
mq("bg-least", "behavior", "rec", "Which behavior support is the most commonly used and least invasive?",
  [["Communication","The first and least invasive tool."],
   ["Passive stabilization","More invasive, used only when needed."],
   ["Active stabilization","Holding a patient is more invasive than talking."],
   ["Sedation","Beyond this course, and far more invasive."]],
  "The three groups are communication, environment and protective stabilization. Communication tools are the most commonly used and least invasive.");
mq("bg-social", "behavior", "rec", "What is a patient's \"social age\"?",
  [["The level of skill the patient has acquired","Speak at that level."],
   ["The patient's chronological age","Social age is about acquired skills, not years."],
   ["The age at which the disability began","That's about onset, part of the ID definition."],
   ["The age of the patient's caregiver","Not related."]],
  "Speak at the social age: the level of skill the patient has acquired. A good history question: at what level does the patient understand (normal, none, or like a ___-year-old)?");
mq("bg-start", "behavior", "rec", "Dr. Mitchell asked for special attention to how to start a conversation with a patient with ID. What did he say?",
  [["Start at a normal level, then back down to the social level you find","If you must err, talk too high; talking down is offensive."],
   ["Start at a toddler level and work up only if they seem to follow","Starting low can offend a patient who understands far more."],
   ["Speak only to the caregiver","Include caregivers, but talk to the patient."],
   ["Avoid speaking; use only gestures","Visual cues add to speech; they don't replace it."]],
  "Always go into a conversation talking at a normal level, then back down. Many patients have more cognitive ability than we credit, and speaking down shuts them down.");
mq("bg-tone", "behavior", "rec", "A family says their son understands none of the words you say. What does he still understand?",
  [["Tone and emotion","A more primitive part of the brain reads the feeling behind the words."],
   ["Abstract metaphors","Those are the hardest to understand."],
   ["Written instructions","Not what he said."],
   ["Nothing at all","He picks up the emotional tone."]],
  "Even with profound cognitive deficits, people understand tone and emotion. Anxiety or irritation ramps things up; calm and compassion bring a response in kind.");
mq("bg-goal", "behavior", "rec", "\"I'm going to lay the chair down like a bed. I need you to lay back against the chair. It will take until the count of 10 to stop.\" What technique is this?",
  [["Establishing clear and limited goals","What you'll do, what they need to do, and how long."],
   ["Hand guarding","That's a light touch on the hands."],
   ["Contingent escape","That's stopping because of behavior."],
   ["Tell-show-do with a mouth prop","No prop is involved."]],
  "Clear and limited goals: tell the patient what you are going to do, what they need to do, and how long it will take.");
mq("bg-nce", "behavior", "rec", "In non-contingent escape, what does the dentist do when the patient starts resisting partway through a set goal?",
  [["Keeps going until the goal is reached, then gives the break","The break doesn't depend on the behavior."],
   ["Stops at once and gives a break so the patient learns to trust the team","That is contingent escape: the patient learns resisting ends treatment."],
   ["Ends the appointment","Ending it rewards the behavior too."],
   ["Lengthens the goal as a consequence","Intervals are kept consistent, not used as punishment."]],
  "Non-contingent escape: set a specific small goal (five seconds, three teeth) and don't stop until it's done, even if the patient resists. Stopping for behavior is contingent escape.");
mq("bg-ce", "behavior", "rec", "Why is stopping treatment whenever the patient acts out a problem?",
  [["It is contingent escape: the patient learns that acting out ends treatment","The escape becomes contingent on bad behavior."],
   ["It violates informed consent","Stopping doesn't violate consent."],
   ["It is a form of protective stabilization","Stopping is the opposite of stabilizing."],
   ["It shortens the appointment too much to finish the planned work or bill for it","Billing isn't the point."]],
  "If the break comes because of bad behavior, the patient learns to use that behavior to escape. Non-contingent escape keeps the break tied to the goal.");
mq("bg-interval", "behavior", "rec", "How should intervals be handled in non-contingent escape?",
  [["Kept consistent, lengthened only as the patient relaxes","Consistency lets the patient settle into a rhythm."],
   ["Varied randomly so the patient can't predict breaks","Predictability is the point."],
   ["Made as long as possible from the start, so treatment is finished in fewer rounds","Start small and short."],
   ["Shortened every time the patient resists","That rewards resistance."]],
  "Be consistent with intervals so the patient adapts to the routine; as they relax and accept treatment, you may increase them.");
mq("bg-water", "behavior", "rec", "A patient fights as soon as the continuous air-water spray starts. What change does Dr. Mitchell recommend?",
  [["Spray in short bursts, in and out of the mouth","Many patients can't manage continuous water and can't breathe."],
   ["Use more water at once to finish the cleaning faster","More water makes the gag and panic worse."],
   ["Place a papoose board first","The fighting is about breathing; fix the water first."],
   ["Tip the head back further","Laying back further increases the gag risk."]],
  "Many patients' gag reflexes are too sensitive for a continuous spray; they fight because they can't breathe. Work in short bursts.");
mq("bg-light", "behavior", "rec", "During a simple oral cancer screening, a patient kept turning away from the light. What fixed it?",
  [["Turning off the operatory lights and using only the unit light in the mouth","The patient was light sensitive."],
   ["A papoose board","Restraint wasn't needed once the cause was found."],
   ["Playing loud music","Music helps some patients, but this one was light sensitive."],
   ["Adding two more staff members to hold the patient's head toward the light","More people would make it worse."]],
  "Adapt the operatory to the patient: once the room lights were off and only the unit light was used, the light-sensitive patient opened right up.");
mq("bg-hyper", "behavior", "rec", "For a patient with hyperdistractibility, what environmental change helps?",
  [["Fewer people in the operatory, ideally an isolated room","They are distracted very easily."],
   ["A busy open bay so they have more things to look at and stay entertained","More stimulation makes it worse."],
   ["A different operatory each visit for variety","Routine and the same room help more."],
   ["Bright overhead lights","That's unrelated to distractibility."]],
  "Patients who distract very easily do better with fewer people present, or in an isolated operatory.");
mq("bg-cms", "behavior", "rec", "Under the Centers for Medicare and Medicaid Services definition, which of these counts as a physical restraint?",
  [["A drug used to restrict behavior that isn't standard treatment for the patient's condition","Part B of the definition covers medications used as restraints."],
   ["A drug given at its usual dose for the patient's condition, such as a seizure medicine","Standard treatment is excluded."],
   ["A conversation that calms the patient","Communication isn't restraint."],
   ["A pair of sunglasses","Doesn't reduce movement."]],
  "CMS: (A) any manual method, physical or mechanical device, material or equipment that reduces the ability to move freely; (B) a drug used as a restriction that is not a standard treatment or dose for the patient's condition.");
mq("bg-aapd", "behavior", "rec", "Which detail is part of the AAPD definition of protective stabilization?",
  [["Limitation of movement by a person or by equipment, for a finite period of time","A person holding the patient counts, and it's time-limited."],
   ["Only devices count; a person holding the patient still is not stabilization at all","He stressed that a person holding the patient is protective stabilization."],
   ["It is used continuously for patients with dangerous behavior","It's for a finite period."],
   ["Its purpose is to punish dangerous behavior","Its purpose is safe examination and treatment."]],
  "AAPD: the physical limitation of a patient's movement by a person or restrictive equipment, materials or devices for a finite period of time, to safely provide examination, diagnosis and/or treatment.");
mq("bg-active", "behavior", "rec", "Which is an example of active protective stabilization?",
  [["A staff member cradling the patient's head","A person holding the patient still."],
   ["A Molt mouth prop held open by the assistant","A device: passive."],
   ["A Rainbow Wrap","A device: passive."],
   ["A weighted blanket","It comforts rather than restrains, and it's a device."]],
  "Active stabilization is a human holding the patient still (Module 6's \"physical restraint\"); passive is a device (\"mechanical restraint\").");
mq("bg-module6", "behavior", "rec", "When Module 6 says \"mechanical restraint,\" what term does Dr. Mitchell use instead?",
  [["Passive protective stabilization","A device holding the patient still."],
   ["Active protective stabilization","That replaces Module 6's \"physical restraint.\""],
   ["Non-contingent escape","A communication technique."],
   ["Therapeutic hold","A kind of active stabilization."]],
  "Read Module 6's \"physical restraint\" as active protective stabilization, and \"mechanical restraint\" as passive.");
mq("bg-carseat", "behavior", "rec", "Why did Dr. Mitchell compare protective stabilization to an infant car seat?",
  [["Both restrain for the child's safety, and not using one can be negligent","Stabilization is predominantly about safety."],
   ["Both can be used as a punishment when a child refuses to cooperate","Stabilization must never be punishment."],
   ["Both are used only with sedation","No sedation involved."],
   ["Both need no consent","Stabilization always needs informed consent."]],
  "We don't hesitate to put an infant in a car seat, though it restrains and they may fuss, because we care about safety. Use that frame for stabilization.");
mq("bg-never", "behavior", "rec", "Which is an acceptable reason to use protective stabilization?",
  [["To keep a very resistive patient and the staff safe during needed treatment","Safety during treatment is the purpose."],
   ["To punish a patient who won't cooperate","Never as punishment."],
   ["To move a busy clinic faster when the schedule is running behind","Never for the practitioner's convenience."],
   ["Instead of trying communication first","Never as a substitute for guiding behavior."]],
  "Never use stabilization as punishment, as a substitute for guiding behavior, or for the practitioner's convenience. Its purpose is safety and efficient care.");
mq("bg-ideal", "behavior", "rec", "Only the patient's head needs to be kept still. What does good protective stabilization call for?",
  [["Hold only the head: the least restrictive alternative","Restrict only what must be restricted."],
   ["A full papoose board, to be safe in case the arms move too","More restrictive than needed."],
   ["Hold arms and legs as well","Not the least restrictive alternative."],
   ["Sedation instead","Beyond this course, and far more restrictive."]],
  "Good protective stabilization has the lowest potential to cause injury, is the least restrictive alternative, and is used only with informed consent.");
mq("bg-negl", "behavior", "rec", "What does Module 6 say about treating a very resistive patient without restraints?",
  [["It may even be considered negligence toward patient and operator","Where indicated, restraints should be used without reservation."],
   ["It's always preferred, because using restraints adds legal risk for the office","Not using them where indicated has its own risks."],
   ["It's required by law","No law requires it."],
   ["It is only allowed with sedation","Not what the module said."]],
  "Module 6: where indicated, for physically resistive patients, restraints should be used without reservation; treating a very resistant patient without them may be negligence. Dr. Mitchell had a staff member hit when he wasn't quick enough.");
mq("bg-headhands", "behavior", "rec", "A staff member cradles a resistive patient's head with both hands. Where should the hands rest?",
  [["On the temporal and occipital bones, with the force spread across the hands","Stay on bone and spread pressure to avoid bruising."],
   ["On the patient's cheeks, pressing firmly so the jaw can't move","Soft tissue bruises; stay on bone."],
   ["Around the neck","Never on the neck."],
   ["On the forehead with the fingertips","Concentrated fingertip pressure can bruise."]],
  "Kneel or sit at the head of the chair; fingers spread, lower fingers cupped under the head, resting on the temporal and occipital bones, pressure distributed. Relax as the patient relaxes, but stay ready.");
mq("bg-module6head", "behavior", "rec", "Why doesn't Dr. Mitchell recommend Module 6's forearm head hold?",
  [["It's uncomfortable for his shoulders and doesn't stop the patient lifting the head","He finds it uncomfortable and unstable."],
   ["It leaves finger marks and bruises on the patient's face","Minimizing finger marks is the forearm method's advantage."],
   ["It is illegal in Alabama","Not what he said."],
   ["It requires a papoose board","It doesn't."]],
  "Module 6 recommends using the forearms (fewer finger marks), but Dr. Mitchell finds it hurts his shoulders and doesn't control the head lifting up.");
mq("bg-guard", "behavior", "rec", "What is hand guarding?",
  [["Gently laying hands over the patient's hands to remind them and prevent sudden movement","More a passive touch than an active restraint."],
   ["Strapping the wrists to a board","That's a papoose board."],
   ["Wearing two pairs of gloves","Not a behavior technique."],
   ["Holding the patient's hands firmly behind the head for the whole procedure","Not described."]],
  "Hand guarding reminds the patient where their hands should be and protects against sudden extreme movements; it can become an active restraint if needed.");
mq("bg-legs", "behavior", "rec", "A patient keeps digging their heels in and pushing up the chair. What is Dr. Mitchell's personal technique?",
  [["Cup under the ankles with open hands and lift the legs off the chair","Without leverage, the head stays still even if the legs move."],
   ["Sit on the patient's knees","Unsafe and not described."],
   ["Squeeze the ankles tightly","Open hands, not squeezing."],
   ["Let the patient push, then pull them back down the chair each time they slide","Lifting the legs prevents the leverage instead."]],
  "Lift the legs by the ankles with open hands; if the patient arches, lift higher. The legs may move, but the head stays still, which is what matters in dentistry.");
mq("bg-home", "behavior", "rec", "What did Dr. Mitchell say about HOME and HOMAR?",
  [["Don't use them: HOMAR is not used at all, and HOME only rarely with extensive training","They are in the reading but not current practice."],
   ["They're the preferred first step for a tantrum before any other stabilization is tried","Not recommended."],
   ["HOMAR is safer than HOME","HOMAR (airway restricted) isn't used at all anymore."],
   ["They are types of mouth props","They are hand-over-mouth techniques."]],
  "Hand-over-mouth exercise (HOME) and hand-over-mouth with airway restriction (HOMAR) are presented in Module 6, but neither is a technique to use.");
mq("bg-fingers", "behavior", "rec", "Working without a mouth prop, where should you keep your fingers?",
  [["In the buccal vestibule","If the patient bites down, your fingers are safe."],
   ["Across the occlusal surfaces to hold the mouth open","Fingers between the teeth get bitten."],
   ["Under the tongue","Not what he recommended."],
   ["Behind the last molar","Still between the jaws."]],
  "Keep your fingers in the buccal fold, not across the dentition. Dr. Mitchell learned this one the hard way.");
mq("bg-molt", "behavior", "rec", "Where should the blades of a Molt mouth prop sit?",
  [["On the posterior teeth","Forward placement risks the anterior teeth and lips."],
   ["On the anterior teeth","Anterior teeth can be luxated or even avulsed."],
   ["On the lower lip","The lip can be caught and lacerated."],
   ["Against the palate","They sit on teeth."]],
  "Keep the Molt blades on posterior teeth. Slipped onto anterior teeth they can luxate or avulse them, and lips caught under a blade can be lacerated. Report any trauma to the caregiver.");
mq("bg-silicone", "behavior", "rec", "Why does Sparks use Molt mouth props with bare blades instead of silicone covers?",
  [["The covers can come off in the mouth and become a choking hazard","Safety, not comfort."],
   ["The covers make the prop too wide to slide between the teeth of a small mouth","Not the reason given."],
   ["Silicone can't be sterilized","Not the reason given."],
   ["Bare blades grip the teeth better","Not the reason given."]],
  "The silicone covers have been shown to come off in the patient's mouth and become a choking hazard.");
mq("bg-mckesson", "behavior", "rec", "Where is the McKesson bite block used?",
  [["In the second-floor and other adult clinics, not in special needs or pediatric dentistry","A rubber wedge; patients can crush it."],
   ["Mainly at Sparks and in pediatric dentistry, for patients who can't keep their mouth open","Sparks uses the Molt prop."],
   ["Only at home","The Open-Wide prop is the home device."],
   ["Only under general anesthesia","Not what he said."]],
  "The McKesson bite block is a rubber wedge used in the adult clinics; it isn't used in special needs or pediatric dentistry, and one patient simply crushed it.");
mq("bg-openwide", "behavior", "rec", "Which mouth prop did Dr. Mitchell describe for families to use at home?",
  [["The Open-Wide mouth prop","Wood in dense foam, about $20 for four."],
   ["The Molt mouth prop","Used in the clinic."],
   ["The McKesson bite block","Used in adult clinics."],
   ["A papoose board","Not a mouth prop."]],
  "The Open-Wide mouth prop (Specialized Care Company) has a wood core surrounded by dense foam and is available on Amazon, four for about $20.");
mq("bg-papoose", "behavior", "rec", "Why is \"papoose board\" called the \"Kleenex\" term?",
  [["Papoose is a brand name now used for any board-type restraint","Like Kleenex for tissues."],
   ["Because the boards are disposable and thrown away after one patient","They are reusable."],
   ["Because they are made of paper","Padded board and canvas."],
   ["Because Kleenex makes them","A brand-name joke, not a manufacturer."]],
  "Papoose Board is a specific brand (an inflexible padded board, wrist straps and canvas wraps with Velcro) whose name became the generic term.");
mq("bg-rainbow", "behavior", "rec", "How does the Rainbow Wrap that Sparks uses differ from a Papoose Board?",
  [["It has a hinge so the patient can sit up","Stiff except at the hinge."],
   ["It has no wrist straps","It has wrist straps too."],
   ["It is a weighted blanket that comforts rather than restrains","A different product."],
   ["It holds the mouth open","That's a mouth prop."]],
  "The Rainbow Wrap (Specialized Care Company), which Sparks calls \"the blanket,\" bends in the middle; since COVID a sheet goes between it and the patient.");
mq("bg-x", "behavior", "rec", "When wrapping a patient in the papoose, where do the wraps cross?",
  [["In an X over the chest","Each comes down across a shoulder."],
   ["Over the face","Never over the face."],
   ["Around the neck","Never around the neck."],
   ["Only at the ankles","The critical spot is the chest."]],
  "Secure the wrists at the wrist bone, the leg wrap over the knees, then pull the body wraps tight (ideally two people) and form an X over the chest.");
mq("bg-weighted", "behavior", "rec", "What is the main problem with weighted blankets in dentistry?",
  [["They are hard to disinfect between patients","Most would have to be laundered."],
   ["They don't calm autistic patients","Many find them comforting."],
   ["They restrain too tightly","They don't truly stop movement."],
   ["They are illegal for minors","Not what he said."]],
  "Weighted blankets give comforting sensory input (popular in autism) but don't restrain; the challenge is disinfecting them.");
mq("bg-parents", "behavior", "rec", "In Dr. Mitchell's experience (not from studies), how do families of patients with moderate to severe IDD tend to feel about passive stabilization?",
  [["Many are relieved to find a practice that can do it","Instead of being asked to hold the patient themselves."],
   ["Almost all find it unacceptable and leave the practice","Studies of large parent populations show that trend, but less so in this group."],
   ["They prefer it to communication techniques","Communication always comes first."],
   ["They are required by law to refuse it","No such law."]],
  "Large parent studies show falling acceptance, but in his experience families of patients with moderate to severe IDD are often exhausted and relieved. Every family is different.");
mq("bg-legal", "behavior", "rec", "A staff member holds a patient's head without anyone obtaining consent. What could the dentist face?",
  [["A criminal charge of assault and battery and a malpractice claim","Holding a patient is restraint and needs consent."],
   ["Nothing, because a person holding a patient isn't a form of restraint","A person holding a patient is protective stabilization."],
   ["Only a warning from CODA","CODA accredits schools; it doesn't police consent."],
   ["Loss of Medicaid coverage for the patient","Not a consequence he described."]],
  "Active or passive stabilization requires informed consent. Without it: criminal charges (assault and battery) or a personal tort (malpractice).");
mq("bg-implied", "behavior", "rec", "An adult walks into a dental office and sits down for an exam and cleaning. What kind of consent is this?",
  [["Implied consent","Their conduct raises the presumption of consent."],
   ["Express consent","Express consent is given in words or writing."],
   ["Informed consent for stabilization","Stabilization needs express informed consent."],
   ["No consent","Seeking care implies consent to routine care."]],
  "Implied consent: actions or conduct raise the presumption that consent has been given. Routine care may be implied; beyond that, seek express consent.");
mq("bg-blanket", "behavior", "rec", "Why is a blanket consent signed at registration not informed consent?",
  [["The patient hasn't been told their needs or options yet","Consent must be informed."],
   ["It isn't witnessed","Witnessing helps documentation, but the problem is it isn't informed."],
   ["Only caregivers may sign","Competent patients sign their own."],
   ["It expires after 24 hours and must be signed again at each visit","Not the reason."]],
  "Informed consent needs capacity, information and voluntariness. A blanket form at registration is meaningless because the patient hasn't been informed.");
mq("bg-justify", "behavior", "rec", "Which item on a stabilization consent form does Dr. Mitchell say is often overlooked?",
  [["Justification for the use","For example, unable to tolerate treatment safely or biting instruments."],
   ["The date","Straightforward and rarely missed."],
   ["The patient's name","Not what he flagged."],
   ["The name of the papoose board's manufacturer","A description of the restraint matters, not the brand."]],
  "Suggested items: date, justification (often overlooked), description of the restraint, its effectiveness, duration, and periodic re-evaluation; record any withdrawal of consent.");
mq("bg-competent", "behavior", "rec", "A patient with mild ID is competent to make decisions and declines a needed extraction. What does Dr. Mitchell say?",
  [["A competent patient has the right to decline care, even a bad decision","Unless something is truly urgent."],
   ["Stabilize and extract, because it's in their interest","Beneficence guides care for patients who aren't competent."],
   ["The caregiver's consent overrides a competent patient's refusal of needed care","Not for a competent patient."],
   ["Refer for sedation without telling them","That violates consent."]],
  "Issue one: is the patient competent? If so, they have every right to decline, and you should include patients in decisions whenever possible.");
mq("bg-benef", "behavior", "rec", "Which principle guides decisions for a patient who is not competent?",
  [["Beneficence: maximize the patient's well-being","Issue two."],
   ["Autonomy: do whatever the patient says in the moment","Autonomy matters for competent patients."],
   ["Non-contingent escape","A behavior technique, not an ethical principle."],
   ["Justice: treat every patient identically","Not the principle he named."]],
  "Beneficence directs actions that maximize well-being. Is a composite placed in a wet, bleeding field to avoid stabilization really better for the patient?");
tf("bg-tf-1", "behavior", "rec", "A staff member holding a patient's head still counts as protective stabilization and needs informed consent.", true,
  "A person holding the patient is active protective stabilization, and all stabilization needs consent.",
  "True: the AAPD definition includes a person, and consent is required.",
  "It is true; people sometimes assume holding isn't restraint, but it is.");
tf("bg-tf-2", "behavior", "rec", "Maladaptive behavior is seen in nearly every patient with IDD.", false,
  "It applies only to a subset; many adapt very well, though who will is unpredictable.",
  "No: only a subset struggle to adapt.",
  "Correct: many patients with IDD adapt well.");
tf("bg-tf-3", "behavior", "rec", "Stopping treatment each time a patient resists is called non-contingent escape.", false,
  "Stopping because of the behavior is contingent escape; non-contingent escape finishes the set goal first.",
  "That's contingent escape, the thing to avoid.",
  "Correct: non-contingent escape doesn't stop for the behavior.");
tf("bg-tf-4", "behavior", "rec", "Behavior is shaped better by rewarding the positive than by correcting the negative.", true,
  "Positive reinforcement: praise desired behavior heavily, correct briefly, then praise again.",
  "True: \"more flies with honey than with vinegar.\"",
  "It's true; that's the basis of positive reinforcement.");
tf("bg-tf-5", "behavior", "rec", "The Molt mouth prop's blades should be placed on the anterior teeth for the best control.", false,
  "Keep them on the posterior teeth; anterior placement can luxate or avulse teeth.",
  "No: anterior placement is the bad placement.",
  "Correct: posterior teeth.");
tf("bg-tf-6", "behavior", "rec", "Implied consent can come from a person's actions, such as an adult arriving for a routine exam.", true,
  "Implied consent is conduct that raises the presumption of consent.",
  "True: seeking routine care implies consent to it.",
  "It's true; express consent is the written or spoken kind.");
tf("bg-tf-7", "behavior", "rec", "A weighted blanket restrains a patient the way a papoose board does.", false,
  "A weighted blanket doesn't truly stop movement; it calms with sensory input.",
  "No: it comforts, it doesn't restrain.",
  "Correct: it isn't a restraint.");
tf("bg-tf-8", "behavior", "rec", "During a therapeutic hold, the hold can be eased as the patient relaxes, which acts as positive reinforcement.", true,
  "Relax with the patient without letting go; easing off rewards the behavior you want.",
  "True: they learn that cooperating brings relief.",
  "It's true; he described easing off as reinforcement.");
two("bg-2s-1", "behavior", "rec", "Module 6's \"physical restraint\" means what Dr. Mitchell calls active protective stabilization.", "Module 6's \"mechanical restraint\" means what he calls passive protective stabilization.", true, true,
  "Both are true: physical = active (a person); mechanical = passive (a device).",
  "a person holding the patient.", "a device holding the patient.");
two("bg-2s-2", "behavior", "rec", "Good protective stabilization is the least restrictive alternative.", "Protective stabilization may be used as a convenience to treat more patients quickly.", true, false,
  "Least restrictive, least injurious and consented; never for convenience.",
  "restrict only what must be restricted.", "never for the practitioner's convenience.");
two("bg-2s-3", "behavior", "rec", "Informed consent requires mental capacity, enough information and voluntariness.", "If a caregiver hesitates, it's best to proceed and explain afterward.", true, false,
  "The three elements are capacity, information and voluntariness; with hesitation, it's best not to proceed.",
  "those are the three elements.", "if there is hesitation, it's best not to proceed.");
two("bg-2s-4", "behavior", "rec", "HOMAR is still commonly used in special needs dentistry.", "The McKesson bite block is the standard mouth prop at Sparks.", false, false,

mq("ds-1866", "down", "rec", "When was Down syndrome first recognized as a chromosomal anomaly?",
  [["1956","Almost 100 years after it was described."],

   ["1929","That year is the life-expectancy data point (9 years)."],
   ["2008","That's the estimate of 250,000 people in the U.S."]],
  "Dr. Langdon Down described and named the syndrome in 1865; the extra chromosome 21 was identified in 1956.");
mq("ds-nondis", "down", "rec", "What is nondisjunction?",
  [["A chromosome pair fails to split during meiosis, so one gamete gets an extra copy","In Down syndrome, the 21st pair doesn't split."],
   ["A chromosome breaks during meiosis and part of it is lost from the gamete","That's a deletion, as in Prader-Willi."],
   ["A gene's code repeats too many times","That's the fragile X mechanism."],
   ["A mutation that makes too much uric acid","That's Lesch-Nyhan."]],
  "Normally the pairs split so each gamete has 23. With nondisjunction the 21st pair doesn't split: one gamete lacks 21 (not viable) and one has 24; fertilized, it makes a 47-chromosome cell.");
mq("ds-mom", "down", "rec", "In nondisjunction Down syndrome, where does the extra chromosome come from most often?",
  [["The mother's egg, over 90% of the time","Less than 10% come from the father's sperm."],

   ["Equally from mother and father","Mostly maternal."],
   ["From a cell division after birth","That would be mosaicism, and it happens early in the embryo."]],
  "Over 90% of the time nondisjunction occurs in the maternal egg; less than 10% in paternal sperm.");
mq("ds-trans", "down", "rec", "A person with Down syndrome has 46 chromosomes, one of them unusually long. Which type is this?",
  [["Translocation","Extra 21 material attached to another chromosome, usually 14."],
   ["Trisomy 21","Trisomy 21 has 47 chromosomes."],
   ["Mosaicism","Mosaicism mixes cells with 46 and 47."],
   ["Fragile X","A different syndrome on the X chromosome."]],
  "Translocation (5%): part of an extra chromosome 21 attaches to another chromosome, usually the 14th, so the total stays at 46.");
mq("ds-mosaic", "down", "rec", "What makes mosaicism different from the other types of Down syndrome?",
  [["Nondisjunction happens early in the embryo, so some cells have 46 and some 47","Like the tiles of a mosaic."],
   ["The extra chromosome 21 attaches to chromosome 14, so the count stays at 46","That's translocation."],
   ["It always comes from the father","Not what defines it."],
   ["It is the most common type","It's the rarest, about 1%."]],
  "In mosaicism the egg and sperm are normal; nondisjunction happens in an early cell division of the embryo, giving a mix of 46- and 47-chromosome cells. About 1% of cases.");
mq("ds-pct", "down", "rec", "About what share of Down syndrome cases are trisomy 21?",

   ["50%","Far too low."],
   ["5%","That's translocation."],
   ["1%","That's mosaicism."]],
  "Trisomy 21 is 94% of cases, translocation 5%, mosaicism 1%.");
mq("ds-age", "down", "rec", "For a mother aged 40-44, about how many live births have Down syndrome?",

mq("ds-person", "down", "rec", "Which statement about behavior in Down syndrome matches the lecture?",

mq("ds-midface", "down", "rec", "What is the cardinal facial characteristic of Down syndrome?",

mq("ds-mouthbr", "down", "rec", "A boy with Down syndrome starts fighting the moment the air-water spray fills his mouth. What is the likely reason?",

mq("ds-epi", "down", "rec", "What is an epicanthal fold?",
  [["A fold of upper eyelid skin covering the inner corner of the eye","Gives the slanting, almond-shaped eye; present in about 78%."],

mq("ds-avcanal", "down", "rec", "Which heart defect is most common in Down syndrome?",

mq("ds-mvp", "down", "rec", "What did the EKG study show about mitral valve prolapse in Down syndrome?",

mq("ds-prophy", "down", "rec", "Which patient requires antibiotic prophylaxis under the guidelines in the lecture?",

mq("ds-aai", "down", "rec", "Why should you avoid hyperextending the neck of a patient with Down syndrome, especially during stabilization or intubation?",
