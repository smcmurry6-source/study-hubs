mq("au-cdc", "autism", "module", "How does the CDC define autism spectrum disorders?",
  [["Developmental disabilities that can cause significant social, communication and behavioral challenges","People with ASD handle information differently."],
   ["Psychiatric illnesses that come and go over a lifetime, like depression","That sounds like mental illness."],
   ["Intellectual disabilities in every case","Many have no intellectual disability."],
   ["Motor disorders of voluntary movement","That's CP."]],
  "CDC: a group of developmental disabilities that can cause significant social, communication and behavioral challenges; people with ASDs handle information in their brain differently.");
mq("au-prev", "autism", "module", "What did the CDC's 2020 numbers report for autism?",
  [["1 in 36 children (2.8%)","Almost double 2012's 1 in 68."],
   ["1 in 68","That was 2012."],
   ["1 in 88","The figure in the TED talk."],
   ["1 in 303","That's cerebral palsy."]],
  "CDC 2012: 1 in 68. CDC 2020: 1 in 36 (2.8%), almost doubling in 8 years, only partly explained by better diagnosis.");
mq("au-boys", "autism", "module", "How much more likely is autism in boys than girls?",

   ["Girls are more likely","Reversed."]],
  "Autism is four times more likely in boys than girls, for reasons not understood.");
mq("au-vacc", "autism", "module", "What does the TED talk say about vaccines and autism?",
  [["Vaccines do not cause autism; the original study was fraudulent and retracted","Its author lost his medical license."],

   ["The question is still open, and thimerosal is still under study as a cause","The IOM and CDC found no credible evidence."],
   ["Vaccines cause about 25% of cases","Not true."]],
  "Vaccines do not cause autism. The Lancet retracted the fraudulent study; the IOM and CDC found no credible evidence; removing thimerosal didn't change prevalence.");
mq("au-ident", "autism", "module", "What is the autism concordance rate in identical twins?",
  [["77%","Not 100%: genes don't account for everything."],
   ["100%","It isn't 100%."],
   ["31%","That's fraternal twins."],
   ["Under 10%","Too low."]],
  "Identical twins 77%, fraternal twins 31%, and ordinary siblings lower still. Genetics plays a larger role than in cancer, heart disease or diabetes.");
mq("au-frat", "autism", "module", "Why do fraternal twins have a higher concordance than ordinary siblings, though both share 50% of their genes?",
  [["Fraternal twins also share the same intrauterine environment","Suggesting shared exposures matter."],
   ["Fraternal twins share 100% of their genes, like identical twins","That's identical twins."],
   ["Siblings are usually different sexes","Not the explanation."],
   ["It's random chance","The talk pointed to the shared womb."]],
  "Fraternal twins and siblings both share 50% of their DNA, but twins also share the womb, suggesting common exposures.");
mq("au-single", "autism", "module", "In the Simons Foundation study of 2,600 families without a family history, about how many cases traced to a single powerful genetic factor?",
  [["About 25%","75% are still unexplained."],
   ["About 75%","That's the unexplained share."],
   ["About 5%","Too low."],
   ["All of them","No."]],
  "About 25% had one powerful genetic change, often a new (de novo) mutation not inherited from either parent; 200-400 genes can cause autism.");
mq("au-denovo", "autism", "module", "How can autism be genetic without running in the family?",
  [["A new mutation in the egg or sperm, not passed down through generations","De novo mutations."],
   ["Through vaccines","Vaccines don't cause autism."],
   ["It can't; genetic always means inherited from a parent who carries it","The talk said otherwise."],
   ["Through the father's age only","Paternal age is an association, not the mechanism."]],
  "Some genetic changes start brand new in the child, present at conception but not inherited.");
mq("au-assoc", "autism", "module", "Which is an association with autism named in the TED talk?",
  [["Valproic acid taken during pregnancy","An exposure while the fetal brain develops."],
   ["Thimerosal in vaccines","Removing it had no effect."],
   ["Advanced maternal age","He named advanced paternal age."],
   ["Fluoride in drinking water","Not mentioned."]],
  "Associations: advanced paternal age; exposures in pregnancy such as valproic acid and some infections.");
mq("au-eye", "autism", "module", "What did Ami Klin's eye-tracking studies show in infants who later developed autism?",
  [["They looked at the mouth, nose or elsewhere instead of the eyes","They miss social cues."],
   ["They made more eye contact than other infants, staring at the singer's eyes","The reverse."],
   ["They couldn't track moving objects","Not the finding."],
   ["Their eyes moved involuntarily","That's nystagmus."]],
  "Infants on the spectrum don't focus on the socially interactive parts of a scene (the eyes), so their brains fail to learn the usual social cues.");
mq("au-onset", "autism", "module", "When does ASD begin?",
  [["Before age 3","It lasts for life, though symptoms improve."],
   ["At puberty","Far too late."],
   ["Only at birth, never later","Some develop typically until 18-24 months, then regress."],
   ["After age 5","Too late."]],
  "ASD begins before age 3. Some show hints in the first months; some develop typically until 18-24 months and then stop gaining or lose skills.");
mq("au-signs", "autism", "module", "Which is an early sign of ASD listed in the module?",
  [["Not pointing at objects of interest by 14 months","Along with not responding to their name by 12 months."],
   ["Walking unusually early, by about 9 months of age","Not a sign."],
   ["Strong interest in faces","They tend to avoid eye contact."],
   ["Liking every change in routine","They get upset by minor changes."]],
  "Signs: no response to name by 12 months, no pointing by 14 months, no pretend play by 18 months, poor eye contact, echolalia, upset by minor changes, flapping or rocking, unusual sensory reactions, no sense of danger.");
mq("au-echo", "autism", "module", "What is echolalia?",
  [["Repeating words or phrases over and over","A common ASD feature."],
   ["Flapping the hands when excited or upset","That's a stim."],
   ["Painful sensitivity to sound","Sensory, not echolalia."],
   ["Avoiding eye contact","A separate feature."]],
  "Echolalia: repeating words or phrases over and over.");
mq("au-stim", "autism", "module", "A patient with autism is rocking and humming during a cleaning, and it isn't interfering. What does the module recommend?",
  [["Let it continue; you don't need to stop or change it","Only redirect if it disrupts the work."],

   ["Tell the patient to stop","Not needed if it's not disruptive."],
   ["End the appointment","No reason to."]],
  "Ask beforehand whether the patient stims, what it looks like and how to respond. Unless it disrupts dental work, don't feel obligated to stop it; if it does, redirect.");
mq("au-redirect", "autism", "module", "If stimming is disrupting the dental work, what should you do?",
  [["Redirect: show another item or give the hands something to do","Gentle redirection."],
   ["Restrain the hands with a papoose board until the stimming stops","Not the first step for stimming."],
   ["Ignore it and keep working","It's disrupting care."],
   ["Ask the parent to leave","Not related."]],
  "If stimming disrupts the work, redirect by showing another item or giving the patient something else to do with their hands.");
mq("au-melt", "autism", "module", "Which describes a meltdown rather than a tantrum?",
  [["The child doesn't care who is watching and doesn't consider their own safety","A struggle to cope, not a bid for attention."],
   ["The child looks around every so often to see whether anyone is reacting","That's a tantrum."],
   ["It stops as soon as the child gets what they want","That's a tantrum."],
   ["The child avoids getting hurt","That's a tantrum."]],
  "Meltdown: no concern for others' reactions or own safety, runs on its own power and tapers slowly, no one feels in control, and nothing satisfies until it's over.");
mq("au-meltprep", "autism", "module", "Before treating a patient with autism, what is the clinician responsible for finding out about meltdowns?",
  [["Whether they occur, what triggers them and what warning signs come first","So you can avoid or anticipate them."],

   ["Which medicine stops them","Not described."],
   ["Nothing; meltdowns can't be anticipated","You can learn triggers and signs."]],
  "Find out whether the patient has meltdowns, what triggers them and what signs the patient gives before one, and show compassion for the family.");
mq("au-sens", "autism", "module", "What is sensory defensiveness?",
  [["Defensive reactions to sensations the brain misprocesses as uncomfortable or painful","Often with autism, but not the same thing."],
   ["Another name for autism","They're not the same, though often together."],
   ["A tantrum the child uses on purpose to avoid having treatment","It's a protective response, not manipulation."],
   ["A medication side effect","Not described that way."]],
  "Sensory defensiveness may relate to sensory integration disorders: a tag feels like a cut, a noise hurts. The patient defends against it.");
mq("au-vest", "autism", "module", "Why might you have a child wear the x-ray vest for the entire appointment?",
  [["Its weight gives calming deep pressure","A sensory strategy."],
   ["For radiation safety throughout","Not the reason given."],
   ["To keep the child's hands still","It isn't a restraint."],
   ["To keep the shirt clean","Not the reason."]],
  "The x-ray vest provides extra weight and deep pressure. Also: sunglasses, warning before each step, headphones, firm touch, chewy food beforehand, a fidget toy, a heavy or tight hat.");
mq("au-touch", "autism", "module", "For a patient with sensory defensiveness, how should you touch them?",
  [["With firm touch","Light touch is more alarming."],
   ["With the lightest touch possible","Firm touch is recommended."],
   ["Only through a barrier","Not the recommendation."],
   ["Without warning, to get it over quickly","Warn before each thing you do."]],
  "Use firm touch whenever touching the child, and verbally warn before each thing you do.");
mq("au-fight", "autism", "module", "If a sensory-defensive child's fear isn't respected, what typically happens?",
  [["Flight, then more and more physical fight responses","They escalate to get away."],
   ["They calm down after a minute once they realize it won't hurt","Fear escalates."],
   ["They fall asleep","Not described."],

mq("au-dental", "autism", "module", "How does oral anatomy in autism compare with Down syndrome or CP?",
  [["No typical physical differences such as missing teeth or malocclusion","Their issues are behavioral and dietary."],

mq("au-caries", "autism", "module", "Why is caries more common in autism?",

mq("au-attr", "autism", "module", "Why is attrition more common in autism?",

mq("au-trauma", "autism", "module", "Which is a reason for the higher rate of dental trauma in autism?",

mq("au-perio", "autism", "module", "Why is periodontal treatment hard for many adults with autism?",
  [["Behavior, and Medicaid's limited or absent adult dental benefit","Periodontitis is slightly higher."],

mq("au-kit", "autism", "module", "What belongs in a practice kit for home?",

  "Practice kit items: prophy angle, saliva ejector, varnish brush, bib and holder, gloves and mask for the caregiver, a disposable XCP holder without the metal bar, cotton-tip applicator, disposable mirror, dry angles, and pictures of each in the mouth.");
mq("au-drybrush", "autism", "module", "When a caregiver practices brushing the patient's teeth lying down at home, why use a dry toothbrush?",

mq("au-first", "autism", "module", "Which appointment time is generally best for a patient with autism?",
  [["The first appointment of the morning","Minimal waiting, a quiet office, fresh staff."],

   ["Whenever the office is busiest, for distraction","Busy is worse."]],
  "Mornings are generally better; the first appointment of the day is ideal (even 10 minutes early): no waiting, quiet, sterilizers off, empty waiting room, smells settled. Trust parents who say afternoons are better.");
mq("au-op", "autism", "module", "How should the operatory be prepared for a patient with autism?",
  [["Overhead lights low, music off, sterilizers and ultrasonic off, sunglasses offered","Reduce sensory input."],

mq("au-ready", "autism", "module", "Why should everything you might need be out on the counter before a patient with autism arrives?",

mq("au-literal", "autism", "module", "Why say \"Open your mouth\" instead of \"Open like an alligator\" to a patient with autism?",

mq("au-once", "autism", "module", "Why give an instruction once and then wait, rather than repeating it in several ways?",

mq("au-tone", "autism", "module", "What tone of voice does the module recommend for instructions to a patient with autism?",

mq("au-no", "autism", "module", "Which instruction follows the module's advice?",

mq("au-chair", "autism", "module", "A patient with autism hates the feeling of the chair moving back. What does the module suggest?",

mq("pv-varnish", "prevention", "rec", "Why does Sparks use fluoride varnish instead of foam or gel in trays?",
  [["Patients can't tolerate a tray for 4 minutes, and varnish gags less","It's also stronger and stays on."],
   ["Varnish is cheaper, though it's weaker and must be reapplied weekly","It's stronger, not weaker."],
   ["Gels and foams are banned for special needs patients","Not banned; not tolerated."],
   ["Varnish needs no saliva to set","Saliva actually helps it congeal."]],
  "Foam or gel must sit in a tray for at least 4 minutes; few patients tolerate it, and brushing gel on lacks evidence. Varnish: fewer gag problems, stronger, quick to apply, and it stays on as a reservoir.");
mq("pv-eat", "prevention", "rec", "After fluoride varnish, when can the patient eat and drink?",
  [["Almost immediately","No waiting period, unlike gels and foams."],
   ["After 30 minutes","That's the usual advice for gels and foams."],
   ["After 24 hours","No."],
   ["Only the next morning","No."]],
  "A real advantage of varnish: no waiting period; patients can eat and drink almost immediately. For a very sensitive gag reflex, the excess can even be rinsed out.");
mq("pv-occl", "prevention", "rec", "For a non-cavitated occlusal lesion, what did the ADA's 2018 guideline find most effective?",
  [["A sealant over the lesion plus fluoride varnish every 3-6 months","67 of 100 arrested."],
   ["Fluoride varnish alone every year","Varnish alone arrested about 40-something of 100, at 3-6 months."],
   ["Restoring every occlusal lesion right away, before it can grow","The guideline is about not cutting."],
   ["Silver diamine fluoride once","Not the guideline's best option for this lesion."]],
  "Sealant plus fluoride varnish every 3-6 months prevented progression 67 of 100 times (strong evidence). Varnish alone was in the 40s.");
mq("pv-67", "prevention", "rec", "In the ADA guideline, sealant plus varnish arrested about how many non-cavitated occlusal lesions out of 100?",
  [["67","Almost two-thirds."],
   ["46","That's varnish on approximal lesions."],
   ["100","No treatment is perfect."],
   ["20","Too low."]],
  "Sealant plus varnish: 67 of 100 arrested. For a special needs patient, avoiding a bur two-thirds of the time is a big win.");
mq("pv-prox", "prevention", "rec", "What does 5% fluoride varnish every 3-6 months do for non-cavitated approximal lesions?",
  [["Doubles the chance of reversing or stopping them: 46 of 100","Simple and cost-effective."],
   ["Arrests all of them","Not all."],
   ["Has no effect between the teeth","It's effective."],
   ["It works only when a sealant is placed over the contact as well","Sealants are for occlusal lesions."]],
  "Interproximal lesions on bitewings: varnish every 3-6 months gives a twofold chance of arrest or reversal, 46 of 100.");
mq("pv-root", "prevention", "rec", "What did the ADA guideline recommend for root caries?",
  [["Prevident 5000 used at home","High-fluoride toothpaste."],
   ["Sealants","For occlusal lesions."],
   ["Silver diamine fluoride only","Not the ADA recommendation he showed."],
   ["Nothing: root caries can't be arrested","It can be slowed."]],
  "For root caries, the ADA recommended Prevident 5000 for daily home care.");
mq("pv-sdf", "prevention", "rec", "Which material arrests small lesions but turns them black, and is used a lot at Sparks when restoring would be hard?",
  [["Silver diamine fluoride","Arrests; stains black."],
   ["Resin-modified glass ionomer","Restores and releases fluoride, without staining black."],
   ["Stainless steel crown","For larger lesions."],
   ["Fluoride varnish","Varnish doesn't turn lesions black."]],
  "When cavitation occurs: SDF for small lesions or difficult behavior, RMGI (Fuji II LC, Fuji IX, Ketac Nano) for small-moderate cavities, stainless steel crowns for large ones.");
mq("pv-rmgi", "prevention", "rec", "Why are resin-modified glass ionomers good restorations for this population?",
  [["They release fluoride, protecting the surrounding tooth","They also go in easily."],
   ["They are the strongest material for large lesions","Steel crowns are for large lesions."],
   ["They need perfect isolation","They tolerate moisture better than resin."],
   ["They turn lesions black","That's SDF."]],
  "RMGIs fill the hole and release fluoride to strengthen the surrounding tooth.");
mq("pv-ssc", "prevention", "rec", "Which statement about stainless steel crowns matches the lecture?",
  [["Sparks uses them on permanent teeth too, for lesions too big for RMGI","They cover and protect the whole tooth."],
   ["They are used only on primary teeth, never on permanent teeth","He said permanent teeth too."],
   ["They are for small occlusal lesions","For large lesions."],
   ["They release fluoride","That's RMGI."]],
  "If a lesion is too large for RMGI, stainless steel crowns are an excellent option, including on permanent teeth.");
mq("pv-hidden", "prevention", "rec", "A patient's gingiva is swollen, but you see no calculus. What should you expect?",
  [["A ring of calculus just below the gingival margin","Explore under the tissue."],
   ["No calculus, since none is visible","That's how it gets missed."],
   ["Only soft plaque, which the patient can brush away at home","Plaque is there too, but swollen tissue almost always hides calculus."],
   ["A drug reaction","Not the likely cause."]],
  "Swollen tissue almost always means calculus under the margin, often a ring just below the tissue. At Sparks, a patient charted \"no calculus\" had extensive subgingival calculus and mobile lower incisors.");
mq("pv-sickle", "prevention", "rec", "Which instrument does Dr. Mitchell use for supragingival calculus?",
  [["A sickle scaler","Its point reaches interproximally."],
   ["A curette","For subgingival calculus."],
   ["A periodontal probe","Not for removal."],
   ["A rubber cup","For plaque and stain."]],
  "Supragingival: sickle scaler (point interproximally, lift). Subgingival: curette (rounded toe, slid below the margin).");
mq("pv-curette", "prevention", "rec", "How does he remove subgingival calculus with a curette?",
  [["Slide the toe below the margin, feel for calculus, engage it and lift with smooth strokes","Explore first, then engage."],
   ["Use the pointed tip of the curette above the gumline to lift the deposits","That's sickle work."],
   ["Scrub side to side","Use long, smooth strokes."],
   ["Press the cup against the sulcus","That's a prophy cup."]],
  "Slide the curette below the tissue, feel for rough or raised areas, engage with the toe and lift against the tooth.");
mq("pv-lip", "prevention", "rec", "Calculus builds on the facial of a patient's lower incisors. What causes it, and what do you teach?",
  [["A tight lower lip blocks the brush; teach caregivers to pull the lip down","Reach the gingival margin."],
   ["Tongue thrust; teach a tongue exercise","Not the cause given."],
   ["G-tube feeding; leave it alone","That's occlusal calculus in g-tube patients."],
   ["Saliva from the submandibular gland; nothing can be done to prevent it","Usually lingual; facial calculus here is from the lip."]],
  "Many patients tighten the lower lip while brushing; teach caregivers to pull it down, or place a finger where the lip meets the buccal mucosa and roll it out.");
mq("pv-cup", "prevention", "rec", "Which describes good rubber cup prophy technique?",
  [["Reach the gingival margin, follow the contour, roll into the interproximal and let the spin work","Moderate to high speed."],
   ["Stay on the occlusal third, well away from the gums, to avoid bleeding","The cup must touch the tissue."],
   ["Brush back and forth like a toothbrush","Let the spin do the work."],
   ["Hold the cup in one spot for a long time","Not for long periods."]],
  "Focus at the gingival margin: the cup must touch the tissue (not for long), follow the contour, let the spin do the work, and roll into interproximal areas.");
mq("pv-pulse", "prevention", "rec", "How do you use the rubber cup on a patient with a sensitive gag reflex?",
  [["In pulses of 1-2 seconds, then off","Remove the stimulus before the gag fires."],
   ["Continuously, to finish quickly","Continuous contact triggers the gag."],
   ["Only on the anterior teeth","Pulse instead, including posteriors."],
   ["With extra paste","More paste adds stimulus."]],
  "Work in pulses: 1-2 seconds on the tooth, then off. Most valuable on the lingual of the lower molars, near the tongue.");
mq("pv-gtube", "prevention", "rec", "Where should calculus be left on a patient fed by gastrostomy tube?",
  [["On the occlusal surfaces","A natural sealant."],
   ["On the buccal surfaces","Remove buccal and lingual."],
   ["On the lingual surfaces","Remove buccal and lingual."],
   ["Nowhere; remove it all","Leave the occlusal calculus."]],
  "G-tube patients often have very heavy calculus and hypersensitive gag reflexes; remove it from buccal and lingual surfaces but leave it on the occlusal.");
mq("pv-recall", "prevention", "rec", "Which recall plan fits what Dr. Mitchell described?",
  [["Some patients every 3-4 months, even monthly, with families aware insurance may not pay","Six months isn't always best."],
   ["Everyone every 6 months, since insurance requires that interval","Not always best."],
   ["Once a year to save money","Too infrequent."],
   ["Only when the patient complains","Many can't communicate pain."]],
  "Six months is common, but many patients need 3- or 4-month recall, or even monthly. Payers often cover only two a year; keep cost down by charging only for the cleaning.");
mq("pv-surround", "prevention", "rec", "What is the Surround toothbrush best for?",
  [["Patients who tolerate only a short brushing: it cleans three surfaces at once","Faster, though less efficient than a regular brush."],
   ["Everyone, because it brushes more thoroughly than a regular brush","It's not as efficient."],
   ["Patients who can't open at all","It still needs access."],
   ["Applying fluoride varnish","Not its use."]],
  "The Surround brush has three heads that clean both sides and the occlusal at once. If a regular brush can be used, use it.");
mq("pv-handle", "prevention", "rec", "A patient can brush cognitively but can't grip or bend the arm well. Which is a fitting aid?",
  [["A handle enlarged with a tennis ball or foam, or lengthened with a tongue blade","Self-modifications for physical limits."],
   ["The Surround toothbrush, used by a caregiver who brushes for them","For quick caregiver brushing."],
   ["A Waterpik","Not shown to help."],
   ["Disclosing tablets","Messy, not helpful here."]],
  "Modified handles help patients who can brush but are physically challenged; the Surround brush helps when someone else must brush quickly.");
mq("pv-floss", "prevention", "rec", "Why does Dr. Mitchell like a flosser with the floss at 90 degrees to the handle?",

mq("pv-sonic", "prevention", "rec", "What did he say about electric toothbrushes?",
  [["Sonic-type brushes can be better, and the vibration comforts some sensory patients","Not one size fits all; experiment."],
   ["They should never be used in special needs patients","He recommends them for many."],

   ["Vibration always upsets autistic patients","Some find it comforting."]],
  "Electric brushes, especially Sonicare-type with small heads, can be better choices; the vibration comforts some sensory patients. Round spin-brush heads can be too big.");
mq("pv-stand", "prevention", "rec", "Which home brushing position has the lowest gag risk?",

mq("pv-recliner", "prevention", "rec", "Why recommend brushing in a recliner at home?",

mq("pv-age8", "prevention", "rec", "Before what age should take-home fluoride rinses or gels not be prescribed?",

  "Don't prescribe supplemental home fluoride under about 8: swallowed fluoride can cause fluorosis in developing teeth.");
mq("pv-contact", "prevention", "rec", "A patient tolerates only 5-10 seconds of anything in the mouth. Why won't a product needing 30-60 seconds of contact help?",
  [["It needs that contact time to work","Consider contact time for efficacy."],

mq("pv-gelkam", "prevention", "rec", "How does GelKam differ from Prevident 5000?",

mq("pv-mi", "prevention", "rec", "Why recommend MI Paste Plus rather than plain MI Paste?",

mq("pv-toothette", "prevention", "rec", "A patient can't rinse and spit. How can a fluoride rinse still be used?",
  [["Soak a Toothette and apply it repeatedly for 30-60 seconds","Coach families on the time."],

mq("pv-asp", "prevention", "rec", "Using the FDA's acceptable daily intake for aspartame, about how much Coke Zero would a 150-lb adult need to reach the limit?",

   Each lecture opens with a short "what's tested" list. Narration (audio/<id>-full.mp3, -plain.mp3) is generated from

var READINGS = {"intro": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The definition of intellectual disability and its three DSM-5 parts, including onset in the developmental period</li><li>How the terms changed: feeble-minded, mental retardation, Rosa's Law (2010), DSM-5 (2013)</li><li>Person-first language: a diagnosis, not a description</li><li>Institutions, deinstitutionalization, group homes and day programs</li><li>Prevalence of disability, Alabama's numbers, and why the counts are rising</li><li>Access to care: Medicaid until 21, the Surgeon General's reports, CODA 2019 and the ADA Code of Ethics 2018</li><li>Etiology, including genetic causes and adverse childhood experiences (ACEs)</li><li>General characteristics and how to help people with ID learn</li></ul></div>\n<p>Dr. Stephen Mitchell directs the Sparks Dental Clinic at UAB, where you will rotate over the next couple of years. This first lecture asks why dental school needs a class on special needs dentistry at all: what the population looks like, how the words for it have changed, how its care has changed, how common it is, where it comes from, and what its members share.</p>\n<h4>Who counts as special needs</h4>\n<p>Special needs can look very different. An autistic boy may look like any other child until a sound upsets him and he covers his ears. A person with Down syndrome usually has facial features you recognize at once. A person with cerebral palsy may use a wheelchair, and CP ranges from only the legs being affected to someone who cannot walk. And a large share of the special needs patients you will see have <b>no defined diagnosis or syndrome</b> at all.</p>\n<p>Special needs is a broad group: medically compromised patients, people who have been injured, people with mental illness, and a very large number of elderly patients. Most of this course is about one subset: people with <b>intellectual disability (ID)</b>, also called <b>intellectual and developmental disability (IDD)</b>. The current terms stress that this is a disability and a medical diagnosis, not a type of person.</p>\n<h4>The definition</h4>\n<p>Intellectual disability is a set of <b>deficits in intellectual and adaptive functioning that begin during the developmental period</b>. Intellectual means the way the mind processes information is different and makes intellectual tasks hard. <b>Adaptive</b> functioning is the ability to adapt to a setting and to new sensory input.</p>\n<p>The <b>DSM-5</b> (the American Psychiatric Association's Diagnostic and Statistical Manual, fifth edition) breaks the diagnosis into three parts, and all three must be present:</p>\n<ul><li>Deficits in intellectual functioning</li><li>Deficits in adaptive functioning</li><li><b>Onset during the developmental period</b> (childhood)</li></ul>\n<p>So a person who develops normally and then has a brain injury as a young adult is special needs, and may have lost intellectual and adaptive function, but does not technically have ID, because it did not start in childhood. Dr. Mitchell's example: a patient his own age who was shot in the head in his senior year of high school. He lost his short-term memory and his ability to adapt to the dental setting, but his diagnosis is a traumatic injury, not ID.</p>\n<h4>Beyond the IQ test</h4>\n<p>Older testing relied on an <b>IQ test</b>: a score <b>under 70</b> qualified a person as intellectually disabled. Today's assessment is <b>comprehensive</b>: clinical assessment over a long time by several specialists (at the Civitan-Sparks Center, often half a day or a whole day), not one test. The DSM-5 adds adaptive functioning, which matters most in <b>autism</b>: some autistic people are very bright but cannot adapt to odd sounds, tastes or smells. Modern testing also weighs <b>cultural and linguistic factors</b>: a person who cannot speak well may, given a new communication tool, turn out to understand far more than anyone thought.</p>\n<h4>How the words changed</h4>\n<p>The medical community introduces a term; the culture picks it up and uses it as an insult; the term becomes a stigma and is retired; a new one takes its place. In the early 1900s the category was <b>feeble-minded</b>, divided by mental age into <b>moron</b> (7-12 years), <b>imbecile</b> (2-7) and <b>idiot</b> (under 2). Those were textbook medical terms. Then came <b>mental retardation</b>, graded mild, moderate, severe and profound by IQ. In <b>2010</b>, <b>Rosa's Law</b> removed \"mental retardation\" from U.S. federal documents in favor of intellectual disability, and in <b>2013 the DSM-5</b> made the same change.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Era</th><th>Term</th><th>Notes</th></tr></thead><tbody>\n<tr><td>Early 1900s</td><td>Feeble-minded: moron (mental age 7-12), imbecile (2-7), idiot (under 2)</td><td>Medical terms at the time; culture turned them into insults</td></tr>\n<tr><td>Mid 1900s to 2010</td><td>Mental retardation: mild, moderate, severe, profound, by IQ (under 70)</td><td>Became a playground insult</td></tr>\n<tr><td>2010</td><td>Rosa's Law</td><td>Removed \"mental retardation\" from U.S. federal documents</td></tr>\n<tr><td>2013</td><td>DSM-5</td><td>Made the same change: intellectual disability</td></tr>\n<tr><td>Today</td><td>Intellectual disability (ID) or intellectual and developmental disability (IDD)</td><td>A diagnosis, not a description: person first</td></tr>\n</tbody></table></div>\n<p>Mental age is still useful, just not as a label. Dr. Mitchell's Sparks medical history asks what age the patient seems to understand at, because \"acts about like a 10-year-old\" and \"understands like an 8-month-old\" call for very different communication.</p>\n<h4>Person first</h4>\n<p><b>Intellectual disability is a diagnostic condition, not a description.</b> Put the person ahead of the disorder: \"a patient who has Down syndrome,\" not \"a Down syndrome patient.\" Many people with ID, and their families, do not want to be defined by the disability. In Dr. Mitchell's experience, the more respectfully you speak to these patients, often at a higher level than they are used to, the more they relax and do their best for you.</p>\n<p>Other special needs groups you will treat: medically compromised patients (cancer treatment, diabetes), patients disabled by injury (a man at Sparks paralyzed from the neck down in a car accident 25-30 years ago), and patients with mental illness (from PTSD and anxiety attacks to depression).</p>\n<h4>Where care happened: institutions</h4>\n<p>Before the 1950s most people with moderate and profound ID lived in large <b>institutions</b>, and doctors urged families to send them there. Bryce Hospital in Tuscaloosa was the largest in Alabama. At first institutions may have offered round-the-clock therapy, but funding and staff were cut while the number of residents grew, and they became places where people were locked out of sight and mistreated. In the 1970s, <b>Geraldo Rivera</b>'s undercover report from <b>Willowbrook</b> in New York exposed the conditions and helped change how the nation treated people with ID. (The documentary <i>Unforgotten: 25 Years After Willowbrook</i> is optional.)</p>\n<h4>Deinstitutionalization and community care</h4>\n<p>The 1970s brought a big push for <b>deinstitutionalization</b>: caring for people with ID in the community where they live. It is still the main model today. By <b>1978</b> national laws required <b>public schools</b> to provide special education. During COVID, children with special needs lost the therapy they get at school, which is why families pushed to reopen schools.</p>\n<p>Adults go to <b>day programs</b> during regular school hours: socialization and therapy, then home. Local examples are <b>United Ability</b> (formerly United Cerebral Palsy), the <b>Exceptional Foundation</b> in Homewood, and the <b>Arc of Central Alabama</b>.</p>\n<p><b>Most</b> people with ID live at home with family. Many adults live in <b>group homes</b>: a house with about <b>6-8 clients</b> at similar levels and a caregiver, who help with brushing, bathing, dressing, laundry and getting to appointments (Arc PHP, the Learning Tree). The model is good in principle but underfunded, the work is hard and poorly paid, and staff burn out. <b>Institutional living</b> still exists for only <b>1-2%</b>, the most profoundly affected or those at risk of harming themselves or others; <b>Glenwood</b> is the Birmingham example.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Setting</th><th>Who</th><th>Examples from the lecture</th></tr></thead><tbody>\n<tr><td>Home with family</td><td>Most people with ID</td><td>Many go to a day program during the day</td></tr>\n<tr><td>Day programs</td><td>Adults who live at home or in a group home</td><td>United Ability (formerly United Cerebral Palsy), the Exceptional Foundation, the Arc of Central Alabama</td></tr>\n<tr><td>Group homes</td><td>About 6-8 clients at a similar level, with caregivers</td><td>Arc PHP, the Learning Tree; they bring clients to appointments</td></tr>\n<tr><td>Institutions</td><td>Only 1-2%, the most profoundly affected</td><td>Glenwood (Birmingham)</td></tr>\n</tbody></table></div>\n<h4>How common is it?</h4>\n<p>By the U.S. government's broad definition, <b>1 in 5 adults</b> (over 53 million) has some disability, from about 1 in 6 in Minnesota to <b>1 in 3 in Alabama, which leads the nation</b>. The most common is <b>mobility</b>, much of it from aging. General disability is a little more common in <b>females</b>, and highest in African Americans, then Hispanics, then whites. A definition that broad makes Alabama hesitant to fund disability services.</p>\n<p><b>Severe disability</b> is closer to the population Sparks treats: <b>12.6%</b> nationally (2015), and <b>16.7%</b> in Alabama, about 800,000 people, projected to reach 814,000 by 2030. Mississippi is 16.2%, Arkansas 17.1% and Kentucky 17%; <b>West Virginia leads the country at 19.4%</b>. For severe disability, males and females are the same (12.5 vs 12.7%), whites and African Americans are the same, Native Americans are highest, and Hispanics are low.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th></th><th>Any disability</th><th>Severe disability</th></tr></thead><tbody>\n<tr><td>U.S.</td><td>1 in 5 adults (over 53 million)</td><td>12.6% (about 39 million, 2015)</td></tr>\n<tr><td>Alabama</td><td>1 in 3 adults: leads the nation</td><td>16.7% (about 800,000; 814,000 projected by 2030)</td></tr>\n<tr><td>Most common type</td><td>Mobility (much of it the elderly)</td><td></td></tr>\n<tr><td>Sex</td><td>Females a little higher</td><td>Male and female the same (12.5 vs 12.7%)</td></tr>\n<tr><td>Race</td><td>African Americans, then Hispanics, then whites</td><td>Whites and African Americans the same; Native Americans highest; Hispanics low</td></tr>\n<tr><td>Highest state</td><td></td><td>West Virginia 19.4%; Arkansas 17.1%, Kentucky 17%</td></tr>\n</tbody></table></div>\n<p>The <b>National Health Interview Survey</b> found developmental disabilities in children rose <b>9.5%</b> from 2009-2017 over the previous period and <b>38%</b> since 1997; about <b>1 in 6 children (18%)</b> now has one. Part of the rise is good news: less stigma (families no longer hide a child), better diagnosis, and wider categories. Autism and ADHD have risen sharply, largely from diagnosis (many older Sparks patients carry an ID or even \"mental retardation\" diagnosis who would be on the autism spectrum today). But some definable disabilities, <b>cerebral palsy, hearing loss and seizure disorders, have declined</b>.</p>\n<h4>Unmet dental need</h4>\n<p>The <b>U.S. Surgeon General</b> reported in <b>2000</b> that people with disabilities have a significant access-to-care problem, in <b>2002</b> that oral health care for them showed a large disparity and a lack of providers, and in <b>2005</b> tied the problem to training: dental and medical schools were not teaching enough, so graduates felt unequipped. Offices simply turned families away. About <b>29%</b> of people with disabilities could not get dental care because of cost, and those with Medicaid often could not find a dentist who took it.</p>\n<p><b>Alabama Medicaid</b> covers most people with ID <b>until their 21st birthday</b>, and covers them well, including care in the operating room at Children's. Blue Cross Blue Shield and ALL Kids also allow OR access; most other dental plans make it nearly impossible. After 21, people with severe ID usually keep Medicaid <b>medical</b> coverage, but the <b>dental benefit ends at 21</b>. The Affordable Care Act may keep someone on a parent's private insurance to about 26; after that most have no dental insurance and pay out of pocket, often from a Social Security check. Some higher-functioning patients work (bagging groceries, United Ability's document-shredding workshop), but not enough to pay for major care.</p>\n<h4>Etiology</h4>\n<p>In <b>30-40%</b> of cases no cause can be found (Dr. Mitchell thinks more). The more profound the disability, the more likely a cause is found. Causes are biological, psychosocial, or both.</p>\n<ul><li><b>Genetic</b>: by 2013, 280 genes were linked to ID (the number itself doesn't matter: more are found all the time), and some studies put up to 55% of cases as genetic. Two kinds: <b>chromosomal aberrations</b> (Down syndrome, three copies of chromosome 21) and <b>single-gene</b> errors (fragile X). Errors on the <b>sex chromosomes</b> show more often, because there is no second healthy copy to mask them.</li><li><b>Physical, prenatal</b>: maternal malnutrition, acute or chronic infection, and <b>fetal alcohol syndrome</b>, about <b>2%</b> of ID.</li><li><b>Physical, neonatal</b>: prematurity, a hypoxic event at birth, birth injury (some cerebral palsy).</li><li><b>Physical, postnatal</b>: injury, tumors, infections, toxins.</li><li><b>Environmental and psychosocial</b>: lack of stimulation early in life.</li></ul>\n<h4>Adverse childhood experiences (ACEs)</h4>\n<p>Children who face many negative experiences while the brain develops wire it differently. <b>Toxic stress</b> releases too much <b>cortisol and adrenaline</b>, overstimulating some brain areas and understimulating others, and the effect is <b>dose-related</b>: the more ACEs, the bigger the measurable impact, from risky behavior and disease to early death. People with many ACEs are about <b>15 times more likely to attempt suicide</b>, and more likely to smoke, drink, miss work, and have job and money problems. With four or more ACEs, about 1 in 4 has serious financial trouble, against 1 in 10 with none; so most still do not, but they are more susceptible.</p>\n<p>The biology: hormones change cells, <b>cells die in the hippocampus</b> (memories are stored and recalled less accurately), circuits change, and the stress state stays raised, which drives <b>fear-based responses</b>. The child finds it harder to tell safe from dangerous and reads more situations as threats. That is a patient who is on edge in your chair.</p>\n<h4>General characteristics</h4>\n<p>No physical feature covers everyone with special needs, though syndromes have their own features. You may see more unsteady gait and poor coordination, scoliosis, orofacial differences and flaccid muscles. Most of Dr. Mitchell's patients with ID have some <b>speech problem</b>; many show <b>repetitive actions</b>, <b>hypersensitivity to stimuli</b> (sounds, tastes, a sensitive <b>gag reflex</b>) and <b>emotional swings</b>, with the coping skills of a child.</p>\n<p>Behavior is what scares providers most, but a large share of these patients behave wonderfully, and many are turned away for what might happen rather than what does. Intellect varies widely too: some autistic people are above average, some people with ID work at Publix, and some with Down syndrome or autism act on television.</p>\n<h4>How people with ID learn best</h4>\n<ul><li>They often <b>process sounds more slowly</b>: explain clearly, in short terms</li><li><b>Short-term memory</b> is often weak: repeat often</li><li>Use <b>concrete, specific language</b>; abstract cues may not be understood</li><li>Avoid <b>overstimulation</b> (too much noise, taste or water): keep things quiet</li><li><b>Routine</b> is very important to their emotional stability</li></ul>\n<h4>Why it's your job</h4>\n<p>This population is the minority group facing the greatest challenge in getting dental care, and real discrimination. Before 2019, <b>CODA</b> Standard 2 required graduates to be competent in <b>assessing</b> the treatment needs of patients with special needs; in <b>2019</b> it became <b>\"assessing and managing\"</b>. In <b>2018</b> the <b>ADA Code of Ethics</b> added <b>disability</b> to the reasons (with race and national origin) it is unethical to refuse a patient.</p>\n<p>That does not mean every dentist must treat every patient with a disability. It means you cannot just say \"we can't help you\" and hang up. If the care is beyond your skill, you are ethically responsible for <b>connecting the family with a dentist who can treat them</b>: refer. With so few places that will, the hope is that some of you will decide you can see a few of these patients yourselves.</p>\n", "behavior": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Definitions: maladaptive behavior, non-contingent escape, protective stabilization, implied and express consent</li><li>The two limits on care: ability to benefit and ability to tolerate</li><li>Communication tools: social age, starting high, visual cues, positive reinforcement, clear and limited goals</li><li>Environmental tools: positioning, water in short bursts, lights, music, fewer people, routine</li><li>Active vs passive stabilization, with examples; why it's used and when it never should be</li><li>Characteristics of ideal stabilization; Molt prop placement; the papoose board</li><li>Informed consent: three elements, documentation, and the ethics (competence, beneficence, advocacy)</li></ul></div>\n<p>Concern about behavior is one of the main reasons dentists hesitate to treat people with intellectual and developmental disabilities. Dr. Mitchell's second lecture covers general behavior tools you can use in any practice, then more advanced techniques (cumbersome and legally riskier) that you will see at Sparks but may not use in your own office. The readings are from the Special Care Advocates in Dentistry website: <b>Module 2</b> (behavioral supports and special communication, up to sedation, which is beyond this course) and <b>Module 6</b> (managing maladaptive behaviors, restraints and positioning devices).</p>\n<h4>Maladaptive behavior</h4>\n<p><b>Maladaptive behavior</b> is the academic term for a patient who <b>cannot adapt to the treatment conditions</b> in a dental office (\"throwing a fit,\" \"cutting up\"). Helping a patient adapt often improves behavior. It applies to only a <b>subset</b> of the IDD population: many adapt very well. The trouble is that it is <b>unpredictable</b>.</p>\n<h4>Quality care, limited only by two things</h4>\n<p>Patients with IDD deserve quality care limited only by:</p>\n<ul><li><b>Their ability to benefit from the treatment.</b> Does a profoundly disabled patient benefit from esthetic anterior crowns over stained but healthy enamel? Does a CP patient with a severe gag reflex benefit from a denture or partial they can't wear?</li><li><b>Their ability to tolerate the treatment.</b> A patient might benefit from tooth-colored restorations (or an implant) but cannot keep the gingiva healthy around them. A tooth might be savable with a large restoration or cast crown, but maladaptive behavior makes that dangerous, and the tooth must come out.</li></ul>\n<p>The behavioral supports come in three groups: <b>communication</b>, <b>environment</b> and <b>protective stabilization</b>.</p>\n<h4>Communication: the most used, least invasive tool</h4>\n<p>Mental processing is slower in patients with IDD and short-term memory may be weak, so:</p>\n<ul><li>Allow more time for pre-op, operative and post-op instructions</li><li>Keep instructions <b>short and clear</b>; avoid abstract terms and speak concretely</li><li><b>Verbal reinforcement</b>: repeat instructions often</li><li>Reinforce home care at every visit</li><li>Even a patient who understands no words understands <b>tone and emotion</b>: anxiety, anger or irritation ramps a situation up; calm and compassion bring a response in kind</li><li>Include the <b>caregivers</b></li></ul>\n<p>Speak at the patient's <b>social age</b>: the level of skill the patient has acquired. A useful medical history question: <i>at what level does the patient understand?</i> Normal for age, no understanding, or limited understanding \"like a ___-year-old.\" Also ask what the patient can do alone.</p>\n<p>Dr. Mitchell asked for special attention to this: <b>always start a conversation at a normal level, then back down</b> to the social level you find. Many patients understand far more than we give them credit for, and talking down to them is offensive and shuts them down. If you must err, talk too high and back down.</p>\n<p><b>Visual cues</b>: say \"I need you to open your mouth,\" then pull your mask down and open yours. Let the patient see and touch the prophy angle.</p>\n<p><b>Positive reinforcement</b>: behavior is shaped better by rewarding the positive than by correcting the negative (\"more flies with honey\"). In patients with IDD, emotion and feelings often drive behavior, so keep feelings positive: praise desired behavior heavily; correct negative behavior briefly (\"no, we can't do that\"), then praise as soon as they follow.</p>\n<p><b>Clear and limited goals</b>: tell the patient what you are going to do, what they need to do, and how long it will take. \"I'm going to lay the chair down like a bed. I need you to lay back against the chair. It will take until the count of 10 to stop.\"</p>\n<h4>Non-contingent escape</h4>\n<p>In <b>non-contingent escape</b>, the doctor sets a specific, small treatment goal and <b>does not stop until it is reached</b>, even if behavior worsens. Stopping because of the behavior would be <b>contingent escape</b>: the patient learns that acting out ends treatment. Two ways to set the goal:</p>\n<ul><li><b>A time</b>: \"We are going to wash your tooth for five seconds,\" then count down. Simple repeated direction, a visual cue with the hand, counting, and setting the expectation for next time.</li><li><b>A number of teeth</b>: \"We are going to clean three teeth,\" counting teeth as you go. The patient resists at two, and you finish the third before the break.</li></ul>\n<p>Keep the intervals <b>consistent</b> so the patient settles into a rhythm; as they relax, you may lengthen them.</p>\n<h4>The environment</h4>\n<ul><li><b>Positioning</b>: some patients won't lie back; seat them at about <b>45 degrees</b>. Some won't sit in the dental chair at all; Sparks has done cleanings in the caregivers' chairs.</li><li><b>Gag reflex</b>: a continuous air-water spray floods a patient who can't swallow well, and they fight because they can't breathe. Spray in <b>short bursts</b>, in and out.</li><li><b>Music</b>: some patients love a particular artist.</li><li><b>Light</b>: a light-sensitive patient opened right up once the overhead lights were off and only the unit light was used.</li><li><b>Hyperdistractibility</b>: fewer people in the operatory, or an isolated operatory.</li><li><b>Routine</b>: the same operatory and the same staff each time.</li></ul>\n<h4>Physical restraint and protective stabilization</h4>\n<p>The <b>Centers for Medicare and Medicaid Services</b> define a physical restraint broadly: (A) any manual method, physical or mechanical device, material or equipment that immobilizes or reduces a patient's ability to move arms, legs, body or head freely; (B) a drug used to restrict behavior or movement that is not standard treatment or dosage for the patient's condition (sedation: beyond this course).</p>\n<p>The <b>AAPD</b> term, and the one Dr. Mitchell uses, is <b>protective stabilization</b>: \"the physical limitation of a patient's movement <b>by a person or restrictive equipment</b>, materials or devices <b>for a finite period of time</b> in order to safely provide examination, diagnosis and/or treatment.\" A person holding a patient still <i>is</i> protective stabilization.</p>\n<ul><li><b>Active</b> stabilization: a <b>person</b> holds the patient still (Module 6 calls it \"physical restraint\").</li><li><b>Passive</b> stabilization: a <b>device</b> holds the patient still (Module 6: \"mechanical restraint\").</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th></th><th>Active</th><th>Passive</th></tr></thead><tbody>\n<tr><td>What holds the patient</td><td>A person</td><td>A device</td></tr>\n<tr><td>Module 6 calls it</td><td>Physical restraint</td><td>Mechanical restraint</td></tr>\n<tr><td>Examples</td><td>Head holds, hand guarding, therapeutic holds of arms and legs</td><td>Mouth props (Molt, Open-Wide), papoose board / Rainbow Wrap</td></tr>\n<tr><td>Needs informed consent?</td><td>Yes</td><td>Yes</td></tr>\n</tbody></table></div>\n<p><b>Why use it?</b> It allows treatment, provides <b>safety for the patient and staff</b>, and makes care more efficient. Think of an infant car seat: it restrains, the infant may fuss, and not using one would be negligent. Stabilization is predominantly about safety.</p>\n<p><b>Never use it as</b> punishment (\"if you don't straighten up, you're going in the papoose\"), a substitute for guiding behavior, or a convenience for the practitioner (clinics that put every child in a papoose board to move faster caused real problems for the profession).</p>\n<p><b>Good protective stabilization</b> has the <b>lowest potential to cause injury</b>, is the <b>least restrictive alternative</b> (if only the head needs holding, hold only the head), and is used <b>only with informed consent</b>. Its use should be short, limit movement, prevent injury, let staff finish the needed treatment, and (hopefully) be tolerated. Some patients with IDD actually calm down in it.</p>\n<p>Module 6 puts it strongly: where indicated, for physically resistive patients, restraints should be used without reservation, and treating a very resistive patient without them may even be considered <b>negligence</b>. Dr. Mitchell learned it the hard way when a patient hit one of his staff.</p>\n<h4>Active stabilization techniques</h4>\n<ul><li><b>Head hold to the operator's side</b>: cradle the head between the dentist's \"mirror arm\" and chest, like a football. You can move with the patient and anticipate movement.</li><li><b>Staff cradle the head with hands</b> (more resistant patients): a staff member kneels or sits at the head of the chair, fingers spread, resting on the <b>temporal and occipital bones</b>, spreading force over the whole hand so no spot bruises. Relax as the patient relaxes, but stay ready.</li><li><b>Module 6's method</b> uses the forearms on the head (fewer finger marks). Dr. Mitchell finds it uncomfortable for the shoulders and unstable: it doesn't stop the patient lifting the head.</li><li><b>Hand guarding</b>: hands laid gently over the patient's hands. It reminds them where their hands go and guards against sudden movement; more a passive touch than a restraint, though it can become one.</li><li><b>Therapeutic holds</b> prevent violent behavior. Arms (scratching, hitting): hold securely at the wrists, cross the arms at hip or waist level, hold the hands to the sides. Legs (kicking, pushing): a strap across the knees so they can't buckle, and cross and hold the ankles. Dr. Mitchell's own technique: cup under the ankles with open hands and <b>lift the legs off the chair</b> (higher if the patient arches), so they can't dig in their heels; the legs may move, but the head stays still.</li></ul>\n<p>With any hold, <b>check circulation</b>, and ease off as the patient relaxes: easing off becomes positive reinforcement. Module 6 also describes <b>HOME</b> (hand-over-mouth exercise) and <b>HOMAR</b> (hand-over-mouth, airway restricted): <b>do not use them</b>. HOMAR is not used at all anymore, and HOME only rarely, with extensive training.</p>\n<h4>Passive stabilization: mouth props</h4>\n<p>Most often a mouth prop is used <b>with the patient's consent</b>, to help them stay open without tiring. As a stabilizer it can force an unwilling mouth open so treatment is safe. It protects the patient from biting on a sharp or hard object (a handpiece or bur) and cutting tissue or breaking a tooth, and protects the provider from being bitten. Without a prop, keep your fingers in the <b>buccal vestibule</b>, never across the teeth.</p>\n<p>The <b>Molt mouth prop</b> is the most common in pediatric and special needs dentistry. It opens like scissors, latches at any opening, and only closes with its release lever. Hold it from outside the mouth. Keep the blades on the <b>posterior teeth</b>: slipped forward onto anterior teeth they can <b>luxate or even avulse</b> them, and lips can get caught under a blade and lacerated. The cheek side can cause minor abrasion or pinching: <b>report any trauma to the caregiver</b>. Sparks uses bare blades because the silicone covers can come off and become a choking hazard.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Prop</th><th>Where you'll see it</th><th>Notes</th></tr></thead><tbody>\n<tr><td>Molt mouth prop</td><td>Pediatric and special needs dentistry</td><td>Opens like scissors and latches at any opening; hold it from outside; blades on the posterior teeth; no silicone covers (choking hazard)</td></tr>\n<tr><td>McKesson bite block</td><td>The second-floor and other adult clinics</td><td>Rubber wedge; not used in special needs or pediatric dentistry; patients can crush it</td></tr>\n<tr><td>Open-Wide mouth prop</td><td>At home (Specialized Care Co.)</td><td>Wood core in dense foam; about $20 for four on Amazon</td></tr>\n</tbody></table></div>\n<h4>Passive stabilization: the papoose board</h4>\n<p><b>Papoose Board</b> is a brand: an inflexible padded board, wrist straps and soft canvas body wraps that close with Velcro. It has become the \"Kleenex\" word for any such device. Sparks uses the <b>Rainbow Wrap</b> (Specialized Care Company), which has a hinge so the patient can sit up; they call it \"the blanket,\" and since COVID they lay a sheet between the patient and the wrap. Placing a patient: secure each wrist at the wrist bone, snugly (roll a larger patient a little); the leg wrap goes over the knees so they can't buckle; lay the chair back; pull the wraps tight, ideally with two people, crossing them in an <b>X over the chest</b>.</p>\n<p><b>Weighted blankets</b> are popular in autism: they don't restrain, they comfort with deep sensory input, a bit like swaddling. The problem in dentistry is disinfecting them between patients.</p>\n<h4>Legal and ethical considerations</h4>\n<p><b>Parental acceptance</b>: studies of large parent populations show more and more parents find restraints unacceptable. In Dr. Mitchell's experience (not studies), families of patients with moderate to severe IDD are often <b>relieved</b> to find a practice that can passively stabilize their loved one instead of asking them to hold the patient. Some prefer IV sedation, but sedation is riskier in this population (fragile health, airway problems). Every family is different: talk with them.</p>\n<p><b>Active or passive stabilization requires informed consent.</b> Having a staff member hold a patient still needs the same consent as a papoose board. Without consent a dentist risks a <b>criminal charge (assault and battery)</b> and a <b>personal tort (malpractice)</b>. Good communication protects you: Dr. Mitchell checks in with parents during treatment and tells them they \"have their foot on the brake.\"</p>\n<p>Consent may be <b>express</b> (given in words or writing that unambiguously shows intent) or <b>implied</b> (a person's actions raise the presumption of consent: an adult who walks in for an exam and cleaning). Routine care an average person expects may be implied; beyond that, seek express consent.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th></th><th>Express</th><th>Implied</th></tr></thead><tbody>\n<tr><td>How it's given</td><td>In words or in writing, unambiguously</td><td>By the person's actions or conduct</td></tr>\n<tr><td>Example</td><td>A signed, specific consent for a papoose board</td><td>An adult who comes in for an exam and cleaning</td></tr>\n<tr><td>Covers</td><td>Treatment beyond routine care, and any stabilization</td><td>Routine care an average person expects</td></tr>\n</tbody></table></div>\n<p>Informed consent needs <b>three elements</b>:</p>\n<ul><li><b>Mental capacity</b> to make reasonable decisions (of whoever gives consent)</li><li><b>Informed</b>: enough information to make an educated decision. A <b>blanket consent</b> signed at registration is meaningless, because the patient hasn't been told their needs or options.</li><li><b>Given voluntarily</b>: if there is hesitation, it's best not to proceed.</li></ul>\n<p><b>Document it</b>: written and specific in the chart; witnessed, dated and recorded; with a way to record <b>withdrawal</b> of consent. Suggested items: date of use, <b>justification</b> (often overlooked: unable to tolerate treatment safely, resisting care, biting instruments, staff at risk), description of the restraint (Molt prop, Rainbow board, head hold), its effectiveness, its duration, and periodic re-evaluation.</p>\n<h4>Ethics of treating patients with IDD</h4>\n<ul><li><b>Issue one: is the patient competent to take part in decisions?</b> A competent patient has the right to decline care, even a bad decision. Include patients in decisions whenever possible. (Group homes in Alabama often say a patient who barely speaks in sentences consents for themselves.)</li><li><b>Issue two: if the patient is not competent, how do we proceed?</b> By <b>beneficence</b>: act to maximize the patient's well-being. Is a composite placed in a wet, bleeding field to avoid stabilization better for the patient than stabilizing them and placing a quality restoration?</li><li><b>Issue three: advocacy.</b> This population can't speak for itself. Educate caregivers on the best treatment, and push for resources at the community, state and national level. How we care for them reflects our values as a society.</li></ul>\n<p>Not using stabilization when it's needed has ethical consequences too, just as using it wrongly does.</p>\n", "down": "\n<div class=\"tested\"><b>What's tested</b><ul><li>How Down syndrome occurs: nondisjunction and the three types, with their percentages</li><li>Incidence, maternal age and life expectancy</li><li>Intellect, aging and Alzheimer's changes; personality and behavior</li><li>Facial features: midface hypoplasia, nose, ears, eyes</li><li>Medical conditions: heart defects and prophylaxis, immunity and leukemia, thyroid, diabetes, celiac, airway, dysphagia, GERD, atlantoaxial instability</li><li>Oral findings, periodontal disease and NUG, caries</li><li>Treatment planning: prevention, perio, extractions, liquid antibiotics, prosthodontics, restorations</li></ul></div>\n<p>This is one of Dr. Mitchell's favorite topics and patient groups. Much of it comes from Dr. John Thornton, who taught this course for many years. The goals: explain how Down syndrome occurs, anticipate behavior, identify medical conditions, describe oral findings and plan treatment for the common oral diseases.</p>\n<h4>What is Down syndrome?</h4>\n<p>Described and named by <b>Dr. Langdon Down in 1865</b>; recognized as a <b>chromosomal anomaly in 1956</b>, almost 100 years later. Normal cells have <b>46 chromosomes</b>; most people with Down syndrome have <b>47</b>, with an extra copy of chromosome 21 (<b>trisomy 21</b>). It is a syndrome, not a disease.</p>\n<p>The cause is <b>nondisjunction</b>. In normal meiosis the 23 pairs split so each gamete gets 23 unpaired chromosomes. In Down syndrome the 21st pair doesn't split: one gamete lacks chromosome 21 and isn't viable; the other has 24. If it is fertilized, the cell has 47 chromosomes, and every division copies that. <b>Over 90%</b> of the time the error is in the <b>mother's egg</b>; <b>under 10%</b> in the father's sperm.</p>\n<ul><li><b>Trisomy 21 (94%)</b>: an extra whole chromosome 21; 47 chromosomes.</li><li><b>Translocation (5%)</b>: part of an extra 21 attaches to another chromosome, usually the <b>14th</b>. The person has <b>46</b> chromosomes, one of them unusually long.</li><li><b>Mosaicism (1%)</b>: nondisjunction happens early in the <b>embryo's</b> cell divisions, not in the gamete, so some cells have 46 and some 47, like the tiles of a mosaic.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Type</th><th>Share</th><th>What happens</th><th>Chromosomes</th></tr></thead><tbody>\n<tr><td>Trisomy 21</td><td>94%</td><td>Nondisjunction in a gamete: an extra whole chromosome 21</td><td>47</td></tr>\n<tr><td>Translocation</td><td>5%</td><td>Extra chromosome 21 material attached to another chromosome, usually 14</td><td>46</td></tr>\n<tr><td>Mosaicism</td><td>1%</td><td>Nondisjunction early in the embryo, not in the gamete</td><td>Some cells 46, some 47</td></tr>\n</tbody></table></div>\n<h4>How common</h4>\n<p>About 250,000 people in the U.S. in 2008 (surely more now), about <b>1 in 700</b> live births. Incidence <b>rises with maternal age</b>: about 1 in 2,300 at 20, 1 in 280 at 34-39, 1 in 130 at 40-44 and 1 in 65 at 46. More educated families tend to start families later, so Down syndrome can be more common in more highly educated communities.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Mother's age</th><th>Births with Down syndrome</th></tr></thead><tbody>\n<tr><td>About 20</td><td>1 in 2,300</td></tr>\n<tr><td>34-39</td><td>1 in 280</td></tr>\n<tr><td>40-44</td><td>1 in 130</td></tr>\n<tr><td>46 and over</td><td>1 in 65</td></tr>\n<tr><td>Overall</td><td>About 1 in 700</td></tr>\n</tbody></table></div>\n<p><b>Life expectancy</b> has risen dramatically: <b>9 years in 1929</b> (most died of pneumonia before antibiotics), <b>30 in 1980</b>, and <b>55 by the 2000s</b>, now even more.</p>\n<h4>Intellect and aging</h4>\n<p>Most have intellectual disability: <b>42% mild</b>, <b>26% moderate</b> (so about 68%, nearly 70%, mild or moderate and able to function well in society), <b>15% severe</b> and <b>17% profound</b>. About <b>half show signs of deterioration before age 50</b>. In <b>100% of autopsies</b>, the brain shows changes associated with <b>Alzheimer's</b>, though the clinical signs are not as evident. Because long lives are new, the data are only 15-20 years deep. A patient you have seen for 25 years may start to understand or behave differently as they near 50: expect it.</p>\n<h4>Personality</h4>\n<p>Generally <b>happy, playful and loving</b> (\"the best hugs you will ever receive\"). But emotions can <b>shift quickly</b>: they scare easily and get upset easily (a laughing patient became terrified the moment she realized there would be a needle). They are <b>sensitive to the emotions around them</b>: a tense room makes them tense, a playful room playful. <b>As intellectual disability increases, behavior worsens</b>: lower-functioning patients are driven more by mistrust, may <b>withdraw from strangers</b>, and can be <b>violently protective</b>. Dr. Mitchell's example: a man with Down syndrome, autism and profound ID whose family trimmed his nails while he slept.</p>\n<h4>Facial features</h4>\n<ul><li><b>Midface hypoplasia</b>: the <b>cardinal characteristic</b>. The maxillary complex fails to develop fully, giving a sunken-in, flat face, most obvious from the side.</li><li><b>Reduced nasal protrusion</b>: a flat, broad nasal bridge (59-78%), a <b>saddle nose</b>.</li><li><b>Deviated nasal septum and conchae</b>, which narrow the airway. With the midface and nose, the result is <b>mouth breathing</b>. Fill that mouth with water spray and you have cut off the airway: the \"bad behavior\" is a fight for air. The same anatomy makes the airway easier to lose under sedation.</li><li><b>Ear malformations (~50%)</b>: low-set ears, lop ear (the top rim folded over), a flat or absent helix.</li><li><b>Eyes</b>: <b>epicanthal folds</b> (skin of the upper eyelid covering the inner corner; slanting, almond-shaped eyes; 78%), <b>strabismus</b> (14-54%), <b>nystagmus</b> (involuntary eye movement), refractive error (50% wear glasses; one reference says 100% see worse than normal). Low ears, saddle nose and poor eyesight make glasses hard to fit (Specs4Us makes frames with a lower bridge).</li></ul>\n<h4>Medical considerations: the heart</h4>\n<p>About <b>50%</b> have congenital heart disease, so the cardiac history matters most.</p>\n<ul><li><b>Atrioventricular canal defect</b> (also AV septal or endocardial cushion defect): the <b>most common</b>, 45-60% of the cardiac cases; a large wall defect involving atria and ventricles, so oxygenated and deoxygenated blood mix. Usually repaired early; about six months after a good repair it rarely affects dental care. If the repair left poor flow, antibiotics may be needed: consult the cardiologist.</li><li><b>Ventricular septal defect (VSD)</b>: 32-35%; a smaller hole between the ventricles; repaired early.</li><li><b>Atrial septal defect (ASD)</b>: 1-8%; a hole between the atria.</li><li><b>Patent ductus arteriosus (PDA)</b>: 7%; the ductus arteriosus normally closes within hours of birth; if it stays open, oxygen-rich and oxygen-poor blood mix. Easily closed surgically.</li><li><b>Tetralogy of Fallot</b>: 4-6%; a VSD, <b>pulmonary stenosis</b>, a thicker right ventricle, and an <b>aorta over the VSD</b>. Cyanosis, rapid breathing, fainting spells. Needs open-heart surgery, often isn't fully repaired, and <b>often requires prophylactic antibiotics</b>: get a cardiac consult.</li><li><b>Mitral valve prolapse</b>: 14% by medical history but <b>57% on EKG</b>; <b>aortic regurgitation</b>: 6% by history, 11% on EKG. <b>Patients often don't know their own cardiac disease.</b></li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Defect</th><th>Share of cardiac cases</th><th>Notes</th></tr></thead><tbody>\n<tr><td>Atrioventricular canal defect (AV septal, endocardial cushion)</td><td>45-60%</td><td>Most common; atria and ventricles; repaired early</td></tr>\n<tr><td>Ventricular septal defect (VSD)</td><td>32-35%</td><td>Repaired early; usually no antibiotics once healed</td></tr>\n<tr><td>Atrial septal defect (ASD)</td><td>1-8%</td><td>Repaired early</td></tr>\n<tr><td>Patent ductus arteriosus (PDA)</td><td>7%</td><td>The duct fails to close after birth</td></tr>\n<tr><td>Tetralogy of Fallot</td><td>4-6%</td><td>VSD, pulmonary stenosis, thick right ventricle, aorta over the VSD; cyanosis; often needs prophylaxis</td></tr>\n<tr><td>Mitral valve prolapse</td><td>14% by history, 57% by EKG</td><td>Patients often don't know</td></tr>\n<tr><td>Aortic regurgitation</td><td>6% by history, 11% by EKG</td><td></td></tr>\n</tbody></table></div>\n<p><b>Antibiotic prophylaxis</b> is now only for those at highest risk of endocarditis. It's required for: (1) <b>cyanotic congenital heart disease not fully repaired</b>, including surgical shunts and conduits; (2) a congenital defect <b>completely repaired with prosthetic material or a device, for the first six months</b> after repair; (3) <b>repaired</b> congenital heart disease <b>with residual defects</b> at or next to a prosthetic patch or device. It's often good to consult the physician.</p>\n<h4>Immunity and leukemia</h4>\n<p>A <b>smaller thymus</b>, fewer B and T cells, impaired T-cell function and impaired chemotaxis. The results: more <b>upper respiratory infections</b> (more mouth breathing and speech problems, harder general anesthesia), more <b>otitis media</b> (ear infections and early antibiotics correlate with molar-incisor hypomineralization), and higher risk of <b>pneumonia</b>, which caused most early deaths before antibiotics.</p>\n<p><b>Leukemia is 15-50 times more common.</b> Myeloid leukemia (called AML in others, <b>Down syndrome myeloid leukemia</b> here) has a <b>cure rate around 80%</b>. Lymphoblastic leukemia (ALL; mostly B-cell precursors) used to respond poorly to the usual methotrexate and anthracyclines, but newer treatment has nearly matched the general cure rate. Oddly, <b>solid tumors</b> are not more common and may be less common.</p>\n<h4>Endocrine problems</h4>\n<ul><li><b>Thyroid</b>: hypothyroidism <b>28-35 times</b> more common in infants; TSH raised in 25-60%; symptoms hard to diagnose; <b>autoimmune hypothyroidism</b> in 7.5-34% of children 8 and older, with <b>equal male and female</b> rates (mostly female in others).</li><li><b>Diabetes</b>: <b>3 times</b> more likely; type 1 starts slightly younger.</li><li><b>Celiac disease</b>: immune-mediated, triggered by gluten; up to <b>20%</b>.</li></ul>\n<h4>Airway, swallowing and the neck</h4>\n<ul><li><b>Obstructive sleep apnea</b>: <b>50-80%</b>.</li><li><b>Dysphagia</b> (abnormal swallowing): <b>58%</b>; risk of aspirating liquids, food and saliva. About <b>60% have GERD</b>, so they can aspirate stomach contents too. Watch positioning (don't lay them too far back), don't flood the mouth, suction well. Be cautious with sedation; monitor more and use the hospital more often.</li><li><b>Atlantoaxial instability</b>: <b>10-20%</b>. Lax ligaments let C1 and C2 move too far, risking spinal cord injury. <b>Avoid hyperextending the neck</b>, especially during stabilization or intubation. It may lessen with age.</li></ul>\n<h4>Oral findings</h4>\n<p>A <b>narrow palate</b> and <b>spaces between teeth</b>. <b>Class III</b> malocclusion in 30-70%, from the underdeveloped <b>maxilla</b> (midface hypoplasia), not a large mandible; Class II in 3-32%; <b>posterior crossbite in 71%</b>; open bite in 5%. <b>Macroglossia</b> (protect and work around the tongue) and a <b>fissured tongue</b>. <b>Delayed eruption</b> of primary and permanent teeth, more <b>impacted canines and premolars</b>, <b>over-retained primary teeth</b>, and <b>peg or conical teeth</b>. More <b>missing teeth</b>: laterals missing in <b>35-43%</b> vs 2% generally. Short, small clinical crowns (<b>microdontia</b>) and <b>taurodontism</b>: the root bifurcation and pulp chamber floor displaced apically, giving large pulp chambers.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Finding</th><th>Detail</th></tr></thead><tbody>\n<tr><td>Malocclusion</td><td>Class III 30-70% (midface hypoplasia, not a big mandible); Class II 3-32%; posterior crossbite 71%; open bite 5%</td></tr>\n<tr><td>Palate and spacing</td><td>Narrow palate; spaces between teeth</td></tr>\n<tr><td>Tongue</td><td>Macroglossia; fissured tongue</td></tr>\n<tr><td>Eruption</td><td>Delayed (primary and permanent); impacted canines and premolars; over-retained primary teeth</td></tr>\n<tr><td>Tooth number and shape</td><td>Missing laterals 35-43% (vs 2%); peg or conical teeth; microdontia (short crowns); taurodontism</td></tr>\n<tr><td>Periodontal disease</td><td>The most common dental condition: early onset in 60-95%, from age 6, faster</td></tr>\n<tr><td>NUG</td><td>45% (vs 4% of others with IDD), without the usual fetid breath or pain</td></tr>\n<tr><td>Caries</td><td>Usually lower (69-78% caries free in studies), but the evidence is mixed</td></tr>\n</tbody></table></div>\n<h4>Periodontal disease</h4>\n<p><b>The most common dental condition</b> in Down syndrome: higher than the general population and higher than in other disabilities, so poor brushing alone doesn't explain it. <b>Early onset in 60-95%</b>, detectable as young as <b>6 years</b>, and it progresses faster. Some patients lose teeth to bone loss in their early teens. Treatment mirrors early-onset periodontitis: scaling and root planing.</p>\n<p><b>Necrotizing ulcerative gingivitis (NUG)</b>: an institutional study found it in <b>45%</b> of people with Down syndrome vs <b>4%</b> of others with IDD, and they rarely report the fetid breath or pain others do. Predisposing factors: crowding (rare in Down syndrome), traumatic occlusion, peg-shaped anterior teeth, primary teeth whose roots don't resorb, and a high frenum.</p>\n<h4>Caries</h4>\n<p>Commonly believed to be <b>lower</b>: one study found 72-78% caries free vs 46-58% of their siblings; another 69% vs 45% of others with IDD. But the <i>International Journal of Paediatric Dentistry</i> (2016) said there is no scientific evidence that people with Down syndrome have less caries. Dr. Mitchell's experience: lower, but he has seen plenty of caries.</p>\n<h4>Treatment</h4>\n<p><b>Prevention</b> is worth a pound of cure. Start early and tell families <b>perio is the big risk</b>. Parents should brush for the child: let the child \"play\" at brushing, then go behind to really clean. Parents keep that job much later in life than usual. Larger handles and flossing aids (a flosser whose floss runs perpendicular to the handle reaches the molars) help.</p>\n<p><b>Start periodontal therapy early</b>: probe from about <b>age 6</b>, look for bone loss on every film, and do SRP as for anyone.</p>\n<p><b>Pharmacologic</b>: long-term <b>chlorhexidine</b> (staining is an issue and spitting may be limited; dip the toothbrush and brush it on). Antibiotics: <b>penicillin</b>; <b>doxycycline (Periostat)</b> in low dose <b>after 8-10 years of age</b> (no longer a staining risk to developing teeth); <b>metronidazole</b>; local <b>PerioChip or Atridox</b> in a pocket.</p>\n<p><b>Extractions in perio treatment</b> are a complicated decision. A patient who can't tolerate complex SRP favors extracting; a patient who won't tolerate a prosthesis favors keeping teeth; crowding favors extraction, but many have spacing, which favors keeping. Decide with the caregivers. Healing after extraction is likely delayed; antibiotics are often recommended, but that is <b>not evidence-driven</b>.</p>\n<p><b>Antibiotic prescriptions</b>: if the patient can swallow pills, write it as for anyone. If not, use a <b>liquid</b>: find the highest readily available concentration and prescribe a volume close to the pill dose. Dr. Mitchell's example, 1,500 mg of amoxicillin a day for 5 days:</p>\n<ul><li>Amoxicillin 500 mg tablets, disp 15, one tablet by mouth TID for 5 days</li><li>Amoxicillin <b>250 mg/5 mL</b>, disp <b>150 mL</b>, take <b>10 mL</b> by mouth TID for 5 days (10 mL = 500 mg)</li><li>Amoxicillin <b>400 mg/5 mL</b>, disp <b>75 mL</b>, take <b>1 teaspoon (5 mL)</b> by mouth TID for 5 days (a little less, but less liquid to swallow)</li></ul>\n<p><b>Prosthetic treatment</b> is often of limited value: periodontal problems, ability to clean, Class III occlusion, impaired healing and infection control (implants), and above all maladaptive behavior, fear and gag reflex. Dr. Mitchell doesn't know a patient with Down syndrome who tolerates a denture or RPD, but assess each person and explain risks and benefits.</p>\n<p><b>Restorative care</b>: high-functioning, cooperative patients are planned like anyone. <b>As ID increases, favor strong over esthetic</b>: full-coverage stainless steel crowns over large complex restorations, posterior amalgam over resin, and resin-modified glass ionomer (fluoride release, easy placement).</p>\n<p>Summary: people with Down syndrome are <b>often wonderful patients</b> and probably the most common developmental disability treated in private practice. They have unique physical features, medical conditions to check (heart, infection), and pe
