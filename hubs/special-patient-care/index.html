cline only after age 8-10).</p>\n<p>If they can't swallow pills, prescribe liquid. For 500 mg of amoxicillin three times a day: <b>amoxicillin 250 mg/5 mL, 10 mL three times a day</b>.</p>\n<p>Dentures and bridges rarely work. As ID gets more severe, choose <b>strong over pretty</b>: steel crowns, amalgam, glass ionomer.</p>\n", "cp": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What CP is and what causes it</li><li>The types and their movements</li><li>Most have normal intelligence</li><li>Seizures, medicines, swallowing, reflux and drooling</li><li>Consent, the mouth, home care and wheelchairs</li></ul></div>\n<h4>What CP is</h4>\n<p>Cerebral palsy is brain damage early in life that affects <b>voluntary movement and posture</b>. It's <b>permanent</b> but <b>doesn't get worse</b>. It's the most common movement disorder in children (about 1 in 303), more likely in tiny or premature babies.</p>\n<h4>Causes</h4>\n<p>Most (70-80%) happen <b>before birth</b>: prematurity, infections (the <b>TORCH</b> group: toxoplasmosis, rubella, CMV, herpes), twins or triplets, bleeding in the brain. Some happen at birth (lack of oxygen, which turned out to be less common than thought). A few happen after birth: shaken baby, near-drowning, meningitis.</p>\n<h4>Types</h4>\n<ul><li><b>Spastic (70-80%)</b>: cortex damage; <b>stiff</b> muscles, strong reflexes, curled hands; loud noises can trigger spasms</li><li><b>Dyskinetic (10-20%)</b>: basal ganglia; <b>uncontrolled movements</b>: slow writhing (athetosis), shaking when trying to move (dystonic tremor) or fast jerks (chorea)</li><li><b>Ataxic (5-10%)</b>: cerebellum; poor <b>balance</b> and coordination</li></ul>\n<p>Limb words: hemiplegia = one side; diplegia = mostly legs; quadriplegia = all four.</p>\n<h4>Intelligence</h4>\n<p><b>Most people with CP are as smart as anyone.</b> Trouble speaking (dysarthria, up to 88%) doesn't mean trouble understanding. Always talk to them as a peer. Most can consent for themselves: by signing, saying yes with a witness, blinking, or a speech device. And they can say no.</p>\n<h4>Medical issues</h4>\n<p>About 30% have <b>epilepsy</b>. If a seizure starts: stop, take everything out of the mouth, turn them on their side, keep them safe, let it end (under 5 minutes), then send them home. A seizure over <b>5 minutes</b> (or back-to-back seizures) is <b>status epilepticus</b>: call EMS.</p>\n<ul><li><b>Dilantin</b> causes gum overgrowth; surgery waits until it's infected or covers the biting surfaces</li><li><b>Depakote</b> can lower platelets: bleeding</li><li><b>Bisphosphonates</b>: careful with extractions (bone necrosis)</li></ul>\n<p><b>Swallowing problems</b> mean a strong gag and choking risk: sit them up more and spray water in short bursts. Over half have <b>reflux</b>, which scoops out the enamel; fix the reflux before restoring. <b>Drooling</b> comes from poor swallowing, not too much saliva; drying the mouth can cause rampant decay, so treat it only as a last resort.</p>\n<h4>The mouth</h4>\n<p>Long, narrow faces, <b>open bites</b>, flared front teeth and <b>Class II</b> bites. Flared teeth plus falls and seizures mean many broken or knocked-out front teeth. A bit more decay, and up to 3 times more gum disease. Most grind their teeth (flat wear). Number of teeth, eruption timing and tongue size are normal.</p>\n<p>Patients fed by <b>g-tube</b> build heavy tartar: clean the cheek and tongue sides but leave it on the biting surfaces. Use steel crowns, glass ionomer and amalgam over fussy restorations.</p>\n<h4>Home care and wheelchairs</h4>\n<p>Make the toothbrush handle <b>fatter</b> (tennis ball, foam, washcloth) or <b>longer</b> (tongue blades). Waterpiks, disclosing tablets and rinses don't help much. Brush chlorhexidine on if they can't rinse.</p>\n<p>Let <b>caregivers</b> move a patient from the wheelchair, or treat them right in the chair: <b>lock the wheels</b> and tilt it back, often only to about 45 degrees.</p>\n", "syndromes": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The descriptive terms</li><li>Fragile X, Prader-Willi, tuberous sclerosis, Apert, Lesch-Nyhan, Pierre Robin, fetal alcohol syndrome, Cornelia de Lange</li></ul></div>\n<h4>Words for hands and eyes</h4>\n<ul><li><b>Brachydactyly</b> short fingers; <b>syndactyly</b> fused fingers; <b>clinodactyly</b> a bent finger; <b>ectrodactyly</b> missing fingers; <b>polydactyly</b> extra fingers</li><li><b>Coloboma</b> a hole in the iris; <b>miosis</b> small pupil, <b>mydriasis</b> big pupil; <b>strabismus</b> crossed eyes; <b>hypertelorism</b> wide-set eyes</li></ul>\n<h4>Tongue, spine, face</h4>\n<p><b>Glossoptosis</b>: the tongue sits low and back, which can cause a cleft palate and block the airway. <b>Scoliosis</b> curves the spine sideways (C or S); <b>kyphosis</b> hunches it forward (prop the head with pillows). <b>Meningomyelocele</b> pushes out spinal cord; <b>meningocele</b> only its covering. <b>Dolichocephaly</b> is a long, narrow face; <b>brachycephaly</b> a short, square one.</p>\n<h4>Fragile X</h4>\n<p>Too many repeats in the <b>FMR1</b> gene on the X chromosome. <b>Boys</b> are hit harder because they have one X. Late walking, hand flapping, poor eye contact (like autism), a <b>long face and big jaw</b>.</p>\n<h4>Prader-Willi</h4>\n<p>Missing genes on <b>chromosome 15</b> (the dad's copy). Endless <b>hunger and obesity</b>, mild to moderate ID, tantrums and stubbornness, and they may not feel pain. Thick, scant saliva means <b>heavy tartar</b>, cavities and gum disease. Obesity makes sedation risky.</p>\n<h4>Tuberous sclerosis</h4>\n<p>Benign tumors grow anywhere; the problems depend on where. Brain tumors mean seizures (and gum overgrowth from seizure drugs); in the mouth, weak enamel and gum growths.</p>\n<h4>Apert</h4>\n<p>Skull bones <b>fuse too early</b>. Long face, wide eyes, flat midface, <b>webbed hands</b>, airway problems. In the mouth: crowding, high palate, open bite, <b>Class III</b>, late teeth.</p>\n<h4>Lesch-Nyhan</h4>\n<p>Too much <b>uric acid</b> (HPRT1 gene), almost always boys. Severe <b>self-biting</b> of lips and fingers. Taking out all the teeth can be the kindest treatment.</p>\n<h4>Pierre Robin</h4>\n<p>A <b>tiny lower jaw</b>, a tongue that falls back, a U-shaped cleft palate. Usually normal intelligence. The danger is the <b>airway</b>: severe cases are treated asleep, intubated.</p>\n<h4>Fetal alcohol syndrome</h4>\n<p>From drinking during pregnancy. Small head, <b>smooth philtrum</b>, <b>thin upper lip</b>, small jaw. Mild to moderate problems with focus and judgment; many are never diagnosed.</p>\n<h4>Cornelia de Lange</h4>\n<p>Short, with <b>thick eyebrows</b>, moderate to severe ID and hard behavior. Small, <b>widely spaced</b> teeth that come in late; cleft palate in 20%.</p>\n", "autism": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What autism is and how common</li><li>Genes, twins and vaccines</li><li>Signs, stimming, meltdowns and sensory defensiveness</li><li>Dental problems in autism</li><li>Planning the visit and talking to the patient</li><li>Sedation, the OR and referring</li></ul></div>\n<h4>What autism is</h4>\n<p>Autism spectrum disorder is a developmental disability that causes <b>social, communication and behavior</b> challenges. It's now about <b>1 in 36</b> children (2020; 1 in 68 in 2012) and <b>four times more common in boys</b>. It's a spectrum: one teen can't speak, another is a math whiz who can't hold a conversation.</p>\n<p>The cause isn't known, but genes matter a lot: if one <b>identical twin</b> has autism, the other does <b>77%</b> of the time; for <b>fraternal twins</b> it's <b>31%</b>. About a quarter of cases trace to one powerful gene change, often brand new rather than inherited. <b>Vaccines don't cause autism</b>: that study was a fraud. Older fathers and valproic acid in pregnancy raise the risk.</p>\n<h4>Signs</h4>\n<p>It starts <b>before age 3</b>. A child may not answer to their name by 12 months, not point by 14 months, not pretend-play by 18 months; may avoid eye contact, repeat words (<b>echolalia</b>), get upset at small changes, flap hands or rock, and have no sense of danger. Babies who will develop autism look at mouths instead of eyes.</p>\n<h4>Stimming and meltdowns</h4>\n<p><b>Stimming</b> (flapping, rocking, repeating sounds) helps them cope. Ask about it ahead of time. If it isn't getting in the way, <b>let it be</b>; if it is, redirect their hands.</p>\n<p>A <b>meltdown is not a tantrum</b>. A tantrum is for attention and stops when the child gets what they want. A meltdown means the child can't cope: they don't care who's watching, may hurt themselves, and it fades slowly. Find out the triggers and warning signs beforehand, and be kind to the family.</p>\n<h4>Sensory defensiveness</h4>\n<p>Some brains feel ordinary sensations as painful, so the patient defends against touch to the face, bright lights, noises, paste texture, gloves and gagging. Pushed too far, they go into fight or flight. Help with: the <b>x-ray vest</b> (deep pressure), <b>sunglasses</b>, a warning before each step, headphones, <b>firm touch</b>, a fidget toy, something chewy beforehand.</p>\n<h4>Dental problems</h4>\n<p>No extra or missing teeth like Down syndrome or CP, but more <b>cavities</b> (picky diets, hard to clean), more <b>wear</b> (grinding), more <b>erosion</b> (reflux), slightly more gum disease, and more <b>injuries</b> (no sense of danger, more abuse).</p>\n<h4>Before the visit</h4>\n<p>Give the family a <b>practice kit</b> (prophy angle, mirror, bite holder without the metal bar) a few weeks ahead, and practice lying down with a dry toothbrush. Book the <b>first appointment of the morning</b>. Turn off music and sterilizers, dim the lights, offer sunglasses, have everything on the counter, skip perfume.</p>\n<h4>How to talk</h4>\n<ul><li>Short and literal: \"Open your mouth,\" not \"open like an alligator\"</li><li>\"<b>Hands on belly</b>\"</li><li>Say it once, then wait</li><li>Use the same words every time</li><li>A calm, lower, direct voice; praise calmly, no clapping and cheering</li><li>Don't ask yes-or-no when no isn't an option: \"It's time to polish your teeth.\"</li><li>Use pictures</li></ul>\n<h4>The visit</h4>\n<p>Follow a <b>picture schedule</b>. Start lying down, start at the <b>front teeth</b>, go from least to most invasive, and <b>count to 10</b> for breaks (always reach 10). Reward with praise or a video break.</p>\n<h4>When the office isn't enough</h4>\n<p>Oral sedation is mild and often not enough. IV sedation needs a special license and an IV the patient may not tolerate. General anesthesia works but adult OR access in Alabama is scarce. If you can't treat safely, you must <b>refer</b>: Sparks, UAB Hospital Dentistry, the Foundry, oral surgeons (extractions only), pediatric dentists.</p>\n", "prevention": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Fluoride varnish and the ADA numbers</li><li>Fillings that prevent decay</li><li>Finding and removing tartar; prophy tips</li><li>Brushing aids and positions at home</li><li>Home fluorides</li><li>Drinks and diet</li></ul></div>\n<h4>In the office</h4>\n<p>Sparks uses only <b>fluoride varnish</b>: no trays to gag on, stronger, quick to paint on, and the patient can <b>eat and drink right away</b>. Foam and gel need four minutes in a tray.</p>\n<p>Varnish can stop small cavities from growing. <b>Sealant plus varnish</b> every 3-6 months stopped <b>67 of 100</b> early chewing-surface cavities; varnish alone stopped <b>46 of 100</b> early cavities between teeth. For root cavities, <b>Prevident 5000</b> at home.</p>\n<p>When you have to fill: <b>silver diamine fluoride</b> to stop small ones (it turns them black), <b>glass ionomer</b> (releases fluoride), or <b>steel crowns</b> for big ones.</p>\n<h4>Tartar and cleanings</h4>\n<p>Puffy gums with no visible tartar usually means a <b>ring of tartar under the gums</b>. Check! Use a <b>sickle</b> above the gums and a <b>curette</b> below. Tartar on the <b>front of the lower front teeth</b> means the lip blocks the brush: teach caregivers to pull the lip down.</p>\n<p>With the rubber cup, reach the gumline and roll between teeth. For gaggers, go in <b>1-2 second pulses</b>. <b>Tube-fed</b> patients build heavy tartar: clean the sides, but <b>leave it on the biting surfaces</b>. Many need cleanings every 3-4 months, even if insurance pays only twice a year.</p>\n<h4>At home</h4>\n<p>The <b>Surround</b> brush cleans three sides at once for patients who allow only a quick brushing. Fatten handles (tennis ball, foam, washcloth) or lengthen them (tongue blade). Electric brushes help many.</p>\n<p>Positions: standing in front is easiest and gags least; behind the seated patient controls the head; a <b>recliner</b> practices for the dental chair; in bed or on the floor (two people) gives the most control but the most gagging.</p>\n<h4>Home fluoride</h4>\n<p>No fluoride rinses or gels before <b>age 8</b> (they swallow it: fluorosis). Most can't rinse, so brush it on. <b>Prevident 5000</b>: brush it on at bedtime, wipe out the extra, don't rinse. <b>GelKam</b> is just fluoride. <b>MI Paste Plus</b> (not plain MI Paste) has fluoride. Rinses work only if they can swish, or with a Toothette for 30-60 seconds.</p>\n<h4>Diet</h4>\n<p>If brushing isn't possible, <b>sugar control</b> is the best tool. <b>Sweet drinks</b> are the worst: ask, \"What does he drink the most in a day?\" Best drinks: <b>water, plain milk, unsweet tea</b>. Juice is not on the list. Diet drinks and sweeteners are fine for teeth: <b>10 calories or less per serving</b> is safe. Keep them to 2-3 a day, and on special occasions, enjoy.</p>\n", "mental": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Mental illness vs intellectual disability</li><li>Depression, bipolar, schizophrenia, dementia, addiction: what to expect in the mouth</li><li>Drug side effects and interactions</li></ul></div>\n<h4>The reading</h4>\n<p>This unit is a reading (SAID Module 9), not a lecture. Dr. Mitchell wants you to focus on the <b>dental issues</b> of each illness.</p>\n<p><b>Mental illness</b> comes from a psychiatric or emotional disorder and can come and go. <b>Intellectual disability</b> is a permanent thinking deficit. About 1 in 6 people has a mental disorder; about 3% have ID.</p>\n<h4>Depression</h4>\n<p>People stop caring for themselves, so: <b>poor hygiene, rampant decay, gum disease, missing teeth, dry mouth</b> and facial pain. Antidepressants cause <b>dry mouth</b> (14% on Prozac, 45% on tricyclics), and patients sip sugary drinks to cope: offer saliva substitutes. With <b>tricyclics</b>, epinephrine is OK with care but levonordefrin and norepinephrine are not. With <b>MAO inhibitors</b>, no Demerol. Patients getting <b>ECT</b> may need a mouth guard, and loose teeth handled first.</p>\n<h4>Bipolar disorder</h4>\n<p>Swings between mania and depression. In <b>mania</b>, people brush too hard: scraped gums and worn necks of teeth. <b>Lithium</b> causes dry mouth and mouth sores, and <b>NSAIDs can raise lithium levels</b>.</p>\n<h4>Schizophrenia</h4>\n<p>Delusions, voices, flat emotions. Patients often neglect their teeth. Approach <b>slowly</b>, explain and show each step. Antipsychotics cause dry mouth and, long-term, <b>tardive dyskinesia</b>: constant lip, tongue and jaw movements. Be careful with sedatives (breathing).</p>\n<h4>Dementia</h4>\n<p>Memory loss that gets worse, including Alzheimer's. Expect falls, root decay, gum disease and dry mouth. <b>Do dental work early</b>, before cooperation is lost, and take full x-rays early. Older people keep drugs in the blood about twice as long: prescribe carefully. Talk simply, use names instead of \"he\" or \"it,\" and repeat.</p>\n<h4>Alcohol and drugs</h4>\n<p>Expect neglect, grinding, dry mouth, <b>oral cancer</b>, thrush, poor healing and <b>bleeding</b> (liver). Check bleeding tests before surgery. No epinephrine within <b>48 hours of cocaine</b>. For people in recovery, avoid habit-forming drugs (even nitrous); use NSAIDs and a long-acting numbing shot. People on <b>Antabuse</b> can't use mouthwash with alcohol.</p>\n"};

        if(isC && was) b.classList.add('is-correct'); else if(isC) b.classList.add('is-missed-right'); else if(was) b.classList.add('is-wrong');
      });
      var wrapC = card.querySelector('[data-role="multi-check"]'); if(wrapC) wrapC.innerHTML = '<span class="multi-score">Partial credit: '+Math.round(sc*100)+'%. Dashed = a right answer you missed.</span>';
      finishCard(card, sc === 1);
    } else if(act === 'seq-undo' || act === 'seq-clear'){
      var us = SEQ_STATE[rid]; if(!us) return;
      var drop = act === 'seq-clear' ? us.picks.splice(0) : us.picks.splice(-1);
      drop.forEach(function(i){ var b = card.querySelector('[data-act="seq"][data-step-idx="'+i+'"]'); if(!b) return; b.disabled = false; b.classList.remove('is-picked'); var o = b.querySelector('.ord'); if(o) o.remove(); });
      var ut = card.querySelector('[data-role="seq-tools"]'); if(ut) ut.hidden = !us.picks.length;
    } else if(act === 'seq'){
      var st = SEQ_STATE[rid]; if(!st) return;
      st.picks.push(+btn.getAttribute('data-step-idx'));
      btn.disabled = true; btn.classList.add('is-picked');
      btn.insertAdjacentHTML('afterbegin', '<span class="ord">'+st.picks.length+'</span>');
      var tools = card.querySelector('[data-role="seq-tools"]'); if(tools) tools.hidden = false;
      if(st.picks.length === q.steps.length){
        var good = st.picks.every(function(v,i){ return v === i; }), inPlace = st.picks.filter(function(v,i){ return v === i; }).length;
        card.querySelectorAll('[data-act="seq"]').forEach(function(b){ var i = +b.getAttribute('data-step-idx'); var pos = st.picks.indexOf(i); b.classList.remove('is-picked'); b.classList.add(pos === i ? 'is-correct' : 'is-wrong'); });
        finishCard(card, good);
        var sv = card.querySelector('.qcard-verdict'); if(sv && !good) sv.textContent = 'Not quite: ' + inPlace + ' of ' + q.steps.length + ' in the right spot.';
      }
    } else if(act === 'match'){
      var ms = MATCH_STATE[rid]; if(!ms || btn.classList.contains('is-matched')) return;
      var side = btn.getAttribute('data-side');
      if(side === 'left'){ card.querySelectorAll('.qcard-match-item[data-side="left"]').forEach(function(b){ b.classList.remove('is-selected'); }); btn.classList.add('is-selected'); ms.sel = +btn.getAttribute('data-pair-idx'); return; }
      if(ms.sel === null) return;
      var r = +btn.getAttribute('data-pair-idx');
      var leftBtn = card.querySelector('.qcard-match-item[data-side="left"][data-pair-idx="'+ms.sel+'"]');
      if(r === ms.sel){
        btn.classList.add('is-matched'); leftBtn.classList.add('is-matched'); leftBtn.classList.remove('is-selected'); btn.disabled = true; leftBtn.disabled = true;
        ms.matched++; ms.sel = null;
        if(ms.matched === q.pairs.length) finishCard(card, ms.errors === 0);
      } else {
        ms.errors++; btn.classList.remove('is-wrong'); void btn.offsetWidth; btn.classList.add('is-wrong');
      }
    }
  });
}

/* ===================================================================
   MIND MAPS: built from each lecture's own notes (section headings as
   branches, the bolded key terms under each as leaves), drawn by the
   shared window.shMindMap renderer
   =================================================================== */
function mindMapFor(lec){
  var d = document.createElement('div'); d.innerHTML = READINGS[lec.id] || '';
  var branches = [], cur = { label:null, children:[] }, seen = {}; /* the intro paragraph before the first heading is left out */
  Array.prototype.forEach.call(d.children, function(el){
    if(/^H[34]$/.test(el.tagName)){ if(cur.label && cur.children.length) branches.push(cur); cur = { label:el.textContent.trim(), children:[] }; return; }
    if(!cur.label) return;
    Array.prototype.forEach.call(el.querySelectorAll('b, strong'), function(x){
      var t = x.textContent.trim(), k = t.toLowerCase();
      if(t.length < 2 || t.length > 38 || seen[k] || cur.children.length >= 6) return;
      seen[k] = 1; cur.children.push({ label:t });
    });
  });
  if(cur.label && cur.children.length) branches.push(cur);
  return { label:lecLabel(lec) + ' ' + lec.title, children:branches };
}

/* Put each figure inside the notes after the paragraph (or at the end of the section) it explains. The wrapper carries
   data-sh-noread, so narration, the highlighter and note search skip it and the notes text itself is unchanged.
   Figures in FIG_BY_LEC that no anchor places land in a Diagrams block after the notes. */
function placeLectureFigs(prose, lecId, level, rest){
  if(!prose) return;
  var placed = {}, kids = Array.prototype.slice.call(prose.children);
  function norm(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  (FIG_PLACE[lecId] || []).forEach(function(pl){
    var at = pl[level] || pl.full, el = null, i;
    for(i = 0; i < kids.length; i++){ if(norm(kids[i].textContent).indexOf(at) === 0){ el = kids[i]; break; } }
    if(!el) return;
    if(pl.end || /^H[1-6]$/.test(el.tagName)){ var j = kids.indexOf(el) + 1; while(j < kids.length && !/^H[1-6]$/.test(kids[j].tagName)) j++; el = kids[j - 1]; }
    var keys = pl.widget ? [pl.widget] : pl.figs, box = document.createElement('div');
    box.className = 'lec-fig-inline'; box.setAttribute('data-sh-noread', '');
    box.innerHTML = keys.every(function(k){ return ANIMA.meta(k); }) ? keys.map(figCardHTML).join('') : '<div class="fig-grid">' + keys.map(figCardHTML).join('') + '</div>';
    /* several figures after the same paragraph keep their order */
    var after = el; while(after.nextElementSibling && after.nextElementSibling.classList.contains('lec-fig-inline')) after = after.nextElementSibling;
    after.parentNode.insertBefore(box, after.nextSibling);
    keys.forEach(function(k){ placed[k] = 1; });
  });
  var left = (FIG_BY_LEC[lecId] || []).filter(function(k){ return !placed[k] && !(k === 'fence' && placed.cuspMap); });
  if(rest && left.length){ rest.hidden = false; rest.querySelector('.fig-grid').innerHTML = left.map(figCardHTML).join(''); }
  ANIMA.mount(prose.parentNode);
}

function wireLecPick(root, onPick){
  var box = root.querySelector('#lecPick'); if(!box) return;

  function changed(){ var ids = picked(); box.querySelector('.lp-sum').textContent = lecPickSummary(ids); onPick(ids); }
  btn.addEventListener('click', function(){ open(pop.hidden); });
  box.querySelector('.lp-done').addEventListener('click', function(){ open(false); btn.focus(); });

    var k = b.getAttribute('data-lp');
    box.querySelectorAll('input[type=checkbox]').forEach(function(c){ c.checked = k === 'all'; });

  function away(e){ if(!document.body.contains(box)){ document.removeEventListener('click', away, true); document.removeEventListener('keydown', esc); return; } if(!pop.hidden && !box.contains(e.target)) open(false); }
  function esc(e){ if(e.key === 'Escape' && !pop.hidden){ open(false); btn.focus(); } }
  document.addEventListener('click', away, true); document.addEventListener('keydown', esc);
}

function bankFiltered(search){
  var s = (search||'').toLowerCase().trim(), lecOn = {}, pins = {};
  bankLecIds().forEach(function(id){ lecOn[id] = 1; });
  pinnedIds().forEach(function(id){ pins[id] = 1; });
  return QUESTIONS.filter(function(q){
    if(!lecOn[q.lec]) return false;
    if(STATE.ui.qstatus === 'pinned' && !pins[q.id]) return false;
    if(STATE.ui.qstatus === 'likely' && !q.likely) return false;
    if(STATE.ui.qsrc !== 'all' && q.src !== STATE.ui.qsrc) return false;
    var fm = STATE.ui.qfmt || 'all';
    if(fm !== 'all' && !(fm === 'pbox' ? !!q.pbox : fm === 'multi' ? q.type === 'multi' : q.fmt === fm)) return false;
    var seen = STATE.seen[q.id];
    if(STATE.ui.qstatus === 'unseen' && seen) return false;
    if(STATE.ui.qstatus === 'missed' && !(seen && seen.last === false)) return false;
    if(s){ var hay = (q.stem + ' ' + (q.choices||q.steps||[]).join(' ') + ' ' + (q.pairs ? q.pairs.map(function(p){return p.join(' ');}).join(' ') : '') + ' ' + q.ex + ' ' + (q.pbox ? q.pbox.map(function(r){ return r.join(' '); }).join(' ') : '')).toLowerCase(); if(hay.indexOf(s) === -1) return false; }
    return true;
  });
}
var bankSearch = '';
function renderBank(body){
  var srcOpts = '<option value="all">All sources</option>' + Object.keys(SRC_LABEL).map(function(k){ return '<option value="'+k+'"'+(STATE.ui.qsrc===k?' selected':'')+'>'+SRC_LABEL[k]+'</option>'; }).join('');
  var fmOpts = [['all','Any format'],['2stmt','Two statements'],['tf','True or false'],['numbered','Numbered statements'],['except','EXCEPT / NOT'],['pbox','Patient Box'],['multi','Select all']].map(function(o){ return '<option value="'+o[0]+'"'+((STATE.ui.qfmt||'all')===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  var stOpts = [['all','Any status'],['unseen','Not yet answered'],['missed','Missed last time'],['pinned','Pinned'],['likely','High likelihood only']].map(function(o){ return '<option value="'+o[0]+'"'+(STATE.ui.qstatus===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  body.innerHTML = '<div class="cg-host" id="cgHost"></div><div class="qfilters">'+lecPickHTML(bankLecIds())+'<select id="fSrc" aria-label="Source">'+srcOpts+'</select><select id="fFmt" aria-label="Question format">'+fmOpts+'</select><select id="fSt" aria-label="Status">'+stOpts+'</select><input id="fSearch" type="search" placeholder="Search questions…" value="'+escHtml(bankSearch)+'"><div class="qorder" role="group" aria-label="Question order"><button type="button" data-qorder="linear" aria-pressed="'+(STATE.ui.qorder !== 'random')+'">In order</button><button type="button" data-qorder="random" aria-pressed="'+(STATE.ui.qorder === 'random')+'" title="Random order (tap again to reshuffle)">Random</button><button type="button" data-qorder="likely" aria-pressed="'+(STATE.ui.qorder === 'likely')+'" title="High likelihood exam questions first, strongest topics first">Likely first</button></div><button type="button" class="btn qpinned" id="fPinned" aria-pressed="'+(STATE.ui.qstatus === 'pinned')+'">'+PIN_SVG+'<span id="fPinN">Pinned ('+pinnedIds().length+')</span></button></div><div class="qcount" id="qCount"></div><div class="qlist" id="qList"></div><div style="text-align:center;margin-top:16px"><button type="button" class="btn" id="qMore" hidden>Show more</button></div>';
  CUSP_GAME.mount(document.getElementById('cgHost'));
  var list = document.getElementById('qList'); wireQuestionContainer(list);
  /* a missed question comes back as a fresh card RETRY_GAP cards further down, so the second try comes while it's fresh
     instead of only through the "Missed last time" filter at the end (student suggestion #10, 2026-10-21). A patient's
     questions stay together: the retry never lands inside a set. Missed again, it comes back again. */
  list.__retry = function(card, q){
    if(list.querySelector('.qcard.is-retry:not(.is-answered)[data-qid="'+q.id+'"]')) return;
    var cards = Array.prototype.filter.call(list.children, function(c){ return c.classList.contains('qcard'); });
    var i = cards.indexOf(card) + RETRY_GAP + 1;
    function pc(c){ var x = c && QUESTIONS_BY_ID[c.getAttribute('data-qid')]; return x && x.pcase; }
    while(i < cards.length && pc(cards[i]) && pc(cards[i]) === pc(cards[i - 1])) i++;
    var box = document.createElement('div'); box.innerHTML = qCardHTML(q, { ctx:'bank', retry:true });
    list.insertBefore(box.firstChild, cards[i] || null);
    if(window.shTrack) window.shTrack('bank:retry-shown');
  };
  /* In order: by lecture, then bank order. Random: one shuffle, kept through filter changes and "Show more" */
  var lecIdx = {}; LECTURES.forEach(function(l, i){ lecIdx[l.id] = i; });
  function baseOrder(){ return STATE.ui.qorder === 'random' ? shuffled(QUESTIONS.map(function(q){ return q.id; })) : QUESTIONS.map(function(q, i){ return [q, i]; }).sort(function(a, b){ return (lecIdx[a[0].lec] - lecIdx[b[0].lec]) || (a[1] - b[1]); }).map(function(x){ return x[0].id; }); }
  /* a reshuffle happens only when Random is tapped, not when the bank redraws */
  var order = (STATE.ui.qorder === 'random' && renderBank.__shuf) || baseOrder();
  if(STATE.ui.qorder === 'random') renderBank.__shuf = order;
  function draw(){
    var qs = bankFiltered(bankSearch);
    if(order){
      var idx = {}; order.forEach(function(id,i){ idx[id]=i; });
      /* a patient's questions stay together, in their own order, where the set's first one landed */
      var rank = function(q){ if(!q.pcase) return idx[q.id]||0; var set = caseSet(q.pcase); return Math.min.apply(null, set.map(function(id){ return idx[id]||0; })) + set.indexOf(q.id) / 100; };
      qs.sort(function(a,b){ return rank(a)-rank(b); });
    }
    /* Likely first: predicted exam topics in topic order (each lecture's best-supported topics lead), the rest after */
    if(STATE.ui.qorder === 'likely'){
      var pos = {}; qs.forEach(function(q,i){ pos[q.id] = i; });
      var lk = function(q){ return q.likely ? LIKELY_TOPICS.indexOf(q.likely) : 1e4; };
      qs.sort(function(a,b){ return (lk(a)-lk(b)) || (pos[a.id]-pos[b.id]); });
    }
    document.getElementById('qCount').textContent = qs.length + ' question' + (qs.length===1?'':'s') + (qs.length > bankShown ? ' · showing ' + bankShown : '');
    list.innerHTML = qs.slice(0, bankShown).map(function(q){ return qCardHTML(q); }).join('') || '<div class="rv-empty">' + (!bankLecIds().length ? 'No lectures picked. Tick at least one in the lecture list.' : STATE.ui.qstatus === 'pinned' && !pinnedIds().length ? 'No pinned questions yet. Tap Pin on any question to save it here.' : 'No questions match these filters.') + '</div>';
    document.getElementById('qMore').hidden = qs.length <= bankShown;
  }
  wireLecPick(body, function(ids){ STATE.ui.qlec = ids.length === LECTURES.length ? 'all' : ids; bankShown = BANK_PAGE; saveState(); draw(); });
  document.getElementById('fSrc').onchange = function(e){ STATE.ui.qsrc = e.target.value; bankShown = BANK_PAGE; saveState(); renderBank(body); };
  document.getElementById('fFmt').onchange = function(e){ STATE.ui.qfmt = e.target.value; bankShown = BANK_PAGE; saveState(); draw(); };
  document.getElementById('fSt').onchange = function(e){ STATE.ui.qstatus = e.target.value; bankShown = BANK_PAGE; saveState(); renderBank(body); };
  var t; document.getElementById('fSearch').oninput = function(e){ bankSearch = e.target.value; clearTimeout(t); t = setTimeout(function(){ if(!document.body.contains(list)) return; bankShown = BANK_PAGE; draw(); }, 180); };
  body.querySelectorAll('[data-qorder]').forEach(function(b){ b.onclick = function(){
    STATE.ui.qorder = b.getAttribute('data-qorder'); saveState(); order = baseOrder(); renderBank.__shuf = STATE.ui.qorder === 'random' ? order : null; bankShown = BANK_PAGE;
    body.querySelectorAll('[data-qorder]').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    if(window.shTrack) window.shTrack('bank:order=' + STATE.ui.qorder); draw();
  }; });
  document.getElementById('fPinned').onclick = function(){ STATE.ui.qstatus = STATE.ui.qstatus === 'pinned' ? 'all' : 'pinned'; bankShown = BANK_PAGE; saveState(); renderBank(body); };
  /* the count follows pins at once; an unpinned card stays on screen until the list redraws, so it doesn't jump away mid-read */
  if(!renderBank.__pinsWired){ renderBank.__pinsWired = 1; document.addEventListener('sh:pins', function(e){ var n = document.getElementById('fPinN'); if(n) n.textContent = 'Pinned (' + e.detail.count + ')'; }); }
  document.getElementById('qMore').onclick = function(){ bankShown += BANK_PAGE; draw(); };
  draw();
}

function sectionCount(sec){

/* ===================================================================
   MOCK EXAM: 50 questions in 75 minutes (blueprint and limit are in the data above)
   =================================================================== */
function buildMock(){
  var ids = [];
  Object.keys(MOCK_BLUEPRINT).forEach(function(lec){
    var pool = (QUESTIONS_BY_LECTURE[lec]||[]).filter(function(q){ return q.type === 'mcq'; });
    var fresh = shuffled(pool.filter(function(q){ return !STATE.seen[q.id] || STATE.seen[q.id].last === false; }));
    var rest = shuffled(pool.filter(function(q){ return fresh.indexOf(q) === -1; }));
    fresh.concat(rest).slice(0, MOCK_BLUEPRINT[lec]).forEach(function(q){ ids.push(q.id); });
  });
  var order = {}; ids.forEach(function(id){ order[id] = choiceOrder(QUESTIONS_BY_ID[id]); });
  STATE.mock = { ids: shuffled(ids), t0: Date.now(), picks: {}, order: order, res: {}, submitted: false };
  saveState();
}
var mockTimer = null;
/* Exam-style: pick an answer for every question (no feedback), then Submit to score it and
   review each card. Picks are saved in STATE.mock so a reload keeps your place. */
function mockTotal(){ return Object.keys(MOCK_BLUEPRINT).reduce(function(n,k){ return n + MOCK_BLUEPRINT[k]; }, 0); }
function renderMock(body){
  clearInterval(mockTimer);
  var m = STATE.mock;
  if(m && !m.picks){ /* a mock started before exam mode: keep it only if it was already finished */
    if(m.ids && Object.keys(m.res||{}).length >= m.ids.length){ m.picks = {}; m.submitted = true; }
    else { STATE.mock = m = null; }
    saveState();
  }
  var total = mockTotal();
  if(!m || !m.ids || !m.ids.length){
    body.innerHTML = '<div class="reading" style="max-width:760px"><h2>Mock Exam</h2><p>'+total+' questions spread over all eight units, a few more for the longer lectures. The exam\'s length and format haven\'t been announced, so treat this as practice at pace. Two-statement, true/false, numbered-statement and matching items are included. Questions you haven\'t seen or missed last time are picked first.</p><p>It runs like a real exam: choose an answer for each question with no feedback, then submit. The clock counts against 75:00 (about 90 seconds a question) and turns red past it. Then review every card with its explanation.</p><div class="reading-actions"><button type="button" class="btn primary" id="mockStart">Start the '+total+'-question mock</button></div></div>';
    document.getElementById('mockStart').onclick = function(){ buildMock(); renderMock(body); };
    return;
  }
  var picked = Object.keys(m.picks).length;
  var correct = m.submitted ? m.ids.filter(function(id){ return m.res[id]; }).length : 0;
  var h = '<div class="qfilters" style="padding:4px 0"><span class="pill" id="mockClock">'+icon('clock')+'0:00</span>' +
    (m.submitted ? '<span class="pill countdown">Score '+correct+' / '+m.ids.length+' · '+Math.round(correct/m.ids.length*100)+'%</span>' +
                   '<button type="button" class="btn" id="mockMissed" aria-pressed="'+(!!m.onlyMissed)+'">'+(m.onlyMissed?'Show all questions':'Show only missed')+'</button>'
                 : '<span class="pill" id="mockProg">'+picked+' / '+m.ids.length+' answered</span><button type="button" class="btn primary" id="mockSubmit" data-mock-submit>Submit exam</button>') +
    '<button type="button" class="btn" id="mockNew">New mock</button></div>';
  if(m.submitted){
    h += '<div class="rv-table-wrap" style="margin-bottom:24px"><table class="rv-table"><thead><tr><th>Lecture</th><th>Correct</th><th>Score</th></tr></thead><tbody>' +
      Object.keys(MOCK_BLUEPRINT).map(function(lec){
        var qs = m.ids.filter(function(id){ return QUESTIONS_BY_ID[id] && QUESTIONS_BY_ID[id].lec === lec; });
        var c = qs.filter(function(id){ return m.res[id]; }).length;
        return '<tr><td>'+lecChip(lec)+'</td><td>'+c+' / '+qs.length+'</td><td>'+(qs.length?Math.round(c/qs.length*100):0)+'%</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  h += '<div class="qlist" id="mockList">' + m.ids.map(function(id, i){

    var order = (m.order && m.order[id]) || q.choices.map(function(c,k){ return k; });
    var choices = order.map(function(k){
      var cls = 'qcard-choice';
      if(m.submitted){ if(k === q.answer) cls += ' is-correct'; else if(k === pick) cls += ' is-wrong'; }
      else if(k === pick) cls += ' is-picked';
      return '<button type="button" class="'+cls+'" data-mock-pick="'+k+'" data-qid="'+id+'"'+(m.submitted?' disabled':'')+' aria-pressed="'+(k === pick)+'">'+escHtml(q.choices[k])+'</button>';
    }).join('');
    var verdict = !m.submitted ? '' : pick === null ? '<span class="qcard-verdict bad">Not answered.</span>' : m.res[id] ? '<span class="qcard-verdict ok">Correct.</span>' : '<span class="qcard-verdict bad">Missed.</span>';
    return '<div><div class="qcount" style="margin:0 0 4px">Question '+(i+1)+'</div>' +
      '<div class="qcard tag-'+tagOf(q.lec)+(m.submitted?' is-answered':'')+(m.submitted && !m.res[id]?' is-missed':'')+'" data-qid="'+q.id+'" data-qtype="mcq">' +
      '<div class="qcard-top">'+lecChip(q.lec)+'<span class="src-chip">'+escHtml(SRC_LABEL[q.src]||q.src)+'</span></div>' +
      figHTML(q) + pboxHTML(q) + '<p class="qcard-stem">'+escHtml(q.stem)+'</p><div class="qcard-choices">'+choices+'</div>' +
      '<div class="qcard-explain" data-role="explain">'+verdict+(m.submitted ? figAfterHTML(q) : '')+escHtml(q.ex||'')+(m.submitted ? whyHTML(q, pick === null ? [] : [pick]) : '')+cueHTML(q)+
        '<div class="qcard-classdata-row"><span class="qcard-classdata-result" data-role="classdata-result">Loading class data…</span></div></div>' +
      '</div></div>';
  }).join('') + '</div>';
  /* a second Submit at the bottom, so you don't have to scroll back up after the last question (2026-10-20) */
  if(!m.submitted) h += '<div class="mock-foot"><span class="pill" data-mock-prog>'+picked+' / '+m.ids.length+' answered</span><button type="button" class="btn primary" data-mock-submit>Submit exam</button></div>';

      b.parentNode.querySelectorAll('[data-mock-pick]').forEach(function(x){ x.classList.toggle('is-picked', x === b); x.setAttribute('aria-pressed', String(x === b)); });
      body.querySelectorAll('#mockProg, [data-mock-prog]').forEach(function(pr){ pr.textContent = Object.keys(m.picks).length + ' / ' + m.ids.length + ' answered'; });
      body.querySelectorAll('[data-mock-submit][data-confirm]').forEach(function(sb){ sb.removeAttribute('data-confirm'); sb.textContent = 'Submit exam'; });
    });

      m.submitted = true; m.tEnd = Date.now(); m.res = {};
      m.ids.forEach(function(id){
        var q = QUESTIONS_BY_ID[id]; if(!q) return;

      /* for the shared widget's trophies (a 90%+ mock on 20 or more questions) and its results card (widget/fx.js) */
      var nRight = m.ids.filter(function(id){ return m.res[id]; }).length;
      var byLec = Object.keys(MOCK_BLUEPRINT).map(function(lec){
        var l = LECTURE_BY_ID[lec], qs = m.ids.filter(function(id){ return QUESTIONS_BY_ID[id] && QUESTIONS_BY_ID[id].lec === lec; });

  } else {

  }
  document.getElementById('mockNew').onclick = function(){ STATE.mock = null; saveState(); renderMock(body); };
  var clock = document.getElementById('mockClock');
  function tick(){ if(!document.body.contains(clock)){ clearInterval(mockTimer); return; } var end = m.tEnd || Date.now(); var sec = Math.floor((end - m.t0)/1000); clock.innerHTML = icon('clock') + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0') + ' / 90:00'; clock.classList.toggle('is-over', sec > MOCK_LIMIT); }

  /* =================================================================== SORT STORM */
  function SortStorm(){
    var g = GAMES[0], root, stage, cardEl, bins, raf = null, last = 0;
    var st = null;
    function pickSet(){
      var choice = STATE.arcade.sortSet;
      if(choice !== 'mix'){ var s = SORT_SETS.filter(function(x){ return x.id === choice; })[0]; if(s) return s; }
      var pool = SORT_SETS.filter(function(x){ return !st || !st.set || x.id !== st.set.id; });
      return pool[Math.floor(Math.random()*pool.length)];
    }
    function newWave(){
      st.set = pickSet(); st.queue = shuffled(st.set.items).slice(0, 8); st.wave++;
      bins.forEach(function(b, i){ b.querySelector('span').textContent = st.set.bins[i]; });
      root.querySelector('.ss-banner').textContent = st.set.title.toUpperCase();
    }
    function nextCard(){
      if(!st.queue.length) newWave();
      st.cur = st.queue.shift(); st.y = 46; st.busy = false;
      cardEl.className = 'ss-card'; cardEl.style.transition = 'none'; cardEl.style.opacity = '1';
      cardEl.textContent = st.cur[0];
      cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
    }
    function floorY(){ return stage.clientHeight - 130 - cardEl.offsetHeight; }
    function pop(txt, color, x, y){ var p = document.createElement('div'); p.className = 'ss-pop'; p.style.color = color; p.style.left = x + 'px'; p.style.top = y + 'px'; p.textContent = txt; stage.appendChild(p); setTimeout(function(){ p.remove(); }, 800); }
    function judge(binIdx){
      if(!st || !st.running || st.busy || !st.cur) return;
      st.busy = true;
      var ok = binIdx === st.cur[1];
      var bin = bins[binIdx < 0 ? st.cur[1] : binIdx];
      if(binIdx >= 0){
        var dx = binIdx === 0 ? -stage.clientWidth/4 : stage.clientWidth/4;
        cardEl.style.transition = 'transform .22s ease-in, opacity .22s';
        cardEl.style.transform = 'translate(calc(-50% + '+dx+'px),' + (stage.clientHeight - 100) + 'px) scale(.6)';
        cardEl.style.opacity = '.2';
      }
      if(ok){
        st.combo++; st.correct++;
        var pts = 50 + Math.round(50 * Math.max(0, 1 - st.y / floorY())) ;
        pts *= (1 + Math.floor(st.combo / 4));
        st.score += pts; sGood();
        bin.classList.add('flash-good'); pop('+' + pts + (st.combo >= 4 ? ' x' + (1 + Math.floor(st.combo/4)) : ''), '#7ee36b', bin.offsetLeft + 20, bin.offsetTop - 20);
        if(st.correct % 6 === 0){ st.level++; st.speed += 9; pop('SPEED UP!', '#ffd23f', stage.clientWidth/2 - 50, 80); }
      } else {
        st.combo = 0; st.lives--; sBad();
        (binIdx >= 0 ? bins[binIdx] : bins[st.cur[1]]).classList.add('flash-bad');
        st.missed.push({ q: st.cur[0] + ' (' + st.set.title.replace('?','') + ')', a: st.set.bins[st.cur[1]] });
        pop(binIdx < 0 ? 'TOO SLOW' : 'MISS', '#ff5c8a', stage.clientWidth/2 - 30, st.y + 40);
      }
      hud(root, { score: st.score, lives: hearts(st.lives), level: st.level });
      setTimeout(function(){
        bins.forEach(function(b){ b.classList.remove('flash-good','flash-bad'); });
        if(!st || !st.running) return;
        if(st.lives <= 0) return over();
        nextCard();
      }, binIdx < 0 ? 450 : 260);
    }
    function loop(t){
      if(!st || !st.running) return;
      var dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
      if(!st.busy && st.cur){
        st.y += (st.fast ? st.speed * 4 : st.speed) * dt;
        cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
        if(st.y >= floorY()) judge(-1);
      }
      raf = requestAnimationFrame(loop);
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      st = { running:true, score:0, lives:3, level:1, combo:0, correct:0, speed:52, wave:0, set:null, queue:[], missed:[], fast:false };
      hud(root, { score:0, lives:hearts(3), level:1 });

    }
    function over(){

    }
    function onKeyUp(e){ if(st && (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S')) st.fast = false; }
    return {
      mount: function(p){
        var opts = '<option value="mix"'+(STATE.arcade.sortSet==='mix'?' selected':'')+'>Shuffle all sorts</option>' + SORT_SETS.map(function(s){ return '<option value="'+s.id+'"'+(STATE.arcade.sortSet===s.id?' selected':'')+'>'+escHtml(s.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="ssSet">Sort:</label><select id="ssSet">'+opts+'</select>',
          '<div class="gm-stage ss-stage"><div class="ss-banner"></div><div class="ss-card" id="ssCard"></div><div class="ss-danger"></div><div class="ss-bins"><button type="button" class="ss-bin" style="--bc:var(--ar-yellow)" data-bin="0"><span></span><kbd>← / A</kbd></button><button type="button" class="ss-bin" style="--bc:var(--ar-pink)" data-bin="1"><span></span><kbd>→ / D</kbd></button></div>' +
            overlayHTML(g, 'FEEDBACK SORT', 'Each card belongs in one of two bins. Press ← or → (or tap a bin) before it crosses the dashed line. Hold ↓ to drop faster for bonus points. Streaks of 4 multiply your score.', 'START') + '</div>',
          '<kbd>←</kbd> <kbd>→</kbd> sort · <kbd>↓</kbd> fast drop · tap a bin on mobile');
        root = p.querySelector('.gm'); stage = p.querySelector('.ss-stage'); cardEl = p.querySelector('#ssCard'); bins = [].slice.call(p.querySelectorAll('.ss-bin'));
        var preview = SORT_SETS.filter(function(s){ return s.id === STATE.arcade.sortSet; })[0] || SORT_SETS[0];
        bins.forEach(function(b,i){ b.querySelector('span').textContent = preview.bins[i]; });
        cardEl.textContent = '?';
        bindCommon(root);
        stage.addEventListener('click', function(e){ var b = e.target.closest('[data-bin]'); if(b) judge(+b.getAttribute('data-bin')); if(e.target.closest('[data-start]')) start(); });
        p.querySelector('#ssSet').addEventListener('change', function(e){ STATE.arcade.sortSet = e.target.value; saveState(); if(st && st.running){ st.set = null; st.queue = []; } var s = SORT_SETS.filter(function(x){ return x.id === e.target.value; })[0]; if(s) bins.forEach(function(b,i){ b.querySelector('span').textContent = s.bins[i]; }); });
        document.addEventListener('keydown', onKey); document.addEventListener('keyup', onKeyUp);
      },
      stop: function(){ if(st) st.running = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onKeyUp); }
    };
  }

  return { renderLobby:renderLobby, stopAll:stopAll, startGame:startGame, current:function(){ return active ? activeId : null; } };
})();

/* ---------- theme toggle ---------- */
function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
}
function boot(){
  /* sh_theme is the site-wide choice shared with the dashboard */
  var saved = null; try{ saved = localStorage.getItem('sh_theme'); }catch(e){}
  if(saved !== 'light' && saved !== 'dark') saved = null;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  applyTheme(saved);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = !cur ? 'light' : cur === 'light' ? 'dark' : null;
    try{ localStorage.setItem('sh_theme', next || ''); }catch(e){}
    applyTheme(next);
  });
  document.querySelectorAll('#modeSwitch [data-mode]').forEach(function(b){ b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); }); });
  renderHeaderStats();
  var m = STATE.ui.mode; if(['home','compendium','review','arcade'].indexOf(m) === -1) m = 'home';
  setMode(m);
}
/* Section label for the shared widget's per-section time tracking (adds the arcade game). */
window.SH_SECTION = function(){
  var m = STATE.ui.mode;
  if(m === 'home') return 'home/dashboard';
  if(m === 'compendium') return 'compendium/' + STATE.ui.sub;
  if(m === 'review') return 'review/' + STATE.ui.group;
  if(m === 'arcade') return 'arcade/' + (ARCADE.current() || 'lobby');
  return m;
};
/* the markup above is already parsed, so render now; the deferred widget and supabase scripts load after */
boot();

/* ---------- full-content search for the shared widget: every note paragraph, review row,
   exam hint and cram line, each with a place to jump to (window.SH_GOTO) ---------- */
function shSearchSections(){
  var out = [];
  function frag(html){ var d = document.createElement('div'); d.innerHTML = html || ''; return d; }
  function clean(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  LECTURES.forEach(function(l){
    var where = lecLabel(l) + ' ' + l.title;
    Array.prototype.forEach.call(frag(READINGS[l.id]).querySelectorAll('p, li, h3, h4'), function(el, k){
      var t = clean(el.textContent); if(t.length > 2) out.push({ kind:'Notes', where:where, text:t, lec:l.id, go:{ v:'notes', lec:l.id, k:k } });
    });
    (CRAM[l.id] || []).forEach(function(b){ out.push({ kind:'Cram sheet', where:where, text:b, lec:l.id, go:{ v:'cram', lec:l.id } }); });
  });
  HINTS.forEach(function(x){ var l = LECTURE_BY_ID[x.lec]; out.push({ kind:'Exam hints', where:l ? ''+lecLabel(l)+' '+l.title : '', text:clean(x.quote + ' ' + x.take), lec:x.lec, go:{ v:'hints', lec:x.lec } }); });
  REVIEW.forEach(function(g){
    g.sections.forEach(function(sec){
      if(sec.type === 'cards') sec.items.forEach(function(c){ out.push({ kind:'Review', where:g.title, title:c.name, text:clean(c.name + ' ' + c.sub + ' ' + c.facts.map(function(f){ return f[0] + ': ' + f[1]; }).join('; ') + ' ' + c.tip), go:{ v:'review', q:c.name } }); });
      else if(sec.type === 'table') sec.rows.forEach(function(r){ out.push({ kind:'Review', where:g.title + (sec.title ? ' · ' + sec.title : ''), title:r[0], text:clean(r.join(' · ')), go:{ v:'review', q:r[0] } }); });
      else if(sec.type === 'list') sec.items.forEach(function(it){ out.push({ kind:'Review', where:g.title, text:clean(it), go:{ v:'review', q:clean(it).split(' ').slice(0, 4).join(' ') } }); });
    });
  });
  SEQUENCES.forEach(function(sq){ var sg = REVIEW.filter(function(x){ return x.lec === sq.lec; })[0]; out.push({ kind:'Review', where:(sg ? sg.title + ' · ' : '') + 'Processes', title:sq.title, text:clean(sq.title + ': ' + sq.steps.join(' → ')), go:{ v:'review', q:sq.title } }); });
  return out;
}
function shFlashIn(sel){ setTimeout(function(){ var el = typeof sel === 'string' ? document.querySelector(sel) : sel(); if(el && window.shFlash) window.shFlash(el); }, 60); }
window.SH_GOTO = function(g){
  if(!g) return;
  if(g.v === 'notes'){ STATE.ui.lec = g.lec; STATE.ui.sub = 'notes'; STATE.ui.level = 'full'; saveState(); setMode('compendium');
    shFlashIn(function(){ var p = document.querySelector('#compBody .reading-prose'); return p && Array.prototype.filter.call(p.querySelectorAll('p, li, h3, h4'), function(el){ return !el.closest('[data-sh-noread]'); })[g.k]; }); }
  else if(g.v === 'cram'){ STATE.ui.sub = 'cram'; saveState(); setMode('compendium'); shFlashIn('#cram-' + g.lec); }
  else if(g.v === 'hints'){ STATE.ui.sub = 'hints'; saveState(); setMode('compendium');
    shFlashIn(function(){ var a = document.querySelector('#compBody .hint-group [data-lec="' + g.lec + '"]'); return a && a.closest('.hint-group'); }); }
  else if(g.v === 'review'){ reviewSearch = g.q || ''; setMode('review'); }
  else if(g.v === 'bank'){ STATE.ui.sub = 'bank'; STATE.ui.qlec = 'all'; STATE.ui.qsrc = 'all'; STATE.ui.qfmt = 'all'; STATE.ui.qstatus = 'all'; bankSearch = g.q || ''; bankShown = BANK_PAGE; saveState(); setMode('compendium'); }
};

/* Progress sync (widget/v3.js, migration_v34): the widget reads back every answer saved for you on the server,
   including from your linked devices, and hands each question's totals here. Keep whichever copy has more tries,
   so answers made only on this device are never lost. */
var SYNC_LOADED = Date.now();
window.SH_SYNC = {
  merge: function(byQid, days){
    var changed = false, added = 0;
    Object.keys(byQid).forEach(function(id){
      var q = QUESTIONS_BY_ID[id]; if(!q) return;
      var sv = byQid[id], s = STATE.seen[id] || { n:0, c:0, last:null };
      if(sv.n <= s.n) return;
      var dn = sv.n - s.n, dc = Math.max(0, sv.c - s.c);
      if(!s.n) added++;
      STATE.totalAnswered += dn; STATE.totalCorrect += dc;
      var ls = STATE.lecStats[q.lec] || { a:0, c:0 }; ls.a += dn; ls.c += dc; STATE.lecStats[q.lec] = ls;
      STATE.seen[id] = { n:sv.n, c:Math.max(sv.c, s.c), last:sv.last };
      changed = true;
    });
    (days || []).forEach(function(d){ if(STATE.days.indexOf(d) === -1){ STATE.days.push(d); changed = true; } });
    if(!changed) return;
    STATE.days.sort();
    checkAchievements(); saveState(); renderHeaderStats();
    if(added) toast('Synced ' + added + ' question' + (added === 1 ? '' : 's') + ' from your other devices', 'check');
    /* redraw the page only right after it opens, so nobody loses a question they're in the middle of */
    if(Date.now() - SYNC_LOADED < 8000 && !(window.shTTS && window.shTTS.listening && window.shTTS.listening())){ if(STATE.ui.mode === 'home') renderHome(); else if(STATE.ui.mode === 'compendium' && STATE.ui.sub !== 'mock') renderCompendium(); }
  }
};

/* Daily drill (widget/drill.js): the widget picks each day's questions from this pool and asks the hub to
   draw each card, so answers go through recordAnswer like anywhere else. */
window.SH_DRILL = {
  pool: function(){
    return QUESTIONS.map(function(q){ var s = STATE.seen[q.id]; return { id:q.id, lec:q.lec, last: s ? !!s.last : null, hy: DRILL_HY[q.src] || '' }; });
  },
  render: function(el, qid){ var q = QUESTIONS_BY_ID[qid]; if(!q) return false; el.innerHTML = qCardHTML(q, { ctx:'drill' }); wireQuestionContainer(el); return true; }
};

/* Published for the shared widget (search + toughest-questions labels) — see widget/v3.js. */
window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id:l.id, title:''+lecLabel(l)+' ' + l.title, who:l.who, status:l.status }; }),
  questions: QUESTIONS.map(function(q){
    var hint = q.type === 'mcq' ? q.choices[q.answer] : q.type === 'multi' ? q.correct.map(function(k){ return q.choices[k]; }).join('; ') : q.type === 'sequence' ? q.steps.join(' → ') : q.pairs.map(function(p){ return p.join(': '); }).join('; ');
    if(q.ex) hint += ' — ' + q.ex;
    return { id:q.id, lec:q.lec, text:q.stem, hint:hint, choices:q.choices || null, answer:(q.type === 'mcq' ? q.answer : null) };
  }),
  sections: shSearchSections(),
  hints: HINTS.map(function(x){ return { lec:x.lec, quote:x.quote }; }),
  exams: [ { label:'Special Patient Care exam', date:EXAM_END, archiveHour:24 } ]
};

})();
