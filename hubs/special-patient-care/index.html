riodontal disease that demands prevention.</p>\n", "cp": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What CP is, its causes (prenatal, neonatal, postnatal, TORCH) and prevalence</li><li>Types of CP and their movements; the limb terms</li><li>Intellect: most have normal or near-normal cognition</li><li>Medical conditions: epilepsy and seizure management, status epilepticus, medications (Dilantin, Depakote, bisphosphonates), dysphagia, GERD, drooling, dysarthria</li><li>Consent in a patient who can't speak well</li><li>Oral findings and treatment; g-tube calculus</li><li>Home care, wheelchair transfer and positioning</li></ul></div>\n<p>Dr. Mitchell's cerebral palsy lecture (with Dr. John Thornton) comes in four sections: introduction and types, medical conditions, oral health, and prevention with wheelchair care. Goals: describe causes and types, obtain consent, identify oral conditions, manage the airway and gag reflex, plan treatment, and care for a patient in a wheelchair.</p>\n<h4>What CP is</h4>\n<p>A <b>neuromuscular disorder affecting voluntary muscle movement and posture</b>. It is <b>permanent</b> (they won't grow out of it) and <b>non-progressive</b> (a child with stiff legs and normal hands will be a teenager with stiff legs and normal hands). It is caused in the <b>first years of life</b> by abnormal development or <b>damage to the brain</b> before birth, during delivery, or soon after. An injury at 5 or 15 may mimic CP, but it isn't CP.</p>\n<h4>How common</h4>\n<p>The <b>most common motor disorder in children</b>: about <b>1 in 303</b> children, 0.2% of live births. Risk rises as <b>birth weight falls</b> (59 per 1,000 under 3.3 lb vs 1.3 per 1,000 over 5.5 lb) and as <b>gestation shortens</b> (43 per 1,000 before 28 weeks vs 1.3 per 1,000 at 37 weeks or more). Among 8-year-olds (CDC), the average was 3.1 per 1,000; Alabama 3.2, Georgia highest at 3.6.</p>\n<h4>Causes</h4>\n<ul><li><b>Prenatal: 70-80%</b>. Prematurity; intrauterine infections; viral infections (about 5% of CP), notably the <b>TORCH</b> infections (<b>To</b>xoplasmosis, <b>R</b>ubella, <b>C</b>ytomegalovirus, <b>H</b>erpes), a term Dr. Mitchell \"could see popping up on a board\"; <b>multiple embryos</b> (twins, triplets); intracranial hemorrhage; radiation and drugs.</li><li><b>Neonatal: 10-28%</b>. <b>Hypoxia</b> (hypoxic-ischemic encephalopathy) was once thought the main cause; it is now known to be a small share. Mechanical ventilation of premature babies; trouble regulating blood pressure.</li><li><b>Postnatal: 5-18%</b> (closer to 5%). Trauma in the first years (<b>shaken baby syndrome</b>, abusive head trauma, <b>drowning</b>), infections (encephalitis, meningitis), toxins, brain tumors.</li></ul>\n<h4>Types</h4>\n<p><b>Spastic CP (70-80%)</b>: <b>cerebral cortex</b> damage reduces motor control. Muscles are <b>stiff</b>, almost constantly contracted, with <b>hypertonicity</b> (increased tone: a wiry, strong build), <b>hyperreflexia</b> (overreactive reflexes) and <b>contractures</b> (muscles and tendons lose elasticity, limiting joint motion and curling the hands). <b>Startling stimuli</b>, such as loud noises, can trigger spasms.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Term</th><th>Limbs involved</th></tr></thead><tbody>\n<tr><td>Hemiplegia</td><td>Arm and leg on the same side</td></tr>\n<tr><td>Quadriplegia</td><td>All four, arms worse than in diplegia</td></tr>\n<tr><td>Diplegia</td><td>Legs, with minimal arm involvement</td></tr>\n<tr><td>Monoplegia</td><td>One limb (rare)</td></tr>\n<tr><td>Paraplegia</td><td>Only the legs</td></tr>\n<tr><td>Triplegia</td><td>Any three</td></tr>\n</tbody></table></div>\n<p><b>Dyskinetic CP (10-20%)</b>: lesions in the <b>basal ganglia</b> cause <b>involuntary, non-rhythmic</b> movements of three kinds: <b>athetosis</b> (slow, uncontrolled twisting and writhing), <b>dystonic tremor</b> (mixed tone: opposing muscles contract at once, so the shake comes with trying to move, unlike Parkinson's rest tremor), and <b>chorea</b> (fast movements).</p>\n<p><b>Ataxic CP (5-10%)</b>: a <b>cerebellum</b> lesion: <b>lack of coordination</b>, poor balance when walking (walkers are common), poor hand-eye coordination, intention tremors.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Type</th><th>Share</th><th>Brain area</th><th>Movement</th></tr></thead><tbody>\n<tr><td>Spastic</td><td>70-80%</td><td>Cerebral cortex</td><td>Stiff muscles: hypertonicity, hyperreflexia, contractures; startled by loud noises</td></tr>\n<tr><td>Dyskinetic</td><td>10-20%</td><td>Basal ganglia</td><td>Involuntary movements: athetosis (slow writhing), dystonic tremor, chorea (fast)</td></tr>\n<tr><td>Ataxic</td><td>5-10%</td><td>Cerebellum</td><td>Poor coordination and balance, intention tremor</td></tr>\n<tr><td>Mixed</td><td></td><td>More than one area</td><td>A mix</td></tr>\n</tbody></table></div>\n<h4>Intellect: \"maybe my most important slide\"</h4>\n<p><b>Most people with CP have normal or near-normal intellect.</b> About <b>30-50% have normal cognition</b>, about <b>45% mild ID</b>, and only about <b>15% severe ID</b>. ID is more common with greater motor involvement and in spastic CP. <b>Never assume a cognitive disability</b> because someone struggles to speak: Daniel, the class case, is as smart as anyone in the room.</p>\n<h4>Medical conditions: epilepsy</h4>\n<p><b>Epilepsy</b> in about <b>30%</b> of people with CP vs about 2.5% of the general population; <b>tonic-clonic</b> seizures are most common. It raises the risk of dental trauma and of a seizure during treatment, and the medications affect care.</p>\n<p><b>Managing a seizure in the chair</b>: <b>Stop</b> the procedure; <b>Remove</b> everything from the mouth; turn the patient on their <b>Side</b> (so vomit isn't aspirated); make sure they are <b>Safe</b> (nothing to hit, can't fall); <b>Allow</b> the seizure to run its course, which should end in under five minutes; then complete only urgent treatment (temporize) and <b>Release</b> them home, exhausted.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Step</th><th>Do</th></tr></thead><tbody>\n<tr><td>Stop</td><td>Stop the procedure</td></tr>\n<tr><td>Remove</td><td>Take everything out of the mouth</td></tr>\n<tr><td>Side</td><td>Turn the patient on the side (aspiration)</td></tr>\n<tr><td>Safe</td><td>Keep them from falling or hitting anything</td></tr>\n<tr><td>Allow</td><td>Let it run its course: it should end in under 5 minutes</td></tr>\n<tr><td>Release</td><td>Finish only urgent work, then send them home</td></tr>\n</tbody></table></div>\n<p><b>Status epilepticus</b> is the emergency: a single seizure <b>lasting more than five minutes</b>, or <b>two or more within five minutes</b> without returning to normal between them. Activate <b>EMS</b>, monitor the airway and breathing (oxygen), and if the patient collapses, provide <b>BLS</b> until EMS arrives.</p>\n<p><b>Dental trauma</b> from seizures (fractures, avulsions) is treated much as in anyone, but factor in tolerance: can a reimplanted avulsed tooth's root canal be done? Can complex resin restorations be maintained?</p>\n<h4>Medications</h4>\n<ul><li><b>Dilantin (phenytoin)</b>: <b>gingival hyperplasia</b>. Not used much anymore; most newer drugs don't cause it. Consult the physician about switching; frequent cleanings and excellent home care; refer to a periodontist periodically for resection. If hygiene can't be controlled (often), <b>delay</b> resection, because the tissue grows back fast. Send when there is a risk or occurrence of <b>periodontal infection</b>, or the tissue <b>grows over the occlusal surfaces</b>. Methods: modified flap (CP patients can't manage periodontal packing), electrocautery, lasers; it often needs sedation.</li><li><b>Depakote (valproic acid)</b>: risk of <b>thrombocytopenia</b> and bleeding.</li><li><b>Bisphosphonates</b> (for osteoporosis or osteopenia in CP): risk of <b>osteonecrosis</b> of alveolar bone; caution with extractions, consult the physician, lean toward the oral surgeon.</li></ul>\n<h4>Dysphagia, GERD and drooling</h4>\n<p><b>Dysphagia</b>: abnormal swallowing with a delayed reflex, giving a <b>sensitive gag reflex</b> and coughing, choking and aspiration risk. Protect the airway: often <b>don't lay them back fully</b>, suction often, and use water <b>intermittently</b> in short bursts. They are not being uncooperative; they can't swallow the liquid.</p>\n<p><b>GERD</b> in <b>over 50%</b>, and many can't say they have heartburn. <b>Dental erosion may be the first sign</b>: a <b>scooped-out</b> appearance, unlike the <b>flat</b> wear of bruxism. Refer to the physician. If the teeth are symptomatic, restore; if not, <b>don't restore until after the GERD is resolved</b> (it may never need it, and restoring sooner just fails).</p>\n<p><b>Drooling</b> in <b>10-40%</b>, caused by <b>dysphagia</b>, <b>not hypersalivation</b>. It carries stigma (bibs, towels). Reducing saliva should be a <b>last resort</b>: <b>Botox</b> injections (wear off), <b>anticholinergics</b> (scopolamine, glycopyrrolate), or surgery (ligating the parotid duct, excising the submandibular gland). There is no clear evidence it helps, and the dry mouth can cause <b>rampant caries and tooth loss</b>. Saliva is protecting the patient.</p>\n<h4>Speech and consent</h4>\n<p><b>Dysarthria</b> (difficulty articulating) is present in up to <b>88%</b>: slow, poorly pronounced words. It does <b>not</b> indicate cognitive capacity. Always speak to a person with CP assuming normal cognition. Some use speech devices (Daniel types with a head wand; tablets now do the same far more cheaply).</p>\n<p>Since most have normal or near-normal cognition, <b>most consent to their own treatment</b>: some can sign; most can give <b>verbal consent witnessed</b> by a second party; others use a code (one blink = yes, looking down = no) or a communication device. Only if low functioning does a caregiver consent. <b>Unless very low functioning, they have the right to refuse treatment.</b></p>\n<h4>Oral and facial features</h4>\n<ul><li><b>Long, narrow face (dolichofacial)</b>: weak muscles allow excess vertical growth; the palatal, occlusal and mandibular planes are <b>hyperdivergent</b>.</li><li><b>Open bite</b>, maintained (not caused) by <b>tongue thrust</b>.</li><li><b>Flared (procumbent) incisors</b> and <b>increased overjet</b>, with <b>mandibular retrusion</b>.</li><li><b>Class II</b> malocclusion, usually <b>skeletal</b> (retrognathic mandible).</li><li><b>Trauma</b>: unprotected incisors (overjet, procumbent) plus falls (poor balance) and epilepsy mean more <b>avulsions and incisor fractures</b>.</li></ul>\n<p>Orthodontics is often not tolerated: appliances, monthly visits, the gag reflex, and caries around brackets can outweigh the benefit. No contraindication beyond tolerance and hygiene.</p>\n<h4>Caries, perio and wear</h4>\n<p><b>Caries</b> rates are a little higher: poor hygiene, <b>soft diet</b>, <b>enamel hypoplasia</b>, <b>mouth breathing</b>, <b>anti-drooling medications</b>, and food held in the mouth longer because of dysphagia. Treatment: fast-set alginate if you take impressions (digital impressions may open doors); <b>stainless steel crowns</b> instead of cast crowns; resin only with good isolation; <b>RMGI</b> where not in function; <b>amalgam</b> where function matters.</p>\n<p><b>Periodontal disease</b> is up to <b>3 times more common</b>, but there is <b>no more calculus</b> than usual: it's plaque that isn't removed. The exception is a patient fed by <b>g-tube</b>, who builds <b>heavy calculus</b>: remove it (often ultrasonic) from the buccal and lingual, but <b>leave it on the occlusal table</b>, where it protects. Regular cleanings (3 months, even monthly), hand or ultrasonic scaling with controlled water, cleaning in pulses, and long-term <b>chlorhexidine</b> (staining) <b>brushed on</b> with a dipped toothbrush for 30-60 seconds, since many can't rinse and spit.</p>\n<p><b>Bruxism</b> in <b>58%</b>: flat wear (not scooped); <b>pulp exposures are rare</b> because wear is slow; worse with lower muscle and cognitive function. <b>Erosion and hypoplasia</b> in <b>25-35%</b> (GERD, developmental): hypoplastic enamel attracts plaque and calculus, is lost faster, can be sensitive, and may need full coverage sooner.</p>\n<p><b>What's normal in CP</b>: the number of teeth (no more missing or extra), eruption timing, and tongue size.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Finding</th><th>Detail</th></tr></thead><tbody>\n<tr><td>Face</td><td>Long and narrow (dolichofacial): weak muscles, hyperdivergent planes</td></tr>\n<tr><td>Malocclusion</td><td>Open bite (kept open by tongue thrust), flared incisors, more overjet, Class II with a retrusive mandible</td></tr>\n<tr><td>Trauma</td><td>Avulsions and incisor fractures: unprotected incisors plus falls and seizures</td></tr>\n<tr><td>Caries</td><td>A little higher: hygiene, soft diet, hypoplasia, mouth breathing, anti-drooling drugs, food held in the mouth</td></tr>\n<tr><td>Periodontal disease</td><td>Up to 3x more common; no more calculus, except g-tube patients</td></tr>\n<tr><td>Bruxism</td><td>58%; flat wear; pulp exposures rare</td></tr>\n<tr><td>Erosion and hypoplasia</td><td>25-35%; GERD and developmental</td></tr>\n<tr><td>Normal</td><td>Number of teeth, eruption times, tongue size</td></tr>\n</tbody></table></div>\n<h4>Prevention and home care</h4>\n<p>Prevention is key. Many lack the hand-eye coordination to brush; those living alone may have no help; group homes and families help inconsistently, so educate caregivers and modify the aids. Commercial options: fat-handled brushes, the <b>Surround</b> three-headed toothbrush, the Reach flosser, hand straps. Homemade: push the brush through a <b>tennis ball</b>, wrap <b>foam</b> or a <b>washcloth with rubber bands</b> around the handle (or putty, acrylic); <b>lengthen</b> the handle with tongue blades for a patient who can't bring the hand close to the mouth.</p>\n<p><b>What doesn't help</b>: <b>Waterpik</b>, <b>disclosing tablets</b> (messy with drooling and poor rinsing), and <b>mouth rinses</b> (most can't rinse and spit).</p>\n<h4>Wheelchairs</h4>\n<p>Many arrive in wheelchairs. If moving them to the dental chair, <b>let the caregivers transfer them</b>. Lifts help: ceiling lifts, electric or manual hydraulic lifts (the harness stays under the patient). You can also <b>treat from the wheelchair</b>: back it up next to the dental chair, <b>lock the wheels</b> (a 300-pound electric chair can roll onto your foot), and use the tilt mechanism. You can't raise or lower the patient. You may need to leave the patient at about <b>45 degrees</b> because of dysphagia.</p>\n<p>Summary: CP is non-progressive and present from birth; muscle control is most affected; most have normal or near-normal cognition, and they understand far more than they can say; guard the airway and limit water; prevention is key.</p>\n", "syndromes": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Descriptive terms: the -dactylies, eye terms, glossoptosis, spine curves, meningocele, dolichocephaly vs brachycephaly</li><li>Fragile X: the gene, why boys, the features</li><li>Prader-Willi: the deletion, appetite, behavior, dental concerns</li><li>Tuberous sclerosis: findings depend on where the tumors are</li><li>Apert syndrome: craniosynostosis and its oral features</li><li>Lesch-Nyhan: self-injury and full-mouth extractions</li><li>Pierre Robin sequence: the airway</li><li>Fetal alcohol syndrome and Cornelia de Lange: faces and behavior</li></ul></div>\n<p>Instead of one common condition, this lecture covers several less common syndromes and the terms used to describe them. You won't remember them all: keep the reference reading handy and learn to <b>look things up quickly</b>, which Dr. Mitchell calls an incredibly important skill in this field.</p>\n<h4>Terms for the hands</h4>\n<p><b>-dactyly</b> always means fingers or toes. <b>Brachydactyly</b>: <b>short</b> fingers (like bradycardia is slow, brachy is short). <b>Syndactyly</b>: an abnormal <b>fusion</b> of the bones of the hands or feet (the right number, joined together). <b>Clinodactyly</b>: a permanent <b>deflection</b> (bend) of one or more fingers. <b>Ectrodactyly</b>: congenital <b>absence</b> of one or more fingers or toes (bones actually missing). <b>Polydactyly</b>: <b>more than five</b> digits on a hand or foot, sometimes just a small extra appendage.</p>\n<h4>Terms for the eyes</h4>\n<p><b>Coloboma</b>: a <b>hole</b> in a structure of the eye (iris, retina, choroid or optic disc); in syndromes it usually means the iris, the one a dentist can see. <b>Miosis</b>: a <b>constricted</b> pupil; <b>mydriasis</b>: a <b>dilated</b> pupil. <b>Strabismus</b>: an eye out of alignment, \"cross-eyed.\" <b>Hypertelorism</b>: an abnormal distance between two paired organs, usually <b>wide-set eyes</b>: in the embryo the eyes start wide and move toward the midline, and if facial development stops early they stay apart.</p>\n<h4>Tongue, spine and face</h4>\n<p><b>Glossoptosis</b>: the tongue is displaced <b>downward and retracted</b>. It can get in the way of the palatal shelves and cause <b>cleft palate</b>, and it can block the <b>airway</b>. A feature of the <b>Pierre Robin sequence</b> and Down syndrome.</p>\n<p><b>Scoliosis</b>: the spine curves <b>sideways</b>, <b>C-shaped</b> (the head ends near the midline) or <b>S-shaped</b> (the head ends off to the side). <b>Kyphosis</b>: the spine curves with convexity <b>backward</b>, bending the patient forward. Both, especially kyphosis, mean the head won't reach the headrest: support it with pillows.</p>\n<p><b>Meningomyelocele</b>: the meninges <b>and part of the spinal cord</b> herniate through an opening in the spine (as in spina bifida), seen as a bulge on the back. <b>Meningocele</b>: only the <b>meninges</b> herniate, with fluid.</p>\n<p><b>Dolichocephaly</b> (like dolichofacial): a <b>long, narrow face</b>, with the palatal, occlusal and mandibular planes <b>diverging</b> (hyperdivergent): such a child keeps growing longer. <b>Brachycephaly</b>: a <b>short, square face</b> with a strong, <b>flat jaw line</b> and nearly parallel planes; less common in syndromes.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Term</th><th>Means</th></tr></thead><tbody>\n<tr><td>Brachydactyly</td><td>Short fingers</td></tr>\n<tr><td>Syndactyly</td><td>Fused fingers or toes (the right number of bones, joined)</td></tr>\n<tr><td>Clinodactyly</td><td>Permanent deflection (bend) of one or more fingers</td></tr>\n<tr><td>Ectrodactyly</td><td>Congenital absence of one or more fingers or toes</td></tr>\n<tr><td>Polydactyly</td><td>More than five digits on a hand or foot</td></tr>\n<tr><td>Coloboma</td><td>A hole in a structure of the eye (iris, retina, choroid, optic disc); usually the iris</td></tr>\n<tr><td>Miosis / mydriasis</td><td>Constricted pupil / dilated pupil</td></tr>\n<tr><td>Strabismus</td><td>Misaligned eye: cross-eyed</td></tr>\n<tr><td>Hypertelorism</td><td>Abnormal distance between paired organs; usually wide-set eyes</td></tr>\n<tr><td>Glossoptosis</td><td>Tongue displaced downward and retracted; can cause cleft palate; Pierre Robin and Down syndrome</td></tr>\n<tr><td>Scoliosis</td><td>Spine curved sideways (C-shaped or S-shaped)</td></tr>\n<tr><td>Kyphosis</td><td>Spine curved with convexity backward (bent forward)</td></tr>\n<tr><td>Meningomyelocele / meningocele</td><td>Herniation with spinal cord / meninges only</td></tr>\n<tr><td>Dolichocephaly</td><td>Long, narrow face; hyperdivergent planes</td></tr>\n<tr><td>Brachycephaly</td><td>Short, square face; strong, flat jaw line; parallel planes</td></tr>\n</tbody></table></div>\n<h4>Fragile X syndrome</h4>\n<p>A genetic syndrome from changes in the <b>FMR1</b> gene on the <b>X chromosome</b>: a small part of the code is <b>repeated</b> over and over, and the more repeats, the more likely the symptoms. <b>Most common in boys</b>: with one X, an affected X shows fully (a <b>dosing effect</b>). Girls have two Xs, only one active; if the affected X is the one turned off, there are few or no symptoms, and if the healthy one is turned off, a girl can show the disease.</p>\n<p>Features: <b>delayed crawling and walking</b>, <b>hand flapping</b> and <b>avoiding eye contact</b> (autistic behaviors; some consider it part of the autism spectrum), hyperactivity or impulsiveness, mental delay, speech delay, a <b>long face with a prominent jaw</b>, and flat feet. Dr. Thornton liked to point out that some have suggested Billy the Kid had fragile X. Resource: the National Fragile X Foundation.</p>\n<h4>Prader-Willi syndrome</h4>\n<p>Caused by a <b>deletion</b> of function of part of <b>chromosome 15 (15q)</b>. Normally only the <b>paternal</b> copy of these genes is turned on and the maternal copy is silent. In <b>70%</b> of cases the critical paternal genes are <b>deleted</b>, and the maternal copy, though present, is not turned on. Most cases are <b>new mutations</b>, not inherited.</p>\n<p>The hallmark is an <b>insatiable appetite</b>, leading to <b>obesity</b> (families lock the refrigerator). <b>Mild to moderate</b> intellectual impairment, similar to Down syndrome, but different behavior: <b>temper outbursts, stubbornness and compulsive behavior</b> (patients with Down syndrome tend to be passive). They may be <b>insensitive to pain</b>: procedures can be easier, but a tooth that would hurt anyone else may go unreported. Physical features: obesity, <b>poor muscle tone</b> (feeding difficulties, food held in the mouth), narrow forehead, almond-shaped eyes, a <b>triangular mouth</b> (thin upper lip, downturned corners), short stature, small hands and feet.</p>\n<p><b>Dental concerns</b>: obesity makes <b>sedation</b> risky (general anesthesia may be safer than deep sedation; watch the airway); behavioral outbursts (many are very manageable); <b>decreased, viscous saliva</b>, so <b>heavy calculus</b>, more <b>caries</b> (overeating adds to it) and <b>gingivitis</b>; a <b>high-arched palate</b>.</p>\n<h4>Tuberous sclerosis</h4>\n<p>A very rare <b>single-gene</b> disorder (inherited or new) that grows <b>benign tumors throughout the body</b>. What you see depends on <b>where the tumors are</b>: <b>brain</b> (cognitive disability, <b>seizures</b>, ADHD; seizure drugs can cause <b>gingival overgrowth</b>), <b>kidney</b> (impaired function, affecting how you dose local anesthetic), <b>skin</b> (light-colored patches; facial growths resembling acne), and the <b>mouth</b> (weakened enamel if tumors form while teeth develop, and <b>gingival fibromas</b> or overgrowth).</p>\n<h4>Apert syndrome</h4>\n<p>A genetic disorder of skull development, almost always a <b>new mutation</b>, about <b>1 in 65,000</b> births. The skull and facial bones fuse too early (<b>craniosynostosis</b>), giving <b>dolichocephaly</b>, <b>hypertelorism</b> and <b>midface deficiency</b>. Also <b>syndactyly</b> (webbed or mitten-like hands and feet), <b>obstructive sleep apnea</b> (midface-deficient patients struggle with the airway), ear and sinus infections, and hearing loss. Oral features: <b>severe crowding</b>, a <b>highly arched palate</b>, an <b>anterior open bite</b> (diverging planes), midface hypoplasia with <b>Class III</b> malocclusion (a deficient maxilla, not a big mandible), and <b>delayed eruption</b>. Orthodontics is often the hardest part.</p>\n<h4>Lesch-Nyhan syndrome</h4>\n<p>A mutation of the <b>HPRT1</b> gene causes <b>overproduction of uric acid</b>, with neurologic and behavioral abnormalities: involuntary movements, usually <b>unable to walk</b>, profound ID, and above all <b>self-injury</b>: head banging (protective helmets) and <b>self-biting</b>, including biting off <b>lips and fingers</b>. Almost exclusively <b>males</b>.</p>\n<p>Dr. Mitchell's most important point: it may be necessary to do <b>full-mouth extractions</b> to stop the self-mutilation. Some dentists call it overtreatment, but case reports show that failing to extract early led to severe disfigurement. Oral appliances to stop the biting are hard to keep up for life, and the condition never goes away. It's a careful ethical decision with the family, but removing the teeth is not doing harm: it may be the best treatment.</p>\n<h4>Pierre Robin sequence</h4>\n<p><b>Severe micrognathia/retrognathia</b> (a hypoplastic, backward-rotated mandible), <b>glossoptosis</b>, and a <b>U-shaped cleft palate</b> (the tongue impacted in the palate as it forms). The result is severe <b>respiratory difficulty</b>; the tongue can cause <b>asphyxia</b>, and many have a <b>tracheotomy</b>. Cognitive function is usually <b>normal</b>. <b>Airway management</b> is the big issue: severe cases must be treated <b>in the OR, intubated</b>; orthognathic surgery can improve the face and airway. Routine cleanings can be done in the chair with care, and a tracheotomy, kept clear, actually makes treatment simpler.</p>\n<h4>Fetal alcohol syndrome</h4>\n<p>Environmental, not genetic: too much alcohol in pregnancy. General features: small head, below-average height and weight, developmental delay, heart and kidney problems, deformed limbs or fingers, poor coordination, vision problems. Face: low nasal bridge, epicanthal folds, small eye openings, short nose, flat midface, <b>smooth philtrum</b>, <b>thin upper lip</b>, mild <b>micrognathia</b> (hypoplastic mandible), and cleft palate in some. Behavior: hyperactivity, lack of focus, poor judgment, learning disabilities and mood swings, but usually <b>mild to moderate</b>, so many live in society, some never diagnosed. A \"difficult patient\" with these features may have undiagnosed FAS.</p>\n<h4>Cornelia de Lange syndrome</h4>\n<p><b>Slow growth before and after birth</b>, <b>short stature</b>, <b>moderate to severe ID</b> (more profound than most here), and abnormal bones in the arms, hands and fingers. Face: <b>thick eyebrows</b> (nearly a unibrow), a short nose with an upturned tip, a long smooth philtrum, a thin upper lip and downturned corners. Oral: micrognathia, <b>cleft palate in 20%</b>, <b>delayed eruption</b>, <b>widely spaced teeth</b> with <b>microdontia</b>. They often present <b>severe behavior problems</b> (combative), so they more often end up in institutional or sedation settings.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Syndrome</th><th>Cause</th><th>Intellect</th><th>Dental points</th></tr></thead><tbody>\n<tr><td>Fragile X</td><td>FMR1 repeats on the X chromosome; mostly boys</td><td>Mental delay; autistic behaviors</td><td>Long face, prominent jaw</td></tr>\n<tr><td>Prader-Willi</td><td>Chromosome 15q: paternal genes deleted (70%); usually new mutation</td><td>Mild to moderate</td><td>Obesity (sedation), outbursts, insensitive to pain, thick saliva: calculus, caries, gingivitis; high palate</td></tr>\n<tr><td>Tuberous sclerosis</td><td>Single gene; benign tumors anywhere</td><td>Depends on where the tumors are</td><td>Seizure-drug gingival overgrowth, weak enamel, gingival fibromas</td></tr>\n<tr><td>Apert</td><td>Craniosynostosis; almost always new; 1 in 65,000</td><td></td><td>Midface deficiency, Class III, crowding, high palate, open bite, delayed eruption; syndactyly; airway</td></tr>\n<tr><td>Lesch-Nyhan</td><td>HPRT1 mutation: too much uric acid; almost only males</td><td>Profound</td><td>Self-biting of lips and fingers: may need full-mouth extractions</td></tr>\n<tr><td>Pierre Robin sequence</td><td>Micrognathia, glossoptosis, U-shaped cleft palate</td><td>Usually normal</td><td>Airway: severe cases treated in the OR intubated</td></tr>\n<tr><td>Fetal alcohol syndrome</td><td>Alcohol in pregnancy (environmental)</td><td>Mild to moderate</td><td>Smooth philtrum, thin upper lip, small jaw, sometimes cleft</td></tr>\n<tr><td>Cornelia de Lange</td><td>Slow growth before and after birth</td><td>Moderate to severe</td><td>Thick eyebrows, cleft 20%, delayed eruption, spaced teeth, microdontia; difficult behavior</td></tr>\n</tbody></table></div>\n", "autism": "\n<div class=\"tested\"><b>What's tested</b><ul><li>CDC definition, prevalence (1 in 68 in 2012, 1 in 36 in 2020), boys vs girls, causes and what is not a cause (vaccines)</li><li>The TED talk: twin and sibling concordance, single-gene cases, number of genes, eye tracking</li><li>Characteristics and early signs</li><li>Stimming and how to respond; meltdown vs tantrum</li><li>Sensory defensiveness and ways to reduce it</li><li>Dental conditions in autism</li><li>Preparing for the visit: practice kits, scheduling, the operatory</li><li>Communication rules and the successful appointment</li><li>Advanced treatment options and the duty to refer</li></ul></div>\n<p>The autism unit is an online module of short readings and videos, largely drawn from a Crest learning module, with Dr. Mitchell's notes (\"VERY helpful and practical suggestions that I use regularly\").</p>\n<h4>What is autism?</h4>\n<p>The <b>CDC</b> defines autism spectrum disorders (ASDs) as \"a group of <b>developmental disabilities</b> that can cause significant <b>social, communication and behavioral</b> challenges. People with ASDs handle information in their brain differently than other people.\" Autism Speaks: a broad range of conditions with challenges in social skills, <b>repetitive behaviors</b>, speech and nonverbal communication.</p>\n<p><b>How common</b>: CDC <b>2012</b>, about <b>1 in 68</b> children; CDC <b>2020</b>, <b>1 in 36 (2.8%)</b>, almost double in 8 years, only partly explained by better diagnosis and awareness. Autism is <b>four times more likely in boys</b> (about 1 in 23 boys and 1 in 88 girls). It is more common than pediatric cancer, diabetes and AIDS combined.</p>\n<p><b>Causes</b> are not known. Autistic brains process sensory input in different areas, which may profoundly affect how the person experiences the world. There is a heavy <b>genetic</b> component.</p>\n<h4>The TED talk (Dr. Chung): what to know</h4>\n<ul><li><b>A spectrum</b>: Justin, 13, nonverbal, communicates with an iPad and bangs his head when upset; Gabriel, 13, gifted at math but struggles with conversation and eye contact. Same diagnosis.</li><li><b>Prevalence</b>: then 1 in 88; part of the rise is labeling and resources (legislation in the late 1980s and early 1990s), more awareness, and a <b>wider definition</b>.</li><li><b>Vaccines do not cause autism.</b> The original study was <b>fraudulent</b> and retracted by the <i>Lancet</i>, and its author lost his license. The IOM and CDC found no credible evidence. Thimerosal was removed from vaccines (the talk says 1992) with no effect on prevalence.</li><li><b>Associations</b>: advanced <b>paternal</b> age; exposures during pregnancy such as <b>valproic acid</b> (taken for epilepsy) and some infections.</li><li><b>Males 4 to 1</b>, for reasons not understood.</li><li><b>Concordance</b>: <b>identical twins 77%</b> (not 100%: genes aren't everything), <b>fraternal twins 31%</b>, and plain <b>siblings</b> lower still, which suggests shared exposures in the womb matter too. Genetics plays a bigger role in autism than in cancer, heart disease or diabetes.</li><li><b>Single-gene cases</b>: a <b>new (de novo)</b> mutation, not inherited, can cause autism without a family history. The Simons Foundation study of 2,600 families found a single powerful genetic factor in about <b>25%</b>; 75% are still unexplained. An estimated <b>200-400 genes</b> can cause autism, and they fit into pathways.</li><li><b>Early diagnosis</b>: Ami Klin's <b>eye tracking</b> shows infants who will develop autism look at the mouth, nose or elsewhere instead of the <b>eyes</b>.</li></ul>\n<h4>Characteristics</h4>\n<p>ASD begins <b>before age 3</b> and lasts for life, though symptoms improve. Some show hints in the first months; some seem typical until <b>18-24 months</b> and then stop gaining skills or lose them. A person with ASD might:</p>\n<ul><li>Not respond to their name by <b>12 months</b>; not point at objects of interest by <b>14 months</b>; not play pretend by <b>18 months</b></li><li>Avoid eye contact or want to be alone; have trouble understanding others' feelings or talking about their own</li><li>Have delayed speech; repeat words or phrases (<b>echolalia</b>)</li><li>Get upset by minor changes; have obsessive interests</li><li>Flap their hands, rock or spin</li><li>React unusually to sounds, smells, tastes, sights or touch; have <b>no real sense of danger</b></li><li>Seem not to hear people but respond to other sounds; not look where someone points</li></ul>\n<p>Ami Klin's work: infants on the spectrum don't watch the \"socially interactive\" parts of a scene (faces, speaking), so their brains fail to learn the usual social cues. They may be brilliant, average or profoundly disabled, but they share <b>difficulty interacting socially</b>. (His video is supplemental, not required.)</p>\n<h4>Stimming</h4>\n<p><b>Self-stimulatory behavior</b> (\"stimming,\" \"stereotypy\"): repetitive hand flapping, rocking, repeating phrases or sounds, moving things in front of the eyes. It happens when the person is bored, overwhelmed, nervous, or happy. <b>Before treatment, ask</b> whether the patient stims, what it looks like and how to respond. If it isn't known and you see it: <b>unless it disrupts dental work, don't feel you must stop or change it</b>. If it does, <b>redirect</b>: show another item or give the hands something else to do.</p>\n<h4>Meltdowns</h4>\n<p>An autistic child is <b>not</b> throwing a temper tantrum. A <b>tantrum</b> seeks attention (the child checks for a reaction), avoids self-injury, tries to manipulate, and ends as soon as the goal is reached. In a <b>meltdown</b>, the child is struggling to cope: doesn't look or care who reacts, doesn't consider their own safety, the meltdown runs on its own power and tapers off slowly, <b>no one feels in control</b>, and past a certain point nothing satisfies until it is over.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Tantrum (typical child)</th><th>Meltdown (autism)</th></tr></thead><tbody>\n<tr><td>Wants attention; checks whether anyone is reacting</td><td>Doesn't look or care whether anyone reacts</td></tr>\n<tr><td>Avoids getting hurt</td><td>Doesn't consider their own safety</td></tr>\n<tr><td>Tries to manipulate the situation</td><td>Struggling to cope with the environment</td></tr>\n<tr><td>Stops as soon as the goal is reached</td><td>Runs on its own power and tapers off slowly; nothing satisfies until it's over</td></tr>\n<tr><td></td><td>No one feels in control</td></tr>\n</tbody></table></div>\n<p>It's the clinician's responsibility to find out beforehand whether the patient has meltdowns, <b>what triggers them</b> and <b>what warning signs</b> they give. And show compassion: the parent may feel strife, grief, even embarrassment, and the patient may have no other way to communicate fear and frustration.</p>\n<h4>Sensory defensiveness</h4>\n<p>Autism and <b>sensory defensiveness</b> are not the same, but patients often have both. It may relate to <b>sensory integration disorders</b>: the brain misprocesses sensation so it is uncomfortable or painful (a shirt tag feels like a cut; a noise hurts). Sensory defensiveness is the <b>defensive reaction</b> to protect against it. In the dental visit:</p>\n<ul><li>Pulling away from or overreacting to unexpected touch, especially to the face</li><li>Oversensitivity to the hygienist's cleaning</li><li>Fear of moving backward in the chair; the bright overhead light; equipment noises (even the polishing brush); unexpected office noises (intercoms, alarms, beeps)</li><li>Extreme dislike of the <b>texture</b> of prophy paste</li><li>Overreactive <b>gag</b> to instruments, x-ray materials, or the smell or feel of gloves</li></ul>\n<p>If fear isn't respected it escalates to \"<b>flight or fight</b>\": first trying to escape, then becoming more and more physical. A child may tolerate one stimulus but not several at once.</p>\n<p><b>Reducing sensitivity</b>: the <b>x-ray vest</b> worn all appointment (weight and <b>deep pressure</b>); <b>sunglasses</b>; <b>warn before each step</b>; calming music on headphones; <b>firm touch</b>; oral deep pressure or vibration at home before the visit (electric toothbrush, mini massager, Toothette); something very <b>chewy</b> before the visit; a fidget toy that gives \"heavy work\"; a heavy or tight hat.</p>\n<h4>Dental conditions in autism</h4>\n<p>Generally the same oral health issues as everyone, and <b>no physical differences</b> such as missing or extra teeth or malocclusion (unlike Down syndrome or CP). But several are more common:</p>\n<ul><li><b>Caries: higher</b>. Fixed diets (one Sparks patient drinks only one brand of juice) and oral sensory defensiveness that prevents regular cleaning.</li><li><b>Attrition: higher</b>. Grinding to relieve anxiety, or as stimming.</li><li><b>Erosion: higher</b>, from more <b>GERD</b>.</li><li><b>Periodontitis: slightly higher</b>; treatment is hard because of behavior and because many are on <b>Medicaid</b>, which has limited or no adult dental benefit.</li><li><b>Trauma: higher</b>. A reduced sense of danger, damaging habits, and a higher incidence of <b>abuse</b>.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Condition</th><th>Incidence</th><th>Why</th></tr></thead><tbody>\n<tr><td>Caries</td><td>Higher</td><td>Fixed diets (one patient drinks one brand of juice), cleaning not tolerated</td></tr>\n<tr><td>Attrition</td><td>Higher</td><td>Grinding for anxiety relief or self-stimulation</td></tr>\n<tr><td>Erosion</td><td>Higher</td><td>More GERD</td></tr>\n<tr><td>Periodontitis</td><td>Slightly higher</td><td>Behavior; Medicaid's limited adult dental benefit</td></tr>\n<tr><td>Trauma</td><td>Higher</td><td>Reduced sense of danger, habits, more abuse</td></tr>\n<tr><td>Tooth number, malocclusion</td><td>No difference</td><td>Unlike Down syndrome or CP</td></tr>\n</tbody></table></div>\n<h4>Preparing for the appointment</h4>\n<p><b>Practice kits</b>: a few weeks before, the caregiver picks up a kit and learns to use it, practicing several times a week, enjoyably, never forced, staying neutral and positive. It might hold a prophy angle, saliva ejector, fluoride varnish brush, bib and holder, gloves and mask for the caregiver, a <b>disposable XCP holder without the metal bar</b>, a cotton-tip applicator, a disposable mirror, dry angles, and pictures of each item in the mouth. Practice lying down to have teeth brushed, with a <b>dry toothbrush</b> so the patient won't choke.</p>\n<p><b>Scheduling</b>: <b>mornings</b> beat afternoons (a day of school and therapy is taxing; trust the parent if they say otherwise). The <b>first appointment of the day</b> is ideal: minimal waiting, a quiet office and fresh staff, sterilizers and drills silent, an empty waiting room, and cleaning smells settled overnight. If possible start <b>ten minutes before</b> regular scheduling, straight to the operatory, which also gives a longer appointment.</p>\n<p><b>Be ready</b>: everything you might need out on the counter within arm's reach (walking away and opening drawers distracts and adds noise). <b>No perfume or scented lotion.</b></p>\n<p><b>The office and operatory</b>: overhead music off; <b>sterilizers and the ultrasonic off</b>; lights low (people with ASD are particularly sensitive to <b>fluorescent</b> light: use the chair light or loupe light); <b>always offer sunglasses</b>; noise-cancelling headphones (ask the family to bring theirs); phone ringers down; wait in a consultation room instead of the busy waiting room; no flashing screen savers on visible monitors.</p>\n<h4>Communication (Dr. Mitchell uses these regularly)</h4>\n<ul><li><b>Short, concise statements; nothing abstract.</b> \"Open your mouth,\" not \"open like an alligator\": people with ASD understand language <b>literally</b>, and a patient who loves alligators may never come back from the topic.</li><li><b>\"Hands on belly\"</b>: friendlier than \"put your hands down\" or \"stop,\" and it works wonders.</li><li><b>Give the instruction once and wait patiently.</b> Each repetition has to be processed again; the wait time is longer. \"Open your mouth,\" then \"like this,\" and show them.</li><li><b>Keep language consistent.</b> Pick one phrase, have every staff member use it, and document what works.</li><li><b>How you say it</b>: a sing-song, high-pitched voice may not register as an instruction. Use a <b>direct, even, neutral tone and a deeper voice</b> (not loud or rude).</li><li><b>Excitement can be scary</b>: clapping and yelling \"You did it!\" can keep a patient from ever opening again. Praise freely, but <b>calmly</b>.</li><li><b>Don't ask questions that allow \"no\"</b> when no isn't an option (\"Can I polish your teeth now?\"). Say \"It is time to polish your teeth. Please open your mouth.\" Consent was obtained beforehand; treatment decisions are made in advance, not during.</li><li><b>Use visual supports</b>: pictures are concrete, lower anxiety and improve understanding.</li></ul>\n<h4>The successful appointment</h4>\n<p><b>Introduction</b>: spend a few minutes just talking and being in the same space. Don't be offended by no handshake, high five or eye contact. Be yourself, as with any child.</p>\n<p><b>In the operatory</b>: brief small talk (the history came from the parent interview); let them sit a few minutes; use a <b>visual schedule</b> and stick to its order, removing each picture as its task is done; be flexible: offer breaks, adapt, or stop.</p>\n<ul><li><b>Start lying down</b>: if the chair moving back bothers them, have them get up, position the chair, have them lie down, and have them <b>sit up on their own</b> before you raise it.</li><li><b>Start at the midline</b> (central incisors) with the mouth slightly closed, so they get used to the vibration before you reach gag-triggering areas; they taste the paste or fluoride only at the end. Always go from <b>least to most invasive</b>.</li><li><b>Count to 10</b>: the clinician controls when the break comes, the patient only works briefly, and it distracts. If you stop whenever they raise a hand or make a noise, treatment never ends. Count fast when they struggle, slow when they cooperate, and always reach 10 so \"ten\" means a break (use a smaller number if needed, consistently).</li><li><b>Reward and praise</b>: calm praise; rewards such as a minute of their video after the upper teeth are cleaned.</li></ul>\n<h4>Advanced treatment options</h4>\n<p>Many autistic patients are high functioning and can be treated in a typical office. Some have profound behavioral challenges that endanger them and the staff. <b>Never attempt treatment you can't do safely</b> (\"first, do no harm\"), but the <b>ADA Code of Ethics</b> says don't simply decline: <b>refer</b>.</p>\n<ul><li><b>Oral conscious sedation</b> (an Alabama oral sedation license; lorazepam, diazepam): only <b>mild</b> sedation, of limited value, though families hope it will \"knock them out.\"</li><li><b>IV sedation</b>: a higher license; the Alabama Board inspects the office and requires training <b>even if an anesthesiologist is brought in</b>. Better behavior control but more risk, and many won't tolerate the IV start.</li><li><b>General anesthesia</b>: lets many be treated who otherwise couldn't, but <b>OR access is very limited</b>. Under 21, pediatric dentists usually have access; very few Alabama hospitals open ORs to adults.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Where</th><th>What they offer</th></tr></thead><tbody>\n<tr><td>UAB Hospital Dentistry (GPR)</td><td>Medically complex patients; some comprehensive adult care in UAB's ORs</td></tr>\n<tr><td>Oral surgeons</td><td>OR or IV sedation, but extractions only</td></tr>\n<tr><td>The Foundry Dental Clinic (GPR, Bessemer)</td><td>An anesthesiologist comes to the clinic; comprehensive adult care</td></tr>\n<tr><td>Sparks Dental Clinic</td><td>Dental home for complex patients; Children's OR under 21; oral sedation and protective stabilization for older patients</td></tr>\n<tr><td>Pediatric dentists</td><td>OR or in-office sedation for children; a few accept adults</td></tr>\n<tr><td>General dentists (often AEGD or GPR trained)</td><td>Some accept special needs patients; one or two have hospital privileges</td></tr>\n</tbody></table></div>\n", "prevention": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Fluoride varnish: why Sparks uses it exclusively, and the ADA's non-restorative guideline numbers</li><li>Restorative choices that prevent caries: SDF, RMGI, stainless steel crowns</li><li>Calculus: hidden subgingival rings, sickle vs curette, labial calculus on lower incisors, g-tube patients</li><li>Rubber cup technique and pulsing for the gag reflex; recall intervals</li><li>Home care: modified brushes, flossers, positions for brushing</li><li>Home fluorides and the 8-year rule; contact time</li><li>Diet: sugar-sweetened beverages, the key question, better drinks, artificial sweeteners and the 10-calorie rule</li></ul></div>\n<p>This lecture looks at prevention from the special needs point of view, in two parts: <b>in-office</b> prevention (caries, then periodontal disease) and <b>at-home</b> prevention (hygiene, medicaments and, maybe most important, diet).</p>\n<h4>Fluoride varnish in the office</h4>\n<p>Sparks uses <b>fluoride varnish exclusively</b>: no gels or foams in trays. Most patients couldn't tolerate a tray for the <b>four minutes</b> a foam or gel needs (brushing a gel on has no real evidence). Varnish causes <b>fewer gag reflex problems</b>, is a <b>stronger</b> fluoride applied right where you want it, is applied in seconds with a brush (saliva helps it set), and stays on, a reservoir of fluoride. And there's <b>no waiting</b>: the patient can eat and drink right away (gels and foams: no eating for 20-30 minutes).</p>\n<p>Varnish doesn't only prevent new lesions; it stops existing ones growing. The <b>ADA's 2018 clinical guideline on non-restorative treatment of carious lesions</b>:</p>\n<ul><li><b>Non-cavitated occlusal</b> lesions (the most common caries): <b>sealant over the lesion plus fluoride varnish every 3-6 months</b>, strong evidence, <b>67 of 100 arrested</b>. Varnish alone: about 40-something of 100.</li><li><b>Non-cavitated approximal</b> (shadows on bitewings): <b>5% fluoride varnish every 3-6 months</b>, <b>twice the chance</b> of reversing or stopping progression, <b>46 of 100</b>; simple and cost-effective.</li><li><b>Non-cavitated facial or lingual</b> (class V): varnish or gel.</li><li><b>Root caries</b>: <b>Prevident 5000</b> used at home.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Lesion</th><th>Best option</th><th>Result</th></tr></thead><tbody>\n<tr><td>Non-cavitated occlusal</td><td>Sealant plus 5% fluoride varnish every 3-6 months</td><td>67 of 100 arrested (varnish alone: in the 40s)</td></tr>\n<tr><td>Non-cavitated approximal</td><td>5% fluoride varnish every 3-6 months</td><td>2 times the chance of arrest or reversal: 46 of 100</td></tr>\n<tr><td>Non-cavitated facial or lingual</td><td>Fluoride varnish (or gel)</td><td>Effective</td></tr>\n<tr><td>Root caries</td><td>Prevident 5000 at home</td><td>Effective</td></tr>\n</tbody></table></div>\n<h4>Materials that prevent caries</h4>\n<p>When cavitation occurs, pick materials that prevent future decay: <b>silver diamine fluoride</b> (arrests small lesions, turns them black; good when behavior makes restoring hard), <b>resin-modified glass ionomers</b> (Fuji II LC, Fuji IX, Ketac Nano; they <b>release fluoride</b>, for small and moderate cavities in patients who can't tolerate traditional restorations), and <b>stainless steel crowns</b> (for larger lesions, on permanent teeth too, protecting the whole tooth).</p>\n<h4>Periodontal disease: calculus control</h4>\n<p>Periodontal disease is the most common problem in this population, and calculus control is the biggest issue. A mouth may show <b>no visible calculus</b> but <b>swollen gingiva</b>: almost always there is calculus under the margin, often a <b>ring just below the tissue</b>. Explore under the margins. (Twice in one week at Sparks, patients charted as having no calculus had extensive subgingival calculus, one with mobile lower incisors.) Interproximal calculus may show on bitewings; air from the syringe can reveal dark areas under the gingiva.</p>\n<ul><li><b>Supragingival</b>: a <b>sickle scaler</b>, its point into the interproximal, sliding to the tissue and lifting.</li><li><b>Subgingival</b>: a <b>curette</b> (rounded end), slid below the margin; explore with the <b>toe</b>, engage what you feel, and lift with long, smooth strokes against the tooth.</li></ul>\n<p><b>Calculus on the facial of the lower incisors</b> is a pattern here: the patient tightens the <b>lower lip</b> and blocks the brush. Teach caregivers to <b>pull the lower lip down</b> to reach the gingival margin; for a very tight lip, put a finger where the lower lip and buccal mucosa join and roll the lip out.</p>\n<h4>Rubber cup prophy</h4>\n<p>Focus on the <b>gingival margin</b>: the cup must touch the tissue (not for long periods), follow the tooth's contour, and let the spin do the work at moderate to high speed. <b>Roll into the interproximal areas.</b> For sensitive gag reflexes, work in <b>pulses</b>: 1-2 seconds on the tooth, then off, removing the stimulus before the gag fires. This matters most on the <b>lingual of the lower molars</b>, near the tongue.</p>\n<p><b>Gastrostomy-tube-fed patients</b> often have <b>very heavy calculus</b> and hypersensitive gag reflexes (one was treated sitting at 90 degrees with the head tipped forward). Remove calculus from the <b>buccal and lingual</b> but <b>leave it on the occlusal</b>: a natural sealant.</p>\n<p><b>Recall</b>: 6 months is most common but not always best: 3 or 4 months, even monthly. Most third-party payers won't pay more than twice a year, and some require 6 months between, so families pay; keep cost down by charging only for the cleaning, not an exam or fluoride each time.</p>\n<h4>Home hygiene aids</h4>\n<p>Real prevention happens at home, every day. The <b>Surround toothbrush</b> (Specialized Care Co.) has three bristle heads that clean both sides and the occlusal at once: faster, though <b>not as efficient</b> as a regular brush, so it's for patients who tolerate only a short brushing. For patients who can brush but have poor grip or can't bend their arms: <b>enlarge the handle</b> (foam, a tennis ball, a washcloth with rubber bands, acrylic, putty) or <b>lengthen it</b> with a tongue blade. A flosser whose floss sits at <b>90 degrees to the handle</b> reaches the back teeth easily, for the patient or a caregiver. <b>Electric</b> (especially <b>Sonicare</b>-type) brushes can be better, and the vibration comforts some sensory patients (not all); Dr. Mitchell is more cautious about round \"spin brush\" heads, which can be too big.</p>\n<h4>Teaching caregivers: positions</h4>\n<ul><li><b>Standing in front</b>: for more cooperative patients; little control of the hands; the <b>lowest gag risk</b> (the patient can lean forward).</li><li><b>Patient sits, caregiver stands behind</b> with the head against the caregiver's arm: more head control, good for tall patients; some more gag risk.</li><li><b>Recliner</b>, laid back, caregiver behind: replicates the dental chair, so it <b>trains</b> the patient; more gag risk.</li><li><b>Lying in bed</b>: for patients who can't stand or prefer lying; more control; <b>the most gag risk</b> (turn the head if needed).</li><li><b>Lying on the floor, two caregivers</b>: the head in caregiver 1's lap, who also holds the hands (crossed is easier to control); caregiver 2 brushes. Most control of less cooperative patients; most gag risk.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Position</th><th>Good for</th><th>Gag risk</th></tr></thead><tbody>\n<tr><td>Standing, facing the patient</td><td>Cooperative patients; little control of arms</td><td>Lowest</td></tr>\n<tr><td>Patient sits, caregiver stands behind</td><td>Tall patients; controls the head</td><td>Some increase</td></tr>\n<tr><td>Recliner, caregiver behind</td><td>Trains for the dental chair</td><td>More</td></tr>\n<tr><td>Lying in bed</td><td>Patients who can't stand or prefer lying; more control</td><td>Most</td></tr>\n<tr><td>Lying on the floor, two caregivers</td><td>Less cooperative patients: one holds head and hands, one brushes</td><td>Most</td></tr>\n</tbody></table></div>\n<h4>Preventive medicaments</h4>\n<p><b>Don't prescribe fluoride rinses or gels until at least age 8</b>: they will likely swallow it, and with teeth still developing, risk <b>fluorosis</b>. Custom trays are rarely tolerated, and few can rinse and spit, so products are usually <b>brushed on</b>. Consider <b>contact time</b>: a product that needs 30-60 seconds does nothing for a patient who tolerates 5-10.</p>\n<ul><li><b>Prevident 5000</b>: a high-fluoride (<b>sodium fluoride</b>) toothpaste, used instead of their regular paste. Dr. Mitchell: brush it on at night, spit or wipe out the excess, and <b>go to bed without rinsing</b>.</li><li><b>GelKam</b>: <b>stannous fluoride</b>, fluoride only, <b>not a toothpaste</b>: a second fluoride for a patient who likes their own paste.</li><li><b>MI Paste Plus</b>: calcium and phosphate <b>plus sodium fluoride</b>. Plain MI Paste has no fluoride and weak evidence; use the Plus.</li><li><b>Rinses</b> (ACT, fluoride Listerine) if they can rinse. A 6'5\" autistic patient used Listerine but refused toothpaste: brush without paste and switch to a fluoride Listerine. If they can't rinse, apply with a <b>Toothette</b> (a sponge on a stick), repeatedly for <b>30-60 seconds</b>.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Product</th><th>What it is</th><th>How to use</th></tr></thead><tbody>\n<tr><td>Prevident 5000</td><td>High-fluoride toothpaste (sodium fluoride)</td><td>Brush on at night, spit or wipe out the excess, go to bed without rinsing</td></tr>\n<tr><td>GelKam</td><td>Fluoride only (stannous fluoride), not a toothpaste</td><td>Same way, alongside a toothpaste they like</td></tr>\n<tr><td>MI Paste Plus</td><td>Calcium and phosphate plus sodium fluoride</td><td>Same way (plain MI Paste has no fluoride)</td></tr>\n<tr><td>Fluoride rinses (ACT, fluoride Listerine)</td><td>Mouthwash</td><td>Only if they can rinse; otherwise a Toothette for 30-60 seconds</td></tr>\n</tbody></table></div>\n<h4>Diet: maybe the most important</h4>\n<p>For many families good oral hygiene isn't realistic; what they can control is the sugar available. <b>Sugar-sweetened beverages (SSBs)</b> are the biggest problem: they <b>bathe every tooth</b> and are sipped <b>over long periods</b> (a woman in a wheelchair who sipped Coke all day through a straw needed extensive treatment despite a terrible gag reflex). The diagnostic question: <b>\"In a typical day, what does he or she drink the most?\"</b></p>\n<p>Families may resist: the drink is a <b>treat</b> for someone who can't do so much else, taking it away can cause a meltdown, and one family told Dr. Mitchell to take all the teeth out rather than give up Dr Pepper.</p>\n<p><b>Healthy drinks</b>: <b>water</b>, <b>plain milk</b> (some studies suggest it even prevents caries, but not chocolate or strawberry), and <b>unsweet tea</b> (stain is removable). <b>100% juice is not on the list</b>: it's high in natural sugar (a glass of apple juice is like eating five to ten apples).</p>\n<p><b>Artificially sweetened</b> drinks (Crystal Light and store brands, diet and \"Zero\" sodas with some erosion risk, Splenda and Stevia in tea) keep the treat without the caries. Teach families to read the label: <b>10 calories or fewer per serving</b> is not a caries risk (Coke 110, Coke Zero 0, Dr Pepper Ten 10).</p>\n<p><b>Are artificial sweeteners bad?</b> There's controversy, especially in the autism community, where some families are committed to \"all natural\" diets, though nothing about soft drinks is natural, and almost all SSBs use <b>high-fructose corn syrup</b>. For aspartame the FDA's acceptable daily intake is <b>50 mg/kg/day</b>: about <b>19 cans (6.7 liters) of Coke Zero a day</b> for a 150-lb adult.</p>\n<p>Dr. Mitchell's recommendations: talk with the <b>primary care provider</b> about sweeteners; day to day, use artificially sweetened drinks instead of SSBs when the teeth can't be cleaned well, <b>limited to 2-3 a day</b>; on special occasions, have fun (Halloween is fine; two weeks of candy afterward is the problem).</p>\n<h4>Why it matters</h4>\n<p>Prevention is the most important thing we do for this population, because treating disease can be close to impossible. Many patients can't say they hurt: chronic inflammation hurts, and pain can make them combative (an autistic patient was hitting his face because his mouth hurt). COVID's shutdown brought more patients in pain with worse behavior.</p>\n", "mental": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Mental illness vs intellectual disability (mental retardation in the reading)</li><li>Major depression, bipolar disorder, schizophrenia, dementia, and alcohol and substance abuse: what each is like and its dental implications</li><li>Medication side effects (xerostomia rates, extrapyramidal symptoms, tardive dyskinesia) and drug interactions with dental drugs</li><li>Managing behavior and prescribing safely</li></ul></div>\n<p>Dr. Mitchell doesn't consider himself an expert in mental health, which is more of an adult dentistry issue, so instead of a lecture he posted an edited reading: the Southern Association of Institutional Dentists self-study course, <b>Module 9, \"Clinical concerns in dental care for persons with mental illness.\"</b> He asked you to understand each illness and its characteristics, but to <b>focus on the dental issues</b> and how you would handle them in practice. (The reading is old: it uses the DSM-IV and the term \"mental retardation.\")</p>\n<h4>Mental illness vs intellectual disability</h4>\n<p><b>Mental illness</b> is the inability to perform major activities of daily living because of a <b>psychiatric or emotional disorder</b>; <b>intellectual disability</b> is a similar dysfunction from a <b>cognitive deficit</b>. They can coexist (dual diagnosis). About <b>3%</b> of the population has intellectual disability, while about <b>1 in 6 (17%)</b> has a diagnosable mental disorder. ID is <b>permanent</b>; mental illness may be <b>sporadic</b> (depression once or twice in a life). Psychotropic medications let most people with mental illness live in the community; institutions now mainly serve chronic, refractory cases and acute exacerbations.</p>\n<h4>Major depression</h4>\n<p>An <b>affective disorder</b> with a prolonged depressed mood: loss of interest or pleasure, appetite and weight loss, insomnia, low energy, feelings of worthlessness, poor concentration, thoughts of death. About <b>6%</b> have severe depression; it is a factor in more than 30,000 U.S. suicides a year. In the depths of depression there is an almost total absence of oral hygiene. Common dental findings: <b>poor oral hygiene, rampant decay, advanced generalized periodontal disease, multiple missing teeth, ill-fitting prostheses, orofacial pain syndromes, xerostomia</b>, and poor nutrition and diet.</p>\n<p>Treatment: medication (SSRIs, tricyclics, MAO inhibitors), psychotherapy, diet, exercise, sleep, occasionally <b>electroconvulsive therapy (ECT)</b>. Dental care addresses hygiene, decay and perio (motivating the patient is hard) and <b>xerostomia</b>: seen in <b>14% on Prozac</b> and <b>45% on tricyclics</b>. Patients often fight dry mouth with cariogenic drinks, candy and gum; prescribe <b>saliva substitutes</b>.</p>\n<p><b>Drug interactions</b>: epinephrine may be used <b>with prudence</b> with tricyclics, but <b>levonordefrin (Neo-Cobefrin)</b> and <b>norepinephrine (Levophed)</b> are <b>contraindicated</b> with tricyclics. The reading says epinephrine is contraindicated with <b>MAO inhibitors</b>, and <b>meperidine (Demerol) is absolutely contraindicated</b> with them. Use sedatives judiciously with tricyclics.</p>\n<p>For <b>ECT</b>, the dentist may be asked to make a <b>mouth guard</b>, and should address loose teeth, gross calculus and loose prostheses beforehand (aspiration risk) and document existing conditions (liability).</p>\n<h4>Bipolar disorder</h4>\n<p>Manic-depressive disorder: alternating, prolonged episodes of extreme elation and depression; about <b>1%</b> of people, strongly familial. <b>Mania</b>: hyperactivity, pressured loud rapid speech, distractibility, grandiose delusions, days without sleep, rapid shifts to anger. Episodes last about 3 months and may recur every 3-9 years; depressive episodes outnumber manic ones. Smoking, alcohol and cocaine use are common.</p>\n<p>Dental findings in <b>mania</b>: <b>abraded oral mucosa and cervical tooth abrasion</b> from <b>over-vigorous brushing or flossing</b>. In the depressive phase: the same as major depression. Treated with anti-seizure drugs, neuroleptics and <b>lithium</b> (effective in 70% within 3 weeks): <b>stomatitis</b> and <b>xerostomia</b> (73% in one study). <b>NSAIDs may decrease lithium's renal clearance</b> and allow toxic levels (short-term use may be fine); use <b>benzodiazepines with caution</b> (CNS depression).</p>\n<h4>Schizophrenia</h4>\n<p>A psychotic disorder with personality disorganization lasting at least 6 months; about <b>1-2%</b> will be hospitalized for it. Bizarre <b>delusions</b> (persecutory: being spied on; of reference: a TV show is about them), <b>hallucinations</b> (insulting voices), incoherent speech, <b>flat affect</b>, catatonia or bizarre mannerisms. Confused, depressed, withdrawn or anxious patients neglect or refuse dental care; with <b>xerostomia</b> from antipsychotics, that means more decay and periodontal disease.</p>\n<p>Approach <b>paranoid</b> patients <b>slowly and non-threateningly</b>, with no sudden movements; warn them what to expect and show them each next step.</p>\n<p>Antipsychotics (neuroleptics, phenothiazines) cause short-term <b>extrapyramidal symptoms</b> (agitation, neck spasms or torticollis, oculogyric crises; treated with IM Benadryl) and long-term <b>tardive dyskinesia</b>: trismus, swallowing problems, <b>tongue protrusion</b>, constant <b>lip and jaw movements</b> (lip chewing, tongue wiping, smacking); controlled with Cogentin and Artane. <b>Akathisia</b>: restlessness, can't sit still, wants to get up during the appointment. Dental <b>sedatives</b> can combine with neuroleptics to cause excessive <b>respiratory depression</b>; local anesthetic with epinephrine is fine in normotensive patients.</p>\n<h4>Dementia</h4>\n<p>A loss of intellectual function severe enough to interfere with social or occupational life (memory, judgment, abstract thought), including <b>Alzheimer's</b>. About 2-3% at 65-79 and <b>over 20% at 80</b> and older. Poor short-term memory brings agitation and disorientation in unfamiliar settings; advanced disease brings incontinence, loss of self-care, contractures and <b>apraxia</b> (unable to use objects such as a toothbrush). Dental problems: <b>maxillofacial injuries from falls</b>, traumatic ulcers, poor hygiene, <b>extensive coronal and root caries</b>, periodontal disease, missing or broken teeth, attrition, salivary dysfunction, ridge atrophy, nonfunctional prostheses, <b>xerostomia</b> and <b>candidiasis</b> (5-20% on antipsychotics).</p>\n<p><b>Complete dental treatment as early as possible</b> in progressive dementia, because cooperation declines; take <b>full-mouth radiographs</b> early for future reference. Consult the treatment team. Chlorhexidine and denture scrubs help, but many can't rinse for 30 seconds and swallow everything; more frequent prophylaxis and fluoride may be the only option for root caries. Prescribe cautiously: in the elderly, a single dose of most drugs gives about <b>twice the peak blood level and twice the half-life</b>. The communication techniques used for ID work here too: reassurance, nonverbal communication, repetition, no abstract terms, <b>nouns rather than pronouns</b>, short words and sentences.</p>\n<h4>Alcohol and other substance abuse</h4>\n<p>Alcoholism is estimated at <b>28-50%</b> in psychiatric hospitals. Dental implications: poor hygiene, neglect, <b>attrition (bruxism)</b>, <b>xerostomia</b>, <b>oral cancer</b> (with heavy smoking: screen carefully), <b>candidiasis</b>, <b>impaired healing</b> and <b>bleeding</b> (liver damage), and orofacial trauma (osteomyelitis can follow compound mandible fractures).</p>\n<ul><li>Before oral surgery, a <b>bleeding profile</b> (CBC, PT, PTT, bleeding time) is often indicated; more antibiotics after surgery may be needed.</li><li>Tolerance to alcohol brings <b>tolerance to sedatives</b>: higher doses may be needed. Drugs metabolized by the liver need caution (lidocaine, mepivacaine, ampicillin, aspirin, acetaminophen, codeine, diazepam, barbiturates); an <b>ester</b> local has been recommended in cirrhosis; long-time alcoholics may need much more local anesthetic.</li><li>IV drug users carry higher <b>HBV and HIV</b> risk.</li><li><b>Cocaine</b> causes cardiac irritability: <b>epinephrine is strongly contraindicated within 48 hours of cocaine use</b>.</li><li><b>Recovering</b> patients: avoid mood-altering drugs, including <b>nitrous oxide</b> and nearly all analgesics except <b>NSAIDs</b> (aspirin, ibuprofen, diflunisal). If narcotics are truly needed (major surgery), prescribe only after NSAIDs fail, enough for about <b>48 hours</b>, dispensed by someone else if possible, never for merely anticipated pain; a long-acting local such as <b>bupivacaine</b> reduces the need.</li><li>Patients on <b>Antabuse (disulfiram)</b> must avoid alcohol-based mouthwashes and products.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Patient takes</th><th>Caution</th></tr></thead><tbody>\n<tr><td>Tricyclic antidepressants</td><td>Epinephrine with prudence; levonordefrin (Neo-Cobefrin) and norepinephrine (Levophed) contraindicated; sedatives with care; xerostomia in 45%</td></tr>\n<tr><td>MAO inhibitors</td><td>Epinephrine contraindicated (per the reading); meperidine (Demerol) absolutely contraindicated</td></tr>\n<tr><td>SSRIs (Prozac)</td><td>Xerostomia in 14%</td></tr>\n<tr><td>Lithium</td><td>NSAIDs can reduce its clearance (toxicity), mostly with long use; benzodiazepines with caution; xerostomia in 73%</td></tr>\n<tr><td>Antipsychotics (phenothiazines)</td><td>Sedatives can deepen respiratory depression; epinephrine fine if normotensive</td></tr>\n<tr><td>Cocaine within 48 hours</td><td>Local anesthetic with epinephrine strongly contraindicated</td></tr>\n<tr><td>Disulfiram (Antabuse)</td><td>No alcohol-containing mouthwashes or products</td></tr>\n<tr><td>Recovering addicts</td><td>Avoid mood-altering drugs, including nitrous oxide; prefer NSAIDs; a long-acting local (bupivacaine)</td></tr>\n</tbody></table></div>\n<p>(The reading's medication list also has a misprint: it puts tricyclics such as amitriptyline under the SSRI heading.)</p>\n"};

/* ---------- PLAIN ENGLISH READINGS: same facts as READINGS, everyday language. Keep these in sync with READINGS. ---------- */
var READINGS_PLAIN = {"intro": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What intellectual disability means, and its three parts</li><li>The old words and when they changed</li><li>Person-first language</li><li>Institutions, group homes and day programs</li><li>How common disability is, especially in Alabama</li><li>Why these patients struggle to get dental care, and your duty to refer</li><li>What causes ID, including ACEs</li></ul></div>\n<h4>The big picture</h4>\n<p>Dr. Mitchell runs the Sparks Dental Clinic at UAB. Special needs covers a lot of people, but this course is mostly about people with <b>intellectual disability</b> (ID, or IDD). Many special needs patients have no named diagnosis at all.</p>\n<h4>What ID means</h4>\n<p>ID is trouble with <b>thinking</b> and with <b>adapting</b> to new places and sensations, and it has to <b>start in childhood</b>. All three parts are needed (DSM-5). Someone who was healthy until a brain injury as an adult is special needs, but does not have ID, because it did not start in childhood.</p>\n<p>It used to be decided by an IQ test: under 70. Now it takes a long evaluation by several specialists, and it looks at adapting and at language and culture too.</p>\n<h4>The words</h4>\n<p>Words for ID keep turning into insults and getting replaced. In the early 1900s doctors said <b>feeble-minded</b> (moron, imbecile, idiot, by mental age). Then <b>mental retardation</b>. <b>Rosa's Law (2010)</b> took that term out of federal documents, and the <b>DSM-5 (2013)</b> switched to intellectual disability.</p>\n<p>Say <b>\"a patient who has Down syndrome,\"</b> not \"a Down syndrome patient.\" ID is a diagnosis, not a description of who someone is. Speaking to people with respect gets respect back.</p>\n<h4>Where people live</h4>\n<p>Before the 1950s, families were told to send people with ID to big <b>institutions</b> like Bryce Hospital. Underfunded, they became places of neglect. Geraldo Rivera exposed <b>Willowbrook</b> in the 1970s. Then came <b>deinstitutionalization</b>: care in the community. Since 1978 public schools must offer special education.</p>\n<p>Today <b>most live at home</b> with family. Many adults live in <b>group homes</b> (6-8 people and a caregiver) and spend the day at <b>day programs</b> like United Ability, the Exceptional Foundation or the Arc. Only <b>1-2%</b> live in institutions like Glenwood: the most severely affected.</p>\n<h4>How common</h4>\n<p>One in five U.S. adults has some disability, and <b>one in three in Alabama</b>, the highest in the nation. For <b>severe</b> disability it's 12.6% nationally and 16.7% in Alabama; West Virginia is highest at 19.4%. Developmental disabilities in children keep rising, partly because of better diagnosis and less shame. Cerebral palsy, hearing loss and seizure disorders have gone down.</p>\n<h4>Getting dental care</h4>\n<p>The Surgeon General's reports (2000, 2002, 2005) found these patients can't get care, partly because schools didn't train dentists. In Alabama, <b>Medicaid covers dental care until age 21</b>, then the dental benefit stops. Many adults live on Social Security and pay out of pocket.</p>\n<p>Since <b>2019, CODA</b> says graduates must be able to <b>assess and manage</b> these patients. Since <b>2018, the ADA Code of Ethics</b> says you can't turn someone away because of a disability. You don't have to treat everyone, but if you can't, you must <b>refer</b> them somewhere that can.</p>\n<h4>What causes ID</h4>\n<p>In 30-40% of cases, nobody knows. Causes can be <b>genetic</b> (a whole extra chromosome, like Down syndrome, or one faulty gene, like fragile X), something before birth (fetal alcohol syndrome is about 2%), at birth (prematurity, lack of oxygen), or after birth (injury, infection, tumors).</p>\n<p><b>ACEs</b>, adverse childhood experiences, change how a child's brain develops. Stress hormones damage the hippocampus and leave the brain on high alert, so the child reads more things as danger. The more ACEs, the bigger the effect.</p>\n<h4>What helps them learn</h4>\n<p>Talk in short, clear, concrete words. Repeat things. Keep it quiet. Keep a routine. Many have speech problems, sensitive gag reflexes and quick mood swings, but many are wonderful patients.</p>\n", "behavior": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Maladaptive behavior and non-contingent escape</li><li>Talking to patients: social age, start high, show, praise, clear goals</li><li>Changing the room to help</li><li>Active vs passive stabilization, and when never to use it</li><li>Mouth props and papoose boards</li><li>Consent: express vs implied, and its three parts</li><li>Competence, beneficence and advocacy</li></ul></div>\n<h4>Maladaptive behavior</h4>\n<p><b>Maladaptive behavior</b> means a patient can't adapt to the dental office. It's only some patients with IDD, and you can't predict who.</p>\n<p>These patients deserve good care, limited only by whether they'd <b>benefit</b> from it and whether they can <b>tolerate</b> it. A profoundly disabled patient may not benefit from esthetic crowns; a patient who can't keep tissue clean may not do well with tooth-colored fillings; a fragile tooth may have to come out if fixing it is too dangerous.</p>\n<h4>Talking to patients</h4>\n<ul><li>Short, clear, concrete instructions, repeated often</li><li>Tone matters even when words don't: stay calm and kind</li><li>Talk at the patient's <b>social age</b>, but <b>start at a normal level and work down</b>. Talking down to someone who understands is insulting.</li><li><b>Show</b> them: open your own mouth, let them touch the prophy angle</li><li><b>Praise</b> good behavior a lot; correct bad behavior briefly, then praise again</li><li>Say <b>what</b> you'll do, <b>what they</b> need to do, and <b>how long</b>: \"until the count of 10\"</li></ul>\n<h4>Non-contingent escape</h4>\n<p>Set a small goal (\"five seconds,\" \"three teeth\") and <b>finish it even if they fuss</b>, then give the break. If you stop because they act up, that's <b>contingent escape</b>, and they learn that acting up works. Keep the counts the same each time.</p>\n<h4>The room</h4>\n<p>Sit some patients up at 45 degrees. Spray water in <b>short bursts</b> so they can breathe. Dim the lights for light-sensitive patients, play music they like, keep fewer people in the room, and use the same room and staff each time.</p>\n<h4>Protective stabilization</h4>\n<p>Limiting a patient's movement for a short time so you can treat safely. <b>Active</b> = a <b>person</b> holds them (head holds, hand guarding, holding arms or legs). <b>Passive</b> = a <b>device</b> (mouth props, papoose board). Even a staff member holding a head counts.</p>\n<p>It's for <b>safety</b>, like a baby's car seat. <b>Never</b> as punishment, instead of behavior guidance, or for your convenience. The best kind is the <b>least restrictive</b>, the least likely to hurt, and always <b>consented</b>. Sometimes not using it when a patient is very resistive is negligent.</p>\n<p>Head holds: cradle the head against your chest with your mirror arm, or have a helper cup the head with spread fingers on the temporal and occipital bones. For kicking, Dr. Mitchell lifts the legs off the chair by the ankles. Check circulation, and ease off when they relax. Don't use hand-over-mouth techniques (HOME, HOMAR).</p>\n<h4>Mouth props and papoose boards</h4>\n<p>The <b>Molt prop</b> opens and locks like scissors. Keep it on the <b>back teeth</b>: on front teeth it can knock them loose or out. Watch the lips. Tell the caregiver about any scrapes. Without a prop, keep your fingers in the cheek fold, not between the teeth.</p>\n<p>A <b>papoose board</b> wraps the patient snugly; Sparks uses the <b>Rainbow Wrap</b> (\"the blanket\"), with straps crossed in an X over the chest. Weighted blankets calm some autistic patients but are hard to disinfect.</p>\n<h4>Consent</h4>\n<p>Any stabilization needs <b>informed consent</b>. Without it, a dentist can be charged with assault and battery or sued for malpractice. <b>Express</b> consent is spoken or written; <b>implied</b> consent comes from actions, like an adult showing up for a cleaning.</p>\n<p>Informed consent needs three things: the person can <b>understand</b>, they're <b>informed</b> (a blanket form signed at registration doesn't count), and they agree <b>freely</b>. Write it down in detail, including why you used it, what you used, how well it worked and how long.</p>\n<h4>Ethics</h4>\n<p>A <b>competent</b> patient can say no, even to good care. If the patient isn't competent, choose what's best for them (<b>beneficence</b>). And <b>advocate</b> for them, with caregivers and with the state.</p>\n", "down": "\n<div class=\"tested\"><b>What's tested</b><ul><li>How Down syndrome happens and its three types</li><li>Mother's age, life expectancy, intellect and behavior</li><li>Face, heart, immunity, airway and neck</li><li>The mouth: perio, NUG, missing and small teeth</li><li>Treatment, including liquid antibiotic doses</li></ul></div>\n<h4>How it happens</h4>\n<p>Down syndrome is usually an <b>extra chromosome 21</b>: 47 chromosomes instead of 46. It comes from <b>nondisjunction</b>, when the 21st pair fails to split while an egg or sperm forms. Over 90% of the time it's the <b>mother's egg</b>.</p>\n<ul><li><b>Trisomy 21, 94%</b>: a whole extra 21; 47 chromosomes</li><li><b>Translocation, 5%</b>: the extra 21 is stuck onto another chromosome (usually 14); 46 chromosomes</li><li><b>Mosaicism, 1%</b>: the error happens after conception, so only some cells have 47</li></ul>\n<p>It affects about 1 in 700 births, and the risk climbs with the mother's age (1 in 2,300 at 20, 1 in 65 at 46). Life expectancy went from <b>9 years in 1929 to 55 by the 2000s</b>.</p>\n<h4>Thinking and behavior</h4>\n<p>About 70% have mild or moderate ID. Half show some decline before 50, and every autopsy shows Alzheimer's-type brain changes. Most are <b>happy, playful and loving</b>, but they scare easily and pick up on the mood in the room. The more severe the ID, the more mistrust and the chance of violent protectiveness.</p>\n<h4>The face</h4>\n<p>The key feature is <b>midface hypoplasia</b>: a flat middle face from an underdeveloped upper jaw. Also a flat, saddle-shaped nose, low-set ears, and <b>epicanthal folds</b> (almond eyes). The small nose and airway mean many <b>breathe through the mouth</b>, so don't flood them with water.</p>\n<h4>Medical issues</h4>\n<p>About <b>half have a heart defect</b>. The most common is an <b>AV canal defect</b>. Most are fixed early and need no antibiotics. <b>Tetralogy of Fallot</b> often does. Many have valve problems they don't know about.</p>\n<p>Antibiotic prophylaxis is only for: unrepaired cyanotic defects, repairs with prosthetic material in the first six months, and repairs that left a leak next to the patch.</p>\n<p>Weaker immune systems mean more colds, ear infections and pneumonia. <b>Leukemia</b> is 15-50 times more common, but now usually curable. Thyroid problems, diabetes and celiac disease are more common. Most have <b>sleep apnea</b>, many have swallowing trouble and reflux. In <b>10-20%</b> the top two neck bones are loose (<b>atlantoaxial instability</b>), so <b>don't tip the head far back</b>.</p>\n<h4>The mouth</h4>\n<ul><li><b>Class III bite</b> because the upper jaw is small; narrow palate; spaces between teeth; big, fissured tongue</li><li>Teeth come in late; <b>missing lateral incisors</b> are common; small and peg-shaped teeth; big pulp chambers (taurodontism)</li><li><b>Gum disease is the number one problem</b>: early, fast, starting as young as 6</li><li><b>NUG</b> in 45%, often without bad breath or pain</li><li>Cavities: usually fewer, but the evidence is mixed</li></ul>\n<h4>Treatment</h4>\n<p>Start prevention early and warn families about gum disease. Parents brush for them, for life. Probe from age 6. Use chlorhexidine brushed on, and antibiotics if needed (doxycy
