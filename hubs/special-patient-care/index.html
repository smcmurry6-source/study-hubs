/* ===================================================================
   SPECIAL PATIENT CARE HUB — tokens
   Palette "Sparks": deep clinic teal on a warm paper ground, with a coral accent for the things to remember.
   Type: DM Serif Text (display) · Source Sans 3 (body) · JetBrains Mono (labels).
   =================================================================== */
:root{
  color-scheme: light;
  --bg:#f5f4ef; --surface:#fffefb; --surface-2:#eeede6; --surface-3:#e2e1d8;
  --ink:#16302e; --ink-soft:#44585a; --ink-faint:#5f7173; --line:#dfded5; --line-strong:#c6c6ba;
  --accent:#1d6b66; --accent-ink:#155a55; --accent-soft:#d8ebe8;
  --good:#2f7a4f; --good-soft:#dcefe2; --bad:#b8322f; --bad-soft:#f7dcd8; --caution:#9a6412; --caution-soft:#f6e8c9;
  --tag-amber:#a8701a; --tag-sage:#57834f; --tag-blue:#2f62a8; --tag-teal:#1f7f78; --tag-violet:#6a4fa5; --tag-red:#b3352d; --tag-green:#4d7a22; --tag-rose:#b9436a; --tag-plum:#8e3f86; --tag-indigo:#3d4fa8;
  --tag-amber-soft:#f5e6c8; --tag-sage-soft:#e1ecdc; --tag-blue-soft:#dce6f4; --tag-teal-soft:#d5ecea; --tag-violet-soft:#e7e0f3; --tag-red-soft:#f6dbd7; --tag-green-soft:#e2ecd2; --tag-rose-soft:#f5dbe3; --tag-plum-soft:#f2dff0; --tag-indigo-soft:#dfe3f6;
  --shadow:0 1px 2px rgba(22,48,46,.06), 0 4px 14px rgba(22,48,46,.07);
  --radius:12px;
  --font-display:'DM Serif Text', Georgia, serif;
  --font-body:'Source Sans 3', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  --font-arcade:'Press Start 2P', 'Courier New', monospace;
  /* Arcade: one fixed world regardless of theme, the clinic after hours */
  --ar-bg:#0c201f; --ar-panel:#12302e; --ar-panel-2:#1a403d; --ar-ink:#f3fbf9; --ar-dim:#9fc4bf; --ar-line:#2b5a56;
  --ar-yellow:#ffd166; --ar-pink:#ff8a6b; --ar-cyan:#7fd8f0; --ar-green:#8fe3b5; --ar-orange:#ffa75a; --ar-violet:#b59bff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101716; --surface:#16201f; --surface-2:#1e2a29; --surface-3:#273534;
    --ink:#e9f1ef; --ink-soft:#b7c6c3; --ink-faint:#93a4a1;--lec-num-ink:#101716; --line:#2c3b3a; --line-strong:#41524f;
    --accent:#6fcfc4; --accent-ink:#8fdcd3; --accent-soft:#183634;
    --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
    --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
    --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101716; --surface:#16201f; --surface-2:#1e2a29; --surface-3:#273534;
  --ink:#e9f1ef; --ink-soft:#b7c6c3; --ink-faint:#93a4a1;--lec-num-ink:#101716; --line:#2c3b3a; --line-strong:#41524f;
  --accent:#6fcfc4; --accent-ink:#8fdcd3; --accent-soft:#183634;
  --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
  --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
  --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
/* DM Serif Text comes in one weight: never fake a bold */
html{font-synthesis:none}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important;} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--font-mono)}
[hidden]{display:none!important}

</style>
<link rel="stylesheet" href="../../widget/hub.css">
<style>
.kind.emphasize{background:var(--good-soft);color:var(--good)} .kind.deemphasize{background:var(--caution-soft);color:var(--caution)}
.cram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cram-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.cram-card ul{margin:0;padding-left:18px}
.cram-card li{margin-bottom:5px;font-size:.9rem}

/* ---------- review ---------- */
.review-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.review-top input{flex:1 1 240px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;font:inherit;color:var(--ink);min-width:0}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.toggle .sw{width:30px;height:17px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:15px}
.group-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.group-chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.group-chip .n{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint)}
.group-chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)} .group-chip.is-active .n{color:var(--bg);opacity:.7}
.gc-lec{font-family:var(--font-mono);font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ts);color:var(--t)}
.group-chip.is-active .gc-lec{background:var(--bg);color:var(--ink)}
.group-lec{margin:4px 0 6px}
.group-head h2{font-family:var(--font-display);font-size:1.7rem;margin:4px 0 4px}
.group-head p{color:var(--ink-soft);margin:0 0 20px;max-width:80ch}
.rv-parts{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 22px}
.rv-part-link{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.rv-part-link:hover{border-color:var(--accent);color:var(--accent)}
.rv-part{font-family:var(--font-display);font-size:1.35rem;margin:6px 0 16px;padding-top:4px;scroll-margin-top:90px;color:var(--accent)}
.rv-section{margin-bottom:38px}
.rv-section > h3{font-family:var(--font-display);font-size:1.18rem;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--t);display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-card h4{margin:0;font-size:1.02rem;line-height:1.25}
.rv-card .sub{font-size:.8rem;color:var(--ink-soft);margin-top:-2px}
.rv-card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:.87rem}
.rv-card dt{font-weight:700;color:var(--t);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;white-space:nowrap}
.rv-card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rv-tip{margin-top:4px;font-size:.8rem;font-weight:600;background:var(--ts);color:var(--t);padding:5px 9px;border-radius:7px;align-self:flex-start}
.rv-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.rv-table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
table.rv-table th{background:var(--surface-2);text-align:left;padding:9px 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);position:sticky;top:0}
table.rv-table td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.rv-table td:first-child{font-weight:700}
table.rv-table tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 40%, transparent)}
.rv-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rv-list li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.9rem}
.flows{display:grid;gap:16px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--t)}
.flow h4{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow li{display:flex;align-items:center;gap:6px;font-size:.85rem}
.flow li .st{background:var(--ts);color:var(--ink);border:1px solid color-mix(in srgb, var(--t) 40%, transparent);border-radius:8px;padding:5px 9px}
.flow li .st b{font-family:var(--font-mono);color:var(--t);margin-right:5px}
.flow li:not(:last-child)::after{content:"→";color:var(--ink-faint)}
/* recall mode: hide answers until tapped */
.recall .rv-card dd,.recall table.rv-table td:not(:first-child),.recall .flow li .st span{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
.recall .rv-card dd.shown,.recall table.rv-table td.shown,.recall .flow li .st span.shown{filter:none}
.rv-empty{color:var(--ink-faint);padding:30px 0;text-align:center}
mark{background:var(--caution-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- toast ---------- */
#toastHost{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem;animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===================================================================
   ARCADE (fixed dark world)
   =================================================================== */
#panel-arcade{background:var(--ar-bg);color:var(--ar-ink);margin:-16px -20px 0;padding:24px 20px 40px;min-height:70vh;border-radius:0 0 18px 18px;position:relative;overflow:hidden}
#panel-arcade::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);background-size:22px 22px;pointer-events:none}
.ar-wrap{position:relative;max-width:1060px;margin:0 auto}
.ar-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;min-height:220px;padding:22px 24px;border-radius:18px;border:2px solid var(--ar-line);background:linear-gradient(90deg, var(--ar-bg) 0 26%, rgba(12,32,31,.5) 48%, transparent 66%), url(img/arcade-hero.webp) right center/auto 100% no-repeat, var(--ar-bg)}
@media (max-width: 760px){ .ar-hero{min-height:170px;padding:16px;background:linear-gradient(90deg, var(--ar-bg) 0 40%, rgba(12,32,31,.6) 70%, rgba(12,32,31,.3)), url(img/arcade-hero.webp) right center/auto 100% no-repeat, var(--ar-bg)} }
.ar-logo{font-family:var(--font-arcade);font-size:1.35rem;line-height:1.5;color:var(--ar-yellow);text-shadow:3px 3px 0 var(--ar-pink);margin:0}
.ar-logo small{display:block;font-size:.55rem;color:var(--ar-dim);text-shadow:none;margin-top:6px;letter-spacing:.06em}
.ar-stats{display:flex;gap:8px;flex-wrap:wrap}
.ar-stat{background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 12px;font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-stat b{color:var(--ar-ink);font-size:.95rem;margin-left:4px}
.ar-mute{cursor:pointer;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 10px;color:var(--ar-ink)}
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ar-tile{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, border-color .15s;cursor:pointer;text-align:left;padding:0;color:var(--ar-ink)}
.ar-tile:hover,.ar-tile:focus-visible{transform:translateY(-4px);border-color:var(--c)}
.ar-thumb{height:170px;background:var(--ar-panel-2);display:block;width:100%}
.ar-thumb svg{display:block;width:100%;height:100%}
.ar-tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ar-tile h3{font-family:var(--font-arcade);font-size:.85rem;color:var(--c);margin:0;line-height:1.5}
.ar-tile p{margin:0;font-size:.88rem;color:var(--ar-dim)}
.ar-tile .ar-tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.ar-play{font-family:var(--font-arcade);font-size:.65rem;background:var(--c);color:var(--ar-bg);padding:9px 14px;border-radius:8px;box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, #000)}
.ar-best{font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-how{margin-top:26px;background:var(--ar-panel);border:2px dashed var(--ar-line);border-radius:14px;padding:14px 18px;font-size:.88rem;color:var(--ar-dim)}
.ar-how b{color:var(--ar-ink)}

/* game shell */
.gm{display:flex;flex-direction:column;gap:12px}
.gm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-back{font-family:var(--font-arcade);font-size:.6rem;background:var(--ar-panel);border:2px solid var(--ar-line);color:var(--ar-ink);padding:9px 12px;border-radius:8px;cursor:pointer}
.gm-title{font-family:var(--font-arcade);font-size:.8rem;color:var(--c);margin-right:auto}
.gm-hud{display:flex;gap:8px;flex-wrap:wrap}
.gm-hud span{font-family:var(--font-mono);font-size:.8rem;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:8px;padding:5px 10px}
.gm-hud b{color:var(--ar-yellow)}
.gm-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm-select label{font-size:.82rem;color:var(--ar-dim)}
.gm-select select{background:var(--ar-panel);color:var(--ar-ink);border:2px solid var(--ar-line);border-radius:8px;padding:6px 10px;font:inherit;font-size:.86rem;max-width:100%}
.gm-stage{position:relative;background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.gm-overlay{position:absolute;inset:0;background:rgba(10,8,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5;overflow-y:auto}
.gm-overlay h2{font-family:var(--font-arcade);font-size:1rem;color:var(--c);margin:0;line-height:1.6}
.gm-overlay p{margin:0;color:var(--ar-dim);max-width:52ch;font-size:.92rem}
.gm-big{font-family:var(--font-arcade);font-size:1.6rem;color:var(--ar-yellow)}
.gm-btn{font-family:var(--font-arcade);font-size:.7rem;background:var(--c);color:var(--ar-bg);border:0;padding:12px 18px;border-radius:10px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn.alt{background:var(--ar-panel-2);color:var(--ar-ink);box-shadow:0 5px 0 #0a0818}
.gm-missed{width:100%;max-width:560px;text-align:left;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 14px;max-height:240px;overflow-y:auto;font-size:.84rem}
.gm-missed h4{margin:0 0 6px;font-family:var(--font-arcade);font-size:.6rem;color:var(--ar-pink)}
.gm-missed li{margin-bottom:6px;color:var(--ar-ink)}
.gm-missed li span{color:var(--ar-green)}
.gm-keys{font-size:.78rem;color:var(--ar-dim);text-align:center}
.gm-keys kbd{font-family:var(--font-mono);background:var(--ar-panel-2);border:1px solid var(--ar-line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--ar-ink)}

/* Sort Storm */
.ss-stage{height:470px}
.ss-banner{position:absolute;top:12px;left:0;right:0;text-align:center;font-family:var(--font-arcade);font-size:.7rem;color:var(--ar-cyan);line-height:1.6;padding:0 12px;z-index:2}
.ss-card{position:absolute;left:50%;top:0;transform:translate(-50%,0);background:var(--ar-yellow);color:#1a1433;font-weight:800;padding:14px 18px;border-radius:12px;min-width:170px;max-width:78%;text-align:center;font-size:1.02rem;box-shadow:0 6px 0 #b8901c, 0 10px 24px rgba(0,0,0,.4);z-index:3;will-change:transform}
.ss-card.fly-l{transition:transform .22s ease-in, opacity .22s;opacity:.2}
.ss-bins{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.ss-bin{height:110px;border-radius:14px;border:3px dashed var(--bc);background:color-mix(in srgb, var(--bc) 14%, transparent);color:var(--ar-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1rem;cursor:pointer;text-align:center;padding:6px}
.ss-bin kbd{font-family:var(--font-mono);font-size:.72rem;background:var(--ar-bg);border:1px solid var(--ar-line);border-radius:5px;padding:1px 6px;color:var(--ar-dim);font-weight:400}

.hh-kicker{margin:0;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.hh-main h2{font-family:var(--font-display);font-weight:400;font-size:2.4rem;line-height:1.05;margin:4px 0 6px;color:var(--ink)}
.hh-when{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--ink-soft);font-size:.95rem}
.hh-when .ic{width:18px;height:18px;flex:none;color:var(--accent-ink)}
.home-count{display:flex;gap:10px;flex-wrap:wrap}
.hc-unit{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.hc-unit b{font-family:var(--font-display);font-weight:400;font-size:2rem;line-height:1.05;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.hc-unit small{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.home-count.is-live,.home-count.is-done{flex-direction:column;gap:2px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.home-count.is-live b,.home-count.is-done b{color:var(--accent-ink);font-size:1.1rem}
.hh-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.hh-chips span{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.hh-ready{display:flex;align-items:center;gap:16px}
.hh-ring{width:96px;height:96px;flex:none}
.hh-ring-bg{fill:none;stroke:var(--surface-3);stroke-width:9}
.hh-ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:42px 42px;transition:stroke-dashoffset .6s ease}
.hh-ring text{font:700 17px var(--font-mono);fill:var(--ink)}
.hh-ready-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.hh-ready-txt b{font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.hh-ready-txt span{font-size:.86rem;color:var(--ink-soft)}
.home-alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:.92rem}
.home-alert .ic{flex:none;width:20px;height:20px;color:var(--accent-ink);margin-top:1px}
.home-alert.is-due{border-color:var(--caution);background:var(--caution-soft)}
.home-alert.is-due .ic,.home-alert.is-due b{color:var(--caution)}
.home-qs{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.home-col{display:grid;gap:16px;min-width:0}
.home-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.home-card h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:1.15rem}
.home-card h3 .ic{width:20px;height:20px;color:var(--accent-ink)}
.hc-note{margin:0 0 10px;font-size:.84rem;color:var(--ink-soft)}
.home-next{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.home-next li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.home-next li > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.home-next small{color:var(--ink-soft);font-size:.82rem}
.home-next .btn{flex:none}
.hn-ic{flex:none;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink)}
.hn-ic .ic{width:18px;height:18px}
.hl-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hl-list li{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:1px solid var(--line)}
.hl-list li:first-child{border-top:0}
.hl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hl-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.hl-top b{font-size:.93rem}
.hl-who,.hl-meta{font-size:.78rem;color:var(--ink-soft)}
.hl-bar{position:relative;display:block;height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.hl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.hl-tried{background:color-mix(in srgb, var(--t) 35%, transparent)}
.hl-right{background:var(--t)}
.hl-acts{display:flex;gap:6px;flex:none}
.hl-acts .btn{padding:5px 10px;font-size:.8rem}
.home-tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line-strong);display:grid;gap:10px}
.home-tl li{position:relative;display:flex;flex-direction:column;padding-left:6px}
.home-tl li::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:999px;background:var(--surface);border:2px solid var(--line-strong)}
.home-tl .tl-date{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.home-tl .tl-what{font-size:.9rem}
.home-tl .tl-past{opacity:.62}
.home-tl .tl-past::before{background:var(--line-strong)}
.home-tl .tl-today::before{background:var(--accent);border-color:var(--accent)}
.home-tl .tl-due .tl-what{color:var(--caution);font-weight:700}
.home-tl .tl-exam .tl-what{color:var(--accent-ink);font-weight:700}
.home-tl .tl-exam::before{border-color:var(--accent);background:var(--accent-soft)}
.home-tl .tl-later{opacity:.75}
.home-days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin:0 0 10px}
.hd-day{aspect-ratio:1;border-radius:4px;background:var(--surface-3)}
.hd-day.on{background:var(--accent)}
.hd-day.today{outline:2px solid var(--ink-soft);outline-offset:1px}
.home-links{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.9rem;color:var(--ink-soft)}
.home-links .linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--accent-ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media (max-width:900px){.home-hero,.home-grid{grid-template-columns:minmax(0,1fr)}.home-qs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.hh-main h2{font-size:2rem}.hc-unit{min-width:64px}.hc-unit b{font-size:1.6rem}.home-qs{grid-template-columns:minmax(0,1fr)}.hl-list li{flex-wrap:wrap}.hl-acts{width:100%;justify-content:flex-end}.hh-ring{width:80px;height:80px}}

/* ---------- this hub's skin for the shared games (widget/games.js): chart tiles in clinic teal and coral ---------- */
[data-sg-skin="spc"] .sg-cat{font-family:var(--font-display);font-weight:400;font-size:.86rem;line-height:1.25;background:var(--ar-panel-2);border-color:var(--ar-pink)}
[data-sg-skin="spc"] .sg-tile{border-radius:6px;background:#f3fbf9;color:#12302e;box-shadow:inset 0 -5px 0 #cfe6e2,0 3px 0 #2b5a56;text-shadow:none}
[data-sg-skin="spc"] .sg-tile:hover{background:#e2f4f0;filter:none}
[data-sg-skin="spc"] .sg-tile.done.ok{background:#1d6b66;color:#fff;opacity:.6}
[data-sg-skin="spc"] .sg-tile.done.bad{background:#ff8a6b;color:#fff;opacity:.6}
[data-sg-skin="spc"] .sg-wager h3,[data-sg-skin="spc"] .sg-wager-amt{font-family:var(--font-display);font-weight:400}
[data-sg-skin="spc"] .sg-bar{height:10px;border-radius:999px;background:#ff8a6b}
[data-sg-skin="spc"] .sg-bar i{background:#6fcfc4;border-radius:999px}
[data-sg-skin="spc"] .sg-slot{border-bottom:4px solid var(--ar-pink);color:#ffd0c2}
[data-sg-skin="spc"] .sg-mark.ok{background:#1d6b66;color:#fff} [data-sg-skin="spc"] .sg-mark.bad{background:#ff8a6b;color:#fff}
[data-sg-skin="spc"] .sg-esc-card{border-radius:14px}
[data-sg-skin="spc"] .sg-esc-head h3{font-family:var(--font-display);font-weight:400}
/* lobby tiles: an icon and a word instead of drawn art */
.spc-thumb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;min-height:120px;background:radial-gradient(circle at 30% 20%,var(--ar-panel-2),var(--ar-bg));color:var(--c,#ffd166);font-family:var(--font-arcade);font-size:.7rem;letter-spacing:.06em}
.spc-thumb .ic{width:44px;height:44px;stroke-width:1.6}

function recordAnswer(qid, lecId, correct, ctx, choice, picks){
  var s = STATE.seen[qid] || { n:0, c:0, last:null };
  s.n++; if(correct) s.c++; s.last = !!correct; STATE.seen[qid] = s;
  STATE.totalAnswered++;

  var ls = STATE.lecStats[lecId] || { a:0, c:0 }; ls.a++; if(correct) ls.c++; STATE.lecStats[lecId] = ls;
  var d = todayStr(); if(STATE.days.indexOf(d) === -1) STATE.days.push(d);
  checkAchievements();
  saveState();
  renderHeaderStats();
  /* picks: a select-all's ticked options (authored indexes), so the class's wrong ticks reach question_choices */
  document.dispatchEvent(new CustomEvent('spc:answered', { detail:{ qid:qid, lec:lecId, correct:!!correct, ctx:ctx||'bank', choice:(typeof choice === 'number' ? choice : null), picks:(Array.isArray(picks) && picks.length ? picks.slice() : null) } }));
}

function qCardHTML(q, opts){
  opts = opts || {};
  var rid = 'r' + (++RENDER_SEQ);
  var body = '';
  if(q.type === 'mcq'){
    body += '<div class="qcard-choices">';
    choiceOrder(q).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="mcq" data-idx="'+i+'" data-answer="'+(i===q.answer?1:0)+'">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div>';
  } else if(q.type === 'sequence'){
    SEQ_STATE[rid] = { picks:[] };
    body += '<div class="qcard-hint">Tap the steps in order, first to last.</div><div class="qcard-seq-steps">';
    shuffled(q.steps.map(function(s,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="seq" data-step-idx="'+i+'">'+escHtml(q.steps[i])+'</button>';
    });
    /* undo / start over for a wrong tap (student suggestion #3, 2026-10-02); the last step is forced, so grading on it stays */
    body += '</div><div class="qcard-seq-tools" data-role="seq-tools" hidden><button type="button" data-act="seq-undo">Undo last step</button><button type="button" data-act="seq-clear">Start over</button></div>';
  } else if(q.type === 'match'){
    MATCH_STATE[rid] = { sel:null, matched:0, errors:0 };
    body += '<div class="qcard-hint">Tap an item on the left, then its partner on the right.</div><div class="qcard-match-cols"><div class="qcard-match-col">';

/* ===================================================================
   MOCK EXAM: 45 questions in 135 minutes, like the real one (blueprint and limit are in the data above)
   =================================================================== */
function buildMock(){
  var ids = [];
  Object.keys(MOCK_BLUEPRINT).forEach(function(lec){
    var qs = QUESTIONS_BY_LECTURE[lec]||[];
    var take = function(pool, n){
      var fresh = shuffled(pool.filter(function(q){ return !STATE.seen[q.id] || STATE.seen[q.id].last === false; }));
      var rest = shuffled(pool.filter(function(q){ return fresh.indexOf(q) === -1; }));
      return fresh.concat(rest).slice(0, n);
    };
    var multis = take(qs.filter(function(q){ return q.type === 'multi'; }), Math.min(MOCK_MULTI, MOCK_BLUEPRINT[lec]));
    multis.concat(take(qs.filter(function(q){ return q.type === 'mcq'; }), MOCK_BLUEPRINT[lec] - multis.length)).forEach(function(q){ ids.push(q.id); });
  });
  var order = {}; ids.forEach(function(id){ var q = QUESTIONS_BY_ID[id]; order[id] = q.type === 'multi' ? shuffled(q.choices.map(function(c,k){ return k; })) : choiceOrder(q); });
  STATE.mock = { ids: shuffled(ids), t0: Date.now(), picks: {}, order: order, res: {}, submitted: false };
  saveState();
}
var mockTimer = null;
/* Exam-style: pick an answer for every question (no feedback), then Submit to score it and
   review each card. Picks are saved in STATE.mock so a reload keeps your place. */

function renderMock(body){
  clearInterval(mockTimer);
  var m = STATE.mock;
  if(m && !m.picks){ /* a mock started before exam mode: keep it only if it was already finished */
    if(m.ids && Object.keys(m.res||{}).length >= m.ids.length){ m.picks = {}; m.submitted = true; }
    else { STATE.mock = m = null; }
    saveState();
  }
  var total = mockTotal();
  if(!m || !m.ids || !m.ids.length){
    body.innerHTML = '<div class="reading" style="max-width:760px"><h2>Mock Exam</h2><p>'+total+' questions spread over all eight units, a few more for the longer lectures. The exam is 45 questions in 135 minutes, so this mock is the same size. Multiple-answer (select all), two-statement, true/false and numbered-statement items are included; the exam\'s ordering, matching, Hot Spot and fill-in-the-blank items aren\'t (practice matching in the Question Bank). Questions you haven\'t seen or missed last time are picked first.</p><p>It runs like a real exam: choose an answer for each question with no feedback, then submit. The clock counts against 135:00 (3 minutes a question, like the real exam) and turns red past it. A multiple-answer question counts as right only when you pick every right answer and nothing else. Then review every card with its explanation.</p><div class="reading-actions"><button type="button" class="btn primary" id="mockStart">Start the '+total+'-question mock</button></div></div>';
    document.getElementById('mockStart').onclick = function(){ buildMock(); renderMock(body); };
    return;
  }
  var picked = Object.keys(m.picks).length;
  var correct = m.submitted ? m.ids.filter(function(id){ return m.res[id]; }).length : 0;
  var h = '<div class="qfilters" style="padding:4px 0"><span class="pill" id="mockClock">'+icon('clock')+'0:00</span>' +
    (m.submitted ? '<span class="pill countdown">Score '+correct+' / '+m.ids.length+' · '+Math.round(correct/m.ids.length*100)+'%</span>' +
                   '<button type="button" class="btn" id="mockMissed" aria-pressed="'+(!!m.onlyMissed)+'">'+(m.onlyMissed?'Show all questions':'Show only missed')+'</button>'
                 : '<span class="pill" id="mockProg">'+picked+' / '+m.ids.length+' answered</span><button type="button" class="btn primary" id="mockSubmit" data-mock-submit>Submit exam</button>') +
    '<button type="button" class="btn" id="mockNew">New mock</button></div>';
  if(m.submitted){
    h += '<div class="rv-table-wrap" style="margin-bottom:24px"><table class="rv-table"><thead><tr><th>Lecture</th><th>Correct</th><th>Score</th></tr></thead><tbody>' +
      Object.keys(MOCK_BLUEPRINT).map(function(lec){
        var qs = m.ids.filter(function(id){ return QUESTIONS_BY_ID[id] && QUESTIONS_BY_ID[id].lec === lec; });
        var c = qs.filter(function(id){ return m.res[id]; }).length;
        return '<tr><td>'+lecChip(lec)+'</td><td>'+c+' / '+qs.length+'</td><td>'+(qs.length?Math.round(c/qs.length*100):0)+'%</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  h += '<div class="qlist" id="mockList">' + m.ids.map(function(id, i){
    var q = QUESTIONS_BY_ID[id]; if(!q) return '';
    if(m.submitted && m.onlyMissed && m.res[id]) return '';
    var pick = (id in m.picks) ? m.picks[id] : null, isMulti = q.type === 'multi';
    var order = (m.order && m.order[id]) || q.choices.map(function(c,k){ return k; });
    /* multiple answer: picks are a list of choice indexes, drawn as tick boxes; scored after Submit with the bank's partial credit */
    var picks = isMulti ? (pick || []) : (pick === null ? [] : [pick]);
    var choices = order.map(function(k){
      var cls = 'qcard-choice', on = picks.indexOf(k) > -1;
      if(isMulti){
        if(m.submitted){ var right = q.correct.indexOf(k) > -1; if(right && on) cls += ' is-correct'; else if(right) cls += ' is-missed-right'; else if(on) cls += ' is-wrong'; }
        else if(on) cls += ' is-selected';
        return '<button type="button" class="'+cls+'" data-act="multi" data-mock-multi="'+k+'" data-qid="'+id+'"'+(m.submitted?' disabled':'')+' aria-pressed="'+on+'">'+escHtml(q.choices[k])+'</button>';
      }
      if(m.submitted){ if(k === q.answer) cls += ' is-correct'; else if(k === pick) cls += ' is-wrong'; }
      else if(k === pick) cls += ' is-picked';
      return '<button type="button" class="'+cls+'" data-mock-pick="'+k+'" data-qid="'+id+'"'+(m.submitted?' disabled':'')+' aria-pressed="'+(k === pick)+'">'+escHtml(q.choices[k])+'</button>';
    }).join('');
    var verdict = !m.submitted ? '' : pick === null ? '<span class="qcard-verdict bad">Not answered.</span>' : m.res[id] ? '<span class="qcard-verdict ok">Correct.</span>' :
      '<span class="qcard-verdict bad">Missed.</span>' + (isMulti ? ' <span class="multi-score">Partial credit: '+Math.round(multiScore(q, picks)*100)+'%. Dashed = a right answer you missed.</span>' : '');
    return '<div><div class="qcount" style="margin:0 0 4px">Question '+(i+1)+'</div>' +
      '<div class="qcard tag-'+tagOf(q.lec)+(m.submitted?' is-answered':'')+(m.submitted && !m.res[id]?' is-missed':'')+'" data-qid="'+q.id+'" data-qtype="'+q.type+'">' +
      '<div class="qcard-top">'+lecChip(q.lec)+'<span class="src-chip">'+escHtml(SRC_LABEL[q.src]||q.src)+'</span></div>' +
      figHTML(q) + pboxHTML(q) + '<p class="qcard-stem">'+escHtml(q.stem)+'</p>' + (isMulti && !m.submitted ? '<div class="qcard-hint">Select every correct answer.</div>' : '') + '<div class="qcard-choices">'+choices+'</div>' +
      '<div class="qcard-explain" data-role="explain">'+verdict+(m.submitted ? figAfterHTML(q) : '')+escHtml(q.ex||'')+(m.submitted ? whyHTML(q, picks) : '')+cueHTML(q)+
        '<div class="qcard-classdata-row"><span class="qcard-classdata-result" data-role="classdata-result">Loading class data…</span></div></div>' +
      '</div></div>';
  }).join('') + '</div>';
  /* a second Submit at the bottom, so you don't have to scroll back up after the last question (2026-10-20) */
  if(!m.submitted) h += '<div class="mock-foot"><span class="pill" data-mock-prog>'+picked+' / '+m.ids.length+' answered</span><button type="button" class="btn primary" data-mock-submit>Submit exam</button></div>';
  body.innerHTML = h;
  var list = document.getElementById('mockList');
  if(!m.submitted){
    list.addEventListener('click', function(e){
      var mb = e.target.closest('[data-mock-multi]');
      if(mb){ /* tick or untick one answer; an empty list counts as unanswered */
        var mid = mb.getAttribute('data-qid'), k = +mb.getAttribute('data-mock-multi'), cur = (m.picks[mid] || []).slice(), at = cur.indexOf(k);
        if(at > -1) cur.splice(at, 1); else cur.push(k);
        if(cur.length) m.picks[mid] = cur; else delete m.picks[mid];
        saveState();
        mb.classList.toggle('is-selected', at === -1); mb.setAttribute('aria-pressed', String(at === -1));
      }
      var b = mb ? null : e.target.closest('[data-mock-pick]'); if(!b && !mb) return;
      if(b){
        var id = b.getAttribute('data-qid');
        m.picks[id] = +b.getAttribute('data-mock-pick'); saveState();
        b.parentNode.querySelectorAll('[data-mock-pick]').forEach(function(x){ x.classList.toggle('is-picked', x === b); x.setAttribute('aria-pressed', String(x === b)); });
      }
      body.querySelectorAll('#mockProg, [data-mock-prog]').forEach(function(pr){ pr.textContent = Object.keys(m.picks).length + ' / ' + m.ids.length + ' answered'; });
      body.querySelectorAll('[data-mock-submit][data-confirm]').forEach(function(sb){ sb.removeAttribute('data-confirm'); sb.textContent = 'Submit exam'; });
    });
    var submitMock = function(){
      var left = m.ids.length - Object.keys(m.picks).length;
      if(left > 0 && !this.getAttribute('data-confirm')){ this.setAttribute('data-confirm','1'); this.textContent = left + ' unanswered: submit anyway?'; return; }
      m.submitted = true; m.tEnd = Date.now(); m.res = {};
      m.ids.forEach(function(id){
        var q = QUESTIONS_BY_ID[id]; if(!q) return;
        var multiQ = q.type === 'multi';
        var ok = (id in m.picks) && (multiQ ? multiScore(q, m.picks[id]) === 1 : m.picks[id] === q.answer);
        m.res[id] = ok;
        if(id in m.picks) recordAnswer(q.id, q.lec, ok, 'mock', multiQ ? null : m.picks[id]);
      });
      /* for the shared widget's trophies (a 90%+ mock on 20 or more questions) and its results card (widget/fx.js) */
      var nRight = m.ids.filter(function(id){ return m.res[id]; }).length;
      var byLec = Object.keys(MOCK_BLUEPRINT).map(function(lec){
        var l = LECTURE_BY_ID[lec], qs = m.ids.filter(function(id){ return QUESTIONS_BY_ID[id] && QUESTIONS_BY_ID[id].lec === lec; });
        return { label: l ? lecLabel(l) + ' · ' + l.title.split(':')[0].split(',')[0] : lec, correct: qs.filter(function(id){ return m.res[id]; }).length, total: qs.length };
      });
      document.dispatchEvent(new CustomEvent('sh:mock-done', { detail:{ correct:nRight, total:m.ids.length, byLec:byLec } }));
      saveState(); renderMock(body); window.scrollTo(0,0);
    };
    body.querySelectorAll('[data-mock-submit]').forEach(function(sb){ sb.onclick = submitMock; });
  } else {
    document.getElementById('mockMissed').onclick = function(){ m.onlyMissed = !m.onlyMissed; saveState(); renderMock(body); };
  }
  document.getElementById('mockNew').onclick = function(){ STATE.mock = null; saveState(); renderMock(body); };
  var clock = document.getElementById('mockClock');
  function tick(){ if(!document.body.contains(clock)){ clearInterval(mockTimer); return; } var end = m.tEnd || Date.now(); var sec = Math.floor((end - m.t0)/1000); clock.innerHTML = icon('clock') + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0') + ' / ' + Math.round(MOCK_LIMIT/60) + ':00'; clock.classList.toggle('is-over', sec > MOCK_LIMIT); }
  tick(); if(!m.submitted) mockTimer = setInterval(tick, 1000);
}

  function SortStorm(){
    var g = GAMES[0], root, stage, cardEl, bins, raf = null, last = 0;
    var st = null;
    function pickSet(){

      if(choice !== 'mix'){ var s = SORT_SETS.filter(function(x){ return x.id === choice; })[0]; if(s) return s; }
      var pool = SORT_SETS.filter(function(x){ return !st || !st.set || x.id !== st.set.id; });
      return pool[Math.floor(Math.random()*pool.length)];
    }
    function newWave(){
      st.set = pickSet(); st.queue = shuffled(st.set.items).slice(0, 8); st.wave++;
      bins.forEach(function(b, i){ b.querySelector('span').textContent = st.set.bins[i]; });
      root.querySelector('.ss-banner').textContent = st.set.title.toUpperCase();
    }
    function nextCard(){
      if(!st.queue.length) newWave();
      st.cur = st.queue.shift(); st.y = 46; st.busy = false;
      cardEl.className = 'ss-card'; cardEl.style.transition = 'none'; cardEl.style.opacity = '1';
      cardEl.textContent = st.cur[0];
      cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
    }
    function floorY(){ return stage.clientHeight - 130 - cardEl.offsetHeight; }
    function pop(txt, color, x, y){ var p = document.createElement('div'); p.className = 'ss-pop'; p.style.color = color; p.style.left = x + 'px'; p.style.top = y + 'px'; p.textContent = txt; stage.appendChild(p); setTimeout(function(){ p.remove(); }, 800); }
    function judge(binIdx){
      if(!st || !st.running || st.busy || !st.cur) return;
      st.busy = true;
      var ok = binIdx === st.cur[1];
      var bin = bins[binIdx < 0 ? st.cur[1] : binIdx];
      if(binIdx >= 0){
        var dx = binIdx === 0 ? -stage.clientWidth/4 : stage.clientWidth/4;
        cardEl.style.transition = 'transform .22s ease-in, opacity .22s';
        cardEl.style.transform = 'translate(calc(-50% + '+dx+'px),' + (stage.clientHeight - 100) + 'px) scale(.6)';
        cardEl.style.opacity = '.2';
      }
      if(ok){
        st.combo++; st.correct++;
        var pts = 50 + Math.round(50 * Math.max(0, 1 - st.y / floorY())) ;
        pts *= (1 + Math.floor(st.combo / 4));
        st.score += pts; sGood();
        bin.classList.add('flash-good'); pop('+' + pts + (st.combo >= 4 ? ' x' + (1 + Math.floor(st.combo/4)) : ''), '#7ee36b', bin.offsetLeft + 20, bin.offsetTop - 20);
        if(st.correct % 6 === 0){ st.level++; st.speed += 9; pop('SPEED UP!', '#ffd23f', stage.clientWidth/2 - 50, 80); }
      } else {
        st.combo = 0; st.lives--; sBad();
        (binIdx >= 0 ? bins[binIdx] : bins[st.cur[1]]).classList.add('flash-bad');
        st.missed.push({ q: st.cur[0] + ' (' + st.set.title.replace('?','') + ')', a: st.set.bins[st.cur[1]] });
        pop(binIdx < 0 ? 'TOO SLOW' : 'MISS', '#ff5c8a', stage.clientWidth/2 - 30, st.y + 40);
      }
      hud(root, { score: st.score, lives: hearts(st.lives), level: st.level });
      setTimeout(function(){
        bins.forEach(function(b){ b.classList.remove('flash-good','flash-bad'); });
        if(!st || !st.running) return;
        if(st.lives <= 0) return over();
        nextCard();
      }, binIdx < 0 ? 450 : 260);
    }
    function loop(t){
      if(!st || !st.running) return;
      var dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
      if(!st.busy && st.cur){

    }

    return {
      mount: function(p){
        var opts = '<option value="mix"'+(STATE.arcade.sortSet==='mix'?' selected':'')+'>Shuffle all sorts</option>' + SORT_SETS.map(function(s){ return '<option value="'+s.id+'"'+(STATE.arcade.sortSet===s.id?' selected':'')+'>'+escHtml(s.title)+'</option>'; }).join('');

          '<div class="gm-stage ss-stage"><div class="ss-banner"></div><div class="ss-card" id="ssCard"></div><div class="ss-danger"></div><div class="ss-bins"><button type="button" class="ss-bin" style="--bc:var(--ar-yellow)" data-bin="0"><span></span><kbd>← / A</kbd></button><button type="button" class="ss-bin" style="--bc:var(--ar-pink)" data-bin="1"><span></span><kbd>→ / D</kbd></button></div>' +
            overlayHTML(g, 'FEEDBACK SORT', 'Each card belongs in one of two bins. Press ← or → (or tap a bin) before it crosses the dashed line. Hold ↓ to drop faster for bonus points. Streaks of 4 multiply your score.', 'START') + '</div>',
          '<kbd>←</kbd> <kbd>→</kbd> sort · <kbd>↓</kbd> fast drop · tap a bin on mobile');
        root = p.querySelector('.gm'); stage = p.querySelector('.ss-stage'); cardEl = p.querySelector('#ssCard'); bins = [].slice.call(p.querySelectorAll('.ss-bin'));
        var preview = SORT_SETS.filter(function(s){ return s.id === STATE.arcade.sortSet; })[0] || SORT_SETS[0];
        bins.forEach(function(b,i){ b.querySelector('span').textContent = preview.bins[i]; });
        cardEl.textContent = '?';
        bindCommon(root);
        stage.addEventListener('click', function(e){ var b = e.target.closest('[data-bin]'); if(b) judge(+b.getAttribute('data-bin')); if(e.target.closest('[data-start]')) start(); });

        document.addEventListener('keydown', onKey); document.addEventListener('keyup', onKeyUp);
      },
      stop: function(){ if(st) st.running = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onKeyUp); }
    };
  }

  if(!g) return;
  if(g.v === 'notes'){ STATE.ui.lec = g.lec; STATE.ui.sub = 'notes'; STATE.ui.level = 'full'; saveState(); setMode('compendium');
    shFlashIn(function(){ var p = document.querySelector('#compBody .reading-prose'); return p && Array.prototype.filter.call(p.querySelectorAll('p, li, h3, h4'), function(el){ return !el.closest('[data-sh-noread]'); })[g.k]; }); }
  else if(g.v === 'cram'){ STATE.ui.sub = 'cram'; saveState(); setMode('compendium'); shFlashIn('#cram-' + g.lec); }
  else if(g.v === 'hints'){ STATE.ui.sub = 'hints'; saveState(); setMode('compendium');
    shFlashIn(function(){ var a = document.querySelector('#compBody .hint-group [data-lec="' + g.lec + '"]'); return a && a.closest('.hint-group'); }); }
  else if(g.v === 'review'){ reviewSearch = g.q || ''; setMode('review'); }
  else if(g.v === 'bank'){ STATE.ui.sub = 'bank'; STATE.ui.qlec = 'all'; STATE.ui.qsrc = 'all'; STATE.ui.qfmt = 'all'; STATE.ui.qstatus = 'all'; bankSearch = g.q || ''; bankShown = BANK_PAGE; saveState(); setMode('compendium'); }
};

/* Progress sync (widget/v3.js, migration_v34): the widget reads back every answer saved for you on the server,
   including from your linked devices, and hands each question's totals here. Keep whichever copy has more tries,
   so answers made only on this device are never lost. */
var SYNC_LOADED = Date.now();
window.SH_SYNC = {
  merge: function(byQid, days){
    var changed = false, added = 0;
    Object.keys(byQid).forEach(function(id){
      var q = QUESTIONS_BY_ID[id]; if(!q) return;
      var sv = byQid[id], s = STATE.seen[id] || { n:0, c:0, last:null };
      if(sv.n <= s.n) return;
      var dn = sv.n - s.n, dc = Math.max(0, sv.c - s.c);
      if(!s.n) added++;
      STATE.totalAnswered += dn; STATE.totalCorrect += dc;
      var ls = STATE.lecStats[q.lec] || { a:0, c:0 }; ls.a += dn; ls.c += dc; STATE.lecStats[q.lec] = ls;
      STATE.seen[id] = { n:sv.n, c:Math.max(sv.c, s.c), last:sv.last };
      changed = true;
    });
    (days || []).forEach(function(d){ if(STATE.days.indexOf(d) === -1){ STATE.days.push(d); changed = true; } });
    if(!changed) return;
    STATE.days.sort();
    checkAchievements(); saveState(); renderHeaderStats();
    if(added) toast('Synced ' + added + ' question' + (added === 1 ? '' : 's') + ' from your other devices', 'check');
    /* redraw the page only right after it opens, so nobody loses a question they're in the middle of */
    if(Date.now() - SYNC_LOADED < 8000 && !(window.shTTS && window.shTTS.listening && window.shTTS.listening())){ if(STATE.ui.mode === 'home') renderHome(); else if(STATE.ui.mode === 'compendium' && STATE.ui.sub !== 'mock') renderCompendium(); }
  }
};

/* Daily drill (widget/drill.js): the widget picks each day's questions from this pool and asks the hub to
   draw each card, so answers go through recordAnswer like anywhere else. */
window.SH_DRILL = {
  pool: function(){
    return QUESTIONS.map(function(q){ var s = STATE.seen[q.id]; return { id:q.id, lec:q.lec, last: s ? !!s.last : null, hy: DRILL_HY[q.src] || '' }; });
  },
  render: function(el, qid){ return window.shHubContent.renderQuestion(el, function(){ var q = QUESTIONS_BY_ID[qid]; if(!q) return false; el.innerHTML = qCardHTML(q, { ctx:'drill' }); wireQuestionContainer(el); return true; }); }
};

/* Published for the shared widget (search + toughest-questions labels) — see widget/v3.js. */
function shExportQuestion(q){
  var hint = '';
  if(q && q.type === 'mcq' && q.choices) hint = q.choices[q.answer] || '';
  else if(q && q.type === 'multi' && q.correct && q.choices) hint = q.correct.map(function(k){ return q.choices[k]; }).join('; ');
  else if(q && q.type === 'sequence' && q.steps) hint = q.steps.join(' → ');
  else if(q && q.pairs) hint = q.pairs.map(function(p){ return p.join(': '); }).join('; ');
  if(q && q.ex) hint += (hint ? ' — ' : '') + q.ex;
  return { id:q && q.id, lec:q && q.lec, text:(q && q.stem) || '', hint:hint, choices:(q && q.choices) || null, answer:(q && q.type === 'mcq' ? q.answer : null) };
}
window.SH_EXPORT = {
  get lectures(){ return (LECTURES || []).map(function(l){ return { id:l.id, title:''+lecLabel(l)+' ' + l.title, who:l.who, status:l.status }; }); },
  get questions(){ return (QUESTIONS || []).map(shExportQuestion); },
  get sections(){ return shSearchSections(); },
  get hints(){ return (HINTS || []).map(function(x){ return { lec:x.lec, quote:x.quote }; }); },
  get exams(){ return [ { label:'Special Patient Care exam', date:EXAM_DATE, archiveHour:0 } ]; }
};

})();
