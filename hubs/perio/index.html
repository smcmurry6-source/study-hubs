      d.el.classList.add('gone'); d.el.style.transform += ' scale(.6)'; setTimeout(function(){ d.el.remove(); }, 260);
      if(S.planed % 6 === 0) S.level++;
      hud(); input.value = '';
    } else {
      S.streak = 0; C.SFX.bad(); input.classList.remove('gm-shake'); void input.offsetWidth; input.classList.add('gm-shake'); input.select();
    }
  }
  function begin(){
    var ov = stage.querySelector('[data-overlay]'); if(ov) ov.remove();
    field.querySelectorAll('.rp-dep').forEach(function(x){ x.remove(); });
    draw = C.dealer(pool()); S = { score:0, lives:3, level:1, streak:0, planed:0, deps:[], missed:[], spawnIn:0.3 };
    running = true; paused = false; last = 0; hud(); input.value = ''; input.disabled = false; input.focus();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }
  function end(){ running = false; cancelAnimationFrame(raf); input.disabled = true; C.finish(g, root, S.score, S.missed, { note:'You planed <b>' + S.planed + '</b> deposit' + (S.planed === 1 ? '' : 's') + '.' }); }
  return {
    mount:function(panel){
      panel.innerHTML = C.shell(g, { select:C.scopeSelectHTML('terms', 6), stage:'<div class="gm-stage rp-stage" data-stage><div class="rp-canvas-wrap" data-field></div><div class="rp-gum"></div></div>', below:'<form class="rp-input" data-form autocomplete="off"><input type="text" data-in placeholder="Type the answer and press Enter" autocapitalize="characters" spellcheck="false" disabled><button type="submit" class="gm-btn">Plane</button></form>', keys:'Type the term for any deposit and press <kbd>Enter</kbd> · deposits get a first-letter hint halfway down' });
      root = panel.querySelector('.gm'); stage = root.querySelector('[data-stage]'); field = root.querySelector('[data-field]'); input = root.querySelector('[data-in]');
      stage.insertAdjacentHTML('beforeend', C.introHTML(g, 'Calculus deposits slide down the root, each carrying a clue. Type the term it describes and press Enter to plane it off. Let one reach the gumline and you lose a life. Three lives; it speeds up as you go.', 'Start planing'));
      S = { score:0, lives:3, level:1 }; hud();
      stage.addEventListener('click', function(e){ if(e.target.closest('[data-start]')) begin(); else if(running) input.focus(); });
      root.querySelector('[data-form]').addEventListener('submit', function(e){ e.preventDefault(); if(running) submit(); });
    },
    pause:function(){ if(running) paused = true; },
    stop:function(){ running = false; cancelAnimationFrame(raf); }
  };
};

/* =================================================================== CROSS-SECTION
   A fresh mini crossword generated from the course terms every game. */
GAME_IMPL.cross = function(g, C){
  var root, stage, S, running = false, hidden, clockT = 0;
  function build(words){
    var best = null;
    for(var attempt=0; attempt<40; attempt++){
      var list = shuffled(words).slice(0, 16), G = {}, placed = [];
      function get(x,y){ return G[x+','+y]; }
      function canPlace(w, x, y, dir){
        var dx = dir === 'A' ? 1 : 0, dy = dir === 'D' ? 1 : 0, cross = 0;
        if(get(x - dx, y - dy) || get(x + dx*w.length, y + dy*w.length)) return -1;
        for(var i=0;i<w.length;i++){
          var cx = x + dx*i, cy = y + dy*i, ch = get(cx, cy);
          if(ch){ if(ch !== w[i]) return -1; cross++; }
          else { if(get(cx + dy, cy + dx) || get(cx - dy, cy - dx)) return -1; }
        }
        return cross;
      }
      function put(t, x, y, dir){ var dx = dir === 'A' ? 1 : 0, dy = dir === 'D' ? 1 : 0; for(var i=0;i<t.w.length;i++) G[(x+dx*i)+','+(y+dy*i)] = t.w[i]; placed.push({ t:t, x:x, y:y, dir:dir }); }
      put(list[0], 0, 0, 'A');
      for(var k=1;k<list.length && placed.length < 9;k++){
        var t = list[k], w = t.w, opts = [];
        Object.keys(G).forEach(function(key){
          var p = key.split(','), gx = +p[0], gy = +p[1], ch = G[key];
          for(var i=0;i<w.length;i++){ if(w[i] !== ch) continue;
            ['A','D'].forEach(function(dir){ var x = dir === 'A' ? gx - i : gx, y = dir === 'D' ? gy - i : gy, c = canPlace(w, x, y, dir); if(c > 0) opts.push({ x:x, y:y, dir:dir, c:c }); }); }
        });
        if(!opts.length) continue;
        opts.sort(function(a,b){ return b.c - a.c; });
        var o = opts[Math.floor(Math.random() * Math.min(3, opts.length))];
        var xs = Object.keys(G).map(function(k2){ return +k2.split(',')[0]; }).concat([o.x, o.dir === 'A' ? o.x + w.length - 1 : o.x]);
        var ys = Object.keys(G).map(function(k2){ return +k2.split(',')[1]; }).concat([o.y, o.dir === 'D' ? o.y + w.length - 1 : o.y]);
        if(Math.max.apply(null, xs) - Math.min.apply(null, xs) > 12 || Math.max.apply(null, ys) - Math.min.apply(null, ys) > 11) continue;
        put(t, o.x, o.y, o.dir);
      }
      if(!best || placed.length > best.placed.length) best = { placed:placed, G:G };
      if(placed.length >= 8) break;
    }
    var xs = [], ys = [];
    Object.keys(best.G).forEach(function(k){ var p = k.split(','); xs.push(+p[0]); ys.push(+p[1]); });
    var minX = Math.min.apply(null, xs), minY = Math.min.apply(null, ys);
    var W = Math.max.apply(null, xs) - minX + 1, H = Math.max.apply(null, ys) - minY + 1;
    var sol = {}; Object.keys(best.G).forEach(function(k){ var p = k.split(','); sol[(+p[0]-minX)+','+(+p[1]-minY)] = best.G[k]; });
    var entries = best.placed.map(function(p){ return { t:p.t, x:p.x - minX, y:p.y - minY, dir:p.dir }; });
    var starts = {}; entries.forEach(function(e){ starts[e.x+','+e.y] = 1; });
    var num = 0, nums = {};
    for(var y=0;y<H;y++) for(var x=0;x<W;x++) if(starts[x+','+y]) nums[x+','+y] = ++num;
    entries.forEach(function(e){ e.n = nums[e.x+','+e.y]; });
    entries.sort(function(a,b){ return a.n - b.n; });
    return { W:W, H:H, sol:sol, entries:entries, nums:nums };
  }
  function cellsOf(e){ var out = []; for(var i=0;i<e.t.w.length;i++) out.push(e.dir === 'A' ? (e.x+i)+','+e.y : e.x+','+(e.y+i)); return out; }
  function newPuzzle(){
    var words = C.termPool(C.currentScope(root), function(t){ return t.w.length >= 3 && t.w.length <= 11; });
    if(words.length < 8) words = C.termPool('all', function(t){ return t.w.length >= 3 && t.w.length <= 11; });
    S.P = build(words); S.fill = {}; S.marks = {}; S.cur = 0; S.pos = 0; S.pen = 0; S.start = Date.now(); render();
  }
  function curEntry(){ return S.P.entries[S.cur]; }
  function render(){
    var P = S.P, e = curEntry(), wc = cellsOf(e), at = wc[S.pos];
    var grid = '';
    for(var y=0;y<P.H;y++) for(var x=0;x<P.W;x++){
      var k = x+','+y;
      if(!P.sol[k]){ grid += '<div class="cx-cell"></div>'; continue; }
      var cls = 'cx-cell on' + (wc.indexOf(k) > -1 ? ' word' : '') + (k === at ? ' cur' : '') + (S.marks[k] ? ' ' + S.marks[k] : '');
      grid += '<div class="'+cls+'" data-cx="'+k+'">'+(P.nums[k] ? '<em>'+P.nums[k]+'</em>' : '')+'<span>'+(S.fill[k]||'')+'</span></div>';
    }
    function clueList(dir){ return P.entries.map(function(en, i){ if(en.dir !== dir) return ''; var done = cellsOf(en).every(function(k){ return S.fill[k] === P.sol[k]; }); return '<li><button type="button" class="cx-clue'+(i===S.cur?' cur':'')+(done?' done':'')+'" data-clue="'+i+'"><b>'+en.n+'</b>'+escHtml(en.t.c)+' <span class="mono">('+en.t.w.length+')</span></button></li>'; }).join(''); }
    root.querySelector('[data-body]').innerHTML = '<div><div class="cx-grid" style="grid-template-columns:repeat('+P.W+',auto)">'+grid+'</div>' +
      '<div class="cx-tools"><button type="button" class="gm-btn alt" data-cx-act="check">Check (−25)</button><button type="button" class="gm-btn alt" data-cx-act="letter">Reveal letter (−15)</button><button type="button" class="gm-btn alt" data-cx-act="word">Reveal word (forfeits it)</button></div></div>' +
      '<div style="min-width:0"><div class="cx-cur">'+e.n+(e.dir==='A'?' Across':' Down')+' · '+escHtml(e.t.c)+'</div><div class="cx-clues"><div><h4>Across</h4><ol>'+clueList('A')+'</ol></div><div><h4>Down</h4><ol>'+clueList('D')+'</ol></div></div></div>';
  }
  function hud(){ C.setHud(root, { score:S.total, words:S.P ? S.P.entries.length : 0, time:S.start ? Math.floor((Date.now() - S.start)/1000) + 's' : '0s' }); }
  function select(i, pos){ S.cur = i; S.pos = pos || 0; var wc = cellsOf(curEntry()); while(S.pos < wc.length - 1 && S.fill[wc[S.pos]] && pos === undefined) S.pos++; render(); focusHidden(); }
  function focusHidden(){ try{ hidden.focus({ preventScroll:true }); }catch(e){ hidden.focus(); } }
  function typeLetter(L){
    var wc = cellsOf(curEntry()), k = wc[S.pos]; S.fill[k] = L; delete S.marks[k];
    if(S.pos < wc.length - 1) S.pos++;
    else { var nxt = S.P.entries.findIndex(function(en, i){ return i > S.cur && cellsOf(en).some(function(c){ return !S.fill[c]; }); }); if(nxt > -1){ select(nxt); return; } }
    render(); checkDone();
  }
  function back(){ var wc = cellsOf(curEntry()), k = wc[S.pos]; if(S.fill[k]){ delete S.fill[k]; } else if(S.pos > 0){ S.pos--; delete S.fill[wc[S.pos]]; } render(); }
  function checkDone(){
    var all = Object.keys(S.P.sol).every(function(k){ return S.fill[k] === S.P.sol[k]; });
    if(!all) return;
    var secs = Math.round((Date.now() - S.start)/1000), n = S.P.entries.length, earned = n - (S.revealed || 0);
    var pts = Math.max(0, earned * 120 + Math.round(Math.max(0, 480 - secs) * earned / n) - S.pen);
    S.total += pts; running = false; clearInterval(clockT); C.SFX.win(); hud();
    Object.keys(S.P.sol).forEach(function(k){ S.marks[k] = 'ok'; }); render();
    C.finish(g, root, S.total, S.missed, { title:'Solved!', win:earned === n, note:n + ' words in ' + secs + 's' + (S.revealed ? ' · ' + S.revealed + ' revealed' : '') + (S.pen ? ' · penalties −' + S.pen : '') });
  }
  function act(a){
    var P = S.P, e = curEntry(), wc = cellsOf(e);
    if(a === 'check'){ S.pen += 25; Object.keys(S.fill).forEach(function(k){ S.marks[k] = S.fill[k] === P.sol[k] ? 'ok' : 'bad'; }); C.SFX.tick(); }
    if(a === 'letter'){ var k = wc[S.pos]; S.pen += 15; S.fill[k] = P.sol[k]; S.marks[k] = 'ok'; }
    if(a === 'word'){ if(wc.every(function(k3){ return S.fill[k3] === P.sol[k3]; })) return; S.revealed = (S.revealed||0) + 1; wc.forEach(function(k2){ S.fill[k2] = P.sol[k2]; S.marks[k2] = 'ok'; }); S.missed.push({ q:e.t.c, a:e.t.w }); }
    render(); checkDone(); focusHidden();
  }
  function begin(){ var ov = stage.querySelector('[data-overlay]'); if(ov) ov.remove(); S = { total:0, missed:[] }; running = true; newPuzzle(); hud(); clearInterval(clockT); clockT = setInterval(function(){ if(running) hud(); }, 1000); focusHidden(); }
  function kd(e){
    if(!running || !root || !document.body.contains(root)) return;
    if(e.target && e.target.tagName === 'SELECT') return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var wc = cellsOf(curEntry());
    if(/^[a-zA-Z]$/.test(e.key)){ e.preventDefault(); typeLetter(e.key.toUpperCase()); }
    else if(e.key === 'Backspace'){ e.preventDefault(); back(); }
    else if(e.key === 'Tab' || e.key === 'Enter'){ e.preventDefault(); select((S.cur + (e.shiftKey ? S.P.entries.length - 1 : 1)) % S.P.entries.length); }
    else if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); if(S.pos < wc.length - 1){ S.pos++; render(); } }
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); if(S.pos > 0){ S.pos--; render(); } }
  }
  return {
    mount:function(panel){
      panel.innerHTML = C.shell(g, { hud:['score','words','time'], select:C.scopeSelectHTML('terms', 8), stage:'<div class="gm-stage cx-stage" data-stage><input class="cx-hidden" data-hidden autocapitalize="characters" autocomplete="off" aria-label="Crossword input"><div data-body style="display:contents"></div></div>', keys:'Tap a square or clue, then type · <kbd>Tab</kbd> next clue · <kbd>⌫</kbd> erase · checks and reveals cost points' });
      root = panel.querySelector('.gm'); stage = root.querySelector('[data-stage]'); hidden = root.querySelector('[data-hidden]');
      S = { total:0, missed:[] };
      stage.insertAdjacentHTML('beforeend', C.introHTML(g, 'A new mini crossword from the course terms every game. Fill every square; the faster you finish, the bigger the time bonus. Checking and revealing letters costs points.', 'New puzzle'));
      stage.addEventListener('click', function(e){
        if(e.target.closest('[data-start]')){ begin(); return; }
        if(!running) return;
        var cl = e.target.closest('[data-clue]'); if(cl){ select(+cl.getAttribute('data-clue')); return; }
        var a = e.target.closest('[data-cx-act]'); if(a){ act(a.getAttribute('data-cx-act')); return; }
        var c = e.target.closest('[data-cx]');
        if(c){
          var k = c.getAttribute('data-cx'), cands = [];
          S.P.entries.forEach(function(en, i){ var p = cellsOf(en).indexOf(k); if(p > -1) cands.push({ i:i, p:p }); });
          var curHas = cands.filter(function(x){ return x.i === S.cur; })[0];
          var choice = curHas && cands.length > 1 && cellsOf(curEntry())[S.pos] === k ? cands.filter(function(x){ return x.i !== S.cur; })[0] : (curHas || cands[0]);
          if(choice) select(choice.i, choice.p);
        }
      });
      hidden.addEventListener('input', function(){ var v = normWord(hidden.value); hidden.value = ''; if(!running) return; v.split('').forEach(typeLetter); });
      document.addEventListener('keydown', kd);
    },
    stop:function(){ running = false; clearInterval(clockT); document.removeEventListener('keydown', kd); }
  };
};

/* =================================================================== MILLION-DOLLAR SMILE
   Quiz-show ladder on the question bank: 12 rungs, safe havens at $1,000 and
   $32,000, three lifelines (50:50, Ask the Class, Swap). */
GAME_IMPL.smile = function(g, C){
  var LADDER = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000], SAFE = [4, 9];
  var root, stage, S, running = false, draw;
  function money(n){ return '$' + Number(n).toLocaleString(); }
  function banked(){ return S.rung > 0 ? LADDER[S.rung - 1] : 0; }
  function safeAmount(){ var s = 0; SAFE.forEach(function(i){ if(S.rung > i) s = LADDER[i]; }); return s; }
  function ladderHTML(){ return '<ol class="ms-ladder">' + LADDER.map(function(v, i){ return '<li class="'+(SAFE.indexOf(i) > -1 ? 'safe ' : '')+(i === S.rung ? 'on' : i < S.rung ? 'done' : '')+'"><span>'+(i+1)+'</span><span>'+money(v)+'</span></li>'; }).join('') + '</ol>'; }
  function newQ(){ S.deal = C.dealMCQ(draw(), 4); S.gone = []; S.locked = -1; S.note = ''; render(); }
  function render(){
    var d = S.deal, l = LECTURE_BY_ID[d.q.lec];
    root.querySelector('[data-body]').innerHTML = '<div class="ms-main"><div class="ms-life">' +
      '<button type="button" class="ms-lifebtn" data-life="fifty"'+(S.used.fifty?' disabled':'')+'>50:50</button>' +
      '<button type="button" class="ms-lifebtn" data-life="class"'+(S.used.class?' disabled':'')+'>Ask the class</button>' +
      '<button type="button" class="ms-lifebtn" data-life="swap"'+(S.used.swap?' disabled':'')+'>Swap question</button>' +
      '<button type="button" class="ms-lifebtn" data-walk style="margin-left:auto;border-color:var(--ar-coral);color:var(--ar-coral)"'+(S.rung === 0 ? ' disabled' : '')+'>Walk away with '+money(banked())+'</button></div>' +
      '<div class="ms-q"><div style="font-family:var(--font-mono);font-size:.72rem;color:var(--ar-dim);margin-bottom:6px">FOR '+money(LADDER[S.rung])+' · S'+l.num+' '+escHtml(shortTitle(l))+'</div>'+escHtml(d.q.stem)+'</div>' +
      '<div class="ms-opts">' + d.opts.map(function(o, i){ return '<button type="button" class="ms-opt'+(S.gone.indexOf(i) > -1 ? ' gone' : '')+(S.locked === i ? ' locked' : '')+'" data-ms="'+i+'"><b>'+C.LETTERS[i]+':</b><span>'+escHtml(o.text)+'</span></button>'; }).join('') + '</div>' +
      '<div class="ms-note" data-note>'+S.note+'</div></div>' + ladderHTML();
  }
  function hud(){ C.setHud(root, { score:money(banked()), rung:(S.rung + 1) + '/12' }); }
  function lock(i){
    if(S.locked > -1 || S.gone.indexOf(i) > -1) return;
    S.locked = i; render(); C.SFX.tick();
    var d = S.deal;
    setTimeout(function(){
      if(!running) return;
      var ok = i === d.right;
      recordAnswer(d.q.id, d.q.lec, ok);
      var btns = root.querySelectorAll('[data-ms]');
      btns[d.right].classList.remove('locked'); btns[d.right].classList.add('right');
      if(ok){
        C.SFX.good(); S.rung++; hud();
        if(S.rung >= LADDER.length){ setTimeout(function(){ end(LADDER[LADDER.length-1], true); }, 1000); return; }
        var note = root.querySelector('[data-note]'); if(note) note.innerHTML = '<b>Correct!</b> ' + (SAFE.indexOf(S.rung - 1) > -1 ? money(LADDER[S.rung - 1]) + ' is now safe. ' : '') + (d.q.ex ? escHtml(d.q.ex) : '');
        setTimeout(function(){ if(running) newQ(); }, d.q.ex ? 2600 : 1400);
      } else {
        C.SFX.bad(); S.missed.push({ q:d.q.stem, a:d.q.choices[d.q.answer] });
        var n2 = root.querySelector('[data-note]'); if(n2) n2.innerHTML = 'The answer was <b>' + escHtml(d.opts[d.right].text) + '</b>. You leave with ' + money(safeAmount()) + '.';
        setTimeout(function(){ end(safeAmount(), false); }, 2600);
      }
    }, 1100);
  }
  function lifeline(k){
    if(S.used[k] || S.locked > -1) return;
    S.used[k] = true; var d = S.deal;
    if(k === 'fifty'){
      S.gone = shuffled([0,1,2,3].filter(function(i){ return i !== d.right; })).slice(0, 2);
      S.note = 'Two wrong answers removed.'; render();
    } else if(k === 'swap'){
      newQ(); S.note = 'Fresh question, same rung.'; render();
    } else if(k === 'class'){
      var wrong = [0,1,2,3].filter(function(i){ return i !== d.right && S.gone.indexOf(i) === -1; });
      if(wrong.length > 1) S.gone.push(pick(wrong));
      S.note = 'The class rules one answer out. Checking how classmates did on this question…'; render();
      var qid = d.q.id;
      if(window.shGetClassStats) window.shGetClassStats([qid], function(by){
        if(!running || S.deal.q.id !== qid) return;
        var r = by[qid];
        S.note = 'The class rules one answer out. ' + (r && r.total ? '<b>' + Math.round(100 * r.correct / r.total) + '%</b> of classmates got this one right (n=' + r.total + ').' : 'Not enough class data on this question yet.');
        var n = root.querySelector('[data-note]'); if(n) n.innerHTML = S.note;
      });
    }
  }
  function begin(){
    var ov = stage.querySelector('[data-overlay]'); if(ov) ov.remove();
    draw = C.dealer(C.bankPool(C.currentScope(root)));
    S = { rung:0, used:{}, missed:[] }; running = true; hud(); newQ();
  }
  function end(amount, win){ running = false; C.finish(g, root, amount, S.missed, win ? { title:'Million-dollar smile!', win:true, note:'You climbed all 12 rungs.' } : { title: amount === banked() && S.walked ? 'You walked away' : 'Game over', note:'You reached rung <b>' + (S.rung + (win ? 0 : 1)) + '</b> of 12.' }); }
  return {
    mount:function(panel){
      panel.innerHTML = C.shell(g, { hud:['score','rung'], select:C.scopeSelectHTML('bank', 12), stage:'<div class="gm-stage" data-stage><div class="ms-stage" data-body style="min-height:430px"></div></div>', keys:'Tap an answer to lock it in · <kbd>1</kbd>-<kbd>4</kbd> also work · safe havens at $1,000 and $32,000' });
      root = panel.querySelector('.gm'); stage = root.querySelector('[data-stage]');
      S = { rung:0, used:{} }; hud();
      stage.insertAdjacentHTML('beforeend', C.introHTML(g, 'Twelve questions from the bank stand between you and <b>$125,000</b>. Miss one and you drop to your last safe haven ($1,000 or $32,000). Three lifelines: <b>50:50</b>, <b>Ask the class</b> (rules one out and shows how classmates did on it) and <b>Swap</b>. You can walk away with what you\'ve banked at any time.', 'Let\'s play'));
      stage.addEventListener('click', function(e){
        if(e.target.closest('[data-start]')){ begin(); return; }
        if(!running) return;
        var o = e.target.closest('[data-ms]'); if(o){ lock(+o.getAttribute('data-ms')); return; }
        var lf = e.target.closest('[data-life]'); if(lf){ lifeline(lf.getAttribute('data-life')); return; }
        if(e.target.closest('[data-walk]') && S.locked < 0 && S.rung > 0){ S.walked = true; end(banked(), false); }
      });
      document.addEventListener('keydown', kd);
    },
    stop:function(){ running = false; document.removeEventListener('keydown', kd); }
  };
  function kd(e){ if(!running || !root || !document.body.contains(root)) return; if(e.target && e.target.tagName === 'SELECT') return; var n = parseInt(e.key, 10); if(n >= 1 && n <= 4){ e.preventDefault(); lock(n - 1); } }
};

/* ====================================================================
   BOOT / MODE SWITCHING
   ==================================================================== */
var CURRENT_MODE = null;
var MODE_RENDERERS = { compendium:renderCompendium, review:renderReview, arcade:function(){ ARCADE.lobby(); } };
function setMode(mode){
  if(!MODE_RENDERERS[mode]) mode = 'compendium';
  if(CURRENT_MODE === 'arcade' && mode !== 'arcade') ARCADE.stop();
  if(window.shTTS && mode !== 'compendium') window.shTTS.stop();
  CURRENT_MODE = mode; STATE.ui.mode = mode; saveState();
  document.querySelectorAll('#modeSwitch [data-mode]').forEach(function(b){ b.setAttribute('aria-selected', String(b.getAttribute('data-mode') === mode)); });
  document.querySelectorAll('.mode-panel').forEach(function(p){ p.hidden = p.getAttribute('data-mode-panel') !== mode; });
  MODE_RENDERERS[mode]();
}
function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
}
/* Section label for the shared widget's per-section time tracking. */
window.SH_SECTION = function(){
  var m = CURRENT_MODE || 'compendium';
  if(m === 'compendium') return 'compendium/' + COMPENDIUM_VIEW;
  if(m === 'arcade') return 'arcade/' + (ARCADE.current() || 'lobby');
  if(m === 'review') return 'review/' + (REVIEW.lec || 'all');
  return m;
};
function boot(){
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  /* sh_theme is the site-wide choice shared with the dashboard; STATE.theme is this hub's old copy */
  var t0 = null; try{ t0 = localStorage.getItem('sh_theme'); }catch(e){}
  if(t0 === null) t0 = STATE.theme;
  applyTheme(t0 === 'light' || t0 === 'dark' ? t0 : null);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = !cur ? 'light' : cur === 'light' ? 'dark' : null;
    STATE.theme = next; saveState(); try{ localStorage.setItem('sh_theme', next || ''); }catch(e){} applyTheme(next);
  });
  document.getElementById('modeSwitch').addEventListener('click', function(e){ var b = e.target.closest('[data-mode]'); if(b) setMode(b.getAttribute('data-mode')); });
  renderHeaderMeta();
  var m = STATE.ui.mode;
  if(location.hash){ var h = location.hash.slice(1); if(MODE_RENDERERS[h]) m = h; }
  setMode(m || 'compendium');
}
/* the markup above is already parsed, so render now; the deferred widget and supabase scripts load after */
boot();

/* ---------- full-content search for the shared widget: every note paragraph, review-table row,
   exam hint and cram line, each with a place to jump to (window.SH_GOTO) ---------- */
function shSearchSections(){
  var out = [];
  function frag(html){ var d = document.createElement('div'); d.innerHTML = html || ''; return d; }
  function clean(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  LECTURES.forEach(function(l){
    var where = 'S' + l.num + ' ' + l.title;
    Array.prototype.forEach.call(frag(READINGS[l.id]).querySelectorAll('p, li, h3, h4'), function(el, k){
      var t = clean(el.textContent); if(t.length > 2) out.push({ kind:'Notes', where:where, text:t, lec:l.id, go:{ v:'notes', lec:l.id, k:k } });
    });
  });
  CRAM_CONTENT.forEach(function(c){ var l = LECTURE_BY_ID[c.lec]; c.points.forEach(function(p){ out.push({ kind:'Cram sheet', where:'S' + l.num + ' ' + l.title, text:p, lec:c.lec, go:{ v:'cram', lec:c.lec } }); }); });
  EXAM_HINTS.forEach(function(x){ var l = LECTURE_BY_ID[x.lec]; out.push({ kind:'Exam hints', where:'S' + l.num + ' ' + l.title, text:clean(x.quote + ' ' + (x.takeaway || '')), lec:x.lec, go:{ v:'hints', lec:x.lec } }); });
  REF_SECTIONS.forEach(function(sec){
    var d; try{ d = frag(sec.body()); }catch(e){ return; }
    var rows = d.querySelectorAll('tbody tr');
    if(rows.length) Array.prototype.forEach.call(rows, function(tr){ var first = clean(tr.cells[0] && tr.cells[0].textContent); out.push({ kind:'Review', where:sec.title, title:first, text:clean(Array.prototype.map.call(tr.cells, function(td){ return td.textContent; }).join(' · ')), go:{ v:'review', q:first, id:sec.id } }); });
    Array.prototype.forEach.call(d.querySelectorAll('li, p'), function(el){ var t = clean(el.textContent); if(t.length > 2) out.push({ kind:'Review', where:sec.title, text:t, go:{ v:'review', q:sec.title, id:sec.id } }); });
  });
  return out;
}
function shFlashIn(sel){ setTimeout(function(){ var el = typeof sel === 'string' ? document.querySelector(sel) : sel(); if(el && window.shFlash) window.shFlash(el); }, 80); }
window.SH_GOTO = function(g){
  if(!g) return;
  if(g.v === 'notes'){ STATE.ui.level = 'full'; saveState(); setMode('compendium'); gotoLecture(g.lec);
    shFlashIn(function(){ var p = document.querySelector('#compendium-content .reading-prose'); return p && p.querySelectorAll('p, li, h3, h4')[g.k]; }); }
  else if(g.v === 'cram'){ setMode('compendium'); setView('cram-sheet');
    shFlashIn(function(){ var cards = document.querySelectorAll('#compendium-content .cram-card'); return cards[CRAM_CONTENT.map(function(c){ return c.lec; }).indexOf(g.lec)] || null; }); }
  else if(g.v === 'hints'){ setMode('compendium'); setView('exam-hints');
    shFlashIn(function(){ var b = document.querySelector('#compendium-content .hint-group [data-goto-lecture="' + g.lec + '"]'); return b && b.closest('.hint-group'); }); }
  else if(g.v === 'review'){ REVIEW.lec = 'all'; REVIEW.q = ''; setMode('review'); if(g.id) shFlashIn('#ref-' + g.id); }
  else if(g.v === 'bank'){ QBANK_FILTER = { search:g.q || '', lec:'all', type:'all', status:'all' }; setMode('compendium'); setView('question-bank'); }
};

/* Published for the shared widget (search + toughest-questions labels) — see widget/v3.js. */
window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id:l.id, title:'S'+l.num+' ' + l.title, who:l.who, status:l.status }; }),
  questions: QUESTIONS.map(function(q){
    var hint = q.type === 'mcq' ? q.choices[q.answer] : q.type === 'multi' ? q.correct.map(function(i){ return q.choices[i]; }).join('; ') : q.type === 'sequence' ? q.steps.join(' → ') : q.type === 'match' ? q.pairs.map(function(p){ return p.join(': '); }).join('; ') : (q.answer || '');
    if(q.ex) hint = hint ? hint + ' — ' + q.ex : q.ex;
    return { id:q.id, lec:q.lec, text:(q.pbox ? q.pbox.map(function(r){ return r.join(': '); }).join('. ') + '. ' : '') + q.stem, hint:hint, choices:q.choices || null, answer:(q.type === 'mcq' ? q.answer : null) };
  }),
  sections: shSearchSections(),
  hints: EXAM_HINTS.map(function(x){ return { lec:x.lec, quote:x.quote }; }),
  exams: [ { label:'Midterm', date:MIDTERM_DATE }, { label:'Final', date:FINAL_DATE } ]
};

})();
