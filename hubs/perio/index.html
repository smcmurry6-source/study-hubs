{ id:'q4-L35', lec:'phase1-therapy', mid:false, type:'sequence', stem:"Put Dr. Kaur's instrumentation sequence in order.", steps:['Ultrasonic to remove gross deposits','Hand instruments','Ultrasonic again to flush the pocket (lavage)'], ex:"Dr. Kaur's order: the ultrasonic takes off gross deposits, hand instruments do the definitive work, then the ultrasonic flushes the pocket (lavage) at the end.", src:'lecture' },
{ id:'q4-L36', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Why is a curette safer subgingivally than a scaler?", choices:["A Gracey curette cuts on one side only, so the side facing the soft tissue is protected", "Curettes are shorter, so they cannot reach the base of the pocket and damage the attachment", "A curette has a pointed tip, which slips more easily under the tissue without tearing it", "Curettes are used with a push stroke, which moves calculus away from the soft tissue safely"], answer:0, ex:"Scalers have blades on both sides and use short, powerful strokes; curettes use longer, slightly lighter strokes.", src:'lecture' },
{ id:'q4-L37', lec:'phase1-therapy', mid:false, type:'mcq', stem:"On your kit, what does an instrument marked 'SC' indicate, as opposed to 'SG'?", choices:["The single universal curette, with a blade on both sides", "A Gracey curette, area-specific, with a single cutting edge on the lower side of the blade", "A sickle scaler: pointed tip, triangular cross-section, for supragingival use only", "A calibrated probe marked in millimeters, used to chart probing depths around each tooth"], answer:0, ex:"SG marks the site-specific Gracey curettes, which make up almost all the curettes on the kit.", src:'lecture' },
{ id:'q4-L38', lec:'phase1-therapy', mid:false, type:'mcq', stem:"What is the periodontal explorer in the exam kit used for?", choices:["Checking for smooth root surfaces (any catch or roughness) after therapy", "Detecting occlusal caries in pits and fissures before any restorative treatment is planned", "Measuring probing depth when a calibrated probe is not available in the exam kit", "Classifying furcations by how far the tip passes between the roots of a molar"], answer:0, ex:"The explorer is a tactile check after therapy: any catch or roughness on the root means calculus is still there.", src:'lecture' },
{ id:'q4-L39', lec:'phase1-therapy', type:'mcq', stem:"When probing the mesiobuccal of a posterior tooth, where do you take the reading?", choices:['Past the line angle, under the contact area','At the mesiobuccal line angle','At the mid-buccal','Through the contact with firm pressure'], answer:0, ex:"Interproximal probing is not line-angle probing. Go under the contact point (anteriors) or contact area (posteriors).", src:'lecture' },
{ id:'q4-L40', lec:'phase1-therapy', type:'recall', stem:"List the limitations of scaling and root planing discussed in class.", answer:"Pocket depth and access; SRP is a blinded, tactile procedure; motile bacteria invading the pocket lining (SRP only treats the pocket); restorative margins (overhanging, subgingival, open, rough); furcations; developmental grooves, fissures and concavities; over-removal of cementum causing hypersensitivity; patient compliance with oral hygiene; operator skill.", src:'lecture' },
{ id:'q4-L41', lec:'phase1-therapy', type:'recall', stem:"Explain the two ways probing depth decreases after SRP.", answer:"At the gingival margin, inflammation and edema resolve, the tissue loses volume, and this is recorded as increased recession. At the base of the pocket, the junctional epithelium (7-10 days) and connective tissue (4-6 weeks) reattach to the freshly cleaned root.", src:'lecture' },
{ id:'q4-L42', lec:'phase1-therapy', type:'mcq', stem:"Why does 'failure of therapy' after good SRP happen more often in smokers and uncontrolled diabetics?", choices:["The host response shapes healing as well as disease, so outcomes are poorer short- and long-term", "They form calculus faster, so deposits return before the tissues have a chance to heal", "Ultrasonic tips don't work well on their roots, so much less calculus is removed during scaling and root planing", "Their pockets are always shallower, so there is less probing-depth reduction left to gain"], answer:0, ex:"Phase II (surgery to eliminate pockets) may follow.", src:'lecture' },

/* ===== Exam-format practice (added 2026-09-26 from Dr. Abou-Arraj's midterm email):
   Patient Box cases (pbox), multiple-answer items (type:'multi', partial credit). Built only from facts in these notes. ===== */
{ id:'q1-P01', lec:'diagnosis-tx-planning', type:'mcq', pbox:[['Patient','45-year-old female'],['Medical history','Non-contributory; no diabetes'],['Social history','Never smoker'],['Periodontal findings','Worst interdental CAL 4 mm (#19 mesial and #30 mesial); PD ≤5 mm; BOP 22%; no mobility; no furcation involvement'],['Radiographs','Horizontal bone loss at #19 and #30, 25% of root length, coronal third'],['Missing teeth','None']], stem:"What is the periodontal diagnosis?", choices:['Localized Stage 2 Grade B periodontitis','Localized Stage 2 Grade A periodontitis','Localized Stage 3 Grade B periodontitis','Generalized gingivitis'], answer:0, ex:"CAL 3-4 mm with bone loss in the coronal third is Stage 2. Grade: 25% ÷ 45 ≈ 0.56, which falls between 0.25 and 1.0, so Grade B. Only two sites are involved, so localized.", src:'lecture' },
{ id:'q1-P02', lec:'diagnosis-tx-planning', type:'mcq', pbox:[['Patient','38-year-old male'],['Medical history','Healthy'],['Social history','Smokes 15 cigarettes a day'],['Periodontal findings','Worst interdental CAL 3 mm; PD 4-5 mm at several molar sites; BOP 18%'],['Radiographs','Horizontal bone loss 20% of root length, coronal third'],['Missing teeth','None']], stem:"Which stage and grade fit this patient?", choices:['Stage 2 Grade C','Stage 2 Grade B','Stage 1 Grade C','Stage 3 Grade C'], answer:0, ex:"CAL 3 mm with coronal-third bone loss is Stage 2. The ratio (20 ÷ 38 ≈ 0.53) alone would be Grade B, but more than 10 cigarettes a day pushes the grade to C.", src:'lecture' },
{ id:'q1-P03', lec:'diagnosis-tx-planning', type:'mcq', pbox:[['Patient','52-year-old female'],['Medical history','Type 2 diabetes, HbA1c 6.1%'],['Social history','Non-smoker'],['Periodontal findings','Worst interdental CAL 4 mm; PD up to 5 mm; Class II furcation involvement on #30 buccal'],['Radiographs','Horizontal bone loss 30% of root length'],['Missing teeth','#1, #16 (third molars, not periodontal)']], stem:"What stage and grade should be assigned?", choices:['Stage 3 Grade B','Stage 2 Grade B','Stage 3 Grade C','Stage 4 Grade B'], answer:0, ex:"The CAL alone says Stage 2, but a Class II furcation is an automatic Stage 3/4 trigger. With no periodontal tooth loss and no need for complex rehabilitation it's Stage 3, not 4. Grade: 30 ÷ 52 ≈ 0.58 is B, and an HbA1c under 7% doesn't push it to C.", src:'lecture' },
{ id:'q1-P04', lec:'diagnosis-tx-planning', type:'mcq', pbox:[['Patient','24-year-old female'],['Medical history','Healthy'],['Chief complaint','"My gums bleed when I brush"'],['Periodontal findings','Generalized PD 4-5 mm; BOP 35%; gingival margins edematous and coronal to the CEJ; no CAL loss'],['Radiographs','Bone crest 1-2 mm below the CEJ throughout; no bone loss']], stem:"What is the diagnosis?", choices:['Generalized gingivitis on an intact periodontium','Generalized Stage 1 periodontitis','Localized Stage 2 periodontitis','Clinical health on a reduced periodontium'], answer:0, ex:"4s and 5s with bleeding but no attachment or bone loss are pseudopockets. Dr. Abou-Arraj warned against staging from probing depth alone: 'You may over-diagnose a case that does not even have periodontitis.'", src:'lecture' },
{ id:'q1-P05', lec:'diagnosis-tx-planning', type:'multi', pbox:[['Patient','61-year-old male'],['Medical history','Hypertension, controlled'],['Social history','Former smoker, quit 10 years ago'],['Periodontal findings','PD 5 mm on #14 mesial; BOP 40%; Class II furcation on #30; 4 mm vertical (angular) defect on #19 mesial'],['Missing teeth','#3, extracted 2 years ago because of periodontitis']], stem:"Which findings would, on their own, place this case in Stage 3 or 4? Select all that apply.", choices:['The 4 mm vertical defect on #19','The Class II furcation on #30','#3 lost to periodontitis','The 5 mm pocket on #14','BOP of 40%','His former smoking history'], correct:[0,1,2], ex:"The three automatic triggers: vertical bone loss ≥3 mm, Class II or III furcation, and tooth loss due to periodontitis. Probing depth and bleeding don't stage a case, and a former smoker gets no grade modifier.", src:'lecture' },
{ id:'q2-P01', lec:'incisions-flaps-sutures', type:'multi', pbox:[['Patient','60-year-old female'],['Planned surgery','Vertical ridge augmentation (large bone graft) at the #29-30 site before implants'],['Tissue','Thick keratinized tissue; the graft will need passive, tension-free closure']], stem:"Which choices fit this surgery? Select all that apply.", choices:['A full-thickness (mucoperiosteal) flap','A trapezoidal flap with two vertical releasing incisions','Vertical incisions placed at the line angles','Horizontal mattress sutures for the layered closure','A split-thickness flap','A vertical incision through the middle of the papilla','Chromic gut sutures for the graft closure'], correct:[0,1,2,3], ex:"Bone augmentation needs a full-thickness flap to expose bone, and major augmentation needs two releases (trapezoidal) for passive coronal advancement. Verticals go at the line angle, never mid-papilla (black triangle). Horizontal mattress is the layered-closure suture for augmentation. Chromic gut is weak and resorbs in 7-10 days.", src:'lecture' },
{ id:'q3-P01', lec:'risk-assessment', type:'mcq', pbox:[['Patient','57-year-old male'],['History','Generalized Stage 3 Grade C periodontitis, treated with SRP and osseous surgery last year'],['Social history','Still smokes 1 pack a day'],['Today','Stable; residual 4 mm pockets; BOP 12%']], stem:"What maintenance interval fits this patient?", choices:['Every 3 months','Every 6 months','Every 12 months','No maintenance is needed once pockets are ≤4 mm'], answer:0, ex:"Once periodontitis, always higher risk, and he's a current heavy smoker. Pathogens repopulate in about 9-11 weeks, which is why high-risk patients are seen about every 3 months.", src:'lecture' },
{ id:'q3-P02', lec:'risk-assessment', type:'mcq', pbox:[['Patient','13-year-old'],['Medical history','Healthy'],['Findings','Little plaque or inflammation; 8-11 mm pockets on #14 and the first molars']], stem:"Which diagnosis fits the case Dr. Geisinger reviewed in class?", choices:['Localized Stage 3 Grade C periodontitis, molar-incisor pattern','Generalized Stage 2 Grade B periodontitis','Localized gingivitis','Stage 4 Grade A periodontitis'], answer:0, ex:"Deep pockets and bone loss this young give a bone-loss/age ratio well over 1.0 (Grade C). The plan was regeneration, closer lifelong maintenance and counseling against nicotine.", src:'lecture' },
{ id:'q4-P01', lec:'phase1-therapy', type:'mcq', pbox:[['Patient','58-year-old male'],['Medical history','Hypertension'],['Medications','Amlodipine 10 mg daily'],['Clinical','Bulbous gingival enlargement, mostly interdental, worse on the buccal/labial'],['#8 mesial','PD 5 mm; gingival margin sits 3 mm coronal to the CEJ']], stem:"What is the clinical attachment level at #8 mesial?", choices:['2 mm','5 mm','8 mm','0 mm'], answer:0, ex:"Recession is −3 mm, so CAL = 5 + (−3) = 2 mm. Leaving recession blank (or 0) in Salud would record CAL 5 and over-diagnose disease.", src:'lecture' },
{ id:'q4-P02', lec:'phase1-therapy', type:'mcq', pbox:[['Patient','47-year-old male'],['Dental history','No dental visit in 12 years'],['Clinical','Heavy generalized calculus covering the gingival margins and parts of the occlusal surfaces; the margin can\'t be seen or explored'],['Insurance','Private dental insurance']], stem:"What is the appropriate first appointment?", choices:['Full-mouth debridement, then a comprehensive periodontal evaluation in about 2 weeks','Full-mouth debridement and SRP of all four quadrants the same day','A prophylaxis with polishing','Periodontal charting from the calculus surface, then SRP'], answer:0, ex:"Debridement is only for when you can't see or explore the margin, it's never combined with SRP, and insurance won't pay for it plus an exam the same day. (At school, first charting is free, so faculty may let you chart the same visit.)", src:'lecture' },
{ id:'q4-P03', lec:'phase1-therapy', type:'mcq', pbox:[['Patient','26-year-old female'],['Dental history','Second premolars extracted for orthodontics as a teen; never diagnosed with periodontitis'],['Clinical','Generalized red, swollen gingiva; BOP 60%; lingual bridge of calculus'],['Radiographs','Mild bone-level loss next to the premolar extraction sites and molar tipping; no other bone loss']], stem:"Which procedure fits this patient?", choices:['Scaling in the presence of generalized moderate or severe gingival inflammation (D4346)','Four-quadrant SRP for periodontitis','Periodontal maintenance','Full-mouth debridement'], answer:0, ex:"Gingival inflammation on a reduced periodontium in a non-periodontitis patient. It sits between a prophy and SRP, is done with perio faculty, and gets a Phase I evaluation.", src:'lecture' },
{ id:'q4-P04', lec:'phase1-therapy', type:'mcq', pbox:[['Patient','50-year-old female'],['History','SRP of all quadrants 5 weeks ago for Stage 3 Grade B periodontitis'],['Today (Phase I evaluation)','Most sites improved; #3 and #14 still bleed and probe 6 mm; the probe catches residual calculus on both roots']], stem:"What is the best next step?", choices:['Remove the residual calculus and re-evaluate in 2 weeks','Refer for osseous surgery today','Repeat full-mouth SRP','Wait 3 more months for additional pocket reduction'], answer:0, ex:"Residual deposits explain the persistent disease, so remove them and re-evaluate in two weeks. Waiting past 4-6 weeks adds no pocket reduction, and more SRP where the roots are already clean won't help (improve oral hygiene instead).", src:'lecture' },
{ id:'q4-P05', lec:'phase1-therapy', type:'multi', pbox:[['Patient','44-year-old male'],['Social history','Smokes 20 cigarettes a day'],['Medical history','Uncontrolled type 2 diabetes'],['Clinical','Tissue looks pale and fibrotic, with less redness than expected for 6-7 mm pockets']], stem:"Which statements about this patient are consistent with the Session 4 lecture? Select all that apply.", choices:['Nicotine\'s vasoconstriction can mask inflammation, giving a paler, cyanotic look','His outcome after even excellent SRP may be poorer short- and long-term','Uncontrolled diabetes tends to exaggerate the inflammatory picture','His pale tissue means BOP can be skipped','SRP will reverse his bone loss if he quits smoking'], correct:[0,1,2], ex:"Smoking masks, diabetes exaggerates. The host response shapes healing, so 'failure of therapy' is more likely. BOP is always recorded, and non-surgical therapy never reverses bone loss.", src:'lecture' },
{ id:'q1-M01', lec:'diagnosis-tx-planning', type:'multi', stem:"Which modifiers can move a periodontitis case to Grade C regardless of the bone-loss/age ratio? Select all that apply.", choices:['Smoking more than 10 cigarettes a day','HbA1c of 7% or higher','Being a non-smoker','Well-controlled diabetes (HbA1c 6%)','Age over 65'], correct:[0,1], ex:"Modifiers only push the grade up. Not smoking or not having diabetes never earns a downgrade.", src:'lecture' },
{ id:'q1-M02', lec:'diagnosis-tx-planning', type:'multi', stem:"Which are true of plaque-induced gingivitis? Select all that apply.", choices:['Probing depths can reach 4-5 mm','There is bleeding on probing','There is no attachment loss or bone loss','It is reversible with plaque control','Bone loss is limited to the coronal third'], correct:[0,1,2,3], ex:"Any bone loss from periodontitis makes it periodontitis. The course uses a 10% full-mouth BOP threshold before calling a case gingivitis.", src:'lecture' },
{ id:'q1-M03', lec:'diagnosis-tx-planning', type:'multi', stem:"Which belong in Phase I (non-surgical) therapy? Select all that apply.", choices:['Oral hygiene instruction','Scaling and root planing','Smoking-cessation counseling','Caries control','Replacing plaque-retentive restorative margins','Osseous (resective) surgery','Delivering the final crowns'], correct:[0,1,2,3,4], ex:"'Never forget this: caries control is part of Phase I.' Final crowns wait until periodontal therapy is complete, and surgery is Phase II.", src:'lecture' },
{ id:'q1-M04', lec:'diagnosis-tx-planning', type:'multi', stem:"Which recession types predict at least partial root coverage? Select all that apply.", choices:['RT1','RT2','RT3'], correct:[0,1], ex:"RT1 (no interproximal loss) predicts full coverage and RT2 (buccal recession exceeds interproximal loss) partial. RT3 isn't attempted.", src:'lecture' },
{ id:'q2-M01', lec:'incisions-flaps-sutures', type:'multi', stem:"Which suture materials are resorbable? Select all that apply.", choices:['Chromic gut','Poly-glycolic acid (PGA)','Poly-glycolide (PGCL)','Silk','PTFE','Polypropylene'], correct:[0,1,2], ex:"Chromic gut (7-10 days), PGA (55-70 days) and PGCL (22-55 days) resorb. Silk, PTFE and polypropylene have to be removed.", src:'lecture' },
{ id:'q2-M02', lec:'incisions-flaps-sutures', type:'multi', stem:"Which follow the surgical principles taught for incisions and flaps? Select all that apply.", choices:['Make the incision with a firm, continuous stroke','Place vertical incisions at the line angle','Keep the incision away from the bony defect','Make the flap base at least as wide as its free edge','Place the vertical incision in the middle of the papilla','Place the incision directly over the defect'], correct:[0,1,2,3], ex:"A mid-papilla vertical risks recession and a black triangle, and a narrow base starves the flap.", src:'lecture' },
{ id:'q2-M03', lec:'incisions-flaps-sutures', type:'multi', stem:"Which procedures call for a full-thickness flap? Select all that apply.", choices:['Implant placement','Bone, ridge or sinus augmentation','Crown lengthening / osseous surgery','Soft-tissue grafting'], correct:[0,1,2], ex:"Soft-tissue grafting uses a split-thickness flap so the periosteum stays behind as a vascular bed for the graft.", src:'lecture' },
{ id:'q3-M01', lec:'risk-assessment', type:'multi', stem:"Which inputs does the UniFe risk tool score? Select all that apply.", choices:['Smoking (cigarettes a day)','Diabetic status (HbA1c)','Number of pockets ≥5 mm','BOP percentage','Bone-loss/age ratio','Plaque index','Number of furcations'], correct:[0,1,2,3,4], ex:"Each of the five is scored 0-4 and summed into a five-tier risk score.", src:'lecture' },
{ id:'q3-M02', lec:'risk-assessment', type:'multi', stem:"Which statements describe the Kwok & Caton prognosis system? Select all that apply.", choices:['It asks whether periodontal stability can be achieved','It is therapeutic only','Questionable sits in the middle of its scale','It works well for medically complex patients','It applies only to molars','It is scored numerically from smoking and A1c'], correct:[0,1,2,3], ex:"Molars-only and numeric scoring describe Miller & McEntire.", src:'lecture' },
{ id:'q3-M03', lec:'risk-assessment', type:'multi', stem:"Which are the P's of P4 medicine? Select all that apply.", choices:['Personalized','Preventive','Predictive','Participatory','Palliative','Prescriptive'], correct:[0,1,2,3], ex:"Personalized, preventive, predictive and participatory (some add a fifth P). It's set against one-size-fits-all Hippocratic medicine.", src:'lecture' },
{ id:'q4-M01', lec:'phase1-therapy', type:'multi', stem:"Which make it harder to feel the CEJ when measuring negative recession? Select all that apply.", choices:['Heavy gingival inflammation','Drug-induced gingival overgrowth','Altered passive eruption','Calculus or restorative margins','True (positive) recession','Healthy tissue with a visible CEJ'], correct:[0,1,2,3], ex:"Inflammation and overgrowth are pathologic, altered passive eruption is physiologic, and calculus or margins can feel like a CEJ.", src:'lecture' },
{ id:'q4-M02', lec:'phase1-therapy', type:'multi', stem:"Which are goals of scaling and root planing? Select all that apply.", choices:['Reduce inflammation','Shift the flora from gram-negative toward gram-positive','Arrest disease progression','Reverse bone and attachment loss','Eliminate the pocket (the main rationale)'], correct:[0,1,2], ex:"SRP doesn't reverse the damage, and pocket elimination isn't the rationale, though PD does drop.", src:'lecture' },
{ id:'q4-M03', lec:'phase1-therapy', type:'multi', stem:"Which contribute to probing-depth reduction after SRP? Select all that apply.", choices:['More recession as edema resolves','Junctional epithelium reattaching','Connective tissue reattaching','New bone filling the defect','Extrusion of the tooth'], correct:[0,1,2], ex:"At the margin, resolving edema shows up as more recession. At the base, JE (7-10 days) and connective tissue (4-6 weeks) reattach to the clean root. SRP doesn't regrow bone.", src:'lecture' },
{ id:'q4-M04', lec:'phase1-therapy', type:'multi', stem:"Which statements about full-mouth debridement are correct? Select all that apply.", choices:['It is not a therapeutic procedure','It is indicated only when you can\'t see or explore the gingival margin','There is only a full-mouth code','It should never be combined with SRP','It can be billed per quadrant','Insurance pays for it and a periodontal exam at the same visit'], correct:[0,1,2,3], ex:"There is no quadrant or half-mouth code, and insurance won't pay for debridement plus an exam the same day, so the exam is usually about 2 weeks later.", src:'lecture' },
{ id:'q4-M05', lec:'phase1-therapy', type:'multi', stem:"Which are limitations of scaling and root planing discussed in class? Select all that apply.", choices:['It is a blinded, tactile procedure','Motile bacteria invade the pocket lining','Overhanging or subgingival restorative margins','Root grooves, concavities and furcations','Over-removing cementum causes hypersensitivity','It can\'t be done with local anesthesia'], correct:[0,1,2,3,4], ex:"Also on the list: pocket depth and access, patient compliance with hygiene, and operator skill.", src:'lecture' },
{ id:'q4-M06', lec:'phase1-therapy', type:'multi', stem:"Which can a radiograph tell you before you probe? Select all that apply.", choices:['Whether bone loss is localized or generalized','Horizontal vs. vertical bone loss','Root proximity and fused roots','Calculus','A periapical lesion','Bleeding on probing'], correct:[0,1,2,3,4], ex:"BOP is a clinical finding. Dr. Kaur's tip: keep the x-rays open during SRP, not the chart.", src:'lecture' },

/* ===== Lecture 5 — Resective Surgery & Furcation Management ===== */
{ id:'q5-01', lec:'resective-furcation', type:'mcq', stem:"On maxillary molars, which furcation entrance is the narrowest?", choices:['Buccal','Mesial','Distal','They are all equal'], answer:0, ex:"On maxillary molars the buccal furcation entrance (about 3.5 mm from the CEJ) is the narrowest of the three.", src:'exam-review' },
{ id:'q5-02', lec:'resective-furcation', type:'mcq', stem:"On maxillary molars, how far from the CEJ is the distal furcation entrance?", choices:['5 mm','3 mm','3.5 mm','8 mm'], answer:0, ex:"Maxillary molar furcation entrances sit at about 3 mm (mesial), 3.5 mm (buccal) and 5 mm (distal) from the CEJ. The distal one is the most apical.", src:'exam-review' },
{ id:'q5-03', lec:'resective-furcation', type:'mcq', stem:"Which molar has a shorter root trunk — the first or the second maxillary molar?", choices:['The first molar','The second molar','They are equal','Neither has a measurable trunk'], answer:0, ex:"The first molar has the shorter root trunk, so its furcation starts closer to the CEJ and is exposed by less attachment loss.", src:'exam-review' },
{ id:'q5-04', lec:'resective-furcation', type:'mcq', stem:"On mandibular molars, which furcation entrance is both wider and more apical — buccal or lingual?", choices:['Lingual','Buccal','They are identical','It varies randomly'], answer:0, ex:"On mandibular molars the lingual entrance is both wider (over 0.75 mm) and more apical (over 4 mm) than the buccal.", src:'exam-review' },
{ id:'q5-05', lec:'resective-furcation', type:'mcq', stem:"Roughly what percentage of maxillary premolars have two root cones?", choices:['~40%','~10%','~75%','~5%'], answer:0, ex:"About 40% of maxillary premolars have two root cones, which is why they can have a furcation (mean ≈8 mm from the CEJ).", src:'exam-review' },
{ id:'q5-06', lec:'resective-furcation', type:'mcq', stem:"Furcation Class I is best managed with which treatment?", choices:['SRP and furcation plasty','Tooth extraction only','Root resection','GTR only'], answer:0, ex:"A Class I furcation is only incipient, so SRP plus furcation plasty (smoothing the entrance so it can be cleaned) is enough.", src:'exam-review' },
{ id:'q5-07', lec:'resective-furcation', type:'mcq', stem:"GTR is specifically noted as a Class II furcation option for which teeth?", choices:['Mandibular molars','Maxillary premolars','Maxillary molars','Anterior teeth'], answer:0, ex:"GTR is listed as a Class II option specifically for mandibular molars. Maxillary molar furcations regenerate far less predictably.", src:'exam-review' },
{ id:'q5-08', lec:'resective-furcation', type:'mcq', stem:"Which bone architecture pattern has interdental bone sitting apical to its midfacial and midlingual margins?", choices:['Reverse (negative) architecture','Positive architecture','Flat architecture','There is no such pattern'], answer:0, ex:"In reverse (negative) architecture, the interdental bone sits lower (apical) than the facial and lingual bone, producing craters.", src:'exam-review' },
{ id:'q5-09', lec:'resective-furcation', type:'mcq', stem:"In positive bone architecture, where does the interdental bone sit relative to the midfacial/midlingual bone?", choices:['Coronal to it','Apical to it','At the same level','Unrelated to it'], answer:0, ex:"In positive architecture, the healthy pattern, the interdental bone peaks coronal to the midfacial and midlingual bone, following the CEJ's scallop.", src:'exam-review' },
{ id:'q5-10', lec:'resective-furcation', type:'recall', stem:"Why is reverse (negative) bone architecture a target for resective recontouring?", answer:"The interdental bone sits apical to the facial/lingual margins, creating osseous craters and irregular topography that will not heal into a physiologic, cleansable form without recontouring.", src:'exam-review' },

/* ===== Lecture 6 — Periodontal Regeneration ===== */
{ id:'q6-01', lec:'periodontal-regeneration', type:'mcq', stem:"What depth and angle make an intrabony defect the best candidate for regeneration?", choices:['>3 mm deep and <25° angle','<3 mm deep and >45° angle','Any depth — angle does not matter','Only defects >10 mm deep'], answer:0, ex:"The best regenerative candidates are deep, narrow intrabony defects: more than 3 mm deep and under 25° to the root. Deep, narrow walls hold the clot and the cells that rebuild the tissue.", src:'exam-review' },
{ id:'q6-02', lec:'periodontal-regeneration', type:'mcq', stem:"Which wall configuration is the best candidate for periodontal regeneration?", choices:['3-wall defects','1-wall defects','2-wall craters','Defects with no remaining walls'], answer:0, ex:"A 3-wall defect has the most bony walls to hold the clot and supply cells, so it regenerates most predictably. 1-wall defects are the least predictable.", src:'exam-review' },
{ id:'q6-03', lec:'periodontal-regeneration', type:'mcq', stem:"What are amelogenins, the active component of EMD, involved in?", choices:["Enamel formation and periodontal attachment formation during tooth development", "Only pulp formation, guiding odontoblasts as they lay down dentin inside the developing tooth", "Only cementum resorption, clearing the root surface so that the PDL fibers can re-insert", "Bacterial biofilm formation, which is why EMD is always paired with a systemic antibiotic"], answer:0, ex:"Amelogenins, the main enamel matrix proteins, drive enamel formation and periodontal attachment formation during tooth development. EMD borrows that to regrow attachment.", src:'exam-review' },
{ id:'q6-04', lec:'periodontal-regeneration', type:'mcq', stem:"What does rhPDGF-BB do in a regenerative graft?", choices:['Chemotactic/mitogenic for bone and PDL, and angiogenic for revascularization','Purely antibacterial, for infection control only','Acts as an anti-inflammatory steroid','Inhibits collagenase'], answer:0, ex:"rhPDGF-BB draws in bone and PDL cells (chemotactic), makes them multiply (mitogenic) and grows new vessels (angiogenic).", src:'exam-review' },
{ id:'q6-05', lec:'periodontal-regeneration', type:'mcq', stem:"What is the primary role of a β-TCP scaffold in a regenerative graft?", choices:["Osteoconductive matrix that prevents soft-tissue collapse and stabilizes the clot", "Antibiotic delivery, releasing drug slowly into the defect to suppress pocket bacteria after surgery", "Replacing the need for a flap, because the scaffold can be injected through the pocket without surgery", "Bleaching and conditioning the root surface so that cementum can reform on the treated root"], answer:0, ex:"β-TCP is the scaffold: an osteoconductive matrix that keeps soft tissue from collapsing into the defect and holds the clot still.", src:'exam-review' },
{ id:'q6-06', lec:'periodontal-regeneration', type:'mcq', stem:"Which of these is a risk factor for a less predictable regenerative outcome?", choices:['Thin, scalloped gingival biotype','A 3-wall defect','A defect angle <25°','A defect depth >3 mm'], answer:0, ex:"A thin, scalloped gingival biotype is a risk factor for a less predictable regenerative result. The other three choices describe a good defect for regeneration.", src:'exam-review' },
{ id:'q6-07', lec:'periodontal-regeneration', type:'mcq', stem:"EMD, alone or combined with graft material, produces outcomes similar to which other regenerative approach?", choices:['GTR (guided tissue regeneration)','Gingivectomy','Root planing alone','Systemic antibiotics'], answer:0, ex:"EMD, used alone or with graft material, produces outcomes similar to GTR.", src:'exam-review' },
{ id:'q6-08', lec:'periodontal-regeneration', type:'recall', stem:"List the three biologic modifications discussed for periodontal regeneration and one property of each.", answer:"EMD — an amelogenin extract that supports attachment formation; rhPDGF-BB — a chemotactic, mitogenic, and angiogenic growth factor; β-TCP scaffold — an osteoconductive matrix that stabilizes the clot.", src:'exam-review' },

/* ===== Lecture 7 — Implants for Periodontally Compromised Patients ===== */
{ id:'q7-01', lec:'implants-perio', type:'mcq', stem:"Which of the following is part of the definition of a successful implant?", choices:['<0.2 mm vertical bone loss per year after the first year in function','Any amount of mobility is acceptable','Peri-implant radiolucency is expected','Paresthesia is a normal finding'], answer:0, ex:"A successful implant is immobile, shows no peri-implant radiolucency, has no pain, infection or paresthesia, and loses less than 0.2 mm of bone a year after its first year in function.", src:'exam-review' },
{ id:'q7-02', lec:'implants-perio', type:'mcq', stem:"Which periodontal pathogens are noted as harder to eradicate in current smokers?", choices:["A. actinomycetemcomitans, P. gingivalis, and B. forsythus", "Streptococcus mutans, lactobacilli and Actinomyces species", "Candida albicans and other oral yeasts", "Lactobacillus acidophilus and Actinomyces species"], answer:0, ex:"A.a., P. gingivalis and B. forsythus are the pathogens noted as harder to eradicate in current smokers.", src:'exam-review' },
{ id:'q7-03', lec:'implants-perio', type:'mcq', stem:"Which immunologic change is associated with smoking, relevant to implant and periodontal healing?", choices:['Impaired neutrophil chemotaxis and phagocytosis','Increased T-helper cell counts','Decreased IL-6 and TNF-alpha','Decreased collagenase activity'], answer:0, ex:"Smoking impairs neutrophil chemotaxis and phagocytosis, lowers T-helper and B cells, and raises IL-6, TNF-α and collagenase. Every other choice here runs the wrong direction.", src:'exam-review' },
{ id:'q7-04', lec:'implants-perio', type:'mcq', stem:"How does nicotine physiologically affect wound healing around implants?", choices:['It impairs revascularization in soft and hard tissue','It accelerates revascularization','It has no measurable physiologic effect','It only affects taste perception'], answer:0, ex:"Nicotine impairs revascularization of both soft and hard tissue, so wounds heal poorly and implants fail more often.", src:'exam-review' },
{ id:'q7-05', lec:'implants-perio', type:'mcq', stem:"When are implants contraindicated in a diabetic patient?", choices:['When glycemic control is poor','Never — diabetes has no bearing on implant candidacy','Only in Type 1 diabetes','Only if the patient also smokes'], answer:0, ex:"Diabetes contraindicates implants only when glycemic control is poor. With optimal control there is no added risk to implant survival.", src:'exam-review' },
{ id:'q7-06', lec:'implants-perio', type:'mcq', stem:"What happens to peri-implantitis risk when a positive IL-1 genotype and smoking occur together?", choices:['A synergistic effect — the highest risk of peri-implantitis','The two risks simply cancel out','Only the genetic risk matters','Only the smoking risk matters'], answer:0, ex:"A positive IL-1 genotype and smoking act synergistically: together they carry the highest peri-implantitis risk, more than either alone.", src:'exam-review' },
{ id:'q7-07', lec:'implants-perio', type:'recall', stem:"What immune-cell changes does smoking cause that are relevant to implant and periodontal healing?", answer:"Decreased numbers of T-helper cells and B lymphocytes, alongside impaired neutrophil chemotaxis and phagocytosis, and increased IL-6, TNF-alpha, and collagenase activity.", src:'exam-review' },
{ id:'q7-08', lec:'implants-perio', type:'mcq', stem:"IL-1 gene polymorphisms are associated with what kind of inflammatory response?", choices:['A hyper-responsive inflammatory reaction to microbial challenge','A blunted, under-responsive inflammatory reaction','No change in inflammatory response','A purely anti-inflammatory response'], answer:0, ex:"IL-1 polymorphisms produce a hyper-responsive inflammatory reaction to the same bacterial challenge, so these patients break down faster.", src:'exam-review' },
{ id:'q7-09', lec:'implants-perio', type:'mcq', stem:"A diabetic patient with optimal glycemic control is considering an implant. What should they be counseled?", choices:['Optimal control means no added implant-survival risk from diabetes','Diabetes always contraindicates implants','Only smoking matters for implant survival','Implants heal faster in diabetics'], answer:0, ex:"With optimal glycemic control, diabetes adds no implant-survival risk. The counseling points are keeping control tight and not smoking.", src:'exam-review' },

/* ===== Lecture 8 — Pharmacotherapy: Antibiotics & Host Modulation ===== */
{ id:'q8-01', lec:'antibiotics-host-mod', type:'mcq', stem:"How should antibiotics be used in periodontal therapy?", choices:['As an adjunct to surgical/non-surgical therapy, never as monotherapy','As the first-line, stand-alone treatment','Only for cosmetic reasons','In place of SRP whenever possible'], answer:0, ex:"Antibiotics are adjuncts to mechanical therapy, never a replacement. They cannot penetrate an undisturbed biofilm, so the debridement has to happen.", src:'exam-review' },
{ id:'q8-02', lec:'antibiotics-host-mod', type:'mcq', stem:"Which antibiotic is indicated specifically for acute necrotizing ulcerative gingivitis (ANUG), often combined with amoxicillin?", choices:['Metronidazole','Azithromycin','Ciprofloxacin','Doxycycline'], answer:0, ex:"Metronidazole targets obligate anaerobes such as the spirochetes of ANUG, and it is often paired with amoxicillin.", src:'exam-review' },
{ id:'q8-03', lec:'antibiotics-host-mod', type:'mcq', stem:"Which drug should be taken 1 hour before or 2 hours after meals, because food decreases its absorption?", choices:['Azithromycin (Z-Pak)','Ciprofloxacin','Amoxicillin','Metronidazole'], answer:0, ex:"Azithromycin (Z-Pak) is taken 1 hour before or 2 hours after meals because food lowers its absorption.", src:'exam-review' },
{ id:'q8-04', lec:'antibiotics-host-mod', type:'mcq', stem:"Which antibiotic is rapidly absorbed WITH food (the opposite pattern from azithromycin) and carries a phototoxic-reaction risk?", choices:['Ciprofloxacin','Clarithromycin','Tetracycline','Clindamycin'], answer:0, ex:"Ciprofloxacin is absorbed rapidly with food, the opposite of azithromycin, and carries a phototoxic-reaction risk. It also interacts with theophylline, caffeine and warfarin.", src:'exam-review' },
{ id:'q8-05', lec:'antibiotics-host-mod', type:'mcq', stem:"Which drug is classically associated with pseudomembranous colitis / C. difficile overgrowth?", choices:['Clindamycin','Amoxicillin','Metronidazole','Doxycycline'], answer:0, ex:"Clindamycin is the classic cause of pseudomembranous colitis from C. difficile overgrowth.", src:'exam-review' },
{ id:'q8-06', lec:'antibiotics-host-mod', type:'mcq', stem:"Tetracycline is specifically indicated when which pathogen is prominent?", choices:['A. actinomycetemcomitans (A.a.)','Porphyromonas gingivalis alone','Candida albicans','Herpes simplex virus'], answer:0, ex:"Tetracycline is chosen when A.a. is prominent, as in the localized (molar-incisor) pattern, although resistance is now widespread.", src:'exam-review' },
{ id:'q8-07', lec:'antibiotics-host-mod', type:'mcq', stem:"Why should tetracycline not be taken with dairy or antacids?", choices:['Di- and trivalent cations inhibit its absorption','It causes immediate GI bleeding','It reacts explosively with calcium','It switches from bacteriostatic to bactericidal'], answer:0, ex:"Calcium, magnesium, aluminum and iron (di- and trivalent cations) chelate tetracycline in the gut, so dairy and antacids block its absorption.", src:'exam-review' },
{ id:'q8-08', lec:'antibiotics-host-mod', type:'mcq', stem:"Augmentin adds clavulanic acid to amoxicillin. What does the clavulanic acid do?", choices:['Prevents beta-lactamase resistance','Provides the antibacterial effect on its own','Treats the GI upset side effect','Extends the drug’s absorption window'], answer:0, ex:"Clavulanic acid inactivates β-lactamase, the enzyme that makes bacteria resistant to amoxicillin. It isn't the antibacterial agent itself.", src:'exam-review' },
{ id:'q8-09', lec:'antibiotics-host-mod', type:'mcq', stem:"Which drug should be avoided in pregnancy due to a risk of fetal abnormalities?", choices:['Clarithromycin','Amoxicillin','Cephalosporins','A low, sub-antimicrobial dose of doxycycline'], answer:0, ex:"Clarithromycin is the one to avoid in pregnancy because of the risk of fetal abnormalities. Metronidazole is also listed as avoid-in-pregnancy.", src:'exam-review' },
{ id:'q8-10', lec:'antibiotics-host-mod', type:'mcq', stem:"Metronidazole works on which type of organism?", choices:['Obligate anaerobes only, e.g., spirochetes','Aerobic gram-positive cocci only','All bacteria equally','Fungi only'], answer:0, ex:"Metronidazole kills only obligate anaerobes (for example spirochetes) by disrupting their DNA. It does nothing to aerobes.", src:'exam-review' },
{ id:'q8-11', lec:'antibiotics-host-mod', type:'match', stem:"Match each local-delivery agent to what it contains.", pairs:[['PerioChip','1.5 mg chlorhexidine in a gelatin matrix'],['Atridox','10% doxycycline in a biodegradable polymer'],['Arestin','1 mg minocycline microspheres in a biodegradable polymer']], ex:"PerioChip is chlorhexidine in gelatin; Atridox is 10% doxycycline in a polymer mixed chairside; Arestin is minocycline microspheres.", src:'exam-review' },
{ id:'q8-12', lec:'antibiotics-host-mod', type:'mcq', stem:"After placing Arestin, how long should the patient avoid flossing the site?", choices:['10 days','7 days','12 hours','24 hours'], answer:0, ex:"After Arestin: no brushing at the site for 12 hours and no flossing for 10 days. Atridox's rule is 7 days for all three.", src:'exam-review' },
{ id:'q8-13', lec:'antibiotics-host-mod', type:'mcq', stem:"NSAIDs help periodontal healing mainly by inhibiting which mediator?", choices:["PGE2, which upregulates osteoclastic bone resorption", "Collagenase, which it blocks directly in the gingiva", "IL-1 receptors on fibroblasts and osteoclasts", "Bacterial DNA gyrase in the subgingival flora"], answer:0, ex:"NSAIDs block prostaglandin synthesis, including PGE2, which drives osteoclastic bone resorption. They need daily dosing to help.", src:'exam-review' },
{ id:'q8-14', lec:'antibiotics-host-mod', type:'mcq', stem:"Periostat is a sub-antimicrobial dose of doxycycline. How does it help periodontal disease?", choices:["By inhibiting collagenase activity, not through an antibiotic effect", "By killing the anaerobic bacteria directly, at a lower dose than standard doxycycline", "By numbing the gingiva so that patients tolerate SRP and maintenance better", "By replacing SRP entirely for patients who can't sit through mechanical therapy"], answer:0, ex:"Periostat's sub-antimicrobial dose is too low to kill bacteria. It works by inhibiting collagenase, the host enzyme that breaks down attachment.", src:'exam-review' },
{ id:'q8-15', lec:'antibiotics-host-mod', type:'mcq', stem:"What is the major risk associated with bisphosphonate therapy that is relevant to dental treatment?", choices:['Osteonecrosis of the jaw','Tooth staining','Gingival overgrowth','Xerostomia'], answer:0, ex:"Bisphosphonates suppress osteoclasts, and the dental risk is osteonecrosis of the jaw after extractions or surgery.", src:'exam-review' },

/* ===== Lecture 9 — Periodontal Plastic Therapy & Esthetics ===== */
{ id:'q9-01', lec:'perio-plastic-esthetics', type:'mcq', stem:"Where is gingival recession most commonly found?", choices:['Buccal surface of maxillary molars and mandibular incisors','Lingual surface of maxillary incisors','Palatal surface of premolars','Distal surface of third molars'], answer:0, ex:"Recession is most common on the buccal of maxillary molars and mandibular incisors, where the bone and gingiva are thinnest.", src:'exam-review' },
{ id:'q9-02', lec:'perio-plastic-esthetics', type:'mcq', stem:"What is the key structural difference between a connective tissue graft (CTG) and a free gingival graft (FGG)?", choices:['FGG includes epithelium and connective tissue; CTG has no epithelium','CTG includes epithelium; FGG does not','They are structurally identical','FGG is always synthetic'], answer:0, ex:"An FGG carries epithelium plus connective tissue and is left exposed. A CTG is connective tissue only and is covered by a flap, which induces keratinization over it.", src:'exam-review' },
{ id:'q9-03', lec:'perio-plastic-esthetics', type:'mcq', stem:"What is the most common soft-tissue allograft used in periodontal plastic surgery?", choices:['Acellular Dermal Matrix (ADM)','Free Gingival Graft (FGG)','Connective Tissue Graft (CTG)','Beta-TCP'], answer:0, ex:"Acellular dermal matrix (donated human tissue) is the most common soft-tissue allograft. It performs slightly below autografts but avoids a second surgical site. FGG and CTG are autografts.", src:'exam-review' },
{ id:'q9-04', lec:'perio-plastic-esthetics', type:'mcq', stem:"Why do clinicians favor a high, deep palatal vault when planning a graft harvest?", choices:['It gives the greatest margin for error','It heals faster than a shallow vault','It requires less anesthesia','It never bleeds'], answer:0, ex:"A high, deep palatal vault puts the greater palatine neurovascular bundle farther from the harvest site, giving the most margin for error.", src:'exam-review' },
{ id:'q9-05', lec:'perio-plastic-esthetics', type:'mcq', stem:"A pseudopocket (without attachment loss) is best managed with:", choices:["Improved oral hygiene and professional scaling", "Gingivectomy to remove the excess tissue", "An apically positioned flap to reduce the pocket", "Extraction of the teeth involved"], answer:0, ex:"A pseudopocket is gingival swelling with no attachment loss, so it is managed with better oral hygiene and professional scaling, not surgery.", src:'exam-review' },
{ id:'q9-06', lec:'perio-plastic-esthetics', type:'mcq', stem:"Gingival enlargement from a drug like a calcium channel blocker is managed with which combination of steps?", choices:["Gingivectomy, improved OH, and considering a medication change", "Extraction of the affected teeth, since the overgrowth returns as long as they remain", "Antibiotics alone, since the enlargement is driven by the infection rather than the drug", "Observation only; drug-induced enlargement always resolves once the patient adapts to the drug"], answer:0, ex:"Drug-induced enlargement needs a gingivectomy plus better hygiene, since plaque drives it, and a conversation with the physician about changing the medication.", src:'exam-review' },
{ id:'q9-07', lec:'perio-plastic-esthetics', type:'mcq', stem:"Altered Passive Eruption Type 1B or Type 2B both require which treatment?", choices:['Apically positioned flap plus osseous surgery','Gingivectomy alone','Apically positioned flap alone','No treatment needed'], answer:0, ex:"Both B subcategories have an osseous crest too close to the CEJ, so bone must be recontoured regardless of the gingival type.", src:'exam-review' },
{ id:'q9-08', lec:'perio-plastic-esthetics', type:'mcq', stem:"What distinguishes Type 1 from Type 2 altered passive eruption?", choices:["Type 1 has a wide keratinized-gingiva band with the MGJ apical to the crest; Type 2 has normal dimension with the MGJ at the CEJ", "Type 1 always needs a gingivectomy, while Type 2 never needs surgery and is managed with observation", "They describe the same condition; the type number only records whether the patient was under or over 18 when the excess gingiva was diagnosed", "Type 2 has the wide keratinized band with the MGJ apical to the crest; Type 1 has normal dimension at the CEJ"], answer:0, ex:"Type 1 altered passive eruption has a wide band of keratinized gingiva with the MGJ apical to the crest. Type 2 has normal gingival dimensions with the MGJ at the CEJ.", src:'exam-review' },
{ id:'q9-09', lec:'perio-plastic-esthetics', type:'mcq', stem:"An increased lower-facial-third proportion on facial exam suggests which condition?", choices:['Vertical maxillary excess','Altered passive eruption','RT3 recession','Necrotizing gingivitis'], answer:0, ex:"An increased lower facial third points to vertical maxillary excess, a skeletal cause of a gummy smile.", src:'exam-review' },
{ id:'q9-10', lec:'perio-plastic-esthetics', type:'mcq', stem:"A hypermobile upper lip that exposes excess gingiva on smiling is best managed with:", choices:['Botox or lip-repositioning surgery','Orthognathic surgery only','Gingivectomy alone','No treatment is available'], answer:0, ex:"A hypermobile lip is a muscle problem, so it is managed by weakening the lip (Botox) or limiting its travel (lip repositioning surgery).", src:'exam-review' },
{ id:'q9-11', lec:'perio-plastic-esthetics', type:'recall', stem:"What is the recommended treatment for a structurally short upper lip at rest?", answer:"The course material notes there is no reliably good treatment option for a short upper lip.", src:'exam-review' },
{ id:'q9-12', lec:'perio-plastic-esthetics', type:'mcq', stem:"In the tooth-width proportions cited, if the central incisor is 1.6 units wide, roughly how wide is the lateral incisor?", choices:['≈1 unit','≈1.6 units','≈0.6 units','≈2 units'], answer:0, ex:"Using the cited proportions: central ≈1.6 units, lateral ≈1 unit, half the canine ≈0.6 units.", src:'exam-review' }
