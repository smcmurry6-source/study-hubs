READINGS['diagnosis-tx-planning'] = `
<p>Every periodontal diagnosis starts with the same three numbers. Probing depth (PD) is measured from the gingival margin to the base of the pocket. Gingival recession (GR) is measured from the CEJ to the gingival margin. Clinical attachment level (CAL) — the number that actually matters for staging — is the sum of the two, effectively the distance from the CEJ to the base of the pocket. When the CEJ sits below the margin (no visible recession), GR is recorded as a negative number and CAL comes out smaller than PD; when recession is visible, GR is positive and CAL comes out larger than PD. A 7 mm pocket with the CEJ felt 4 mm subgingival is only 3 mm of attachment loss, while a shallow 2 mm pocket sitting on 4 mm of visible recession is 6 mm of attachment loss — more attachment loss on paper, but a far more maintainable tooth, because the patient can actually reach it with a brush.</p>
<p>Radiographs fill in what a probe cannot reach. Periapicals plus <b>vertical</b> bitewings are preferred over horizontal bitewings, because a horizontal film can miss bone loss on one of the two arches entirely. A panoramic gives a useful global view but is not detailed enough to diagnose periodontal disease on its own.</p>
<h5>Health, gingivitis, or periodontitis</h5>
<p>Health means no probing depth beyond 3 mm, no bleeding, and no attachment or bone loss. Plaque-induced gingivitis can still show probing depths of 4–5 mm and bleeding on probing, but critically <b>no</b> attachment loss and <b>no</b> bone loss — it is contained entirely within the gingiva and is fully reversible with plaque control. A 10% bleeding-on-probing threshold across the full mouth is used before calling a case gingivitis, since probing pressure varies enough between examiners that two or three isolated bleeding sites should not trigger the diagnosis on their own. Periodontitis is different: attachment loss <b>and</b> bone loss are both present, pockets often reach 6 mm or more, and — unlike gingivitis — the disease is not fully reversible. Treatment can stabilize a periodontitis patient, but the best achievable outcome is health on a <i>reduced</i> periodontium, not a full return to the original attachment level.</p>
<p>The periodontium itself can be intact or reduced, independent of disease activity. An intact periodontium can be healthy or have gingivitis. A reduced periodontium — from prior periodontitis, crown lengthening, or simple recession — can also be healthy or inflamed. A previously treated periodontitis patient who is stable on maintenance is diagnosed as healthy on a reduced periodontium, not re-staged, unless disease recurs; if pockets deepen and bleeding returns at a later maintenance visit, the diagnosis shifts back toward periodontitis depending on how widespread the change is.</p>
<h5>Recession is a sign, not a diagnosis</h5>
<p>Recession can occur in tissue that has never had periodontitis, so it is classified separately by how much interproximal attachment is also lost. RT1 has no interproximal loss at all and predicts full root coverage. RT2 has some interproximal loss, but buccal recession still exceeds it, predicting partial coverage. RT3 has interproximal loss that exceeds the buccal recession, and root coverage is not attempted because it will not succeed.</p>
<h5>Staging and grading</h5>
<p>Staging captures how severe the disease is and how complex it will be to manage, using interdental CAL as the gold standard (radiographic bone loss as a second choice). Stage 1 and 2 track rising CAL and bone loss in the coronal third of the root; Stage 3 and 4 both involve CAL ≥5 mm and bone loss into the middle third or beyond — the two are separated not by more attachment loss, but by tooth loss count (≤4 teeth lost pushes Stage 3, ≥5 pushes Stage 4) and by whether the case needs complex, multidisciplinary rehabilitation. Three findings force a case straight to Stage 3/4 regardless of the CAL math: vertical bone loss ≥3 mm, Class II–III furcation involvement, and any tooth loss attributable to periodontitis. A recurring pitfall: a deep probing depth by itself never proves periodontitis — without confirmed bone loss, a mouthful of 4s and 5s could just be generalized gingivitis.</p>
<p>Grading estimates how fast the disease is moving and how the patient is likely to respond. The default assumption is Grade B (moderate), shifted up or down only with evidence. Where serial records exist, direct evidence of progression over time is the gold standard; otherwise, percent bone loss on the worst tooth divided by the patient's age gives a ratio — under 0.25 suggests Grade A, 0.25–1.0 suggests Grade B, and over 1.0 suggests Grade C. Two modifiers can only push the grade <i>up</i>: heavy smoking (more than 10 cigarettes a day) and an HbA1c of 7% or higher both bump a case to Grade C outright, even if the bone-loss/age ratio alone would suggest B. A patient never earns a downgrade simply for not smoking or not having diabetes. Only one stage and one grade are assigned per patient — the stage comes from the single worst site in the mouth, and the grade from progression evidence plus modifiers.</p>
<h5>Reading a bone defect</h5>
<p>At flap reflection, a defect is described by how many bony walls remain around the affected root — picture standing inside the defect and counting the walls visible around you. A 3-wall defect (buccal, lingual, and the wall against the neighboring tooth, with only the involved root bare) has the best prognosis for regeneration. A 2-wall defect has lost one of those walls; when bone is gone from both neighboring proximal surfaces and only buccal and lingual walls remain, that specific pattern is called a crater. A 1-wall defect has the worst prognosis. Radiographs can be deceptive here — thick cortical bone, especially on the mandibular buccal/lingual, can mask a defect that only becomes obvious once the flap is raised.</p>
<h5>From diagnosis to treatment plan</h5>
<p>Every patient starts with Phase I (non-surgical) therapy, regardless of stage: oral hygiene instruction, scaling and root planing, smoking-cessation counseling, replacement of plaque-retentive restorative margins, and — easy to forget — caries control, restored before or alongside SRP rather than deferred, since a cavitated surface is harder to clean and instrument. Any permanent crown or final RPD waits until periodontal therapy is complete; a temporary crown bridges the gap. The Phase I re-evaluation appointment, not the initial exam, is where the definitive call on surgical (Phase II) therapy gets made, based on how much the tissue improved and how well the patient complied. Stage 1–2 cases often resolve with Phase I alone and move straight to maintenance; Stage 3–4 cases more often need Phase II — resective surgery to recontour bone into a physiologic, cleansable shape, or regenerative surgery to rebuild a favorable defect. Every plan ends in maintenance, and the evidence for it is stark: patients who refuse treatment lose roughly three times as many teeth as treated patients, and even treated patients who skip maintenance lose teeth at about twice the rate of those who keep their recall visits.</p>
`;

READINGS['incisions-flaps-sutures'] = `
<p>Every periodontal surgery sits somewhere on one spectrum: a simple extraction might need no incision and no flap at all; a soft-tissue graft over a recession needs a small flap with limited reflection; a sinus or ridge augmentation needs a large flap opened by multiple incisions. The choice of incision and flap design is genuinely clinician-dependent — Dr. Basma was upfront that two surgeons can disagree on the best approach to the same case — but a small, fixed set of designs covers nearly everything.</p>
<h5>Naming an incision: it's about the tooth, not the technique</h5>
<p>The most-missed distinction in this session is that <b>intrasulcular</b> and <b>crestal</b> describe the same physical incision, named differently only by whether a tooth is present. If a tooth is there, the blade is inserted in the sulcus to separate the gingival fibers from the tooth — all the way around, buccal, lingual, and through the papillae — and that's called intrasulcular. If the site is edentulous, there's no sulcus, so the identical straight incision along the crest of the ridge is instead called a crestal incision. More teeth included in the intrasulcular/crestal incision means more flap and better access, but including teeth you don't need to compromises esthetics for no benefit.</p>
<p>When intrasulcular or crestal alone doesn't give enough exposure — most major augmentations — a <b>vertical (releasing) incision</b> is dropped at the line angle of a tooth to open a bigger flap without having to include more teeth in the horizontal incision. One vertical incision plus intrasulcular across three teeth (say, distal of #7 with intrasulcular on 7-8-9) makes a triangular <b>pyramidal flap</b> — enough exposure for implant placement with an onlay graft. Two verticals, one on each side of the defect, make a <b>trapezoidal flap</b>, needed for major vertical augmentation because two releases let the flap coronally advance with passive, tension-free closure over a graft — something a single vertical often can't stretch to do without tearing.</p>
<p>There's one more incision family that skips reflection almost entirely: the <b>envelope (pouch) flap</b>. The papillae are never touched — only the buccal tissue is elevated, giving just enough release to coronally advance the flap over a soft-tissue graft (autogenous or allograft) while leaving the interdental architecture completely intact. This is the design of choice for pure root-coverage cases, where disturbing the papilla would work against the esthetic goal.</p>
<h5>Reading a flap design</h5>
<p>Beyond how it's opened, a flap is classified along three more axes: how much bone is exposed on reflection (full-thickness, taking the periosteum with it, versus split-thickness, leaving periosteum on the bone), where it's repositioned after surgery (coronal to the CEJ for soft-tissue augmentation, or apical for crown lengthening and osseous surgery), and whether the papilla is preserved intact or not. A <b>sulcular flap</b> — intrasulcular incision only, no vertical release — gives the most limited access of the group and is hard to advance because the tissue stays attached laterally; it's the first, smallest option, reached for on minor augmentation or a single implant. Extending it to include one more tooth on each side (still no vertical) buys moderate additional access without escalating to a releasing incision at all.</p>
<p>The full-vs-split decision has a simple test behind it: if the surgical goal involves bone in any way, reflect full thickness and expose it; if the goal is purely soft tissue, go split thickness and leave the periosteum behind as a vascularized bed. That single rule covers every case the course walks through — implant placement, bone/ridge/sinus augmentation, and crown lengthening or osseous surgery (all bone-related) are full-thickness; soft-tissue grafting is the one split-thickness exception, precisely because a split-thickness bed is what lets the graft's blood vessels anastomose with the recipient site's own vessels during healing.</p>
<h5>A fourth incision: sub-marginal, for eliminating a pocket</h5>
<p>The in-class review added a fourth named incision that doesn't fit the reflect-and-close pattern of the other three: the <b>sub-marginal incision</b>, placed <i>below</i> the free gingival margin (the "sub" is literal — below the margin) rather than in the sulcus or on the crest. Where intrasulcular/crestal and vertical incisions are about gaining access and are designed to be closed back to their original position, a sub-marginal incision is deliberately excisional: it's scalloped through the pocket wall itself and the tissue coronal to it is removed outright, not reflected and repositioned. The point is pocket elimination in resective/osseous surgery — if a site probes 6 mm against a 3 mm normal, cutting roughly 3 mm of pocket wall away leaves the patient with a shallower, cleansable sulcus instead of a deep one that will keep repopulating with pathogens between maintenance visits. The tradeoff is intentional: this incision creates recession by design (the gingival margin ends up higher after healing), which is the right call when the alternative is an unmaintainable periodontal pocket, but the wrong call — and never attempted — on a site being treated for recession instead of pocket depth. Whether recession should be created or corrected at a given site always comes back to what the actual problem is: a deep pocket calls for a sub-marginal incision, thin/receded tissue calls for grafting, and the two aren't contradictory approaches, just answers to different problems.</p>
<h5>Choosing a suture material</h5>
<p>At the broadest level, sutures split into <b>absorbable</b> (degrade in the body via hydrolysis or enzymatic cleavage — gut, chromic gut, and the synthetic Vicryl/Monocryl family) and <b>non-absorbable</b> (must be physically removed by the clinician, typically 10–14 days out, or left long-term — silk, ePTFE, polypropylene/Prolene, nylon). Plain gut resorbs fastest (7–10 days); chromic gut, treated with chromium salts, lasts a bit longer (10–14 days); synthetic absorbables like Vicryl hold tensile strength for 2–3 weeks and fully resorb over a longer stretch. Absorbables are the natural choice for quick pediatric cases or simple extractions where a suture-removal visit is a burden; non-absorbables like ePTFE are favored over major bone grafts specifically because they resist plaque attraction, hold high tensile strength, and won't break down prematurely on you.</p>
<p>The course's own material comparison chart sorts six specific materials along the same two axes — natural vs. synthetic, monofilament vs. braided — plus resorption time, strength, tissue reaction, and handling (full chart in Reference Tables). Chromic gut is natural, monofilament, and resorbs fastest (7–10 days) but handles very poorly; it's reached for at extraction sites, implants without additional grafting, or to stabilize a collagen membrane. The two synthetic resorbables split by construction: PGA is braided, resorbs slowest of the resorbables (55–70 days), handles beautifully, but irritates tissue — a fit for ridge and sinus augmentation where healing takes a while. PGCL is monofilament, resorbs faster (22–55 days), and is gentler on tissue, making it the choice for soft-tissue grafting and esthetic crown lengthening. Among the non-resorbables, poly-propylene behaves like nylon with no tissue adherence; silk handles beautifully but causes the worst tissue reaction of any material on the list and must be physically removed at 7 days; PTFE is the highest-cost option and is used across nearly every surgery type except pure soft-tissue grafts.</p>
<p>The monofilament-vs-braided split isn't just a handling preference — it's an infection-control decision. A braided suture's woven strands wick and trap bacteria the way a monofilament's smooth single strand doesn't, which is exactly the mechanism behind silk's poor tissue-reaction score. Whenever a braided suture is used and has to come out, wipe it down with chlorhexidine-soaked gauze before removing it: pulling a plaque-coated braided suture back out through the flap can drag that plaque into the wound on the way out.</p>
<h5>Grafting from the palate: donor-site selection and protection</h5>
<p>Keratinized tissue (pale pink, firm, immobile) is what protects the periodontium against the mechanical trauma of chewing, the way keratinized skin protects a fall better than thin mucosa does; non-keratinized tissue (red, thin, mobile, heavily vascular) can't take that load. When a site lacks adequate keratinized tissue around a tooth or implant, the fix is a graft, and the palate is the best universal donor source because it's uniformly firm, keratinized, immobile tissue. Donor-site selection within the palate still matters: harvest from the <b>molar area</b> rather than the premolar area, because the premolar region carries proportionally more fatty adipose tissue beneath the epithelium, and adipose tissue resorbs quickly once transplanted — a graft that includes too much of it will visibly shrink. The palate's tissue layers, from the surface down, are epithelium, then connective tissue (lamina propria), then adipose tissue over bone; a connective tissue graft keeps only the middle layer; the epithelium is trimmed away and the fatty layer is avoided by design, not just as an unavoidable leftover.</p>
<p>Grafting works because two cut, epithelium-free surfaces held in contact will anastomose their blood vessels and heal together — the same reason two cut fingers held together will reattach, but two fingers merely pressed together (epithelium intact) never will. That's also why the recipient site is prepared as a split-thickness bed: the periosteum left behind gives the graft a vascularized surface to fuse to. The donor site itself is left as an open wound on the roof of the mouth, which is genuinely painful (described in class as comparable to a bad pizza burn, since every swallow and sip exposes raw nerve endings) — management options are a composite-resin stent placed <i>before</i> harvest to preserve the palatal contour of the defect, PRF placed over the wound, or a custom palatal stent/night guard the patient wears for a minimum of three days while the site re-epithelializes, removed only to clean and then replaced. Watch for the greater palatine artery in this area — hitting it is the most common source of problematic bleeding during palatal harvest.</p>
<p>Needle geometry matters as much as the thread. A reverse cutting needle keeps its flat side toward the tissue on the upward pass, reducing tear-through compared to a standard cutting needle. Larger curvature (a bigger arc of the circle) takes a deeper bite; a larger needle diameter passes through more tissue but demands more hand rotation. In suture sizing, a larger number means a smaller diameter — and a smaller-diameter thread needs more knots to hold securely.</p>
<h5>Choosing a technique</h5>
<p>Single interrupted sutures (with the figure-8 variant) are the general-purpose default, each throw tied independently. Horizontal mattress sutures are essential for larger bone-augmentation procedures and prevent flap-margin inversion, but overtightening constricts blood supply to the incision edge and risks bone necrosis and dehiscence. Vertical mattress sutures maximize tissue approximation and eversion, and are the go-to for approximating papillae in the esthetic zone or closing an oro-antral communication. Continuous and continuous-locking sutures place bites close together for a strong seal, but the entire line can come undone if a single throw fails — a real risk with monofilament or other high-glide materials — and are typically reserved for edentulous long-span areas, alveoloplasties, and apicoectomies. Sling and periosteal-anchorage sutures round out the technique list for repositioning a flap around a single tooth or anchoring it apically or laterally.</p>
<h5>Five surgical principles</h5>
<p>Every incision and flap in this course answers to the same five rules: a firm, continuous stroke rather than several tentative passes; keeping the incision at a distance from the actual lesion or bony defect rather than cutting directly over it; placing vertical incisions at the line angle of the tooth; reflecting the periosteum as an integral part of the flap; and keeping the base of the flap at least as wide as its free edge, since a narrow base starves the flap of the only blood supply it has left once it's reflected.</p>
<div class="pearl"><b>Periodontal-orthodontic clearance:</b> when a referring orthodontist plans to move already-thin-tissue incisors further buccally, get ahead of it — a prophylactic soft-tissue graft to thicken the tissue first prevents the recession that pushing a tooth through thin buccal bone/tissue tends to cause, rather than waiting to treat the recession afterward. The best time to treat recession is always the earliest one.</div>
`;

READINGS['risk-assessment'] = `
<p>Dr. Geisinger opens this session with a blunt premise: treat every patient identically regardless of risk, and you are setting yourself up to fail, because periodontitis is not purely an infectious disease — it is an immuno-inflammatory one, shaped by patient-level, site-level, and environmental risk factors that drive how fast (or whether) disease progresses. "One size does not fit all" is the organizing idea for the whole lecture, and the practical question it keeps circling back to is: given everything you know about a patient, how do you turn that into an actual recall interval, an actual treatment threshold, and an actual conversation?</p>
<h5>The scale of the problem, and who is actually looking</h5>
<p>Periodontitis affects roughly 42.5% of US adults over 30 (about 64.7 million people), rising to 70.1% of adults 65 and older; it is more common in men (56.4%) than women (38.4%), and more common among current smokers (64.2%), people below the federal poverty line (65.4%), and people without a high school diploma (66.9%). The harder number to sit with is that 72% of patients ultimately diagnosed with periodontitis first walked in the door saying "I'm here for my routine cleaning" — at initial diagnosis, most patients have no idea anything is wrong. Disease doesn't hurt, bleeding on brushing gets normalized as ordinary, and no one has ever measured or explained it to them. That means the clinician is very often the first and only source of that diagnosis.</p>
<p>Procedure-code data makes the mismatch concrete. Dentistry bills procedures, not diagnoses, and a prophylaxis (D1110) is by definition a preventive code for patients with no periodontal disease or history of it. If disease prevalence rises with age, the share of cleanings billed as prophylaxis should fall with age — instead it rises: 72.3% of cleanings are D1110 in patients 19–34, 87.5% in patients 35–49, and 95.4% in patients 50–64. That trend runs directly opposite to what the epidemiology predicts, which is the lecture's case for under-diagnosis (or under-escalation) becoming more common, not less, as patients age.</p>
<h5>P4 (P5) medicine vs. Hippocratic medicine</h5>
<p>Hippocratic medicine's first principle is "do no harm," and in practice that tends toward reactive care — treating disease once it presents rather than estimating who is headed toward it. <b>P4 medicine</b> — personalized, preventive, predictive, participatory — reframes care as prediction plus partnership: estimate risk, personalize that estimate to the individual patient's own risk markers, and make the patient an active participant in their own care algorithm rather than a passive recipient of instructions. Applied to periodontics specifically, the lecture calls this <b>P5 care</b>: personalized, preventive, predictive, participatory, <i>periodontal</i>.</p>
<p>Why is estimating risk hard in the first place? Partly a data problem — "you get out what you put in." A bitewing that misses the anterior teeth can hide the worst sites in the mouth; an annual panoramic-plus-bitewing routine may simply never image the area that matters. In a UAB retrospective analysis of treated periodontal-maintenance patients, over 40% of the data had to be discarded because bleeding on probing had never actually been recorded — and if inflammation isn't charted, there is no way to size the inflammatory burden a patient is carrying.</p>
<h5>A full risk workup, practically</h5>
<p>Risk assessment is built from a patient interview (medical history, lifestyle, systemic factors), a comprehensive clinical exam (probing depths, clinical attachment levels, plaque, bleeding on probing, suppuration, furcation involvement, mobility, fremitus), diagnostic radiographs assessing alveolar bone levels, a decision about whether systemic factors need a medical consult (HbA1c for a diabetic patient, INR for a patient on anticoagulants), and a lifestyle review (tobacco, alcohol, stress). The American Academy of Periodontology recommends a comprehensive periodontal evaluation at least annually for adults, more often for higher-risk patients — and screening for disease at every patient touch, not just at a scheduled comprehensive exam.</p>
<h5>Why now? — and what a 3 mm pocket means twice</h5>
<p>The hardest question Dr. Geisinger says she gets from patients is "why now?" — someone who has kept every six-month cleaning appointment and is suddenly told they have 8 mm pockets. Those pockets did not appear overnight; the honest answer is usually some mix of failure to diagnose, failure to treat, or a kind of "good enough" treatment that never actually addressed subgingival disease — repeated supragingival-only cleanings on a patient who actually needs active periodontal therapy, a pattern the lecture calls <b>P.E.R.I.O.D. disease</b>: <i>P</i>artially <i>E</i>ffective, <i>R</i>edundant <i>I</i>nstrumentation, <i>O</i>verlooking <i>D</i>isease. Supragingival-only scaling in a periodontitis patient improves plaque scores but does not reduce probing depth or gain attachment, increases gingival bleeding and the frequency of pockets ≥4 mm, and shifts the subgingival flora toward more anaerobic, more pathogenic species (notably <i>P. gingivalis</i>) — something is not always better than nothing.</p>
<p>This is also where a 3 mm probing depth means two different things. A treated periodontitis patient in maintenance has a long junctional epithelial attachment rather than a healthy connective-tissue attachment with a short junctional epithelium — that long junctional epithelium is inherently more prone to breaking down under inflammation. So a periodontally-treated patient with every site reading 3 mm is not a candidate for a plain prophylaxis the way a periodontally-naive patient with the same numbers would be; the periodontal maintenance code and protocol still apply, because the tissue itself is structurally different even once probing depths look normal.</p>
<h5>The inflammatory burden, and why it isn't "just" a mouth problem</h5>
<p>One way the lecture makes inflammatory burden concrete is the <b>periodontal inflamed surface area (PISA)</b>: the total area of pocket epithelium facing active inflammation. A periodontally healthy patient averages a PISA around 34 mm² — roughly a small paper cut. A patient with even mild-to-moderate (Stage 1–2) periodontitis averages a PISA around 2,309 mm² — comparable to a wound the size of cellulitis with early Ludwig's angina. That gap is the argument for why periodontal disease reads as a systemic inflammatory burden, not a localized nuisance: periodontitis has documented links to over 50 systemic conditions, and a few of the better-studied connections carry real numbers — periodontitis increased the odds of dying after COVID-19 roughly nine-fold and of hospitalization roughly five-fold in one comparison; in a COPD trial, patients who received actual subgingival therapy (versus supragingival-only or no treatment) saw roughly double the reduction in COPD exacerbations; and in a diabetes trial, patients receiving intensive periodontal therapy (whole-mouth subgingival scaling, surgery where needed, 3-month maintenance) saw HbA1c fall from 8.1% to 7.8% over 12 months, while a supragingival-only control group saw HbA1c rise from 8.1% to 8.3% and recorded three deaths as adverse events during the study period.</p>
<h5>Measuring risk with a tool instead of a gut feeling</h5>
<p>Objective risk-scoring tools improve the accuracy of risk estimation over intuition alone. The lecture names several: <b>UniFe</b> (Trombelli et al.) scores five inputs — smoking (cigarettes/day), diabetic status (HbA1c), number of pockets ≥5 mm, bleeding-on-probing percentage, and bone-loss-to-age ratio — each 0–4, summed into a 5-tier risk score from low to high. The <b>Periodontal Risk Assessment (PRA)</b>, from Lang and Tonetti, and <b>PreViser/PAT</b> (Page et al.) work on a similar principle of combining clinical, radiographic, and behavioral inputs into a single risk tier, and the lecture reports fairly good agreement between UniFe and PreViser scores when compared head-to-head on the same patients. Newer AI-assisted tools — Pearl AI and Overjet were both named — are emerging in the same space. None of these tools escapes the "garbage in, garbage out" problem: they are only as good as the clinical data fed into them.</p>
<h5>Turning a risk tier into an actual recall plan</h5>
<p>Once a patient is sorted into low, moderate, or high risk, that tier should drive concrete, different follow-up:</p>
<ul>
<li><b>Low risk</b> — comprehensive periodontal exam every 6–12 months, radiographs every 12–24 months, professional biofilm/calculus removal every 6 months, standard home care (twice-daily brushing, once-daily interdental cleaning), nutrition counseling, tobacco-use prevention.</li>
<li><b>Moderate risk</b> — comprehensive exam every 6–12 months <i>plus</i> an oral exam/periodontal screening every 6 months, radiographs every 6–12 months, ongoing systemic-health monitoring, biofilm/calculus removal and local subgingival debridement every 4–6 months, management of plaque-retentive factors, consideration of adjunctive local antimicrobials, surgical care to arrest disease or repair defects if needed, tobacco cessation counseling, oral hygiene adjuncts (water/air flosser, adjunctive rinses or probiotics), and ongoing compliance assessment.</li>
<li><b>High risk</b> — comprehensive exam every 6–12 months <i>plus</i> screening every 3 months, radiographs every 6 months, close systemic monitoring with medical consults as needed, biofilm/calculus removal and subgingival debridement every 2–4 months, consideration of systemic or local adjunctive antimicrobials, surgical treatment likely necessary, and the same home-care/cessation/adjunct/compliance package as moderate risk, just monitored more tightly.</li>
</ul>
<h5>Why maintenance intervals are what they are</h5>
<p>Tooth loss occurs about twice as often in treated-but-non-maintained patients versus treated-and-maintained patients, and more frequent maintenance visits correlate with fewer teeth lost over time — yet patient compliance with maintenance runs only about 30–40%. The standard 3-month interval isn't arbitrary: pathogenic subgingival species begin re-establishing within 4–8 weeks of treatment, and by 9–11 weeks the subgingival microbiome can repopulate close to pre-treatment levels — a 3-month recall sits inside that window. Patients undergoing active orthodontic tooth movement are seen more often still (roughly every 4–6 weeks), both because that's when appliances are adjusted and because inflammation during active tooth movement can uncouple bone formation from bone resorption, risking real bone loss if biofilm isn't controlled tightly during that period. Regularity of maintenance, not just total quantity of visits, is what predicts tooth-loss risk, and that effect is larger for Stage 3/4 and Grade C patients — a patient at that severity who skips more than a year of maintenance across a 5-year window has roughly 2.5x the odds of losing a tooth to periodontitis compared to one who stays regular.</p>
<h5>Communicating risk so patients actually act on it</h5>
<p>The number one reason patients decline a periodontal treatment plan is that they don't trust their dental provider — and the most trusted person in the office, by a wide margin, is the dental hygienist, not the dentist, which is the argument for a consistent message across the whole team rather than just the doctor. 62% of patients delay treatment, switch providers, seek a second opinion, or refuse care outright because they disagree with or distrust a diagnosis. Cost is rarely the real barrier: patients report they would pay an average of $633.63 per tooth to avoid losing it, and cost only becomes an objection when patients feel rushed, unable to ask questions, sense disagreement within the dental team, or aren't offered options for managing cost — in other words, when they don't yet feel that the provider genuinely cares about them specifically.</p>
<p>A staging-and-grading diagnosis ("Stage 2 Grade B periodontitis") gives a shared, precise vocabulary for that conversation with both patients and colleagues, and the lecture models moving a patient from prophylaxis to active therapy as a four-part conversation: name what's actually been monitored and what it shows (problem), explain plainly what subgingival colonization means once probing depths exceed what home care alone can reach — roughly 1.5–2 mm — (consequence), and lay out the "prescribed" (not just "proposed") treatment plan and its benefits against the cost of doing nothing (solution). The strongest predictors of a good long-term outcome tie back to the same list this whole session is built around: oral hygiene, maintenance compliance, bleeding on probing, residual pocket depth after treatment, occlusion, bone-loss-to-age ratio, systemic/genetic factors, and cigarette smoking.</p>
<h5>In class: the three prognosis systems, compared</h5>
<p>The in-person session (a Slido review, which Dr. Geisinger said "might inform the midterm") was about telling the three prognosis systems apart by <i>what each one is based on</i>, not by memorizing lists. <b>McGuire &amp; Nunn</b> sorts teeth by whether they can be <b>maintained</b>, meaning kept in the mouth. Most of the class guessed "disease progression" and was wrong. Its order is <b>good → fair → poor → questionable → hopeless</b>, and the classic mistake is swapping poor and questionable. Poor teeth (attachment loss, Class II furcation, mobility) can be kept with significant effort. A questionable tooth is one we genuinely question keeping, and it does not stay there: it gets worse and becomes hopeless, or it improves and moves up to poor.</p>
<p>How accurate is it? All of the poll statements were true. It is right about <b>80%</b> of the time overall (81% at 8 years). Once the good teeth are taken out of the analysis, it drops to about <b>50%</b>, a coin flip. On average, teeth do <b>better</b> than predicted, and even hopeless teeth in well-maintained patients are often kept much longer than expected. The exceptions are smokers and patients with very poor hygiene, and even very poor hygiene tracks the prediction if those patients keep up with maintenance. Most teeth leave the mouth because a dentist extracts them, not because they exfoliate (unlike implants).</p>
<p>McGuire &amp; Nunn can be given per tooth or for the whole dentition, and as a <b>diagnostic</b> prognosis (what happens if the patient takes no treatment) or a <b>therapeutic</b> prognosis (how the recommended treatment changes the outcome). The therapeutic version is a good way to show a patient what treatment buys them. <b>Kwok &amp; Caton</b> asks whether <b>periodontal stability</b> (arrested attachment loss) can be achieved <i>with treatment</i>: likely, don't know, or unlikely. That is why questionable sits in its <i>middle</i>, and why it can only ever be therapeutic. It is the better choice for a medically complex patient, because smoking or vaping cessation and referral to get an A1c under control become part of the treatment it is judging. <b>Miller &amp; McEntire</b> was studied only on <b>molars</b>. It is quantitative (A1c, smoking and other factors get numbers), and because it was built from patients who received 30 years of treatment and maintenance, it is therapeutic too. Smoking is its biggest single risk factor: about 296% more likely to lose those molars. The one-line summary: <b>only McGuire &amp; Nunn can be diagnostic; all three can be therapeutic.</b></p>
<h5>In class: three cases, all Stage 3</h5>
<p><b>A 78-year-old</b> (ASA II, statin plus baby aspirin, #17 lost to an endodontic perforation) had mostly horizontal bone loss of about 30%, interdental CAL ≥5 mm at the worst site, and a Class II furcation. That makes her <b>generalized Stage 3, Grade B</b>, and her missing teeth were lost to caries, not periodontitis. Confirm the charting first: was lingual recession charted? Her Kwok &amp; Caton prognosis was <b>questionable</b>, because horizontal loss and furcations are hard to regenerate. The plan was a <b>3-month maintenance</b> interval (subgingival repopulation takes about 9-11 weeks, and a periodontitis patient stays higher-risk even once healthy), occlusal adjustment for secondary occlusal trauma, and attention to the recession. The Periodontal Risk Assessment (PRA), a spider-web plot of BOP, sites ≥5 mm, missing teeth, % bone loss and smoking, said to keep current measures.</p>
<p><b>A 13-year-old</b> with little plaque or inflammation had 8-11 mm pockets on first molars and #14 in a <b>molar-incisor pattern</b>: <b>localized Stage 3, Grade C</b>. Deep, narrow vertical defects respond to regeneration (bone graft, membrane, maybe a biologic) with roughly <b>70-75% fill</b>, and young patients heal better. So her therapeutic McGuire &amp; Nunn prognosis is <b>good to fair overall</b>, with the involved teeth fair, while her diagnostic prognosis would be poor to questionable. Regenerating a stage-defining vertical defect or furcation is the only way to move a patient back from Stage 3. About 70% of these circumpubertal patients have a <b>neutrophil chemotactic deficiency</b>, which is why the first teeth to erupt are hit hardest. About 70% of those whose disease generalizes use <b>nicotine</b>. She needs lifelong, closer maintenance and anti-nicotine counseling.</p>
<p><b>A 75-year-old former smoker</b> with BOP at about 80% of sites, 7-9 mm pockets and both vertical and horizontal defects is Stage 3, Grade C. Her overall diagnostic McGuire &amp; Nunn prognosis is <b>poor</b>, even though individual teeth range from good to hopeless, which is why per-tooth prognoses are useful. With compliance and resective or regenerative care, her therapeutic prognosis improves to <b>fair</b>. If she later develops diabetes (A1c 8.8%), her grade can't rise past C, but her PRA footprint grows sharply. That is the point of keeping prognosis and risk tools separate from stage and grade: they capture differences the diagnosis cannot.</p>
<p>The closing numbers: about <b>10%</b> of people resist periodontitis regardless of hygiene, <b>10-15%</b> are at risk for severe destructive disease, and <b>20-25%</b> don't respond to standard therapy. Outcomes depend on things patients control (hygiene, attending maintenance), clinical findings (BOP, residual pockets, occlusal trauma, bone loss over age), and systemic, genetic and nicotine factors.</p>

READINGS['phase1-therapy'] = `
<p>Phase I is the non-surgical stage every periodontal patient starts with, whatever the stage. These notes combine the 2026 slide deck with the recorded class session. Dr. Kaur framed D2 as a step past D1: less about fundamentals, more about therapy, when it succeeds and fails, and what options exist, all to get you ready for clinic next year. She spent the session on the exam and the reasoning behind therapy, and deliberately left instrument detail for the upcoming PCD sessions.</p>
<div class="pearl"><b>Midterm scope (Dr. Kaur's email after class):</b> you will not be tested on instruments, ultrasonics or polishing. Focus on the class discussion and the slides up to <b>failure of therapy</b>. In these notes, that means everything down to the section on Phase I evaluation and failure. The sections after it are marked.</div>
<div class="pearl"><b>Flagged in class:</b> the host-bacteria pathogenesis diagram (health → gingivitis → periodontitis) was introduced with "how many times you have seen this before, has anybody been counting? That's going to be on the quiz." Know who initiates the disease, who drives it, and what SRP actually targets.</div>
<h5>Start from the diagnosis</h5>
<p>Every patient in the chair lands in one of three broad categories: <b>health</b>, <b>gingivitis</b> or <b>periodontitis</b>. Health and gingivitis can each sit on an <b>intact</b> or a <b>reduced periodontium</b>. Periodontitis cannot sit on an intact periodontium, because underlying bone loss is what separates it from the other two. You can't tell the three apart just by looking, whether from a photo or the patient's mouth. Tissue appearance is only one piece. An accurate diagnosis needs the full charting (probing depth, recession, attachment loss, furcations, mobility, tissue health) combined with the radiographs.</p>
<h5>The exam: plaque and gingival health</h5>
<p>A complete periodontal exam covers oral hygiene (plaque index), gingival health, probing, attachment level, furcations, the mucogingival complex, mobility, occlusion and radiographs. It always starts with oral hygiene, because plaque is the primary etiologic factor. There are two ways to capture plaque. You can run the probe about <b>1 mm</b> into the sulcus or pocket (not the same as measuring probing depth) and score each site <b>1</b> if you pick up plaque and <b>0</b> if you don't. Or the patient chews a <b>disclosing tablet</b> (lavender or pink, in the clinic inventory), rinses briefly, and you clear excess solution off the cheeks and tongue, show them in a mirror and record the index. Both methods record only <b>presence or absence</b>, not quantity. Quantifying plaque (gingival third, half the tooth, the whole tooth) at every site would take far more chair time.</p>
<p>Gingival health is read from <b>color</b> (erythema), <b>texture</b> (edema), <b>bleeding on probing</b> and a gingival index. BOP is captured while you probe: a site that bleeds scores <b>1</b>, one that doesn't scores <b>0</b>. <b>Delayed bleeding counts.</b> When you've moved on to the next quadrant or the next two teeth, look back. Sites that have started bleeding since are still scored 1.</p>
<p>Not every periodontitis case looks the same, because risk factors change the clinical picture. <b>Smoking masks inflammation</b>: nicotine's vasoconstriction tends to leave the tissue looking <b>cyanotic</b> rather than edematous and hemorrhagic. <b>Diabetes exaggerates it.</b> <b>Drug-induced gingival overgrowth</b> is a sign that something in the medical or social history is adding to the picture. The class example was a hypertensive patient on <b>amlodipine</b>, a calcium channel blocker, with bulbous enlargement mostly in the interdental tissue, and more on the buccal/labial than the lingual/palatal. The four patients shown (all from the student clinic) all had periodontitis. One was stage 1, one stage 2, and one had stage 2 with uncontrolled diabetes plus a calcium channel blocker, yet each looked different.</p>
<h5>Probing, recession and CAL</h5>
<p>Probing records <b>six sites per tooth</b> (DB, B, MB, DL, L, ML), taking the deepest reading on each. <b>Probing depth</b> runs from the gingival margin to the base of the pocket. <b>Recession</b> runs from the CEJ to the gingival margin. <b>Clinical attachment level</b> runs from the CEJ to the base of the pocket, so <b>CAL = PD + GR</b>. The deck's paired examples: a 7 mm pocket with no recession and a 2 mm pocket with 5 mm of recession both have a CAL of 7 mm.</p>
<p>The lecture's main point about these numbers: <b>in health, probing depth is not equal to clinical attachment level.</b> In intact tissue the gingival margin sits slightly <b>coronal to the CEJ</b> and hides it. Recession is <b>positive</b> when there is true recession (you can see the CEJ) and <b>negative</b> when the margin is coronal to the CEJ: −1, −2, −3, or −3 to −4 or more with drug-induced overgrowth. Add it with its sign. PD 5 mm with GR −3 mm gives <b>CAL 2 mm</b>. Skip the recession and that same site reads CAL 5 mm, which would push you toward <b>Stage 3 or 4</b> even though the radiographs may show only about 20% bone loss. Probing depth, CAL and the radiographs have to tell the same story.</p>
<p>The same trap is built into <b>Salud</b>. Leave recession blank, or type 0 without checking whether it is really positive or negative, and Salud sets CAL equal to PD. A blank <b>over-diagnoses</b> disease, and a reflexive zero gives an inaccurate diagnosis too. Only when you enter the signed value does Salud calculate CAL correctly.</p>
<p>To measure negative recession, you have to <b>feel</b> the CEJ, because you can't see it. Walk the probe to the base of the pocket, then slowly draw it out until you feel the rough CEJ. The millimeters still under the margin at that point are the negative GR, which you subtract from PD. It's harder with heavy <b>inflammation</b> or <b>gingival overgrowth</b> (both pathologic), with <b>altered passive eruption</b> (physiologic), and with <b>calculus or restorative margins</b> that can feel like a CEJ. Some background on eruption: as a tooth comes in, <b>active eruption</b> moves the tooth toward occlusion, while <b>passive eruption</b> is the gingiva, with its connective tissue and junctional epithelium, migrating apically to settle at the CEJ. In altered passive eruption the tissue never makes that move, so the margin ends up well coronal to the CEJ. Expect a learning curve here.</p>
<p>The probe is the most important instrument in the exam. Use light pressure, feel for the elastic stop, and keep it parallel to the long axis. <b>Interproximal probing is not line-angle probing.</b> Stopping at the line angle is wrong. Carry the probe past the line angle and under the contact point (anteriors) or contact area (posteriors), tilted slightly toward the area apical to the contact. The usual errors are too little angulation or too much.</p>
<h5>When you can't probe yet: debridement</h5>
<p><b>Debridement is not a therapeutic procedure.</b> You never do it to treat disease, and it should <b>never be combined with scaling and root planing</b>. Its only indication is that calculus hides the gingival margin so completely that you can't see or explore it, and so can't capture any numbers. There is only a <b>full-mouth</b> debridement code. No half-mouth, lower-anterior or maxillary-posterior version exists. The code is intended for generalized calculus heavy enough to cover even chewing surfaces, and you will seldom see that. Insurance won't pay for debridement and a periodontal exam at the same visit, on the reasoning that if you couldn't probe before, the tissue won't be ready right after. So in practice the patient comes back in about <b>two weeks</b> for full charting.</p>
<p>At school it's more flexible. First-time perio charting is <b>free</b>, so after debriding a localized bridge of calculus you can go straight on to full-mouth charting in the same visit if the tissue holds up. Check with your faculty, who may prefer to let it settle for two weeks. Combining the two saves the patient a visit. In private practice you can choose not to bill the debridement at all, though a fully booked hygiene schedule is often a reason to stagger the appointments anyway.</p>
<h5>Furcations: Glickman, not millimeters</h5>
<p>Furcations are examined with the <b>Nabers probe</b>. It is curved, with alternating light and dark bands 3 mm apart, and it is read alongside radiographs. Even though it has markings, the language used here is the <b>Glickman classification</b>, not a millimeter scale. Class I is not "3 mm or less."</p>
<ul>
<li><b>Class I, incipient.</b> The probe just feels a catch. Usually needs no treatment, and it is easy to maintain as long as attachment loss and probing depth don't increase.</li>
<li><b>Class II, cul-de-sac.</b> A definite furcation invasion, but a bony wall remains on the other side (probe from buccal and the palatal or lingual crest is still there). It has depth and containability, so it is the class <b>most amenable to regeneration</b>.</li>
<li><b>Class III, through-and-through.</b> The hardest to treat. With no containability left, it has lost its regenerative potential.</li>
<li><b>Class IV.</b> A class III that has also lost the soft tissue over it, naturally through recession or surgically, so the through-and-through furcation is visible. The patient can clean it with interdental aids or a water flosser, but the exposed root trunk risks sensitivity and <b>root caries</b>. Caries in a furcation makes the tooth hopeless, so keep these teeth under close watch at every maintenance visit.</li>
</ul>
<p>Dr. Kaur's cases: an upper molar (#3) with distopalatal and straight buccal involvement was the only distal abutment of a bridge, so rather than extract it, the class III was converted to class IV (furcation cleaned, margin moved apically for access). That patient is still doing well. Another patient with the same treatment developed a large carious lesion under the furcation roof.</p>
<h5>Mucogingival exam, mobility and occlusion</h5>
<p>The mucogingival exam asks how much keratinized tissue the patient has. Measure its width directly, or use the <b>rolling technique</b>: roll the mucosa coronally until you reach the mucogingival junction, beyond which it won't roll. This matters around <b>implants</b> as well as teeth. Recession and overgrowth are noted here too.</p>
<p>Mobility is checked with <b>two rigid (blunt) instruments</b>, one on each side of the tooth, and graded on the <b>Miller scale</b>: 0 is normal, 1 is slightly more than normal (&lt;1 mm), 2 is moderately more (&gt;1 mm but &lt;2 mm), and 3 is severe faciolingual and/or mesiodistal mobility combined with vertical displacement. A tooth that is <b>depressible</b> in its socket is ready for extraction. That's <b>static</b> mobility. <b>Fremitus</b> is mobility in <b>function</b>. You rest a finger on the root while the patient brings the teeth together and feel for vibration. It can have a vertical and/or horizontal component, and it is <b>palpated, not seen</b>, unless it is extreme. Positive fremitus means you need to find out why the tooth carries that load. In the class example, lack of posterior support meant the <b>premolars were doing the work of molars</b>.</p>
<p>The perio chart has no place for occlusal findings, so record them in the <b>notes section</b>: wear patterns, erosion, vertical defects and whether they tie to an occlusal problem, and parafunctional habits. That matters because mobility isn't always from periodontitis alone. It can be <b>occlusal trauma on a reduced periodontium</b>, from lack of posterior support, parafunction, or overjet and overbite. Treating a 5 mm pocket won't resolve grade 2 mobility unless the occlusion is addressed. The deck's list of occlusal signs: parafunctional habits, mobility, fremitus, migration, open contacts, atypical wear and wear facets, possible TMJ pain, infrabony defects and a widened PDL space.</p>
<h5>Radiographs, before you touch the patient</h5>
<p>Before any clinical data, a radiograph can show you whether there is <b>bone loss</b>, where it is (<b>localized or generalized</b>) and its pattern (<b>horizontal, vertical</b>, or both). It also shows <b>tipped teeth</b>, <b>fused roots</b>, <b>root proximity</b> (important for surgical and non-surgical therapy), <b>calculus</b>, <b>sinus proximity</b>, and a <b>periapical lesion</b> (#7 in the class film). Seeing calculus on a radiograph should make you "a little bit of both" sad and excited. Sad the patient got there, excited because you now know the cause and it is something you can remove. Once calculus has formed the patient can't remove it, so your role matters even more.</p>
<p>Her practical tip: when you sit down for SRP (or even a prophy), don't open the chart to hunt for deep pockets. The instrument will find the pocket, and its base is your limit. Open the <b>x-rays</b> instead (screenshot them, since Salud times out). Then roughness on #14-15 matches calculus you've already seen, and exudate or a sinus tract on #7 matches the PA lesion. Always look at the x-rays before you start capturing numbers.</p>
<h5>Why Phase I works: bacteria start it, the host drives it</h5>
<p>Plaque bacteria <b>initiate</b> the disease. The <b>host immune response</b> drives its <b>progression</b>. In health the host is responsive and the bacterial load isn't virulent enough, so inflammation is fought off acutely before disease surfaces. In gingivitis the bacterial composition shifts and the attack gets more aggressive. The host still wins, but it takes longer: T cells and B cells are recruited alongside PMNs, and you see inflammation for days to weeks. Not every patient moves from reversible to irreversible inflammation. Those who do have a host that has become <b>hyper-responsive</b>, whether to the same bacteria or a heavier attack, releasing pro-inflammatory cytokines. Environmental, genetic, behavioral and epigenetic factors add risk. The picture of periodontitis is attachment loss, bone loss, loss of PDL, cementum and alveolar bone.</p>
<p>SRP targets the <b>bacteria</b>, yet bacteria cause only about <b>25%</b> of the damage. About <b>75%</b> comes from the host's inflammatory mediators and bone-destroying cells (<b>osteoclasts</b>). Bacteria bring <b>endotoxin (lipopolysaccharide)</b>, not osteoclasts. Removing the bacteria calms the host response. When even good home care plus the best SRP or surgery leaves residual disease, you can also calm the host directly. That is <b>host modulation</b>, or "periodontal medicine," covered later by Dr. Litz. Bacteria cover calculus and live inside its tubules. Calculus and plaque also act as <b>irritants</b> the host reacts to, supra- or subgingivally.</p>
<p>The goals of removing them: <b>reduce inflammation</b>, shift the pocket flora from <b>gram-negative toward gram-positive</b> (healthy mouths still have bacteria, just different ones), and <b>arrest progression</b>. SRP does <b>not reverse the damage</b>. Lost bone and attachment stay lost, which is why periodontitis is called irreversible. And <b>pocket elimination is not the rationale</b> for SRP, even though pockets do shrink. A pocket is a space the patient can't clean, filled with more virulent gram-negative flora and facing the host response. Phase I changes that local environment.</p>
<h5>How pockets shrink, and why re-evaluate at 4-6 weeks</h5>
<p>Two changes reduce probing depth. At the <b>gingival margin</b>: inflammation means increased volume (cells and fluid, inside and outside cells). As it resolves the tissue shrinks, which you record clinically as <b>increased recession</b>. At the <b>base of the pocket</b>: disease had broken both the junctional epithelium (which is why the probe sank deeper) and the connective tissue fibers. After SRP both <b>reattach</b> to the clean root. The measurement is two-dimensional, but the disease is three-dimensional.</p>
<p>The healing clock: <b>junctional epithelium 7-10 days</b>, <b>connective tissue reattachment 4-6 weeks</b>, and collagen fiber <b>maturation and orientation 3-6 months</b>. That is why the patient returns at <b>4-6 weeks</b>. You see the maximum result by then, and research shows waiting longer gives no additional pocket reduction. The deck puts it slightly differently: the biggest PD changes happen in the first 4 weeks, the dentogingival junction is re-established at <b>2-4 weeks</b>, and repair and maturation can continue for <b>9-12 months</b>. Know both sets of numbers. The deck's "6 mm might become 5 or 4.5" figures are there for a sense of scale. She said you are <b>not expected to memorize</b> them.</p>
<h5>The vocabulary (and the codes)</h5>
<p><b>Scaling</b> removes soft and hard deposits from tooth and root surfaces and from any fixed or removable prosthesis, <b>both supra- and subgingivally</b>. If asked whether scaling is supra- or sub-G, the answer is both. <b>Root planing</b> stays <b>subgingival</b> and works only on root surfaces, removing cementum or surface dentin that is rough, calculus-impregnated or contaminated, to leave a smooth root with no ridges, roughness or catch. Clinically the two are done together.</p>
<p><b>Prophylaxis</b> is <i>preventive</i>, not therapeutic. It is for a patient who has <b>never had periodontitis</b> (gingival health or gingivitis). Subgingival calculus doesn't make it periodontitis: normal sulci have depth, and calculus 1-2 mm down is subgingival and gets removed as part of the prophy. <b>Periodontal maintenance</b> is <i>supportive</i> therapy for a patient <b>already treated for periodontitis</b>, to keep the disease from recurring, with oral hygiene evaluated every visit. The terms are not interchangeable. A maintenance patient with mostly 1-3 mm pockets, some residual 4s and an isolated 5 is fine to stay on maintenance when hygiene is good, those sites don't bleed, the tissue looks healthy and the radiographs show no progression. <b>Localized SRP on residual pockets</b> that didn't respond is defined as part of maintenance.</p>
<p><b>Scaling in the presence of gingival inflammation (D4346)</b> sits between a prophy and SRP. It is for a patient <b>never diagnosed with periodontitis</b> who has no bone loss but heavy, generalized inflammation from local factors (plaque and calculus), so a simple prophy undersells the work. At school it's done the perio way, with perio faculty or a resident, and gets a <b>Phase I evaluation</b>. The class case was a young patient (20s to early 30s) with a lingual bridge of calculus. What looked like bone loss around the premolars and mesial of the molars came from second premolars extracted for orthodontics and the tipping that followed, not from periodontitis. Diagnosis: <b>generalized gingival inflammation on a reduced periodontium in a non-periodontitis patient</b> (the deck calls it gingivitis on a reduced periodontium), treated with D4346. That case had debridement, charting and therapy in the same visit. <b>Full-mouth debridement (D4355)</b> is gross removal so a proper evaluation can be done at a later visit.</p>
<h5>What the evidence says about delivery</h5>
<p>There is no considerable advantage to spreading instrumentation over <b>multiple sessions</b>: calculus left behind after several visits stays for the same reasons it stays after one (Anderson et al. 1996). <b>Manual and mechanically driven</b> (ultrasonic) instrumentation show no statistical difference in probing-depth reduction or attachment gain, and adding subgingival irrigation with chlorhexidine, saline or peroxide adds nothing. Root debridement is inadequate about <b>65% of the time in pockets ≥5 mm</b> (Greenstein 2000).</p>
<p>The limitations, as she taught them: deeper pockets are harder to reach, though a 5 mm pocket doesn't mean calculus is left every time. <b>SRP is a blinded procedure</b>: tactile sensation and proprioception are your guide in the pocket. <b>Motile bacteria</b> invade the pocket lining, while SRP only targets the pocket itself (and it doesn't reliably suppress <i>A. actinomycetemcomitans</i>). <b>Restorations</b> with overhanging, subgingival, open or rough margins both collect plaque and resist cleaning. <b>Furcations</b> and <b>developmental grooves, fissures and concavities</b> block access. Chasing a smooth root can remove too much <b>cementum</b>, causing <b>hypersensitivity</b>. And results depend on the patient's <b>compliance</b> with hygiene and on <b>operator skill</b>, which has a learning curve.</p>
<h5>Phase I evaluation, and when it "fails"</h5>
<p>Re-evaluate at <b>4-6 weeks</b>: plaque scores, signs of inflammation, BOP, PD, recession, CAL, mobility, furcation and suppuration. This is the visit where the decision about surgery is made. If there's still inflammation and the numbers haven't improved, check whether <b>residual calculus</b> is the reason. You'll often feel it with the probe while recharting. If it is, remove it (not charged) and do another Phase I evaluation in <b>two weeks</b>. If you already removed all the deposits the first time, <b>more rounds of SRP won't do anything</b>. What works is <b>improving the patient's oral hygiene</b>.</p>
<p>"Failure of therapy" is a harsh term, because so much is outside your control. The host response matters to healing as well as to disease. A <b>smoker</b> or a patient with <b>uncontrolled diabetes</b> may not get the same short- or long-term result from your best SRP. The deck's approach to a failed Phase I: assess the tissue response, remaining deposits, health history and risk factors, possibly a plaque culture. Then choose among antibiotics or antimicrobials, host modulation, repeating non-surgical therapy, another re-evaluation, or <b>Phase II</b>, which is <b>surgical therapy to eliminate pockets</b>.</p>
<h5>The instruments (not on the midterm)</h5>
<p>Per Dr. Kaur's email, instruments, ultrasonics and polishing are off the midterm, and in the deck they come after failure of therapy. The email only covers the midterm, so this material can still come back on the comprehensive final and in the PCD instrument competency.</p>
<p>She deliberately kept instruments light this session. They get dissected in the upcoming <b>PCD</b> sessions, and you don't need the numbers yet, though you will later. For now, three sets live on your daily kits. The <b>exam kit</b> holds the mirror, the periodontal probe, the Nabers probe for furcations, and a <b>periodontal explorer</b>. That explorer is not the caries explorer. You use it after therapy to check for smooth roots or any catch or roughness. Then come <b>scalers</b> and <b>curettes</b>. Every instrument has a handle, a shank and a blade (the shank connects the two).</p>
<p><b>Scalers</b> are mainly supragingival. They reach only a short way subgingivally (the deck says 1-2 mm; in class she said about 2-3, noting sources give 1-3 or 1-2). Working strokes are <b>short, powerful and fast</b>. <b>Curettes</b> travel deep into the pocket with <b>longer, slightly lighter</b> strokes that take more time, though tenacious calculus can still need real pressure. The key difference is the blade. A scaler has cutting edges on <b>both sides</b>. A Gracey curette cuts on <b>one side</b> only, so subgingivally the side facing the soft tissue is protected. Nearly every curette on the kit is a <b>Gracey</b>, marked <b>SG</b>, site-specific with one cutting edge. The single <b>SC</b> instrument is the one <b>universal curette</b>, which, like a scaler, has a blade on both sides.</p>
<p>The clinic has <b>piezoelectric</b> ultrasonic handpieces and tips alongside hand instruments. They can be used subgingivally, but they <b>cannot root plane</b>, so they won't leave a smooth root. Use them in combination: <b>ultrasonic</b> to remove gross deposits, then <b>hand instruments</b>, then the <b>ultrasonic again</b> so the irrigation's lavage flushes the pocket.</p>
<p>From the deck, for later: periodontal hand instruments are mirrors, explorers, probes, scaling and root-planing instruments, and polishing instruments. The <b>mirror</b> gives indirect vision, illumination and retraction. The <b>ODU 11/12 explorer</b> is used on every surface of every tooth to feel root roughness. Its shank resembles the Gracey 11/12, and it is inserted with the terminal shank parallel to the tooth down to the slight resistance of the epithelial attachment, using up-and-down and side-to-side strokes with the side of the tip. The <b>UNC-15</b> probe is 15 mm long. The exam kit is probe, explorer, Nabers probe, mirror and cotton pliers.</p>
<p><b>Sickle scalers</b> have a pointed tip, a triangular cross-section and two cutting edges. Use on exposed cementum is restricted. They work with a short, powerful <b>pull</b> stroke under the ledge of calculus, using the lower third of the blade. The <b>H6/7</b> anterior sickle has a straight shank for anterior teeth and the buccal/lingual of molars. The <b>S204SD9</b> posterior sickle has a right-angled shank for posterior interproximals. Both work at about 80° to the root. A curette has a rounded tip and a half-circle cross-section and works supra- and subgingivally. A universal curette (<b>Columbia 13/14</b>) has two cutting edges. An area-specific <b>Gracey</b> has one.</p>
<p><b>Gracey curettes</b> have a 70° blade angle, a single cutting edge on the lower side of the blade, a rounded back that protects the tissue, and a lower shank that should sit parallel to the long axis of the tooth. Each is inserted at a closed angle, then opened to a <b>70-80° working angle</b> against the root. The <b>3/4</b> (or 1/2, 7/8) covers all surfaces of anterior teeth (the demo slide adds premolars) and deep subgingival calculus. The <b>11/12</b> covers mesial surfaces of posterior teeth plus the buccal/lingual of molars. The <b>15/16</b> is an alternative mesial-posterior instrument. The <b>13/14</b> covers distal surfaces of posterior teeth: its shank has more bends than the 11/12, and it is pulled apico-coronally or postero-anteriorly.</p>
<p><b>Ultrasonics</b> come in two types. A <b>magnetostrictive</b> unit sends electrical energy to nickel-iron metal stacks in the insert, which change shape and vibrate in an elliptical-to-orbital pattern at roughly 18,000-42,000 cycles per second, so every surface of the tip can debride. A <b>piezoelectric</b> unit uses crystals in the handpiece, and the tip moves linearly, so mainly its lateral surfaces work. For <b>implants</b>, probes are marked in 3-mm sections (3-6-9-12 or 3-6-8-11), and the listed instruments are anterior and posterior sickles plus the Columbia 4R/4L.</p>
<h5>Technique (not on the midterm)</h5>
<div class="pearl"><b>Don't forget (the deck's own emphasis):</b> modified pen grasp and a finger rest.</div>
<p>There are four intraoral finger rests: <b>conventional</b> (tooth surfaces right next to the working area), <b>cross-arch</b> (the other side of the same arch), <b>opposite-arch</b> (the opposite arch), and <b>finger-on-finger</b> (the index finger or thumb of the non-working hand). Adaptation depends on the tissue (fibrotic vs. hemorrhagic), the severity of disease (how retractable the tissue is, the interproximal embrasure), and how tenacious the calculus is.</p>
<p>An <b>exploratory stroke</b> uses light force with the instrument adapted, to map the depth and topography of the pocket and find calculus. A <b>working stroke</b> uses a tight grasp with pressure through the working end: <b>scaling</b> strokes are short, overlapping, powerful and controlled, and <b>root-planing</b> strokes are longer and shaving, with lighter pressure. You check your work during the session by exploring the root surface, and at Phase I evaluation by the tissue response: less erythema, edema and BOP. The patient's own hygiene weighs heavily on that result. The areas most often missed are the <b>CEJ, furcation entrances, line angles</b> and hard-to-reach areas, especially <b>distal surfaces of posterior teeth</b>.</p>
<h5>To polish or not to polish (not on the midterm)</h5>
<p>For polishing: it removes extrinsic stain that brushing and scaling leave, prepares teeth for sealants, fluoride gels and varnishes, and patients like it. Against: 30 seconds with pumice can remove up to <b>4 µm of enamel</b>, and the outermost layer holds the most fluoride. A coarse abrasive can leave a rougher surface than it started with. Steady pressure from a fast rubber cup can cause pain and possible pulpal damage. A rubber cup with pumice for 2 minutes can strip the sulcular epithelium entirely, and pumice can be pushed subgingivally. If you polish, use a low-abrasion paste on a slow-speed handpiece with minimal heat, the cup at 90° to the tooth, and intermittent light pressure. (Polishing came from the deck. It wasn't covered in the recorded session.)</p>
`;

READINGS['antibiotics-host-mod'] = `
