{ id:'q2-17', lec:'incisions-flaps-sutures', type:'mcq', stem:"Why must the base of a flap be at least as wide as its free edge?", choices:["To protect the flap's blood supply", 'To make suturing easier', 'To reduce total incision length', 'To avoid touching the periosteum'], answer:0, ex:"A flap's blood vessels enter from its base. If the base is narrower than the free edge, the far end is starved of blood and can necrose.", src:'lecture' },
{ id:'q2-18', lec:'incisions-flaps-sutures', type:'mcq', stem:"A surgeon performs the exact same sulcus-following incision around tooth #8, which is present, and along an edentulous ridge where tooth #9 used to be. What are these two incisions called?", choices:["Intrasulcular at #8, crestal at #9 — same technique, named by tooth presence", "Crestal at #8, intrasulcular at #9 — named by where the scalpel blade enters", "Both are called vertical incisions, since each runs along the long axis", "Both are called pouch incisions, since neither releases the flap laterally"], answer:0, ex:"Intrasulcular and crestal are the same physical incision. The name changes based only on whether a tooth is present at that site, not on any difference in technique.", src:'lecture' },
{ id:'q2-19', lec:'incisions-flaps-sutures', type:'mcq', stem:"Why would a surgeon drop a vertical incision instead of just extending the intrasulcular incision to more teeth?", choices:["To gain more apical exposure without including teeth that don't need to be involved","Because vertical incisions heal faster than intrasulcular ones","Vertical incisions are required by law to be used before any bone graft","To avoid ever having to place a suture"], answer:0, ex:"A vertical release opens the flap apically, so you reach bone and defects without dragging extra, uninvolved teeth into the surgery.", src:'lecture' },
{ id:'q2-20', lec:'incisions-flaps-sutures', type:'mcq', stem:"A root-coverage case needs a soft-tissue graft placed without disturbing the papillae at all. Which flap design fits?", choices:['Envelope (pouch) flap','Trapezoidal flap','Full-thickness flap exposing bone','Sulcular flap extended to 4 teeth'], answer:0, ex:"The envelope/pouch flap elevates only the buccal tissue and never reflects the papillae — exactly what a root-coverage graft needs.", src:'lecture' },
{ id:'q2-21', lec:'incisions-flaps-sutures', type:'mcq', stem:"A major vertical ridge-augmentation graft needs the flap to advance coronally with zero tension over the graft. Which flap design is built for that?", choices:['Trapezoidal flap (two vertical incisions)','Sulcular flap (no vertical incisions)','Pyramidal flap (one vertical incision)','Envelope flap (no reflection of the papillae)'], answer:0, ex:"Two releasing incisions, one on each side of the defect, let the flap stretch coronally without tension — a single vertical often can't reach that far without tearing.", src:'lecture' },
{ id:'q2-22', lec:'incisions-flaps-sutures', type:'mcq', stem:"An implant needs onlay bone grafting around it, and the surgeon wants more access than a sulcular flap gives without opening both sides of the site. What's the fit?", choices:["Pyramidal flap — one vertical plus intrasulcular across three teeth", "Trapezoidal flap — two verticals, one on each side of the implant site", "Sulcular flap only — no vertical release at all", "Envelope flap only — buccal elevation, papillae intact"], answer:0, ex:"A pyramidal flap uses one vertical plus an intrasulcular incision across three teeth. It gives more exposure than a sulcular flap without the second release a trapezoidal flap needs, which is reserved for major augmentation.", src:'lecture' },
{ id:'q2-23', lec:'incisions-flaps-sutures', type:'match', stem:"Match each suture material family to an example the lecture named.", pairs:[['Absorbable, natural','Gut / chromic gut'],['Absorbable, synthetic','Vicryl / Monocryl'],['Non-absorbable','Silk / ePTFE / Prolene / nylon']], ex:"Gut is the natural absorbable; Vicryl (polyglactin) and Monocryl (poliglecaprone) are synthetic absorbables; silk, ePTFE, Prolene (polypropylene) and nylon stay until removed.", src:'lecture' },
{ id:'q2-24', lec:'incisions-flaps-sutures', type:'mcq', stem:"A site probes 6 mm and needs its pocket surgically eliminated rather than the pocket wall reflected and repositioned. Which incision is designed for exactly this?", choices:['Sub-marginal incision','Intrasulcular incision','Crestal incision','Vertical (releasing) incision'], answer:0, ex:"Placed below the free gingival margin and excisional by design — a strip of pocket wall is cut away and discarded, not reflected back, leaving a shallower sulcus.", src:'lecture' },
{ id:'q2-25', lec:'incisions-flaps-sutures', type:'mcq', stem:"Why does a sub-marginal incision create recession, and is that a problem?", choices:['It\'s created on purpose to eliminate a pocket — acceptable when pocket depth, not recession, is the problem being treated','It\'s always a complication that should be avoided','It only happens if the surgeon makes an error','It happens but resolves completely within a week'], answer:0, ex:"A sub-marginal incision deliberately removes pocket wall. The recession that results is the point of the procedure when the problem being treated is pocket depth.", src:'lecture' },
{ id:'q2-26', lec:'incisions-flaps-sutures', type:'mcq', stem:"An implant is being placed with simultaneous bone grafting. What flap thickness should be reflected, and why?", choices:['Full thickness — the goal is to expose and graft bone','Split thickness — the goal is to protect the periosteum','Full thickness — split flaps can\'t be sutured closed','Split thickness — implants never need bone exposed'], answer:0, ex:"Grafting bone around an implant needs the bone exposed, so the periosteum comes up with the flap: full thickness.", src:'lecture' },
{ id:'q2-27', lec:'incisions-flaps-sutures', type:'mcq', stem:"A soft-tissue graft is being placed to thicken keratinized tissue around a tooth. What flap thickness is reflected at the recipient site, and why?", choices:['Split thickness — periosteum is left behind as a vascularized bed for the graft','Full thickness — more bone exposure helps grafts attach','Split thickness — because soft-tissue cases never bleed','Full thickness — periosteum would reject the graft'], answer:0, ex:"A soft-tissue graft needs a blood supply from underneath, so the recipient site is split thickness: the periosteum left on the bone becomes the vascular bed the graft lives on.", src:'lecture' },
{ id:'q2-28', lec:'incisions-flaps-sutures', type:'mcq', stem:"Harvesting a palatal connective tissue graft, which donor site is preferred and why?", choices:['The molar area — more lamina propria, less fatty adipose tissue that would shrink after transplant','The premolar area — thinner tissue is easier to suture','The molar area — it has no risk of bleeding','The premolar area — it has more adipose tissue for bulk'], answer:0, ex:"The premolar region carries proportionally more fatty adipose tissue beneath the epithelium; adipose tissue resorbs quickly once transplanted, so a graft that includes too much of it will visibly shrink.", src:'lecture' },
{ id:'q2-29', lec:'incisions-flaps-sutures', type:'mcq', stem:"Of the palate's three tissue layers (epithelium, connective tissue/lamina propria, adipose), which does a connective tissue graft keep?", choices:['Connective tissue (lamina propria) only','All three layers','Epithelium and connective tissue','Adipose tissue only'], answer:0, ex:"A CTG takes only the lamina propria. The epithelium is left on the palate (an FGG keeps it), and the fatty submucosa is trimmed off because it does not help the graft take.", src:'lecture' },
{ id:'q2-30', lec:'incisions-flaps-sutures', type:'recall', stem:"Why is a braided suture generally avoided in favor of a monofilament, even though silk (braided) is still used for some cases?", answer:"A braided suture's woven strands wick and trap bacteria the way a smooth monofilament strand doesn't, raising inflammation/infection risk. Silk is the accepted exception — its handling and ability to apically position tissue make it useful for osseous surgery and crown lengthening despite the tradeoff, and it's removed early (about 7 days).", ex:"If a braided suture must be removed, wipe it with chlorhexidine gauze first so plaque trapped in the weave doesn't get dragged into the flap on the way out.", src:'lecture' },
{ id:'q2-31', lec:'incisions-flaps-sutures', type:'mcq', stem:"A single interrupted suture in the esthetic zone risks pushing the papilla down and creating a black triangle. Which technique avoids this by approximating the flap edges rather than cinching down on top of the tissue?", choices:['Vertical mattress','Continuous locking','Sling suture','Periosteal anchorage'], answer:0, ex:"A single interrupted suture cinches down on top of the papilla. The vertical mattress pulls the flap edges together instead, so the papilla keeps its height and no black triangle forms.", src:'lecture' },
{ id:'q2-32', lec:'incisions-flaps-sutures', type:'mcq', stem:"A patient with thin buccal tissue on the lower incisors is about to start orthodontic treatment that will push those teeth further buccally. What's the recommended sequence?", choices:['Graft to thicken the tissue prophylactically before orthodontic movement begins','Start orthodontics and graft only if recession actually develops','Delay orthodontics indefinitely — thin tissue is a permanent contraindication','Graft after orthodontics is finished, regardless of what happens during treatment'], answer:0, ex:"This is periodontal-orthodontic clearance: grafting ahead of the movement prevents the recession that pushing a tooth through thin tissue tends to cause, rather than treating it after the fact.", src:'lecture' },

/* ===== Lecture 3 — Risk Assessment ===== */
{ id:'q3-01', lec:'risk-assessment', type:'mcq', stem:"Which risk-assessment system is applied to individual teeth and can be either diagnostic or therapeutic?", choices:['McGuire & Nunn','Kwok & Caton','Miller & McEntire','None of these'], answer:0, ex:"McGuire & Nunn is the per-tooth system, and the only one that can be used both diagnostically (before treatment) and therapeutically. Kwok & Caton is whole-mouth; Miller & McEntire is molars only.", src:'exam-review' },
{ id:'q3-02', lec:'risk-assessment', type:'mcq', stem:"Which system assesses the likelihood of achieving periodontal stability for the whole dentition, and is therapeutic only?", choices:['Kwok & Caton','McGuire & Nunn','Miller & McEntire','Hamp'], answer:0, ex:"Kwok & Caton scores the whole dentition on how likely the patient is to reach periodontal stability, and it is used therapeutically only.", src:'exam-review' },
{ id:'q3-03', lec:'risk-assessment', type:'mcq', stem:"Which prognosis system applies only to molars?", choices:['Miller & McEntire','McGuire & Nunn','Kwok & Caton','Glickman'], answer:0, ex:"Miller & McEntire was built and studied on molars only, and it is quantitative, scoring factors like smoking and A1c.", src:'exam-review' },
{ id:'q3-04', lec:'risk-assessment', type:'mcq', stem:"What does the McGuire & Nunn system assess?", choices:['How easy the tooth is to maintain in the mouth','Likelihood of retaining the tooth','Likelihood of achieving periodontal stability','Rate of disease progression'], answer:0, ex:"McGuire & Nunn asks how easy the tooth will be to maintain. \"Likelihood of retaining the tooth\" is Miller & McEntire; \"likelihood of stability\" is Kwok & Caton.", src:'exam-review' },
{ id:'q3-05', lec:'risk-assessment', type:'match', stem:"Match each risk-assessment system to its scope.", pairs:[['McGuire & Nunn','Individual teeth'],['Kwok & Caton','Whole dentition'],['Miller & McEntire','Molars only']], ex:"Scope is the quickest way to tell them apart: McGuire & Nunn rates single teeth, Kwok & Caton the whole mouth, Miller & McEntire molars only.", src:'exam-review' },
{ id:'q3-06', lec:'risk-assessment', type:'mcq', stem:"Which system(s) are strictly therapeutic — meaning they cannot be used purely diagnostically?", choices:['Kwok & Caton and Miller & McEntire','McGuire & Nunn and Kwok & Caton','All three systems are diagnostic only','None of the three are therapeutic'], answer:0, ex:"Kwok & Caton and Miller & McEntire are therapeutic only. McGuire & Nunn is the one system that works either way.", src:'exam-review' },
{ id:'q3-07', lec:'risk-assessment', type:'recall', stem:"How is McGuire & Nunn different from the other two risk-assessment systems in terms of when it can be used?", answer:"McGuire & Nunn can be applied either before treatment planning (diagnostic) or to gauge response after treatment (therapeutic). Kwok & Caton and Miller & McEntire are described as therapeutic only.", src:'exam-review' },
{ id:'q3-08', lec:'risk-assessment', type:'mcq', stem:"Which of the three systems assigns risk to the whole dentition rather than to a single tooth?", choices:['Kwok & Caton','McGuire & Nunn','Miller & McEntire','All three'], answer:0, ex:"Kwok & Caton is the whole-dentition system. McGuire & Nunn rates individual teeth and Miller & McEntire rates molars.", src:'exam-review' },
{ id:'q3-09', lec:'risk-assessment', type:'mcq', stem:"What does P4 stand for in \"P4 medicine\", as the lecture defines it?", choices:['Personalized, Preventive, Predictive, Participatory','Prophylactic, Preventive, Progressive, Participatory','Personalized, Proactive, Predictive, Periodontal','Preventive, Predictive, Periodontal, Prophylactic'], answer:0, ex:"Applied specifically to periodontal care, the lecture extends this to P5: personalized, preventive, predictive, participatory, periodontal.", src:'lecture' },
{ id:'q3-10', lec:'risk-assessment', type:'mcq', stem:"About what share of patients later diagnosed with periodontitis originally presented saying they just wanted a routine cleaning?", choices:['72%','42%','25%','95%'], answer:0, ex:"About 72% of patients later diagnosed with periodontitis first came in asking only for a cleaning, which is why every new patient needs a full periodontal exam.", src:'lecture' },
{ id:'q3-11', lec:'risk-assessment', type:'mcq', stem:"D1110 (prophylaxis) makes up 95.4% of cleaning codes in patients aged 50 to 64. What makes this figure notable?", choices:['It runs opposite to expectations — periodontitis prevalence rises with age, so prophylaxis share should fall, not climb toward 95%','It exactly matches expected periodontitis prevalence in that age group','It is lower than the share seen in patients 19-34','D1110 is not billed in patients over 50'], answer:0, ex:"D1110 share climbs steadily with age (72.3% at 19-34, 87.5% at 35-49, 95.4% at 50-64) even though periodontitis becomes more common with age — evidence of under-diagnosis or under-escalation, not less disease.", src:'lecture' },
{ id:'q3-12', lec:'risk-assessment', type:'mcq', stem:"Roughly how much larger is the periodontal inflamed surface area (PISA) in a patient with mild-to-moderate periodontitis compared to a periodontally healthy patient?", choices:["Roughly 60-70x larger (about 2,309 mm² vs. about 34 mm²)", "About twice as large (roughly 70 mm² versus 34 mm² in a periodontally healthy patient)", "About 10x larger (roughly 340 mm², about the size of a single deep pocket around one molar)", "Essentially the same area, since pocket epithelium is present in health as well as in disease"], answer:0, ex:"Mild-to-moderate periodontitis gives an inflamed pocket surface of roughly 2,309 mm², against about 34 mm² in health: an open wound around 60–70 times larger.", src:'lecture' },
{ id:'q3-13', lec:'risk-assessment', type:'recall', stem:"What does PISA stand for and what does it estimate?", answer:"Periodontal Inflamed Surface Area — the total area of pocket epithelium facing active inflammation, used to illustrate how large an inflammatory burden periodontitis represents systemically.", src:'lecture' },
{ id:'q3-14', lec:'risk-assessment', type:'mcq', stem:"In the COPD trial discussed in lecture, how did actual subgingival (SRP) therapy compare to supragingival-only scaling?", choices:['SRP produced roughly double the reduction in COPD exacerbation frequency','Both groups improved by the same amount','Only the supragingival group improved','Neither group showed any respiratory benefit'], answer:0, ex:"Treating the subgingival biofilm (SRP) cut COPD exacerbations about twice as much as supragingival scaling alone, which argues that the subgingival burden is what matters systemically.", src:'lecture' },
{ id:'q3-15', lec:'risk-assessment', type:'mcq', stem:"In the 12-month diabetes trial comparing intensive periodontal therapy to supragingival-only control therapy, what happened to HbA1c in each group?", choices:['Intensive therapy: 8.1% to 7.8%; control: 8.1% to 8.3%','Intensive therapy: 8.1% to 8.3%; control: 8.1% to 7.8%','Both groups improved equally','Neither group showed any HbA1c change'], answer:0, ex:"The control group also recorded three deaths as adverse events during the study period.", src:'lecture' },
{ id:'q3-16', lec:'risk-assessment', type:'mcq', stem:"Which whole-patient risk tool scores smoking (cig/day), diabetic status (HbA1c), number of pockets ≥5mm, BOP%, and bone-loss/age ratio, each 0-4, into a single summed score?", choices:['UniFe','PRA (Lang & Tonetti)','PreViser/PAT','Miller & McEntire'], answer:0, ex:"UniFe sums five 0–4 scores (cigarettes/day, HbA1c, pockets ≥5 mm, BOP %, bone loss/age) into one number. PRA is a hexagon diagram, not a summed score.", src:'lecture' },
{ id:'q3-17', lec:'risk-assessment', type:'mcq', stem:"Per the risk-stratified maintenance protocol, how often should a low-risk patient get professional biofilm/calculus removal?", choices:['Every 6 months','Every 3 months','Every 2-4 months','Every 4-6 months'], answer:0, ex:"In the risk-stratified protocol, low-risk patients get biofilm/calculus removal every 6 months. Moderate risk is every 4–6 months and high risk every 2–4 months.", src:'lecture' },
{ id:'q3-18', lec:'risk-assessment', type:'mcq', stem:"Per the risk-stratified maintenance protocol, how often should a high-risk patient get an oral exam/periodontal screening (separate from the comprehensive exam)?", choices:['Every 3 months','Every 6 months','Every 12 months','Screening is not scheduled separately for high-risk patients'], answer:0, ex:"High-risk patients get a separate screening every 3 months on top of the 6–12-month comprehensive exam. Moderate risk is every 6 months, and low risk has no separate screening.", src:'lecture' },
{ id:'q3-19', lec:'risk-assessment', type:'mcq', stem:"Why is a periodontally-treated maintenance patient with every site reading 3mm not automatically a candidate for a plain prophylaxis?", choices:['Their long junctional epithelial attachment is inherently more prone to breaking down under inflammation than a healthy connective-tissue attachment','A 3mm reading is never accurate after periodontal treatment','Insurance will not reimburse a prophylaxis after periodontal treatment','Periodontal patients cannot reach 3mm probing depths'], answer:0, ex:"After treatment the pocket is lined by a long junctional epithelium, not a new connective-tissue attachment. It breaks down more easily under inflammation, so a treated patient stays on periodontal maintenance even when every site reads 3 mm.", src:'lecture' },
{ id:'q3-20', lec:'risk-assessment', type:'mcq', stem:"Roughly how much more likely is a treated-but-non-maintained periodontitis patient to lose teeth compared to a treated-and-well-maintained patient?", choices:['About twice as likely','About equally likely','About five times as likely','Tooth loss risk is unrelated to maintenance compliance'], answer:0, ex:"Treated periodontitis patients who skip maintenance lose about twice as many teeth as those who keep their recall, so the treatment only holds if maintenance continues.", src:'lecture' },
{ id:'q3-21', lec:'risk-assessment', type:'recall', stem:"Why does periodontal maintenance land on roughly a 3-month interval for most patients?", answer:"Pathogenic subgingival species begin re-establishing 4-8 weeks after treatment, and by about 9-11 weeks the subgingival microbiome can repopulate close to pre-treatment levels — a 3-month recall sits inside that recolonization window.", src:'lecture' },
{ id:'q3-22', lec:'risk-assessment', type:'mcq', stem:"Why are patients undergoing active orthodontic tooth movement typically seen for periodontal maintenance every 4-6 weeks rather than every 3 months?", choices:['Inflammation during active tooth movement can uncouple bone formation from resorption, risking real bone loss if biofilm is not controlled tightly','Orthodontic brackets make 3-month scheduling physically impossible','Tooth movement eliminates the need for periodontal maintenance entirely','It matches a fixed insurance billing cycle'], answer:0, ex:"During active tooth movement, inflammation can tip remodeling toward resorption and cause real bone loss, so biofilm is controlled more tightly, every 4–6 weeks.", src:'lecture' },
{ id:'q3-23', lec:'risk-assessment', type:'mcq', stem:"What is the number one reason patients decline a periodontal treatment plan, per the lecture's patient-trust data?", choices:['Lack of trust in their dental provider','Cost of treatment','Fear of pain','Lack of time for appointments'], answer:0, ex:"62% of patients delay treatment, switch providers, seek a second opinion, or refuse care because they disagree with or distrust the diagnosis.", src:'lecture' },
{ id:'q3-24', lec:'risk-assessment', type:'recall', stem:"On average, how much did patients report they would pay per tooth to avoid losing it, and what does that figure argue about cost as a barrier to care?", answer:"About $633.63 per tooth. Patients are often willing to pay meaningfully to save a tooth, so cost is usually not the real barrier to accepting treatment; cost becomes an objection mainly when patients feel rushed, cannot ask questions, sense disagreement within the dental team, or are not offered options for managing the cost.", src:'lecture' },
{ id:'q3-25', lec:'risk-assessment', type:'match', stem:"Match each risk tier to its oral exam / periodontal screening interval.", pairs:[['Low risk','Covered by the 6-12 month comprehensive exam, not scheduled separately'],['Moderate risk','Every 6 months'],['High risk','Every 3 months']], ex:"Risk sets the screening interval: low risk relies on the 6–12-month comprehensive exam, moderate risk adds a screening every 6 months, and high risk every 3 months.", src:'lecture' },

/* ----- Added from the Session 3 in-class case review (prognosis systems + three worked cases) ----- */
{ id:'q3-26', lec:'risk-assessment', type:'mcq', stem:"In the McGuire & Nunn system, what actually decides which prognosis category a tooth lands in?", choices:['How well the tooth can be maintained (kept in the mouth)','How likely the tooth is to show disease progression','How likely the tooth is to become mobile without treatment','How often treatment will need to be redone'], answer:0, ex:"Most of the class picked disease progression in the in-class poll. The driving factor is maintainability: how hard it will be to keep the tooth. That is what separates McGuire & Nunn from Kwok & Caton, which asks about periodontal stability.", src:'lecture' },
{ id:'q3-27', lec:'risk-assessment', type:'sequence', stem:"Put the McGuire & Nunn prognosis categories in order, best to worst.", steps:['Good','Fair','Poor','Questionable','Hopeless'], ex:"Flagged in class as a high-likelihood midterm question. Everyone wants to swap poor and questionable. Questionable sits right before hopeless because the system sorts teeth by whether they can be kept.", src:'lecture' },
{ id:'q3-28', lec:'risk-assessment', type:'mcq', stem:"Why does 'questionable' come after 'poor' (right before hopeless) in McGuire & Nunn?", choices:["The categories sort teeth by whether they can be kept, and a questionable tooth does not stay there: it gets worse (hopeless) or improves (poor)", "Questionable teeth always have more attachment loss and mobility than poor teeth, so the list simply runs from least to most destroyed, with hopeless last", "The categories are simply listed alphabetically on the form and don't imply any order of severity", "Questionable is a category used only for molars, so it is placed last as a separate molar-only group"], answer:0, ex:"Poor teeth can be kept with significant effort. With a questionable tooth we genuinely question whether it will stay.", src:'lecture' },
{ id:'q3-29', lec:'risk-assessment', type:'mcq', stem:"Which statement about the accuracy of McGuire & Nunn prognoses is correct?", choices:['All of these statements are correct','It is right about 80% of the time overall','Once good teeth are excluded, it predicts correctly only about 50% of the time','Teeth usually do better than predicted, and hopeless teeth can be kept much longer than expected'], answer:0, ex:"Every statement in the poll was true: ~80% (81% at 8 years) overall, a coin flip once good teeth are removed, and longitudinally we are harsher on teeth than their actual course.", src:'lecture' },
{ id:'q3-30', lec:'risk-assessment', type:'mcq', stem:"If teeth with a 'good' prognosis are removed from the analysis, how often does a McGuire & Nunn prognosis turn out right?", choices:['About 50% of the time, a coin flip','About 80% of the time','About 95% of the time','About 20% of the time'], answer:0, ex:"Once the easy \"good\" teeth are excluded, McGuire & Nunn predictions are right only about half the time, no better than a coin flip. Prognosis is a guide, not a promise.", src:'lecture' },
{ id:'q3-31', lec:'risk-assessment', type:'mcq', stem:"Longitudinally, what happens to teeth given a hopeless prognosis in patients who stay well maintained?", choices:['They are often kept significantly longer than predicted','They almost always exfoliate within a year','They must be extracted before maintenance can start','They cause the neighboring teeth to fail'], answer:0, ex:"Most teeth leave the mouth because a dentist extracts them, not because they exfoliate. Exceptions are smokers and patients with very poor hygiene who skip maintenance.", src:'lecture' },
{ id:'q3-32', lec:'risk-assessment', type:'mcq', stem:"What is a diagnostic prognosis?", choices:['The expected outcome if the patient receives no treatment','The expected outcome after the recommended treatment','A prognosis assigned only to molars','A prognosis assigned only at maintenance visits'], answer:0, ex:"Diagnostic: you make the diagnosis and the patient walks out untreated. Therapeutic: you recommend treatment and predict how it changes the outcome, which is a useful way to show a patient what treatment buys them.", src:'lecture' },
{ id:'q3-33', lec:'risk-assessment', type:'mcq', stem:"Which prognosis system(s) can be used as a diagnostic prognosis, and which as a therapeutic prognosis?", choices:['Diagnostic: only McGuire & Nunn. Therapeutic: all three','Diagnostic: all three. Therapeutic: only Kwok & Caton','Diagnostic: only Miller & McEntire. Therapeutic: only McGuire & Nunn','Diagnostic: none. Therapeutic: all three'], answer:0, ex:"Kwok & Caton asks about stability with treatment, and Miller & McEntire was built from patients who received 30 years of treatment and maintenance, so both are therapeutic only.", src:'lecture' },
{ id:'q3-34', lec:'risk-assessment', type:'mcq', stem:"Why does 'questionable' sit in the middle of the Kwok & Caton scale instead of right before hopeless?", choices:['Kwok & Caton asks whether periodontal stability can be achieved with treatment: likely, don\'t know, or unlikely','Kwok & Caton asks whether each tooth can be maintained','Kwok & Caton is ordered by probing depth','Questionable is the only diagnostic category in Kwok & Caton'], answer:0, ex:"Instead of memorizing both orders, remember what each system is based on: McGuire & Nunn is about tooth retention, Kwok & Caton is about arresting attachment loss.", src:'lecture' },
{ id:'q3-35', lec:'risk-assessment', type:'mcq', stem:"For which patient would Kwok & Caton be the more useful prognosis system?", choices:['A medically complex patient, where smoking cessation or glycemic control belongs in the treatment plan','A patient who wants to know what happens with no treatment','A single mandibular molar with a furcation','A patient with no systemic risk factors at all'], answer:0, ex:"About 20-30% of patients do not respond as expected, usually because of systemic disease, genetics, or nicotine. Kwok & Caton lets you build those interventions into the prognosis conversation.", src:'lecture' },
{ id:'q3-36', lec:'risk-assessment', type:'mcq', stem:"What sets the Miller & McEntire system apart from the other two?", choices:['It was studied only on molars and is quantitative, scoring factors like smoking and A1c','It is the only system usable as a diagnostic prognosis','It applies only to anterior teeth','It ignores patient-level factors'], answer:0, ex:"Miller & McEntire is the molar-only system and the quantitative one, scoring patient factors such as smoking and A1c.", src:'lecture' },
{ id:'q3-37', lec:'risk-assessment', type:'mcq', stem:"Per the Miller & McEntire data cited in class, how much more likely are smokers to lose molars over time?", choices:['About 296% more likely','About 10% more likely','About 50% more likely','No more likely'], answer:0, ex:"Called the largest single toggle switch on risk for molars.", src:'lecture' },
{ id:'q3-38', lec:'risk-assessment', type:'mcq', stem:"In-class case: 78-year-old, ASA II, generalized Stage 3 Grade B periodontitis, mostly horizontal bone loss with furcation involvement. Which Kwok & Caton prognosis did Dr. Geisinger assign?", choices:['Questionable','Favorable','Unfavorable','Hopeless'], answer:0, ex:"Horizontal bone loss and furcations are hard to regenerate, so if that is the stage-defining lesion, it is unclear whether stability can be achieved.", src:'lecture' },
{ id:'q3-39', lec:'risk-assessment', type:'mcq', stem:"Why did the class recommend returning the 78-year-old Stage 3 patient every 3 months?", choices:["Subgingival repopulation takes about 9-11 weeks, and a periodontitis patient stays higher-risk even once healthy", "Every patient over 75 needs 3-month recalls regardless of their periodontal diagnosis or risk", "The PRA placed the patient in the extraction range, so the 3-month recalls just track the remaining teeth until they are removed", "Insurance covers four visits a year, so the interval is set by the coverage rather than by biology"], answer:0, ex:"Health achieved in a periodontitis patient is health on a reduced periodontium. She needs active maintenance, possibly spaced out later if she stays stable for years.", src:'lecture' },
{ id:'q3-40', lec:'risk-assessment', type:'mcq', stem:"With a bone replacement graft plus a membrane, roughly how much bone fill is expected in a deep, narrow vertical defect?", choices:['About 70-75%','About 10-20%','100%','About 40%'], answer:0, ex:"A little more when a biologic is added. Young patients heal better still.", src:'lecture' },
{ id:'q3-41', lec:'risk-assessment', type:'mcq', stem:"In-class case: 13-year-old with localized vertical defects on first molars (molar-incisor pattern, Grade C). What overall therapeutic McGuire & Nunn prognosis fits once regeneration is planned?", choices:["Good to fair (the involved teeth fair)", "Hopeless, since Grade C disease in a child means the molars cannot be kept", "Poor to questionable across the whole mouth", "Questionable for every tooth until the next re-evaluation"], answer:0, ex:"Only three teeth are involved, the defects are regenerable, and she is young. Her diagnostic prognosis (no treatment) would be poor to questionable, which argues for treating.", src:'lecture' },
{ id:'q3-42', lec:'risk-assessment', type:'mcq', stem:"About 70% of patients with circumpubertal, molar-incisor-pattern periodontitis have which underlying problem?", choices:['A neutrophil chemotactic deficiency','Type 1 diabetes','Vitamin C deficiency','A history of orthodontic treatment'], answer:0, ex:"Neutrophils arrive first (\"the marines of your immune system\"), which is why the first teeth to erupt are hit hardest.", src:'lecture' },
{ id:'q3-43', lec:'risk-assessment', type:'mcq', stem:"When localized molar-incisor periodontitis progresses to a generalized form, about 70% of those patients share which risk factor?", choices:['Nicotine use','Diabetes','Age over 40','Mouth breathing'], answer:0, ex:"About 70% of patients whose molar-incisor pattern becomes generalized use nicotine, making smoking the dominant modifiable factor in that progression.", src:'lecture' },
{ id:'q3-44', lec:'risk-assessment', type:'mcq', stem:"When is the only time a patient can move back down from Stage 3?", choices:["When the stage-defining lesion (a vertical defect or furcation) is successfully regenerated", "When they quit smoking, since smoking status is part of the staging criteria", "After a full year of 3-month maintenance visits with no new attachment loss recorded at any site", "When probing depths fall below 4 mm everywhere after SRP at the re-evaluation"], answer:0, ex:"Stage never goes down just because pockets shrink or habits improve. The only way back down from Stage 3 is to regenerate the lesion that put the patient there: the vertical defect or the furcation.", src:'lecture' },
{ id:'q3-45', lec:'risk-assessment', type:'mcq', stem:"In-class case: 75-year-old former smoker, BOP at ~80% of sites, vertical and horizontal defects. Overall McGuire & Nunn diagnostic prognosis?", choices:['Poor','Good','Hopeless','Fair'], answer:0, ex:"Overall poor, though individual teeth range from good to hopeless. With compliance plus resective/regenerative therapy, the therapeutic prognosis improves to fair.", src:'lecture' },
{ id:'q3-46', lec:'risk-assessment', type:'mcq', stem:"A Grade C patient is newly diagnosed with diabetes (A1c 8.8%). What changes?", choices:["Her grade stays C, but a risk tool like the PRA shows a much larger risk footprint", "Her grade moves up to a new Grade D, which is reserved for poorly controlled diabetic patients", "Her stage drops to 2 because the diabetes, not the periodontitis, now explains the bone loss", "Nothing changes in any assessment, since grade and risk tools ignore systemic conditions entirely"], answer:0, ex:"The point: prognosis and risk tools capture differences that the same stage and grade cannot, which is why prognosis is kept separate from the diagnosis.", src:'lecture' },
{ id:'q3-47', lec:'risk-assessment', type:'mcq', stem:"Roughly what share of people are resistant to periodontitis regardless of their oral hygiene?", choices:['About 10%','About 50%','About 1%','About 35%'], answer:0, ex:"About 10-15% are at risk for severe destructive disease, and about 20-25% do not respond to standard therapy.", src:'lecture' },
{ id:'q3-48', lec:'risk-assessment', type:'mcq', stem:"What does the Periodontal Risk Assessment (PRA) tool look like?", choices:['A spider-web diagram whose footprint grows with risk','A bar chart of probing depths','A standard periodontal chart','A decision flowchart'], answer:0, ex:"Inputs include BOP sites, sites with PD ≥5 mm, missing teeth, % bone loss, smoking, and systemic factors. Its output: maintain current measures, or see the patient more or less often.", src:'lecture' },

/* ===== Lecture 4 — Phase I Therapy (instrumentation) ===== */
{ id:'q4-01', lec:'phase1-therapy', type:'mcq', stem:"Which instrument is used specifically to examine furcations?", choices:['Nabers probe','ODU 11/12 explorer','Gracey 11/12','Columbia 13/14'], answer:0, ex:"The Nabers probe is curved to follow the root into a furcation entrance. A straight periodontal probe can't reach around into it.", src:'exam-review' },
{ id:'q4-02', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which instrument evaluates root-surface roughness on all surfaces of all teeth?", choices:['ODU 11/12 explorer','Periodontal probe','Nabers probe','Sickle scaler'], answer:0, ex:"The ODU 11/12 explorer checks root-surface roughness on every surface of every tooth. The probe measures depth, and the Nabers probe is for furcations.", src:'exam-review' },
{ id:'q4-03', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which Gracey curette is used subgingivally on the distal surfaces of posterior teeth?", choices:['Gracey 13/14','Gracey 11/12','Gracey 3/4','Gracey 15/16'], answer:0, ex:"Gracey 13/14 is for the distal surfaces of posterior teeth. Its sister, the 11/12 (or 15/16), covers the mesials.", src:'exam-review' },
{ id:'q4-04', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which Gracey curette covers all surfaces of the anterior teeth, subgingivally?", choices:['Gracey 3/4','Gracey 11/12','Gracey 13/14','Columbia 13/14'], answer:0, ex:"Gracey 3/4 is the anterior curette and covers every surface of the anterior teeth.", src:'exam-review' },
{ id:'q4-05', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which curette is a universal instrument rather than an area-specific one?", choices:['Columbia 13/14','Gracey 11/12','Gracey 15/16','Gracey 3/4'], answer:0, ex:"The Columbia 13/14 is universal: it has two cutting edges and works on any surface. Every Gracey is area-specific.", src:'exam-review' },
{ id:'q4-06', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which scaler is used supragingivally, specifically on posterior interproximal surfaces?", choices:['S204SD9','Sickle scaler','Gracey 13/14','Nabers probe'], answer:0, ex:"The S204SD9 is the supragingival scaler for posterior interproximal surfaces. The sickle covers anteriors and molar buccal/lingual surfaces.", src:'exam-review' },
{ id:'q4-07', lec:'phase1-therapy', mid:false, type:'mcq', stem:"The sickle scaler is used supragingivally on which surfaces?", choices:['Anterior teeth and the buccal/lingual of molars','All subgingival surfaces','Only posterior interproximal surfaces','Only furcations'], answer:0, ex:"The sickle scaler works supragingivally on the anterior teeth and on the buccal and lingual surfaces of molars. Its pointed tip is not meant for deep subgingival work.", src:'exam-review' },
{ id:'q4-08', lec:'phase1-therapy', mid:false, type:'match', stem:"Match each instrument to its area of use.", pairs:[['Gracey 11/12','Mesial of posterior teeth + buccal/lingual of molars'],['Gracey 13/14','Distal of posterior teeth'],['Gracey 3/4','All surfaces of anterior teeth'],['Columbia 13/14','Universal, subgingival']], ex:"Graceys are paired by area: 11/12 for posterior mesials plus molar buccal/lingual, 13/14 for posterior distals, and 3/4 for anteriors. The Columbia 13/14 is universal.", src:'exam-review' },
{ id:'q4-09', lec:'phase1-therapy', mid:false, type:'recall', stem:"What is the key difference between how Gracey curettes and the Columbia curette are used?", answer:"Gracey curettes are area-specific — each one is designed for one particular surface or area — while the Columbia curette is a universal instrument usable subgingivally on any surface.", src:'exam-review' },

/* ----- Added from the Session 4 slide deck (Phase I therapy, Phase I evaluation & instrumentation) ----- */
{ id:'q4-10', lec:'phase1-therapy', type:'mcq', stem:"A site probes 2 mm with 5 mm of gingival recession. What is the clinical attachment level?", choices:['7 mm','3 mm','2 mm','5 mm'], answer:0, ex:"CAL = probing depth + recession = 2 + 5 = 7 mm. This slide example is paired with a 7 mm pocket and no recession, which also gives CAL 7 mm: same attachment loss, very different pockets.", src:'slides' },
{ id:'q4-11', lec:'phase1-therapy', type:'mcq', stem:"Probing depth is 7 mm and recession is 0. What is the CAL?", choices:['7 mm','0 mm','14 mm','It cannot be determined without a radiograph'], answer:0, ex:"CAL = probing depth + recession. With no recession, CAL equals the probing depth: 7 mm.", src:'slides' },
{ id:'q4-12', lec:'phase1-therapy', type:'mcq', stem:"Gingival recession is measured from where to where?", choices:['CEJ to the gingival margin','Gingival margin to the base of the pocket','CEJ to the base of the pocket','Alveolar crest to the CEJ'], answer:0, ex:"PD: gingival margin to pocket base. CAL: CEJ to pocket base (PD + recession).", src:'slides' },
{ id:'q4-13', lec:'phase1-therapy', type:'mcq', stem:"How many probing readings are recorded per tooth?", choices:["Six (DB, B, MB, DL, L, ML), recording the deepest reading at each", "Four (M, D, B, L), recording the average of the readings at each of the four surfaces", "Three, all on the buccal side, since lingual sites are recorded only when there is bleeding", "One, the deepest site found anywhere around the tooth, recorded as that tooth's single probing depth"], answer:0, ex:"Six sites are probed per tooth (DB, B, MB, DL, L, ML), and the deepest reading at each is recorded.", src:'slides' },
{ id:'q4-14', lec:'phase1-therapy', type:'mcq', stem:"How should the probe be angled when probing interproximally?", choices:['Slightly tilted toward the area apical to the contact point','Perfectly vertical at the line angle','Horizontally through the contact','Angled away from the contact at 45°'], answer:0, ex:"The common mistakes are too little angulation and too much. Elsewhere: light pressure, elastic feel, probe parallel to the long axis.", src:'slides' },
{ id:'q4-15', lec:'phase1-therapy', type:'mcq', stem:"A tooth moves more than 1 mm but less than 2 mm, with no vertical displacement. What is its Miller mobility class?", choices:['Class 2','Class 1','Class 3','Class 0'], answer:0, ex:"Miller Class 1 is under 1 mm, Class 2 is more than 1 mm but under 2 mm, and Class 3 adds vertical displacement. This tooth moves 1–2 mm with no vertical movement, so it is Class 2.", src:'slides' },
{ id:'q4-16', lec:'phase1-therapy', type:'mcq', stem:"What defines Miller Class 3 mobility?", choices:["Severe faciolingual and/or mesiodistal movement combined with vertical displacement", "Any horizontal movement under 1 mm, felt between two instrument handles", "Movement only in the mesiodistal direction, with no faciolingual movement at all", "Movement that is visible only on a radiograph, as a widened PDL space with no clinical mobility"], answer:0, ex:"Class 3 is the only Miller class with vertical displacement (the tooth can be depressed in its socket), on top of severe horizontal movement.", src:'slides' },
{ id:'q4-17', lec:'phase1-therapy', type:'mcq', stem:"How is tooth mobility assessed?", choices:['With two rigid instruments, one on each side of the tooth','With a fingertip and the probe tip','With the probe inserted in the sulcus','From a radiograph alone'], answer:0, ex:"Mobility is checked between two rigid instrument handles, one on each side. A fingertip is soft enough to mask the movement.", src:'slides' },
{ id:'q4-18', lec:'phase1-therapy', type:'mcq', stem:"What is full-mouth debridement (D4355) for?", choices:["Gross removal of plaque and calculus so a comprehensive evaluation and diagnosis can be done at a later visit", "Definitive periodontal treatment completed in one visit, replacing scaling and root planing for patients with heavy calculus", "Maintenance for a previously treated periodontitis patient who has missed their recall visits", "Polishing and stain removal after SRP, billed once the root planing visits are complete"], answer:0, ex:"Full-mouth debridement (D4355) is not treatment. It removes enough calculus that the margins can be seen and charted, so the real exam and diagnosis happen at a later visit.", src:'slides' },
{ id:'q4-19', lec:'phase1-therapy', type:'mcq', stem:"When is scaling in the presence of gingival inflammation (D4346) indicated?", choices:["Swollen, inflamed gingiva, generalized suprabony pockets and moderate-to-severe BOP, with no periodontitis", "Active periodontitis with attachment loss, radiographic bone loss and bleeding pockets around several teeth", "A healthy patient due for a routine 6-month cleaning with little or no calculus present", "Implant maintenance only, for cleaning around implant abutments rather than natural teeth"], answer:0, ex:"It should not be reported together with prophylaxis, SRP, or debridement.", src:'slides' },
{ id:'q4-20', lec:'phase1-therapy', type:'mcq', stem:"The Phase I case in the deck (a non-periodontitis patient with a reduced periodontium and inflamed gingiva) was diagnosed and treated how?", choices:["Gingivitis on a reduced periodontium; scaling in the presence of gingival inflammation (D4346)", "Stage 3 Grade B periodontitis on a reduced periodontium, treated with full-mouth scaling and root planing", "Clinical health on a reduced periodontium, treated with a routine prophylaxis", "Necrotizing gingivitis, treated with antibiotics and chlorhexidine rinses"], answer:0, ex:"The patient had never had periodontitis. The bone loss was a reduced periodontium, not active disease, and the gingiva was inflamed, so the diagnosis is gingivitis on a reduced periodontium and the code is D4346.", src:'slides' },
{ id:'q4-21', lec:'phase1-therapy', type:'mcq', stem:"Which definition matches root planing?", choices:["Definitive removal of cementum or surface dentin that is rough, impregnated with calculus, or contaminated with toxins or microorganisms", "Removal of supragingival stain and plaque from enamel surfaces, finished with a rubber cup and paste", "Polishing the enamel and exposed root with pumice so plaque has less to hold on to afterwards", "Surgical removal of the inflamed soft-tissue pocket lining (curettage), so that a new connective-tissue attachment can form against the root"], answer:0, ex:"Scaling removes plaque, calculus and stain from supra- and subgingival surfaces (AAP Glossary, 2001).", src:'slides' },
{ id:'q4-22', lec:'phase1-therapy', type:'mcq', stem:"Which microbial shift is one goal of Phase I therapy?", choices:['From primarily gram-negative flora toward more gram-positive flora','From gram-positive toward gram-negative flora','Complete sterilization of the pocket','From aerobes toward strict anaerobes'], answer:0, ex:"Phase I aims to shift the subgingival flora away from gram-negative anaerobes and toward the gram-positive flora of health. Sterilizing the pocket is neither possible nor the goal.", src:'slides' },
{ id:'q4-23', lec:'phase1-therapy', type:'mcq', stem:"How does instrumentation in one session compare with multiple sessions?", choices:['No considerable advantage to multiple sessions','Multiple sessions double the attachment gain','Single-session therapy is contraindicated','Multiple sessions remove all residual calculus'], answer:0, ex:"Calculus left behind after multiple sessions stays for the same reasons it stays after one (Anderson et al. 1996).", src:'slides' },
{ id:'q4-24', lec:'phase1-therapy', type:'mcq', stem:"How does manual instrumentation compare with mechanically driven (ultrasonic) instrumentation?", choices:['No statistical difference in PD reduction or CAL gain','Ultrasonics give significantly more CAL gain','Hand instruments give significantly more PD reduction','Only ultrasonics remove subgingival calculus'], answer:0, ex:"Studies show no statistical difference between hand and ultrasonic instrumentation in PD reduction or CAL gain. Choose by access, efficiency and comfort.", src:'slides' },
{ id:'q4-25', lec:'phase1-therapy', type:'mcq', stem:"What did adding subgingival irrigation (chlorhexidine, saline or peroxide) to mechanical instrumentation do?", choices:['No additional improvement','Doubled the PD reduction','Became necessary to suppress A.a.','Replaced the need for root planing'], answer:0, ex:"Adding subgingival irrigation (chlorhexidine, saline or peroxide) to mechanical instrumentation gave no additional benefit. The instrumentation does the work.", src:'slides' },
{ id:'q4-26', lec:'phase1-therapy', type:'mcq', stem:"In pockets 5 mm or deeper, about how often is root debridement inadequate?", choices:['About 65% of the time','About 5% of the time','About 25% of the time','Never, if a specialist does it'], answer:0, ex:"Other limits on non-surgical therapy: not 100% effective against A. actinomycetemcomitans, overhanging restorations, furcations, root anatomy, hypersensitivity, operator skill, patient compliance (Greenstein 2000).", src:'slides' },
{ id:'q4-27', lec:'phase1-therapy', type:'mcq', stem:"When is the Phase I re-evaluation done?", choices:['4-6 weeks after therapy','1 week after therapy','6 months after therapy','12 months after therapy'], answer:0, ex:"Re-evaluate at 4–6 weeks: the connective tissue has reattached and the maximum PD reduction has happened by then.", src:'slides' },
{ id:'q4-28', lec:'phase1-therapy', type:'mcq', stem:"After SRP, where does most of the probing-depth reduction come from?", choices:["Resolution of inflammation and edema, with the recession that follows", "New bone formation at the base of the defect", "New connective-tissue attachment forming on the freshly planed cementum", "Tooth extrusion as the inflamed tissue shrinks back"], answer:0, ex:"The biggest PD changes happen in the first 4 weeks.", src:'slides' },
{ id:'q4-29', lec:'phase1-therapy', type:'mcq', stem:"After SRP, how long until the dentogingival junction is re-established?", choices:['2-4 weeks','24 hours','9-12 months','6 months'], answer:0, ex:"Gradual repair and maturation can continue for 9-12 months (deck). In class Dr. Kaur split it up: junctional epithelium 7-10 days, connective tissue reattachment 4-6 weeks, collagen maturation 3-6 months.", src:'slides' },
{ id:'q4-30', lec:'phase1-therapy', type:'mcq', stem:"Phase I therapy has failed at re-evaluation. Which of these is NOT one of the recommended next steps?", choices:['Move the patient to routine 6-month prophylaxis','Antibiotics or antimicrobials','Repeat non-surgical therapy','Periodontal surgery (Phase II)'], answer:0, ex:"First assess tissue response, remaining deposits, health history/risk factors, and possibly a plaque culture. Options are antimicrobials, host modulation, repeat non-surgical therapy, re-evaluation, or Phase II surgery.", src:'slides' },
{ id:'q4-31', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which feature belongs to a sickle scaler and not to a curette?", choices:['Pointed tip with a triangular cross-section','Rounded toe','Half-circle cross-section','Safe for deep subgingival use'], answer:0, ex:"A sickle scaler has a pointed tip, a triangular cross-section and two cutting edges, and belongs supragingivally. A rounded toe and a half-circle cross-section are curette features.", src:'slides' },
{ id:'q4-32', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which describes a Gracey curette?", choices:["70° blade angle, one cutting edge, rounded back, lower shank parallel to the long axis of the tooth", "Two cutting edges and a pointed tip, used supragingivally and subgingivally", "Triangular cross-section, one cutting edge, pointed tip, used supragingivally only on anterior teeth", "90° blade angle, two cutting edges, straight shank, used with a push stroke on any tooth surface"], answer:0, ex:"Gracey curettes have the blade offset at 70°, one cutting edge (the lower one), a rounded back, and a lower shank held parallel to the tooth's long axis.", src:'slides' },
{ id:'q4-33', lec:'phase1-therapy', mid:false, type:'mcq', stem:"How is a Gracey curette inserted and then activated?", choices:["Closed angle to insert into the sulcus or pocket, then a 70-80° working angle against the root", "Inserted at 90° to the root and kept at that angle for the whole working stroke", "Inserted open at 80° so the blade clears the tissue, then closed down to 0° against the root to do the work", "Inserted at 45° and worked with a push stroke toward the base of the pocket"], answer:0, ex:"Insert with the face closed against the root (near 0°) so the blade slips under the tissue safely, then open to a 70–80° working angle to engage and remove deposits.", src:'slides' },
{ id:'q4-34', lec:'phase1-therapy', mid:false, type:'mcq', stem:"How far below the gingival margin can a sickle scaler remove calculus?", choices:['1-2 mm','5-6 mm','To the base of any pocket','Not at all'], answer:0, ex:"This is the deck's number. In class Dr. Kaur said about 2-3 mm, adding that sources give 1-3 or 1-2. Sickles work mainly supragingivally with a short, powerful pull stroke, using the lower third of the blade. Use on exposed cementum is restricted.", src:'slides' },
{ id:'q4-35', lec:'phase1-therapy', mid:false, type:'mcq', stem:"What is the working angle of the H6/7 anterior sickle and the S204SD9 posterior sickle against the tooth?", choices:['About 80°','About 45°','About 110°','0°'], answer:0, ex:"H6/7 has a straight shank for anteriors and the buccal/lingual of molars. S204SD9 has a right-angled shank for posterior interproximals. Both use a pull stroke.", src:'slides' },
{ id:'q4-36', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which Gracey has more bends in its shank than the 11/12 and uses a pull stroke apico-coronally or postero-anteriorly?", choices:['Gracey 13/14','Gracey 3/4','Gracey 15/16','Columbia 13/14'], answer:0, ex:"The Gracey 13/14 has the most bends in its shank so it can reach around to distal surfaces, and it is used with a pull stroke.", src:'slides' },
{ id:'q4-37', lec:'phase1-therapy', mid:false, type:'mcq', stem:"How does a root-planing stroke differ from a scaling stroke?", choices:['Longer, shaving stroke with lighter pressure','Shorter, more powerful stroke','They are identical','It is a push stroke'], answer:0, ex:"Scaling strokes are controlled, short, overlapping and powerful.", src:'slides' },
{ id:'q4-38', lec:'phase1-therapy', mid:false, type:'mcq', stem:"What characterizes an exploratory stroke?", choices:["Light force with the instrument adapted, to map pocket depth, topography and calculus", "Tight grasp and firm lateral pressure against the tooth to break calculus loose", "A rubber cup held at 90° with light, intermittent pressure on the enamel surface", "A pull stroke with the toe of the sickle to lift supragingival calculus off the tooth"], answer:0, ex:"An exploratory stroke uses a light grasp and light pressure with the instrument adapted, to feel the pocket depth, root topography and calculus before any working stroke.", src:'slides' },
{ id:'q4-39', lec:'phase1-therapy', mid:false, type:'match', stem:"Match each intraoral finger rest to where it sits.", pairs:[['Conventional','Tooth surfaces right next to the working area'],['Cross-arch','The other side of the same arch'],['Opposite-arch','The opposite arch'],['Finger-on-finger','Index finger or thumb of the non-working hand']], ex:"Conventional rests sit right beside the working area; cross-arch on the other side of the same arch; opposite-arch on the other jaw; finger-on-finger on the non-working hand.", src:'slides' },
{ id:'q4-40', lec:'phase1-therapy', mid:false, type:'match', stem:"Match each ultrasonic type to how its tip works.", pairs:[['Magnetostrictive','Nickel-iron metal stacks; elliptical/orbital motion, so every tip surface works'],['Piezoelectric','Crystals in the handpiece; linear motion, mainly the lateral surfaces work']], ex:"Magnetostrictive units vibrate metal stacks in an elliptical path, so every surface of the tip works. Piezoelectric crystals move the tip in a line, so mainly its lateral surfaces work.", src:'slides' },
{ id:'q4-41', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which areas are most commonly missed during scaling and root planing?", choices:["The CEJ, furcation entrances, line angles, and distal surfaces of posterior teeth", "Facial surfaces of the anterior teeth, where the gingiva is thinnest and the roots most visible", "Occlusal surfaces of the molars, where calculus forms fastest", "Palatal surfaces of the maxillary incisors, and nowhere else in the mouth"], answer:0, ex:"The CEJ, furcation entrances, line angles and distal surfaces of posterior teeth are the spots most often missed: hard to see, hard to reach and easy to under-instrument.", src:'slides' },
{ id:'q4-42', lec:'phase1-therapy', mid:false, type:'mcq', stem:"How are implant probes calibrated?", choices:['In 3-mm sections (3-6-9-12 or 3-6-8-11)','In 1-mm marks to 15 mm','In colored 5-mm bands','They are not; implants are never probed'], answer:0, ex:"Implant instruments in the deck: anterior and posterior sickle scalers and the Columbia 4R/4L curette.", src:'slides' },
{ id:'q4-43', lec:'phase1-therapy', mid:false, type:'mcq', stem:"What is a UNC-15?", choices:["A periodontal probe calibrated to 15 mm", "A furcation probe, curved and unmarked", "An explorer for checking root roughness", "An implant probe with plastic markings"], answer:0, ex:"A UNC-15 is a periodontal probe marked at every millimeter out to 15 mm.", src:'slides' },
{ id:'q4-44', lec:'phase1-therapy', mid:false, type:'mcq', stem:"How much enamel can 30 seconds of polishing with pumice paste remove?", choices:['Up to 4 µm','Up to 40 µm','Up to 0.4 mm','None'], answer:0, ex:"That outermost layer holds the highest fluoride concentration, which is part of the case against routine polishing.", src:'slides' },
{ id:'q4-45', lec:'phase1-therapy', mid:false, type:'mcq', stem:"What can a rubber cup with pumice do to the gingiva in 2 minutes?", choices:['Completely remove the sulcular epithelium','Regenerate attachment','Remove 1 mm of enamel','Permanently seal dentinal tubules'], answer:0, ex:"Two minutes of rubber cup and pumice can strip the sulcular epithelium completely, one reason polishing is kept selective and light.", src:'slides' },
{ id:'q4-46', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which polishing technique does the deck recommend?", choices:["Low-abrasion paste, slow-speed handpiece, minimal heat, cup at 90° with intermittent light pressure", "Coarse paste at high speed with steady, heavy pressure so stain comes off in one pass", "Pumice for a full 2 minutes per tooth, with the cup held flat and pressed firmly against the surface", "Subgingival polishing down to the base of the pocket with a pointed rubber cup"], answer:0, ex:"Polish with a low-abrasion paste on a slow-speed handpiece, keep heat down, and hold the cup at 90° with light, intermittent pressure to limit enamel and tissue loss.", src:'slides' },
{ id:'q4-47', lec:'phase1-therapy', mid:false, type:'mcq', stem:"Which is a valid reason FOR polishing?", choices:["Removing extrinsic stain before sealants or fluoride, and patient satisfaction", "Removing subgingival calculus that the curette left behind on the root", "Reducing probing depth by smoothing the soft-tissue side of the pocket wall", "Removing endotoxin that is bound to the cementum of the root surface"], answer:0, ex:"Polishing removes extrinsic stain, preps teeth for sealants or fluoride, and patients like it. It does nothing for subgingival calculus, pocket depth or endotoxin.", src:'slides' },
{ id:'q4-48', lec:'phase1-therapy', type:'mcq', stem:"The mucogingival part of the exam records which two things?", choices:["The amount of keratinized gingiva and the location of the mucogingival junction", "Probing depth and bleeding on probing at each of the six sites around every tooth", "Mobility and fremitus, tested with two instrument handles and a finger on the teeth", "Furcation class and root-trunk length on every multi-rooted tooth in the mouth"], answer:0, ex:"The mucogingival exam records the width of keratinized gingiva and where the mucogingival junction sits.", src:'slides' },
{ id:'q4-49', lec:'phase1-therapy', type:'sequence', stem:"Put the steps for disclosing plaque in order.", steps:['Chew the disclosing tablet','Rinse briefly with water','Remove excess solution from the cheeks and tongue','Show the patient with a mirror'], ex:"Disclose, rinse lightly so only the plaque stays stained, clear the excess dye from cheeks and tongue, then hand the patient a mirror to show them.", src:'slides' },
{ id:'q4-50', lec:'phase1-therapy', type:'recall', stem:"List the occlusal findings the deck links to periodontal disease.", answer:"Parafunctional habits, tooth mobility, fremitus, tooth migration, open contacts, atypical tooth wear and wear facets, possible TMJ pain, infrabony defects, and a widened PDL space.", src:'slides' },
{ id:'q4-51', lec:'phase1-therapy', type:'mcq', stem:"Which instrument does the deck call the most important one in the periodontal exam?", choices:['The periodontal probe','The ODU 11/12 explorer','The mouth mirror','The Nabers probe'], answer:0, ex:"The probe measures PD and CAL, outlines pocket form, and contributes to plaque, gingival and calculus assessment.", src:'slides' },
{ id:'q4-52', lec:'phase1-therapy', mid:false, type:'mcq', stem:"During Phase I, how do you check whether you scaled and root planed well?", choices:["Explore the root surface during the session, then judge tissue response (less erythema, edema and BOP) at re-evaluation", "Take a radiograph the same day and compare the calculus visible interproximally with the pre-op film to confirm that it is gone", "Measure new bone fill at one week, since good root planing produces radiographic bone gain by then", "Ask whether the patient reports sensitivity afterwards, since smooth, clean roots are always sensitive"], answer:0, ex:"The patient's oral hygiene plays a fundamental role in how the re-evaluation looks.", src:'slides' },

/* Session 4 — from the class recording */
{ id:'q4-L01', lec:'phase1-therapy', type:'mcq', stem:"Which diagnosis is impossible by definition?", choices:['Periodontitis on an intact periodontium','Gingivitis on a reduced periodontium','Health on a reduced periodontium','Gingivitis on an intact periodontium'], answer:0, ex:"Bone loss is what separates periodontitis from health and gingivitis, so periodontitis always sits on a reduced periodontium. Health and gingivitis can each be on an intact or a reduced periodontium.", src:'lecture' },
{ id:'q4-L02', lec:'phase1-therapy', type:'mcq', stem:"You run the probe about 1 mm into each sulcus and score 1 where plaque comes out and 0 where it doesn't. What does this record?", choices:['Presence or absence of plaque only','The amount of plaque at each site','Plaque thickness in the gingival third','The probing depth'], answer:0, ex:"Neither this method nor disclosing tablets quantifies plaque. Quantifying (gingival third, half the tooth, whole tooth) at every site would take too much chair time.", src:'lecture' },
{ id:'q4-L03', lec:'phase1-therapy', type:'mcq', stem:"You finish probing the upper right and move to the upper left. Looking back, a few upper-right sites that didn't bleed at first are now bleeding. How are they scored?", choices:['As bleeding (1)','As not bleeding (0), because bleeding must be immediate','Re-probe them at the next visit','Record them as suppuration'], answer:0, ex:"Delayed bleeding still counts as BOP.", src:'lecture' },
{ id:'q4-L04', lec:'phase1-therapy', type:'mcq', stem:"A heavy smoker has periodontitis. Compared with a non-smoker, how will the gingiva tend to look?", choices:["Less inflamed, more cyanotic, because nicotine vasoconstriction masks inflammation", "More edematous and hemorrhagic, because nicotine increases blood flow to the gingival tissues", "Bulbous interdental overgrowth, similar to the enlargement seen with calcium channel blockers", "Exactly the same, since smoking changes bone levels but has no visible effect on the gingiva"], answer:0, ex:"Smoking masks inflammation. Diabetes does the opposite and exaggerates it.", src:'lecture' },
{ id:'q4-L05', lec:'phase1-therapy', type:'mcq', stem:"A hypertensive patient has bulbous gingival enlargement, mostly interdental and more on the buccal/labial than the lingual/palatal. Which medication fits?", choices:['Amlodipine','Metformin','Atorvastatin','Lisinopril'], answer:0, ex:"Amlodipine is a calcium channel blocker, a classic cause of drug-induced gingival overgrowth.", src:'lecture' },
{ id:'q4-L06', lec:'phase1-therapy', type:'mcq', stem:"A site probes 5 mm and the gingival margin sits 3 mm coronal to the CEJ (recession −3 mm). What is the CAL?", choices:['2 mm','5 mm','8 mm','3 mm'], answer:0, ex:"CAL = PD + GR = 5 + (−3) = 2 mm. Skipping the recession would record CAL 5 mm and push the case toward Stage 3 or 4.", src:'lecture' },
{ id:'q4-L07', lec:'phase1-therapy', type:'mcq', stem:"In periodontal health on an intact periodontium, how do probing depth and CAL compare?", choices:["They are not equal, because the gingival margin sits coronal to the CEJ", "They are always equal, since in health the CEJ and the gingival margin sit at the same level", "CAL is always larger than PD, because some attachment is lost normally with age", "CAL can't be measured in health, because the CEJ is covered and can't be found"], answer:0, ex:"The margin hides the CEJ, so recession is negative and PD ≠ CAL.", src:'lecture' },
{ id:'q4-L08', lec:'phase1-therapy', type:'mcq', stem:"In Salud, what happens if you leave the recession field blank at a site with negative recession?", choices:['Salud sets CAL equal to PD, over-diagnosing disease','Salud estimates the recession from the radiograph','Salud flags the site and won\'t save','CAL is recorded as zero'], answer:0, ex:"Typing 0 without checking has the same effect. Enter the signed value (+ or −) and Salud calculates CAL correctly.", src:'lecture' },
{ id:'q4-L09', lec:'phase1-therapy', type:'mcq', stem:"How do you measure negative recession when you can't see the CEJ?", choices:["Probe to the pocket base, withdraw slowly until you feel the CEJ, and read how much probe is still under the margin", "Read the bone crest off a bitewing, then subtract the probing depth from that bone-level measurement", "Sweep a Nabers probe horizontally along the margin and record the first point where it catches", "Record recession as zero, because a CEJ you cannot see clinically means the gingival margin still sits coronal to it on that tooth"], answer:0, ex:"That reading is the negative GR, which you subtract from PD to get CAL.", src:'lecture' },
{ id:'q4-L10', lec:'phase1-therapy', type:'mcq', stem:"Which of these makes it harder to feel the CEJ for a negative recession reading, but is physiologic rather than pathologic?", choices:['Altered passive eruption','Drug-induced gingival overgrowth','Gingival inflammation','Subgingival calculus'], answer:0, ex:"Inflammation and overgrowth are pathologic. Calculus and restorative margins can also feel like a CEJ.", src:'lecture' },
{ id:'q4-L11', lec:'phase1-therapy', type:'mcq', stem:"What is passive eruption?", choices:["Apical migration of the gingiva (with its connective tissue and junctional epithelium) to settle at the CEJ", "The tooth moving occlusally to meet the opposing arch as the alveolar bone grows with it", "Extrusion of a tooth that has lost its antagonist, carrying the gingiva, the junctional epithelium and the alveolar bone along with it", "Recession caused by toothbrush trauma once the tooth has fully erupted into occlusion"], answer:0, ex:"Active eruption is the tooth moving toward occlusion. In altered passive eruption the tissue never migrates apically, so the margin stays well coronal to the CEJ.", src:'lecture' },
{ id:'q4-L12', lec:'phase1-therapy', type:'mcq', stem:"What is the only indication for full-mouth debridement?", choices:['Calculus so heavy you can\'t see or explore the gingival margin, so no numbers can be captured','Treating moderate periodontitis in one visit','Preparing a maintenance patient for polishing','Any patient with subgingival calculus'], answer:0, ex:"Debridement is not therapeutic and should never be combined with scaling and root planing.", src:'lecture' },
{ id:'q4-L13', lec:'phase1-therapy', type:'mcq', stem:"Which statement about the debridement code is correct?", choices:['Only a full-mouth code exists','There are separate quadrant codes','Half-mouth debridement can be billed with SRP','It is billed together with the periodontal exam'], answer:0, ex:"Insurance won't pay for debridement and a periodontal exam at the same visit; the patient returns in about two weeks. At school the first perio charting is free, so the two can be combined if the tissue allows and faculty agree.", src:'lecture' },
{ id:'q4-L14', lec:'phase1-therapy', type:'match', stem:"Match each Glickman furcation class to its description.", pairs:[['Class I','Incipient: the probe just feels a catch'],['Class II','Cul-de-sac: bone remains on the other side'],['Class III','Through-and-through'],['Class IV','Through-and-through and clinically visible (soft tissue lost)']], ex:"Glickman grades by how far the probe goes: Class I is only a catch, Class II goes in but meets bone (cul-de-sac), Class III goes through, and Class IV goes through with the opening visible because the soft tissue has receded.", src:'lecture' },
{ id:'q4-L15', lec:'phase1-therapy', type:'mcq', stem:"Which furcation class is most amenable to regeneration?", choices:['Class II','Class I','Class III','Class IV'], answer:0, ex:"It has depth and containability, because a bony wall remains on the other side. Class I usually needs no treatment; Class III has no containability.", src:'lecture' },
{ id:'q4-L16', lec:'phase1-therapy', type:'mcq', stem:"Why must a Class IV furcation be watched closely at every maintenance visit?", choices:["Exposed root surfaces risk root caries, and caries in the furcation makes the tooth hopeless", "It always converts back to Class II once the tissue heals, so the class must be updated each visit", "It is the furcation class most amenable to regeneration, so it is monitored for the right time to graft", "It can't be cleaned with any aid, so it needs professional debridement at every single visit"], answer:0, ex:"Patients can clean it with interdental aids or a water flosser, but sensitivity and root caries are the risks.", src:'lecture' },
{ id:'q4-L17', lec:'phase1-therapy', type:'mcq', stem:"The Nabers probe has alternating light and dark bands. Which classification do we use for furcations here?", choices:['Glickman (qualitative), not millimeter readings','Millimeter depth from the Nabers markings','Miller','Hamp, by horizontal millimeters only'], answer:0, ex:"The bands are 3 mm apart, but Class I means a catch, not '3 mm or less'.", src:'lecture' },
{ id:'q4-L18', lec:'phase1-therapy', type:'mcq', stem:"How is the rolling technique used in the mucogingival exam?", choices:["Roll the mucosa coronally until it stops at the mucogingival junction to find the width of keratinized tissue", "Roll the probe around the tooth at the margin to find furcation entrances and their class", "Roll a cotton-tipped applicator over the gingiva to spread disclosing solution evenly", "Roll the tooth between two instrument handles to test its mobility, then grade the movement using the Miller classification"], answer:0, ex:"Keratinized tissue width matters around implants as well as teeth.", src:'lecture' },
{ id:'q4-L19', lec:'phase1-therapy', type:'mcq', stem:"What is fremitus?", choices:['Mobility in function, palpated with a finger on the root while the patient occludes','Static mobility tested with two instruments','Radiographic widening of the PDL','A tooth that is depressible in its socket'], answer:0, ex:"It can be vertical and/or horizontal and is palpated, not seen, unless extreme. A depressible tooth is ready for extraction.", src:'lecture' },
{ id:'q4-L20', lec:'phase1-therapy', type:'mcq', stem:"Maxillary premolars are fremitus-positive in a patient missing posterior teeth. What is the most likely reason?", choices:["Lack of posterior support, so the premolars are doing the work of molars", "Drug-induced gingival overgrowth, pushing the premolars out of their normal occlusal contacts", "Altered passive eruption, leaving short clinical crowns that take up the excess occlusal load", "Root caries on the premolars, weakening the roots so that normal chewing forces cause fremitus"], answer:0, ex:"Occlusal trauma on a reduced periodontium can also come from parafunction or overjet/overbite.", src:'lecture' },
{ id:'q4-L21', lec:'phase1-therapy', type:'mcq', stem:"Where do you record occlusal findings such as wear patterns, erosion and parafunction?", choices:["In the notes section, since the perio chart has no field for them", "In the mobility row, next to the Miller class for each tooth", "In the furcation column, beside the Glickman class for molars", "They aren't recorded anywhere in the perio exam, only in the restorative chart"], answer:0, ex:"Treating a 5 mm pocket won't resolve grade 2 mobility unless the underlying occlusal problem is addressed.", src:'lecture' },
{ id:'q4-L22', lec:'phase1-therapy', type:'mcq', stem:"Before starting SRP, what does Dr. Kaur recommend having open in front of you?", choices:['The radiographs, rather than the probing chart','The probing chart, to target the deepest pockets','The medical history only','Nothing; work from feel alone'], answer:0, ex:"The instrument will find the pocket and its base is your limit. The x-rays tell you where the calculus, PA lesions and root anatomy are.", src:'lecture' },
{ id:'q4-L23', lec:'phase1-therapy', type:'mcq', stem:"Roughly what share of periodontal destruction is caused by the host response rather than the bacteria?", choices:['About 75%','About 25%','About 50%','Nearly 100%'], answer:0, ex:"Bacteria (bringing endotoxin/LPS) account for about 25%. The host's inflammatory mediators and osteoclasts account for about 75%, yet SRP targets the bacteria, which calms the host response.", src:'lecture' },
{ id:'q4-L24', lec:'phase1-therapy', type:'mcq', stem:"In the pathogenesis model taught in class, what initiates periodontitis and what drives its progression?", choices:['Plaque bacteria initiate it; the host immune response drives progression','The host initiates it; bacteria drive progression','Calculus initiates it; smoking drives progression','Genetics initiates it; plaque drives progression'], answer:0, ex:"Flagged in class: 'That's going to be on the quiz.'", src:'lecture' },
{ id:'q4-L25', lec:'phase1-therapy', type:'mcq', stem:"Which is NOT a goal of scaling and root planing?", choices:['Reversing bone and attachment loss','Reducing inflammation','Shifting the flora from gram-negative toward gram-positive','Arresting disease progression'], answer:0, ex:"Non-surgical therapy can't reverse the damage. Pocket elimination isn't the rationale either, though PD does drop.", src:'lecture' },
{ id:'q4-L26', lec:'phase1-therapy', type:'mcq', stem:"After SRP, inflammation resolves and the gingiva loses volume. How is that recorded clinically?", choices:['As increased gingival recession','As decreased recession','As new bone','As deeper probing'], answer:0, ex:"The other half of the PD reduction is reattachment of junctional epithelium and connective tissue at the base of the pocket.", src:'lecture' },
{ id:'q4-L27', lec:'phase1-therapy', type:'match', stem:"Match each healing event after SRP to its approximate timing (as taught in class).", pairs:[['Junctional epithelium reattaches','7-10 days'],['Connective tissue reattaches','4-6 weeks'],['Collagen fibers mature and orient','3-6 months'],['Phase I re-evaluation','4-6 weeks']], ex:"The junctional epithelium reattaches first (7–10 days), connective tissue by 4–6 weeks (which is why re-evaluation is then), and collagen fibers keep maturing and orienting for 3–6 months.", src:'lecture' },
{ id:'q4-L28', lec:'phase1-therapy', type:'mcq', stem:"Why not wait 3 months to re-evaluate after SRP?", choices:["The maximum PD reduction is seen by 4-6 weeks; waiting longer gives no additional reduction", "Collagen can't mature before 3 months, so probing any earlier tears the new attachment", "Insurance requires re-evaluation at 4-6 weeks, even though healing continues for months after", "Calculus reforms after about 6 weeks, so the pockets would look deeper again if you waited"], answer:0, ex:"By 4–6 weeks the maximum PD reduction has happened. Waiting longer adds no further reduction, it only delays deciding what the non-responding sites need.", src:'lecture' },
{ id:'q4-L29', lec:'phase1-therapy', type:'mcq', stem:"Is scaling a supragingival or a subgingival procedure?", choices:['Both','Supragingival only','Subgingival only','Neither; it is only for prostheses'], answer:0, ex:"Root planing stays subgingival on root surfaces only. Clinically the two are done together.", src:'lecture' },
{ id:'q4-L30', lec:'phase1-therapy', type:'mcq', stem:"A patient who has never had periodontitis has 1-2 mm of subgingival calculus in normal sulci. What is the appropriate procedure?", choices:['Prophylaxis','Periodontal maintenance','Scaling and root planing','Full-mouth debridement'], answer:0, ex:"Subgingival calculus doesn't make it periodontitis, and prophylaxis is preventive. Maintenance is supportive therapy only for patients already treated for periodontitis.", src:'lecture' },
{ id:'q4-L31', lec:'phase1-therapy', type:'mcq', stem:"A treated periodontitis patient has mostly 1-3 mm pockets, a few non-bleeding 4s and one 5 mm site, good hygiene and no radiographic progression. What now?", choices:["Continue periodontal maintenance; localized SRP on non-responding sites is allowed under maintenance", "Restart full-mouth SRP, since any remaining 4-5 mm site means Phase I has failed and must be repeated", "Switch to routine prophylaxis now that most sites are 1-3 mm and nothing bleeds on probing", "Refer for flap surgery at once, since the single 5 mm site shows periodontitis progressing again"], answer:0, ex:"The patient is stable: shallow pockets, no bleeding at the 4s, good hygiene, no progression. Stay on periodontal maintenance, which allows localized SRP on the one non-responding site. Never downgrade to a prophylaxis.", src:'lecture' },
{ id:'q4-L32', lec:'phase1-therapy', type:'mcq', stem:"A young patient, never diagnosed with periodontitis, had premolars extracted for orthodontics (so some bone loss and tipping) and now has generalized inflammation from heavy plaque and calculus. What is the diagnosis?", choices:["Generalized gingival inflammation on a reduced periodontium in a non-periodontitis patient", "Stage 2 periodontitis, because the extraction sites already show some radiographic bone loss", "Gingival health on an intact periodontium, since there was never any periodontitis to begin with", "Necrotizing periodontitis, given the generalized inflammation in a young, otherwise healthy patient"], answer:0, ex:"Treated with scaling in the presence of gingival inflammation (D4346), done with perio faculty, followed by a Phase I evaluation.", src:'lecture' },
{ id:'q4-L33', lec:'phase1-therapy', type:'mcq', stem:"At the Phase I evaluation, inflammation and pockets persist, but you removed all deposits at SRP. What will help most?", choices:['Improving the patient\'s oral hygiene','Repeating full-mouth SRP','Adding a second round of irrigation','Immediate extraction'], answer:0, ex:"If residual calculus is the cause, remove it and re-evaluate in two weeks. Otherwise more SRP sessions won't do anything.", src:'lecture' },
{ id:'q4-L34', lec:'phase1-therapy', mid:false, type:'mcq', stem:"What can the clinic's piezoelectric ultrasonic NOT accomplish?", choices:['Root planing (a smooth root surface)','Subgingival deposit removal','Gross calculus removal','Pocket lavage'], answer:0, ex:"The ultrasonic removes gross and subgingival deposits and flushes the pocket, but it cannot plane the root smooth. That takes hand instruments.", src:'lecture' },
