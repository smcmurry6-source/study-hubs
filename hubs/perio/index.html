var READINGS_PLAIN = {};

READINGS_PLAIN['diagnosis-tx-planning'] = `
<p>Every gum-disease diagnosis starts with three measurements. <b>Probing depth (PD)</b> is how far the probe sinks: from the edge of the gum (the gingival margin) down to the bottom of the pocket. <b>Recession (GR)</b> is how far the gum has pulled back: from the CEJ (the line where enamel meets root) to the gum edge. <b>Clinical attachment level (CAL)</b> is the one that counts for staging. It is the two added together, which works out to the distance from the CEJ down to the bottom of the pocket. It tells you how much of the tooth's real attachment has been lost.</p>
<p>The sign matters. If the gum edge sits above the CEJ (so you can't see any root), recession is written as a negative number and CAL comes out smaller than the probing depth. If root is showing, recession is positive and CAL comes out bigger than the probing depth. Example: a 7 mm pocket with the CEJ hiding 4 mm under the gum is only 3 mm of attachment loss. A shallow 2 mm pocket with 4 mm of root showing is 6 mm of attachment loss. The second tooth looks worse on paper, but it is easier to keep, because the patient can actually reach a 2 mm pocket with a brush.</p>
<p>X-rays show what a probe can't reach. Use periapicals plus <b>vertical</b> bitewings, not horizontal ones. A horizontal bitewing can miss the bone loss in one of the two jaws completely. A panoramic is a good overview, but it isn't detailed enough to diagnose gum disease by itself.</p>
<h5>Health, gingivitis, or periodontitis</h5>
<p><b>Health</b>: no pocket deeper than 3 mm, no bleeding, no lost attachment, no lost bone. <b>Gingivitis</b> (inflamed gums from plaque) can have 4-5 mm pockets that bleed, but there is <b>no</b> attachment loss and <b>no</b> bone loss. The problem is only in the gums, and it goes away completely once the plaque is controlled. Before calling a mouth "gingivitis," at least 10% of sites should bleed. Probing pressure varies between people, so two or three bleeding spots on their own shouldn't decide it.</p>
<p><b>Periodontitis</b> is different: attachment loss <b>and</b> bone loss are both there, pockets often reach 6 mm or more, and it does not fully reverse. Treatment can stop it, but the best result is healthy gums on a <i>reduced</i> periodontium (less support than the patient started with), not a return to the original attachment.</p>
<p>"Intact" or "reduced" describes how much support is left, separately from whether there is disease right now. An intact periodontium can be healthy or have gingivitis. A reduced one (after old periodontitis, crown lengthening, or plain recession) can also be healthy or inflamed. A treated periodontitis patient who stays stable on maintenance is called <i>healthy on a reduced periodontium</i>. You don't re-stage them unless the disease comes back. If pockets deepen and bleeding returns at a later visit, the diagnosis moves back toward periodontitis, depending on how widespread it is.</p>
<h5>Recession is a sign, not a diagnosis</h5>
<p>Gums can recede in people who have never had periodontitis, so recession gets its own grading, based on how much attachment is also lost <i>between</i> the teeth. <b>RT1</b>: no loss between the teeth, so the root can be fully covered with surgery. <b>RT2</b>: some loss between the teeth, but less than on the cheek side, so only partial coverage is expected. <b>RT3</b>: more loss between the teeth than on the cheek side, so root coverage isn't tried, because it won't work.</p>
<h5>Staging and grading</h5>
<p><b>Staging</b> answers "how bad is it, and how hard will it be to treat?" The best measure is CAL between the teeth; bone loss on the X-ray is the backup. Stages 1 and 2 are early: more attachment loss, but bone loss still in the top third of the root. Stages 3 and 4 both have CAL of 5 mm or more and bone loss into the middle third or deeper. What separates 3 from 4 is not more attachment loss. It is how many teeth were lost to gum disease (4 or fewer is Stage 3, 5 or more is Stage 4) and whether the case needs complex, multi-specialty rebuilding.</p>
<p>Three findings jump a case straight to Stage 3 or 4 no matter what the CAL says: vertical (angular) bone loss of 3 mm or more, a Class II or III furcation (bone loss between the roots), and any tooth lost to periodontitis. A common trap: deep pockets alone never prove periodontitis. Without confirmed bone loss, a mouth full of 4s and 5s could just be widespread gingivitis.</p>
<p><b>Grading</b> answers "how fast is it moving, and how will this patient respond?" Start by assuming Grade B (moderate) and move only if the evidence says so. If old records show change over time, that is the best evidence. If not, take the percent bone loss on the worst tooth and divide by the patient's age: under 0.25 points to Grade A, 0.25 to 1.0 to Grade B, over 1.0 to Grade C. Two things can only push the grade <i>up</i>: heavy smoking (more than 10 cigarettes a day) and an HbA1c of 7% or higher. Either one makes it Grade C even if the ratio says B. Not smoking or not having diabetes never earns a lower grade. Each patient gets one stage (from the single worst site) and one grade.</p>
<h5>Reading a bone defect</h5>
<p>When the gum is lifted during surgery, a bone defect is described by how many bony walls are still standing around the damaged root. Picture standing inside the hole and counting the walls around you. A <b>3-wall defect</b> (cheek side, tongue side, and the wall facing the next tooth are still there; only the root itself is bare) has the best chance of growing bone back. A <b>2-wall defect</b> has lost one of those walls. When the bone is gone on both sides between the teeth and only the cheek and tongue walls are left, that shape is called a <b>crater</b>. A <b>1-wall defect</b> has the worst chance. X-rays can fool you here: thick outer bone, especially on the lower jaw, can hide a defect you only see once the gum is lifted.</p>
<h5>From diagnosis to treatment plan</h5>
<p>Everyone starts with <b>Phase I</b> (non-surgical care), whatever the stage: hygiene coaching, scaling and root planing (a deep cleaning of the roots), help quitting smoking, fixing fillings or crowns whose edges trap plaque, and cavity treatment. Cavities are easy to forget, but they belong in Phase I, before or alongside the deep cleaning, because a broken-down surface is harder to clean. Permanent crowns or a final partial denture wait until gum treatment is finished; a temporary crown fills the gap.</p>
<p>The decision about surgery (<b>Phase II</b>) is made at the <b>Phase I re-evaluation</b> visit, not at the first exam, because that is when you can see how well the gums healed and how well the patient kept up at home. Stage 1-2 cases often clear up with Phase I alone and go straight to maintenance. Stage 3-4 cases more often need surgery: either reshaping bone so it is easy to keep clean (resective surgery) or regrowing bone in a good-shaped defect (regenerative surgery). Every plan ends in maintenance, and the evidence for it is clear: people who refuse treatment lose about three times as many teeth as treated people, and treated people who skip maintenance lose teeth about twice as fast as those who keep their recall visits.</p>
`;

READINGS_PLAIN['incisions-flaps-sutures'] = `
<p>Gum surgeries sit on a scale. A simple extraction may need no cut and no flap at all. A graft over a receded root needs a small flap lifted just a little. A sinus lift or ridge graft needs a big flap opened with several cuts. Which cut and flap to use is partly a matter of the surgeon's preference (Dr. Basma said two surgeons can disagree on the same case), but a small set of designs covers almost everything.</p>
<h5>Naming an incision: it's about the tooth, not the technique</h5>
<p>The most-missed point in this session: <b>intrasulcular</b> and <b>crestal</b> are the same cut. Only the name changes, depending on whether a tooth is there. With a tooth present, the blade goes into the sulcus (the small gap between gum and tooth) and separates the gum fibers from the tooth all the way around: cheek side, tongue side, and through the papillae (the gum points between teeth). That is intrasulcular. Where there is no tooth, there's no sulcus, so the same straight cut along the top of the ridge is called crestal. Including more teeth in this cut gives a bigger flap and more room to work, but including teeth you don't need hurts the look of the result for no gain.</p>
<p>When that cut alone doesn't open enough room (most big bone grafts), you add a <b>vertical releasing incision</b> at the line angle of a tooth (the corner where the front surface turns into the side surface). It opens a bigger flap without adding more teeth to the horizontal cut. One vertical plus an intrasulcular cut across three teeth (for example, distal of #7 with the sulcus cut on 7, 8 and 9) makes a triangle-shaped <b>pyramidal flap</b>, which is enough for an implant with a small bone graft on top. Two verticals, one on each side, make a <b>trapezoidal flap</b>. That is needed for large vertical bone grafts, because two releases let the flap slide up and close over the graft without tension. One vertical usually can't stretch that far without tearing.</p>
<p>One more design barely lifts anything: the <b>envelope (pouch) flap</b>. The papillae are never touched. Only the cheek-side gum is loosened, just enough to slide it up over a gum graft (from the patient or a donor), leaving the gum between the teeth completely intact. It is the go-to design for covering exposed roots, where disturbing the papilla would work against the cosmetic goal.</p>
<h5>Reading a flap design</h5>
<p>Besides how it is opened, a flap is described three more ways. <b>Thickness</b>: full-thickness lifts the periosteum (the thin skin over the bone) with the flap and bares the bone; split-thickness leaves the periosteum on the bone. <b>Where it goes back</b>: moved up past the CEJ to cover roots, or moved down for crown lengthening and bone reshaping. <b>Papilla</b>: kept intact or not. A <b>sulcular flap</b> (sulcus cut only, no vertical) gives the least room and is hard to move because the tissue stays attached at the sides. It is the smallest option, used for small grafts or a single implant. Adding one more tooth on each side (still no vertical) buys a bit more room without a releasing cut.</p>
<p>Full vs. split has a simple rule: if the surgery involves bone in any way, go full thickness and expose it. If it's only about soft tissue, go split thickness and leave the periosteum behind as a living bed. That covers every case in the course. Implants, bone, ridge and sinus grafts, crown lengthening and bone reshaping are all full thickness. Gum grafting is the one split-thickness exception, because the graft needs that blood-rich bed to connect its blood vessels to the patient's.</p>
<h5>A fourth incision: sub-marginal, for eliminating a pocket</h5>
<p>The in-class review added a fourth cut that works differently from the others: the <b>sub-marginal incision</b>. "Sub" means below: it is made <i>below</i> the gum edge, not in the sulcus or on the ridge. The other cuts are for access and get closed back where they were. This one removes tissue on purpose: it is scalloped through the pocket wall and the gum above it is cut away, not lifted and put back. The goal is getting rid of a deep pocket during bone surgery. If a site probes 6 mm where 3 mm is normal, trimming about 3 mm of pocket wall leaves a shallow, cleanable sulcus instead of a deep pocket that keeps refilling with bacteria between visits.</p>
<p>The catch is deliberate: this cut creates recession (the gum edge ends up lower on the tooth after healing). That is the right trade when the alternative is a pocket the patient can't keep clean. It is the wrong call, and never done, on a site being treated <i>for</i> recession. The question is always what the real problem is: a deep pocket calls for a sub-marginal cut; thin or receded gum calls for a graft. They aren't contradictory, just answers to different problems.</p>
<h5>Choosing a suture material</h5>
<p>Stitches come in two big groups. <b>Absorbable</b> ones dissolve in the body on their own (gut, chromic gut, and synthetics like Vicryl and Monocryl). <b>Non-absorbable</b> ones have to be taken out, usually at 10-14 days, or are left long-term (silk, ePTFE, polypropylene/Prolene, nylon). Plain gut dissolves fastest (7-10 days). Chromic gut is treated with chromium salts and lasts a bit longer (10-14 days). Synthetics like Vicryl keep their strength for 2-3 weeks and dissolve over a longer time. Absorbables make sense for quick cases in kids or simple extractions, where a removal visit is a hassle. Non-absorbables like ePTFE are preferred over big bone grafts because they attract less plaque, are strong, and won't break down too early.</p>
<p>The course chart compares six materials by natural vs. synthetic, single-strand vs. braided, how fast they dissolve, strength, how much they irritate tissue, and how they handle (full chart in Review). <b>Chromic gut</b>: natural, single strand, dissolves fastest (7-10 days), handles very badly. Used at extraction sites, implants without extra grafting, or to hold a collagen membrane. The two synthetic dissolvers differ by build. <b>PGA</b> is braided, dissolves slowest (55-70 days), handles beautifully, but irritates tissue, which fits ridge and sinus grafts that heal slowly. <b>PGCL</b> is a single strand, dissolves faster (22-55 days) and is gentler on tissue, which fits gum grafts and cosmetic crown lengthening. Of the ones that must be removed: <b>polypropylene</b> behaves like nylon and doesn't stick to tissue; <b>silk</b> handles beautifully but irritates tissue the most of anything on the list and comes out at 7 days; <b>PTFE</b> costs the most and is used for nearly every surgery except pure gum grafts.</p>
<p>Single strand vs. braided isn't just about feel; it's about infection. A braided stitch soaks up and traps bacteria like a wick. A smooth single strand doesn't. That is exactly why silk scores so badly for irritation. If you use a braided stitch, wipe it with chlorhexidine gauze before pulling it out, so you don't drag plaque back through the wound.</p>
<h5>Grafting from the palate: donor-site selection and protection</h5>
<p>Keratinized gum (pale pink, firm, doesn't move) protects the tooth from the wear of chewing, the way tough skin protects you in a fall better than the thin lining inside your cheek. Non-keratinized tissue (red, thin, loose, full of blood vessels) can't take that load. When a tooth or implant doesn't have enough firm gum, you graft some, and the palate is the best source because it is all firm, keratinized, fixed tissue. Take it from the <b>molar area</b>, not the premolar area. The premolar area has more fat under the surface, and fat melts away after it is moved, so a graft with too much fat visibly shrinks. From the surface down, the palate is: epithelium (surface layer), then connective tissue (lamina propria), then fat over bone. A connective tissue graft keeps only the middle layer: the surface is trimmed off and the fat is avoided on purpose.</p>
<p>Grafts work because two raw, cut surfaces held together will join their blood vessels and heal as one, the same way two cut fingers held together can reattach, but two fingers just pressed together (skin intact) never will. That's also why the site receiving the graft is prepared split thickness: the periosteum left on the bone gives the graft a living surface to fuse to. The donor spot on the roof of the mouth is left as an open wound, and it hurts (compared in class to a bad pizza burn, since every sip and swallow touches raw nerve endings). Options to protect it: a composite stent made <i>before</i> the harvest to keep the palate's shape, PRF (a gel made from the patient's own blood) laid over the wound, or a custom palatal stent or night guard worn for at least three days while it heals over, taken out only to clean. Watch out for the greater palatine artery in this area; nicking it is the most common cause of serious bleeding during a palatal harvest.</p>
<p>The needle matters as much as the thread. A <b>reverse cutting needle</b> keeps its flat side toward the tissue as it comes up, so it is less likely to tear through than a regular cutting needle. A more curved needle takes a deeper bite. A thicker needle goes through more tissue but needs more wrist turn. For thread size, a bigger number means a thinner thread, and thinner thread needs more knots to hold.</p>
<h5>Choosing a technique</h5>
<p><b>Single interrupted</b> stitches (and the figure-8 version) are the everyday default: each one is tied on its own. <b>Horizontal mattress</b> stitches are a must for bigger bone grafts and keep the flap edges from rolling inward, but tied too tight they choke the blood supply to the edge and can cause bone death and the wound opening up. <b>Vertical mattress</b> stitches pull tissue together most closely and turn the edges out; they are the choice for rebuilding papillae in the front of the mouth or closing an opening into the sinus. <b>Continuous and continuous-locking</b> stitches put the bites close together for a tight seal, but if one throw fails the whole line can come loose (a real risk with slippery single-strand thread), so they're kept for long toothless areas, bone smoothing and root-tip surgery. <b>Sling</b> and <b>periosteal-anchor</b> stitches finish the list: one wraps around a single tooth to reposition a flap, the other anchors the flap to the periosteum to hold it lower or to the side.</p>
<h5>Five surgical principles</h5>
<p>Every cut and flap in the course follows five rules: (1) one firm, continuous stroke, not several shaky ones; (2) keep the cut away from the actual defect, never right over it; (3) put vertical cuts at the line angle of the tooth; (4) lift the periosteum as part of the flap; and (5) make the base of the flap at least as wide as its free edge, because once the flap is lifted, the base is its only blood supply.</p>
<div class="pearl"><b>Ortho heads-up:</b> if an orthodontist plans to push thin-gummed front teeth further forward, graft first to thicken the gum. Pushing a tooth through thin bone and gum tends to cause recession, and it's easier to prevent than to fix. The best time to treat recession is always as early as possible.</div>
`;

READINGS_PLAIN['risk-assessment'] = `
<p>Dr. Geisinger's starting point: if you treat every patient the same no matter their risk, you're set up to fail. Periodontitis isn't only an infection. It's an inflammation problem driven by the immune system, and how fast it moves (or whether it moves at all) depends on the patient, the specific site, and their environment. "One size does not fit all" is the theme. The practical question is: given what you know about this patient, how do you turn it into a recall schedule, a point where you step up treatment, and a conversation they'll act on?</p>
<h5>The scale of the problem, and who is actually looking</h5>
<p>About 42.5% of US adults over 30 have periodontitis (roughly 64.7 million people), rising to 70.1% of adults 65 and older. It's more common in men (56.4%) than women (38.4%), in current smokers (64.2%), in people below the poverty line (65.4%), and in people without a high school diploma (66.9%). The number that stings: 72% of patients who turn out to have periodontitis came in saying "I'm just here for my cleaning." Most have no idea. It doesn't hurt, bleeding when brushing feels normal, and nobody has measured or explained it to them. So the clinician is often the first and only person who will spot it.</p>
<p>Billing data shows the gap. Dentistry bills procedures, not diagnoses. A "prophy" (code D1110) is a preventive cleaning meant only for people with no gum disease and no history of it. Since gum disease gets more common with age, prophy's share of cleanings should shrink as patients get older. Instead it grows: 72.3% of cleanings at ages 19-34, 87.5% at 35-49, and 95.4% at 50-64. That's the opposite of what should happen, which suggests disease is being missed (or not treated properly) more often as patients age.</p>
<h5>P4 (P5) medicine vs. Hippocratic medicine</h5>
<p>Traditional (Hippocratic) medicine starts from "do no harm," which in practice tends to mean reacting: treat disease once it shows up. <b>P4 medicine</b> means personalized, preventive, predictive and participatory: estimate each patient's risk, tailor it to their own risk factors, and make them an active partner in their care instead of someone who just gets instructions. For gum care the lecture adds a fifth P, <i>periodontal</i>, and calls it <b>P5 care</b>.</p>
<p>Why is risk hard to estimate? Partly because "you get out what you put in." A bitewing that doesn't show the front teeth can hide the worst sites. A yearly panoramic-plus-bitewings routine may never picture the area that matters. In a UAB review of treated maintenance patients, over 40% of the records had to be thrown out because bleeding on probing had never been written down, and if you don't record inflammation, you can't tell how much the patient is carrying.</p>
<h5>A full risk workup, practically</h5>
<p>A risk workup has five parts: an interview (health history, lifestyle, whole-body conditions); a full gum exam (pocket depths, attachment levels, plaque, bleeding, pus, furcations, loose teeth, fremitus); X-rays to check bone levels; deciding whether you need the patient's physician (an HbA1c for a diabetic, an INR for someone on blood thinners); and a lifestyle check (tobacco, alcohol, stress). The American Academy of Periodontology recommends a full gum evaluation at least once a year for adults, more often for higher-risk patients, plus a quick screen at every visit.</p>
<h5>Why now? And what a 3 mm pocket means twice</h5>
<p>The hardest question patients ask, Dr. Geisinger says, is "why now?" Someone who never missed a six-month cleaning is suddenly told they have 8 mm pockets. Those pockets didn't appear overnight. The honest answer is usually a mix of not diagnosing, not treating, or "good enough" care that never reached below the gumline: repeated above-the-gum cleanings on someone who needed real gum treatment. The lecture's name for this is <b>P.E.R.I.O.D. disease</b>: <i>P</i>artially <i>E</i>ffective, <i>R</i>edundant <i>I</i>nstrumentation, <i>O</i>verlooking <i>D</i>isease. Cleaning only above the gums in a periodontitis patient improves plaque scores but doesn't shrink pockets or regain attachment. It actually raises bleeding and the number of 4 mm+ pockets, and shifts the bacteria under the gum toward nastier, oxygen-hating species (notably <i>P. gingivalis</i>). Something is not always better than nothing.</p>
<p>It's also why a 3 mm pocket can mean two different things. After gum treatment, the gum reattaches with a <b>long junctional epithelium</b>, a thin skin-like seal, instead of the strong fiber attachment of healthy gums. That seal breaks down more easily when inflamed. So a treated patient with 3 mm everywhere still isn't a "prophy" patient the way someone who never had gum disease would be. They still need the periodontal maintenance code and schedule, because the tissue itself is built differently, even when the numbers look normal.</p>
<h5>The inflammatory burden, and why it isn't "just" a mouth problem</h5>
<p>The lecture makes this concrete with <b>PISA</b> (periodontal inflamed surface area): the total area of inflamed pocket lining. A healthy mouth averages about 34 mm², roughly a paper cut. Even mild-to-moderate (Stage 1-2) periodontitis averages about 2,309 mm², about the size of a wound from a spreading skin infection with early Ludwig's angina. That's why gum disease counts as an inflammation load on the whole body, not a local nuisance. It's linked to more than 50 body-wide conditions, and a few links have hard numbers: periodontitis raised the odds of dying after COVID-19 about nine-fold and of hospitalization about five-fold in one comparison; in a COPD trial, real below-the-gum treatment cut lung flare-ups about twice as much as above-the-gum cleaning or nothing; and in a diabetes trial, intensive gum treatment (full-mouth deep cleaning, surgery where needed, 3-month maintenance) brought HbA1c down from 8.1% to 7.8% over a year, while the above-the-gum-only group went from 8.1% up to 8.3% and had three deaths recorded as adverse events.</p>
<h5>Measuring risk with a tool instead of a gut feeling</h5>
<p>Scoring tools estimate risk better than gut feeling. <b>UniFe</b> (Trombelli) scores five things from 0 to 4: cigarettes per day, diabetes control (HbA1c), number of pockets 5 mm or deeper, percent of sites that bleed, and bone loss divided by age. The total puts the patient in one of five risk levels. The <b>Periodontal Risk Assessment (PRA)</b> (Lang and Tonetti) and <b>PreViser/PAT</b> (Page) work the same way, combining exam, X-ray and lifestyle inputs into one risk level; UniFe and PreViser agreed fairly well when tested on the same patients. Newer AI tools (Pearl AI and Overjet were named) are joining them. None of them escape "garbage in, garbage out": they're only as good as the exam data you feed them.</p>
<h5>Turning a risk tier into an actual recall plan</h5>
<p>Once a patient is low, moderate or high risk, that level should change what you actually do:</p>
<ul>
<li><b>Low risk</b>: full gum exam every 6-12 months, X-rays every 12-24 months, professional cleaning every 6 months, normal home care (brush twice a day, clean between teeth once a day), diet advice, and tobacco prevention.</li>
<li><b>Moderate risk</b>: full exam every 6-12 months <i>plus</i> a quick gum screen every 6 months, X-rays every 6-12 months, keep an eye on general health, cleaning plus spot deep-cleaning every 4-6 months, fix plaque traps, think about a local antimicrobial, surgery if needed to stop disease or repair defects, help quitting tobacco, extra hygiene tools (water or air flosser, rinses, probiotics), and check how well they keep up.</li>
<li><b>High risk</b>: full exam every 6-12 months <i>plus</i> a screen every 3 months, X-rays every 6 months, close health monitoring with physician consults, cleaning plus deep-cleaning every 2-4 months, think about systemic or local antibiotics, surgery likely, and the same home-care and quit-tobacco package, checked more closely.</li>
</ul>
<h5>Why maintenance intervals are what they are</h5>
<p>Treated patients who skip maintenance lose teeth about twice as often as those who come back, and more frequent visits go with fewer teeth lost. Yet only about 30-40% of patients stick with maintenance. The 3-month interval isn't random: harmful bacteria start moving back under the gum 4-8 weeks after treatment, and by 9-11 weeks they can be back near where they started. A 3-month recall lands inside that window. Patients in active braces are seen even more often (about every 4-6 weeks), partly because that's when the braces get adjusted, and partly because inflammation while teeth are moving can throw off the balance of bone building and bone removal, risking real bone loss if plaque isn't tightly controlled. Coming <i>regularly</i> matters, not just the total number of visits, and it matters most for Stage 3-4 and Grade C patients: one who skips more than a year of maintenance over five years has about 2.5 times the odds of losing a tooth to gum disease.</p>
<h5>Communicating risk so patients actually act on it</h5>
<p>The number one reason patients say no to a gum treatment plan is that they don't trust their dental provider. The most trusted person in the office by far is the hygienist, not the dentist, which is why the whole team needs to give the same message. 62% of patients delay, switch dentists, get a second opinion, or refuse because they disagree with or doubt the diagnosis. Cost is rarely the real reason: patients say they'd pay about $633.63 per tooth to keep it. Cost becomes the objection when they feel rushed, can't ask questions, sense the team disagreeing, or aren't offered ways to manage the cost. In other words, when they don't yet feel you care about them.</p>
<p>A stage-and-grade diagnosis ("Stage 2 Grade B periodontitis") gives everyone the same precise words. The lecture models moving a patient from cleanings to real treatment as a short conversation: say what you've been tracking and what it shows (the problem); explain plainly that once pockets are deeper than home care can reach, about 1.5-2 mm, bacteria settle in under the gum (the consequence); and lay out the "prescribed" (not just "proposed") plan and what it gains compared with doing nothing (the solution). The best predictors of a good long-term result are the same list this whole session covers: home hygiene, keeping up with maintenance, bleeding, pockets left after treatment, bite, bone loss for age, body-wide and genetic factors, and smoking.</p>
<h5>In class: the three prognosis systems, compared</h5>
<p>A prognosis is a prediction of how a tooth (or mouth) will do. The in-class Slido review, which Dr. Geisinger hinted "might inform the midterm," was about telling the three systems apart by <i>what each one is asking</i>, not by memorizing lists. <b>McGuire &amp; Nunn</b> asks: <b>can we keep this tooth?</b> Most of the class guessed "will the disease get worse," which is wrong. Its order is <b>good, fair, poor, questionable, hopeless</b>, and the classic mistake is swapping poor and questionable. A "poor" tooth (lost attachment, Class II furcation, some looseness) can be kept, just with a lot of effort. A "questionable" tooth is one we honestly aren't sure we can keep, and it won't stay in that category: it either gets worse and becomes hopeless, or improves and moves up to poor.</p>
<p>How accurate is it? Every statement in the poll was true. It's right about <b>80%</b> of the time overall (81% at 8 years). Take out the teeth rated "good" and it drops to about <b>50%</b>, a coin flip. On average teeth do <b>better</b> than predicted, and even "hopeless" teeth in well-maintained patients often last much longer than expected. The exceptions are smokers and people with very poor hygiene, and even very poor hygiene matches the prediction if those patients keep coming to maintenance. Most teeth leave the mouth because a dentist pulls them, not because they fall out on their own (unlike implants, which often do).</p>
<p>McGuire &amp; Nunn can be given for one tooth or the whole mouth, and as a <b>diagnostic</b> prognosis (what happens if the patient gets no treatment) or a <b>therapeutic</b> prognosis (how the recommended treatment changes things). The therapeutic version is a great way to show patients what treatment buys them. <b>Kwok &amp; Caton</b> asks: <b>can we stop the disease (get periodontal stability) with treatment?</b> Answers run likely, don't know, unlikely. That's why "questionable" sits in the <i>middle</i> of its scale, and why it can only be therapeutic. It's the better pick for a medically complex patient, because quitting smoking or vaping and getting an A1c under control become part of the treatment it's judging. <b>Miller &amp; McEntire</b> was studied only on <b>molars</b>. It uses numbers (A1c, smoking and other factors each get a score), and since it was built from patients who got 30 years of treatment and maintenance, it's therapeutic too. Smoking is its biggest single factor: about 296% more likely to lose those molars. The one-line summary: <b>only McGuire &amp; Nunn can be diagnostic; all three can be therapeutic.</b></p>
<h5>In class: three cases, all Stage 3</h5>
<p><b>A 78-year-old</b> (generally healthy with mild issues, on a statin and baby aspirin, #17 lost to a root-canal perforation) had mostly horizontal bone loss of about 30%, 5 mm or more of attachment loss between teeth at her worst site, and a Class II furcation. That's <b>generalized Stage 3, Grade B</b>, and her missing teeth were lost to cavities, not gum disease. First check the chart is right: was recession on the tongue side recorded? Her Kwok &amp; Caton prognosis was <b>questionable</b>, because flat bone loss and furcations are hard to regrow. Plan: <b>maintenance every 3 months</b> (bacteria refill in about 9-11 weeks, and once someone has had periodontitis they stay higher-risk even when healthy), adjust her bite for trauma from chewing forces, and watch the recession. The PRA spider-web chart (bleeding, 5 mm+ sites, missing teeth, % bone loss, smoking) said to keep doing what she's doing.</p>
<p><b>A 13-year-old</b> with little plaque or inflammation had 8-11 mm pockets on her first molars and #14 in a <b>molar-incisor pattern</b>: <b>localized Stage 3, Grade C</b>. Deep, narrow vertical defects respond well to regrowing bone (bone graft, membrane, maybe a growth-factor product), filling about <b>70-75%</b>, and young people heal better. So with treatment her McGuire &amp; Nunn prognosis is <b>good to fair overall</b>, the affected teeth fair; without treatment it would be poor to questionable. Regrowing bone in the defect that set the stage is the only way to move someone back down from Stage 3. About 70% of kids with this around-puberty pattern have <b>neutrophils</b> (first-responder white blood cells) that don't move toward infection properly, which is why the first teeth to come in are hit hardest. About 70% of those whose disease later spreads use <b>nicotine</b>. She needs lifelong, more frequent maintenance and a strong anti-nicotine talk.</p>
<p><b>A 75-year-old former smoker</b> with bleeding at about 80% of sites, 7-9 mm pockets, and both vertical and flat bone loss is Stage 3, Grade C. Her overall McGuire &amp; Nunn prognosis with no treatment is <b>poor</b>, even though individual teeth range from good to hopeless, which is why per-tooth prognoses are useful. With good cooperation plus bone reshaping or regrowing surgery, it improves to <b>fair</b>. If she later gets diabetes (A1c 8.8%), her grade can't go past C, but her PRA risk chart balloons. That's the point of keeping prognosis and risk tools separate from stage and grade: they catch differences the diagnosis can't.</p>
<p>The closing numbers: about <b>10%</b> of people resist periodontitis no matter their hygiene, <b>10-15%</b> are at risk for severe disease, and <b>20-25%</b> don't respond to standard treatment. Results depend on what patients control (hygiene, showing up for maintenance), exam findings (bleeding, leftover pockets, bite trauma, bone loss for age), and body-wide, genetic and nicotine factors.</p>
`;

READINGS_PLAIN['phase1-therapy'] = `
<p>Phase I is the non-surgical first step every gum patient gets, whatever their stage. These notes combine the 2026 slide deck with the recorded class. Dr. Kaur explained that D2 goes a step past D1. Instead of basics, it covers treatment: when it works, when it doesn't, and what the options are, so you're ready for clinic next year. She spent class on the exam and the reasons behind treatment, and saved the instrument details for the upcoming PCD (hands-on) sessions.</p>
<div class="pearl"><b>What's on the midterm (Dr. Kaur's email after class):</b> instruments, ultrasonic scalers and polishing won't be tested. Study the class discussion and the slides up to <b>failure of therapy</b>. In these notes, that's everything down to the section on the re-evaluation and when treatment "fails." The sections after it are marked.</div>
<div class="pearl"><b>Flagged in class:</b> about the diagram showing how bacteria and the body's immune response move a patient from health to gingivitis to periodontitis, she said "has anybody been counting? That's going to be on the quiz." Know what starts the disease, what makes it worse, and which one a deep cleaning actually treats.</div>
<h5>Start from the diagnosis</h5>
<p>Every patient fits one of three big groups: <b>healthy gums</b>, <b>gingivitis</b> (gum inflammation only) or <b>periodontitis</b> (gum disease that has destroyed bone). Healthy gums and gingivitis can each happen on a full-height set of supporting tissues (<b>intact periodontium</b>) or on one that has already lost some height (<b>reduced periodontium</b>). Periodontitis can't happen on an intact periodontium, because bone loss is what makes it periodontitis. You can't tell the three apart just by looking at a photo or into the mouth. You need the full gum chart (pocket depths, recession, attachment loss, furcations, loose teeth, how the gums look) plus the X-rays.</p>
<h5>The exam: plaque and gum health</h5>
<p>A full gum exam checks home hygiene (plaque score), gum health, pocket depths, attachment, furcations, the gum-to-cheek-lining border, loose teeth, the bite, and X-rays. It always starts with plaque, because plaque is the main cause of gum disease. There are two ways to record it. You can slide the probe about <b>1 mm</b> into the gum crevice (this isn't measuring the pocket) and score each spot <b>1</b> if plaque comes out on the probe and <b>0</b> if not. Or the patient chews a <b>disclosing tablet</b> (lavender or pink in the clinic), rinses briefly, and you wipe the extra dye off the cheeks and tongue, show them in a mirror and record the score. Both methods only record whether plaque <b>is there or not</b>, not how much. Measuring amount (near the gum only, half the tooth, the whole tooth) at every spot would take far too long.</p>
<p>Gum health is judged by <b>color</b> (redness), <b>texture</b> (swelling), <b>bleeding when probed</b> (BOP) and a gingival index. Bleeding is recorded while you probe: <b>1</b> if the spot bleeds, <b>0</b> if not. <b>Late bleeding counts.</b> After you've moved on a couple of teeth or to the next quarter of the mouth, look back. Any earlier spot that has started bleeding still gets a 1.</p>
<p>Not every periodontitis patient looks the same, because other factors change how the gums appear. <b>Smoking hides inflammation</b>: nicotine squeezes blood vessels, so the gums often look bluish-gray instead of puffy and bleeding. <b>Diabetes makes inflammation look worse.</b> <b>Gum overgrowth caused by a medication</b> tells you something in the medical history is adding to the picture. The class example was a patient with high blood pressure taking <b>amlodipine</b> (a calcium channel blocker). The gums were bulging, mostly between the teeth, and more on the cheek/lip side than the tongue/palate side. The four patients shown, all from the student clinic, all had periodontitis. Their gums looked quite different, including one with uncontrolled diabetes who was also on a calcium channel blocker.</p>
<h5>Probing, recession and CAL</h5>
<p>Probing records <b>six spots per tooth</b> (DB, B, MB, DL, L, ML), taking the deepest reading at each. <b>Probing depth</b> runs from the gum edge to the bottom of the pocket. <b>Recession</b> runs from the CEJ (the line where enamel meets root) to the gum edge. <b>Clinical attachment level</b> runs from the CEJ to the bottom of the pocket, so <b>CAL = probing depth + recession</b>. The deck's pair: a 7 mm pocket with no recession and a 2 mm pocket with 5 mm of recession both have a CAL of 7 mm.</p>
<p>Her big point: <b>in healthy gums, pocket depth is not the same as attachment level.</b> Healthy gum sits a little <b>above the CEJ</b> and covers it. Recession is <b>positive</b> when the gum has pulled back and you can see the CEJ. It's <b>negative</b> when the gum edge sits above the CEJ: −1, −2, −3, or even more with medication-caused overgrowth. Add it with its sign. A 5 mm pocket with −3 mm recession is a <b>CAL of 2 mm</b>. Skip the recession and the same spot reads 5 mm, which would point to <b>Stage 3 or 4</b> disease even if the X-rays show only about 20% bone loss. Pocket depths, attachment levels and X-rays should all tell the same story.</p>
<p>The same mistake happens in <b>Salud</b>, the charting software. If you leave recession blank, or type 0 without checking whether it's really positive or negative, Salud makes CAL equal to pocket depth. A blank <b>over-diagnoses</b> disease, and an automatic zero is inaccurate too. Enter the real number with its sign and Salud does the math correctly.</p>
<p>To measure negative recession you have to <b>feel</b> the CEJ, since you can't see it. Slide the probe to the bottom of the pocket, then slowly pull it out until you feel the rough CEJ. The millimeters still under the gum at that point are the negative recession, which you subtract from the pocket depth. It's harder with lots of <b>inflammation</b> or <b>overgrowth</b> (both caused by disease), with <b>altered passive eruption</b> (a normal variation), and with <b>tartar or filling edges</b> that can feel like a CEJ. On eruption: as a tooth comes in, <b>active eruption</b> is the tooth moving up to meet the opposite tooth, and <b>passive eruption</b> is the gum moving down to settle at the CEJ. In altered passive eruption the gum never moves down, so its edge stays well above the CEJ. Getting good at this takes practice.</p>
<p>The probe is the most important exam tool. Press lightly, feel for the springy stop, and keep it parallel to the tooth. <b>Between teeth, don't stop at the corner of the tooth</b> (the line angle). Go past it and under the contact point (front teeth) or contact area (back teeth), tilting slightly toward the spot just below the contact.</p>
<h5>When you can't probe yet: debridement</h5>
<p><b>Debridement isn't a treatment.</b> You never do it to treat disease, and it should <b>never be combined with scaling and root planing</b> (deep cleaning). The only reason to do it is tartar so heavy that you can't see or feel the gum edge, so you can't take any measurements. There's only a <b>full-mouth</b> debridement code, no half-mouth or single-area version. It's meant for tartar so widespread it covers even the chewing surfaces, which is rare. Insurance won't pay for debridement and a gum exam at the same visit: if you couldn't measure before, the gums won't be ready right after. So in private practice the patient usually comes back in about <b>two weeks</b> for the full chart.</p>
<p>School is more flexible. The first gum charting is <b>free</b>, so after clearing a patch of heavy tartar you can do the full chart at the same visit if the gums look okay. Check with your faculty, who may want to let the gums settle for two weeks. Combining saves the patient a trip. In private practice you can also choose not to charge for a small debridement, though a packed hygiene schedule is often a reason to split visits anyway.</p>
<h5>Furcations: named classes, not millimeters</h5>
<p>A <b>furcation</b> is where a tooth's roots split. It's checked with the <b>Nabers probe</b>, which is curved with light and dark bands every 3 mm, alongside X-rays. Even so, the grading used here is the <b>Glickman classification</b>, which is based on what you feel, not a millimeter count. Class I does not mean "3 mm or less."</p>
<ul>
<li><b>Class I, just starting.</b> The probe barely catches. Usually no treatment. Easy to keep stable as long as the attachment and pocket don't get worse.</li>
<li><b>Class II, a dead end.</b> The probe goes clearly into the furcation, but bone still stands on the far side (probe from the cheek side and the palate/tongue-side bone is still there). Because it's a contained pocket with depth, it's the class <b>best suited to regrowing bone</b> (regeneration).</li>
<li><b>Class III, all the way through.</b> The hardest to treat. Nothing contains it, so it can't regrow.</li>
<li><b>Class IV.</b> A Class III where the gum has also pulled back (naturally or by surgery), so you can see through it. The patient can clean it with little brushes or a water flosser, but the exposed roots risk sensitivity and <b>root cavities</b>. A cavity in a furcation makes the tooth hopeless (it will need to come out), so watch these teeth closely at every maintenance visit.</li>
</ul>
<p>Her cases: an upper molar (#3) with furcation involvement was the only back support for a bridge. Instead of pulling it, they turned the Class III into a Class IV (cleaned it and moved the gum down so the patient could reach it). That patient is still doing well. Another patient given the same treatment got a large cavity under the roof of the furcation.</p>
<h5>Gum border, loose teeth and the bite</h5>
<p>The gum border check asks how much firm (keratinized) gum the patient has. Measure its width directly, or use the <b>rolling technique</b>: roll the loose cheek lining up toward the teeth until it stops at the mucogingival junction (where firm gum begins). This matters around <b>implants</b> as well as teeth.</p>
<p>Looseness is checked with <b>two rigid, blunt instrument handles</b>, one on each side of the tooth, and graded on the <b>Miller scale</b>: 0 is normal, 1 is a little more than normal (under 1 mm), 2 is moderately more (between 1 and 2 mm), and 3 is severe side-to-side movement plus the tooth can be pushed down into its socket. A tooth that <b>pushes down into its socket</b> is ready to come out. That's looseness at rest. <b>Fremitus</b> is looseness while the teeth work. Put a finger on the root while the patient taps their teeth together and feel for vibration. It can go up-and-down and/or side-to-side, and you usually <b>feel it rather than see it</b>. If you feel fremitus, find out why that tooth is taking so much force. In the class example, missing back teeth meant the <b>premolars were doing the molars' job</b>.</p>
<p>The gum chart has no box for bite findings, so put them in the <b>notes section</b>: wear patterns, acid erosion, vertical bone defects and whether they link to a bite problem, and grinding or clenching. This matters because a loose tooth isn't always just gum disease. It can be <b>too much biting force on a tooth that has already lost support</b>, from missing back teeth, grinding, or overjet and overbite. Treating a 5 mm pocket won't fix grade 2 looseness unless the bite is fixed too. The deck's list of bite warning signs: grinding or clenching habits, loose teeth, fremitus, drifting teeth, open contacts, unusual wear and wear facets, possible jaw-joint pain, vertical bone defects and a widened ligament space on X-ray.</p>
<h5>X-rays, before you touch the patient</h5>
<p>Before you take any measurements, X-rays show whether there's <b>bone loss</b>, whether it's in a few spots or <b>all over</b>, and its pattern (<b>flat, vertical</b>, or both). They also show <b>tipped teeth</b>, <b>fused roots</b>, <b>roots too close together</b> (important for surgery and deep cleaning), <b>tartar</b>, <b>how close the sinus is</b>, and an <b>infection at a root tip</b> (#7 in the class X-ray). Seeing tartar on an X-ray should make you "a little bit of both" sad and excited. Sad the patient got to that point, excited because now you know the cause and it's something you can remove. Once tartar has formed the patient can't brush it off, so your job matters even more.</p>
<p>Her tip: when you start a deep cleaning (or even a regular cleaning), don't open the chart to hunt for deep pockets. Your instrument will find the pocket, and the bottom of the pocket is where you stop. Open the <b>X-rays</b> instead (take screenshots, since Salud logs you out). Then roughness on #14-15 matches tartar you already saw, and pus or a draining spot on #7 matches the root-tip infection. Look at the X-rays before you start measuring.</p>
<h5>Why Phase I works: bacteria start it, the body drives it</h5>
<p>Plaque bacteria <b>start</b> the disease. The body's <b>immune response</b> is what makes it <b>get worse</b>. In health the immune system handles the bacteria quickly and the bacteria aren't very harmful, so disease never shows. In gingivitis the bacteria change and the attack gets stronger. The body still wins, but it takes longer: more immune cells (T cells and B cells) join the first responders (neutrophils), and you see inflammation for days to a couple of weeks. Not everyone moves from reversible inflammation to permanent damage. Those who do have an immune system that <b>overreacts</b> and releases inflammatory signals (cytokines). Environment, genes, habits and gene-switching (epigenetic) factors add to the risk. The result is lost attachment, lost bone, and damage to the ligament, root surface and bone around the tooth.</p>
<p>Deep cleaning targets the <b>bacteria</b>, yet bacteria cause only about <b>25%</b> of the damage. About <b>75%</b> comes from the body's own inflammatory signals and bone-dissolving cells (<b>osteoclasts</b>). Bacteria bring toxins (<b>endotoxin</b>, also called lipopolysaccharide), not osteoclasts. Removing the bacteria calms the body's response. Some patients still have disease after good home care and the best cleaning or surgery. For them, drugs can calm the body's response directly. That's <b>host modulation</b>, or "periodontal medicine," which Dr. Litz covers later. Bacteria coat tartar and live inside its tiny channels, and tartar and plaque also act as <b>irritants</b> the body reacts to.</p>
<p>The goals of removing them: <b>less inflammation</b>, a shift in the pocket bacteria from the harmful <b>gram-negative</b> kind toward <b>gram-positive</b> (healthy mouths still have bacteria, just friendlier ones), and <b>stopping the disease from getting worse</b>. Deep cleaning <b>doesn't undo the damage</b>. Lost bone and attachment stay lost, which is why periodontitis is called irreversible. And <b>getting rid of pockets is not the reason</b> for deep cleaning, even though pockets do shrink. A pocket is a space the patient can't clean, full of more harmful bacteria. Phase I changes that environment.</p>
<h5>How pockets shrink, and why you check at 4-6 weeks</h5>
<p>Two things make a pocket shallower. At the <b>top</b>: inflamed gum is swollen with extra cells and fluid. As it calms down the gum shrinks, which you measure as <b>more recession</b>. At the <b>bottom</b>: disease had broken both the thin seal of gum cells against the tooth (the junctional epithelium, which is why the probe sank deeper) and the fibers holding the gum to the root. After cleaning, both <b>reattach</b> to the clean root. You measure in two dimensions, but the disease is three-dimensional.</p>
<p>The healing timeline: the <b>gum seal (junctional epithelium) takes 7-10 days</b>, the <b>fiber reattachment takes 4-6 weeks</b>, and the fibers <b>mature and line up over 3-6 months</b>. That's why the patient comes back at <b>4-6 weeks</b>. You see the full result by then, and research shows waiting longer doesn't shrink the pocket any further. The deck says it a bit differently: pockets shrink most in the first 4 weeks, the seal between gum and tooth re-forms in <b>2-4 weeks</b>, and healing can keep going for <b>9-12 months</b>. Know both. The deck's "a 6 mm pocket might become 5 or 4.5" numbers are just for a sense of scale. She said you <b>don't need to memorize</b> them.</p>
<h5>The words (and the billing codes)</h5>
<p><b>Scaling</b> removes soft and hard buildup from teeth, roots and any bridges or dentures, <b>both above and below the gum</b>. If you're asked whether scaling is above or below the gum, the answer is both. <b>Root planing</b> stays <b>below the gum</b> and only works on roots. It smooths away rough, tartar-packed or contaminated root surface until there are no ridges, rough spots or catches. In practice you do both together.</p>
<p>A <b>prophylaxis</b> ("prophy") is a <i>preventive</i> cleaning, not a treatment, for someone who has <b>never had periodontitis</b> (healthy gums or gingivitis). Tartar a little below the gum doesn't mean periodontitis: everyone has a shallow crevice, and tartar 1-2 mm down is removed as part of the prophy. <b>Periodontal maintenance</b> is <i>ongoing support</i> for someone <b>already treated for periodontitis</b>, to keep the disease from coming back, with their home care checked every visit. The two terms don't mean the same thing. A maintenance patient with mostly 1-3 mm pockets, a few leftover 4s and one 5 can stay on maintenance if their hygiene is good, those spots don't bleed, the gums look healthy and the X-rays show no new bone loss. <b>Deep cleaning just the few leftover deep pockets</b> is officially part of maintenance.</p>
<p><b>Scaling in the presence of gingival inflammation (D4346)</b> sits between a prophy and a deep cleaning. It's for someone <b>never diagnosed with periodontitis</b>, with no bone loss, but with heavy, widespread gum inflammation caused by plaque and tartar, so a simple prophy doesn't cover the work. At school it's done with perio faculty or a resident and gets a <b>Phase I re-evaluation</b>. The class case was a young patient (20s to early 30s) with a bridge of tartar on the tongue side of the teeth. What looked like bone loss around the premolars and front of the molars came from premolars pulled for braces and the tipping that followed, not from periodontitis. Diagnosis: <b>widespread gum inflammation on a reduced periodontium in a patient without periodontitis</b> (the deck calls it gingivitis on a reduced periodontium), treated with D4346. That patient had debridement, charting and treatment all in one visit. <b>Full-mouth debridement (D4355)</b> is a rough clean-out so the proper exam can happen at a later visit.</p>
<h5>What the evidence says about how to do it</h5>
<p>Splitting the deep cleaning into <b>several visits</b> doesn't really help: tartar left behind after several visits stays for the same reasons it stays after one (Anderson 1996). <b>Hand instruments and ultrasonic (powered) scalers</b> work about the same for shrinking pockets and regaining attachment, and adding under-the-gum rinsing with chlorhexidine, saline or peroxide adds nothing. In pockets 5 mm or deeper, the root isn't fully cleaned about <b>65% of the time</b> (Greenstein 2000).</p>
<p>What makes it hard, as she taught it: deeper pockets are harder to reach, though a 5 mm pocket doesn't mean tartar gets left every time. <b>Deep cleaning is done blind</b>: you work by feel. Some bacteria <b>swim into the gum lining</b>, while cleaning only reaches the pocket (and it doesn't reliably wipe out <i>A. actinomycetemcomitans</i>). <b>Fillings and crowns</b> with overhanging, below-the-gum, open or rough edges collect plaque and are hard to clean around. <b>Furcations</b> and the natural <b>grooves and dips</b> in roots block access. Trying hard for a smooth root can take off too much root surface (<b>cementum</b>) and make teeth <b>sensitive</b>. And results depend on the patient's <b>home care</b> and the clinician's <b>skill</b>, which improves with practice.</p>
<h5>The re-evaluation, and when it "fails"</h5>
<p>Check back at <b>4-6 weeks</b>: plaque scores, signs of inflammation, bleeding, pocket depths, recession, attachment, looseness, furcations and pus. This is where the decision about surgery is made. If there's still inflammation and the numbers haven't improved, check whether <b>leftover tartar</b> is the reason. You'll often feel it with the probe while re-measuring. If so, remove it (no charge) and re-check in <b>two weeks</b>. If you already got all the tartar the first time, <b>more rounds of deep cleaning won't help</b>. What helps is <b>better home care</b>.</p>
<p>"Failure of therapy" is a harsh phrase, because so much is out of your control. The body's response affects healing as well as disease. A <b>smoker</b> or someone with <b>uncontrolled diabetes</b> may not get the same short- or long-term result from your best cleaning. The deck's approach when Phase I doesn't work: look at how the gums responded, what tartar is left, the health history and risk factors, and maybe a plaque culture. Then choose antibiotics or antimicrobials, host-modulation drugs, a repeat cleaning, another re-evaluation, or <b>Phase II</b>, which is <b>surgery to get rid of pockets</b>.</p>
<h5>The instruments (not on the midterm)</h5>
<p>Dr. Kaur's email says instruments, ultrasonic scalers and polishing won't be on the midterm. In the slides they come after failure of therapy. The email is only about the midterm, so this can still show up on the final and in the hands-on instrument check.</p>
<p>She kept instruments light on purpose. They get covered in detail in the upcoming <b>PCD</b> sessions, and you don't need the numbers yet, though you will later. For now, your daily kit has three groups. The <b>exam tools</b> are the mirror, the gum probe, the Nabers probe for furcations, and a <b>gum explorer</b>. This isn't the cavity explorer. You use it after cleaning to check that roots feel smooth with no catches. Then come <b>scalers</b> and <b>curettes</b>. Every instrument has a handle, a shank (the neck) and a blade.</p>
<p><b>Scalers</b> are mostly for above the gum. They reach only a little way under it (the deck says 1-2 mm; in class she said about 2-3, noting sources vary). Their strokes are <b>short, strong and fast</b>. <b>Curettes</b> go deep into the pocket with <b>longer, slightly lighter</b> strokes that take more time, though stubborn tartar can still need real pressure. The key difference is the blade. A scaler cuts on <b>both sides</b>. A Gracey curette cuts on <b>one side</b> only, so below the gum the side facing the gum can't cut it. Almost every curette in your kit is a <b>Gracey</b>, marked <b>SG</b>, each shaped for one area and cutting on one side. The one <b>SC</b> instrument is the <b>universal curette</b>, which, like a scaler, cuts on both sides.</p>
<p>The clinic has <b>piezoelectric</b> ultrasonic (vibrating) scalers along with hand instruments. They work below the gum too, but they <b>can't root plane</b>, so they won't leave the root smooth. Use them together: <b>ultrasonic</b> to knock off the heavy tartar, then <b>hand instruments</b>, then the <b>ultrasonic again</b> so its water spray flushes out the pocket.</p>
<p>From the deck, for later: gum hand instruments are mirrors, explorers, probes, scaling and root-planing tools, and polishing tools. The <b>mirror</b> lets you see indirectly, bounces light in, and holds the cheek or tongue back. The <b>ODU 11/12 explorer</b> is run over every surface of every tooth to feel for rough root. Its neck is shaped like the Gracey 11/12. Slide it in with the lower neck parallel to the tooth until you feel the slight resistance of the gum attachment, then stroke up-and-down and side-to-side with the side of the tip. The <b>UNC-15</b> probe is 15 mm long. The exam kit is probe, explorer, Nabers probe, mirror and cotton pliers.</p>
<p>A <b>sickle scaler</b> has a pointed tip, a triangle-shaped cross-section and two cutting edges, and shouldn't be used much on exposed root. Hook it under the ledge of tartar and <b>pull</b> with short, strong strokes using the lower third of the blade. The <b>H6/7</b> (straight neck) is for front teeth and the cheek/tongue sides of molars. The <b>S204SD9</b> (neck bent at a right angle) is for the spaces between back teeth. Both are held at about 80° to the root. A <b>curette</b> has a rounded tip and a half-moon cross-section and works above and below the gum. A universal curette (<b>Columbia 13/14</b>) has two cutting edges. An area-specific <b>Gracey</b> has one.</p>
<p><b>Gracey curettes</b> have a 70° blade angle, one cutting edge (the lower one), and a rounded back so they don't cut the gum. The lower neck should sit parallel to the tooth. Slide it in nearly flat (closed), then open it to <b>70-80°</b> against the root to work. Which one goes where: <b>3/4</b> (or 1/2, 7/8) for all surfaces of front teeth (the demo slide adds premolars) and deep tartar. <b>11/12</b> for the mesial (front-facing) surfaces of back teeth plus the cheek/tongue sides of molars. <b>15/16</b> as another mesial tool for back teeth. <b>13/14</b> for the distal (back-facing) surfaces of back teeth. The 13/14 has more bends in its neck than the 11/12 and is pulled from root toward crown or from back toward front.</p>
<p><b>Ultrasonic scalers</b> come in two types. <b>Magnetostrictive</b>: electricity makes the nickel-iron metal stack in the insert change shape and vibrate in an oval-to-circular pattern, about 18,000-42,000 times a second, so every side of the tip can clean. <b>Piezoelectric</b>: electricity vibrates crystals in the handpiece, the tip moves back and forth in a line, and mainly its sides do the work. For <b>implants</b>, probes are marked in 3 mm bands (3-6-9-12 or 3-6-8-11), and the listed tools are front and back sickle scalers plus the Columbia 4R/4L.</p>
<h5>Technique (not on the midterm)</h5>
<div class="pearl"><b>Don't forget (the deck's own emphasis):</b> modified pen grasp and a finger rest.</div>
<p>A finger rest (fulcrum) steadies your hand. There are four: <b>conventional</b> (on the teeth right next to where you're working), <b>cross-arch</b> (on the other side of the same jaw), <b>opposite-arch</b> (on the other jaw), and <b>finger-on-finger</b> (on the index finger or thumb of your other hand). How you fit the instrument to the tooth depends on the gum (tough and fibrous vs. puffy and bleeding), how bad the disease is (how easily the gum moves aside, the space between teeth), and how stuck-on the tartar is.</p>
<p>An <b>exploratory stroke</b> is light, with the tool fitted to the tooth, to map the pocket and find tartar. A <b>working stroke</b> uses a firm grip with pressure through the tip. <b>Scaling</b> strokes are short, overlapping, strong and controlled. <b>Root-planing</b> strokes are longer and lighter, like shaving. You check your work during the visit by feeling the root with an explorer, and at re-evaluation by how the gums respond: less redness, swelling and bleeding. The patient's home care weighs heavily on that result. The spots most often missed are the <b>CEJ, furcation entrances, line angles</b> (corners of the teeth), and hard-to-reach areas, especially the <b>back surfaces of back teeth</b>.</p>
<h5>To polish or not to polish (not on the midterm)</h5>
<p>For polishing: it removes stain that brushing and scaling leave behind, preps teeth for sealants, fluoride gels and varnishes, and patients like it. Against: 30 seconds with pumice can take off up to <b>4 µm of enamel</b>, and that outer layer has the most fluoride. A coarse paste can leave the surface rougher than before. Steady pressure from a fast-spinning rubber cup can hurt and may heat the nerve. A rubber cup with pumice for 2 minutes can strip the thin lining inside the gum pocket completely, and pumice can get pushed under the gum. If you polish, use a low-abrasion paste on a slow handpiece with little heat, hold the cup at 90° to the tooth, and press lightly on and off. (Polishing comes from the deck. It wasn't covered in the recorded class.)</p>
`;

READINGS_PLAIN['resective-furcation'] = `
<p>This session hasn't been lectured yet. These notes come only from the class exam-review guide.</p>
<p>A <b>furcation</b> is the spot where a tooth's roots split apart, and its shape differs by tooth. On <b>upper molars</b>, the entrance between the roots on the mesial (front) side is 3 mm from the CEJ, the buccal (cheek-side) entrance is 3.5 mm and is the narrowest of the three, and the distal (back) entrance is farthest at 5 mm. The first molar has a shorter root trunk (the solid part before the roots split) than the second molar, so bone loss reaches its furcation sooner. On <b>lower molars</b>, the cheek-side entrance is closer to the CEJ (just over 3 mm) and narrower (under 0.75 mm), while the tongue-side entrance sits both deeper (over 4 mm) and wider (over 0.75 mm). The mesial root is wider cheek-to-tongue, pinched in the middle like an hourglass, and the distal root can have grooves too. <b>Upper premolars</b> have two roots about 40% of the time, with a shallow 0.5 mm groove on the cheek-side root where they split, an entrance about 8 mm from the CEJ, and an entrance about 0.7 mm wide.</p>
<p>Treatment steps up with the furcation class. <b>Class I</b>: deep cleaning plus reshaping the entrance (furcation plasty). <b>Class II</b>: add opening a tunnel through the furcation, removing a root, pulling the tooth, or, on lower molars specifically, guided tissue regeneration (GTR, regrowing bone under a barrier membrane). <b>Class III</b>: tunnel, root removal, or extraction. Bone shape around a tooth is called <b>positive</b> (the bone between teeth sits higher than on the cheek and tongue sides; the normal pattern), <b>flat</b>, or <b>reverse/negative</b> (the bone between teeth sits lower, making a crater). Reverse shape is what bone-reshaping (resective) surgery is designed to fix.</p>
`;

READINGS_PLAIN['periodontal-regeneration'] = `
<p>This session hasn't been lectured yet. These notes come only from the class exam-review guide.</p>
<p>Regrowing lost bone and attachment works best in a specific kind of defect: a vertical bone hole deeper than 3 mm, with walls at less than 25° to the root (narrow, not wide and shallow), ideally with three bony walls still standing. A 1-wall defect and thin, scalloped gums both make the result less predictable. Three biologic add-ons come up again and again. <b>Enamel matrix derivative (EMD)</b> is an extract of amelogenins, the proteins that help form enamel and attach the tooth while it develops; used alone or with a graft, it works about as well as GTR (a barrier membrane). <b>rhPDGF-BB</b> is a lab-made growth factor that calls in and multiplies bone and ligament cells and helps new blood vessels grow. A <b>β-TCP scaffold</b> is simpler: a bone-friendly framework that keeps the gum from collapsing into the hole and holds the blood clot steady while bone fills in.</p>
`;

READINGS_PLAIN['implants-perio'] = `
<p>This session hasn't been lectured yet. These notes come only from the class exam-review guide.</p>
<p>A <b>successful implant</b> doesn't move, shows no dark ring around it on X-ray, causes no pain, infection, numbness or nerve problems, and loses less than 0.2 mm of bone height per year after its first year of use. Three patient factors matter. <b>Smoking</b> hurts implants three ways. Bacteria: <i>A. actinomycetemcomitans</i>, <i>P. gingivalis</i> and <i>B. forsythus</i> are harder to clear. Immune system: neutrophils (first-responder white cells) move and eat bacteria poorly, there are fewer helper T cells and B cells, and more of the inflammatory signals IL-6 and TNF-alpha and the tissue-breaking enzyme collagenase. Healing: nicotine slows new blood vessel growth in gum and bone and raises the chance the implant fails. <b>Diabetes</b> only matters when it's poorly controlled: well-controlled diabetes adds no implant risk, but poorly controlled diabetes rules implants out. <b>Genetics</b> multiplies risk: certain IL-1 gene variants make the body overreact to bacteria, and that gene plus smoking together raises peri-implantitis (gum disease around implants) risk more than the two would add up to separately.</p>
`;

READINGS_PLAIN['antibiotics-host-mod'] = `
<p>This session hasn't been lectured yet. These notes come only from the class exam-review guide.</p>
<p>In gum care, antibiotics are always an <b>add-on</b> (to an acute infection, aggressive or stubborn periodontitis, or regular or surgical treatment), never the treatment by themselves. <b>Amoxicillin</b> and <b>Augmentin</b> (amoxicillin plus clavulanic acid, which blocks the enzyme bacteria use to resist it) kill a broad range of bacteria. Cephalosporins work in a similar way. <b>Clindamycin</b> blocks bacterial protein-making (the 50S ribosome) and is known for causing a serious gut infection, pseudomembranous colitis. <b>Tetracycline</b> stops bacteria from growing rather than killing them, blocks the 30S ribosome, and is the pick when <i>A. actinomycetemcomitans</i> is the main germ. Dairy and antacids block its absorption, and it stains developing teeth. The <b>macrolides</b> (erythromycin, azithromycin, clarithromycin) block the 50S ribosome and stop growth. Azithromycin is taken away from food, and clarithromycin is avoided in pregnancy. <b>Metronidazole</b> is the odd one out: it kills, works only on bacteria that can't live with oxygen (like spirochetes), and is the specific drug for ANUG (a painful, fast-destroying gum infection), often paired with amoxicillin. <b>Ciprofloxacin</b> blocks the enzyme bacteria use to copy DNA, is absorbed better <i>with</i> food (the opposite of azithromycin), and can cause sun-sensitivity reactions.</p>
<p><b>Drugs placed right into the pocket</b> are for sites that didn't respond to Phase I, or for a single problem spot in an otherwise stable maintenance patient. <b>PerioChip</b> is chlorhexidine in a gelatin chip. <b>Atridox</b> is doxycycline in a gel that dissolves; no brushing, flossing or eating at the site for 7 days. <b>Arestin</b> is minocycline microspheres; no brushing for 12 hours and no flossing for 10 days. <b>Host modulation</b> works on the body's response instead of the bacteria. NSAIDs (like ibuprofen) block PGE2, a signal that drives bone breakdown, but must be taken daily. Bisphosphonates slow bone breakdown but carry a risk of jawbone death (osteonecrosis). <b>Periostat</b> is a dose of doxycycline too low to kill bacteria; it works by blocking collagenase, the enzyme that breaks down gum tissue.</p>
`;

READINGS_PLAIN['perio-plastic-esthetics'] = `
<p>This session hasn't been lectured yet. These notes come only from the class exam-review guide.</p>
<p>Recession gets more common with age and shows up most on the cheek side of upper molars and lower front teeth. It's graded with the same RT1/RT2/RT3 system from Session 1, because that grade decides whether covering the root is worth trying. Gum grafts come from two places. <b>From the patient's own palate</b>: a connective tissue graft (<b>CTG</b>, no surface layer, tucked under a flap) or a free gingival graft (<b>FGG</b>, surface layer plus connective tissue, left uncovered). <b>From a donor</b>: most often acellular dermal matrix (<b>ADM</b>), which works a little less well than the patient's own tissue but spares them a second wound. A high, deep palate leaves the most room for error when harvesting, and clinicians sometimes take a thick, FGG-type piece on purpose and use it as a CTG, because a thicker piece is easier to cut and heals well tucked under a flap.</p>
<p>Too much gum is treated according to its cause. A <b>pseudopocket</b> (deep only because the gum is swollen) needs better hygiene and a cleaning. <b>Drug-induced overgrowth</b> needs the extra gum cut away (gingivectomy), better hygiene, and a talk with the physician about the medication. <b>Uneven gum lines</b> or a <b>gummy smile</b> call for a gingivectomy or an apically positioned flap (moving the gum down to a lower position). <b>Altered passive eruption</b> (gum that never moved back down after the teeth came in) is read two ways: how much gum there is (Type 1: a wide band, with the gum-lining border below the bone crest; Type 2: normal width, border at the CEJ) and how close the bone sits to the CEJ (Subcategory A: more than 1 mm away; B: right up close). Only Type 1A gets a gingivectomy alone and only Type 2A an apically positioned flap alone. Both B types need the flap plus bone reshaping, because the bone itself is the problem.</p>
<p>For looks: a longer-than-usual lower third of the face suggests the upper jaw grew too far down (vertical maxillary excess). The upper lip at rest is about 20-22 mm in women and 22-24 mm in men and lifts about 6-8 mm in a full smile. The lateral incisor's gum edge sits about 1 mm lower than a line through the central incisor and canine gum edges. Tooth widths step down from about 1.6 units (central) to 1 unit (lateral) to 0.6 units (the visible half of the canine). Treatments: altered passive eruption gets crown lengthening plus restorations; vertical maxillary excess gets braces, jaw surgery, or gum surgery depending on severity; an overly mobile lip gets Botox or lip-repositioning surgery; and a lip that is simply short has no reliably good fix.</p>
`;

var STATE_KEY = 'perio-d2-compendium-state-v1';
function defaultState(){
  return {
    answered:{},          // qid -> {correct:bool, seen:int, lastCorrect:bool}
    streak:0, bestStreak:0, totalCorrect:0, totalSeen:0,
    achievements:{},
    theme:null,
    lastActiveDate:null,
    activeDates:{},       // 'YYYY-MM-DD' -> true
    ui:{ mode:'compendium', view:'course-info', lec:'diagnosis-tx-planning', review:'all', level:'full' },
    arcade:{ best:{}, plays:{}, muted:false }
  };
}
function loadState(){
  var d = defaultState();
  try{
    var raw = localStorage.getItem(STATE_KEY);
    if(raw){
      var saved = JSON.parse(raw);
      for(var k in saved){ if(saved.hasOwnProperty(k)) d[k] = saved[k]; }
    }
  }catch(e){}
  var base = defaultState();
  ['ui','arcade'].forEach(function(k){ if(!d[k] || typeof d[k] !== 'object') d[k] = base[k]; for(var kk in base[k]) if(!(kk in d[k])) d[k][kk] = base[k][kk]; });
  if(!d.answered) d.answered = {};
  if(!d.activeDates) d.activeDates = {};
  if(!d.achievements) d.achievements = {};
  return d;
}
function saveState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }catch(e){} }
var STATE = loadState();

function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return dateKey(new Date()); }
function touchActiveDay(){ var k = todayKey(); STATE.activeDates[k] = true; STATE.lastActiveDate = k; }
function currentStreakDays(){
  var n = 0, d = new Date();
  while(STATE.activeDates[dateKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function daysUntil(iso){
  if(!iso) return null;
  var ex = new Date(iso + 'T08:00:00'), now = new Date();
  var a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var b = new Date(ex.getFullYear(), ex.getMonth(), ex.getDate());
  return Math.round((b - a) / 864e5);
}

];
LECTURES.forEach(function(l){ ACHIEVEMENTS.push({ id:'mastery-'+l.id, name:'Session '+l.num+' Mastered', cond:{type:'topicPercent', lec:l.id, value:100} }); });

function lectureProgress(lecId){
  var qs = QUESTIONS_BY_LECTURE[lecId] || [], correct = 0, seen = 0;
  qs.forEach(function(q){ var a = STATE.answered[q.id]; if(a){ seen++; if(a.correct) correct++; } });
  return { correct:correct, seen:seen, total:qs.length, pct: qs.length ? Math.round(100*correct/qs.length) : 0 };
}
function checkAchievements(){
  var newly = [];
  ACHIEVEMENTS.forEach(function(a){
    if(STATE.achievements[a.id]) return;
    var met = false;
    if(a.cond.type === 'totalCorrect') met = STATE.totalCorrect >= a.cond.value;
    else if(a.cond.type === 'streak') met = STATE.streak >= a.cond.value;
    else if(a.cond.type === 'topicPercent'){ var p = lectureProgress(a.cond.lec); met = p.total > 0 && p.pct >= a.cond.value; }
    if(met){ STATE.achievements[a.id] = true; newly.push(a); }
  });
  if(newly.length){ saveState(); newly.forEach(function(a){ showToast(icon('medal') + ' Achievement: ' + escHtml(a.name)); }); }
  return newly;
}

/* ---------- THE one answer choke point (every mode and every arcade game that uses the bank) ---------- */
function recordAnswer(qid, lecId, correct, choice){
  touchActiveDay();
  var prev = STATE.answered[qid] || {correct:false, seen:0, lastCorrect:null};
  prev.seen += 1; prev.lastCorrect = correct;
  if(correct && !prev.correct) STATE.totalCorrect += 1;
  if(correct) prev.correct = true;
  STATE.answered[qid] = prev;
  STATE.totalSeen += 1;
  if(correct){ STATE.streak += 1; STATE.bestStreak = Math.max(STATE.bestStreak, STATE.streak); } else STATE.streak = 0;
  saveState();
  checkAchievements();
  renderHeaderMeta();
  document.dispatchEvent(new CustomEvent('perio:answered', { detail:{ qid:qid, lec:lecId, correct:correct, choice:(typeof choice === 'number' ? choice : null) } }));
}
