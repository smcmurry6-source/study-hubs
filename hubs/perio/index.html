var CLASS_ROW = '<div class="qcard-classdata-row"><span class="qcard-classdata-result" data-role="classdata-result">Loading class data…</span></div>';
function qCardHTML(q){
  var lec = LECTURE_BY_ID[q.lec], body = '';
  if(q.type === 'mcq'){
    /* Choices render in a fresh random order every time; data-idx keeps the ORIGINAL index,
       which is all the handler compares against (every MCQ is authored with the key first). */
    body += '<div class="qcard-choices" data-qtype="mcq">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-qid="'+q.id+'" data-idx="'+i+'">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div><div class="qcard-explain" data-role="explain" id="explain-'+q.id+'"><div class="qx-body">'+(q.ex?escHtml(q.ex):'')+'</div>'+CLASS_ROW+'</div>';
  } else if(q.type === 'multi'){
    delete MULTI_STATE[q.id];
    body += '<div class="qcard-choices" data-qtype="multi" data-qid="'+q.id+'">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice multi" data-qid="'+q.id+'" data-multi-idx="'+i+'" aria-pressed="false">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div><div class="qcard-reveal-btn" data-role="check-wrap"><button type="button" class="btn sm" data-action="multi-check" data-qid="'+q.id+'">Check answer</button></div>' +
      '<div class="qcard-explain" data-role="explain" id="explain-'+q.id+'"><div class="qx-body">'+(q.ex?escHtml(q.ex):'')+'</div>'+CLASS_ROW+'</div>';
  } else if(q.type === 'recall'){
    body += '<div class="qcard-reveal-btn" data-role="reveal-wrap"><button type="button" class="btn sm" data-action="reveal" data-qid="'+q.id+'">'+icon('eye')+'Show answer</button></div>' +
      '<div class="qcard-explain" data-role="explain" id="explain-'+q.id+'"><div class="qx-body">'+escHtml(q.answer)+(q.ex?('<br><br>'+escHtml(q.ex)):'')+'</div>'+CLASS_ROW+'</div>' +
      '<div class="qcard-grade-btns" data-role="grade-wrap" style="display:none">' +
      '<button type="button" class="good" data-action="grade" data-grade="good" data-qid="'+q.id+'">I had it right</button>' +
      '<button type="button" class="bad" data-action="grade" data-grade="bad" data-qid="'+q.id+'">I missed it</button></div>';
  } else if(q.type === 'sequence'){
    /* a fresh render means fresh, unpicked buttons: never carry picks over from an earlier render */
    delete SEQ_STATE[q.id];
    body += '<div class="qcard-seq-steps" data-qtype="sequence" data-qid="'+q.id+'">';
    shuffled(q.steps.map(function(s,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-step-idx="'+i+'" data-qid="'+q.id+'">'+escHtml(q.steps[i])+'</button>';
    });
    body += '</div><div class="qcard-explain" data-role="explain" id="explain-'+q.id+'"><div class="qx-body">'+(q.ex?escHtml(q.ex):'')+'</div>'+CLASS_ROW+'</div>';
  } else if(q.type === 'match'){
    delete MATCH_STATE[q.id];
    body += '<div class="qcard-match-cols" data-qtype="match" data-qid="'+q.id+'"><div class="qcard-match-col" data-side="left">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-side="left" data-pair-idx="'+i+'" data-qid="'+q.id+'">'+escHtml(q.pairs[i][0])+'</button>'; });
    body += '</div><div class="qcard-match-col" data-side="right">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-side="right" data-pair-idx="'+i+'" data-qid="'+q.id+'">'+escHtml(q.pairs[i][1])+'</button>'; });
    body += '</div></div><div class="qcard-explain" data-role="explain" id="explain-'+q.id+'"><div class="qx-body">'+(q.ex?escHtml(q.ex):'')+'</div>'+CLASS_ROW+'</div>';
  }

  return '<div class="qcard tag-'+lec.tag+'" data-qid="'+q.id+'" data-qtype="'+q.type+'">' + qMeta(q) +
    pboxHTML(q) + '<p class="qcard-stem">'+escHtml(q.stem)+'</p>' + hint + body + '</div>';

function pboxHTML(q){

  return '<div class="pbox"><div class="pbox-head">'+icon('notes')+'Patient box</div><dl>' + q.pbox.map(function(r){ return '<dt>'+escHtml(r[0])+'</dt><dd>'+escHtml(r[1])+'</dd>'; }).join('') + '</dl></div>';

/* Multiple-answer partial credit (Canvas-style): each correct pick earns 1/n, each wrong pick costs 1/n, floor 0.
   The course's exact partial-credit rule isn't published; this is the common convention. */
var MULTI_STATE = {};
function multiScore(q, picks){
  picks = picks || [];
  var hit = picks.filter(function(i){ return q.correct.indexOf(i) > -1; }).length, wrong = picks.length - hit;
  return Math.max(0, (hit - wrong) / q.correct.length);
}
function markExplain(qid){ var el = document.getElementById('explain-'+qid); if(el && el.textContent.trim()) el.classList.add('shown'); }

function wireQuestionContainer(container){
  if(!container || container.__wired) return;
  container.__wired = true;
  container.addEventListener('click', function(e){
    var mcqBtn = e.target.closest('.qcard-choices[data-qtype="mcq"] .qcard-choice');
    if(mcqBtn){
      var q = QUESTIONS_BY_ID[mcqBtn.getAttribute('data-qid')];
      var wrap = mcqBtn.closest('.qcard-choices');
      if(wrap.getAttribute('data-answered') === 'true') return;
      wrap.setAttribute('data-answered','true');
      var idx = parseInt(mcqBtn.getAttribute('data-idx'),10), correct = idx === q.answer;
      wrap.querySelectorAll('.qcard-choice').forEach(function(b){
        b.disabled = true;
        var bi = parseInt(b.getAttribute('data-idx'),10);
        if(bi === q.answer) b.setAttribute('data-state','correct'); else if(b === mcqBtn) b.setAttribute('data-state','incorrect');
      });
      markExplain(q.id); recordAnswer(q.id, q.lec, correct, idx);
      return;
    }
    var mBtn = e.target.closest('.qcard-choices[data-qtype="multi"] .qcard-choice');
    if(mBtn){
      if(mBtn.closest('.qcard-choices').getAttribute('data-answered') === 'true') return;
      var mqid = mBtn.getAttribute('data-qid'), mi = parseInt(mBtn.getAttribute('data-multi-idx'),10);
      var mp = MULTI_STATE[mqid] = MULTI_STATE[mqid] || [];
      var at = mp.indexOf(mi);
      if(at > -1){ mp.splice(at,1); mBtn.removeAttribute('data-selected'); mBtn.setAttribute('aria-pressed','false'); }
      else { mp.push(mi); mBtn.setAttribute('data-selected','true'); mBtn.setAttribute('aria-pressed','true'); }
      return;
    }
    var seqBtn = e.target.closest('.qcard-seq-steps[data-qtype="sequence"] .qcard-choice');
    if(seqBtn){
      var sq = QUESTIONS_BY_ID[seqBtn.getAttribute('data-qid')];
      if(seqBtn.getAttribute('data-picked') === 'true') return;
      var picks = SEQ_STATE[sq.id] = SEQ_STATE[sq.id] || [];
      var oi = parseInt(seqBtn.getAttribute('data-step-idx'),10);
      picks.push(oi);
      seqBtn.setAttribute('data-picked','true'); seqBtn.disabled = true;
      seqBtn.textContent = picks.length + '. ' + sq.steps[oi];
      if(picks.length === sq.steps.length){
        var ok = picks.every(function(v,i){ return v === i; });
        seqBtn.closest('.qcard-seq-steps').querySelectorAll('.qcard-choice').forEach(function(b){
          var bi = parseInt(b.getAttribute('data-step-idx'),10);
          b.setAttribute('data-state', picks.indexOf(bi) === bi ? 'correct' : 'incorrect');
        });
        var ex = document.getElementById('explain-'+sq.id);
        var exb = ex && ex.querySelector('.qx-body');
        if(exb && !ok){ exb.innerHTML = '<b>Correct order:</b> ' + sq.steps.map(escHtml).join(' → ') + (sq.ex ? '<br><br>' + escHtml(sq.ex) : ''); }
        markExplain(sq.id); recordAnswer(sq.id, sq.lec, ok);
      }
      return;
    }
    var matchBtn = e.target.closest('.qcard-match-cols[data-qtype="match"] .qcard-match-item');
    if(matchBtn){
      var mq = QUESTIONS_BY_ID[matchBtn.getAttribute('data-qid')];
      if(matchBtn.getAttribute('data-state') === 'correct') return;
      var st = MATCH_STATE[mq.id] = MATCH_STATE[mq.id] || { selected:null, matched:{}, misses:0 };
      var side = matchBtn.getAttribute('data-side'), pi = parseInt(matchBtn.getAttribute('data-pair-idx'),10);
      if(!st.selected || st.selected.side === side){
        if(st.selected) st.selected.el.removeAttribute('data-selected');
        st.selected = { side:side, idx:pi, el:matchBtn }; matchBtn.setAttribute('data-selected','true'); return;
      }
      var other = st.selected.el, otherIdx = st.selected.idx; st.selected = null;
      if(otherIdx === pi){
        [other, matchBtn].forEach(function(b){ b.removeAttribute('data-selected'); b.setAttribute('data-state','correct'); b.disabled = true; });
        st.matched[pi] = true;
        if(Object.keys(st.matched).length === mq.pairs.length){ markExplain(mq.id); recordAnswer(mq.id, mq.lec, st.misses === 0); }
      } else {
        st.misses++;
        [other, matchBtn].forEach(function(b){ b.removeAttribute('data-selected'); b.setAttribute('data-state','incorrect'); });
        setTimeout(function(){ [other, matchBtn].forEach(function(b){ if(b.getAttribute('data-state') === 'incorrect') b.removeAttribute('data-state'); }); }, 550);
      }
      return;
    }
    var actionBtn = e.target.closest('[data-action]');
    if(actionBtn){
      var aq = QUESTIONS_BY_ID[actionBtn.getAttribute('data-qid')], card = actionBtn.closest('.qcard');
      if(!aq) return;
      if(actionBtn.getAttribute('data-action') === 'multi-check'){
        var picks = MULTI_STATE[aq.id] || [];
        if(!picks.length){ actionBtn.textContent = 'Pick at least one'; return; }
        var wrapM = card.querySelector('.qcard-choices[data-qtype="multi"]'); wrapM.setAttribute('data-answered','true');
        var sc = multiScore(aq, picks);
        wrapM.querySelectorAll('.qcard-choice').forEach(function(b){
          b.disabled = true; var bi = parseInt(b.getAttribute('data-multi-idx'),10), isC = aq.correct.indexOf(bi) > -1, was = picks.indexOf(bi) > -1;
          b.removeAttribute('data-selected'); if(was) b.setAttribute('data-picked','true');
          if(isC) b.setAttribute('data-state', was ? 'correct' : 'missed'); else if(was) b.setAttribute('data-state','incorrect');
        });
        card.querySelector('[data-role="check-wrap"]').innerHTML = '<span class="multi-score">Partial credit: '+Math.round(sc*100)+'%</span>';
        var exM = document.getElementById('explain-'+aq.id); if(exM){ exM.classList.add('shown'); var xb = exM.querySelector('.qx-body') || exM; if(!aq.ex) xb.innerHTML = '<b>Correct:</b> ' + aq.correct.map(function(i){ return escHtml(aq.choices[i]); }).join('; '); }
        recordAnswer(aq.id, aq.lec, sc === 1);
        return;
      }
      if(actionBtn.getAttribute('data-action') === 'reveal'){
        document.getElementById('explain-'+aq.id).classList.add('shown');
        card.querySelector('[data-role="reveal-wrap"]').style.display = 'none';
        card.querySelector('[data-role="grade-wrap"]').style.display = 'flex';
      } else if(actionBtn.getAttribute('data-action') === 'grade'){
        card.querySelectorAll('[data-action="grade"]').forEach(function(b){ b.disabled = true; });
        recordAnswer(aq.id, aq.lec, actionBtn.getAttribute('data-grade') === 'good');
      }
    }
  });
}

function renderReviewList(){
  var host = document.getElementById('rvList'); if(!host) return;
  var q = REVIEW.q.trim().toLowerCase();

  var html = '';
  secs.forEach(function(s){
    var card = refCardHTML(s);
    if(q){
      var tmp = document.createElement('div'); tmp.innerHTML = card;
      if(tmp.textContent.toLowerCase().indexOf(q) === -1) return;
      if(tmp.querySelector('table')){
        tmp.querySelectorAll('tbody tr').forEach(function(row){ if(row.textContent.toLowerCase().indexOf(q) === -1 && s.title.toLowerCase().indexOf(q) === -1) row.remove(); });
      }
      card = tmp.innerHTML;
    }
    html += card;
  });
  host.innerHTML = html || '<p class="empty">Nothing matches that search.</p>';
  if(REVIEW.hide) applyHide(host);
}

/* ---------- Question bank ---------- */
function filteredQuestions(){
  var s = QBANK_FILTER.search.trim().toLowerCase();
  return QUESTIONS.filter(function(q){
    if(QBANK_FILTER.lec === 'midterm'){ if(q.mid === false || !(LECTURE_BY_ID[q.lec].num <= MIDTERM_AFTER)) return false; }
    else if(QBANK_FILTER.lec !== 'all' && q.lec !== QBANK_FILTER.lec) return false;
    if(QBANK_FILTER.type === 'pbox'){ if(!q.pbox) return false; }
    else if(QBANK_FILTER.type !== 'all' && q.type !== QBANK_FILTER.type) return false;
    var a = STATE.answered[q.id];
    if(QBANK_FILTER.status === 'new' && a) return false;
    if(QBANK_FILTER.status === 'missed' && !(a && !a.correct)) return false;
    if(QBANK_FILTER.status === 'mastered' && !(a && a.correct)) return false;
    if(s){
      var hay = (q.stem + ' ' + (q.pbox ? q.pbox.map(function(r){ return r.join(' '); }).join(' ') : '') + ' ' + (q.choices||[]).join(' ') + ' ' + (q.answer && typeof q.answer === 'string' ? q.answer : '')).toLowerCase();
      if(hay.indexOf(s) === -1) return false;
    }
    return true;
  });
}
function renderQuestionBank(){
  var sel = function(v, cur){ return v === cur ? ' selected' : ''; };
  var h = '<div class="qfilters"><input type="search" id="qbSearch" placeholder="Search questions and answers…" value="'+escHtml(QBANK_FILTER.search)+'">' +
    '<select id="qbLec" aria-label="Session"><option value="all">All sessions</option><option value="midterm"'+sel('midterm',QBANK_FILTER.lec)+'>Midterm scope (S1-4, per Dr. Kaur)</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+sel(l.id,QBANK_FILTER.lec)+'>S'+l.num+' · '+escHtml(shortTitle(l))+'</option>'; }).join('') + '</select>' +
    '<select id="qbType" aria-label="Question type">' + [['all','All types'],['mcq','Multiple choice'],['multi','Multiple answer'],['pbox','Patient box cases'],['match','Matching'],['recall','Recall'],['sequence','Sequence']].map(function(o){ return '<option value="'+o[0]+'"'+sel(o[0],QBANK_FILTER.type)+'>'+o[1]+'</option>'; }).join('') + '</select>' +
    '<select id="qbStatus" aria-label="Status">' + [['all','Any status'],['new','Not tried yet'],['missed','Missed last time'],['mastered','Mastered']].map(function(o){ return '<option value="'+o[0]+'"'+sel(o[0],QBANK_FILTER.status)+'>'+o[1]+'</option>'; }).join('') + '</select>' +
    '<button type="button" class="btn sm ghost" id="qbShuffle">'+icon('shuffle')+'Shuffle</button></div>' +
    '<div class="qcount" id="qbCount" style="margin-bottom:12px"></div><div class="qlist" id="qbankList"></div>';
  content().innerHTML = h;

  ['qbLec','qbType','qbStatus'].forEach(function(id){ document.getElementById(id).addEventListener('change', function(e){ QBANK_FILTER[{qbLec:'lec',qbType:'type',qbStatus:'status'}[id]] = e.target.value; renderQuestionBankListOnly(); }); });
  document.getElementById('qbShuffle').addEventListener('click', function(){ QBANK_SHUFFLE = !QBANK_SHUFFLE; renderQuestionBankListOnly(); });

/* ---------- Mock exam ---------- */
/* Two kinds: the exam-format mock (mirrors Dr. Abou-Arraj's midterm email: ~40 questions, a few Patient Box cases,
   a few multiple-answer items with partial credit, matching, the rest multiple choice) and an MCQ-only sprint. */
var EXAM_FORMAT = { total:40, pbox:5, multi:5, match:3 };
var EXAM_STATE = { phase:'setup', pool:[], answers:{}, startedAt:null, finishedElapsed:0, timer:null, scope:'midterm', kind:'format' };
function scopeLecIds(scope){ return (scope === 'midterm' ? LECTURES.filter(function(l){ return l.num <= MIDTERM_AFTER; }) : LECTURES).map(function(l){ return l.id; }); }
function inScope(q, scope){ return scopeLecIds(scope).indexOf(q.lec) > -1 && !(scope === 'midterm' && q.mid === false); }
function examPool(scope){ return QUESTIONS.filter(function(q){ return q.type === 'mcq' && !q.pbox && inScope(q, scope); }); }
function roundRobin(qs, n){
  var by = {}; shuffled(qs).forEach(function(q){ (by[q.lec] = by[q.lec] || []).push(q); });
  var keys = shuffled(Object.keys(by)), out = [];
  while(out.length < n && keys.some(function(k){ return by[k].length; })) keys.forEach(function(k){ if(out.length < n && by[k].length) out.push(by[k].shift()); });
  return out;
}
function formatPool(scope){
  var all = QUESTIONS.filter(function(q){ return inScope(q, scope); });
  var pb = roundRobin(all.filter(function(q){ return q.pbox; }), EXAM_FORMAT.pbox);
  var mu = roundRobin(all.filter(function(q){ return q.type === 'multi' && !q.pbox; }), EXAM_FORMAT.multi);
  var ma = roundRobin(all.filter(function(q){ return q.type === 'match'; }), EXAM_FORMAT.match);
  var mc = roundRobin(examPool(scope), EXAM_FORMAT.total - pb.length - mu.length - ma.length);
  return shuffled(pb.concat(mu, ma, mc));
}
function formatElapsed(ms){ var s = Math.floor(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function startMockExam(size, kind){
  var pool = kind === 'format' ? formatPool(EXAM_STATE.scope) : shuffled(examPool(EXAM_STATE.scope)).slice(0, size);
  if(EXAM_STATE.timer) clearInterval(EXAM_STATE.timer);
  EXAM_STATE = { phase:'active', pool:pool, answers:{}, startedAt:Date.now(), finishedElapsed:0, timer:null, scope:EXAM_STATE.scope, kind:kind };
  renderCompendiumContent(); window.scrollTo({top:0});
}
function examAnswered(q){
  var a = EXAM_STATE.answers[q.id];
  if(a == null) return false;
  if(q.type === 'multi') return a.length > 0;
  if(q.type === 'match') return Object.keys(a).length > 0;
  return true;
}
function examPoints(q){
  var a = EXAM_STATE.answers[q.id];
  if(a == null) return 0;
  if(q.type === 'multi') return multiScore(q, a);
  if(q.type === 'match'){ var n = 0; q.pairs.forEach(function(p,i){ if(a[i] === i) n++; }); return n / q.pairs.length; }
  return a === q.answer ? 1 : 0;
}
function answeredCount(){ return EXAM_STATE.pool.filter(examAnswered).length; }
function updateExamProg(){ var pe = document.getElementById('examProg'); if(pe) pe.textContent = answeredCount() + ' / ' + EXAM_STATE.pool.length + ' answered'; }
function submitMockExam(){
  EXAM_STATE.finishedElapsed = Date.now() - EXAM_STATE.startedAt;
  if(EXAM_STATE.timer){ clearInterval(EXAM_STATE.timer); EXAM_STATE.timer = null; }
  EXAM_STATE.pool.forEach(function(q){ recordAnswer(q.id, q.lec, examPoints(q) === 1, q.type === 'mcq' ? EXAM_STATE.answers[q.id] : undefined); });
  /* for the shared widget's trophies (a 90%+ mock on 20 or more questions) */
  var nRight = EXAM_STATE.pool.filter(function(q){ return examPoints(q) === 1; }).length;
  document.dispatchEvent(new CustomEvent('sh:mock-done', { detail:{ correct:nRight, total:EXAM_STATE.pool.length } }));
  EXAM_STATE.phase = 'results'; renderCompendiumContent(); window.scrollTo({top:0});
}
var EXAM_KIND_LABEL = { mcq:'Multiple choice', multi:'Multiple answer', match:'Matching' };
function examCardHTML(q, n){
  var a = EXAM_STATE.answers[q.id], l = LECTURE_BY_ID[q.lec], body = '', note = '';
  if(q.type === 'multi'){
    note = '<div class="faint" style="font-size:.8rem;margin:-6px 0 8px">Select all that apply. Partial credit.</div>';
    body = '<div class="qcard-choices" data-qtype="examchoice">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){ var on = a && a.indexOf(i) > -1; body += '<button type="button" class="qcard-choice multi" data-exam-multi="'+i+'" data-qid="'+q.id+'" aria-pressed="'+!!on+'"'+(on?' data-selected="true"':'')+'>'+escHtml(q.choices[i])+'</button>'; });
    body += '</div>';
  } else if(q.type === 'match'){
    note = '<div class="faint" style="font-size:.8rem;margin:-6px 0 8px">Match each item. Each pair is scored separately.</div>';
    var rights = shuffled(q.pairs.map(function(p,i){ return i; }));
    body = '<div class="exam-match">' + shuffled(q.pairs.map(function(p,i){ return i; })).map(function(i){
      return '<label class="exam-match-row"><span>'+escHtml(q.pairs[i][0])+'</span><select data-exam-match="'+i+'" data-qid="'+q.id+'"><option value="">Choose…</option>' +
        rights.map(function(r){ return '<option value="'+r+'"'+(a && a[i] === r ? ' selected' : '')+'>'+escHtml(q.pairs[r][1])+'</option>'; }).join('') + '</select></label>';
    }).join('') + '</div>';
  } else {
    body = '<div class="qcard-choices" data-qtype="examchoice">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-choice" data-exam-choice="'+i+'" data-qid="'+q.id+'"'+(a===i?' data-selected="true"':'')+'>'+escHtml(q.choices[i])+'</button>'; });
    body += '</div>';
  }
  return '<div class="qcard tag-'+l.tag+'"><div class="qcard-top"><span class="chip src">Q'+n+'</span>'+sessChip(l)+(q.pbox?'<span class="chip src">Patient box</span>':'')+(q.type!=='mcq'?'<span class="chip src">'+EXAM_KIND_LABEL[q.type]+'</span>':'')+'</div>'+pboxHTML(q)+'<p class="qcard-stem">'+escHtml(q.stem)+'</p>'+note+body+'</div>';
}
function renderMockExam(){
  if(window.shTTS) window.shTTS.stop();
  var c = content();
  if(EXAM_STATE.phase === 'setup'){
    var mid = examPool('midterm').length, all = examPool('final').length, n = EXAM_STATE.scope === 'midterm' ? mid : all;
    var sizes = [10,20,40].filter(function(s){ return s < n; }).concat([n]);

    c.innerHTML = '<div class="card section-block"><div class="eyebrow">'+icon('timer')+'Mock exam</div><h2>Simulate exam conditions</h2><p class="muted" style="max-width:64ch">A running clock and no feedback until you submit. Anything you don\'t get full credit on lands in Weak Spots.</p>' +
      '<div class="seg" role="group" aria-label="Exam scope"><button type="button" data-exam-scope="midterm" aria-pressed="'+isMid+'">Midterm · S1-4</button><button type="button" data-exam-scope="final" aria-pressed="'+!isMid+'">Final · all 9</button></div>' +
      '<div class="exam-kinds"><button type="button" class="exam-kind primary" data-exam-action="start-format"><b>'+(isMid?'Midterm format':'Exam format')+' · '+EXAM_FORMAT.total+' questions</b><span>'+EXAM_FORMAT.pbox+' Patient Box cases, '+EXAM_FORMAT.multi+' multiple-answer (partial credit), '+EXAM_FORMAT.match+' matching, the rest multiple choice'+(isMid?'. Built to match Dr. Abou-Arraj\'s email; leaves out what Dr. Kaur said isn\'t on the midterm.':'.')+'</span></button></div>' +
      '<h3 style="margin:18px 0 8px;font-size:1rem">Or a multiple-choice sprint <span class="mono faint" style="font-size:.8rem">'+n+' in the pool</span></h3>' +
      '<div class="size-picks">' + sizes.map(function(s){ return '<button type="button" class="size-pick" data-exam-action="start" data-size="'+s+'"><b>'+s+'</b><span>'+(s===n?'every question':'questions')+'</span></button>'; }).join('') + '</div></div>';
    c.querySelectorAll('[data-exam-scope]').forEach(function(b){ b.addEventListener('click', function(){ EXAM_STATE.scope = b.getAttribute('data-exam-scope'); renderMockExam(); }); });
    return;
  }
  if(EXAM_STATE.phase === 'active'){
    c.innerHTML = '<div class="card section-block exam-bar"><div class="exam-toolbar"><span class="exam-progress" id="examProg">'+answeredCount()+' / '+EXAM_STATE.pool.length+' answered</span><span class="exam-timer" id="examTimer">0:00</span><button type="button" class="btn primary" data-exam-action="submit">Submit exam</button></div></div>' +
      '<div class="qlist" id="examList">' + EXAM_STATE.pool.map(function(q,i){ return examCardHTML(q, i+1); }).join('') + '</div>';
    document.getElementById('examList').addEventListener('change', function(e){
      var s = e.target.closest('[data-exam-match]'); if(!s) return;

      updateExamProg();

    EXAM_STATE.timer = setInterval(function(){ var el = document.getElementById('examTimer'); if(!el){ clearInterval(EXAM_STATE.timer); EXAM_STATE.timer = null; return; } el.textContent = formatElapsed(Date.now() - EXAM_STATE.startedAt); }, 1000);
    return;
  }
  var total = EXAM_STATE.pool.length, pts = 0, missed = [], byLec = {}, byKind = {};
  EXAM_STATE.pool.forEach(function(q){
    var p = examPoints(q); pts += p; if(p < 1) missed.push(q);

  c.innerHTML = h;

/* ---------- Weak spots ---------- */
var WEAK_DRILL_LEC = null;
function weakSpotStats(){
  return LECTURES.map(function(l){
    var qs = QUESTIONS_BY_LECTURE[l.id] || [], attempted = 0, mastered = 0;
    qs.forEach(function(q){ var a = STATE.answered[q.id]; if(a && a.seen){ attempted++; if(a.correct) mastered++; } });
    return { lec:l, total:qs.length, attempted:attempted, mastered:mastered, pct: attempted ? Math.round(100*mastered/attempted) : null, remaining: qs.length - mastered };
  });
}
function renderWeakSpots(){
  if(window.shTTS) window.shTTS.stop();
  var c = content();
  if(WEAK_DRILL_LEC === 'due'){
    var dq = (window.shSrsDue ? window.shSrsDue() : []).map(function(id){ return QUESTIONS_BY_ID[id]; }).filter(Boolean).slice(0, 30);
    c.innerHTML = '<div class="card section-block"><button type="button" class="btn sm ghost" data-weak-action="back">'+icon('arrowL')+'Weak Spots</button><h2 style="margin-top:10px">Due today</h2><p class="muted" style="margin:0;max-width:64ch">'+(dq.length ? dq.length + ' question' + (dq.length === 1 ? '' : 's') + ' to review. A miss brings a question back tomorrow; each right answer pushes it further out (1, 3, 7, 14, then 30 days).' : 'Nothing is due. Questions come back here a day after you miss them, and at growing gaps once you get them right.')+'</p></div>' +
      (dq.length ? '<div class="qlist" id="weakDrillList">' + dq.map(qCardHTML).join('') + '</div>' : '');
    if(dq.length) wireQuestionContainer(document.getElementById('weakDrillList'));
    return;
  }
  if(WEAK_DRILL_LEC){
    var lecIds = WEAK_DRILL_LEC === 'all' ? LECTURES.map(function(l){ return l.id; }) : [WEAK_DRILL_LEC];
    var qs = [];
    lecIds.forEach(function(id){ (QUESTIONS_BY_LECTURE[id]||[]).forEach(function(q){ var a = STATE.answered[q.id]; if(!a || !a.correct) qs.push(q); }); });
    qs = shuffled(qs);

  else h += '<div class="card section-block"><p style="margin:0">Everything you\'ve tried is mastered. Try a mock exam, or start a session you haven\'t touched.</p></div>';

/* ---------- Active recall (self-graded flashcards from the cram sheet + every review table) ---------- */
var RECALL_DECK = null, RECALL_ORDER = [], RECALL_FILTER = { source:'all', lec:'all' }, RECALL_TALLY = { good:0, bad:0 };
function buildRecallDeck(){
  if(RECALL_DECK) return RECALL_DECK;
  var deck = [];
  CRAM_CONTENT.forEach(function(c){
    var l = LECTURE_BY_ID[c.lec];
    deck.push({ id:'cram-'+c.lec, source:'cram', label:'Cram sheet', lec:c.lec, prompt:'Recall everything on the cram sheet for <b>'+escHtml(l.title)+'</b>.', answer:ulOf(c.points) });
  });
  var tmp = document.createElement('div');
  REF_SECTIONS.forEach(function(s){
    tmp.innerHTML = s.body();
    tmp.querySelectorAll('table.chart-table').forEach(function(t, ti){
      var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function(th){ return th.textContent; });
      t.querySelectorAll('tbody tr').forEach(function(row, ri){
        var cells = Array.prototype.map.call(row.querySelectorAll('td'), function(td){ return td.innerHTML; });
        if(cells.length < 2) return;
        deck.push({ id:'ref-'+s.id+'-'+ti+'-'+ri, source:'reference', label:s.title, lec:s.lec, prompt:cells[0] + ' <span class="faint" style="font-weight:500">· ' + escHtml(heads.slice(1).join(', ').toLowerCase()) + '</span>',
          answer: cells.slice(1).map(function(v,i){ return '<b>'+escHtml(heads[i+1]||'')+':</b> '+v; }).join('<br>') });
      });
    });
  });
  RECALL_DECK = deck; RECALL_ORDER = shuffled(deck.map(function(c){ return c.id; }));
  return deck;
}
function filteredRecall(){
  var byId = {}; buildRecallDeck().forEach(function(c){ byId[c.id] = c; });
  return RECALL_ORDER.map(function(id){ return byId[id]; }).filter(function(c){
    return c && (RECALL_FILTER.source === 'all' || c.source === RECALL_FILTER.source) && (RECALL_FILTER.lec === 'all' || c.lec === RECALL_FILTER.lec);
  });
}
function recallCardHTML(c){
  var l = LECTURE_BY_ID[c.lec];
  return '<div class="qcard tag-'+l.tag+'" data-rid="'+c.id+'"><div class="qcard-top">'+sessChip(l)+'<span class="chip src">'+escHtml(c.label)+'</span></div><p class="qcard-stem">'+c.prompt+'</p>' +
    '<div class="qcard-reveal-btn" data-role="reveal-wrap"><button type="button" class="btn sm" data-recall-action="reveal" data-rid="'+c.id+'">'+icon('eye')+'Show answer</button></div>' +
    '<div class="qcard-explain" data-role="explain" id="rexp-'+c.id+'">'+c.answer+'</div>' +
    '<div class="qcard-grade-btns" data-role="grade-wrap" style="display:none"><button type="button" class="good" data-recall-action="grade" data-grade="good">I knew it</button><button type="button" class="bad" data-recall-action="grade" data-grade="bad">I missed it</button></div></div>';
}
function recallTally(n){ return n + ' card' + (n===1?'':'s') + ' · knew it: ' + RECALL_TALLY.good + ' · missed: ' + RECALL_TALLY.bad; }
function renderActiveRecall(){
  if(window.shTTS) window.shTTS.stop();

  content().innerHTML = '<div class="card section-block"><div class="eyebrow">'+icon('cards')+'Active recall</div><p class="muted" style="margin:0 0 12px;max-width:64ch">Say the answer out loud, then reveal and grade yourself. Built from the cram sheet and every Review table; it doesn\'t touch your question-bank stats.</p>' +
    '<div class="qfilters" style="margin:0"><select id="rcSource">' + [['all','All sources'],['cram','Cram sheet'],['reference','Review tables']].map(function(o){ return '<option value="'+o[0]+'"'+(RECALL_FILTER.source===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('') + '</select>' +
    '<select id="rcLec"><option value="all">All sessions</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+(RECALL_FILTER.lec===l.id?' selected':'')+'>S'+l.num+' · '+escHtml(shortTitle(l))+'</option>'; }).join('') + '</select>' +
    '<button type="button" class="btn sm ghost" data-recall-action="shuffle">'+icon('shuffle')+'Shuffle</button><span class="qcount" id="rcTally">'+recallTally(cards.length)+'</span></div></div>' +
    '<div class="qlist" id="recallList">' + cards.map(recallCardHTML).join('') + '</div>';

function renderCompendium(){
  var panel = document.getElementById('panel-compendium');
  if(!panel.__built){
    panel.__built = true;
    panel.innerHTML = '<nav class="subtabs" id="compendium-subnav" role="tablist" aria-label="Compendium section"></nav><div id="compendium-content"></div>';

      var lb = e.target.closest('[data-goto-lecture]'); if(lb){ gotoLecture(lb.getAttribute('data-goto-lecture')); return; }
      var pr = e.target.closest('[data-practice]'); if(pr){ QBANK_FILTER = { search:'', lec:pr.getAttribute('data-practice'), type:'all', status:'all' }; setView('question-bank'); return; }

      var ec = e.target.closest('[data-exam-choice]');

        EXAM_STATE.answers[ec.getAttribute('data-qid')] = parseInt(ec.getAttribute('data-exam-choice'),10);
        ec.closest('.qcard-choices').querySelectorAll('.qcard-choice').forEach(function(b){ b.removeAttribute('data-selected'); });
        ec.setAttribute('data-selected','true');
        updateExamProg();
        return;
      }
      var em = e.target.closest('[data-exam-multi]');
      if(em){
        var eq = em.getAttribute('data-qid'), ei = parseInt(em.getAttribute('data-exam-multi'),10), arr = EXAM_STATE.answers[eq] = EXAM_STATE.answers[eq] || [];
        var pos = arr.indexOf(ei);

        updateExamProg();

      var ea = e.target.closest('[data-exam-action]');
      if(ea){
        var a = ea.getAttribute('data-exam-action');
        if(a === 'start') startMockExam(parseInt(ea.getAttribute('data-size'),10), 'mcq');

        else if(a === 'retake'){ EXAM_STATE.phase = 'setup'; renderCompendiumContent(); }
        return;
      }

      if(wa){ var w = wa.getAttribute('data-weak-action'); WEAK_DRILL_LEC = w === 'drill-due' ? 'due' : w === 'drill-all' ? 'all' : w === 'drill-lec' ? wa.getAttribute('data-lec') : null; renderCompendiumContent(); window.scrollTo({top:0}); return; }
      var ra = e.target.closest('[data-recall-action]');

    });
  }
  renderCompendiumSubnav(); renderCompendiumContent();
}

/* =================================================================== CALCULUS CRUSHER
   Breakout: four lettered answer bricks sit above a wall of calculus. */
GAME_IMPL.crusher = function(g, C){
  var W = 800, H = 560, PADY = 516;
  var root, stage, cv, ctx, raf = 0, last = 0, running = false, paused = false;
  var S, deal, draw;
  function reset(){
    draw = C.dealer(C.bankPool(C.currentScope(root)));
    S = { score:0, lives:3, level:1, streak:0, px:W/2, pw:120, ball:null, bricks:[], ans:[], missed:[], firstTry:true, flash:0, keys:{} };

  }

  function bspeed(){ return 5.2 + (S.level - 1) * 0.6; }

    S.bricks = [];

    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
      var hard = S.level > 1 && Math.random() < 0.15 + S.level * 0.03;
      S.bricks.push({ x:x0 + c*(bw+6), y:132 + r*(bh+6), w:bw, h:bh, hp:hard ? 2 : 1 });
    }
  }
  function newQuestion(){
    deal = C.dealMCQ(draw(), 4); S.firstTry = true;
    var bw = 176, gap = 12, x0 = (W - 4*bw - 3*gap)/2;
    S.ans = deal.opts.map(function(o,i){ return { x:x0 + i*(bw+gap), y:56, w:bw, h:44, i:i, alive:true }; });
    root.querySelector('[data-q]').innerHTML = C.qBoxHTML(deal);
  }

  function fb(msg, cls){ var el = root.querySelector('[data-fb]'); if(el){ el.className = 'gm-feedback ' + cls; el.textContent = msg; } }
  function hitRect(b, r){
    var cx = Math.max(r.x, Math.min(b.x, r.x + r.w)), cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
    var dx = b.x - cx, dy = b.y - cy;
    if(dx*dx + dy*dy > b.r*b.r) return false;
    var ox = (b.x < r.x + r.w/2 ? b.x + b.r - r.x : r.x + r.w - (b.x - b.r)), oy = (b.y < r.y + r.h/2 ? b.y + b.r - r.y : r.y + r.h - (b.y - b.r));
    if(ox < oy){ b.vx = b.x < r.x + r.w/2 ? -Math.abs(b.vx) : Math.abs(b.vx); } else { b.vy = b.y < r.y + r.h/2 ? -Math.abs(b.vy) : Math.abs(b.vy); }

  }
  function answerHit(a){
    if(a.i === deal.right){
      var pts = S.firstTry ? Math.round(300 * (1 + Math.min(S.streak, 10) * 0.2)) : 60;
      if(S.firstTry){ S.streak++; recordAnswer(deal.q.id, deal.q.lec, true); }
      S.score += pts; C.SFX.good(); fb('Correct! +' + pts, 'ok'); hud();
      root.querySelectorAll('[data-opt]').forEach(function(o){ if(+o.getAttribute('data-opt') === deal.right) o.classList.add('is-right'); });
      S.ans.forEach(function(x){ x.alive = false; });
      setTimeout(function(){ if(running) newQuestion(); }, 900);
    } else {
      a.alive = false; C.SFX.bad();
      var o = root.querySelector('[data-opt="'+a.i+'"]'); if(o) o.classList.add('is-wrong');
      if(S.firstTry){ S.firstTry = false; S.streak = 0; recordAnswer(deal.q.id, deal.q.lec, false); S.missed.push({ q:deal.q.stem, a:deal.q.choices[deal.q.answer] }); }

    }
  }
  function step(k){
    var b = S.ball;
    if(S.keys.left) S.px -= 9*k; if(S.keys.right) S.px += 9*k;
    S.px = Math.max(S.pw/2, Math.min(W - S.pw/2, S.px));
    if(b.stuck){ b.x = S.px; b.y = PADY - 12; return; }
    var steps = 3;
    for(var s=0;s<steps;s++){
      b.x += b.vx * k / steps; b.y += b.vy * k / steps;
      if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); } if(b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); }
      if(b.vy > 0 && b.y + b.r >= PADY && b.y + b.r <= PADY + 14 && b.x > S.px - S.pw/2 - b.r && b.x < S.px + S.pw/2 + b.r){
        var rel = (b.x - S.px) / (S.pw/2), ang = rel * 1.05, sp = bspeed();
        b.vx = Math.sin(ang) * sp; b.vy = -Math.cos(ang) * sp; b.y = PADY - b.r; C.SFX.tick();
      }
      for(var i=0;i<S.ans.length;i++){ var a = S.ans[i]; if(a.alive && hitRect(b, a)){ answerHit(a); if(!running) return; break; } }

        var br = S.bricks[j];

      }
      if(!S.bricks.length){ S.level++; S.score += 250; C.SFX.win(); fb('Wall cleared! Level ' + S.level, 'ok'); buildWall(); stick(); hud(); return; }
      if(b.y - b.r > H){
        S.lives--; S.streak = 0; S.flash = 16; C.SFX.bad(); hud(); fb('Dropped the ball!', 'bad');

      }

  }
  function render(){
    var c = ctx; c.fillStyle = '#0f2236'; c.fillRect(0,0,W,H);
    c.strokeStyle = 'rgba(255,255,255,.04)'; for(var x=0;x<W;x+=32){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
    S.ans.forEach(function(a){
      if(!a.alive) return;
      c.fillStyle = C.OPT_COLORS[a.i]; C.roundRect(c, a.x, a.y, a.w, a.h, 10); c.fill();
      c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(a.x + 6, a.y + a.h - 6, a.w - 12, 4);
      c.fillStyle = '#0B1A2A'; c.font = '24px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(C.LETTERS[a.i], a.x + a.w/2, a.y + a.h/2 + 1);
    });
    S.bricks.forEach(function(br){
      c.fillStyle = br.hp > 1 ? '#b99d57' : '#e8dca9'; C.roundRect(c, br.x, br.y, br.w, br.h, 6); c.fill();
      c.fillStyle = br.hp > 1 ? 'rgba(60,40,10,.35)' : 'rgba(120,100,50,.35)';
      [[16,8,3],[40,13,2.5],[58,7,2]].forEach(function(d){ c.beginPath(); c.arc(br.x + d[0], br.y + d[1], d[2], 0, Math.PI*2); c.fill(); });
    });
    c.fillStyle = '#5CC8FF'; C.roundRect(c, S.px - S.pw/2, PADY, S.pw, 12, 6); c.fill();
    c.fillStyle = '#dbe7f3'; c.fillRect(S.px - 4, PADY + 12, 8, 30);
    var b = S.ball; c.fillStyle = S.flash > 0 && Math.floor(S.flash/3)%2 ? '#FF6FA3' : '#ffffff'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, Math.PI*2); c.fill();
    if(S.flash > 0) S.flash--;
    if(b.stuck && running){ c.fillStyle = 'rgba(242,248,255,.8)'; c.font = '14px "IBM Plex Mono", monospace'; c.textAlign = 'center'; c.fillText('Click, tap or press Space to launch', W/2, PADY - 40); }
    if(!running || paused){ c.fillStyle = 'rgba(6,14,24,.35)'; c.fillRect(0,0,W,H); }
  }
  function launch(){ var b = S.ball; if(!running || paused || !b.stuck) return; var sp = bspeed(), a = (Math.random() - .5) * 0.8; b.vx = Math.sin(a)*sp; b.vy = -Math.cos(a)*sp; b.stuck = false; }
  function loop(ts){ if(!running) return; var k = last ? Math.min(2.5, (ts - last)/16.67) : 1; last = ts; if(!paused) step(k); if(running){ render(); raf = requestAnimationFrame(loop); } }
  function begin(){ var ov = stage.querySelector('[data-overlay]'); if(ov) ov.remove(); reset(); hud(); running = true; paused = false; last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
  function end(){ running = false; cancelAnimationFrame(raf); render(); C.finish(g, root, S.score, S.missed); }
  function kd(e){
    if(!root || !document.body.contains(root)) return;
    if(e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
    if(e.key === 'ArrowLeft' || e.key === 'a'){ S.keys.left = true; e.preventDefault(); }
    if(e.key === 'ArrowRight' || e.key === 'd'){ S.keys.right = true; e.preventDefault(); }

    if(e.key === 'p' || e.key === 'P') paused = !paused;
  }
  function ku(e){ if(!S) return; if(e.key === 'ArrowLeft' || e.key === 'a') S.keys.left = false; if(e.key === 'ArrowRight' || e.key === 'd') S.keys.right = false; }
  return {
    mount:function(panel){
      panel.innerHTML = C.shell(g, { select:C.scopeSelectHTML('bank'), above:'<div class="gm-q" data-q></div>', stage:'<div class="gm-stage" data-stage></div>', keys:'Move with the mouse, a finger, or <kbd>←</kbd><kbd>→</kbd> · <kbd>Space</kbd> launches · <kbd>P</kbd> pause' });

      stage.insertAdjacentHTML('beforeend', C.introHTML(g, 'Bounce the ball into the lettered brick with the right answer: +300, and the streak bonus grows. A wrong brick costs a life. Clear the calculus wall to level up.', 'Play'));
      reset(); render(); hud();
      stage.addEventListener('click', function(e){ if(e.target.closest('[data-start]')){ begin(); return; } launch(); });
      function move(e){ if(!running) return; var p = cv.toLocal(e); S.px = p.x; }
      cv.el.addEventListener('pointermove', move);
      cv.el.addEventListener('touchmove', function(e){ e.preventDefault(); move(e); }, { passive:false });
      document.addEventListener('keydown', kd); document.addEventListener('keyup', ku);
    },
    rescope:function(){ if(!running){ reset(); render(); } },

/* =================================================================== POCKET PROBE
   Chart rush: rounds are generated from the course's own rules (CAL = PD +
   recession, the staging and grading tables, the Miller mobility scale). */
GAME_IMPL.probe = function(g, C){
  var root, stage, S, timer = 0, running = false, cur = null;
  function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function uniqNums(correct, cands){ var out = [correct]; shuffled(cands).forEach(function(v){ if(out.length < 4 && v >= 0 && out.indexOf(v) === -1) out.push(v); }); var k = 1; while(out.length < 4){ if(out.indexOf(correct + k) === -1) out.push(correct + k); k++; } return shuffled(out); }
  var KINDS = {
    cal:function(){
      var sites = ['D','B','M'].map(function(){ var pd = rnd(1, 9), gm = rnd(-3, 5); if(pd + gm < 0) gm = -pd; return { pd:pd, gm:gm }; });
      var ask = rnd(0, 2), s = sites[ask], cal = s.pd + s.gm;
      var cells = function(key){ return sites.map(function(x, i){ return '<td class="'+(i===ask?'hl':'')+'">'+(x[key] > 0 && key === 'gm' ? '+' : '')+x[key]+'</td>'; }).join(''); };
      var calRow = sites.map(function(x, i){ return '<td class="'+(i===ask?'q':'')+'">'+(i===ask?'?':'')+'</td>'; }).join('');
      return { kind:'Clinical attachment level', prompt:'What is the CAL at the highlighted site?',
        visual:'<table class="pp-chart"><tr><th></th><th>D</th><th>B</th><th>M</th></tr><tr><th>PD</th>'+cells('pd')+'</tr><tr><th>GM</th>'+cells('gm')+'</tr><tr><th>CAL</th>'+calRow+'</tr></table>',
        facts:['<b>GM</b> is recession: <b>+</b> margin apical to the CEJ, <b>−</b> margin coronal to it (overgrowth)','CAL = PD + GM'],
        answers:uniqNums(cal, [s.pd, s.pd - s.gm, cal + 1, cal - 1, Math.abs(s.gm), cal + 2]).map(function(v){ return { label:v + ' mm', ok:v === cal }; }),
        why:'CAL = ' + s.pd + ' + (' + s.gm + ') = ' + cal + ' mm' };
    },
    stage:function(){
      var cal = rnd(1, 8), lost = 0, trig = null, st;
      var r = Math.random();
      if(cal >= 5 && r < 0.35) lost = rnd(1, 8);
      else if(cal <= 4 && r < 0.45) trig = pick(['vertical bone loss of ' + rnd(3,5) + ' mm','a Class ' + pick(['II','III']) + ' furcation','one tooth lost to periodontitis']);
      if(trig) st = 3;
      else st = cal <= 2 ? 1 : cal <= 4 ? 2 : (lost >= 5 ? 4 : 3);
      if(trig && lost >= 5) st = 4;
      var facts = ['Worst interdental CAL: <b>' + cal + ' mm</b>'];
      if(lost) facts.push('Teeth lost to periodontitis: <b>' + lost + '</b>');
      if(trig) facts.push('Also found: <b>' + trig + '</b>');
      var why = trig ? trig.charAt(0).toUpperCase() + trig.slice(1) + ' makes it at least Stage 3.' : cal <= 2 ? 'CAL 1-2 mm is Stage 1.' : cal <= 4 ? 'CAL 3-4 mm is Stage 2.' : lost >= 5 ? 'CAL ≥5 with 5 or more teeth lost is Stage 4.' : 'CAL ≥5 mm with 4 or fewer teeth lost is Stage 3.';
      return { kind:'Stage it', prompt:'What stage is this periodontitis?', visual:'', facts:facts,
        answers:['I','II','III','IV'].map(function(v, i){ return { label:'Stage ' + v, ok:i+1 === st }; }), why:why };
    },
    grade:function(){
      var age = rnd(25, 70), ratio = pick([0.12, 0.18, 0.4, 0.55, 0.7, 0.85, 1.3, 1.6]), bl = Math.max(5, Math.min(90, Math.round(ratio * age)));
      ratio = bl / age;
      var mod = null, r = Math.random();
      if(r < 0.2) mod = { t:'Smokes <b>' + rnd(12, 25) + ' cigarettes/day</b>', c:true };
      else if(r < 0.35) mod = { t:'HbA1c <b>' + (7 + rnd(1, 20)/10).toFixed(1) + '%</b>', c:true };
      else if(r < 0.5) mod = { t:'Non-smoker, HbA1c <b>' + (5 + rnd(0, 15)/10).toFixed(1) + '%</b>', c:false };
      var gr = mod && mod.c ? 'C' : ratio < 0.25 ? 'A' : ratio <= 1.0 ? 'B' : 'C';
      var facts = ['Age <b>' + age + '</b>', 'Bone loss at the worst tooth <b>' + bl + '%</b>'];
      if(mod) facts.push(mod.t);
      var why = 'Ratio ' + bl + ' ÷ ' + age + ' = ' + ratio.toFixed(2) + (mod && mod.c ? ', but the modifier forces Grade C.' : ' → Grade ' + gr + (mod && !mod.c ? ' (no modifier: they only push a grade up, never down).' : '.'));
      return { kind:'Grade it', prompt:'Which grade?', visual:'', facts:facts, answers:['A','B','C'].map(function(v){ return { label:'Grade ' + v, ok:v === gr }; }), why:why };
    },
    mobility:function(){
      var opts = [
        { t:'Only normal, physiologic movement', c:0 },
        { t:'Moves about <b>0.5 mm</b> faciolingually', c:1 },
        { t:'Moves slightly more than normal, <b>under 1 mm</b>', c:1 },
        { t:'Moves about <b>1.5 mm</b> faciolingually, no vertical movement', c:2 },
        { t:'Moves <b>between 1 and 2 mm</b> mesiodistally', c:2 },
        { t:'Moves severely faciolingually <b>and is depressible</b> (vertical displacement)', c:3 }
      ];
      var o = pick(opts);
      return { kind:'Miller mobility', prompt:'Tested with two rigid instrument handles. Which Miller class?', visual:'', facts:[o.t],
        answers:[0,1,2,3].map(function(v){ return { label:'Class ' + v, ok:v === o.c }; }), why:'Miller: 0 normal · 1 <1 mm · 2 >1 but <2 mm · 3 severe with vertical displacement.' };
    }
  };
  function nextRound(){
    var kinds = S.level < 2 ? ['cal','cal','stage','mobility'] : ['cal','stage','grade','mobility','cal','grade'];
    cur = KINDS[pick(kinds)]();
    S.limit = Math.max(6, 13 - S.level * 0.8); S.left = S.limit; S.locked = false;
    var body = root.querySelector('[data-body]');
    body.innerHTML = '<div class="pp-kind">'+escHtml(cur.kind)+'</div><div class="pp-prompt">'+cur.prompt+'</div>' +
      '<div class="pp-card'+(cur.visual?'':' solo')+'">'+(cur.visual ? '<div>'+cur.visual+'</div>' : '')+'<div class="pp-facts">'+cur.facts.map(function(f){ return '<div>'+f+'</div>'; }).join('')+'</div></div>' +
      '<div class="pp-answers">'+cur.answers.map(function(a, i){ return '<button type="button" class="pp-ans" data-ans="'+i+'">'+escHtml(a.label)+'<kbd>'+(i+1)+'</kbd></button>'; }).join('')+'</div><div class="gm-feedback" data-fb></div>';
    tick();
  }
  function hud(){ C.setHud(root, { score:S.score, lives:[S.lives,3], level:S.level }); }
  function tick(){
    clearInterval(timer);
    var bar = root.querySelector('[data-timer]');
    timer = setInterval(function(){
      if(!running || S.locked) return;
      S.left -= 0.1; if(bar) bar.style.transform = 'scaleX(' + Math.max(0, S.left / S.limit) + ')';
      if(S.left <= 0) answer(-1);
    }, 100);
  }
  function answer(i){
    if(S.locked) return; S.locked = true;
    var ok = i >= 0 && cur.answers[i].ok;
    root.querySelectorAll('[data-ans]').forEach(function(b, j){ b.disabled = true; if(cur.answers[j].ok) b.classList.add('right'); else if(j === i) b.classList.add('wrong'); });
    var fb = root.querySelector('[data-fb]');
    if(ok){
      S.streak++; S.right++;
      var pts = Math.round((100 + Math.round(S.left * 10)) * (1 + Math.min(S.streak - 1, 10) * 0.1)); S.score += pts;
      if(S.right % 5 === 0) S.level++;
      C.SFX.good(); fb.className = 'gm-feedback ok'; fb.textContent = 'Right! +' + pts + ' · ' + cur.why;
    } else {
      S.streak = 0; S.lives--; C.SFX.bad();
      S.missed.push({ q:cur.kind + ': ' + cur.facts.map(function(f){ return f.replace(/<[^>]+>/g,''); }).join(', '), a:cur.answers.filter(function(a){ return a.ok; })[0].label + ' (' + cur.why + ')' });
      fb.className = 'gm-feedback bad'; fb.textContent = (i < 0 ? 'Time! ' : 'Not quite. ') + cur.why;
    }
    hud();
    if(S.lives <= 0){ setTimeout(end, 1300); return; }
    setTimeout(function(){ if(running) nextRound(); }, ok ? 1300 : 2300);
  }
  function begin(){ var ov = stage.querySelector('[data-overlay]'); if(ov) ov.remove(); S = { score:0, lives:3, level:1, streak:0, right:0, missed:[] }; running = true; hud(); nextRound(); }
  function end(){ running = false; clearInterval(timer); C.finish(g, root, S.score, S.missed); }
  function kd(e){ if(!running || !root || !document.body.contains(root)) return; var n = parseInt(e.key, 10); if(n >= 1 && n <= cur.answers.length){ e.preventDefault(); answer(n - 1); } }
  return {

/* =================================================================== QUADRANTS

GAME_IMPL.quadrants = function(g, C){

      '<div class="qd-dots">Mistakes left '+[0,1,2,3].map(function(i){ return '<i class="'+(i < S.mistakes ? 'used' : '')+'"></i>'; }).join('')+'</div><div class="gm-feedback" data-fb style="text-align:center"></div>' +
      '<div class="gm-row"><button type="button" class="gm-btn alt" data-q-act="shuffle">Shuffle</button><button type="button" class="gm-btn alt" data-q-act="clear">Deselect</button><button type="button" class="gm-btn" data-q-act="submit"'+(S.sel.length===4?'':' disabled')+'>Submit</button></div>';

        var t = e.target.closest('[data-tile]');

/* =================================================================== PROBE SWEEPER
   Minesweeper on gingiva: bleeding sites are the mines. Probe one and you
   must answer a bank question to control the bleed. */
GAME_IMPL.sweeper = function(g, C){
  var root, stage, S, running = false, clock = 0, draw, lpTimer = 0, lpFired = false;
  var N = 9;
  function levelBleeders(){ return [10, 13, 16, 19][Math.min(3, S.level - 1)]; }
  function newBoard(){
    S.cells = []; for(var i=0;i<N*N;i++) S.cells.push({ b:false, open:false, flag:false, n:0, st:'' });
    S.placed = false; S.opened = 0; S.flagMode = false; render();
  }
  function nb(i){ var x = i % N, y = Math.floor(i / N), out = []; for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){ if(!dx && !dy) continue; var nx = x+dx, ny = y+dy; if(nx>=0 && ny>=0 && nx<N && ny<N) out.push(ny*N+nx); } return out; }
  function place(safe){
    var ban = [safe].concat(nb(safe)), idx = shuffled(S.cells.map(function(c,i){ return i; }).filter(function(i){ return ban.indexOf(i) === -1; })).slice(0, levelBleeders());
    idx.forEach(function(i){ S.cells[i].b = true; });
    S.cells.forEach(function(c, i){ c.n = nb(i).filter(function(j){ return S.cells[j].b; }).length; });
    S.placed = true;
  }
  function open(i){
    var c = S.cells[i]; if(c.open || c.flag) return;
    if(!S.placed) place(i);
    if(c.b){ c.open = true; c.st = 'bleed'; render(); ask(i); return; }
    var stack = [i];
    while(stack.length){
      var k = stack.pop(), cc = S.cells[k]; if(cc.open || cc.flag || cc.b) continue;
      cc.open = true; S.opened++; S.score += 5;
      if(cc.n === 0) nb(k).forEach(function(j){ if(!S.cells[j].open) stack.push(j); });
    }
    C.SFX.pop(); hud(); render(); checkWin();
  }
  function checkWin(){
    var safe = N*N - levelBleeders();
    if(S.opened >= safe){
      var tb = Math.max(0, 240 - Math.round((Date.now() - S.boardStart)/1000)) * 2, bonus = 400 * S.level + tb;
      S.score += bonus; C.SFX.win(); hud();
      S.cells.forEach(function(c){ if(c.b && !c.st) c.flag = true; }); render();
      var fb = root.querySelector('[data-fb]'); if(fb){ fb.className = 'gm-feedback ok'; fb.textContent = 'Board cleared! +' + bonus + ' (time bonus ' + tb + ')'; }
      if(S.level >= 4){ setTimeout(function(){ end(true); }, 1200); return; }
      setTimeout(function(){ if(!running) return; S.level++; S.boardStart = Date.now(); hud(); newBoard(); if(fb) fb.textContent = 'Level ' + S.level + ': ' + levelBleeders() + ' bleeding sites.'; }, 1600);
    }
  }
  function ask(i){
    var deal = C.dealMCQ(draw(), 4), l = LECTURE_BY_ID[deal.q.lec];
    S.asking = true;
    var m = document.createElement('div'); m.className = 'sw-modal';
    m.innerHTML = '<div class="gm-q"><div class="gm-feedback bad" style="font-family:var(--font-arcade);font-weight:400">Bleeding on probing! Answer to control it.</div><div class="gm-q-stem">'+sessChip(l)+'<span>'+escHtml(deal.q.stem)+'</span></div><div class="gm-legend">' +
      deal.opts.map(function(o, k){ return '<button type="button" class="gm-opt" data-sw-ans="'+k+'"><i style="background:'+C.OPT_COLORS[k]+'">'+C.LETTERS[k]+'</i><span>'+escHtml(o.text)+'</span></button>'; }).join('') + '</div><div class="gm-feedback" data-swfb></div></div>';
    stage.appendChild(m);
    m.addEventListener('click', function(e){
      var b = e.target.closest('[data-sw-ans]'); if(!b || m.__done) return; m.__done = true;
      var k = +b.getAttribute('data-sw-ans'), ok = k === deal.right;
      recordAnswer(deal.q.id, deal.q.lec, ok);
      m.querySelectorAll('[data-sw-ans]').forEach(function(x, j){ if(j === deal.right) x.classList.add('is-right'); else if(j === k) x.classList.add('is-wrong'); });
      var f = m.querySelector('[data-swfb]');
      if(ok){ S.cells[i].st = 'ctrl'; S.score += 100; C.SFX.good(); f.className = 'gm-feedback ok'; f.textContent = 'Controlled. +100'; }
      else { S.lives--; C.SFX.bad(); S.missed.push({ q:deal.q.stem, a:deal.q.choices[deal.q.answer] }); f.className = 'gm-feedback bad'; f.textContent = 'Still bleeding: you used a gauze. Answer: ' + deal.opts[deal.right].text; }
      hud();
      setTimeout(function(){ m.remove(); S.asking = false; render(); if(S.lives <= 0) end(false); }, ok ? 900 : 2200);
    });
  }
  function toggleFlag(i){ var c = S.cells[i]; if(c.open) return; c.flag = !c.flag; C.SFX.tick(); render(); }
  function hud(){ C.setHud(root, { score:S.score, lives:[Math.max(0,S.lives),3], level:S.level }); }
  function render(){
    var host = root.querySelector('[data-grid]'); if(!host) return;

    host.innerHTML = S.cells.map(function(c, i){
      var cls = 'sw-cell', inner = '';
      if(c.open){ if(c.st === 'bleed'){ cls += ' bleed'; inner = icon('heart'); } else if(c.st === 'ctrl'){ cls += ' ctrl'; inner = icon('check'); } else { cls += ' open' + (c.n ? ' n' + c.n : ''); inner = c.n || ''; } }
      else if(c.flag){ cls += ' flag'; inner = icon('flag'); }
      return '<button type="button" class="'+cls+'" data-cell="'+i+'" aria-label="site '+(i+1)+'">'+inner+'</button>';
    }).join('');
    var fm = root.querySelector('[data-flagmode]'); if(fm){ fm.setAttribute('aria-pressed', String(S.flagMode)); fm.textContent = S.flagMode ? 'Flag mode: ON' : 'Flag mode: off'; }
    var bl = root.querySelector('[data-left]'); if(bl){ var flags = S.cells.filter(function(c){ return c.flag || c.st; }).length; bl.textContent = Math.max(0, levelBleeders() - flags) + ' bleeding sites unmarked'; }
  }
  function begin(){

    draw = C.dealer(C.bankPool(C.currentScope(root)));
    S = { score:0, lives:3, level:1, missed:[], boardStart:Date.now() }; running = true; hud(); newBoard();

  return {
    mount:function(panel){
      panel.innerHTML = C.shell(g, { select:C.scopeSelectHTML('bank'), stage:'<div class="gm-stage sw-stage" data-stage><div class="sw-tools"><button type="button" class="gm-btn alt" data-flagmode aria-pressed="false">Flag mode: off</button><span class="faint mono" data-left style="color:var(--ar-dim);font-size:.8rem"></span></div><div class="sw-grid" data-grid></div><div class="gm-feedback" data-fb></div></div>', keys:'Tap to probe · right-click, long-press or Flag mode to flag a bleeder · numbers count bleeding sites next door' });
      root = panel.querySelector('.gm'); stage = root.querySelector('[data-stage]');
      S = { score:0, lives:3, level:1, missed:[], cells:[] }; for(var i=0;i<N*N;i++) S.cells.push({ open:false, flag:false, n:0 });
      render(); hud();
      stage.insertAdjacentHTML('beforeend', C.introHTML(g, 'Probe every healthy site without hitting the bleeders. The numbers tell you how many bleeding sites touch a square. Probe a bleeder by accident and you get one question: answer it to control the bleed, miss it and you lose a gauze. Three gauze, four boards.', 'Start charting'));
      stage.addEventListener('click', function(e){

        var i = +c.getAttribute('data-cell');
        if(S.flagMode) toggleFlag(i); else open(i);
      });
      stage.addEventListener('contextmenu', function(e){ var c = e.target.closest('[data-cell]'); if(!c || !running || S.asking) return; e.preventDefault(); toggleFlag(+c.getAttribute('data-cell')); });

      stage.addEventListener('touchmove', function(){ clearTimeout(lpTimer); }, { passive:true });
    },
    stop:function(){ running = false; clearTimeout(lpTimer); }
  };

function normWord(s){ return String(s || '').toUpperCase().replace(/[^A-Z]/g, ''); }

/* =================================================================== PERDLE
   Wordle on the course terms, with the clue shown. Chain words for a streak. */
GAME_IMPL.perdle = function(g, C){
  var root, stage, S, running = false, draw;
  var ROWS = 6, KB = ['QWERTYUIOP','ASDFGHJKL','>ZXCVBNM<'];
  function pool(){ return C.termPool(C.currentScope(root), function(t){ return t.w.length >= 4 && t.w.length <= 8; }); }
  function newWord(){
    S.t = draw(); S.rows = []; S.cur = ''; S.keys = {}; S.done = false; render();
  }
  function score(guess, word){
    var res = Array(word.length).fill('x'), left = {};
    for(var i=0;i<word.length;i++){ if(guess[i] === word[i]) res[i] = 'g'; else left[word[i]] = (left[word[i]]||0) + 1; }
    for(var j=0;j<word.length;j++){ if(res[j] !== 'g' && left[guess[j]]){ res[j] = 'y'; left[guess[j]]--; } }
    return res;
  }
  function render(){
    var n = S.t.w.length, l = LECTURE_BY_ID[S.t.lec];
    var board = '';
    for(var r=0;r<ROWS;r++){
      var row = S.rows[r], cells = '';
      for(var i=0;i<n;i++){
        var ch = row ? row.g[i] : (r === S.rows.length ? (S.cur[i] || '') : ''), cls = row ? row.r[i] : (ch ? 'filled' : '');
        cells += '<div class="pd-cell '+cls+'">'+ch+'</div>';
      }
      board += '<div class="pd-row" style="grid-template-columns:repeat('+n+',auto)">'+cells+'</div>';
    }
    var kb = KB.map(function(r){ return '<div>' + r.split('').map(function(k){
      if(k === '>') return '<button type="button" class="pd-key wide" data-key="ENTER">Enter</button>';
      if(k === '<') return '<button type="button" class="pd-key wide" data-key="BACK">Del</button>';
      return '<button type="button" class="pd-key '+(S.keys[k]||'')+'" data-key="'+k+'">'+k+'</button>'; }).join('') + '</div>'; }).join('');
    root.querySelector('[data-body]').innerHTML = '<div class="pd-clue">'+sessChip(l)+' '+escHtml(S.t.c)+' <span class="mono" style="color:var(--ar-dim)">('+n+' letters)</span></div><div class="pd-board">'+board+'</div><div class="gm-feedback" data-fb style="text-align:center"></div>' +
      (S.done ? '<div class="gm-row">'+(S.won ? '<button type="button" class="gm-btn" data-next>Next word</button>' : '')+'</div>' : '') + '<div class="pd-kb">'+kb+'</div>';
  }
  function fb(t, cls){ var el = root.querySelector('[data-fb]'); if(el){ el.className = 'gm-feedback ' + cls; el.textContent = t; } }
  function press(k){
    if(!running || S.done) return;
    var n = S.t.w.length;
    if(k === 'ENTER'){
      if(S.cur.length !== n){ fb('Need ' + n + ' letters', 'bad'); var b = root.querySelector('.pd-board'); if(b){ b.classList.remove('gm-shake'); void b.offsetWidth; b.classList.add('gm-shake'); } return; }
      var r = score(S.cur, S.t.w); S.rows.push({ g:S.cur, r:r });
      var RANK = { x:1, y:2, g:3 };
      for(var i=0;i<n;i++){ var ch = S.cur[i], st = r[i], prev = S.keys[ch]; if(!prev || RANK[st] > RANK[prev]) S.keys[ch] = st; }
      var won = S.cur === S.t.w; S.cur = '';
      if(won){
        S.done = true; S.won = true; S.streak++; S.words++;
        var pts = (ROWS + 1 - S.rows.length) * 50 + n * 10, mult = 1 + Math.min(S.streak - 1, 8) * 0.25; pts = Math.round(pts * mult);
        S.score += pts; C.SFX.good(); hud(); render(); fb('Got it in ' + S.rows.length + '! +' + pts, 'ok');
      } else if(S.rows.length >= ROWS){
        S.done = true; S.won = false; C.SFX.bad(); S.missed.push({ q:S.t.c, a:S.t.w }); render(); fb('The word was ' + S.t.w, 'bad');
        setTimeout(end, 1800);
      } else { C.SFX.tick(); render(); }
      return;
    }
    if(k === 'BACK'){ S.cur = S.cur.slice(0, -1); render(); return; }
    if(/^[A-Z]$/.test(k) && S.cur.length < n){ S.cur += k; render(); }
  }
  function hud(){ C.setHud(root, { score:S.score, words:S.words, streak:S.streak }); }
  function begin(){ var ov = stage.querySelector('[data-overlay]'); if(ov) ov.remove(); draw = C.dealer(pool()); S = { score:0, words:0, streak:0, missed:[] }; running = true; hud(); newWord(); }
  function end(){ running = false; C.finish(g, root, S.score, S.missed, { note:'You solved <b>' + S.words + '</b> word' + (S.words === 1 ? '' : 's') + ' in a row.' }); }
  function kd(e){
    if(!running || !root || !document.body.contains(root)) return;
    if(e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key === 'Enter'){ e.preventDefault(); if(S.done && S.won){ newWord(); return; } press('ENTER'); }
    else if(e.key === 'Backspace'){ e.preventDefault(); press('BACK'); }
    else if(/^[a-zA-Z]$/.test(e.key)) press(e.key.toUpperCase());
  }
  return {
    mount:function(panel){
      panel.innerHTML = C.shell(g, { hud:['score','words','streak'], select:C.scopeSelectHTML('terms', 4), stage:'<div class="gm-stage pd-stage" data-stage><div data-body style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;min-height:420px"></div></div>', keys:'Type or tap letters · <kbd>Enter</kbd> to guess · green = right spot, yellow = in the word' });
      root = panel.querySelector('.gm'); stage = root.querySelector('[data-stage]');
      stage.insertAdjacentHTML('beforeend', C.introHTML(g, 'Guess the perio term in six tries from its clue. <b>Green</b>: right letter, right spot. <b>Yellow</b>: in the word, wrong spot. Solve it to move on; words keep coming until one stumps you.', 'Start'));
      S = { score:0, words:0, streak:0 }; hud();
      stage.addEventListener('click', function(e){
        if(e.target.closest('[data-start]')){ begin(); return; }
        if(e.target.closest('[data-next]')){ newWord(); return; }
        var k = e.target.closest('[data-key]'); if(k) press(k.getAttribute('data-key'));
      });
      document.addEventListener('keydown', kd);
    },
    stop:function(){ running = false; document.removeEventListener('keydown', kd); }
  };
};

/* =================================================================== ROOT PLANER
   Typing game: calculus deposits carrying clues slide down the root; type the
   answer to plane each one off before it reaches the gumline. */
GAME_IMPL.planer = function(g, C){
  var root, stage, field, input, S, running = false, raf = 0, last = 0, draw, paused = false;
  function pool(){ return C.termPool(C.currentScope(root)); }
  function spawn(){
    var t = draw(); if(!t) return;
    var lanes = [0.2, 0.5, 0.8], used = S.deps.filter(function(d){ return d.y < 120; }).map(function(d){ return d.lane; });
    var free = [0,1,2].filter(function(i){ return used.indexOf(i) === -1; }); if(!free.length) return;
    var lane = pick(free), el = document.createElement('div');
    el.className = 'rp-dep'; el.innerHTML = escHtml(t.c) + '<small>' + t.w.length + ' letters</small>';
    field.appendChild(el);
    S.deps.push({ t:t, el:el, lane:lane, y:-10, x:lanes[lane], hint:false });
  }
  function hud(){ C.setHud(root, { score:S.score, lives:[S.lives,3], level:S.level }); }
  function step(dt){
    var h = field.clientHeight, w = field.clientWidth, floor = h - 54 - 40;
    S.spawnIn -= dt;
    var maxOn = Math.min(2 + S.level, 5);
    if(S.spawnIn <= 0 && S.deps.length < maxOn){ spawn(); S.spawnIn = Math.max(1.6, 4.2 - S.level * 0.35); }
    var v = 14 + S.level * 4.5;
    for(var i=S.deps.length-1;i>=0;i--){
      var d = S.deps[i]; d.y += v * dt;
      if(!d.hint && d.y > floor * 0.55){ d.hint = true; d.el.classList.add('hot'); d.el.querySelector('small').textContent = 'starts with ' + d.t.w[0] + ' · ' + d.t.w.length + ' letters'; }
      var ew = d.el.offsetWidth, px = Math.max(6, Math.min(w - ew - 6, d.x * w - ew/2));
      d.el.style.transform = 'translate(' + px + 'px,' + d.y + 'px)';
      if(d.y > floor){
        d.el.remove(); S.deps.splice(i,1); S.lives--; S.streak = 0; C.SFX.bad(); S.missed.push({ q:d.t.c, a:d.t.w }); hud();

      }
    }
  }
  function loop(ts){ if(!running) return; var dt = last ? Math.min(0.1, (ts - last)/1000) : 0; last = ts; if(!paused) step(dt); if(running) raf = requestAnimationFrame(loop); }
  function submit(){
    var v = normWord(input.value); if(!v) return;
    var hit = -1; S.deps.forEach(function(d, i){ if(hit < 0 && normWord(d.t.w) === v) hit = i; });
    if(hit > -1){
      var d = S.deps[hit]; S.deps.splice(hit, 1); S.streak++; S.planed++;
      var h = field.clientHeight, pts = Math.round((40 + d.t.w.length * 6 + Math.max(0, (h - d.y)) * 0.15) * (1 + Math.min(S.streak-1, 10) * 0.1));
