<style>
/* ===================================================================
   PERIODONTOLOGY D2 — tokens
   Palette "gingiva & enamel": enamel blush paper, gingival rose accent
   (the dashboard's perio ring color), probe-steel blue, calculus ochre.
   =================================================================== */
:root{
  color-scheme: light;
  --bg:#F6F1EE; --surface:#FFFCFA; --surface-2:#F1E9E5; --surface-3:#E8DDD8;
  --ink:#241A1F; --ink-soft:#5E4F56; --ink-faint:#6F6068; --line:#E4D7D2; --line-strong:#CFBDB7;
  --accent:#A23F5E; --accent-ink:#86304C; --accent-soft:#F6E2E8;
  --probe:#2F5D7C; --probe-soft:#DDE8F1;
  --good:#2A7858; --good-soft:#DCEFE5; --bad:#B0393A; --bad-soft:#F7DEDC; --caution:#98640F; --caution-soft:#F6E8CB;
  --tag-teal:#1C7A6D; --tag-teal-soft:#D9EEEA;
  --tag-rose:#B23A5C; --tag-rose-soft:#F6DFE6;
  --tag-amber:#A2660E; --tag-amber-soft:#F6E7CA;
  --tag-blue:#2E62A0; --tag-blue-soft:#DDE7F4;
  --tag-violet:#6A4E9F; --tag-violet-soft:#E8E0F3;
  --tag-slate:#55626D; --tag-slate-soft:#E1E6EA;
  --shadow:0 1px 2px rgba(60,30,40,.05), 0 6px 20px -8px rgba(60,30,40,.14);
  --shadow-lg:0 2px 4px rgba(60,30,40,.05), 0 18px 40px -16px rgba(60,30,40,.25);
  --radius:14px; --radius-s:8px;
  --font-display:'Instrument Serif', Georgia, serif;
  --font-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --font-arcade:'Bungee', 'Arial Black', Impact, sans-serif;
  /* Pocket Arcade: one fixed world regardless of theme */
  --ar-bg:#0B1A2A; --ar-panel:#122840; --ar-panel-2:#19344F; --ar-ink:#F2F8FF; --ar-dim:#9CB3C8; --ar-line:#254A68;
  --ar-pink:#FF6FA3; --ar-mint:#43E0AC; --ar-lemon:#FFD84D; --ar-sky:#5CC8FF; --ar-coral:#FF8A5B; --ar-lilac:#B69CFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#151012; --surface:#1E171A; --surface-2:#282024; --surface-3:#33292E;
    --ink:#F3EAED; --ink-soft:#C4B3BA; --ink-faint:#908087; --line:#3A2E33; --line-strong:#514248;
    --accent:#EB8FAA; --accent-ink:#F4B5C7; --accent-soft:#3B1F2A;
    --probe:#8DB6D9; --probe-soft:#1C2A37;
    --good:#6FC79C; --good-soft:#18342A; --bad:#EE8B84; --bad-soft:#3E1F1E; --caution:#E3B35C; --caution-soft:#3A2D16;
    --tag-teal:#5CC4B5; --tag-teal-soft:#15302C;
    --tag-rose:#EC8BA8; --tag-rose-soft:#3A1D27;
    --tag-amber:#E3AE56; --tag-amber-soft:#382A14;
    --tag-blue:#8AB2E6; --tag-blue-soft:#1A2739;
    --tag-violet:#B59DE3; --tag-violet-soft:#2A2340;
    --tag-slate:#A3B2BE; --tag-slate-soft:#222A31;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px -8px rgba(0,0,0,.5);
    --shadow-lg:0 2px 4px rgba(0,0,0,.35), 0 18px 40px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#151012; --surface:#1E171A; --surface-2:#282024; --surface-3:#33292E;
  --ink:#F3EAED; --ink-soft:#C4B3BA; --ink-faint:#908087; --line:#3A2E33; --line-strong:#514248;
  --accent:#EB8FAA; --accent-ink:#F4B5C7; --accent-soft:#3B1F2A;
  --probe:#8DB6D9; --probe-soft:#1C2A37;
  --good:#6FC79C; --good-soft:#18342A; --bad:#EE8B84; --bad-soft:#3E1F1E; --caution:#E3B35C; --caution-soft:#3A2D16;
  --tag-teal:#5CC4B5; --tag-teal-soft:#15302C;
  --tag-rose:#EC8BA8; --tag-rose-soft:#3A1D27;
  --tag-amber:#E3AE56; --tag-amber-soft:#382A14;
  --tag-blue:#8AB2E6; --tag-blue-soft:#1A2739;
  --tag-violet:#B59DE3; --tag-violet-soft:#2A2340;
  --tag-slate:#A3B2BE; --tag-slate-soft:#222A31;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px -8px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35), 0 18px 40px -16px rgba(0,0,0,.6);
}
/* legacy token names still used by older components */
:root{
  --paper:var(--bg); --teal:var(--accent); --teal-ink:var(--accent-ink); --teal-soft:var(--accent-soft);
  --flag:var(--caution); --flag-ink:var(--caution); --flag-soft:var(--caution-soft);
  --alert:var(--bad); --alert-ink:var(--bad); --alert-soft:var(--bad-soft);
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important;} }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.58;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;line-height:1.12;margin:0 0 .35em;letter-spacing:-.005em;text-wrap:balance}
h2{font-size:2rem} h3{font-size:1.45rem} h4{font-size:1.15rem}
p{margin:0 0 .8em}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}

/* ---------- ribbon ---------- */
#app{max-width:1200px;margin:0 auto;padding:0 20px 80px}
.hub-header{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -20px;padding:8px 20px}
.hub-header-top{display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
.hub-title{display:flex;align-items:center;gap:9px;flex:none;min-width:0}
.hub-title h1{font-size:1.45rem;margin:0;white-space:nowrap;line-height:1}
.hub-title h1 i{font-style:italic;color:var(--accent)}
.hub-back-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none;transition:border-color .15s,color .15s}
.hub-back-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-back-btn svg{width:16px;height:16px}
.hub-name-pill{appearance:none;cursor:pointer;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
#modeSwitch{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
#modeSwitch::-webkit-scrollbar{display:none}
#modeSwitch button{appearance:none;border:0;background:transparent;color:var(--ink-soft);padding:6px 13px;border-radius:999px;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
#modeSwitch button:hover{color:var(--ink)}
#modeSwitch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,30,.12)}
#modeSwitch button[aria-selected="true"] .ic{color:var(--accent)}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{background:var(--ar-bg);color:var(--ar-lemon)}
#modeSwitch button[data-mode="arcade"][aria-selected="true"] .ic{color:var(--ar-pink)}
.mode-icon{display:inline-flex}
.hub-meta{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;color:var(--ink-soft);white-space:nowrap}
.pill.countdown{border-color:color-mix(in srgb, var(--accent) 40%, var(--line));color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.theme-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.theme-btn .ic{width:15px;height:15px}
main{padding-top:20px}
.mode-panel[hidden]{display:none!important}
.hub-footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.82rem}

/* ---------- sub-tabs ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.subtab .ic{width:15px;height:15px}
.subtab:hover{color:var(--ink);border-color:var(--line-strong)}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtab[aria-selected="true"] .ic{color:var(--bg)}

/* ---------- generic surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.section-block{margin-bottom:28px}
.section-block:last-child{margin-bottom:0}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:8px}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#1E171A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{color:#1E171A} }
.btn.ghost{background:transparent}
.btn.sm{padding:4px 11px;font-size:.78rem}
.btn .ic{width:15px;height:15px}
.notice{border:1px solid color-mix(in srgb, var(--caution) 45%, var(--line));background:var(--caution-soft);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.notice b{color:var(--caution)}

/* tag colors: .tag-x sets --t / --ts for anything inside */
.tag-teal{--t:var(--tag-teal);--ts:var(--tag-teal-soft)} .tag-rose{--t:var(--tag-rose);--ts:var(--tag-rose-soft)} .tag-amber{--t:var(--tag-amber);--ts:var(--tag-amber-soft)}
.tag-blue{--t:var(--tag-blue);--ts:var(--tag-blue-soft)} .tag-violet{--t:var(--tag-violet);--ts:var(--tag-violet-soft)} .tag-slate{--t:var(--tag-slate);--ts:var(--tag-slate-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ts,var(--surface-2));color:var(--t,var(--ink-soft));white-space:nowrap;line-height:1.5}
.chip.src{background:var(--surface-2);color:var(--ink-soft);font-weight:600;font-family:var(--font-mono);font-size:.66rem;border-radius:6px}
.snum{font-family:var(--font-mono);font-size:.74rem;font-weight:600;padding:2px 7px;border-radius:7px;color:#fff;background:var(--t);flex:none;line-height:1.5}
[data-theme="dark"] .snum{color:#151012}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .snum{color:#151012} }
.status{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;color:var(--ink-soft)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:none}
.status.taught i{background:var(--good)} .status.preview i{background:var(--caution)} .status.upcoming i{background:var(--line-strong)}
.bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--t,var(--accent));border-radius:4px}

/* ---------- course home ---------- */
.home-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:28px}
.home-hero .hh-main{padding:28px 30px}
.home-hero h2{font-size:2.6rem;margin-bottom:6px}
.home-hero h2 i{color:var(--accent)}
.home-hero .lede{color:var(--ink-soft);max-width:56ch}
.hh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hh-side{background:var(--surface-2);border-left:1px solid var(--line);padding:24px 26px;display:flex;flex-direction:column;gap:14px;background-image:radial-gradient(color-mix(in srgb, var(--accent) 16%, transparent) 1px, transparent 1px);background-size:14px 14px}
.hh-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hh-stat .k{font-size:.72rem;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.hh-stat .v{font-family:var(--font-display);font-size:2rem;line-height:1.05}
.hh-stat .v small{font-family:var(--font-body);font-size:.85rem;color:var(--ink-soft);margin-left:6px}
.hh-exams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.course-map{display:flex;flex-direction:column;gap:0;position:relative}
.cm-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px dashed var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.cm-row:hover{background:var(--surface-2)}
.cm-row:last-child{border-bottom:0}
.cm-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:.85rem;background:var(--ts);color:var(--t);border:2px solid var(--t)}
.cm-title{font-weight:600;line-height:1.3}
.cm-sub{font-size:.8rem;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cm-prog{width:120px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint)}
.cm-prog .bar{width:100%}
.cm-milestone{display:flex;align-items:center;gap:10px;margin:6px 0;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:.82rem}
.cm-milestone .ic{width:16px;height:16px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.home-grid > *{min-width:0}

.grade-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.grade-row:last-child{border-bottom:0}
.grade-row b{font-weight:600}
.grade-row .w{font-family:var(--font-mono);font-size:.78rem;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:1px 7px;align-self:start}
.grade-row p{grid-column:1/-1;margin:0;font-size:.86rem;color:var(--ink-soft)}

/* ---------- lecture notes ---------- */
.notes-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px}
.lec-nav{display:flex;flex-direction:column;gap:6px;min-width:0;position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow-y:auto;padding:2px}
.lec-nav-item{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;cursor:pointer;min-width:0;width:100%}
.lec-nav-item:hover{border-color:var(--line-strong)}
.lec-nav-item[aria-current="true"]{border-color:var(--t);box-shadow:0 0 0 1px var(--t), var(--shadow)}
.lec-nav-item .t{font-size:.87rem;font-weight:600;line-height:1.3;display:block}
.lec-nav-item .w{font-size:.74rem;color:var(--ink-faint);display:flex;gap:8px;align-items:center;margin-top:2px}
.lec-nav-sep{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);padding:6px 4px 2px;display:flex;align-items:center;gap:6px}
.lec-nav-sep::after{content:"";flex:1;height:1px;background:color-mix(in srgb, var(--accent) 35%, var(--line))}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 34px;box-shadow:var(--shadow);min-width:0;border-top:4px solid var(--t)}
.reading-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.reading-head h2{font-size:2.15rem;margin:4px 0 6px}
.reading-meta{font-size:.82rem;color:var(--ink-faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reading-tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.reading-prose{max-width:74ch;font-size:1.01rem}
.reading-prose h5{font-family:var(--font-display);font-weight:400;font-size:1.4rem;margin:1.5em 0 .35em;color:var(--ink);line-height:1.2}
.reading-prose p{margin:0 0 .95em}
.reading-prose ul{margin:0 0 .95em;padding-left:1.3em}
.reading-prose li{margin-bottom:.35em}
.reading-prose b{color:var(--ink)}
.pearl{background:var(--caution-soft);border-left:3px solid var(--caution);border-radius:0 10px 10px 0;padding:10px 14px;margin:1em 0;font-size:.93rem}
.pearl b{color:var(--caution)}
.reading-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.mm-card{margin-top:18px}
.level-seg{margin-top:0}
.level-seg button{padding:5px 12px;font-size:.8rem}
.level-note{display:flex;gap:8px;align-items:center;background:var(--probe-soft);color:var(--ink-soft);border-radius:10px;padding:8px 12px;font-size:.86rem;margin-bottom:16px}
.level-note .ic{color:var(--probe)}
/* Listen button: the shared widget styles it with var(--card,#fff) + inherited text, which is
   white-on-white in this hub's dark theme. Re-skin it with this hub's own tokens. */
.reading-tools .sh-tts-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);font-family:var(--font-body);font-size:.84rem}
.reading-tools .sh-tts-btn:hover{border-color:var(--ink)}
.reading-tools .sh-tts-btn[data-state="playing"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.reading-tools .sh-tts-btn[data-state="paused"]{background:var(--caution);border-color:var(--caution);color:var(--surface)}
.sh-tts-voice-picker{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.reading-prose .sh-tts-word.sh-tts-active{background:#f5cf5a;color:#1a1608}
.mm-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mm-card-head h4{margin:0}

/* ---------- question cards ---------- */
.qfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qfilters select,.qfilters input{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 13px;font:inherit;font-size:.86rem;color:var(--ink);min-width:0;max-width:100%}
.qfilters input{flex:1 1 220px}
.qcount{color:var(--ink-faint);font-size:.82rem;font-family:var(--font-mono)}
.qlist{display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--t, var(--line))}
.qcard-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.qcard-stem{font-weight:600;margin:0 0 12px;font-size:1rem;line-height:1.45}
.qcard-choices,.qcard-seq-steps{display:flex;flex-direction:column;gap:7px}
.qcard-choice,.qcard-match-item{appearance:none;text-align:left;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.38;font-size:.93rem;width:100%}
.qcard-choice:hover,.qcard-match-item:hover{border-color:var(--ink)}
.qcard-choice[data-state="correct"],.qcard-match-item[data-state="correct"]{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.qcard-choice[data-state="incorrect"],.qcard-match-item[data-state="incorrect"]{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.qcard-choice[data-selected="true"],.qcard-match-item[data-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qcard-seq-steps .qcard-choice[data-picked="true"]{background:var(--surface-2);border-color:var(--ink)}
.qcard-choice[disabled]{cursor:default}
.qcard-match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard-match-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.qcard-explain{display:none;margin-top:12px;padding:10px 13px;border-radius:10px;background:var(--surface-2);font-size:.9rem;color:var(--ink-soft)}
.qcard-explain.shown{display:block}
.qcard-reveal-btn,.qcard-grade-btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.qcard-grade-btns button{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.84rem}
.qcard-grade-btns button.good{border-color:var(--good);color:var(--good)}
.qcard-grade-btns button.bad{border-color:var(--bad);color:var(--bad)}
.qcard-classdata-row{margin-top:9px}
.qcard-classdata-result{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint)}
.qcard-classdata-result.is-bad{color:var(--bad)} .qcard-classdata-result.is-ok{color:var(--good)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- mock / weak / recall ---------- */
.exam-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.exam-bar{position:sticky;top:58px;z-index:5}
.exam-progress,.exam-timer{font-family:var(--font-mono);font-size:.86rem;color:var(--ink-soft)}
.size-picks{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.size-pick{appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:12px 18px;cursor:pointer;text-align:left;min-width:120px}
.size-pick b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.9rem;line-height:1}
.size-pick span{font-size:.78rem;color:var(--ink-faint)}
.size-pick:hover{border-color:var(--accent)}
.score-hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score-hero b{font-family:var(--font-display);font-weight:400;font-size:3.4rem;line-height:1}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.weak-row:last-child{border-bottom:0}
.weak-row h4{margin:0;font-size:1.12rem;display:flex;gap:8px;align-items:center}
.weak-row .bar{grid-column:1/-1}
.lec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lec-tile{appearance:none;text-align:left;border:1px solid var(--line);border-top:3px solid var(--t);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.lec-tile:hover{border-color:var(--line-strong);border-top-color:var(--t);box-shadow:var(--shadow)}
.lec-tile b{font-size:.92rem;line-height:1.3}
.lec-tile span{font-size:.76rem;color:var(--ink-faint)}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--surface-2);gap:2px;margin-top:4px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.86rem;color:var(--ink-soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,20,30,.14)}
.seg button .mono{font-size:.75rem;color:var(--ink-faint);margin-left:4px}

/* ---------- hints & cram ---------- */
.hint-group{margin-bottom:34px}
.hint-group-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hint-group-head h3{margin:0}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;border-left:4px solid var(--t)}
.hint blockquote{margin:0 0 8px;font-family:var(--font-display);font-style:italic;font-size:1.2rem;line-height:1.4}
.hint .take{font-size:.9rem;color:var(--ink-soft);margin:0}
.kind{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px}
.kind.emphasize{background:var(--good-soft);color:var(--good)} .kind.deemphasize{background:var(--caution-soft);color:var(--caution)} .kind.slide{background:var(--probe-soft);color:var(--probe)}
.pbox{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:10px 14px;margin:0 0 12px}
.pbox-head{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.pbox-head svg{width:14px;height:14px}
.pbox dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;margin:0;font-size:.9rem}
.pbox dt{font-weight:700;color:var(--ink-soft)}
.pbox dd{margin:0;color:var(--ink)}
@media (max-width:560px){.pbox dl{grid-template-columns:1fr}.pbox dd{margin-bottom:6px}}
.qcard-choice.multi{padding-left:38px;position:relative}
.qcard-choice.multi::before{content:"";position:absolute;left:12px;top:50%;width:15px;height:15px;margin-top:-8px;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--surface)}
.qcard-choice.multi[data-selected="true"]::before,.qcard-choice.multi[data-picked="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.qcard-choice[data-state="missed"]{border-style:dashed;border-color:var(--good)}
.multi-score{font-family:var(--font-mono);font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.exam-match{display:flex;flex-direction:column;gap:8px}
.exam-match-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;font-size:.92rem}
.exam-match-row select{width:100%;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;font-size:.88rem}
@media (max-width:560px){.exam-match-row{grid-template-columns:1fr}}
.exam-kinds{display:grid;gap:10px;margin-top:14px}
.exam-kind{appearance:none;text-align:left;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit}
.exam-kind b{font-size:1.02rem}
.exam-kind span{font-size:.86rem;color:var(--ink-soft)}
.exam-kind:hover{border-color:var(--ink)}
.midterm-card{border-top:4px solid var(--accent)}
.midterm-card .mt-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.midterm-card .mt-when{font-family:var(--font-display);font-size:1.7rem;line-height:1.1}
.midterm-card h4{margin:10px 0 6px;font-size:.92rem}
@media (max-width:760px){.midterm-card .mt-grid{grid-template-columns:1fr}}
.chip.src.nomid{background:var(--caution-soft);color:var(--caution)}
.cram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.cram-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.cram-card h3{font-size:1.25rem;display:flex;gap:8px;align-items:center}
.cram-card ul{margin:0;padding-left:18px}
.cram-card li{margin-bottom:6px;font-size:.9rem}
.cloze-blank{display:inline-block;min-width:54px;padding:3px 10px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--line-strong) 0 4px,var(--surface-2) 4px 8px);border:1px solid var(--line-strong);color:transparent;cursor:pointer;font:inherit}
.cloze-blank-line{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line-strong);color:var(--ink-faint);font:inherit;font-size:inherit;cursor:pointer}
.toggle{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink-soft);user-select:none}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked{background:var(--accent);border-color:var(--accent)}
.toggle input:checked::after{transform:translateX(14px)}

/* ---------- review ---------- */
.review-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px}
.review-nav{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:5px;min-width:0}
.rv-chip{appearance:none;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:.87rem;color:var(--ink-soft);width:100%}
.rv-chip:hover{background:var(--surface-2);color:var(--ink)}
.rv-chip[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.rv-chip .n{margin-left:auto;font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint)}
.review-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.review-top input{flex:1 1 240px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px;font:inherit;font-size:.9rem;color:var(--ink);min-width:0}
.ref-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:30px;border-top:4px solid var(--t)}
.ref-card h3{margin:6px 0 12px}
.ref-card h5{font-family:var(--font-display);font-weight:400;font-size:1.15rem;margin:.8em 0 .3em}
.ref-card ul{margin:0 0 .8em;padding-left:1.2em;font-size:.92rem}
.ref-card .note{font-size:.88rem;color:var(--ink-soft);margin-top:10px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.table-wrap:last-child{margin-bottom:0}
table.chart-table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:520px}
table.chart-table th,table.chart-table td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.chart-table thead th{background:var(--surface-2);font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
table.chart-table tbody tr:last-child td{border-bottom:none}
table.chart-table td:first-child{font-weight:600;min-width:110px}
table.chart-table tbody tr:hover{background:color-mix(in srgb, var(--surface-2) 60%, transparent)}
.empty{color:var(--ink-faint);padding:20px 4px}


/* ---------- toast ---------- */
#toastHost{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center;animation:toastIn .25s ease-out}
.toast .ic{color:var(--accent-soft)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width: 980px){
  .home-hero,.home-grid{grid-template-columns:minmax(0,1fr)}
  .hh-side{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width: 860px){
  .notes-layout,.review-layout{grid-template-columns:minmax(0,1fr)}
  .lec-nav{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .lec-nav-item{flex:none;width:220px}
  .lec-nav-sep{display:none}
  .review-nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .rv-chip{flex:none;width:auto}
  .reading{padding:20px 18px}
  .reading-head h2{font-size:1.75rem}
  .reading-head{grid-template-columns:minmax(0,1fr)}
  .reading-tools{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
}
@media (max-width: 760px){
  #progressSummary{display:none}
  .hub-title h1{font-size:1.2rem}
  #modeSwitch button{padding:6px 9px}
  .mode-label{display:none}
  #modeSwitch button[aria-selected="true"] .mode-label{display:inline}
  main{padding-bottom:calc(var(--sh-tabbar-h,60px) + 20px)}
  .home-hero h2{font-size:2rem}
  .home-hero .hh-main{padding:22px 20px}
  .card{padding:18px}
  .qcard-match-cols{grid-template-columns:1fr}
  .cm-prog{width:74px}
}
@media (max-width: 520px){
  #app{padding:0 14px 60px}
  .hub-header{margin:0 -14px;padding:7px 12px}
  .hub-header-top{gap:8px}
  .pill.countdown{font-size:.7rem;padding:3px 8px}
  #modeSwitch button[aria-selected="true"] .mode-label{display:none}
  .hub-title h1{display:none}
  .hh-exams{grid-template-columns:1fr}
  .cram-grid{grid-template-columns:minmax(0,1fr)}
}
/* ===================================================================
   POCKET ARCADE (fixed deep-navy world, candy colors, chunky type)
   =================================================================== */
#panel-arcade{background:var(--ar-bg);color:var(--ar-ink);margin:-20px -20px 0;padding:26px 20px 44px;min-height:78vh;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
#panel-arcade::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.2px);background-size:24px 24px;pointer-events:none}
.ar-wrap{position:relative;max-width:1100px;margin:0 auto}
.ar-hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ar-logo{font-family:var(--font-arcade);font-weight:400;font-size:2.3rem;line-height:1;margin:0;letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:0 .12em}
.ar-logo span{display:inline-block;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.ar-logo span:nth-child(6n+1){color:var(--ar-pink)} .ar-logo span:nth-child(6n+2){color:var(--ar-lemon)} .ar-logo span:nth-child(6n+3){color:var(--ar-mint)}
.ar-logo span:nth-child(6n+4){color:var(--ar-sky)} .ar-logo span:nth-child(6n+5){color:var(--ar-coral)} .ar-logo span:nth-child(6n){color:var(--ar-lilac)}
.ar-logo .sp{width:.35em}
.ar-tag{font-family:var(--font-mono);font-size:.74rem;color:var(--ar-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.ar-stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ar-stat{background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:12px;padding:6px 12px;font-family:var(--font-mono);font-size:.74rem;color:var(--ar-dim);text-transform:uppercase;letter-spacing:.05em}
.ar-stat b{color:var(--ar-ink);font-size:1rem;margin-left:6px}
.ar-iconbtn{cursor:pointer;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:12px;padding:7px 10px;color:var(--ar-ink);display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase}
.ar-iconbtn .ic{width:17px;height:17px}
.ar-iconbtn:hover{border-color:var(--ar-sky)}
/* featured */
.ar-feature{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--ar-panel);border:3px solid var(--c);border-radius:22px;overflow:hidden;margin-bottom:22px;box-shadow:0 10px 0 rgba(0,0,0,.25);cursor:pointer;text-align:left;padding:0;color:var(--ar-ink);width:100%}
.ar-feature .ar-thumb{height:100%;min-height:220px}
.ar-feature-body{padding:22px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.ar-feature .badge{align-self:flex-start;font-family:var(--font-arcade);font-size:.72rem;background:var(--c);color:var(--ar-bg);padding:5px 10px;border-radius:8px;transform:rotate(-2deg)}
.ar-feature h3{font-family:var(--font-arcade);font-weight:400;font-size:2rem;color:var(--c);margin:0;line-height:1.05}
.ar-feature p{margin:0;color:var(--ar-dim);font-size:.98rem}
/* filter chips */
.ar-cats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.ar-cat{appearance:none;cursor:pointer;background:transparent;border:2px solid var(--ar-line);color:var(--ar-dim);border-radius:999px;padding:6px 14px;font-family:var(--font-arcade);font-size:.72rem;letter-spacing:.02em}
.ar-cat:hover{color:var(--ar-ink);border-color:var(--ar-sky)}
.ar-cat[aria-pressed="true"]{background:var(--ar-lemon);border-color:var(--ar-lemon);color:var(--ar-bg)}
/* tiles */
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ar-tile{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, border-color .15s, box-shadow .15s;cursor:pointer;text-align:left;padding:0;color:var(--ar-ink);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.ar-tile:hover,.ar-tile:focus-visible{transform:translateY(-4px) rotate(-.4deg);border-color:var(--c);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.ar-thumb{height:150px;background:var(--ar-panel-2);display:block;width:100%;position:relative}
.ar-thumb svg{display:block;width:100%;height:100%}
.ar-tile-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ar-tile h3{font-family:var(--font-arcade);font-weight:400;font-size:1.05rem;color:var(--c);margin:0;line-height:1.15}
.ar-tile p{margin:0;font-size:.86rem;color:var(--ar-dim);line-height:1.4}
.ar-tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;gap:8px}
.ar-thumb .ar-kind{position:absolute;top:10px;right:10px;background:rgba(11,26,42,.85);color:var(--ar-ink);border-color:var(--ar-line)}
.ar-kind{white-space:nowrap;font-family:var(--font-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ar-dim);border:1px solid var(--ar-line);border-radius:6px;padding:1px 6px}
.ar-play{font-family:var(--font-arcade);font-size:.8rem;background:var(--c);color:var(--ar-bg);padding:7px 12px;border-radius:10px;box-shadow:0 4px 0 color-mix(in srgb, var(--c) 50%, #000);display:inline-flex;align-items:center;gap:6px}
.ar-play .ic{width:12px;height:12px}
.ar-best{font-family:var(--font-mono);font-size:.74rem;color:var(--ar-dim)}
.ar-best b{color:var(--ar-lemon)}
.ar-ribbon{position:absolute;top:10px;left:-4px;font-family:var(--font-arcade);font-size:.62rem;background:var(--ar-pink);color:var(--ar-bg);padding:3px 9px 3px 10px;border-radius:0 6px 6px 0;box-shadow:0 3px 0 rgba(0,0,0,.3)}
/* leaderboards */
.ar-boards{margin-top:34px;background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:20px;padding:18px 20px}
.ar-sub{font-family:var(--font-arcade);font-weight:400;font-size:1.25rem;color:var(--ar-lemon);display:flex;align-items:center;gap:10px;margin:0 0 12px}
.ar-sub .ic{width:24px;height:24px}
.ar-board-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:12px}
.ar-board-tabs::-webkit-scrollbar{display:none}
.ar-board-tab{appearance:none;flex:none;cursor:pointer;border:2px solid var(--ar-line);background:var(--ar-bg);color:var(--ar-dim);border-radius:10px;padding:6px 11px;font-family:var(--font-arcade);font-size:.68rem}
.ar-board-tab[aria-selected="true"]{border-color:var(--c);color:var(--ar-bg);background:var(--c)}
.ar-board-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-family:var(--font-mono);font-size:.86rem}
.lb-list li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.04)}
.lb-list li.me{background:color-mix(in srgb, var(--ar-lemon) 20%, transparent);color:var(--ar-lemon)}
.lb-list li.lb-gap{background:none;justify-content:center;color:var(--ar-dim);padding:0}
.lb-rk{width:24px;color:var(--ar-dim);text-align:right;flex:none;font-weight:600}
.lb-list li:nth-child(1) .lb-rk{color:var(--ar-lemon)} .lb-list li:nth-child(2) .lb-rk{color:#dbe7f3} .lb-list li:nth-child(3) .lb-rk{color:var(--ar-coral)}
.lb-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ar-ink)}
.lb-list li.me .lb-nm{color:var(--ar-lemon)}
.lb-pl{color:var(--ar-dim);font-size:.72rem;flex:none}
.lb-sc{color:var(--ar-lemon);flex:none;font-weight:600}
.lb-empty{color:var(--ar-dim);font-size:.86rem;padding:8px 2px}
.ar-board-side{background:var(--ar-bg);border:2px dashed var(--ar-line);border-radius:14px;padding:14px 16px;font-size:.88rem;color:var(--ar-dim)}
.ar-board-side h4{font-family:var(--font-arcade);font-weight:400;color:var(--c);margin:0 0 6px;font-size:1.05rem}
.ar-board-side b{color:var(--ar-ink)}
.ar-how{margin-top:22px;background:transparent;border:2px dashed var(--ar-line);border-radius:14px;padding:14px 18px;font-size:.9rem;color:var(--ar-dim)}
.ar-how b{color:var(--ar-ink)}

/* ---------- game shell ---------- */
.gm{display:flex;flex-direction:column;gap:12px}
.gm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-back{font-family:var(--font-arcade);font-size:.72rem;background:var(--ar-panel);border:2px solid var(--ar-line);color:var(--ar-ink);padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.gm-back .ic{width:13px;height:13px}
.gm-back:hover{border-color:var(--c)}
.gm-title{font-family:var(--font-arcade);font-size:1.25rem;color:var(--c);margin-right:auto;line-height:1}
.gm-hud{display:flex;gap:6px;flex-wrap:wrap}
.gm-hud span{font-family:var(--font-mono);font-size:.76rem;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:9px;padding:4px 9px;color:var(--ar-dim);display:inline-flex;align-items:center;gap:5px;text-transform:uppercase}
.gm-hud b{color:var(--ar-lemon);font-size:.9rem}
.gm-hud .hrt{color:var(--ar-pink);display:inline-flex;background:none;border:0;padding:0;border-radius:0}
.gm-hud .hrt.lost{color:var(--ar-line)}
.gm-hud .hrt .ic{width:14px;height:14px}
.gm-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--ar-dim)}
.gm-select select{background:var(--ar-panel);color:var(--ar-ink);border:2px solid var(--ar-line);border-radius:9px;padding:5px 9px;font:inherit;font-size:.84rem;max-width:100%}
.gm-stage{position:relative;background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:18px;overflow:hidden;user-select:none;-webkit-user-select:none}
.gm-canvas{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 330px);min-height:220px;margin:0 auto;touch-action:none}
.gm-stage:has(.gm-canvas){background:#0B1A2A}
.gm-overlay{position:absolute;inset:0;background:rgba(6,14,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:22px;z-index:6;overflow-y:auto}
.gm-overlay h2{font-family:var(--font-arcade);font-weight:400;font-size:1.9rem;color:var(--c);margin:0;line-height:1.1}
.gm-overlay p{margin:0;color:var(--ar-dim);max-width:56ch;font-size:.95rem}
.gm-overlay p b{color:var(--ar-ink)}
.gm-big{font-family:var(--font-arcade);font-size:2.6rem;color:var(--ar-lemon);line-height:1}
.gm-btn{font-family:var(--font-arcade);font-size:.95rem;background:var(--c);color:var(--ar-bg);border:0;padding:11px 20px;border-radius:12px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb, var(--c) 50%, #000)}
.gm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb, var(--c) 50%, #000)}
.gm-btn.alt{background:var(--ar-panel-2);color:var(--ar-ink);box-shadow:0 5px 0 #06101b}
.gm-btn[disabled]{opacity:.45;cursor:default}
.gm-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gm-missed{width:100%;max-width:600px;text-align:left;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 14px;max-height:220px;overflow-y:auto;font-size:.86rem}
.gm-missed h4{margin:0 0 6px;font-family:var(--font-arcade);font-weight:400;font-size:.78rem;color:var(--ar-pink)}
.gm-missed ul{margin:0;padding-left:18px}
.gm-missed li{margin-bottom:6px;color:var(--ar-ink)}
.gm-missed li span{color:var(--ar-mint)}
.gm-lb{width:100%;max-width:440px;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 12px;text-align:left}
.gm-lb h4{margin:0 0 6px;font-family:var(--font-arcade);font-weight:400;font-size:.78rem;color:var(--ar-lemon)}
.gm-keys{font-size:.8rem;color:var(--ar-dim);text-align:center}
.gm-keys kbd{font-family:var(--font-mono);background:var(--ar-panel-2);border:1px solid var(--ar-line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--ar-ink)}
.gm-q{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.gm-q-stem{font-weight:700;font-size:1.02rem;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.gm-q-stem .chip{flex:none;margin-top:2px}
.gm-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.gm-opt{display:flex;align-items:center;gap:10px;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:11px;padding:7px 11px;font-size:.9rem;min-width:0;line-height:1.3}
.gm-opt i{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--font-arcade);font-size:.8rem;color:var(--ar-bg)}
.gm-opt span{min-width:0;overflow-wrap:anywhere}
.gm-opt.is-right{border-color:var(--ar-mint);background:color-mix(in srgb, var(--ar-mint) 20%, var(--ar-bg))}
.gm-opt.is-wrong{border-color:var(--ar-pink);background:color-mix(in srgb, var(--ar-pink) 18%, var(--ar-bg));text-decoration:line-through}
.gm-opt.is-gone{opacity:.3;text-decoration:line-through}
.gm-feedback{min-height:1.4em;font-weight:700;font-size:.9rem}
.gm-feedback.ok{color:var(--ar-mint)} .gm-feedback.bad{color:var(--ar-pink)}
.gm-pop{position:absolute;font-family:var(--font-arcade);font-size:1rem;pointer-events:none;animation:gmpop .9s ease-out forwards;z-index:5;text-shadow:0 2px 0 rgba(0,0,0,.4)}
@keyframes gmpop{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-48px) scale(1.2)}}
.gm-shake{animation:shake .3s}

/* Pocket Probe */
.pp-stage{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:430px}
.pp-timer{height:8px;background:var(--ar-bg);border-radius:5px;overflow:hidden}
.pp-timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ar-mint),var(--ar-lemon),var(--ar-pink));transform-origin:left;width:100%}
.pp-kind{font-family:var(--font-arcade);font-size:.8rem;color:var(--c)}
.pp-prompt{font-size:1.08rem;font-weight:700;line-height:1.4}
.pp-card{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center}
.pp-card.solo{grid-template-columns:minmax(0,1fr)}
.pp-chart{border-collapse:separate;border-spacing:4px;font-family:var(--font-mono)}
.pp-chart th{font-size:.7rem;color:var(--ar-dim);font-weight:500;text-align:left;padding-right:8px;text-transform:uppercase;letter-spacing:.05em}
.pp-chart td{width:52px;height:40px;text-align:center;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:9px;font-size:1.15rem;font-weight:600}
.pp-chart td.hl{border-color:var(--ar-lemon);color:var(--ar-lemon)}
.pp-chart td.q{border-style:dashed;border-color:var(--ar-lemon);color:var(--ar-lemon)}
.pp-facts{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.pp-facts div{background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:10px;padding:7px 11px}
.pp-facts b{color:var(--ar-lemon)}
.pp-answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pp-ans{appearance:none;cursor:pointer;background:var(--ar-panel-2);border:3px solid var(--ar-line);color:var(--ar-ink);border-radius:14px;padding:14px 6px;font-family:var(--font-arcade);font-size:1.15rem;box-shadow:0 5px 0 #06101b}
.pp-ans:hover{border-color:var(--c)}
.pp-ans.right{background:var(--ar-mint);color:var(--ar-bg);border-color:var(--ar-mint)}
.pp-ans.wrong{background:var(--ar-pink);color:var(--ar-bg);border-color:var(--ar-pink)}
.pp-ans kbd{display:block;font-family:var(--font-mono);font-size:.62rem;opacity:.6;margin-top:3px}

/* Quadrants */
.qd-stage{padding:16px;display:flex;flex-direction:column;gap:12px}
.qd-solved{display:flex;flex-direction:column;gap:8px}
.qd-band{border-radius:12px;padding:10px 12px;text-align:center;color:var(--ar-bg);animation:drop .3s ease-out}
.qd-band b{display:block;font-family:var(--font-arcade);font-weight:400;font-size:.95rem}
.qd-band span{font-size:.84rem;font-weight:600}
@keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.qd-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qd-tile{appearance:none;cursor:pointer;min-height:70px;background:var(--ar-panel-2);border:3px solid var(--ar-line);color:var(--ar-ink);border-radius:12px;padding:8px 6px;font-weight:700;font-size:.9rem;line-height:1.2;box-shadow:0 4px 0 #06101b;overflow-wrap:anywhere}
.qd-tile:hover{border-color:var(--c)}
.qd-tile[aria-pressed="true"]{background:var(--c);color:var(--ar-bg);border-color:var(--c);transform:translateY(2px);box-shadow:0 2px 0 #06101b}
.qd-dots{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.85rem;color:var(--ar-dim)}
.qd-dots i{width:12px;height:12px;border-radius:50%;background:var(--ar-pink)}
.qd-dots i.used{background:var(--ar-line)}

/* Perdle */
.pd-stage{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pd-clue{background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:9px 14px;font-weight:600;max-width:560px;text-align:center}
.pd-board{display:grid;gap:6px}
.pd-row{display:grid;gap:6px}
.pd-cell{width:48px;height:48px;border:3px solid var(--ar-line);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-arcade);font-size:1.3rem;color:var(--ar-ink);background:var(--ar-bg)}
.pd-cell.filled{border-color:var(--ar-dim)}
.pd-cell.g{background:var(--ar-mint);border-color:var(--ar-mint);color:var(--ar-bg)}
.pd-cell.y{background:var(--ar-lemon);border-color:var(--ar-lemon);color:var(--ar-bg)}
.pd-cell.x{background:#2c3f53;border-color:#2c3f53;color:var(--ar-dim)}
.pd-kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:560px}
.pd-kb div{display:flex;gap:5px;justify-content:center}
.pd-key{appearance:none;cursor:pointer;flex:1;max-width:44px;height:48px;border:0;border-radius:8px;background:var(--ar-panel-2);color:var(--ar-ink);font-family:var(--font-arcade);font-size:.85rem;box-shadow:0 3px 0 #06101b}
.pd-key.wide{max-width:74px;font-size:.62rem}
.pd-key.g{background:var(--ar-mint);color:var(--ar-bg)} .pd-key.y{background:var(--ar-lemon);color:var(--ar-bg)} .pd-key.x{background:#1a2837;color:#5a7288}

/* Root Planer */
.rp-stage{height:470px}
.rp-canvas-wrap{position:absolute;inset:0}
.rp-dep{position:absolute;left:0;top:0;max-width:min(260px,44%);background:#e8dca9;color:#2a2110;border-radius:16px 20px 14px 22px;padding:9px 12px;font-weight:700;font-size:.86rem;line-height:1.3;box-shadow:0 5px 0 #b6a56a, 0 8px 18px rgba(0,0,0,.35);text-align:center;will-change:transform}
.rp-dep small{display:block;font-family:var(--font-mono);font-size:.66rem;font-weight:500;color:#6d5f33;margin-top:3px;letter-spacing:.05em}
.rp-dep.hot{background:#f2c79a;box-shadow:0 5px 0 #c98f55, 0 8px 18px rgba(0,0,0,.35)}
.rp-dep.gone{transition:transform .25s, opacity .25s;opacity:0}
.rp-gum{position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(180deg,#ff8fb3,#e0668f);border-top:4px solid #ffb3cb}
.rp-input{display:flex;gap:8px}
.rp-input input{flex:1;min-width:0;background:var(--ar-bg);border:3px solid var(--ar-line);color:var(--ar-ink);border-radius:12px;padding:10px 14px;font-family:var(--font-mono);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em}
.rp-input input:focus{outline:none;border-color:var(--c)}

/* Million-Dollar Smile */
.ms-stage{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;padding:16px}
.ms-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.ms-q{font-size:1.1rem;font-weight:700;line-height:1.4;background:linear-gradient(180deg,#183a5c,#10263e);border:3px solid var(--ar-sky);border-radius:40px;padding:16px 26px;text-align:center}
.ms-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ms-opt{appearance:none;cursor:pointer;text-align:left;background:linear-gradient(180deg,#183a5c,#10263e);border:3px solid var(--ar-line);color:var(--ar-ink);border-radius:30px;padding:11px 18px;font-size:.95rem;line-height:1.3;display:flex;gap:10px;align-items:center}
.ms-opt b{font-family:var(--font-arcade);color:var(--ar-lemon);font-weight:400}
.ms-opt:hover{border-color:var(--ar-lemon)}
.ms-opt.locked{background:var(--ar-coral);border-color:var(--ar-coral);color:var(--ar-bg)} .ms-opt.locked b{color:var(--ar-bg)}
.ms-opt.right{background:var(--ar-mint);border-color:var(--ar-mint);color:var(--ar-bg)} .ms-opt.right b{color:var(--ar-bg)}
.ms-opt.gone{visibility:hidden}
.ms-life{display:flex;gap:8px;flex-wrap:wrap}
.ms-lifebtn{appearance:none;cursor:pointer;border:3px solid var(--ar-sky);background:var(--ar-bg);color:var(--ar-sky);border-radius:999px;padding:6px 12px;font-family:var(--font-arcade);font-size:.72rem}
.ms-lifebtn[disabled]{opacity:.3;text-decoration:line-through;cursor:default}
.ms-note{font-size:.88rem;color:var(--ar-dim);min-height:1.3em}
.ms-note b{color:var(--ar-lemon)}
.ms-ladder{list-style:none;margin:0;padding:10px;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:14px;display:flex;flex-direction:column-reverse;gap:2px;font-family:var(--font-mono);font-size:.82rem}
.ms-ladder li{display:flex;justify-content:space-between;padding:3px 10px;border-radius:8px;color:var(--ar-dim)}
.ms-ladder li.safe{color:var(--ar-ink);font-weight:600}
.ms-ladder li.on{background:var(--ar-coral);color:var(--ar-bg)}
.ms-ladder li.done{color:var(--ar-mint)}

/* Probe Sweeper */
.sw-stage{padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.sw-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.sw-grid{display:grid;gap:3px;background:var(--ar-line);padding:3px;border-radius:12px;touch-action:manipulation}
.sw-cell{appearance:none;width:36px;height:36px;border:0;border-radius:6px;background:linear-gradient(180deg,#ff9cbe,#e7719a);cursor:pointer;font-family:var(--font-arcade);font-size:.9rem;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ar-bg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.sw-cell:hover{filter:brightness(1.08)}
.sw-cell.open{background:#f6efe2;box-shadow:none;cursor:default}
.sw-cell.n1{color:#2e62a0} .sw-cell.n2{color:#2a7858} .sw-cell.n3{color:#b0393a} .sw-cell.n4{color:#6a4e9f} .sw-cell.n5{color:#98640f} .sw-cell.n6{color:#1c7a6d}
.sw-cell.flag{background:linear-gradient(180deg,#ffe07a,#f2c02b)}
.sw-cell.bleed{background:#c41e3a;color:#fff}
.sw-cell.ctrl{background:#fff;color:#2a7858}
.sw-cell .ic{width:18px;height:18px}
.sw-modal{position:absolute;inset:0;background:rgba(6,14,24,.92);display:flex;align-items:center;justify-content:center;z-index:7;padding:16px}
.sw-modal .gm-q{max-width:620px;width:100%}
.sw-modal .gm-opt{cursor:pointer;text-align:left;color:var(--ar-ink);font:inherit;font-size:.9rem}

/* Cross-Section */
.cx-stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;padding:16px;align-items:start}
.cx-grid{display:grid;gap:2px;background:var(--ar-bg);padding:3px;border-radius:10px;touch-action:manipulation}
.cx-cell{position:relative;width:34px;height:34px;background:transparent;border-radius:4px}
.cx-cell.on{background:#f5f1e6;cursor:pointer}
.cx-cell.on.word{background:#ffe9a8}
.cx-cell.on.cur{background:var(--ar-lemon)}
.cx-cell.on.bad{background:#ffb0c6}
.cx-cell.on.ok{background:#b8f0d9}
.cx-cell span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-arcade);font-size:1rem;color:#1a2533}
.cx-cell em{position:absolute;top:1px;left:3px;font-style:normal;font-family:var(--font-mono);font-size:.56rem;color:#56606b}
.cx-clues{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}
.cx-clues h4{font-family:var(--font-arcade);font-weight:400;color:var(--c);margin:0 0 6px;font-size:.9rem}
.cx-clues ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.cx-clue{appearance:none;display:block;width:100%;text-align:left;cursor:pointer;background:transparent;border:0;color:var(--ar-dim);padding:5px 8px;border-radius:8px;font-size:.87rem;line-height:1.35}
.cx-clue b{color:var(--ar-ink);font-family:var(--font-mono);margin-right:5px}
.cx-clue.cur{background:var(--ar-panel-2);color:var(--ar-ink)}
.cx-clue.done{text-decoration:line-through;opacity:.55}
.cx-hidden{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0;pointer-events:none}
.cx-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cx-cur{background:var(--ar-bg);border:2px solid var(--ar-lemon);border-radius:10px;padding:8px 12px;font-weight:600;margin-bottom:12px;font-size:.92rem}

/* fullscreen */
.gm-fs{margin-left:0}
.ar-wrap:fullscreen,.ar-wrap:-webkit-full-screen{background:var(--ar-bg);padding:18px 24px;max-width:none;overflow:auto;color:var(--ar-ink)}
.ar-wrap.is-fs{position:fixed;inset:0;z-index:200;background:var(--ar-bg);padding:18px 24px;max-width:none;overflow:auto}
.ar-wrap.fs-on .gm{max-width:1300px;margin:0 auto}
.ar-wrap.fs-on .rp-stage{height:calc(100vh - 260px)}

/* ===== Lecture 1 — Diagnosis, Classification & Treatment Planning ===== */
{ id:'q1-01', lec:'diagnosis-tx-planning', type:'mcq', stem:"A periodontal probe reads 5 mm from the gingival margin to the base of the pocket. What is this measurement called?", choices:['Probing depth (PD)','Clinical attachment level (CAL)','Gingival recession (GR)','Radiographic bone loss'], answer:0, ex:"PD runs from the gingival margin to the base of the pocket. CAL adds recession to PD; GR runs from the CEJ to the gingival margin.", src:'lecture' },
{ id:'q1-02', lec:'diagnosis-tx-planning', type:'mcq', stem:"Probing depth is 7 mm, and the CEJ is felt 4 mm apical to the gingival margin (no visible recession). What is the clinical attachment level?", choices:['3 mm','7 mm','11 mm','4 mm'], answer:0, ex:"CAL = PD + GR using signed GR. Here GR = -4 (CEJ is subgingival), so CAL = 7 + (-4) = 3 mm of attachment loss.", src:'lecture' },
{ id:'q1-03', lec:'diagnosis-tx-planning', type:'mcq', stem:"Tooth X: 2 mm probing depth with 4 mm of visible recession (CAL 6 mm). Tooth Y: 7 mm probing depth, CEJ felt 4 mm subgingival (CAL 3 mm). Which tooth is more maintainable for the patient, despite its higher attachment loss?", choices:['Tooth X — the shallow pocket','Tooth Y — the deep pocket','Both are equally maintainable','Neither can be maintained'], answer:0, ex:"Recession makes CAL look worse on paper, but a shallow, accessible 2 mm pocket is far easier for a patient to brush and floss than a deep 7 mm pocket.", src:'lecture' },
{ id:'q1-04', lec:'diagnosis-tx-planning', type:'mcq', stem:"Which radiograph is preferred over a horizontal bitewing when screening for periodontal bone loss, and why?", choices:['Vertical bitewing — less likely to miss bone loss on one arch','Panoramic — gives the most site-specific detail','Occlusal film — best shows interproximal bone','Horizontal bitewing — faster to interpret'], answer:0, ex:"A horizontal bitewing can fail to capture bone loss on one of the two arches; vertical bitewings extend the field and are preferred when bone loss is a concern.", src:'lecture' },
{ id:'q1-05', lec:'diagnosis-tx-planning', type:'recall', stem:"Name the two findings that must both be present for a bleeding 5 mm probing depth to represent periodontitis rather than gingivitis.", answer:"Attachment loss AND radiographic bone loss at that site. A deep probing depth alone can occur in plaque-induced gingivitis (which can reach 4–5 mm) without any attachment or bone loss — so probing depth by itself never proves periodontitis.", src:'lecture' },
{ id:'q1-06', lec:'diagnosis-tx-planning', type:'mcq', stem:"A tooth has 1 mm of mesial and 1 mm of distal recession (some interproximal attachment loss present), but 6 mm of buccal recession — clearly more than either interproximal measurement. What recession type is this?", choices:['RT2','RT1','RT3','Cannot be determined'], answer:0, ex:"Interproximal attachment loss is present, ruling out RT1. Buccal loss (6 mm) exceeds interproximal loss (1 mm), which is the definition of RT2.", src:'lecture' },
{ id:'q1-07', lec:'diagnosis-tx-planning', type:'mcq', stem:"Which recession type is not treated with a root-coverage attempt, because it will not succeed?", choices:['RT3','RT1','RT2','All types are treated the same way'], answer:0, ex:"In RT3, interproximal attachment loss exceeds buccal loss — coverage cannot be achieved and is not attempted.", src:'lecture' },
{ id:'q1-08', lec:'diagnosis-tx-planning', type:'match', stem:"Match each recession type to its definition.", pairs:[['RT1','No loss of interproximal attachment'],['RT2','Interproximal CAL ≤ buccal CAL'],['RT3','Interproximal CAL > buccal CAL']], ex:"Jepsen, Caton et al., 2018 World Workshop, Workgroup 3.", src:'lecture' },
{ id:'q1-09', lec:'diagnosis-tx-planning', type:'mcq', stem:"Under the 2018 World Workshop classification, what replaced the older separate categories of 'chronic periodontitis' and 'aggressive periodontitis'?", choices:['A single "Periodontitis" category, staged and graded','Two new categories: "slow" and "fast" periodontitis','Nothing — the old terms are still used clinically','"Necrotizing periodontitis" covering both'], answer:0, ex:"Both old terms were merged into one Periodontitis category; individualized severity/behavior is now captured through staging and grading instead.", src:'lecture' },
{ id:'q1-10', lec:'diagnosis-tx-planning', type:'mcq', stem:"What bleeding-on-probing threshold is used before a case is called gingivitis, to account for inter-examiner probing variability?", choices:['≥10% of sites','Any bleeding at all','≥50% of sites','≥25% of sites'], answer:0, ex:"Two or three bleeding spots on a full-mouth chart are not, by themselves, enough to diagnose gingivitis.", src:'lecture' },
{ id:'q1-11', lec:'diagnosis-tx-planning', type:'recall', stem:"A patient on a calcium channel blocker has gingival overgrowth. Does the medication cause this by itself?", answer:"No. Drug-associated gingival overgrowth (calcium channel blockers, cyclosporine) only develops in the presence of existing plaque and poor oral hygiene — the medication alone does not cause it.", src:'lecture' },
{ id:'q1-12', lec:'diagnosis-tx-planning', type:'mcq', stem:"A treated periodontitis patient is stable on 3-month maintenance with no bleeding and shallow probing depths, though radiographs show old bone loss. What is the correct diagnosis today?", choices:['Health on a reduced periodontium (stable periodontitis patient)','Active Stage 3 periodontitis','Gingivitis on an intact periodontium','Necrotizing periodontitis'], answer:0, ex:"A stable, well-maintained patient is not re-staged — they are described as healthy on a reduced periodontium.", src:'lecture' },
{ id:'q1-13', lec:'diagnosis-tx-planning', type:'mcq', stem:"Which statement about reversibility is correct?", choices:['Gingivitis can return fully to health; periodontitis cannot fully return to its original attachment level','Both gingivitis and periodontitis are fully reversible','Neither condition is reversible','Periodontitis is reversible, gingivitis is not'], answer:0, ex:"There is a point of no return between the two: gingivitis resolves completely with plaque control, while periodontitis leaves permanent attachment loss even after successful treatment.", src:'lecture' },
{ id:'q1-14', lec:'diagnosis-tx-planning', type:'mcq', stem:"What distinguishes necrotizing periodontal disease from typical gingivitis or periodontitis?", choices:['It is very painful and brings patients in for urgent care','It never occurs in immunocompromised patients','It is completely painless','It only affects the maxilla'], answer:0, ex:"Ordinary periodontitis and gingivitis are not painful; necrotizing disease is, with decapitated papillae and a grayish pseudomembrane. Severely compromised patients include those with HIV/AIDS and CD4 <200.", src:'lecture' },
{ id:'q1-15', lec:'diagnosis-tx-planning', type:'mcq', stem:"A patient has a vertical bone defect measuring 4 mm. What does this make the case automatically, regardless of the CAL numbers?", choices:['At least Stage 3','Stage 1','Grade C','Necrotizing periodontitis'], answer:0, ex:"Vertical bone loss ≥3 mm is one of three automatic Stage 3/4 triggers, alongside Class II–III furcation involvement and tooth loss due to periodontitis.", src:'lecture' },
{ id:'q1-16', lec:'diagnosis-tx-planning', type:'mcq', stem:"What grade should a clinician assume by default, before looking for evidence to shift it up or down?", choices:['Grade B','Grade A','Grade C','There is no default'], answer:0, ex:"Clinicians should initially assume Grade B (moderate progression) and seek specific evidence to move to A or C.", src:'lecture' },
{ id:'q1-17', lec:'diagnosis-tx-planning', type:'mcq', stem:"A 30-year-old patient has 50% bone loss on their worst tooth. What does that bone-loss/age ratio suggest on its own?", choices:['Ratio > 1 → suggests Grade C','Ratio < 0.25 → suggests Grade A','Ratio = 1 exactly → always Grade B','Not enough information to say'], answer:0, ex:"50% ÷ 30 years ≈ 1.7, well above the 1.0 cutoff that points toward rapid progression, Grade C.", src:'lecture' },
{ id:'q1-18', lec:'diagnosis-tx-planning', type:'mcq', stem:"Case A (30-year-old, systemically healthy) has isolated bone loss into the middle third of the root at #30 with a 7 mm probing depth, and no smoking or diabetes. What is her diagnosis?", choices:['Localized Stage 3 Grade C Periodontitis','Generalized Stage 4 Grade B Periodontitis','Gingivitis on an intact periodontium','Localized Stage 1 Grade A Periodontitis'], answer:0, ex:"Middle-third bone loss and a 7 mm pocket put her in Stage 3; her bone-loss/age ratio exceeds 1, which is Grade C even without smoking or diabetes as modifiers.", src:'lecture' },
{ id:'q1-19', lec:'diagnosis-tx-planning', type:'mcq', stem:"Case B, a 41-year-old heavy smoker, has bone loss confined to #2 and #15, with a bone-loss/age ratio that is borderline Grade B on its own. What pushes his grade up to C?", choices:["Heavy smoking (>10 cigarettes/day)", "Diabetes (A1c above 7%)", "Furcation involvement on #2 and #15", "Missing teeth from caries"], answer:0, ex:"Heavy smoking is a grade modifier that automatically pushes the case to Grade C, regardless of the bone-loss/age calculation.", src:'lecture' },
{ id:'q1-20', lec:'diagnosis-tx-planning', type:'mcq', stem:"Case E has an HbA1c of 6.1%. Why does her periodontitis stay Grade B instead of moving to Grade C?", choices:['Her HbA1c is below the 7% threshold that would push a case to Grade C','Diabetes never affects periodontal grading','Grade C only applies to smokers','Her age protects her from Grade C'], answer:0, ex:"The diabetes grade modifier only applies at HbA1c ≥7%. At 6.1%, her control is good enough that diabetes is not acting as a modifier.", src:'lecture' },
{ id:'q1-21', lec:'diagnosis-tx-planning', type:'sequence', stem:"Put the 4-step approach to diagnosing periodontitis in order.", steps:['Initial screening of full-mouth radiographs, probing depths, and missing teeth','Fine-tune the stage using maximum CAL/RBL and case complexity','Determine the grade from progression evidence and modifiers','Build the treatment plan from the stage and grade'], ex:"Kornman & Papapanou's 4-step practical approach, 2018.", src:'lecture' },
{ id:'q1-22', lec:'diagnosis-tx-planning', type:'mcq', stem:"At flap reflection, bone remains on the buccal wall, the lingual wall, and against the neighboring tooth — only the involved root surface itself lacks bone. How many walls does this defect have, and what does that mean for regeneration?", choices:['3 walls — the best prognosis for regeneration','1 wall — the worst prognosis','2 walls — a crater','4 walls — an unusual finding'], answer:0, ex:"The more walls remaining around a defect, the better the case for regrowing bone, PDL, and cementum.", src:'lecture' },
{ id:'q1-23', lec:'diagnosis-tx-planning', type:'mcq', stem:"Bone is lost on both proximal root surfaces of a defect, leaving only the buccal and lingual walls. What is this specific 2-wall pattern called?", choices:['A crater','A trench','A furcation','A dehiscence'], answer:0, ex:"When both neighboring teeth have lost bone at the same site, the resulting 2-wall defect is called a crater.", src:'lecture' },
{ id:'q1-24', lec:'diagnosis-tx-planning', type:'recall', stem:"Why are the coronal/middle/apical thirds of the root measured from where bone should be in health, rather than from the CEJ itself?", answer:"In health, bone already sits about 1.5–2 mm apical to the CEJ. Starting the thirds at the CEJ would overestimate how much destruction has actually occurred.", src:'lecture' },
{ id:'q1-25', lec:'diagnosis-tx-planning', type:'mcq', stem:"A patient needs both a crown and periodontal therapy on the same tooth. What is the correct sequence?", choices:['Temporary crown → complete periodontal therapy → definitive crown','Definitive crown first, then periodontal therapy','Skip the crown until therapy is finished, no temporary needed','Temporary and definitive crowns can both be placed alongside SRP'], answer:0, ex:"Never place a permanent crown before periodontal therapy is complete — a temporary bridges the gap, and the same logic applies to a final RPD.", src:'lecture' },
{ id:'q1-26', lec:'diagnosis-tx-planning', type:'mcq', stem:"Where does caries control fit in the treatment sequence?", choices:['It is part of Phase I therapy, alongside SRP','It only happens after all surgical therapy is finished','It is unrelated to periodontal treatment planning','It always follows delivery of the final RPD'], answer:0, ex:"A cavitated surface is harder to instrument and harder for the patient to keep clean, so restoring it is bundled into Phase I rather than deferred.", src:'lecture' },
{ id:'q1-27', lec:'diagnosis-tx-planning', type:'mcq', stem:"At which appointment is the final decision about surgical (Phase II) therapy actually made?", choices:['The Phase I re-evaluation appointment','The initial comprehensive exam','A maintenance visit','The midterm exam'], answer:0, ex:"Re-evaluation shows how well the patient healed and complied — that is when the definitive surgical plan is set, not at the first visit.", src:'lecture' },
{ id:'q1-28', lec:'diagnosis-tx-planning', type:'recall', stem:"How does periodontal maintenance differ from a routine prophylaxis?", answer:"Maintenance is for patients who have had periodontal disease and treatment and need closer recall — often every 3 months — to catch recurrence early and reinforce risk-factor control. Prophylaxis is for patients without periodontitis risk, typically on a 6-month recall. They are not the same visit.", src:'lecture' },
{ id:'q1-29', lec:'diagnosis-tx-planning', type:'mcq', stem:"In the classic Becker et al. data cited in lecture, which group lost teeth at roughly double the rate of patients who kept their maintenance visits?", choices:['Patients who were treated but did not return for maintenance','Patients who refused all treatment','Patients on antibiotics','Patients with gingivitis only'], answer:0, ex:"Treated-without-maintenance patients lost about 0.22 teeth/year versus 0.11 teeth/year for treated-with-maintenance patients — roughly double.", src:'lecture' },
{ id:'q1-30', lec:'diagnosis-tx-planning', type:'mcq', stem:"Under which CDT code does periodontal charting/screening fall, as part of a new-patient exam?", choices:['D0150 — Comprehensive Oral Evaluation','D0120 — Periodic Oral Evaluation','D4341 — Periodontal Scaling and Root Planing','D0210 — Full Mouth Radiographs'], answer:0, ex:"D0150 is a thorough evaluation of extraoral/intraoral hard and soft tissue, including periodontal screening and/or charting.", src:'lecture' },

/* ===== Lecture 2 — Incisions, Flaps & Sutures ===== */
{ id:'q2-01', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which suture material is natural, monofilament, resorbs fastest (7–10 days), but handles very poorly?", choices:['Chromic gut','Poly-Glycolic Acid (PGA)','Silk','PTFE'], answer:0, ex:"Chromic gut: natural monofilament, 7–10 day resorption, low strength, mild reaction, very bad handling.", src:'lecture' },
{ id:'q2-02', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which suture material is synthetic and braided, resorbs slowest of the resorbable options (55–70 days), and is used for ridge and sinus augmentation?", choices:["Poly-Glycolic Acid (PGA)", "Chromic gut (natural, monofilament)", "Poly-Propylene (synthetic, monofilament)", "PTFE (synthetic, monofilament)"], answer:0, ex:"PGA: synthetic braided resorbable, 55–70 days, moderate strength, bad tissue reaction, great handling.", src:'lecture' },
{ id:'q2-03', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which non-resorbable suture is described as having no adherence to tissue, similar to nylon?", choices:['Poly-Propylene','Silk','PTFE','Poly-Glycolide (PGCL)'], answer:0, ex:"Poly-propylene is the non-resorbable monofilament that behaves like nylon: no adherence to tissue. PTFE is the look-alike trap here: it is also a synthetic non-resorbable monofilament, but the lecture tags it as the high-cost option used in every surgery type except pure soft-tissue grafting, not the \"like nylon\" one.", src:'lecture' },
{ id:'q2-04', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which material causes the worst tissue reaction of all six sutures taught, despite handling very well?", choices:['Silk','Poly-Glycolide (PGCL)','PTFE','Chromic gut'], answer:0, ex:"Silk: natural braided non-resorbable, high strength, very bad tissue reaction, great handling — and must be removed at 7 days.", src:'lecture' },
{ id:'q2-05', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which non-resorbable suture must be physically removed, and at what interval?", choices:['Silk, at 7 days','PTFE, at 7 days','Poly-Propylene, at 10 days','Silk, at 14 days'], answer:0, ex:"Silk is non-resorbable and is specifically noted as removed at 7 days.", src:'lecture' },
{ id:'q2-06', lec:'incisions-flaps-sutures', type:'match', stem:"Match each suture material to its construction.", pairs:[['Chromic Gut','Natural monofilament'],['Poly-Glycolic Acid','Synthetic braided'],['Silk','Natural braided'],['PTFE','Synthetic monofilament']], ex:"Only silk and PGA are braided; gut and PTFE are monofilament. Origin splits the other way: gut and silk are natural, PGA and PTFE synthetic.", src:'lecture' },
{ id:'q2-07', lec:'incisions-flaps-sutures', type:'mcq', stem:"What does a reverse cutting needle do differently from a standard cutting needle?", choices:['Its flat side faces the tissue on the upward pass, reducing tearing','It only cuts on the downward pass','It has no cutting edge at all','It is used only with non-resorbable sutures'], answer:0, ex:"On a reverse cutting needle the cutting edge sits on the outer curve, so the flat inner side faces the wound edge as the needle comes up. That makes it less likely to cut out through the tissue.", src:'lecture' },
{ id:'q2-08', lec:'incisions-flaps-sutures', type:'mcq', stem:"A larger needle-curvature arc produces what kind of bite?", choices:['A deeper bite','A shallower bite','No difference in bite depth','It only changes suture length'], answer:0, ex:"The more of a circle the needle's arc covers, the deeper it drives into the tissue for the same entry point, so a larger curvature gives a deeper bite.", src:'lecture' },
{ id:'q2-09', lec:'incisions-flaps-sutures', type:'mcq', stem:"In suture sizing, what does a larger number mean, and what does that require?", choices:['Smaller diameter, needing more knots for security','Larger diameter, needing fewer knots','Larger diameter, needing more knots','Smaller diameter, needing fewer knots'], answer:0, ex:"Suture sizes run backwards: a bigger number (5-0 vs 3-0) is a thinner strand. Thinner material slips more easily, so it needs more throws to hold the knot.", src:'lecture' },
{ id:'q2-10', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which technique is essential for larger bone-augmentation procedures and prevents flap-margin inversion, but can constrict blood supply and cause necrosis if overtightened?", choices:['Horizontal mattress','Vertical mattress','Continuous locking','Sling'], answer:0, ex:"The horizontal mattress is the augmentation workhorse: it everts the margins and resists tension over a graft. Pulled too tight, it strangles the blood supply to the incision edge, which can lead to necrosis and dehiscence.", src:'lecture' },
{ id:'q2-11', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which technique approximates papillae in the esthetic zone and can also close oro-antral communications?", choices:['Vertical mattress','Horizontal mattress','Criss-cross','Periosteal anchorage'], answer:0, ex:"The vertical mattress gives maximal approximation and eversion without pressing down on the papilla, which is why it is used for papillae in the esthetic zone and to close oro-antral communications.", src:'lecture' },
{ id:'q2-12', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which technique risks the entire suture line coming undone if a single throw fails, especially with monofilament or high-glide material?", choices:["Continuous / continuous locking", "Single interrupted", "Vertical mattress (internal mattress)", "Sling around one tooth"], answer:0, ex:"Used for edentulous long-span areas, alveoloplasties, and apicoectomies — the bites sit close together for a good seal, but the whole line depends on every throw holding.", src:'lecture' },
{ id:'q2-13', lec:'incisions-flaps-sutures', type:'mcq', stem:"Which flap design offers limited access and is difficult to advance because of lateral attachment, making it best for minor augmentation or simple implant placement?", choices:['Sulcular flap','Trapezoidal flap','Split-thickness flap','Papilla-sparing flap'], answer:0, ex:"A sulcular flap has no vertical release, so the tissue stays attached on both sides. That limits access and makes it hard to advance, which is fine for minor augmentation or a simple implant.", src:'lecture' },
{ id:'q2-14', lec:'incisions-flaps-sutures', type:'mcq', stem:"A flap that leaves periosteum on the bone and reflects only the mucosa and submucosa is called what?", choices:['Split-thickness flap','Full-thickness flap','Sulcular flap','Pyramidal flap'], answer:0, ex:"Split thickness means the periosteum stays on the bone and only mucosa and submucosa are lifted. A full-thickness (mucoperiosteal) flap takes the periosteum with it and exposes bone.", src:'lecture' },
{ id:'q2-15', lec:'incisions-flaps-sutures', type:'mcq', stem:"Flap designs are classified along three axes. Which of these is NOT one of them?", choices:['Suture material used to close the flap','Bone exposure after flap reflection','Placement of the flap after surgery relative to the CEJ','Management of the papillae'], answer:0, ex:"Flaps are classified by bone exposure (full vs split thickness), by where the flap is placed afterwards relative to the CEJ (apical, coronal, not displaced), and by how the papillae are handled. Suture material is chosen separately.", src:'lecture' },
{ id:'q2-16', lec:'incisions-flaps-sutures', type:'recall', stem:"List the 5 surgical principles for incisions and flap design given in this lecture.", answer:"1) Firm, continuous incision stroke. 2) Incision at a distance from the lesion/bony defect. 3) Vertical incisions at the line angle of the tooth. 4) Periosteum reflected as an integral part of the flap. 5) The flap base as wide as its free edge.", src:'lecture' },
