t, leading to peri-implantitis and bone loss. You still need resistance and retention form (an abutment <b>3-4 mm</b> tall), the crown's thickness (<b>1 mm</b> for zirconia), and the implant's biologic width of about <b>3 mm</b>. For a molar: <b>3 (biologic width) - 1 (subgingival) + 4 (abutment) + 1 (crown) = 7 mm</b> minimum, from the bone to the opposing tooth.</li><li><b>Screw-retained, castable (true one-piece)</b>: about <b>4 mm from the platform</b> for the collar, the screw head and the material sealing the channel; so it can sit only <b>1 mm above the soft tissue</b> if there's no porcelain on top (4 mm minus the 3 mm biologic width), like a partially erupted tooth. Possible, but hard to keep clean.</li><li><b>Screwmentable</b>: a subgingival margin isn't a concern, because the cement is removed outside the mouth. 1 mm from the platform to the abutment margin + 4 mm of abutment for retention + 1-2 mm of zirconia = <b>6-7 mm from the platform</b>, or 3-4 mm above the soft tissue. TiBases come in 1-4 mm heights.</li></ul>\n<h4>17. Crown-to-implant ratio</h4>\n<p>There is more forgiveness on the crown-to-implant ratio than on a natural tooth's crown-to-root ratio (1:1), because an implant behaves like an ankylosed tooth with no PDL. But a larger ratio (a <b>15 mm crown, about 2:1</b>) may bring more prosthetic complications (screw loosening, fracture) or marginal bone loss from unfavorable force distribution; consider <b>splinting</b> the implants.</p>\n<h4>18. Emergence profile and the E, B and C zones</h4>\n<p>The <b>emergence profile</b> (not \"emergency profile\") is the contour of the implant restoration, controlled by the abutment or the crown, <b>between the implant platform and the soft tissue margin</b>. Starting at the platform:</p>\n<ul><li><b>C zone</b>: the first <b>1-1.5 mm</b>; kept <b>straight</b>, for the blood supply of the connective tissue and for bone remodeling. It's <b>determined by the abutment</b>.</li><li><b>B zone</b>: between C and E; variable, but <b>concave is preferred</b>, to keep tissue volume. It's the \"running room.\"</li><li><b>E zone</b>: the last <b>1 mm under the gingival margin</b>; directly related to how the crown and gingiva look. It's <b>determined by esthetics</b> and extends from the cervical of the wax-up.</li></ul>\n<p>Other authors call the E zone the <b>critical contour</b> (convex most of the time) and the B and C zones together the <b>subcritical contour</b> (straight to concave). The rules: to make the gingival margin <b>creep down (coronally)</b>, or if the implant is placed more <b>buccally</b>, make the E zone (even the B zone) <b>more concave</b>. To move the margin <b>up (apically)</b>, or if the implant is more <b>lingual</b>, make it <b>more convex</b>. On the palatal side, follow the natural tooth contour. You'll practice this in the lab.</p>\n<h4>19. Teflon (PTFE) tape</h4>\n<p>Plumber's tape, made to seal pipe threads, is now the popular material for <b>sealing the screw channel</b> (it used to be gutta percha, PVS or a cotton pellet). Pack it densely into the channel, <b>leaving about 2 mm</b>, then add <b>packable composite</b> on top. The composite must never touch the screw head, or the screw is no longer retrievable; and cement must not run into the channel either.</p>\n<h4>20. Verification index (jig)</h4>\n<p>For a <b>splinted implant FPD</b>, a verification index confirms that the implants' relationship on the cast matches the mouth, because every impression carries some error, and an implant bridge is far less forgiving than a tooth-borne bridge (<b>no PDL</b>). After the PVS impression is poured, splinted resin indexes are made on the cast, bound to <b>non-engaging</b> temporary abutments (an engaging part might bind and hide a misfit). The index is <b>sectioned, re-splinted with resin in the mouth</b> (the intraoral relationship is the most accurate), and taken back to the cast, where it must <b>passively</b> reseat on the analogs. The lab technician can help. (A non-engaging index checks position, not rotation.)</p>\n<p>Two ways to check that a framework fits passively: the <b>one-screw test (Sheffield test)</b>: tighten only the screw at the far end and watch whether the other abutments lift; and <b>tactile sense</b>: tighten several screws gently and slowly, and extra resistance on one means it isn't passive.</p>\n<h4>21. Placement and loading timeline (ITI 2018)</h4>\n<div class=\"rv-table-wrap\" data-title=\"Implant placement and loading timeline (ITI 2018)\"><table class=\"rv-table\"><thead><tr><th>Term</th><th>Timing</th></tr></thead><tbody>\n<tr><td>Immediate placement</td><td>Same day as the extraction</td></tr>\n<tr><td>Early placement</td><td>With soft tissue healing (4-8 weeks) or partial bone healing (12-16 weeks) after extraction</td></tr>\n<tr><td>Late placement</td><td>After complete bone healing, more than 6 months after extraction</td></tr>\n<tr><td>Immediate loading</td><td>Within 1 week of implant placement</td></tr>\n<tr><td>Early loading</td><td>Between 1 week and 2 months after placement</td></tr>\n<tr><td>Conventional loading</td><td>More than 2 months of healing, with no prosthesis connected</td></tr>\n</tbody></table></div>\n<p>The consensus graded each combination: <b>conventional loading</b> is scientifically and clinically valid after immediate, early or late placement; <b>late placement with early loading</b> is valid too; immediate placement with immediate or early loading, and late placement with immediate loading, are clinically documented; early placement with immediate or early loading has insufficient documentation. Follow your surgeon's decision. And note: <b>immediately attaching a provisional (immediate restoration or provisionalization) does not mean you have to put it under function (immediate loading).</b> If there's no need to load it, don't load it immediately.</p>\n<p>The ITI's criteria for immediate restoration or loading:</p>\n<ul><li>Intact socket walls</li><li>A facial bone wall at least <b>1 mm</b> thick</li><li>Thick soft tissue</li><li>No acute infection at the site</li><li>Bone apical and lingual to the socket, to provide primary stability</li><li>Insertion torque of <b>25-40 Ncm</b> and/or an <b>ISQ above 70</b></li><li>An occlusal scheme that protects the provisional during function</li><li>Patient compliance</li></ul>\n<h4>22. Anodizing titanium</h4>\n<p>Anodizing changes a titanium abutment's color by controlling the <b>thickness of its oxide layer</b> in an electrolytic bath at a specific voltage (about 65 volts for gold, about 75 for pink). The layer is under a micron thick, so it doesn't affect the fit, and grinding removes the color.</p>\n<h4>23. Dental codes</h4>\n<div class=\"rv-table-wrap\" data-title=\"ADA codes for implant treatment (student clinic fees)\"><table class=\"rv-table\"><thead><tr><th>Code</th><th>Description</th><th>Fee</th></tr></thead><tbody>\n<tr><td>D0367</td><td>Cone beam CT, both jaws</td><td>$159</td></tr>\n<tr><td>D6190</td><td>Radiographic/surgical implant index</td><td>$50</td></tr>\n<tr><td>D6190GS</td><td>Guided surgery implant index</td><td>$225</td></tr>\n<tr><td>D6190A</td><td>Implant diagnostics, prosthetics-driven surgery (charged with D6190 or D6190GS)</td><td>$0</td></tr>\n<tr><td>D7210</td><td>Surgical removal of an erupted tooth</td><td>$130</td></tr>\n<tr><td>D7953</td><td>Bone replacement graft for ridge preservation</td><td>$250</td></tr>\n<tr><td>D6010</td><td>Surgical placement of an endosteal implant body</td><td>$1,295</td></tr>\n<tr><td>D6051</td><td>Interim abutment</td><td>$100</td></tr>\n<tr><td>D6085</td><td>Abutment-supported provisional crown</td><td>$100</td></tr>\n<tr><td>D6057</td><td>Custom abutment</td><td>$300</td></tr>\n<tr><td>D6058</td><td>Abutment-supported porcelain/ceramic crown (single, cement-retained)</td><td>$550</td></tr>\n<tr><td>D6065</td><td>Implant-supported porcelain/ceramic crown (single, screw-retained)</td><td>$850</td></tr>\n<tr><td>D6068</td><td>Abutment-supported retainer for a porcelain/ceramic FPD (cement-retained)</td><td>$550 each</td></tr>\n<tr><td>D6075</td><td>Implant-supported ceramic retainer (screw-retained FPD)</td><td>$850 each</td></tr>\n<tr><td>D6245</td><td>Pontic, porcelain/ceramic</td><td>$550</td></tr>\n</tbody></table></div>\n<p>A cement-retained three-unit implant bridge is two custom abutments (D6057), two abutment-supported retainers (D6068) and a pontic (D6245); a screw-retained one is two implant-supported retainers (D6075) and a pontic.</p>\n", "prefab": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Prefabricated (stock) vs custom abutments: pros, cons, and when each is used</li><li>The abutments used during and after surgery: cover screw, healing abutment, temporary and final abutments</li><li>One-stage vs two-stage surgery, and who should get which</li><li>Engaging vs non-engaging temporary abutments</li><li>UCLA (cast) vs CAD/CAM custom abutments</li><li>Cement-retained vs screw-retained, the 5 mm rule, and peri-implantitis risk</li><li>What the lab needs from you</li></ul></div>\n<p>In this recorded lecture Dr. Chavali covers <b>prefabricated abutments</b>, the stock parts made by the manufacturer that fit any patient, and briefly one kind of custom abutment, the <b>UCLA abutment</b>. Dr. Arce covers custom abutments in more depth. In the PCD lab your last exercise is preparing a prefabricated abutment, and you'll see a demonstration of a custom one (you make its Regisil mockup). He flagged several exam questions as he went.</p>\n<h4>Two classes of abutments</h4>\n<p><b>Prefabricated</b> abutments, also called <b>stock</b> abutments, are already manufactured: take one off the shelf and use it on any patient, one size fits all. <b>Custom</b> abutments are made for one patient. Prefabricated abutments have real shortfalls, which is why the clinic almost always uses custom ones.</p>\n<h4>Abutments by stage</h4>\n<p>His own way of sorting them (not from the literature):</p>\n<ul><li><b>During surgery (pre-prosthetic)</b>: the <b>cover screw</b> and the <b>healing abutment</b>.</li><li><b>Temporary abutments</b>: prosthetic abutments that can go on at the time of surgery, for a cement-retained or screw-retained provisional.</li><li><b>Final abutments</b>: prefabricated final abutments, or custom abutments: the cast <b>UCLA</b>, or a <b>CAD/CAM</b> milled abutment.</li></ul>\n<h4>One-stage and two-stage surgery</h4>\n<p>In <b>two-stage</b> surgery the surgeon opens a flap, places the implant, puts on a <b>cover screw</b> and closes everything. A few months later the flap is reopened, the cover screw removed and a <b>healing abutment</b> placed, with the tissue sutured around it so it sticks out: the implant is now open (patent) to the mouth. It takes about <b>three weeks</b> for the tissue to heal around the healing abutment, and then you're ready for the final crown. In <b>one-stage</b> surgery there is no cover screw: the healing abutment goes on at placement and the tissue closes around it, so there's no second surgery.</p>\n<p>Choosing between them is an important decision. For <b>diabetics and smokers</b>, \"you don't want to take any chance\": close it up and let the implant heal completely, not open to the mouth. For a <b>young, healthy</b> patient with no medical history, no parafunctional habits and no heavy forces, one-stage is reasonable.</p>\n<h4>Healing abutments</h4>\n<p>Healing abutments come in different <b>heights</b>, <b>widths</b> and <b>emergence profiles</b>. The soft tissue height above the implant varies from patient to patient (much of it is genetic): use a <b>1 mm</b> healing abutment if the implant is very superficial, a much taller one if it's submerged deep. The profile shapes the tissue for the final crown: incisors get a <b>straight (narrow)</b> profile, and <b>molars and wide premolars</b> get a <b>wide</b> one, so the tissue heals into a diverging cuff; there's also a regular profile in between.</p>\n<h4>Temporary abutments</h4>\n<p>Temporary abutments are titanium and come <b>screw-retained</b> (titanium cylinders with notches) or <b>cement-retained</b> (with a plastic cap or sleeve on top to cement the provisional to). For a cement-retained provisional: seat the abutment, snap the sleeve on, reduce it for occlusal clearance, fill a vacuform matrix with Jet acrylic, seat it so the sleeve is picked up and bonds to the acrylic, trim the excess and cement with temporary cement. A short <b>conical</b> cement-retained abutment suits molars or tight occlusal clearance; a tall titanium cylinder suits cases that need height.</p>\n<p>Temporary abutments can be <b>engaging</b>, with a hex (a protuberance) that locks into the implant, or <b>non-engaging</b>, smooth and converging. The non-engaging screw-retained abutment is the one used for a <b>bridge</b>.</p>\n<p>The screw-retained provisional has the advantage of <b>no excess cement</b>. Cement that escapes under an implant restoration acts like calculus and causes gingival inflammation, <b>peri-implant mucositis and peri-implantitis</b>. For an immediate screw-retained provisional, the titanium cylinder is placed, picked up in the Jet acrylic, finished outside the mouth, screwed back in and the screw hole closed with composite. Once the tissue architecture is formed, the final impression is taken.</p>\n<h4>The prefabricated abutment</h4>\n<p>A prefabricated final abutment is prepared like a crown-and-bridge tooth, for example with a <b>chamfer margin</b>, on the <b>implant analog</b> in the stone model; the crown is made on it, the abutment seated in the mouth, its screw hole blocked with Teflon tape and a resin, and the crown cemented.</p>\n<div class=\"rv-table-wrap\" data-title=\"Prefabricated vs custom abutments (Dr. Chavali)\"><table class=\"rv-table\"><thead><tr><th></th><th>Prefabricated (stock)</th><th>Custom</th></tr></thead><tbody>\n<tr><td>Fit</td><td>Very precise: same manufacturer, same milling, tight tolerances</td><td>Precise too: originals milled by the manufacturer or under its patents</td></tr>\n<tr><td>Cost</td><td>Cheap: about $50 from the manufacturer, sometimes free (BioHorizons)</td><td>About $150-200 from a lab</td></tr>\n<tr><td>Strength</td><td>Said to be high</td><td>High</td></tr>\n<tr><td>Preparation</td><td>Must be modified (margins dropped, prepared like a tooth)</td><td>Designed to fit; little or no prep</td></tr>\n<tr><td>Margin</td><td>Can end up deep under the tissue if the implant is deep, trapping cement</td><td>Placed where you want, near or above the gum line: cement cleans up</td></tr>\n<tr><td>Emergence profile</td><td>Thin \"thimble\" under a wide molar: poor</td><td>Excellent; looks like a customized crown prep</td></tr>\n</tbody></table></div>\n<p>The big disadvantage of a prefabricated abutment: if the implant is placed deep and no abutment is tall enough, its margin sits far below the gum, cement gets trapped, and no scalpel or sickle scaler can reach it, leading to <b>peri-implantitis</b>. A margin at or slightly above the gingiva (epigingival) is fine.</p>\n<p>Prefabricated abutments come in different <b>cuff heights</b> (1, 2, 3 and even 5 mm). Measure the soft tissue height by removing the healing abutment and probing from the implant collar to the deepest point of the gum, or on a <b>soft tissue model</b>, and choose the cuff height so the margin isn't too deep; a deep implant can't use a 1 mm cuff. They also come <b>straight or angled</b>: a malpositioned (off-center or misangled) implant needs an <b>angled</b> prefabricated abutment or a custom one. An implant placed far to the facial can't take a screw-retained crown, because the hole would show every time the patient smiles; it needs a <b>cement-retained</b> crown on an angled prefabricated or a custom abutment, which can pull the angulation back.</p>\n<p>In the second-floor clinic, \"99.9% of the time you're going to do a custom abutment.\"</p>\n<h4>Custom abutments: UCLA vs CAD/CAM</h4>\n<p>The <b>UCLA abutment</b> (University of California, Los Angeles) is a <b>plastic sleeve on a titanium base</b>, in diameters specific to each system. The lab cuts it down, adds wax to shape it, sprues it, invests it (gypsum-bonded, ethyl silicate or phosphate-bonded investment), burns it out and casts it: a <b>cast custom abutment</b>. A <b>CAD/CAM</b> custom abutment is designed on a computer from a scan and milled: the newer approach.</p>\n<h4>Cement-retained vs screw-retained</h4>\n<p>Either abutment, prefabricated or custom, can carry a cement-retained or a screw-retained crown. Cement-retained: screw in the abutment, cement the crown. Screw-retained: abutment and crown are one unit, screwed in through a hole in the crown.</p>\n<ul><li><b>Esthetics</b>: cement-retained is often more esthetic, especially when the implant emerges toward the facial; screw-retained can be less esthetic.</li><li><b>Peri-implantitis</b>: the risk is much higher with cement-retained crowns; none with screw-retained, because no cement is used. (An exam question.)</li><li><b>Biomechanics</b>: screw-retained can be less favorable if the implant isn't along the long axis, wasn't placed with a guide, or is malpositioned.</li><li><b>Space</b>: a cement-retained crown needs a <b>minimum of 5 mm of occlusal (interocclusal) clearance</b>.</li></ul>\n<p>\"This is an exam question\": if the interocclusal space is <b>5 mm or less, you must do screw-retained</b>; you have no choice. Above 5 mm you can do either, <b>unless the implant emerges so far facially that the access hole would come through the facial or buccal and show</b>; then you must use cement-retained.</p>\n<p>The numbers in the other lectures count from a different starting point: the terminology lecture's 7 mm for a cement-retained molar runs from the <b>bone</b> (including about 3 mm of biologic width), and Dr. Geisinger's table gives 7-8 mm for cement-retained and 7.5 mm for screw-retained crowns and bridges. Dr. Chavali's 5 mm is the clearance he asks you to check on the mounted casts; when a question names his rule, the answer is 5 mm.</p>\n<h4>What the lab needs</h4>\n<p>Another exam question: what you have to send the lab so they can make the abutment and crown.</p>\n<ul><li><b>Mounted casts</b>, with a <b>soft tissue model</b> (the pink material around the analog).</li><li>The <b>implant system</b>: Nobel, Straumann or BioHorizons, and the product line.</li><li>The <b>diameter</b> (3, 3.5, 4, 4.3, 5 mm...).</li><li>The <b>soft tissue height</b>, which the soft tissue model gives you.</li><li>A completed <b>implant order form</b> from the second-floor clinic.</li></ul>\n<p>Know the three systems (another example question): <b>BioHorizons</b> (3, 3.5 and 4 mm; the school uses its <b>internal</b> connection), <b>Nobel Biocare</b> (regular and narrow collars; conical connection, tri-lobe and external lines; the school uses the <b>conical connection</b>), and <b>Straumann</b> (tissue level and bone level; the school uses <b>bone level</b>). Implant analogs are color-coded by diameter.</p>\n<p>The multi-unit abutment used for All-on-4 cases is beyond the undergraduate level.</p>\n", "imaging": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Dr. Givan's study guide: the uses of imaging in the three phases of implant treatment</li><li>The three most common imaging modalities for implants, and ALARA</li><li>Advantages and disadvantages of periapical and panoramic images</li><li>Medical CT vs cone beam CT; the Hounsfield scale</li><li>Advantages and problems of CT scans, and their artifacts</li><li>Scan templates and prosthetically driven planning; implant planning software</li></ul></div>\n<p>Dr. Daniel Givan (Restorative Sciences) gave this as the first half of one session; the second half, the basic science of CBCT, is the next lecture. \"It would be nearly impossible to do implantology without the help of imaging\": imaging shows what's happening at the crest, within the trabecular bone, where the implant sits and in the supporting structures. His hint for the exam, from the course: <b>be able to answer the details on his study guide</b> (\"what do I want you to know\"). This lecture covers its first ten items.</p>\n<h4>Prosthetically driven, biologically balanced</h4>\n<p>Implants are placed for a purpose: \"not because the patient is suffering from titanium insufficiency.\" The patient wants teeth, so what matters is the <b>prosthesis</b> (an implant crown, an implant denture), and the implant exists to support it. That's why implant planning is a <b>prosthetically driven but biologically balanced</b> process: you can plan the prosthesis however you like, but without supporting structures to put the implant into, it won't work. You need to know where the teeth must be, how they'll be supported, and how to place the implant without violating sensitive structures (the inferior alveolar nerve, a site with no blood supply), and esthetics drives much of it too.</p>\n<h4>Imaging in the three phases of treatment</h4>\n<ul><li><b>Phase 1, pre-surgical</b>: determine the <b>quality, quantity and angulation of bone</b>; locate <b>critical structures</b> relative to the proposed implant sites; determine whether <b>disease</b> is present at those sites.</li><li><b>Phase 2, surgical and interoperative</b>: evaluate the sites during and immediately after surgery; assist the <b>optimal position and orientation</b> of the implants; evaluate the healing and integration phase; make sure the <b>abutment position and prosthesis fabrication</b> are correct.</li><li><b>Phase 3, post-prosthetic</b>: begins once the prosthesis is placed and lasts <b>as long as the implants remain</b>; evaluates long-term maintenance of rigid fixation and function, including the <b>crestal bone level</b> and the implant complex. The crest is the early warning sign that an implant may be lost.</li></ul>\n<h4>Modalities</h4>\n<p>The options include periapical, panoramic, occlusal and cephalometric radiography, tomography (including CBCT), computed tomography, MRI and interactive CT. The <b>three most common for implant therapy</b> are <b>periapical, panoramic and cone beam CT</b>. The guiding principle when choosing: <b>ALARA</b>, \"as low as reasonably achievable\" dose.</p>\n<p>A CBCT is roughly <b>three times a panoramic image</b> and about <b>a tenth of a medical CT</b>. Be skeptical of manufacturers' dose figures (a pan at 26 microsieverts, a full-mouth series at 150, a medical CT at 1,200-3,300, and some CBCTs quoted very low): they leave out the scout images, positioning and the size of the area scanned, so real CBCT doses are generally higher than the vendors say.</p>\n<h4>Periapical images</h4>\n<p>\"Intra-oral radiographs can be very accurate when taken with extreme care.\"</p>\n<ul><li><b>Advantages</b>: <b>very high resolution</b>.</li><li><b>Disadvantages</b>: <b>no bone width</b>; <b>no quantitative bone quality</b>; <b>magnification and distortion</b> (from angulation errors).</li></ul>\n<p>PAs and bitewings are by far the number one go-to for monitoring implants: take them at <b>baseline</b> and follow them routinely, looking at the crest for bone right against the implant or a defect starting. A standard PA works for planning and placement; for following bone levels during maintenance, a bitewing-style film parallel to the crest is best.</p>\n<h4>Panoramic images</h4>\n<p>The panoramic image is the most common image in dentistry. It shows the <b>overall status of the teeth and supporting bone</b>, anatomical anomalies and pathology, and sorts sites into those where implants will be straightforward, those that need grafting or distraction, and those where implants aren't advisable. It's an <b>excellent screening</b> tool, with <b>terrible superimposition, distortion and magnification</b>.</p>\n<ul><li><b>Reddy et al. 1994</b>: errors as large as <b>30%</b> in estimating bone height from panoramic films, and <b>bone width cannot be estimated at all</b>.</li><li><b>Advantages</b>: a very good overview.</li><li><b>Disadvantages</b>: no bone width; no quantitative bone quality; <b>variable magnification</b>; <b>patient positioning is crucial</b>.</li><li><b>Measuring through the magnification</b>: put <b>ball bearings of known diameter</b> (usually <b>4-5 mm</b>) in a radiographic template, measure them on the pan and get the magnification (distortion) ratio. It's valid only <b>vertically</b>, and only <b>in the area of the focus</b>.</li></ul>\n<p>To assess bone width you need <b>cross-sectional imaging</b>. A pan's focal trough is wide, about 8-15 mm; a panoramic slice from a CBCT is about a millimeter thick, with cross-sections through it.</p>\n<h4>Tomography</h4>\n<p>A <b>tomogram</b> is a two-dimensional image of a slice or section through a three-dimensional object. In conventional tomography (tomography by blurring), the x-ray source moves one way while the film moves the opposite way during the exposure, so structures in the focal plane stay sharp and those in other planes blur. The <b>tomogram</b> is the picture, the <b>tomograph</b> the apparatus, and <b>tomography</b> the process.</p>\n<h4>Medical CT vs cone beam CT</h4>\n<div class=\"rv-table-wrap\" data-title=\"Medical CT vs cone beam CT\"><table class=\"rv-table\"><thead><tr><th></th><th>Medical CT</th><th>Cone beam CT</th></tr></thead><tbody>\n<tr><td>Beam</td><td>Fan beam</td><td>Cone-shaped beam from the source to a flat panel</td></tr>\n<tr><td>Rotation</td><td>Very rapid</td><td>Relatively slow</td></tr>\n<tr><td>Data</td><td>A helix or spiral, interpolated into a set of slices</td><td>2-D projections reconstructed into a 3-D volume (needs significant computing power)</td></tr>\n<tr><td>Volume</td><td>Large anatomical regions very quickly</td><td>A medium-sized volume in a single rotation</td></tr>\n<tr><td>Patient position</td><td>Supine: claustrophobic, soft tissues collapse, TMJ not in its natural position</td><td>Sitting up (or standing): more comfortable</td></tr>\n<tr><td>Dose</td><td>Higher</td><td>Lower (5x to 10x less)</td></tr>\n<tr><td>Contrast</td><td>Better soft tissue contrast</td><td>More Compton scatter, so less soft tissue contrast</td></tr>\n</tbody></table></div>\n<p>Early cone beams were supine too, but makers soon realized that, like a pan, they work with the patient sitting or standing. They cost roughly $75,000 to $250,000.</p>\n<h4>The Hounsfield scale</h4>\n<p>\"________ ________ scale is a measure of radiodensity\": the <b>Hounsfield unit</b> scale, named for the founder of CT. For quantitative measurement of bone density, relative radiodensity is correlated to known tissue densities and measured in Hounsfield units. The values are hoped to relate to the primary stability an implant will get, but <b>current evidence does not support</b> that. (The study guide asks you to know this definition and the slightly different one in the next lecture: HU describe a voxel's attenuation relative to air and water.)</p>\n<h4>Advantages of a CT scan</h4>\n<ul><li><b>Accurate length measurements</b>: bone width, height and depth (within about 0.1-0.5 mm in all three directions, so you can plan safety zones around the nerve and neighboring teeth).</li><li><b>Freedom from geometric distortion.</b></li><li><b>Quantitative assessment of bone quality</b>: profiles and histograms (though with CBCT it's mostly qualitative).</li><li><b>Models and drill guides.</b></li><li><b>Diagnostic quality images.</b></li><li>The possibility of <b>flapless surgery</b>: if you know exactly where the implant goes, you can punch through the tissue without a flap. Possible, though not done much.</li></ul>\n<h4>Problems with CT scans</h4>\n<ul><li><b>Remove dentures</b> or other fixtures with metal clasps, reinforcements or chrome-cobalt bases before scanning.</li><li>Some suggest replacing amalgam with composite if the tooth will be sacrificed anyway (an ethical question).</li><li>Metal restorations scatter the beam (Compton scatter) and make the image hard to read; zirconia is less of a problem.</li><li>Patient movement during the scan blurs the image.</li></ul>\n<h4>Artifacts</h4>\n<ul><li><b>Motion artifact</b>: the patient or the scan template moves during scanning (a dark gap between template and tissue gives it away).</li><li><b>Starburst artifact</b>: arises when there are <b>sharp changes in density</b>, between air and bone or between bone and dense metal. It's caused by limits in <b>high-frequency sampling</b>, <b>not by scattered radiation</b>.</li><li><b>Beam hardening</b>: occurs when metals are present; metals <b>filter the low-energy x-rays</b> out of the beam, so parts of the image appear <b>black</b>.</li><li><b>Titanium implants produce little artifact, while gold produces a lot.</b></li></ul>\n<h4>Scan templates</h4>\n<p>The study guide's freebie: a <b>scan template</b> is a temporary prosthesis, worn during the CT scan, that replaces the missing teeth so they show up in the volumetric image, letting you see the proposed teeth in 3-D against the existing bone. It gives rise to the theme of treatment planning: <b>prosthetically driven implant planning and surgery</b>. If you know where the proposed restorations will be, the implant support can be planned. The template:</p>\n<ul><li>Provides <b>inter-arch stability</b> and holds the position relationship during the scan.</li><li><b>Opens the vertical dimension slightly</b> (a few mm), which improves the imaging of the teeth.</li><li>Lets you see the <b>orientation and dimensions of the proposed restoration</b> in the CT images (for example with gutta percha markers on the denture teeth or wax-up).</li></ul>\n<p>Next year this is balanced with biology: the plan must fit the existing structures, or the ability to augment them.</p>\n<h4>The process</h4>\n<ol><li><b>Planning</b>: fabricate a radiographic guide; scan the patient; plan in the software.</li><li><b>Optional guided surgery</b>: fabricate the surgical guide from the digital plan; complete guided surgery. A drill guide may rest on <b>bone, mucosa or teeth</b>, and a <b>sleeve</b> in the guide directs the drill's position, orientation and depth.</li></ol>\n<h4>Implant planning software</h4>\n<p>In interactive planning software, implants are added virtually into the CBCT image and viewed three-dimensionally. Examples: <b>Simplant</b> (Dentsply Sirona/Materialise), <b>Implant Design Studio</b> (3Shape), <b>Nobel Clinician</b> (Nobel Biocare), <b>coDiagnostiX</b> (DWOS/Straumann), <b>Invivo</b> (Anatomage) and <b>Blue Sky Bio</b>. Views include the panoramic slice and its cross-sections, plus sagittal and coronal views; which ones a clinician uses depends on their training.</p>\n", "cbct": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Dr. Givan's study guide, items 11-19: what CBCT stands for and how it operates</li><li>The x-ray source: kVp, thermionic emission, characteristic and Bremsstrahlung x-rays, a polyenergetic beam, filters and collimators</li><li>Attenuation and the four interactions of x-rays with tissue (and the two that matter most)</li><li>Digital receptors: computed radiography vs indirect flat-panel detectors; pixels, resolution, signal-to-noise and dynamic range</li><li>ROI, FoV and ALARA</li><li>Processing: basis images, reconstruction, voxels, DICOM, the views</li><li>Artifacts: scatter, beam hardening, motion; and why Hounsfield units are unreliable in CBCT</li></ul></div>\n<p>After the break Dr. Givan went back to basic science: how x-rays are made, how they pass through tissue and how a cone beam turns them into a volume. He admitted it's tough material, but it explains two things you'll fight with every day: why imaging is hard around metal (most of your patients' mouths) and why some numbers on a CBCT can't be trusted. Modern CBCT came to dentistry in the late 1990s. Most dental use of CBCT software is virtual planning, with a small but growing share for guided surgery.</p>\n<h4>Radiation principles</h4>\n<p>\"Medical imaging has come to represent the largest man-made source of ionizing radiation in developed countries.\" Hence <b>ALARA</b>, a dose \"as low as reasonably achievable\"; a <b>field of view</b> limited to the area of interest; and shielding, collimation and other safety steps.</p>\n<h4>How a CBCT works</h4>\n<p><b>CBCT</b> stands for <b>cone beam computed tomography</b>. In 3-4 sentences, the study guide's summary:</p>\n<ul><li>An <b>x-ray source and a detector</b> are mounted on a <b>rotating gantry</b> (the frame that holds them), with the patient positioned in the axis of rotation.</li><li>A <b>cone- or pyramid-shaped</b> x-ray beam is directed through the patient's <b>region of interest (ROI)</b>.</li><li>In a single <b>180 or 360 degree</b> rotation, a series of sequential planar images is captured (usually several hundred).</li><li>The planar images are combined by algorithms into a <b>volume</b>, which can be viewed in the three orthogonal planes (axial, sagittal, coronal), in multiplanar views or as a 3-D iso-surface.</li></ul>\n<p>Remember: in tomography the source and detector rotate around the patient, who can be supine, sitting or standing. The imaging chain runs from the <b>source</b> (generates x-rays), through the <b>patient</b> (x-rays are attenuated), to the <b>detector</b> (receives what's left and converts it to a digital signal).</p>\n<h4>The source</h4>\n<p>The x-ray tube is a vacuum tube with a <b>cathode</b> and an <b>anode</b>. A voltage is applied across them, measured as the <b>peak kilovoltage (kVp)</b>. The cathode filament is heated until it emits electrons: <b>thermionic emission</b>. The electrons fly to the anode and strike its <b>focal spot</b> (about <b>0.5 mm</b>, made of <b>tungsten</b>; the spot's size affects sharpness) at high velocity. About <b>99% of their energy becomes heat</b> and only about <b>1% becomes x-ray photons</b>. The anode is tilted to aim the x-rays at the tube's exit window.</p>\n<p><b>kVp and energy</b>: the voltage sets how much kinetic energy the electrons gain, so <b>higher kVp means higher-energy x-rays</b>. Higher-energy (\"hard\") photons are less affected by attenuation, penetrate more and suit dense or thick tissue: they're the ones wanted for medical imaging (and airport security). Low-energy (\"soft\") x-rays, used for mammography and crystallography, are filtered out in CBCT. What kind of x-ray comes out depends on the focal spot material and the energy of the striking electron.</p>\n<h4>Two ways x-rays are made</h4>\n<ul><li><b>Characteristic x-rays</b>: most electrons miss the tungsten atoms and just make heat, but about 1% knock out an <b>inner-shell (K-shell) electron</b>. An outer-shell electron drops in to fill the vacancy and releases the difference in binding energy as a photon of a <b>very specific energy</b> (the K and L lines).</li><li><b>Bremsstrahlung (\"braking\") x-rays</b>: electrons passing near a tungsten <b>nucleus</b> are slowed and redirected by its pull, and the lost energy leaves as an x-ray. The energy <b>varies with how close</b> the electron passes.</li></ul>\n<p>So the overall beam is <b>polyenergetic</b>: it contains photons of varying energies in a continuous spectrum.</p>\n<h4>Filtering</h4>\n<p>X-rays leave the anode in all directions, and only those reaching the exit window leave the tube. The window is covered by the <b>primary filter</b>, usually <b>aluminum or copper</b> (2.5-10 mm), which absorbs the <b>low-energy photons</b>; those would otherwise be absorbed by the patient's tissue and only add dose (more damage). The beam is then delimited by <b>rectangular collimator plates of lead</b> alloy. To cut exposure further, the tube is <b>pulsed</b> in step with the detector, which can reduce exposure time by up to 50% (so the exposure time is shorter than the scan time); the tube current (mA) and kVp can also be controlled.</p>\n<h4>Attenuation</h4>\n<p>As the beam passes through the body, internal structures absorb or scatter part of it, and the rest reaches the detector to make the image. <b>Attenuation</b> is the <b>reduction of the intensity of an x-ray beam as it traverses matter</b>, by <b>absorption and/or deflection (scatter)</b> of photons. It depends on the beam's energy, the number of photons, and the <b>density</b> and <b>atomic number</b> of the absorber:</p>\n<ul><li>The <b>thicker</b> the material, the greater the attenuation (thick bone vs thin).</li><li>The higher the <b>atomic number and/or density</b>, the greater the attenuation. Gold (atomic number 79, density 19.32 g/cm³) scatters a lot around gold restorations; titanium (atomic number 22, 4.43 g/cm³) scatters little.</li></ul>\n<h4>Four interactions with tissue</h4>\n<ol><li><b>No interaction</b>: the photon passes straight through to the detector; that area looks radiolucent.</li><li><b>Absorption: the photoelectric effect</b>. The photon gives up all its energy colliding with an atom and ejects a K-shell electron, leaving an ion; this is why x-rays are ionizing radiation. Its probability <b>rises with atomic number</b> (why lead, atomic number 82, shields) and <b>falls as photon energy rises</b> (why high-energy beams penetrate).</li><li><b>Rayleigh scattering</b> (also called Thomson, coherent or classical scattering): the photon interacts with the whole atom and <b>changes direction without changing energy</b>. It increases with atomic number but is a <b>minor</b> contributor.</li><li><b>Compton scattering</b>: the photon is deflected by an <b>electron</b>, which gains energy and is ejected; the photon loses energy and travels on along a new path with a longer wavelength. If it's detected and reconstructed, it appears as an <b>artifact</b>. Compton scatter is the main difference between CBCT and medical CT images.</li></ol>\n<p>The <b>two most important</b> are <b>absorption (photoelectric) and Compton scattering</b>.</p>\n<h4>Receptors</h4>\n<p>Film was the original (analog) receptor. There are two kinds of digital receptors:</p>\n<ul><li><b>Computed radiography (CR)</b>: <b>phosphor plates</b> sensitive to x-rays capture a latent image, a <b>laser scanner</b> reads it out to digital, and the plate is erased for reuse. UAB uses phosphor plates for its periapicals and bitewings. CR is <b>not used for CBCT</b>.</li><li><b>Direct radiography (DR)</b>: x-rays are converted directly or indirectly to electrical impulses. A <b>direct detector</b> (x-ray to photoconductor to signal) is older and uncommon in CBCT. An <b>indirect detector</b> is the most common with CBCT: <b>x-rays → visible light → photoconductor → signal</b>.</li></ul>\n<p>There are three kinds of indirect detectors: <b>flat panel TFT (thin-film transistor) arrays</b>, the <b>most common</b>; <b>CMOS</b>, newer but less common; and <b>CCD</b>, less common.</p>\n<h4>The flat panel detector</h4>\n<ul><li><b>Outer layer, the scintillator</b>: a material such as thallium-doped cesium iodide converts each x-ray photon into visible light, in proportion to its intensity.</li><li><b>Middle layer, the thin-film transistor layer</b>: an array of <b>photodiodes</b>, receptors of light that each generate an electric signal in proportion to the light reaching them. Each receptor is a <b>pixel</b> (picture element).</li><li><b>Inner layer</b>: electronics that amplify and encode the signals.</li></ul>\n<p>Because x-rays can't be focused, the detector has to be the same size as the image. <b>Reducing the pixel size increases resolution</b> but leaves fewer photons per pixel, <b>worsening the signal-to-noise ratio</b>; better resolution with low noise takes more dose. The ability of a pixel to distinguish changes from light to dark is its <b>dynamic range</b>, described as <b>gray scale resolution</b> and measured in <b>bit depth</b> (most systems are 14 or 16 bit). Higher bit depth gives finer distinctions as bone changes, at a cost: it's one of the things that drives up the price of a machine.</p>\n<h4>ROI, FoV and ALARA</h4>\n<ul><li><b>Region of interest (ROI)</b>: the scan volume you want, the area within the field of view that you need to study.</li><li><b>Field of view (FoV)</b>: the cylindrical volume the machine forms around its axis of rotation, determined mainly by the CBCT's size, movement and the <b>collimation</b> of the beam. It can be set to different sizes, and that changes the patient's dose.</li><li><b>ALARA</b> recommends using only the FoV you need. If the FoV is smaller than the ROI, several volumes can be stitched or blended together.</li></ul>\n<h4>Acquisition</h4>\n<p>The patient is centered between source and detector, and as the gantry rotates the beam is attenuated through the patient and a <b>single image</b> is collected: a <b>basis image</b>. Several hundred basis images (128-1024, depending on the gantry rate and the detector's frame rate) are captured in one rotation and later <b>reconstructed</b> into the projection volume. Scans typically take 5-40 seconds. More basis images improve the signal-to-noise ratio and reduce scatter, but raise the dose and the reconstruction time.</p>\n<h4>Processing</h4>\n<p>Reconstruction turns the basis images into volumetric data through a series of complex <b>mathematical transformations and algorithms</b>: corrections for pixel defects and uneven exposure, a <b>sinogram</b> made by the Radon transformation, and then the <b>Feldkamp-Davis-Kress (FDK)</b> algorithm, a filtered back-projection. It takes 1-20 minutes.</p>\n<p>In the image matrix, each cell is a <b>pixel</b> (picture element); when the matrix is reconstructed into a volume, each cell is a <b>voxel</b> (volume element). A CBCT voxel is <b>isotropic</b>, a cube (typically 0.09-0.4 mm), so the volume can be viewed accurately in any direction.</p>\n<p>The data are usually proprietary, so they're exported in a standard format, <b>DICOM</b> (Digital Imaging and Communications in Medicine), used for all kinds of medical imaging, including CT and MRI. Viewing software then shows:</p>\n<ul><li>The three <b>orthoplanar</b> views: <b>axial, sagittal and coronal</b>, plus multiplanar views at any angle.</li><li>The two common views along the dental arch: <b>panoramic</b> and <b>cross-sectional</b>.</li><li><b>3-D surface reconstructions</b>, to show the surface contours of a structure. Multiplanar views are accurate for linear measurements; 3-D surface reconstructions are not recommended for measuring.</li></ul>\n<h4>Sharpness and resolution</h4>\n<p>Geometric unsharpness (the <b>penumbra</b>, \"almost shadow\") depends on the <b>focal spot size</b> (smaller is sharper), the <b>source-to-object distance</b> and the <b>object-to-detector distance</b>; the gantry has to clear the patient's head and shoulders, which is why C-shaped gantries are common. Spatial resolution depends mainly on <b>voxel size</b> and focal spot, and also on the beam geometry, scatter, patient movement, detector blur, the number of projections and the reconstruction algorithm.</p>\n<h4>Artifacts</h4>\n<p>An <b>artifact</b> is any distortion or error in the image unrelated to the subject. Medical CT has fewer than CBCT, because of its higher energies, geometry and lower noise.</p>\n<ul><li><b>Scatter</b>: diffracted x-rays cause <b>streaking</b> and grainy noise.</li><li><b>Partial volume averaging</b>: a voxel bigger than the object averages bone and soft tissue into a gray that represents neither; choose the smallest voxel.</li><li><b>Cone-beam effect</b>: distortion at the edges of the volume from the beam's divergence.</li><li><b>Under-sampling</b>: too few basis images: misregistration, fine striations (aliasing, a moiré effect).</li><li><b>Beam hardening</b>: as the beam passes through an object, <b>lower-energy photons are absorbed in preference to higher-energy ones</b>. It shows as <b>cupping</b> (distortion of metallic structures) or as <b>white streaks or dark bands</b> between two dense objects (extinction or missing-value artifacts). Manage it by reducing the field size, changing the patient's position and separating the arches; newer machines add artifact-reduction algorithms.</li><li><b>Patient motion</b>: misregistration that appears as <b>double contours</b>, easier to cause with small voxels. Minimized by a <b>head restraint</b> and a <b>short scan time</b>.</li></ul>\n<p>Contrast also suffers from scattered radiation, the <b>heel effect</b> (more noise on the cathode side) and detector problems such as saturation, dark current and bad pixels.</p>\n<h4>Gray values and Hounsfield units</h4>\n<p>Contrast is a range of grays from white to black. In multi-slice (medical) CT, gray values are calibrated to the <b>Hounsfield unit (HU)</b> scale, which describes a voxel's x-ray attenuation relative to <b>air (-1000)</b> and <b>water (0)</b>. In CBCT the HU scale is <b>unreliable</b>, because of the scatter of the cone-beam geometry and data truncation; values are uncertain and inconsistent, especially in low-contrast soft tissue, so use them with caution. For example, predicting the stability of an immediately placed and loaded implant from CBCT Hounsfield values is unreliable. (The study guide: \"unreliable (but still helpful) for treatment decisions, such as for immediate loading.\")</p>\n", "surgery": "\n<div class=\"tested\"><b>What's tested</b><ul><li>How osseointegration is defined, and what it looks like clinically (about 60% bone contact)</li><li>Early vs late implant failures, and what causes each</li><li>Peri-implant health, peri-implant mucositis and peri-implantitis: the case definitions</li><li>The risk factors for peri-implant disease, and how well it can be treated</li><li>Pre-surgical assessments and contraindications</li><li>Prosthetic space for each type of prosthesis</li><li>Esthetic risk factors</li><li>The surgical armamentarium: sequential drilling, heat, torque and stability</li></ul></div>\n<p>Dr. Mia Geisinger, Professor and Chair of Periodontology and Director of its advanced program, gave this lecture (\"Don't have a screw loose!\") on November 2. Her objectives: weigh the risks and benefits of implant-supported restorations, the criteria for implant success in the short and long term, how procedures change for particular patients and sites, and the armamentarium and general steps of placement.</p>\n<h4>Why implants</h4>\n<p>About <b>178 million</b> Americans are missing at least one tooth, about <b>40 million</b> are missing all their teeth, and <b>30%</b> of people aged 65-74 are completely edentulous (American College of Prosthodontists, 2015). About <b>5 million</b> implants are placed in the U.S. each year. Success means <b>health, function and esthetics</b>, and it depends on the bone, the soft tissue, the implant, the surgical technique and the restoration.</p>\n<h4>An implant is an ankylosed tooth</h4>\n<p>The tissue around an implant differs from the tissue around a tooth: the collagen fibers run <b>parallel and circular</b> to the abutment instead of obliquely into a root, and the implant is held by ankylosis (osseointegration), with no periodontal ligament. The peri-implant mucosa facing the abutment has two parts: a coronal <b>sulcular epithelium</b> with a thin <b>barrier epithelium</b> (like the junctional epithelium of gingiva), about 1.5-2 mm; and an apical <b>connective tissue adhesion zone</b>, about 1-1.5 mm, where connective tissue lies directly on the abutment. That long junctional epithelium is more susceptible to breakdown over time, so implants are more susceptible to disease.</p>\n<p>Because it can't move, an implant appears to move as the jaws keep growing through life: in perimenopause and menopause, for example, hormonal changes reshape the mandible and implants can seem to drift lingually and distally, or end up out of occlusion. That's why implants aren't placed in growing patients, and why pregnancy and menopause deserve thought. For the same reason a probing depth number alone doesn't diagnose an implant: a 5 mm reading may be normal for its placement depth. <b>Increasing</b> depths over time are what matter, so monitor implants with measurements over time.</p>\n<h4>Osseointegration: two definitions</h4>\n<ul><li><b>Brånemark et al., 1969</b>: an intimate <b>bone-to-implant contact</b> at a <b>light microscopic</b> level.</li><li><b>Albrektsson and Sennerby, 1991</b>: a <b>direct structural and functional connection</b> between <b>living bone</b> and the surface of a <b>load-carrying</b> implant. \"Living\" matters: a xenograft particle touching an implant isn't alive, so it isn't supporting it.</li></ul>\n<p>The clinical realities, from animal and human studies: only about <b>60%</b> of a roughened implant's surface shows mineralized bone contact, even in a healthy implant; that contact stops about <b>0.3 mm from the implant-abutment interface</b> (because of micromovement and bacteria there); and integration takes <b>6 weeks to 3 months</b> of healing. Bone right next to an implant has no nerve endings, so if a patient jumps when you tighten a component, you're on soft tissue.</p>\n<h4>Early and late failures</h4>\n<p><b>Early failures</b> are generally related to:</p>\n<ul><li><b>Surgical failures</b>: too much force placing the implant, too much speed and not enough irrigation, <b>overheating the bone</b> (massive necrosis), contaminating the site with a non-aseptic technique.</li><li><b>Occlusal overload</b>: heavy forces before osseointegration has reached secondary stability.</li><li><b>Impaired wound healing.</b></li><li><b>Poor bone metabolism or turnover.</b></li></ul>\n<p><b>Late failures</b> are generally related to:</p>\n<ul><li><b>Biologic complications</b>: peri-implant mucositis and peri-implantitis. There's good evidence that many are iatrogenic.</li><li><b>Occlusal overload.</b></li><li><b>Prosthetic complications.</b></li></ul>\n<h4>How well can we treat peri-implant disease?</h4>\n<p>Not well. Current peri-implantitis therapies show <b>short-term benefits at best</b>; some interventions report recurrence of up to <b>100% after 12 months</b>; overall, <b>75% of peri-implantitis cases remain unresolved or recur within 5 years</b> (Heitz-Mayfield and Mombelli 2014; Esposito 2012; Heitz-Mayfield 2018). If root canals failed 75% of the time, we wouldn't do them (they succeed about 86% at 10 years). So \"it is imperative that dental healthcare providers seek to center <b>prevention</b> of peri-implant disease as an integral part of implant therapy.\"</p>\n<h4>Peri-implant health, mucositis and peri-implantitis</h4>\n<p>Healthy peri-implant mucosa (histologically) has a core of connective tissue covered by keratinized or non-keratinized epithelium; it is about <b>3-4 mm</b> tall with an epithelial attachment about <b>2 mm</b> long, and small clusters of inflammatory (surveillance) cells sit next to the barrier epithelium. The case definitions (Renvert et al., 2018):</p>\n<div class=\"rv-table-wrap\" data-title=\"Peri-implant health, mucositis and peri-implantitis (2018 definitions)\"><table class=\"rv-table\"><thead><tr><th>Condition</th><th>Findings</th></tr></thead><tbody>\n<tr><td>Peri-implant health</td><td>No inflammation; no profuse bleeding on probing; probing depths may differ with placement depth and soft tissue height but don't increase over time; no further bone loss after initial healing (which should not be 2 mm or more)</td></tr>\n<tr><td>Peri-implant mucositis</td><td>Signs of inflammation (erythema, edema, changes in color, contour and consistency); profuse bleeding and/or suppuration on probing; increased probing depths vs baseline; no bone loss beyond the crestal changes of initial remodeling</td></tr>\n<tr><td>Peri-implantitis</td><td>Inflammation plus bleeding and/or suppuration on probing; increasing probing depths vs baseline; progressive bone loss compared with the radiographic bone level 1 year after the prosthesis was delivered</td></tr>\n<tr><td>Peri-implantitis, no baseline records</td><td>Radiographic bone level 3 mm or more from the most coronal part of the implant and/or probing depths of 6 mm or more, plus profuse bleeding</td></tr>\n</tbody></table></div>\n<p>Mucositis compared with gingivitis (Heitz-Mayfield and Salvi 2018): both are inflammation without bone (or attachment) loss, but <b>experimental mucositis</b> produces a <b>greater increase in bleeding sites</b> than experimental gingivitis, may take <b>longer than 3 weeks</b> to reverse clinically (although biomarkers resolve after 21 days of restored biofilm control), and after 3 months of plaque in dogs the inflammation is <b>more pronounced</b> around implants than around teeth. People are high or low responders to plaque either way.</p>\n<h4>Risk factors for peri-implant disease</h4>\n<div class=\"rv-table-wrap\" data-title=\"Factors associated with peri-implant mucositis and peri-implantitis\"><table class=\"rv-table\"><thead><tr><th>Category</th><th>Factors</th></tr></thead><tbody>\n<tr><td>Patient-related</td><td>Oral hygiene; professional maintenance; systemic diseases; tobacco use; systemic medications</td></tr>\n<tr><td>Implant-related</td><td>Implant design and surface characteristics; titanium dissolution products</td></tr>\n<tr><td>Implant site-related</td><td>Previous unresolved endodontic infection; previous implant failure; periodontal phenotype</td></tr>\n<tr><td>Prosthetic-related</td><td>Residual cement; occlusal overload; prosthetic contours</td></tr>\n<tr><td>Surgical-related</td><td>Implant malpositioning; non-adherence to surgical protocols; post-operative healing</td></tr>\n</tbody></table></div>\n<p>Implants are harder to keep clean than teeth because of their shape: there's more negative space in the peri-implant pocket. Old hydroxyapatite-coated implants integrated quickly, but once exposed to the mouth the coating dissolved, and bone loss progressed rapidly once peri-implantitis began. Titanium dissolution products can also change how the bacteria around implants behave. Site factors include the soft tissue thickness, the bone volume and the reason the tooth was lost.</p>\n<p><b>Primary prevention</b> of peri-implantitis: <b>risk assessment</b>, <b>treatment planning</b>, <b>implant site development</b> (hard and soft tissue, and restorative space) and <b>regular maintenance</b>. Dr. Geisinger finds \"prosthetically driven\" incomplete: implants should be <b>prosthetically driven and biologically executed</b>, with a top-down plan that starts from the tooth and builds the structures around it. About 80% of the implants she places today get soft tissue grafting at the same time.</p>\n<h4>Contraindications</h4>\n<p>Implants are an <b>elective</b> procedure, so the absolute contraindications are the risks of any elective procedure: a high-risk patient (a <b>recent heart attack or stroke</b>), <b>heavy nicotine use</b> (the equivalent of <b>10 or more cigarettes a day</b>, \"generally a contraindication\"), and patients who are <b>still growing</b>. Poor oral hygiene matters too.</p>\n<h4>Pre-surgical assessments</h4>\n<ul><li><b>Patient level</b>: medical and dental history; tobacco use; age and growth; hormonal influences; oral hygiene; parafunctional habits and occlusion; smile line; neuromuscular conditions; why the teeth were lost (caries vs perio); esthetic expectations; finances.</li><li><b>Site</b>: the size, shape and position of the tooth to be replaced; anatomical landmarks; bone volume and position (resorption in three dimensions); the skeletal relationship; vertical dimension; soft tissue volume, contours and quality; prosthetic space.</li><li><b>Implant</b>: position; length and width relative to the tooth being replaced; number of implants; A-P spread; whether they need splinting.</li><li><b>Surgical</b>: site assessment and any previous site preparation; anatomical concerns; restoration type; the implant system and its sequential drilling protocol; site-specific bone density; the placement torque; and positioning bucco-lingually, mesio-distally and apico-coronally.</li></ul>\n<p>Implant size changed with experience: Dr. Geisinger was once taught to drill a 25 mm implant down to the lower border of the mandible for bicortical stabilization. Today we know that <b>implants over 13.5 mm have a higher failure rate than implants of 8-13 mm</b>: \"longer and wider is not always better.\"</p>\n<h4>Guides and imaging</h4>\n<p>A <b>surgical/radiographic guide</b> is stabilized on the remaining dentition, gives accurate information for placing the implant in the required restorative position in three dimensions (bucco-lingual position, vertical position and angulation), and allows verification. Without an idea of the occlusal scheme and the prosthesis design, the radiographic assessment has no target. Imaging runs from 2-D (periapical, panoramic, occlusal, cephalometric) to tomography (CT/CBCT, MRI). The location and quality of the bone affect the implant's angulation, the prosthetic design and long-term success, and a <b>minimum of 1.0 mm of bone</b> is needed <b>buccally and lingually</b> at placement, more in the esthetic zone.</p>\n<p>Compared with freehand placement, <b>CBCT-aided</b> placement means less post-operative pain and fewer complications, less need for onlay or simultaneous grafting, and longer implants planned in posterior sites than when planning from a pan (Pozzi, Chan, Guerrero 2014). Know the scan's voxel size and slice spacing (often 0.1 or 0.3 mm): smaller voxels and closer slices mean more radiation. Static and dynamic guides both deviate significantly less from the plan than freehand placement: about 1.0-1.2 mm at the platform, about 1.3 mm at the apex and about 3.5 degrees of angle (static 1.16 mm, 1.3 mm, 3.43 degrees; dynamic 1.02 mm, 1.33 mm, 3.59 degrees).</p>\n<p>Space matters in every direction. Implants placed closer than 3 mm lose the peak of bone between them, and the papilla with it: an esthetic issue, not a safety one. An implant set right at the crest of a site with 15 mm of height, under a molar, gives a \"candy apple on a stick\" emergence; it needs apico-coronal room to flare out.</p>\n<div class=\"rv-table-wrap\" data-title=\"Minimal vertical (prosthetic) space by prosthesis\"><table class=\"rv-table\"><thead><tr><th>Prosthesis</th><th>Minimal vertical space</th></tr></thead><tbody>\n<tr><td>Non-splinted overdenture</td><td>10-12 mm</td></tr>\n<tr><td>Bar overdenture</td><td>11-14 mm</td></tr>\n<tr><td>Implant fixed crown and bridge</td><td>7-8 mm cement-retained; 7.5 mm screw-retained</td></tr>\n<tr><td>Fixed screw-retained zirconia prosthesis</td><td>10-12 mm</td></tr>\n<tr><td>Fixed screw-retained hybrid</td><td>15 mm or more</td></tr>\n</tbody></table></div>\n<p>Turned around, by the space available: under 10 mm, only fixed crown and bridge (no hybrid, no removable); 10-12 mm, crown and bridge or monolithic/layered zirconia, or a non-splinted overdenture (a bar overdenture is contraindicated); 12-15 mm, crown and bridge with pink porcelain, zirconia, or either overdenture; 15 mm or more, a hybrid (metal framework with acrylic) or a combination bridge, or either overdenture, but conventional crown and bridge is contraindicated. Sometimes it's best to start from the space available and design backward.</p>\n<h4>Esthetic risk factors</h4>\n<div class=\"rv-table-wrap\" data-title=\"Esthetic risk assessment\"><table class=\"rv-table\"><thead><tr><th>Factor</th><th>Low risk</th><th>Medium risk</th><th>High risk</th></tr></thead><tbody>\n<tr><td>Medical status</td><td>Healthy, intact immune system</td><td></td><td>Reduced immune system</td></tr>\n<tr><td>Smoking</td><td>Non-smoker</td><td>Light smoker (under 10 a day)</td><td>Heavy smoker (10 or more a day)</td></tr>\n<tr><td>Esthetic expectations</td><td>Low</td><td>Medium</td><td>High</td></tr>\n<tr><td>Lip line</td><td>Low</td><td>Medium</td><td>High</td></tr>\n<tr><td>Tissue biotype</td><td>Low-scalloped, thick</td><td>Medium-scalloped, medium thick</td><td>High-scalloped, thin</td></tr>\n<tr><td>Shape of tooth crowns</td><td>Rectangular</td><td></td><td>Triangular</td></tr>\n<tr><td>Infection at the implant site</td><td>None</td><td>Chronic</td><td>Acute</td></tr>\n<tr><td>Bone level at adjacent teeth</td><td>5 mm or less to the contact point</td><td>5.5-6.5 mm to the contact point</td><td>7 mm or more to the contact point</td></tr>\n<tr><td>Restorations on adjacent teeth</td><td>Virgin</td><td></td><td>Restored</td></tr>\n<tr><td>Width of edentulous span</td><td>1 tooth (7 mm or more)</td><td>1 tooth (under 7 mm)</td><td>2 or more teeth</td></tr>\n<tr><td>Soft tissue anatomy</td><td>Intact</td><td></td><td>Soft tissue defect</td></tr>\n<tr><td>Alveolar bone</td><td>No deficiency</td><td>Horizontal deficiency</td><td>Vertical deficiency</td></tr>\n</tbody></table></div>\n<p>A very narrow space, or a wide one with several implants side by side, makes full papilla fill unlikely.</p>\n<h4>What edentulism does to the jaws</h4>\n<ul><li>Decreased height and width of the supporting and basal bone.</li><li>Increased prominence of the mylohyoid ridge and superior genial tubercles.</li><li>Increased prominence of the mandibular canal.</li><li>Relative prominence of the mylohyoid and buccinator muscles.</li><li>A relative increase in the size of the tongue.</li><li>Less, and poorer, attached keratinized gingiva.</li></ul>\n<h4>The armamentarium and drilling</h4>\n<p>The osteotomy is cut with <b>sequential drills</b>, small to large, at a speed and diameter set by the system and the <b>bone density</b> (soft, normal or hard bone each have their own sequence). Starting with the biggest drill would remove a lot of bone at once, and the friction would overheat what remains: <b>bone heated above 47°C</b> (body temperature is 37°C) suffers <b>thermal necrosis</b>, which can be catastrophic. Copious saline irrigation protects the bone, but in a very deep osteotomy little irrigation reaches the bottom, which may be why long implants fail more. Straumann's protocol starts at about <b>800 RPM</b> and slows as the drills widen. For a 3.5 mm implant the last drill is <b>2.8 mm</b>, so the threads engage the bone. The first (pilot) drill is end-cutting with a deep bevel; the rest are side-cutting. Drills carry depth markings, and in the maxilla a wrong depth can reach the nose or brain, so Dr. Geisinger checks her probe against the drill at every change, like a pilot's checklist. The implant itself is threaded in slowly, under a <b>torque (Ncm) setting</b>, not at drilling RPM.</p>\n<h4>Torque and stability at placement</h4>\n<p>At placement she generally looks for stability between <b>15 and 35 Ncm</b>. <b>35 Ncm is the threshold for putting something transgingival</b> (a healing abutment or provisional through the tissue); an implant with less than <b>15 Ncm</b> is considered <b>unstable</b> and would spin in the osteotomy. An immediate implant that engages only the palatal bone can still be quite stable. \"Finger tight\" is about 15 Ncm; most components are torqued to about 35 Ncm, and over-tightening a healing abutment to 50-70 Ncm can risk the integration when it has to be backed out.</p>\n", "guided": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Surgically driven vs prosthetically driven implant placement</li><li>Freehand, static guided (semi-guided/pilot and fully guided) and dynamic guided surgery: how each works, pros and cons</li><li>Tooth-, tissue- and bone-supported guides, and which is most accurate</li><li>STL vs DICOM files, and the steps of planning a fully guided case</li><li>The best implant position in the anterior and posterior, and what to do when it isn't surgically possible</li><li>How the UAB student clinic does it, and the codes</li></ul></div>\n<p>The course's last PCD lecture of the year (Nov 2), built from Dr. Omar's materials and given by the course director, sorts out two separate questions: <b>where</b> the implant should go (surgically driven or prosthetically driven), and <b>how</b> it gets there (freehand, static guided or dynamic guided surgery).</p>\n<h4>Surgically driven vs prosthetically driven</h4>\n<p>The surgeon's job is to <b>find the bone</b> (with a CBCT) and, if there's no bone, to <b>create it</b> (grafting). The restorative dentist's job is to make the impression and <b>restore</b> the implant. An implant placed where the bone happens to be can be <b>surgically okay but restoratively not okay</b>; the reverse happens too. A common surgical mistake is placing the implant <b>too buccally</b>: the soft tissue migrates apically (recession), and the restoration looks wrong. An implant \"can be placed almost everywhere (except on a root, a nerve or air), but you need to be able to restore it.\" It needs to be <b>prosthetically driven</b> (and surgically acceptable).</p>\n<h4>The best position</h4>\n<ul><li><b>Posterior</b>: right at the middle of the wax-up or tooth contour: <b>mesio-distally in the middle</b>, and <b>bucco-lingually in the middle</b>, along the long axis.</li><li><b>Anterior</b>: mesio-distally along the <b>zenith</b> and the long axis; bucco-lingually at the <b>middle of the lingual surface, above the cingulum</b>.</li></ul>\n<p>These best positions may not be surgically feasible (a root, a nerve, air in the way), so <b>communication and compromise</b> are important. Options: accept a position slightly off axis from the plan (it can still be restored, with a <b>cement-retained</b> crown on a custom abutment if the screw channel would otherwise exit facially); <b>grafting</b>; or <b>enameloplasty</b> of the proximal or opposing teeth to make room. If enameloplasty will be needed, decide before the implant goes in; taking 2-3 mm off natural teeth is too much (it exposes dentin and causes sensitivity).</p>\n<h4>Freehand surgery</h4>\n<p>The traditional method: <b>no guide</b>, relying on the surgeon's experience and common sense. A CBCT is <b>still needed</b> (in the old days it was a PA and pano). Freehand surgery tends to follow where the bone is: it is <b>surgically driven</b>.</p>\n<ul><li><b>Advantage</b>: <b>cost-effective</b> (the patient doesn't pay for a guide).</li><li><b>Disadvantages</b>: <b>no input from the restorative dentist</b> if the surgeon isn't restoring it; a <b>higher risk of error in depth, angulation and position</b>, with pain, infection and potential implant failure (an implant hitting a neighboring root, or crowding a tooth despite plenty of room); a <b>steeper learning curve</b> for inexperienced clinicians.</li><li>Freehand can still achieve a good result with <b>frequent verification of the drilling axis</b>, intraorally or by x-ray (a guide pin or the drill left in the channel, then a PA before enlarging it), and with the prosthetic plan in mind.</li></ul>\n<h4>The surgical guide is how you communicate</h4>\n<p><b>Static guided</b> surgery uses a <b>fixed guide</b>, in two kinds:</p>\n<ul><li><b>Semi-guided (pilot-guided)</b> surgery uses a surgical template (stent). We <b>don't know what the bone looks like</b> underneath (the guide is a wax-up on the model, a suck-down and a tube, made without considering the bone), but it tells the surgeon where the best position for the implant is. It guides only the <b>pilot drill</b>; after that the surgeon can alter the axis or depth to fit the bone, freehand. <b>This is what the UAB student clinic does most of the time.</b></li><li><b>Fully guided</b> surgery: the axis and depth are designed in software from the <b>CBCT and a digital wax-up</b>, and the guide controls <b>every drill</b>. The surgeon <b>can't alter the implant position</b> unless they remove the guide. <b>Sleeves</b>, a <b>stop key</b> and a <b>drilling protocol</b> control the depth, angulation and location of placement.</li></ul>\n<h4>How a guide is supported</h4>\n<div class=\"rv-table-wrap\" data-title=\"Surgical guide support\"><table class=\"rv-table\"><thead><tr><th>Support</th><th>Note</th></tr></thead><tbody>\n<tr><td>Tooth-supported</td><td>Most accurate</td></tr>\n<tr><td>Tissue-supported</td><td>Tissue is soft, so the guide can move</td></tr>\n<tr><td>Bone-supported</td><td>Built from the CBCT, so it may carry distortion</td></tr>\n</tbody></table></div>\n<h4>Planning a fully guided case</h4>\n<p>It takes two kinds of scan files:</p>\n<ul><li><b>STL</b> (Standard Tessellation Language): a <b>surface scan</b> of the teeth and soft tissue, from an intraoral scanner or from scanning gypsum models.</li><li><b>DICOM</b> (Digital Imaging and Communications in Medicine): the medical image file, the <b>CBCT</b> (bone, soft tissue, nerve, sinus).</li></ul>\n<p>Why both? A CBCT captures little soft tissue, and radiopaque restorations (zirconia, amalgam) scatter and blur the contours of the teeth, so the surface scan supplies an accurate picture of the dentition. The steps:</p>\n<ol><li>Intraoral impression (digital or conventional) → the digital file of the dentition (<b>STL</b>).</li><li>CBCT → the <b>DICOM</b> file (bone, soft tissue, nerve, sinus).</li><li>Mount the models and wax up (digitally).</li><li><b>Align</b> the STL file and the CBCT scan together in the software.</li><li>Implant planning.</li><li>Design the surgical guide.</li><li>Print the guide.</li></ol>\n<p>A printed guide has an <b>inspection window</b> to confirm it's fully seated, <b>sleeves</b> that fit the stop key, and a <b>reference</b> such as the midline to confirm it's seated correctly. Guides can be one piece, two pieces (starting tissue-supported) or <b>stackable</b> (starting tooth-supported), and full-arch cases can be pinned in place before the teeth are removed (\"Smile in a Box\").</p>\n<ul><li><b>Advantages</b>: <b>high accuracy if seated correctly</b>; <b>reduced surgery time</b>.</li><li><b>Disadvantages</b>: <b>higher cost</b> (software, training, printer, printing resin); a <b>learning curve</b> for the workflow; <b>longer preparation time</b> (planning, printing, post-processing); and \"<b>blind surgery</b>\": over-trusting the guide can be risky, and the skill of spotting and accommodating a surprise is still needed.</li></ul>\n<h4>In the UAB student clinic</h4>\n<p>To encourage guided surgery, the clinic gives <b>extra crown credits</b> (up to two). Codes: <b>D6190</b> (radiographic/surgical implant index) <b>$50</b>; <b>D6190GS</b> (guided surgery implant index) <b>$225</b>. In the clinic workflow there's <b>no intraoral scan</b> for the impression: you need a high-quality alginate impression and casts mounted on an articulator. A conventional wax-up isn't needed for the guide (the wax-up is digital), but you still wax up before the final crown.</p>\n<h4>Dynamic guided surgery</h4>\n<p>Dynamic guided surgery uses <b>no guide</b>: implant placement is controlled <b>in real time by computer navigation</b>. There's no static guide; the clinician <b>watches and adjusts the implant's position on a screen</b> as it's placed. <b>X-Guide</b> tracks the handpiece optically against the plan; <b>Yomi</b> is a robotic system whose arm moves freely until it's within a few millimeters of the site, then physically guides the handpiece and stops you if the angle is off the plan.</p>\n<div class=\"rv-table-wrap\" data-title=\"Freehand, static and dynamic guided surgery\"><table class=\"rv-table\"><thead><tr><th>Method</th><th>Guide</th><th>Who controls the position</th><th>Key points</th></tr></thead><tbody>\n<tr><td>Freehand</td><td>None</td><td>The surgeon, following the bone</td><td>Cheap; surgically driven; higher risk of error; still needs a CBCT</td></tr>\n<tr><td>Semi-guided (pilot)</td><td>Static template</td><td>Guide for the pilot drill, then the surgeon</td><td>Bone not known; what UAB students do most</td></tr>\n<tr><td>Fully guided</td><td>Static printed guide</td><td>The guide, for every drill</td><td>CBCT + digital wax-up; accurate if seated; costly; \"blind surgery\" risk</td></tr>\n<tr><td>Dynamic guided</td><td>None (navigation)</td><td>The clinician, watching a screen in real time</td><td>X-Guide, Yomi</td></tr>\n</tbody></table></div>\n<p>The summary: <b>CBCT is the current standard of care for most implant cases</b>, because of its superior ability to capture 3-D images of the bone and surrounding structures.</p>\n"};
var READINGS_PLAIN = {"evolution": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The seven types of implants, and how to spot each one</li><li>Why old materials failed and titanium works</li><li>How osseointegration was found</li><li>What went wrong with the old designs</li></ul></div>\n<h4>The one thing to know</h4>\n<p>Dr. Mueninghoff, a retired prosthodontist, said the one thing to know from this lecture is the <b>seven types of implants</b>, well enough to recognize them. The stories are background.</p>\n<h4>Why old materials failed</h4>\n<p>Gold (1809), lead (1888), platinum and porcelain (1891) were all tried. Gold and platinum have almost no surface oxide, so bone won't grow onto them. Porcelain broke. Titanium works because it is covered in <b>titanium oxide</b>, a ceramic, and bone bonds to that oxide.</p>\n<h4>Who found osseointegration</h4>\n<p><b>Brånemark</b>, a Swedish orthopedic surgeon (a physician), found that titanium pieces he put in animals wouldn't come out: the bone had grown onto them. <b>Carl Misch</b> later made implants popular in the U.S.</p>\n<h4>The seven types</h4>\n<ul><li><b>Subperiosteal</b>: a metal frame laid on top of the bone, under the periosteum. Took two surgeries and destroyed bone when it failed.</li><li><b>Endodontic stabilizer</b>: a rod through a root canal, out the tip into bone. Made of steel, leaked, failed.</li><li><b>Transosseous</b>: goes all the way through the front of the lower jaw, from a plate under the chin. Done in the operating room.</li><li><b>Intramucosal insert</b>: buttons on a denture that fit holes made in the gums. The denture couldn't stay out more than a few hours.</li><li><b>Blade</b>: a flat blade in a slot in the bone, usually tied to a natural tooth, with soft tissue around it instead of bone.</li><li><b>Ramus frame</b>: one big frame from the chin back into both sides of the lower jaw, holding a lower denture.</li><li><b>Root form</b>: the screw-shaped titanium implant used today.</li></ul>\n<h4>Names to know</h4>\n<p>The <b>Roberts brothers</b> (California) invented the ramus frame and the blade. <b>Linkow</b> put holes in the blade, and <b>Cranin</b> made an anchor-shaped one. <b>Bosker</b> made the transmandibular implant (TMI). In Birmingham, <b>Dr. Ford Turner</b> made ramus frames last 10 to 25 years because he was so careful with the bone.</p>\n<h4>The old idea of success</h4>\n<p>Before Brånemark, an implant \"worked\" if it lasted <b>five years in 75%</b> of patients.</p>\n<h4>Other lessons</h4>\n<ul><li>Bone only grows about half a millimeter into holes, so hollow baskets didn't lock in.</li><li>Cementing the abutment into the implant (Core-Vent) made it impossible to remove.</li><li>A soft insert meant to copy the ligament (IMZ) moved too much and hurt the tooth.</li><li>Bone near the top needs some load, or it shrinks (stress shielding); Frialit made the top wider for that.</li><li>Force keeps bone healthy: bone grew thicker behind the TMI plate.</li><li>Osseointegration is much stronger than people thought, so short implants (8 or even 6 mm) work now.</li><li>There are about 173 implant companies. Stick with two or three. To identify an unknown one from an x-ray, try whatimplantisthat.com.</li></ul>\n", "intro": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What an implant is and what osseointegration means</li><li>Primary and secondary stability; healing times</li><li>One-stage vs two-stage surgery</li><li>Endosteal, subperiosteal and transosteal implants</li><li>Healthy vs failing implants</li><li>Titanium grades, the alloy, and each system's surface</li><li>How the gum attaches to a tooth vs an implant</li></ul></div>\n<h4>The course</h4>\n<p>Dr. Chavali runs this introduction. The school uses three implant systems: <b>Nobel Biocare</b> (Conical Connection), <b>Straumann</b> (Bone Level) and <b>BioHorizons</b> (Tapered Internal). In the lab you restore an implant at tooth #9.</p>\n<h4>What an implant is</h4>\n<p>A man-made (<b>alloplastic</b>) device put into the bone, under the gum, to hold and support a crown, bridge or denture. An <b>abutment</b> goes on the implant, and the crown goes on the abutment.</p>\n<h4>What implants are used for</h4>\n<p>Single crowns, bridges, partial dentures that clip onto implants, and lower dentures. <b>Two implants under a lower denture are the standard of care</b> for a toothless lower jaw. At UAB this is \"2-2-2\": two dentures, two implants, two attachments (Locators). The lower jaw gets them because a lower denture floats around; an upper one holds by suction.</p>\n<h4>Osseointegration</h4>\n<p><b>Brånemark</b> (an orthopedic surgeon, 1952) found titanium pieces in rabbit bone wouldn't come out. He named the bond <b>osseointegration</b>: bone attached directly to the implant, <b>with no soft tissue in between</b>.</p>\n<p>When the implant is screwed in, it is held by friction: <b>primary stability</b>. Then the bone remodels around it and grows onto it: <b>secondary stability</b>, the real integration. Around the end of the first week, the old bone edges are eaten away, so primary stability <b>drops</b> while new bone builds up.</p>\n<p>Usual wait before restoring: <b>about 4 months in the lower jaw, 6 months in the upper jaw</b>, because the lower jaw's bone is denser.</p>\n<h4>Wolff's law</h4>\n<p>Bone shapes itself to the forces on it. The right amount of load keeps it strong; too little and it shrinks (as after a tooth is pulled); too much and it breaks down. So implant crowns are adjusted carefully.</p>\n<h4>One-stage vs two-stage</h4>\n<ul><li><b>Two-stage</b> (Brånemark): implant placed, <b>cover screw</b> on, gum closed over it for 3-6 months. A second surgery uncovers it and puts on a <b>healing abutment</b>.</li><li><b>One-stage</b> (Schroeder): the healing abutment goes on at the start and sticks through the gum. No second surgery; about 3-4 months.</li><li>Wait at least <b>3 weeks</b> for the gum to heal around the healing abutment befo
