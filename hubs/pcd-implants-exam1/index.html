re the final impression.</li><li>Two-stage is safer when healing is a worry (for example, diabetes).</li></ul>\n<h4>Three kinds of implants</h4>\n<ul><li><b>Endosteal</b>: in the bone, through only one layer of cortical bone. Today's screw-shaped root forms, and also the old blades and ramus frames.</li><li><b>Eposteal (subperiosteal)</b>: on top of the bone, under the periosteum. Hard to remove, big surgery, bone loss.</li><li><b>Transosteal</b>: all the way through the front of the lower jaw (the TMI). Lower jaw and front only, a cut under the chin, general anesthesia.</li></ul>\n<h4>Healthy or failing</h4>\n<p>Signs of a failing implant: <b>it moves, it hurts when tapped or used, it's infected, there's a dark area around it on the x-ray, or bone is lost</b>. A healthy one has no pain, no movement, less than 2 mm of bone loss and no pus. Losing more than half the implant's length of bone, or any mobility, means failure. Always take an x-ray before you make the crown.</p>\n<p>Causes: overheating the bone during surgery, the implant moving while it heals, overloading, infection (peri-implantitis), smoking, uncontrolled diabetes, and poor upkeep.</p>\n<h4>Titanium</h4>\n<p>Titanium covers itself with a tough <b>oxide layer</b>, and bone cells build onto it. That's why it doesn't corrode and the body accepts it. There are four grades of <b>commercially pure</b> titanium (stronger as the grade goes up; implants use Grade 4) and a stronger alloy, <b>Ti-6Al-4V</b>. <b>BioHorizons</b> uses the alloy; <b>Straumann and Nobel</b> use Grade 4.</p>\n<h4>Shape and surface</h4>\n<p>Old implants were <b>smooth cylinders</b>; screw-shaped (<b>machined</b>) implants hold better. Modern ones are also roughened. Rough surfaces are made by adding (plasma spray, hydroxyapatite, beads) or by taking away (acid etching, blasting). Nobel's surface is <b>TiUnite</b>, Straumann's is <b>SLA</b> (sandblasted, large-grit, acid-etched), and BioHorizons' is <b>RBT</b> (resorbable blast texturing).</p>\n<h4>Why implants</h4>\n<p>They keep the bone from shrinking, spare the neighboring teeth, and let a denture bite harder than a regular denture.</p>\n<h4>An implant is not a tooth</h4>\n<ul><li>A tooth can move a little; an implant can't. It's like a tooth fused to bone.</li><li>Don't join an implant to a tooth, don't place one in a growing child, and don't hang a cantilever off one implant.</li><li>The gum fibers around an implant run around it and along it, but none attach into it. Around a tooth, fibers run into the root.</li><li>The gum seal on an implant is about <b>3 mm</b> tall, about 1 mm taller than on a tooth.</li><li>The gum attaches to a tooth along the whole junctional epithelium, but on an implant only at the bottom third.</li><li>No ligament means no feeling of biting pressure, so implant crowns are kept in light contact.</li></ul>\n", "biomech": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Wolff's law and stress = force/area</li><li>Upper vs lower jaw bone, and D1-D4</li><li>Which forces bone handles best</li><li>Cantilevers and long bridges</li><li>Bite force with different dentitions</li><li>Why an implant is never joined to a tooth</li><li>How implant crowns should bite</li></ul></div>\n<h4>Bone follows force</h4>\n<p><b>Wolff's law</b>: bone rebuilds its inside to match the forces on it. The right amount of load keeps bone healthy. Too little (a missing tooth) and it shrinks; too much (grinding, a bad design) and it breaks down or fractures. <b>Stress = force divided by area</b>; strain is how much the bone bends.</p>\n<h4>Upper vs lower jaw</h4>\n<p>The upper jaw has thin outer bone and fine spongy bone; it <b>spreads force out</b> (so a blow to the face doesn't reach the brain). The lower jaw has thick outer bone; it <b>absorbs force</b>. Implants fail more in the upper jaw.</p>\n<p>Misch's bone types: <b>D1</b> (dense, front of lower jaw), <b>D2</b> (back of lower jaw), <b>D3</b> (front of upper jaw), <b>D4</b> (soft, back of upper jaw). D1 is the strongest, D4 the weakest.</p>\n<h4>Which forces bone likes</h4>\n<p>Bone is strongest under <b>compression</b> (pushing), then <b>tension</b> (pulling), and weakest under <b>shear</b> (sliding). So aim forces straight down the implant.</p>\n<h4>What goes wrong</h4>\n<p>Anything can fail: the bone, the implant, the screw, the crown. Overdenture attachments have the most problems (30%), then resin veneers (22%), short implants (17%) and soft bone (16%). Implants themselves fracture rarely (1-2%). Implants shorter than 10 mm fail a little more often but are still used.</p>\n<p>Match the implant to the tooth: about <b>3 mm</b> for lateral and lower incisors, <b>3.5 mm</b> for upper centrals, <b>3.5-4 mm</b> for premolars, <b>4.5-6 mm</b> for molars. Leave at least 1 mm of bone around it; if the bone is too thin, graft it.</p>\n<h4>Who bites hardest</h4>\n<p>Generally younger, bigger patients and men, and anyone who grinds or clenches (look for worn or broken teeth, abfractions, bony growths). For them: more implants, smaller chewing surfaces, splint the implants together, and a night guard.</p>\n<p>Don't splint implants on both sides of the lower jaw behind the mental foramina: the lower jaw flexes when it opens.</p>\n<h4>Cantilevers</h4>\n<p>A cantilever is a tooth hanging off the end with nothing under it. It acts like a lever: <b>force x distance</b>. In his example a 25 lb bite became 75 lb on one implant and 50 lb on the other. Avoid them (unless the other jaw is a denture). A <b>vertical cantilever</b> is a very tall crown on lost bone; fix it by growing bone back or adding implants.</p>\n<p>Long bridges bend a lot: each extra unit of length makes it <b>cube</b> times as flexible (1, 8, 27). Two implants can carry a three-unit bridge, not usually four.</p>\n<h4>Bite force</h4>\n<p><b>Implant bridge &gt; natural teeth &gt; implant-held denture &gt; regular denture.</b> Without the ligament's sensors, patients can bite harder on implants without feeling it.</p>\n<h4>Never join an implant to a tooth</h4>\n<p>A tooth can sink 25-100 microns into its ligament; an implant only 3-5 microns. Join them and the implant takes all the force. This will be on the exam.</p>\n<h4>How implant crowns should bite</h4>\n<ul><li>Lighter than the natural teeth.</li><li>Implant against a natural tooth: shimstock pulls through on the implant when the patient closes normally; it may hold when they bite hard.</li><li>Implant against implant: when biting hard, shimstock drags but doesn't tear.</li><li>Forces straight down the implant, low cusps, a narrow chewing surface, and no contact when sliding side to side.</li></ul>\n", "terms": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Brands, product lines, platforms and colors</li><li>Platform switching, internal vs external, bone vs tissue level, tapered vs parallel</li><li>Stability and the stability dip; torque numbers</li><li>Conical connection and Morse taper; cover screw vs healing abutment</li><li>Where to place an implant (the millimeter rules)</li><li>Engaging vs non-engaging; screw vs cement; prefab vs custom</li><li>Space needed; crown-to-implant ratio; E, B and C zones</li><li>Timeline terms, immediate loading rules, codes</li></ul></div>\n<h4>Brands and platforms</h4>\n<p>Nobel Biocare, Straumann and BioHorizons are brands, and each has several product lines. The <b>platform</b> is where the implant meets the abutment. Within a brand, matching colors mean matching parts. <b>BioHorizons trap</b>: a \"4.6 mm Tapered Internal Plus\" implant has a <b>3.5 mm (yellow)</b> platform, not 4.5. The surgeon writes the body size; you need the platform size. Check the implant's sticker in the chart.</p>\n<h4>Design terms</h4>\n<ul><li><b>Platform switching</b>: the abutment is narrower than the implant, so the joint (microgap) sits away from the bone. Saves bone and adds gum thickness.</li><li><b>External</b> connection: the implant has a hex sticking up (more screw loosening). <b>Internal</b>: the connection is inside the implant (less gap). The school uses internal.</li><li><b>Tissue level</b>: a smooth collar sits in the gum; less bone loss. <b>Bone level</b>: more room to shape a nice crown.</li><li><b>Tapered</b>: more primary stability, less chance of hitting a root or nerve. <b>Parallel-walled</b>: more surface touching bone.</li><li><b>Conical connection</b>: the abutment's tapered surface wedges into the implant; less gap, less bone loss. A <b>Morse taper</b> is a conical connection tight enough to \"cold weld.\"</li></ul>\n<h4>Stability</h4>\n<p>Primary stability (the screw's grip) drops as bone remodels; secondary stability (new bone) rises. The low point in between is the <b>stability dip</b>, a few weeks after placement. Be careful touching the implant then.</p>\n<h4>Torque</h4>\n<p>Fingers give only about 5 Ncm; use a torque wrench. <b>Nobel 35 Ncm</b> (its 3.0 mm implant 15), <b>Straumann 35 Ncm</b>, <b>BioHorizons 30 Ncm</b>.</p>\n<h4>Cover screw vs healing abutment</h4>\n<p>A <b>cover screw</b> is short and hidden under the gum (first stage of two-stage). A <b>healing abutment</b> is taller and sticks through the gum (one-stage, or the second stage).</p>\n<h4>Where the implant goes</h4>\n<ul><li>Top of the implant <b>3-4 mm below</b> where the gum line should be.</li><li><b>1.5 mm</b> from a tooth, <b>3 mm</b> from another implant (or the papilla is lost).</li><li><b>2 mm</b> of bone on the facial (the thin facial bone shrinks after extraction), <b>1 mm</b> on the lingual.</li><li>Front teeth: placed a little toward the tongue, so the screw hole can come out the back of the crown. Back teeth: in the middle of the ridge.</li></ul>\n<h4>Abutments</h4>\n<ul><li><b>Engaging</b> abutments lock into the implant's hex or grooves and can't spin; <b>non-engaging</b> can spin.</li><li><b>Screw-retained</b>: crown and abutment are one piece, screwed in, easy to remove, no cement. <b>Cement-retained</b>: the crown is cemented onto the abutment; no hole showing. If the implant is too far facial, cement it (or use an angled screw channel).</li><li><b>Screwmentable</b>: a zirconia crown glued to a TiBase outside the mouth, then screwed in.</li><li><b>Prefabricated</b> abutments are stock sizes; <b>custom</b> ones are shaped for the patient and are always engaging.</li><li>Rules for the clinic: <b>single crown always engaging</b>; <b>cemented bridge: custom, engaging</b>; <b>screwed bridge: TiBase, non-engaging</b>.</li></ul>\n<h4>Space</h4>\n<p>A cemented molar crown needs about <b>7 mm</b> from bone to the opposing tooth (3 for the gum seal, minus 1 below the gum, plus 4 of abutment, plus 1 of zirconia). A screwmentable crown needs about 6-7 mm from the platform.</p>\n<p>Implant crowns can be taller than a tooth's crown-to-root rule allows, but very tall ones (about 2:1) loosen and break more: consider splinting.</p>\n<h4>Emergence profile</h4>\n<p>The shape of the crown and abutment from the implant up to the gum line. <b>C zone</b> (first 1-1.5 mm, straight, set by the abutment), <b>B zone</b> (middle, concave preferred), <b>E zone</b> (last 1 mm under the gum, set by esthetics). Make it more concave to let the gum creep down; more convex to push it up.</p>\n<h4>Odds and ends</h4>\n<ul><li>Seal the screw hole with <b>Teflon tape</b>, leave 2 mm, and fill with composite.</li><li>A <b>verification jig</b> checks that implants for a bridge are where the cast says, using non-engaging parts. The <b>one-screw (Sheffield) test</b> checks passive fit.</li><li>Open-tray impressions are more accurate for several implants; the clinic mostly uses closed tray.</li><li><b>Anodizing</b> colors titanium by thickening its oxide layer.</li></ul>\n<h4>Timeline terms (ITI 2018)</h4>\n<ul><li>Placement: <b>immediate</b> (same day as extraction), <b>early</b> (4-8 or 12-16 weeks), <b>late</b> (after 6 months).</li><li>Loading: <b>immediate</b> (within 1 week), <b>early</b> (1 week to 2 months), <b>conventional</b> (after 2 months).</li><li>A temporary crown on the day of surgery doesn't have to be in function. If you don't need to load it, don't.</li><li>Immediate loading needs intact socket walls, at least 1 mm of facial bone, thick tissue, no acute infection, bone beyond the socket, <b>25-40 Ncm</b> torque or <b>ISQ over 70</b>, a protective bite and a compliant patient.</li></ul>\n<h4>Codes</h4>\n<p>D0367 CBCT; D6190 implant index; D6010 implant placement; D6057 custom abutment; D6058 cemented implant crown; D6065 screw-retained implant crown; D6245 pontic.</p>\n", "prefab": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Stock (prefabricated) vs custom abutments</li><li>Cover screw, healing abutment, temporary and final abutments</li><li>One-stage vs two-stage, and who gets which</li><li>UCLA vs CAD/CAM abutments</li><li>Cemented vs screwed crowns and the 5 mm rule</li><li>What to send the lab</li></ul></div>\n<h4>Two kinds of abutments</h4>\n<p><b>Prefabricated (stock)</b> abutments come ready-made and fit anyone. <b>Custom</b> abutments are made for one patient. The clinic uses custom almost every time.</p>\n<h4>The parts in order</h4>\n<ul><li>At surgery: a <b>cover screw</b> (under the gum) or a <b>healing abutment</b> (through the gum).</li><li>Then a <b>temporary abutment</b> for a provisional crown, screwed or cemented.</li><li>Finally a <b>final abutment</b>: stock, or custom (UCLA cast or CAD/CAM milled).</li></ul>\n<h4>One-stage vs two-stage</h4>\n<p><b>Two-stage</b>: cover screw, gum closed; months later a second surgery puts on the healing abutment. <b>One-stage</b>: the healing abutment goes on right away. Smokers and diabetics get two-stage; young, healthy patients can get one-stage. Wait about <b>three weeks</b> after the healing abutment goes on for the gum to heal.</p>\n<h4>Healing abutments</h4>\n<p>They come in heights (short for a shallow implant, tall for a deep one) and shapes: <b>straight for incisors</b>, <b>wide for molars</b>.</p>\n<h4>Temporary abutments</h4>\n<p>Screw-retained temporaries are titanium cylinders; cement-retained ones have a plastic cap. <b>Engaging</b> ones have a hex that locks in; <b>non-engaging</b> ones are smooth and are used for <b>bridges</b>. Screwed temporaries avoid extra cement, which acts like tartar and causes peri-implantitis.</p>\n<h4>Stock vs custom</h4>\n<ul><li>Stock: fits very precisely, cheap (about $50, sometimes free), strong. But it must be trimmed, its margin can end up deep under the gum and trap cement, and its thin shape doesn't support a wide molar crown.</li><li>Custom: margin wherever you want it, a good shape out of the gum, and easy cement cleanup. About $150-200.</li></ul>\n<p>Stock abutments come in cuff heights (1, 2, 3, 5 mm) and straight or angled. Measure the gum height from the implant collar. A tilted implant needs an angled stock abutment or a custom one.</p>\n<h4>UCLA vs CAD/CAM</h4>\n<p>A <b>UCLA</b> abutment is a plastic sleeve on a titanium base that the lab waxes up and casts in metal. A <b>CAD/CAM</b> abutment is designed on a computer and milled.</p>\n<h4>Cemented vs screwed crowns</h4>\n<ul><li>Cemented: often better looking, but much higher risk of peri-implantitis.</li><li>Screwed: no cement, so no cement problems.</li><li><b>Exam rule: if there's 5 mm of space or less between the arches, you must use a screw-retained crown.</b> A cemented crown needs at least 5 mm.</li><li>If the implant is so far facial that the screw hole would show, you must cement.</li></ul>\n<h4>What to send the lab</h4>\n<p>Mounted casts with a <b>soft tissue model</b>, the <b>implant system</b>, the <b>diameter</b>, the <b>soft tissue height</b>, and the <b>implant order form</b>.</p>\n<h4>The school's systems</h4>\n<p>BioHorizons (internal connection), Nobel Biocare (conical connection) and Straumann (bone level).</p>\n", "imaging": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Dr. Givan's study guide: imaging in the three phases</li><li>The three common x-ray types and ALARA</li><li>Pros and cons of PAs and pans</li><li>Medical CT vs cone beam CT; Hounsfield units</li><li>CT advantages, problems and artifacts</li><li>Scan templates and planning software</li></ul></div>\n<h4>Plan from the teeth</h4>\n<p>Dr. Givan's theme: implants are there to hold teeth, so plan from the final teeth (<b>prosthetically driven</b>) while respecting the bone and nerves (<b>biologically balanced</b>). Study his study guide: the exam asks about its details.</p>\n<h4>Three phases</h4>\n<ul><li><b>Before surgery</b>: how much bone, how good, at what angle; where the nerves and other structures are; any disease.</li><li><b>During surgery</b>: check position and angle, healing, and that the abutment and crown are right.</li><li><b>After the crown</b>: for as long as the implant is there, check the bone level at the top of the implant.</li></ul>\n<h4>The three common images</h4>\n<p><b>Periapical (PA), panoramic, and cone beam CT.</b> Always use the lowest reasonable dose (<b>ALARA</b>). A CBCT is about three pans, or a tenth of a medical CT.</p>\n<h4>PA vs pan</h4>\n<ul><li><b>PA</b>: very sharp, but shows no bone width, can't measure bone quality, and can be stretched or distorted. Best for following bone levels over time.</li><li><b>Pan</b>: a great overview for screening, but lots of overlap, distortion and changing magnification. Bone height can be off by 30%, and bone width can't be seen at all. Metal balls of known size (4-5 mm) in a template let you correct the height, but only up and down and only where it's in focus.</li></ul>\n<h4>Medical CT vs cone beam CT</h4>\n<p>Medical CT: a fan beam, fast spin, you lie down (claustrophobic, soft tissue sags, jaw not in its natural spot), higher dose. Cone beam CT: a cone beam, slow spin, you sit or stand, 5-10 times less dose, but more scatter and poorer soft tissue detail.</p>\n<h4>Hounsfield units</h4>\n<p>The <b>Hounsfield scale</b> measures radiodensity. People hoped it would predict how stable an implant will be, but the evidence doesn't support that.</p>\n<h4>CT: good and bad</h4>\n<p>Good: accurate measurements in every direction, no distortion, some idea of bone quality, models and drill guides, and even surgery without a flap. Bad: take out metal dentures first; metal fillings scatter; movement blurs.</p>\n<h4>Artifacts</h4>\n<ul><li><b>Motion</b>: the patient or template moved.</li><li><b>Starburst</b>: streaks where density changes sharply (air to bone, bone to metal). Not caused by scatter.</li><li><b>Beam hardening</b>: metal filters out the weak x-rays, leaving black areas.</li><li>Titanium causes little artifact; gold causes a lot.</li></ul>\n<h4>Scan templates</h4>\n<p>A <b>scan template</b> is a temporary set of teeth worn during the scan, so you can see where the new teeth will be compared with the bone. It steadies the bite and opens it slightly. Steps: make the guide, scan, plan in software; optionally print a surgical guide (resting on bone, gum or teeth, with sleeves to steer the drill).</p>\n<p>Planning software: Simplant, Implant Design Studio, Nobel Clinician, coDiagnostiX, Invivo, Blue Sky Bio.</p>\n", "cbct": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What CBCT stands for and how it works</li><li>How x-rays are made, filtered and absorbed</li><li>The four interactions and the two that matter</li><li>Detectors, pixels, resolution and noise</li><li>ROI, FoV, ALARA</li><li>Basis images, voxels, DICOM and the views</li><li>Artifacts and why CBCT Hounsfield numbers aren't reliable</li></ul></div>\n<h4>How a CBCT works</h4>\n<p><b>CBCT = cone beam computed tomography.</b> An x-ray source and a detector sit on a rotating arm (the <b>gantry</b>) and turn around the patient's head. A cone-shaped beam passes through the area you want to see. In one turn (180 or 360 degrees) it takes several hundred flat pictures, and a computer combines them into a 3-D volume.</p>\n<h4>Making x-rays</h4>\n<p>A heated filament (the cathode) gives off electrons: <b>thermionic emission</b>. The voltage (<b>kVp</b>) speeds them toward a tungsten target (the anode). Higher kVp makes higher-energy x-rays that penetrate more. Almost all the energy becomes heat; about 1% becomes x-rays.</p>\n<ul><li><b>Characteristic x-rays</b>: an electron knocks out an inner electron of a tungsten atom; an outer electron drops in and gives off an x-ray of a set energy.</li><li><b>Bremsstrahlung (\"braking\") x-rays</b>: an electron swerves near the nucleus and loses energy as an x-ray of any energy.</li></ul>\n<p>So the beam has many energies: it's <b>polyenergetic</b>. A <b>filter</b> (aluminum or copper) removes the weak x-rays that would only add dose, and <b>lead collimator plates</b> shape the beam.</p>\n<h4>Attenuation</h4>\n<p><b>Attenuation</b> is how much the beam weakens as it passes through something. Thicker, denser material with a higher atomic number blocks more. Gold blocks and scatters a lot; titanium much less.</p>\n<p>Four things can happen to an x-ray in tissue: it passes straight through; it's <b>absorbed</b> (the photoelectric effect, which ionizes the atom); it bounces off without losing energy (<b>Rayleigh</b>, minor); or it bounces off an electron and loses energy (<b>Compton</b>, which causes artifacts). The two that matter most: <b>absorption and Compton</b>.</p>\n<h4>Detectors</h4>\n<ul><li><b>Computed radiography</b>: phosphor plates read by a laser (UAB's PAs and bitewings). Not used for CBCT.</li><li><b>Indirect flat panel</b> (the usual CBCT detector): x-rays → light → photodiode → signal. Each light receptor is a <b>pixel</b>.</li><li>Smaller pixels: sharper image but more noise (worse <b>signal-to-noise ratio</b>).</li><li><b>Dynamic range</b> (bit depth) is how finely a pixel tells light from dark: gray-scale resolution.</li></ul>\n<h4>ROI, FoV, ALARA</h4>\n<p>The <b>region of interest</b> is what you need to see; the <b>field of view</b> is the cylinder the machine actually scans. A bigger FoV means more dose, so by <b>ALARA</b> scan only what you need.</p>\n<h4>Processing</h4>\n<p>Each single picture is a <b>basis image</b>. Hundreds are <b>reconstructed</b> with math into a volume made of <b>voxels</b> (3-D pixels). The file format is <b>DICOM</b>. You can view it <b>axial, sagittal and coronal</b>, as a <b>panoramic</b> slice with <b>cross-sections</b>, or as a 3-D surface (not for measuring).</p>\n<h4>Artifacts</h4>\n<ul><li><b>Scatter</b>: streaks.</li><li><b>Beam hardening</b>: the weak x-rays get soaked up first, causing dark cups and streaks around metal.</li><li><b>Motion</b>: double outlines; prevent with a head rest and a short scan.</li></ul>\n<h4>Hounsfield units</h4>\n<p>Medical CT grays are set on the Hounsfield scale (air -1000, water 0). On a CBCT these numbers are <b>unreliable</b> because of scatter, so don't trust them to decide, for example, whether an implant can be loaded right away.</p>\n", "surgery": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The two definitions of osseointegration</li><li>Early vs late failures</li><li>Health, mucositis and peri-implantitis</li><li>Risk factors and prevention</li><li>Contraindications and assessments</li><li>Space needed for each prosthesis</li><li>Esthetic risk factors</li><li>Drilling, heat and torque</li></ul></div>\n<h4>The big picture</h4>\n<p>Dr. Geisinger (periodontology) gave this lecture. About 178 million Americans are missing a tooth and about 5 million implants are placed each year. A good implant is healthy, works and looks good.</p>\n<h4>Implants are like fused teeth</h4>\n<p>Gum fibers run around and along an implant, not into it, and there's no ligament. The seal is a long attachment that breaks down more easily than a tooth's. Because an implant can't move, it can look like it moves as the jaws change with age. A single pocket reading doesn't mean much on an implant; watch for depths that <b>increase</b> over time.</p>\n<h4>Osseointegration</h4>\n<p>Brånemark (1969): bone touching the implant under a light microscope. Albrektsson (1991): a direct structural and functional connection between <b>living</b> bone and an implant carrying load. In real life only about <b>60%</b> of the surface touches bone, the bone stops about 0.3 mm below the implant-abutment joint, and healing takes 6 weeks to 3 months.</p>\n<h4>Early vs late failure</h4>\n<ul><li><b>Early</b>: surgical mistakes (overheating the bone, too much force, poor sterile technique), loading too soon, poor healing, poor bone turnover.</li><li><b>Late</b>: gum and bone disease around the implant, overload, and problems with the crown or bridge.</li></ul>\n<h4>Peri-implant disease</h4>\n<ul><li><b>Health</b>: no inflammation, no heavy bleeding, pockets not deepening, no bone loss after the first healing.</li><li><b>Mucositis</b>: red, swollen, bleeding or pus, deeper pockets, but <b>no bone loss</b>.</li><li><b>Peri-implantitis</b>: inflammation and bleeding <b>plus bone loss</b> compared with the x-ray taken a year after the crown. Without old records: bone 3 mm or more below the top of the implant and/or pockets of 6 mm or more with heavy bleeding.</li></ul>\n<p>Treatment works poorly: about <b>75%</b> of cases don't resolve or come back within 5 years. So <b>prevention</b> is the job: assess risk, plan well, build the site, and keep up maintenance.</p>\n<h4>Risk factors</h4>\n<p>Patient: poor hygiene, missed maintenance, systemic disease, smoking, medications. Implant: its design and surface. Site: an old root canal infection, a previous failed implant, thin tissue. Prosthesis: leftover cement, overload, bad contours. Surgery: a badly placed implant, not following the protocol, poor healing.</p>\n<h4>Contraindications</h4>\n<p>Implants are elective. Don't place them in someone with a recent heart attack or stroke, a heavy smoker (10 or more cigarettes a day), or a patient still growing.</p>\n<h4>Planning</h4>\n<p>Check the patient (health, habits, smile line, expectations, money), the site (bone in three directions, gum, space), and the implant (where, how big, how many). Keep at least 1 mm of bone on the cheek and tongue sides. Implants longer than about 13.5 mm actually fail more than 8-13 mm ones. A CBCT helps avoid complications and grafting.</p>\n<h4>Space needed</h4>\n<p>Implant crown or bridge: about 7-8 mm (cemented) or 7.5 mm (screwed). Overdenture: 10-12 mm; bar overdenture 11-14 mm. Zirconia full-arch: 10-12 mm. Hybrid: 15 mm or more.</p>\n<h4>Esthetic risk</h4>\n<p>High risk: heavy smoker, weak immune system, high expectations, high lip line, thin scalloped gums, triangular teeth, an acute infection, bone 7 mm or more from the contact point, restored neighbors, a gap of two or more teeth, a gum defect, or vertical bone loss.</p>\n<h4>Drilling</h4>\n<p>Drills go from small to large so the bone doesn't overheat: above <b>47°C</b> the bone dies. Use lots of saline. The last drill is narrower than the implant so the threads bite. Implants are placed slowly with a torque setting, not at high speed.</p>\n<p>Stability at placement: <b>15-35 Ncm</b>. At <b>35 Ncm</b> you can put something through the gum; under <b>15 Ncm</b> the implant is unstable.</p>\n", "guided": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Surgically vs prosthetically driven</li><li>Freehand, semi-guided, fully guided and dynamic surgery</li><li>Which guide support is most accurate</li><li>STL vs DICOM and the planning steps</li><li>Best implant positions</li><li>How the student clinic does it</li></ul></div>\n<h4>Where vs how</h4>\n<p>Two questions: <b>where</b> should the implant go, and <b>how</b> will the surgeon get it there?</p>\n<h4>Where: let the tooth decide</h4>\n<p><b>Surgically driven</b>: put the implant where the bone is. <b>Prosthetically driven</b>: put it where the future tooth needs it, then make sure the bone allows it (graft if not). An implant can go almost anywhere except into a root, a nerve or air, but it has to be restorable. A common mistake is placing it too far toward the cheek, so the gum recedes.</p>\n<p>Best positions: <b>back teeth</b>, the middle of the tooth in both directions, along its long axis. <b>Front teeth</b>, in line with the gum's high point (zenith), and toward the tongue side, above the cingulum. If that isn't possible, talk it through: a slightly tilted implant can still get a cemented crown, the bone can be grafted, or neighboring teeth can be reshaped a little (decide before surgery).</p>\n<h4>How: four ways</h4>\n<ul><li><b>Freehand</b>: no guide; the surgeon follows the bone. Cheap, but more risk of a wrong depth, angle or position, and no input from the restoring dentist. Still needs a CBCT. Checking with an x-ray during drilling helps.</li><li><b>Semi-guided (pilot)</b>: a simple guide made on the model shows where the first (pilot) drill goes; then the surgeon adjusts to the bone. <b>This is what UAB students usually do.</b></li><li><b>Fully guided</b>: the whole plan is made in software from the CBCT and a digital wax-up, and a printed guide controls every drill (sleeves and stops set depth and angle). Accurate and quick if the guide seats right, but costly, slower to prepare, and you can't change course without removing the guide.</li><li><b>Dynamic</b>: no guide at all; the surgeon watches a screen that tracks the drill live (X-Guide), or a robot arm guides the hand (Yomi).</li></ul>\n<h4>Guide support</h4>\n<p><b>Tooth-supported</b> guides are the most accurate. <b>Tissue-supported</b> ones can move on the soft gum. <b>Bone-supported</b> ones may carry CBCT distortion.</p>\n<h4>Planning a fully guided case</h4>\n<p>You need two files: an <b>STL</b> (a surface scan of teeth and gums) and a <b>DICOM</b> (the CBCT). Steps: scan or impress the teeth (STL), take the CBCT (DICOM), mount and wax up, line up the two files in the software, plan the implant, design the guide, print it. The guide has a window to check it's fully seated and a midline to check it's in the right spot.</p>\n<h4>At UAB</h4>\n<p>You get extra crown credits for using guided surgery. D6190 (implant index) is $50; D6190GS (guided surgery index) is $225. The clinic uses a good alginate impression and mounted casts, not an intraoral scan.</p>\n<h4>Bottom line</h4>\n<p>A CBCT is now the standard of care for most implant cases.</p>\n"};

  try{

      Object.keys(s).forEach(function(k){
        if(s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])){

          });
        } else base[k] = s[k];
      });
    }
  }catch(e){ /* storage unavailable */ }
  return base;
}

function checkAchievements(){

    var c = a.cond, ok = false;
    if(c.type === 'totalCorrect') ok = STATE.totalCorrect >= c.n;
    else if(c.type === 'streak') ok = STATE.streak >= c.n;
    else if(c.type === 'lecPct'){ var st = STATE.lecStats[c.lec]; ok = !!(st && st.a >= c.min && (st.c / st.a) * 100 >= c.pct); }
    else if(c.type === 'allSeen') ok = QUESTIONS.every(function(q){ return STATE.seen[q.id]; });

function recordAnswer(qid, lecId, correct, ctx, choice, picks){
  var s = STATE.seen[qid] || { n:0, c:0, last:null };
  s.n++; if(correct) s.c++; s.last = !!correct; STATE.seen[qid] = s;
  STATE.totalAnswered++;
  if(correct){ STATE.totalCorrect++; STATE.streak++; if(STATE.streak > STATE.bestStreak) STATE.bestStreak = STATE.streak; } else STATE.streak = 0;
  var ls = STATE.lecStats[lecId] || { a:0, c:0 }; ls.a++; if(correct) ls.c++; STATE.lecStats[lecId] = ls;
  var d = todayStr(); if(STATE.days.indexOf(d) === -1) STATE.days.push(d);
  checkAchievements();
  saveState();
  renderHeaderStats();
  /* picks: a select-all's ticked options (authored indexes), so the class's wrong ticks reach question_choices */
  document.dispatchEvent(new CustomEvent('impl:answered', { detail:{ qid:qid, lec:lecId, correct:!!correct, ctx:ctx||'bank', choice:(typeof choice === 'number' ? choice : null), picks:(Array.isArray(picks) && picks.length ? picks.slice() : null) } }));
}

function dayStreak(){
  var set = {}; STATE.days.forEach(function(d){ set[d] = 1; });
  var n = 0, d = new Date();
  var k0 = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(!set[k0]) d.setDate(d.getDate()-1); /* not studied yet today: the streak is still alive from yesterday */
  for(;;){ var k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(set[k]){ n++; d.setDate(d.getDate()-1); } else break; }

}

  card.classList.add('is-answered'); if(!correct) card.classList.add('is-missed');

  if(q) recordAnswer(q.id, q.lec, correct, card.getAttribute('data-ctx') || 'bank', pk === null ? null : +pk, pks ? pks.split(',').map(Number) : null);
  if(card.classList.contains('is-retry') && window.shTrack) window.shTrack('bank:retry-' + (correct ? 'right' : 'missed'));

function wireQuestionContainer(container){
  if(container.__wired) return; container.__wired = true;
  container.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]'); if(!btn || btn.disabled) return;
    var card = btn.closest('.qcard'); if(!card || card.classList.contains('is-answered')) return;
    var q = QUESTIONS_BY_ID[card.getAttribute('data-qid')]; if(!q) return;
    var rid = card.getAttribute('data-rid');
    var act = btn.getAttribute('data-act');
    if(act === 'mcq'){
      var ok = btn.getAttribute('data-answer') === '1';
      card.querySelectorAll('.qcard-choice').forEach(function(b){ b.disabled = true; if(b.getAttribute('data-answer') === '1') b.classList.add('is-correct'); });
      if(!ok) btn.classList.add('is-wrong');
      card.setAttribute('data-pick', btn.getAttribute('data-idx'));
      finishCard(card, ok);
    } else if(act === 'multi'){
      var mst = MULTI_STATE[rid]; if(!mst) return;
      var mi = +btn.getAttribute('data-multi-idx'), at = mst.picks.indexOf(mi);
      if(at > -1){ mst.picks.splice(at, 1); btn.classList.remove('is-selected'); btn.setAttribute('aria-pressed','false'); }
      else { mst.picks.push(mi); btn.classList.add('is-selected'); btn.setAttribute('aria-pressed','true'); }
    } else if(act === 'multi-check'){
      var mc = MULTI_STATE[rid]; if(!mc) return;
      if(!mc.picks.length){ btn.textContent = 'Pick at least one'; return; }
      var sc = multiScore(q, mc.picks);
      card.querySelectorAll('[data-act="multi"]').forEach(function(b){
        b.disabled = true; b.classList.remove('is-selected');
        var bi = +b.getAttribute('data-multi-idx'), isC = q.correct.indexOf(bi) > -1, was = mc.picks.indexOf(bi) > -1;
        if(isC && was) b.classList.add('is-correct'); else if(isC) b.classList.add('is-missed-right'); else if(was) b.classList.add('is-wrong');
      });
      var wrapC = card.querySelector('[data-role="multi-check"]'); if(wrapC) wrapC.innerHTML = '<span class="multi-score">Partial credit: '+Math.round(sc*100)+'%. Dashed = a right answer you missed.</span>';
      card.setAttribute('data-picks', mc.picks.join(','));
      finishCard(card, sc === 1);
    } else if(act === 'seq-undo' || act === 'seq-clear'){
      var us = SEQ_STATE[rid]; if(!us) return;
      var drop = act === 'seq-clear' ? us.picks.splice(0) : us.picks.splice(-1);
      drop.forEach(function(i){ var b = card.querySelector('[data-act="seq"][data-step-idx="'+i+'"]'); if(!b) return; b.disabled = false; b.classList.remove('is-picked'); var o = b.querySelector('.ord'); if(o) o.remove(); });
      var ut = card.querySelector('[data-role="seq-tools"]'); if(ut) ut.hidden = !us.picks.length;
    } else if(act === 'seq'){
      var st = SEQ_STATE[rid]; if(!st) return;
      st.picks.push(+btn.getAttribute('data-step-idx'));
      btn.disabled = true; btn.classList.add('is-picked');
      btn.insertAdjacentHTML('afterbegin', '<span class="ord">'+st.picks.length+'</span>');
      var tools = card.querySelector('[data-role="seq-tools"]'); if(tools) tools.hidden = false;
      if(st.picks.length === q.steps.length){
        var good = st.picks.every(function(v,i){ return v === i; }), inPlace = st.picks.filter(function(v,i){ return v === i; }).length;
        card.querySelectorAll('[data-act="seq"]').forEach(function(b){ var i = +b.getAttribute('data-step-idx'); var pos = st.picks.indexOf(i); b.classList.remove('is-picked'); b.classList.add(pos === i ? 'is-correct' : 'is-wrong'); });
        finishCard(card, good);
        var sv = card.querySelector('.qcard-verdict'); if(sv && !good) sv.textContent = 'Not quite: ' + inPlace + ' of ' + q.steps.length + ' in the right spot.';
      }
    } else if(act === 'match'){
      var ms = MATCH_STATE[rid]; if(!ms || btn.classList.contains('is-matched')) return;
      var side = btn.getAttribute('data-side');
      if(side === 'left'){ card.querySelectorAll('.qcard-match-item[data-side="left"]').forEach(function(b){ b.classList.remove('is-selected'); }); btn.classList.add('is-selected'); ms.sel = +btn.getAttribute('data-pair-idx'); return; }
      if(ms.sel === null) return;
      var r = +btn.getAttribute('data-pair-idx');
      var leftBtn = card.querySelector('.qcard-match-item[data-side="left"][data-pair-idx="'+ms.sel+'"]');
      if(r === ms.sel){
        btn.classList.add('is-matched'); leftBtn.classList.add('is-matched'); leftBtn.classList.remove('is-selected'); btn.disabled = true; leftBtn.disabled = true;
        ms.matched++; ms.sel = null;
        if(ms.matched === q.pairs.length) finishCard(card, ms.errors === 0);
      } else {
        ms.errors++; btn.classList.remove('is-wrong'); void btn.offsetWidth; btn.classList.add('is-wrong');
      }
    }
  });
}

}

/* ===================================================================
   MIND MAPS: built from each lecture's own notes (section headings as
   branches, the bolded key terms under each as leaves), drawn by the
   shared window.shMindMap renderer
   =================================================================== */
function mindMapFor(lec){
  var d = document.createElement('div'); d.innerHTML = READINGS[lec.id] || '';
  var branches = [], cur = { label:null, children:[] }, seen = {}; /* the intro paragraph before the first heading is left out */
  Array.prototype.forEach.call(d.children, function(el){
    if(/^H[34]$/.test(el.tagName)){ if(cur.label && cur.children.length) branches.push(cur); cur = { label:el.textContent.trim(), children:[] }; return; }
    if(!cur.label) return;
    Array.prototype.forEach.call(el.querySelectorAll('b, strong'), function(x){
      var t = x.textContent.trim(), k = t.toLowerCase();
      if(t.length < 2 || t.length > 38 || seen[k] || cur.children.length >= 6) return;
      seen[k] = 1; cur.children.push({ label:t });
    });
  });
  if(cur.label && cur.children.length) branches.push(cur);
  return { label:lecLabel(lec) + ' ' + lec.title, children:branches };
}

      (list.length ? '<div class="qlist" id="weakList">' + list.map(function(q){ return qCardHTML(q, { ctx:'weak' }); }).join('') + '</div>' : '<div class="rv-empty">Nothing to drill here: no misses and nothing untried. Nice.</div>');

/* Put each figure inside the notes after the paragraph (or at the end of the section) it explains. The wrapper carries
   data-sh-noread, so narration, the highlighter and note search skip it and the notes text itself is unchanged.
   Figures in FIG_BY_LEC that no anchor places land in a Diagrams block after the notes. */
function placeLectureFigs(prose, lecId, level, rest){
  if(!prose) return;
  var placed = {}, kids = Array.prototype.slice.call(prose.children);
  function norm(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  (FIG_PLACE[lecId] || []).forEach(function(pl){
    var at = pl[level] || pl.full, el = null, i;
    for(i = 0; i < kids.length; i++){ if(norm(kids[i].textContent).indexOf(at) === 0){ el = kids[i]; break; } }
    if(!el) return;
    if(pl.end || /^H[1-6]$/.test(el.tagName)){ var j = kids.indexOf(el) + 1; while(j < kids.length && !/^H[1-6]$/.test(kids[j].tagName)) j++; el = kids[j - 1]; }
    var keys = pl.widget ? [pl.widget] : pl.figs, box = document.createElement('div');
    box.className = 'lec-fig-inline'; box.setAttribute('data-sh-noread', '');
    box.innerHTML = keys.every(function(k){ return ANIMA.meta(k); }) ? keys.map(figCardHTML).join('') : '<div class="fig-grid">' + keys.map(figCardHTML).join('') + '</div>';
    /* several figures after the same paragraph keep their order */
    var after = el; while(after.nextElementSibling && after.nextElementSibling.classList.contains('lec-fig-inline')) after = after.nextElementSibling;
    after.parentNode.insertBefore(box, after.nextSibling);
    keys.forEach(function(k){ placed[k] = 1; });
  });
  var left = (FIG_BY_LEC[lecId] || []).filter(function(k){ return !placed[k] && !(k === 'fence' && placed.cuspMap); });
  if(rest && left.length){ rest.hidden = false; rest.querySelector('.fig-grid').innerHTML = left.map(figCardHTML).join(''); }
  ANIMA.mount(prose.parentNode);
}

/* ---------- Question Bank filters (Sam, 2026-11-03: "people don't know how to use it") ----------
   One labeled panel instead of a row of unlabeled dropdowns. Before it, 2 of 66 Occlusion bank users ever opened the lecture
   picker, and in PCD Implants 5 of 8 tapped Clear first just to pick one lecture; saved filters (kept since 10-30) gave no sign

var BANK_SHOW = [['all','All'],['likely','High likelihood'],['unseen','Not answered yet'],['missed','Missed last time'],['pinned','Pinned']];
var BANK_FMTS = [['2stmt','Two statements'],['tf','True or false'],['numbered','Numbered statements'],['except','EXCEPT / NOT'],['pbox','Patient Box cases'],['img','Diagram questions'],['multi','Select all that apply'],['match','Matching'],['sequence','Put in order']];

/* onPick(ids, how) runs on every tick; the list redraws live and the picker stays open ("Only" closes it) */
function wireLecPick(root, onPick){
  var box = root.querySelector('#lecPick'); if(!box) return;
  var btn = box.querySelector('.lp-btn'), pop = box.querySelector('.lp-pop');
  function open(on){ pop.hidden = !on; btn.setAttribute('aria-expanded', on ? 'true' : 'false'); }
  function picked(){ return Array.prototype.filter.call(box.querySelectorAll('input[type=checkbox]'), function(c){ return c.checked; }).map(function(c){ return c.value; }); }
  function sum(ids){ var t = lecPickSummary(ids); box.querySelector('.lp-sum').textContent = t; btn.setAttribute('aria-label', 'Lectures to practice: ' + t); box.querySelector('.lp-picked').textContent = ids.length + ' of ' + LECTURES.length + ' ticked'; btn.classList.toggle('is-on', ids.length !== LECTURES.length); }
  function changed(how){ var ids = picked(); sum(ids); onPick(ids, how); }
  sum(picked());
  btn.addEventListener('click', function(){ open(pop.hidden); });
  box.querySelector('.lp-done').addEventListener('click', function(){ open(false); btn.focus(); });
  box.addEventListener('change', function(){ changed('tick'); });
  box.querySelectorAll('[data-lp]').forEach(function(b){ b.addEventListener('click', function(){
    var k = b.getAttribute('data-lp');
    box.querySelectorAll('input[type=checkbox]').forEach(function(c){ c.checked = k === 'all'; });
    changed(k);

  box.querySelectorAll('[data-only]').forEach(function(b){ b.addEventListener('click', function(){
    var id = b.getAttribute('data-only');
    box.querySelectorAll('input[type=checkbox]').forEach(function(c){ c.checked = c.value === id; });
    changed('only'); open(false); btn.focus();
  }); });
  function away(e){ if(!document.body.contains(box)){ document.removeEventListener('click', away, true); document.removeEventListener('keydown', esc); return; } if(!pop.hidden && !box.contains(e.target)) open(false); }
  function esc(e){ if(e.key === 'Escape' && !pop.hidden){ open(false); btn.focus(); } }
  document.addEventListener('click', away, true); document.addEventListener('keydown', esc);
}

/* o overrides one filter ({st}, {fm} or {src}), so each chip and menu entry can say how many it would give */
function bankFiltered(search, o){
  o = o || {};
  var s = (search||'').toLowerCase().trim(), lecOn = {}, pins = {};
  var st = o.st || STATE.ui.qstatus || 'all', fm = o.fm || STATE.ui.qfmt || 'all', src = o.src || STATE.ui.qsrc || 'all';
  bankLecIds().forEach(function(id){ lecOn[id] = 1; });
  if(st === 'pinned') pinnedIds().forEach(function(id){ pins[id] = 1; });
  return QUESTIONS.filter(function(q){
    if(!lecOn[q.lec]) return false;
    if(st === 'pinned' && !pins[q.id]) return false;
    if(st === 'likely' && !q.likely) return false;
    if(src !== 'all' && q.src !== src) return false;
    if(fm !== 'all' && !bankIsFmt(q, fm)) return false;
    var seen = STATE.seen[q.id];
    if(st === 'unseen' && seen) return false;
    if(st === 'missed' && !(seen && seen.last === false)) return false;
    if(s){ var hay = (q.stem + ' ' + (q.choices||q.steps||[]).join(' ') + ' ' + (q.pairs ? q.pairs.map(function(p){return p.join(' ');}).join(' ') : '') + ' ' + q.ex + ' ' + (q.pbox ? q.pbox.map(function(r){ return r.join(' '); }).join(' ') : '')).toLowerCase(); if(hay.indexOf(s) === -1) return false; }
    return true;
  });
}

function sectionCount(sec){
  if(sec.type === 'cards' || sec.type === 'list') return sec.items.length;
  if(sec.type === 'table') return sec.rows.length;
  if(sec.type === 'flows') return seqsOf(sec).length;
  if(sec.type === 'figs') return sec.figs.length;

}
function seqsOf(sec){ return SEQUENCES.filter(function(s){ return !sec.lec || s.lec === sec.lec; }); }

function hl(text, term){
  var safe = escHtml(text);
  if(!term) return safe;
  var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}
function cardHTML(c, term){

    (c.tip?'<div class="rv-tip">'+icon('bulb')+escHtml(c.tip)+'</div>':'')+
    '<div>'+lecChip(c.lec)+'</div></div>';

function tableHTML(sec, rows, term){

    rows.map(function(r){ return '<tr>'+r.map(function(cell, i){
      if(sec.head[i] === 'Lecture' && LECTURE_BY_ID[cell]) return '<td>'+lecChip(cell)+'</td>';
      return '<td>'+hl(cell, term)+'</td>'; }).join('')+'</tr>'; }).join('')+
  '</tbody></table></div>';
}
function flowsHTML(seqs, term){
  return '<div class="flows">' + seqs.map(function(s){
    return '<div class="flow tag-'+tagOf(s.lec)+'"><h4>'+hl(s.title, term)+' '+lecChip(s.lec)+'</h4><ol>'+s.steps.map(function(st, i){ return '<li><span class="st"><b>'+(i+1)+'</b><span>'+hl(st, term)+'</span></span></li>'; }).join('')+'</ol></div>';

function sectionHTML(sec, term){
  var t = term ? term.toLowerCase() : '';
  function m(s){ return !t || String(s).toLowerCase().indexOf(t) !== -1; }
  var inner = '';
  if(sec.type === 'cards'){
    var items = sec.items.filter(function(c){ return m(c.name) || m(c.sub) || c.facts.some(function(f){ return m(f[0]) || m(f[1]); }) || m(c.tip); });
    if(!items.length) return '';

  } else if(sec.type === 'table'){
    var rows = sec.rows.filter(function(r){ return r.some(m); });
    if(!rows.length) return '';
    inner = tableHTML(sec, rows, term);
  } else if(sec.type === 'list'){
    var li = sec.items.filter(m); if(!li.length) return '';
    inner = '<ul class="rv-list">' + li.map(function(x){ return '<li>'+hl(x, term)+'</li>'; }).join('') + '</ul>';

    var rest = shuffled(pool.filter(function(q){ return fresh.indexOf(q) === -1; }));

  });

  /* =================================================================== SORT STORM */
  function SortStorm(){
    var g = GAMES[0], root, stage, cardEl, bins, raf = null, last = 0;
    var st = null;
    function pickSet(){
      var choice = STATE.arcade.sortSet;
      if(choice !== 'mix'){ var s = SORT_SETS.filter(function(x){ return x.id === choice; })[0]; if(s) return s; }
      var pool = SORT_SETS.filter(function(x){ return !st || !st.set || x.id !== st.set.id; });
      return pool[Math.floor(Math.random()*pool.length)];
    }
    function newWave(){
      st.set = pickSet(); st.queue = shuffled(st.set.items).slice(0, 8); st.wave++;
      bins.forEach(function(b, i){ b.querySelector('span').textContent = st.set.bins[i]; });
      root.querySelector('.ss-banner').textContent = st.set.title.toUpperCase();
    }
    function nextCard(){
      if(!st.queue.length) newWave();
      st.cur = st.queue.shift(); st.y = 46; st.busy = false;
      cardEl.className = 'ss-card'; cardEl.style.transition = 'none'; cardEl.style.opacity = '1';
      cardEl.textContent = st.cur[0];
      cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
    }
    function floorY(){ return stage.clientHeight - 130 - cardEl.offsetHeight; }
    function pop(txt, color, x, y){ var p = document.createElement('div'); p.className = 'ss-pop'; p.style.color = color; p.style.left = x + 'px'; p.style.top = y + 'px'; p.textContent = txt; stage.appendChild(p); setTimeout(function(){ p.remove(); }, 800); }
    function judge(binIdx){
      if(!st || !st.running || st.busy || !st.cur) return;
      st.busy = true;
      var ok = binIdx === st.cur[1];
      var bin = bins[binIdx < 0 ? st.cur[1] : binIdx];
      if(binIdx >= 0){
        var dx = binIdx === 0 ? -stage.clientWidth/4 : stage.clientWidth/4;
        cardEl.style.transition = 'transform .22s ease-in, opacity .22s';
        cardEl.style.transform = 'translate(calc(-50% + '+dx+'px),' + (stage.clientHeight - 100) + 'px) scale(.6)';
        cardEl.style.opacity = '.2';
      }
      if(ok){
        st.combo++; st.correct++;
        var pts = 50 + Math.round(50 * Math.max(0, 1 - st.y / floorY())) ;
        pts *= (1 + Math.floor(st.combo / 4));
        st.score += pts; sGood();
        bin.classList.add('flash-good'); pop('+' + pts + (st.combo >= 4 ? ' x' + (1 + Math.floor(st.combo/4)) : ''), '#7ee36b', bin.offsetLeft + 20, bin.offsetTop - 20);
        if(st.correct % 6 === 0){ st.level++; st.speed += 9; pop('SPEED UP!', '#ffd23f', stage.clientWidth/2 - 50, 80); }
      } else {
        st.combo = 0; st.lives--; sBad();
        (binIdx >= 0 ? bins[binIdx] : bins[st.cur[1]]).classList.add('flash-bad');
        st.missed.push({ q: st.cur[0] + ' (' + st.set.title.replace('?','') + ')', a: st.set.bins[st.cur[1]] });
        pop(binIdx < 0 ? 'TOO SLOW' : 'MISS', '#ff5c8a', stage.clientWidth/2 - 30, st.y + 40);
      }
      hud(root, { score: st.score, lives: hearts(st.lives), level: st.level });
      setTimeout(function(){
        bins.forEach(function(b){ b.classList.remove('flash-good','flash-bad'); });
        if(!st || !st.running) return;
        if(st.lives <= 0) return over();
        nextCard();
      }, binIdx < 0 ? 450 : 260);
    }
    function loop(t){
      if(!st || !st.running) return;
      var dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
      if(!st.busy && st.cur){
        st.y += (st.fast ? st.speed * 4 : st.speed) * dt;
        cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
        if(st.y >= floorY()) judge(-1);
      }
      raf = requestAnimationFrame(loop);
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      st = { running:true, score:0, lives:3, level:1, combo:0, correct:0, speed:52, wave:0, set:null, queue:[], missed:[], fast:false };
      hud(root, { score:0, lives:hearts(3), level:1 });
      newWave(); nextCard(); last = 0; raf = requestAnimationFrame(loop);
    }
    function over(){
      st.running = false; cancelAnimationFrame(raf);
      var best = finish(g, st.score);
      stage.insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){
      if(!st || !st.running) { if((e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } return; }
      if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ e.preventDefault(); judge(0); }
      else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ e.preventDefault(); judge(1); }
      else if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){ e.preventDefault(); st.fast = true; }
    }
    function onKeyUp(e){ if(st && (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S')) st.fast = false; }
    return {
      mount: function(p){
        var opts = '<option value="mix"'+(STATE.arcade.sortSet==='mix'?' selected':'')+'>Shuffle all sorts</option>' + SORT_SETS.map(function(s){ return '<option value="'+s.id+'"'+(STATE.arcade.sortSet===s.id?' selected':'')+'>'+escHtml(s.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="ssSet">Sort:</label><select id="ssSet">'+opts+'</select>',
          '<div class="gm-stage ss-stage"><div class="ss-banner"></div><div class="ss-card" id="ssCard"></div><div class="ss-danger"></div><div class="ss-bins"><button type="button" class="ss-bin" style="--bc:var(--ar-yellow)" data-bin="0"><span></span><kbd>← / A</kbd></button><button type="button" class="ss-bin" style="--bc:var(--ar-pink)" data-bin="1"><span></span><kbd>→ / D</kbd></button></div>' +
            overlayHTML(g, 'FEEDBACK SORT', 'Each card belongs in one of two bins. Press ← or → (or tap a bin) before it crosses the dashed line. Hold ↓ to drop faster for bonus points. Streaks of 4 multiply your score.', 'START') + '</div>',
          '<kbd>←</kbd> <kbd>→</kbd> sort · <kbd>↓</kbd> fast drop · tap a bin on mobile');
        root = p.querySelector('.gm'); stage = p.querySelector('.ss-stage'); cardEl = p.querySelector('#ssCard'); bins = [].slice.call(p.querySelectorAll('.ss-bin'));
        var preview = SORT_SETS.filter(function(s){ return s.id === STATE.arcade.sortSet; })[0] || SORT_SETS[0];
        bins.forEach(function(b,i){ b.querySelector('span').textContent = preview.bins[i]; });

/* ---------- theme toggle ---------- */
function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
}
function boot(){
  /* sh_theme is the site-wide choice shared with the dashboard */
  var saved = null; try{ saved = localStorage.getItem('sh_theme'); }catch(e){}
  if(saved !== 'light' && saved !== 'dark') saved = null;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  applyTheme(saved);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = !cur ? 'light' : cur === 'light' ? 'dark' : null;
    try{ localStorage.setItem('sh_theme', next || ''); }catch(e){}
    applyTheme(next);
  });
  document.querySelectorAll('#modeSwitch [data-mode]').forEach(function(b){ b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); }); });
  renderHeaderStats();
  var m = STATE.ui.mode; if(['home','compendium','review','arcade'].indexOf(m) === -1) m = 'home';

}

/* ---------- full-content search for the shared widget: every note paragraph, review row,
   exam hint and cram line, each with a place to jump to (window.SH_GOTO) ---------- */
function shSearchSections(){
  var out = [];
  function frag(html){ var d = document.createElement('div'); d.innerHTML = html || ''; return d; }
  function clean(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  LECTURES.forEach(function(l){
    var where = lecLabel(l) + ' ' + l.title;
    Array.prototype.forEach.call(frag(READINGS[l.id]).querySelectorAll('p, li, h3, h4'), function(el, k){
      var t = clean(el.textContent); if(t.length > 2) out.push({ kind:'Notes', where:where, text:t, lec:l.id, go:{ v:'notes', lec:l.id, k:k } });
    });
    (CRAM[l.id] || []).forEach(function(b){ out.push({ kind:'Cram sheet', where:where, text:b, lec:l.id, go:{ v:'cram', lec:l.id } }); });
  });
  HINTS.forEach(function(x){ var l = LECTURE_BY_ID[x.lec]; out.push({ kind:'Exam hints', where:l ? ''+lecLabel(l)+' '+l.title : '', text:clean(x.quote + ' ' + x.take), lec:x.lec, go:{ v:'hints', lec:x.lec } }); });
  REVIEW.forEach(function(g){
    g.sections.forEach(function(sec){
      if(sec.type === 'cards') sec.items.forEach(function(c){ out.push({ kind:'Review', where:g.title, title:c.name, text:clean(c.name + ' ' + c.sub + ' ' + c.facts.map(function(f){ return f[0] + ': ' + f[1]; }).join('; ') + ' ' + c.tip), go:{ v:'review', q:c.name } }); });
      else if(sec.type === 'table') sec.rows.forEach(function(r){ out.push({ kind:'Review', where:g.title + (sec.title ? ' · ' + sec.title : ''), title:r[0], text:clean(r.join(' · ')), go:{ v:'review', q:r[0] } }); });
      else if(sec.type === 'list') sec.items.forEach(function(it){ out.push({ kind:'Review', where:g.title, text:clean(it), go:{ v:'review', q:clean(it).split(' ').slice(0, 4).join(' ') } }); });
    });
  });
  SEQUENCES.forEach(function(sq){ var sg = REVIEW.filter(function(x){ return x.lec === sq.lec; })[0]; out.push({ kind:'Review', where:(sg ? sg.title + ' · ' : '') + 'Processes', title:sq.title, text:clean(sq.title + ': ' + sq.steps.join(' → ')), go:{ v:'review', q:sq.title } }); });
  return out;
}
function shFlashIn(sel){ setTimeout(function(){ var el = typeof sel === 'string' ? document.querySelector(sel) : sel(); if(el && window.shFlash) window.shFlash(el); }, 60); }
window.SH_GOTO = function(g){
  if(!g) return;
  if(g.v === 'notes'){ STATE.ui.lec = g.lec; STATE.ui.sub = 'notes'; STATE.ui.level = 'full'; saveState(); setMode('compendium');
    shFlashIn(function(){ var p = document.querySelector('#compBody .reading-prose'); return p && Array.prototype.filter.call(p.querySelectorAll('p, li, h3, h4'), function(el){ return !el.closest('[data-sh-noread]'); })[g.k]; }); }
  else if(g.v === 'cram'){ STATE.ui.sub = 'cram'; saveState(); setMode('compendium'); shFlashIn('#cram-' + g.lec); }
  else if(g.v === 'hints'){ STATE.ui.sub = 'hints'; saveState(); setMode('compendium');
    shFlashIn(function(){ var a = document.querySelector('#compBody .hint-group [data-lec="' + g.lec + '"]'); return a && a.closest('.hint-group'); }); }
  else if(g.v === 'review'){ reviewSearch = g.q || ''; setMode('review'); }
  else if(g.v === 'bank'){ STATE.ui.sub = 'bank'; STATE.ui.qlec = 'all'; STATE.ui.qsrc = 'all'; STATE.ui.qfmt = 'all'; STATE.ui.qstatus = 'all'; bankSearch = g.q || ''; bankShown = BANK_PAGE; saveState(); setMode('compendium'); }
};

/* Progress sync (widget/v3.js, migration_v34): the widget reads back every answer saved for you on the server,
   including from your linked devices, and hands each question's totals here. Keep whichever copy has more tries,
   so answers made only on this device are never lost. */
var SYNC_LOADED = Date.now();
window.SH_SYNC = {
  merge: function(byQid, days){
    var changed = false, added = 0;
    Object.keys(byQid).forEach(function(id){
      var q = QUESTIONS_BY_ID[id]; if(!q) return;
      var sv = byQid[id], s = STATE.seen[id] || { n:0, c:0, last:null };
      if(sv.n <= s.n) return;
      var dn = sv.n - s.n, dc = Math.max(0, sv.c - s.c);
      if(!s.n) added++;
      STATE.totalAnswered += dn; STATE.totalCorrect += dc;
      var ls = STATE.lecStats[q.lec] || { a:0, c:0 }; ls.a += dn; ls.c += dc; STATE.lecStats[q.lec] = ls;
      STATE.seen[id] = { n:sv.n, c:Math.max(sv.c, s.c), last:sv.last };
      changed = true;
    });
    (days || []).forEach(function(d){ if(STATE.days.indexOf(d) === -1){ STATE.days.push(d); changed = true; } });
    if(!changed) return;
    STATE.days.sort();
    checkAchievements(); saveState(); renderHeaderStats();
    if(added) toast('Synced ' + added + ' question' + (added === 1 ? '' : 's') + ' from your other devices', 'check');
    /* redraw the page only right after it opens, so nobody loses a question they're in the middle of */
    if(Date.now() - SYNC_LOADED < 8000 && !(window.shTTS && window.shTTS.listening && window.shTTS.listening())){ if(STATE.ui.mode === 'home') renderHome(); else if(STATE.ui.mode === 'compendium' && STATE.ui.sub !== 'mock') renderCompendium(); }
  }
};
