/* ===================================================================
   PCD IMPLANTS EXAM 1 HUB — tokens
   Palette "Anodized": titanium-blue ink on a cool machined-paper ground, with the anodized gold and pink of implant parts.
   Type: Sora (display) · Manrope (body) · Red Hat Mono (labels).
   =================================================================== */
:root{
  color-scheme: light;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaedf2; --surface-3:#dde2e9;
  --ink:#1b2430; --ink-soft:#495568; --ink-faint:#5f6b7e; --line:#dce1e8; --line-strong:#c1c8d3;
  --accent:#2d5f92; --accent-ink:#23507d; --accent-soft:#dce7f4;
  --good:#2f7a4f; --good-soft:#dcefe2; --bad:#b8322f; --bad-soft:#f7dcd8; --caution:#9a6412; --caution-soft:#f6e8c9;
  --tag-amber:#a8701a; --tag-sage:#57834f; --tag-blue:#2f62a8; --tag-teal:#1f7f78; --tag-violet:#6a4fa5; --tag-red:#b3352d; --tag-green:#4d7a22; --tag-rose:#b9436a; --tag-plum:#8e3f86; --tag-indigo:#3d4fa8;
  --tag-amber-soft:#f5e6c8; --tag-sage-soft:#e1ecdc; --tag-blue-soft:#dce6f4; --tag-teal-soft:#d5ecea; --tag-violet-soft:#e7e0f3; --tag-red-soft:#f6dbd7; --tag-green-soft:#e2ecd2; --tag-rose-soft:#f5dbe3; --tag-plum-soft:#f2dff0; --tag-indigo-soft:#dfe3f6;
  --shadow:0 1px 2px rgba(27,36,48,.06), 0 4px 14px rgba(27,36,48,.07);
  --radius:12px;
  --font-display:'Sora', 'Manrope', system-ui, sans-serif;
  --font-body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'Red Hat Mono', ui-monospace, Menlo, monospace;
  --font-arcade:'Press Start 2P', 'Courier New', monospace;
  /* Arcade: one fixed world regardless of theme, the implant lab at night */
  --ar-bg:#0d141c; --ar-panel:#142130; --ar-panel-2:#1c2d40; --ar-ink:#eef4fb; --ar-dim:#9db2c9; --ar-line:#2c4560;
  --ar-yellow:#ffd36b; --ar-pink:#ff8fb1; --ar-cyan:#7fd3f0; --ar-green:#8fe3b5; --ar-orange:#ffb36b; --ar-violet:#b9a4ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1217; --surface:#151b22; --surface-2:#1c242d; --surface-3:#26303b;
    --ink:#e8edf3; --ink-soft:#b6c1ce; --ink-faint:#929eae;--lec-num-ink:#0e1217; --line:#29333f; --line-strong:#3c4958;
    --accent:#8fb8e8; --accent-ink:#a9c9ef; --accent-soft:#1a2a3d;
    --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
    --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
    --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1217; --surface:#151b22; --surface-2:#1c242d; --surface-3:#26303b;
  --ink:#e8edf3; --ink-soft:#b6c1ce; --ink-faint:#929eae;--lec-num-ink:#0e1217; --line:#29333f; --line-strong:#3c4958;
  --accent:#8fb8e8; --accent-ink:#a9c9ef; --accent-soft:#1a2a3d;
  --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
  --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
  --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
html{font-synthesis:none}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important;} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--font-mono)}
[hidden]{display:none!important}

/* ---------- header ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.hub-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px;padding:12px 20px 0}
.hub-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hub-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.hub-title h1{font-family:var(--font-display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;margin:0}
.hub-subtitle{color:var(--ink-soft);font-size:.86rem}
.hub-back-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;align-self:center;text-decoration:none;transition:border-color .15s,color .15s}
.hub-back-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-back-btn svg{width:16px;height:16px}
.hub-name-pill{appearance:none;cursor:pointer;font-family:var(--font-body);background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.hub-name-pill:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
.pill.countdown{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:30px;cursor:pointer}
#modeSwitch{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
#modeSwitch::-webkit-scrollbar{display:none}
#modeSwitch button{border:0;background:transparent;padding:9px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px;white-space:nowrap}
#modeSwitch button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#modeSwitch button:hover{color:var(--ink)}
#modeSwitch .mode-icon{font-size:1.05rem}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{border-bottom-color:var(--ar-pink)}
main{padding-top:20px}
.hub-footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.82rem}

/* ---------- sub-tabs ---------- */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.subtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink-soft)}
.subtab.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border:1px solid var(--caution);background:var(--caution-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.notice b{color:var(--caution)}

/* ---------- lecture notes ---------- */
.notes-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
.lec-nav{display:flex;flex-direction:column;gap:6px;min-width:0;position:sticky;top:66px;align-self:start}
.lec-nav button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;cursor:pointer;min-width:0}
.lec-nav button.is-active{border-color:var(--ink);box-shadow:var(--shadow)}
.lec-num{font-family:var(--font-mono);font-size:.75rem;font-weight:700;padding:2px 6px;border-radius:6px;color:var(--lec-num-ink,#fff);flex:none;margin-top:2px}
.lec-nav .t{font-size:.86rem;font-weight:600;line-height:1.3}
.lec-nav .w{font-size:.74rem;color:var(--ink-faint)}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);min-width:0}
.reading h2{font-family:var(--font-display);font-size:1.6rem;margin:0 0 4px;line-height:1.2}
.reading .meta{color:var(--ink-faint);font-size:.82rem;margin-bottom:16px}
.reading h4{font-family:var(--font-display);font-size:1.12rem;margin:22px 0 6px}
.reading p{margin:0 0 12px;max-width:74ch}
.reading-note{background:var(--caution-soft);border-left:3px solid var(--caution);padding:8px 12px;border-radius:6px;font-size:.88rem}
.reading-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.status-badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.status-badge.taught{background:var(--good-soft);color:var(--good)}
.status-badge.slides{background:var(--caution-soft);color:var(--caution)}

/* tag colors */
.tag-amber{--t:var(--tag-amber);--ts:var(--tag-amber-soft)} .tag-sage{--t:var(--tag-sage);--ts:var(--tag-sage-soft)} .tag-blue{--t:var(--tag-blue);--ts:var(--tag-blue-soft)} .tag-teal{--t:var(--tag-teal);--ts:var(--tag-teal-soft)}
.tag-violet{--t:var(--tag-violet);--ts:var(--tag-violet-soft)} .tag-red{--t:var(--tag-red);--ts:var(--tag-red-soft)} .tag-green{--t:var(--tag-green);--ts:var(--tag-green-soft)} .tag-rose{--t:var(--tag-rose);--ts:var(--tag-rose-soft)}
.lec-num{background:var(--t)}
.lec-chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ts);color:var(--t);white-space:nowrap}

/* ---------- question cards ---------- */
.qfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qfilters select,.qfilters input{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0}
.qfilters input{flex:1 1 200px}
.likely-box{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:10px 14px;margin:0 0 16px}
.likely-box > summary{display:flex;gap:8px;align-items:flex-start;cursor:pointer;list-style:none}
.likely-box > summary .ic{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent-ink)}
.likely-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px}
.likely-lec{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.likely-lec h4{margin:0 0 6px;font-size:.95rem}
.likely-lec h4 .lec-num,.likely-lec h4 .snum{margin-right:6px}
.likely-lec h4 small{display:block;font-weight:600;color:var(--ink-soft);font-size:.78rem;margin-top:2px}
.likely-lec ol{margin:0 0 10px;padding-left:20px;font-size:.88rem}
.likely-lec li{margin:3px 0}
.likely-basis{font-family:var(--font-mono);font-size:.66rem;color:var(--ink-soft);background:var(--surface-2);border-radius:4px;padding:1px 5px;white-space:nowrap}
.likely-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink)}
.likely-chip .ic,.likely-chip svg{width:12px;height:12px}
/* Question Bank filter panel (2026-11-03): Lectures + search, Show chips, Order + More filters, then the "Showing ..." line
   with a removable tag per filter. The lecture picker is the tick list, each row with "Only". */
.qbar{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.qf-line{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.qf-lab{flex:none;width:64px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.qf-search{flex:1 1 220px;display:flex;align-items:center;gap:7px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;cursor:text}
.qf-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qf-search svg{width:15px;height:15px;color:var(--ink-faint);flex:none}
.qf-search input{border:0;background:none;outline:0;padding:8px 0;font:inherit;font-size:.9rem;color:var(--ink);flex:1;min-width:0}
.qf-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.qf-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.qf-chip svg{width:13px;height:13px;flex:none}
.qf-chip:hover{border-color:var(--ink-soft);color:var(--ink)}
.qf-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent)}
.qf-n{font-family:var(--font-mono);font-size:.74rem;font-weight:600;color:var(--ink-faint)}
.qf-chip[aria-pressed="true"] .qf-n{color:inherit}
.qf-more{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 11px;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink-soft);cursor:pointer}
.qf-more svg{width:15px;height:15px;flex:none}
.qf-more > svg:last-child{width:13px;height:13px;transition:transform .15s}
.qf-more[aria-expanded="true"]{border-color:var(--accent);color:var(--accent-ink)}
.qf-more[aria-expanded="true"] > svg:last-child{transform:rotate(180deg)}
.qf-badge{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-size:.72rem;font-weight:700}
.qf-badge[hidden]{display:none}
.qf-extra{display:flex;flex-wrap:wrap;gap:10px 18px;padding-top:10px;border-top:1px dashed var(--line)}
.qf-extra[hidden]{display:none}
.qf-field{display:flex;align-items:center;gap:8px 10px;min-width:0}
.qf-field .qf-lab{width:auto}
.qf-field select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0;max-width:100%}
.qsum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--ink-soft);font-size:.86rem;margin:0 0 12px}
.qsum b{color:var(--ink)}
.qsum-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.qsum-tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:3px 7px 3px 10px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;max-width:100%;text-align:left}
.qsum-tag svg{width:12px;height:12px;flex:none;opacity:.8}
.qsum-tag:hover svg{opacity:1}
.qsum-clear{border:0;background:none;color:var(--accent-ink);font:inherit;font-size:.82rem;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:3px 2px}
.qf-empty p{margin:0 auto 12px;max-width:52ch}
.lp{position:relative;flex:0 1 auto;min-width:0}
.lp-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;max-width:100%}
.lp-btn svg{width:14px;height:14px;flex:none}
.lp-btn:hover,.lp-btn[aria-expanded="true"]{border-color:var(--accent)}
.lp-btn.is-on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.lp-sum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.lp-pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:10px}
.lp-help{margin:0 2px 8px;font-size:.82rem;color:var(--ink-soft)}
.lp-quick{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.lp-quick button,.lp-done{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;padding:4px 11px;font:inherit;font-size:.8rem;font-weight:600;color:var(--ink);cursor:pointer}
.lp-done{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.lp-list{max-height:min(52vh,380px);overflow:auto}
.lp-row{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 6px;border-radius:8px;font-size:.88rem}
.lp-row:hover{background:var(--surface-2)}
.lp-row label{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0;padding:6px 0;cursor:pointer}
.lp-row input{margin:3px 0 0;accent-color:var(--accent);flex:none}
.lp-t{flex:1;min-width:0}
.lp-n{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-faint);flex:none;margin-top:2px}
.lp-only{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:3px 9px;font:inherit;font-size:.75rem;font-weight:700;color:var(--ink-soft);cursor:pointer;flex:none}
.lp-only:hover,.lp-only:focus-visible{border-color:var(--accent);color:var(--accent-ink)}
.lp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;border-top:1px solid var(--line);margin-top:6px;font-size:.8rem;color:var(--ink-faint)}
.qorder{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.qorder button{border:0;background:none;padding:7px 11px;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink-soft);cursor:pointer}
.qorder button+button{border-left:1px solid var(--line-strong)}
.qorder button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
@media (max-width:560px){
  .qbar{padding:10px 12px;gap:9px}
  .qf-lab{width:100%}
  .qf-top .qf-lab{width:auto}
  .lp{flex:1 1 0}
  .lp-btn{width:100%}
  .lp-pop{left:auto;right:-13px;width:calc(100vw - 32px)}
  .lp-list{max-height:min(36vh,380px)}
  .lp-sum{max-width:none;flex:1;text-align:left}
  .qf-top .qf-search{flex-basis:100%}
  .qf-chip{padding:5px 10px;font-size:.82rem}
  .qorder button{padding:7px 9px;font-size:.82rem}
  .qf-more{padding:7px 9px}
  .qf-ord .qf-lab{display:none}
  .qf-field{flex:1 1 100%;flex-wrap:wrap}
  .qf-field select{flex:1 1 100%}
}
.qcount{color:var(--ink-faint);font-size:.84rem;margin-bottom:10px}
.rv-set{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:var(--accent-soft,var(--surface-2));border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.rv-set b{display:block}
.rv-set span{color:var(--ink-soft)}
.qlist{display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--t, var(--line))}
.qcard-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qcard.is-retry{border-style:dashed}
.retry-chip{display:inline-flex;align-items:center;gap:4px;color:var(--accent);white-space:normal;max-width:100%;text-align:left}
.retry-chip svg{width:13px;height:13px}
.src-chip{font-family:var(--font-mono);font-size:.68rem;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-soft)}
.qcard-stem{font-weight:600;margin:0 0 12px;white-space:pre-line}
.qcard-choices,.qcard-seq-steps{display:flex;flex-direction:column;gap:7px}
.qcard-choice,.qcard-match-item{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;line-height:1.35}
.qcard-choice:hover,.qcard-match-item:hover{border-color:var(--ink)}
.qcard-choice.is-correct,.qcard-match-item.is-matched{background:var(--good-soft);border-color:var(--good)}
.qcard-choice.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.qcard-choice.is-picked{background:var(--surface-2);border-color:var(--ink)}
.qcard-choice .ord{font-family:var(--font-mono);font-weight:700;margin-right:8px;color:var(--accent-ink)}
.qcard-seq-tools{display:flex;gap:8px;margin-top:8px}
.qcard-seq-tools[hidden],.qcard.is-answered .qcard-seq-tools{display:none}
.qcard-seq-tools button{font:inherit;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.qcard-seq-tools button:hover{border-color:var(--ink)}
.qcard-choice:disabled{cursor:default}
.qcard-match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard-match-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.qcard-match-item.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qcard-match-item.is-wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qcard-hint{font-size:.8rem;color:var(--ink-faint);margin-bottom:8px}
.qcard-explain{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.qcard.is-answered .qcard-explain{display:block}
.qx-cue{display:none;margin-top:9px;padding:8px 11px;border-radius:8px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.qx-cue svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:var(--accent-ink)}
.qx-cue b{color:var(--accent-ink)}
.qcard.is-missed .qx-cue{display:block}
.qcard-verdict{font-weight:700;margin-right:6px}
.qcard-verdict.ok{color:var(--good)} .qcard-verdict.bad{color:var(--bad)}
.qcard-classdata-row{margin-top:8px}
.qcard-classdata-result{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)}
.qcard-classdata-result.is-bad{color:var(--bad)} .qcard-classdata-result.is-ok{color:var(--good)}
.qcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent-ink);cursor:pointer;font-size:.82rem;padding:0;text-decoration:underline}

/* ---------- hints & cram ---------- */
.hint-group{margin-bottom:34px}
.hint-group h3,.cram-card h3{font-family:var(--font-display);margin:0 0 10px;display:flex;align-items:center;gap:10px;font-size:1.2rem}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;border-left:4px solid var(--t)}
.hint blockquote{margin:0 0 6px;font-family:var(--font-display);font-style:italic;font-size:1.02rem;line-height:1.45}
.hint .take{font-size:.88rem;color:var(--ink-soft)}
.kind{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px}
.kind.emphasize{background:var(--good-soft);color:var(--good)} .kind.list{background:var(--accent-soft);color:var(--accent-ink)} .kind.deemphasize{background:var(--caution-soft);color:var(--caution)}
.cram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cram-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.cram-card ul{margin:0;padding-left:18px}
.cram-card li{margin-bottom:5px;font-size:.9rem}

/* ---------- review ---------- */
.review-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.review-top input{flex:1 1 240px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;font:inherit;color:var(--ink);min-width:0}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.toggle .sw{width:30px;height:17px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:15px}
.group-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.group-chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.group-chip .n{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint)}
.group-chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)} .group-chip.is-active .n{color:var(--bg);opacity:.7}
.gc-lec{font-family:var(--font-mono);font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ts);color:var(--t)}
.group-chip.is-active .gc-lec{background:var(--bg);color:var(--ink)}
.group-lec{margin:4px 0 6px}
.group-head h2{font-family:var(--font-display);font-size:1.7rem;margin:4px 0 4px}
.group-head p{color:var(--ink-soft);margin:0 0 20px;max-width:80ch}
.rv-parts{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 22px}
.rv-part-link{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.rv-part-link:hover{border-color:var(--accent);color:var(--accent)}
.rv-part{font-family:var(--font-display);font-size:1.35rem;margin:6px 0 16px;padding-top:4px;scroll-margin-top:90px;color:var(--accent)}
.rv-section{margin-bottom:38px}
.rv-section > h3{font-family:var(--font-display);font-size:1.18rem;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--t);display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-card h4{margin:0;font-size:1.02rem;line-height:1.25}
.rv-card .sub{font-size:.8rem;color:var(--ink-soft);margin-top:-2px}
.rv-card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:.87rem}
.rv-card dt{font-weight:700;color:var(--t);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;white-space:nowrap}
.rv-card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rv-tip{margin-top:4px;font-size:.8rem;font-weight:600;background:var(--ts);color:var(--t);padding:5px 9px;border-radius:7px;align-self:flex-start}
.rv-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.rv-table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
table.rv-table th{background:var(--surface-2);text-align:left;padding:9px 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);position:sticky;top:0}
table.rv-table td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.rv-table td:first-child{font-weight:700}
table.rv-table tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 40%, transparent)}
.rv-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rv-list li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.9rem}
.flows{display:grid;gap:16px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--t)}
.flow h4{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow li{display:flex;align-items:center;gap:6px;font-size:.85rem}
.flow li .st{background:var(--ts);color:var(--ink);border:1px solid color-mix(in srgb, var(--t) 40%, transparent);border-radius:8px;padding:5px 9px}
.flow li .st b{font-family:var(--font-mono);color:var(--t);margin-right:5px}
.flow li:not(:last-child)::after{content:"→";color:var(--ink-faint)}
/* recall mode: hide answers until tapped */
.recall .rv-card dd,.recall table.rv-table td:not(:first-child),.recall .flow li .st span{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
.recall .rv-card dd.shown,.recall table.rv-table td.shown,.recall .flow li .st span.shown{filter:none}
.rv-empty{color:var(--ink-faint);padding:30px 0;text-align:center}
mark{background:var(--caution-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- toast ---------- */
#toastHost{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem;animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===================================================================
   ARCADE (fixed dark world)
   =================================================================== */
#panel-arcade{background:var(--ar-bg);color:var(--ar-ink);margin:-16px -20px 0;padding:24px 20px 40px;min-height:70vh;border-radius:0 0 18px 18px;position:relative;overflow:hidden}
#panel-arcade::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);background-size:22px 22px;pointer-events:none}
.ar-wrap{position:relative;max-width:1060px;margin:0 auto}
.ar-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;min-height:220px;padding:22px 24px;border-radius:18px;border:2px solid var(--ar-line);background:linear-gradient(90deg, var(--ar-bg) 0 26%, rgba(12,32,31,.5) 48%, transparent 66%), var(--ar-hero-art) right 18px center/auto 88% no-repeat, var(--ar-bg)}
@media (max-width: 760px){ .ar-hero{min-height:170px;padding:16px;background:linear-gradient(90deg, var(--ar-bg) 0 40%, rgba(12,32,31,.6) 70%, rgba(12,32,31,.3)), var(--ar-hero-art) right 18px center/auto 88% no-repeat, var(--ar-bg)} }
.ar-logo{font-family:var(--font-arcade);font-size:1.35rem;line-height:1.5;color:var(--ar-yellow);text-shadow:3px 3px 0 var(--ar-pink);margin:0}
.ar-logo small{display:block;font-size:.55rem;color:var(--ar-dim);text-shadow:none;margin-top:6px;letter-spacing:.06em}
.ar-stats{display:flex;gap:8px;flex-wrap:wrap}
.ar-stat{background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 12px;font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-stat b{color:var(--ar-ink);font-size:.95rem;margin-left:4px}
.ar-mute{cursor:pointer;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 10px;color:var(--ar-ink)}
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ar-tile{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, border-color .15s;cursor:pointer;text-align:left;padding:0;color:var(--ar-ink)}
.ar-tile:hover,.ar-tile:focus-visible{transform:translateY(-4px);border-color:var(--c)}
.ar-thumb{height:170px;background:var(--ar-panel-2);display:block;width:100%}
.ar-thumb svg{display:block;width:100%;height:100%}
.ar-tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ar-tile h3{font-family:var(--font-arcade);font-size:.85rem;color:var(--c);margin:0;line-height:1.5}
.ar-tile p{margin:0;font-size:.88rem;color:var(--ar-dim)}
.ar-tile .ar-tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.ar-play{font-family:var(--font-arcade);font-size:.65rem;background:var(--c);color:var(--ar-bg);padding:9px 14px;border-radius:8px;box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, #000)}
.ar-best{font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-how{margin-top:26px;background:var(--ar-panel);border:2px dashed var(--ar-line);border-radius:14px;padding:14px 18px;font-size:.88rem;color:var(--ar-dim)}
.ar-how b{color:var(--ar-ink)}

/* game shell */
.gm{display:flex;flex-direction:column;gap:12px}
.gm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-back{font-family:var(--font-arcade);font-size:.6rem;background:var(--ar-panel);border:2px solid var(--ar-line);color:var(--ar-ink);padding:9px 12px;border-radius:8px;cursor:pointer}
.gm-title{font-family:var(--font-arcade);font-size:.8rem;color:var(--c);margin-right:auto}
.gm-hud{display:flex;gap:8px;flex-wrap:wrap}
.gm-hud span{font-family:var(--font-mono);font-size:.8rem;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:8px;padding:5px 10px}
.gm-hud b{color:var(--ar-yellow)}
.gm-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm-select label{font-size:.82rem;color:var(--ar-dim)}
.gm-select select{background:var(--ar-panel);color:var(--ar-ink);border:2px solid var(--ar-line);border-radius:8px;padding:6px 10px;font:inherit;font-size:.86rem;max-width:100%}
.gm-stage{position:relative;background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.gm-overlay{position:absolute;inset:0;background:rgba(10,8,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5;overflow-y:auto}
.gm-overlay h2{font-family:var(--font-arcade);font-size:1rem;color:var(--c);margin:0;line-height:1.6}
.gm-overlay p{margin:0;color:var(--ar-dim);max-width:52ch;font-size:.92rem}
.gm-big{font-family:var(--font-arcade);font-size:1.6rem;color:var(--ar-yellow)}
.gm-btn{font-family:var(--font-arcade);font-size:.7rem;background:var(--c);color:var(--ar-bg);border:0;padding:12px 18px;border-radius:10px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn.alt{background:var(--ar-panel-2);color:var(--ar-ink);box-shadow:0 5px 0 #0a0818}
.gm-missed{width:100%;max-width:560px;text-align:left;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 14px;max-height:240px;overflow-y:auto;font-size:.84rem}
.gm-missed h4{margin:0 0 6px;font-family:var(--font-arcade);font-size:.6rem;color:var(--ar-pink)}
.gm-missed li{margin-bottom:6px;color:var(--ar-ink)}
.gm-missed li span{color:var(--ar-green)}
.gm-keys{font-size:.78rem;color:var(--ar-dim);text-align:center}
.gm-keys kbd{font-family:var(--font-mono);background:var(--ar-panel-2);border:1px solid var(--ar-line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--ar-ink)}

/* Sort Storm */
.ss-stage{height:470px}
.ss-banner{position:absolute;top:12px;left:0;right:0;text-align:center;font-family:var(--font-arcade);font-size:.7rem;color:var(--ar-cyan);line-height:1.6;padding:0 12px;z-index:2}
.ss-card{position:absolute;left:50%;top:0;transform:translate(-50%,0);background:var(--ar-yellow);color:#1a1433;font-weight:800;padding:14px 18px;border-radius:12px;min-width:170px;max-width:78%;text-align:center;font-size:1.02rem;box-shadow:0 6px 0 #b8901c, 0 10px 24px rgba(0,0,0,.4);z-index:3;will-change:transform}
.ss-card.fly-l{transition:transform .22s ease-in, opacity .22s;opacity:.2}
.ss-bins{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.ss-bin{height:110px;border-radius:14px;border:3px dashed var(--bc);background:color-mix(in srgb, var(--bc) 14%, transparent);color:var(--ar-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1rem;cursor:pointer;text-align:center;padding:6px}
.ss-bin kbd{font-family:var(--font-mono);font-size:.72rem;background:var(--ar-bg);border:1px solid var(--ar-line);border-radius:5px;padding:1px 6px;color:var(--ar-dim);font-weight:400}
.ss-bin.flash-good{background:color-mix(in srgb, var(--ar-green) 45%, transparent);border-style:solid;border-color:var(--ar-green)}
.ss-bin.flash-bad{background:color-mix(in srgb, var(--ar-pink) 45%, transparent);border-style:solid;border-color:var(--ar-pink)}
.ss-danger{position:absolute;left:0;right:0;bottom:130px;border-top:2px dashed rgba(255,92,138,.5)}
.ss-pop{position:absolute;font-family:var(--font-arcade);font-size:.75rem;pointer-events:none;animation:pop .8s ease-out forwards;z-index:4}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}

@media (hover:none){ .sn-pad{display:grid} }

/* ---------- responsive ---------- */

.qcard-choice[data-act="multi"].is-correct::before{background:var(--good);border-color:var(--good)}
.qcard-choice[data-act="multi"].is-wrong::before{background:var(--bad);border-color:var(--bad)}
.qcard-choice[data-act="multi"].is-selected::after,.qcard-choice[data-act="multi"].is-correct::after,.qcard-choice[data-act="multi"].is-wrong::after{content:"";position:absolute;left:18px;top:50%;width:5px;height:10px;margin-top:-7px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

.hh-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.hh-chips span{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.hh-ready{display:flex;align-items:center;gap:16px}
.hh-ring{width:96px;height:96px;flex:none}
.hh-ring-bg{fill:none;stroke:var(--surface-3);stroke-width:9}
.hh-ring-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:42px 42px;transition:stroke-dashoffset .6s ease}
.hh-ring text{font:700 17px var(--font-mono);fill:var(--ink)}
.hh-ready-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.hh-ready-txt b{font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.hh-ready-txt span{font-size:.86rem;color:var(--ink-soft)}
.home-alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:.92rem}
.home-alert .ic{flex:none;width:20px;height:20px;color:var(--accent-ink);margin-top:1px}
.home-alert.is-due{border-color:var(--caution);background:var(--caution-soft)}
.home-alert.is-due .ic,.home-alert.is-due b{color:var(--caution)}
.home-qs{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.home-col{display:grid;gap:16px;min-width:0}
.home-card{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.home-card h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:1.15rem}
.home-card h3 .ic{width:20px;height:20px;color:var(--accent-ink)}
.hc-note{margin:0 0 10px;font-size:.84rem;color:var(--ink-soft)}
.home-next{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.home-next li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.home-next li > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.home-next small{color:var(--ink-soft);font-size:.82rem}
.home-next .btn{flex:none}
.hn-ic{flex:none;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink)}
.hn-ic .ic{width:18px;height:18px}
.hl-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.hl-list li{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:1px solid var(--line)}
.hl-list li:first-child{border-top:0}
.hl-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hl-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.hl-top b{font-size:.93rem}
.hl-who,.hl-meta{font-size:.78rem;color:var(--ink-soft)}
.hl-bar{position:relative;display:block;height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.hl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.hl-tried{background:color-mix(in srgb, var(--t) 35%, transparent)}
.hl-right{background:var(--t)}
.hl-acts{display:flex;gap:6px;flex:none}
.hl-acts .btn{padding:5px 10px;font-size:.8rem}
.home-tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line-strong);display:grid;gap:10px}
.home-tl li{position:relative;display:flex;flex-direction:column;padding-left:6px}
.home-tl li::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:999px;background:var(--surface);border:2px solid var(--line-strong)}
.home-tl .tl-date{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.home-tl .tl-what{font-size:.9rem}
.home-tl .tl-past{opacity:.62}
.home-tl .tl-past::before{background:var(--line-strong)}
.home-tl .tl-today::before{background:var(--accent);border-color:var(--accent)}
.home-tl .tl-due .tl-what{color:var(--caution);font-weight:700}
.home-tl .tl-exam .tl-what{color:var(--accent-ink);font-weight:700}
.home-tl .tl-exam::before{border-color:var(--accent);background:var(--accent-soft)}
.home-tl .tl-later{opacity:.75}
.home-days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin:0 0 10px}
.hd-day{aspect-ratio:1;border-radius:4px;background:var(--surface-3)}
.hd-day.on{background:var(--accent)}
.hd-day.today{outline:2px solid var(--ink-soft);outline-offset:1px}
.home-links{margin:0;padding-left:18px;display:grid;gap:6px;font-size:.9rem;color:var(--ink-soft)}
.home-links .linkbtn{appearance:none;border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--accent-ink);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media (max-width:900px){.home-hero,.home-grid{grid-template-columns:minmax(0,1fr)}.home-qs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.hh-main h2{font-size:2rem}.hc-unit{min-width:64px}.hc-unit b{font-size:1.6rem}.home-qs{grid-template-columns:minmax(0,1fr)}.hl-list li{flex-wrap:wrap}.hl-acts{width:100%;justify-content:flex-end}.hh-ring{width:80px;height:80px}}

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.anima{color:var(--anatomy-text)}
.anima .iso-figure{margin:0}
.anima .iso-plate{border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);padding:40px 12px 40px;background:var(--surface)}
.anima .iso-plate-corners{inset:14px 16px}
.anima .iso-plate-corner{font-size:10.5px}

.anima .am-svg{max-width:660px;margin:0 auto}

.anima .am-svg svg *{vector-effect:none}

.anima .am-btn{border:1px solid var(--line-strong);border-radius:8px;background:transparent;color:var(--ink-soft);font:500 .8rem var(--font-body);padding:5px 10px;cursor:pointer}
.anima .am-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.anima .am-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.anima .am-summary{font-size:.92rem;line-height:1.55;color:var(--ink);margin:8px 0;min-height:3.2em}
.anima .am-info{font-size:.86rem;line-height:1.5;color:var(--ink-soft);margin:6px 0;border-left:2px solid var(--line-strong);padding-left:10px;min-height:2.4em}
.anima .am-sources{font-size:.82rem;line-height:1.55;color:var(--ink-soft);margin:8px 0 0}
.anima .am-sources summary{cursor:pointer;font-weight:600;color:var(--ink-soft)}
.anima .am-sources ul{padding-left:18px;margin:6px 0}
.anima .am-sources li{margin:4px 0}
.anima svg .t{fill:var(--anatomy-text);font:13.5px var(--anatomy-mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}

mq("ev-seven", "evolution", "rec", "Dr. Mueninghoff said one thing from his lecture really needs to be known for the exam. What was it?",
  [["The seven basic types of implants, and recognizing each","He said: out of this entire lecture, that's something that you really need to know."],
   ["The exact year each historical material was first tried","He gave dates as background; he doesn't want worthless memorizing."],
   ["The advantages and disadvantages of the root form","He said not to worry about the root form's pros and cons."],
   ["The names of the inventors of each design","The names are context; recognizing the type is what he asked for."]],
  "He listed seven types (subperiosteal, endodontic stabilizer, transosseous, intramucosal insert, blade/plate form, ramus frame, root form) and said that's what you have to know and recognize.");
mq("ev-gold", "evolution", "rec", "Why did the gold roots used in 1809 fail to integrate with bone?",
  [["Gold forms very little surface oxide for bone to bond to","Bone integrates with a metal's oxide layer, and gold has almost none."],
   ["Gold is toxic and killed the surrounding bone","Lead was the toxic one; gold resists corrosion."],
   ["Gold was too brittle and fractured under normal chewing forces","Porcelain was the one that broke; gold is soft and ductile."],
   ["Gold corroded quickly in saliva","Gold resists corrosion; its problem was the missing oxide."]],
  "Today's titanium implants carry a titanium oxide layer, a ceramic, and the bone integrates with that oxide. Gold has very little oxide, so it never osseointegrated.");
mq("ev-oxide", "evolution", "rec", "According to Dr. Mueninghoff, what does bone actually integrate with on a titanium implant?",
  [["The titanium oxide on its surface","The oxide is a ceramic, and that is what the body integrates with."],
   ["The pure titanium metal underneath","He stressed it's not integrated with the titanium itself."],
   ["A calcium layer the manufacturer coats on every implant","Coatings like HA exist, but the integration he described is with the oxide."],
   ["The polymer insert inside the implant","That was the IMZ's design, meant to mimic a ligament, and it failed."]],
  "\"The body is integrated with a ceramic. It's not integrated with the titanium. It's integrated with the ceramic, which is titanium oxide.\"");
mq("ev-porcelain", "evolution", "rec", "Porcelain roots were tried in 1891. What was their main problem?",
  [["They weren't strong enough and broke under force","Porcelain then lacked the crystal structure for strength; it broke when loaded."],
   ["They poisoned the patient","That was the concern with lead (1888)."],
   ["They had no oxide surface for bone","Porcelain is itself an oxide ceramic; strength was the problem."],
   ["They could only be placed through an incision under the chin","That describes the transosteal implant."]],
  "He said porcelain might have achieved some integration, but the porcelain of the day broke as soon as force was put on it. Single crystal sapphire later had the same problem.");
mq("ev-branemark", "evolution", "rec", "Who discovered osseointegration, and how?",
  [["An orthopedic surgeon whose titanium chambers in animals wouldn't come out","Brånemark, a physician, found the bone had grown onto the titanium."],
   ["A prosthodontist testing gold roots in patients","Gold roots failed; the discovery came from titanium in animals."],
   ["A periodontist studying bone grafts around teeth","The discovery came from orthopedic research, not periodontics."],
   ["A materials engineer who coated steel pins with porcelain","Titanium, not coated steel, was the key."]],
  "Dr. Mueninghoff stressed it was discovered by a physician: Brånemark, an orthopedic surgeon, couldn't remove titanium devices from animal bone. Brånemark and the root form became synonymous.");
mq("ev-misch", "evolution", "rec", "Which name did Dr. Mueninghoff tie to popularizing implants in the United States?",
  [["Carl Misch","The American who popularized implants and wrote the implant textbook."],
   ["Leonard Linkow","Linkow put holes in the blade implant (Blade-Vent)."],
   ["Ford Turner","Turner placed long-lasting ramus frames in Birmingham."],
   ["Bosker","Bosker designed the transmandibular implant in Germany."]],
  "Brånemark discovered osseointegration; Carl Misch popularized implants in the U.S. and wrote the textbook the course leans on. Ford Turner is Birmingham's own: the anatomist turned dentist whose ramus frames lasted 10 to 25 years, not the one who popularized implants across the country.");
mq("ev-subperi", "evolution", "rec", "Which description fits a subperiosteal implant?",
  [["A metal framework that rests on the bone under the periosteum","The name says it: under the periosteum, over the bone."],
   ["A rod passed through a root canal into the bone","That is an endodontic stabilizer."],
   ["A plate under the chin with posts running up through the mandible","That is a transosteal implant."],
   ["Buttons on a denture fitting into holes in the mucosa","That is an intramucosal insert."]],
  "The surgeon laid back the periosteum, took an impression of the bone, and a lattice was made to sit on the bone, under the periosteum.");
mq("ev-subperi-why", "evolution", "rec", "Why did Dr. Mueninghoff call the subperiosteal procedure brutal?",
  [["It needed one surgery for an impression and another to place it","Lay back the periosteum, impress, suture; reopen days later to place."],
   ["It always had to be done under general anesthesia, through an incision under the chin","That was the transosteal (TMI) procedure."],
   ["It needed the patient's teeth extracted in the same visit","Not the reason he gave."],
   ["It required a bone graft from the hip first","Not part of the procedure he described."]],
  "It was a two-stage procedure: open, take an impression of the bone, close; then reopen a few days later to seat the framework.");
mq("ev-subperi-fail", "evolution", "rec", "What happened when subperiosteal implants failed?",
  [["Massive destruction of the bone they covered","\"When they went south, they really went south.\""],
   ["They simply loosened and the patient spat them out","They infected and destroyed bone, a far worse outcome."],
   ["They fused permanently and couldn't be removed","They were removable, but by then much bone was gone."],
   ["Only the denture teeth broke","The problem was in the bone, not the denture."]],
  "His case showed massive anterior bone destruction after a subperiosteal hooked to two natural teeth was removed.");
mq("ev-endo", "evolution", "rec", "An endodontic stabilizer is a rod that:",
  [["Runs through a root canal and out the apex into the bone","Endo = root canal; it extends past the root into bone."],
   ["Lies on the bone under the periosteum","That is a subperiosteal implant."],
   ["Is set in a slot cut in the bone, like a flat blade or plate","That is a blade implant."],
   ["Runs from the symphysis back into both rami","That is a ramus frame."]],
  "It went through the tooth and out the root end to stabilize the tooth in bone.");
mq("ev-endo-fail", "evolution", "rec", "Which two problems made endodontic stabilizers fail?",
  [["Not titanium (stainless steel), and a poor seal where they left the root","He named both: the metal and the failed endodontic seal."],
   ["Too short, and placed only in the maxilla","Short length was seen once, but not the two reasons he gave."],
   ["Made of gold, and cemented to the crown","They were surgical stainless steel, not gold."],
   ["Coated with hydroxyapatite, which dissolved","HA coatings came later on other designs."]],
  "\"Number one, they weren't titanium. They were surgical stainless steel. And also, when it came out of the tooth, we didn't get a good seal.\"");
mq("ev-intramuc", "evolution", "rec", "What was the major drawback of intramucosal inserts?",
  [["The denture couldn't be left out for more than a few hours","The holes in the mucosa began to close."],
   ["They destroyed the alveolar bone beneath them within months","They sat in the mucosa, not the bone."],
   ["They could only be placed in the mandible","They were used on upper (palatal) dentures."],
   ["They required general anesthesia","They were done chairside with the patient numb."]],
  "Holes were drilled in the palatal mucosa and the denture left in for two weeks so the tissue healed around the buttons; after that the denture couldn't stay out long or the holes would close.");
mq("ev-ramus", "evolution", "rec", "Which statement about the mandibular ramus frame is correct?",
  [["It is one piece, from the symphysis into both rami, to retain a lower denture","That's the design the Roberts brothers made."],

   ["It sits under the periosteum over the whole ridge","That is the subperiosteal implant."],
   ["It was designed to retain upper complete dentures","It was designed for the mandibular complete denture."]],
  "A one-piece implant system developed to retain the mandibular complete denture (Drs. Harold and Ralph Roberts, 1970).");
mq("ev-roberts", "evolution", "rec", "Drs. Harold and Ralph Roberts are credited with originating which designs?",
  [["The ramus frame and the blade implant","Both came from the California brothers."],
   ["The transmandibular implant and the Dolder bar","The TMI was Bosker's; the Dolder bar is an attachment."],
   ["The root form and the TiUnite surface","Root form is tied to Brånemark."],

mq("ev-turner", "evolution", "rec", "Why did Dr. Ford Turner's ramus frames last 10 to 25 years when most lasted only a few?",
  [["He was an anatomist who handled tissue gently and didn't burn the bone","He also cleaned the metal before placing it."],
   ["He made them from titanium alloy","They were usually surgical Vitallium."],
   ["He loaded them only after a year of healing","Not what was described."],
   ["He always splinted them to natural teeth","Ramus frames were for edentulous mandibles."]],
  "Turner taught anatomy before becoming a dentist; he was careful with tissue, didn't overheat bone and cleaned the metal.");
mq("ev-lew", "evolution", "rec", "On a ramus frame, what was the Lew attachment?",
  [["A plunger in the denture that passed through or under the bar","It snapped the denture onto the frame's bar."],
   ["A clip that changed color as it wore","That describes Hader clips."],
   ["A rigid metal-to-metal bar sleeve","That describes the Dolder bar."],
   ["A titanium screw into the ramus","The attachment held the denture, not the frame."]],
  "A small plunger set in autopolymerizing acrylic in the denture, engaging a hole in (or space under) the bar. Patients had to bite moderately while it was set.");
mq("ev-blade", "evolution", "rec", "What usually held early blade implants in place?",
  [["Being joined to a natural tooth","Usually hooked to another tooth; a soft tissue layer lay between metal and bone."],
   ["Direct osseointegration along the whole blade","Most had a soft tissue layer, not bone contact."],
   ["A titanium plasma spray coating","Early blades weren't even titanium."],
   ["Screws through both cortical plates","That describes transosteal fixation."]],
  "\"Usually there was a soft tissue layer that went between the metal and the bone. And usually it's always hooked to another tooth. That's what kept it in place.\" Screws through both cortical plates describe a transosteal implant, not a blade.");
mq("ev-linkow", "evolution", "rec", "How did Linkow change the original blade implant?",
  [["He put holes in the blade","The Blade-Vent."],
   ["He cut its bottom into an anchor shape","That was Cranin's Anchor blade."],

mq("ev-prebran", "evolution", "rec", "Before Brånemark, what counted as a successful implant?",
  [["Functional service for five years in 75% of patients","\"Figures don't lie, but liars figure.\""],

mq("ev-trans", "evolution", "rec", "Where and when did the transosteal implant originate?",

mq("ev-tmi-bone", "evolution", "rec", "What did Dr. Mueninghoff's team notice in patients with a transmandibular implant (TMI)?",
  [["Bone distal to the plate grew thicker over time","Force keeps bone healthy."],

mq("ev-tmi-who", "evolution", "rec", "For which patients did UAB place transmandibular implants before root forms were approved?",

mq("ev-hader", "evolution", "rec", "Hader clips on a bar were nylon in different colors. What did changing colors (white, then yellow, then red) allow?",

mq("ev-corevent", "evolution", "rec", "Why was the Core-Vent design a problem when an abutment broke?",

mq("ev-frialit", "evolution", "rec", "Why was the Frialit implant made wider at the top than the bottom?",

mq("in-def", "intro", "slides", "Which definition of a dental implant matches Dr. Chavali's slide?",
  [["An alloplastic device placed beneath the mucosa or periosteum, on or within bone, to retain and support a prosthesis","That's the slide's definition, word for word in meaning."],
   ["A graft of the patient's own bone shaped to replace a root","An implant is alloplastic (man-made), not an autograft."],
   ["Any crown or bridge that is cemented to natural teeth","That's conventional fixed prosthodontics."],
   ["A titanium screw placed through both cortical plates of the mandible","That describes only the transosteal implant."]],
  "A prosthetic device made of alloplastic material(s) implanted into the oral tissues beneath the mucosal and/or periosteal layer, and on and/or within the bone, to provide retention and support for a fixed or removable prosthesis.");
mq("in-osseo", "intro", "slides", "Osseointegration is best defined as:",
  [["The apparent direct attachment of bone to an inert alloplastic material without intervening connective tissue","The slide's definition."],

   ["Cement bonding the implant to the osteotomy walls","Implants aren't cemented into bone."]],
  "Key words: direct, bone, no connective tissue in between.");
mq("in-branemark", "intro", "slides", "According to Dr. Chavali's slide, Brånemark's 1952 discovery came from titanium chambers placed in:",
