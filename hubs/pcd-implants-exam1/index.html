  "Brånemark, an orthopedic surgeon, found the chambers hard to remove (1952) and coined \"osseointegration\" in the 1960s.");
mq("in-primary", "intro", "slides", "Primary osseointegration (primary stability) is:",
  [["The initial mechanical lock and bone healing between the implant and the osteotomy","The implant is a bit wider than the last drill, so it engages the bone like a screw."],
   ["The bone remodeling that continues after the implant is loaded","That is secondary osseointegration."],
   ["The soft tissue seal around the healing abutment","That is soft tissue healing, about 3 weeks."],
   ["The bond formed by the cement under the crown","Implants aren't cemented into bone."]],
  "Primary = initial bone healing between implant and osteotomy (mechanical). Secondary = remodeling, critical for long-term success.");
mq("in-secondary", "intro", "slides", "Why is secondary osseointegration called the critical factor for long-term success?",
  [["It is the remodeling that replaces the surgical bone with new bone around the implant","Remodeling continues after loading; it is integration proper."],
   ["It is the friction that holds the implant on the day of surgery","That's primary stability."],
   ["It is what a torque wrench measures at placement","Insertion torque reflects primary stability."],
   ["It happens only in the maxilla","It happens in both jaws; it takes longer in the maxilla."]],
  "Slide: bone remodeling phase, starting about 4-6 weeks after initial healing and continuing after the implant is loaded.");
mq("in-dip", "intro", "rec", "In the healing video, what happens to primary stability from about day 7?",
  [["It drops as osteoclasts resorb the bone edges","Woven bone then builds secondary stability."],
   ["It doubles as woven bone forms","Woven bone builds secondary stability; primary drops."],
   ["It stays the same until the implant is loaded","It changes on its own as bone remodels."],
   ["It is lost completely and the implant spins","Total stability dips but the implant stays put."]],
  "\"This will initially reduce the primary stability of the implant. So that's an important point.\" The terminology lecture calls the low point the stability dip.");
mq("in-wait", "intro", "rec", "In the second-floor clinic, unless the surgeon says otherwise, how long does Dr. Chavali say you wait before restoring?",
  [["About 4 months in the mandible and 6 months in the maxilla","Denser mandibular bone integrates sooner."],
   ["About 6 months in the mandible and 4 months in the maxilla","Reversed: the maxilla takes longer."],
   ["About 3 weeks in either jaw","Three weeks is the soft tissue wait around a healing abutment."],
   ["About 12 months in either jaw","Much longer than the traditional wait."]],
  "\"Four months in the mandible and six months in the maxilla.\" Surgeons may quote other times by system and protocol.");
mq("in-maxdens", "intro", "rec", "Why does the maxilla traditionally get a longer healing time than the mandible?",
  [["Its bone is generally less dense","Mandible dense and thick; maxilla less so."],
   ["It has more keratinized tissue","Not the reason."],
   ["Its implants are always longer","Not the reason."],
   ["It is always loaded immediately, same day","The opposite."]],
  "Secondary osseointegration takes about 4 months in the mandible and 6 in the maxilla.");
mq("in-wolff", "intro", "rec", "Wolff's law states that:",
  [["The internal architecture of bone is determined by the external forces on it","Bone remodels to its load."],
   ["Bone heals fastest when it is never loaded","Unloaded bone atrophies."],
   ["Implants should always be placed at the crest","Not Wolff's law."],
   ["Titanium forms an oxide layer in air","True of titanium, but not Wolff's law."]],
  "Inside an adaptive window, bone stays healthy or gets stronger; too little load and it atrophies, too much and it breaks down.");
mq("in-alveolar", "intro", "rec", "After a tooth is extracted and not replaced, what happens to the alveolar bone?",
  [["It resorbs over time toward the basal bone","No stimulation, so it disappears (Wolff's law)."],
   ["It thickens because chewing forces increase","Without the tooth, forces on that bone decrease."],
   ["It turns into basal bone","It is lost, leaving basal bone."],
   ["It stays the same as long as a denture is worn","Ridges keep resorbing under dentures."]],
  "Alveolar bone exists to hold teeth; remove the tooth and it keeps resorbing.");
mq("in-2stage", "intro", "slides", "In two-stage implant surgery, what is placed at the first surgery?",
  [["A cover screw, with the flap closed over the implant","The implant heals submerged for 3-6 months."],
   ["A tall healing abutment sticking up through the mucosa","That's one-stage, or the second stage of two-stage."],
   ["The final abutment and crown","Not until the implant integrates."],
   ["An impression coping","That's for the impression, after healing."]],
  "Brånemark (1985): submerged healing under a cover screw for 3-6 months, then a second surgery to place a healing abutment.");
mq("in-1stage", "intro", "slides", "Who proposed one-stage (non-submerged) implant surgery, and what does it avoid?",
  [["Schroeder (1996); it avoids a second surgery","Transmucosal healing with a healing abutment from the start."],
   ["Brånemark (1985); it avoids a cover screw","Brånemark proposed the two-stage approach."],
   ["Misch (2008); it avoids the need for any CBCT","Not what the slide says."],
   ["Wolff; it avoids loading the bone","Wolff described bone remodeling, not surgery."]],
  "Slide: 1996 Schroeder, non-submerged, transmucosal healing, shorter healing period of 3-4 months, no second surgery.");
mq("in-3weeks", "intro", "rec", "After the healing abutment is placed, what is the minimum wait before taking the final impression?",
  [["At least 3 weeks","For the soft tissue to heal around the healing abutment."],
   ["At least 3 days","Too short for the soft tissue to heal."],
   ["At least 3 months","Integration takes months; the soft tissue wait is weeks."],
   ["No wait: impress the same day","The soft tissue must heal first."]],
  "\"You need at least three weeks for the soft tissue to heal.\"");
mq("in-whichstage", "intro", "rec", "A patient with poorly controlled diabetes needs an implant. Which approach did Dr. Chavali favor?",
  [["Two-stage: close it so the implant heals isolated from the mouth","Don't take chances with healing."],
   ["One-stage with an immediate provisional","Higher risk with impaired healing."],
   ["Immediate loading in function","Systemic issues are a reason not to load early."],
   ["No healing period at all","Healing is essential."]],
  "One-stage suits young, healthy patients with good hygiene, primary stability and keratinized mucosa.");
mq("in-endosteal", "intro", "slides", "An endosseous implant is placed into the alveolar and/or basal bone and:",
  [["Transects only one cortical plate","It doesn't exit the other side of the bone."],
   ["Penetrates both cortical plates","That's transosteal."],
   ["Rests on the cortex under the periosteum","That's eposteal (subperiosteal)."],
   ["Sits only in the mucosa","That's an intramucosal insert."]],
  "Endosteal = in the bone; it is the most commonly used class.");
mq("in-blade-class", "intro", "rec", "Dr. Chavali's \"tricky question\": a blade form implant is classified as:",
  [["Endosteal (endosseous)","It's trapped in the bone, whatever its shape."],
   ["Transosteal","It doesn't pass through the bone."],
   ["Eposteal","It's set into a slot in the bone, not on top of it."],
   ["Subperiosteal (eposteal framework)","Subperiosteal is the same as eposteal."]],
  "Endosseous means inside the bone; it can be a screw, a blade or a ramus frame.");
mq("in-eposteal", "intro", "slides", "Which problems does the slide list for eposteal (subperiosteal) implants?",
  [["Difficult retrievability, extensive surgery and excessive bone loss","The slide's three problems."],
   ["Mandible only and anterior only, because of the nerve","Those are transosteal problems."],
   ["No primary stability and high fracture rate","Not the listed problems."],
   ["They need general anesthesia, an extraoral incision and a hospital stay","Those are transosteal problems."]],
  "Eposteal: the frame sits directly beneath the periosteum, overlying the bony cortex.");
mq("in-transosteal", "intro", "slides", "Why can a transosteal implant be used only in the anterior mandible?",
  [["The inferior alveolar nerve runs through the posterior mandible","The slide: only anterior region, because of the IAN."],
   ["The maxillary sinus is in the way","The maxilla isn't an option at all."],
   ["The anterior bone is always thickest","The patients who got them had very thin mandibles."],
   ["Posterior teeth don't need implants","Not the reason."]],
  "Transosteal: mandible only, anterior only, extraoral incisions, excessive bone loss, general anesthesia.");
mq("in-failsigns", "intro", "slides", "Which finding is a sign of a failing implant?",
  [["Radiolucency around the implant","On the slide's list with mobility, percussion pain, infection and bone loss."],
   ["Pink, firm peri-implant mucosa","That's a healthy finding."],
   ["Light shimstock contact on the implant crown","That's the goal for implant occlusion."],
   ["Less than 2 mm of bone loss since surgery","That's within success."]],
  "Signs of failure: mobility, percussion pain, infection, radiolucency around an implant, bone lost around an implant.");
mq("in-mobility", "intro", "rec", "A patient's implant is mobile. What does that mean?",
  [["It has failed","\"If they have mobility, that means they are doomed.\""],
   ["It needs a tighter abutment screw","An abutment can loosen, but an implant that moves has lost integration."],
   ["It's normal in the first year","Integrated implants don't move."],
   ["It's healthy: implants move like teeth","Implants are ankylosed; they don't move."]],
  "Mobility is one of the failure criteria on the health scale.");
mq("in-boneloss", "intro", "rec", "On the health scale Dr. Chavali showed, how much radiographic bone loss marks an implant as failed?",
  [["More than half the length of the implant","Any of pain on function, mobility, uncontrolled exudate, or this."],
   ["Any bone loss at all","Less than 2 mm still counts as success."],
   ["More than 1 mm","That's still within success."],
   ["2-4 mm","That's satisfactory survival."]],
  "Success: <2 mm; satisfactory: 2-4 mm; compromised: >4 mm but less than half the implant; failure: more than half.");
mq("in-xray-first", "intro", "rec", "Before you start making a crown on an implant someone else placed, what does Dr. Chavali insist on?",
  [["Take a radiograph to rule out bone loss","Don't take on the liability of restoring a failing implant."],
   ["Remove the implant and replace it with a known system","Not his advice."],
   ["Torque the cover screw to 35 Ncm","Not his advice."],
   ["Prescribe antibiotics before the impression","Not routinely."]],
  "\"You have to take an x-ray before you start... you want to make sure you put the crown on a healthy implant.\"");
mq("in-abx", "intro", "rec", "An implant has exudate. Why aren't antibiotics alone enough?",
  [["They don't remove the bone loss or the pocket, so it comes back","The etiology remains."],
   ["Antibiotics never reach peri-implant tissues","They do help; they just don't fix the defect."],
   ["Implants can't be infected","They can: peri-implantitis."],
   ["Antibiotics loosen the abutment screw","Not a thing."]],
  "Treatment may also mean opening, cleaning and grafting, or repositioning the tissue and polishing the exposed threads.");
mq("in-mucosa", "intro", "rec", "What is the tissue around an implant called, and its inflammation?",
  [["Peri-implant mucosa; peri-implant mucositis","\"We can't call them gingiva because gingiva is around teeth.\""],
   ["Attached gingiva; gingivitis","Gingiva surrounds teeth."],
   ["Periodontium; periodontitis","Implants have no periodontium."],
   ["Alveolar mucosa; alveolar osteitis (dry socket)","Not the terms he used."]],
  "Peri-implant mucosa, and peri-implant mucositis when inflamed.");
mq("in-causes", "intro", "slides", "Which is listed on the slide as a cause of failed osseointegration?",
  [["Overheating the bone during surgery","Necrosis of the surrounding bone, which never heals."],
   ["Using a torque wrench on the abutment screw","That's correct technique."],
   ["Waiting 4 months in the mandible","That's the traditional healing time."],
   ["A grade 4 titanium implant","Grade 4 CP Ti is standard."]],
  "Causes: multifactorial; medical history; overheating bone; implant movement during healing; maxilla vs mandible; peri-implantitis; functional overloading.");
mq("in-oxide", "intro", "slides", "What makes titanium biocompatible, according to the slide?",
  [["It spontaneously forms a tenacious, passivated oxide layer that reacts with osteoblasts","The oxide forms calcium-phosphate apatite with osteoblasts."],
   ["It is completely inert and forms nothing on its surface","It's very reactive and forms an oxide at once."],
   ["It is coated with gold by every manufacturer","No."],
   ["It is the densest metal available","It's light; high strength for its weight."]],
  "Titanium's highly reactive surface energy interacts with oxygen, forming a passivated titanium oxide layer.");
mq("in-cpti", "intro", "rec", "Why is it called \"commercially pure\" titanium?",
  [["Titanium can never be made fully pure; it always carries traces of other elements","Oxygen, nitrogen or iron remain."],
   ["It is pure enough to sell but not for dental use","CP Ti is used for implants."],
   ["It is pure titanium mixed with gold","No gold."],
   ["It is made only by commercial labs","Not the meaning."]],
  "There are four grades of CP titanium; strength rises with grade, and Grade 4 is used for implants.");
mq("in-strongest", "intro", "rec", "A patient fractured an implant. Which material would Dr. Chavali choose next time?",
  [["Titanium alloy (Ti-6Al-4V)","The alloy is the strongest."],
   ["Grade 1 CP titanium","The lowest grade is the weakest."],
   ["Gold","Gold doesn't osseointegrate."],
   ["Single crystal sapphire (aluminum oxide)","Sapphire implants broke."]],
  "Generally speaking, titanium alloy is much stronger than commercially pure titanium.");
mq("in-bh", "intro", "rec", "Which school system's implants are made of Ti-6Al-4V?",
  [["BioHorizons","BioHorizons uses the alloy."],
   ["Straumann","Straumann uses grade 4 CP titanium."],
   ["Nobel Biocare","Nobel uses grade 4 CP titanium."],
   ["All three","Only BioHorizons, of the three."]],
  "BioHorizons: Ti-6Al-4V. Straumann and Nobel: grade 4 commercially pure.");
mq("in-sla", "intro", "rec", "Which surface belongs to Straumann?",
  [["SLA: sandblasted, large-grit, acid-etched","Blasted with grit, then acid-etched."],
   ["TiUnite","That's Nobel Biocare's."],
   ["RBT: resorbable blast texturing with calcium phosphate","That's BioHorizons'."],
   ["Titanium plasma spray","An additive method, not Straumann's named surface."]],
  "\"This will also be on my exam\": TiUnite (Nobel), SLA (Straumann), RBT (BioHorizons).");
mq("in-rbt", "intro", "rec", "RBT, resorbable blast texturing, is the surface treatment of:",
  [["BioHorizons","BioHorizons' own surface."],
   ["Nobel Biocare","Nobel's is TiUnite."],
   ["Straumann","Straumann's is SLA."],
   ["Zimmer","Not one of the school's systems."]],
  "Each company has its own surface to promote faster, more predictable osseointegration.");
mq("in-additive", "intro", "slides", "Which surface treatment is additive?",
  [["Hydroxyapatite coating","HA, titanium plasma spray and microsphere bonding add material."],
   ["Acid etching","Subtractive."],
   ["Particle blasting","Subtractive."],
   ["Sandblasting then acid etching","Both steps remove material: subtractive."]],
  "Additive: TPS, HA coating, microsphere bonding. Subtractive: acid etching, particle blasting. They can be combined.");
mq("in-machined", "intro", "slides", "How do smooth cylindrical implants compare with machined screw-type implants?",
  [["Smooth cylinders are biomechanically less superior","Screw shape gives better primary stability and integration."],

   ["Smooth cylinders have more bone-to-implant contact","Non-threaded cylinders had less BIC."]],
  "Early designs were smooth; current implants are screw-shaped with surface treatments to accelerate osseointegration and improve biomechanics.");
mq("in-bw", "intro", "slides", "The biologic width around a healthy implant averages about:",
  [["3.08 mm, about 1 mm more than a healthy tooth","Slide: 3.08 mm, including the sulcus."],
   ["1.08 mm, about 1 mm less than a healthy natural tooth","Implants have the larger biologic width."],
   ["2.04 mm, the same as a tooth","2.04-2.91 mm is the tooth's range."],
   ["5 mm, twice a tooth's","Too large."]],
  "Tooth: 2.04-2.91 mm. Implant: 3.08 mm including sulcus.");
mq("in-fibers", "intro", "slides", "How are the connective tissue fibers arranged around an implant?",
  [["Circular and parallel to the surface, with none inserting into it","Only 2 groups, no insertion."],
   ["Perpendicular, inserting as Sharpey's fibers","That's the tooth."],
   ["Oblique, from bone into the abutment","No fibers insert into an implant or abutment."],
   ["There is no connective tissue around an implant","There is; it just doesn't insert."]],

mq("in-je", "intro", "slides", "Where do hemidesmosomes attach the junctional epithelium on an implant?",

   ["Along the entire length","That's the tooth."],
   ["Nowhere: the epithelium doesn't attach","It attaches to titanium, but only apically."],

mq("in-je-origin", "intro", "slides", "The junctional epithelium around a tooth comes from the reduced enamel epithelium. Around an implant, it comes from:",

mq("in-collagen", "intro", "slides", "Compared with the gingival connective tissue around a tooth, the connective tissue around an implant has:",
  [["More collagen and fewer fibroblasts","Like scar tissue: more collagen, fewer cells."],
   ["More fibroblasts and much less collagen","That's around a tooth."],
   ["Twelve fiber groups","Twelve groups are around a tooth; two around an implant."],
   ["Sharpey's fibers into the implant","No fibers insert."]],
  "Tooth: more fibroblasts, less collagen. Implant: more collagen, fewer fibroblasts.");
mq("in-proprio", "intro", "slides", "Why do implant crowns get lighter occlusal contact than natural teeth?",

   ["Implant crowns are always shorter than natural crowns","Not the reason."],
   ["Patients can't chew on implants","They can."]],
  "No proprioception: light occlusal contact on implant crown or FPD; use Accufilm or shimstock.");
mq("in-standard", "intro", "slides", "What does the slide call standard of care for an edentulous mandible?",

mq("in-bite", "intro", "slides", "Compared with a conventional removable prosthesis, an implant-retained removable prosthesis:",

  "Benefits of implants: preserve bone volume, preserve adjacent tooth structure, increase biting force and retention.");
mq("in-growing", "intro", "slides", "Which of these does the slide list under \"implant is not a tooth\"?",

two("in-2s-1", "intro", "slides", "Two-stage surgery uses a cover screw at the first surgery.", "One-stage surgery needs a second surgery to place the healing abutment.", true, false,

   Each lecture opens with a short "what's tested" list. Narration (audio/<id>-full.mp3, -plain.mp3) is generated from

var READINGS = {"evolution": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The seven basic types of dental implants, and how to recognize each one on a radiograph or photo</li><li>Why early materials (gold, lead, porcelain, stainless steel) failed, and why titanium works</li><li>How osseointegration was discovered, and the old five-year success standard</li><li>The problems of subperiosteal, blade, ramus frame and transosteal implants</li></ul></div>\n<p>Dr. Leonard Mueninghoff is a retired professor and prosthodontist who ran UAB's graduate prosthodontics program and has been at the school about 38 years. He treated patients with every kind of implant in this lecture, many of them placed decades ago. He said up front what matters for the exam: <b>the seven types of implants, and being able to recognize them</b>. \"Out of this entire lecture, that's something that you really need to know.\" The stories around them are for context: he doesn't want you memorizing \"a lot of worthless things,\" only to be familiar enough to say \"I've heard of that\" when one walks into your chair.</p>\n<h4>Early materials: why they failed</h4>\n<p>People tried to replace roots long before titanium. In <b>1809</b> someone used <b>gold roots</b>; in <b>1888</b>, <b>lead</b>; in the 1800s, <b>platinum</b>; in <b>1891</b>, <b>porcelain</b>; around 1900, iridium and gold again. Gold and platinum failed for the same reason: they form <b>very little surface oxide</b>. Today's titanium implants are covered by a layer of <b>titanium oxide</b>, which is a ceramic, and the bone actually integrates with that <b>oxide</b>, not with the metal itself. Porcelain may have integrated, but the porcelain of the time wasn't strong enough and broke under load.</p>\n<h4>Titanium and the discovery of osseointegration</h4>\n<p>Osseointegration was discovered by a physician, not a dentist. <b>Per-Ingvar Brånemark</b>, a Swedish orthopedic surgeon, put small titanium chambers into animals to study bone and blood flow; when he tried to remove them, they wouldn't come off, because the bone had grown onto the titanium. Brånemark's name and the <b>root form</b> implant became synonymous. In the United States, <b>Carl Misch</b> popularized implants and wrote the textbook this course leans on. Dr. Mueninghoff added a caution from a radiologist relative: titanium is not completely inert immunologically, though no clinical problem has shown up in decades of use.</p>\n<h4>The seven basic types</h4>\n<p>When Dr. Mueninghoff arrived at UAB he saw all seven in patients. They are getting rarer as those patients age, but you may still meet them. Most are named for <b>where they sit</b> relative to the bone:</p>\n<ul><li><b>Subperiosteal</b>: a metal framework that lies <b>on the bone, under the periosteum</b>.</li><li><b>Endodontic stabilizer</b>: a rod run <b>through the root canal</b> of a tooth and out the apex into the bone.</li><li><b>Transosseous (transosteal)</b>: goes <b>through the bone</b>, in practice the anterior mandible.</li><li><b>Intramucosal insert</b>: little buttons on a denture that snap into holes in the <b>mucosa</b>.</li><li><b>Blade and plate form</b>: a flat metal blade set into a slot in the bone.</li><li><b>Mandibular ramus frame</b>: one piece running from the symphysis back into both rami.</li><li><b>Root form</b>: the screw-shaped titanium implant used today.</li></ul>\n<div class=\"rv-table-wrap\" data-title=\"The seven basic types of implants\"><table class=\"rv-table\"><thead><tr><th>Type</th><th>Where it sits</th><th>How to recognize it</th><th>Why it fell out of use</th></tr></thead><tbody>\n<tr><td>Subperiosteal</td><td>On the bone, under the periosteum</td><td>A metal lattice draped over the ridge with posts through the mucosa</td><td>Two surgeries, and when it failed it destroyed a lot of bone</td></tr>\n<tr><td>Endodontic stabilizer</td><td>Through a tooth's root canal into bone</td><td>A long pin running out past the apex of a treated tooth</td><td>Stainless steel, not titanium, and a poor seal where it left the root</td></tr>\n<tr><td>Transosseous (transosteal)</td><td>Through the full thickness of the anterior mandible</td><td>A plate under the chin with posts coming up into the mouth, joined by a bar</td><td>Extraoral surgery under general anesthesia, mandible only</td></tr>\n<tr><td>Intramucosal insert</td><td>In holes in the mucosa</td><td>Button-shaped inserts on the tissue side of a denture</td><td>The denture couldn't stay out more than a few hours or the holes closed</td></tr>\n<tr><td>Blade / plate form</td><td>In a slot in the bone</td><td>A thin flat blade, often with holes, usually joined to a natural tooth</td><td>Fibrous tissue between metal and bone, high failure</td></tr>\n<tr><td>Mandibular ramus frame</td><td>Symphysis and both rami</td><td>A one-piece frame along the whole mandible with a bar over the ridge</td><td>Big implants fail big: infection, bone loss</td></tr>\n<tr><td>Root form</td><td>In the bone (endosteal)</td><td>A screw-shaped titanium cylinder</td><td>Still the standard today</td></tr>\n</tbody></table></div>\n<h4>Endodontic stabilizers and pins</h4>\n<p>An endodontic stabilizer is a rod run all the way through the root canal and out the root end into the bone, to steady a weak tooth. The ones Dr. Mueninghoff saw were mobile and had to be removed with grafting. They failed for two reasons: they were <b>surgical stainless steel, not titanium</b> (one looked like nickel-chrome-beryllium), and the <b>seal where the rod left the tooth</b> was poor, so the root canal failed. Some dentists drove several pins into the bone at different angles and joined them with acrylic as an abutment; those patients came in with chronic infections. When titanium implants first arrived, patients who had heard about these devices didn't want \"an implant\" at all.</p>\n<h4>Intramucosal inserts</h4>\n<p>Intramucosal inserts were small buttons on the tissue side of a denture, usually a palateless upper denture, so it caused less gagging. The dentist marked soft spots in the palatal mucosa, drilled small holes into the mucosa with a large round acrylic bur, and told the patient not to take the denture out for two weeks. The tissue healed around the buttons and held the denture. The catch: the patient <b>could not leave the denture out more than a few hours</b>, or the holes began to close.</p>\n<h4>The mandibular ramus frame</h4>\n<p>The ramus frame is a <b>one-piece implant</b> designed to retain a <b>mandibular complete denture</b>. It runs from the <b>symphysis</b> back into <b>both rami</b>, with a bar over the ridge. It was designed by <b>Drs. Harold and Ralph Roberts</b> (about 1970), California brothers who were tinkerers and made the first ones in their garage. In Birmingham, <b>Dr. H. Ford Turner</b>, an anatomist who became a dentist, placed them so carefully (he didn't burn the bone and he cleaned the metal) that his patients kept them 10 to 25 years, when most lasted only a few. A plunger called a <b>Lew attachment</b> snapped through or under the bar to hold the denture. Patients needed them because a flat mandible under a loose lower denture kept resorbing, sometimes until it fractured. Problems: infection in the ramus area, and when big implants fail, they fail big.</p>\n<h4>Subperiosteal implants</h4>\n<p>Exactly what the name says: the framework sits <b>under the periosteum, on top of the bone</b>. The surgeon laid back the tissue and periosteum, took an <b>impression of the bone</b>, sutured, had a lattice made, then reopened days later to set it and sutured again: <b>two surgeries</b>, which Dr. Mueninghoff called brutal. They were loaded right away and often hooked to natural teeth. Some lasted close to 10 years, but when they failed they caused <b>gross bone destruction</b> (\"when they went south, they really went south\"). Later designs added a hydroxyapatite coating, and a custom <b>titanium</b> subperiosteal from Cleveland left healthy tissue, another sign that the body likes titanium.</p>\n<h4>Blade implants</h4>\n<p>The Roberts brothers also originated the <b>blade</b> (late 1960s): a solid flat blade set in a slot cut in the bone. <b>Linkow</b> put holes in it (the Blade-Vent), and <b>Cranin</b> cut the bottom like an anchor (the Anchor blade). The early ones were <b>not titanium</b>, usually had a <b>soft tissue layer between metal and bone</b> instead of osseointegration, and were usually <b>hooked to a natural tooth</b>, which is what really held them. Success depended heavily on the surgeon's skill: a sharp bur, water cooling and going slowly. Some were successful.</p>\n<h4>Success before Brånemark</h4>\n<p>\"Figures don't lie, but liars figure.\" Before Brånemark, an implant counted as a success if it was in <b>functional service for five years in 75% of patients</b>. One patient arrived with blades from the \"Turner Clinic\" in Cleveland (not Ford Turner) that were held in only by years of antibiotics, kept going to pass the five-year mark.</p>\n<h4>Transosteal implants</h4>\n<p>A transosteal (transosseous) implant goes <b>through the bone</b>. The idea started in <b>Germany in the 1930s</b>. The best known is the <b>transmandibular implant (TMI)</b> of <b>Bosker</b>: a plate under the chin with posts through the anterior mandible into the mouth, made of a soft, high-gold alloy, joined by a bar. UAB placed many before root forms were approved, mostly for patients whose mandible was so thin (about 5 mm or less) it was at risk of fracture; Medicare paid for a bone plate, and Dr. Peter Waite realized the plate could extend into the mouth. It was done in the operating room through the chin, and the bar was delivered within 24 hours. The bar was retained with <b>Hader clips</b> (nylon: white, then yellow, then red as the bar wears) or a metal-to-metal <b>Dolder bar</b> (no longer used). A striking result: the <b>bone behind the plate grew thicker</b>, a lesson that force keeps bone healthy.</p>\n<h4>Other materials and designs</h4>\n<ul><li><b>Stainless steel, nickel-chrome and vitreous carbon</b> were all tried; vitreous carbon broke up.</li><li><b>Hollow basket implants</b> hoped bone would grow through their holes; bone only grows about half a millimeter in.</li><li><b>Core-Vent</b> cemented its abutments into the implant, so a broken one couldn't be unscrewed and had to be ground out. Normally an abutment screw torqued to about 35 Ncm can be backed out, even with a periodontal probe if it has loosened.</li><li><b>Single crystal sapphire</b> (Japan) integrated well, since it is all ceramic oxide, but wasn't strong enough and broke.</li><li>The <b>IMZ</b> (intramobile cylinder) had a plastic insert meant to act like a periodontal ligament when the implant was joined to a tooth; it moved so much that it damaged the tooth, and it had only micro-retention from its surface, no macro-retention.</li><li><b>Frialit</b> (Dentsply) was wider at the top and narrower at the bottom, to load the crestal bone and avoid <b>stress shielding</b> (long 16 mm implants lost crestal bone down to about 12 mm).</li></ul>\n<h4>What we learned</h4>\n<p>Osseointegration turned out far stronger than anyone expected. Early on, a 12 mm implant seemed short and 14 mm was better; today 10, 8 and even 6 mm implants are used. There are about <b>173 implant companies</b> worldwide, so pick two or three systems and stick with them. To identify an unknown implant from a radiograph, use a site such as <b>whatimplantisthat.com</b>, which asks questions and narrows it down. And \"think periodontics\": an implant needs enough bone, in quantity and quality, and attached tissue around it, just like a tooth.</p>\n", "intro": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What a dental implant is, and what osseointegration means</li><li>Primary and secondary osseointegration (stability), and healing times in the mandible and maxilla</li><li>One-stage vs two-stage surgery (Schroeder vs Brånemark), with the cover screw and healing abutment</li><li>Endosteal, eposteal (subperiosteal) and transosteal implants, and which family the blade and ramus frame belong to</li><li>How to tell a healthy implant from a failing one, and the causes of failure</li><li>Titanium: the oxide layer, commercially pure grades vs Ti-6Al-4V, and each school system's material and surface</li><li>Machined (screw) vs smooth (cylinder) implants, and additive vs subtractive surface treatments</li><li>Periodontal attachment vs peri-implant attachment, biologic width, and why an implant is not a tooth</li></ul></div>\n<p>Dr. Ramakiran Chavali (Restorative Sciences) opens the course. Its goals: learn the basics of restoring a single implant and of implant surgery, the history and science of implants, imaging, the ADA codes, treatment planning for simple cases, and the three systems the school's clinic uses: <b>Nobel Biocare (Conical Connection)</b>, <b>Straumann (Bone Level)</b> and <b>BioHorizons (Tapered Internal)</b>. BioHorizons is an Alabama company that started at UAB. In the PCD lab you restore an implant at <b>#9</b>: alginate impression, wax-up, radiographic and surgical guides, an impression of the implant and a provisional. His recording is from an earlier year; the second half of the lecture, the implant-tissue interface, comes from his slides.</p>\n<h4>What is a dental implant?</h4>\n<p>The slide's definition: \"A prosthetic device made of <b>alloplastic material(s)</b> implanted into the oral tissues beneath the mucosal or/and periosteal layer, and on/or within the bone to provide <b>retention and support</b> for a fixed or removable dental prosthesis.\" For a single tooth, the bone is prepared, the implant placed and allowed to heal; then an <b>abutment</b> goes on the implant and a <b>crown</b> on the abutment.</p>\n<h4>What implants are used for</h4>\n<ul><li><b>Single crowns and fixed bridges</b>: for example implants at #3, #4 and #5, placed in two stages, then healing abutments, custom abutments and crowns.</li><li><b>Removable partial dentures</b>: an RPD gets its retention, stability and support from teeth and ridge and can flop around where back teeth are missing; implants with attachments under it give significantly higher retention, stability, support and esthetics.</li><li><b>Complete dentures</b>: \"A <b>two-implant-retained overdenture</b> is considered <b>standard of care</b> in rehabilitation of an <b>edentulous mandible</b>.\" UAB calls it <b>2-2-2</b>: two dentures, two implants, two attachments. The gold-colored <b>Locator</b> abutments click into nylon inserts in metal housings in the denture; they retain it but aren't a rigid fixation. A well-made maxillary denture holds by suction; the mandibular one is unstable because of the tongue and muscle attachments, which is why the implants go in the mandible.</li><li><b>Fixed dentures</b>: several implants joined by a bar, with the denture fixed to it; only the dentist can remove it.</li></ul>\n<h4>Osseointegration</h4>\n<p>In <b>1952</b>, <b>Brånemark</b>, an orthopedic surgeon, found that titanium chambers he had put in <b>rabbit</b> bone were difficult to remove; in the <b>1960s</b> he coined the term <b>osseointegration</b> for the stable, functional bond between titanium screws and living bone. The slide's definition: \"the apparent <b>direct attachment</b> or connection of osseous tissue to an inert, alloplastic material <b>without intervening connective tissue</b>.\"</p>\n<p>The surgeon drills a channel (an <b>osteotomy</b>) with sequential drill bits. The implant is slightly wider than the last drill, and bone is a little elastic, so the implant locks in mechanically, like a screw in a wall: that is <b>primary stability</b>. Then the body remodels: cells remove some of the bone that was there at surgery and lay down new bone in the pattern of the implant. That is <b>secondary stability</b>, and it is osseointegration proper.</p>\n<ul><li><b>Primary osseointegration</b>: the initial bone healing between the implant and the osteotomy.</li><li><b>Secondary osseointegration</b>: the bone remodeling phase, the critical factor for long-term success (from about <b>4-6 weeks</b> after initial healing, and it continues after the implant is loaded).</li><li>Osseointegration is <b>dynamic and progressive</b>, and success can't be judged <b>until the implant is loaded</b>.</li></ul>\n<p>A video in the lecture walked through the biology (blood clot, platelets, neutrophils, macrophages, angiogenesis). He won't ask about the cells; the point to take from it is that from about <b>day 7</b>, osteoclasts resorb the bone edges and <b>primary stability drops</b>, while woven bone forms on the implant and secondary stability rises. Under the electron microscope a thin protein layer lies between bone and titanium. Woven bone later remodels into lamellar bone, oriented perpendicular to the thread peaks.</p>\n<h4>How long to wait</h4>\n<p>The mandible is generally dense and the maxilla less so (like solid oak vs styrofoam, though everyone differs). The traditional wait, and what you'll do in the second-floor clinic unless the surgeon says otherwise: <b>about 4 months in the mandible and 6 months in the maxilla</b>. Surgeons often quote other times (3 months, for example), depending on the system and protocol.</p>\n<h4>Wolff's law and loading</h4>\n<p><b>Wolff's law</b>: the internal architecture of bone is determined by the external forces on it. Within an <b>adaptive window</b> of load, bone gets stronger (people who lift weights have stronger bones). Too little load and it atrophies: after an extraction the <b>alveolar bone</b>, the bone that holds the tooth, keeps resorbing toward the <b>basal bone</b>. Too much load, as in parafunction or bruxism, also loses bone. Implants are very sensitive to force, so once a crown or denture goes on, the occlusion is adjusted so the implant isn't overworked.</p>\n<p>Implants can sometimes be loaded or provisionalized right away, mainly for esthetics in a few cases. He described the conditions: high insertion torque (he said at least about 50 Ncm in that recording; the terminology lecture gives the consensus number), a patient without systemic problems such as diabetes, and a low-force site such as an incisor, with splinting to spread the force. Even then the occlusion on the provisional is kept light. He said he won't ask which cases qualify for immediate loading.</p>\n<h4>One-stage vs two-stage surgery</h4>\n<p>\"I'll ask you a question about single-stage surgery and two-stage surgery.\"</p>\n<ul><li><b>Two-stage</b> (<b>Brånemark, 1985</b>): the implant is placed, a <b>cover screw</b> goes on and the flap is closed, so the implant is <b>submerged</b>, isolated from the mouth, for <b>3-6 months</b>. A second surgery uncovers it and places a <b>healing abutment</b>, and the soft tissue is closed around it.</li><li><b>One-stage</b> (<b>Schroeder, 1996</b>): a non-submerged technique with <b>transmucosal healing</b>; a healing abutment goes on at placement, so the implant sticks out into the mouth from day one, with a shorter healing period of <b>3-4 months</b> and <b>no second surgery</b>.</li><li>Either way, the soft tissue needs <b>at least 3 weeks</b> to heal around the healing abutment before the final impression.</li><li>Choose two-stage when healing is a concern (a diabetic patient, for example: close it and let the implant heal in a sterile environment); one-stage suits a young, healthy patient with good hygiene, good primary stability and good keratinized mucosa.</li></ul>\n<h4>Types of implants</h4>\n<p>The classification is by where the implant sits relative to the bone:</p>\n<ul><li><b>Endosteal (endosseous)</b>: <b>in</b> the bone. The most commonly used; placed into the alveolar and/or basal bone of the mandible or maxilla, and it <b>transects only one cortical plate</b>. It doesn't come out the other side. Endosteal implants include the <b>root form</b> (most common; mimics the shape of roots for load distribution), the <b>blade form</b> and the <b>ramus frame</b>. Blade and ramus frame implants had excessive bone loss and increased failure rates and aren't used anymore. His \"tricky question\": a blade is <b>endosseous</b>, not transosteal or subperiosteal.</li><li><b>Eposteal (subperiosteal)</b>: <b>on</b> the bone. The frame sits directly beneath the periosteum over the bony cortex. Problems: difficult retrievability, extensive surgery, excessive bone loss; when they failed, they failed fast.</li><li><b>Transosteal (transmandibular implant, TMI)</b>: <b>through</b> the bone. It penetrates <b>both cortical plates</b> and the full thickness of the alveolar bone. Problems: mandible only, anterior region only (because of the inferior alveolar nerve), extraoral incisions, excessive bone loss and general anesthesia.</li></ul>\n<div class=\"rv-table-wrap\" data-title=\"Endosteal, eposteal and transosteal\"><table class=\"rv-table\"><thead><tr><th>Class</th><th>Relation to bone</th><th>Examples</th><th>Problems</th></tr></thead><tbody>\n<tr><td>Endosteal (endosseous)</td><td>In the bone; transects one cortical plate</td><td>Root form (most common), blade, ramus frame</td><td>Blade and ramus frame: bone loss, high failure</td></tr>\n<tr><td>Eposteal (subperiosteal)</td><td>On the bone, under the periosteum</td><td>Subperiosteal framework</td><td>Hard to retrieve, extensive surgery, bone loss</td></tr>\n<tr><td>Transosteal (TMI)</td><td>Through both cortical plates</td><td>Transmandibular implant</td><td>Mandible and anterior only, extraoral incision, general anesthesia, bone loss</td></tr>\n</tbody></table></div>\n<h4>Healthy or failing?</h4>\n<p>\"How do you diagnose a failing implant? And this will be definitely on your quiz or exam.\" The signs of failure on the slide: <b>mobility, percussion pain, infection, radiolucency around the implant, and bone lost around it</b>. Pain on function, especially deep bone pain or pain when tightening or loosening a component, is a bad sign; soreness of the mucosa alone is less worrying. Mobility means the implant is doomed. He walked through a health scale from success to failure:</p>\n<div class=\"rv-table-wrap\" data-title=\"Implant health scale\"><table class=\"rv-table\"><thead><tr><th>Group</th><th>Clinical picture</th></tr></thead><tbody>\n<tr><td>Success (optimum health)</td><td>No pain or tenderness in function, no mobility, less than 2 mm of radiographic bone loss since surgery, no history of exudate</td></tr>\n<tr><td>Satisfactory survival</td><td>No pain, no mobility, 2-4 mm of bone loss, no history of exudate</td></tr>\n<tr><td>Compromised survival</td><td>May be sensitive, no mobility, more than 4 mm of bone loss but less than half the implant body, deeper pockets, may have exudate</td></tr>\n<tr><td>Failure</td><td>Any of: pain on function, mobility, bone loss more than half the length of the implant, uncontrolled exudate, or no longer in the mouth</td></tr>\n</tbody></table></div>\n<p>Antibiotics help an implant with exudate, but they don't remove the bone loss or the pocket, so the problem comes back; the implant may need to be opened, cleaned and grafted, or the tissue repositioned and the exposed threads polished. The tissue around an implant is <b>peri-implant mucosa</b>, not gingiva, and its inflammation is <b>peri-implant mucositis</b>. Most important for you as the restorative dentist: <b>take a radiograph before you start the crown</b>, and don't take on the liability of restoring an implant that is already losing bone.</p>\n<p>Causes of failure are multifactorial: the patient's medical history (tobacco, uncontrolled diabetes, genetics), <b>overheating the bone during surgery</b> (necrosis that never heals), <b>implant movement during healing</b>, maxilla vs mandible, <b>peri-implantitis</b>, <b>functional overloading</b>, and the patient's maintenance. Implants last a lifetime only if they are looked after.</p>\n<h4>Titanium</h4>\n<p>The ideal implant material is <b>biocompatible, corrosion resistant, strong enough, increases osseointegration, easy to place, non-toxic and cost effective</b>. Titanium is never found pure in nature; it is the ninth most abundant element in the earth's crust and very reactive. Its surface energy reacts with oxygen and spontaneously forms a <b>tenacious, passivated titanium oxide layer</b>, which reacts with osteoblasts to form <b>calcium-phosphate apatite</b>. That oxide is why titanium doesn't rust or corrode and is so biocompatible. It is a light, high-strength metal (golf clubs, racing bikes), which suits muscles that can bite harder than a thigh muscle pushes.</p>\n<ul><li><b>Commercially pure titanium (CP Ti)</b>: \"commercially\" because it can never be made fully pure; it always carries a little oxygen, nitrogen or iron. There are four grades (the slide ties them to the oxide), and strength rises with the grade. Modern implants use <b>Grade IV</b>.</li><li><b>Titanium alloy, Ti-6Al-4V</b> (6% aluminum, 4% vanadium): the strongest.</li><li>The school's systems: <b>BioHorizons is Ti-6Al-4V</b>; <b>Straumann and Nobel Biocare are Grade 4 CP titanium</b>. Implants can fracture; if a patient breaks one, use a stronger implant (the alloy) next time.</li></ul>\n<h4>Implant shape and surface</h4>\n<p>Early endosteal implants were <b>smooth-surfaced cylinders</b> tapped into place with a mallet; they are <b>biomechanically less superior</b> than <b>machined, screw-type</b> implants, which are threaded into a drilled osteotomy and give better primary stability, osseointegration and survival. Today's implants are screw-shaped (macro-topography) and carry a <b>surface treatment</b> (micro-topography) that creates surface microporosities, so osteoblasts settle into the valleys and integration is faster and more predictable. A textured surface is osteoconductive and integrates faster than a machined one; in the slide's graph, bone-to-implant contact was higher for treated surfaces than for machined ones in both jaws.</p>\n<ul><li><b>Additive</b> treatments: <b>titanium plasma spray (TPS), hydroxyapatite (HA) coating, microsphere bonding</b>.</li><li><b>Subtractive</b> treatments: <b>acid etching, particle blasting</b>.</li><li>The methods can be combined.</li></ul>\n<p>Each school system has its own surface (\"this will also be on my exam\"): <b>Nobel Biocare TiUnite</b>; <b>Straumann SLA</b>, sandblasted, large-grit, acid-etched (blasted with aluminum oxide grit, then acid-washed); <b>BioHorizons RBT</b>, resorbable blast texturing.</p>\n<div class=\"rv-table-wrap\" data-title=\"The school's three systems\"><table class=\"rv-table\"><thead><tr><th>System</th><th>Line used at UAB</th><th>Material</th><th>Surface</th></tr></thead><tbody>\n<tr><td>Nobel Biocare</td><td>Conical Connection</td><td>Grade 4 CP titanium</td><td>TiUnite</td></tr>\n<tr><td>Straumann</td><td>Bone Level</td><td>Grade 4 CP titanium</td><td>SLA (sandblasted, large-grit, acid-etched)</td></tr>\n<tr><td>BioHorizons</td><td>Tapered Internal</td><td>Ti-6Al-4V alloy</td><td>RBT (resorbable blast texturing)</td></tr>\n</tbody></table></div>\n<h4>Why implants: the benefits</h4>\n<p>The interface half of the lecture starts with what implants do: they <b>preserve bone volume</b> (without an implant the anterior mandible keeps resorbing after extraction), <b>preserve adjacent tooth structure</b> (no need to prep neighbors for a bridge), and <b>increase biting force and retention</b>: \"implant-retained removable prostheses generate more biting force compared to conventional prostheses,\" and mastication improves.</p>\n<h4>An implant is not a tooth</h4>\n<ul><li>A tooth moves; an implant won't. An implant is like an <b>ankylosed tooth with no periodontium</b>.</li><li><b>Avoid splinting an implant to a tooth.</b></li><li><b>Don't place an implant in a patient who is still growing.</b></li><li><b>Avoid a cantilever on a single implant.</b></li><li>No connective tissue fibers attach to an implant's surface: only <b>parallel and circular fibers</b>.</li><li>The <b>biologic width</b> of a healthy implant averages <b>3.08 mm</b>, about <b>1 mm greater</b> than a healthy tooth's.</li></ul>\n<h4>Periodontal vs peri-implant attachment</h4>\n<div class=\"rv-table-wrap\" data-title=\"Periodontal vs peri-implant attachment\"><table class=\"rv-table\"><thead><tr><th></th><th>Periodontal (tooth)</th><th>Peri-implant</th></tr></thead><tbody>\n<tr><td>Junctional epithelium attaches to</td><td>Enamel</td><td>Titanium</td></tr>\n<tr><td>Hemidesmosomes</td><td>Along the entire length (basal lamina)</td><td>Only the apical third</td></tr>\n<tr><td>Junctional epithelium comes from</td><td>Reduced enamel epithelium</td><td>The adjacent oral epithelium</td></tr>\n<tr><td>Connective tissue fibers</td><td>12 groups, perpendicular to the tooth; Sharpey's fibers insert into cementum and bone</td><td>2 groups, circular and parallel; no fibers insert into the implant</td></tr>\n<tr><td>Cells vs collagen</td><td>More fibroblasts, less collagen</td><td>More collagen, fewer fibroblasts</td></tr>\n<tr><td>Bone connection</td><td>Through the PDL</td><td>Osseointegration: a direct structural and functional connection</td></tr>\n<tr><td>Adaptive capacity</td><td>Physiological mobility from the viscoelastic ligament</td><td>Rigid; no orthodontic movement possible</td></tr>\n<tr><td>Biologic width</td><td>2.04-2.91 mm</td><td>3.08 mm, including the sulcus</td></tr>\n</tbody></table></div>\n<p>Because the implant has no periodontal ligament, it has <b>no proprioception</b>: the patient can't feel how hard they bite on it. So the implant crown or bridge gets <b>light occlusal contact</b>, adjusted with thin articulating paper (Accufilm) or <b>shimstock</b>. The biomechanics lecture takes this further.</p>\n", "biomech": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Wolff's law, stress and strain, and the adaptive window</li><li>Maxilla vs mandible: force distributing vs force absorbing, and Misch's D1-D4 bone</li><li>Compression, tension and shear: which bone tolerates best</li><li>Where implant treatment fails, and the patient and design factors behind it</li><li>Horizontal and vertical cantilevers, moment arms, and long spans</li><li>Bite force with different dentitions</li><li>Never connecting an implant to a tooth, and the goals of implant occlusion</li></ul></div>\n<p>Dr. Ramakiran Chavali's second lecture is built on Dr. Carl Misch's <i>Contemporary Implant Dentistry</i>. <b>Mechanics</b> is the branch of physics that deals with the action of force on bodies; applied to a biological system it is <b>biomechanics</b>. Just as a patient's smoking or uncontrolled diabetes changes implant outcomes, so do force factors, and you need them in mind every time you plan an implant.</p>\n<h4>Wolff's law</h4>\n<p><b>Wolff's law</b>: the <b>internal architecture of bone remodels according to the external forces (loads) applied</b>. Trabeculae line up along the force trajectories, in the femur and in the jaws alike. When teeth are lost, chewing forces no longer reach the alveolar bone, and it resorbs year after year until only basal bone is left: a pencil-thin ridge under an old denture, or the mandibular canal lying on top of the ridge. The genial tubercles survive because the genioglossus and geniohyoid keep pulling on them. A maxillary molar with no opposing tooth shows sparse trabeculae next to one in function. Lose the tooth and you lose the bone, the keratinized tissue and the mucoperiosteum; an implant transmits force and preserves bone, so educate patients who say they don't want one.</p>\n<p>Bone stays healthy inside an <b>adaptive window</b>. From less to more load: an <b>acute disuse window</b> (bone loss, disuse atrophy), the <b>adapted window</b> (balanced remodeling, healthy bone), <b>mild overload</b> (cells start to readapt), <b>pathologic overload</b> (microfractures) and finally <b>spontaneous fracture</b>. A missing, unreplaced tooth puts the bone in disuse; a well-planned implant puts it back in the adaptive zone; a badly designed prosthesis that magnifies force pushes it into overload, and the bone, implant or prosthesis fails.</p>\n<p><b>Stress = force / area</b> (\"I want you to remember the stress is force per unit area\"). <b>Strain</b> is deformation. Stress and strain are directly related.</p>\n<h4>Maxilla vs mandible</h4>\n<p>The maxilla has <b>thin cortical plates and fine trabeculae</b>; the mandible has <b>thick cortical plates and a coarse trabecular pattern</b>. The maxilla is a <b>force distributing unit</b>: it is full of cavities (sinuses, orbits, nasal cavity) and connects to the cranium, so a blow to the face crumples it before the force reaches the brain, like the crumple zone of a car. The mandible is a <b>force absorbing unit</b>: solid, thick bone made to take chewing loads. That is why implants <b>fail more in the maxilla</b> and succeed more in the mandible; warn a patient getting many maxillary implants, or one who has already lost one.</p>\n<h4>Misch bone classification</h4>\n<p>Misch divided jaw bone into four densities. Dr. Chavali asked you to write this down:</p>\n<div class=\"rv-table-wrap\" data-title=\"Misch bone density (D1-D4)\"><table class=\"rv-table\"><thead><tr><th>Type</th><th>Description</th><th>Usual location</th></tr></thead><tbody>\n<tr><td>D1</td><td>Thick dense cortical bone, hardly any trabecular bone</td><td>Anterior mandible</td></tr>\n<tr><td>D2</td><td>Thick cortical plates with coarse trabeculae</td><td>Posterior mandible (sometimes anterior mandible)</td></tr>\n<tr><td>D3</td><td>Thin cortical plates, finer trabeculae</td><td>Anterior maxilla</td></tr>\n<tr><td>D4</td><td>Fine trabecular bone, very little cortical bone, more marrow</td><td>Posterior maxilla</td></tr>\n</tbody></table></div>\n<p>It's a generalization, not true in every patient. Density, strength, compressive strength and elastic modulus (stiffness) all fall from D1 to D4. A medical CT can measure density in Hounsfield units (Dr. Givan covers why CBCT values are unreliable), and an experienced surgeon can feel the bone type while drilling.</p>\n<h4>Forces on bone</h4>\n<p>Chewing loads bone in <b>compression</b>, <b>tension</b> (pulling) and <b>shear</b> (sliding, bending). Bone is <b>strongest in compression, next in tension, and weakest in shear</b>, so <b>tensile and shear forces should be avoided</b> on bone. He gave the question away: \"Among the following forces, which is the most favorable to bone? ... compression. The least favorable would be shearing.\" Because the maxilla is proclined, maxillary implants often take more shear and tension than compression.</p>\n<h4>What fails, and why</h4>\n<p>An implant restoration has several interfaces: bone to implant, the implant's internal threads and the abutment screw, abutment to implant, and crown to abutment. Any of them can fail: the crown or porcelain can fracture, the screw can loosen (30 minutes to an hour to fix, hours if the head strips), the implant can fracture, or the bone can resorb and the osseointegration disappear. In Goodacre's review of complications:</p>\n<div class=\"rv-table-wrap\" data-title=\"Failures in implant treatment (Goodacre)\"><table class=\"rv-table\"><thead><tr><th>Complication</th><th>Rate</th></tr></thead><tbody>\n<tr><td>Implants in the softest bone</td><td>16%</td></tr>\n<tr><td>Short implants</td><td>17%</td></tr>\n<tr><td>Overdenture attachment fracture or complications</td><td>30%</td></tr>\n<tr><td>Resin veneer fracture</td><td>22%</td></tr>\n<tr><td>Removable prosthesis fracture</td><td>12%</td></tr>\n<tr><td>Abutment or prosthetic screw loosening</td><td>7-10%</td></tr>\n<tr><td>Porcelain fracture</td><td>7%</td></tr>\n<tr><td>Prosthesis metal fracture</td><td>3%</td></tr>\n<tr><td>Implant fracture</td><td>1-2%</td></tr>\n</tbody></table></div>\n<p>Implants under <b>10 mm</b> have tended to fail more. That isn't a contraindication (8 and 9 mm implants work well), but warn the patient when bone height near the nerve or sinus forces a short one. He then showed failures and their causes: a smooth cylindrical implant; an implant <b>connected to natural teeth</b>; bone loss under a <b>cantilevered</b> pontic; and a narrow implant under a huge molar crown, where the long moment arm resorbed the bone until the thin implant wall <b>fractured</b>. The fix there was a <b>wider implant</b>.</p>\n<h4>Sizing the implant to the tooth</h4>\n<p>The implant should complement the crown: you can't hang a big molar off a narrow implant. His general sizes: <b>central incisor 3.5 mm</b>, <b>lateral incisor 3 mm</b>, <b>mandibular incisors 3 mm</b>, <b>premolars 3.5 or 4 mm</b>, <b>molars 4.5, 5 or 6 mm</b> (4 mm or larger). The wax-up decides: mount casts, wax the ideal contours, make radiographic and surgical guides, and choose the size; a wide incisor may need 4 mm. The surgeon needs at least <b>1 mm of bone</b> around the implant, so a 5 mm molar implant needs a 7 mm ridge. If the bone isn't there, the answer is to graft it, not to cheat with a narrower implant.</p>\n<h4>Where the forces come from: the patient</h4>\n<ul><li><b>Age</b>: generally, older patients generate lower masticatory force.</li><li><b>Gender</b>: generally, men generate higher masticatory force than women.</li><li><b>Size and personality</b>: generally, larger patients generate higher force. All of these are generalizations; some grandmothers can chew rocks.</li><li><b>Parafunction</b>: bruxism and clenching generate higher force. Look for <b>excessive tooth wear, fractures, abfractions, bony exostoses and absence of ideal occlusion</b>. An <b>occlusal splint (night guard)</b> reduces the risk.</li><li><b>Tongue thrust</b>: after teeth have been missing a long time the tongue can enlarge and push laterally.</li></ul>\n<p>When the biomechanical risk is high, the plan changes: <b>increase the number of implants</b>, use a <b>reduced (smaller) occlusal table</b>, and <b>splint the implants together</b>. A smaller crown shortens the moment arm; splinting spreads the force over a larger area, so stress (force/area) falls. The literature shows no difference in failure between splinted and unsplinted implants, but splint for a bruxer. Systemic factors (diabetes, smoking) are relative, not absolute, contraindications; osteoporosis usually doesn't cause failure, though bone-to-implant contact may be lower.</p>\n<h4>Mandibular flexure</h4>\n<p>The mandible flexes inward every time it opens. <b>Implants on either side beyond the mental foramina should not be splinted together</b>: tying anterior and posterior implants across the arch into one rigid prosthesis can cause pain and even fracture.</p>\n<h4>Prosthesis design</h4>\n<ul><li><b>Always avoid cantilevering</b> an implant prosthesis.</li><li><b>Avoid long-span</b> implant-retained fixed partial dentures.</li><li><b>Always consider the opposing dentition.</b></li></ul>\n<h4>Cantilevers</h4>\n<p><b>Both horizontal and vertical cantilevers are bad</b> in implant dentistry and lead to complications and failures. Cantilevers are <b>force magnifiers</b>: <b>moment of force = force x distance</b>. The farther a load is from the implant (the fulcrum), the longer the moment arm and the bigger the force, like a diving board or pushing a door open near its knob rather than its hinge. His example: a <b>25 lb</b> bite on a cantilevered pontic became <b>75 lb</b> on the implant acting as the fulcrum and <b>50 lb</b> on the other implant. The fix is another implant under the pontic (three implants for five units) or two separate bridges. The one exception he allowed: a cantilever may be acceptable when the <b>opposing arch is a denture</b>.</p>\n<p>A <b>vertical cantilever</b> is a tall crown. As teeth, gums and bone are lost, the prosthesis must replace more than the crown, and gets longer, like a fence post that is easy to wiggle from the top. Misch's classification of fixed prostheses reflects this: <b>FP-1</b> replaces the crown only, <b>FP-2</b> the crown and part of the root, <b>FP-3</b> crown, root, bone and soft tissue. To reduce a vertical cantilever, either do <b>vertical ridge augmentation</b> to get the ideal height back, or <b>increase the number of implants</b> to distribute the force. A pneumatized sinus calls for sinus grafting and more implants, not a long cantilever.</p>\n<h4>Span length</h4>\n<p>\"As the length of the span increases by a unit, the <b>flexibility increases by the cube</b>\": one unit flexes 1, two units 8, three units 27. A three-unit bridge on two implants is fine; a four-unit bridge on two implants usually isn't, unless the opposing arch is a denture or the patient bites lightly. For a heavy biter, three implants under a three-unit bridge. The implant, crown, cement and abutment screw all feel that flexing.</p>\n<h4>Opposing dentition and bite force</h4>\n<p>As teeth are lost, the <b>proprioceptors in the periodontal ligament are lost</b> with them, so forces in implant patients may be uncontrolled; implants opposing implants are the extreme case. The order of biting force:</p>\n<p><b>Implant-supported FPD &gt; natural dentition &gt; implant-retained denture &gt; complete denture</b></p>\n<p>An opposing denture means the patient can't bite hard; opposing natural teeth mean more force and more implants.</p>\n<h4>Implant design</h4>\n<p>Smooth, cylindrical implants are biomechanically inferior to machined, screw-type implants, and the surface treatments (TiUnite, SLA, RBT) improve bone-to-implant contact further; threaded implants had significantly more contact than non-threaded ones. An <b>external connection</b> has a projection (a hex) sticking up from the implant; an <b>internal connection</b> has a receptacle inside with nothing sticking up. <b>Most systems now use internal connections</b>, and everything in the student clinic is internal; external designs are esthetically weaker. <b>Titanium alloy is much stronger than commercially pure titanium.</b></p>\n<h4>Never connect an implant and a tooth</h4>\n<p>\"This will be your exam question.\" Teeth are suspended in the periodontal ligament and can move apically about <b>25-100 microns</b>; an implant can move only <b>3-5 microns</b>, and that little comes from the viscoelasticity of bone. Join them and bite down: the tooth sinks into its ligament while the implant can't, so <b>the implant takes the force</b>, which leads to bone loss and failure. (In the fourth year you may hear of rare exceptions.)</p>\n<h4>Implant occlusion</h4>\n<p>\"Occlusion, occlusion, occlusion.\" The implant crown should carry <b>lighter contact than the adjacent teeth</b>. Check the marks, then use <b>shimstock</b>, a very thin metal foil: it should hold on the natural teeth and pull through on the implant.</p>\n<ul><li><b>Single implant opposing a natural tooth</b>: the natural tooth can move in function and accommodate the rigid implant crown. The implant crown is <b>out of contact in MI</b> when checked with shimstock; it may contact in forceful biting.</li><li><b>Two implant restorations opposing</b>: the crowns are out of contact in forceful biting; <b>shimstock drags but does not tear</b>.</li><li>Direct occlusion <b>along the long axis</b> of the implant, with <b>reduced cusp heights</b>, a <b>reduced occlusal table</b>, and <b>no interferences in excursive (eccentric) movements</b>. Two premolar-sized crowns can be better than one huge molar.</li></ul>\n", "terms": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Brands vs product lines, platforms and color coding (and the BioHorizons trap)</li><li>Platform switching; external vs internal; bone level vs tissue level; parallel-walled vs tapered</li><li>Primary and secondary stability and the stability dip</li><li>Torque, torque wrenches, and the screw torque for each school system</li><li>Conical connection and Morse taper</li><li>Cover screw vs healing abutment</li><li>Ideal implant position: the distances to the gingival margin, a tooth, another implant and the bone walls</li><li>Engaging vs non-engaging abutments; impression copings</li><li>Screw-retained vs cement-retained vs screwmentable; angled screw channels</li><li>Prefabricated vs custom abutments, and which to use for a single crown or a bridge</li><li>Interocclusal space; crown-to-implant ratio; emergence profile and the E, B and C zones</li><li>Teflon tape, verification jigs, the ITI placement and loading timeline, anodizing, and the ADA codes</li></ul></div>\n<p>This is the course director's own lecture (Dr. Chen), building on Dr. Chavali's introduction. It covers the terms you'll hear the moment you start restoring implants. The promise about the exam: \"If you can totally understand what I have on the slide, you should have no problem. I don't ask you to study on the textbook.\"</p>\n<h4>1. Brands and product lines</h4>\n<p>Straumann, Nobel Biocare, BioHorizons and Zimmer are <b>brands</b> (companies). Each has several <b>product lines</b>, with different connections and platform sizes, and you need to know which one you're restoring; telling a company \"a Nobel implant\" isn't enough. You can't know every product on the market (about a hundred in the U.S. alone), but know the ones you use and the ones your surgeons use.</p>\n<div class=\"rv-table-wrap\" data-title=\"Brands, product lines and platforms\"><table class=\"rv-table\"><thead><tr><th>Brand</th><th>Product lines</th><th>Platforms</th><th>At school</th></tr></thead><tbody>\n<tr><td>Nobel Biocare</td><td>Conical Connection, Tri-Lobe</td><td>NP, RP, WP</td><td>Conical Connection</td></tr>\n<tr><td>Straumann</td><td>Bone Level (CrossFit connection); synOcta (older, tissue level RN/WN)</td><td>SC, NC, RC; RN, WN</td><td>Bone Level (NC or RC)</td></tr>\n<tr><td>BioHorizons</td><td>Tapered Internal, Tapered Internal Plus; new Tapered Pro Conical (\"deep\" conical, students starting to use it)</td><td>3.0, 3.5, 4.5, 5.7 mm</td><td>Tapered Internal</td></tr>\n</tbody></table></div>\n<h4>2. Implant, abutment, screw, platform</h4>\n<p>The <b>fixture</b> is the implant. The <b>platform</b> is where the implant meets the abutment. Within one brand, the <b>color</b> of the implant platform and the abutment tells you which components match (Nobel's yellow is not BioHorizons' yellow). The wrong size or color of abutment or impression coping misfits: it can't seat all the way, or it spins.</p>\n<p><b>Be careful with BioHorizons.</b> The surgeon's note says \"4.6 mm BioHorizons Tapered Internal Plus.\" If you pick the 4.5 mm (green) impression coping because the numbers are close, you're wrong: it needs the <b>3.5 mm (yellow)</b> platform. The Plus line has extra platform switching, so its body diameter and platform differ. Worse, BioHorizons' hex lets the 4.5 mm part somewhat fit on the 4.6 mm implant, but the abutment is wider than the platform and the work has to be redone, at your cost. <b>The surgeon cares about the body diameter; you care about the platform (the prosthetic connection).</b> Find the implant's <b>sticker</b> in the surgeon's scanned chart (in Salud): it shows the platform. (\"Stickers, stickers.\") For Straumann, look at NC or RC (narrow or regular connection), not the 3.3, 4.1 or 4.8 mm body.</p>\n<h4>3. Platform switching</h4>\n<p><b>Platform switching</b> (shifting) means the <b>abutment diameter is smaller than the implant diameter</b>. It moves the implant-abutment junction, the <b>microgap</b>, inward and away from the crestal bone, which <b>preserves bone height</b>, and it <b>increases the soft tissue volume</b> around the implant.</p>\n<h4>4. External vs internal connection</h4>\n<p>This is the way the abutment attaches to the implant. <b>External</b>: the female part is in the abutment (the implant has a hex sticking up). <b>Internal</b>: the female part is in the implant.</p>\n<div class=\"rv-table-wrap\" data-title=\"External vs internal connection\"><table class=\"rv-table\"><thead><tr><th>External</th><th>Internal</th></tr></thead><tbody>\n<tr><td>More force on the abutment and screw: higher chance of screw loosening</td><td>More force on the implant itself</td></tr>\n<tr><td>Higher tolerance of implant divergence when splinted</td><td>Less microgap between implant and abutment under force</td></tr>\n</tbody></table></div>\n<p>All the implants used at school have an <b>internal connection</b>.</p>\n<h4>5. Bone level vs tissue level</h4>\n<p>This is where the implant's platform sits. A <b>tissue-level</b> implant has a smooth, polished collar that sits above the bone, in the soft tissue, with the rough surface below it covered by bone; a <b>bone-level</b> implant's platform sits at the bone. Tissue level puts the microgap away from the bone, potentially <b>less bone loss</b>. Bone level gives <b>more room to contour the emergence profile</b>, potentially <b>better esthetics</b>: the tissue-level collar already takes about a millimeter, leaving about 2 mm to shape the crown out of the tissue instead of 3.</p>\n<h4>6. Parallel-walled vs tapered</h4>\n<p>This is the implant's shape. A <b>parallel-walled</b> implant has <b>more surface area</b> contacting bone. A <b>tapered</b> implant has <b>higher primary stability</b> (greater lateral compression of the bone during insertion) and <b>less chance of hitting neighboring structures</b> such as a root or nerve.</p>\n<h4>7. Primary and secondary stability</h4>\n<p><b>Primary + secondary stability = total stability.</b> When the implant is placed, primary stability locks it in; it is measured as insertion torque in Ncm. As the bone remodels, primary stability falls and secondary stability gradually rises, until new bone holds the implant. The transition causes a <b>stability dip</b>, weeks after placement; when exactly depends on the brand and its surface treatment. If the surgeon allows it (there is enough primary stability), you can work on the implant right after surgery, for example to make a provisional; after that, be cautious about touching the implant until the total stability recovers. (In the lecture he said he feels comfortable at about 6-8 weeks, but follows the surgeon, who may say 3 months.)</p>\n<h4>8. Torque and torque wrenches</h4>\n<p><b>Torque</b> is rotational friction: between the implant and the bone during insertion, or between screw and thread when tightening a screw. Use a <b>torque wrench</b> (beam type or toggle type) to apply precise torque; your fingers apply only about <b>5 Ncm</b>. The screw has to be tight enough not to loosen, yet still removable if the crown has to come off. The general rules for implant screws, \"the common numbers you will need to memorize\":</p>\n<div class=\"rv-table-wrap\" data-title=\"Abutment screw torque by system\"><table class=\"rv-table\"><thead><tr><th>System</th><th>Torque</th></tr></thead><tbody>\n<tr><td>Nobel Biocare</td><td>35 Ncm (the 3.0 mm implant: 15 Ncm)</td></tr>\n<tr><td>Straumann</td><td>35 Ncm</td></tr>\n<tr><td>BioHorizons</td><td>30 Ncm</td></tr>\n</tbody></table></div>\n<p>Numbers are company- and product-specific (angled screw channels can differ). Don't torque on a printed model.</p>\n<h4>9. Conical connection and Morse taper</h4>\n<p>A <b>conical connection</b> is a type of internal connection in which the abutment has a <b>tapered surface</b> where it contacts the implant. Compared with internal non-conical connections, there is <b>no significant difference in implant survival or biological complications</b>, but the conical connection has <b>less microgap at the junction</b> (slope against slope), so <b>less marginal bone loss</b> and <b>fewer prosthetic complications</b>. Nobel's examples: its internal connection has a 45-degree shallow cone, its CONELOG a 7.5-degree deep cone. A <b>Morse taper</b> is a taper that causes \"<b>cold welding</b>\" (friction) between implant and abutment: a type of conical connection, at specific degrees of taper (Straumann synOcta; Dentsply Sirona Ankylos at 5.7 degrees). Whether a company's taper is a \"true\" Morse taper matters less than knowing it's conical.</p>\n<h4>10. Cover screw vs healing abutment</h4>\n<p>A <b>cover screw</b> is used at the <b>first stage of a two-stage surgery</b>: it's short and hidden under the soft tissue, for example when the implant isn't stable enough to be exposed to the tongue and food. A <b>healing abutment</b> is <b>taller and is not covered</b> by the tissue: it's used in <b>one-stage surgery</b> or at the <b>second stage</b> of a two-stage surgery, and it comes in different heights and widths. The sequence: implants placed, cover screws attached, primary closure; then uncovering, and healing abutments attached.</p>\n<h4>11. Ideal implant position</h4>\n<p>\"These are the numbers you must remember.\"</p>\n<ul><li><b>Depth</b>: the platform <b>3-4 mm below the ideal buccal gingival margin</b> (copy the margin from the proximal tooth). About 3 mm is the implant's biologic width, and the extra gives room to grow the emergence profile from the narrow implant to the crown's width.</li><li><b>Proximal</b>: <b>1.5 mm</b> from a natural tooth (for the bone's blood supply, and to stay off the PDL), and <b>3 mm</b> between two implants.</li><li>Why at least 3 mm between implants: extra bone resorbs between them, compromising the soft tissue height, so the <b>papilla is lost</b> (black triangles, exposed threads).</li><li><b>Facial</b>, especially for anterior teeth and immediate placement: <b>2 mm</b> from the border of the bone, because the <b>buccal bundle bone always resorbs</b> after extraction.</li><li><b>Lingual</b>: at least <b>1 mm</b> from the border of the bone.</li><li><b>Anterior</b> implants are generally placed <b>lingually</b> (palatally): it makes a <b>screw-retained</b> design possible and avoids esthetic problems. A grayish color in the buccal tissue over an implant can mean there's no bone covering it.</li><li><b>Posterior</b> implants are generally at the <b>middle of the ridge</b> (over the central fossa), where the bone is easier to maintain, at least 1 mm from the buccal and lingual borders. If the bone isn't wide enough: <b>ridge augmentation</b>.</li></ul>\n<h4>12. Engaging vs non-engaging abutments</h4>\n<p>An <b>engaging</b> abutment engages the implant's <b>anti-rotation feature</b> (a hex, octagon or grooves) and <b>cannot spin</b> once fully seated. Straumann RC uses <b>4 grooves</b>; BioHorizons a hex. A <b>non-engaging</b> abutment can <b>spin freely</b> even when fully seated; its connection part is shorter.</p>\n<h4>13. Impression copings</h4>\n<p>An impression coping screws onto the implant to transfer its position, deep in the bone under the soft tissue, to the cast. The student clinic uses a <b>closed-tray</b> coping 99% of the time (and the PCD project practices only closed tray), but for <b>multiple units</b> an <b>open-tray</b> impression is <b>more accurate</b>, because the coping is unscrewed and comes out inside the impression instead of being removed and reinserted.</p>\n<h4>14. Screw-retained vs cement-retained</h4>\n<p><b>Screw-retained</b>: abutment and crown are assembled as <b>one piece</b>, and the screw channel penetrates the crown. <b>Cement-retained</b>: abutment and crown are <b>separate</b>; the abutment is screwed in and the crown is <b>cemented on it in the mouth</b>, so no screw channel shows on the crown. <b>Screws are used in both designs.</b></p>\n<div class=\"rv-table-wrap\" data-title=\"Screw-retained vs cement-retained\"><table class=\"rv-table\"><thead><tr><th>Screw-retained</th><th>Cement-retained</th></tr></thead><tbody>\n<tr><td>Retrievable: crown and abutment come out through the screw channel</td><td>More passive connection between implant and abutment (especially for an FPD)</td></tr>\n<tr><td>No residual cement issue</td><td>No screw channel on the crown: more esthetic, higher crown strength</td></tr>\n</tbody></table></div>\n<p>If the implant position lets the screw channel come out on the <b>lingual</b> of an anterior crown, screw-retained is doable (you can still cement if you prefer). If the implant is <b>too facial</b>, the channel would perforate the incisal edge or even the facial, so <b>cement-retained is indicated</b>.</p>\n<p>A conventional screw-retained crown is a <b>true one-piece</b> structure: metal cast onto the platform and porcelain fired on the metal. Today there's also the <b>screwmentable</b> crown: a custom abutment or <b>TiBase</b> plus a full-ceramic crown with a screw channel, bonded together with <b>permanent (resin) cement outside the mouth</b>, keeping the channel. It is a \"<b>fake one-piece</b>.\"</p>\n<p>If you really want screw retention on a facial implant, there are <b>angled screw channels</b>: Nobel Biocare's <b>ASC</b>, BioHorizons' <b>Precision Angled Screw</b>, Straumann's <b>Angled Solutions (AS)</b>. They need a special screwdriver and screw (every brand different), cost a higher lab fee, may loosen more than conventional screws (in vitro), and beyond about <b>15 degrees</b> of correction the chance of stripping the screw rises.</p>\n<h4>15. Prefabricated vs custom abutments</h4>\n<p><b>Prefabricated</b> abutments come from the manufacturer in specific heights and sizes; some can be slightly adjusted (only by cutting away). Examples: TiBase (Variobase), solid abutments, anatomic abutments. <b>Custom</b> abutments have their whole contour designed for the patient (the final crown and the soft tissue): Straumann CARES milled abutments, or a castable (UCLA) abutment.</p>\n<div class=\"rv-table-wrap\" data-title=\"Prefabricated vs custom abutments\"><table class=\"rv-table\"><thead><tr><th>Prefabricated</th><th>Custom</th></tr></thead><tbody>\n<tr><td>Generally straight contour with a uniform margin</td><td>Maximizes retention and resistance form for the crown</td></tr>\n<tr><td>Sometimes needs adjustment to fit the patient (subtractive only)</td><td>Traces the soft tissue contour: less chance of an extremely deep margin that interferes with cement cleanup</td></tr>\n</tbody></table></div>\n<p><b>Custom abutments are generally always engaging</b>: a contoured abutment that could spin would never sit the same way twice. A TiBase is short; he showed a crown that separated from one after a year.</p>\n<h4>Which abutment for which restoration</h4>\n<ul><li><b>Single crown</b>: the abutment <b>must be engaging</b>, whether screw- or cement-retained, or the crown will spin. A prefabricated TiBase (screwmentable) or a custom abutment (screwmentable or cement-retained) are both acceptable.</li><li><b>Cement-retained FPD</b>: <b>custom</b> abutments (so the cement can be cleaned up), and they <b>must be engaging</b>; if anatomic abutments could spin, the bridge couldn't be seated. A TiBase is for screw-retained only.</li><li><b>Screw-retained FPD</b>: ideally <b>non-engaging</b>. The splinted one-piece bridge can't spin on the implants anyway, and since two implants are almost never perfectly parallel, the longer engaging connection would <b>bind on insertion</b> and put more force on the implants.</li><li>But the original manufacturers (Straumann, BioHorizons) offer only <b>engaging</b> single custom abutments. A castable (PFM) design can be made non-engaging; for <b>zirconia</b> they'll have you use a <b>non-engaging TiBase</b> (Variobase).</li></ul>\n<p>In the student clinic: <b>single crown, always engaging. FPD cement-retained: custom abutments, engaging. FPD screw-retained: TiBase, non-engaging.</b> And follow your faculty's choice of cement- or screw-retained.</p>\n<h4>16. Interocclusal space</h4>\n<p>Every implant prosthesis needs enough space between the bone or implant platform and the opposing tooth, and how much depends on its design. Extremely limited space makes any restoration hard.</p>\n<ul><li><b>Cement-retained</b>: a margin more than <b>1 mm subgingival</b> can leave uncleanable cemen
