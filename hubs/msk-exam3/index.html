nutrition: `
<p>Undernutrition is the single leading global cause of morbidity and premature death. About a third of the disease burden in developing countries traces to poor nutrition, mostly by making infections worse. In developed countries the problem flips to excess: ischemic heart and cerebrovascular disease, both tied to obesity. Dr. Dutt's framing for the exam is simple: for each nutrient know <b>what it does</b> and <b>what happens when it is missing</b>.</p>
<h4>Defining adequate intake</h4>
<p>The <b>EAR</b> (estimated average requirement) is the median need, enough for half of healthy people. The <b>RDA</b> sits 2 SD above it and covers all but 2-3%. The % Daily Value is the label version. Enrichment puts back what processing removed; fortification adds extra: bread (thiamine, niacin, riboflavin, iron), cereals (iron, B vitamins), milk (vitamin D, lost in pasteurization), salt (iodine). Fewer than 10% of Americans are deficient in anything; when they are, it is usually B6, iron, or vitamin D.</p>
<h4>Protein-energy malnutrition</h4>
<p><b>Marasmus</b> is global calorie starvation: over 60% weight loss, muscle and subcutaneous fat gone, emaciated limbs, viscera spared, with anemia, multiple vitamin deficiencies and infections. <b>Kwashiorkor</b> is protein lack out of proportion to calories (carbohydrate-only diets, nephrosis, burns): hypoalbuminemia and generalized edema that can hide the weight loss, relative sparing of fat and muscle, skin and hair pigment changes, fatty liver and weak cell-mediated immunity. The lecturer's discriminator: <b>edema</b>. She also noted current research suggests kwashiorkor is more than pure protein deficiency.</p>
<p>Secondary PEM is <b>cachexia</b> in cancer (50% of patients; 30% of cancer deaths) and AIDS/TB: weight loss, fatigue, muscle and diaphragm atrophy that more food does not fix. Self-induced PEM is anorexia nervosa (plus amenorrhea, hypothyroidism, arrhythmia) and bulimia (electrolytes, aspiration, esophageal rupture); both recover with refeeding.</p>
<h4>Fat-soluble vitamins: A, D, E, K</h4>
<p>Stored in liver and fat, so deficiency is slow and usually means <b>fat malabsorption</b>. <b>Vitamin A</b> (retinol, carried in chylomicrons, >90% in liver) runs vision (rhodopsin), epithelial differentiation and immunity (retinoic acid for B and T cells). Deficiency progresses: night blindness first, then xerophthalmia, Bitot spots, keratomalacia, blindness; squamous metaplasia raises lung infections and renal stones. <b>Vitamin D</b> deficiency under-mineralizes new matrix: rickets in children (craniotabes, frontal bossing, pigeon breast, lumbar lordosis, bowed legs) and osteomalacia in adults. Low 25-OH D drags down 1,25 D and calcium absorption; PTH then pulls calcium from bone. Phytates in legumes and nuts worsen absorption in growing kids. <b>Vitamin E</b> is a membrane antioxidant; neurons and anucleate RBCs suffer most (posterior-column signs, ataxia, areflexia, eye-movement problems, mild hemolysis). <b>Vitamin K</b> carboxylates clotting factors; gut bacteria make most of it, so antibiotics, liver disease and the newborn period cause bleeding. PT prolongs before aPTT, and every newborn gets an IM dose.</p>
<h4>Water-soluble vitamins</h4>
<p>Little storage, so regular intake matters. The exception is <b>B12</b>, stored in the liver. <b>Thiamine (B1)</b> feeds ATP production, so the highest-ATP organs fail: nerves (dry beriberi, legs then arms), heart (wet beriberi, high-output failure) and brain (Wernicke-Korsakoff: mamillary bodies, confusion, ataxia, ophthalmoplegia, nystagmus, amnesia). Give thiamine before IV glucose in alcoholics. <b>Riboflavin (B2)</b>: cheilosis, glossitis, corneal ulceration, dermatitis (alcoholics, no dairy). <b>Niacin</b>: pellagra, the 3 Ds. <b>Pyridoxine (B6)</b>: deficiency is drug-induced (isoniazid, estrogens, penicillamine) with neuropathy. <b>Vitamin C</b> hydroxylates procollagen, so scurvy means bleeding gums, subperiosteal bleeds and poor healing (Lind's 1747 citrus trial).</p>
<p><b>Folate vs B12</b>: both cause megaloblastic anemia (big erythroid precursors, hypersegmented neutrophils, macrocytes). Only B12 adds neurologic signs. B12 needs intrinsic factor from gastric parietal cells and the distal ileum, so pernicious anemia, gastrectomy and ileal disease block it no matter how much is eaten; strict vegans are the dietary risk.</p>
<h4>Minerals and obesity</h4>
<p><b>Iron</b> deficiency is the most common deficiency worldwide (hypochromic, microcytic; ferritin reflects stores; in the US look for blood loss, pregnancy or malabsorption). <b>Zinc</b>: periorificial rash (acrodermatitis enteropathica), poor growth and healing, infertility, night blindness. <b>Iodine</b>: goiter and hypothyroidism. <b>Selenium</b>: myopathy and cardiomyopathy. <b>Copper</b>: weakness, neurologic defects, hypopigmentation, poor collagen cross-linking. <b>Obesity</b> is BMI over 30 and brings T2D, CVD, hypertension, fatty liver/gallstones, degenerative joint disease and cancer; adipose tissue is itself an endocrine organ.</p>`,

joints: `
<p>Dr. Herr said there will be <b>four questions</b> from this lecture, mostly on telling osteoarthritis from rheumatoid arthritis and on gout.</p>
<h4>Osteoarthritis</h4>
<p>The most common joint disease: degeneration of articular cartilage with failure of synovial joints. Risk is polygenic. It hits hips, knees, the DIP and PIP joints, the first CMC and first tarsometatarsal joints, and the lower lumbar and cervical spine. <b>Primary</b> OA is age-related, insidious and has no clear cause (obesity is the second biggest predisposing factor); it is oligoarticular, knees and hands in women and hips in men. <b>Secondary</b> OA shows up in younger people with a predisposed joint (trauma, deformity, diabetes, hemochromatosis). The joint develops loose bodies, exposed polished subchondral bone (<b>eburnation</b>), subchondral cysts where synovial fluid is forced through fracture gaps, and osteophytes: <b>Heberden nodes at the DIP</b> and <b>Bouchard nodes at the PIP</b>. Patients describe deep aching pain that worsens with use, morning stiffness, limited motion and radicular pain; nothing halts progression.</p>
<h4>Rheumatoid arthritis</h4>
<p>A systemic autoimmune disease (joints, but also skin, heart, lungs). CD4+ T cells react to an arthritogenic antigen in a susceptible host (HLA-DRB1/DR4). The synovium becomes hyperplastic and inflamed, IL-1 and TNF lyse cartilage, and the synovium creeps over the surface as a <b>pannus</b>. Osteoclasts erode subchondral bone; pannus bridges the joint (fibrous ankylosis) and later ossifies (bony ankylosis). RA affects 1% of people, peaks in the 20s-40s, is 3-5x more common in women and is <b>symmetric</b> in the small joints of the hands and feet: ulnar deviation, swan neck and boutonniere deformities. 80% have rheumatoid factor (an antibody to the Fc portion of IgG), but it does not cause disease; anti-CCP antibodies target citrullinated proteins. Extra-articular: rheumatoid nodules at pressure points, vasculitis, and eye disease (keratoconjunctivitis sicca, episcleritis, scleritis). The course relapses and remits with most damage in the first 4-5 years; anti-TNF, steroids and methotrexate have transformed outcomes.</p>
<h4>JIA and the seronegative spondyloarthropathies</h4>
<p><b>Juvenile idiopathic arthritis</b> begins before 16. Compared with RA it is more often oligoarticular, systemic and in large joints, RF is usually absent and ANA often present; chronic uveitis is the main complication. The <b>seronegative spondyloarthropathies</b> lack RF, inflame ligament attachments (enthesitis), involve the sacroiliac joints, associate with <b>HLA-B27</b> and cause anterior uveitis. <b>Ankylosing spondylitis</b>: sacroiliac and apophyseal joints, men 3:1 in their 20s, low back pain worse at night and better with exercise, kyphosis, bamboo spine, NSAIDs first. <b>Reactive arthritis</b>: arthritis, nongonococcal urethritis/cervicitis and conjunctivitis ("can't see, can't pee, can't climb a tree") 1-3 weeks after a GU or GI infection; asymmetric lower-limb arthritis in young men; NSAIDs. <b>Psoriatic</b> arthritis hits small joints in 5-30% of psoriasis patients and is milder than RA. <b>Enteropathic</b> arthritis is a migratory large-joint oligoarthritis in 10-20% of IBD patients that remits in about a year.</p>
<h4>Gout and ganglion cysts</h4>
<p>Gout is the most common <b>inflammatory</b> arthropathy: recurrent acute arthritis from <b>monosodium urate</b> crystals. Hyperuricemia (from overproduction or, far more often, decreased excretion) is necessary but not sufficient and usually takes 20-30 years to cause gout. Primary gout is the body's own urate handling; secondary gout comes from disease or drugs (CKD, thiazides). Alcohol, obesity, age and genetics all push it along. The attack is sudden, excruciating and usually in one joint, classically the <b>first MTP</b>. Joint fluid with needle-shaped, negatively birefringent crystals is the gold standard. Untreated, it becomes chronic tophaceous gout and can damage the kidney. Treat acute attacks with colchicine, NSAIDs or steroids and chronic disease with allopurinol or probenecid. A <b>ganglion cyst</b> is a benign pseudocyst next to a joint capsule or tendon sheath, usually at the wrist: a nuisance, removed surgically or watched.</p>`,

cartilage: `
<p>Cartilage is a firm but pliable connective tissue made by chondrocytes. It gives flexible support, supports soft tissues, absorbs shock, lets joints glide and, above all, is the <b>template</b> for the long bones. In adults it survives only in the airway, joints and external ear.</p>
<h4>Cells and growth</h4>
<p>Mesenchyme (mesoderm) condenses under local signals (FGF, TGF-beta, BMP), the first visible sign of chondrogenesis. The <b>perichondrium</b> is the capsule; its inner chondrogenic layer produces <b>chondroblasts</b>, committed cells that lay down pericellular matrix at the surface: <b>appositional</b> growth, which adds girth. A chondroblast surrounded by its own matrix is a <b>chondrocyte</b>, the mature cell that can make every ECM molecule. Chondrocytes still divide inside their lacunae, and the daughters stay together as <b>isogenous groups</b>: <b>interstitial</b> growth, which adds length and is a sign of healthy growing cartilage. Articular cartilage has no perichondrium, so it can only grow interstitially and cannot repair. Matrix right around chondrocytes (<b>territorial</b>) is PG-rich, immature and turns over fast; matrix between groups (<b>interterritorial</b>) is collagen-rich and stable. IGF-1, growth hormone, thyroxine and testosterone enhance chondrocytes; cortisone, hydrocortisone and estrogen suppress them.</p>
<h4>Collagen</h4>
<p><b>Type II</b> is the most abundant, cartilage-specific collagen: a homotrimer of Gly-X-Y repeats (X proline, Y hydroxyproline), with IX, X and XI in minor roles (chondrocytes switch from II to X as they hypertrophy). Processing inside the cell goes <b>hydroxylation</b> of proline and lysine (needs vitamin C; think scurvy), then glycosylation of hydroxylysine, then disulfide-bonded triple helix, then secretion as procollagen. Outside, N- and C-propeptides are cut off (the freed peptides feed back to control synthesis) and fibrils cross-link into fibers. Missense mutations in COL2A1, COL9A1/2 or COL11A1/2 cause the autosomal dominant <b>Stickler, Marshall and Kniest</b> syndromes: short stature, loose joints, scoliosis, early arthritis, myopia, glaucoma, cataracts, retinal detachment, hearing loss and palate defects.</p>
<h4>Proteoglycans and function</h4>
<p>A proteoglycan is a core protein with long, unbranched GAG sugar chains; varying cores and sugars give each cartilage type its properties. <b>Aggrecan</b>, the main one, is a bottle brush: a hyaluronan shaft, core proteins held on by <b>link protein</b>, and bristles of chondroitin 4-/6-sulfate and keratan sulfate. Knocking out link protein or aggrecan is perinatal lethal; human aggrecan mutations cause a distinctive skeletal dysplasia (D2267N, lost glycosylation site) and spondyloepiphyseal dysplasia. Chondronectin anchors chondrocytes to the matrix. Because the aggregates are hugely negative, they hold water: a cartilage biopsy is 60-80% water. Load squeezes water out and unloading lets it back in, while type II fibers resist swelling like tensile rods. Cartilage is <b>avascular, aneural and alymphatic</b>, fed by diffusion driven by intermittent compression, and it likes hypoxia (HIF-1 alpha). It repairs poorly, often with scar.</p>
<h4>Types, OA, and SOX9</h4>
<p><b>Hyaline</b> (clear; most common; fetal skeleton, larynx, trachea, articular surfaces), <b>elastic</b> (yellow elastin; external ear, epiglottis) and <b>fibrocartilage</b> (no perichondrium; types I and II collagen from fibroblasts plus chondrocytes; discs, menisci, pubic symphysis). Articular cartilage is permanent hyaline, 95% ECM (75% water), fed by subchondral bone and synovial fluid. <b>Osteoarthritis</b> affects 60-85% of people; the earliest change is lost proteoglycan, then lost elasticity, fibrillation and fissuring and chondrocyte proliferation, with chondrocyte death late. <b>SOX9</b> is the master transcription factor for chondrocytes; knockout means no cartilage, and human haploinsufficiency causes campomelic dysplasia with XY sex reversal.</p>`,

bone: `
<p>Bone differs from cartilage in being calcified and rigid, vascular, innervated, dynamic, and growing only by apposition. It is one of five mineralized tissues (with enamel, dentin, cementum and alveolar bone). Its six jobs: structural support; protection (cast-iron strength at the weight of wood); locomotion; a <b>metabolic reservoir</b> holding <b>99% of body calcium and 85% of phosphorus</b>; hematopoiesis (osteoblasts maintain the stem-cell niche); and an <b>endocrine organ</b> (osteocalcin controls beta-cell proliferation, insulin and male fertility).</p>
<h4>Origins and matrix</h4>
<p>Neural crest mesenchyme makes the craniofacial bones, sclerotome/somite makes most of the axial skeleton, and lateral plate mesoderm makes the limbs, patterned by Wnt, BMP, FGF, Hedgehog and Notch. Mature bone is about <b>30% organic, 50% mineral, 20% water</b>. Of the organic part ~90% is <b>type I collagen</b> (2 alpha-1 + 1 alpha-2), laid down as a scaffold before mineral arrives, plus small leucine-rich proteoglycans and noncollagenous proteins: osteonectin (adhesion), osteopontin (migration), bone sialoprotein and osteocalcin (calcium binding). The SIBLING family's calcium and phosphate affinity lets them nucleate crystals. The mineral is calcium phosphate, amorphous and as <b>hydroxyapatite</b> Ca10(PO4)6(OH)2, with <b>whitlockite</b> second.</p>
<h4>Osteogenesis imperfecta</h4>
<p>Mutations in COL1A1 or COL1A2 (90% of cases, autosomal dominant) reduce or distort type I collagen. Dr. Javed emphasized that <b>CRTAP and P3H1</b>, collagen-modifying enzymes, cause the autosomal recessive forms. About 1 in 20,000 births: brittle bones, short stature, hearing loss, small fragile ribs, <b>blue sclera</b>, and dentinogenesis imperfecta (discolored, translucent, weak teeth). There is no cure, only management.</p>
<h4>Cells</h4>
<p><b>Osteoprogenitor</b> cells (fibroblast-like, in periosteum and endosteum) divide and become <b>pre-osteoblasts</b> (committed, still dividing), then <b>osteoblasts</b>: cuboidal cells found only on bone surfaces that secrete <b>osteoid</b>, the not-yet-mineralized organic layer between them and old bone, and never divide again. Osteoblasts have three fates: most undergo apoptosis, some become dormant <b>bone-lining cells</b> (woken for repair and graft integration), and some become <b>osteocytes</b>. Osteocytes (90-95% of bone cells, ~42 billion) sit in lacunae, shrink as they embed, and send ~100 dendrites through canaliculi, joined by gap junctions: an information highway from periosteum to marrow. They are the body's <b>mechanosensors</b>, and they secrete <b>sclerostin</b> (inhibits formation) and FGF-23, PHEX and DMP1 (phosphate control). Osteoblasts are 4-6% of cells and osteoclasts 1-2%.</p>
<h4>Mineralization</h4>
<p>Crystals start at discrete nucleation sites on collagen, held there by strongly anionic noncollagenous proteins, then grow by adding ions and aggregating. Rate depends on pH (neutral or basic favors building; acid favors osteoclasts), calcium and phosphate concentration, the ratio of inorganic phosphate to pyrophosphate (alkaline phosphatase removes the inhibitor), and other charged molecules.</p>`,

bonedev: `
<p>All bone is laid down first as <b>woven</b> bone (random type I collagen) and then remodeled into <b>lamellar</b> bone: trabecular/cancellous (spongy plates holding marrow, strength without weight) and cortical/compact (ordered, weight-bearing). Anatomy: epiphysis (articular end), growth plate, metaphysis, diaphysis (shaft). The <b>periosteum</b> covers the outside except articular surfaces and tendon insertions and holds osteoprogenitors; the <b>endosteum</b> lines the marrow and Haversian canals with stromal cells, resting osteoblasts and lining cells.</p>
<h4>The osteon</h4>
<p>The <b>Haversian system</b> is 4-20 concentric lamellae around a central <b>Haversian canal</b> (vessels, nerves, lymphatics) running the bone's length. <b>Volkmann canals</b> run perpendicular, linking periosteal and marrow supplies. <b>Canaliculi</b> carry osteocyte processes. The innermost lamella is the youngest. Do not confuse <b>osteon</b> (structural unit) with <b>osteoid</b> (new unmineralized matrix).</p>
<h4>Osteoclasts</h4>
<p>The "villain" is hematopoietic: monocyte/macrophage precursors (PU.1) fuse into a giant 5-50-nucleus cell packed with mitochondria. Fused but unpolarized, it is quiescent; once <b>polarized</b> it grows a <b>ruffled border</b> (about 100x more membrane) inside a <b>sealing zone</b> of actin, integrins and osteopontin. Inside, <b>carbonic anhydrase II</b> makes H+ and HCO3-; an ATP-driven pump sends H+ into the Howship lacuna, HCO3- is traded for Cl-, and Cl- follows, making HCl at pH 3-4.5 that dissolves mineral and denatures collagen. Lysosomal enzymes (cathepsin K, phosphatases) and zinc MMPs then digest the matrix. An osteoclast runs 6-7 cycles, then dies. <b>TGF-beta and estrogen</b> promote its apoptosis; <b>PTH and IL-1</b> keep it alive.</p>
<h4>Coupling: M-CSF, RANKL, OPG</h4>
<p>Osteoblasts, osteocytes (the main source), odontoblasts and hypertrophic chondrocytes make <b>M-CSF</b>, which activates monocytes so they display <b>RANK</b>. Their own membrane-bound <b>RANKL</b> then shakes hands with RANK to make an active osteoclast: the builders write their own demise. The twist is <b>OPG</b>, a decoy that binds RANKL about 10x better than RANK does. Resorption always comes before formation, and coupling is driven by systemic hormones, mechanical force through osteocytes (how orthodontic pressure moves teeth) and direct cell contact.</p>
<h4>Two ways to make bone</h4>
<p><b>Intramembranous</b> (calvaria, maxilla, mandible): condensed mesenchyme becomes osteoblasts directly at many primary ossification centers that grow and fuse into plates. Sutures stay open so the head passes the birth canal and the brain can grow (85% of postnatal skull growth is in year one). Anomalies: craniosynostosis (premature closure; seen with Down syndrome), deformational plagiocephaly, cleft lip and palate. <b>Endochondral</b> (long bones, ribs): a hyaline cartilage template forms, perichondrium becomes periosteum and makes a bone collar, central chondrocytes hypertrophy and die, VEGF brings in vessels with osteoprogenitors and chondroclasts, and osteoblasts lay osteoid on calcified cartilage spicules. Secondary centers open in the epiphyses after birth, leaving the <b>growth plate</b>: reserve, proliferation (isogenous columns), hypertrophy, calcification, ossification. Growth ends when the plate is used up and fuses.</p>
<h4>Growth disorders</h4>
<p><b>Achondroplasia</b>: FGFR3 Gly380Arg (95%) makes the receptor constantly active, which shuts down chondrocyte proliferation; AD, normal torso, short proximal limbs, trident hands, macrocephaly. GH deficiency (Pit-1, Prop-1, GHRHR, GH) gives isometric short stature that GH fixes; GH resistance (GHR, IGF-1) cannot be fixed; GH excess causes gigantism or acromegaly. Men with <b>aromatase</b> deficiency or inactive <b>ER-alpha</b> grow tall forever with open plates and osteoporosis: estrogen closes growth plates in men too. Limb axes: HOX (proximal-distal), Sonic hedgehog (anterior-posterior), Wnt7a/BMP/Engrailed (dorsal-ventral); TBX5 loss gives Holt-Oram syndrome.</p>
<h4>Remodeling and mineral control</h4>
<p>We go from ~300 bones at birth to 206 by remodeling, which continues for life (tooth eruption, shaping, calcium balance, load changes). The remodeling unit runs activation, resorption (2-3 weeks), reversal, formation, mineralization (1-3 months), quiescence. Modeling (growth years) is continuous, fast and net-positive; remodeling is cyclical, slow and neutral or negative. Only ionized serum calcium works, kept at 8.5-10.2 mg/dL. When calcium falls, <b>PTH</b> acts on three axes: bone (indirectly, via osteoblast RANKL), kidney (keep calcium, waste phosphate, activate 1-alpha hydroxylase) and gut (via 1,25 D). <b>Calcitonin</b> is the antagonist when calcium is high. <b>FGF-23</b> from osteocytes wastes phosphate; its mutation causes hypophosphatemic rickets that vitamin D does not fix. Rickets and osteomalacia are returning in exclusively breast-fed babies. Bone mass falls with age in everyone (women reach osteopenia about 10 years earlier). Long-term bisphosphonates can cause ONJ and atypical fractures because they block needed remodeling. <b>RUNX2</b> and SP7 are required for any bone at all; RUNX2 haploinsufficiency causes <b>cleidocranial dysplasia</b> (no clavicles, open fontanelles, extra teeth).</p>`,

autoimmune: `
<p>Autoimmune disease is an immune reaction against self-antigens that can destroy, stimulate or inhibit tissue, confined to one organ or systemic. The core problem is loss of <b>self-tolerance</b>.</p>
<h4>Tolerance</h4>
<p><b>Central</b> tolerance deletes self-reactive lymphocytes as they mature: negative selection of T cells in the thymus (AIRE makes thymic cells display self-antigens; tight binders undergo apoptosis; some become Tregs) and B cells in marrow. Some escape, so <b>peripheral</b> tolerance takes over: <b>anergy</b> (antigen without a co-stimulatory second signal switches the cell off for good), <b>Treg suppression</b>, <b>activation-induced cell death</b> (repeated stimulation triggers Fas/FasL apoptosis; Fas-knockout mice get lupus) and <b>sequestration</b> in privileged sites (eye, testis, brain) until trauma exposes them (post-traumatic orchitis). Tolerance breaks through <b>susceptibility genes</b> (HLA associations; Fas, AIRE, CTLA-4 knockouts) and <b>infection</b> (co-stimulator upregulation, molecular mimicry, release of self-antigen). Damage exposes new epitopes, so disease spreads (<b>epitope spreading</b>).</p>
<h4>Thyroid</h4>
<p>The hypothalamus (TRH) drives the pituitary (TSH), which drives T3/T4 with negative feedback; the thyroid also makes calcitonin. <b>Hyperthyroidism</b>: weight loss, tachycardia, arrhythmia, diarrhea, tremor, nervousness, heat intolerance; labs show low TSH and high free T4; <b>thyroid storm</b> is an emergency set off by illness, surgery or trauma. <b>Graves disease</b>, the most common cause, is an IgG that <b>stimulates</b> the TSH receptor: diffuse goiter, ophthalmopathy, F 5:1; treated with beta blockers, synthesis inhibitors, radioactive iodine or thyroidectomy. <b>Hypothyroidism</b> (low T3/T4, high TSH, myxedema: weight gain, cold intolerance, lethargy, coarse face, big tongue, puffy hands) is most often <b>Hashimoto thyroiditis</b>: CD8+ T cells plus antibodies that <b>block</b> the TSH receptor, a painless nodular goiter, F 10:1, sometimes hyperthyroid before hypothyroid, with lymphoid germinal centers, Hurthle cells and fibrosis, and a raised risk of other autoimmunity and marginal-zone B-cell lymphoma.</p>
<h4>Other organ-specific diseases</h4>
<p><b>Myasthenia gravis</b>: antibodies block the ACh receptor; weakness starts in the eye muscles (ptosis, diplopia); the Jolly test shows a falling response with repeated stimulation and the Tensilon test improves with an anticholinesterase; treat with anticholinesterases, prednisone, plasmapheresis or thymectomy (thymoma is common); death is respiratory. <b>Multiple sclerosis</b>: demyelination with deficits separated in time, partial recovery, optic, motor, sensory and cognitive symptoms and white-matter lesions; F > M. <b>Goodpasture syndrome</b>: antibodies to <b>type IV collagen</b> destroy glomerular and alveolar basement membranes; hemoptysis then progressive renal failure, death from uremia; unusually <b>M > F</b>, teens to early 20s; plasma exchange with immunosuppression. <b>Type 1 diabetes</b>: CD4 and CD8 T cells destroy beta cells; anti-islet/insulin antibodies in 70-80%; small-vessel damage everywhere (retinopathy tracks A1C). Celiac sprue flattens duodenal villi but Dr. Ding flagged it as less relevant.</p>
<h4>Systemic diseases</h4>
<p><b>SLE</b> is chronic and relapsing, injuring skin, joints, kidney and serosa; about 1 in 2,500, F 9:1, highest in African-American women in their 30s-40s. A general tolerance failure produces many autoantibodies: ANA (sensitive, not specific) and <b>anti-dsDNA and anti-Smith</b> (virtually diagnostic), plus antibodies to RBCs, platelets and phospholipids. Genes (HLA, 20% twin concordance) and environment (hydralazine, procainamide, D-penicillamine, UV light, sex hormones) both matter. Features: malar or discoid rash, photosensitivity, oral ulcers, arthritis, serositis, renal and neurologic disease, cytopenias. <b>Sjogren syndrome</b>, which Dr. Ding called most relevant to your future practice, destroys lacrimal and salivary glands (dry eyes and mouth), alone (sicca) or with RA/SLE. CD4+ cells infiltrate and fibrose the glands; SS-A/SS-B in up to 90%, RF in 75%, ANA 50-80%. Expect corneal ulcers, oral fissures, nasal septal perforation, dysphagia, parotid enlargement and Mikulicz syndrome in older women; diagnose by lip biopsy; watch for non-Hodgkin lymphoma. <b>Scleroderma</b> (systemic sclerosis): vascular damage and fibroblast collagen overproduction, limited (fingers, forearms, face, late spread) or diffuse (rapid visceral spread), involving skin, esophagus, gut, synovium, kidney, lung and heart; vessel fibrosis can blacken fingertips.</p>`,

hereditary: `
<p>Dr. Herr said the exam questions here are high level, and this lecture partly reviews Dr. Javed's material.</p>
<h4>Dysostoses vs dysplasias</h4>
<p>A <b>dysostosis</b> is a localized developmental error in mesenchymal migration and condensation into the cartilage anlage, often from homeobox transcription-factor mutations: aplasia (a missing bone, like an absent radius), supernumerary ribs or digits, syndactyly and hypoplasia of the mandible or maxilla, often with cleft lip, optic coloboma, hernias or small kidneys. <b>Craniofacial dysostoses</b> come from abnormal first and second pharyngeal arches: maxillary, malar and mandibular hypoplasia, cleft palate and ear defects, sometimes with limb defects. A <b>dysplasia</b> is global disorganization of bone and cartilage (450+ disorders) from genes controlling skeletal development or remodeling.</p>
<h4>Achondroplasia, OI, osteopetrosis</h4>
<p><b>Achondroplasia</b> is the most common skeletal dysplasia: an autosomal dominant FGFR3 gain-of-function mutation impairs endochondral growth while appositional growth is normal, so bones are normal width but limbs are short and the torso normal. About 90% are new mutations, almost always on the father's allele; homozygotes die soon after birth from a tiny chest. <b>Vosoritide</b>, a C-type natriuretic peptide analog, damps the FGFR3 pathway. <b>Osteogenesis imperfecta</b> is the most common inherited connective tissue disorder: defective type I collagen means too little bone (thin cortex, sparse trabeculae), brittle bones and fractures, plus eye, teeth, skin and joint involvement. Type I is mild with childhood fractures; type II is perinatal lethal; you don't need the subtypes. <b>Osteopetrosis</b> is the opposite: osteoclasts fail (usually they cannot acidify the pit), so bone keeps accumulating unremodeled, woven and dense. It still breaks (<b>chalk-stick</b> fractures), crowds out marrow (anemia, thrombocytopenia, leukopenia, infections) and squeezes cranial nerves through small foramina (optic atrophy, deafness, facial palsy). AR is severe; AD is milder and found later. It was the first genetic disease cured by hematopoietic stem cell transplant.</p>
<h4>Paget disease</h4>
<p>The thing to remember is <b>chaotic remodeling</b>: both osteoblasts and osteoclasts are overactive, giving disorganized woven and lamellar bone that is increased but unsound (tibial bowing, fractures, nerve compression). Know the stages: <b>osteolytic</b> (huge osteoclasts), <b>mixed</b> osteolytic-osteoblastic (poorly mineralized new bone), <b>quiescent osteosclerotic</b> (jigsaw lamellar bone with cement lines). It starts in the 50s or later, 80% in the axial skeleton or proximal femur, mono- or polyostotic, and clusters in whites in the US, Europe and Australia (genetics of osteoclast pathways, maybe an RNA virus). Most cases are found incidentally on x-ray or by a high alkaline phosphatase. Treat with bisphosphonates (zoledronate) or calcitonin; sarcoma arises in under 1%.</p>
<h4>Osteoporosis</h4>
<p>Bone mass peaks in young adulthood; after 40, resorption outpaces formation by 0.3-0.5% a year, shrinking bone with a normal matrix-to-mineral ratio: vertebral instability, back pain, and hip, wrist and vertebral fractures. <b>Primary</b>: postmenopausal (estrogen loss raises IL-1; trabecular loss; vertebral and distal forearm fractures) and senile (over 70; trabecular and cortical; hip, humerus, tibia, pelvis). <b>Secondary</b>: endocrine disease, drugs, malabsorption. Diagnose by DEXA (plain films miss the first 30-40%). Treat with exercise, calcium and vitamin D and bisphosphonates; antiresorptives carry the ONJ concern relevant to dentistry.</p>
<h4>Fractures and repair</h4>
<p>You won't be quizzed on fracture types. Repair: a <b>hematoma</b> fills the gap with a fibrin mesh; inflammatory cytokines drive angiogenesis and activate osteoblasts and osteoclasts; a <b>procallus</b> (organized, uncalcified hematoma) forms by the end of week 1; a <b>bony callus</b> of subperiosteal woven bone and fibrocartilage (endochondral) follows in week 2 and peaks in girth by week 3; mineralized bridging allows weight bearing; and remodeling trims excess and reinforces stressed sites. Complications: delayed union or nonunion (poor immobilization), malunion, <b>pseudoarthrosis</b> (a cystic callus lined by synovial-like cells, a false joint), infection of open fractures, and systemic problems (calcium or vitamin D deficiency, diabetes).</p>`,

drugs: `
<h4>Calcium, PTH and vitamin D</h4>
<p>Calcium plus phosphate forms hydroxyapatite and runs signaling, contraction, exocytosis and clotting; phosphate runs ATP and enzyme regulation. <b>PTH</b> raises calcium: it indirectly increases gut Ca and P absorption by activating vitamin D, increases renal Ca reabsorption and P excretion, releases bone Ca when Ca is low, and helps bone formation when Ca is sufficient. Active <b>vitamin D</b> (1,25(OH)2D) increases gut Ca and P absorption and renal reabsorption, supports formation when Ca is adequate, and releases Ca with PTH when low. It is a steroid hormone acting on nuclear receptors; skin makes the precursor with UVB, then liver and kidney activate it.</p>
<h4>Hypo- and hypercalcemia</h4>
<p><b>Hypocalcemia</b> (hypoparathyroidism, vitamin D deficiency, CKD) causes neuromuscular excitability, paresthesias and spasms; chronically, psychiatric symptoms, pseudotumor cerebri, papilledema, cataracts (calcium phosphate precipitating on the lens), osteomalacia, and arrhythmias, hypotension or heart failure. Dentists and eye doctors often see it first: in young patients, <b>enamel defects and altered tooth morphology</b>; in older patients, <b>periodontal disease and tooth loss</b>. Vitamin D deficiency reaches about 20% of US children, and older adults are also at risk. Treat with calcium and vitamin D. Oral <b>calcium carbonate</b> is most used but needs stomach acid; <b>calcium citrate</b> is best absorbed; gluconate and chloride are IV. Calcium binds tetracyclines, quinolones, levothyroxine and bisphosphonates in the gut, so separate the doses by <b>at least 4 hours</b>. <b>Hypercalcemia</b> (cancer, hyperparathyroidism, excess vitamin D, milk-alkali syndrome) causes fatigue, weakness, hyporeflexia, depression, abdominal pain and constipation; treat with IV saline and loop diuretics, bisphosphonates or denosumab, and glucocorticoids. <b>Vitamin D deficiency</b> risk: little sun, dark skin, renal/liver/intestinal disease, phenytoin, old age. The upper intake level is 4,000 IU a day. Severe deficiency lowers Ca and P, triggers secondary hyperparathyroidism and demineralizes bone (osteomalacia, rickets); treat with cholecalciferol or ergocalciferol.</p>
<h4>Osteoporosis</h4>
<p>Primary osteoporosis is postmenopausal (less estrogen, more osteoclast activity; spine and <b>wrist</b> fractures) or age-related (both osteoclasts and osteoblasts affected; <b>hip</b> fractures rise); secondary causes include cancers and their hormone therapies, hyperthyroidism, smoking, alcohol and drugs (glucocorticoids most often; also old AEDs, heparin, aromatase inhibitors, medroxyprogesterone, androgen deprivation). Osteoclast activity exceeds osteoblast activity. Osteoblasts make <b>RANKL</b> (activates osteoclasts) and <b>OPG</b> (the decoy), and estrogen raises OPG and lowers RANKL; these are the main drug targets. Drugs that inhibit osteoclasts are <b>antiresorptive</b>; drugs that stimulate osteoblasts are <b>anabolic</b>.</p>
<h4>The drugs</h4>
<p><b>Teriparatide</b> (PTH 1-34, daily SC): intermittent PTH is anabolic, while chronic PTH drives RANKL and resorption. For high-risk postmenopausal women and men with primary or hypogonadal osteoporosis; limit to 2 years (rat osteosarcoma); follow with an antiresorptive; watch hypercalcemia (<b>the only osteoporosis drug class that can raise calcium</b>; all the others risk hypocalcemia); it is the one drug on the list <b>not linked to ONJ</b>; avoid in Paget disease, prior skeletal radiation, bone metastases, other metabolic bone disease, hypercalcemia and open growth plates. <b>Romosozumab</b> blocks sclerostin, freeing Wnt/beta-catenin to build bone, and also reduces resorption; AEs include hypocalcemia, hypersensitivity, and low-risk atypical femur fracture and ONJ, with a boxed warning for MI, stroke and CV death. <b>Bisphosphonates</b> (alendronate, risedronate, zoledronic acid) are pyrophosphate analogs that bind bone mineral and stay there for years, are taken up by resorbing osteoclasts (Dr. Herr's comparison: the plane flown into the mothership in <i>Independence Day</i>), and inhibit FPP synthase in the mevalonate pathway, starving the cell of isoprenoids and killing it. Uses: first-line osteoporosis, Paget disease, hypercalcemia of malignancy, bone metastases, and bone loss from cancer hormone therapy. Oral forms are poorly absorbed: empty stomach, water only, upright 30 minutes; milk, antacids and other divalent cations (Ca, Mg, iron) drop absorption to almost nothing. Zoledronic acid (Reclast) is the IV one. AEs: esophagitis and ulcers, ONJ (mostly high-dose IV in cancer, 1-3%, worse with invasive dental work), ocular inflammation, MSK pain, hypocalcemia, atypical femur fracture and renal impairment. <b>Denosumab</b> is an anti-RANKL antibody for high-risk osteoporosis, bone metastases, hypercalcemia of malignancy and cancer hormone therapy; it is given in clinic about twice a year. AEs are hypocalcemia, arthralgia, <b>cataracts</b>, and ONJ and atypical femur fracture; its <b>ONJ risk is higher than the bisphosphonates'</b>. Others: estrogen (not first line; breast cancer and clot risk, so only for menopausal symptoms), raloxifene (less effective, lowers breast cancer risk, still raises clots), salmon calcitonin (hypercalcemia, Paget and bone-cancer pain). Medroxyprogesterone (Depo-Provera) is avoided in young women because bones are still building.</p>
<h4>Osteonecrosis of the jaw</h4>
<p>Antiresorptives stop the daily remodeling that repairs microfractures, and the jaws take heavy chewing loads, so damage accumulates. ONJ is rare in healthy patients on oral drugs and reaches 1-3% in cancer patients on high-dose IV therapy; invasive dental work, poor oral hygiene and long duration raise the risk. There is no consensus on withholding needed dental surgery: discuss it and weigh the timing with the patient.</p>`,

tumors: `
<h4>Bone tumors: metastases first</h4>
<p>Most tumors in bone are <b>metastatic</b>, from breast, lung, thyroid, colon, kidney and prostate ("BLT with Kosher Pickle"), landing in the spine, ribs, skull and pelvis. Primary bone tumors are about 1% of neoplasms, about 40% malignant, and about 80% occur around the knee. Dr. Latimer: skip the percentages, remember <b>around the knee and the epiphyses</b>, and study the bolded slide text and her two summary tables (type, description, location, special notes).</p>
<h4>Benign</h4>
<p><b>Osteochondroma</b> (30%): a cartilage-capped bony outgrowth on a stalk at the growth plate of long bones, M:F 3:1, usually found in late adolescence; multiple lesions are hereditary multiple exostosis. It hurts only if the stalk fractures or presses on a nerve, stops growing when the plate closes, and rarely becomes chondrosarcoma. <b>Giant cell tumor</b> (20%): benign but locally aggressive, epiphyseal, around the knee, in the 3rd to 5th decades (the table says females 20-40); its pain and stiffness are often mistaken for arthritis; purely lytic and often found by a pathologic fracture; gray-brown, vascular and hemorrhagic; osteoclast-type giant cells in mononuclear stroma; up to 4% metastasize to lung and half recur after curettage. <b>Chondroma</b> (10%): benign hyaline cartilage from growth-plate rests, <b>enchondroma</b> in the medulla of the small bones of hands and feet ("O ring" sign) or juxtacortical on the surface. Ollier disease and Maffucci syndrome (with angiomas) mean multiple enchondromas with a 30-50% malignant transformation rate. <b>Osteoid osteoma</b> (10%): under 2 cm, extremely painful at night because of PGE2, relieved by NSAIDs, in the cortex of the proximal femur and tibia of young males; x-ray shows a lucent nidus in thickened sclerotic cortex. Many regress on their own; otherwise radiofrequency ablation or excision, which is hard in sites like the spine. <b>Osteoma</b>: dense bone on the skull or face, often into a sinus.</p>
<h4>Malignant</h4>
<p><b>Osteosarcoma</b> (30%) is the most common primary bone malignancy: malignant cells making osteoid, 75% under age 20, in the metaphysis around the knee, breaking through cortex (Codman triangle). About 8% arise in the facial bones. Lung metastases at diagnosis mean under 20% five-year survival; treat with surgery, radiation and chemo. <b>Chondrosarcoma</b> (15%) is second: malignant cartilage, mostly after 50, men 2:1, central skeleton (pelvis, shoulders, ribs). Low-grade tumors have 90% 5-year survival; high-grade and dedifferentiated ones spread by blood to the lungs; treat by complete excision. <b>Ewing sarcoma</b> (10%), the second most common pediatric bone sarcoma, is made of small round blue cells with scant cytoplasm and pseudorosettes, in the diaphysis of long bones and the pelvis, with an <b>EWS-FLI1</b> fusion (she said the molecular detail is included for completeness, not to memorize); chemo plus surgery or radiation gives durable remission in about half.</p>
<h4>Soft tissue tumors</h4>
<p>Soft tissue excludes skeleton, joints, CNS and blood/lymphoid tissue. Benign tumors outnumber malignant ones 100:1 (except in skeletal muscle); sarcomas are aggressive, mostly in the extremities (thigh ~40%), and superficial ones do better than deep. <b>Lipoma</b> is the most common adult soft tissue tumor, soft, mobile and cured by excision; <b>liposarcoma</b> is 25% of soft tissue malignancies, deep in the proximal limbs and retroperitoneum, with 12q (MDM2) amplification, and recurs without wide excision. <b>Rhabdomyoma</b> is a benign cardiac tumor of children with tuberous sclerosis (TSC1/TSC2) that often regresses; symptomatic ones are treated with medication, rarely surgery; <b>rhabdomyosarcoma</b> (alveolar and embryonal types) is the most common soft tissue sarcoma of childhood, in the sinuses, head and neck and GU tract, with FOXO1-PAX3/PAX7 fusion in the alveolar type. <b>Leiomyoma</b> is the most common neoplasm in women (uterine fibroids, 77%), spindle cells in fascicles crossing at right angles; <b>leiomyosarcoma</b> (10-20% of soft tissue sarcomas) grows in deep limbs and the retroperitoneum, where it is often unresectable and spreads to the lungs.</p>`
};

/* ---------- utils ---------- */
function escHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffled(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function tagOf(lecId){ var l = LECTURE_BY_ID[lecId]; return l ? l.tag : 'blue'; }
function lecChip(lecId){ var l = LECTURE_BY_ID[lecId]; if(!l) return ''; return '<span class="lec-chip tag-'+l.tag+'">L'+l.num+' · '+escHtml(l.title.split(':')[0].split(',')[0])+'</span>'; }
function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg, ic){ var host = document.getElementById('toastHost'); if(!host) return; var t = document.createElement('div'); t.className='toast'; t.innerHTML = (ic ? icon(ic) : '') + '<span>' + escHtml(msg) + '</span>'; host.appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }

/* ---------- STATE ---------- */
var STATE_KEY = 'msk3-state-v1';
function defaultState(){
  return { v:1, seen:{}, streak:0, bestStreak:0, totalCorrect:0, totalAnswered:0, lecStats:{}, days:[], ach:{},
    ui:{ mode:'compendium', sub:'notes', lec:'nutrition', group:'drugs', recall:false, qlec:'all', qsrc:'all', qstatus:'all' },
    arcade:{ best:{ sort:0, snake:0, stack:0, match:0, hangman:0, fact:0, blaster:0, search:0, whack:0 }, plays:{ sort:0, snake:0, stack:0, match:0, hangman:0, fact:0, blaster:0, search:0, whack:0 }, muted:false, sortSet:'mix', snakeLec:'all', stackSet:'mix', matchSet:'mix', hangLec:'all', blastLec:'all', searchLec:'all', whackSet:'mix' } };
}
function loadState(){
  var base = defaultState();
  try{
    var raw = localStorage.getItem(STATE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      Object.keys(s).forEach(function(k){
        if(s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])){
          Object.keys(s[k]).forEach(function(k2){
            if(s[k][k2] && typeof s[k][k2]==='object' && !Array.isArray(s[k][k2]) && base[k][k2] && typeof base[k][k2]==='object') base[k][k2] = Object.assign(base[k][k2], s[k][k2]);
            else base[k][k2] = s[k][k2];
          });
        } else base[k] = s[k];
      });
    }
  }catch(e){ /* storage unavailable */ }
  return base;
}
var STATE = loadState();
function saveState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }catch(e){ /* storage unavailable */ } }

function checkAchievements(){
  ACHIEVEMENTS.forEach(function(a){
    if(STATE.ach[a.id]) return;
    var c = a.cond, ok = false;
    if(c.type === 'totalCorrect') ok = STATE.totalCorrect >= c.n;
    else if(c.type === 'streak') ok = STATE.streak >= c.n;
    else if(c.type === 'lecPct'){ var st = STATE.lecStats[c.lec]; ok = !!(st && st.a >= c.min && (st.c / st.a) * 100 >= c.pct); }
    else if(c.type === 'allSeen') ok = QUESTIONS.every(function(q){ return STATE.seen[q.id]; });
    if(ok){ STATE.ach[a.id] = todayStr(); toast('Achievement: ' + a.name, a.icon); }
  });
}

/* ---------- the one answer choke point ---------- */
function recordAnswer(qid, lecId, correct, ctx){
  var s = STATE.seen[qid] || { n:0, c:0, last:null };
  s.n++; if(correct) s.c++; s.last = !!correct; STATE.seen[qid] = s;
  STATE.totalAnswered++;
  if(correct){ STATE.totalCorrect++; STATE.streak++; if(STATE.streak > STATE.bestStreak) STATE.bestStreak = STATE.streak; } else STATE.streak = 0;
  var ls = STATE.lecStats[lecId] || { a:0, c:0 }; ls.a++; if(correct) ls.c++; STATE.lecStats[lecId] = ls;
  var d = todayStr(); if(STATE.days.indexOf(d) === -1) STATE.days.push(d);
  checkAchievements();
  saveState();
  renderHeaderStats();
  document.dispatchEvent(new CustomEvent('msk3:answered', { detail:{ qid:qid, lec:lecId, correct:!!correct, ctx:ctx||'bank' } }));
}

/* ---------- header ---------- */
function dayStreak(){
  var set = {}; STATE.days.forEach(function(d){ set[d] = 1; });
  var n = 0, d = new Date();
  for(;;){ var k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(set[k]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
function renderHeaderStats(){
  var seenCount = QUESTIONS.filter(function(q){ return STATE.seen[q.id]; }).length;
  var el = document.getElementById('progressSummary'); if(el) el.textContent = seenCount + '/' + QUESTIONS.length;
  var sp = document.getElementById('streakPill'); if(sp){ var n = dayStreak(); sp.textContent = n + ' day streak'; }
  var cd = document.getElementById('countdownPill');
  if(cd){
    var ex = new Date(EXAM_DATE + 'T08:00:00'); var now = new Date();
    var days = Math.ceil((ex - now) / 864e5);
    cd.textContent = days > 1 ? (days + ' days to exam') : days === 1 ? 'Exam tomorrow' : days === 0 ? 'Exam day!' : 'Exam done';
  }
}

/* ---------- question card renderer (shared by every mode) ---------- */
var SEQ_STATE = {}, MATCH_STATE = {};
var RENDER_SEQ = 0;
function qCardHTML(q, opts){
  opts = opts || {};
  var rid = 'r' + (++RENDER_SEQ);
  var body = '';
  if(q.type === 'mcq'){
    body += '<div class="qcard-choices">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="mcq" data-idx="'+i+'" data-answer="'+(i===q.answer?1:0)+'">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div>';
  } else if(q.type === 'sequence'){
    SEQ_STATE[rid] = { picks:[] };
    body += '<div class="qcard-hint">Tap the steps in order, first to last.</div><div class="qcard-seq-steps">';
    shuffled(q.steps.map(function(s,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="seq" data-step-idx="'+i+'">'+escHtml(q.steps[i])+'</button>';
    });
    body += '</div>';
  } else if(q.type === 'match'){
    MATCH_STATE[rid] = { sel:null, matched:0, errors:0 };
    body += '<div class="qcard-hint">Tap an item on the left, then its partner on the right.</div><div class="qcard-match-cols"><div class="qcard-match-col">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-act="match" data-side="left" data-pair-idx="'+i+'">'+escHtml(q.pairs[i][0])+'</button>'; });
    body += '</div><div class="qcard-match-col">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-act="match" data-side="right" data-pair-idx="'+i+'">'+escHtml(q.pairs[i][1])+'</button>'; });
    body += '</div></div>';
  }
  var seen = STATE.seen[q.id];
  var status = seen ? (seen.last ? '<span class="src-chip" style="color:var(--good)">last: right</span>' : '<span class="src-chip" style="color:var(--bad)">last: missed</span>') : '';
  return '<div class="qcard tag-'+tagOf(q.lec)+'" data-qid="'+q.id+'" data-rid="'+rid+'" data-qtype="'+q.type+'"'+(opts.ctx?' data-ctx="'+opts.ctx+'"':'')+'>' +
    '<div class="qcard-top">'+lecChip(q.lec)+'<span class="src-chip">'+escHtml(SRC_LABEL[q.src]||q.src)+'</span>'+status+'</div>' +
    '<p class="qcard-stem">'+escHtml(q.stem)+'</p>' + body +
    '<div class="qcard-explain" data-role="explain"><span class="qcard-verdict"></span>'+(q.type==='sequence' ? '<b>Order:</b> '+q.steps.map(function(s,i){ return (i+1)+'. '+escHtml(s); }).join(' → ')+'<br>' : '')+escHtml(q.ex)+
      '<div class="qcard-classdata-row"><span class="qcard-classdata-result" data-role="classdata-result">Loading class data…</span></div></div>' +
  '</div>';
}
function finishCard(card, correct){
  card.classList.add('is-answered');
  var v = card.querySelector('.qcard-verdict'); if(v){ v.textContent = correct ? 'Correct.' : 'Not quite.'; v.className = 'qcard-verdict ' + (correct ? 'ok' : 'bad'); }
  var q = QUESTIONS_BY_ID[card.getAttribute('data-qid')];
  if(q) recordAnswer(q.id, q.lec, correct, card.getAttribute('data-ctx') || 'bank');
}
function wireQuestionContainer(container){
  if(container.__wired) return; container.__wired = true;
  container.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]'); if(!btn || btn.disabled) return;
    var card = btn.closest('.qcard'); if(!card || card.classList.contains('is-answered')) return;
    var q = QUESTIONS_BY_ID[card.getAttribute('data-qid')]; if(!q) return;
    var rid = card.getAttribute('data-rid');
    var act = btn.getAttribute('data-act');
    if(act === 'mcq'){
      var ok = btn.getAttribute('data-answer') === '1';
      card.querySelectorAll('.qcard-choice').forEach(function(b){ b.disabled = true; if(b.getAttribute('data-answer') === '1') b.classList.add('is-correct'); });
      if(!ok) btn.classList.add('is-wrong');
      finishCard(card, ok);
    } else if(act === 'seq'){
      var st = SEQ_STATE[rid]; if(!st) return;
      st.picks.push(+btn.getAttribute('data-step-idx'));
      btn.disabled = true; btn.classList.add('is-picked');
      btn.insertAdjacentHTML('afterbegin', '<span class="ord">'+st.picks.length+'</span>');
      if(st.picks.length === q.steps.length){
        var good = st.picks.every(function(v,i){ return v === i; });
        card.querySelectorAll('[data-act="seq"]').forEach(function(b){ var i = +b.getAttribute('data-step-idx'); var pos = st.picks.indexOf(i); b.classList.remove('is-picked'); b.classList.add(pos === i ? 'is-correct' : 'is-wrong'); });
        finishCard(card, good);
      }
    } else if(act === 'match'){
      var ms = MATCH_STATE[rid]; if(!ms || btn.classList.contains('is-matched')) return;
      var side = btn.getAttribute('data-side');
      if(side === 'left'){ card.querySelectorAll('.qcard-match-item[data-side="left"]').forEach(function(b){ b.classList.remove('is-selected'); }); btn.classList.add('is-selected'); ms.sel = +btn.getAttribute('data-pair-idx'); return; }
      if(ms.sel === null) return;
      var r = +btn.getAttribute('data-pair-idx');
      var leftBtn = card.querySelector('.qcard-match-item[data-side="left"][data-pair-idx="'+ms.sel+'"]');
      if(r === ms.sel){
        btn.classList.add('is-matched'); leftBtn.classList.add('is-matched'); leftBtn.classList.remove('is-selected'); btn.disabled = true; leftBtn.disabled = true;
        ms.matched++; ms.sel = null;
        if(ms.matched === q.pairs.length) finishCard(card, ms.errors === 0);
      } else {
        ms.errors++; btn.classList.remove('is-wrong'); void btn.offsetWidth; btn.classList.add('is-wrong');
      }
    }
  });
}

}

function bankFiltered(search){
  var s = (search||'').toLowerCase().trim();
  return QUESTIONS.filter(function(q){
    if(STATE.ui.qlec !== 'all' && q.lec !== STATE.ui.qlec) return false;
    if(STATE.ui.qsrc !== 'all' && q.src !== STATE.ui.qsrc) return false;
    var seen = STATE.seen[q.id];
    if(STATE.ui.qstatus === 'unseen' && seen) return false;
    if(STATE.ui.qstatus === 'missed' && !(seen && seen.last === false)) return false;
    if(s){ var hay = (q.stem + ' ' + (q.choices||q.steps||[]).join(' ') + ' ' + (q.pairs ? q.pairs.map(function(p){return p.join(' ');}).join(' ') : '') + ' ' + q.ex).toLowerCase(); if(hay.indexOf(s) === -1) return false; }
    return true;
  });
}
var bankSearch = '';
function renderBank(body){
  var lecOpts = '<option value="all">All lectures</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+(STATE.ui.qlec===l.id?' selected':'')+'>L'+l.num+' '+escHtml(l.title)+'</option>'; }).join('');

/* ===================================================================
   REVIEW (grouped reference)
   =================================================================== */
function sectionCount(sec){
  if(sec.type === 'cards' || sec.type === 'list') return sec.items.length;
  if(sec.type === 'table') return sec.rows.length;
  if(sec.type === 'flows') return SEQUENCES.length;
  return 0;
}
function groupCount(g){ return g.sections.reduce(function(n, s){ return n + sectionCount(s); }, 0); }
function hl(text, term){
  var safe = escHtml(text);
  if(!term) return safe;
  var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}
function cardHTML(c, term){
  return '<div class="rv-card tag-'+tagOf(c.lec)+'"><h4>'+hl(c.name, term)+'</h4>'+(c.sub?'<div class="sub">'+hl(c.sub, term)+'</div>':'')+
    '<dl>'+c.facts.map(function(f){ return '<dt>'+escHtml(f[0])+'</dt><dd>'+hl(f[1], term)+'</dd>'; }).join('')+'</dl>'+
    (c.tip?'<div class="rv-tip">'+icon('bulb')+escHtml(c.tip)+'</div>':'')+
    '<div>'+lecChip(c.lec)+'</div></div>';
}
function tableHTML(sec, rows, term){
  return '<div class="rv-table-wrap"><table class="rv-table"><thead><tr>'+sec.head.map(function(h){ return '<th>'+escHtml(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr>'+r.map(function(cell, i){
      if(sec.head[i] === 'Lecture' && LECTURE_BY_ID[cell]) return '<td>'+lecChip(cell)+'</td>';
      return '<td>'+hl(cell, term)+'</td>'; }).join('')+'</tr>'; }).join('')+
  '</tbody></table></div>';
}
function flowsHTML(seqs, term){
  return '<div class="flows">' + seqs.map(function(s){
    return '<div class="flow tag-'+tagOf(s.lec)+'"><h4>'+hl(s.title, term)+' '+lecChip(s.lec)+'</h4><ol>'+s.steps.map(function(st, i){ return '<li><span class="st"><b>'+(i+1)+'</b><span>'+hl(st, term)+'</span></span></li>'; }).join('')+'</ol></div>';
  }).join('') + '</div>';
}
function sectionHTML(sec, term){
  var t = term ? term.toLowerCase() : '';
  function m(s){ return !t || String(s).toLowerCase().indexOf(t) !== -1; }
  var inner = '';
  if(sec.type === 'cards'){
    var items = sec.items.filter(function(c){ return m(c.name) || m(c.sub) || c.facts.some(function(f){ return m(f[0]) || m(f[1]); }) || m(c.tip); });
    if(!items.length) return '';
    inner = '<div class="rv-cards">' + items.map(function(c){ return cardHTML(c, term); }).join('') + '</div>';
  } else if(sec.type === 'table'){
    var rows = sec.rows.filter(function(r){ return r.some(m); });
    if(!rows.length) return '';
    inner = tableHTML(sec, rows, term);
  } else if(sec.type === 'list'){
    var li = sec.items.filter(m); if(!li.length) return '';
    inner = '<ul class="rv-list">' + li.map(function(x){ return '<li>'+hl(x, term)+'</li>'; }).join('') + '</ul>';
  } else if(sec.type === 'flows'){
    var seqs = SEQUENCES.filter(function(s){ return m(s.title) || s.steps.some(m); }); if(!seqs.length) return '';
    inner = flowsHTML(seqs, term);
  }
  return '<section class="rv-section">' + (sec.title ? '<h3>'+escHtml(sec.title)+'</h3>' : '') + inner + '</section>';
}
var reviewSearch = '';

  document.getElementById('rvRecall').addEventListener('click', function(){ STATE.ui.recall = !STATE.ui.recall; saveState(); renderReview(); });

/* ===================================================================
   MOCK EXAM: 40 MCQs, new material only, weighted like the real exam
   (Dr. Herr said L20 contributes 4 questions; the rest split ~evenly)
   =================================================================== */
var MOCK_BLUEPRINT = { nutrition:5, joints:4, cartilage:4, bone:4, bonedev:5, autoimmune:5, hereditary:5, drugs:4, tumors:4 };
function buildMock(){
  var ids = [];
  Object.keys(MOCK_BLUEPRINT).forEach(function(lec){
    var pool = (QUESTIONS_BY_LECTURE[lec]||[]).filter(function(q){ return q.type === 'mcq'; });
    var fresh = shuffled(pool.filter(function(q){ return !STATE.seen[q.id] || STATE.seen[q.id].last === false; }));
    var rest = shuffled(pool.filter(function(q){ return fresh.indexOf(q) === -1; }));
    fresh.concat(rest).slice(0, MOCK_BLUEPRINT[lec]).forEach(function(q){ ids.push(q.id); });
  });
  STATE.mock = { ids: shuffled(ids), t0: Date.now(), res: {} };
  saveState();
}
var mockTimer = null;
function renderMock(body){
  clearInterval(mockTimer);
  var m = STATE.mock;
  var total = Object.keys(MOCK_BLUEPRINT).reduce(function(n,k){ return n + MOCK_BLUEPRINT[k]; }, 0);
  if(!m || !m.ids || !m.ids.length){
    body.innerHTML = '<div class="reading" style="max-width:760px"><h2>Mock Exam</h2><p>'+total+' multiple-choice questions, the same length as Exam 3, drawn only from the new Exam 3 lectures (L19–L27). Weighting follows the real exam: 4 from Joint Diseases (Dr. Herr said four) and 4–5 from each other lecture. Questions you haven\'t seen or missed last time are picked first.</p><p>A clock runs so you can pace yourself (about a minute per question). Your score and a per-lecture breakdown appear when you finish, and every answer counts toward your progress and class stats.</p><div class="reading-actions"><button type="button" class="btn primary" id="mockStart">Start a '+total+'-question mock</button></div></div>';
    document.getElementById('mockStart').onclick = function(){ buildMock(); renderMock(body); };
    return;
  }
  var answered = Object.keys(m.res).length, correct = Object.keys(m.res).filter(function(k){ return m.res[k]; }).length;
  var done = answered >= m.ids.length;
  var h = '<div class="qfilters" style="padding:4px 0"><span class="pill" id="mockClock">0:00</span><span class="pill">'+answered+' / '+m.ids.length+' answered</span>'+(done?'<span class="pill countdown">Score '+correct+' / '+m.ids.length+' · '+Math.round(correct/m.ids.length*100)+'%</span>':'')+'<button type="button" class="btn" id="mockNew">New mock</button></div>';
  if(done){
    h += '<div class="rv-table-wrap" style="margin-bottom:24px"><table class="rv-table"><thead><tr><th>Lecture</th><th>Correct</th><th>Score</th></tr></thead><tbody>' +
      Object.keys(MOCK_BLUEPRINT).map(function(lec){
        var qs = m.ids.filter(function(id){ return QUESTIONS_BY_ID[id] && QUESTIONS_BY_ID[id].lec === lec; });
        var c = qs.filter(function(id){ return m.res[id]; }).length;
        return '<tr><td>'+lecChip(lec)+'</td><td>'+c+' / '+qs.length+'</td><td>'+(qs.length?Math.round(c/qs.length*100):0)+'%</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  h += '<div class="qlist" id="mockList">' + m.ids.map(function(id, i){
    var q = QUESTIONS_BY_ID[id]; if(!q) return '';
    return '<div><div class="qcount" style="margin:0 0 4px">Question '+(i+1)+'</div>' + qCardHTML(q, { ctx:'mock' }) + '</div>';
  }).join('') + '</div>';
  body.innerHTML = h;
  var list = document.getElementById('mockList'); wireQuestionContainer(list);
  /* restore answered cards so a reload doesn't wipe progress */
  m.ids.forEach(function(id){
    if(!(id in m.res)) return;
    var card = list.querySelector('.qcard[data-qid="'+id+'"]'); if(!card) return;
    card.classList.add('is-answered');
    card.querySelectorAll('.qcard-choice').forEach(function(b){ b.disabled = true; if(b.getAttribute('data-answer') === '1') b.classList.add('is-correct'); });
    var v = card.querySelector('.qcard-verdict'); if(v){ v.textContent = m.res[id] ? 'Correct.' : 'Missed.'; v.className = 'qcard-verdict ' + (m.res[id] ? 'ok' : 'bad'); }
  });
  document.getElementById('mockNew').onclick = function(){ STATE.mock = null; saveState(); renderMock(body); };
  var clock = document.getElementById('mockClock');
  function tick(){ if(!document.body.contains(clock)){ clearInterval(mockTimer); return; } var end = m.tEnd || Date.now(); var s = Math.floor((end - m.t0)/1000); clock.textContent = '⏱ ' + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
  tick(); if(!done) mockTimer = setInterval(tick, 1000);
}
document.addEventListener('msk3:answered', function(e){
  var d = e.detail; if(d.ctx !== 'mock' || !STATE.mock) return;
  if(STATE.mock.ids.indexOf(d.qid) === -1 || (d.qid in STATE.mock.res)) return;
