  /* =================================================================== SORT STORM */
  function SortStorm(){
    var g = GAMES[0], root, stage, cardEl, bins, raf = null, last = 0;
    var st = null;
    function pickSet(){
      var choice = STATE.arcade.sortSet;
      if(choice !== 'mix'){ var s = SORT_SETS.filter(function(x){ return x.id === choice; })[0]; if(s) return s; }
      var pool = SORT_SETS.filter(function(x){ return !st || !st.set || x.id !== st.set.id; });
      return pool[Math.floor(Math.random()*pool.length)];
    }
    function newWave(){
      st.set = pickSet(); st.queue = shuffled(st.set.items).slice(0, 8); st.wave++;
      bins.forEach(function(b, i){ b.querySelector('span').textContent = st.set.bins[i]; });
      root.querySelector('.ss-banner').textContent = st.set.title.toUpperCase();
    }
    function nextCard(){
      if(!st.queue.length) newWave();
      st.cur = st.queue.shift(); st.y = 46; st.busy = false;
      cardEl.className = 'ss-card'; cardEl.style.transition = 'none'; cardEl.style.opacity = '1';
      cardEl.textContent = st.cur[0];
      cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
    }
    function floorY(){ return stage.clientHeight - 130 - cardEl.offsetHeight; }
    function pop(txt, color, x, y){ var p = document.createElement('div'); p.className = 'ss-pop'; p.style.color = color; p.style.left = x + 'px'; p.style.top = y + 'px'; p.textContent = txt; stage.appendChild(p); setTimeout(function(){ p.remove(); }, 800); }
    function judge(binIdx){
      if(!st || !st.running || st.busy || !st.cur) return;
      st.busy = true;
      var ok = binIdx === st.cur[1];
      var bin = bins[binIdx < 0 ? st.cur[1] : binIdx];
      if(binIdx >= 0){
        var dx = binIdx === 0 ? -stage.clientWidth/4 : stage.clientWidth/4;
        cardEl.style.transition = 'transform .22s ease-in, opacity .22s';
        cardEl.style.transform = 'translate(calc(-50% + '+dx+'px),' + (stage.clientHeight - 100) + 'px) scale(.6)';
        cardEl.style.opacity = '.2';
      }
      if(ok){
        st.combo++; st.correct++;
        var pts = 50 + Math.round(50 * Math.max(0, 1 - st.y / floorY())) ;
        pts *= (1 + Math.floor(st.combo / 4));
        st.score += pts; sGood();
        bin.classList.add('flash-good'); pop('+' + pts + (st.combo >= 4 ? ' x' + (1 + Math.floor(st.combo/4)) : ''), '#7ee36b', bin.offsetLeft + 20, bin.offsetTop - 20);
        if(st.correct % 6 === 0){ st.level++; st.speed += 9; pop('SPEED UP!', '#ffd23f', stage.clientWidth/2 - 50, 80); }
      } else {
        st.combo = 0; st.lives--; sBad();
        (binIdx >= 0 ? bins[binIdx] : bins[st.cur[1]]).classList.add('flash-bad');
        st.missed.push({ q: st.cur[0] + ' (' + st.set.title.replace('?','') + ')', a: st.set.bins[st.cur[1]] });
        pop(binIdx < 0 ? 'TOO SLOW' : 'MISS', '#ff5c8a', stage.clientWidth/2 - 30, st.y + 40);
      }
      hud(root, { score: st.score, lives: hearts(st.lives), level: st.level });
      setTimeout(function(){
        bins.forEach(function(b){ b.classList.remove('flash-good','flash-bad'); });
        if(!st || !st.running) return;
        if(st.lives <= 0) return over();
        nextCard();
      }, binIdx < 0 ? 450 : 260);
    }
    function loop(t){
      if(!st || !st.running) return;
      var dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
      if(!st.busy && st.cur){
        st.y += (st.fast ? st.speed * 4 : st.speed) * dt;
        cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
        if(st.y >= floorY()) judge(-1);
      }
      raf = requestAnimationFrame(loop);
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      st = { running:true, score:0, lives:3, level:1, combo:0, correct:0, speed:52, wave:0, set:null, queue:[], missed:[], fast:false };
      hud(root, { score:0, lives:hearts(3), level:1 });
      newWave(); nextCard(); last = 0; raf = requestAnimationFrame(loop);
    }
    function over(){
      st.running = false; cancelAnimationFrame(raf);
      var best = finish(g, st.score);
      stage.insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){
      if(!st || !st.running) { if((e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } return; }
      if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ e.preventDefault(); judge(0); }
      else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ e.preventDefault(); judge(1); }
      else if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){ e.preventDefault(); st.fast = true; }
    }
    function onKeyUp(e){ if(st && (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S')) st.fast = false; }
    return {
      mount: function(p){
        var opts = '<option value="mix"'+(STATE.arcade.sortSet==='mix'?' selected':'')+'>Shuffle all sorts</option>' + SORT_SETS.map(function(s){ return '<option value="'+s.id+'"'+(STATE.arcade.sortSet===s.id?' selected':'')+'>'+escHtml(s.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="ssSet">Sort:</label><select id="ssSet">'+opts+'</select>',
          '<div class="gm-stage ss-stage"><div class="ss-banner"></div><div class="ss-card" id="ssCard"></div><div class="ss-danger"></div><div class="ss-bins"><button type="button" class="ss-bin" style="--bc:var(--ar-yellow)" data-bin="0"><span></span><kbd>← / A</kbd></button><button type="button" class="ss-bin" style="--bc:var(--ar-pink)" data-bin="1"><span></span><kbd>→ / D</kbd></button></div>' +
            overlayHTML(g, 'SORT STORM', 'Each card belongs in one of two bins. Press ← or → (or tap a bin) before it crosses the dashed line. Hold ↓ to drop faster for bonus points. Streaks of 4 multiply your score.', 'START') + '</div>',
          '<kbd>←</kbd> <kbd>→</kbd> sort · <kbd>↓</kbd> fast drop · tap a bin on mobile');
        root = p.querySelector('.gm'); stage = p.querySelector('.ss-stage'); cardEl = p.querySelector('#ssCard'); bins = [].slice.call(p.querySelectorAll('.ss-bin'));
        var preview = SORT_SETS.filter(function(s){ return s.id === STATE.arcade.sortSet; })[0] || SORT_SETS[0];
        bins.forEach(function(b,i){ b.querySelector('span').textContent = preview.bins[i]; });
        cardEl.textContent = '?';
        bindCommon(root);
        stage.addEventListener('click', function(e){ var b = e.target.closest('[data-bin]'); if(b) judge(+b.getAttribute('data-bin')); if(e.target.closest('[data-start]')) start(); });
        p.querySelector('#ssSet').addEventListener('change', function(e){ STATE.arcade.sortSet = e.target.value; saveState(); if(st && st.running){ st.set = null; st.queue = []; } var s = SORT_SETS.filter(function(x){ return x.id === e.target.value; })[0]; if(s) bins.forEach(function(b,i){ b.querySelector('span').textContent = s.bins[i]; }); });
        document.addEventListener('keydown', onKey); document.addEventListener('keyup', onKeyUp);
      },
      stop: function(){ if(st) st.running = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onKeyUp); }
    };
  }

  /* =================================================================== OSTEO SNAKE */
  function Snake(){
    var g = GAMES[1], root, canvas, ctx, legend, promptEl, timer = null;
    var COLS = 18, ROWS = 12, CELL = 32;
    var FOOD_COLORS = ['#ffd23f','#ff5c8a','#3fe0d0','#a98bff'], LETTERS = ['A','B','C','D'];
    var st = null;
    function pool(){
      var lec = STATE.arcade.snakeLec;
      return QUESTIONS.filter(function(q){
        if(q.type !== 'mcq' || q.choices.length < 4) return false;
        if(lec !== 'all' && q.lec !== lec) return false;
        if(q.stem.length > 230) return false;
        return q.choices.every(function(c){ return c.length <= 64; });
      });
    }
    function freeCell(avoid){
      for(var tries=0; tries<400; tries++){
        var x = Math.floor(Math.random()*COLS), y = Math.floor(Math.random()*ROWS);
        if(st.snake.some(function(s){ return s.x===x && s.y===y; })) continue;
        if(avoid.some(function(f){ return Math.abs(f.x-x) + Math.abs(f.y-y) < 3; })) continue;
        var h = st.snake[0]; if(Math.abs(h.x-x) + Math.abs(h.y-y) < 4) continue;
        return { x:x, y:y };
      }
      return { x:0, y:0 };
    }
    function nextQuestion(){
      if(!st.deck.length) st.deck = shuffled(pool());
      var q = st.deck.shift(); st.q = q; st.answered = false;
      var wrong = shuffled(q.choices.slice(1)).slice(0, 3);
      var opts = shuffled([{ text:q.choices[0], right:true }].concat(wrong.map(function(t){ return { text:t, right:false }; })));
      st.foods = [];
      opts.forEach(function(o, i){ var c = freeCell(st.foods); st.foods.push({ x:c.x, y:c.y, text:o.text, right:o.right, i:i }); });
      promptEl.innerHTML = lecChip(q.lec) + '<span>' + escHtml(q.stem) + '</span>';
      legend.innerHTML = st.foods.map(function(f){ return '<div class="sn-opt" data-opt="'+f.i+'"><i style="background:'+FOOD_COLORS[f.i]+'">'+LETTERS[f.i]+'</i><span>'+escHtml(f.text)+'</span></div>'; }).join('');
    }
    function resetSnake(){
      var cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
      st.snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy},{x:cx-3,y:cy}];
      st.dir = {x:1,y:0}; st.queue = []; st.grow = 0;
    }
    function setDir(dx, dy){
      if(!st || !st.running) return;
      var lastDir = st.queue.length ? st.queue[st.queue.length-1] : st.dir;
      if(lastDir.x === -dx && lastDir.y === -dy) return;
      if(lastDir.x === dx && lastDir.y === dy) return;
      if(st.queue.length < 3) st.queue.push({x:dx,y:dy});
    }
    function speed(){ return Math.max(150, 260 - st.correct * 4); }
    function schedule(){ clearTimeout(timer); timer = setTimeout(tick, speed()); }
    function loseLife(msg){
      st.lives--; sBad(); hud(root, { lives: hearts(st.lives, 5) });
      if(st.lives <= 0){ draw(); return over(); }
      st.pausedUntil = Date.now() + 900; st.flash = msg;
    }
    function tick(){
      if(!st || !st.running) return;
      if(st.paused || Date.now() < st.pausedUntil){ draw(); return schedule(); }
      st.flash = null;
      if(st.queue.length) st.dir = st.queue.shift();
      var h = st.snake[0], nx = (h.x + st.dir.x + COLS) % COLS, ny = (h.y + st.dir.y + ROWS) % ROWS;
      if(st.snake.some(function(s, i){ return i < st.snake.length - 1 && s.x === nx && s.y === ny; })){
        loseLife('BONK!'); if(!st.running) return; resetSnake(); draw(); return schedule();
      }
      st.snake.unshift({ x:nx, y:ny });
      var food = st.foods.filter(function(f){ return f.x === nx && f.y === ny; })[0];
      if(food){
        var optEl = legend.querySelector('[data-opt="'+food.i+'"]');
          if(!st.answered){ st.answered = true; recordAnswer(st.q.id, st.q.lec, food.right, 'snake'); }
        if(food.right){
          st.correct++; st.grow += 2; var pts = 100 + st.snake.length * 5; st.score += pts; sGood();
          if(optEl) optEl.classList.add('is-right');
          st.level = 1 + Math.floor(st.correct / 5);
          hud(root, { score: st.score, level: st.level });
          st.pausedUntil = Date.now() + 550;
          setTimeout(function(){ if(st && st.running) nextQuestion(); }, 540);
        } else {
          if(optEl) optEl.classList.add('is-wrong');
          var rightF = st.foods.filter(function(f){ return f.right; })[0];
          var rEl = rightF && legend.querySelector('[data-opt="'+rightF.i+'"]'); if(rEl) rEl.classList.add('is-right');
          st.missed.push({ q: st.q.stem, a: st.q.choices[0] });
          loseLife('WRONG!');
          if(!st.running) return;
          st.pausedUntil = Date.now() + 1500;
          setTimeout(function(){ if(st && st.running) nextQuestion(); }, 1450);
        }
        st.foods = st.foods.filter(function(f){ return f !== food; });
      }
      if(st.grow > 0) st.grow--; else st.snake.pop();
      draw(); schedule();
    }
    function draw(){
      var W = COLS*CELL, H = ROWS*CELL;
      ctx.fillStyle = '#1d1838'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      for(var y=0;y<ROWS;y++) for(var x=0;x<COLS;x++) if((x+y)%2===0) ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
      if(!st) return;
      canvas.setAttribute('data-state', JSON.stringify({ head:st.snake[0], dir:st.dir, foods:st.foods.map(function(f){ return { x:f.x, y:f.y, right:f.right }; }) }));
      st.foods.forEach(function(f){
        var cx = f.x*CELL + CELL/2, cy = f.y*CELL + CELL/2;
        ctx.fillStyle = FOOD_COLORS[f.i]; ctx.beginPath(); ctx.arc(cx, cy, CELL*0.42, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#120f24'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(LETTERS[f.i], cx, cy + 1);
      });
      st.snake.forEach(function(s, i){
        ctx.fillStyle = i === 0 ? '#b6ff9e' : (i % 2 ? '#7ee36b' : '#6cd45a');
        var pad = i === 0 ? 1 : 3;
        roundRect(s.x*CELL + pad, s.y*CELL + pad, CELL - pad*2, CELL - pad*2, 7);
      });
      var hd = st.snake[0];
      ctx.fillStyle = '#120f24';
      var ex = st.dir.x, ey = st.dir.y, cx0 = hd.x*CELL + CELL/2, cy0 = hd.y*CELL + CELL/2;
      var px = -ey, py = ex;
      ctx.beginPath(); ctx.arc(cx0 + ex*5 + px*5, cy0 + ey*5 + py*5, 2.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx0 + ex*5 - px*5, cy0 + ey*5 - py*5, 2.6, 0, Math.PI*2); ctx.fill();
      if(st.flash || st.paused){
        ctx.fillStyle = 'rgba(18,15,36,.55)'; ctx.fillRect(0, H/2 - 30, W, 60);
        ctx.fillStyle = st.paused ? '#ffd23f' : '#ff5c8a'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(st.paused ? 'PAUSED' : st.flash, W/2, H/2);
      }
    }
    function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); ctx.fill(); }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      if(!pool().length){ toast('No snake-sized questions for that lecture yet'); return; }
      st = { running:true, score:0, lives:5, level:1, correct:0, deck:shuffled(pool()), missed:[], foods:[], pausedUntil:Date.now() + 1200, paused:false };
      resetSnake(); nextQuestion();
      hud(root, { score:0, lives:hearts(5), level:1 });
      draw(); schedule();
    }
    function over(){
      st.running = false; clearTimeout(timer);
      var best = finish(g, st.score);
      root.querySelector('.gm-stage').insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){
      var k = e.key;
      if(!st || !st.running){ if((k === 'Enter' || k === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } return; }
      if(k === 'ArrowUp' || k === 'w' || k === 'W'){ e.preventDefault(); setDir(0,-1); }
      else if(k === 'ArrowDown' || k === 's' || k === 'S'){ e.preventDefault(); setDir(0,1); }
      else if(k === 'ArrowLeft' || k === 'a' || k === 'A'){ e.preventDefault(); setDir(-1,0); }
      else if(k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); setDir(1,0); }
      else if(k === ' ' || k === 'p' || k === 'P'){ e.preventDefault(); st.paused = !st.paused; draw(); }
    }
    return {
      mount: function(p){
        var opts = '<option value="all">All lectures</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+(STATE.arcade.snakeLec===l.id?' selected':'')+'>L'+l.num+' '+escHtml(l.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="snLec">Questions from:</label><select id="snLec">'+opts+'</select>',
          '<div class="sn-prompt" id="snPrompt">Press START, then steer with the arrow keys.</div>' +
          '<div class="gm-stage sn-board"><canvas class="sn-canvas" id="snCanvas" width="'+(COLS*CELL)+'" height="'+(ROWS*CELL)+'"></canvas>' +
            overlayHTML(g, 'OSTEO SNAKE', 'Read the clue above the board. Four lettered dots match the four answers listed below it. Eat the right one to grow and score. The snake moves slowly and wraps around the edges, so only a wrong bite or running into yourself costs one of your five lives. Space pauses.', 'START') + '</div>' +
          '<div class="sn-legend" id="snLegend"></div>' +
          '<div class="sn-pad"><button type="button" class="up" data-dir="0,-1" aria-label="Up">'+icon('up')+'</button><button type="button" class="left" data-dir="-1,0" aria-label="Left">'+icon('left')+'</button><button type="button" class="down" data-dir="0,1" aria-label="Down">'+icon('down')+'</button><button type="button" class="right" data-dir="1,0" aria-label="Right">'+icon('right')+'</button></div>',
          '<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or WASD steer · <kbd>Space</kbd> pause · swipe on mobile');
        root = p.querySelector('.gm'); canvas = p.querySelector('#snCanvas'); ctx = canvas.getContext('2d'); legend = p.querySelector('#snLegend'); promptEl = p.querySelector('#snPrompt');
        bindCommon(root); draw();
        root.querySelector('.gm-stage').addEventListener('click', function(e){ if(e.target.closest('[data-start]')) start(); });
        root.querySelectorAll('[data-dir]').forEach(function(b){ b.addEventListener('click', function(){ var d = b.getAttribute('data-dir').split(','); setDir(+d[0], +d[1]); }); });
        var sx = 0, sy = 0;
        canvas.addEventListener('touchstart', function(e){ var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive:true });
        canvas.addEventListener('touchend', function(e){ var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; if(Math.max(Math.abs(dx), Math.abs(dy)) < 18) return; if(Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1); });
        p.querySelector('#snLec').addEventListener('change', function(e){ STATE.arcade.snakeLec = e.target.value; saveState(); if(st && st.running){ st.deck = shuffled(pool()); } });
        document.addEventListener('keydown', onKey);
      },
      stop: function(){ if(st) st.running = false; clearTimeout(timer); document.removeEventListener('keydown', onKey); }
    };
  }

  /* =================================================================== STACK ATTACK */
  function StackAttack(){
    var g = GAMES[2], root, stage, belt, tower, raf = null, last = 0;
    var BLOCK_COLORS = ['#ffd23f','#ff9b3f','#ff5c8a','#a98bff','#3fe0d0','#7ee36b','#ffb3c7'];
    var st = null;
    function pickSeq(){
      var c = STATE.arcade.stackSet;
      if(c !== 'mix'){ var s = SEQUENCES.filter(function(x){ return x.id === c; })[0]; if(s) return s; }
      if(!st.deck.length) st.deck = shuffled(SEQUENCES);
      return st.deck.shift();
    }
    function newRound(){
      st.seq = pickSeq(); st.next = 0; st.errorsThisRound = 0;
      st.limit = 5.5 * st.seq.steps.length + 4; st.time = st.limit;
      tower.innerHTML = '<div class="sa-base"></div><div class="sa-empty">BUILD FROM THE BOTTOM UP</div>';
      root.querySelector('#saTitle').innerHTML = escHtml(st.seq.title) + ' ' + lecChip(st.seq.lec);
      var order = shuffled(st.seq.steps.map(function(s,i){ return i; }));
      belt.innerHTML = '';
      var w = stage.clientWidth;
      st.items = order.map(function(stepIdx, k){
        var el = document.createElement('button'); el.type = 'button'; el.className = 'sa-item';
        el.innerHTML = '<kbd>'+(k+1)+'</kbd><span>'+escHtml(st.seq.steps[stepIdx])+'</span>';
        el.setAttribute('data-k', k);
        belt.appendChild(el);
        return { el:el, stepIdx:stepIdx, key:k+1, x:0, w:0, gone:false };
      });
      var gap = 26, x = w * 0.15;
      st.items.forEach(function(it){ it.w = it.el.offsetWidth; it.x = x; x += it.w + gap; });
      st.loop = Math.max(x, w + 240);
      updateNext();
    }
    function updateNext(){ root.querySelector('#saNext').textContent = 'STEP ' + (st.next + 1) + ' OF ' + st.seq.steps.length; }
    function grab(it){

    }); });
    QUESTIONS.filter(function(q){ return q.type === 'match'; }).forEach(function(q){ sets.push({ id:q.id, title:q.stem.replace(/^Match /,'').replace(/\.$/,''), lec:q.lec, pairs:q.pairs }); });
    return sets;
  }

  /* =================================================================== BONE TO PICK (hangman) */
  function hangmanPool(lec){

      if(q.type !== 'mcq') return false;
      if(lec !== 'all' && q.lec !== lec) return false;
      var a = q.choices[0];

    });
  }
  function BoneToPick(){
    var g = GAMES[4], root, stage, st = null, MAXMISS = 6;
    function nextWord(){
      if(!st.deck.length) st.deck = shuffled(hangmanPool(STATE.arcade.hangLec));
      st.q = st.deck.shift(); st.word = st.q.choices[0].toUpperCase(); st.guessed = {}; st.miss = 0; st.done = false;
      draw();
    }
    function masked(){ return st.word.split('').map(function(ch){ return /[A-Z]/.test(ch) ? (st.guessed[ch] ? ch : '_') : ch; }); }
    function draw(){
      root.querySelector('#hmClue').innerHTML = lecChip(st.q.lec) + '<span>' + escHtml(st.q.stem) + '</span>';
      root.querySelector('#hmWord').innerHTML = masked().map(function(c){ return c === ' ' ? '<i class="sp"></i>' : '<b>'+escHtml(c === '_' ? '' : c)+'</b>'; }).join('');
      root.querySelector('#hmKeys').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function(L){ var used = st.guessed[L]; var cls = used ? (st.word.indexOf(L) !== -1 ? 'hit' : 'miss') : ''; return '<button type="button" class="hm-key '+cls+'" data-l="'+L+'"'+(used?' disabled':'')+'>'+L+'</button>'; }).join('');
      root.querySelector('#hmBone').innerHTML = boneSVG(st.miss);
      root.querySelector('#hmLeft').textContent = (MAXMISS - st.miss) + ' misses left';
    }
    function boneSVG(m){
      /* a skeleton that loses pieces with each miss: skull, spine, 2 arms, 2 legs */
      var parts = [
        '<circle cx="60" cy="22" r="13"/><circle cx="55" cy="20" r="2.5" fill="currentColor"/><circle cx="65" cy="20" r="2.5" fill="currentColor"/>',
        '<path d="M60 36v40"/><path d="M50 46h20M52 54h16M54 62h12"/>',
        '<path d="M60 44L40 64"/>', '<path d="M60 44L80 64"/>',
        '<path d="M60 76L46 104"/>', '<path d="M60 76L74 104"/>'

      return '<svg viewBox="0 0 120 112" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">' + parts.map(function(p, i){ return '<g class="'+(i < MAXMISS - m ? 'on' : 'off')+'">'+p+'</g>'; }).join('') + '</svg>';
    }

      }); });

    function nextQ(){

      var q = st.deck.shift(); st.q = q; st.answered = false;
      var opts = shuffled([{ text:q.choices[0], right:true }].concat(shuffled(q.choices.slice(1)).slice(0,3).map(function(t){ return { text:t, right:false }; })));
      st.enemies = opts.map(function(o, i){ return { lane:i, y:-30 - Math.random()*70, text:o.text, right:o.right, i:i, alive:true, wob:Math.random()*6 }; });
      promptEl.innerHTML = lecChip(q.lec) + '<span>' + escHtml(q.stem) + '</span>';
      legend.innerHTML = st.enemies.map(function(en){ return '<div class="sn-opt" data-opt="'+en.i+'"><i style="background:'+COLORS[en.i]+'">'+LETTERS[en.i]+'</i><span>'+escHtml(en.text)+'</span></div>'; }).join('');
      st.pause = 0.6;
    }
    function fire(){
      if(!st || !st.running || st.cool > 0) return;
      st.bolts.push({ x: st.shipX, y: H - 50 }); st.cool = 0.28; beep(880, .04, 'square', .04);
    }
    function resolve(en, how){
      if(st.answered) return;
      st.answered = true;
      var right = st.enemies.filter(function(e){ return e.right; })[0];
      if(how === 'hit' && en.right){
        recordAnswer(st.q.id, st.q.lec, true, 'blaster');
        st.combo++; st.correct++; var pts = 100 + st.combo * 20 + Math.max(0, Math.round((H - en.y) / 4)); st.score += pts; sGood();
        st.booms.push({ x:laneX(en.lane), y:en.y, t:0, c:'#7ee36b' });
        st.speed = Math.min(78, 26 + st.correct * 2.5);
        hud(root, { score: st.score, level: 1 + Math.floor(st.correct / 5) });
      } else {
        recordAnswer(st.q.id, st.q.lec, false, 'blaster');
        st.combo = 0; st.lives--; sBad();
        if(en) st.booms.push({ x:laneX(en.lane), y:en.y, t:0, c:'#ff5c8a' });
        st.missed.push({ q: st.q.stem, a: st.q.choices[0] });
        hud(root, { lives: hearts(st.lives) });
      }
      legend.querySelectorAll('.sn-opt').forEach(function(o){ var i = +o.getAttribute('data-opt'); if(i === right.i) o.classList.add('is-right'); else if(en && i === en.i && !en.right) o.classList.add('is-wrong'); });
      st.enemies.forEach(function(e){ e.alive = false; });
      setTimeout(function(){ if(!st || !st.running) return; if(st.lives <= 0) return over(); nextQ(); }, how === 'hit' && en.right ? 550 : 1500);
    }
    function loop(t){
      if(!st || !st.running) return;
      var dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
      if(st.paused){ draw(); raf = requestAnimationFrame(loop); return; }
      if(st.keys.left) st.shipX -= 420 * dt; if(st.keys.right) st.shipX += 420 * dt;
      if(st.targetX !== null){ var d = st.targetX - st.shipX; st.shipX += Math.max(-520*dt, Math.min(520*dt, d)); if(Math.abs(d) < 4){ st.shipX = st.targetX; st.targetX = null; if(st.fireOnArrive){ st.fireOnArrive = false; fire(); } } }
      st.shipX = Math.max(30, Math.min(W - 30, st.shipX));
      st.cool -= dt; if(st.pause > 0) st.pause -= dt;
      st.bolts.forEach(function(b){ b.y -= 620 * dt; });
      st.bolts = st.bolts.filter(function(b){ return b.y > -20; });
      if(st.pause <= 0) st.enemies.forEach(function(en){
        if(!en.alive) return;
        en.y += st.speed * dt; en.wob += dt * 3;
        st.bolts.forEach(function(b){ if(en.alive && Math.abs(b.x - laneX(en.lane)) < 36 && Math.abs(b.y - en.y) < 30){ b.y = -99; en.alive = false; resolve(en, 'hit'); } });
        if(en.alive && en.y > H - 70 && en.right){ en.alive = false; resolve(null, 'escaped'); }
        if(en.alive && en.y > H - 70){ en.alive = false; }
      });
      st.booms.forEach(function(b){ b.t += dt; }); st.booms = st.booms.filter(function(b){ return b.t < .5; });
      draw();
      raf = requestAnimationFrame(loop);
    }
    function clast(x, y, color, letter, wob){
      /* a multinucleated osteoclast: lumpy body + several nuclei + ruffled underside */
      ctx.fillStyle = color;
      ctx.beginPath();
      for(var a = 0; a <= Math.PI*2 + .01; a += Math.PI/8){ var r = 26 + Math.sin(a*3 + wob) * 3; var px = x + Math.cos(a) * r * 1.2, py = y + Math.sin(a) * r * .8; if(a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
      ctx.fill();
      ctx.fillStyle = 'rgba(18,15,36,.35)';
      [[-12,-6],[0,-9],[12,-5],[-6,5],[7,6]].forEach(function(n){ ctx.beginPath(); ctx.arc(x+n[0], y+n[1], 3.2, 0, Math.PI*2); ctx.fill(); });
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      for(var i=-24;i<=24;i+=6){ ctx.moveTo(x+i, y+18); ctx.lineTo(x+i+3, y+25); }
      ctx.stroke();
      ctx.fillStyle = '#120f24'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(letter, x, y + 1);
    }
    function draw(){
      ctx.fillStyle = '#1d1838'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
      for(var i=1;i<LANES;i++){ ctx.beginPath(); ctx.moveTo(i*W/LANES, 0); ctx.lineTo(i*W/LANES, H-60); ctx.stroke(); }
      /* bone floor with trabecular holes */
      ctx.fillStyle = '#f1e7d0'; ctx.fillRect(0, H - 40, W, 40);
      ctx.fillStyle = '#d9c9a6'; for(var k=0;k<24;k++){ ctx.beginPath(); ctx.ellipse(15 + k*30, H - 20 + (k%2?6:-6), 8, 5, 0, 0, Math.PI*2); ctx.fill(); }
      if(!st) return;
      st.enemies.forEach(function(en){ if(en.alive) clast(laneX(en.lane), en.y, COLORS[en.i], LETTERS[en.i], en.wob); });
      st.bolts.forEach(function(b){ ctx.fillStyle = '#7ee36b'; ctx.fillRect(b.x - 2, b.y - 12, 4, 14); });
      st.booms.forEach(function(b){ ctx.strokeStyle = b.c; ctx.lineWidth = 3; ctx.globalAlpha = 1 - b.t * 2; ctx.beginPath(); ctx.arc(b.x, b.y, 10 + b.t * 80, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; });
      /* ship: an osteoblast turret */
      var sx = st.shipX, sy = H - 52;
      ctx.fillStyle = '#7ee36b'; ctx.beginPath(); ctx.moveTo(sx, sy - 18); ctx.lineTo(sx + 22, sy + 10); ctx.lineTo(sx - 22, sy + 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#120f24'; ctx.beginPath(); ctx.arc(sx, sy + 2, 4, 0, Math.PI*2); ctx.fill();
      if(st.paused){ ctx.fillStyle = 'rgba(18,15,36,.6)'; ctx.fillRect(0, H/2 - 30, W, 60); ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center'; ctx.fillText('PAUSED', W/2, H/2); }
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      if(!pool().length){ toast('No questions for that lecture yet'); return; }
      st = { running:true, score:0, lives:3, combo:0, correct:0, speed:26, deck:shuffled(pool()), missed:[], enemies:[], bolts:[], booms:[], shipX:W/2, targetX:null, keys:{}, cool:0, pause:0, paused:false };
      hud(root, { score:0, lives:hearts(3), level:1 });
      nextQ(); last = 0; raf = requestAnimationFrame(loop);
    }
    function over(){
      st.running = false; cancelAnimationFrame(raf);
      var best = finish(g, st.score);
      root.querySelector('.gm-stage').insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){
      if(!st || !st.running){ if((e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } return; }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); st.keys.left = true; }
      else if(e.key === 'ArrowRight'){ e.preventDefault(); st.keys.right = true; }
      else if(e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); fire(); }
      else if(e.key === 'p' || e.key === 'P'){ st.paused = !st.paused; }
      else { var L = 'abcd'.indexOf((e.key||'').toLowerCase()); if(L !== -1){ e.preventDefault(); var en = st.enemies.filter(function(x){ return x.i === L; })[0]; if(en){ st.targetX = laneX(en.lane); st.fireOnArrive = true; } } }
    }
    function onKeyUp(e){ if(!st) return; if(e.key === 'ArrowLeft') st.keys.left = false; if(e.key === 'ArrowRight') st.keys.right = false; }
    return {
      mount: function(p){
        var opts = '<option value="all">All lectures</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+(STATE.arcade.blastLec===l.id?' selected':'')+'>L'+l.num+' '+escHtml(l.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="cbLec">Questions from:</label><select id="cbLec">'+opts+'</select>',
          '<div class="sn-prompt" id="cbPrompt">Blast the osteoclast carrying the right answer.</div>' +
          '<div class="gm-stage sn-board"><canvas class="sn-canvas cb-canvas" id="cbCanvas" width="'+W+'" height="'+H+'"></canvas>' +
            overlayHTML(g, 'CLAST BLASTER', 'Four osteoclasts drift down toward the bone, each carrying an answer (A-D, listed under the board). Blast the right one before it reaches the bone. Hitting a wrong one, or letting the right one land, costs a life. Tap a lane on mobile to move there and fire.', 'START') + '</div>' +
          '<div class="sn-legend" id="cbLegend"></div>',
          '<kbd>←</kbd><kbd>→</kbd> move · <kbd>Space</kbd> fire · or press <kbd>A</kbd>–<kbd>D</kbd> to auto-aim · <kbd>P</kbd> pause');
        root = p.querySelector('.gm'); canvas = p.querySelector('#cbCanvas'); ctx = canvas.getContext('2d'); legend = p.querySelector('#cbLegend'); promptEl = p.querySelector('#cbPrompt');
        bindCommon(root); draw();
        root.querySelector('.gm-stage').addEventListener('click', function(e){ if(e.target.closest('[data-start]')) start(); });
        canvas.addEventListener('pointerdown', function(e){
          if(!st || !st.running) return;
          var r = canvas.getBoundingClientRect(); var x = (e.clientX - r.left) / r.width * W;
          var lane = Math.max(0, Math.min(LANES - 1, Math.floor(x / (W / LANES))));
          st.targetX = laneX(lane); st.fireOnArrive = true;
        });
        p.querySelector('#cbLec').addEventListener('change', function(e){ STATE.arcade.blastLec = e.target.value; saveState(); if(st && st.running) st.deck = shuffled(pool()); });
        document.addEventListener('keydown', onKey); document.addEventListener('keyup', onKeyUp);
      },
      stop: function(){ if(st) st.running = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onKeyUp); }
    };
  }

  /* =================================================================== BONE SEARCH (word search on crossword answers) */
  function searchPool(lec){
    return QUESTIONS.filter(function(q){
      if(q.type !== 'mcq') return false;
      if(lec !== 'all' && q.lec !== lec) return false;
      var a = q.choices[0]; if(!/^[A-Za-z ]+$/.test(a)) return false;
      var w = a.replace(/ /g,''); return w.length >= 4 && w.length <= 11 && q.stem.length <= 150;
    });
  }
  function BoneSearch(){
    var g = GAMES[7], root, stage, timer = null, st = null, N = 12;
    var DIRS = [[1,0],[0,1],[1,1],[1,-1]];
    function build(){
      var pool = shuffled(searchPool(STATE.arcade.searchLec)), words = [], grid = [];
      for(var y=0;y<N;y++){ grid.push([]); for(var x=0;x<N;x++) grid[y].push(''); }
      for(var i=0; i<pool.length && words.length < 6; i++){
        var q = pool[i], w = q.choices[0].replace(/ /g,'').toUpperCase();
        if(words.some(function(o){ return o.word === w; })) continue;
        var placed = false;
        for(var tries=0; tries<120 && !placed; tries++){
          var d = DIRS[Math.floor(Math.random()*DIRS.length)], sx = Math.floor(Math.random()*N), sy = Math.floor(Math.random()*N);
          var ex = sx + d[0]*(w.length-1), ey = sy + d[1]*(w.length-1);
          if(ex < 0 || ex >= N || ey < 0 || ey >= N) continue;
          var ok = true;
          for(var k=0;k<w.length;k++){ var c = grid[sy+d[1]*k][sx+d[0]*k]; if(c && c !== w[k]){ ok = false; break; } }
          if(!ok) continue;
          for(k=0;k<w.length;k++) grid[sy+d[1]*k][sx+d[0]*k] = w[k];
          words.push({ word:w, q:q, sx:sx, sy:sy, d:d, found:false }); placed = true;
        }
      }
      var AL = 'ABCDEFGHIJKLMNOPRSTUEAIO';
      for(y=0;y<N;y++) for(x=0;x<N;x++) if(!grid[y][x]) grid[y][x] = AL[Math.floor(Math.random()*AL.length)];
      st.grid = grid; st.words = words; st.sel = null;
      render();
    }
    function render(){
      var gh = '';
      for(var y=0;y<N;y++) for(var x=0;x<N;x++) gh += '<button type="button" class="bs-cell" data-x="'+x+'" data-y="'+y+'">'+st.grid[y][x]+'</button>';
      root.querySelector('#bsGrid').innerHTML = gh;
      root.querySelector('#bsClues').innerHTML = st.words.map(function(w, i){ return '<li data-w="'+i+'" class="'+(w.found?'found':'')+'">'+lecChip(w.q.lec)+'<span class="bs-clue">'+escHtml(w.q.stem)+'</span><b class="bs-ans">'+(w.found ? escHtml(w.q.choices[0]) : w.word.length + ' letters')+'</b></li>'; }).join('');
      st.words.forEach(function(w){ if(w.found) mark(w); });
    }
    function cell(x, y){ return root.querySelector('.bs-cell[data-x="'+x+'"][data-y="'+y+'"]'); }
    function mark(w){ for(var k=0;k<w.word.length;k++){ var c = cell(w.sx + w.d[0]*k, w.sy + w.d[1]*k); if(c) c.classList.add('found'); } }
    function pick(x, y){
      if(!st || !st.running) return;
      if(!st.sel){ st.sel = { x:x, y:y }; cell(x, y).classList.add('sel'); return; }
      var a = st.sel; st.sel = null;
      root.querySelectorAll('.bs-cell.sel').forEach(function(c){ c.classList.remove('sel'); });
      var dx = x - a.x, dy = y - a.y, len = Math.max(Math.abs(dx), Math.abs(dy)) + 1;
      if(!(dx === 0 || dy === 0 || Math.abs(dx) === Math.abs(dy))) { sBad(); return; }
      var ux = Math.sign(dx), uy = Math.sign(dy), s = '';
      for(var k=0;k<len;k++) s += st.grid[a.y + uy*k][a.x + ux*k];
      var rev = s.split('').reverse().join('');
      var w = st.words.filter(function(o){ return !o.found && (o.word === s || o.word === rev); })[0];
      if(w){
        w.found = true; w.sx = a.x; w.sy = a.y; w.d = [ux, uy]; if(w.word === rev){ w.sx = x; w.sy = y; w.d = [-ux, -uy]; }
        st.combo++; var pts = 80 + w.word.length * 15 + st.combo * 10; st.score += pts; sGood();
        hud(root, { score: st.score });
        render();
        if(st.words.every(function(o){ return o.found; })){ st.round++; st.time = Math.min(st.limit, st.time + 45); hud(root, { level: st.round + 1 }); toast('Board cleared!'); setTimeout(function(){ if(st && st.running) build(); }, 700); }
      } else { st.combo = 0; sBad(); }
    }
    function tick(){
      if(!st || !st.running) return;
      st.time -= 0.25;
      root.querySelector('#bsTime i').style.transform = 'scaleX(' + Math.max(0, st.time / st.limit) + ')';
      if(st.time <= 0) return over();
      timer = setTimeout(tick, 250);
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      if(searchPool(STATE.arcade.searchLec).length < 3){ toast('Not enough short answers for that lecture; try All lectures'); return; }
      st = { running:true, score:0, round:0, combo:0, limit:150, time:150, missed:[] };
      hud(root, { score:0, lives:'—', level:1 });
      build(); tick();
    }
    function over(){
      st.running = false; clearTimeout(timer);
      st.words.forEach(function(w){ if(!w.found) st.missed.push({ q: w.q.stem, a: w.q.choices[0] }); });
      var best = finish(g, st.score);
      stage.insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){ if((!st || !st.running) && (e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } }
    return {
      mount: function(p){
        var opts = '<option value="all">All lectures</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+(STATE.arcade.searchLec===l.id?' selected':'')+'>L'+l.num+' '+escHtml(l.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="bsLec">Words from:</label><select id="bsLec">'+opts+'</select>',
          '<div class="gm-stage bs-stage"><div class="mm-head"><h3>Find the answer to every clue</h3><div class="sa-timer" id="bsTime"><i></i></div></div><div class="bs-body"><div class="bs-grid" id="bsGrid"></div><ol class="bs-clues" id="bsClues"></ol></div>' +
            overlayHTML(g, 'BONE SEARCH', 'Six answers are hidden in the letter grid: across, down or diagonal, forward or backward. Read a clue, find its answer, then tap the first and last letter. Clear the board to add time.', 'START') + '</div>',
          'Tap the first letter, then the last letter of a word');
        root = p.querySelector('.gm'); stage = p.querySelector('.bs-stage');
        bindCommon(root);
        stage.addEventListener('click', function(e){ if(e.target.closest('[data-start]')) return start(); var c = e.target.closest('.bs-cell'); if(c) pick(+c.getAttribute('data-x'), +c.getAttribute('data-y')); });
        p.querySelector('#bsLec').addEventListener('change', function(e){ STATE.arcade.searchLec = e.target.value; saveState(); });
        document.addEventListener('keydown', onKey);
      },
      stop: function(){ if(st) st.running = false; clearTimeout(timer); document.removeEventListener('keydown', onKey); }
    };
  }

  /* =================================================================== WHACK-A-CLAST (whack-a-mole on sort sets) */
  function WhackAClast(){
    var g = GAMES[8], root, stage, timer = null, st = null, KEYS = ['1','2','3','4','5','6','7','8','9'];
    function newTarget(){
      var c = STATE.arcade.whackSet;
      var set = SORT_SETS.filter(function(x){ return x.id === c; })[0] || SORT_SETS[Math.floor(Math.random()*SORT_SETS.length)];
      st.set = set; st.bin = Math.floor(Math.random()*set.bins.length); st.popsLeft = 10;
      root.querySelector('#waTarget').innerHTML = 'WHACK ONLY: <b>' + escHtml(set.bins[st.bin]) + '</b><span>' + escHtml(set.title) + '</span>';
    }
    function pop(){
      if(!st || !st.running) return;
      if(st.popsLeft <= 0) newTarget();
      var free = []; for(var i=0;i<9;i++) if(!st.holes[i]) free.push(i);
      if(free.length){
        var h = free[Math.floor(Math.random()*free.length)];
        var targets = st.set.items.filter(function(it){ return it[1] === st.bin; }), others = st.set.items.filter(function(it){ return it[1] !== st.bin; });
        var item = (Math.random() < 0.55 ? targets : others); item = item[Math.floor(Math.random()*item.length)];
        var life = Math.max(1.1, 2.2 - st.level * 0.12);
        st.holes[h] = { text:item[0], ib:item[1], good:item[1] === st.bin, until: Date.now() + life*1000, set:st.set, bin:st.bin };
        st.popsLeft--;
        var el = root.querySelector('.wa-hole[data-h="'+h+'"]');
        el.querySelector('.wa-mole span').textContent = item[0]; el.classList.remove('hit','miss'); el.classList.add('up');
      }
      timer = setTimeout(pop, Math.max(420, 900 - st.level * 55));
    }
    function sweep(){

      var now = Date.now();
      st.holes.forEach(function(m, i){
        if(m && now > m.until){ st.holes[i] = null; root.querySelector('.wa-hole[data-h="'+i+'"]').classList.remove('up'); if(m.good){ st.combo = 0; st.escaped++; } }
      });
      st.sweep = setTimeout(sweep, 100);
    }
    function whack(i){
      if(!st || !st.running) return;
      var m = st.holes[i], el = root.querySelector('.wa-hole[data-h="'+i+'"]');
      if(!m) return;
      st.holes[i] = null; el.classList.remove('up');
      if(m.good){ st.combo++; st.hits++; var pts = 40 + st.combo * 10; st.score += pts; sGood(); el.classList.add('hit'); if(st.hits % 8 === 0){ st.level++; hud(root, { level: st.level }); } }
      else { st.combo = 0; st.lives--; sBad(); el.classList.add('miss'); st.missed.push({ q: m.text + ' (' + m.set.title.replace('?','') + ')', a: m.set.bins[m.ib] }); hud(root, { lives: hearts(st.lives) }); if(st.lives <= 0) return over(); }
      hud(root, { score: st.score });
    }
    function start(){

      root.querySelectorAll('.wa-hole').forEach(function(h){ h.classList.remove('up','hit','miss'); });

    }
    function over(){

      var best = finish(g, st.score);
      stage.insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){
      if(!st || !st.running){ if((e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } return; }
      var k = KEYS.indexOf(e.key); if(k !== -1){ e.preventDefault(); whack(k); }
    }
    return {
      mount: function(p){
        var opts = '<option value="mix">Shuffle all topics</option>' + SORT_SETS.map(function(s){ return '<option value="'+s.id+'"'+(STATE.arcade.whackSet===s.id?' selected':'')+'>'+escHtml(s.title)+'</option>'; }).join('');
        var holes = ''; for(var i=0;i<9;i++) holes += '<button type="button" class="wa-hole" data-h="'+i+'"><kbd>'+KEYS[i]+'</kbd><span class="wa-mole"><span></span></span><span class="wa-pit"></span></button>';
        p.innerHTML = shell(g, '<label for="waSet">Topic:</label><select id="waSet">'+opts+'</select>',
          '<div class="gm-stage wa-stage"><div class="wa-target" id="waTarget">Ready?</div><div class="wa-grid">'+holes+'</div>' +
            overlayHTML(g, 'WHACK-A-CLAST', 'Osteoclasts pop out of the bone carrying a term. The banner tells you which kind to whack (for example, every hypocalcemia sign). Whack the right ones fast; whacking a wrong one costs a life. The target changes every 10 pops.', 'START') + '</div>',
          'Tap a mole, or press <kbd>1</kbd>–<kbd>9</kbd> (top-left to bottom-right)');
        root = p.querySelector('.gm'); stage = p.querySelector('.wa-stage');
        bindCommon(root);
        stage.addEventListener('pointerdown', function(e){ if(e.target.closest('[data-start]')) return; var h = e.target.closest('.wa-hole'); if(h) whack(+h.getAttribute('data-h')); });
        stage.addEventListener('click', function(e){ if(e.target.closest('[data-start]')) start(); });
        p.querySelector('#waSet').addEventListener('change', function(e){ STATE.arcade.whackSet = e.target.value; saveState(); });
        document.addEventListener('keydown', onKey);
      },
      stop: function(){ if(st){ st.running = false; clearTimeout(st.sweep); } clearTimeout(timer); document.removeEventListener('keydown', onKey); }
    };
  }

  return { renderLobby:renderLobby, stopAll:stopAll, startGame:startGame };
})();

/* ---------- theme toggle ---------- */
function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
}
function boot(){
  var saved = null; try{ saved = localStorage.getItem('msk3-theme'); }catch(e){}
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  applyTheme(saved);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = !cur ? 'light' : cur === 'light' ? 'dark' : null;
    try{ if(next) localStorage.setItem('msk3-theme', next); else localStorage.removeItem('msk3-theme'); }catch(e){}
    applyTheme(next);
  });
  document.querySelectorAll('#modeSwitch [data-mode]').forEach(function(b){ b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); }); });
  renderHeaderStats();
  var m = STATE.ui.mode; if(['compendium','review','arcade'].indexOf(m) === -1) m = 'compendium';
  setMode(m);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

/* Published for the shared widget (search + toughest-questions labels) — see widget/v3.js. */
window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id:l.id, title:'L'+l.num+' ' + l.title }; }),
  questions: QUESTIONS.map(function(q){
    var hint = q.type === 'mcq' ? q.choices[q.answer] : q.type === 'sequence' ? q.steps.join(' → ') : q.pairs.map(function(p){ return p.join(': '); }).join('; ');
    if(q.ex) hint += ' — ' + q.ex;
    return { id:q.id, lec:q.lec, text:q.stem, hint:hint };
  })
};

})();
