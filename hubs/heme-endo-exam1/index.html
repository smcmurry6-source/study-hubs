/* ===================================================================
   HEME & ENDO EXAM 1 HUB — tokens
   Palette "H&E": hematoxylin purple on an eosin-blush ground, the colors of every slide in the histology lectures.
   Type: Young Serif (display) · Atkinson Hyperlegible (body) · Spline Sans Mono (labels).
   =================================================================== */
:root{
  color-scheme: light;
  --bg:#f8f4f6; --surface:#fffcfd; --surface-2:#f1eaef; --surface-3:#e6dce4;
  --ink:#241d2e; --ink-soft:#554b62; --ink-faint:#6d6379; --line:#e6dbe3; --line-strong:#cdbfca;
  --accent:#4a3f9e; --accent-ink:#3d338a; --accent-soft:#e4e1f6;
  --good:#2f7a4f; --good-soft:#dcefe2; --bad:#b8322f; --bad-soft:#f7dcd8; --caution:#9a6412; --caution-soft:#f6e8c9;
  --tag-amber:#a8701a; --tag-sage:#57834f; --tag-blue:#2f62a8; --tag-teal:#1f7f78; --tag-violet:#6a4fa5; --tag-red:#b3352d; --tag-green:#4d7a22; --tag-rose:#b9436a; --tag-plum:#8e3f86; --tag-indigo:#3d4fa8;
  --tag-amber-soft:#f5e6c8; --tag-sage-soft:#e1ecdc; --tag-blue-soft:#dce6f4; --tag-teal-soft:#d5ecea; --tag-violet-soft:#e7e0f3; --tag-red-soft:#f6dbd7; --tag-green-soft:#e2ecd2; --tag-rose-soft:#f5dbe3; --tag-plum-soft:#f2dff0; --tag-indigo-soft:#dfe3f6;
  --shadow:0 1px 2px rgba(36,29,46,.06), 0 4px 14px rgba(36,29,46,.07);
  --radius:12px;
  --font-display:'Young Serif', Georgia, serif;
  --font-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'Spline Sans Mono', ui-monospace, Menlo, monospace;
  --font-arcade:'Press Start 2P', 'Courier New', monospace;
  /* Arcade: one fixed world regardless of theme, stained like a slide */
  --ar-bg:#1a1024; --ar-panel:#25163a; --ar-panel-2:#33204d; --ar-ink:#fbf2fa; --ar-dim:#c2a9cf; --ar-line:#4a3166;
  --ar-yellow:#ffd23f; --ar-pink:#ff6fae; --ar-cyan:#7fd8f0; --ar-green:#8fe39b; --ar-orange:#ffa75a; --ar-violet:#b59bff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#15121b; --surface:#1d1925; --surface-2:#262130; --surface-3:#302a3c;
    --ink:#efeaf4; --ink-soft:#c0b7cc; --ink-faint:#9a91a8;--lec-num-ink:#15121b; --line:#352e42; --line-strong:#4a4159;
    --accent:#a99cff; --accent-ink:#bdb3ff; --accent-soft:#2b2550;
    --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
    --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
    --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#15121b; --surface:#1d1925; --surface-2:#262130; --surface-3:#302a3c;
  --ink:#efeaf4; --ink-soft:#c0b7cc; --ink-faint:#9a91a8;--lec-num-ink:#15121b; --line:#352e42; --line-strong:#4a4159;
  --accent:#a99cff; --accent-ink:#bdb3ff; --accent-soft:#2b2550;
  --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
  --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6; --tag-plum:#d98ccf; --tag-indigo:#8d9cf0;
  --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27; --tag-plum-soft:#3a1f37; --tag-indigo-soft:#1f2546;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
/* Young Serif comes in one weight: never fake a bold */
html{font-synthesis:none}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important;} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.mono{font-family:var(--font-mono)}
[hidden]{display:none!important}

/* ---------- header ---------- */
#app{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.hub-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px;padding:12px 20px 0}
.hub-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hub-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.hub-title h1{font-family:var(--font-display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;margin:0}
.hub-subtitle{color:var(--ink-soft);font-size:.86rem}
.hub-back-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;align-self:center;text-decoration:none;transition:border-color .15s,color .15s}
.hub-back-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-back-btn svg{width:16px;height:16px}
.hub-name-pill{appearance:none;cursor:pointer;font-family:var(--font-body);background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.hub-name-pill:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
.pill.countdown{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:30px;cursor:pointer}
#modeSwitch{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
#modeSwitch::-webkit-scrollbar{display:none}
#modeSwitch button{border:0;background:transparent;padding:9px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:7px;white-space:nowrap}
#modeSwitch button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#modeSwitch button:hover{color:var(--ink)}
#modeSwitch .mode-icon{font-size:1.05rem}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{border-bottom-color:var(--ar-pink)}
main{padding-top:20px}
.hub-footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.82rem}

/* ---------- sub-tabs ---------- */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.subtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink-soft)}
.subtab.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border:1px solid var(--caution);background:var(--caution-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.notice b{color:var(--caution)}

/* ---------- lecture notes ---------- */
.notes-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
.lec-nav{display:flex;flex-direction:column;gap:6px;min-width:0;position:sticky;top:66px;align-self:start}
.lec-nav button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;cursor:pointer;min-width:0}
.lec-nav button.is-active{border-color:var(--ink);box-shadow:var(--shadow)}
.lec-num{font-family:var(--font-mono);font-size:.75rem;font-weight:700;padding:2px 6px;border-radius:6px;color:var(--lec-num-ink,#fff);flex:none;margin-top:2px}
.lec-nav .t{font-size:.86rem;font-weight:600;line-height:1.3}
.lec-nav .w{font-size:.74rem;color:var(--ink-faint)}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);min-width:0}
.reading h2{font-family:var(--font-display);font-size:1.6rem;margin:0 0 4px;line-height:1.2}
.reading .meta{color:var(--ink-faint);font-size:.82rem;margin-bottom:16px}
.reading h4{font-family:var(--font-display);font-size:1.12rem;margin:22px 0 6px}
.reading p{margin:0 0 12px;max-width:74ch}
.reading-note{background:var(--caution-soft);border-left:3px solid var(--caution);padding:8px 12px;border-radius:6px;font-size:.88rem}
.reading-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.status-badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.status-badge.taught{background:var(--good-soft);color:var(--good)}
.status-badge.slides{background:var(--caution-soft);color:var(--caution)}

/* tag colors */
.tag-amber{--t:var(--tag-amber);--ts:var(--tag-amber-soft)} .tag-sage{--t:var(--tag-sage);--ts:var(--tag-sage-soft)} .tag-blue{--t:var(--tag-blue);--ts:var(--tag-blue-soft)} .tag-teal{--t:var(--tag-teal);--ts:var(--tag-teal-soft)}
.tag-violet{--t:var(--tag-violet);--ts:var(--tag-violet-soft)} .tag-red{--t:var(--tag-red);--ts:var(--tag-red-soft)} .tag-green{--t:var(--tag-green);--ts:var(--tag-green-soft)} .tag-rose{--t:var(--tag-rose);--ts:var(--tag-rose-soft)}
.lec-num{background:var(--t)}
.lec-chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ts);color:var(--t);white-space:nowrap}

/* ---------- question cards ---------- */
.qfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qfilters select,.qfilters input{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0}
.qfilters input{flex:1 1 200px}
.qcount{color:var(--ink-faint);font-size:.84rem;margin-bottom:10px}
.rv-set{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:var(--accent-soft,var(--surface-2));border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.rv-set b{display:block}
.rv-set span{color:var(--ink-soft)}
.qlist{display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--t, var(--line))}
.qcard-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qcard.is-retry{border-style:dashed}
.retry-chip{display:inline-flex;align-items:center;gap:4px;color:var(--accent);white-space:normal;max-width:100%;text-align:left}
.retry-chip svg{width:13px;height:13px}
.src-chip{font-family:var(--font-mono);font-size:.68rem;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-soft)}
.qcard-stem{font-weight:600;margin:0 0 12px;white-space:pre-line}
.qcard-choices,.qcard-seq-steps{display:flex;flex-direction:column;gap:7px}
.qcard-choice,.qcard-match-item{text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;line-height:1.35}
.qcard-choice:hover,.qcard-match-item:hover{border-color:var(--ink)}
.qcard-choice.is-correct,.qcard-match-item.is-matched{background:var(--good-soft);border-color:var(--good)}
.qcard-choice.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.qcard-choice.is-picked{background:var(--surface-2);border-color:var(--ink)}
.qcard-choice .ord{font-family:var(--font-mono);font-weight:700;margin-right:8px;color:var(--accent-ink)}
.qcard-seq-tools{display:flex;gap:8px;margin-top:8px}
.qcard-seq-tools[hidden],.qcard.is-answered .qcard-seq-tools{display:none}
.qcard-seq-tools button{font:inherit;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.qcard-seq-tools button:hover{border-color:var(--ink)}
.qcard-choice:disabled{cursor:default}
.qcard-match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard-match-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.qcard-match-item.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qcard-match-item.is-wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qcard-hint{font-size:.8rem;color:var(--ink-faint);margin-bottom:8px}
.qcard-explain{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.qcard.is-answered .qcard-explain{display:block}
.qx-cue{display:none;margin-top:9px;padding:8px 11px;border-radius:8px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.qx-cue svg{width:15px;height:15px;vertical-align:-3px;margin-right:4px;color:var(--accent-ink)}
.qx-cue b{color:var(--accent-ink)}
.qcard.is-missed .qx-cue{display:block}
.qcard-verdict{font-weight:700;margin-right:6px}
.qcard-verdict.ok{color:var(--good)} .qcard-verdict.bad{color:var(--bad)}
.qcard-classdata-row{margin-top:8px}
.qcard-classdata-result{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-faint)}
.qcard-classdata-result.is-bad{color:var(--bad)} .qcard-classdata-result.is-ok{color:var(--good)}
.qcard-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent-ink);cursor:pointer;font-size:.82rem;padding:0;text-decoration:underline}

/* ---------- hints & cram ---------- */
.hint-group{margin-bottom:34px}
.hint-group h3,.cram-card h3{font-family:var(--font-display);margin:0 0 10px;display:flex;align-items:center;gap:10px;font-size:1.2rem}
.hint{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;border-left:4px solid var(--t)}
.hint blockquote{margin:0 0 6px;font-family:var(--font-display);font-style:italic;font-size:1.02rem;line-height:1.45}
.hint .take{font-size:.88rem;color:var(--ink-soft)}
.kind{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px}
.kind.emphasize{background:var(--good-soft);color:var(--good)} .kind.deemphasize{background:var(--caution-soft);color:var(--caution)}
.cram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cram-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--t);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.cram-card ul{margin:0;padding-left:18px}
.cram-card li{margin-bottom:5px;font-size:.9rem}

/* ---------- review ---------- */
.review-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.review-top input{flex:1 1 240px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 12px;font:inherit;color:var(--ink);min-width:0}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.toggle .sw{width:30px;height:17px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:15px}
.group-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin}
.group-chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:7px;white-space:nowrap}
.group-chip .n{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-faint)}
.group-chip.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)} .group-chip.is-active .n{color:var(--bg);opacity:.7}
.gc-lec{font-family:var(--font-mono);font-size:.68rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--ts);color:var(--t)}
.group-chip.is-active .gc-lec{background:var(--bg);color:var(--ink)}
.group-lec{margin:4px 0 6px}
.group-head h2{font-family:var(--font-display);font-size:1.7rem;margin:4px 0 4px}
.group-head p{color:var(--ink-soft);margin:0 0 20px;max-width:80ch}
.rv-parts{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 22px}
.rv-part-link{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.rv-part-link:hover{border-color:var(--accent);color:var(--accent)}
.rv-part{font-family:var(--font-display);font-size:1.35rem;margin:6px 0 16px;padding-top:4px;scroll-margin-top:90px;color:var(--accent)}
.rv-section{margin-bottom:38px}
.rv-section > h3{font-family:var(--font-display);font-size:1.18rem;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--t);display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-card h4{margin:0;font-size:1.02rem;line-height:1.25}
.rv-card .sub{font-size:.8rem;color:var(--ink-soft);margin-top:-2px}
.rv-card dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:.87rem}
.rv-card dt{font-weight:700;color:var(--t);font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;white-space:nowrap}
.rv-card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rv-tip{margin-top:4px;font-size:.8rem;font-weight:600;background:var(--ts);color:var(--t);padding:5px 9px;border-radius:7px;align-self:flex-start}
.rv-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.rv-table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
table.rv-table th{background:var(--surface-2);text-align:left;padding:9px 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);position:sticky;top:0}
table.rv-table td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.rv-table td:first-child{font-weight:700}
table.rv-table tr:nth-child(even) td{background:color-mix(in srgb, var(--surface-2) 40%, transparent)}
.rv-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rv-list li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.9rem}
.flows{display:grid;gap:16px}
.flow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--t)}
.flow h4{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow li{display:flex;align-items:center;gap:6px;font-size:.85rem}
.flow li .st{background:var(--ts);color:var(--ink);border:1px solid color-mix(in srgb, var(--t) 40%, transparent);border-radius:8px;padding:5px 9px}
.flow li .st b{font-family:var(--font-mono);color:var(--t);margin-right:5px}
.flow li:not(:last-child)::after{content:"→";color:var(--ink-faint)}
/* recall mode: hide answers until tapped */
.recall .rv-card dd,.recall table.rv-table td:not(:first-child),.recall .flow li .st span{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .15s}
.recall .rv-card dd.shown,.recall table.rv-table td.shown,.recall .flow li .st span.shown{filter:none}
.rv-empty{color:var(--ink-faint);padding:30px 0;text-align:center}
mark{background:var(--caution-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- toast ---------- */
#toastHost{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:.9rem;animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===================================================================
   ARCADE (fixed dark world)
   =================================================================== */
#panel-arcade{background:var(--ar-bg);color:var(--ar-ink);margin:-16px -20px 0;padding:24px 20px 40px;min-height:70vh;border-radius:0 0 18px 18px;position:relative;overflow:hidden}
#panel-arcade::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);background-size:22px 22px;pointer-events:none}
.ar-wrap{position:relative;max-width:1060px;margin:0 auto}
.ar-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ar-logo{font-family:var(--font-arcade);font-size:1.35rem;line-height:1.5;color:var(--ar-yellow);text-shadow:3px 3px 0 var(--ar-pink);margin:0}
.ar-logo small{display:block;font-size:.55rem;color:var(--ar-dim);text-shadow:none;margin-top:6px;letter-spacing:.06em}
.ar-stats{display:flex;gap:8px;flex-wrap:wrap}
.ar-stat{background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 12px;font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-stat b{color:var(--ar-ink);font-size:.95rem;margin-left:4px}
.ar-mute{cursor:pointer;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:10px;padding:6px 10px;color:var(--ar-ink)}
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ar-tile{background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s, border-color .15s;cursor:pointer;text-align:left;padding:0;color:var(--ar-ink)}
.ar-tile:hover,.ar-tile:focus-visible{transform:translateY(-4px);border-color:var(--c)}
.ar-thumb{height:170px;background:var(--ar-panel-2);display:block;width:100%}
.ar-thumb svg{display:block;width:100%;height:100%}
.ar-tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ar-tile h3{font-family:var(--font-arcade);font-size:.85rem;color:var(--c);margin:0;line-height:1.5}
.ar-tile p{margin:0;font-size:.88rem;color:var(--ar-dim)}
.ar-tile .ar-tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.ar-play{font-family:var(--font-arcade);font-size:.65rem;background:var(--c);color:var(--ar-bg);padding:9px 14px;border-radius:8px;box-shadow:0 4px 0 color-mix(in srgb, var(--c) 55%, #000)}
.ar-best{font-family:var(--font-mono);font-size:.78rem;color:var(--ar-dim)}
.ar-how{margin-top:26px;background:var(--ar-panel);border:2px dashed var(--ar-line);border-radius:14px;padding:14px 18px;font-size:.88rem;color:var(--ar-dim)}
.ar-how b{color:var(--ar-ink)}

/* game shell */
.gm{display:flex;flex-direction:column;gap:12px}
.gm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-back{font-family:var(--font-arcade);font-size:.6rem;background:var(--ar-panel);border:2px solid var(--ar-line);color:var(--ar-ink);padding:9px 12px;border-radius:8px;cursor:pointer}
.gm-title{font-family:var(--font-arcade);font-size:.8rem;color:var(--c);margin-right:auto}
.gm-hud{display:flex;gap:8px;flex-wrap:wrap}
.gm-hud span{font-family:var(--font-mono);font-size:.8rem;background:var(--ar-panel);border:2px solid var(--ar-line);border-radius:8px;padding:5px 10px}
.gm-hud b{color:var(--ar-yellow)}
.gm-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm-select label{font-size:.82rem;color:var(--ar-dim)}
.gm-select select{background:var(--ar-panel);color:var(--ar-ink);border:2px solid var(--ar-line);border-radius:8px;padding:6px 10px;font:inherit;font-size:.86rem;max-width:100%}
.gm-stage{position:relative;background:var(--ar-panel);border:3px solid var(--ar-line);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.gm-overlay{position:absolute;inset:0;background:rgba(10,8,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5;overflow-y:auto}
.gm-overlay h2{font-family:var(--font-arcade);font-size:1rem;color:var(--c);margin:0;line-height:1.6}
.gm-overlay p{margin:0;color:var(--ar-dim);max-width:52ch;font-size:.92rem}
.gm-big{font-family:var(--font-arcade);font-size:1.6rem;color:var(--ar-yellow)}
.gm-btn{font-family:var(--font-arcade);font-size:.7rem;background:var(--c);color:var(--ar-bg);border:0;padding:12px 18px;border-radius:10px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb, var(--c) 55%, #000)}
.gm-btn.alt{background:var(--ar-panel-2);color:var(--ar-ink);box-shadow:0 5px 0 #0a0818}
.gm-missed{width:100%;max-width:560px;text-align:left;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 14px;max-height:240px;overflow-y:auto;font-size:.84rem}
.gm-missed h4{margin:0 0 6px;font-family:var(--font-arcade);font-size:.6rem;color:var(--ar-pink)}
.gm-missed li{margin-bottom:6px;color:var(--ar-ink)}
.gm-missed li span{color:var(--ar-green)}
.gm-keys{font-size:.78rem;color:var(--ar-dim);text-align:center}
.gm-keys kbd{font-family:var(--font-mono);background:var(--ar-panel-2);border:1px solid var(--ar-line);border-bottom-width:3px;border-radius:5px;padding:1px 6px;color:var(--ar-ink)}

/* Sort Storm */
.ss-stage{height:470px}
.ss-banner{position:absolute;top:12px;left:0;right:0;text-align:center;font-family:var(--font-arcade);font-size:.7rem;color:var(--ar-cyan);line-height:1.6;padding:0 12px;z-index:2}
.ss-card{position:absolute;left:50%;top:0;transform:translate(-50%,0);background:var(--ar-yellow);color:#1a1433;font-weight:800;padding:14px 18px;border-radius:12px;min-width:170px;max-width:78%;text-align:center;font-size:1.02rem;box-shadow:0 6px 0 #b8901c, 0 10px 24px rgba(0,0,0,.4);z-index:3;will-change:transform}
.ss-card.fly-l{transition:transform .22s ease-in, opacity .22s;opacity:.2}
.ss-bins{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.ss-bin{height:110px;border-radius:14px;border:3px dashed var(--bc);background:color-mix(in srgb, var(--bc) 14%, transparent);color:var(--ar-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:1rem;cursor:pointer;text-align:center;padding:6px}
.ss-bin kbd{font-family:var(--font-mono);font-size:.72rem;background:var(--ar-bg);border:1px solid var(--ar-line);border-radius:5px;padding:1px 6px;color:var(--ar-dim);font-weight:400}
.ss-bin.flash-good{background:color-mix(in srgb, var(--ar-green) 45%, transparent);border-style:solid;border-color:var(--ar-green)}
.ss-bin.flash-bad{background:color-mix(in srgb, var(--ar-pink) 45%, transparent);border-style:solid;border-color:var(--ar-pink)}
.ss-danger{position:absolute;left:0;right:0;bottom:130px;border-top:2px dashed rgba(255,92,138,.5)}
.ss-pop{position:absolute;font-family:var(--font-arcade);font-size:.75rem;pointer-events:none;animation:pop .8s ease-out forwards;z-index:4}
@keyframes pop{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}

@media (hover:none){ .sn-pad{display:grid} }

@keyframes drop{from{transform:translateY(-120px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- responsive ---------- */
@media (max-width: 860px){
  .notes-layout{grid-template-columns:minmax(0,1fr)}
  .lec-nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .lec-nav button{flex:none;width:210px}
  .reading{padding:18px 16px}
}
@media (max-width: 520px){
  #app{padding:0 16px 50px}
  .hub-header{margin:0 -16px;padding:10px 16px 0}
  #panel-arcade{margin:-16px -16px 0;padding:18px 12px 30px}
  .hub-title h1{font-size:1.2rem}
  .hub-subtitle{display:none}
  #streakPill,#progressSummary{display:none}
  .hub-header-top{flex-wrap:nowrap}
  .pill.countdown{font-size:.72rem;padding:3px 8px}
  .qcard-match-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ss-stage{height:430px}
  .ar-logo{font-size:1rem}
  .rv-cards{grid-template-columns:minmax(0,1fr)}

}

/* ---------- custom icon set ---------- */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.theme-btn .ic{width:15px;height:15px}
.group-chip .ic{width:17px;height:17px;color:var(--accent)}
.group-chip.is-active .ic{color:var(--bg)}
.group-head h2{display:flex;align-items:center;gap:10px}
.group-head h2 .ic{width:26px;height:26px;color:var(--accent);padding:4px;border-radius:8px;background:var(--accent-soft);box-sizing:content-box}
.rv-tip{display:inline-flex;gap:6px;align-items:center}
.toast{display:flex;gap:8px;align-items:center}
.ar-mute{display:inline-flex;align-items:center}
.ar-mute .ic{width:18px;height:18px}
.ar-play{display:inline-flex;align-items:center;gap:6px}
.ar-play .ic,.gm-back .ic{width:11px;height:11px}
.gm-back{display:inline-flex;align-items:center;gap:6px}
.gm-overlay p .ic{color:var(--ar-yellow)}
.hrt{display:inline-flex;margin-right:3px;color:var(--ar-pink)}
.hrt .px-heart{width:14px;height:12px;vertical-align:-1px}
.hrt.lost{color:var(--ar-line)}

/* ---------- compact single-row ribbon ---------- */
.hub-header{padding:6px 20px}
.hub-header-top{flex-wrap:nowrap;gap:14px}
.hub-title{align-items:center;gap:8px;flex:none}
.hub-title h1{font-size:1.12rem;white-space:nowrap}
.hub-back-btn{width:30px;height:30px}
#modeSwitch{margin:0;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;flex:0 1 auto;min-width:0}
#modeSwitch button{padding:5px 12px;border:0;border-radius:999px;font-size:.86rem;gap:6px}
#modeSwitch button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--ink)}
#modeSwitch button[data-mode="arcade"][aria-selected="true"]{color:var(--ar-pink)}
#modeSwitch .mode-icon{display:inline-flex}
#modeSwitch .mode-icon .ic{width:16px;height:16px}
.hub-meta{margin-left:auto;flex-wrap:nowrap;gap:6px}
.pill{padding:3px 9px;font-size:.76rem}
.theme-btn{width:28px;height:26px}
main{padding-top:16px}
@media (max-width: 760px){
  .hub-title h1{font-size:1rem}
  #progressSummary{display:none}
  #modeSwitch button{padding:5px 9px}
}
@media (max-width: 560px){
  .hub-header{padding:6px 12px}
  .hub-header-top{gap:8px}
  .mode-label{display:none}
  #modeSwitch button{padding:6px 11px}
  .pill.countdown{font-size:.7rem;padding:3px 7px}
  .hub-back-btn{width:28px;height:28px}
}
@media (max-width: 380px){ .hub-title h1{display:none} }

/* ---------- arcade leaderboards ---------- */
.ar-boards{margin-top:26px}
.ar-sub{font-family:var(--font-arcade);font-size:.72rem;color:var(--ar-yellow);display:flex;align-items:center;gap:8px;margin:0 0 12px}
.ar-sub .ic{width:18px;height:18px}
.ar-board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ar-board{background:var(--ar-panel);border:3px solid var(--ar-line);border-top-color:var(--c);border-radius:14px;padding:12px 14px}
.ar-board h4{margin:0 0 8px;font-family:var(--font-arcade);font-size:.62rem;color:var(--c)}
.lb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-family:var(--font-mono);font-size:.8rem}
.lb-list li{display:flex;gap:10px;align-items:center;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.03)}
.lb-list li.me{background:color-mix(in srgb, var(--ar-yellow) 18%, transparent);color:var(--ar-yellow)}
.lb-list li.lb-gap{background:none;justify-content:center;color:var(--ar-dim);padding:0}
.lb-rk{width:22px;color:var(--ar-dim);text-align:right;flex:none}
.lb-list li:nth-child(1) .lb-rk{color:var(--ar-yellow)} .lb-list li:nth-child(2) .lb-rk{color:#d8d4f0} .lb-list li:nth-child(3) .lb-rk{color:var(--ar-orange)}
.lb-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ar-ink)}
.lb-list li.me .lb-nm{color:var(--ar-yellow)}
.lb-sc{color:var(--ar-yellow);flex:none}
.lb-empty{color:var(--ar-dim);font-size:.82rem;padding:6px 2px}
.gm-lb{width:100%;max-width:420px;background:var(--ar-bg);border:2px solid var(--ar-line);border-radius:12px;padding:10px 12px;text-align:left}
.gm-lb h4{margin:0 0 6px;font-family:var(--font-arcade);font-size:.58rem;color:var(--ar-yellow)}

/* ---------- fullscreen arcade ---------- */
.gm-fs{margin-left:auto;order:3}
.gm-bar .gm-title{margin-right:0}
.gm-bar .gm-hud{order:4}
.ar-wrap:fullscreen,.ar-wrap:-webkit-full-screen{background:var(--ar-bg);padding:18px 24px;max-width:none;overflow:auto;color:var(--ar-ink)}
.ar-wrap.is-fs{position:fixed;inset:0;z-index:200;background:var(--ar-bg);padding:18px 24px;max-width:none;overflow:auto}
.ar-wrap.fs-on .gm{max-width:1400px;margin:0 auto}
.ar-wrap.fs-on .ss-stage{height:calc(100vh - 190px)}
.ar-wrap.fs-on .sa-stage{height:calc(100vh - 190px)}
.ar-wrap.fs-on .sn-canvas{max-width:min(100%, calc((100vh - 330px) * 1.5))}
.ar-wrap.fs-on .mm-stage,.ar-wrap.fs-on .hm-stage,.ar-wrap.fs-on .ff-stage{min-height:calc(100vh - 190px)}
.ar-wrap.fs-on .gm-keys{display:none}



.gm-select-note{font-size:.82rem;color:var(--ar-dim)}
@media (max-width:560px){
  .gm-fs{order:2;margin-left:0}
}

.gm-hud .hrt{border:0;padding:0;background:none;border-radius:0}
.gm-hud b[data-hud="lives"]{display:inline-flex;align-items:center}

.ar-wrap.fs-on .cb-canvas{max-width:min(100%, calc((100vh - 330px) * 1.636))}

.ar-wrap.fs-on .bs-grid{grid-template-columns:repeat(12,clamp(34px, 5vh, 52px))}
.ar-wrap.fs-on .bs-cell{width:clamp(34px, 5vh, 52px);height:clamp(34px, 5vh, 52px);font-size:1.1rem}

.ar-wrap.fs-on .wa-hole{min-height:calc((100vh - 330px) / 3)}
@media (max-width:760px){
}

/* ---------- Listen (shared widget TTS) ---------- */
.reading .meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.reading .meta-row .meta{margin:0}
/* the shared widget styles the Listen button with --card, which this hub doesn't define; map it to this hub's tokens so it follows light/dark */
.sh-tts-btn:not([data-state="playing"]):not([data-state="paused"]){background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.sh-tts-btn:not([data-state="playing"]):not([data-state="paused"]):hover{background:var(--surface-2)}
body .sh-tts-voice-picker{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}

/* ---------- reading level switch ---------- */
.level-switch{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:4px 0 14px}
.level-switch button{border:0;background:none;color:var(--ink-soft);font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}
.level-switch button:hover{color:var(--ink)}
.level-switch button.is-active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}


/* ---------- phone header: mode tabs get their own labeled row so none are hidden past the edge ---------- */
.lec-chip{white-space:normal;max-width:100%;min-width:0}
.qcard-top{flex-wrap:wrap}
.flow h4 .lec-chip{flex:0 1 auto}
@media (max-width: 560px){
  .hub-header-top{flex-wrap:wrap;row-gap:4px}
  .hub-title{flex:1 1 auto}
  #modeSwitch{order:3;flex:1 0 100%;margin-top:2px;overflow:visible}
  #modeSwitch button{flex:1 1 0;justify-content:center;padding:7px 4px 9px;font-size:.84rem;gap:5px}
  #modeSwitch .mode-label{display:inline}
}

/* ---------- weak spots + mind map ---------- */
.mmap-block{margin:18px 0 4px}
#sh-mmap-container{margin-top:12px}
.weak-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.weak-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--t, var(--line));border-radius:12px;background:var(--surface)}
.weak-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

/* ---------- Patient Box, select-all, quick start, "what's tested" ---------- */
.pbox{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:10px 14px;margin:0 0 12px}

.pbox dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;margin:0;font-size:.9rem}

.qcard-choice.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qcard-choice.is-missed-right{border-color:var(--good);border-style:dashed}
/* select-all: a tick box on each option so it is obvious what is picked (report #14) */
.qcard-choice[data-act="multi"]{position:relative;padding-left:40px}
.qcard-choice[data-act="multi"]::before{content:"";position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;box-sizing:border-box;border:2px solid var(--line-strong);border-radius:4px;background:var(--surface)}

.qcard-choice[data-act="multi"].is-selected::before,.qcard-choice[data-act="multi"].is-correct::before,.qcard-choice[data-act="multi"].is-wrong::before{background:var(--accent);border-color:var(--accent)}
.qcard-choice[data-act="multi"].is-correct::before{background:var(--good);border-color:var(--good)}
.qcard-choice[data-act="multi"].is-wrong::before{background:var(--bad);border-color:var(--bad)}
.qcard-choice[data-act="multi"].is-selected::after,.qcard-choice[data-act="multi"].is-correct::after,.qcard-choice[data-act="multi"].is-wrong::after{content:"";position:absolute;left:18px;top:50%;width:5px;height:10px;margin-top:-7px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.multi-check{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.multi-score{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-soft)}
.quick-start{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}

.qs-btn:hover{border-color:var(--accent)}
.qs-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qs-btn.primary{color:#1a1114} }
.qs-btn .qs-ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb, currentColor 12%, transparent)}

@media (max-width:720px){.quick-start{grid-template-columns:minmax(0,1fr);gap:8px}.qs-btn{padding:11px 14px}}
.tested{border:1px solid color-mix(in srgb, var(--t, var(--accent)) 40%, var(--line));background:color-mix(in srgb, var(--ts, var(--accent-soft)) 60%, var(--surface));border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:.92rem}

/* Exam 1 format and logistics, a card on Home */
.exam-card{border:1px solid var(--accent);background:var(--surface);border-radius:12px;padding:10px 14px;margin:0 0 18px;font-size:.92rem;box-shadow:var(--shadow)}

.exam-card summary::after{content:"";flex:none;margin-left:auto;width:8px;height:8px;border:solid var(--ink-soft);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}

.fg-head{fill:var(--accent)}

us</text></g><g class=\"am-callout\"><path class=\"bt-lead\" d=\"M297 210L370 230\"/><circle class=\"bt-dot\" cx=\"370\" cy=\"230\" r=\"1.8\"/><text class=\"bt-t\" x=\"300\" y=\"214\" text-anchor=\"middle\">insulin granules</text></g><text class=\"bt-t bt-key-k\" x=\"310\" y=\"12\">K⁺</text></svg></div></div></figure><div class=\"am-controls\"><label class=\"am-slider\"><span>ready</span><input type=\"range\" min=\"0\" max=\"6\" step=\"1\" value=\"0\" aria-label=\"Step, from ready to step 6\"><span>step 6</span></label></div>\n<div class=\"am-controls\"><button type=\"button\" class=\"am-btn\" data-btstep=\"-1\">Back</button><button type=\"button\" class=\"am-btn\" data-btstep=\"1\">Next step</button><button type=\"button\" class=\"am-btn\" data-btplay aria-pressed=\"false\">Play</button></div>\n<div class=\"am-controls\" role=\"group\" aria-label=\"Conditions\"><button type=\"button\" class=\"am-btn\" data-btglu=\"1\" aria-pressed=\"true\">High glucose</button><button type=\"button\" class=\"am-btn\" data-btglu=\"0\" aria-pressed=\"false\">Low glucose</button><button type=\"button\" class=\"am-btn\" data-btsu aria-pressed=\"false\">Add a sulfonylurea</button></div>\n<p class=\"am-summary\" aria-live=\"polite\"></p>\n<p class=\"am-info\">Hover or tap GLUT2, the mitochondrion, the K-ATP channel, the calcium channel, the granules, the nucleus or the capillary.</p><details class=\"am-sources\"><summary>What this shows, and what's simplified</summary><ul>\n<li>The six steps and every part are from the L5 notes (Dr. Madison): glucose in through GLUT2, glucokinase and glycolysis raise ATP, ATP closes K-ATP (the sulfonylurea receptor), the cell depolarizes, voltage-dependent Ca2+ channels open, and Ca2+ fuses the granules. Sulfonylureas close the same K-ATP channels.</li>\n<li>Other signals (amino acids, glucagon through Gs, acetylcholine and CCK through Gq, the incretins GLP-1 and GIP) mostly potentiate this glucose response; they aren't drawn.</li>\n<li>Schematic: one cell, not to scale, no membrane potential values. Educational, not medical advice.</li></ul></details></div>",

    html: "<div class=\"anima\" data-anima=\"thyroid\"><figure class=\"iso-figure\"><div class=\"iso-plate\"><div class=\"iso-plate-corners\" aria-hidden=\"true\"><span class=\"iso-plate-corner\" data-corner=\"fig\">Fig 2</span><span class=\"iso-plate-corner\" data-corner=\"title\">Making thyroid hormone</span><span class=\"iso-plate-corner\" data-corner=\"hint\">step through · hover a part</span><span class=\"iso-plate-corner\" data-corner=\"readout\" data-readout>ready</span></div><div class=\"am-svg th-box\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"iso-svg th-svg\" viewBox=\"0 0 640 430\" role=\"img\" aria-label=\"The wall of a thyroid follicle: colloid above, a follicular cell with NIS, pendrin, thyroperoxidase and megalin, and a capillary below.\"><path class=\"th-colloid hot\" data-info=\"Colloid: the gelatinous matrix in the follicle lumen, mostly thyroglobulin. T3 and T4 are made here, outside the cell.\" d=\"M4 4H636V126H4Z\"/><text class=\"th-t th-mut\" x=\"14\" y=\"26\" text-anchor=\"start\">colloid (follicle lumen)</text><path class=\"th-cell\" d=\"M14 128H172V330H14Z\"/><ellipse class=\"th-nuc\" cx=\"96\" cy=\"282\" rx=\"34\" ry=\"22\"/><path class=\"th-cell\" d=\"M468 128H626V330H468Z\"/><ellipse class=\"th-nuc\" cx=\"545\" cy=\"282\" rx=\"34\" ry=\"22\"/><path class=\"th-cell th-main\" d=\"M176 128H464V330H176Z\"/><path class=\"th-villus\" d=\"M190 128v-9\"/><path class=\"th-villus\" d=\"M208 128v-9\"/><path class=\"th-villus\" d=\"M226 128v-9\"/><path class=\"th-villus\" d=\"M280 128v-9\"/><path class=\"th-villus\" d=\"M298 128v-9\"/><path class=\"th-villus\" d=\"M352 128v-9\"/><path class=\"th-villus\" d=\"M370 128v-9\"/><path class=\"th-villus\" d=\"M406 128v-9\"/><g class=\"hot\" data-info=\"The follicular cell makes thyroglobulin on its rough ER and packs it in the Golgi; vesicles carry it to the apical surface.\"><ellipse class=\"th-nuc\" cx=\"300\" cy=\"272\" rx=\"46\" ry=\"28\"/><circle class=\"th-nucleolus\" cx=\"310\" cy=\"266\" r=\     data: (function(){ var d = {"W":640,"H":430,"AP":128,"BL":330,"X0":176,"X1":464,"NIS":[232,330],"TSHR":200,"PEN":[250,128],"TPO":[322,128],"TGX":[392,128],"MEG":[432,128],"NUC":[300,272],"LYS":[392,236],"STEPS":["Ready: the wall of a follicle. Follicular cells line the colloid; thyroid hormone is the only endocrine hormone made outside the cell, in the colloid. TSH reaches the basolateral side (a Gs receptor) and speeds every step. Step through.","1. Iodide trapping: the sodium-iodide symporter (NIS) on the basolateral membrane carries sodium and iodide in together. Sodium runs down its gradient and drags iodide in against its own, concentrating it 20 to 50 times above plasma (the slides; \"tens to hundreds of times\" in the lecture).","2. Thyroglobulin: the cell makes thyroglobulin (Tg) and secretes it into the colloid. Its tyrosines are the substrate, and it stores the hormones and iodine in the follicle.","3. Iodide to iodine (alphabetical order): iodide crosses the apical membrane through pendrin, and thyroperoxidase oxidizes it to iodine. Its substrate is H2O2, made with the NADPH that TSH's glucose oxidation supplies.","4. Organification and coupling: thyroperoxidase adds iodine to thyroglobulin's tyrosines (MIT, DIT), then couples them: MIT + DIT = T3, DIT + DIT = T4, still attached to thyroglobulin. Three jobs for one enzyme.","5. Endocytosis: the cell takes colloid back in through megalin, the thyroglobulin receptor.","6. Proteolysis: lysosomes digest thyroglobulin, freeing T4 (about 90%) and T3 (about 10%). It's messy: leftover thyroglobulin, MIT and DIT remain. This is the only time T4 and T3 are inside the cell.","7. Secretion and recycling: free T4 and T3 cross into the blood; leftover MIT and DIT are deiodinated so their iodine is reused. In the tissues, 5'-deiodinase (outer ring) turns T4 into active T3, and 5-deiodinase (inner ring) makes inactive reverse T3."],"DRUGS":{"none":"","thio":"Methimazole and PTU interfere with iodination of thyroglobulin's tyrosines and with coupling (step 4), so no new T3 or T4 is made. PTU also blocks T4 to T3 conversion in the tissues.","iodide":"A large iodide load blocks organification for a while (the Wolff-Chaikoff effect) and lowers NIS; the gland escapes it. Before antithyroid drugs it was a treatment for hyperthyroidism. Given as a drug (Lugol's solution), iodide also inhibits hormone release (step 7): used before thyroid surgery and in thyroid storm.","lowiod":"Low iodide: NIS speeds up and traps iodide faster, keeping hormone production going. If iodide stays too low, T4 and T3 fall, TSH rises, and TSH's growth signal (hypertrophy and hyperplasia) enlarges the gland: a goiter."}};

ry>What this shows, and what's simplified</summary><ul>\n<li>The axis, the loops, Addison's, Cushing's forms and the hyperpigmentation are from the L6 notes (Dr. Madison); the primary vs secondary rule from L2 (Dr. Galin: target hormone against pituitary hormone); prednisone, rest mode and the taper from L7 (Dr. Fasinu).</li>\n<li>Schematic and qualitative: levels are low / normal / high, not lab values. The circadian rhythm (peak about 7-8 am) and the stimuli (hypoglycemia, stress, sleep-wake) aren't drawn. Educational, not medical advice.</li></ul></details></div>",
    data: (function(){ var d = {"W":400,"H":440,"PORTAL":[[170,92],[170,142]],"VESSEL":[[170,202],[170,300]],"LONG":[[228,342],[320,342],[320,58],[282,58]],"LONG_P":[[320,172],[236,172]],"SHORT":[[106,172],[56,172],[56,58],[60,58]],"MSH":[[124,194],[92,226]],"PILL":[[358,300],[320,300]],"GAUGES":[["crh","CRH",72],["acth","ACTH",126],["msh","α-MSH",180],["cort","cortisol (own)",234],["drug","prednisone",288]],"SC":{"normal":{"name":"normal","v":{"crh":0.5,"acth":0.5,"cort":0.5,"drug":0},"cortex":"ok","pit":"ok","read":["All in the normal range:","feedback holds each level","steady"],"text":"Normal: the paraventricular nucleus releases CRH into the portal vessels; the anterior pituitary releases ACTH, which acts on the zona fasciculata through a Gs receptor; cortisol feeds back on the pituitary and hypothalamus (long loop), and ACTH can turn off CRH (short loop)."},"addison":{"name":"Addison's · primary","v":{"crh":0.85,"acth":0.95,"cort":0.1,"drug":0},"cortex":"gone","pit":"ok","read":["Cortisol low, ACTH high","= primary: the adrenal","fails"],"text":"Addison's disease (primary adrenal insufficiency): usually autoimmune destruction of the cortex. Cortisol is low, so there's no negative feedback and ACTH is high. ACTH is cut from POMC with α-MSH, so hyperpigmentation of skin and mucous membranes follows, often in the gums, often months to years before other symptoms. Aldosterone is often lost too (treated with fludrocortisone)."},"cushing":{"name":"Cushing's disease · secondary","v":{"crh":0.15,"acth":0.88,"cort":0.9,"drug":0},"cortex":"ok","pit":"adenoma","read":["Cortisol high, ACTH high","= secondary: the pituitary","secretes on its own"],"text":"Cushing's disease: a pituitary adenoma makes ACTH (ACTH-dependent Cushing syndrome). ACTH and cortisol are both high: secondary, autonomous pituitary secretion. The high cortisol still turns down CRH. An ectopic ACTH source, such as a neuroendocrine tumor, is the other ACTH-dependent form."},"tumor":{"name":"adrenal tumor · primary","v":{"crh":0.15,"acth":0.1,"cort":0.9,"drug":0},"cortex":"tumor","pit":"ok","read":["Cortisol high, ACTH low","= primary: the adrenal","secretes on its own"],"text":"Adrenal cortical tumor (ACTH-independent Cushing syndrome): the cortex makes cortisol on its own, and the high cortisol correctly suppresses CRH and ACTH. Very high cortisol with low ACTH is primary, the lecture's own example."},"pred":{"name":"on prednisone · suppressed","v":{"crh":0.15,"acth":0.1,"cort":0.15,"drug":0.9},"cortex":"rest","pit":"ok","read":["ACTH low, own cortisol low,","drug high: the axis is","suppressed"],"text":"Long-term prednisone: the drug raises glucocorticoid levels, and the tight feedback loop shuts down CRH and ACTH, so the patient's own cortex goes into \"rest mode.\" Months of it bring Cushing signs: truncal obesity, a moon face, thin skin, osteoporosis (ACTH-independent, from exogenous glucocorticoids)."},"predStop":{"name":"stopped suddenly · insufficiency","v":{"crh":0.25,"acth":0.15,"cort":0.1,"drug":0},"cortex":"rest","pit":"ok","read":["Cortisol low, ACTH low:","adrenal insufficiency until","the axis wakes up"],"text":"Stopped abruptly: the drug is gone, but it takes time for the axis to wake up, and the resting cortex can't make enough cortisol: adrenal insufficiency. That is why you taper."},"predTaper":{"name":"tapered off · recovered","v":{"crh":0.5,"acth":0.5,"cort":0.5,"drug":0},"cortex":"ok","pit":"ok","read":["Back in the normal range:","the axis restarted as","the dose fell"],"text":"Tapered: a falling dose lets the body sense the drop and restart CRH and ACTH, so the cortex wakes and cortisol comes back. That's the logic of the Medrol Dosepak (methylprednisolone, 21 tablets: 6 on day one, then 5, 4, 3, 2, 1) and prednisone dose packs."}}};

  function loop(now) { step(now); frame = visible && !reduce.matches ? requestAnimationFrame(loop) : 0; }
  function kick() { last = performance.now(); if (!frame && visible && !reduce.matches) frame = requestAnimationFrame(loop); else if (reduce.matches) step(performance.now()); }
  function set(k) {

    root.querySelectorAll("[data-hpcase]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-hpcase") === k)); });

  FIGS["calcium"] = { title: "Who moves blood calcium", caption: "Let blood calcium fall or rise, switch on a parathyroid adenoma, or try a soda habit or menopause, and follow PTH, calcitriol and calcitonin to the kidney, gut and bone.", lec: "calcium",
    html: "<div class=\"anima\" data-anima=\"calcium\"><figure class=\"iso-figure\"><div class=\"iso-plate\"><div class=\"iso-plate-corners\" aria-hidden=\"true\"><span class=\"iso-plate-corner\" data-corner=\"fig\">Fig 4</span><span class=\"iso-plate-corner\" data-corner=\"title\">Who moves blood calcium</span><span class=\"iso-plate-corner\" data-corner=\"hint\">pick a case · hover a part</span><span class=\"iso-plate-corner\" data-corner=\"readout\" data-readout>normal</span></div><div class=\"hp-wrap\"><div class=\"am-svg hp-box\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"iso-svg ca-svg\" viewBox=\"0 0 400 440\" role=\"img\" aria-label=\"Calcium control: the parathyroid and thyroid C cells above the blood, and the kidney, gut and bone below.\"><path class=\"ca-thy\" d=\"M24 70C24 34 60 22 96 26C134 30 168 46 168 78C168 112 136 128 96 126C56 124 24 106 24 70Z\"/><text class=\"ca-t ca-sm\" x=\"96\" y=\"46\" text-anchor=\"middle\">thyroid · parathyroid</text><g class=\"hot\" data-info=\"Parathyroid chief cells sense blood calcium through the calcium-sensing receptor (Gq) and release PTH. High calcium raises intracellular calcium, which inhibits PTH secretion; low calcium lets PTH secretion rise.\"><ellipse class=\"ca-para\" cx=\"95\" cy=\"86\" rx=\"34\" ry=\"19\"/><text class=\"ca-t ca-in\" x=\"95\" y=\"90\" text-anchor=\"middle\">chief cells</text></g><g class=\"hot\" data-info=\"Calcium-sensing receptor (CaSR), Gq-coupled. Calcium stimulates it, intracellular calcium rises from internal stores, and that inhibits PTH secretion: the opposite of most secretory cells.\"><path class=\"ca-rec\" d=\"M60 78l-8 -6M60 78l-8 6M60 78h-12\"/></g><circle class=\"ca-pthg\" cx=\"78\" cy=\"100\" r=\"2.4\"/><circle class=\"ca-pthg\" cx=\"85\" cy=\"104\" r=\"2.4\"/><circle class=\"ca-pthg\" cx=\"92\" cy=\"100\" r=\"2.4\"/><g class=\"hot\" data-info=\"C cells (parafollicular cells) sit outside the thyroid follicles and secrete calcitonin when plasma calcium rises (gastrin also stimulates them). Calcitonin isn't essential; its effects are opposite to PTH's.\"><circle class=\"ca-fol\" cx=\"300\" cy=\"74\" r=\"32\"/><circle class=\"ca-colloid\" cx=\"300\" cy=\"74\" r=\"22\"/><ellipse class=\"ca-ccell\" cx=\"338\" cy=\"102\" rx=\"12\" ry=\"9\"/></g><text class=\"ca-t ca-sm\" x=\"300\" y=\"26\" text-anchor=\"middle\">thyroid C cells</text><rect class=\"ca-blood\" x=\"12\" y=\"150\" width=\"376\" height=\"44\" rx=\"20\"/><text class=\"ca-t ca-sm ca-onblood\" x=\"24\" y=\"186\" text-anchor=\"start\">blood</text><circle class=\"ca-ion\" cx=\"30\" cy=\"160\" r=\"3\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"71\" cy=\"168\" r=\"3\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"112\" cy=\"176\" r=\"3\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"153\" cy=\"160\" r=\"3\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"194\" cy=\"168\" r=\"3\" opacity=\"0.5\"/><rect class=\"ca-tile\" x=\"12\" y=\"212\" width=\"118\" height=\"216\" rx=\"10\"/><rect class=\"ca-tile\" x=\"141\" y=\"212\" width=\"118\" height=\"216\" rx=\"10\"/><rect class=\"ca-tile\" x=\"270\" y=\"212\" width=\"118\" height=\"216\" rx=\"10\"/><text class=\"ca-t ca-head\" x=\"71\" y=\"230\" text-anchor=\"middle\">kidney</text><text class=\"ca-t ca-head\" x=\"200\" y=\"230\" text-anchor=\"middle\">gut</text><text class=\"ca-t ca-head\" x=\"329\" y=\"230\" text-anchor=\"middle\">bone</text><g class=\"hot\" data-info=\"Kidney: PTH increases calcium reabsorption in the distal tubule and decreases phosphate reabsorption, so phosphate is excreted (calcium and phosphate move opposite ways only here, “hint, hint, put a star by it”: it keeps them from meeting and forming kidney stones). PTH also turns on 1α-hydroxylase. Kidney disease can cut calcitriol production.\"><path class=\"ca-tube\" d=\"M34 240V408H58V240Z\"/><path class=\"ca-tubel\" d=\"M46 244V404\"/></g><text class=\"ca-t ca-sm\" x=\"46\" y=\"424\" text-anchor=\"middle\">urine</text><circle class=\"ca-ion\" cx=\"58\" cy=\"300\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"95.5\" cy=\"300\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-po4\" cx=\"46\" cy=\"236\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-po4\" cx=\"46\" cy=\"278\" r=\"3.2\" opacity=\"1\"/><g class=\"hot\" data-info=\"1α-hydroxylase (kidney) makes active 1,25-(OH)2-D3, calcitriol. Turned on by hypocalcemia, PTH and low phosphate.\"><rect class=\"ca-enz\" x=\"66\" y=\"326\" width=\"58\" height=\"22\" rx=\"11\"/><text class=\"ca-t ca-enzt\" x=\"95\" y=\"341\" text-anchor=\"middle\">1α-OHase</text></g><g class=\"hot\" data-info=\"24-hydroxylase (kidney) makes inactive 24,25-(OH)2-D3. Turned on by hypercalcemia, high phosphate and calcitriol itself.\"><rect class=\"ca-enz\" x=\"66\" y=\"356\" width=\"58\" height=\"22\" rx=\"11\"/><text class=\"ca-t ca-enzt\" x=\"95\" y=\"371\" text-anchor=\"middle\">24-OHase</text></g><path class=\"ca-path\" d=\"M120 340L138 340L138 300L178 300\"/><circle class=\"ca-d3\" cx=\"120\" cy=\"340\" r=\"3.4\" opacity=\"1\"/><circle class=\"ca-d3\" cx=\"138\" cy=\"325.3\" r=\"3.4\" opacity=\"0.5\"/><rect class=\"ca-lumen\" x=\"147\" y=\"384\" width=\"106\" height=\"38\" rx=\"6\"/><text class=\"ca-t ca-sm\" x=\"232\" y=\"412\" text-anchor=\"middle\">lumen</text><g class=\"hot\" data-info=\"Enterocyte: calcitriol binds its receptor and turns on three things: apical calcium channels (calcium in from the lumen), calbindin (carries calcium across the cell so it doesn't interfere with signaling) and a basolateral active pump into the blood. Its receptor is intranuclear: it works by turning genes on. Phosphate absorption rises too (how is still being worked out).\"><rect class=\"ca-cell\" x=\"174\" y=\"252\" width=\"52\" height=\"130\" rx=\"8\"/><ellipse class=\"ca-nuc\" cx=\"190\" cy=\"300\" rx=\"11\" ry=\"15\"/></g><rect class=\"ca-chan\" x=\"192\" y=\"374\" width=\"16\" height=\"16\" rx=\"4\"/><path class=\"ca-pump\" d=\"M190 252a10 10 0 0 1 20 0Z\"/><circle class=\"ca-ion\" cx=\"200\" cy=\"418\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"200\" cy=\"372.8\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"200\" cy=\"327.6\" r=\"3.2\" opacity=\"0.5\"/><path class=\"ca-bone\" d=\"M276 372H322Q330 388 346 388Q362 388 368 372H382V422H276Z\"/><path class=\"ca-lam\" d=\"M282 398H376\"/><path class=\"ca-lam\" d=\"M282 406H376\"/><path class=\"ca-lam\" d=\"M282 414H376\"/><g class=\"hot\" data-info=\"Osteoblasts build bone and carry the receptors for PTH, vitamin D3 and estrogen. PTH binds them, and they release paracrine cytokines and growth factors (RANK ligand among them) that activate osteoclasts. Estrogen blocks that signal; at menopause the brake is lost.\"><rect class=\"ca-ob\" x=\"280\" y=\"346\" width=\"26\" height=\"24\" rx=\"5\"/><circle class=\"ca-nuc\" cx=\"293\" cy=\"358\" r=\"5\"/></g><g class=\"hot\" data-info=\"Osteoclasts come from the hematopoietic lineage, like monocytes and macrophages, and resorb bone, releasing calcium and phosphate into the blood. They have no PTH receptor (“It doesn’t”); they carry the calcitonin receptor: calcitonin stops bone turnover.\" opacity=\"1\"><path class=\"ca-oc\" d=\"M318 360Q318 328 346 326Q376 328 378 360Q370 372 362 366Q354 374 346 368Q338 374 330 366Q322 372 318 360Z\"/><circle class=\"ca-nuc\" cx=\"334\" cy=\"344\" r=\"4.5\"/><circle class=\"ca-nuc\" cx=\"348\" cy=\"340\" r=\"4.5\"/><circle class=\"ca-nuc\" cx=\"362\" cy=\"346\" r=\"4.5\"/></g><circle class=\"ca-para-d\" cx=\"300\" cy=\"348\" r=\"2.6\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"348\" cy=\"366\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-ion\" cx=\"355.8\" cy=\"322.9\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-po4\" cx=\"348\" cy=\"366\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-po4\" cx=\"358.4\" cy=\"308.5\" r=\"3.2\" opacity=\"0\"/><circle class=\"ca-pth\" cx=\"95\" cy=\"108\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-pth\" cx=\"95\" cy=\"153.8\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-pth\" cx=\"118\" cy=\"176.6\" r=\"3.2\" opacity=\"0.5\"/><circle class=\"ca-pth\" cx=\"95\" cy=\"108\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-pth\" cx=\"107.8\" cy=\"166\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-pth\" cx=\"178.7\" cy=\"166\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-ctn\" cx=\"336\" cy=\"112\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-ctn\" cx=\"336\" cy=\"157.2\" r=\"3.2\" opacity=\"1\"/><circle class=\"ca-ctn\" cx=\"352\" cy=\"186.4\" r=\"3.2\" opacity=\"0.5\"/><g class=\"am-callout\"><path class=\"ca-lead\" d=\"M31 136L50 80\"/><circle class=\"ca-dot\" cx=\"50\" cy=\"80\" r=\"1.8\"/><text class=\"ca-t\" x=\"34\" y=\"140\" text-anchor=\"start\">CaSR (Gq)</text></g><g class=\"am-callout\"><path class=\"ca-lead\" d=\"M65 262L58 262\"/><circle class=\"ca-dot\" cx=\"58\" cy=\"262\" r=\"1.8\"/><text class=\"ca-t\" x=\"68\" y=\"266\" text-anchor=\"start\">tubule</text></g><g class=\"am-callout\"><path class=\"ca-lead\" d=\"M233 364L208 380\"/><circle class=\"ca-dot\" cx=\"208\" cy=\"380\" r=\"1.8\"/><text class=\"ca-t\" x=\"236\" y=\"368\" text-anchor=\"start\">channel</text></g><g class=\"am-callout\"><path class=\"ca-lead\" d=\"M233 258L210 250\"/><circle class=\"ca-dot\" cx=\"210\" cy=\"250\" r=\"1.8\"/><text class=\"ca-t\" x=\"236\" y=\"262\" text-anchor=\"start\">pump</text></g><g class=\"am-callout\"><path class=\"ca-lead\" d=\"M279 286L292 344\"/><circle class=\"ca-dot\" cx=\"292\" cy=\"344\" r=\"1.8\"/><text class=\"ca-t\" x=\"282\" y=\"290\" text-anchor=\"start\">osteoblast</text></g><g class=\"am-callout\"><path class=\"ca-lead\" d=\"M387 312L362 330\"/><circle class=\"ca-dot\" cx=\"362\" cy=\"330\" r=\"1.8\"/><text class=\"ca-t\" x=\"384\" y=\"316\" text-anchor=\"end\">osteoclast</text></g></svg></div><div class=\"hp-labs\"><div class=\"hp-lh\">Hormones</div><p class=\"ca-trig\">Blood Ca²⁺ normal</p><div class=\"hp-row\"><span class=\"hp-gl\">PTH</span><b class=\"hp-gw hp-w-normal\">normal</b><span class=\"hp-bar\"><i class=\"hp-norm\"></i><i class=\"hp-mk ca-mk-pth\" style=\"left:50%\"></i></span></div><div class=\"hp-row\"><span class=\"hp-gl\">calcitriol</span><b class=\"hp-gw hp-w-normal\">normal</b><span class=\"hp-bar\"><i class=\"hp-norm\"></i><i class=\"hp-mk ca-mk-d3\" style=\"left:50%\"></i></span></div><div class=\"hp-row\"><span class=\"hp-gl\">calcitonin</span><b class=\"hp-gw hp-w-normal\">normal</b><span class=\"hp-bar\"><i class=\"hp-norm\"></i><i class=\"hp-mk ca-mk-ctn\" style=\"left:50%\"></i></span></div><div class=\"hp-axis\"><span>low</span><span>normal</span><span>high</span></div><p class=\"hp-read\"><b>Formation and resorption balance</b></p><p class=\"ca-brake\">Estrogen's brake on bone: <b>on</b></p><div class=\"ca-key\"><span><i class=\"ca-k-ca\"></i>Ca²⁺</span><span><i class=\"ca-k-p\"></i>phosphate</span><span><i class=\"ca-k-pth\"></i>PTH</span><span><i class=\"ca-k-d3\"></i>calcitriol</span><span><i class=\"ca-k-ctn\"></i>calcitonin</span></div></div></div></div></figure><div class=\"am-controls\" role=\"group\" aria-label=\"Case\"><button type=\"button\" class=\"am-btn\" data-cacase=\"low\" aria-pressed=\"false\">Calcium falls</button><button type=\"button\" class=\"am-btn\" data-cacase=\"normal\" aria-pressed=\"true\">Normal</button><button type=\"button\" class=\"am-btn\" data-cacase=\"high\" aria-pressed=\"false\">Calcium rises</button><button type=\"button\" class=\"am-btn\" data-cacase=\"hyper\" aria-pressed=\"false\">Primary hyperparathyroidism</button><button type=\"button\" class=\"am-btn\" data-cacase=\"soda\" aria-pressed=\"false\">High phosphate (soda)</button><button type=\"button\" class=\"am-btn\" data-cacase=\"meno\" aria-pressed=\"false\">Menopause</button></div>\n<p class=\"am-summary\" aria-live=\"polite\"></p>\n<p class=\"am-info\">Hover or tap the chief cells, the receptor, the C cells, the tubule, the hydroxylases, the enterocyte, the osteoblast or the osteoclast.</p><details class=\"am-sources\"><summary>What this shows, and what's simplified</summary><ul>\n<li>Everything here is from the L10 notes (Dr. Galin's slides and his 10/27 lecture): the calcium-sensing receptor paradox, PTH on kidney and bone (through the osteoblast), the kidney as the one place calcium and phosphate part ways, the two hydroxylases and what turns each on, calcitriol in the enterocyte, calcitonin, estrogen's brake, the soda example and primary hyperparathyroidism.</li>\n<li>Schematic and qualitative: levels are low / normal / high, not lab values; one tile per site, not to scale. Vitamin D's skin and liver steps (UV light, 25-hydroxylation) aren't drawn. Educational, not medical advice.</li></ul></details></div>",
    data: (function(){ var d = {"W":400,"H":440,"PTH_K":[[95,108],[95,172],[118,172],[118,262],[66,262]],"PTH_B":[[95,108],[95,166],[292,166],[292,336]],"CTN":[[336,112],[336,176],[352,176],[352,322]],"D3":[[120,340],[138,340],[138,300],[178,300]],"RCA":[[58,300],[102,300],[102,194]],"RP":[[46,236],[46,404]],"GUT":[[200,418],[200,382],[200,252],[200,192]],"BONE":[[348,366],[360,300],[366,192]],"PARA":[[300,348],[324,348]],"GAUGES":[["pth","PTH"],["d3","calcitriol"],["ctn","calcitonin"]],"SC":{"low":{"name":"calcium falls · PTH up","v":{"pth":0.92,"d3":0.85,"ctn":0.06,"gut":0.9,"rca":0.9,"rp":0.9,"res":0.85,"ca":0.15},"en":"1a","pit":"ok","trig":"Blood Ca²⁺ low","net":"Net: calcium back up, phosphate down","text":"Blood calcium falls (nerves fire too easily: tetany, Trousseau's and Chvostek's signs): the calcium-sensing receptor on chief cells isn't stimulated, intracellular calcium doesn't rise, and PTH secretion goes up. Kidney: more calcium reabsorbed in the distal tubule, phosphate excreted, and 1α-hydroxylase makes calcitriol, which turns on the gut's apical calcium channels, calbindin and basolateral pump. Bone: PTH binds osteoblasts (osteoclasts have no PTH receptor), whose paracrine cytokines and growth factors stimulate osteoclasts to resorb bone. Net: calcium up, phosphate down, though calcitriol's phosphate absorption in the gut evens the phosphate out in normal times."},"normal":{"name":"normal","v":{"pth":0.5,"d3":0.5,"ctn":0.5,"gut":0.5,"rca":0.5,"rp":0.5,"res":0.5,"ca":0.5},"en":"both","pit":"ok","trig":"Blood Ca²⁺ normal","net":"Formation and resorption balance","text":"Normal: plasma calcium is about 50% ionized, 40% protein-bound and 10% complexed, and the hormones control the ionized calcium at three sites: the gut, bone and kidney. Calcium and phosphate usually move the same way; the one exception is the kidney under PTH. Osteoblasts carry receptors for PTH, vitamin D3 and estrogen; osteoclasts carry the calcitonin receptor (\"put a star by this\"). The whole skeleton is replaced about every 7 years."},"high":{"name":"calcium rises · PTH down","v":{"pth":0.08,"d3":0.12,"ctn":0.9,"gut":0.15,"rca":0.2,"rp":0.2,"res":0.1,"ca":0.88},"en":"24","pit":"ok","trig":"Blood Ca²⁺ high","net":"Net: calcium falls back","text":"Blood calcium rises: calcium stimulates the Gq-coupled calcium-sensing receptor, intracellular calcium rises, and that inhibits PTH secretion: \"the one caveat in endocrinology where a rise in intracellular calcium actually inhibits the secretory pathway.\" High calcium also dulls nerves: lethargy, weakness, sleepiness. The kidney's 24-hydroxylase makes inactive 24,25-(OH)2-D3 instead of calcitriol. The C cells release calcitonin, which inhibits osteoclasts. Calcium falls back."},"hyper":{"name":"primary hyperparathyroidism","v":{"pth":0.95,"d3":0.85,"ctn":0.75,"gut":0.85,"rca":0.9,"rp":0.9,"res":0.95,"ca":0.9},"en":"1a","pit":"adenoma","stones":true,"trig":"A parathyroid adenoma","net":"PTH high despite high Ca²⁺; phosphate low","text":"Primary hyperparathyroidism: one or more parathyroid glands (hyperplasia or a benign tumor) make too much PTH: PTH high despite high calcium, with low phosphate. It is the most common disorder of calcium regulation. High calcium brings lethargy, weakness and constipation; PTH drives bone resorption (bone pain, fractures, vertebral compression); and so much calcium is filtered that it spills over, meets phosphate and forms kidney stones, again and again. Treatment: calcitonin, and bisphosphonates, which bind hydroxyapatite so osteoclasts can't break it down."},"soda":{"name":"high phosphate (lots of soda)","v":{"pth":0.5,"d3":0.12,"ctn":0.5,"gut":0.18,"rca":0.5,"rp":0.6,"res":0.5,"ca":0.4},"en":"24","pit":"ok","trig":"Blood phosphate high","net":"Less calcitriol: less calcium absorbed","text":"The \"real thing\" or a bad thing? Sodas get their caramel color and fizz from phosphate. In a growing child who drinks a lot of it, hyperphosphatemia turns off renal 1α-hydroxylase and switches on 24-hydroxylase, so the child makes inactive 24,25-(OH)2-D3 instead of calcitriol, absorbs less calcium and phosphate from the gut, and has less to build hydroxyapatite for lengthening bones."},"meno":{"name":"menopause · estrogen falls","v":{"pth":0.5,"d3":0.5,"ctn":0.5,"gut":0.5,"rca":0.5,"rp":0.5,"res":0.9,"ca":0.5},"en":"both","pit":"ok","noE":true,"trig":"Estrogen falls","net":"Blood calcium normal, bone lost","text":"Normally estrogen keeps bone breakdown in check by blocking PTH's ability to make osteoblasts activate osteoclasts. At menopause (around 50) estrogen drops off a cliff, the brake comes off, and resorption runs ahead of formation: osteoporosis, often first seen as dorsal kyphosis. Men are spared until andropause, around 75 to 80. Long-term glucocorticoids do something similar: they put osteoblasts \"in overdrive,\" continuously stimulating osteoclasts."}}};
    function caSvg(v, key, t, D) {
  var sc = D.SC[key], f = function (n) { return Math.round(n * 10) / 10; }, o = "";
  function tx(x, y, txt, cls, a) { return '<text class="ca-t' + (cls ? " " + cls : "") + '" x="' + f(x) + '" y="' + f(y) + '"' + (a ? ' text-anchor="' + a + '"' : "") + ">" + txt + "</text>"; }
  function lab(txt, x, y, px, py, a) { return '<g class="am-callout"><path class="ca-lead" d="M' + f(a === "end" ? x + 3 : x - 3) + " " + f(y - 4) + "L" + f(px) + " " + f(py) + '"/><circle class="ca-dot" cx="' + f(px) + '" cy="' + f(py) + '" r="1.8"/>' + tx(x, y, txt, "", a) + "</g>"; }
  function poly(p) { return "M" + p.map(function (q) { return f(q[0]) + " " + f(q[1]); }).join("L"); }
  function along(p, u) {
    var L = [], tot = 0;
    for (var i = 1; i < p.length; i++) { var d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); L.push(d); tot += d; }
    var s = u * tot;
    for (var j = 0; j < L.length; j++) { if (s <= L[j] || j === L.length - 1) { var w = L[j] ? Math.min(1, s / L[j]) : 0; return [p[j][0] + (p[j + 1][0] - p[j][0]) * w, p[j][1] + (p[j + 1][1] - p[j][1]) * w]; } s -= L[j]; }
  }
  function flow(p, level, cls, period, n, r) { var out = ""; for (var i = 0; i < n; i++) { var a = Math.max(0, Math.min(1, level * n - i)); if (a <= .01) continue; var u = (((t / period) + i / n) % 1 + 1) % 1, q = along(p, u); out += '<circle class="' + cls + '" cx="' + f(q[0]) + '" cy="' + f(q[1]) + '" r="' + (r || 3.2) + '" opacity="' + f(a) + '"/>'; } return out; }
  /* thyroid lobe with the parathyroid on its back */
  o += '<path class="ca-thy" d="M24 70C24 34 60 22 96 26C134 30 168 46 168 78C168 112 136 128 96 126C56 124 24 106 24 70Z"/>' + tx(96, 46, "thyroid · parathyroid", "ca-sm", "middle");
  var big = sc.pit === "adenoma";
  o += '<g class="hot" data-info="Parathyroid chief cells sense blood calcium through the calcium-sensing receptor (Gq) and release PTH. High calcium raises intracellular calcium, which inhibits PTH secretion; low calcium lets PTH secretion rise."><ellipse class="ca-para" cx="95" cy="86" rx="' + (big ? 42 : 34) + '" ry="' + (big ? 24 : 19) + '"/>' + tx(95, 90, "chief cells", "ca-in", "middle") + "</g>";
  if (big) o += '<circle class="ca-mass" cx="128" cy="100" r="11"/>';
  /* the CaSR: lit when calcium binds it */
  var lit = v.ca > .66;
  o += '<g class="hot" data-info="Calcium-sensing receptor (CaSR), Gq-coupled. Calcium stimulates it, intracellular calcium rises from internal stores, and that inhibits PTH secretion: the opposite of most secretory cells."><path class="ca-rec' + (lit ? " is-act" : "") + '" d="M' + (big ? 52 : 60) + " 78l-8 -6M" + (big ? 52 : 60) + " 78l-8 6M" + (big ? 52 : 60) + ' 78h-12"/></g>';
  if (lit) o += '<circle class="ca-ion" cx="' + (big ? 37 : 45) + '" cy="78" r="3.4"/>';
  /* PTH granules inside the gland, fewer when secretion is low */
  for (var g = 0; g < 6; g++) if (g < Math.round(v.pth * 6)) o += '<circle class="ca-pthg" cx="' + (78 + g * 7) + '" cy="' + (100 + (g % 2) * 4) + '" r="2.4"/>';
  /* thyroid follicle with a C cell beside it */
  o += '<g class="hot" data-info="C cells (parafollicular cells) sit outside the thyroid follicles and secrete calcitonin when plasma calcium rises (gastrin also stimulates them). Calcitonin isn\'t essential; its effects are opposite to PTH\'s."><circle class="ca-fol" cx="300" cy="74" r="32"/><circle class="ca-colloid" cx="300" cy="74" r="22"/><ellipse class="ca-ccell' + (v.ctn > .66 ? " is-act" : "") + '" cx="338" cy="102" rx="12" ry="9"/></g>';
  o += tx(300, 26, "thyroid C cells", "ca-sm", "middle");
  /* blood */
  o += '<rect class="ca-blood" x="12" y="150" width="376" height="44" rx="20"/>' + tx(24, 186, "blood", "ca-sm ca-onblood", "start");
  for (var b = 0; b < 9; b++) { var a = Math.max(0, Math.min(1, v.ca * 9 - b)); if (a > .01) { var bx = 30 + ((t / 90 + b * 41) % 340); o += '<circle class="ca-ion" cx="' + f(bx) + '" cy="' + (160 + (b % 3) * 8) + '" r="3" opacity="' + f(a) + '"/>'; } }
  /* the three tiles */
  o += '<rect class="ca-tile" x="12" y="212" width="118" height="216" rx="10"/><rect class="ca-tile" x="141" y="212" width="118" height="216" rx="10"/><rect class="ca-tile" x="270" y="212" width="118" height="216" rx="10"/>';
