er, iodi<b>d</b>e before iodi<b>n</b>e.</li><li><b>Organification and coupling.</b> Thyroperoxidase adds iodine to the tyrosines of thyroglobulin at the 3 or 5 position or both (<b>organification</b>), making MIT and DIT, then <b>couples</b> them into T3 and T4, still attached to thyroglobulin. That is three jobs for one enzyme.</li><li><b>Endocytosis.</b> The follicular cell takes colloid back in. The thyroglobulin receptor on the apical surface that allows this is <b>megalin</b>.</li><li><b>Proteolysis.</b> The vesicle fuses with a lysosome, and thyroglobulin is digested, freeing T4 (about 90%) and T3 (about 10%). The process is messy: the vesicle also holds leftover thyroglobulin, MIT and DIT.</li><li><b>Secretion and recycling.</b> Free T3 and T4 cross the cell membrane into the circulation. Leftover MIT and DIT are <b>deiodinated</b> so the iodine (and thyroglobulin) is recycled and the cycle starts over.</li></ol>\n<p>The only time T3 and T4 are inside the follicular cell is that last stage, as they are cut off thyroglobulin: the hormone is made out in the colloid.</p>\n<h4>Autoregulation by iodine</h4>\n<p>The thyroid has its own first line of defense against swings in iodine supply, <b>independent of TSH</b>. Iodine deficiency increases trapping (NIS speeds up). A very large iodine load <b>blocks hormone synthesis</b> by inhibiting organification (the <b>Wolff-Chaikoff effect</b>); iodine also lowers NIS expression. The effect is <b>short-lived</b>: the gland escapes it by decreasing iodide transport, and once iodide levels fall it makes hormone again. Before drugs like propylthiouracil, a large iodide dose was one way to treat hyperthyroidism, and it can be used diagnostically: a normal gland should shut down.</p>\n<h4>The hypothalamic-pituitary-thyroid axis</h4>\n<p>Regulation starts in the hypothalamus (every \"RH\" is a releasing hormone, and they all come from the hypothalamus). <b>TRH</b>, a peptide made by cell bodies of the paraventricular nucleus, travels down the portal system to the anterior pituitary and binds TRH receptors on thyrotrophs. The TRH receptor is <b>Gq</b>-coupled: phospholipase C makes IP3 and DAG, intracellular calcium is mobilized and protein kinase C is activated, leading to transcription and release of <b>TSH</b>. Dr. Galin: \"We're not going to ask you to know every receptor for every hormone, but understand the differences between a Gq, a Gs, and a Gi.\"</p>\n<p>TSH binds the <b>TSH receptor</b> on the basolateral side of the follicular cell. The TSH receptor is <b>Gs</b>-coupled: adenylyl cyclase raises cAMP and activates <b>protein kinase A</b>, which phosphorylates proteins to change their function and opens calcium channels. The primary target of TSH is the thyroid itself, and it does two things:</p>\n<ul><li><b>Growth</b>: more gene transcription and translation, so larger cells (hypertrophy), more cells (hyperplasia) and new follicles. That is why a <b>goiter</b> can form.</li><li><b>Hormone synthesis</b>: more iodide trapping (NIS expression and activity), more thyroglobulin, iodination (pendrin expression, thyroperoxidase expression and activity), endocytosis of colloid (megalin expression) and thyroglobulin degradation (deiodinase activity), plus glucose oxidation, glycolysis and <b>NADPH</b>, which generate the <b>hydrogen peroxide</b> that is thyroperoxidase's substrate. Without it, the enzyme would have nothing to work with.</li></ul>\n<p><b>Negative feedback</b>: T4 and T3 feed back on both the pituitary (TSH) and the hypothalamus (TRH). High T3/T4 lowers TSH release; low T3/T4 raises it. <b>T3 is the predominant inhibitor of TSH secretion</b> (T4 is converted to T3 by deiodination). There is an indirect loop too: T4 makes the hypothalamus release <b>somatostatin</b>, which inhibits TSH from the thyrotrophs; dopamine also inhibits TSH. You don't want whole-body metabolism overstimulated.</p>\n<p>The hypothalamus also reads the environment: <b>thermal and caloric</b> signals.</p>\n<ul><li><b>Cold</b> raises thyroid hormone (more metabolism makes heat), but with very long, severe cold exposure it drops back down to spare the body.</li><li><b>Heat</b> (a 103-degree August day) lowers it.</li><li><b>Eating</b> raises it, to use the energy you just took in; <b>fasting</b> lowers it, to preserve energy stores.</li></ul>\n<h4>What thyroid hormone does</h4>\n<p>Most hormone leaves the gland as T4 and is deiodinated to the more potent <b>T3</b>; most circulating T3 comes from that peripheral conversion. More than <b>99%</b> is bound to thyroxine-binding globulin, prealbumin (transthyretin) and albumin; only about 1% circulates free. Being a hydrophobic amine, it enters the cell and binds its <b>receptor in the nucleus</b> (paired with the retinoid X receptor as a heterodimer, a detail you don't need), and activates transcription, translation and new protein synthesis. Overall its effects are <b>catabolic</b>: breaking things down to use energy, in almost every organ system.</p>\n<ul><li><b>Basal metabolic rate</b>: it increases synthesis of <b>Na+/K+-ATPase</b>, the pumps behind energy-driven transport, raising oxygen consumption and heat production; it also raises gluconeogenic and respiratory enzymes.</li><li><b>Heart</b>: more <b>beta-1 receptors</b> on the myocardium, so heart rate and contractility rise and the heart is more sensitive to sympathetic stimulation. It also switches cardiac myosin from the beta heavy chain to the <b>alpha heavy chain</b>, which contracts more strongly: more cardiac output.</li><li><b>Metabolism</b>: more glucose absorption, glycogenolysis, gluconeogenesis, lipolysis, and protein synthesis and degradation (net catabolic).</li><li><b>Cholesterol</b>: thyroid hormone keeps up the <b>LDL receptors</b> that clear cholesterol, so hypothyroid patients have very high cholesterol (\"often a board type question\").</li><li><b>Nervous system</b>: T3 is <b>absolutely required for perinatal brain development</b> (growth of the cerebral and cerebellar cortex, axon proliferation, synaptogenesis, myelin). In adults it enhances wakefulness and responsiveness, emotional tone and memory.</li><li><b>Sympathetic synergy</b>: it increases beta-adrenergic receptors and Gs proteins essentially all over the body, which drives its metabolic and cardiac effects. To Dr. Galin this is \"the most important thing that thyroid hormone does.\"</li><li><b>Growth</b>: in children it acts <b>synergistically with growth hormone</b> on bone, stimulating chondrocytes, osteoblasts and osteoclasts and keeping the ossification centers active. On a hand X-ray, a hypothyroid child's ossification centers lag behind a normal child's of the same age and sex. Hypothyroidism in childhood slows the chondrocyte cycle and causes short stature; treatment brings \"catch-up growth.\" Too much thyroid hormone gives a growth spurt but ultimately short stature, because the plates fuse too soon.</li></ul>\n<h4>Primary hyperthyroidism: high T4/T3, low TSH</h4>\n<p>Dr. Galin calls primary hyperthyroidism the most common pathological condition of the thyroid. Most cases are autoimmune: <b>Graves disease</b>, where <b>autoantibodies bind and activate TSH receptors</b>, acting like TSH (agonists). The pituitary is fine, so feedback drives <b>TSH low</b>. A thyroid tumor is another cause. Symptoms follow the hormone's actions:</p>\n<ul><li>A large increase in BMR: <b>weight loss despite increased food intake</b> (hungry all the time)</li><li>More heat production: <b>heat intolerance</b> and excessive sweating</li><li>More sympathetic activity: <b>tachycardia</b>, tremor, nervousness, a wide-eyed stare</li><li>An enlarged thyroid: <b>goiter</b>, from follicular cell hypertrophy and hyperplasia</li><li><b>Exophthalmos</b>: the antibodies cross-react with the muscles behind the eye, and the inflammation pushes the eyeballs forward</li></ul>\n<p>Treatment: surgical removal with hormone replacement; <b>propylthiouracil</b> (a thiouracil), which blocks thyroperoxidase and so blocks everything that happens in the colloid (iodide to iodine, iodination, MIT and DIT, coupling); L8 covers when methimazole is chosen instead; or thiocyanate, which blocks iodide trapping and is hardly used now. <b>Thyroid storm</b> is rare (1 to 2% of hyperthyroid patients): hyperthermia and mental disturbance on top of thyrotoxic symptoms, set off by events such as withdrawal of an antithyroid drug, radioiodine therapy, infection or surgery. It is managed with IV fluids, beta-blockers, antithyroid drugs and steroids.</p>\n<h4>Primary hypothyroidism: low T4/T3, high TSH</h4>\n<p>Primary means the gland itself is failing, so TSH is <b>very high</b>. The most common cause is <b>Hashimoto's disease</b>, an autoimmune destruction of the thyroid that blocks hormone synthesis and glandular growth. Other causes: genetic defects in, or autoantibodies against, the proteins needed for hormone synthesis (thyroperoxidase, megalin) or for converting T4 to T3, and severe iodide deficiency. A secondary cause is pituitary failure, so no TSH reaches the thyroid; primary causes are much more common. Thyroid hormone production also falls normally in the later decades of life.</p>\n<ul><li><b>Hypercholesterolemia</b> (common): too few LDL receptors. A patient whose cholesterol suddenly climbs after years of normal values, and doesn't respond to a statin, should have their thyroid checked.</li><li>Less heat production: <b>cold intolerance</b></li><li>Lethargy, sleepiness, slowed thinking</li><li><b>Bradycardia</b>; less sympathetic activity</li><li>Lowering of the upper eyelid (<b>ptosis</b>), partly from the autoimmune response</li><li><b>Myxedema</b>: proteins complexed with hyaluronic acid and chondroitin sulfate deposit in the skin and attract water, causing swelling</li></ul>\n<p>In utero, infancy and childhood, hypothyroidism causes marked <b>growth retardation</b> and severe intellectual disability from a poorly developed nervous system: <b>congenital hypothyroidism</b>, historically called <b>cretinism</b> (no longer used in the clinic, but still in textbooks). The slides show a 17-year-old with hypothyroidism beside his 9-year-old brother: short stature, more body fat and reduced mental capacity. The classic cause is congenital iodine deficiency, from too little dietary iodine during pregnancy. Signs include goiter, poor growth, thickened skin, hair loss, an <b>enlarged tongue</b>, a protruding abdomen, and delayed bone maturation and puberty. Treatment for all hypothyroidism is <b>hormone replacement</b>; in congenital hypothyroidism a few weeks to a couple of months of replacement \"can work wonders,\" but only if it is caught in time. That is why thyroid function is checked in newborns and developing children.</p>\n<h4>Why a goiter?</h4>\n<p>TSH is a growth signal for the gland. When hormone is low and the pituitary is working (Hashimoto's, iodine deficiency), the high TSH keeps stimulating the thyroid to grow. In Graves disease the stimulating antibodies do the same through the TSH receptor. So a goiter can come with too much or too little hormone.</p>\n<p>Dr. Galin's take-home: the biosynthesis; good bullet points for hyperthyroidism and hypothyroidism; and why thyroid function is measured in children.</p>\n", "pancreas": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Islet cell types, their hormones and rough percentages</li><li>Insulin synthesis (preproinsulin → proinsulin → insulin + C-peptide) and why C-peptide is measured</li><li>Glucose-induced insulin secretion, step by step, and what else stimulates or inhibits it</li><li>The insulin receptor and GLUT4; insulin's big-picture effects in liver, muscle and fat</li><li>Glucagon: receptor, target, effects (glycogenolysis, gluconeogenesis, ketogenesis) and regulation</li><li>Somatostatin's paracrine role</li><li>Type 1 vs type 2 diabetes: cause, symptoms, complications, type 2 drugs</li></ul></div>\n<p>Dr. Madison: the pancreas is different from the glands under hypothalamic-pituitary control. It is tuned to <b>metabolism</b> and the metabolites we take in, not only carbohydrates but lipids and proteins too. He wants the <b>big picture</b> of what insulin and glucagon do in each tissue, \"not so much nitty-gritty detail\" about every enzyme.</p>\n<h4>Anatomy and the two jobs</h4>\n<p>The pancreas lies in the upper abdomen, parallel to and beneath the stomach: a <b>head</b> in the C-shaped duodenum and a <b>body and tail</b> reaching toward the spleen. Its <b>exocrine</b> part (acinar cells and ducts) makes up most of the gland and secretes digestive proenzymes (amylase, trypsin) and bicarbonate into the duodenum through the pancreatic duct. Its <b>endocrine</b> part is the <b>islets of Langerhans</b>, small patches scattered like islands (about 1 million of them), only around 5% of the mass by Dr. Madison's estimate, but very important. Islets are <b>highly vascularized</b> (everything they make must reach the blood) and have <b>autonomic innervation</b> that helps regulate secretion.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Islet cell</th><th>Share</th><th>Secretes</th><th>Role</th></tr></thead><tbody>\n<tr><td>Beta (β)</td><td>About 70% (the most)</td><td>Insulin and amylin</td><td>Lowers blood glucose; amylin is co-secreted and affects food intake and stomach emptying</td></tr>\n<tr><td>Alpha (α)</td><td>About 20%</td><td>Glucagon</td><td>Raises blood glucose</td></tr>\n<tr><td>Delta (δ)</td><td>Under 10%</td><td>Somatostatin</td><td>Inhibits both insulin and glucagon (paracrine)</td></tr>\n<tr><td>Gamma (γ, PP)</td><td>Under 5%</td><td>Pancreatic polypeptide</td><td>Regulates pancreatic (exocrine) and hepatic secretions</td></tr>\n<tr><td>Epsilon (ε)</td><td>Under 1%</td><td>Ghrelin</td><td>Regulates food intake and fat deposition</td></tr>\n</tbody></table></div>\n<p>Islet cells talk three ways. <b>Humoral</b>: blood flows from the center of the islet outward, and beta cells cluster in the center with alpha and delta cells at the edge, so each cell's product washes over the next (glucagon is a potent insulin secretagogue, insulin modestly inhibits glucagon, somatostatin potently inhibits both). <b>Cell-cell</b>: gap and tight junctions. <b>Neural</b>: cholinergic (parasympathetic) input increases insulin; adrenergic input can stimulate (beta) or inhibit (alpha) depending on which dominates.</p>\n<h4>Insulin: made like a peptide</h4>\n<p>Insulin is the body's main <b>anabolic</b> hormone: it promotes storage and buildup. It is a peptide of 51 amino acids, two chains (A and B) joined by disulfide bonds. It comes off the ribosome as <b>preproinsulin</b>; in the ER the signal sequence is clipped off, leaving <b>proinsulin</b> (A, C and B segments); in the Golgi and granules the <b>C segment is cut out</b> as <b>C-peptide</b>, leaving bioactive insulin. Insulin is packed in secretory vesicles in a complex with zinc, together with the C-peptide.</p>\n<p><b>C-peptide</b> has no established biological action, but it is secreted in a <b>1:1 molar ratio</b> with insulin and is <b>more stable</b>: insulin has a short half-life (insulinases break it down) and about 60% is removed on its first pass through the liver, while C-peptide is not extracted by the liver. So C-peptide is the clinical marker of how much insulin the beta cells are making. (Proinsulin has only modest activity and is a small share of what is secreted.)</p>\n<h4>Glucose-induced insulin secretion</h4>\n<p>The primary signal for insulin release is <b>elevated blood glucose</b>, \"that's why it's bolded.\"</p>\n<ol><li>Glucose enters the beta cell through <b>GLUT2</b> transporters.</li><li>It is phosphorylated (glucokinase) and metabolized through glycolysis, raising <b>ATP</b> (the ATP:ADP ratio).</li><li>ATP <b>closes ATP-sensitive K+ channels</b> (K-ATP, the sulfonylurea receptor).</li><li>Potassium stays in, so the membrane <b>depolarizes</b>.</li><li>Depolarization opens <b>voltage-dependent calcium channels</b>.</li><li>The rise in intracellular <b>calcium</b> fuses insulin vesicles with the membrane and releases insulin.</li></ol>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Stimulate insulin secretion</th><th>Inhibit insulin secretion</th></tr></thead><tbody>\n<tr><td>Increase in blood glucose (the main one)</td><td>Decrease in blood glucose</td></tr>\n<tr><td>Amino acids; keto acids and fatty acids (fuel that makes ATP)</td><td>Somatostatin (paracrine, through a Gi receptor)</td></tr>\n<tr><td>Glucagon (a Gs receptor on beta cells: cAMP, PKA)</td><td>Norepinephrine from the adrenal medulla (alpha-adrenergic, Gi): fight or flight</td></tr>\n<tr><td>Cholecystokinin and acetylcholine (Gq: phospholipase C, IP3, calcium from the ER; the parasympathetic route)</td><td></td></tr>\n<tr><td>Incretins GLP-1 and GIP (G-protein-coupled receptors)</td><td></td></tr>\n</tbody></table></div>\n<p>The other stimulators mostly <b>potentiate</b> the glucose response rather than drive large release on their own. <b>Sulfonylureas</b> act at the same K-ATP channels: they close them, depolarize the cell and release insulin.</p>\n<h4>The insulin receptor</h4>\n<p>The insulin receptor is a <b>receptor tyrosine kinase</b> (enzyme-linked): two extracellular <b>alpha subunits</b> bind insulin; two intracellular <b>beta subunits</b> have tyrosine kinase activity. Binding triggers <b>autophosphorylation</b> of the beta subunits, which then phosphorylate docked <b>insulin receptor substrates (IRS)</b>; IRS-1 activates PI3K and other kinases. Within <b>seconds</b>, vesicles of <b>GLUT4</b> move to the membrane of muscle and fat cells so they can take up glucose. Slower effects, over hours, come from changes in gene expression. The liver does not rely on GLUT4.</p>\n<h4>What insulin does, tissue by tissue</h4>\n<p>Big picture: \"We've got a lot of glucose around: use it or store it.\" Main targets are <b>skeletal muscle, liver and adipose tissue</b>.</p>\n<ul><li><b>Liver</b>: promotes <b>glycogenesis</b> (activates glucokinase and glycogen synthase), <b>glycolysis</b> (phosphofructokinase, pyruvate kinase) and <b>fatty acid synthesis</b> (acetyl-CoA carboxylase, the rate-limiting step; fatty acid synthase). Inhibits glycogenolysis (glycogen phosphorylase), <b>gluconeogenesis</b> (glucose-6-phosphatase, fructose-1,6-bisphosphatase, PEP carboxykinase) and ketogenesis.</li><li><b>Adipose</b>: promotes <b>lipogenesis</b>: glucose uptake through GLUT4, conversion to triglycerides, uptake and esterification of fatty acids (lipoprotein lipase helps). <b>Inhibits lipolysis</b> by inhibiting hormone-sensitive lipase.</li><li><b>Muscle</b>: recruits <b>GLUT4</b>, promotes glycogen synthesis (hexokinase, glycogen synthase) and glycolysis (hexokinase, PFK, pyruvate dehydrogenase), and, especially important here, <b>promotes protein synthesis</b> and amino acid uptake while decreasing protein breakdown. Muscle does little or no gluconeogenesis.</li></ul>\n<h4>Glucagon: the opposite</h4>\n<p>Glucagon is the main <b>catabolic</b> hormone, for fasting between meals: tap into reserves. It is a peptide from alpha cells (made as <b>proglucagon</b>), stored in vesicles, with a very short half-life of about <b>3 to 4 minutes</b>. It signals through a <b>G-protein-coupled receptor (Gs)</b>: adenylyl cyclase, cAMP, protein kinase A. It is released into the hepatic portal vein, so its main target is the <b>liver</b> (it has effects on fat too, such as lipolysis). Muscle lacks glucagon receptors; muscle glycogen is broken down by epinephrine during exercise, not by glucagon.</p>\n<ul><li><b>Glycogenolysis</b>: activates glycogen phosphorylase and glucose-6-phosphatase (which lets glucose leave the hepatocyte); inactivates glycogen synthase.</li><li><b>Gluconeogenesis</b>: activates PEP carboxykinase and inhibits PFK and pyruvate kinase, so amino acids and lactate are pushed toward new glucose instead of glycolysis.</li><li><b>Ketogenesis</b>: glucagon <b>inhibits acetyl-CoA carboxylase</b>, so less <b>malonyl-CoA</b> is made. Malonyl-CoA normally blocks the carnitine shuttle (carnitine acyltransferase I), so fatty acids now pour into mitochondria for oxidation. When that exceeds the liver's energy need, fatty acids are only partly oxidized and <b>ketone bodies</b> (acetoacetate, beta-hydroxybutyrate, and acetone) form. Ketones appear once liver glycogen is depleted, usually within the first 24 hours of fasting, and in starvation, very low-carbohydrate diets, prolonged exercise, alcoholism and untreated type 1 diabetes.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Stimulate glucagon</th><th>Inhibit glucagon</th></tr></thead><tbody>\n<tr><td>Decrease in blood glucose (the main one)</td><td>Increase in blood glucose</td></tr>\n<tr><td>Epinephrine (sympathetic, fight or flight)</td><td>Somatostatin (paracrine)</td></tr>\n<tr><td>Amino acids (protein meals)</td><td>Free fatty acids</td></tr>\n<tr><td>Acetylcholine (modest; helps prevent hypoglycemia after insulin)</td><td>Ketones</td></tr>\n</tbody></table></div>\n<h4>Somatostatin</h4>\n<p>Delta-cell somatostatin is the <b>paracrine brake on both insulin and glucagon</b>, keeping them in check: too much insulin would drain blood glucose, too much glucagon would keep it high. It acts through a <b>Gi</b> receptor (inhibits adenylyl cyclase). Its secretion is stimulated by increased blood glucose, amino acids, keto acids and several gut hormones released after a meal. It also slows motility of the stomach, duodenum and gallbladder and decreases GI secretion and absorption, extending the time over which nutrients are absorbed. (Glucagon, by contrast, <b>stimulates</b> insulin: beta cells have glucagon receptors.)</p>\n<h4>Diabetes mellitus</h4>\n<p>Diabetes is a syndrome of impaired carbohydrate, fat and protein metabolism caused by a lack of insulin secretion or by decreased tissue sensitivity to insulin.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th></th><th>Type 1 (insulin-dependent)</th><th>Type 2</th></tr></thead><tbody>\n<tr><td>Cause</td><td>Selective destruction of beta cells, usually autoimmune (often a type IV hypersensitivity) or idiopathic</td><td>Tissue resistance to insulin; genetic and environmental (obesity, diet)</td></tr>\n<tr><td>Insulin</td><td>Severe or absolute deficiency</td><td>Relative deficiency, later: beta cells overcompensate and become exhausted</td></tr>\n<tr><td>Onset</td><td>Usually under 30</td><td>Usually over 35 (but seen in children)</td></tr>\n<tr><td>Treatment</td><td>Requires insulin</td><td>Diet and exercise first, then drugs</td></tr>\n</tbody></table></div>\n<p>Symptoms: <b>hyperglycemia</b>; hyperkalemia (secondary to kidney dysfunction); <b>glucosuria</b>, because the filtered load of glucose exceeds the renal transporters' maximum (Tm) and glucose spills into urine; <b>polyuria</b>, an osmotic diuresis because glucose in the tubule holds water; <b>polydipsia</b> (thirst from dehydration); and <b>polyphagia</b> (cells starved of fuel signal hunger to the hypothalamus).</p>\n<p>Complications come mostly from <b>vascular damage</b>: glucose glycosylates proteins of the vessel lining, especially in small vessels. <b>Retinopathy</b> (the most common cause of blindness in working-age adults), <b>nephropathy</b> (16% of new patients needing renal replacement therapy), erectile dysfunction (up to 50% of men with long-standing diabetes), 2 to 4 times the risk of coronary heart disease and stroke (75% have hypertension), and <b>peripheral neuropathy</b> with foot ulcers (15% of people with diabetes; 5 to 15% of those need amputation), because injuries go unfelt and heal poorly.</p>\n<h4>Treating type 2 diabetes</h4>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Approach</th><th>Drugs</th></tr></thead><tbody>\n<tr><td>Suppress liver glucose production</td><td>Metformin (usually the first drug after diet and exercise)</td></tr>\n<tr><td>Increase insulin sensitivity</td><td>Thiazolidinediones</td></tr>\n<tr><td>Release more insulin (close K-ATP channels)</td><td>Sulfonylureas</td></tr>\n<tr><td>Suppress renal glucose reabsorption</td><td>SGLT2 inhibitors</td></tr>\n<tr><td>Mimic the incretin GLP-1 (and GIP)</td><td>GLP-1 agonists such as Ozempic; Mounjaro (GLP-1 and GIP agonist)</td></tr>\n<tr><td>Keep the body's own incretins around longer</td><td>DPP-4 inhibitors (DPP-4 inactivates GLP-1 and GIP)</td></tr>\n</tbody></table></div>\n", "adrenal": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Cortex vs medulla; the three zones and their hormones; blood flowing from cortex to medulla</li><li>Steroid synthesis: cholesterol from LDL; the \"lightning bolt\" control points (cholesterol desmolase, aldosterone synthase)</li><li>Aldosterone: what turns it on (angiotensin II, potassium, a little ACTH), what it does in the kidney</li><li>Cortisol: the HPA axis, circadian rhythm, metabolic and immune effects</li><li>The medulla: chromaffin cells, PNMT, why it makes mostly epinephrine</li><li>Aldosterone deficiency vs excess; Addison's (with hyperpigmentation), Cushing's, 21-hydroxylase deficiency</li></ul></div>\n<p>Dr. Madison: the adrenal is very different from the pancreas because we go back to the <b>hypothalamus-anterior pituitary</b> for control, and it is the gland of the <b>stress response</b>. For the steroid pathway, \"I don't expect you to know\" all the enzymes; know the key regulatory points, the \"lightning bolts.\"</p>\n<h4>Anatomy and blood flow</h4>\n<p>The adrenal (suprarenal) glands sit like a top hat on each kidney: small (about 4 to 6 g, 3 cm) but with one of the greatest blood supplies per gram of any organ. Three arteries usually supply each gland: the <b>superior</b> suprarenal (from the inferior phrenic), <b>middle</b> (directly from the aorta) and <b>inferior</b> (from the renal artery). The right suprarenal vein drains into the inferior vena cava; the left into the left renal vein (or left inferior phrenic vein).</p>\n<p>Each gland has two parts. The <b>cortex</b> (about 90% of the mass, lighter-staining) makes <b>steroid</b> hormones. The <b>medulla</b> (the inner part) is a functional extension of the sympathetic nervous system that makes <b>catecholamines</b> (epinephrine, norepinephrine). Blood flows <b>from the outer capsule down through the cortex into the medulla</b>, so cortical hormones regulate the medulla on the way.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Region</th><th>Makes</th><th>Main control</th></tr></thead><tbody>\n<tr><td>Zona glomerulosa (outermost)</td><td>Mineralocorticoids: aldosterone</td><td>Angiotensin II and potassium (ACTH only a little)</td></tr>\n<tr><td>Zona fasciculata (middle)</td><td>Glucocorticoids: cortisol</td><td>ACTH</td></tr>\n<tr><td>Zona reticularis (innermost cortex)</td><td>Weak androgens: DHEA, androstenedione</td><td>ACTH</td></tr>\n<tr><td>Medulla</td><td>Catecholamines: about 80% epinephrine</td><td>Sympathetic preganglionic fibers (acetylcholine), plus ACTH and cortisol</td></tr>\n</tbody></table></div>\n<p>The fasciculata and reticularis used to be thought of as strictly separate, but there is co-production in both, so he groups them together.</p>\n<h4>Making steroids</h4>\n<p>All corticosteroids come from <b>cholesterol</b>. Cortical cells get most of it from circulating <b>LDL</b> (receptor-mediated endocytosis); a minor amount is made in the ER. The products differ in carbon count: <b>21-carbon</b> steroids (progesterone, glucocorticoids, mineralocorticoids) and <b>19-carbon</b> androgens; you don't need to memorize that. Each zone has its own enzymes, which is why each zone makes different hormones from the same start.</p>\n<p><b>Lightning bolt 1</b>: the first step for every steroid hormone, <b>cholesterol → pregnenolone</b>, by <b>cholesterol desmolase</b> (P450 side-chain cleavage enzyme, <b>CYP11A1</b>) in the inner mitochondrial membrane. It is stimulated by <b>ACTH</b> and is the rate-limiting step for cortisol.</p>\n<h4>Zona glomerulosa and aldosterone</h4>\n<p>The glomerulosa is the <b>only zone with aldosterone synthase (CYP11B2)</b>, so it is the sole source of aldosterone. <b>Lightning bolt 2</b>: aldosterone synthase is the key regulatory point for aldosterone. Aldosterone responds to a <b>drop in blood pressure</b> or an <b>elevated potassium</b>:</p>\n<ul><li><b>Angiotensin II</b> is the <b>primary regulator</b>. When the juxtaglomerular cells of the afferent arteriole sense low pressure, or the macula densa senses low sodium delivery, the kidney secretes <b>renin</b>; renin cleaves angiotensinogen to angiotensin I; <b>ACE</b> (largely in the lung endothelium) converts it to angiotensin II. Angiotensin II binds a <b>Gq</b>-coupled receptor on glomerulosa cells: calcium rises, <b>PKC</b> is activated, and PKC activates cholesterol desmolase and aldosterone synthase.</li><li><b>Serum potassium</b>: a rise in K+ <b>depolarizes</b> glomerulosa cells, opening voltage-gated calcium channels and activating PKC, with the same result.</li><li><b>ACTH</b> has only a <b>modest, transient</b> effect (a bolus raises aldosterone 10 to 20%); it acts on the early steps and has no effect on aldosterone synthase.</li></ul>\n<p>Aldosterone is a steroid, so it acts by <b>changing gene transcription</b>. In the distal tubule and cortical collecting duct (principal cells) it upregulates <b>apical ENaC</b> sodium channels, <b>basolateral Na+/K+ pumps</b>, the mitochondrial machinery to make the <b>ATP</b> those pumps need, and apical <b>potassium channels</b>. Result: <b>sodium reabsorbed</b> into the blood (water follows, so blood pressure rises) and <b>potassium secreted</b> into the urine. It also promotes <b>hydrogen ion secretion</b> (acid-base), bicarbonate excretion and chloride reabsorption, and acts similarly in the colon, salivary and sweat glands. Cortisol binds the mineralocorticoid receptor about as well as aldosterone, so the kidney uses <b>11β-hydroxysteroid dehydrogenase</b> to convert cortisol to inactive cortisone, keeping cortisol from driving blood pressure. ADH is often released at the same time to add water reabsorption.</p>\n<h4>Zona fasciculata and cortisol</h4>\n<p>Cortisol, the main glucocorticoid, depends on the <b>HPA axis</b>. Stimuli feed into the hypothalamus: <b>hypoglycemia</b> (a potent stimulus), sleep-wake cycles, and <b>stress</b> (infection, trauma, surgery, psychological). The paraventricular nucleus releases <b>CRH</b>; the anterior pituitary releases <b>ACTH</b>; ACTH acts on the cortex. ACTH binds a <b>Gs</b>-coupled receptor: PKA activates <b>cholesterol desmolase</b> (the rate-limiting step) and moves more <b>LDL receptors</b> to the surface so the cell gets more cholesterol. Cortisol feeds back on the pituitary and hypothalamus (<b>long loop</b>); ACTH can feed back to turn off CRH (<b>short loop</b>).</p>\n<p><b>Circadian rhythm</b>: cortisol (and the ACTH that precedes it) peaks early in the morning, around <b>7 to 8 am</b>, right at waking, to prepare for the day's stresses and because blood glucose has fallen overnight; it is lowest around 2 to 4 am.</p>\n<h4>What cortisol does</h4>\n<p>The main metabolic goal is <b>raising blood glucose, mainly for the brain</b>, which depends heavily on glucose during stress.</p>\n<ul><li>Liver: <b>stimulates gluconeogenesis</b>.</li><li>Muscle and fat: <b>decreases glucose uptake</b> (fewer transporters), keeping glucose in the blood.</li><li>Muscle: <b>breaks down protein</b>, sending amino acids to the liver as gluconeogenesis substrate.</li><li>Fat in the extremities: <b>lipolysis</b>, freeing glycerol for gluconeogenesis. Central (truncal) fat responds differently: in cortisol excess it undergoes <b>lipogenesis</b>.</li></ul>\n<p>Cortisol is also a potent <b>immune suppressant</b>, which is why glucocorticoids treat chronic inflammation. It inhibits <b>phospholipase A2</b> (so fewer prostaglandins), lowers B-cell counts, inhibits T-cell responses and cytokines (IL-2), decreases neutrophil migration, inhibits histamine and serotonin release, and decreases vascular permeability, so immune cells can't reach the site. Chronic stress with high cortisol even blunts antibody responses to vaccines.</p>\n<h4>Adrenal androgens</h4>\n<p>The adrenal makes <b>weak</b> androgens, mainly <b>DHEA</b> and <b>androstenedione</b>. They contribute to secondary sex characteristics (axillary and body hair) and serve as intermediates the testes and ovaries convert to stronger testosterone and estrogens. After menopause the adrenal androgens take over more of the androgen role.</p>\n<h4>The medulla</h4>\n<p>The adrenal medulla is a <b>specialized sympathetic ganglion</b>. Sympathetic preganglionic fibers (via the greater splanchnic nerve) synapse directly on <b>chromaffin cells</b> and release <b>acetylcholine</b>; the chromaffin cells act like postganglionic neurons and release catecholamines into the blood. About <b>80% is epinephrine</b>, because chromaffin cells are rich in <b>PNMT</b> (phenylethanolamine N-methyltransferase), which converts norepinephrine to epinephrine. The pathway is tyrosine → DOPA → dopamine → norepinephrine → epinephrine. Its regulatory points:</p>\n<ul><li><b>Sympathetic stimulation</b> (acetylcholine) activates tyrosine hydroxylase and dopamine beta-hydroxylase.</li><li><b>ACTH</b> stimulates the same enzymes: a partnership between cortex and medulla.</li><li><b>Cortisol activates PNMT</b>. Because blood flows from cortex to medulla, the cortisol made in a stress response arrives at the medulla and boosts epinephrine production.</li></ul>\n<h4>When it goes wrong</h4>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Aldosterone deficiency</th><th>Aldosterone excess</th></tr></thead><tbody>\n<tr><td>Salt craving</td><td>Sodium retention</td></tr>\n<tr><td>Natriuresis (sodium lost in urine)</td><td>Potassium depletion</td></tr>\n<tr><td>Hyponatremia</td><td>Hypokalemia</td></tr>\n<tr><td>Acidosis</td><td>Alkalosis</td></tr>\n<tr><td>Dehydration</td><td>Expansion of extracellular volume</td></tr>\n<tr><td>Orthostatic hypotension</td><td>Hypertension</td></tr>\n</tbody></table></div>\n<p><b>Primary aldosteronism</b> is overproduction by the adrenal itself, not driven by renin: hypertension with <b>hypokalemia</b> is the clue. <b>Secondary hyperaldosteronism</b> comes from an overactive renin-angiotensin system.</p>\n<p><b>Addison's disease</b> (primary adrenal insufficiency) is usually autoimmune destruction of the cortex, so cortisol (and often aldosterone and other steroids) are lost: <b>hypoglycemia</b>, salt loss and low blood pressure. With no cortisol, there is no negative feedback, so <b>ACTH is high</b>. ACTH is cut from POMC along with <b>α-MSH</b>, so excess ACTH brings excess MSH and <b>hyperpigmentation</b> of the skin and mucous membranes, often in the <b>gums</b>, and often months to years before other symptoms. Its mineralocorticoid loss is treated with <b>fludrocortisone</b>.</p>\n<p><b>Cushing syndrome</b> is prolonged exposure to high cortisol. <b>ACTH-dependent</b> forms: a pituitary adenoma making ACTH (<b>Cushing's disease</b>) or an ectopic ACTH source such as a neuroendocrine tumor. <b>ACTH-independent</b> forms: an adrenal cortical tumor, or <b>exogenous</b> glucocorticoids taken for a long time. Signs: psychological disturbance, <b>truncal obesity</b>, a <b>moon face</b> and a <b>buffalo hump</b> (central fat responds to excess cortisol with lipogenesis), insulin resistance, gonadal dysfunction, <b>osteoporosis</b> and hypertension.</p>\n<p><b>Congenital adrenal hyperplasia</b>: defects in cortisol synthesis lower cortisol, so ACTH rises and drives the adrenal toward everything up to and around the block. In <b>21-hydroxylase deficiency</b> (the most common), neither cortisol nor aldosterone is made effectively: salt wasting and hyperkalemia, and excess adrenal androgens that virilize female fetuses. (11β-hydroxylase deficiency also virilizes but causes hypertension; 17α-hydroxylase deficiency causes hypertension, hypokalemia and hypogonadism.) One enzyme defect can produce a whole constellation of symptoms because the cortex's pathways share their early steps.</p>\n", "steroids": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Which drug to choose: duration of action (short, intermediate, long) and glucocorticoid vs mineralocorticoid activity</li><li>Mechanism: nuclear receptors; transport on CBG; why a high dose raises the free fraction</li><li>Why you taper (HPA suppression and adrenal insufficiency)</li><li>Side effects and cautions: the ones \"often tested,\" including oral candidiasis, raised eye pressure, osteoporosis</li><li>Fludrocortisone; cortisol synthesis inhibitors (ketoconazole, metyrapone); mifepristone</li><li>Mineralocorticoid antagonists: spironolactone vs eplerenone, hyperkalemia, gynecomastia</li></ul></div>\n<p>Dr. Fasinu's first of four endocrine pharmacology classes (on the schedule as \"Hypothalamic & Pituitary Drugs\"): the <b>adrenocorticosteroids</b>, the drugs of the hypothalamus-pituitary-adrenal axis. Dentists and optometrists prescribe them all the time (prednisone, the Medrol Dosepak) for post-surgical inflammation and eye disease. What he expects you to know: <b>when to prescribe which one</b> (by duration of action, and by mineralocorticoid vs glucocorticoid activity), the <b>mechanism</b>, and \"the common side effects, which is what is often tested.\"</p>\n<h4>The axis and the gland</h4>\n<p>The hypothalamus releases corticotropin-releasing hormone; the anterior pituitary releases <b>corticotropin (ACTH)</b>; ACTH drives the adrenal cortex. The adrenal <b>medulla</b> (about 10% of the gland) secretes catecholamines; the <b>cortex</b> (about 90%) secretes the steroids:</p>\n<ul><li><b>Glucocorticoids</b>: <b>cortisol</b>, from the zona fasciculata. Cortisol sold as a drug is called <b>hydrocortisone</b>.</li><li><b>Mineralocorticoids</b>: <b>aldosterone</b>, from the zona glomerulosa; it increases water and sodium retention by the kidney.</li><li><b>Androgenic and estrogenic steroids</b>: <b>DHEA</b> and its sulfate, DHEAS, precursors for androgens and estrogens.</li></ul>\n<h4>Cortisol, the reference glucocorticoid</h4>\n<p>Cortisol regulates intermediary metabolism, cardiovascular function, growth and immunity. About 10 to 20 mg is secreted daily in normal stress. It follows a circadian rhythm, with ACTH peaking in the early morning (the most stressful moment of the day is getting out of bed) and after meals. It sits in a <b>tight negative feedback loop</b>, which matters every time you give it as a drug.</p>\n<h4>Mechanism</h4>\n<p>In plasma, cortisol rides bound to <b>corticosteroid-binding globulin (CBG)</b>. At the target cell it is released, crosses the membrane (it is lipophilic), and binds the <b>glucocorticoid receptor</b>, which sits in the cytoplasm bound to <b>heat-shock protein 90 (hsp90)</b>. Binding displaces hsp90; the complex <b>translocates to the nucleus</b> and changes gene transcription and protein synthesis. The response depends on the target cell. All steroids (glucocorticoids, mineralocorticoids) and thyroid hormones act on <b>nuclear receptors</b>.</p>\n<h4>Pharmacologic effects</h4>\n<ul><li><b>Metabolic</b>: gluconeogenesis, lipolysis (raising insulin release), lipogenesis and fat storage; these turn into side effects like fat redistribution.</li><li><b>Catabolic and anabolic</b>: too much cortisol means decreased muscle mass, skin thinning and osteoporosis; in children, glucocorticoids <b>reduce growth</b> (high doses shut down the axis, growth hormone included).</li><li><b>Anti-inflammatory</b>: they modulate leukocyte function and suppress inflammatory cytokines and chemokines. Steroids are the <b>standard anti-inflammatory drugs</b>: that's why the others are called NSAIDs, <i>non</i>-steroidal anti-inflammatory drugs.</li></ul>\n<h4>Pharmacokinetics</h4>\n<p>Hydrocortisone and its analogs come in oral, IV, topical and rectal forms (Anusol-HC: the HC is hydrocortisone). About <b>90% is bound to CBG</b> and about 5% to albumin, so only about 5% is free, and only free drug crosses membranes and binds receptors. <b>CBG is saturable</b>: give a high dose, saturate it, and the free fraction jumps (from 5% to perhaps 20 or 30%), a rapid rise in free drug. So be deliberate with the dose. Albumin binds cortisol with low affinity but synthetic steroids (dexamethasone) with higher affinity. Hydrocortisone's half-life is <b>1 to 1.5 hours</b> (exogenous glucocorticoids can lengthen it); synthetic ones last up to about 12 hours or more, allowing once-daily dosing. Elimination is mostly hepatic (75 to 80%), with about 20% through the kidney and other tissues.</p>\n<h4>Why you taper</h4>\n<p>An exogenous steroid raises plasma levels, and the tight feedback loop shuts down CRH and ACTH: the patient's own adrenal cortex goes into \"rest mode.\" Stop the drug abruptly and it takes time for the axis to wake up, so you can cause <b>adrenal insufficiency</b>. A taper lets the body sense the falling level and restart. That's the logic of the <b>Medrol Dosepak</b> (methylprednisolone, 21 tablets: 6 on day one, then 5, 4, 3, 2, 1) and prednisone dose packs. \"Nobody's gonna ask you\" exactly how to dose it, but you can be asked <b>why</b> it is taken that way.</p>\n<h4>Clinical uses</h4>\n<ul><li><b>Inflammation</b>, the top indication: post-surgery and post-extraction, uveitis, pneumonia (a Medrol Dosepak alongside a Z-Pak).</li><li><b>Adrenal insufficiency</b>: chronic (Addison's disease) needs <b>daily</b> glucocorticoid and mineralocorticoid supplementation; acute needs large doses plus treatment of the trigger.</li><li><b>Adrenocortical hyperfunction</b>: in congenital adrenal hyperplasia, a glucocorticoid induces negative feedback to quiet the overstimulated gland; in Cushing's syndrome, large doses before and after surgical removal of the pituitary or adrenal tumor.</li><li><b>Immunosuppression</b>: organ transplants (usually with cyclosporine or tacrolimus), inflammatory bowel disease, lymphoma.</li><li><b>Allergic reactions</b>: asthma, bee stings, contact dermatitis. For asthma, guidelines now favor <b>inhaled corticosteroids</b> over relying on a beta-agonist (albuterol) alone, because asthma is primarily inflammatory; COPD too.</li><li><b>Eye diseases</b>: acute uveitis, allergic conjunctivitis, optic neuritis, choroiditis.</li></ul>\n<h4>Side effects</h4>\n<ul><li><b>CNS</b>: too little, depression; too much, behavioral disturbance: <b>insomnia</b>, euphoria, then depression. Tell patients to take a dose pack in the <b>morning</b>, not the evening. Steroids can also raise intracranial pressure (pseudotumor cerebri).</li><li><b>GI</b>: large amounts are associated with <b>peptic ulcers</b>, possibly by suppressing local immunity against <i>H. pylori</i>.</li><li><b>Renal</b>: deficiency impairs renal function, increases vasopressin secretion and causes water retention.</li><li><b>Masking infections</b> (bacterial and fungal): long-term use suppresses immunity, especially locally, so <b>candidiasis</b> is common (patches in the mouth). Short courses alongside an antibiotic are fine; prolonged use is the problem.</li><li>Growth retardation in children; nutrient homeostasis problems: <b>hypokalemia, hypernatremia, hypervolemia</b>; <b>impaired wound healing</b> (don't keep a surgical patient on them longer than needed); <b>osteoporosis</b>.</li></ul>\n<p><b>Avoid, or use with caution</b> (not absolute contraindications) in: hypertension (water retention raises cardiac output), diabetes mellitus, peptic ulcer, osteoporosis, infections, <b>glaucoma</b> (raised intraocular pressure), cataract and psychoses.</p>\n<h4>Choosing a corticosteroid</h4>\n<p>Hydrocortisone is the standard everything is compared to: anti-inflammatory potency, topical activity, <b>salt-retaining</b> (mineralocorticoid) activity, and equivalent dose.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Class</th><th>Drugs</th><th>What to know</th></tr></thead><tbody>\n<tr><td>Short to medium acting</td><td>Hydrocortisone (cortisol), prednisone, prednisolone, methylprednisolone</td><td>Hydrocortisone = 1 for everything. Prednisone has about 4 times the anti-inflammatory activity of cortisol but weak salt retention; it is the common oral tablet. Methylprednisolone is the Medrol Dosepak.</td></tr>\n<tr><td>Intermediate acting</td><td>Triamcinolone</td><td>The popular one in this class; no salt retention</td></tr>\n<tr><td>Long acting</td><td>Dexamethasone, betamethasone</td><td>Once a day; no mineralocorticoid activity; dexamethasone about <b>30 times</b> cortisol's anti-inflammatory activity, the most potent</td></tr>\n<tr><td>Mineralocorticoid</td><td>Fludrocortisone (aldosterone is the natural one)</td><td>Weak anti-inflammatory activity, very strong salt retention (about 250 times cortisol)</td></tr>\n</tbody></table></div>\n<p>The point: are you trying to treat inflammation or to cause salt retention? For inflammation you want high glucocorticoid and low mineralocorticoid activity. <b>Fludrocortisone</b> is the synthetic mineralocorticoid, the one \"except\" in a list of glucocorticoids, and the drug to add when an Addison's patient on hydrocortisone still has salt craving, postural dizziness, low sodium and high potassium.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Route</th><th>Corticosteroid</th><th>Indication</th></tr></thead><tbody>\n<tr><td>Oral (tablets, ODT, liquid)</td><td>Prednisolone, prednisone</td><td>Allergy and inflammation</td></tr>\n<tr><td>IV injection</td><td>Dexamethasone, methylprednisolone (Solu-Medrol)</td><td>Allergy, inflammation</td></tr>\n<tr><td>IM injection</td><td>Methylprednisolone succinate or acetate</td><td>Allergy, inflammation</td></tr>\n<tr><td>Topical cream or ointment</td><td>Hydrocortisone, triamcinolone</td><td>Eczema, psoriasis</td></tr>\n<tr><td>Inhaled</td><td>Fluticasone, budesonide</td><td>Asthma, COPD</td></tr>\n<tr><td>Intranasal spray</td><td>Fluticasone</td><td>Allergic rhinitis</td></tr>\n<tr><td>Rectal (enema, suppository, foam)</td><td>Cortisone, hydrocortisone</td><td>IBD (ulcerative colitis, Crohn's)</td></tr>\n<tr><td>Eye drops</td><td>Prednisolone acetate, dexamethasone (also with neomycin and polymyxin)</td><td>Allergic conjunctivitis, uveitis</td></tr>\n</tbody></table></div>\n<h4>Inhibitors of cortisol synthesis</h4>\n<p>Used to dampen corticosteroid excess (Cushing's, hyperplasia, overdose). Know the two he highlighted, <b>ketoconazole</b> and <b>metyrapone</b>; the specific enzymes matter less than knowing these drugs block synthesis.</p>\n<ul><li><b>Ketoconazole</b>: an azole antifungal. Azoles block synthesis of ergosterol, the fungal membrane sterol, and they also inhibit human steroidogenic enzymes (especially 17α-hydroxylase and 11β-hydroxylase), which is the memory hook. Used in Cushing's syndrome.</li><li><b>Metyrapone</b>: blocks 11β-hydroxylase; used diagnostically and in Cushing's.</li><li><b>Etomidate</b>: inhibits 11β-hydroxylase; used acutely in severe Cushing's.</li><li><b>Mitotane</b>: adrenolytic (destroys the adrenal cortex); adrenal carcinoma.</li><li><b>Mifepristone (RU-486)</b>: not a synthesis inhibitor but a <b>glucocorticoid receptor antagonist</b> at high doses; refractory Cushing's.</li></ul>\n<h4>Mineralocorticoid antagonists</h4>\n<p>Aldosterone retains sodium and water, which is bad for cardiovascular health, so the antagonists are the clinically popular drugs here. <b>Spironolactone (Aldactone)</b> and <b>eplerenone (Inspra)</b> compete with aldosterone for its receptor. They are <b>potassium-sparing diuretics</b>: they act where the nephron exchanges sodium for potassium, so the patient loses sodium and keeps potassium. Uses: <b>heart failure and hypertension</b>. Side effects: <b>hyperkalemia</b> (\"a very, very common question,\" because other diuretic classes cause hypokalemia) and <b>gynecomastia</b>, worse with spironolactone, which is why men who develop it are switched to eplerenone.</p>\n<h4>Cases from class</h4>\n<ul><li>A dentist uses intralesional corticosteroid for recurrent aphthous ulcers. Used excessively or over a large area, the major risk is <b>oral candidiasis</b> (local immune suppression), not gingival hyperplasia, caries or dry mouth.</li><li>Prolonged prednisolone acetate 1% eye drops for anterior uveitis: watch for <b>increased intraocular pressure and glaucoma</b>.</li><li>Addison's patient stable on hydrocortisone but with postural dizziness, salt craving, sodium 128 and potassium 5.8: add <b>fludrocortisone</b>.</li><li>Eight months of oral prednisone for severe asthma, now central obesity, moon face, thin skin and a vertebral compression fracture after minor trauma: <b>osteoporosis from inhibited bone formation</b>.</li></ul>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Drug class</th><th>Examples</th><th>Mechanism</th><th>Major use</th></tr></thead><tbody>\n<tr><td>Glucocorticoid agonists</td><td>Hydrocortisone, prednisone, dexamethasone, methylprednisolone</td><td>Glucocorticoid receptor agonists</td><td>Anti-inflammatory, replacement</td></tr>\n<tr><td>Mineralocorticoid agonist</td><td>Aldosterone, fludrocortisone</td><td>Mineralocorticoid receptor agonist</td><td>Addison's disease</td></tr>\n<tr><td>Cortisol synthesis inhibitors</td><td>Ketoconazole, metyrapone</td><td>Block steroidogenic enzymes</td><td>Cushing's</td></tr>\n<tr><td>Glucocorticoid antagonist</td><td>Mifepristone</td><td>Glucocorticoid receptor blockade</td><td>Refractory Cushing's</td></tr>\n<tr><td>Mineralocorticoid antagonist</td><td>Spironolactone</td><td>Mineralocorticoid receptor blockade</td><td>Hypertension, heart failure</td></tr>\n</tbody></table></div>\n", "thydrugs": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Reading TSH and free T4: which way each moves in hyper- vs hypothyroidism, and whether a treated patient needs more or less drug</li><li>Levothyroxine as first line: why, how to take it, half-life, narrow therapeutic index</li><li>Why not liothyronine (T3) or desiccated thyroid</li><li>Interactions: what lowers absorption, what thyroid hormone does to warfarin</li><li>Drug-induced thyroid disease, especially amiodarone</li><li>Methimazole vs propylthiouracil (pregnancy, liver, thyroid storm); radioactive iodine; iodide, beta-blockers, glucocorticoids</li></ul></div>\n<p>Dr. Fasinu's second class: drugs for hyper- and hypothyroidism, their mechanisms, side effects and interactions. He opened and closed with patient cases built on lab values, which is how he likes to ask: \"pay attention to important information like that, especially the labs.\" And for dentists, \"there is an incentive to ask you questions around the thyroid\" because thyroid problems often get picked up in the dental chair (the neck exam, an enlarged tongue) before primary care.</p>\n<h4>Reading the labs</h4>\n<p>The axis: TRH → TSH → thyroid → T4 (a prohormone) and T3, and the thyroid hormones feed back to shut off TRH and TSH. So <b>TSH moves opposite to thyroid hormone</b>:</p>\n<ul><li><b>High TSH, low free T4</b>: hypothyroidism. The pituitary keeps shouting \"make more\" because the level is low.</li><li><b>Low TSH, high free T4</b>: hyperthyroidism.</li><li>On levothyroxine with TSH still high: <b>not enough drug</b>, so increase the dose.</li></ul>\n<p>Watch for hidden clues: a positive <b>hCG</b> in the lab list means the patient is pregnant, which changes the drug choice.</p>\n<h4>Thyroid hormone as a drug</h4>\n<p>The gland releases <b>T4 as a prohormone</b>; T4 is activated to <b>T3 in the liver and other tissues</b>. T3 binds the <b>thyroid hormone receptor (TR)</b>, a <b>nuclear receptor</b>, with about <b>10 times</b> the affinity of T4, so T4 is essentially inactive until converted. In plasma the hormones ride on <b>thyroxine-binding globulin (TBG)</b>. Effects look sympathetic: faster, stronger heart; nervousness when there's too much, depression when too little; and thyroid hormone is essential for CNS development and normal intellectual development in children.</p>\n<h4>Thyroid disorders</h4>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Hyperthyroidism</th><th>Hypothyroidism</th></tr></thead><tbody>\n<tr><td><b>Graves disease</b> (most common): autoimmune; antibodies mimic TSH and keep stimulating synthesis and release</td><td><b>Hashimoto's disease</b> (most common): autoimmune destruction of the gland, so lifelong replacement</td></tr>\n<tr><td>Thyroid storm</td><td>Iatrogenic: surgery or ablative therapy</td></tr>\n<tr><td>Pituitary adenoma: excessive TSH with no feedback shut-off</td><td>Iodine deficiency</td></tr>\n<tr><td>Drug-induced (amiodarone, excess thyroid replacement)</td><td>Secondary: pituitary insufficiency (no TSH); drug-induced (amiodarone, lithium)</td></tr>\n<tr><td>Subclinical hyperthyroidism</td><td>Myxedema coma; subclinical hypothyroidism</td></tr>\n</tbody></table></div>\n<p>Hypothyroid symptoms: fatigue, weight gain, depression, constipation, <b>cold intolerance</b>, infertility, shortness of breath. Signs: <b>macroglossia</b>, hoarseness, dry skin, <b>bradycardia</b>, hypotension, an enlarged gland (which can happen in hyperthyroidism too, since both can involve ongoing stimulation of the gland). Untreated, the risk is <b>myxedema coma</b>, a medical emergency of hypothermia and hypometabolism with failing organs. Hyperthyroid signs are the opposite: accelerated metabolism, <b>weight loss</b>, rapid heart rate, sweating, nervousness, insomnia, <b>exophthalmos</b>.</p>\n<h4>Drugs for hypothyroidism</h4>\n<p><b>Levothyroxine (T4, Synthroid)</b> is the <b>drug of choice</b> for replacement (except in drug-induced hypothyroidism, where you stop the causative drug). Why T4 and not the active T3? Because the body regulates how much T4 it converts at any time, giving a steady, depot-like supply.</p>\n<ul><li>Good oral bioavailability, <b>99% protein-bound</b>; dosed in <b>micrograms</b> (strengths from 12.5 to about 200 µg, each strength a set color so patients don't mix them up).</li><li>Take it on an <b>empty stomach, first thing in the morning</b>: it binds to almost anything, so no food or milk with it.</li><li><b>Long half-life, 6 to 10 days</b>, so steady state takes about <b>6 to 8 weeks</b> (about five half-lives).</li><li><b>Narrow therapeutic index</b>: regular monitoring (TSH) and dose titration.</li><li>Side effects are sympathomimetic, the symptoms of hyperthyroidism.</li></ul>\n<p><b>Liothyronine (Cytomel)</b> is synthetic <b>T3</b>. In theory it skips the conversion step, but with no T4 reservoir the T3 level depends entirely on the dose: a <b>short half-life (about 18 hours)</b>, fluctuating levels that are hard to monitor, and a higher risk of overdose (<b>cardiac toxicity</b>) and underdosing. Its traditional place is relieving hypothyroid symptoms in thyroid cancer, and it can be used in emergencies such as myxedema coma; it is not the everyday drug.</p>\n<p><b>Desiccated thyroid</b> (Armour Thyroid, NP Thyroid) is dried <b>porcine</b> thyroid with T4 and T3. Some patients prefer it as \"natural,\" but it offers no advantage over levothyroxine. Its T4:T3 ratio is about <b>4:1</b>, versus about <b>14:1</b> in humans, so it carries relatively high T3: unpredictable potency, unstable blood levels and a risk of <b>thyrotoxicosis</b>. <b>Liotrix</b> (Thyrolar) is a fixed 1:4 T3:T4 combination.</p>\n<p>Class question: a patient tells you she takes medicine for low thyroid. Most likely <b>levothyroxine</b>, even though T3 is the active hormone and the more potent one.</p>\n<h4>Interactions</h4>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>May alter thyroid hormone levels</th><th>May be altered by thyroid hormone</th></tr></thead><tbody>\n<tr><td>Binders that lower absorption: <b>bile acid sequestrants</b> (cholestyramine); <b>polyvalent metals</b> (calcium, aluminum, magnesium); high protein-binding drugs</td><td><b>Warfarin</b>: its effect goes up (raised INR, more bleeding risk)</td></tr>\n<tr><td>Estrogen; <b>hepatic enzyme inducers</b> (rifampin, carbamazepine, St. John's wort); SSRIs</td><td><b>Theophylline</b>: its level goes down</td></tr>\n</tbody></table></div>\n<h4>Drug-induced thyroid disease</h4>\n<p><b>Amiodarone</b>, the antiarrhythmic, has <b>iodine in its structure</b> (the \"iod\" in the name is the hook). Iodine goes to the thyroid, so amiodarone can cause <b>hypothyroidism or hyperthyroidism</b>. Other mechanisms of drug-induced hypothyroidism: <b>decreased TSH secretion</b> from dopamine, glucocorticoids (negative feedback on the pituitary), octreotide and opiates; <b>decreased T4/T3 synthesis</b> from amiodarone, interferon alpha, <b>lithium</b>, and of course methimazole and propylthiouracil. Management: stop the causative drug.</p>\n<h4>Treating hyperthyroidism</h4>\n<p>Options: antithyroid drugs (<b>thioamides</b>), <b>radioactive iodine</b> ablation, or <b>surgery</b> (then lifelong levothyroxine). Many patients choose drugs.</p>\n<p><b>Methimazole</b> and <b>propylthiouracil (PTU)</b> inhibit thyroid hormone synthesis: they interfere with incorporation of iodine into tyrosine residues on thyroglobulin and inhibit coupling, depleting iodinated thyroglobulin. Side effects: <b>hepatic damage</b> (the primary one for both), allergic rash and pruritus, arthralgia, GI intolerance and <b>agranulocytosis</b>.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th></th><th>Methimazole</th><th>Propylthiouracil</th></tr></thead><tbody>\n<tr><td>Use</td><td><b>First line for most non-pregnant patients</b></td><td>Reserved: <b>first trimester of pregnancy</b>, or patients who can't tolerate methimazole</td></tr>\n<tr><td>Dosing</td><td>Longer half-life, once daily</td><td>Shorter half-life, 2 to 3 doses a day</td></tr>\n<tr><td>Mechanism</td><td>Inhibits synthesis</td><td>Inhibits synthesis <b>and blocks peripheral T4 → T3 conversion</b></td></tr>\n<tr><td>Liver</td><td>Lower risk of severe injury</td><td>Higher risk: a <b>boxed warning</b></td></tr>\n<tr><td>Pregnancy</td><td>Higher risk of birth defects (teratogenic), especially in the first trimester</td><td>Lower risk of birth defects</td></tr>\n<tr><td>Thyroid storm</td><td>Can be used</td><td>Often the initial drug of choice</td></tr>\n</tbody></table></div>\n<p>So a pregnant patient takes PTU in the first trimester and can switch back to methimazole after.</p>\n<p><b>Radioactive iodine (I-131)</b>: swallowed iodine is trapped in the thyroid, and the radioactivity kills the tissue. Side effects: rash, metallic taste, sore throat or gums, GI upset. Monitor monthly for <b>iatrogenic hypothyroidism</b> (the patient can swing from hyper to hypo). <b>Contraindicated in pregnancy</b>.</p>\n<p>Other drugs, used alongside the main one:</p>\n<ul><li><b>Iodides (Lugol's iodine</b>, potassium iodide solution): <b>inhibit hormone release</b>; used before thyroid surgery and in thyroid storm. Not first line.</li><li><b>Beta-blockers (propranolol</b>, atenolol): <b>symptom control</b> in thyrotoxicosis (tremor, anxiety, palpitations, fast heart rate). They don't treat the disease.</li><li><b>Glucocorticoids (dexamethasone)</b>: decrease T4 → T3 conversion; used in thyroid storm and thyroid eye disease.</li></ul>\n<h4>Cases from class</h4>\n<ul><li>Hashimoto's, TSH 10.6 (0.5 to 4.5), free T4 0.5 (0.8 to 1.9), dry skin and run down: start <b>levothyroxine</b>.</li><li>Non-pregnant woman with Graves disease who wants medication, TSH 0.22, free T4 3.2, anxious and warm: <b>methimazole</b> (the \"non-pregnant\" in the stem is the point; atenolol would only treat symptoms; Lugol's isn't first line).</li><li>26-year-old with insomnia, weight loss, heart rate 92, TSH 0.2, total T4 13.8: hyperthyroid, so for long-term management <b>methimazole</b>, not a high-calorie diet or alprazolam.</li><li>62-year-old on levothyroxine 50 µg, better but still occasionally lethargic, TSH 8.4: <b>increase the levothyroxine</b>. Don't start methimazole, don't stop it, don't leave it.</li></ul>\n", "histo2": "\n<div class=\"tested\"><b>What's tested</b><ul><li>How the adrenal is arranged: one capsule, three cortical zones (superficial to deep: glomerulosa, fasciculata, reticularis) and the central medulla</li><li>Its three arterial sources, and the medulla's <b>dual blood supply</b>: the one adrenal question Dr. Herr said is on your exam</li><li>Each zone's share of the cortex, what stimulates it and what it makes; spongiocytes in the fasciculata</li><li>Chromaffin cells: a modified sympathetic ganglion, how they are stimulated, what they release</li><li>The endocrine pancreas: islets as 1-2% of the volume, the cell types and their hormones, which is most abundant, autocrine and paracrine control</li></ul></div>\n<p>Dr. Herr, 10/27: a short lecture that mostly looks at the adrenal and the islets from the microscope's side of what Dr. Madison taught in L5 and L6 (\"this probably should have been sequenced before Dr. Madison's lecture\"). He kept the images small on purpose: \"there's not really images on the exam.\"</p>\n<h4>The adrenal glands</h4>\n<p>The adrenals sit <b>on top of the kidneys</b>, \"like a little hat,\" above and slightly medial; in a dissection they are usually buried in fat and hard to see. Like every endocrine gland they are <b>highly vascular</b>. Each has two regions enclosed in one connective tissue <b>capsule</b>: the outer <b>cortex</b>, whose parenchymal cells make <b>steroids</b> (cortisol, aldosterone and androgens), and the central <b>medulla</b>, whose <b>chromaffin cells</b> make <b>catecholamines</b> (epinephrine and norepinephrine).</p>\n<h4>Blood supply</h4>\n<p>Arterial blood comes from <b>three sources</b>, on both sides:</p>\n<ul><li><b>Superior suprarenal arteries</b>, from the <b>inferior phrenic artery</b> (just below the diaphragm).</li><li><b>Middle suprarenal arteries</b>, directly off the <b>abdominal aorta</b>.</li><li><b>Inferior suprarenal arteries</b>, from the <b>renal arteries</b>.</li></ul>\n<p>Blood leaves through the <b>suprarenal vein</b>, which drains toward the renal vein and the inferior vena cava. Inside the gland:</p>\n<ul><li>Capsular arteries form a <b>subcapsular plexus</b>.</li><li><b>Short cortical arteries</b> give off cortical arterioles that form a small plexus in the zona glomerulosa and then run as <b>adrenocortical sinusoids</b> through all three zones; in the fasciculata they run straight between the cords (\"I would call them vasa recta, because they're really straight\").</li><li>In the zona reticularis, at the corticomedullary junction, the sinusoids drain into <b>collecting veins</b> that pass into the medulla.</li><li><b>Long medullary arteries</b> pass straight through the cortex and capillarize in the medulla.</li><li>All of this blood, now deoxygenated, drains into the large <b>central (adrenomedullary) vein</b>, which leaves as the suprarenal vein.</li></ul>\n<p>So the medulla has a <b>dual blood supply</b>: <b>arterial</b> blood from the medullary arterioles and <b>venous</b> blood from the cortical sinusoids, which carries cortical hormones (cortisol) down to the chromaffin cells. Dr. Herr: \"So, here's the question that's going to be on your exam.\"</p>\n<h4>Cortex: three zones</h4>\n<p>From superficial to deep: <b>glomerulosa, fasciculata, reticularis</b> (G, F, R), then the medulla. You can tell the three zones apart a little on a stained section. All cortical hormones are synthesized from <b>cholesterol</b>, taken up mostly as <b>low-density lipoprotein</b> from the circulation. \"Cholesterol gets a bad rap, I think, on lab values,\" but we need it for hormones and for cell membranes.</p>\n<p>Steroids act through <b>intracellular receptors</b>, so they are not fast: the hormone has to get into the cell, the steroid-receptor complex moves into the nucleus and binds DNA, mRNA is made and processed, and a new protein is built. That takes <b>hours to days</b>.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Zone</th><th>Share of cortex</th><th>In response to</th><th>Produces</th></tr></thead><tbody>\n<tr><td>Zona glomerulosa (outer)</td><td>About 15% (slides: 10-15%)</td><td>Angiotensin II and ACTH</td><td>Mineralocorticoids: aldosterone and deoxycorticosterone</td></tr>\n<tr><td>Zona fasciculata (middle)</td><td>65-80%, the largest</td><td>ACTH</td><td>Glucocorticoids: cortisol and corticosterone</td></tr>\n<tr><td>Zona reticularis (inner)</td><td>About 10%, a little less than the glomerulosa (slides: 5-10%)</td><td>ACTH</td><td>Androgens: androsterone and dehydroepiandrosterone (DHEA)</td></tr>\n</tbody></table></div>\n<p>Everything in the cortex responds to <b>ACTH</b> (from the anterior pituitary: the A in FLAT PiG); the glomerulosa is the exception that also responds to <b>angiotensin II</b>. The parenchymal cells of the fasciculata are called <b>spongiocytes</b> because they are full of <b>lipid droplets</b> (stored cholesterol). \"The thing to remember for the exam\" about the fasciculata is that name.</p>\n<h4>Medulla: chromaffin cells</h4>\n<p>The medulla functions as a <b>modified sympathetic ganglion</b>, completely invested by the cortex. Preganglionic sympathetic neurons leave the spinal cord between <b>T1 and L2</b>, enter the sympathetic chain through <b>white rami</b> (white because they are myelinated; gray rami are unmyelinated), and pass through the chain <b>without synapsing</b>, straight to the medulla. There they synapse on the <b>chromaffin cells</b>, which stand in for the postganglionic neurons.</p>\n<p>Chromaffin cells are <b>large epithelioid cells</b> arranged in clusters or cords and surrounded by <b>sinusoidal capillaries</b>. They act as modified postganglionic sympathetic neurons but have no dendrites or axons. They are also called <b>pheochromocytes</b>, and there are two populations, distinguished by their membrane-bound vesicles; you don't need to tell them apart in an image. The <b>epinephrine</b> cells are more numerous than the norepinephrine cells, about an <b>80:20</b> split as Dr. Herr remembers it.</p>\n<p>Secretion: preganglionic terminals release <b>acetylcholine</b> → the chromaffin cell membrane <b>depolarizes</b> → <b>calcium flows in</b> (what always comes before release in endocrinology) → epinephrine and norepinephrine are released. The result is fight or flight: more oxygen consumption, glucose release, heart rate and blood pressure, heat production and alertness, and fat metabolized for energy.</p>\n<h4>The endocrine pancreas</h4>\n<p>The pancreas has exocrine and endocrine parts; GI covered the exocrine side (acinar cells sending enzymes down the main pancreatic duct into the duodenum, where the head sits). The gland lies deep in the abdomen against the colon, jejunum, duodenum, kidneys and stomach, with the adrenals nearby, which is part of why pancreatic cancer is so hard to reach. Its blood comes from the <b>celiac trunk</b> and the <b>superior mesenteric artery</b>: their branches anastomose around the head and uncinate process, and the <b>splenic artery</b> (off the celiac trunk) gives the body and tail a lot of blood.</p>\n<p>The <b>islets of Langerhans</b> make up only about <b>1-2% of the pancreas's volume</b>, most of them in the tail, \"but still a very, very important part.\" An islet may hold a few cells or many hundreds, surrounded by the exocrine acinar cells and wrapped in <b>fenestrated capillaries</b> so its hormones go straight into the blood. On a slide, the acini are organized around ducts and drain into them, while the islets are paler clusters of cells with capillaries and no ducts. Early in development, groups of cells bud from the ends of the endodermal ducts and lose their connection with them. Islet cells other than beta cells are counterparts of the <b>enteroendocrine cells of the GI mucosa</b>, which fits endocrine glands forming from epithelium: here, the epithelium of the gut tube.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Cell</th><th>Secretes</th><th>Action</th><th>Share of islet</th></tr></thead><tbody>\n<tr><td>Beta (β)</td><td>Insulin</td><td>Stimulates glucose transport into cells</td><td>65-70%, the most abundant</td></tr>\n<tr><td>Alpha (α)</td><td>Glucagon</td><td>Mobilizes glucose into the blood</td><td>15-20%, second</td></tr>\n<tr><td>Delta (δ)</td><td>Somatostatin</td><td>Inhibits insulin and glucagon secretion</td><td>5-10%</td></tr>\n<tr><td>PP (F)</td><td>Pancreatic polypeptide</td><td>Inhibits somatostatin and pancreatic enzyme secretion</td><td>Under 5%</td></tr>\n<tr><td>Epsilon (ε)</td><td>Ghrelin</td><td>Stimulates appetite</td><td>Under 5%</td></tr>\n</tbody></table></div>\n<p>In passing, Dr. Herr called the somatostatin cell \"gamma\"; his table, like Dr. Madison's L5, calls it the <b>delta</b> cell. Somatostatin and pancreatic polypeptide are both negative-feedback brakes: somatostatin on insulin and glucagon, pancreatic polypeptide on somatostatin and on the exocrine pancreas.</p>\n<p>Hormone release in the islet is regulated by <b>autocrine and paracrine</b> interactions:</p>\n<ul><li><b>Insulin</b> from beta cells inhibits insulin secretion (<b>autocrine</b>) and glucagon secretion from alpha cells (<b>paracrine</b>).</li><li><b>Somatostatin</b> from delta cells inhibits insulin from beta cells and glucagon from alpha cells (<b>paracrine</b>).</li></ul>\n<p>An electron micrograph of a beta cell shows its nucleus, mitochondria, rough endoplasmic reticulum and many small dark secretory granules of insulin right next to the lumen of a fenestrated capillary, ready to go into the systemic blood. In an islet immunostained for insulin, glucagon and somatostatin, insulin-staining beta cells make up most of the islet.</p>\n", "calcium": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Why calcium must stay in a narrow range: hypocalcemia raises nerve excitability (tetany, Trousseau's and Chvostek's signs), hypercalcemia lowers it</li><li>Calcium in plasma: ionized, protein-bound, complexed; the three sites of control (gut, bone, kidney)</li><li>Which bone cells carry which receptors: Dr. Galin's \"put a star by this\"</li><li>Vitamin D: skin → liver → kidney, 1α-hydroxylase vs 24-hydroxylase, what turns each on, and what calcitriol does in the gut (calbindin)</li><li>PTH: the calcium-sensing receptor (the one place a rise in intracellular calcium <b>stops</b> secretion), actions on kidney and bone, net effect on calcium and phosphate</li><li>The one exception where calcium and phosphate move in opposite directions (the kidney, under PTH)</li><li>Calcitonin; osteoporosis, steroids and bone, rickets vs osteomalacia, primary hyperparathyroidism and its treatment</li></ul></div>\n<p>Dr. Galin, 10/27: the endocrine system keeps blood calcium within \"just a few small increments\" of normal, and the hormones that do it \"all act in sort of the same places. Your job is just to remember which is acting where, and what are they doing to calcium and phosphate in those areas.\"</p>\n<h4>Why calcium and phosphate matter</h4>\n<p>Calcium is needed for muscle contraction, second messenger systems, the secretory pathway (exocytosis of hormones and neurotransmitters), platelet activation and clotting, and nerve excitability. Phosphate is part of ATP and energy metabolism, second messenger systems and membrane phospholipids. Most of the body's calcium and phosphate is stored in <b>bones and teeth</b>: the two have \"somewhat of a romantic attraction for one another,\" and whenever they meet they form a salt, <b>hydroxyapatite</b>. Because both are needed for strong bones and teeth, the body usually regulates calcium and phosphate <b>in the same direction</b>: both reabsorbed, or both excreted. There is one exception, \"very, very important to know. Hint, hint, put a star by it\" (the kidney under PTH, below).</p>\n<p>Calcium must stay in a <b>very narrow range</b> because it sets sodium permeability and nerve transmission. <b>Hypercalcemia suppresses neuroexcitability</b>: lethargy, weakness, constant sleepiness. <b>Hypocalcemia increases it</b>, and that can be life-threatening: nerves fire spontaneously, the heart can malfunction, and seizures can follow. When extracellular calcium falls, sodium channels open with very little depolarization; a fall of about 50% below normal can cause spontaneous discharge and muscle <b>tetany</b>, which is lethal if it reaches the respiratory muscles. Two easy bedside checks for hypocalcemia:</p>\n<ul><li><b>Trousseau's sign</b>: inflate a blood pressure cuff on the arm and the hand goes into its characteristic spasm.</li><li><b>Chvostek's sign</b>: tap over the facial nerve and the facial muscles spasm.</li></ul>\n<h4>Calcium and phosphate balance</h4>\n<p>An adult takes in about 1,000 mg of calcium a day and excretes the same amount (about 1,500 mg of phosphate in and out); \"please do not get caught up in the numbers.\" It is not the same calcium going out that came in: calcium does a lot of work outside cells (setting the sodium threshold for nerve transmission) and inside them (the secretory pathway, the endoplasmic reticulum), and the endocrine system matches excretion to intake.</p>\n<p>Plasma calcium is about <b>50% ionized</b> (Ca2+), the rest split between <b>protein-bound</b> calcium (about 40%) and non-ionized, filterable (complexed) calcium (about 10%) that is easily excreted. The hormones regulate the <b>ionized</b> calcium. They act at <b>three sites: the gut, bone and kidney</b>, the same three for phosphate.</p>\n<h4>Bone: which cell has which receptor</h4>\n<p>Bone is constantly remodeled, so it is a ready source of calcium and phosphate: breaking it down releases both into the blood, and building it takes both out to make hydroxyapatite. <b>Osteoblasts build bone</b> (\"BB\") and carry receptors for <b>PTH, vitamin D3 and estrogen</b>. <b>Osteoclasts break bone down</b> and carry the receptor for <b>calcitonin</b>. Osteocytes sit in mineralized bone, and the whole skeleton is replaced about every 7 years. Dr. Galin: \"If I were you, I would put a star by this,\" because the receptors \"can go contradictory to what you actually think\" (PTH breaks bone down, yet its receptor is on the osteoblast).</p>\n<h4>The three calcitropic hormones</h4>\n<p>Vitamin D, parathyroid hormone (PTH) and calcitonin.</p>\n<h4>Vitamin D</h4>\n<p>We get vitamin D two ways: the <b>diet</b> (fortified milk and yogurt) and <b>sunlight</b> (about 15 minutes a day with as much skin as you can exposed). Vitamin D is a true <b>hormone</b>: made in one place, carried in the blood, acting on distant target cells through high-affinity receptors. (A dental student once challenged one of Dr. Galin's exam questions on exactly this point.) It is an unusual vitamin because we can make it ourselves.</p>\n<ol><li><b>Skin</b>: UV light converts <b>7-dehydrocholesterol</b> to <b>cholecalciferol</b> (vitamin D3), another reason we need some cholesterol. Cholecalciferol is also what a vitamin D supplement or fortified milk contains, because it is stable.</li><li><b>Liver</b>: hydroxylation at carbon <b>25</b> gives 25-hydroxycholecalciferol, a weak intermediate with almost no activity. (\"Just remember it's the 25th position, and this is done by the liver.\")</li><li><b>Kidney</b>: <b>1α-hydroxylase</b> adds the last hydroxyl at carbon 1, giving the <b>active</b> hormone, <b>1,25-(OH)2-D3</b> (calcitriol); <b>24-hydroxylase</b> makes the <b>inactive</b>, unstable 24,25-(OH)2-D3.</li></ol>\n<p>So <b>liver disease</b> (cirrhosis) can block the 25 step and <b>kidney disease</b> the 1α step. Either way the patient may not make active vitamin D, so follow them for calcium problems too: bone density, heart rhythm, tetany and seizures.</p>\n<p>What vitamin D wants is to <b>raise blood calcium and phosphate</b>, so:</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Turns on 1α-hydroxylase (active 1,25-(OH)2-D3)</th><th>Turns on 24-hydroxylase (inactive 24,25-(OH)2-D3)</th></tr></thead><tbody>\n<tr><td>Hypocalcemia</td><td>Hypercalcemia</td></tr>\n<tr><td>Hypophosphatemia (phosphate deficiency)</td><td>Hyperphosphatemia</td></tr>\n<tr><td>PTH (where PTH and vitamin D intersect)</td><td>High 1,25-(OH)2-D3 itself (negative feedback)</td></tr>\n</tbody></table></div>\n<p>Vitamin D's main site of action is the <b>gut</b>. It enters the intestinal epithelial cell and binds an <b>intranuclear receptor</b>, turning up the transcription of three things:</p>\n<ol><li><b>Calcium channels</b> in the apical membrane (facing the lumen), so calcium comes in from the food.</li><li><b>Calbindin</b>, which binds calcium: \"a very, very important protein. Did I say that with enough emphasis?\" Calbindin is the \"Uber\" that carries calcium from the apical to the basolateral membrane, so it doesn't set off the second messenger systems and other processes calcium drives inside the cell.</li><li><b>Active transport</b> on the basolateral membrane (facing the blood), moving calcium into the bloodstream. Which transporters doesn't matter: \"I don't care that you know what those active transport [mechanisms] are.\"</li></ol>\n<p>Phosphate is absorbed along with calcium under vitamin D, but how is still being worked out (\"you don't have to know anything, because we don't know very much as it is\"). Calcitriol's effects on kidney and bone are weaker than its gut effect.</p>\n<p>The \"real thing\" or a \"bad thing\"? Sodas get their caramel color and keep their fizz with added <b>phosphate</b>. In a growing child who drinks a lot of soda, the hyperphosphatemia turns <b>off</b> 1α-hydroxylase and switches on 24-hydroxylase, so the child makes inactive vitamin D, absorbs less calcium and phosphate from the diet, and has less to build hydroxyapatite for lengthening bones.</p>\n<h4>Parathyroid hormone</h4>\n<p>There are <b>four</b> parathyroid glands, a superior and an inferior behind each lobe of the thyroid. You can lose up to three: <b>at least one</b> is needed for normal PTH. A gland can even be transplanted elsewhere; a parathyroid cancer survivor who speaks to the medical school has one growing in her forearm. We learned the glands are essential for life when early surgeons treated hyperthyroidism (big goiters) by removing the thyroid: the patients quickly went into <b>tetany and died</b>, because the tiny, hard-to-see parathyroids came out with it.</p>\n<p>The glands have a rich blood supply, so PTH reaches the blood quickly and the gland can watch blood calcium. Only two cell types: <b>chief (principal) cells</b>, which make PTH, and <b>oxyphil cells</b>, whose job is unknown (maybe changed chief cells that now give structural support; they aren't present at birth). \"Main thing, only two cell types. Chief cell is what is producing parathyroid hormone.\"</p>\n<p>The <b>calcium-sensing receptor (CaSR)</b> on the chief cell is the gland's surveillance system: a receptor for an ion, measuring blood calcium. It is <b>Gq</b>-coupled.</p>\n<ul><li><b>High blood calcium</b> stimulates the CaSR → IP3 and diacylglycerol → calcium released from intracellular stores → the rise in intracellular calcium <b>blocks</b> the secretory pathway, so PTH-containing vesicles don't reach the surface.</li><li><b>Low blood calcium</b> leaves the CaSR quiet: no IP3/DAG signal, and the secretory pathway moves PTH vesicles to the surface: PTH is secreted.</li></ul>\n<p>Everywhere else in endocrinology, a rise in intracellular calcium triggers secretion: \"This is the one caveat in endocrinolo
