cytes: the neuroglial cells of the pars nervosa. Their processes touch both the axons and the capillaries; when ADH and oxytocin are released, the processes next to the vessels retract, letting the hormones into the pericapillary space.\"><path class=\"pi-glia\" d=\"M348 316l7.6 11.8M348 316l-5.7 6.9M348 316l-8.4 -3.3M348 316l0.6 -9M348 316l8.7 -2.2\"/><circle class=\"pi-gliab\" cx=\"348\" cy=\"316\" r=\"4\"/></g><path class=\"pi-axon\" d=\"M264 152L262 186\"/><circle class=\"pi-soma\" cx=\"264\" cy=\"150\" r=\"5\"/><circle class=\"pi-cell pi-acid\" cx=\"178\" cy=\"318\" r=\"6\"/><circle class=\"pi-cell pi-baso is-tgt\" cx=\"196\" cy=\"308\" r=\"7.5\"/><circle class=\"pi-cell pi-acid\" cx=\"216\" cy=\"306\" r=\"6\"/><circle class=\"pi-cell pi-baso\" cx=\"236\" cy=\"314\" r=\"6\"/><circle class=\"pi-cell pi-baso\" cx=\"168\" cy=\"342\" r=\"6\"/><circle class=\"pi-cell pi-acid\" cx=\"188\" cy=\"334\" r=\"6\"/><circle class=\"pi-cell pi-chromo\" cx=\"208\" cy=\"332\" r=\"6\"/><circle class=\"pi-cell pi-baso is-tgt\" cx=\"228\" cy=\"340\" r=\"7.5\"/><circle class=\"pi-cell pi-baso\" cx=\"248\" cy=\"332\" r=\"6\"/><circle class=\"pi-cell pi-acid\" cx=\"182\" cy=\"364\" r=\"6\"/><circle class=\"pi-cell pi-baso\" cx=\"204\" cy=\"360\" r=\"6\"/><circle class=\"pi-cell pi-acid\" cx=\"226\" cy=\"366\" r=\"6\"/><circle class=\"pi-cell pi-chromo\" cx=\"246\" cy=\"356\" r=\"6\"/><circle class=\"pi-rh\" cx=\"264\" cy=\"152\" r=\"3.4\" opacity=\"0\"/><circle class=\"pi-rh\" cx=\"259.4\" cy=\"189.1\" r=\"3.4\" opacity=\"1\"/><circle class=\"pi-rh\" cx=\"248.3\" cy=\"224.2\" r=\"3.4\" opacity=\"1\"/><circle class=\"pi-rh\" cx=\"242.9\" cy=\"261.8\" r=\"3.4\" opacity=\"1\"/><circle class=\"pi-rh\" cx=\"235.9\" cy=\"298.9\" r=\"3.4\" opacity=\"1\"/><circle class=\"pi-out\" cx=\"172.1\" cy=\"312\" r=\"3.2\" opacity=\"1\"/><circle class=\"pi-out\" cx=\"102.2\" cy=\"298.8\" r=\"3.2\" opacity=\"1\"/><circle class=\"pi-out\" cx=\"197.3\" cy=\"324.6\" r=\"3.2\" opacity=\"1\"/><circle class=\"pi-out\" cx=\"111\" cy=\"300.4\" r=\"3.2\" opacity=\"1\"/><g class=\"am-callout\"><path class=\"pi-lead\" d=\"M315 200L294 184\"/><circle class=\"pi-dot\" cx=\"294\" cy=\"184\" r=\"1.8\"/><text class=\"pi-t\" x=\"318\" y=\"204\" text-anchor=\"start\">median eminence</text></g><g class=\"am-callout\"><path class=\"pi-lead\" d=\"M217 262L242 252\"/><circle class=\"pi-dot\" cx=\"242\" cy=\"252\" r=\"1.8\"/><text class=\"pi-t\" x=\"214\" y=\"266\" text-anchor=\"end\">portal veins</text></g><g class=\"am-callout\"><path class=\"pi-lead\" d=\"M381 254L307.3 269\"/><circle class=\"pi-dot\" cx=\"307.3\" cy=\"269\" r=\"1.8\"/><text class=\"pi-t\" x=\"384\" y=\"258\" text-anchor=\"start\">Herring bodies</text></g><g class=\"am-callout\"><path class=\"pi-lead\" d=\"M381 296L352 312\"/><circle class=\"pi-dot\" cx=\"352\" cy=\"312\" r=\"1.8\"/><text class=\"pi-t\" x=\"384\" y=\"300\" text-anchor=\"start\">pituicyte</text></g><g class=\"am-callout\"><path class=\"pi-lead\" d=\"M421 400L410 384\"/><circle class=\"pi-dot\" cx=\"410\" cy=\"384\" r=\"1.8\"/><text class=\"pi-t\" x=\"424\" y=\"404\" text-anchor=\"start\">sella turcica</text></g><text class=\"pi-t pi-key\" x=\"12\" y=\"128\" text-anchor=\"start\">CRH → ACTH</text></svg></div></div></figure><div class=\"am-controls\" role=\"group\" aria-label=\"Route\"><button type=\"button\" class=\"am-btn\" data-pimode=\"ant\" aria-pressed=\"true\">Anterior lobe: portal veins</button><button type=\"button\" class=\"am-btn\" data-pimode=\"post\" aria-pressed=\"false\">Posterior lobe: long axons</button></div>\n<div class=\"am-controls pi-horms\" role=\"group\" aria-label=\"Hypothalamic hormone\"><button type=\"button\" class=\"am-btn\" data-pihorm=\"crh\" aria-pressed=\"true\">CRH</button><button type=\"button\" class=\"am-btn\" data-pihorm=\"trh\" aria-pressed=\"false\">TRH</button><button type=\"button\" class=\"am-btn\" data-pihorm=\"gnrh\" aria-pressed=\"false\">GnRH</button><button type=\"button\" class=\"am-btn\" data-pihorm=\"ghrh\" aria-pressed=\"false\">GHRH</button><button type=\"button\" class=\"am-btn\" data-pihorm=\"da\" aria-pressed=\"false\">Dopamine</button></div>\n<p class=\"am-summary\" aria-live=\"polite\"></p>\n<p class=\"am-info\">Hover or tap a nucleus, the stalk, either lobe, the optic chiasm, a pituicyte or the sella turcica. Pink cells are acidophils, blue basophils, pale chromophobes.</p><details class=\"am-sources\"><summary>What this shows, and what's simplified</summary><ul>\n<li>From the L1 notes (Dr. Herr: lobes, parts, blood supply and portal system, cells of the pars distalis, Herring bodies, pituicytes) and the L2 notes (Dr. Galin: the median eminence, the releasing hormones and their targets, dopamine's brake on prolactin).</li>\n<li>Schematic midline section, not to scale; a handful of cells stands for the cords of the pars distalis. Somatostatin, PRF and the feedback loops aren't drawn. Educational, not medical advice.</li></ul></details></div>",
    data: (function(){ var d = {"W":520,"H":440,"RH":[[264,152],[262,186],[252,198],[238,296],[214,330]],"SON":[[198,157],[256,180],[278,232],[306,300],[320,338]],"PVN":[[300,88],[280,176],[284,232],[314,296],[334,334]],"PROD_A":[[206,330],[172,312],[56,290]],"PROD_P":[[330,338],[372,316],[508,292]],"CELLS":[[178,318,"S"],[196,308,"C"],[216,306,"L"],[236,314,"T"],[168,342,"G"],[188,334,"S"],[208,332,"X"],[228,340,"C"],[248,332,"T"],[182,364,"L"],[204,360,"G"],[226,366,"S"],[246,356,"X"]],"HORM":{"crh":{"rh":"CRH","cell":"C","out":"ACTH","text":"CRH → corticotrophs (basophils) → ACTH, cut from POMC, → the adrenal cortex. Corticotrophs are inhibited by high plasma cortisol. (CRH comes from the paraventricular nucleus.)"},"trh":{"rh":"TRH","cell":"T","out":"TSH","text":"TRH → thyrotrophs (basophils) → TSH → synthesis and release of thyroid hormone. Thyrotrophs are inhibited by T3 and T4 in the blood."},"gnrh":{"rh":"GnRH","cell":"G","out":"FSH, LH","text":"GnRH → gonadotrophs (basophils) → FSH and LH → ovarian follicle growth and estrogen secretion; steroid production in the testes. Gonadotrophs are inhibited by progesterone and estradiol."},"ghrh":{"rh":"GHRH","cell":"S","out":"GH","text":"GHRH (a Gs receptor) → somatotrophs (acidophils) → growth hormone in pulses, biggest soon after sleep starts. GH makes the liver produce IGF-1 for bone and muscle growth. Somatotrophs are inhibited by somatostatin (Gi), and GH and IGF-1 feed back mainly by making the hypothalamus release more of it."},"da":{"rh":"dopamine","cell":"L","out":"","inhib":true,"text":"Dopamine → lactotrophs (acidophils): chronic inhibition of prolactin, the one pituitary hormone that is held down all the time. When a mother nurses, the dopamine brake comes off."}},"ANT":"Anterior lobe (adenohypophysis: glandular epithelium from Rathke's pouch): hypothalamic axons stop at the median eminence and release into the first capillary bed (superior hypophysial artery); the portal veins carry the hormone to the fenestrated capillaries of the pars distalis, where it finds the cells with its receptor. ","POST":"Posterior lobe (neurohypophysis: neural tissue, not endocrine): large (magnocellular) neurons of the supraoptic and paraventricular nuclei send unmyelinated axons down the infundibulum, the hypothalamohypophysial tract. Granules of ADH (vasopressin) or oxytocin pile up in swellings, Herring bodies, and leave the terminals by exocytosis into fenestrated capillaries (inferior hypophysial artery); pituicytes pull their processes back to let them through. No releasing-hormone step: it's a storage site."};

    data: (function(){ var d = {"W":540,"H":460,"ZG":[38,70],"ZF":[70,252],"ZR":[252,276],"MED":[276,446],"S":[[[85,40],[85,276],[150,362]],[[205,40],[205,276],[178,352]],[[295,40],[295,276],[200,364]],[[55,40],[55,276],[150,372]]],"ART":[[262,22],[262,300],[200,368]],"CLUS":[[82,318],[252,318],[116,400],[244,404]],"FIBER":[[4,296],[40,300],[70,312]],"SC":{"rest":{"name":"at rest","stress":0,"dual":0,"text":"Blood runs from the capsule inward. Arteries form a subcapsular plexus; short cortical arteries become sinusoids that run through all three zones and drain at the corticomedullary junction into the medulla, carrying cortical hormones with them; long medullary arteries pass straight through and capillarize in the medulla. So the medulla has a dual supply. Its sinusoids collect into a central vein, which leaves as the suprarenal vein."},"dual":{"name":"the medulla's dual supply","stress":0,"dual":1,"text":"\"Here's the question that's going to be on your exam\": the medulla receives a dual blood supply, arterial blood from the medullary arterioles (the long medullary arteries) and venous blood from the cortical sinusoids, which carries cortisol with it. Both drain into the central (adrenomedullary) vein and out through the suprarenal vein. The arteries themselves come from three sources: superior suprarenal (inferior phrenic artery), middle suprarenal (abdominal aorta) and inferior suprarenal (renal artery)."},"stress":{"name":"stress · cortisol → PNMT","stress":1,"dual":0,"text":"Stress response: ACTH drives the fasciculata, and the cortisol it makes flows with the blood from cortex to medulla, where it activates PNMT (norepinephrine → epinephrine). Preganglionic sympathetic fibers (T1 to L2, myelinated, through white rami and the chain without synapsing) release acetylcholine onto chromaffin cells: they depolarize, calcium flows in, and they release epinephrine and norepinephrine, about 80% epinephrine. Acetylcholine and ACTH also activate tyrosine hydroxylase and dopamine beta-hydroxylase."}}};

/* ---------- QUESTIONS ----------

   Graded quizzes and last year's quizzes, crosswords and exams are not used, even as context (syllabus). */
var QUESTIONS = [];
function mcq(id, lec, src, stem, choices, ex, extra){ var q = { id:id, lec:lec, type:'mcq', stem:stem, choices:choices, answer:0, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
function seq(id, lec, src, stem, steps, ex, extra){ var q = { id:id, lec:lec, type:'sequence', stem:stem, steps:steps, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
function match(id, lec, src, stem, pairs, ex, extra){ var q = { id:id, lec:lec, type:'match', stem:stem, pairs:pairs, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
function multi(id, lec, src, stem, choices, correct, ex, extra){ var q = { id:id, lec:lec, type:'multi', stem:stem, choices:choices, correct:correct, ex:ex||'', src:src }; if(extra) Object.keys(extra).forEach(function(k){ q[k] = extra[k]; }); QUESTIONS.push(q); }
/* Two-statement (fmt '2stmt') and true/false (fmt 'tf') items keep their choices in a fixed order (choiceOrder), so the
   answer is not authored first. Their "why each choice" lines are built here instead of in QUESTION_WHY:
   two() takes one reason per statement, tf() one line for True and one for False. */
var TWO_CHOICES = ['Both statements are true','Both statements are false','Statement 1 is true; statement 2 is false','Statement 1 is false; statement 2 is true'];
function two(id, lec, src, s1, s2, t1, t2, ex, r1, r2, extra){
  var claims = [[true,true],[false,false],[true,false],[false,true]], tv = function(b){ return b ? 'true' : 'false'; };
  var why = claims.map(function(c){
    if(c[0] === t1 && c[1] === t2) return 'Statement 1 is ' + tv(t1) + ': ' + r1 + ' Statement 2 is ' + tv(t2) + ': ' + r2;
    var out = [];
    if(c[0] !== t1) out.push('Statement 1 is ' + tv(t1) + ', not ' + tv(c[0]) + ': ' + r1);
    if(c[1] !== t2) out.push('Statement 2 is ' + tv(t2) + ', not ' + tv(c[1]) + ': ' + r2);
    return out.join(' ');
  });
  mcq(id, lec, src, 'Read the two statements.\n1. ' + s1 + '\n2. ' + s2, TWO_CHOICES.slice(), ex, extra);

}
function tf(id, lec, src, statement, isTrue, ex, whyTrue, whyFalse, extra){

}

mcq("hp-neuroendo", "hypopit", "rec", "If an exam question asks about neuroendocrine hormones, Dr. Galin said it most likely means:",

mcq("hp-steroid-store", "hypopit", "slides", "Why can't a cell store steroid hormones in vesicles the way it stores peptides?",

mcq("hp-gs-ca", "hypopit", "rec", "According to Dr. Galin, how does a Gαs-coupled receptor lead to secretion of a peptide hormone?",

mcq("hp-gq-store", "hypopit", "rec", "How does the calcium rise after Gαq activation differ from the one after Gαs activation?",
  ["Gαq releases stored calcium; Gαs brings it in from outside","Gαq brings calcium in from outside; Gαs releases stored calcium","Only Gαs raises intracellular calcium","Neither raises intracellular calcium"],

mcq("hp-gi", "hypopit", "rec", "A hormone binds a Gαi-coupled receptor on a pituitary cell. What happens to secretion of that cell's hormone?",

mcq("hp-ins-vs-gh", "hypopit", "rec", "How does the growth hormone receptor differ from the insulin receptor?",

mcq("gr-lipolysis", "growth", "slides", "In adipose tissue, GH:",
  ["Increases lipolysis","Increases triglyceride storage","Increases glucose uptake","Has no effect"],

mcq("gr-muscle", "growth", "slides", "Apart from its effects on growth, which pairing of GH effects is correct?",

  "Outside of growth, GH increases lipolysis while stimulating protein formation in muscle (the pair Dr. Galin flagged for the pancreas lecture). GH does not release insulin or suppress glucagon: most of its metabolic actions oppose insulin, which is why it is called diabetogenic.");
mcq("gr-diff", "growth", "slides", "In the \"take home\" slide, the direct action of GH (as opposed to IGF-1) at the growth plate is:",
  ["Differentiation of precursor cells such as prechondrocytes","Clonal expansion of the chondrocytes that have already formed","Calcification of the cartilage matrix","Closure of the epiphyseal plate"],
  "Direct GH: increase IGF-1 and stimulate formation of precursors (differentiation). Indirect, through IGF-1: clonal expansion of those precursors.");
mcq("gr-estrogen", "growth", "slides", "Which hormone hastens closure of the epiphyseal plates and helps determine final adult height?",
  ["Estrogen","Growth hormone","IGF-1","Thyroid-stimulating hormone"],
  "Reproductive hormones, especially estrogen, hasten epiphyseal closure. Growth stops within a few years after puberty when growth-plate chondrocytes stop dividing and the matrix calcifies.");
mcq("gr-radial", "growth", "slides", "After the growth plates close, bones can still grow in diameter by:",
  ["Endosteal resorption and periosteal deposition","Interstitial growth at the epiphyseal plate","Chondrocyte division in articular cartilage","Expansion of the marrow cavity alone"],

mcq("gr-igf-puberty", "growth", "slides", "During puberty, the greatest growth rates occur when:",

mcq("gr-ghrh-arcuate", "growth", "slides", "GHRH is secreted by neurons of the:",

mcq("gr-ghrh-gs", "growth", "slides", "GHRH stimulates somatotrophs through which signaling pathway?",

mcq("gr-ss-gi", "growth", "slides", "How does somatostatin stop GH secretion?",

  "Somatostatin binds a Gi-coupled receptor: no rise in cAMP, potassium channels activated, hyperpolarization, no GH secretion. GHRH and somatostatin are the \"yin-yang\" of GH control.");
mcq("gr-ghrelin", "growth", "slides", "Ghrelin affects GH by:",
  ["Stimulating GH release from the pituitary","Inhibiting GH release by raising somatostatin output","Blocking IGF-1 receptors","Converting GH to IGF-1"],
  "Ghrelin increases appetite and stimulates GH release; GH then breaks down fat and builds muscle.");
mcq("gr-ss-glucose", "growth", "slides", "High blood glucose and high free fatty acids lower GH secretion because they:",
  ["Stimulate somatostatin release","Stimulate GHRH release","Activate the GH receptor","Increase ghrelin"],
  "On the axis diagram, high glucose and FFA stimulate somatostatin, a negative regulator of GH. (GH itself raises glucose and free fatty acids, so this is feedback.)");
mcq("gr-igf-fb", "growth", "slides", "Which is NOT one of the ways IGF-1 suppresses GH secretion?",
  ["Stimulating GHRH release from the hypothalamus","Acting directly on somatotrophs through its own receptor","Increasing somatostatin secretion","Suppressing GHRH release"],
  "IGF-1 feeds back directly on the pituitary (through its own receptor tyrosine kinase) and indirectly by suppressing GHRH and increasing somatostatin. GH also inhibits itself in a short loop.", {"fmt":"except"});
mcq("gr-igf-rtk", "growth", "slides", "When IGF-1 acts directly on the pituitary to suppress GH, it signals through:",
  ["A receptor tyrosine kinase","A Gs-coupled receptor that raises cAMP","A Gq-coupled receptor that raises calcium","A nuclear receptor"],

mcq("gr-somatopause", "growth", "slides", "In somatopause, the decline in GH seems to be located in:",
  ["The hypothalamus (less GHRH)","The somatotrophs, which can no longer make GH","The liver, which stops making IGF-1","The GH receptor"],

mcq("gr-somatopause-sx", "growth", "slides", "Which is an expected consequence of somatopause?",
  ["Increased fat mass with decreased muscle mass","Increased bone mineral content and denser, stronger bones","Thicker skin","Accelerated linear growth"],

mcq("gr-laron", "growth", "slides", "A child is very short with normal GH levels but low IGF-1. The most likely cause is:",
  ["A GH receptor defect","A GH-secreting pituitary adenoma","Excess estrogen closing the plates early","Too much somatostatin"],

mcq("gr-deficiency-sx", "growth", "slides", "Major manifestations of GH deficiency in children include:",

  "Children with GH deficiency show growth failure, short stature and delayed sexual maturity.");
mcq("gr-giant", "growth", "slides", "GH excess that begins before the epiphyses close causes:",

mcq("gr-acro-dental", "growth", "slides", "An adult dental patient's lower jaw, brow ridge and hands have enlarged over years; he sweats a lot and was recently diagnosed with diabetes. The most likely cause is:",

  "Acromegaly: after the plates close, GH excess thickens bone (periosteal growth): brow ridge, lower jaw, hands and feet; soft tissue grows; sweating, carpal tunnel and insulin resistance. Usually a benign, slow-growing somatotroph adenoma.", {"pbox":[["Patient","46-year-old man"],["History","Rings and shoes no longer fit; new diagnosis of diabetes; heavy sweating"],["Exam","Prominent brow ridge, enlarged lower jaw with new spacing between teeth, large hands"]]});
mcq("gr-acro-test", "growth", "slides", "Which tests confirm acromegaly?",

  "The slide: \"Way to test: serum IGF levels + glucose tolerance test.\" GH is pulsatile, so one random GH value is unreliable.");
mcq("gr-acro-tx", "growth", "slides", "Besides surgery, which drugs can block GH secretion in acromegaly?",

mcq("gr-acro-sx-ex", "growth", "slides", "All of the following are features of acromegaly EXCEPT:",
  ["Increased height from lengthening long bones","A bony ridge above the eyes","Enlargement of the lower jaw","A bulbous nose from excess soft tissue"],

mcq("gr-age-onset", "growth", "slides", "GH-secreting tumors are typically recognized in which decade of life?",

/* From the recording of this lecture */
mcq("gr-r-thymus", "growth", "rec", "How does GH support the immune system?",
  ["It stimulates the thymus, where T cells mature","It suppresses B lymphocyte development","It induces PNMT in the adrenal medulla","It shrinks the lymph nodes and spleen during the pubertal growth spurt"],
  "Among GH's big effects (linear growth, less fat, more lean mass) is immune support: it stimulates the thymus, where T cells are educated, and supports T and B lymphocyte development.");
mcq("gr-r-birthweight", "growth", "rec", "Why do mothers with diabetes and hyperinsulinemia in pregnancy tend to have larger babies?",
  ["Insulin drives growth in utero","GH crosses the placenta","IGF-1 is at its peak before birth","Estrogen keeps the fetal growth plates open"],
  "Insulin has pro-growth effects, especially in utero, and keeps promoting muscle growth after birth. GH is not important for fetal growth.");
mcq("gr-r-ratio", "growth", "rec", "The 22-kDa and 20-kDa forms of GH are secreted in about what ratio?",
  ["About 9:1, the 22-kDa form most abundant","About 1:1","About 9:1, the 20-kDa form most abundant","About 3:1, the 22-kDa form most abundant"],
  "Alternative splicing gives a 22-kDa (191 amino acids) and a 20-kDa (176 amino acids) form. The 22-kDa form is about nine times as abundant (the slides write it 1:9) and a little more potent.");
mcq("gr-r-stat", "growth", "rec", "After GH binds its receptor and the Janus kinases are activated, what do STAT proteins do?",
  ["Dimerize once phosphorylated and act as transcription factors","Phosphorylate the receptor's own intrinsic kinase domain so it can signal","Raise cyclic AMP by activating adenylyl cyclase at the membrane","Open calcium channels in the ER membrane"],
  "JAKs phosphorylate STATs (signal transducers and activators of transcription), which dimerize, enter the nucleus and change gene expression. The JAKs also start MAP kinase pathways. The receptor has no kinase of its own.");
mcq("gr-r-glucose", "growth", "rec", "In muscle and adipose tissue, GH:",
  ["Reduces glucose uptake, promoting insulin resistance","Increases glucose uptake by moving GLUT4 to the membrane, like insulin","Stimulates glycogen and triglyceride storage after meals","Converts glucose to fatty acids"],
  "On the big summary slide, GH reduces glucose uptake in muscle and fat, antagonizing insulin; with lipolysis and hepatic gluconeogenesis, that makes GH diabetogenic.");
mcq("gr-r-reserve", "growth", "rec", "At the epiphyseal plate, GH itself acts mainly on the:",
  ["Reserve zone, committing precursors to chondrocytes","Proliferative zone, driving the clonal expansion of chondrocytes","Hypertrophic zone, enlarging chondrocytes","Calcified zone, mineralizing the matrix"],
  "GH tells the quiescent precursors in the reserve cartilage to commit to the chondrocyte lineage; IGF-1 (and to an extent IGF-2) then drives their proliferation.");
mcq("gr-r-estrogen", "growth", "rec", "Estrogen's effect on growth in puberty is best described as:",
  ["It raises GH but hastens closure of the growth plates","It lowers GH and keeps the growth plates open","It has no effect on GH or the growth plates","It raises GH and keeps the growth plates open into the 30s"],
  "Estrogen has dual effects: it raises GH release, but at the epiphyseal plate it is inhibitory and promotes closure, which ends linear growth.");
mcq("gr-r-ssfb", "growth", "rec", "What is the main way GH and IGF-1 feed back to limit GH secretion?",
  ["They make the hypothalamus release more somatostatin","They block GH synthesis in the liver's hepatocytes, where GH is made","They raise ghrelin, which competes with GH at its receptor","They stimulate GHRH release from the arcuate nucleus"],
  "Several negative loops (hierarchical feedback), but \"the big one is this somatostatin production\": GH and the IGFs prompt the hypothalamus to release somatostatin, which shuts the somatotrophs down through Gi.");
mcq("gr-r-daytime", "growth", "rec", "Besides sleep, which can prompt a GH pulse during the day?",
  ["Fasting or a high-protein meal","A high-glucose meal that raises blood sugar","Rising free fatty acids after lipolysis","Rising IGF-1"],
  "Daytime pulses are smaller than the nighttime ones; fasting and a high-protein meal are two prompts named. High glucose, free fatty acids and IGF-1 all raise somatostatin, which lowers GH.");
mcq("gr-r-shbg", "growth", "rec", "Why do patients with acromegaly often have fertility problems?",
  ["GH raises sex hormone-binding globulin, leaving little free sex hormone","The tumor destroys the neighboring gonadotrophs, so no LH or FSH is made","GH lowers sex hormone-binding globulin, so sex hormones are cleared quickly","IGF-1 blocks LH receptors in the gonads"],
  "GH stimulates sex hormone-binding globulin; with so much of it, the sex hormones are bound up and little free hormone reaches the target tissues.");
seq("gr-r-plate", "growth", "rec", "Put the zones of the epiphyseal plate in order, from the epiphysis toward the shaft.",
  ["Reserve cartilage (quiescent precursors)","Proliferation","Hypertrophy","Apoptosis","Calcification and ossification"],
  "Reserve → proliferation → hypertrophy → apoptosis → calcification and ossification, which lengthens the bone. GH acts in the reserve zone, IGF-1 in proliferation.");
two("gr-r-2s-1", "growth", "rec", "At the growth plate, GH drives the proliferation of chondrocytes, while IGF-1 commits the precursors.", "IGF-1 matters most for growth before birth.", false, false,
  "It is the other way round: GH commits precursors, IGF-1 expands them. And IGF-1 tracks juvenile and adolescent growth, not prenatal growth.",
  "GH makes the precursors commit; IGF-1 drives their proliferation.", "IGF-1 is not very important before birth; it tracks growth in childhood and adolescence.");
two("gr-r-2s-2", "growth", "rec", "The GH receptor is itself a tyrosine kinase, like the insulin receptor.", "Thyroid hormone deficiency in childhood can cause a form of dwarfism.", false, true,
  "The GH receptor borrows a bound Janus kinase; the insulin receptor is the one that is itself a tyrosine kinase. Thyroid hormones are needed for growth.",
  "it has no kinase activity of its own; a bound Janus kinase (JAK2) supplies it.", "thyroid hormones work with GH, and deficiency stunts growth.");
tf("gr-r-tf-1", "growth", "rec", "The GH receptor has no kinase activity of its own; a bound Janus kinase supplies it.", true,
  "Tyrosine kinase-associated receptor: JAK2 stays bound and phosphorylates STATs.",
  "A partner Janus kinase does the phosphorylating.", "It is the insulin receptor that is itself a tyrosine kinase; GH's borrows JAK2.");
tf("gr-r-tf-2", "growth", "rec", "GH increases lipogenesis in adipose tissue, as insulin does.", false,
  "GH increases lipolysis, the opposite of insulin's lipogenesis.",
  "Insulin builds fat; GH breaks it down.", "GH increases lipolysis, which is part of why it lowers body fat.");
tf("gr-r-tf-3", "growth", "rec", "GH stimulates osteoblasts, so falling GH with age contributes to brittle bones.", true,

  "GH helps osteoblasts build bone.", "It does stimulate osteoblasts; less GH means less bone building.");
tf("gr-r-tf-4", "growth", "rec", "GH secretion begins to fall around our 30s.", true,

mcq("th-extracell", "thyroid", "slides", "What makes thyroid hormone synthesis unique among hormones?",
  ["It is made extracellularly, in the follicle's colloid","It is made from cholesterol, like the other lipid-soluble hormones","It is made in the nucleus","It needs no enzymes"],
  "Thyroid hormones are made extracellularly, in the colloid, by thyroperoxidase acting on thyroglobulin.");
mcq("th-t4", "thyroid", "slides", "T4 (thyroxine) is formed by coupling:",
  ["DIT + DIT","MIT + DIT","MIT + MIT","Tyrosine + DIT"],
  "MIT + DIT = T3; DIT + DIT = T4. Thyroperoxidase does the coupling on thyroglobulin.");
mcq("th-t3", "thyroid", "slides", "T3 is formed by coupling:",
  ["MIT + DIT","DIT + DIT","MIT + MIT","T4 + iodine"],
  "One iodine (MIT) plus two iodines (DIT) gives three: T3.");
mcq("th-rt3", "thyroid", "slides", "Which enzyme converts T4 to the inactive reverse T3?",
  ["5-deiodinase (inner ring)","5'-deiodinase (outer ring)","Thyroperoxidase","Pendrin"],
  "5'-deiodinase (outer ring) makes active T3; 5-deiodinase (inner ring) makes inactive reverse T3. \"Key to whether T3 or reverse T3 is formed.\"");
mcq("th-nis", "thyroid", "slides", "Step 1 of thyroid hormone synthesis, iodide trapping, is carried out by:",
  ["The sodium-iodide symporter (NIS) on the basolateral membrane","Pendrin, which pumps iodide from the blood across the apical membrane","Thyroperoxidase in the colloid","Megalin on the apical membrane"],
  "NIS, on the basolateral membrane, uses the sodium gradient (ATP-dependent active transport) to concentrate iodide 20-50 times above plasma.");
mcq("th-pendrin", "thyroid", "slides", "Iodide crosses the apical membrane of the follicular cell into the colloid through:",
  ["Pendrin","The sodium-iodide symporter","Megalin","Thyroglobulin"],
  "Pendrin moves iodide across the apical membrane; NIS brings it in across the basolateral side.");
mcq("th-tpo", "thyroid", "slides", "Which steps does thyroperoxidase carry out?",
  ["Oxidizing iodide, iodinating thyroglobulin and coupling MIT/DIT","Trapping iodide and endocytosing colloid","Converting T4 to T3 in the liver, kidney and other peripheral tissues","Cleaving T3 and T4 from thyroglobulin in lysosomes"],
  "Thyroperoxidase (needs H2O2) oxidizes iodide to iodine, adds it to thyroglobulin's tyrosines (organification) and couples MIT and DIT into T3 and T4.");
mcq("th-organif", "thyroid", "slides", "\"Organification\" means:",
  ["Adding iodine to tyrosine residues of thyroglobulin","Transporting iodide into the follicular cell from the blood","Joining two DITs into T4","Packaging thyroglobulin into vesicles"],
  "Organification is thyroperoxidase adding iodine to the tyrosines of thyroglobulin, forming MIT and DIT. Coupling is the next step.");
mcq("th-h2o2", "thyroid", "slides", "Thyroperoxidase requires which substrate to oxidize iodide to iodine?",
  ["Hydrogen peroxide (H2O2)","Cholesterol","ATP from glycolysis directly","Calcium"],
  "Oxidation of iodide requires H2O2. TSH helps by boosting glucose oxidation, which yields NADPH for making peroxide.");
mcq("th-megalin", "thyroid", "slides", "Megalin is:",
  ["The thyroglobulin receptor that allows endocytosis of colloid","The iodide transporter on the basolateral membrane","The enzyme that couples MIT and DIT into T3 and T4 in the colloid","The plasma protein that carries T4"],
  "Megalin binds thyroglobulin so the follicular cell can endocytose colloid and send it to lysosomes, where T3 and T4 are cleaved off.");
mcq("th-recycle", "thyroid", "slides", "What happens to the MIT and DIT left after thyroglobulin is digested?",
  ["They are deiodinated so the iodine is recycled","They are secreted into the blood as active hormone","They are stored in the colloid permanently","They are converted to calcitonin"],
  "Leftover MITs and DITs are deiodinated to recycle iodine; only T3 and T4 diffuse out into the circulation.");
mcq("th-ratio", "thyroid", "slides", "After proteolysis of thyroglobulin, the thyroid secretes roughly:",
  ["90% T4 and 10% T3","90% T3 and 10% T4","50% T3 and 50% T4","100% reverse T3"],
  "The gland releases mostly T4 (about 90%) with about 10% T3; most active T3 is made in peripheral tissues.");
mcq("th-wolff", "thyroid", "slides", "A patient receives a very large dose of iodine. What happens to thyroid hormone synthesis at first?",
  ["It is blocked by inhibition of organification (the Wolff-Chaikoff effect)","It increases in proportion to the iodine supplied to the gland","It stops permanently","It is unchanged, because TSH controls it"],
  "Excess iodine inhibits organification (and NIS expression): the Wolff-Chaikoff effect. It is short-lived; the gland escapes by decreasing iodide transport. This autoregulation is independent of TSH.");
mcq("th-trh-gq", "thyroid", "slides", "The TRH receptor on thyrotrophs is coupled to:",
  ["Gq: phospholipase C, IP3 and DAG, calcium and PKC","Gs: adenylyl cyclase, cAMP and protein kinase A","Gi: inhibition of adenylyl cyclase","JAK-STAT"],
  "TRH → Gq → PLC → IP3 + DAG → calcium mobilized and PKC activated → TSH transcription and release. The TSH receptor on the thyroid is Gs.");
mcq("th-tsh-gs", "thyroid", "slides", "The TSH receptor on thyroid follicular cells signals through:",
  ["Gs, adenylyl cyclase, cAMP and protein kinase A","Gq and phospholipase C only","An intrinsic tyrosine kinase that phosphorylates IRS proteins","A nuclear receptor"],
  "TSH binds the TSH receptor on the basolateral membrane; it is Gs-coupled: adenylyl cyclase, cAMP, PKA.");
mcq("th-tsh-effects", "thyroid", "slides", "Which is NOT an effect of TSH on the thyroid gland?",
  ["Decreased expression of the sodium-iodide symporter","Increased cell size and number, forming new follicles","Increased endocytosis of colloid","Increased glucose oxidation and NADPH"],
  "TSH increases everything: growth (cell size and number, follicles) and every synthetic step: iodide trapping (NIS), iodination, colloid endocytosis (megalin), thyroglobulin degradation, and glucose oxidation for NADPH and peroxide.", {"fmt":"except"});
mcq("th-t3-inhib", "thyroid", "slides", "The predominant inhibitor of TSH secretion is:",
  ["T3","T4","Reverse T3","TRH"],

mcq("th-num-1", "thyroid", "slides", "Which steps happen in the colloid rather than inside the follicular cell?\n1. Iodination of thyroglobulin\n2. Coupling of MIT and DIT\n3. Proteolysis of thyroglobulin\n4. Iodide trapping by NIS",

mcq("th-r-keyword", "thyroid", "rec", "Dr. Galin's key word: when a question mentions it, think of thyroid hormone first. Which word?",

mcq("th-r-t3", "thyroid", "rec", "Why does the thyroid release so little T3?",

/* ---------- READINGS (lecture notes from the slides, speaker notes and recordings) ----------

var READINGS = {"histo1": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What makes a gland endocrine: ductless, rich fenestrated capillaries, abundant ER</li><li>The three hormone types, surface vs intracellular receptors, the three receptor classes, and the Gs / Gi / Gq table</li><li>Anterior vs posterior pituitary: names, parts, origin, staining, and the portal system</li><li>Cells of the pars distalis: acidophils, basophils, chromophobes, and what stimulates and inhibits each cell type</li><li>Herring bodies and pituicytes</li><li>Thyroid follicles, colloid, follicular vs C (parafollicular) cells</li><li>Parathyroid chief cells vs oxyphils, and what PTH does</li></ul></div>\n<p>Dr. Herr split this lecture into two halves: the pituitary first, then the thyroid and parathyroid. Some of it is review from the GI block, but the endocrine framing is new: endocrine cells use the bloodstream to carry their output, hormones, to the rest of the body.</p>\n<h4>What endocrine organs do</h4>\n<p>Endocrine organs regulate metabolic activity and produce local or body-wide effects by secreting <b>hormones</b>. Signaling is specific because a hormone (the ligand) only acts on a target cell that has its receptor, and those interactions happen with varying degrees of <b>affinity</b>: pump out a lot of a hormone with low affinity for its receptor and you may get only a small response.</p>\n<p>All glands, endocrine and exocrine, develop from epithelium that grows down into the underlying tissue. In an exocrine gland the duct stays. In an endocrine gland the <b>duct cells disappear</b> and an abundant capillary bed develops around the gland instead, because whatever it secretes has to reach the blood. So endocrine glands are <b>ductless</b>, <b>highly vascularized</b> (fenestrated capillaries), and their cells have abundant rough or smooth <b>endoplasmic reticulum</b>. Examples: pituitary, thyroid, parathyroid, adrenal (suprarenal) and pineal glands, the pancreatic islets and the gonads.</p>\n<h4>Hormones and their receptors</h4>\n<p>Hormones come in three types by composition: <b>proteins and polypeptides</b> and <b>amino acid derivatives</b> (mostly water-soluble), and <b>steroid and fatty acid derivatives</b> (mostly lipid-soluble). Water-soluble hormones bind <b>cell-surface receptors</b> and usually signal through a <b>second messenger</b>. Lipid-soluble steroid hormones cross the membrane, bind an <b>intracellular receptor</b>, move to the nucleus and start the DNA-to-RNA-to-protein sequence. Surface signaling is fast (an existing protein's function changes); the intracellular route is slow, minutes to hours or days, because new protein has to be made.</p>\n<p>There are three major classes of cell-surface receptors: <b>ion-channel-linked</b> (the ligand opens a gate and ions flow in), <b>G-protein-linked</b> (they work through second messengers) and <b>enzyme-linked</b> (binding brings catalytic domains together and activates them, the way <b>tyrosine kinases</b> work). Dr. Herr: \"kind of commit this table to memory,\" because G-protein questions come up again and again.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>G protein</th><th>Does</th><th>Result</th></tr></thead><tbody>\n<tr><td>Gs</td><td>Activates adenylate cyclase</td><td>Increase in cAMP</td></tr>\n<tr><td>Gi</td><td>Inhibits adenylate cyclase</td><td>Decrease in cAMP</td></tr>\n<tr><td>Gq</td><td>Activates phospholipase C</td><td>Increase in IP3 (and DAG): calcium released from the ER</td></tr>\n</tbody></table></div>\n<p>In the Gq pathway the activated alpha subunit turns on <b>phospholipase C</b>, which splits PIP2 into IP3 and diacylglycerol (DAG, which activates protein kinase C). <b>IP3</b> is the second messenger: it travels to the endoplasmic reticulum and opens its calcium channels. The \"S\" in Gs is stimulatory and the \"I\" in Gi is inhibitory.</p>\n<p>Hormone-receptor signaling almost always ends in a <b>negative feedback</b> loop that halts further secretion and keeps homeostasis (\"there is one instance of positive that you'll talk about\"). Target cells can also be desensitized. Dr. Herr listed five ways to turn signaling off: sequester the receptor in an endosome and recycle it back to the membrane; take it into an endosome that fuses with a lysosome and destroy it (<b>receptor downregulation</b>); bind an intracellular protein to the receptor so it can't signal; inactivate the signaling protein the receptor talks to; or make an inhibitory protein that blocks the pathway.</p>\n<h4>The pituitary gland (hypophysis)</h4>\n<p>The pituitary is the <b>master organ</b> of the endocrine system. Its hormones regulate the adrenal glands, thyroid, reproductive organs, kidneys, mammary glands, and growth of muscle and bone, and its own release is regulated by <b>neurohormones from the hypothalamus</b> (the hypothalamo-hypophysial system). It hangs from the hypothalamus by the hypophyseal stalk, so it is continuous with the brain; it sits posterior to the optic chiasm in the <b>sella turcica</b> of the sphenoid bone, and it has a rich blood supply. \"Hypophysis\" and \"pituitary\" mean the same thing; Dr. Herr will call it the pituitary on exams, but other exams may not.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th></th><th>Anterior lobe</th><th>Posterior lobe</th></tr></thead><tbody>\n<tr><td>Name</td><td>Adenohypophysis</td><td>Neurohypophysis</td></tr>\n<tr><td>Parts</td><td>Pars distalis, pars tuberalis, pars intermedia</td><td>Pars nervosa, infundibulum</td></tr>\n<tr><td>Tissue</td><td>Glandular epithelium: cords of parenchymal cells, supporting connective tissue, fenestrated capillaries (the secondary plexus)</td><td>Neural: unmyelinated axons from the hypothalamus, supported by pituicytes</td></tr>\n<tr><td>Develops from</td><td>Ectoderm of the oropharynx (Rathke's pouch)</td><td>Neural ectoderm: a down-growth of the hypothalamus</td></tr>\n<tr><td>Stains</td><td>Darker (full of hormone-containing cells)</td><td>Lighter (mostly axons)</td></tr>\n<tr><td>Hormones</td><td>FSH, LH, ACTH, TSH, prolactin, GH (\"FLAT PiG\")</td><td>ADH (vasopressin) and oxytocin, made in the hypothalamus</td></tr>\n</tbody></table></div>\n<p>The <b>infundibulum</b> connects to the hypothalamus (it is continuous with the median eminence) and leads down to the <b>pars nervosa</b>. The pars tuberalis wraps around the stalk, the pars intermedia sits in the middle, and the pars distalis is the bulk of the anterior lobe. If you are lost on a picture, find the optic chiasm: that side is anterior.</p>\n<h4>Blood supply and the portal system</h4>\n<p>As the internal carotid artery makes its U-turn toward the circle of Willis, it gives off the <b>superior and inferior hypophysial arteries</b>. These form capillary beds around the stalk and around the gland, linked by veins: a small <b>portal system</b>, the <b>hypothalamo-hypophysial portal system</b> (the liver's portal system is the big one you already know). Hypothalamic neurons release stimulating or inhibiting hormones into the first capillary bed; the portal veins carry them to the anterior lobe, where they act on the endocrine cells of the pars distalis, which then release their own hormones into the fenestrated capillaries. The posterior lobe works differently: hypothalamic axons release ADH and oxytocin straight into the capillary bed fed by the inferior hypophysial artery, with no releasing-hormone step.</p>\n<h4>Cells of the pars distalis</h4>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Type</th><th>Contains</th><th>Cells</th></tr></thead><tbody>\n<tr><td>Acidophils</td><td>Polypeptide hormones</td><td>Somatotrophs, lactotrophs (\"S and L\")</td></tr>\n<tr><td>Basophils</td><td>Glycoprotein hormones</td><td>Thyrotrophs, gonadotrophs, corticotrophs (\"T, G and C\")</td></tr>\n<tr><td>Chromophobes</td><td>No or minimal hormone</td><td>Stem cells, degranulated acidophils or basophils</td></tr>\n</tbody></table></div>\n<p>For every anterior pituitary cell, know what <b>stimulates</b> it and what <b>inhibits</b> it.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Cell</th><th>Secretes</th><th>Stimulated by</th><th>Inhibited by</th><th>Does</th></tr></thead><tbody>\n<tr><td>Somatotroph</td><td>Somatotropin (growth hormone)</td><td>GHRH</td><td>Somatostatin</td><td>Makes the liver produce IGF-1, which stimulates bone and muscle growth</td></tr>\n<tr><td>Lactotroph (mammotroph)</td><td>Prolactin</td><td>PRH and oxytocin</td><td>Dopamine and PIF</td><td>Mammary development and lactation; their number rises after childbirth and drops after nursing stops</td></tr>\n<tr><td>Thyrotroph</td><td>Thyrotropin (TSH)</td><td>TRH</td><td>T3 and T4 in the blood</td><td>Synthesis and release of thyroid hormone</td></tr>\n<tr><td>Gonadotroph</td><td>FSH and LH</td><td>GnRH</td><td>Progesterone and estradiol</td><td>Ovarian follicle growth and estrogen secretion; steroid production in the testes</td></tr>\n<tr><td>Corticotroph</td><td>The precursor of ACTH</td><td>CRH</td><td>High plasma cortisol</td><td>Synthesis and release of adrenal cortex hormones</td></tr>\n</tbody></table></div>\n<p>He would not expect you to tell these cells apart on a stain (\"all of those stains look pretty similar to me\").</p>\n<h4>The posterior lobe: pars nervosa and infundibulum</h4>\n<p>The posterior lobe is <b>not endocrine tissue</b>. It is a <b>storage site</b> for neurohormones made in the hypothalamus. Neurons in the <b>supraoptic</b> nucleus (just above the optic chiasm) and the <b>paraventricular</b> nucleus send unmyelinated axons down the infundibulum as the <b>hypothalamohypophysial tract</b>, ending in the pars nervosa. Along the axons, accumulated secretory granules make swellings called <b>Herring bodies</b>; each holds membrane-bound granules of <b>ADH (vasopressin)</b> or <b>oxytocin</b>. The hormones are released by exocytosis from the axon terminals into fenestrated capillaries. On EM the dark granules in a Herring body are those hormones.</p>\n<p><b>Pituicytes</b> are the neuroglial cells of the pars nervosa that surround and support the axons. Their processes touch both the capillaries and the axons, and they act as gatekeepers: when ADH and oxytocin are released, the pituicyte processes next to the vessels <b>retract</b>, letting the hormones into the pericapillary space.</p>\n<h4>The thyroid gland</h4>\n<p>The thyroid sits just below the cricoid cartilage: two large lateral lobes on the sides of the trachea joined by a narrow <b>isthmus</b> over the <b>second tracheal cartilage</b>, sometimes with a pyramidal lobe rising from the isthmus. A fibrous <b>capsule</b> sends in trabeculae that carry vessels and nerves. Under the microscope it looks like soap bubbles of different shapes and sizes.</p>\n<p>The working units are <b>follicles</b>: thousands of cyst-like compartments, 0.2 to 1.0 mm across (over 20 million per gland), lined by a <b>simple cuboidal follicular epithelium</b> and filled with <b>colloid</b>. Colloid is made of <b>thyroglobulin</b>, the storage form and precursor of T3 and T4: the hormone sits there bound to thyroglobulin and is not yet active. Follicular cells have their apical surface (with short microvilli) touching the colloid and their basal surface on a basal lamina, next to an extensive network of fenestrated capillaries, blind-ended lymphatics and nerves.</p>\n<p><b>C cells</b> (parafollicular cells) sit at the periphery of the follicles, inside the basal lamina but <b>not in contact with the colloid</b>. They secrete <b>calcitonin</b>.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>T3 and T4 act on</th><th>Examples</th></tr></thead><tbody>\n<tr><td>Basal metabolism</td><td>Increase basal metabolic rate, body temperature and appetite</td></tr>\n<tr><td>Carbohydrate, lipid and protein metabolism</td><td>Glucose catabolism for energy, protein synthesis, lipolysis, cholesterol excretion in bile</td></tr>\n<tr><td>Heart</td><td>Normal cardiac function</td></tr>\n<tr><td>Nervous system</td><td>Normal neuronal development and function; enhance the sympathetic nervous system</td></tr>\n<tr><td>Musculoskeletal</td><td>Body growth, skeletal maturation, muscle function</td></tr>\n<tr><td>Reproductive</td><td>Female reproductive activity and lactation</td></tr>\n</tbody></table></div>\n<h4>The parathyroid glands</h4>\n<p>Usually <b>four</b> small glands, a few millimeters each, embedded in the <b>posterior surface</b> of the thyroid's lateral lobes; their position varies. Each has a fibrous capsule whose trabeculae bring in vessels, nerves and lymphatics and divide the gland into poorly defined lobules. The parenchyma has two cell types, <b>chief cells</b> and <b>oxyphils</b>; the stroma around it holds fat cells and neurovasculature, and in older adults fat can fill up to 60% of the gland.</p>\n<ul><li><b>Chief cells</b> are the major functional cells. They look like mostly nucleus, have a well-developed Golgi and dense secretory granules of <b>parathyroid hormone (PTH)</b>, released by exocytosis into fenestrated capillaries.</li><li><b>Oxyphils</b> are non-secretory, larger than chief cells, and occur singly or in clumps.</li></ul>\n<p>You can live without a thyroid, but <b>the absence of parathyroid glands is incompatible with life</b>. When a thyroid is removed, surgeons can move the parathyroids into subcutaneous tissue elsewhere; they grow a new blood supply and keep working.</p>\n<p>PTH keeps blood calcium and phosphate in range. <b>Calcium-sensing receptors</b> on chief cells detect low serum calcium and trigger PTH production and release; high serum calcium inhibits it. PTH stimulates bone resorption by osteoclasts (releasing calcium), calcium absorption from food in the intestine, calcium conservation by the kidneys, and conversion of 25-OH vitamin D3 to active 1,25-(OH)2 vitamin D3.</p>\n", "hypopit": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Endocrine vs paracrine vs autocrine vs neuroendocrine</li><li>Protein/peptide vs amine vs steroid hormones: synthesis, storage, receptor, transport</li><li>Gs, Gq and Gi: how each changes intracellular calcium and secretion; insulin receptor vs GH receptor</li><li>Negative feedback (axis-driven vs physiologic-response-driven), short vs long loop, the one positive feedback</li><li>Anterior vs posterior pituitary: origin, how the hypothalamus reaches each, which hormones</li><li>Hypothalamic releasing and inhibiting hormones and their targets; pulsatile release; POMC</li><li>Primary vs secondary (vs tertiary) disorders from lab values</li></ul></div>\n<p>Dr. Galin: \"out of all the lectures, this is one that you really need to pay attention to, because it lays you the foundation for all of the specific gland lectures.\" The hypothalamus and pituitary are the main control unit for most of the endocrine system, and the principles here come back in the thyroid, growth, adrenal and gonad lectures. If you can give substance to each learning objective, you have it.</p>\n<h4>How hormones signal</h4>\n<p>An <b>endocrine</b> hormone is produced by one cell, enters the bloodstream, travels to a distant site and acts by binding a high-affinity receptor. <b>Paracrine</b> (\"para\" = beside) acts on a neighboring cell without entering the blood. <b>Autocrine</b> (\"auto\" = self) leaves the cell and acts back on the same cell. <b>Neuroendocrine</b> hormones are made by the brain (the CNS) and travel in the blood to a distant cell. The hypothalamus is part of the brain; the pituitary is not. So if a question asks about neuroendocrine hormones, it most likely means the <b>releasing hormones of the hypothalamus</b> (and the posterior pituitary hormones, which are also made in hypothalamic neurons).</p>\n<h4>Three types of hormone</h4>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th></th><th>Proteins and peptides</th><th>Amines</th><th>Steroids</th></tr></thead><tbody>\n<tr><td>Examples</td><td>GH, ACTH, insulin, all anterior pituitary hormones</td><td>Catecholamines (epinephrine, norepinephrine) and thyroid hormones</td><td>Cortisol, aldosterone, estrogen, testosterone</td></tr>\n<tr><td>Made from</td><td>A large preprohormone, cut down to size</td><td>Tyrosine</td><td>Cholesterol (synthesized in cytoplasm and mitochondria)</td></tr>\n<tr><td>Stored?</td><td>Yes, in secretory vesicles; a rise in intracellular Ca2+ triggers exocytosis</td><td>Not long term; made as needed</td><td>No; they diffuse out passively as they are made</td></tr>\n<tr><td>Receptor</td><td>Cell surface</td><td>Catecholamines: surface; thyroid hormone: intracellular</td><td>Intracellular (nuclear) receptors that are transcription factors</td></tr>\n<tr><td>In blood</td><td>Mostly free</td><td>Thyroid hormone bound (thyroid-binding globulin)</td><td>Bound to binding proteins</td></tr>\n</tbody></table></div>\n<p>For peptide hormones, \"calcium is the key to secretion.\" A rise in intracellular calcium drives the secretory pathway, so watch for which receptors can raise it.</p>\n<h4>Receptors</h4>\n<p>G-protein-coupled receptors share a structure but differ in their <b>alpha subunit</b>:</p>\n<ul><li><b>Gαs</b> (stimulatory) activates adenylyl cyclase, raising cAMP and activating PKA. The result is calcium channels opening in the cell membrane: calcium flows <b>in from outside</b> the cell, raising intracellular calcium, and the hormone is secreted.</li><li><b>Gαq</b> (also stimulatory) activates phospholipase C, giving IP3 and diacylglycerol (and PKC). Calcium rises too, but it is released from <b>intracellular stores</b> (ER, Golgi), not brought in from outside. Same end result: secretion.</li><li><b>Gαi</b> (inhibitory) blocks both routes, so intracellular calcium does not rise and nothing is secreted.</li></ul>\n<p>Two tyrosine kinase receptors matter here. The <b>insulin receptor</b> has <b>intrinsic</b> tyrosine kinase domains in its intracellular tails; binding activates them and they phosphorylate <b>insulin receptor substrates</b> (IRS). The <b>growth hormone receptor</b> is a <b>tyrosine kinase-associated</b> receptor: the kinase is not part of the receptor but associated with it, <b>JAK</b>, which starts the <b>JAK-STAT</b> pathway when GH binds.</p>\n<h4>Steroids need cholesterol</h4>\n<p>Cholesterol is the precursor of every steroid hormone, and it travels in the blood as <b>LDL</b>, so impaired cholesterol delivery impairs steroid synthesis. You cannot be completely cholesterol-free: you would lose cortisol (the main stress hormone), aldosterone (salt, water and potassium balance), estrogen and testosterone. Steroids leave the cell by <b>passive diffusion</b>, ride the blood bound to proteins, cross into target cells and bind <b>intracellular receptors</b>. Steroid and thyroid hormone receptors both act by changing <b>gene transcription</b>.</p>\n<h4>Negative feedback</h4>\n<p>Negative feedback is \"key to all endocrine systems\": hormones produce effects that directly or indirectly inhibit their own further secretion. It lets the endocrine cell sense the consequences of its secretion and adjust to keep homeostasis, because chronic overproduction does harm (too much cortisol impairs immunity, cognition and the heart). Every gland lecture gives you that gland's feedback loop. There are two models:</p>\n<ul><li><b>Endocrine-axis-driven</b>: hypothalamus (releasing hormone) → pituitary (pituitary hormone) → peripheral gland (cortisol, thyroid hormone, estrogen...). The peripheral hormone feeds back to turn off the pituitary and/or hypothalamus.</li><li><b>Physiologic-response-driven</b>: no hypothalamus or pituitary. Example: low blood glucose turns on <b>glucagon</b> from alpha cells; as glucose rises, glucagon turns off. Insulin and glucagon are regulated mainly by glucose itself.</li></ul>\n<p>Feedback loops can be <b>short-loop</b> (a pituitary hormone suppresses the matching hypothalamic hormone) or <b>long-loop</b> (a peripheral gland hormone feeds back on the anterior pituitary and hypothalamus, usually negatively).</p>\n<p>Positive feedback is the exception: right before ovulation, estrogen drives its own production by stimulating the hypothalamus and pituitary, causing the <b>LH surge</b>.</p>\n<h4>The anterior pituitary</h4>\n<p>The anterior pituitary is <b>epithelial</b>: at about day 36 of gestation an up-growth of the ectodermal roof of the primitive mouth, <b>Rathke's pouch</b>, meets a down-growth of the diencephalon (future hypothalamus), and the two wrap together into one gland. The posterior pituitary is the neural part. That difference in origin explains why the two lobes are regulated so differently.</p>\n<p>The hypothalamus is a <b>sensor</b> of the external and internal environment (stress, hunger, temperature) and relays that to the pituitary. Releasing and release-inhibiting hormones are made in the arcuate, paraventricular, periventricular and supraoptic nuclei. For the anterior lobe, the axons stop at the <b>median eminence</b>, partway down the stalk; their hormones enter the <b>hypothalamo-hypophyseal portal system</b> and bathe the anterior pituitary, finding the cells that have their receptors. The anterior pituitary is made of clusters of specialized \"tropic\" cells and is controlled positively by releasing hormones and negatively by <b>somatostatin</b> and <b>dopamine</b>. It is the size of an English pea, but life depends on it.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Hypothalamic hormone</th><th>Acts on</th><th>Effect</th></tr></thead><tbody>\n<tr><td>CRH</td><td>Corticotrophs</td><td>Release of ACTH (→ cortisol)</td></tr>\n<tr><td>TRH</td><td>Thyrotrophs</td><td>Release of TSH (→ thyroid hormone)</td></tr>\n<tr><td>GnRH (LHRH)</td><td>Gonadotrophs</td><td>Release of FSH and LH</td></tr>\n<tr><td>GHRH</td><td>Somatotrophs</td><td>Release of GH</td></tr>\n<tr><td>PRF</td><td>Lactotrophs</td><td>Release of prolactin</td></tr>\n<tr><td>Dopamine</td><td>Lactotrophs</td><td>Chronic inhibition of prolactin</td></tr>\n<tr><td>Somatostatin (GHIH)</td><td>Somatotrophs (and thyrotrophs)</td><td>Inhibits GH (and TSH)</td></tr>\n</tbody></table></div>\n<p>Prolactin is the one pituitary hormone that is <b>chronically suppressed</b>, by dopamine: \"if it wasn't being chronically suppressed in each of us right now, we would all be sitting here lactating.\" When a mother nurses, the dopamine brake comes off. All six anterior pituitary hormones (prolactin, TSH, LH, FSH, ACTH, GH) are <b>peptide or protein hormones</b>, so all need a rise in intracellular calcium to be released. By structure they fall into three classes: the <b>glycoproteins</b> TSH, LH and FSH; <b>GH and prolactin</b>, which are structurally similar; and <b>ACTH</b>, cut from a larger precursor.</p>\n<h4>POMC: one gene, several hormones</h4>\n<p>Most anterior pituitary hormones come from a larger precursor. ACTH is cut from <b>proopiomelanocortin (POMC)</b>, and the same processing releases <b>β-endorphin</b> (an endogenous opiate: stress brings cortisol and a natural painkiller together), β-lipotropin and <b>α-melanocyte-stimulating hormone (MSH)</b>. MSH stimulates melanocytes, which is why <b>excess ACTH secretion goes with hyperpigmentation</b> of skin and mucous membranes; that comes back in the adrenal lecture.</p>\n<h4>Releasing hormones come in pulses</h4>\n<p>Hypothalamic releasing hormones are <b>secreted in pulses</b>, act on specific membrane receptors (second messengers include Ca2+, cAMP and PKC), stimulate release of stored pituitary hormone by exocytosis, stimulate its synthesis, cause hyperplasia and hypertrophy of their target cells, can up- or down-regulate their own receptors, and modify their targets after translation (glycosylation, phosphorylation).</p>\n<p>Why pulses? When a ligand binds, the receptor is internalized and either degraded or recycled, so for a while it can't respond. Pulsatile release gives a <b>constant turnover of pituitary receptors</b>, decreases down-regulation and keeps the pituitary \"ready for action,\" because you never know when stress will hit. <b>Continuous</b> release of a hypothalamic hormone actually <b>suppresses</b> pituitary secretion. The pulses also set and reinforce <b>circadian rhythms</b>.</p>\n<h4>Circadian rhythms</h4>\n<p>Circadian rhythms are 24-hour cycles of physical, mental and behavioral change that respond mainly to light and dark; the sleep-wake cycle is the best known. The master clock is the <b>suprachiasmatic nucleus (SCN)</b> of the hypothalamus, about 20,000 neurons that receive direct input from the eyes. <b>Melatonin</b> from the pineal gland helps set the sleep-wake and light-dark cycle, which is why morning sunlight matters. Some hormones, such as growth hormone, are released most in the deepest stages of sleep, one reason to get 7 to 9 hours. Jet lag throws the pulsatility of all these hormones out of sync, and glucose metabolism is one of the first things dysregulated.</p>\n<h4>Primary, secondary and tertiary disorders</h4>\n<p>A <b>primary</b> endocrine disorder is at the peripheral gland (adrenal, thyroid...). A <b>secondary</b> disorder is at the <b>pituitary</b>. A <b>tertiary</b> disorder is at the <b>hypothalamus</b> and its releasing hormones. The hard part is reading lab values: tie them to negative feedback. Plot the target (peripheral) hormone against the pituitary hormone:</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Target hormone</th><th>Pituitary hormone</th><th>Problem</th></tr></thead><tbody>\n<tr><td>High</td><td>Low</td><td>Primary: the target gland secretes autonomously (feedback is working and suppressing the pituitary)</td></tr>\n<tr><td>Low</td><td>High</td><td>Primary: target gland failure (the pituitary is trying to drive it)</td></tr>\n<tr><td>High</td><td>High</td><td>Secondary: autonomous pituitary secretion (or resistance to the target hormone)</td></tr>\n<tr><td>Low</td><td>Low</td><td>Secondary: pituitary failure</td></tr>\n</tbody></table></div>\n<p>Example from lecture: very high cortisol with low ACTH is <b>primary</b>. The adrenal makes too much cortisol, and cortisol is correctly suppressing ACTH.</p>\n<h4>The posterior pituitary</h4>\n<p>The posterior pituitary (neurohypophysis) grows down from the floor of the diencephalon as the infundibulum. It is neural tissue: only the distal axons of large (<b>magnocellular</b>) neurons whose cell bodies sit in the paired <b>supraoptic</b> and <b>paraventricular</b> nuclei. Unlike the anterior pathway, these axons run <b>all the way down</b> (the hypothalamo-neurohypophyseal tract), and <b>oxytocin</b> and <b>vasopressin (ADH)</b> are cleaved from their prohormones along the way. Each hormone has its own neurons. Release follows neural stimuli (reflexes with neural input and hormonal output). So the posterior pituitary is <b>not a site of hormone synthesis, only secretion</b>. Dr. Galin: \"If I ask you on a test what hormones are synthesized by the posterior pituitary, what would be your answer? None.\"</p>\n", "growth": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Regulation of GH secretion: GHRH (Gs) vs somatostatin (Gi), pulses, sleep, ghrelin, feedback by IGF-1 and GH (\"really important as far as the exam is concerned\")</li><li>The big summary of what GH does in muscle, liver and fat; why it is diabetogenic</li><li>What GH does directly vs through IGF-1 (the somatomedin hypothesis); who does what at the growth plate</li><li>The other hormones of growth, fetus to adolescence; epiphyseal closure</li><li>GH deficiency, gigantism vs acromegaly, somatopause</li></ul></div>\n<p>The slides are Dr. Galin's; the recording for this lecture is Dr. Madison giving it. The two match closely, and where they differ the notes give both. The lecture's two pointers: know the <b>feedback loops</b> (\"really important as far as the exam is concerned\") and the <b>big summary slides</b> of what GH does in each tissue.</p>\n<h4>What is normal growth?</h4>\n<p>Growth means <b>hypertrophy</b> (an increase in cell size: a muscle cell making more sarcomere proteins) and <b>hyperplasia</b> (an increase in cell number: cells dividing). GH drives both. Growth matters <b>throughout life</b>, not only in the adolescent spurt: GH maintains tissues, muscle mass and organs. Too little growth hormone gives dwarfism; too much before the growth plates close gives gigantism.</p>\n<p>GH's big effects: it promotes <b>linear growth</b> (directly and indirectly), <b>reduces adiposity</b> (lipolysis), <b>enhances lean body mass</b> (muscle protein synthesis), and <b>stimulates the immune system</b> (it stimulates the thymus, where T cells mature, and supports T and B lymphocyte development). Two effects that tie into the pancreas lecture: GH increases <b>lipolysis</b> while stimulating <b>protein formation in muscle</b>.</p>\n<h4>The other hormones of growth</h4>\n<p>GH drives infant, juvenile and adolescent growth, but it has help:</p>\n<ul><li><b>Thyroid hormones</b> are needed for growth: deficiency causes forms of dwarfism (L4).</li><li><b>Sex steroids</b> (testosterone, estrogens) potentiate GH during puberty.</li><li><b>Insulin</b> drives growth <b>in utero</b>: a mother with diabetes and hyperinsulinemia tends to have a <b>higher-birth-weight baby</b>. After birth insulin keeps promoting muscle protein synthesis.</li></ul>\n<p><b>GH is not important for fetal growth.</b> Fetal growth depends on maternal and fetal hormones, and <b>insulin</b> is absolutely required for bone development and length in utero. GH's role in lengthening bone comes after birth, and it works largely through the IGFs.</p>\n<h4>Growth hormone</h4>\n<p>Growth hormone (somatotropin, hGH in humans; the name comes from the <b>somatotrophs</b> that make it) is a peptide hormone: a <b>191-amino-acid single-chain polypeptide</b> (22,124 daltons, the 22-kDa form) with <b>two disulfide bridges</b>, made, stored and secreted by somatotrophs in the lateral wings of the anterior pituitary. The cell transcribes five exons; <b>alternative splicing</b> makes a smaller <b>20-kDa</b> variant (176 amino acids) in a steady <b>1:9</b> ratio, so the 22-kDa form is by far the most abundant and a little more potent. Both are processed the same way: both mRNAs carry a signal sequence, so they are translated on the rough ER and enter the secretory pathway, going from the prepro- to the pro-hormone to the active hormone; the pro-sequence is cleaved and the disulfide bonds form in the Golgi. Mature GH waits in granules until <b>GHRH</b> tells the somatotroph to secrete it. GH is species-specific and structurally similar to prolactin and human chorionic somatomammotropin (hCS).</p>\n<h4>Pulses and sleep</h4>\n<p>Somatotrophs secrete GH in <b>pulses</b>. The largest and most predictable peak comes soon after the onset of sleep (the slides: about <b>an hour after</b>), and several big pulses follow through the night; most of the day's GH is released during sleep. The slide's graph marks 70%, and the slides' notes say nearly half comes in sleep stages 3 and 4, the deep stages; in the recording it is \"about 50%\" during the REM cycles. During the day, smaller surges come every 3 to 5 hours, set off by things like <b>fasting</b> and a <b>high-protein meal</b>.</p>\n<h4>How GH works</h4>\n<p>Being a polypeptide, GH can't cross the membrane. Its receptor has no kinase of its own: a partner tyrosine kinase, <b>JAK2</b> (Janus kinase), stays bound to it. When GH binds, the JAKs phosphorylate <b>STATs</b> (signal transducers and activators of transcription), which <b>dimerize</b>, enter the nucleus and act as transcription factors: the <b>JAK-STAT</b> pathway. The JAKs also start the <b>MAP kinase</b> pathways, which lead to protein synthesis and the opening of ion channels. (Compare insulin, whose receptor is itself a tyrosine kinase.) Height is stimulated two ways:</p>\n<ul><li><b>Directly</b>: through the <b>MAPK/ERK</b> pathway, GH stimulates division and multiplication of chondrocytes in cartilage.</li><li><b>Through IGF-1</b>: through the <b>JAK-STAT</b> pathway, GH stimulates production of <b>insulin-like growth factor 1</b> (IGF-1, formerly somatomedin C, a hormone homologous to proinsulin). The <b>liver</b> is the major target and the principal source of circulating IGF-1. IGF-1 stimulates osteoblasts and chondrocytes to promote bone growth.</li></ul>\n<h4>GH and fuel: lipolytic and diabetogenic</h4>\n<p>The summary slide to know: GH acts on the three main fuel tissues.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Tissue</th><th>What GH does</th><th>Result</th></tr></thead><tbody>\n<tr><td>Muscle</td><td>More amino acid uptake and protein (sarcomere) synthesis; less glucose uptake</td><td>Hypertrophy: more muscle mass; insulin resistance</td></tr>\n<tr><td>Liver</td><td>More protein and RNA synthesis, <b>gluconeogenesis</b>, and <b>IGF-1</b> (somatomedin) secretion</td><td>More glucose released; IGF-1 drives growth elsewhere</td></tr>\n<tr><td>Fat</td><td>Less glucose uptake; more <b>lipolysis</b></td><td>Less fat; insulin resistance</td></tr>\n</tbody></table></div>\n<p>More muscle and less fat together <b>enhance lean body mass</b>. Insulin may rise in response to the rising glucose. Because most of GH's metabolic actions oppose insulin's (less glucose uptake, lipolysis instead of lipogenesis, gluconeogenesis), GH is a <b>diabetogenic</b> hormone, and people who make too much GH are more likely to develop insulin resistance and diabetes.</p>\n<h4>The somatomedin hypothesis</h4>\n<p>Experiments showed that GH has <b>no growth-promoting action on epiphyseal cartilage</b> by itself in the dish. Serum from normal animals stimulated cartilage growth, but serum from hypophysectomized (GH-deficient) animals did not, and adding GH to that GH-deficient serum did not restore the activity. Treating GH-deficient animals with GH in vivo, though, did produce serum that promoted cartilage growth. Conclusion: GH must induce secretion of another circulating factor that mediates its actions. Those factors are the <b>somatomedins</b>, the insulin-like growth factors <b>IGF-1 and IGF-2</b>; IGF-1 is the one strongly regulated by GH.</p>\n<p>IGF-1 is <b>anabolic</b> and stimulates growth in a wide variety of tissues (tissues have to grow as bones grow): more DNA, RNA and protein, bigger cells and more of them, and larger organs. Besides the liver's IGF-1, more is made <b>within target tissues</b>, so it acts as both an endocrine and an autocrine/paracrine hormone. It is becoming clear that the IGFs drive much of what GH does in the periphery.</p>\n<p>Take home: the <b>direct</b> action of GH is to increase IGF-1 and to make quiescent precursors <b>commit</b> to a lineage (prechondrocytes, or adipocytes: differentiation); the <b>indirect</b> action, through IGF-1 (and to an extent IGF-2), is <b>clonal expansion</b>, the burst of proliferation of those precursors. Working together they give a terminally differentiated cell population. At the growth plate, T3 also helps.</p>\n<h4>Growth plates, puberty and IGF-1</h4>\n<p>The epiphyseal plate, from the epiphysis toward the shaft:</p>\n<ol><li><b>Reserve cartilage</b>: quiescent precursors. <b>GH</b> acts here, telling them to differentiate into chondrocytes.</li><li><b>Proliferation</b>: chondrocytes divide (hyperplasia), driven by <b>IGF-1</b>.</li><li><b>Hypertrophy</b>: the chondrocytes enlarge and make matrix.</li><li><b>Apoptosis</b>: the chondrocytes die.</li><li><b>Calcification and ossification</b>: their matrix calcifies, osteoblasts move in and lay down bone. This is what lengthens the bone.</li></ol>\n<p>Sex steroids push the pituitary to release more GH. <b>Estrogen</b> has a dual effect: it raises GH, but at the plate it is inhibitory and hastens <b>closure of the epiphyseal plates</b>, and so helps determine final adult height. In most children growth stops within a few years after puberty, when the growth-plate chondrocytes stop dividing and the cartilage calcifies. After puberty, bones can still grow in diameter (radial growth) by endosteal resorption and periosteal deposition.</p>\n<p>Plasma IGF-1 tracks growth: the fastest growth rates in puberty come when <b>IGF-1 is highest</b>, though the two diverge at younger and older ages, and IGF-1 matters little before birth (GH tells the same story if you sample it often enough, given its pulses). Even after linear growth ends, GH and IGF-1 keep regulating body composition and promote anabolism in muscle; some have proposed giving them to normal adults to reverse aging effects (muscle loss, negative nitrogen balance, osteoporosis).</p>\n<h4>Regulation: GHRH vs somatostatin</h4>\n<p>The hypothalamus is the major regulator. Small neurons in the <b>arcuate nucleus</b> secrete <b>GHRH</b> (a 43-amino-acid peptide) into the hypophyseal portal blood. GHRH binds a <b>Gαs</b>-coupled receptor on somatotrophs: adenylyl cyclase raises cAMP and activates protein kinase A, which increases GH gene transcription and synthesis. cAMP also lets sodium in, depolarizing the cell, which opens calcium channels; the rise in intracellular calcium fuses the vesicles with the membrane and releases preformed GH.</p>\n<p><b>Somatostatin</b> from the hypothalamus is the brake. It binds a <b>Gi</b>-coupled receptor: no rise in cAMP, potassium channels open, the cell <b>hyperpolarizes</b> so depolarization can't reach threshold, no calcium enters, and GH is not secreted. The slides call the pair the \"yin-yang\" control of GH.</p>\n<div class=\"rv-table-wrap\"><table class=\"rv-table\"><thead><tr><th>Raises GH</th><th>Lowers GH</th></tr></thead><tbody>\n<tr><td>GHRH (high during the pubertal growth spurt)</td><td>Somatostatin (itself stimulated by high glucose and high free fatty acids)</td></tr>\n<tr><td>Ghrelin (a GI hormone that also raises appetite)</td><td>IGF-1 and IGF-2 (long-loop negative feedback)</td></tr>\n<tr><td>Sleep, stress, serotonin and other neurotransmitters (the recording lists dopamine here too, though in acromegaly a dopamine agonist lowers GH); gonadal steroids at puberty</td><td>GH itself (short-loop feedback)</td></tr>\n</tbody></table></div>\n<p>The feedback is <b>hierarchical</b>: several levels, all negative. IGF-1 suppresses GH three ways: directly at the pituitary (through its own receptor tyrosine kinase, not Ca2+ or cAMP), and indirectly by suppressing <b>GHRH</b> release and increasing <b>somatostatin</b> secretion in the hypothalamus. GH also inhibits its own secretion in a short loop independent of IGF-1, partly by raising somatostatin. \"The big one is this somatostatin production.\" High glucose and free fatty acids raise somatostatin because GH itself raises them (gluconeogenesis, lipolysis): the feedback keeps GH's diabetogenic effects in check. Stress raises GH and cortisol, and both raise blood sugar.</p>\n<h4>Somatopause</h4>\n<p>GH falls with age, the <b>somatopause</b>: from about our 30s, mean pulse amplitude and duration decrease. The problem seems to be in the <b>hypothalamus (GHRH)</b>, because pituitary somatotrophs keep their capacity to secrete GH; they just don't get the signal. Consequences: decreased muscle mass, skin thickness and bone mineral content, increased fat mass, brittle bones (GH also stimulates osteoblasts), and often lower energy and quality of life. Is GH the next anti-aging drug?</p>\n<h4>Too little GH</h4>\n<p>Causes of growth deficiency: pituitary defects with low GH, a lack of somatotrophs, an inability to respond to GHRH, <b>GH receptor defects</b>, reduced IGF production or action, and decreased GHRH release from the hypothalamus. Alterations in IGF-1 can cause GH deficiency two ways: tissues fail to respond to IGF-1, or the liver fails to make it. A <b>GH receptor defect gives the same clinical picture</b> as GH deficiency even though GH itself is normal (the slide shows a 9-year-old girl, 2.5 feet tall, with a GH receptor defect). In children, GH deficiency means growth failure, short stature and delayed sexual maturity. Dogs get pituitary dwarfism too.</p>\n<h4>Too much GH: gigantism vs acromegaly</h4>\n<p>GH-secreting tumors are usually recognized in the fifth decade of life. When one occurs in childhood, <b>before the epiphyses close</b>, the result is <b>gigantism</b>, excessive, uncontrolled linear growth.</p>\n<p>After the plates close, GH excess causes <b>acromegaly</b>, most often from a benign, slow-growing <b>somatotroph adenoma</b>. Bones can't lengthen, so they thicken: <b>periosteal bone growth</b> gives a bony ridge above the eyes, a heavy <b>lower jaw</b>, and enlarged fingers, hands and toes. Cartilage and soft tissue increase (bulbous nose), organs enlarge (the IGFs), and patients are often diabetic (insulin resistance). Other problems: sweating, nerve compression (carpal tunnel), muscle weakness, and fertility problems: GH raises <b>sex hormone-binding globulin</b>, which binds up the sex hormones so little free hormone reaches its targets. Test with <b>serum IGF levels plus a glucose tolerance test</b>. Treatment is usually surgical removal; <b>octreotide</b> (a somatostatin agonist) and <b>bromocriptine</b> (a dopamine agonist) can block GH secretion, because somatostatin and dopamine inhibit GHRH-driven GH release.</p>\n", "thyroid": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The seven steps of thyroid hormone synthesis, in order, with the transporter or enzyme at each step (NIS, pendrin, thyroperoxidase, megalin, deiodinase): most of the lecture</li><li>Why thyroid hormone is the only hormone made <b>extracellularly</b></li><li>MIT, DIT, T3, T4 and reverse T3; 5'-deiodinase vs 5-deiodinase</li><li>Autoregulation by iodine (the Wolff-Chaikoff effect)</li><li>The hypothalamic-pituitary-thyroid axis: TRH (Gq) → TSH (Gs) → T3/T4, what TSH does to the gland, and the feedback loops</li><li>What thyroid hormone does to metabolism, heart, nervous system, cholesterol and growth</li><li>Primary hyper- vs hypothyroidism: labs, Graves vs Hashimoto, signs, goiter, and why children are tested</li></ul></div>\n<p>Dr. Galin: most of this lecture is <b>biosynthesis</b>, because \"thyroid hormone is the only endocrine hormone that's synthesized extracellularly.\" His key word for the exam: <b>metabolism</b>. \"If you see that word metabolism in any way, it's usually going to get to thyroid hormone\" (though catecholamines also raise heart rate and breathing).</p>\n<h4>The gland and the follicle</h4>\n<p>The adult thyroid weighs about <b>20 g</b>: two large lateral lobes on either side of the trachea connected by the isthmus. Its functional unit is the <b>follicle</b>: follicular cells lining the <b>colloid</b>, a gelatinous matrix (\"somewhere in between a gel and a suspension\") in which T3 and T4 are made: \"this is where the action is happening.\" Thyroid hormones are unique because they are <b>made extracellularly</b>, in the colloid. Parafollicular (C) cells, sitting beside the follicles, make calcitonin, which belongs to the calcium lecture (L10).</p>\n<p>Iodide is a scarce nutrient: unless you eat a lot of shellfish and similar foods, daily intake can run low, which is why <b>iodized salt</b> exists and is the one to buy.</p>\n<h4>The chemistry: MIT, DIT, T3, T4</h4>\n<p>Thyroid hormones are amines built from <b>tyrosine</b> residues (tyrosine is the precursor for all the amine hormones). Iodine goes on the benzene ring: the 3 and 5 positions of the inner ring and the 3' and 5' (prime) positions of the outer ring. One iodine makes <b>monoiodotyrosine (MIT)</b>; two make <b>diiodotyrosine (DIT)</b>. Thyroperoxidase couples them:</p>\n<ul><li><b>MIT + DIT = T3</b> (triiodothyronine)</li><li><b>DIT + DIT = T4</b> (thyroxine)</li></ul>\n<p>The gland releases mostly T4 (about 90%, with about 10% T3): the little T3 it makes has a very short half-life and is largely used by the gland itself. T4 is not the most active form. In the tissues, <b>5'-deiodinase</b> (outer ring) turns T4 into <b>active T3</b>, while <b>5-deiodinase</b> (inner ring) makes <b>reverse T3</b>, which is <b>inactive</b>: switching to 5-deiodinase is one way the body protects itself from making too much active hormone. Dr. Galin: \"The main thing is to remember the difference between 5 prime deiodinase and 5 deiodinase.\" In blood, thyroid hormone is bound to plasma proteins, mainly <b>thyroxine-binding globulin (TBG)</b>.</p>\n<h4>Biosynthesis in seven steps</h4>\n<p>\"Be prepared to follow the steps of hormone biosynthesis.\" The process runs partly inside the follicular cell and partly in the colloid; the apical membrane faces the colloid, the basolateral membrane faces the blood:</p>\n<ol><li><b>Iodide trapping.</b> The <b>sodium-iodide symporter (NIS)</b> on the basolateral membrane carries sodium and iodide in together: sodium runs down its gradient and drags iodide <b>against</b> its gradient (secondary active transport, ultimately ATP-dependent). The cell concentrates iodide well above plasma (20 to 50 times on the slides; \"tens to hundreds of times\" in the lecture), so most of the iodide we eat ends up in the thyroid.</li><li><b>Thyroglobulin synthesis.</b> At the same time the cell makes <b>thyroglobulin</b> (Tg), a very large protein with many tyrosines, and secretes it into the colloid through the secretory pathway. Its tyrosine residues are the substrate for hormone synthesis, and it stores the hormones and iodine in the follicle.</li><li><b>Iodide to iodine.</b> Iodide crosses the apical membrane through <b>pendrin</b> (an anion transporter found all over the body, but very important here); <b>thyroperoxidase</b> on the apical membrane oxidizes iodide (I−) to iodine (I0), which requires <b>H2O2</b>. A memory trick: it goes in alphabetical ord
