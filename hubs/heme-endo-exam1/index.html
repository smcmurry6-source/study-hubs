gy where a rise in intracellular calcium actually inhibits the secretory pathway.\" It has to work this way, because PTH raises blood calcium, and releasing it while calcium is already high would push it higher. \"That's a very important point, and I know it's the opposite of everything else, but that's life.\"</p>\n<p><b>Kidney</b>: PTH <b>promotes calcium reabsorption</b> (distal tubule) and <b>inhibits phosphate reabsorption</b> (so phosphate is excreted). This is the <b>one place calcium and phosphate go in different directions</b>, and the reason is <b>kidney stones</b>: calcium and phosphate meeting in the tubule would form salt crystals. PTH also turns on 1α-hydroxylase, which is how it raises calcium absorption in the gut.</p>\n<p><b>Bone</b>: to raise blood calcium, bone must be broken down, so you'd expect the PTH receptor on osteoclasts. \"It doesn't.\" The PTH receptor is on the <b>osteoblast</b>. Osteoclasts come from the <b>hematopoietic lineage</b>, like monocytes, macrophages and the granulocytes: immune cells. PTH binds the osteoblast, which makes <b>cytokines and growth factors</b> (RANK ligand among them) that act in a <b>paracrine</b> way on neighboring osteoclasts; the osteoclasts then break down bone and raise blood calcium. <b>Estrogen</b> normally keeps this in check by blocking PTH's ability to activate those factors.</p>\n<p><b>Net effect of PTH</b>: <b>calcium up, phosphate down</b>. In normal times you don't see much phosphate loss, because PTH is also turning on 1α-hydroxylase, and the vitamin D pulls in calcium and phosphate from the gut; the low phosphate shows when PTH is in excess.</p>\n<h4>Calcitonin</h4>\n<p>Calcitonin comes from the <b>C cells</b> (parafollicular cells, beside the thyroid follicles). It is one of the \"debatable\" hormones: we know what it does, but whether it matters for day-to-day calcium balance is argued, and it is <b>not essential</b>. Its effects are the <b>exact opposite of PTH's</b>. Its main site is <b>bone</b>, and its receptor is on the <b>osteoclast</b>: binding stops bone turnover (decreases resorption) and lowers plasma calcium. Its secretion rises with plasma calcium (gastrin also stimulates it). Because we know its actions, calcitonin is used as a drug for osteoporosis and other disorders of excess bone turnover.</p>\n<h4>Osteoporosis</h4>\n<p>Osteoporosis is the breaking down of bone: a major public threat for more than 44 million Americans, 80% of them women. One in 2 women and 1 in 8 men over 50 will have an osteoporosis-related fracture, at an estimated $38 million a day. It usually shows first as <b>dorsal kyphosis</b>: the spine's normal S-curve works like a shock absorber, and as weakened vertebrae collapse on one another the kyphotic curve grows. It is common in <b>postmenopausal women</b> because estrogen drops off a cliff at menopause (around 50), removing the brake on osteoblast stimulation of osteoclasts. It is less common in men because andropause (loss of testosterone, the precursor of estrogen) doesn't come until about 75 to 80.</p>\n<p><b>Glucocorticoids</b> release that brake too: they put osteoblasts \"in overdrive,\" continuously stimulating osteoclasts, so bone resorption increases. Anyone on long-term steroids (transplant patients for life, chronic inflammatory disease) needs their bone density watched.</p>\n<h4>Rickets and osteomalacia</h4>\n<p>Prolonged, extreme <b>vitamin D deficiency</b> softens and weakens bone. In a <b>growing child</b> it is <b>rickets</b>: the child can't absorb calcium and phosphate to lengthen bones, and the weight-bearing legs <b>bow</b> under the torso; other signs are delayed growth and motor skills, pain in the spine, pelvis and legs, muscle weakness, knock knees, thickened wrists and ankles and a projecting breastbone. Vitamin D was added to milk, yogurt and other dairy in the last century to prevent it. In <b>adults</b> it is <b>osteomalacia</b>: brittle, weak bones that fracture easily from a bump or a fall, usually from too little vitamin D (often too little sunlight), less often a digestive or kidney disorder. As with gigantism and acromegaly, the same deficiency looks different before and after the <b>epiphyseal plates close</b>.</p>\n<h4>Primary hyperparathyroidism</h4>\n<p>The <b>most common</b> disorder of calcium regulation. Primary means the problem is in the peripheral gland itself (hyperplasia or a benign tumor): <b>high PTH despite high calcium</b>, with <b>low phosphate</b> (PTH's kidney action, now unchecked). It is more common in women. High calcium brings lethargy and weakness (often what brings the patient in, \"because they can't shake themselves out of it\"), fatigue and <b>constipation</b> (the nervous system can't drive the gut), plus frequent urination, thirst, joint pain and loss of appetite. High PTH drives bone resorption: bone pain, easy fractures, vertebral compression and kyphosis. And with so much calcium to filter, the excess spills over and meets phosphate: <b>kidney stones</b>, again and again, which should make a physician check PTH.</p>\n<p>Treatment: <b>calcitonin</b>, which does the opposite of PTH and slows bone breakdown, and <b>bisphosphonates</b>, which bind hydroxyapatite so osteoclasts can't break the bone down.</p>\n"};

/* ---------- PLAIN ENGLISH READINGS: same facts as READINGS, everyday language. Keep these in sync with READINGS. ---------- */
var READINGS_PLAIN = {"histo1": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What makes a gland endocrine</li><li>Hormone types, where their receptors are, and the Gs / Gi / Gq table</li><li>Front vs back pituitary, and how blood carries signals to the front</li><li>The cell types of the front pituitary and what turns each one on and off</li><li>Herring bodies and pituicytes</li><li>Thyroid follicles and C cells; parathyroid chief cells and oxyphils</li></ul></div>\n<p>This is the microscope view of three glands: the pituitary first, then the thyroid and parathyroids.</p>\n<h4>What makes a gland endocrine</h4>\n<p>Endocrine glands release <b>hormones</b> into the blood, and the hormone only affects cells that have its receptor. How strongly a hormone grabs its receptor (its <b>affinity</b>) changes how big the response is.</p>\n<p>Every gland starts as epithelium growing down into tissue. Exocrine glands keep a duct. Endocrine glands <b>lose the duct</b> and grow a dense bed of leaky (fenestrated) capillaries instead, so their hormones go straight into the blood. Their cells are packed with <b>endoplasmic reticulum</b> for making hormones.</p>\n<h4>Hormones and receptors</h4>\n<p>Three kinds of hormone: <b>proteins and polypeptides</b>, <b>amino acid derivatives</b> (both mostly dissolve in water) and <b>steroids</b> (dissolve in fat). Water-soluble hormones can't get into the cell, so they bind a receptor on the surface and use a <b>second messenger</b> inside: fast. Steroids slip through the membrane, bind a receptor inside, go to the nucleus and change which proteins get made: slow, hours to days.</p>\n<p>Surface receptors come in three kinds: <b>ion channels</b> that open, <b>G-protein-linked</b> receptors, and <b>enzyme-linked</b> receptors such as <b>tyrosine kinases</b>. Memorize the G proteins: <b>Gs</b> turns adenylate cyclase on (more cAMP), <b>Gi</b> turns it off (less cAMP), and <b>Gq</b> turns on phospholipase C, which makes <b>IP3</b>, which releases calcium from the endoplasmic reticulum.</p>\n<p>Almost all hormone systems shut themselves off with <b>negative feedback</b>. Cells can also turn a signal off by pulling the receptor inside (and either recycling it or destroying it in a lysosome, called <b>downregulation</b>), by blocking the receptor or its partner protein from the inside, or by making a blocking protein.</p>\n<h4>The pituitary</h4>\n<p>The pituitary (also called the <b>hypophysis</b>) is the <b>master gland</b>: its hormones run the adrenals, thyroid, gonads, kidneys, breasts and growth. The hypothalamus above it controls it. It hangs from the brain on a stalk, behind the optic chiasm, in a pocket of the sphenoid bone called the sella turcica.</p>\n<p>It is really two glands. The <b>front (anterior) lobe, the adenohypophysis</b>, is true gland tissue, grew up from the roof of the mouth, stains <b>darker</b>, and has three parts: pars distalis, pars tuberalis and pars intermedia. It makes FSH, LH, ACTH, TSH, prolactin and GH (remember \"FLAT PiG\"). The <b>back (posterior) lobe, the neurohypophysis</b>, is nerve tissue that grew down from the hypothalamus, stains <b>lighter</b>, and has two parts: the pars nervosa and the infundibulum (the stalk). It releases only ADH and oxytocin.</p>\n<h4>How signals reach the front lobe</h4>\n<p>Branches of the internal carotid (the superior and inferior hypophysial arteries) make two capillary beds connected by small veins: the <b>hypothalamo-hypophysial portal system</b>. The hypothalamus drops \"release\" or \"stop\" hormones into the first bed, and the blood carries them straight to the front lobe's cells. The back lobe needs no such step: hypothalamic nerve endings release ADH and oxytocin right into its capillaries.</p>\n<h4>Cells of the front lobe</h4>\n<p>By how they stain: <b>acidophils</b> hold polypeptide hormones (<b>somatotrophs</b> and <b>lactotrophs</b>, \"S and L\"); <b>basophils</b> hold glycoprotein hormones (<b>thyrotrophs, gonadotrophs, corticotrophs</b>, \"T, G and C\"); <b>chromophobes</b> hold little or no hormone (stem cells and cells that have emptied their granules).</p>\n<ul><li><b>Somatotrophs</b> make growth hormone. On: GHRH. Off: somatostatin. GH makes the liver release IGF-1 for bone and muscle growth.</li><li><b>Lactotrophs</b> make prolactin. On: PRH and oxytocin. Off: dopamine and PIF. More of them after childbirth, fewer after nursing stops.</li><li><b>Thyrotrophs</b> make TSH. On: TRH. Off: T3 and T4.</li><li><b>Gonadotrophs</b> make FSH and LH. On: GnRH. Off: progesterone and estradiol.</li><li><b>Corticotrophs</b> make the ACTH precursor. On: CRH. Off: high cortisol.</li></ul>\n<h4>The back lobe</h4>\n<p>The back lobe doesn't make hormones; it <b>stores</b> them. Nerve cells in the <b>supraoptic</b> and <b>paraventricular</b> nuclei of the hypothalamus make ADH (vasopressin) and oxytocin and send them down their axons. Bulges along those axons full of hormone granules are called <b>Herring bodies</b>. Support cells called <b>pituicytes</b> act like gatekeepers: they pull back from the capillaries when it is time to release the hormones.</p>\n<h4>Thyroid</h4>\n<p>The thyroid sits below the cricoid cartilage, two lobes joined by an <b>isthmus</b> over the second tracheal ring. Inside are round <b>follicles</b> lined by one layer of cube-shaped cells and filled with <b>colloid</b>, which is stored <b>thyroglobulin</b>, the inactive storage form of T3 and T4. Between follicles, <b>C cells</b> (parafollicular cells) make <b>calcitonin</b>; they don't touch the colloid. Thyroid hormone raises metabolism and body heat and is needed for normal heart, brain and growth.</p>\n<h4>Parathyroids</h4>\n<p>Usually four tiny glands on the back of the thyroid. <b>Chief cells</b> do the work: they sense blood calcium and release <b>PTH</b> when it is low. <b>Oxyphils</b> are bigger and don't secrete. With age, fat fills much of the gland. You can live without your thyroid but <b>not without parathyroids</b>, so surgeons can transplant them under the skin, where they keep working. PTH raises blood calcium: it releases calcium from bone, increases absorption from food, makes the kidneys keep calcium, and activates vitamin D.</p>\n", "hypopit": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Endocrine, paracrine, autocrine, neuroendocrine</li><li>Protein, amine and steroid hormones</li><li>Gs, Gq, Gi and calcium; insulin's receptor vs growth hormone's</li><li>Negative feedback and the one positive feedback</li><li>Front vs back pituitary and the hypothalamic \"release\" hormones</li><li>Telling primary from secondary disease using lab values</li></ul></div>\n<p>Dr. Galin called this the foundation for every other endocrine lecture, so learn it well.</p>\n<h4>Ways hormones travel</h4>\n<p><b>Endocrine</b>: made in one place, carried by the blood to a far-away target. <b>Paracrine</b>: acts on the cell next door. <b>Autocrine</b>: acts back on the cell that made it. <b>Neuroendocrine</b>: made by the brain and sent through the blood, like the hypothalamus's \"release\" hormones. The hypothalamus is part of the brain; the pituitary is not.</p>\n<h4>Three kinds of hormone</h4>\n<ul><li><b>Proteins and peptides</b> (GH, ACTH, insulin) start as a big precursor, are stored in little sacs (vesicles), and are released when calcium inside the cell rises. Their receptors are on the cell surface.</li><li><b>Amines</b> come from the amino acid tyrosine: adrenaline-type hormones and thyroid hormone. They are made as needed, not stored for long.</li><li><b>Steroids</b> come from cholesterol: cortisol, aldosterone, estrogen, testosterone. They are not stored; they leak out of the cell as soon as they are made, ride in the blood on carrier proteins, and work on receptors inside the cell that switch genes on or off.</li></ul>\n<h4>Receptors and calcium</h4>\n<p>For peptide hormones, calcium inside the cell is the \"go\" signal. <b>Gs</b> raises cAMP and lets calcium flow <b>in from outside</b>. <b>Gq</b> uses IP3 to release calcium <b>stored inside</b> the cell. Both lead to secretion. <b>Gi</b> blocks both, so nothing is released.</p>\n<p>The <b>insulin receptor</b> has its own built-in tyrosine kinase. The <b>growth hormone receptor</b> borrows a partner kinase called JAK (the JAK-STAT pathway).</p>\n<p>All steroids need cholesterol, carried in the blood as LDL. With zero cholesterol you couldn't make cortisol, aldosterone, estrogen or testosterone.</p>\n<h4>Negative feedback</h4>\n<p>Hormones shut off their own production once they've done their job; too much of a hormone causes harm. Two styles: <b>axis feedback</b> (hypothalamus → pituitary → gland, and the gland's hormone turns the top two off) and <b>response feedback</b> with no brain involved (low blood sugar turns on glucagon; when sugar rises, glucagon turns off). A <b>short loop</b> is pituitary hormone back to the hypothalamus; a <b>long loop</b> is a gland's hormone back to the pituitary and hypothalamus. The one positive feedback: estrogen right before ovulation boosts itself and triggers the <b>LH surge</b>.</p>\n<h4>The front pituitary</h4>\n<p>It grows up from the roof of the embryo's mouth (<b>Rathke's pouch</b>) and is real gland tissue. Hypothalamic nerve endings stop partway down the stalk (the <b>median eminence</b>) and drop their hormones into a tiny private blood circuit, the <b>portal system</b>, which carries them to the front pituitary.</p>\n<ul><li>CRH → ACTH. TRH → TSH. GnRH → FSH and LH. GHRH → GH. PRF → prolactin.</li><li>Stop signals: <b>dopamine</b> keeps prolactin switched off almost all the time (otherwise we'd all be making milk); <b>somatostatin</b> turns off GH (and TSH).</li></ul>\n<p>ACTH is cut out of a bigger protein called <b>POMC</b>. The same cutting also makes β-endorphin (a natural painkiller) and <b>MSH</b>, which darkens skin, so lots of ACTH means darker skin and gums.</p>\n<h4>Pulses and body clocks</h4>\n<p>The hypothalamus releases its hormones in <b>pulses</b>, not a steady stream. That gives the pituitary's receptors time to recover, so it stays ready to respond; a constant stream would actually shut the pituitary down. Pulses also keep your <b>circadian rhythm</b>. The body's master clock is the <b>suprachiasmatic nucleus</b> in the hypothalamus, which gets input from the eyes; melatonin from the pineal gland helps set sleep. Some hormones like GH peak during deep sleep, and jet lag scrambles everything, especially blood sugar control.</p>\n<h4>Primary vs secondary disease</h4>\n<p><b>Primary</b> = the problem is in the gland itself. <b>Secondary</b> = the problem is in the pituitary. <b>Tertiary</b> = the hypothalamus. Use feedback to decide: if the gland's hormone is high and the pituitary's is low, the gland is overactive on its own (primary). If the gland's hormone is low and the pituitary's is high, the gland has failed (primary). If both move together, the pituitary is the problem (secondary). Example: high cortisol with low ACTH is primary.</p>\n<h4>The back pituitary</h4>\n<p>It is nerve tissue: the ends of long axons from big nerve cells in the <b>supraoptic</b> and <b>paraventricular</b> nuclei. Those cells make <b>oxytocin</b> and <b>ADH (vasopressin)</b>, and the axons carry them all the way down to be released into the blood. So the back pituitary <b>makes no hormones at all</b>; it only releases them.</p>\n", "growth": "\n<div class=\"tested\"><b>What's tested</b><ul><li>What turns GH on and off, and its feedback loops</li><li>What GH does to muscle, liver and fat</li><li>What GH does itself vs through IGF-1</li><li>Growth plates and puberty</li><li>Too little GH, gigantism vs acromegaly, and GH falling with age</li></ul></div>\n<p>The recording says to know two things best: the feedback loops, and the summary of what GH does in each tissue.</p>\n<h4>Growth basics</h4>\n<p>Tissues grow by making cells bigger (<b>hypertrophy</b>) or making more cells (<b>hyperplasia</b>). Growth hormone (GH) makes bones longer, cuts body fat, builds muscle and helps the immune system (it supports the thymus, where T cells mature). It matters all through life, not just in the teenage growth spurt.</p>\n<p>Other hormones help: thyroid hormone (without it, children stay short), sex hormones at puberty, and <b>insulin</b>. A baby in the womb doesn't need GH to grow; it needs insulin, which is why mothers with diabetes often have bigger babies. GH starts to matter after birth.</p>\n<h4>The hormone itself</h4>\n<p>GH is a protein of <b>191 amino acids</b> (about 22 kDa) made and stored in the pituitary's <b>somatotrophs</b>. A smaller version also exists, but the 22 kDa form is about 9 times more common. GH looks a lot like prolactin. It sits in granules until GHRH tells the cell to release it.</p>\n<p>GH comes out in <b>bursts</b>. The biggest burst comes soon after you fall asleep, and most of the day's GH comes out during sleep. Smaller bursts happen during the day, for example when you fast or eat a high-protein meal.</p>\n<h4>How GH makes you taller</h4>\n<p>GH's receptor borrows a partner enzyme, JAK2, which switches on proteins called STATs that go to the nucleus and turn genes on (the JAK-STAT pathway). GH works two ways. It acts <b>directly</b>, waking up resting cells in the growth plate and making them become cartilage cells. And it tells the <b>liver</b> to make <b>IGF-1</b> (insulin-like growth factor 1), which makes those cartilage cells multiply. IGF-1 is also made locally in tissues.</p>\n<p>How we learned this: GH dripped on cartilage in a dish did nothing, but blood from a normal animal made cartilage grow, and blood from an animal with no pituitary didn't, even with GH added. So GH must make the body produce something else in the blood: the <b>somatomedins</b>, now called IGFs.</p>\n<h4>GH in muscle, liver and fat</h4>\n<p>In <b>muscle</b>, GH pulls in amino acids and builds protein, so muscles grow. In the <b>liver</b>, it makes protein, glucose and IGF-1. In <b>fat</b>, it breaks fat down. In muscle and fat it also makes cells take up less sugar. Since that is mostly the opposite of insulin, GH tends to raise blood sugar: it is <b>diabetogenic</b>, and people with too much GH often get diabetes.</p>\n<h4>Growth plates</h4>\n<p>In the growth plate, resting cells (switched on by GH) start dividing (driven by IGF-1), swell, die, and their leftover matrix turns into bone. That's how a bone gets longer. Sex hormones, especially <b>estrogen</b>, close the growth plates, which sets adult height. Growth stops a few years after puberty. Bones can still get wider. Growth is fastest at puberty, when IGF-1 is highest.</p>\n<h4>What turns GH on and off</h4>\n<p><b>GHRH</b> from the hypothalamus turns GH on through a Gs receptor (cAMP rises, the cell fires, calcium comes in, GH is released). <b>Somatostatin</b> turns it off through a Gi receptor (no cAMP, potassium leaves, the cell goes quiet). Sleep, stress, <b>ghrelin</b> and puberty raise GH. High sugar and fat raise somatostatin, which lowers GH. <b>IGF-1</b> and GH itself also turn GH down, mostly by making the hypothalamus release more somatostatin: feedback at more than one level.</p>\n<h4>GH and age</h4>\n<p>GH falls as we age, starting around our 30s (<b>somatopause</b>), because the hypothalamus sends weaker GHRH bursts; the pituitary could still make GH. Result: less muscle, thinner skin and bones, more fat.</p>\n<h4>Too little or too much</h4>\n<p>Too little GH, or a <b>broken GH receptor</b> (GH is normal but nothing responds), causes short stature and delayed puberty in children.</p>\n<p>Too much GH from a pituitary tumor: before the growth plates close it causes <b>gigantism</b> (very tall). After they close it causes <b>acromegaly</b>: bones get thicker instead of longer, with a big brow ridge, a large <b>lower jaw</b>, big hands and feet, a broad nose, big organs, sweating, carpal tunnel, fertility problems and often diabetes. Test it with IGF-1 levels and a glucose tolerance test. Treat with surgery, or with <b>octreotide</b> (acts like somatostatin) or <b>bromocriptine</b> (acts like dopamine).</p>\n", "thyroid": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The seven steps of making thyroid hormone, in order (most of the lecture)</li><li>MIT, DIT, T3, T4 and reverse T3</li><li>How too much iodine shuts the gland down for a while</li><li>TRH → TSH → T3 and T4, and feedback</li><li>What thyroid hormone does</li><li>Too much (Graves) vs too little (Hashimoto's), and why children are tested</li></ul></div>\n<p>Dr. Galin's exam tip: if a question talks about <b>metabolism</b>, think thyroid hormone.</p>\n<h4>The gland</h4>\n<p>The thyroid weighs about 20 grams: two lobes joined by a bridge (the isthmus). Its working units are <b>follicles</b>: balls of cells around a gel called <b>colloid</b>. Thyroid hormone is the only hormone assembled outside the cells, in that colloid. We need iodine to make it, and it's scarce in most diets, which is why salt is iodized.</p>\n<h4>The building blocks</h4>\n<p>Thyroid hormone is made from the amino acid <b>tyrosine</b> plus iodine. Tyrosine with one iodine is <b>MIT</b>; with two, <b>DIT</b>. Join MIT and DIT and you get <b>T3</b>. Join two DITs and you get <b>T4</b>. The gland releases mostly T4. Body tissues pull one iodine off the outer ring (with <b>5'-deiodinase</b>) to make <b>T3, the active form</b>. Pulling it off the inner ring (<b>5-deiodinase</b>) makes <b>reverse T3, which does nothing</b>; that's how the body avoids making too much. In the blood, thyroid hormone rides on a carrier called <b>TBG</b>.</p>\n<h4>Seven steps</h4>\n<ol><li><b>Trap iodide</b>: the <b>sodium-iodide symporter (NIS)</b> pulls iodide into the cell along with sodium, piling it up far above blood levels.</li><li><b>Make thyroglobulin</b>, the big protein whose tyrosines become hormone, and push it into the colloid.</li><li><b>Move and activate iodine</b>: iodide crosses into the colloid through <b>pendrin</b>, and <b>thyroperoxidase</b> turns it into iodine (it needs hydrogen peroxide). Iodide comes before iodine, like the alphabet.</li><li><b>Attach and join</b>: thyroperoxidase sticks iodine onto thyroglobulin's tyrosines (<b>organification</b>), then joins MIT and DIT into T3 and T4.</li><li><b>Bring it back in</b>: the cell swallows colloid using a receptor called <b>megalin</b>.</li><li><b>Cut it free</b>: lysosomes chop up thyroglobulin, freeing T4 (about 90%) and T3 (about 10%).</li><li><b>Release and recycle</b>: T3 and T4 leave the cell; leftover MIT and DIT have their iodine removed and reused.</li></ol>\n<h4>Iodine controls itself</h4>\n<p>Without any help from TSH, the gland adjusts to iodine. Low iodine: it traps more. A huge dose of iodine: it <b>stops making hormone</b> for a while (the <b>Wolff-Chaikoff effect</b>), then escapes by taking in less iodide. Doctors once used this to treat an overactive thyroid.</p>\n<h4>The control chain</h4>\n<p>The hypothalamus releases <b>TRH</b>, which works on the pituitary through a <b>Gq</b> receptor and makes it release <b>TSH</b>. TSH works on the thyroid through a <b>Gs</b> receptor (cAMP, PKA). TSH makes the gland <b>grow</b> and turns up every step of hormone making: more NIS, thyroglobulin, pendrin, thyroperoxidase, megalin and deiodinase, plus the hydrogen peroxide thyroperoxidase needs. T3 and T4 then shut off TSH and TRH (<b>T3 is the main brake</b>). T4 also makes the hypothalamus release somatostatin, which lowers TSH; dopamine lowers it too.</p>\n<p>Cold weather and eating raise thyroid hormone; hot weather and fasting lower it. Very long, severe cold eventually lowers it too, to save energy.</p>\n<h4>What thyroid hormone does</h4>\n<p>Over 99% of it rides on proteins; the free part enters cells and works on a receptor <b>in the nucleus</b>. It raises metabolism and body heat (by making more sodium-potassium pumps), makes the heart faster and stronger (more beta-1 receptors, and a stronger kind of heart muscle protein), boosts sugar and fat use, keeps cholesterol down (it maintains the LDL receptors), is <b>essential for brain development</b> in babies, keeps adults alert, works with growth hormone to grow bones, and teams up with the sympathetic nervous system by adding beta receptors almost everywhere.</p>\n<h4>Too much: hyperthyroidism</h4>\n<p>Labs: T4 and T3 high, TSH low. Most often <b>Graves disease</b>: antibodies switch on the TSH receptor. Signs: <b>weight loss even while eating more</b>, feeling hot and sweaty, fast heart, shaking, nervousness, a staring look, a big thyroid (<b>goiter</b>) and bulging eyes (<b>exophthalmos</b>, because the antibodies also inflame the tissue behind the eyes). Treatment: surgery plus replacement, or drugs like propylthiouracil (blocks thyroperoxidase). A rare emergency is <b>thyroid storm</b>: fever and confusion, often after surgery, infection, radioiodine or stopping antithyroid drugs.</p>\n<h4>Too little: hypothyroidism</h4>\n<p>Labs: T4 and T3 low, TSH high. Most often <b>Hashimoto's disease</b>, an autoimmune attack on the gland; severe iodine shortage is another cause. Signs: <b>high cholesterol</b> (high cholesterol that a statin won't fix is a clue), feeling cold, tiredness, slow thinking, slow heart, droopy eyelids and puffy skin (<b>myxedema</b>). In babies and children, too little thyroid hormone stunts growth and brain development (<b>congenital hypothyroidism</b>, once called cretinism), with a big tongue and delayed growth. Replacing the hormone fixes it, sometimes dramatically, if it's caught in time, which is why children's thyroid levels are checked.</p>\n<p>Why a goiter in both? High TSH (or, in Graves, the antibodies) keeps telling the gland to grow.</p>\n", "pancreas": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Which islet cell makes which hormone</li><li>How insulin is made and why C-peptide is measured</li><li>The steps that release insulin when sugar rises</li><li>What insulin does in liver, muscle and fat</li><li>What glucagon and somatostatin do</li><li>Type 1 vs type 2 diabetes and the type 2 drugs</li></ul></div>\n<p>Unlike most glands, the pancreas isn't run by the pituitary. It watches what you eat (sugar, fat and protein) and responds.</p>\n<h4>The two jobs</h4>\n<p>Most of the pancreas makes digestive juices (the exocrine part). Scattered through it are about a million tiny <b>islets of Langerhans</b>, the hormone part, packed with blood vessels and nerves.</p>\n<ul><li><b>Beta cells</b> (about 70%, the most): <b>insulin</b> (plus amylin).</li><li><b>Alpha cells</b> (about 20%): <b>glucagon</b>.</li><li><b>Delta cells</b> (under 10%): <b>somatostatin</b>.</li><li><b>Gamma or PP cells</b> (under 5%): pancreatic polypeptide.</li><li><b>Epsilon cells</b> (under 1%): <b>ghrelin</b>, the hunger hormone.</li></ul>\n<h4>Making insulin</h4>\n<p>Insulin is the body's \"store it\" hormone. It starts as <b>preproinsulin</b>, gets trimmed to <b>proinsulin</b>, and then a middle piece, the <b>C-peptide</b>, is cut out, leaving active insulin. C-peptide is released one-for-one with insulin and lasts longer in the blood (the liver clears a lot of insulin right away), so doctors measure C-peptide to see how much insulin a person is really making.</p>\n<h4>How sugar releases insulin</h4>\n<p>Sugar enters the beta cell through <b>GLUT2</b>, gets burned for energy, and the extra <b>ATP closes potassium channels</b>. That changes the cell's charge (<b>depolarization</b>), which opens <b>calcium channels</b>; calcium rushing in pushes out the insulin. Amino acids, fats, glucagon, gut hormones (GLP-1, GIP) and the \"rest and digest\" nerves add to it. <b>Somatostatin</b> and the \"fight or flight\" signal (norepinephrine on alpha receptors) block it. <b>Sulfonylurea</b> drugs close the same potassium channels to force insulin out.</p>\n<h4>What insulin does</h4>\n<p>Insulin binds a receptor with a built-in <b>tyrosine kinase</b>. Within seconds, muscle and fat cells move <b>GLUT4</b> sugar doors to their surface.</p>\n<ul><li><b>Liver</b>: store sugar as glycogen, burn sugar, make fat; stop making new sugar and stop breaking down glycogen.</li><li><b>Fat</b>: take in sugar and fat and store it; stop breaking fat down.</li><li><b>Muscle</b>: take in sugar, store glycogen, burn sugar, and <b>build protein</b>.</li></ul>\n<h4>Glucagon</h4>\n<p>Glucagon is the \"use your savings\" hormone for fasting. It lasts only a few minutes, works through a <b>Gs</b> receptor and mostly acts on the <b>liver</b>: break down glycogen, make new sugar from amino acids and lactate, and send fat into the mitochondria to burn, which makes <b>ketones</b> (it does this by shutting off acetyl-CoA carboxylase). Low sugar, adrenaline, protein meals and acetylcholine raise glucagon; high sugar, somatostatin, fatty acids and ketones lower it. Glucagon actually <b>boosts insulin</b> too.</p>\n<h4>Somatostatin</h4>\n<p>Somatostatin from delta cells is the local brake on <b>both insulin and glucagon</b>, keeping them from overshooting. It also slows the gut so food is absorbed over a longer time.</p>\n<h4>Diabetes</h4>\n<p><b>Type 1</b>: the immune system destroys beta cells, so there's no insulin; usually starts young; needs insulin. <b>Type 2</b>: the body stops responding well to insulin (often with obesity); usually older; beta cells overwork and eventually wear out.</p>\n<p>High sugar spills into the urine (<b>glucosuria</b>), pulling water with it, so you pee a lot (<b>polyuria</b>), get thirsty (<b>polydipsia</b>) and stay hungry (<b>polyphagia</b>). Over time sugar damages small blood vessels: eyes (the top cause of blindness in working-age adults), kidneys, nerves (numb feet, ulcers, amputations), heart and brain.</p>\n<p>Type 2 drugs: <b>metformin</b> (liver makes less sugar), <b>thiazolidinediones</b> (cells respond better to insulin), <b>sulfonylureas</b> (more insulin released), <b>SGLT2 inhibitors</b> (kidneys dump sugar), <b>GLP-1 drugs</b> like Ozempic and Mounjaro (act like gut hormones that boost insulin) and <b>DPP-4 inhibitors</b> (keep those gut hormones around longer).</p>\n", "adrenal": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The layers of the adrenal and what each makes</li><li>What turns on aldosterone and what it does</li><li>How cortisol is controlled and what it does</li><li>Why the inner medulla makes mostly epinephrine</li><li>Too little or too much aldosterone; Addison's, Cushing's and 21-hydroxylase deficiency</li></ul></div>\n<p>The adrenals are the stress glands. Like the thyroid, most of their output is run by the hypothalamus and pituitary.</p>\n<h4>Layout</h4>\n<p>Each adrenal sits on top of a kidney like a hat. It is small but has a huge blood supply. The outer <b>cortex</b> makes <b>steroids</b>; the inner <b>medulla</b> makes <b>adrenaline</b> (epinephrine) and noradrenaline. Blood flows from the outside in, so hormones made in the cortex wash over the medulla.</p>\n<ul><li>Outer layer, <b>zona glomerulosa</b>: <b>aldosterone</b> (salt and water).</li><li>Middle, <b>zona fasciculata</b>: <b>cortisol</b> (stress and sugar).</li><li>Inner cortex, <b>zona reticularis</b>: weak male hormones (<b>DHEA</b>).</li><li><b>Medulla</b>: mostly <b>epinephrine</b>.</li></ul>\n<h4>Making steroids</h4>\n<p>Every steroid starts from <b>cholesterol</b>, mostly taken from LDL in the blood. The first step, cholesterol to pregnenolone, uses <b>cholesterol desmolase</b>, and ACTH speeds it up. Each layer has different enzymes, so each makes different hormones.</p>\n<h4>Aldosterone</h4>\n<p>Only the outer layer has <b>aldosterone synthase</b>, so only it makes aldosterone. Two main triggers: <b>low blood pressure</b> (through renin → angiotensin I → angiotensin II, which works on a Gq receptor) and <b>high potassium</b> (which directly excites the cells). ACTH helps only a little. Aldosterone tells the kidney to <b>keep sodium</b> (and water follows, raising blood pressure) and <b>get rid of potassium</b> and acid. It does this by making more sodium channels (ENaC), more sodium-potassium pumps and more potassium channels. The kidney turns cortisol into inactive cortisone so cortisol can't act like aldosterone there.</p>\n<h4>Cortisol</h4>\n<p>Low blood sugar, stress and the body clock make the hypothalamus release <b>CRH</b>, the pituitary release <b>ACTH</b>, and the adrenal make <b>cortisol</b>. Cortisol then shuts off ACTH and CRH. Cortisol is highest early in the morning, around waking.</p>\n<p>Cortisol keeps blood sugar up for the brain: the liver makes new sugar, muscle and fat take in less sugar, muscle breaks down protein and limb fat breaks down to feed that new sugar. It also <b>suppresses the immune system</b> (fewer prostaglandins, weaker T and B cells, less histamine, leakier vessels close up), which is why steroid drugs calm inflammation.</p>\n<h4>The medulla</h4>\n<p>The medulla is like a sympathetic nerve relay station. Nerves release acetylcholine onto <b>chromaffin cells</b>, which release about <b>80% epinephrine</b>. They can do that because they have an enzyme, <b>PNMT</b>, that turns norepinephrine into epinephrine, and <b>cortisol</b> flowing in from the cortex switches PNMT on. ACTH and the nerves also speed up the earlier steps.</p>\n<h4>When things go wrong</h4>\n<p><b>Too little aldosterone</b>: low sodium, sodium lost in urine, dehydration, low blood pressure on standing, salt craving. <b>Too much aldosterone</b>: sodium kept, high blood pressure, low potassium.</p>\n<p><b>Addison's disease</b>: the immune system destroys the cortex. No cortisol, so blood sugar runs low, and no feedback, so <b>ACTH runs high</b>. ACTH comes packaged with <b>MSH</b>, which darkens skin, so patients get <b>dark patches, including on the gums</b>, often before anything else.</p>\n<p><b>Cushing's</b>: too much cortisol for too long, from a pituitary tumor making ACTH (<b>Cushing's disease</b>), an adrenal tumor, or long-term steroid pills. Signs: belly fat, a round <b>moon face</b>, a <b>buffalo hump</b>, thin bones, high blood pressure, high sugar and mood changes.</p>\n<p><b>21-hydroxylase deficiency</b> (congenital adrenal hyperplasia): the adrenal can't make cortisol or aldosterone well, so ACTH climbs, the gland enlarges, salt is lost, potassium rises, and extra male hormones are made.</p>\n", "steroids": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Which steroid to pick, and why</li><li>How steroids work inside the cell</li><li>Why you taper them</li><li>The common side effects</li><li>Fludrocortisone, the cortisol blockers, and spironolactone vs eplerenone</li></ul></div>\n<p>Steroid drugs (like prednisone and the Medrol Dosepak) are some of the drugs dentists prescribe most, mainly to calm swelling after surgery. Know which one to pick, how they work, and their side effects, because side effects are what get tested.</p>\n<h4>The natural hormones</h4>\n<p>The adrenal cortex makes <b>cortisol</b> (the glucocorticoid; as a drug it is called <b>hydrocortisone</b>), <b>aldosterone</b> (the mineralocorticoid, which holds onto salt and water) and <b>DHEA</b> (a building block for sex hormones). The pituitary's ACTH drives it, and cortisol shuts ACTH back off.</p>\n<h4>How they work</h4>\n<p>Steroids travel in the blood stuck to a carrier called <b>CBG</b>. They slip into the cell, bind a receptor in the cytoplasm (knocking off a protein called hsp90), move into the <b>nucleus</b> and change which genes are made. Only the free (unbound) part works, normally about 5%. A big dose fills up CBG, so the free part suddenly jumps; dose carefully.</p>\n<p>What they do: raise blood sugar, move fat around, break down muscle, thin skin and bones, slow growth in kids, and above all <b>calm inflammation</b>. They are the original anti-inflammatories; that's why ibuprofen-type drugs are called \"non-steroidal.\"</p>\n<h4>Why you taper</h4>\n<p>A steroid pill tells the brain \"we have plenty,\" so the pituitary stops sending ACTH and the adrenal goes to sleep. Stop suddenly and the adrenal can't restart in time: <b>adrenal insufficiency</b>. So dose packs step down: 6, 5, 4, 3, 2, 1 tablets (the Medrol Dosepak, methylprednisolone). Take them in the <b>morning</b> or they keep you awake.</p>\n<h4>Uses</h4>\n<p>Inflammation (surgery, eye inflammation, pneumonia alongside antibiotics), replacing missing hormones (Addison's needs daily cortisol and a salt-keeping steroid), quieting an overactive adrenal, preventing transplant rejection, allergies, and asthma (inhaled steroids are now the backbone of asthma treatment).</p>\n<h4>Side effects</h4>\n<p>Sleeplessness and mood swings (and depression when too low), stomach ulcers, <b>hidden infections and yeast infections</b> like oral thrush, slow wound healing, low potassium and fluid retention, slow growth in kids, <b>thin bones (osteoporosis)</b>, and <b>raised eye pressure (glaucoma)</b> and cataracts. Be careful in patients with high blood pressure, diabetes, ulcers, osteoporosis, infections, glaucoma, cataracts or psychosis.</p>\n<h4>Picking one</h4>\n<ul><li><b>Hydrocortisone</b>: the standard, short-acting.</li><li><b>Prednisone</b>: about 4 times stronger against inflammation, little salt-keeping; the usual pill.</li><li><b>Methylprednisolone</b>: the Medrol Dosepak.</li><li><b>Triamcinolone</b>: middle length.</li><li><b>Dexamethasone</b> and <b>betamethasone</b>: long-acting, once a day; dexamethasone is about 30 times stronger and keeps no salt.</li><li><b>Fludrocortisone</b>: almost all salt-keeping (about 250 times), little anti-inflammatory power. It's the one to add for an Addison's patient who is still dizzy, craving salt, low in sodium and high in potassium.</li></ul>\n<h4>Blocking cortisol</h4>\n<p>For too much cortisol (Cushing's): <b>ketoconazole</b> (an antifungal that also blocks human steroid-making enzymes) and <b>metyrapone</b> block production. Etomidate and mitotane also work, and <b>mifepristone</b> blocks the cortisol receptor.</p>\n<h4>Blocking aldosterone</h4>\n<p><b>Spironolactone</b> and <b>eplerenone</b> block aldosterone's receptor. They are water pills that make you lose sodium but <b>keep potassium</b>, so the classic side effect is <b>high potassium</b>. Spironolactone can cause breast growth in men, so those patients switch to eplerenone. Used for heart failure and high blood pressure.</p>\n<h4>Class examples</h4>\n<p>Steroid injections for mouth ulcers, overused: <b>oral thrush</b>. Long-term steroid eye drops: <b>glaucoma</b>. Months of prednisone and a spine fracture after a small fall: <b>osteoporosis</b>.</p>\n", "thydrugs": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Reading TSH and T4</li><li>Levothyroxine and why it's first</li><li>Why not T3 pills or pig thyroid</li><li>Drug interactions and amiodarone</li><li>Methimazole vs PTU, radioactive iodine and the helper drugs</li></ul></div>\n<p>Dr. Fasinu teaches with patient cases and lab values, so learn to read the labs.</p>\n<h4>Reading the labs</h4>\n<p>TSH goes the <b>opposite</b> way from thyroid hormone. <b>High TSH, low T4 = underactive thyroid</b> (the pituitary is shouting for more). <b>Low TSH, high T4 = overactive thyroid</b>. If someone on levothyroxine still has a high TSH, they need <b>more</b>. If a lab list hides a positive <b>hCG</b>, the patient is pregnant, and that changes the drug.</p>\n<h4>How thyroid hormone works</h4>\n<p>The gland releases mostly <b>T4</b>, which is basically a storage form. The liver and other tissues turn it into <b>T3</b>, the active form, which works on a receptor in the nucleus about 10 times better than T4. In the blood both ride on <b>TBG</b>.</p>\n<h4>Too little: hypothyroidism</h4>\n<p>Usually <b>Hashimoto's</b> (the immune system destroys the gland), surgery or radioiodine, iodine shortage, pituitary failure, or drugs like amiodarone and lithium. Signs: tired, weight gain, depressed, constipated, cold, dry skin, slow heart, hoarse voice, <b>big tongue</b>. Untreated it can end in <b>myxedema coma</b>, an emergency.</p>\n<p><b>Levothyroxine (T4)</b> is the go-to drug. The body converts it to T3 at its own pace, so levels stay steady. Take it <b>first thing in the morning on an empty stomach</b> (it sticks to food and minerals). It lasts a long time (half-life about a week), so it takes about <b>6 to 8 weeks</b> to settle. Small dose changes matter a lot (a narrow safety window), so TSH is checked regularly. Too much feels like an overactive thyroid.</p>\n<p><b>Liothyronine (T3)</b> sounds better because it's already active, but it wears off fast (about 18 hours), levels swing, and too much strains the heart. It's saved for special cases like thyroid cancer or emergencies. <b>Pig thyroid (Armour)</b> has much more T3 than human thyroid (4 to 1 instead of 14 to 1), so it's unpredictable and no better.</p>\n<h4>Interactions</h4>\n<p>Things that block absorption: cholestyramine-type drugs and <b>calcium, aluminum and magnesium</b>. Liver-revving drugs like rifampin and carbamazepine, plus estrogen and SSRIs, also change levels. Thyroid hormone <b>raises warfarin's effect</b> (more bleeding) and lowers theophylline.</p>\n<h4>Drugs that cause thyroid problems</h4>\n<p><b>Amiodarone</b> (a heart rhythm drug) contains iodine, so it can make the thyroid too slow or too fast. Lithium and interferon can cause low thyroid; steroids, dopamine, octreotide and opiates lower TSH.</p>\n<h4>Too much: hyperthyroidism</h4>\n<p>Usually <b>Graves</b>, where antibodies act like TSH. Signs: weight loss, fast heart, sweating, nervous, can't sleep, bulging eyes. Choices: drugs, radioactive iodine or surgery.</p>\n<ul><li><b>Methimazole</b>: first choice for most people; once a day; easier on the liver; but can cause <b>birth defects</b>.</li><li><b>PTU (propylthiouracil)</b>: for the <b>first trimester of pregnancy</b> or thyroid storm; also blocks T4 → T3 conversion; taken 2 to 3 times a day; harder on the liver (boxed warning).</li><li>Both block hormone making and can cause liver damage, rash, joint pain, upset stomach and a dangerous drop in white cells (<b>agranulocytosis</b>).</li><li><b>Radioactive iodine</b>: the thyroid soaks it up and is destroyed. Never in pregnancy. Often leaves the patient underactive afterward.</li><li>Helpers: <b>Lugol's iodine</b> blocks hormone release (before surgery, thyroid storm); <b>beta-blockers</b> calm the racing heart and shakes; <b>steroids</b> slow T4 → T3 conversion (thyroid storm, eye disease).</li></ul>\n", "histo2": "\n<div class=\"tested\"><b>What's tested</b><ul><li>The layers of the adrenal and how blood flows through it (the medulla's two blood supplies are on the exam)</li><li>What each cortical zone makes and what triggers it</li><li>Chromaffin cells of the medulla</li><li>How to tell the hormone part of the pancreas from the digestive part, and the islet cell types</li></ul></div>\n<p>This short lecture looks at the adrenal and the pancreas under the microscope, going back over what Dr. Madison taught in L5 and L6. Dr. Herr says there aren't really images on the exam.</p>\n<h4>Adrenal layout</h4>\n<p>The adrenals sit on top of each kidney like a little hat. Outer <b>cortex</b>: steroids. Inner <b>medulla</b>: epinephrine and norepinephrine. One capsule wraps both.</p>\n<h4>Blood flow</h4>\n<p>Three arteries feed each adrenal: one from the artery under the diaphragm (inferior phrenic), one straight off the aorta, and one from the kidney's artery. Inside, short arteries feed leaky capillaries that run down through all three cortex layers and then drain into veins that pass through the medulla. Long arteries go straight through the cortex to the medulla. So the medulla gets <b>two</b> blood supplies: fresh arterial blood and blood that has already passed through the cortex, carrying cortisol. Dr. Herr says this is a question on your exam. Everything leaves through one central vein, the suprarenal vein.</p>\n<h4>Cortex layers</h4>\n<ul><li><b>Zona glomerulosa</b> (outer, about 15%): <b>aldosterone</b>, in response to angiotensin II and ACTH.</li><li><b>Zona fasciculata</b> (middle, the biggest, 65-80%): <b>cortisol</b>, in response to ACTH. Its cells are called <b>spongiocytes</b> because they're full of fat droplets. That name is the thing to remember for the exam.</li><li><b>Zona reticularis</b> (inner, about 10%): <b>androgens</b> like DHEA, in response to ACTH.</li></ul>\n<p>All of them build their hormones from cholesterol (mostly LDL from the blood). Steroid hormones work inside the cell by changing which genes are read, so they take hours to days to act.</p>\n<h4>Medulla</h4>\n<p>The medulla is basically a <b>sympathetic nerve relay</b>. Nerves from the middle of the spinal cord (T1 to L2) pass through the sympathetic chain without stopping and end right on the medulla's <b>chromaffin cells</b> (also called pheochromocytes). These big cells act like nerve cells without the dendrites and axons. The nerve releases acetylcholine onto them, calcium rushes in, and they release <b>epinephrine</b> (about 80% of the cells) and <b>norepinephrine</b>. That's the \"fight or flight\" surge: more oxygen use, heat, sugar, fat burning, heart rate, blood pressure and alertness.</p>\n<h4>Pancreas</h4>\n<p>Most of the pancreas is digestive tissue (acini with ducts). The hormone-making <b>islets of Langerhans</b> are only about 1-2% of it, mostly in the <b>tail</b>. They look like pale islands with lots of capillaries and no ducts. The pancreas gets its blood from the celiac trunk (including the splenic artery) and the superior mesenteric artery.</p>\n<ul><li><b>Beta cells</b> (65-70%, the most): insulin.</li><li><b>Alpha cells</b> (15-20%, next): glucagon.</li><li><b>Delta cells</b> (5-10%): somatostatin.</li><li><b>PP (F) cells</b> (under 5%): pancreatic polypeptide.</li><li><b>Epsilon cells</b> (under 5%): ghrelin.</li></ul>\n<p>Inside the islet, insulin slows the beta cells themselves (<b>autocrine</b>) and the alpha cells next door (<b>paracrine</b>), and somatostatin slows both (paracrine). The islet cells other than beta cells are cousins of the hormone cells scattered in the gut lining.</p>\n", "calcium": "\n<div class=\"tested\"><b>What's tested</b><ul><li>Why low calcium makes nerves twitchy, and high calcium makes you sluggish</li><li>Which bone cell has which hormone receptor</li><li>How vitamin D gets activated and what it does in the gut</li><li>How PTH is controlled and what it does to kidney and bone</li><li>Calcitonin, osteoporosis, rickets vs osteomalacia, and too much PTH</li></ul></div>\n<h4>Why calcium is kept so steady</h4>\n<p>Calcium runs nerves, muscles, clotting, hormone release, bones and teeth; phosphate is in bones and energy molecules. Calcium and phosphate love to stick together into the mineral of bone (hydroxyapatite), so the body usually moves them the same way: keep both or lose both. The one exception is the kidney under PTH, and Dr. Galin said to put a star by it.</p>\n<p>Calcium has to stay in a tight range. <b>Too much calcium makes nerves sluggish</b>: tired, weak, sleepy. <b>Too little makes nerves fire too easily</b>: muscle cramps and spasms (<b>tetany</b>), heart trouble and seizures, which can kill. Two quick checks for low calcium: a blood pressure cuff sets off a hand spasm (<b>Trousseau's sign</b>), and tapping the facial nerve makes the face twitch (<b>Chvostek's sign</b>).</p>\n<p>In the blood, about half of calcium is free (ionized), and that's the part hormones control. They work in three places: the <b>gut, bones and kidneys</b>. Don't worry about the daily numbers.</p>\n<h4>Bone cells</h4>\n<p><b>Osteoblasts</b> build bone and have receptors for PTH, vitamin D and estrogen. <b>Osteoclasts</b> break bone down and have the calcitonin receptor. That's backwards from what you'd guess for PTH, which breaks bone down, so star it. Your whole skeleton turns over about every 7 years.</p>\n<h4>Vitamin D</h4>\n<p>Vitamin D is a real hormone that we can make ourselves. Sunlight turns a cholesterol relative in the skin into vitamin D3 (cholecalciferol, also what's in supplements and fortified milk). The <b>liver</b> adds a piece (25-hydroxy), and the <b>kidney</b> finishes it. The kidney's <b>1α-hydroxylase</b> makes the active form, <b>calcitriol</b>; its <b>24-hydroxylase</b> makes an inactive form. Low calcium, low phosphate and PTH turn on the active route; high calcium, high phosphate and plenty of calcitriol turn on the inactive one. People with liver or kidney disease can't make enough active vitamin D.</p>\n<p>Calcitriol mostly works in the <b>gut</b>, by switching on genes: calcium channels on the food side, a carrier protein called <b>calbindin</b> (very important: it ferries calcium across the cell like an Uber so it doesn't set off other signals), and pumps that move calcium into the blood. Lots of soda (high phosphate) switches kids to the inactive form of vitamin D, which is bad for growing bones.</p>\n<h4>PTH</h4>\n<p>We have four parathyroids behind the thyroid and need at least one. Early surgeons who took out the whole thyroid for goiters found that out: the patients went into tetany and died. The parathyroids' <b>chief cells</b> make PTH and sense calcium with a <b>calcium-sensing receptor</b>. Here's the twist: when calcium is high, the receptor raises calcium inside the cell, and that <b>stops</b> PTH release (everywhere else, rising calcium inside a cell causes release). Low calcium means PTH goes up.</p>\n<p>PTH makes the <b>kidney keep calcium but dump phosphate</b>, so the two don't meet and form kidney stones, and it switches on active vitamin D. In <b>bone</b>, PTH can't talk to osteoclasts directly: it tells osteoblasts to send signals that wake up the osteoclasts (which are related to immune cells), and they break bone down and release calcium. Overall: <b>blood calcium up, phosphate down</b>. Estrogen normally keeps that bone breakdown in check.</p>\n<h4>Calcitonin</h4>\n<p>Made by the thyroid's <b>C cells</b>. It does the opposite of PTH: it acts on the osteoclast's receptor, slows bone breakdown and lowers calcium. We may not really need it day to day, but it's used as a drug for osteoporosis.</p>\n<h4>Bone diseases</h4>\n<p><b>Osteoporosis</b>: weak, porous bones, mostly in women after menopause when estrogen falls, often showing as a hunched upper back. Men get it later, because their hormones fall much later. Long-term steroid drugs make bone breakdown worse. <b>Vitamin D deficiency</b> softens bone: <b>rickets</b> in growing children (bowed legs, thick wrists and ankles, slow growth; it's why milk has vitamin D added) and <b>osteomalacia</b> in adults (brittle bones that break easily).</p>\n<p><b>Primary hyperparathyroidism</b>, the most common calcium disorder: a parathyroid makes too much PTH even though calcium is already high. Calcium high, phosphate low. Signs: tired, weak, constipated, thirsty, bone pain and fractures, and <b>kidney stones</b> again and again. Treatment: calcitonin, and bisphosphonates, which coat the bone mineral so osteoclasts can't break it down.</p>\n"};

/* ---------- utils ---------- */
function escHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function choiceOrder(q){ var idx = q.choices.map(function(c,i){ return i; }); return q.fmt === '2stmt' || q.fmt === 'tf' || q.fmt === 'numbered' ? idx : shuffled(idx); }
function shuffled(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function tagOf(lecId){ var l = LECTURE_BY_ID[lecId]; return l ? l.tag : 'blue'; }
function lecChip(lecId){ var l = LECTURE_BY_ID[lecId]; if(!l) return ''; return '<span class="lec-chip tag-'+l.tag+'">'+lecLabel(l)+' · '+escHtml(l.title.split(':')[0].split(',')[0])+'</span>'; }
function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg, ic){ var host = document.getElementById('toastHost'); if(!host) return; var t = document.createElement('div'); t.className='toast'; t.innerHTML = (ic ? icon(ic) : '') + '<span>' + escHtml(msg) + '</span>'; host.appendChild(t); setTimeout(function(){ t.remove(); }, 2600); }

/* ---------- STATE ---------- */
var STATE_KEY = 'endo1-state-v1';
function defaultState(){
  return { v:1, seen:{}, streak:0, bestStreak:0, totalCorrect:0, totalAnswered:0, lecStats:{}, days:[], ach:{},
    ui:{ mode:'home', sub:'notes', lec:'histo1', level:'full', group:'histo1', recall:false, qlec:'all', qsrc:'all', qstatus:'all' },
    arcade:{ best:{ sort:0, board:0, escape:0, cloze:0, smile:0, cross:0 }, plays:{ sort:0, board:0, escape:0, cloze:0, smile:0, cross:0 }, muted:false, scope:'all', sortSet:'mix', snakeLec:'all', stackSet:'mix', matchSet:'mix', hangLec:'all', blastLec:'all', searchLec:'all', whackSet:'mix' } };
}
function loadState(){
  var base = defaultState();
  try{
    var raw = localStorage.getItem(STATE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      Object.keys(s).forEach(function(k){
        if(s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])){
          Object.keys(s[k]).forEach(function(k2){
            if(s[k][k2] && typeof s[k][k2]==='object' && !Array.isArray(s[k][k2]) && base[k][k2] && typeof base[k][k2]==='object') base[k][k2] = Object.assign(base[k][k2], s[k][k2]);
            else base[k][k2] = s[k][k2];
          });
        } else base[k] = s[k];
      });
    }
  }catch(e){ /* storage unavailable */ }
  return base;
}
var STATE = loadState();
function saveState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }catch(e){ /* storage unavailable */ } }

/* ---------- achievements ---------- */
var ACHIEVEMENTS = [
  { id:'first', name:'First Secretion', icon:'hormone', desc:'Answer your first question', cond:{ type:'totalCorrect', n:1 } },
  { id:'fifty', name:'Fifty Pulses', icon:'cycle', desc:'50 correct answers', cond:{ type:'totalCorrect', n:50 } },
  { id:'streak10', name:'Positive Feedback', icon:'target', desc:'10 correct in a row', cond:{ type:'streak', n:10 } },
  { id:'streak25', name:'Thyroid Storm', icon:'bolt', desc:'25 correct in a row', cond:{ type:'streak', n:25 } },
  { id:'histo1', name:'FLAT PiG', icon:'cell', desc:'80% on L1 histology (20+ answered)', cond:{ type:'lecPct', lec:'histo1', pct:80, min:20 } },
  { id:'adrenal', name:'Lightning Bolt', icon:'shield', desc:'80% on L6 adrenal (20+ answered)', cond:{ type:'lecPct', lec:'adrenal', pct:80, min:20 } },
  { id:'all', name:'Full Axis', icon:'medal', desc:'Answer every question in the bank at least once', cond:{ type:'allSeen' } }
];
function checkAchievements(){
  ACHIEVEMENTS.forEach(function(a){
    if(STATE.ach[a.id]) return;
    var c = a.cond, ok = false;
    if(c.type === 'totalCorrect') ok = STATE.totalCorrect >= c.n;
    else if(c.type === 'streak') ok = STATE.streak >= c.n;
    else if(c.type === 'lecPct'){ var st = STATE.lecStats[c.lec]; ok = !!(st && st.a >= c.min && (st.c / st.a) * 100 >= c.pct); }
    else if(c.type === 'allSeen') ok = QUESTIONS.every(function(q){ return STATE.seen[q.id]; });
    if(ok){ STATE.ach[a.id] = todayStr(); toast('Achievement: ' + a.name, a.icon); }
  });
}

/* ---------- the one answer choke point ---------- */
function recordAnswer(qid, lecId, correct, ctx, choice){
  var s = STATE.seen[qid] || { n:0, c:0, last:null };
  s.n++; if(correct) s.c++; s.last = !!correct; STATE.seen[qid] = s;
  STATE.totalAnswered++;
  if(correct){ STATE.totalCorrect++; STATE.streak++; if(STATE.streak > STATE.bestStreak) STATE.bestStreak = STATE.streak; } else STATE.streak = 0;
  var ls = STATE.lecStats[lecId] || { a:0, c:0 }; ls.a++; if(correct) ls.c++; STATE.lecStats[lecId] = ls;
  var d = todayStr(); if(STATE.days.indexOf(d) === -1) STATE.days.push(d);
  checkAchievements();
  saveState();
  renderHeaderStats();
  document.dispatchEvent(new CustomEvent('endo1:answered', { detail:{ qid:qid, lec:lecId, correct:!!correct, ctx:ctx||'bank', choice:(typeof choice === 'number' ? choice : null) } }));
}

/* ---------- header ---------- */
function dayStreak(){
  var set = {}; STATE.days.forEach(function(d){ set[d] = 1; });
  var n = 0, d = new Date();
  var k0 = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(!set[k0]) d.setDate(d.getDate()-1); /* not studied yet today: the streak is still alive from yesterday */
  for(;;){ var k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(set[k]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
/* whole calendar days from today to a 'YYYY-MM-DD' date (0 = today) */
function calDays(now, ymd){ return Math.round((new Date(ymd + 'T00:00:00') - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5); }
function renderHeaderStats(){
  var seenCount = QUESTIONS.filter(function(q){ return STATE.seen[q.id]; }).length;
  var el = document.getElementById('progressSummary'); if(el) el.textContent = seenCount + '/' + QUESTIONS.length;
  var sp = document.getElementById('streakPill'); if(sp){ var n = dayStreak(); sp.textContent = n + ' day streak'; sp.hidden = n < 2; }
  var cd = document.getElementById('countdownPill');
  if(cd){
    var now = new Date();
    var done = now >= new Date(EXAM_DATE + 'T' + EXAM_CLOSES + ':00'), days = calDays(now, EXAM_DATE);
    cd.textContent = done ? 'Exam 1 done' : days > 1 ? (days + ' days to Exam 1') : days === 1 ? 'Exam 1 tomorrow' : 'Exam 1 today';
  }
}

/* ---------- question card renderer (shared by every mode) ---------- */
var SEQ_STATE = {}, MATCH_STATE = {};
var RENDER_SEQ = 0;
function qCardHTML(q, opts){
  opts = opts || {};
  var rid = 'r' + (++RENDER_SEQ);
  var body = '';
  if(q.type === 'mcq'){
    body += '<div class="qcard-choices">';
    choiceOrder(q).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="mcq" data-idx="'+i+'" data-answer="'+(i===q.answer?1:0)+'">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div>';
  } else if(q.type === 'sequence'){
    SEQ_STATE[rid] = { picks:[] };
    body += '<div class="qcard-hint">Tap the steps in order, first to last.</div><div class="qcard-seq-steps">';
    shuffled(q.steps.map(function(s,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="seq" data-step-idx="'+i+'">'+escHtml(q.steps[i])+'</button>';
    });
    /* undo / start over for a wrong tap (student suggestion #3, 2026-10-02); the last step is forced, so grading on it stays */
    body += '</div><div class="qcard-seq-tools" data-role="seq-tools" hidden><button type="button" data-act="seq-undo">Undo last step</button><button type="button" data-act="seq-clear">Start over</button></div>';
  } else if(q.type === 'match'){
    MATCH_STATE[rid] = { sel:null, matched:0, errors:0 };
    body += '<div class="qcard-hint">Tap an item on the left, then its partner on the right.</div><div class="qcard-match-cols"><div class="qcard-match-col">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-act="match" data-side="left" data-pair-idx="'+i+'">'+escHtml(q.pairs[i][0])+'</button>'; });
    body += '</div><div class="qcard-match-col">';
    shuffled(q.pairs.map(function(p,i){ return i; })).forEach(function(i){ body += '<button type="button" class="qcard-match-item" data-act="match" data-side="right" data-pair-idx="'+i+'">'+escHtml(q.pairs[i][1])+'</button>'; });
    body += '</div></div>';
  } else if(q.type === 'multi'){
    MULTI_STATE[rid] = { picks:[] };
    body += '<div class="qcard-hint">Select every correct answer, then check. Partial credit.</div><div class="qcard-choices">';
    shuffled(q.choices.map(function(c,i){ return i; })).forEach(function(i){
      body += '<button type="button" class="qcard-choice" data-act="multi" data-multi-idx="'+i+'" aria-pressed="false">'+escHtml(q.choices[i])+'</button>';
    });
    body += '</div><div class="multi-check" data-role="multi-check"><button type="button" class="btn" data-act="multi-check">Check answer</button></div>';
  }
  var seen = STATE.seen[q.id];
  var status = opts.retry ? '<span class="src-chip retry-chip">'+icon('cycle')+'Try it again: you missed this a few questions ago</span>' : seen ? (seen.last ? '<span class="src-chip" style="color:var(--good)">last: right</span>' : '<span class="src-chip" style="color:var(--bad)">last: missed</span>') : '';
  return '<div class="qcard tag-'+tagOf(q.lec)+(opts.retry?' is-retry':'')+'" data-qid="'+q.id+'" data-rid="'+rid+'" data-qtype="'+q.type+'"'+(opts.ctx?' data-ctx="'+opts.ctx+'"':'')+'>' +
    '<div class="qcard-top">'+lecChip(q.lec)+'<span class="src-chip">'+escHtml(SRC_LABEL[q.src]||q.src)+'</span>'+status+'</div>' +
    figHTML(q) + pboxHTML(q) + '<p class="qcard-stem">'+escHtml(q.stem)+'</p>' + body +
    '<div class="qcard-explain" data-role="explain"><span class="qcard-verdict"></span>'+figAfterHTML(q)+(q.type==='sequence' ? '<b>Order:</b> '+q.steps.map(function(s,i){ return (i+1)+'. '+escHtml(s); }).join(' → ')+'<br>' : '')+escHtml(q.ex)+whyHTML(q)+cueHTML(q)+
      '<div class="qcard-classdata-row"><span class="qcard-classdata-result" data-role="classdata-result">Loading class data…</span></div></div>' +
  '</div>';
}
/* drawn figure (q.img = a FIGS key) renders above the Patient Box and stem without its key; after answering, the
   explanation shows it again with the key open (figures with a key) or for the first time (imgAfter: the stem stands on its own) */
function figHTML(q){ var f = q.img && !q.imgAfter && FIGS[q.img]; return f ? '<figure class="qcard-figure" aria-label="'+escHtml(f.title)+'">'+f.svg+'</figure>' : ''; }
/* the key (what each letter or number is) sits folded under the notes/Review copy, so you can test yourself first; question pictures show it only after answering */
function figKeyHTML(f, open){ return f.key ? '<details class="fig-key"'+(open?' open':'')+'><summary>'+(open?'Key':'Show the key')+'</summary><dl>' + f.key.map(function(k){ return '<dt>'+escHtml(k[0])+'</dt><dd>'+escHtml(k[1])+'</dd>'; }).join('') + '</dl></details>' : ''; }
function figAfterHTML(q){ var f = q.img && FIGS[q.img]; return f && (q.imgAfter || f.key) ? '<figure class="qcard-figure qcard-figure-after" aria-label="'+escHtml(f.title)+'">'+f.svg+figKeyHTML(f, true)+'</figure>' : ''; }
function figCardHTML(key){ if(key === 'cuspMap') return cuspMapHTML(1); if(ANIMA.meta(key)) return '<div class="fig-anima">' + ANIMA.html(key) + '</div>'; var f = FIGS[key]; return f ? '<figure class="fig-card"><h4>'+escHtml(f.title)+'</h4>'+f.svg+'<p>'+escHtml(f.caption)+'</p>'+figKeyHTML(f)+'</figure>' : ''; }
/* Patient Box rows render above the stem */
var CASE_SETS = null;
function caseSet(key){
  if(!CASE_SETS){ CASE_SETS = {}; QUESTIONS.forEach(function(q){ if(q.pcase) (CASE_SETS[q.pcase] = CASE_SETS[q.pcase] || []).push(q.id); }); }
  return CASE_SETS[key] || [];
}
function pboxHTML(q){
  if(!q.pbox) return '';
  var set = q.pcase ? caseSet(q.pcase) : [], tag = set.length > 1 ? '<span class="pbox-set">Same patient · '+(set.indexOf(q.id)+1)+' of '+set.length+'</span>' : '';
  return '<div class="pbox"><div class="pbox-head">'+icon('notes')+'Patient box'+tag+'</div><dl>' + q.pbox.map(function(r){ return '<dt>'+escHtml(r[0])+'</dt><dd>'+escHtml(r[1])+'</dd>'; }).join('') + '</dl>' + caseImgHTML(q) + '</div>';
}
/* select-all partial credit (Canvas-style): +1/n per right pick, -1/n per wrong pick, floor 0; full credit counts as correct */
var MULTI_STATE = {};
function multiScore(q, picks){ var hit = picks.filter(function(i){ return q.correct.indexOf(i) > -1; }).length; return Math.max(0, (hit - (picks.length - hit)) / q.correct.length); }
/* memory cue (q.cue): a mnemonic or hook, shown only after a miss (student suggestion, 2026-10-02) */
/* the "Why each choice" list: right answers first, then the rest; picks = the indexes the student chose (marked) */
function whyHTML(q, picks){
  if(!q.why || !q.choices) return '';
  var ok = function(i){ return q.type === 'multi' ? q.correct.indexOf(i) > -1 : i === q.answer; };
  var idx = q.choices.map(function(c,i){ return i; }).sort(function(a,b){ return (ok(b)?1:0) - (ok(a)?1:0) || a - b; });
  return '<details class="qx-why" open><summary>Why each choice</summary><ul>' + idx.map(function(i){
    var p = picks && picks.indexOf(i) > -1;
    return '<li class="'+(ok(i)?'is-right':'is-wrong')+(p?' is-picked':'')+'" data-why-idx="'+i+'"><span class="qx-why-mark" aria-hidden="true">'+(ok(i)?'✓':'✗')+'</span><span><b>'+escHtml(q.choices[i])+'</b>'+(p?'<em class="qx-why-you"> your pick</em>':'')+'<br>'+escHtml(q.why[i])+'</span></li>';
  }).join('') + '</ul></details>';
}
/* mark the student's pick(s) in that list once a card is answered (runs after the card's own click handler) */
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('.qcard-choice[data-idx], [data-act="multi-check"], [data-action="multi-check"]'); if(!b) return;
  var card = b.closest('.qcard'), list = card && card.querySelector('.qx-why'); if(!list) return;
  var picks = b.hasAttribute('data-idx') ? [b.getAttribute('data-idx')] :
    Array.prototype.map.call(card.querySelectorAll('.qcard-choice[aria-pressed="true"]'), function(x){ return x.getAttribute('data-multi-idx'); });
  list.querySelectorAll('li').forEach(function(li){
    var on = picks.indexOf(li.getAttribute('data-why-idx')) > -1;
    li.classList.toggle('is-picked', on);
    var y = li.querySelector('.qx-why-you'); if(on && !y){ li.querySelector('b').insertAdjacentHTML('afterend', '<em class="qx-why-you"> your pick</em>'); } else if(!on && y) y.remove();
  });
});
function cueHTML(q){ return q.cue ? '<div class="qx-cue" data-role="cue">'+icon('bulb')+'<b>Remember it:</b> '+escHtml(q.cue)+'</div>' : ''; }
function finishCard(card, correct){
  card.classList.add('is-answered'); if(!correct) card.classList.add('is-missed');
  var v = card.querySelector('.qcard-verdict'); if(v){ v.textContent = correct ? 'Correct.' : 'Not quite.'; v.className = 'qcard-verdict ' + (correct ? 'ok' : 'bad'); }
  var q = QUESTIONS_BY_ID[card.getAttribute('data-qid')];
  var pk = card.getAttribute('data-pick');
  if(q) recordAnswer(q.id, q.lec, correct, card.getAttribute('data-ctx') || 'bank', pk === null ? null : +pk);
  if(card.classList.contains('is-retry') && window.shTrack) window.shTrack('bank:retry-' + (correct ? 'right' : 'missed'));
  var host = card.parentNode; if(q && !correct && host && host.__retry) host.__retry(card, q);
}
function wireQuestionContainer(container){
  if(container.__wired) return; container.__wired = true;
  container.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]'); if(!btn || btn.disabled) return;
    var card = btn.closest('.qcard'); if(!card || card.classList.contains('is-answered')) return;
    var q = QUESTIONS_BY_ID[card.getAttribute('data-qid')]; if(!q) return;
    var rid = card.getAttribute('data-rid');
    var act = btn.getAttribute('data-act');
    if(act === 'mcq'){
      var ok = btn.getAttribute('data-answer') === '1';
      card.querySelectorAll('.qcard-choice').forEach(function(b){ b.disabled = true; if(b.getAttribute('data-answer') === '1') b.classList.add('is-correct'); });
      if(!ok) btn.classList.add('is-wrong');
      card.setAttribute('data-pick', btn.getAttribute('data-idx'));
      finishCard(card, ok);
    } else if(act === 'multi'){
      var mst = MULTI_STATE[rid]; if(!mst) return;
      var mi = +btn.getAttribute('data-multi-idx'), at = mst.picks.indexOf(mi);
      if(at > -1){ mst.picks.splice(at, 1); btn.classList.remove('is-selected'); btn.setAttribute('aria-pressed','false'); }
      else { mst.picks.push(mi); btn.classList.add('is-selected'); btn.setAttribute('aria-pressed','true'); }
    } else if(act === 'multi-check'){
      var mc = MULTI_STATE[rid]; if(!mc) return;
      if(!mc.picks.length){ btn.textContent = 'Pick at least one'; return; }
      var sc = multiScore(q, mc.picks);
      card.querySelectorAll('[data-act="multi"]').forEach(function(b){
        b.disabled = true; b.classList.remove('is-selected');
        var bi = +b.getAttribute('data-multi-idx'), isC = q.correct.indexOf(bi) > -1, was = mc.picks.indexOf(bi) > -1;
        if(isC && was) b.classList.add('is-correct'); else if(isC) b.classList.add('is-missed-right'); else if(was) b.classList.add('is-wrong');
      });
      var wrapC = card.querySelector('[data-role="multi-check"]'); if(wrapC) wrapC.innerHTML = '<span class="multi-score">Partial credit: '+Math.round(sc*100)+'%. Dashed = a right answer you missed.</span>';
      finishCard(card, sc === 1);
    } else if(act === 'seq-undo' || act === 'seq-clear'){
      var us = SEQ_STATE[rid]; if(!us) return;
      var drop = act === 'seq-clear' ? us.picks.splice(0) : us.picks.splice(-1);
      drop.forEach(function(i){ var b = card.querySelector('[data-act="seq"][data-step-idx="'+i+'"]'); if(!b) return; b.disabled = false; b.classList.remove('is-picked'); var o = b.querySelector('.ord'); if(o) o.remove(); });
      var ut = card.querySelector('[data-role="seq-tools"]'); if(ut) ut.hidden = !us.picks.length;
    } else if(act === 'seq'){
      var st = SEQ_STATE[rid]; if(!st) return;
      st.picks.push(+btn.getAttribute('data-step-idx'));
      btn.disabled = true; btn.classList.add('is-picked');
      btn.insertAdjacentHTML('afterbegin', '<span class="ord">'+st.picks.length+'</span>');
      var tools = card.querySelector('[data-role="seq-tools"]'); if(tools) tools.hidden = false;
      if(st.picks.length === q.steps.length){
        var good = st.picks.every(function(v,i){ return v === i; }), inPlace = st.picks.filter(function(v,i){ return v === i; }).length;
        card.querySelectorAll('[data-act="seq"]').forEach(function(b){ var i = +b.getAttribute('data-step-idx'); var pos = st.picks.indexOf(i); b.classList.remove('is-picked'); b.classList.add(pos === i ? 'is-correct' : 'is-wrong'); });
        finishCard(card, good);
        var sv = card.querySelector('.qcard-verdict'); if(sv && !good) sv.textContent = 'Not quite: ' + inPlace + ' of ' + q.steps.length + ' in the right spot.';
      }
    } else if(act === 'match'){
      var ms = MATCH_STATE[rid]; if(!ms || btn.classList.contains('is-matched')) return;
      var side = btn.getAttribute('data-side');
      if(side === 'left'){ card.querySelectorAll('.qcard-match-item[data-side="left"]').forEach(function(b){ b.classList.remove('is-selected'); }); btn.classList.add('is-selected'); ms.sel = +btn.getAttribute('data-pair-idx'); return; }
      if(ms.sel === null) return;
      var r = +btn.getAttribute('data-pair-idx');
      var leftBtn = card.querySelector('.qcard-match-item[data-side="left"][data-pair-idx="'+ms.sel+'"]');
      if(r === ms.sel){
        btn.classList.add('is-matched'); leftBtn.classList.add('is-matched'); leftBtn.classList.remove('is-selected'); btn.disabled = true; leftBtn.disabled = true;
        ms.matched++; ms.sel = null;
        if(ms.matched === q.pairs.length) finishCard(card, ms.errors === 0);
      } else {
        ms.errors++; btn.classList.remove('is-wrong'); void btn.offsetWidth; btn.classList.add('is-wrong');
      }
    }
  });
}

/* ---------- mode switching ---------- */
function setMode(mode){
  if(window.shTTS) window.shTTS.stop();
  STATE.ui.mode = mode; saveState();
  document.querySelectorAll('#modeSwitch [data-mode]').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-mode') === mode ? 'true' : 'false'); });
  document.querySelectorAll('[data-mode-panel]').forEach(function(p){ p.hidden = p.getAttribute('data-mode-panel') !== mode; });
  if(mode !== 'arcade' && typeof ARCADE !== 'undefined') ARCADE.stopAll();
  if(mode !== 'home') clearInterval(homeTimer);
  if(mode === 'home') renderHome();
  else if(mode === 'compendium') renderCompendium();
  else if(mode === 'review') renderReview();
  else if(mode === 'arcade') ARCADE.renderLobby();
  window.scrollTo(0,0);
}

/* ===================================================================
   HOME: this hub's own front page (Sam, 2026-10-27): the countdown and what's on Exam 1, the quiz deadline,
   your progress by lecture, where to go next and the course timeline. Progress is read from this device's STATE
   (merged with your other devices by SH_SYNC).
   =================================================================== */
var homeTimer = null;
function examStart(){ return new Date(EXAM_DATE + 'T' + EXAM_TIME + ':00'); }
function examEnd(){ return new Date(EXAM_DATE + 'T' + EXAM_CLOSES + ':00'); }
function lecProgress(l){
  var qs = QUESTIONS_BY_LECTURE[l.id] || [], tried = 0, right = 0, missed = 0;
  qs.forEach(function(q){ var s = STATE.seen[q.id]; if(s){ tried++; if(s.last) right++; else missed++; } });
  var st = STATE.lecStats[l.id] || { a:0, c:0 };

/* ===================================================================
   MIND MAPS: built from each lecture's own notes (section headings as
   branches, the bolded key terms under each as leaves), drawn by the
   shared window.shMindMap renderer
   =================================================================== */
function mindMapFor(lec){
  var d = document.createElement('div'); d.innerHTML = READINGS[lec.id] || '';
  var branches = [], cur = { label:null, children:[] }, seen = {}; /* the intro paragraph before the first heading is left out */
  Array.prototype.forEach.call(d.children, function(el){
    if(/^H[34]$/.test(el.tagName)){ if(cur.label && cur.children.length) branches.push(cur); cur = { label:el.textContent.trim(), children:[] }; return; }
    if(!cur.label) return;
    Array.prototype.forEach.call(el.querySelectorAll('b, strong'), function(x){
      var t = x.textContent.trim(), k = t.toLowerCase();
      if(t.length < 2 || t.length > 38 || seen[k] || cur.children.length >= 6) return;
      seen[k] = 1; cur.children.push({ label:t });
    });
  });
  if(cur.label && cur.children.length) branches.push(cur);
  return { label:lecLabel(lec) + ' ' + lec.title, children:branches };
}
