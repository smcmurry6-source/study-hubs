/* Put each figure inside the notes after the paragraph (or at the end of the section) it explains. The wrapper carries
   data-sh-noread, so narration, the highlighter and note search skip it and the notes text itself is unchanged.
   Figures in FIG_BY_LEC that no anchor places land in a Diagrams block after the notes. */
function placeLectureFigs(prose, lecId, level, rest){
  if(!prose) return;
  var placed = {}, kids = Array.prototype.slice.call(prose.children);
  function norm(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  (FIG_PLACE[lecId] || []).forEach(function(pl){
    var at = pl[level] || pl.full, el = null, i;
    for(i = 0; i < kids.length; i++){ if(norm(kids[i].textContent).indexOf(at) === 0){ el = kids[i]; break; } }
    if(!el) return;
    if(pl.end || /^H[1-6]$/.test(el.tagName)){ var j = kids.indexOf(el) + 1; while(j < kids.length && !/^H[1-6]$/.test(kids[j].tagName)) j++; el = kids[j - 1]; }
    var keys = pl.widget ? [pl.widget] : pl.figs, box = document.createElement('div');
    box.className = 'lec-fig-inline'; box.setAttribute('data-sh-noread', '');
    box.innerHTML = keys.every(function(k){ return ANIMA.meta(k); }) ? keys.map(figCardHTML).join('') : '<div class="fig-grid">' + keys.map(figCardHTML).join('') + '</div>';
    /* several figures after the same paragraph keep their order */
    var after = el; while(after.nextElementSibling && after.nextElementSibling.classList.contains('lec-fig-inline')) after = after.nextElementSibling;
    after.parentNode.insertBefore(box, after.nextSibling);
    keys.forEach(function(k){ placed[k] = 1; });
  });
  var left = (FIG_BY_LEC[lecId] || []).filter(function(k){ return !placed[k] && !(k === 'fence' && placed.cuspMap); });
  if(rest && left.length){ rest.hidden = false; rest.querySelector('.fig-grid').innerHTML = left.map(figCardHTML).join(''); }
  ANIMA.mount(prose.parentNode);
}

function bankFiltered(search){
  var s = (search||'').toLowerCase().trim();
  return QUESTIONS.filter(function(q){
    if(STATE.ui.qlec !== 'all' && q.lec !== STATE.ui.qlec) return false;
    if(STATE.ui.qsrc !== 'all' && q.src !== STATE.ui.qsrc) return false;
    var fm = STATE.ui.qfmt || 'all';
    if(fm !== 'all' && !(fm === 'pbox' ? !!q.pbox : fm === 'multi' ? q.type === 'multi' : q.fmt === fm)) return false;
    var seen = STATE.seen[q.id];
    if(STATE.ui.qstatus === 'unseen' && seen) return false;
    if(STATE.ui.qstatus === 'missed' && !(seen && seen.last === false)) return false;
    if(s){ var hay = (q.stem + ' ' + (q.choices||q.steps||[]).join(' ') + ' ' + (q.pairs ? q.pairs.map(function(p){return p.join(' ');}).join(' ') : '') + ' ' + q.ex + ' ' + (q.pbox ? q.pbox.map(function(r){ return r.join(' '); }).join(' ') : '')).toLowerCase(); if(hay.indexOf(s) === -1) return false; }
    return true;
  });
}
var bankSearch = '';
function renderBank(body){
  var lecOpts = '<option value="all">All lectures</option>' + LECTURES.map(function(l){ return '<option value="'+l.id+'"'+(STATE.ui.qlec===l.id?' selected':'')+'>'+lecLabel(l)+' '+escHtml(l.title)+'</option>'; }).join('');
  var srcOpts = '<option value="all">All sources</option>' + Object.keys(SRC_LABEL).map(function(k){ return '<option value="'+k+'"'+(STATE.ui.qsrc===k?' selected':'')+'>'+SRC_LABEL[k]+'</option>'; }).join('');
  var fmOpts = [['all','Any format'],['2stmt','Two statements'],['tf','True or false'],['numbered','Numbered statements'],['except','EXCEPT / NOT'],['pbox','Patient Box'],['multi','Select all']].map(function(o){ return '<option value="'+o[0]+'"'+((STATE.ui.qfmt||'all')===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  var stOpts = [['all','Any status'],['unseen','Not yet answered'],['missed','Missed last time']].map(function(o){ return '<option value="'+o[0]+'"'+(STATE.ui.qstatus===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
  body.innerHTML = '<div class="cg-host" id="cgHost"></div><div class="qfilters"><select id="fLec" aria-label="Lecture">'+lecOpts+'</select><select id="fSrc" aria-label="Source">'+srcOpts+'</select><select id="fFmt" aria-label="Question format">'+fmOpts+'</select><select id="fSt" aria-label="Status">'+stOpts+'</select><input id="fSearch" type="search" placeholder="Search questions…" value="'+escHtml(bankSearch)+'"><button type="button" class="btn" id="fShuffle">Shuffle</button></div><div class="qcount" id="qCount"></div><div class="qlist" id="qList"></div><div style="text-align:center;margin-top:16px"><button type="button" class="btn" id="qMore" hidden>Show more</button></div>';
  CUSP_GAME.mount(document.getElementById('cgHost'));
  var list = document.getElementById('qList'); wireQuestionContainer(list);
  /* a missed question comes back as a fresh card RETRY_GAP cards further down, so the second try comes while it's fresh
     instead of only through the "Missed last time" filter at the end (student suggestion #10, 2026-10-21). A patient's
     questions stay together: the retry never lands inside a set. Missed again, it comes back again. */
  list.__retry = function(card, q){
    if(list.querySelector('.qcard.is-retry:not(.is-answered)[data-qid="'+q.id+'"]')) return;
    var cards = Array.prototype.filter.call(list.children, function(c){ return c.classList.contains('qcard'); });
    var i = cards.indexOf(card) + RETRY_GAP + 1;
    function pc(c){ var x = c && QUESTIONS_BY_ID[c.getAttribute('data-qid')]; return x && x.pcase; }
    while(i < cards.length && pc(cards[i]) && pc(cards[i]) === pc(cards[i - 1])) i++;
    var box = document.createElement('div'); box.innerHTML = qCardHTML(q, { ctx:'bank', retry:true });
    list.insertBefore(box.firstChild, cards[i] || null);
    if(window.shTrack) window.shTrack('bank:retry-shown');
  };
  var order = null;
  function draw(){
    var qs = bankFiltered(bankSearch);
    if(order){
      var idx = {}; order.forEach(function(id,i){ idx[id]=i; });
      /* a patient's questions stay together, in their own order, where the set's first one landed */
      var rank = function(q){ if(!q.pcase) return idx[q.id]||0; var set = caseSet(q.pcase); return Math.min.apply(null, set.map(function(id){ return idx[id]||0; })) + set.indexOf(q.id) / 100; };
      qs.sort(function(a,b){ return rank(a)-rank(b); });
    }
    document.getElementById('qCount').textContent = qs.length + ' question' + (qs.length===1?'':'s') + (qs.length > bankShown ? ' · showing ' + bankShown : '');
    list.innerHTML = qs.slice(0, bankShown).map(function(q){ return qCardHTML(q); }).join('') || '<div class="rv-empty">No questions match these filters.</div>';
    document.getElementById('qMore').hidden = qs.length <= bankShown;
  }
  document.getElementById('fLec').onchange = function(e){ STATE.ui.qlec = e.target.value; bankShown = BANK_PAGE; saveState(); draw(); };
  document.getElementById('fSrc').onchange = function(e){ STATE.ui.qsrc = e.target.value; bankShown = BANK_PAGE; saveState(); renderBank(body); };
  document.getElementById('fFmt').onchange = function(e){ STATE.ui.qfmt = e.target.value; bankShown = BANK_PAGE; saveState(); draw(); };
  document.getElementById('fSt').onchange = function(e){ STATE.ui.qstatus = e.target.value; bankShown = BANK_PAGE; saveState(); draw(); };
  var t; document.getElementById('fSearch').oninput = function(e){ bankSearch = e.target.value; clearTimeout(t); t = setTimeout(function(){ if(!document.body.contains(list)) return; bankShown = BANK_PAGE; draw(); }, 180); };
  document.getElementById('fShuffle').onclick = function(){ order = shuffled(QUESTIONS.map(function(q){ return q.id; })); draw(); };
  document.getElementById('qMore').onclick = function(){ bankShown += BANK_PAGE; draw(); };
  draw();
}

function sectionCount(sec){
  if(sec.type === 'cards' || sec.type === 'list') return sec.items.length;
  if(sec.type === 'table') return sec.rows.length;
  if(sec.type === 'flows') return seqsOf(sec).length;
  if(sec.type === 'figs') return sec.figs.length;
  return 0;
}
function seqsOf(sec){ return SEQUENCES.filter(function(s){ return !sec.lec || s.lec === sec.lec; }); }
function groupCount(g){ return g.sections.reduce(function(n, s){ return n + sectionCount(s); }, 0); }
function hl(text, term){
  var safe = escHtml(text);
  if(!term) return safe;
  var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}
function cardHTML(c, term){
  return '<div class="rv-card tag-'+tagOf(c.lec)+'"><h4>'+hl(c.name, term)+'</h4>'+(c.sub?'<div class="sub">'+hl(c.sub, term)+'</div>':'')+
    '<dl>'+c.facts.map(function(f){ return '<dt>'+escHtml(f[0])+'</dt><dd>'+hl(f[1], term)+'</dd>'; }).join('')+'</dl>'+
    (c.tip?'<div class="rv-tip">'+icon('bulb')+escHtml(c.tip)+'</div>':'')+
    '<div>'+lecChip(c.lec)+'</div></div>';
}
function tableHTML(sec, rows, term){
  return '<div class="rv-table-wrap"><table class="rv-table"><thead><tr>'+sec.head.map(function(h){ return '<th>'+escHtml(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){ return '<tr>'+r.map(function(cell, i){
      if(sec.head[i] === 'Lecture' && LECTURE_BY_ID[cell]) return '<td>'+lecChip(cell)+'</td>';
      return '<td>'+hl(cell, term)+'</td>'; }).join('')+'</tr>'; }).join('')+
  '</tbody></table></div>';
}
function flowsHTML(seqs, term){
  return '<div class="flows">' + seqs.map(function(s){
    return '<div class="flow tag-'+tagOf(s.lec)+'"><h4>'+hl(s.title, term)+' '+lecChip(s.lec)+'</h4><ol>'+s.steps.map(function(st, i){ return '<li><span class="st"><b>'+(i+1)+'</b><span>'+hl(st, term)+'</span></span></li>'; }).join('')+'</ol></div>';
  }).join('') + '</div>';
}
function sectionHTML(sec, term){
  var t = term ? term.toLowerCase() : '';
  function m(s){ return !t || String(s).toLowerCase().indexOf(t) !== -1; }
  var inner = '';
  if(sec.type === 'cards'){
    var items = sec.items.filter(function(c){ return m(c.name) || m(c.sub) || c.facts.some(function(f){ return m(f[0]) || m(f[1]); }) || m(c.tip); });
    if(!items.length) return '';
    inner = '<div class="rv-cards">' + items.map(function(c){ return cardHTML(c, term); }).join('') + '</div>';
  } else if(sec.type === 'table'){
    var rows = sec.rows.filter(function(r){ return r.some(m); });
    if(!rows.length) return '';
    inner = tableHTML(sec, rows, term);
  } else if(sec.type === 'list'){
    var li = sec.items.filter(m); if(!li.length) return '';
    inner = '<ul class="rv-list">' + li.map(function(x){ return '<li>'+hl(x, term)+'</li>'; }).join('') + '</ul>';
  } else if(sec.type === 'figs'){
    var fk = sec.figs.filter(function(k){ var am = ANIMA.meta(k); return k === 'cuspMap' ? m('What cusp hits where: fence post, contacts, Class I II III') : am ? m(am.title) || m(am.caption) : m(FIGS[k].title) || m(FIGS[k].caption); }); if(!fk.length) return '';
    var fa = fk.filter(function(k){ return ANIMA.meta(k); }), fs = fk.filter(function(k){ return !ANIMA.meta(k); });
    inner = fa.map(figCardHTML).join('') + (fs.length ? '<div class="fig-grid">' + fs.map(figCardHTML).join('') + '</div>' : '');
  } else if(sec.type === 'flows'){
    var seqs = seqsOf(sec).filter(function(s){ return m(s.title) || s.steps.some(m); }); if(!seqs.length) return '';
    inner = flowsHTML(seqs, term);
  }
  return '<section class="rv-section">' + (sec.title ? '<h3>'+escHtml(sec.title)+'</h3>' : '') + inner + '</section>';
}

/* ===================================================================
   MOCK EXAM: 55 questions in 90 minutes, as on Exam 1 (blueprint and limit are in the data above)
   =================================================================== */
function buildMock(){
  var ids = [];
  Object.keys(MOCK_BLUEPRINT).forEach(function(lec){
    var pool = (QUESTIONS_BY_LECTURE[lec]||[]).filter(function(q){ return q.type === 'mcq'; });
    var fresh = shuffled(pool.filter(function(q){ return !STATE.seen[q.id] || STATE.seen[q.id].last === false; }));
    var rest = shuffled(pool.filter(function(q){ return fresh.indexOf(q) === -1; }));
    fresh.concat(rest).slice(0, MOCK_BLUEPRINT[lec]).forEach(function(q){ ids.push(q.id); });
  });
  var order = {}; ids.forEach(function(id){ order[id] = choiceOrder(QUESTIONS_BY_ID[id]); });
  STATE.mock = { ids: shuffled(ids), t0: Date.now(), picks: {}, order: order, res: {}, submitted: false };
  saveState();
}
var mockTimer = null;
/* Exam-style: pick an answer for every question (no feedback), then Submit to score it and
   review each card. Picks are saved in STATE.mock so a reload keeps your place. */
function mockTotal(){ return Object.keys(MOCK_BLUEPRINT).reduce(function(n,k){ return n + MOCK_BLUEPRINT[k]; }, 0); }
function renderMock(body){
  clearInterval(mockTimer);
  var m = STATE.mock;
  if(m && !m.picks){ /* a mock started before exam mode: keep it only if it was already finished */

    else { STATE.mock = m = null; }

  }
  var total = mockTotal();
  if(!m || !m.ids || !m.ids.length){
    body.innerHTML = '<div class="reading" style="max-width:760px"><h2>Mock Exam</h2><p>'+total+' questions, as many as Exam 1 has, spread over all ten lectures (there are no official counts per lecture, so each gets 4 to 7). Two-statement, true/false, numbered-statement and Patient Box items are included. Questions you haven\'t seen or missed last time are picked first.</p><p>It runs like the real thing: choose an answer for each question with no feedback, then submit. Exam 1 gives you 90 minutes, so the clock counts against 90:00 and turns red past it. Then review every card with its explanation.</p><div class="reading-actions"><button type="button" class="btn primary" id="mockStart">Start the '+total+'-question mock</button></div></div>';
    document.getElementById('mockStart').onclick = function(){ buildMock(); renderMock(body); };
    return;
  }
  var picked = Object.keys(m.picks).length;
  var correct = m.submitted ? m.ids.filter(function(id){ return m.res[id]; }).length : 0;
  var h = '<div class="qfilters" style="padding:4px 0"><span class="pill" id="mockClock">'+icon('clock')+'0:00</span>' +
    (m.submitted ? '<span class="pill countdown">Score '+correct+' / '+m.ids.length+' · '+Math.round(correct/m.ids.length*100)+'%</span>' +
                   '<button type="button" class="btn" id="mockMissed" aria-pressed="'+(!!m.onlyMissed)+'">'+(m.onlyMissed?'Show all questions':'Show only missed')+'</button>'
                 : '<span class="pill" id="mockProg">'+picked+' / '+m.ids.length+' answered</span><button type="button" class="btn primary" id="mockSubmit" data-mock-submit>Submit exam</button>') +
    '<button type="button" class="btn" id="mockNew">New mock</button></div>';
  if(m.submitted){
    h += '<div class="rv-table-wrap" style="margin-bottom:24px"><table class="rv-table"><thead><tr><th>Lecture</th><th>Correct</th><th>Score</th></tr></thead><tbody>' +
      Object.keys(MOCK_BLUEPRINT).map(function(lec){
        var qs = m.ids.filter(function(id){ return QUESTIONS_BY_ID[id] && QUESTIONS_BY_ID[id].lec === lec; });
        var c = qs.filter(function(id){ return m.res[id]; }).length;
        return '<tr><td>'+lecChip(lec)+'</td><td>'+c+' / '+qs.length+'</td><td>'+(qs.length?Math.round(c/qs.length*100):0)+'%</td></tr>';
      }).join('') + '</tbody></table></div>';

  /* ---------- context for the shared games (widget/games.js) ---------- */
  function arcadeQ(q){ return q.type === 'mcq' && !q.pbox && !q.img && !q.pimg && q.fmt !== '2stmt' && q.fmt !== 'tf' && q.fmt !== 'numbered'; }

  function bankPool(scope){
    if(scope === 'missed') return QUESTIONS.filter(function(q){ var s = STATE.seen[q.id]; return arcadeQ(q) && !!s && s.last === false; });
    var ids = scopeIds(scope); return QUESTIONS.filter(function(q){ return arcadeQ(q) && ids.indexOf(q.lec) > -1; });
  }
  function notesFor(scope){ return scopeIds(scope).map(function(id){ return { lec:id, html:READINGS[id] || '' }; }); }

  function termPool(scope, filter){
    var ids = scopeIds(scope), out = [], seen = {};
    function add(w, c, lec){ var W = String(w).toUpperCase().replace(/[^A-Z]/g, ''); var t = { w:W, c:c, lec:lec }; if(!W || seen[W] || (filter && !filter(t))) return; seen[W] = 1; out.push(t); }
    QUESTIONS.forEach(function(q){ if(arcadeQ(q) && ids.indexOf(q.lec) > -1 && /^[A-Za-z]+$/.test(q.choices[0]) && q.stem.length <= 130) add(q.choices[0], q.stem, q.lec); });
    if(window.shGames) window.shGames.clozePool(notesFor(scope)).forEach(function(it){ if(/^[A-Za-z]+$/.test(it.term) && it.text.length <= 160) add(it.term, it.text.replace(new RegExp(it.term, 'ig'), '___'), it.lec); });
    return out;
  }

    if(kind === 'cloze' && !window.shGames) kind = 'terms';

    var opts = [['all', 'All lectures']].concat(kind === 'bank' ? [['missed', 'Questions I missed']] : []).concat(LECTURES.map(function(l){ return [l.id, lecName(l.id)]; }))
      .filter(function(o){ return o[0] === 'all' || count(o[0]) >= (min || 6); });

  };
  var CTX = { A:STATE.arcade, bankPool:bankPool, termPool:termPool, notes:notesFor, scopeSelectHTML:scopeSelectHTML, currentScope:currentScope,
    shell:sharedShell, setHud:setHud, introHTML:introHTML, finish:sharedFinish, lecName:lecName, lecOrder:LECTURES.map(function(l){ return l.id; }),
    record:function(q, ok, choice){ recordAnswer(q.id, q.lec, ok, 'arcade', choice); },
    skin:ENDO_SKIN,
    SFX:{ good:sGood, bad:sBad, tick:function(){ beep(880, .03, 'square', .025); }, over:function(){}, win:function(){ [523, 659, 784, 1047].forEach(function(f, i){ setTimeout(function(){ beep(f, .12); }, i * 90); }); } } };

  /* =================================================================== SORT STORM */
  function SortStorm(){
    var g = GAMES[0], root, stage, cardEl, bins, raf = null, last = 0;
    var st = null;
    function pickSet(){
      var choice = STATE.arcade.sortSet;
      if(choice !== 'mix'){ var s = SORT_SETS.filter(function(x){ return x.id === choice; })[0]; if(s) return s; }
      var pool = SORT_SETS.filter(function(x){ return !st || !st.set || x.id !== st.set.id; });
      return pool[Math.floor(Math.random()*pool.length)];
    }
    function newWave(){
      st.set = pickSet(); st.queue = shuffled(st.set.items).slice(0, 8); st.wave++;
      bins.forEach(function(b, i){ b.querySelector('span').textContent = st.set.bins[i]; });
      root.querySelector('.ss-banner').textContent = st.set.title.toUpperCase();
    }
    function nextCard(){
      if(!st.queue.length) newWave();
      st.cur = st.queue.shift(); st.y = 46; st.busy = false;
      cardEl.className = 'ss-card'; cardEl.style.transition = 'none'; cardEl.style.opacity = '1';
      cardEl.textContent = st.cur[0];
      cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
    }
    function floorY(){ return stage.clientHeight - 130 - cardEl.offsetHeight; }
    function pop(txt, color, x, y){ var p = document.createElement('div'); p.className = 'ss-pop'; p.style.color = color; p.style.left = x + 'px'; p.style.top = y + 'px'; p.textContent = txt; stage.appendChild(p); setTimeout(function(){ p.remove(); }, 800); }
    function judge(binIdx){
      if(!st || !st.running || st.busy || !st.cur) return;
      st.busy = true;
      var ok = binIdx === st.cur[1];
      var bin = bins[binIdx < 0 ? st.cur[1] : binIdx];
      if(binIdx >= 0){
        var dx = binIdx === 0 ? -stage.clientWidth/4 : stage.clientWidth/4;
        cardEl.style.transition = 'transform .22s ease-in, opacity .22s';
        cardEl.style.transform = 'translate(calc(-50% + '+dx+'px),' + (stage.clientHeight - 100) + 'px) scale(.6)';
        cardEl.style.opacity = '.2';
      }
      if(ok){
        st.combo++; st.correct++;
        var pts = 50 + Math.round(50 * Math.max(0, 1 - st.y / floorY())) ;
        pts *= (1 + Math.floor(st.combo / 4));
        st.score += pts; sGood();
        bin.classList.add('flash-good'); pop('+' + pts + (st.combo >= 4 ? ' x' + (1 + Math.floor(st.combo/4)) : ''), '#7ee36b', bin.offsetLeft + 20, bin.offsetTop - 20);
        if(st.correct % 6 === 0){ st.level++; st.speed += 9; pop('SPEED UP!', '#ffd23f', stage.clientWidth/2 - 50, 80); }
      } else {
        st.combo = 0; st.lives--; sBad();
        (binIdx >= 0 ? bins[binIdx] : bins[st.cur[1]]).classList.add('flash-bad');
        st.missed.push({ q: st.cur[0] + ' (' + st.set.title.replace('?','') + ')', a: st.set.bins[st.cur[1]] });
        pop(binIdx < 0 ? 'TOO SLOW' : 'MISS', '#ff5c8a', stage.clientWidth/2 - 30, st.y + 40);
      }
      hud(root, { score: st.score, lives: hearts(st.lives), level: st.level });
      setTimeout(function(){
        bins.forEach(function(b){ b.classList.remove('flash-good','flash-bad'); });
        if(!st || !st.running) return;
        if(st.lives <= 0) return over();
        nextCard();
      }, binIdx < 0 ? 450 : 260);
    }
    function loop(t){
      if(!st || !st.running) return;
      var dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
      if(!st.busy && st.cur){
        st.y += (st.fast ? st.speed * 4 : st.speed) * dt;
        cardEl.style.transform = 'translate(-50%,' + st.y + 'px)';
        if(st.y >= floorY()) judge(-1);
      }
      raf = requestAnimationFrame(loop);
    }
    function start(){
      var ov = root.querySelector('[data-overlay]'); if(ov) ov.remove();
      st = { running:true, score:0, lives:3, level:1, combo:0, correct:0, speed:52, wave:0, set:null, queue:[], missed:[], fast:false };
      hud(root, { score:0, lives:hearts(3), level:1 });
      newWave(); nextCard(); last = 0; raf = requestAnimationFrame(loop);
    }
    function over(){
      st.running = false; cancelAnimationFrame(raf);
      var best = finish(g, st.score);
      stage.insertAdjacentHTML('beforeend', gameOverHTML(g, st.score, best, st.missed));
      hud(root, { best: STATE.arcade.best[g.id] });
    }
    function onKey(e){
      if(!st || !st.running) { if((e.key === 'Enter' || e.key === ' ') && root.querySelector('[data-start]')){ e.preventDefault(); start(); } return; }
      if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ e.preventDefault(); judge(0); }
      else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ e.preventDefault(); judge(1); }
      else if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){ e.preventDefault(); st.fast = true; }
    }
    function onKeyUp(e){ if(st && (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S')) st.fast = false; }
    return {
      mount: function(p){
        var opts = '<option value="mix"'+(STATE.arcade.sortSet==='mix'?' selected':'')+'>Shuffle all sorts</option>' + SORT_SETS.map(function(s){ return '<option value="'+s.id+'"'+(STATE.arcade.sortSet===s.id?' selected':'')+'>'+escHtml(s.title)+'</option>'; }).join('');
        p.innerHTML = shell(g, '<label for="ssSet">Sort:</label><select id="ssSet">'+opts+'</select>',
          '<div class="gm-stage ss-stage"><div class="ss-banner"></div><div class="ss-card" id="ssCard"></div><div class="ss-danger"></div><div class="ss-bins"><button type="button" class="ss-bin" style="--bc:var(--ar-yellow)" data-bin="0"><span></span><kbd>← / A</kbd></button><button type="button" class="ss-bin" style="--bc:var(--ar-pink)" data-bin="1"><span></span><kbd>→ / D</kbd></button></div>' +
            overlayHTML(g, 'FEEDBACK SORT', 'Each card belongs in one of two bins. Press ← or → (or tap a bin) before it crosses the dashed line. Hold ↓ to drop faster for bonus points. Streaks of 4 multiply your score.', 'START') + '</div>',
          '<kbd>←</kbd> <kbd>→</kbd> sort · <kbd>↓</kbd> fast drop · tap a bin on mobile');
        root = p.querySelector('.gm'); stage = p.querySelector('.ss-stage'); cardEl = p.querySelector('#ssCard'); bins = [].slice.call(p.querySelectorAll('.ss-bin'));
        var preview = SORT_SETS.filter(function(s){ return s.id === STATE.arcade.sortSet; })[0] || SORT_SETS[0];
        bins.forEach(function(b,i){ b.querySelector('span').textContent = preview.bins[i]; });
        cardEl.textContent = '?';
        bindCommon(root);
        stage.addEventListener('click', function(e){ var b = e.target.closest('[data-bin]'); if(b) judge(+b.getAttribute('data-bin')); if(e.target.closest('[data-start]')) start(); });
        p.querySelector('#ssSet').addEventListener('change', function(e){ STATE.arcade.sortSet = e.target.value; saveState(); if(st && st.running){ st.set = null; st.queue = []; } var s = SORT_SETS.filter(function(x){ return x.id === e.target.value; })[0]; if(s) bins.forEach(function(b,i){ b.querySelector('span').textContent = s.bins[i]; }); });
        document.addEventListener('keydown', onKey); document.addEventListener('keyup', onKeyUp);
      },
      stop: function(){ if(st) st.running = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onKeyUp); }
    };
  }

  return { renderLobby:renderLobby, stopAll:stopAll, startGame:startGame, current:function(){ return active ? activeId : null; } };
})();

/* ---------- theme toggle ---------- */
function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
}
function boot(){
  /* sh_theme is the site-wide choice shared with the dashboard */
  var saved = null; try{ saved = localStorage.getItem('sh_theme'); }catch(e){}
  if(saved !== 'light' && saved !== 'dark') saved = null;
  document.querySelectorAll('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  applyTheme(saved);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = !cur ? 'light' : cur === 'light' ? 'dark' : null;
    try{ localStorage.setItem('sh_theme', next || ''); }catch(e){}
    applyTheme(next);
  });
  document.querySelectorAll('#modeSwitch [data-mode]').forEach(function(b){ b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); }); });
  renderHeaderStats();
  var m = STATE.ui.mode; if(['home','compendium','review','arcade'].indexOf(m) === -1) m = 'home';
  setMode(m);
}
/* Section label for the shared widget's per-section time tracking (adds the arcade game). */
window.SH_SECTION = function(){
  var m = STATE.ui.mode;
  if(m === 'home') return 'home/dashboard';
  if(m === 'compendium') return 'compendium/' + STATE.ui.sub;
  if(m === 'review') return 'review/' + STATE.ui.group;
  if(m === 'arcade') return 'arcade/' + (ARCADE.current() || 'lobby');
  return m;
};
/* the markup above is already parsed, so render now; the deferred widget and supabase scripts load after */
boot();

/* ---------- full-content search for the shared widget: every note paragraph, review row,
   exam hint and cram line, each with a place to jump to (window.SH_GOTO) ---------- */
function shSearchSections(){
  var out = [];
  function frag(html){ var d = document.createElement('div'); d.innerHTML = html || ''; return d; }
  function clean(t){ return String(t || '').replace(/\s+/g, ' ').trim(); }
  LECTURES.forEach(function(l){
    var where = lecLabel(l) + ' ' + l.title;
    Array.prototype.forEach.call(frag(READINGS[l.id]).querySelectorAll('p, li, h3, h4'), function(el, k){
      var t = clean(el.textContent); if(t.length > 2) out.push({ kind:'Notes', where:where, text:t, lec:l.id, go:{ v:'notes', lec:l.id, k:k } });
    });
    (CRAM[l.id] || []).forEach(function(b){ out.push({ kind:'Cram sheet', where:where, text:b, lec:l.id, go:{ v:'cram', lec:l.id } }); });
  });
  HINTS.forEach(function(x){ var l = LECTURE_BY_ID[x.lec]; out.push({ kind:'Exam hints', where:l ? ''+lecLabel(l)+' '+l.title : '', text:clean(x.quote + ' ' + x.take), lec:x.lec, go:{ v:'hints', lec:x.lec } }); });
  REVIEW.forEach(function(g){
    g.sections.forEach(function(sec){
      if(sec.type === 'cards') sec.items.forEach(function(c){ out.push({ kind:'Review', where:g.title, title:c.name, text:clean(c.name + ' ' + c.sub + ' ' + c.facts.map(function(f){ return f[0] + ': ' + f[1]; }).join('; ') + ' ' + c.tip), go:{ v:'review', q:c.name } }); });
      else if(sec.type === 'table') sec.rows.forEach(function(r){ out.push({ kind:'Review', where:g.title + (sec.title ? ' · ' + sec.title : ''), title:r[0], text:clean(r.join(' · ')), go:{ v:'review', q:r[0] } }); });
      else if(sec.type === 'list') sec.items.forEach(function(it){ out.push({ kind:'Review', where:g.title, text:clean(it), go:{ v:'review', q:clean(it).split(' ').slice(0, 4).join(' ') } }); });
    });
  });
  SEQUENCES.forEach(function(sq){ var sg = REVIEW.filter(function(x){ return x.lec === sq.lec; })[0]; out.push({ kind:'Review', where:(sg ? sg.title + ' · ' : '') + 'Processes', title:sq.title, text:clean(sq.title + ': ' + sq.steps.join(' → ')), go:{ v:'review', q:sq.title } }); });
  return out;
}
function shFlashIn(sel){ setTimeout(function(){ var el = typeof sel === 'string' ? document.querySelector(sel) : sel(); if(el && window.shFlash) window.shFlash(el); }, 60); }
window.SH_GOTO = function(g){
  if(!g) return;
  if(g.v === 'notes'){ STATE.ui.lec = g.lec; STATE.ui.sub = 'notes'; STATE.ui.level = 'full'; saveState(); setMode('compendium');
    shFlashIn(function(){ var p = document.querySelector('#compBody .reading-prose'); return p && Array.prototype.filter.call(p.querySelectorAll('p, li, h3, h4'), function(el){ return !el.closest('[data-sh-noread]'); })[g.k]; }); }
  else if(g.v === 'cram'){ STATE.ui.sub = 'cram'; saveState(); setMode('compendium'); shFlashIn('#cram-' + g.lec); }
  else if(g.v === 'hints'){ STATE.ui.sub = 'hints'; saveState(); setMode('compendium');
    shFlashIn(function(){ var a = document.querySelector('#compBody .hint-group [data-lec="' + g.lec + '"]'); return a && a.closest('.hint-group'); }); }
  else if(g.v === 'review'){ reviewSearch = g.q || ''; setMode('review'); }
  else if(g.v === 'bank'){ STATE.ui.sub = 'bank'; STATE.ui.qlec = 'all'; STATE.ui.qsrc = 'all'; STATE.ui.qfmt = 'all'; STATE.ui.qstatus = 'all'; bankSearch = g.q || ''; bankShown = BANK_PAGE; saveState(); setMode('compendium'); }
};

/* Progress sync (widget/v3.js, migration_v34): the widget reads back every answer saved for you on the server,
   including from your linked devices, and hands each question's totals here. Keep whichever copy has more tries,
   so answers made only on this device are never lost. */
var SYNC_LOADED = Date.now();
window.SH_SYNC = {
  merge: function(byQid, days){
    var changed = false, added = 0;
    Object.keys(byQid).forEach(function(id){
      var q = QUESTIONS_BY_ID[id]; if(!q) return;
      var sv = byQid[id], s = STATE.seen[id] || { n:0, c:0, last:null };
      if(sv.n <= s.n) return;
      var dn = sv.n - s.n, dc = Math.max(0, sv.c - s.c);
      if(!s.n) added++;
      STATE.totalAnswered += dn; STATE.totalCorrect += dc;
      var ls = STATE.lecStats[q.lec] || { a:0, c:0 }; ls.a += dn; ls.c += dc; STATE.lecStats[q.lec] = ls;
      STATE.seen[id] = { n:sv.n, c:Math.max(sv.c, s.c), last:sv.last };
      changed = true;
    });
    (days || []).forEach(function(d){ if(STATE.days.indexOf(d) === -1){ STATE.days.push(d); changed = true; } });
    if(!changed) return;
    STATE.days.sort();
    checkAchievements(); saveState(); renderHeaderStats();
    if(added) toast('Synced ' + added + ' question' + (added === 1 ? '' : 's') + ' from your other devices', 'check');
    /* redraw the page only right after it opens, so nobody loses a question they're in the middle of */
    if(Date.now() - SYNC_LOADED < 8000 && !(window.shTTS && window.shTTS.listening && window.shTTS.listening())){ if(STATE.ui.mode === 'home') renderHome(); else if(STATE.ui.mode === 'compendium' && STATE.ui.sub !== 'mock') renderCompendium(); }
  }
};

/* Daily drill (widget/drill.js): the widget picks each day's questions from this pool and asks the hub to
   draw each card, so answers go through recordAnswer like anywhere else. */
window.SH_DRILL = {
  pool: function(){
    return QUESTIONS.map(function(q){ var s = STATE.seen[q.id]; return { id:q.id, lec:q.lec, last: s ? !!s.last : null, hy: DRILL_HY[q.src] || '' }; });
  },
  render: function(el, qid){ var q = QUESTIONS_BY_ID[qid]; if(!q) return false; el.innerHTML = qCardHTML(q, { ctx:'drill' }); wireQuestionContainer(el); return true; }
};

/* Published for the shared widget (search + toughest-questions labels) — see widget/v3.js. */
window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id:l.id, title:''+lecLabel(l)+' ' + l.title, who:l.who, status:l.status }; }),
  questions: QUESTIONS.map(function(q){
    var hint = q.type === 'mcq' ? q.choices[q.answer] : q.type === 'multi' ? q.correct.map(function(k){ return q.choices[k]; }).join('; ') : q.type === 'sequence' ? q.steps.join(' → ') : q.pairs.map(function(p){ return p.join(': '); }).join('; ');
    if(q.ex) hint += ' — ' + q.ex;
    return { id:q.id, lec:q.lec, text:q.stem, hint:hint, choices:q.choices || null, answer:(q.type === 'mcq' ? q.answer : null) };
  }),
  sections: shSearchSections(),
  hints: HINTS.map(function(x){ return { lec:x.lec, quote:x.quote }; }),
  exams: [ { label:'Exam 1', date:EXAM_DATE } ]
};

})();
