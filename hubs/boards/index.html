/* ==== css/tokens.css ==== */

   Token names follow the other hubs (--surface, --ink, --line, --accent...) because widget/v3.css reads them;
   --card is an alias for older widget rules. Theme: sh_theme (system / light / dark) sets <html data-theme>. */
:root{
  color-scheme: light;
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eaefee; --surface-3:#dbe3e2; --card:var(--surface);
  --ink:#17212b; --ink-soft:#46525e; --ink-faint:#68737e; --line:#d9e1e0; --line-strong:#bccaca;
  --accent:#17666f; --accent-ink:#11545c; --accent-soft:#d8ecee; --on-accent:#ffffff;
  --good:#2c7a4b; --good-soft:#dcefe3; --bad:#b4372f; --bad-soft:#f7dcd8; --caution:#946013; --caution-soft:#f5e8cc;
  --tag-amber:#a8701a; --tag-sage:#57834f; --tag-blue:#2f62a8; --tag-teal:#1f7f78; --tag-violet:#6a4fa5; --tag-red:#b3352d; --tag-green:#4d7a22; --tag-rose:#b9436a;
  --tag-amber-soft:#f5e6c8; --tag-sage-soft:#e1ecdc; --tag-blue-soft:#dce6f4; --tag-teal-soft:#d5ecea; --tag-violet-soft:#e7e0f3; --tag-red-soft:#f6dbd7; --tag-green-soft:#e2ecd2; --tag-rose-soft:#f5dbe3;
  --c-boards:#17666f; --c-boards-soft:#d8ecee;
  --shadow:0 1px 2px rgba(23,33,43,.06), 0 4px 14px rgba(23,33,43,.07);
  --radius:12px;
  --font-display:'Literata', Georgia, serif;
  --font-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){

    color-scheme: dark;
    --bg:#10161b; --surface:#172027; --surface-2:#1e2931; --surface-3:#28353e; --card:var(--surface);

  --ink:#e8eef1; --ink-soft:#b3bfc6; --ink-faint:#8a979f; --line:#2a3740; --line-strong:#3c4c56;

/* ==== css/base.css ==== */
/* Boards hub base: page, header, mode tabs, sub-tabs, panels, buttons, empty states. */
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important;} }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent-ink)}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono)}
.ic{width:18px;height:18px;flex:none}

/* ---------- header ---------- */
#app{max-width:1120px;margin:0 auto;padding:0 20px 60px}
.hub-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px;padding:10px 20px}
.hub-header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hub-title{display:flex;align-items:center;gap:10px;min-width:0}
.hub-title h1{font-family:var(--font-display);font-weight:700;font-size:1.4rem;letter-spacing:-.01em;margin:0;white-space:nowrap}
.hub-subtitle{color:var(--ink-soft);font-size:.82rem;font-family:var(--font-mono);white-space:nowrap}
.hub-back-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.hub-back-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.hub-back-btn svg{width:16px;height:16px}
.hub-name-pill{appearance:none;cursor:pointer;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700}
.hub-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;color:var(--ink-soft);white-space:nowrap}
.exam-pill{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
.theme-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.theme-btn .ic{width:16px;height:16px}

/* ---------- mode tabs ---------- */
#modeSwitch{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px;min-width:0;flex:0 1 auto}
#modeSwitch button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
#modeSwitch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#modeSwitch button:hover{color:var(--ink)}
#modeSwitch .mode-icon{display:inline-flex}
#modeSwitch .mode-icon .ic{width:16px;height:16px}
@media (max-width: 1000px){ #modeSwitch button{padding:6px 9px} }

main{padding-top:22px}
.hub-footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.82rem}

/* ---------- panels ---------- */
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-head h2{font-family:var(--font-display);font-size:1.5rem;line-height:1.2;margin:0}
.panel-head p{margin:4px 0 0;color:var(--ink-soft);max-width:68ch}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.subtab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--ink-soft)}
.subtab.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.box + .box{margin-top:14px}
.box h3{font-family:var(--font-display);font-size:1.15rem;margin:0 0 6px}
.box p{margin:0 0 10px;max-width:72ch}
.box p:last-child{margin-bottom:0}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint);font-size:.86rem}

.empty{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:22px 24px}
.empty .ic{width:30px;height:30px;color:var(--accent);margin-top:2px}
.empty h3{font-family:var(--font-display);font-size:1.15rem;margin:0 0 6px}
.empty p{margin:0 0 8px;color:var(--ink-soft);max-width:66ch}
.empty p:last-child{margin-bottom:0}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 15px;cursor:pointer;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.unit-card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;min-width:0}
.unit-card.is-preview{border-left-color:var(--line-strong)}
.unit-card h4{margin:0;font-size:1rem}
.unit-card .faint{margin:0}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent-ink)}

.field{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--ink-soft);font-weight:700}
.field select{font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;max-width:100%}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}

#toastHost{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow)}

/* ==== css/cards.css ==== */
/* Item card (minimal standalone MCQ; the full card with cases, cover-the-options and Report comes in int-cards). */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.qcard-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pbox{border:1px solid var(--line-strong);border-radius:10px;margin:0 0 12px;overflow:hidden}
.pbox dl{margin:0;display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr)}
.pbox dt{font-weight:700;font-size:.82rem;color:var(--ink-soft);background:var(--surface-2);padding:7px 10px;border-top:1px solid var(--line)}
.pbox dd{margin:0;padding:7px 10px;border-top:1px solid var(--line);font-size:.92rem}
.pbox dt:first-of-type,.pbox dd:first-of-type{border-top:0}
.pbox ul{margin:0;padding-left:18px}
.qcard-stem{font-weight:700;margin:0 0 12px;white-space:pre-line}
.qcard-choices{display:flex;flex-direction:column;gap:8px}
.qchoice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.qchoice:hover:not(:disabled){border-color:var(--accent)}
.qchoice:disabled{cursor:default}
.qchoice .lt{font-family:var(--font-mono);font-weight:600;color:var(--ink-faint);flex:none}
.qchoice[data-state="right"]{border-color:var(--good);background:var(--good-soft)}
.qchoice[data-state="wrong"]{border-color:var(--bad);background:var(--bad-soft)}
.qchoice[data-state="selected"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.qcard-show-options{margin:0 0 12px}
.qx{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.94rem}
.qx-verdict{font-weight:700;margin:0 0 6px}
.qx-verdict.right{color:var(--good)}
.qx-verdict.wrong{color:var(--bad)}
.qx-verdict.review{color:var(--accent-ink)}
.qx p{margin:0 0 8px}
.qx-why{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.qx-why li{padding:6px 10px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.qx-why li.is-picked{outline:2px solid var(--line-strong)}
.qx-why li.is-key{background:var(--good-soft)}
.qx-cue{background:var(--caution-soft);border-left:3px solid var(--caution);padding:8px 12px;border-radius:6px}
.qx-refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.qx-class{margin:10px 0 0!important;color:var(--ink-soft);font-size:.86rem}

.bank-check{display:flex;align-items:center;gap:7px;padding:7px 0;color:var(--ink-soft);font-size:.86rem;font-weight:700}
.bank-check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.bank-section-title{font-family:var(--font-display);font-size:1.1rem;margin:20px 0 10px}
.missed-case-list,.case-list{display:flex;flex-direction:column;gap:10px}
.case-list-card,.missed-case{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.case-list-card h3,.missed-case h4{margin:8px 0 3px;font-size:1rem}
.case-list-actions{display:flex;align-items:center;gap:8px}
.case-list-card p,.missed-case p{margin:0 0 4px;color:var(--ink-soft)}
.case-view{min-width:0}
.case-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.case-title h3{font-family:var(--font-display);font-size:1.2rem;margin:0}
.case-title p{margin:4px 0 0}
.case-layout{display:grid;grid-template-columns:minmax(250px, 0.72fr) minmax(0, 1.6fr);align-items:start;gap:16px}
.case-chart{position:sticky;top:14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.case-chart summary{display:none}
.case-chart-body{padding:16px}
.case-chart-body>h3{font-family:var(--font-display);font-size:1.05rem;margin:0 0 10px}
.case-chart .pbox{margin:0}
.case-chart .pbox dl{grid-template-columns:minmax(0,1fr)}
.case-chart .pbox dd{border-top:0;padding-top:0}
.case-chart .qfig{margin-top:12px}
.case-content{min-width:0}
.case-title+.case-layout{margin-top:0}
.case-stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.case-controls{justify-content:flex-end}
.case-rounds>h3{font-family:var(--font-display);font-size:1.2rem;margin:0 0 4px}
.case-rounds>p{margin:0 0 12px}
.case-round-items{display:flex;flex-direction:column;gap:12px}
.case-round-item{min-width:0}
.case-round-item>h4{font-size:.92rem;color:var(--ink-soft);margin:0 0 6px}
.case-round-item .qcard{padding:15px 17px}

/* ==== css/notes.css ==== */
/* Notes (minimal reader; int-notes-home adds tables in recall mode, refs chips and practice links). */
.notes-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}
.unit-nav{display:flex;flex-direction:column;gap:6px;min-width:0}
.unit-nav button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:700;font-size:.9rem}
.unit-nav button.is-active{border-color:var(--ink);box-shadow:var(--shadow)}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.reading h2{font-family:var(--font-display);font-size:1.35rem;margin:24px 0 8px;line-height:1.25}
.reading section:first-of-type h2{margin-top:0}
.reading h3{font-size:1.02rem;margin:18px 0 6px}
.reading p{margin:0 0 12px;max-width:74ch}
.reading aside.hy{background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin-bottom:18px}
.reading aside.hy h3{margin-top:0}
.reading table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0 16px;display:block;overflow-x:auto}
.reading caption{text-align:left;font-weight:700;padding-bottom:6px}
.reading th,.reading td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.reading th{background:var(--surface-2)}
.reading .ref{display:inline-block;font-family:var(--font-mono);font-size:.7rem;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);vertical-align:1px}
.reading .ref::before{content:attr(data-ref)}
.reading footer.sources{font-size:.78rem;color:var(--ink-faint);margin:6px 0 18px}
.reading figure{margin:12px 0}
.reading figure svg{max-width:100%;height:auto}

/* ==== css/phone.css ==== */
/* Phone: mode tabs get their own labeled row (as perio), nothing under the widget's bottom bar or in Timmy's corner. */
@media (max-width: 760px){
  .notes-layout{grid-template-columns:minmax(0,1fr)}
  .unit-nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .unit-nav button{flex:none}
  .case-layout{grid-template-columns:minmax(0,1fr)}
  .case-chart{position:static;scroll-margin-top:130px}
  .case-chart summary{display:list-item;cursor:pointer;font-weight:700;color:var(--ink);padding:12px 15px}
  .case-chart[open] summary{border-bottom:1px solid var(--line)}
  .case-chart-body{padding:12px;max-height:38vh;overflow-y:auto;overscroll-behavior:contain}
}
@media (max-width: 560px){
  #app{padding:0 16px calc(var(--sh-tabbar-h, 60px) + 40px)}
  .hub-header{margin:0 -16px;padding:8px 16px}
  .hub-header-top{flex-wrap:wrap;row-gap:6px}
  .hub-title{flex:1 1 auto}
  .hub-title h1{font-size:1.2rem}
  .hub-subtitle{display:none}
  .exam-pill{display:none}
  #modeSwitch{order:3;flex:1 0 100%;border-radius:12px}

<div id="toastHost" aria-live="polite"></div>
<script>
'use strict';
(function(){
/* ==== data (generated from src/boards: units, facts, figures) ==== */
window.SH_SRS = {"steps":[1,3,7,14,30,60,120],"examCap":false,"v":"boards-1","fuzz":0.1,"server":true};
var CONFIG = {"hub":"boards","title":"Boards Hub","subtitle":"INBDE + ADEX","examNote":"INBDE + ADEX ~Aug 2028","stateKey":"boards-state-v1","enabledTypes":["mcq"],"budget":{"daily":12,"newPerDay":4,"governor":0.8,"retireStep":120,"retireStreak":3,"retiredSamplePerMonth":4},"mock":{"standaloneSec":63,"caseSec":95},"modes":[{"id":"home","label":"Today","subs":[["today","Today"],["readiness","Readiness"]]},{"id":"notes","label":"Notes","subs":[["core","Core"],["deep","Deep dive"]]},{"id":"bank","label":"Questions","subs":[["practice","Practice"],["cases","Cases"],["missed","Missed"]]},{"id":"mock","label":"Exam blocks","subs":[["setup","Set up a block"],["review","Past blocks"]]},{"id":"arcade","label":"Clinic","subs":[]}],"drafts":false};
var LECTURES = [];
var QUESTIONS = [];
var CASES = [];
var READINGS = {};
var READINGS_DEEP = {};
var READINGS_PLAIN = {};
var SECTIONS = [];
var REFS = {};
var FIGURES = {};
var GAME_BUNDLES = {};

/* ==== app/00-util.js ==== */
/* Small helpers shared by every app file. The build concatenates src/boards/app/*.js in name order into one IIFE,
   after the data vars (CONFIG, LECTURES, QUESTIONS, CASES, READINGS, READINGS_DEEP, SECTIONS, REFS, FIGURES). */

function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function dateKey(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayKey(){ return dateKey(new Date()); }

/* seeded random (mulberry32 over a string hash), for anything that must repeat for the same seed */
function hashStr(s){ var h = 2166136261; s = String(s); for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ var a = typeof seed === 'number' ? seed >>> 0 : hashStr(seed); return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffled(arr, rand){ var a = arr.slice(), r = rand || Math.random; for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(n, d){ return d ? Math.round(100 * n / d) : 0; }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }

var LECTURE_BY_ID = {}; LECTURES.forEach(function(l){ LECTURE_BY_ID[l.id] = l; });
var QUESTION_BY_ID = {}; QUESTIONS.forEach(function(q){ QUESTION_BY_ID[q.id] = q; });
var CASE_BY_ID = {}; CASES.forEach(function(c){ CASE_BY_ID[c.id] = c; });
/* units whose content is published (status 'taught'); preview units are announced only */
function taughtUnits(){ return LECTURES.filter(function(l){ return l.status === 'taught' || CONFIG.drafts; }); }
function unitItems(unit){ return QUESTIONS.filter(function(q){ return q.lec === unit; }); }

/* ---------- icons: 24px grid, 1.8 stroke, currentColor (no emoji) ---------- */
var ICON_PATHS = {
  today:  '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="m9 14.5 2 2 4-4"/>',
  notes:  '<path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"/><path d="M6.5 8h2M15.5 8h2M6.5 11h2M15.5 11h2"/>',
  bank:   '<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  clock:  '<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2.5M9.5 3h5"/>',
  clinic: '<path d="M4 20V9l8-5 8 5v11"/><path d="M10 20v-5h4v5"/><path d="M12 8v4M10 10h4"/>',
  sun:    '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  moon:   '<path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/>',
  auto:   '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  seed:   '<path d="M12 20v-8"/><path d="M12 12c0-4 3-7 7-7 0 4-3 7-7 7z"/><path d="M12 14c0-3-2.5-5.5-6-5.5 0 3.5 2.5 5.5 6 5.5z"/>',
  arrow:  '<path d="M5 12h14M13 6l6 6-6 6"/>'
};
function icon(name){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON_PATHS[name] || '') + '</svg>'; }

function toast(msg){
  var host = document.getElementById('toastHost'); if(!host) return;
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; host.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2600);
}

/* the calm state every mode shows until its content exists */
function emptyHTML(title, lines, ic){
  return '<div class="empty">' + icon(ic || 'seed') + '<div><h3>' + esc(title) + '</h3>' +
    lines.map(function(l){ return '<p>' + l + '</p>'; }).join('') + '</div></div>';
}
function subtabsHTML(mode, active){
  var m = CONFIG.modes.filter(function(x){ return x.id === mode; })[0];
  if(!m || !m.subs.length) return '';
  return '<div class="subtabs" role="tablist">' + m.subs.map(function(s){
    return '<button type="button" role="tab" class="subtab' + (s[0] === active ? ' is-active' : '') + '" aria-selected="' + (s[0] === active) + '" data-sub="' + s[0] + '">' + esc(s[1]) + '</button>';
  }).join('') + '</div>';
}

/* ==== app/10-state.js ==== */
/* ====================================================================
   STATE: key boards-state-v1, perio's shape (answered / totalSeen / activeDates as a 'YYYY-MM-DD' -> true map),
   so the dashboard's readProgress reads it unchanged (BUILD_SPEC 1.1). Keep these field names stable.
   ==================================================================== */
var STATE_KEY = CONFIG.stateKey;
function defaultState(){
  return {
    answered:{},          // qid -> {lastCorrect:bool, n:int, t:'YYYY-MM-DD', first:bool}
    totalSeen:0, totalCorrect:0,
    activeDates:{},       // 'YYYY-MM-DD' -> true
    lastActiveDate:null,
    retired:{},           // qid -> 'YYYY-MM-DD' (dailyPlan, BUILD_SPEC 1.5)
    ui:{ mode:'home', sub:{}, level:'core', coverOptions:false, unit:null, bankUnit:'all', bankSec:null, bankExam:'all', bankNewOnly:false, bankHardOnly:false, bankAt:0, caseProgress:{}, caseId:null, caseReview:false }
  };
}
function loadState(){
  var d = defaultState(), base = defaultState();
  try{
    var raw = localStorage.getItem(STATE_KEY);
    if(raw){ var saved = JSON.parse(raw); if(saved && typeof saved === 'object') for(var k in saved) if(Object.prototype.hasOwnProperty.call(saved, k)) d[k] = saved[k]; }
  }catch(e){}
  if(!d.ui || typeof d.ui !== 'object') d.ui = base.ui;
  for(var kk in base.ui) if(!(kk in d.ui)) d.ui[kk] = base.ui[kk];
  if(!d.ui.sub || typeof d.ui.sub !== 'object') d.ui.sub = {};
  if(!d.ui.caseProgress || typeof d.ui.caseProgress !== 'object' || Array.isArray(d.ui.caseProgress)) d.ui.caseProgress = {};
  ['answered', 'activeDates', 'retired'].forEach(function(k){ if(!d[k] || typeof d[k] !== 'object' || Array.isArray(d[k])) d[k] = {}; });
  return d;
}
function saveState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); }catch(e){} }
var STATE = loadState();

function touchActiveDay(){ var k = todayKey(); STATE.activeDates[k] = true; STATE.lastActiveDate = k; }

/* One recorded answer. `choice` is the AUTHORED index of the option picked (the card maps the shuffled position
   back), so question_choices rows mean the same thing whatever order a student saw. ctx: bank | case | mock | drill | game. */
function recordAnswer(q, correct, choice, ctx, conf){
  var a = STATE.answered[q.id], t = todayKey();
  if(!a) a = STATE.answered[q.id] = { lastCorrect:false, n:0, t:t, first:!!correct };
  a.lastCorrect = !!correct; a.n++; a.t = t;
  if(typeof choice === 'number' && choice >= 0) a.choice = choice;
  STATE.totalSeen++; if(correct) STATE.totalCorrect++;
  touchActiveDay(); saveState();
  var detail = { qid:q.id, lec:q.lec, correct:!!correct, choice:choice, ctx:ctx || 'bank' };
  if(conf) detail.conf = conf;
  try{ document.dispatchEvent(new CustomEvent('boards:answered', { detail:detail })); }catch(e){}
}

/* ==== app/20-card.js ==== */
/* ====================================================================
   ITEM CARD: one rendering and recording path for Questions, cases, the drill and the game adapter.
   Choice buttons always carry their authored index, even when their displayed order is shuffled.
   ==================================================================== */
var LETTERS = 'ABCDEFGHIJ';

function choiceOrder(q){
  var n = (q.choices || []).length, pins = [], all = [];
  (q.pin || []).forEach(function(i){ if(i >= 0 && i < n && pins.indexOf(i) === -1) pins.push(i); });
  for(var i = 0; i < n; i++) if(pins.indexOf(i) === -1) all.push(i);
  return (q.fixed ? all : shuffled(all)).concat(pins);
}

function pboxHTML(b){
  if(!b) return '';
  function list(a){ return a && a.length ? '<ul>' + a.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : ''; }
  return '<div class="pbox"><dl>' +
    '<dt>Patient</dt><dd>' + esc(b.patient || '') + '</dd>' +
    '<dt>Chief Complaint</dt><dd>' + esc(b.cc || '') + '</dd>' +
    '<dt>Background and/or Patient History</dt><dd>' + list(b.hx) + '</dd>' +
    '<dt>Current Findings</dt><dd>' + list(b.findings) + '</dd>' +
    '</dl></div>';
}

function figureHTML(key){
  var f = FIGURES[key]; if(!f) return '';
  return '<figure class="qfig" role="img" aria-label="' + esc(f.alt) + '">' + f.svg + '</figure>';
}

function refChipsHTML(q){
  return '<div class="qx-refs">' + (q.refs || []).map(function(r){
    if(/^https:/.test(r)) return '<a class="chip" href="' + esc(r) + '" target="_blank" rel="noopener">Source</a>';
    var f = REFS[r], s = f && f.src && f.src[0];
    return s && s.u ? '<a class="chip" href="' + esc(s.u) + '" target="_blank" rel="noopener" title="' + esc(s.t || '') + '">' + esc(r) + '</a>' : '<span class="chip">' + esc(r) + '</span>';
  }).join('') + '</div>';
}

function sectionTitle(unit, sec){
  var html = READINGS[unit] || '', safe = sec.replace(/[^a-z0-9-]/gi, ''), re = new RegExp('<section[^>]*id="' + safe + '"[^>]*>[\\s\\S]*?<h2[^>]*>([\\s\\S]*?)</h2>', 'i');
  var m = html.match(re);
  return m ? m[1].replace(/<[^>]*>/g, '') : '';
}

function cardHTML(q, opts, order){
  opts = opts || {}; order = order || choiceOrder(q);
  var u = LECTURE_BY_ID[q.lec], covered = !!STATE.ui.coverOptions && !opts.review;
  var tag = opts.review ? 'div' : 'button';
  return '<article class="qcard" data-qid="' + esc(q.id) + '" data-ctx="' + esc(opts.ctx || 'bank') + '" data-lock-in="' + (!!opts.lockIn) + '">' +
    '<div class="qcard-top"><span class="chip accent">' + esc(u ? u.short : q.lec) + '</span>' + (q.exam || []).map(function(e){ return '<span class="chip">' + esc(e.toUpperCase()) + '</span>'; }).join('') + '</div>' +
    (!opts.caseView ? pboxHTML(q.pbox) : '') + (q.img ? figureHTML(q.img) : '') +
    '<p class="qcard-stem">' + esc(q.stem) + '</p>' +
    (covered ? '<button type="button" class="btn qcard-show-options" data-show-options>Show options</button>' : '') +
    '<div class="qcard-choices"' + (opts.review ? ' role="list"' : '') + (covered ? ' hidden' : '') + '>' + order.map(function(i, k){
      var key = tag === 'button' ? ' type="button"' : ' role="listitem"';
      return '<' + tag + key + ' class="qchoice" data-i="' + i + '"><span class="lt">' + LETTERS[k] + '</span><span>' + esc(q.choices[i]) + '</span></' + tag + '>';
    }).join('') + '</div><div class="qx" hidden></div></article>';
}

function explainHTML(q, picked){
  var hasPick = typeof picked === 'number' && picked >= 0 && picked < q.choices.length;
  var right = hasPick && picked === q.answer, rest = [];
  for(var i = 0; i < q.choices.length; i++) if(i !== picked) rest.push(i);
  var order = hasPick ? [picked].concat(rest) : [q.answer].concat(rest.filter(function(x){ return x !== q.answer; }));
  var lines = order.map(function(i){
    return '<li class="' + (i === picked ? 'is-picked ' : '') + (i === q.answer ? 'is-key' : '') + '"><b>' + esc(q.choices[i]) + ':</b> ' + esc((q.why || [])[i] || '') + '</li>';
  }).join('');
  var title = q.sec ? sectionTitle(q.lec, q.sec) : '';
  var verdict = hasPick ? (right ? 'Correct.' : 'Not this time. The answer is ' + esc(q.choices[q.answer]) + '.') : 'Answer: ' + esc(q.choices[q.answer]) + '.';
  return '<p class="qx-verdict ' + (hasPick ? (right ? 'right' : 'wrong') : 'review') + '">' + verdict + '</p>' +
    '<p>' + esc(q.ex || '') + '</p><ul class="qx-why">' + lines + '</ul>' +
    (hasPick && !right && q.cue ? '<p class="qx-cue"><b>Remember it:</b> ' + esc(q.cue) + '</p>' : '') +
    refChipsHTML(q) +
    (title ? '<div class="btn-row"><button type="button" class="btn" data-goto-sec="' + esc(q.sec) + '" data-goto-unit="' + esc(q.lec) + '">Read: ' + esc(title) + '</button></div>' : '') +
    (typeof window.shOpenFlag === 'function' ? '<div class="btn-row"><button type="button" class="btn qx-report" data-report>Report</button></div>' : '');
}

function setChoiceStates(card, q, picked){
  $$('.qchoice', card).forEach(function(b){
    var i = +b.getAttribute('data-i');
    if(i === q.answer) b.setAttribute('data-state', 'right');
    else if(i === picked) b.setAttribute('data-state', 'wrong');
    if(b.tagName === 'BUTTON') b.disabled = true;
  });
}

function showClassStats(card, q){
  if(typeof window.shGetClassStats !== 'function') return;
  window.shGetClassStats([q.id], function(byQid){
    if(!card.parentNode) return;
    var stat = byQid && byQid[q.id]; if(!stat || stat.total < 8) return;
    var qx = $('.qx', card); if(!qx || $('[data-class-stats]', qx)) return;
    var row = document.createElement('p'); row.className = 'qx-class'; row.setAttribute('data-class-stats', '1');
    row.textContent = 'Class: ' + pct(stat.correct, stat.total) + '% right (' + stat.total + ' answers)'; qx.appendChild(row);
  });
}

function wireCard(card, q, opts, onDone){
  opts = opts || {};
  var picked = null, recorded = false, dead = false;
  var old = STATE.answered[q.id];
  if(opts.review){
    picked = old && typeof old.choice === 'number' ? old.choice : null;
    setChoiceStates(card, q, picked);
    var qx = $('.qx', card); qx.innerHTML = explainHTML(q, picked); qx.hidden = false;
    showClassStats(card, q);
  }
  function feedback(){
    var qx = $('.qx', card); qx.innerHTML = explainHTML(q, picked); qx.hidden = false;
    setChoiceStates(card, q, picked); showClassStats(card, q);
  }
  function submit(conf){
    if(dead || opts.review || recorded || picked == null) return false;
    recorded = true; card.setAttribute('data-recorded', '1');
    var right = picked === q.answer;
    recordAnswer(q, right, picked, opts.ctx || card.getAttribute('data-ctx') || 'bank', conf);
    if(opts.deferFeedback){ var qx = $('.qx', card); qx.textContent = 'Recorded'; qx.hidden = false; }
    else feedback();
    if(onDone) onDone(q, right);
    return true;
  }
  function click(e){
    var go = e.target.closest('[data-goto-sec]');
    if(go){ window.SH_GOTO({ unit:go.getAttribute('data-goto-unit'), sec:go.getAttribute('data-goto-sec') }); return; }
    var report = e.target.closest('[data-report]');
    if(report){ if(typeof window.shOpenFlag === 'function') window.shOpenFlag(q.id); return; }
    var reveal = e.target.closest('[data-show-options]');
    if(reveal){ var list = $('.qcard-choices', card); if(list) list.hidden = false; reveal.hidden = true; return; }
    var b = e.target.closest('.qchoice'); if(!b || opts.review || recorded || !card.contains(b)) return;
    picked = +b.getAttribute('data-i');
    $$('.qchoice', card).forEach(function(x){ x.removeAttribute('data-state'); });
    b.setAttribute('data-state', 'selected');
    if(!opts.lockIn) submit();
  }
  card.addEventListener('click', click);
  return {
    picked:function(){ return picked; },
    submit:submit,
    destroy:function(){ dead = true; card.removeEventListener('click', click); }
  };
}

function renderItem(el, qid, opts){
  opts = opts || {};
  var q = QUESTION_BY_ID[qid];
  if(!q){ el.innerHTML = ''; return { picked:function(){ return null; }, submit:function(){ return false; }, destroy:function(){} }; }
  var order = choiceOrder(q); el.innerHTML = cardHTML(q, opts, order);
  return wireCard($('.qcard', el), q, opts, opts.onDone);
}

/* Compatibility for the daily drill, which supplies its own host around cardHTML. */
function wireCards(root, onDone){
  $$('.qcard', root).forEach(function(card){
    if(card.getAttribute('data-wired')) return;
    card.setAttribute('data-wired', '1');
    var q = QUESTION_BY_ID[card.getAttribute('data-qid')]; if(!q) return;
    wireCard(card, q, { ctx:card.getAttribute('data-ctx') || 'bank' }, onDone);
  });
}

/* ==== app/25-case.js ==== */
/* ====================================================================
   CASE SETS: one patient chart, visit-order questions with no verdicts, then a full review in Rounds.
   Progress lives under STATE.ui so it does not change the shared top-level state contract.
   ==================================================================== */
function caseChartHTML(c){
  return '<details class="case-chart" open><summary>Chart: ' + esc(c.box && c.box.patient || c.id) + '</summary><div class="case-chart-body"><h3>Patient chart</h3>' +
    pboxHTML(c.box) + (c.stim || []).map(figureHTML).join('') + '</div></details>';
}

function caseProgress(c){
  if(!STATE.ui.caseProgress[c.id]) STATE.ui.caseProgress[c.id] = { next:0 };
  var p = STATE.ui.caseProgress[c.id];
  if(p.pending) delete p.pending;
  return p;
}

function renderCase(el, caseId, opts){
  opts = opts || {};
  var c = CASE_BY_ID[caseId];
  if(!c){ el.innerHTML = (opts.prefix || '') + emptyHTML('Case set unavailable', ['Choose another case set.'], 'bank'); return; }
  var p = caseProgress(c), itemIds = c.items || [], next = Math.max(0, Math.min(itemIds.length, +p.next || 0));
  var rounds = !!opts.review || next >= itemIds.length;
  var title = '<div class="case-title"><div><h3>' + esc(c.box && c.box.patient || c.id) + '</h3><p class="faint">' + plural(itemIds.length, 'question') + ' · ' + (rounds ? 'Rounds' : 'Question ' + (next + 1) + ' of ' + itemIds.length) + '</p></div>' +
    '<button type="button" class="btn" data-case-back>' + (opts.backLabel || 'Back to cases') + '</button></div>';
  var body = '';
  if(rounds){
    body = '<section class="case-rounds"><h3>Rounds</h3><p class="muted">Review the answers, reasons and cues from the whole visit.</p><div class="case-round-items">' + itemIds.map(function(qid, i){
      return '<div class="case-round-item"><h4>Question ' + (i + 1) + '</h4><div data-case-review-item="' + esc(qid) + '"></div></div>';
    }).join('') + '</div></section>';
  } else {
    var qid = itemIds[next];
    body = '<section class="case-current"><div class="case-stage-head"><span class="chip accent">Question ' + (next + 1) + ' of ' + itemIds.length + '</span><span class="faint">Lock in your answer to continue.</span></div>' +
      '<div data-case-current="' + esc(qid) + '"></div><div class="btn-row case-controls">' +
      '<button type="button" class="btn primary" data-case-lock disabled>Lock answer</button>' +
      '<button type="button" class="btn primary" data-case-next hidden>' + (next === itemIds.length - 1 ? 'See Rounds' : 'Next question') + '</button></div></section>';
  }
  el.innerHTML = (opts.prefix || '') + '<div class="case-view" data-case-id="' + esc(c.id) + '">' + title +
    '<div class="case-layout">' + caseChartHTML(c) + '<div class="case-content">' + body + '</div></div></div>';
  var chart = $('.case-chart', el);
  if(chart && window.matchMedia && window.matchMedia('(max-width: 639px)').matches && (rounds || next > 0)) chart.open = false;
  if(rounds){
    itemIds.forEach(function(id){ var host = $('[data-case-review-item="' + id + '"]', el); if(host) renderItem(host, id, { ctx:opts.ctx || 'case', review:true, caseView:true }); });
    return;
  }
  var current = $('[data-case-current]', el), card = renderItem(current, qid, { ctx:opts.ctx || 'case', lockIn:true, deferFeedback:true, caseView:true });
  var lock = $('[data-case-lock]', el), advance = $('[data-case-next]', el);
  current.addEventListener('click', function(){ lock.disabled = card.picked() == null; });
  lock.addEventListener('click', function(){
    if(!card.submit()) return;
    p.next = next + 1; saveState();
    lock.hidden = true; advance.hidden = false;
  });
}

/* ==== app/40-bank.js ==== */
/* ====================================================================
   QUESTIONS: filtered one-at-a-time practice, case sets with Rounds, and missed-item review.
   ==================================================================== */
var bankSearch = '';
var bankClassStats = {};
var bankClassStatsSeen = {};
var bankRenderToken = 0;
var caseScrollAfterNext = false;

function bankPoolBase(){
  var sec = STATE.ui.bankSec, unit = STATE.ui.bankUnit, exam = STATE.ui.bankExam || 'all';
  var words = bankSearch.toLowerCase().split(/\s+/).filter(Boolean);
  return QUESTIONS.filter(function(x){
    if(x.case) return false;
    if(sec && x.sec !== sec) return false;
    if(!sec && unit && unit !== 'all' && x.lec !== unit) return false;
    if(exam !== 'all' && (x.exam || []).indexOf(exam) === -1) return false;
    if(STATE.ui.bankNewOnly && STATE.answered[x.id]) return false;
    if(words.length){ var t = (x.stem + ' ' + x.choices.join(' ')).toLowerCase(); if(!words.every(function(w){ return t.indexOf(w) !== -1; })) return false; }
    return true;
  });
}

function bankPool(){
  var list = bankPoolBase();
  if(STATE.ui.bankHardOnly) list = list.filter(function(x){ var s = bankClassStats[x.id]; return s && s.total >= 8 && (s.correct / s.total) < 0.5; });
  return list;
}

function ensureBankStats(ids, done){
  var missing = ids.filter(function(id){ return !bankClassStatsSeen[id]; });
  if(!missing.length) return true;
  if(typeof window.shGetClassStats !== 'function'){
    missing.forEach(function(id){ bankClassStatsSeen[id] = true; }); return true;
  }
  window.shGetClassStats(missing, function(byQid){
    missing.forEach(function(id){ bankClassStatsSeen[id] = true; });
    Object.keys(byQid || {}).forEach(function(id){ bankClassStats[id] = byQid[id]; });
    done();
  });
  return false;
}

function bankSections(){
  var out = [];
  Object.keys(READINGS).forEach(function(unit){
    var html = READINGS[unit] || '', re = /<section\b([^>]*)>([\s\S]*?)<\/section>/gi, m;
    while((m = re.exec(html))){
      var id = (m[1].match(/\bid="([^"]+)"/) || [])[1], title = (m[2].match(/<h2[^>]*>([\s\S]*?)<\/h2>/i) || [])[1];
      if(id && title) out.push({ id:id, unit:unit, title:title.replace(/<[^>]*>/g, '') });
    }
  });
  return out;
}

function caseState(c){
  var p = STATE.ui.caseProgress[c.id], n = c.items.length, next = p ? (+p.next || 0) : 0;
  if(next >= n) return 'Done';
  if(next > 0) return 'In progress';
  return 'New';
}

function renderCaseList(){
  if(!CASES.length) return emptyHTML('No case sets yet', ['Case sets will appear here when the first unit opens.'], 'bank');
  return '<div class="case-list">' + CASES.map(function(c){
    var state = caseState(c), box = c.box || {}, actions;
    if(state === 'Done'){
      actions = '<div class="case-list-actions"><button type="button" class="btn" data-case-review="' + esc(c.id) + '">Review</button>' +
        '<button type="button" class="btn primary" data-case-repeat="' + esc(c.id) + '">Do it again</button></div>';
    } else actions = '<button type="button" class="btn primary" data-case-open="' + esc(c.id) + '">' + (state === 'In progress' ? 'Continue case' : 'Open case') + '</button>';
    return '<article class="case-list-card"><div><span class="chip">' + esc(state) + '</span><h3>' + esc(box.patient || c.id) + '</h3>' +
      '<p>' + esc(box.cc || '') + '</p><p class="faint">' + plural(c.items.length, 'question') + ' · ' + (c.units || []).map(esc).join(' / ') + '</p></div>' + actions + '</article>';
  }).join('') + '</div>';
}

function missedStandalonePool(){
  return QUESTIONS.filter(function(q){ return !q.case && STATE.answered[q.id] && !STATE.answered[q.id].lastCorrect; });
}

function renderMissed(){
  var standalones = missedStandalonePool();
  var missedCases = CASES.filter(function(c){ return c.items.some(function(id){ var a = STATE.answered[id]; return a && !a.lastCorrect; }); });
  if(!standalones.length && !missedCases.length) return emptyHTML('Nothing missed', ['Questions you get wrong come back here until you get them right.'], 'bank');
  var html = '';
  if(standalones.length){
    var at = Math.min(Math.max(0, +STATE.ui.bankAt || 0), standalones.length - 1), q = standalones[at];
    STATE.ui.bankAt = at;
    html += '<h3 class="bank-section-title">Missed questions</h3><div class="bank-practice"><div class="bank-card-host" data-bank-qid="' + esc(q.id) + '"></div>' +
      '<div class="qnav"><span class="faint">' + (at + 1) + ' of ' + standalones.length + '</span><span class="btn-row" style="margin:0">' +
      '<button type="button" class="btn" data-bank-step="-1"' + (at ? '' : ' disabled') + '>Previous</button>' +
      '<button type="button" class="btn primary" data-bank-step="1"' + (at < standalones.length - 1 ? '' : ' disabled') + '>Next</button></span></div></div>';
  }
  if(missedCases.length){
    html += '<h3 class="bank-section-title">Missed case items</h3><div class="missed-case-list">' + missedCases.map(function(c){
      var count = c.items.filter(function(id){ var a = STATE.answered[id]; return a && !a.lastCorrect; }).length;
      return '<article class="missed-case"><div><h4>' + esc(c.box && c.box.patient || c.id) + '</h4><p>' + count + ' missed ' + (count === 1 ? 'item' : 'items') + ' · ' + plural(c.items.length, 'question') + '</p></div>' +
        '<button type="button" class="btn" data-case-missed="' + esc(c.id) + '">Review case</button></article>';
    }).join('') + '</div>';
  }
  return html;
}

function renderBank(){
  var el = document.getElementById('panel-bank'), sub = STATE.ui.sub.bank || 'practice';
  var head = '<div class="panel-head"><div><h2>Questions</h2><p>Practice one question at a time, review complete case visits, and revisit questions you missed.</p></div></div>';
  var prefix = head + subtabsHTML('bank', sub);
  if(!QUESTIONS.length){
    el.innerHTML = prefix + emptyHTML('The first questions are being written and checked', [
      'Every question is written for this hub from a checked fact with a public primary source, then verified by a second model and, for the risky ones, by a person.',
      'Practice, case sets and your missed questions will live here.'
    ], 'bank');
    return;
  }
  if(sub === 'cases' && STATE.ui.caseId && CASE_BY_ID[STATE.ui.caseId]){
    renderCase(el, STATE.ui.caseId, { ctx:'case', review:!!STATE.ui.caseReview, prefix:prefix, backLabel:'Back to cases' });
    if(caseScrollAfterNext){
      caseScrollAfterNext = false;
      var question = $('.case-current', el) || $('.case-rounds', el), chart = $('.case-chart', el);
      var phone = window.matchMedia && window.matchMedia('(max-width: 639px)').matches;
      var target = phone && chart && !chart.open ? chart : question;
      if(target && target.scrollIntoView) target.scrollIntoView({ block:'start', behavior:'smooth' });
    }
    return;
  }
  if(sub === 'missed' && STATE.ui.caseId && STATE.ui.caseReview){
    renderCase(el, STATE.ui.caseId, { ctx:'case', review:true, prefix:prefix, backLabel:'Back to missed' });
    return;
  }
  if(sub === 'cases'){
    el.innerHTML = prefix + renderCaseList();
    return;
  }
  if(sub === 'missed'){
    el.innerHTML = prefix + renderMissed();
    var missedHost = $('.bank-card-host', el);
    if(missedHost) renderItem(missedHost, missedHost.getAttribute('data-bank-qid'), { ctx:'bank' });
    return;
  }

  var base = bankPoolBase(), token = ++bankRenderToken;
  if(STATE.ui.bankHardOnly && !ensureBankStats(base.map(function(q){ return q.id; }), function(){ if(token === bankRenderToken) renderBank(); })){
    el.innerHTML = prefix + bankFiltersHTML() + emptyHTML('Checking class accuracy', ['Hard only shows questions answered correctly by fewer than half of at least 8 classmates.'], 'bank');
    return;
  }
  var pool = bankPool(), at = Math.min(Math.max(0, +STATE.ui.bankAt || 0), Math.max(0, pool.length - 1));
  STATE.ui.bankAt = at;
  var html = prefix + bankFiltersHTML();
  html += pool.length ? '<div class="bank-practice">' +
    '<div class="bank-card-host" data-bank-qid="' + esc(pool[at].id) + '"></div>' +
    '<div class="qnav"><span class="faint">' + (at + 1) + ' of ' + pool.length + '</span><span class="btn-row" style="margin:0">' +
    '<button type="button" class="btn" data-bank-step="-1"' + (at ? '' : ' disabled') + '>Previous</button>' +
    '<button type="button" class="btn primary" data-bank-step="1"' + (at < pool.length - 1 ? '' : ' disabled') + '>Next</button></span></div></div>'
    : emptyHTML('No questions match', ['Try another unit or clear a filter.'], 'bank');
  el.innerHTML = html;
  if(pool.length) renderItem($('.bank-card-host', el), pool[at].id, { ctx:'bank' });
}

function bankFiltersHTML(){
  var units = taughtUnits().filter(function(l){ return unitItems(l.id).length; }), sections = bankSections();
  var sectionUnits = STATE.ui.bankUnit && STATE.ui.bankUnit !== 'all' ? STATE.ui.bankUnit : null;
  if(sectionUnits) sections = sections.filter(function(s){ return s.unit === sectionUnits; });
  var selectedSection = STATE.ui.bankSec || '';
  return '<div class="filters bank-filters">' +
    '<label class="field">Unit<select data-bank-unit><option value="all"' + ((!STATE.ui.bankUnit || STATE.ui.bankUnit === 'all') ? ' selected' : '') + '>All units</option>' + units.map(function(l){
      return '<option value="' + esc(l.id) + '"' + (STATE.ui.bankUnit === l.id && !STATE.ui.bankSec ? ' selected' : '') + '>' + esc(l.title) + '</option>';
    }).join('') + '</select></label>' +
    '<label class="field">Notes section<select data-bank-section><option value="">All sections</option>' + sections.map(function(s){
      return '<option value="' + esc(s.id) + '"' + (selectedSection === s.id ? ' selected' : '') + '>' + esc(s.unit + ' · ' + s.title) + '</option>';
    }).join('') + '</select></label>' +
    '<label class="field">Exam<select data-bank-exam><option value="all"' + ((STATE.ui.bankExam || 'all') === 'all' ? ' selected' : '') + '>INBDE + ADEX</option><option value="inbde"' + (STATE.ui.bankExam === 'inbde' ? ' selected' : '') + '>INBDE</option><option value="adex"' + (STATE.ui.bankExam === 'adex' ? ' selected' : '') + '>ADEX</option></select></label>' +
    '<label class="bank-check"><input type="checkbox" data-bank-new' + (STATE.ui.bankNewOnly ? ' checked' : '') + '> New only</label>' +
    '<label class="bank-check"><input type="checkbox" data-bank-hard' + (STATE.ui.bankHardOnly ? ' checked' : '') + '> Hard only</label>' +
    '<label class="bank-check"><input type="checkbox" data-bank-cover' + (STATE.ui.coverOptions ? ' checked' : '') + '> Cover options</label>' +
    (bankSearch ? '<button type="button" class="btn" data-bank-unsearch>Search: ' + esc(bankSearch) + ' &times;</button>' : '') +
    '</div>';
}

function wireBank(){
  var el = document.getElementById('panel-bank');
  /* Clear an open case before the boot handler renders a different bank sub-view. */
  el.addEventListener('click', function(e){
    if(e.target.closest('.subtabs [data-sub]')){ STATE.ui.caseId = null; STATE.ui.caseReview = false; }
  }, true);
  el.addEventListener('click', function(e){
    var step = e.target.closest('[data-bank-step]');
    if(step){
      var delta = +step.getAttribute('data-bank-step'), at = +STATE.ui.bankAt || 0;
      var host = $('[data-bank-qid]', el), qid = host && host.getAttribute('data-bank-qid');
      var available = (STATE.ui.sub.bank || 'practice') === 'missed' ? missedStandalonePool() : bankPool();
      var currentStillAvailable = qid && available.some(function(q){ return q.id === qid; });
      var keepIndex = delta > 0 && qid && !currentStillAvailable;
      STATE.ui.bankAt = Math.max(0, at + (keepIndex ? 0 : delta)); saveState(); renderBank(); return;
    }
    if(e.target.closest('[data-bank-unsearch]')){ bankSearch = ''; STATE.ui.bankAt = 0; saveState(); renderBank(); return; }
    var open = e.target.closest('[data-case-open]');
    if(open){ STATE.ui.caseId = open.getAttribute('data-case-open'); STATE.ui.caseReview = false; saveState(); renderBank(); return; }
    var reviewCase = e.target.closest('[data-case-review]');
    if(reviewCase){ STATE.ui.caseId = reviewCase.getAttribute('data-case-review'); STATE.ui.caseReview = true; saveState(); renderBank(); return; }
    var repeatCase = e.target.closest('[data-case-repeat]');
    if(repeatCase){
      STATE.ui.caseId = repeatCase.getAttribute('data-case-repeat'); STATE.ui.caseReview = false;
      STATE.ui.caseProgress[STATE.ui.caseId] = { next:0 }; saveState(); renderBank(); return;
    }
    var missedCase = e.target.closest('[data-case-missed]');
    if(missedCase){ STATE.ui.caseId = missedCase.getAttribute('data-case-missed'); STATE.ui.caseReview = true; saveState(); renderBank(); return; }
    if(e.target.closest('[data-case-back]')){ STATE.ui.caseId = null; STATE.ui.caseReview = false; saveState(); renderBank(); return; }
    if(e.target.closest('[data-case-next]')){
      caseScrollAfterNext = true;
      saveState(); renderBank(); return;
    }
  });
  el.addEventListener('change', function(e){
    var t = e.target;
    if(t.closest('[data-bank-unit]')){ STATE.ui.bankUnit = t.value; STATE.ui.bankSec = null; STATE.ui.bankAt = 0; }
    else if(t.closest('[data-bank-section]')){ STATE.ui.bankSec = t.value || null; STATE.ui.bankUnit = 'all'; STATE.ui.bankAt = 0; }
    else if(t.closest('[data-bank-exam]')){ STATE.ui.bankExam = t.value; STATE.ui.bankAt = 0; }
    else if(t.closest('[data-bank-new]')){ STATE.ui.bankNewOnly = t.checked; STATE.ui.bankAt = 0; }
    else if(t.closest('[data-bank-hard]')){ STATE.ui.bankHardOnly = t.checked; STATE.ui.bankAt = 0; }
    else if(t.closest('[data-bank-cover]')){ STATE.ui.coverOptions = t.checked; }
    else return;
    saveState(); renderBank();
  });
  /* The generated export script defines SH_GOTO after this file. Wrap it once DOM parsing is complete so
     searches and notes can land on a standalone or open a case in its case-set view. */
  document.addEventListener('DOMContentLoaded', function(){
    var original = window.SH_GOTO; if(typeof original !== 'function' || original._bankWrapped) return;
    var wrapped = function(go){
      if(go && go.qid && QUESTION_BY_ID[go.qid]){
        var q = QUESTION_BY_ID[go.qid]; bankSearch = '';
        STATE.ui.bankExam = 'all'; STATE.ui.bankNewOnly = false; STATE.ui.bankHardOnly = false; STATE.ui.bankAt = 0;
        if(q.case){ STATE.ui.caseId = q.case; STATE.ui.caseReview = false; STATE.ui.sub.bank = 'cases'; saveState(); setMode('bank'); return; }
        STATE.ui.caseId = null; STATE.ui.caseReview = false; STATE.ui.sub.bank = 'practice'; STATE.ui.bankUnit = q.lec; STATE.ui.bankSec = null;
        var pool = bankPool(); STATE.ui.bankAt = Math.max(0, pool.indexOf(q)); saveState(); setMode('bank'); return;
      }
      return original(go);
    };
    wrapped._bankWrapped = true; window.SH_GOTO = wrapped;
  });
}

/* ==== app/60-home.js ==== */
/* ====================================================================
   TODAY (minimal): exam note, units grid with how much you've seen, a start button. int-notes-home adds
   Today's shift / Today's 12 (dailyPlan), Continue notes, readiness ("Likely right") and practice days.
   ==================================================================== */
function unitSeen(unit){
  var list = unitItems(unit), seen = 0;
  list.forEach(function(q){ if(STATE.answered[q.id]) seen++; });
  return { seen:seen, total:list.length };
}

function unitCardHTML(l){
  if(l.status !== 'taught' && !CONFIG.drafts) return '<div class="unit-card is-preview"><h4>' + esc(l.title) + '</h4><p class="faint">Coming soon</p></div>';
  var s = unitSeen(l.id);
  return '<div class="unit-card"><h4>' + esc(l.title) + '</h4><p class="faint">Seen ' + s.seen + ' of ' + s.total + '</p>' +
    '<span class="bar"><i style="width:' + pct(s.seen, s.total) + '%"></i></span>' +
    '<div class="btn-row" style="margin-top:6px"><button type="button" class="btn" data-home-practice="' + esc(l.id) + '">Practice</button>' +
    (READINGS[l.id] ? '<button type="button" class="btn" data-home-notes="' + esc(l.id) + '">Notes</button>' : '') + '</div></div>';
}

function renderHome(){
  var el = document.getElementById('panel-home'), sub = STATE.ui.sub.home || 'today';
  var taught = taughtUnits(), days = Object.keys(STATE.activeDates).length;
  var head = '<div class="panel-head"><div><h2>Today</h2><p>' + esc(CONFIG.examNote) + '. A little every day keeps two years of material in rotation.</p></div></div>';
  var html = head + subtabsHTML('home', sub);
  if(!taught.length){
    html += emptyHTML('The first units are coming soon', [
      'This hub is being built for the INBDE and ADEX, one unit at a time: notes, board-style questions that cite their sources, timed exam blocks, and Chairside, a clinic game that runs on the same questions.',
      'Medically complex patients and pharmacology come first, then periodontics.',
      'Your progress here will count toward the dashboard and the daily drill as soon as the first unit opens.'
    ], 'seed');
    if(LECTURES.length) html += '<div class="grid" style="margin-top:14px">' + LECTURES.map(unitCardHTML).join('') + '</div>';
  } else if(sub === 'readiness'){
    html += '<div class="box"><h3>Readiness by unit</h3><p class="muted">How much of each unit you have tried. "Likely right" estimates arrive with the daily plan.</p></div>' +
      '<div class="grid" style="margin-top:14px">' + LECTURES.map(unitCardHTML).join('') + '</div>';
  } else {
    html += '<div class="box"><h3>Start here</h3><p class="muted">' + plural(QUESTIONS.length, 'question') + ' in ' + plural(taught.length, 'unit') + ' so far' + (days ? '; you have practiced on ' + plural(days, 'day') : '') + '.</p>' +
      '<div class="btn-row"><button type="button" class="btn primary" data-home-practice="all">Practice questions</button>' +
      (notesUnits().length ? '<button type="button" class="btn" data-home-notes="">Read the notes</button>' : '') + '</div></div>' +
      '<div class="grid" style="margin-top:14px">' + LECTURES.map(unitCardHTML).join('') + '</div>';
  }
  el.innerHTML = html;
}

function wireHome(){
  var el = document.getElementById('panel-home');
  el.addEventListener('click', function(e){
    var p = e.target.closest('[data-home-practice]');
    if(p){ STATE.ui.bankUnit = p.getAttribute('data-home-practice'); STATE.ui.bankSec = null; STATE.ui.bankAt = 0; STATE.ui.sub.bank = 'practice'; saveState(); setMode('bank'); return; }
    var n = e.target.closest('[data-home-notes]');
    if(n){ if(n.getAttribute('data-home-notes')) STATE.ui.unit = n.getAttribute('data-home-notes'); saveState(); setMode('notes'); }
  });
}

/* ==== app/80-clinic.js ==== */
/* ====================================================================
   CLINIC (placeholder lobby): Chairside arrives in R1c (80-game-adapter.js, the lazy loader and the
   GAME_BUNDLES the build stamps with ?v=<hash>). The `arcade` mode id and the #panel-arcade .ar-grid lobby
   are what tools/ci/smoke.js already enters.
   ==================================================================== */
function renderClinic(){
  var el = document.getElementById('panel-arcade');
  el.innerHTML = '<div class="panel-head"><div><h2>Clinic</h2><p>Chairside: a clinic shift built on the same questions and the same review schedule.</p></div></div>' +
    '<div class="ar-grid"></div>' +
    emptyHTML('The clinic opens after the first units', [
      'Each shift is about ten minutes: today\'s due reviews and a few new patients, with answers recorded exactly as in Questions.',
      'Nothing to set up; it will be here when it opens.'
    ], 'clinic');
}

/* ==== app/90-boot.js ==== */
/* ====================================================================
   BOOT: theme (sh_theme, shared with the dashboard), mode tabs, sub-tabs, first render.
   ==================================================================== */
var RENDER = { home:renderHome, notes:renderNotes, bank:renderBank, mock:renderMock, arcade:renderClinic };
var MODE_IDS = CONFIG.modes.map(function(m){ return m.id; });

function setMode(mode){
  if(MODE_IDS.indexOf(mode) === -1) mode = 'home';
  if(window.shTTS && window.shTTS.stop) window.shTTS.stop();
  STATE.ui.mode = mode; saveState();
  $$('#modeSwitch [data-mode]').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-mode') === mode ? 'true' : 'false'); });
  $$('[data-mode-panel]').forEach(function(p){ p.hidden = p.getAttribute('data-mode-panel') !== mode; });
  RENDER[mode]();
  window.scrollTo(0, 0);
}

function applyTheme(t){
  if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  var b = document.getElementById('themeBtn'); if(b) b.innerHTML = icon(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
}

function boot(){
  var saved = null; try{ saved = localStorage.getItem('sh_theme'); }catch(e){}
  if(saved !== 'light' && saved !== 'dark') saved = null;
  $$('[data-ic]').forEach(function(el){ el.innerHTML = icon(el.getAttribute('data-ic')); });
  applyTheme(saved);
  document.getElementById('themeBtn').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = !cur ? 'light' : cur === 'light' ? 'dark' : null;
    try{ localStorage.setItem('sh_theme', next || ''); }catch(e){}
    applyTheme(next);
  });
  $$('#modeSwitch [data-mode]').forEach(function(b){ b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); }); });
  /* every panel's .subtabs: notes' tabs are the Core / Deep dive level, the rest are sub-views */
  $$('[data-mode-panel]').forEach(function(p){
    p.addEventListener('click', function(e){
      var b = e.target.closest('.subtabs [data-sub]'); if(!b) return;
      var mode = p.getAttribute('data-mode-panel'), sub = b.getAttribute('data-sub');
      if(mode === 'notes') STATE.ui.level = sub; else STATE.ui.sub[mode] = sub;
      saveState(); RENDER[mode]();
    });
  });
  wireHome(); wireNotes(); wireBank();
  var m = location.hash === '#drill' ? 'home' : STATE.ui.mode;
  setMode(m);
}
/* the markup above is already parsed, so render now; the deferred widget and supabase scripts load after */
boot();

/* ==== app/99-export.js ==== */
/* ====================================================================
   WIDGET HOOKS: SH_SECTION (activity_pings read as "notes/medcx/core", "bank/practice"...), SH_GOTO (search
   results, "Read: <section>"), SH_DRILL (only once there are questions) and SH_EXPORT, which must stay the LAST
   statement of the script: tools/ci/smoke.js injects its lint hook just before the SH_EXPORT assignment.
   ==================================================================== */
window.SH_SECTION = function(){
  var m = STATE.ui.mode;
  if(m === 'home') return 'home/' + (STATE.ui.sub.home || 'today');
  if(m === 'notes') return 'notes/' + (notesUnits().length ? STATE.ui.unit || notesUnits()[0].id : 'none') + '/' + (STATE.ui.level === 'deep' ? 'deep' : 'core');
  if(m === 'bank') return 'bank/' + (STATE.ui.sub.bank || 'practice');
  if(m === 'mock') return 'mock/' + (STATE.ui.sub.mock || 'setup');
  if(m === 'arcade') return 'arcade/lobby';
  return m;
};

function flashIn(find){
  setTimeout(function(){ var el = find(); if(!el) return; el.scrollIntoView({ block:'start' }); if(window.shFlash) window.shFlash(el); }, 60);
}
/* go: {unit, sec} (notes), {qid} (one question), or the widget search's {v:'bank', q} */
window.SH_GOTO = function(go){
  if(!go) return;
  if(go.qid && QUESTION_BY_ID[go.qid]){
    var q = QUESTION_BY_ID[go.qid];
    STATE.ui.bankUnit = q.lec; STATE.ui.bankSec = null; STATE.ui.sub.bank = 'practice'; bankSearch = '';
    STATE.ui.bankAt = Math.max(0, bankPool().indexOf(q)); saveState(); setMode('bank');
  } else if(go.v === 'bank'){
    bankSearch = go.q || ''; STATE.ui.bankUnit = 'all'; STATE.ui.bankSec = null; STATE.ui.bankAt = 0; STATE.ui.sub.bank = 'practice'; saveState(); setMode('bank');
  } else if(go.unit && READINGS[go.unit]){
    STATE.ui.unit = go.unit; saveState(); setMode('notes');
    if(go.sec) flashIn(function(){ return document.getElementById(go.sec); });
  }
};

if(QUESTIONS.length){
  window.SH_DRILL = {
    size: CONFIG.budget.daily,
    scope: 'all',
    pool: function(){
      return QUESTIONS.filter(function(q){ return !q.case; }).map(function(q){ var a = STATE.answered[q.id]; return { id:q.id, lec:q.lec, last: a ? !!a.lastCorrect : null, hy: q.hy || '' }; });
    },
    render: function(el, qid){ var q = QUESTION_BY_ID[qid]; if(!q || q.case) return false; el.innerHTML = cardHTML(q, { ctx:'drill' }); wireCards(el); return true; }
  };
}

window.SH_EXPORT = {
  lectures: LECTURES.map(function(l){ return { id:l.id, title:l.title, status:l.status }; }),
  questions: QUESTIONS.map(function(q){ return { id:q.id, lec:q.lec, text:q.stem, hint:q.choices[q.answer] + (q.ex ? ' — ' + q.ex : ''), choices:q.choices, answer:q.answer }; }),
  cases: CASES.map(function(c){ return { id:c.id, units:c.units, items:c.items }; }),
  sections: SECTIONS,
  hints: [],
  exams: []
};
})();

</script>
