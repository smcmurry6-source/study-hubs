<html lang="en">

<style>
:root{
  --ink:#1B2432; --ink-2:#4A5468; --ink-3:#6E778C;
  --paper:#EEF0ED; --paper-2:#E3E6E0; --card:#FFFFFF;
  --line:#DADDD6; --line-strong:#C2C7BC;
  --accent:#4B4FA0; --accent-ink:#33356F; --accent-soft:#E6E5F5;
  --bar:#6A6FC4; --bar-track:#ECEDF4;
  --ok:#246B64; --ok-soft:#DCEAE7;
  --warn:#A94E34; --warn-soft:#F6E1D7;
  --shadow:0 1px 2px rgba(20,25,15,.05), 0 8px 24px -16px rgba(20,25,15,.25);
  --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E9ECE6; --ink-2:#BCC3B7; --ink-3:#8E9889;
    --paper:#161915; --paper-2:#1F231D; --card:#21251F;
    --line:#333A2F; --line-strong:#48513F;
    --accent:#9EA1E0; --accent-ink:#D0D2F3; --accent-soft:#2A2C52;
    --bar:#8E92DA; --bar-track:#2C3129;
    --ok:#6FC2B8; --ok-soft:#16302D;
    --warn:#E48C6C; --warn-soft:#3D251C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -16px rgba(0,0,0,.6);
  }
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; color:inherit;}
.num, td.n, .n{font-variant-numeric:tabular-nums;}
[hidden]{display:none !important;}

/* ---------- gate ---------- */
#gate{max-width:340px; margin:14vh auto 0; padding:0 16px; text-align:center;}
#gate h1{font-family:var(--font-display); font-weight:600; font-size:26px; margin:6px 0 0;}
.kicker{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
#gate input{width:100%; margin-top:20px; padding:12px 14px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--card); color:var(--ink); font-size:15px; text-align:center;}
#gate button{margin-top:10px; width:100%; padding:12px 14px; border:none; border-radius:var(--r-pill); background:var(--ink); color:var(--paper); font-weight:600; font-size:15px;}
#gateMsg{margin-top:12px; font-size:13px; color:var(--warn); min-height:18px;}

/* ---------- shell ---------- */
.topbar{position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1080px; margin:0 auto; padding:14px 16px 0;}
.title-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.title-row h1{font-family:var(--font-display); font-weight:600; font-size:22px; margin:0; letter-spacing:-.01em;}
.controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.seg{display:inline-flex; background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px;}
.seg button{border:none; background:none; padding:5px 12px; border-radius:var(--r-pill); font-size:13px; font-weight:600; color:var(--ink-2);}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
.switch{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); cursor:pointer; user-select:none;}
.switch input{accent-color:var(--accent); width:16px; height:16px;}
.icon-btn{border:1px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:5px 12px; font-size:13px; font-weight:600; color:var(--ink-2);}
.tabs{display:flex; gap:4px; margin-top:12px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{border:none; background:none; padding:9px 12px 11px; font-size:14px; font-weight:600; color:var(--ink-3); border-bottom:2px solid transparent; white-space:nowrap;}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent);}
.tabs .count{display:inline-block; min-width:18px; margin-left:6px; padding:0 6px; border-radius:var(--r-pill); background:var(--warn-soft); color:var(--warn); font-size:11.5px; line-height:18px; text-align:center;}
.tabs .count.zero{background:var(--paper-2); color:var(--ink-3);}

main{max-width:1080px; margin:0 auto; padding:22px 16px 80px;}
.panel{display:flex; flex-direction:column; gap:18px;}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow); padding:18px 20px; min-width:0;}
.card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.card h2{font-size:16px; font-weight:700; margin:0;}
.card .sub{font-size:13px; color:var(--ink-3); margin:2px 0 0;}
.card-head .aside{font-size:12.5px; color:var(--ink-3);}
.grid-2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px;}
@media (max-width:760px){ .grid-2{grid-template-columns:1fr;} .card{padding:16px;} }

/* ---------- KPI tiles ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(132px,1fr)); gap:12px;}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2, minmax(0,1fr));} .kpi .value{font-size:24px;} }
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:14px 16px; box-shadow:var(--shadow);}
.kpi .label{font-size:12.5px; font-weight:600; color:var(--ink-2);}
.kpi .value{font-size:28px; font-weight:700; line-height:1.15; margin-top:4px; letter-spacing:-.01em;}
.kpi .value small{font-size:14px; font-weight:600; color:var(--ink-3); margin-left:3px;}
.kpi .hint{font-size:12px; color:var(--ink-3); margin-top:3px;}
.kpi.alert .value{color:var(--warn);}

/* ---------- data tables with inline bars ---------- */
.tbl-wrap{overflow-x:auto; margin:0 -4px;}
table.data{width:100%; border-collapse:collapse; font-size:14px;}
table.data th{font-size:12px; font-weight:600; color:var(--ink-3); text-align:left; padding:0 8px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.data td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.data tr:last-child td{border-bottom:none;}
table.data th.n, table.data td.n{text-align:right; white-space:nowrap;}
table.data td.lbl{font-weight:600;}
table.data td.lbl .muted{font-weight:400;}
table.data td.barcell{width:34%; min-width:110px;}
table.data tr.group td{padding-top:14px; font-size:14px; font-weight:700; color:var(--ink);}
table.data tr.group td .tag{display:block; font-size:12px; font-weight:500; color:var(--ink-3); margin-top:1px;}
.card-head .aside a{color:var(--accent); font-weight:600; text-decoration:none;}
.card-head .aside a:hover{text-decoration:underline;}
@media (max-width:560px){ table.data.wide td.barcell, table.data.wide th.barcell{display:none;} }
table.data tr.child td.lbl{padding-left:22px; font-weight:500; color:var(--ink-2);}
table.data tr:hover td{background:color-mix(in srgb, var(--accent-soft) 45%, transparent);}
table.data tr.group:hover td{background:none;}
.muted{color:var(--ink-3);}
.bar{position:relative; height:10px; border-radius:4px; background:var(--bar-track);}
.bar > span{position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--bar); min-width:3px;}
.bar.low > span{background:var(--warn);}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:var(--r-pill); background:var(--paper-2); color:var(--ink-2); white-space:nowrap;}
.pill.arch{background:transparent; border:1px solid var(--line-strong); color:var(--ink-3);}
.pill.flag{background:var(--warn-soft); color:var(--warn);}
.pill.suggestion{background:var(--accent-soft); color:var(--accent-ink);}

.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.chips button{border:1px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:4px 11px; font-size:13px; font-weight:600; color:var(--ink-2);}
.chips button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper);}

.sv-form{display:grid; gap:10px;}
.rc-wrap{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:20px; align-items:start;}
@media (max-width:760px){ .rc-wrap{grid-template-columns:1fr;} }
.rc-form{display:grid; gap:12px;}
.rc-form label{display:grid; gap:4px; font-size:13px; font-weight:600; color:var(--ink-2);}
.rc-form label.rc-check{display:flex; align-items:center; gap:8px;}
.rc-form input[type=text], .rc-form input[type=date], .rc-form select{font:inherit; font-size:14px; font-weight:400; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);}
.rc-btns{display:flex; gap:8px; flex-wrap:wrap;}
.rc-btns button{border:1px solid var(--line-strong); background:var(--card); border-radius:var(--r-pill); padding:8px 16px; font-size:14px; font-weight:600;}
.rc-btns button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.rc-btns button:disabled{opacity:.5; cursor:default;}
.rc-pub{display:grid; gap:8px; padding-top:12px; border-top:1px solid var(--line);}
.rc-note{font-size:12.5px; color:var(--ink-3); line-height:1.45; margin:0;}
.rc-preview canvas{display:block; width:100%; max-width:540px; height:auto; border-radius:12px; box-shadow:var(--shadow);}
.sv-form input, .sv-form select, .sv-form textarea{font:inherit; font-size:14px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);}
.sv-form .sv-q{display:grid; grid-template-columns:1fr 140px; gap:8px; padding:10px; border:1px dashed var(--line); border-radius:10px;}
.sv-form .sv-q input.sv-opts{grid-column:1 / -1;}
.sv-form .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.sv-ans{display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dashed var(--line); font-size:14px;}
.sv-text{font-size:14px; padding:6px 0; border-bottom:1px dashed var(--line);}
.note{font-size:12.5px; color:var(--ink-3); margin:12px 0 0;}
.empty{color:var(--ink-3); font-size:14px; padding:18px 0; text-align:center;}
.err{color:var(--warn); font-size:14px; padding:12px 0;}

/* ---------- inbox ---------- */
.report{border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; display:flex; gap:14px; align-items:flex-start;}
.report + .report{margin-top:10px;}
.report.is-resolved{opacity:.55;}
.report-main{flex:1; min-width:0;}
.report-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
.report-date{font-size:12.5px; color:var(--ink-3);}
.report-note{font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere;}
.report-reply{margin-top:8px; font-size:13.5px; white-space:pre-wrap; overflow-wrap:anywhere; border-left:3px solid var(--ok); padding-left:10px;}
.report-sent{display:block; margin-top:6px; font-size:12.5px; color:var(--ink-3);}
.report-replybox{display:block; width:100%; min-height:64px; margin-top:10px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--paper-2); color:inherit; font:inherit; font-size:14px; resize:vertical;}
.report-all-title{display:block; width:100%; margin-top:6px; padding:7px 10px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--paper-2); color:inherit; font:inherit; font-size:14px; font-weight:600;}
.report-everyone .report-replybox, .report-all-msg{display:block; width:100%; min-height:80px; margin-top:6px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--paper-2); color:inherit; font:inherit; font-size:14px; resize:vertical;}
.report-everyone[hidden]{display:none;}
.report-opts{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.report-opts .report-sent{margin-top:4px;}
.resolve-btn{flex:none; border:1px solid var(--line-strong); background:var(--paper-2); color:var(--ink-2); padding:5px 12px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600;}
.resolve-btn.is-done{border-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
@media (max-width:560px){ .report{flex-direction:column; gap:10px;} }
.qtext{font-weight:500;white-space:normal;margin-top:3px;max-width:62ch;line-height:1.4}
.qkey{font-size:12.5px;color:var(--good,#1F8A5B);margin-top:3px;white-space:normal}
.qwrong{font-size:12.5px;color:var(--bad,#B3261E);margin-top:2px;white-space:normal}

/* ---------- insights (decision cards) ---------- */
table.data td.warn{color:var(--warn); font-weight:700;}
table.data td .sub2{display:block; font-size:12px; font-weight:400; color:var(--ink-3); margin-top:1px;}
table.data.matrix td.n, table.data.matrix th.n{min-width:62px;}
[data-panel="insights"] table.data td.lbl{min-width:150px;}
.decisions{margin:14px 0 0; padding:12px 14px 12px 30px; border-radius:var(--r-m); background:var(--warn-soft); font-size:13.5px; color:var(--ink);}
.decisions li{margin:5px 0;}
.decisions.ok{background:var(--ok-soft); list-style:none; padding-left:14px;}
.pill.ok{background:var(--ok-soft); color:var(--ok);}
.pill.info{background:var(--accent-soft); color:var(--accent-ink);}
</style>
</head>
<body>

<div id="gate">
  <span class="kicker">Study hub admin</span>
  <h1>Enter passphrase</h1>
  <input type="password" id="gateInput" placeholder="passphrase" autocomplete="off">
  <button id="gateBtn" type="button">Unlock</button>
  <div id="gateMsg"></div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title-row">
        <h1>Hub admin</h1>

  <main>
    <section class="panel" data-panel="overview"></section>
    <section class="panel" data-panel="insights" hidden></section>

    <section class="panel" data-panel="surveys" hidden></section>
    <section class="panel" data-panel="inbox" hidden></section>
    <section class="panel" data-panel="recap" hidden></section>
  </main>
</div>

          .sort(function(a, b){ return a.date < b.date ? -1 : 1; });
        var last = ex[ex.length - 1];
        var end = h.archiveOn && h.archiveOn.date ? at(h.archiveOn.date, h.archiveOn.hour) : last ? at(last.date, last.archiveHour) : null;
        var past = ex.filter(function(x){ return day(x.date) <= now; });
        info[h.id] = { label: h.code || h.title || h.id, live: !archived && !(end && now >= end),
          exam: past.length ? past[past.length - 1].date : (ex[0] ? ex[0].date : null), exams: ex.map(function(x){ return x.date; }) };
      }
      arr("HUBS").forEach(function(h){ if (h && h.id) add(h, false); });
      arr("ARCHIVED_HUBS").forEach(function(h){ if (h && h.id) add(h, true); });
      HUBINFO = Object.keys(info).length ? info : null;
      return HUBINFO;
    }).catch(function(){ return null; });
    return hubInfoReady;
  }
  function keepHub(h){ return state.archived || !isArchived(h); }
  function hubCell(h){ return esc(hubLabel(h)) + (isArchived(h) ? ' <span class="pill arch">archived</span>' : ''); }
  function prettyPart(id){
    if (!id) return "";
    if (SECTION_LABEL[id]) return SECTION_LABEL[id];
    return id.replace(/[-_]+/g, " ").replace(/\b\w/g, function(c){ return c.toUpperCase(); });
  }
  function fmtNum(n){ return (Math.round(n || 0)).toLocaleString(); }
  function fmtMin(m){
    m = Number(m) || 0;
    if (m < 1) return "<1 min";
    if (m < 60) return Math.round(m) + " min";
    var h = m / 60;
    return (h < 10 ? h.toFixed(1) : Math.round(h).toLocaleString()) + " hr";
  }
  function fmtDate(iso){
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    } catch (e) { return iso; }
  }
  function bar(v, max, low, title){
    var pct = max > 0 ? Math.max(1.5, (v / max) * 100) : 0;

  }
  function card(title, sub, body, aside){
    return '<div class="card"><div class="card-head"><div><h2>' + title + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' + (aside ? '<span class="aside">' + aside + '</span>' : '') + '</div>' + body + '</div>';
  }
  function kpi(label, value, hint, alert){
    return '<div class="kpi' + (alert ? ' alert' : '') + '"><div class="label">' + label + '</div><div class="value n">' + value + '</div>' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
  function rangeText(){ return "last " + state.days + " days"; }

  /* ---------- data loading ---------- */
  function rpc(fn, args){
    return supabase.rpc(fn, args).then(function(r){ return r && r.error ? { error: r.error } : { data: (r && r.data) || [] }; }, function(e){ return { error: e }; });
  }
  function table(name, cols){
    return supabase.from(name).select(cols).then(function(r){ return r && r.error ? { error: r.error } : { data: (r && r.data) || [] }; }, function(e){ return { error: e }; });
  }
  function loadAll(){
    $$(".panel:not([data-panel=recap]):not([data-panel=insights])").forEach(function(p){ p.innerHTML = '<div class="empty">Loading…</div>'; });
    var d = state.days;
    return loadHubInfo().then(function(){ return Promise.all([
      rpc("get_visitor_summary", { p_secret: secret, p_days: d }),
      rpc("get_visitor_by_hub", { p_secret: secret, p_days: d }),
      rpc("get_visitor_by_section", { p_secret: secret, p_days: d }),
      table("question_stats", "hub,qid,attempts,correct"),
      table("mode_stats", "hub,mode,opens"),
      rpc("get_correct_streak_stats", {}),
      rpc("get_nuke_summary", { p_secret: secret, p_days: d }),
      rpc("get_nuke_by_hub", { p_secret: secret, p_days: d }),
      rpc("get_nuke_recent", { p_secret: secret, p_limit: 10 }),
      rpc("get_reports", { p_secret: secret }),
      table("question_choices", "hub,qid,choice,picks"),
      rpc("get_click_summary", { p_secret: secret, p_days: d }),
      rpc("get_survey_results", { p_secret: secret }),
      rpc("get_exam_debriefs", { p_secret: secret }),
      rpc("get_search_terms", { p_secret: secret, p_days: d }),
      rpc("get_nuke_unlocks", { p_secret: secret, p_days: d }),
      rpc("get_feature_events", { p_secret: secret, p_days: d }),
      rpc("admin_pod_comments", { p_secret: secret, p_days: 60 })
    ]); }).then(function(r){
      data = { summary: r[0], byHub: r[1], bySection: r[2], qstats: r[3], modes: r[4], streaks: r[5], nukeSum: r[6], nukeHub: r[7], nukeRecent: r[8], reports: r[9], choices: r[10], clicks: r[11], surveys: r[12], debriefs: r[13], searches: r[14], nukeUnlocks: r[15], features: r[16], podComments: r[17] };
      renderAll();
    });
  }

  /* ---------- derived numbers ---------- */
  function hubRows(){
    return (data.byHub.data || []).filter(function(r){ return keepHub(r.hub); })
      .map(function(r){ return { hub: r.hub, visitors: Number(r.unique_visitors) || 0, minutes: Number(r.total_minutes) || 0 }; })
      .sort(function(a, b){ return b.minutes - a.minutes; });
  }
  function allHubMinutes(){
    return (data.byHub.data || []).reduce(function(s, r){ return s + (Number(r.total_minutes) || 0); }, 0);
  }
  /* sections grouped per hub -> per mode -> sub-views */
  function sectionTree(){
    var hubs = {};
    (data.bySection.data || []).forEach(function(r){
      if (!keepHub(r.hub)) return;
      var sec = r.section || "(unspecified)";
      var mins = Number(r.total_minutes) || 0;
      var h = hubs[r.hub] || (hubs[r.hub] = { hub: r.hub, minutes: 0, modes: {} });
      h.minutes += mins;
      var parts = sec === "(unspecified)" ? ["(unspecified)"] : sec.split("/");
      var mode = parts[0], sub = parts.slice(1).join("/");
      var m = h.modes[mode] || (h.modes[mode] = { mode: mode, minutes: 0, subs: {} });
      m.minutes += mins;
      var key = sub || "";
      m.subs[key] = (m.subs[key] || 0) + mins;
    });
    return Object.keys(hubs).map(function(k){ return hubs[k]; }).sort(function(a, b){ return b.minutes - a.minutes; });
  }
  function questionRows(){
    return (data.qstats.data || []).filter(function(r){ return keepHub(r.hub); });
  }
  function openReports(){ return (data.reports.data || []).filter(function(r){ return !r.resolved; }); }

  /* ---------- panels ---------- */
  function renderOverview(){
    var el = $('[data-panel="overview"]');
    var s = (data.summary.data && data.summary.data[0]) || {};

    var q = questionRows();
    var att = 0, cor = 0;
    q.forEach(function(r){ att += r.attempts || 0; cor += r.correct || 0; });
    var acc = att ? Math.round(cor / att * 100) : 0;
    var open = openReports().length;

    var tiles = '<div class="kpis">' +
      kpi("Unique visitors", fmtNum(s.unique_visitors), rangeText() + ", all hubs") +
      kpi("Visits", fmtNum(visits), rangeText()) +
      kpi("Active time / visit", Math.round(activePerVisit) + "<small>min</small>", "time with the hub tab in view") +
      kpi("Total study time", fmtMin(totalMin), rangeText() + ", all hubs") +
      kpi("Answers logged", fmtNum(att), "all time" + (state.archived ? "" : ", live hubs")) +
      kpi("Class accuracy", acc + "<small>%</small>", "all time" + (state.archived ? "" : ", live hubs")) +
      kpi("Open reports", open, open ? "flags & suggestions to review" : "inbox is clear", open > 0) +
    '</div>';

    var hubs = hubRows();
    var maxH = hubs.reduce(function(m, r){ return Math.max(m, r.minutes); }, 0);
    var hubBody = hubs.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Hub</th><th class="n">Time</th><th></th></tr></thead><tbody>' +
      hubs.map(function(r){ return '<tr><td class="lbl">' + hubCell(r.hub) + '</td><td class="n">' + fmtMin(r.minutes) + '</td><td class="barcell">' + bar(r.minutes, maxH, false, fmtMin(r.minutes)) + '</td></tr>'; }).join("") +
      '</tbody></table></div>' : '<div class="empty">No activity in this range.</div>';

    var flat = [];
    sectionTree().forEach(function(h){
      Object.keys(h.modes).forEach(function(mk){
        var m = h.modes[mk];
        Object.keys(m.subs).forEach(function(sk){ flat.push({ hub: h.hub, mode: mk, sub: sk, minutes: m.subs[sk] }); });
      });
    });
    flat.sort(function(a, b){ return b.minutes - a.minutes; });
    flat = flat.slice(0, 8);
    var maxS = flat.length ? flat[0].minutes : 0;
    var secBody = flat.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Section</th><th class="n">Time</th><th></th></tr></thead><tbody>' +
      flat.map(function(r){
        return '<tr><td class="lbl">' + esc(sectionName(r.mode, r.sub)) + ' <span class="muted">· ' + esc(hubLabel(r.hub)) + '</span></td><td class="n">' + fmtMin(r.minutes) + '</td><td class="barcell">' + bar(r.minutes, maxS, false, fmtMin(r.minutes)) + '</td></tr>';
      }).join("") + '</tbody></table></div>' : '<div class="empty">No activity in this range.</div>';

    var tough = toughest("all").slice(0, 5);
    var toughBody = tough.length ? toughTable(tough) : '<div class="empty">Not enough answers yet.</div>';

    el.innerHTML = tiles +
      '<div class="grid-2">' +
        card("Where time goes", rangeText(), hubBody) +
        card("Busiest sections", "top 8, " + rangeText(), secBody, '<a href="#" data-goto="time">All sections →</a>') +
      '</div>' +
      card("Hardest questions right now", "lowest % correct, 3+ answers", toughBody, '<a href="#" data-goto="questions">All questions →</a>');
  }

  function sectionName(mode, sub){
    if (mode === "(unspecified)") return "Unknown section";
    return prettyPart(mode) + (sub ? " › " + prettyPart(sub) : "");
  }

  function renderTime(){
    var el = $('[data-panel="time"]');
    if (data.bySection.error || data.byHub.error) { el.innerHTML = card("Time by section", "", '<div class="err">Couldn’t load time data.</div>'); return; }
    var hubs = hubRows();
    var maxH = hubs.reduce(function(m, r){ return Math.max(m, r.minutes); }, 0);
    var hubTbl = hubs.length ? '<div class="tbl-wrap"><table class="data wide"><thead><tr><th>Hub</th><th class="n">Visitors</th><th class="n">Total time</th><th class="n">Per visitor</th><th></th></tr></thead><tbody>' +
      hubs.map(function(r){
        return '<tr><td class="lbl">' + hubCell(r.hub) + '</td><td class="n">' + fmtNum(r.visitors) + '</td><td class="n">' + fmtMin(r.minutes) + '</td><td class="n">' + fmtMin(r.visitors ? r.minutes / r.visitors : 0) + '</td><td class="barcell">' + bar(r.minutes, maxH, false, fmtMin(r.minutes)) + '</td></tr>';
      }).join("") + '</tbody></table></div>' : '<div class="empty">No activity in this range.</div>';

    var out = card("Time by hub", rangeText(), hubTbl);

    sectionTree().forEach(function(h){
      var modes = Object.keys(h.modes).map(function(k){ return h.modes[k]; }).sort(function(a, b){ return b.minutes - a.minutes; });
      var rows = "";
      modes.forEach(function(m){
        var subs = Object.keys(m.subs).map(function(k){ return { sub: k, minutes: m.subs[k] }; }).sort(function(a, b){ return b.minutes - a.minutes; });
        var onlyUntracked = subs.length === 1 && subs[0].sub === "";
        var tag = m.mode === "(unspecified)" ? "mode not detected by older tracking" : (onlyUntracked ? "all views · logged before per-view tracking" : "");
        rows += '<tr class="group"><td>' + esc(sectionName(m.mode, "")) + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</td><td class="n">' + fmtMin(m.minutes) + '</td><td class="n">' + pctOf(m.minutes, h.minutes) + '</td><td class="barcell">' + (tag ? bar(m.minutes, h.minutes, false, pctOf(m.minutes, h.minutes) + " of " + hubLabel(h.hub)) : '') + '</td></tr>';
        if (tag) return;
        subs.forEach(function(s){
          var name = s.sub ? prettyPart(s.sub) : "Main view / before per-view tracking";
          rows += '<tr class="child"><td class="lbl">' + esc(name) + '</td><td class="n">' + fmtMin(s.minutes) + '</td><td class="n">' + pctOf(s.minutes, h.minutes) + '</td><td class="barcell">' + bar(s.minutes, h.minutes, false, pctOf(s.minutes, h.minutes) + " of " + hubLabel(h.hub)) + '</td></tr>';
        });
      });
      var body = '<div class="tbl-wrap"><table class="data"><thead><tr><th>Section</th><th class="n">Time</th><th class="n">Share</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      out += card(hubCell(h.hub), fmtMin(h.minutes) + " total · " + rangeText(), body);
    });

    out += '<p class="note">Time comes from a heartbeat: every 25 seconds a hub is open and in view counts toward the exact section on screen (e.g. Compendium › Question Bank). Since 2026-09-25, time stops counting after 15 minutes with no taps, clicks, keys or scrolling (unless a lecture is playing in Listen), so tabs left open no longer inflate it. Per-view detail starts 2026-09-23 — older time only knows the top-level mode, and shows as “before per-view tracking.”</p>';
    el.innerHTML = out;
  }
  /* ---------- clicks: what people actually press, per hub ---------- */
  function clickName(t){
    var w = /^widget:/.test(t), x = t.replace(/^widget:/, "");
    var m = x.match(/^([a-z-]+)=(.*)$/);
    if (m) x = prettyPart(m[1].replace(/-/g, " ")) + ": " + m[2];
    else if (/^#/.test(x)) x = x.slice(1).replace(/[-_]/g, " ");
    else if (/^\./.test(x)) x = x.slice(1).replace(/[-_]/g, " ") + " (any)";
    return (w ? "Tools menu › " : "") + x;
  }
  /* ---------- feature events (migration_v37): what clicks and study time can't show ---------- */
  var FEATURE_GROUPS = [
    [/^view$/, "Page loads"],
    [/^tts:/, "Listen (lecture narration)"], [/^pod:/, "Timmy Time podcast"], [/^mmap:/, "Mind maps"],
    [/^fig/, "Diagrams"], [/^pet:/, "Timmy Tooth"], [/^egg:/, "Easter eggs"], [/^name:/, "Names"],
    [/^pref:/, "Settings changed"], [/^about:/, "About page"], [/^state:/, "Settings people have (daily snapshot)"], [/./, "Other"]
  ];
  var FEATURE_NOTES = {
    "tts:secs": "seconds of narration heard", "tts:end": "listened to the end", "tts:start-full": "started (As taught)", "tts:start-plain": "started (Plain English)", "tts:start-voice": "started (browser voice)",
    "egg:timmy-start": "typed TIMMY", "egg:timmy": "watched TIMMY to the end", "pet:intro": "opened his introduction", "pet:no-thanks": "said No thanks",
    "pet:adopt-button": "adopted (Adopt button)", "mmap:open": "opened a mind map", "name:set": "picked a name", "name:reset": "back to a random name", "view": "page loads"
  };
  function featureLabel(k){
    var m = /^pod:(.+):(play|secs|q1|q2|q3|q4)$/.exec(k);
    if (m) return m[1] + ": " + { play: "pressed play", secs: "seconds heard", q1: "heard 25%", q2: "heard 50%", q3: "heard 75%", q4: "heard 95% (finished)" }[m[2]];
    if (/^pet:no-thanks/.test(k)) return "said No thanks (" + k.split("-").pop() + ")";
    if (/^pet:adopt-closed/.test(k)) return "adopted by closing the intro (" + k.split("-").pop() + ")";
    if (/^fig-seen:/.test(k)) return k.slice(9) + " (on screen)";
    if (/^fig-part:/.test(k)) return k.slice(9) + " (tapped a part)";
    if (/^fig:/.test(k)) return k.slice(4) + " (moved a control)";
    return FEATURE_NOTES[k] || k.replace(/^[a-z]+:/, "");
  }
  function renderFeatures(){
    var f = data.features;
    if (!f || f.error) return card("Features", "", '<div class="err">Couldn’t load feature events (migration_v37).</div>');
    var rows = (f.data || []).filter(function(r){ return (keepHub(r.hub) || r.hub === "dashboard" || r.hub === "about") && !/^zz-/.test(r.hub); });
    if (!rows.length) return card("Features", rangeText(), '<div class="empty">No feature events yet. Tracking started 2026-10-20.</div>');
    /* people per kind across pages (a person on two hubs counts on each; the per-page split is in the tag) */
    var by = {};
    rows.forEach(function(r){
      var k = by[r.kind] || (by[r.kind] = { kind: r.kind, people: 0, total: 0, pages: {} });
      k.people = Math.max(k.people, Number(r.people) || 0); k.total += Number(r.total) || 0; k.pages[r.hub] = Number(r.people) || 0;
    });
    var groups = {};
    Object.keys(by).forEach(function(k){
      var g = FEATURE_GROUPS.filter(function(x){ return x[0].test(k); })[0][1];
      (groups[g] = groups[g] || []).push(by[k]);
    });
    var out = FEATURE_GROUPS.map(function(x){ return x[1]; }).filter(function(g, i, a){ return groups[g] && a.indexOf(g) === i; }).map(function(g){
      var list = groups[g].sort(function(a, b){ return b.people - a.people || b.total - a.total; });
      var body = '<div class="tbl-wrap"><table class="data"><thead><tr><th>Event</th><th class="n">People</th><th class="n">Count</th></tr></thead><tbody>' +
        list.slice(0, 40).map(function(k){
          var where = Object.keys(k.pages).sort(function(a, b){ return k.pages[b] - k.pages[a]; }).slice(0, 3).map(function(h){ return hubLabel(h) + " " + k.pages[h]; }).join(", ");
          var count = /secs$/.test(k.kind) ? fmtMin(k.total / 60) : fmtNum(k.total);
          return '<tr><td class="lbl">' + esc(featureLabel(k.kind)) + '<span class="tag">' + esc(where) + '</span></td><td class="n">' + fmtNum(k.people) + '</td><td class="n">' + count + '</td></tr>';
        }).join("") + '</tbody></table></div>';
      return card(esc(g), rangeText(), body);
    }).join("");
    return out + '<p class="note">From widget/clicks.js (<code>shTrack</code>), 2026-10-20 on. “People” is the most on any one page (distinct devices); the tag splits it by page. Settings snapshots are sent once a day per page, so “Settings people have” compares how many have each value.</p>';
  }

  function renderClicks(){
    var el = $('[data-panel="clicks"]');
    if (!data.clicks || data.clicks.error) { el.innerHTML = card("Clicks", "", '<div class="err">Couldn’t load click data (migration_v14).</div>'); return; }
    var byHub = {};
    (data.clicks.data || []).forEach(function(r){
      if (!keepHub(r.hub) && r.hub !== "dashboard") return;
      var h = byHub[r.hub] || (byHub[r.hub] = { hub: r.hub, total: 0, targets: {} });
      var c = Number(r.clicks) || 0; h.total += c;
      var t = h.targets[r.target] || (h.targets[r.target] = { target: r.target, clicks: 0, people: Number(r.people) || 0, sections: {} });
      t.clicks += c; t.sections[r.section || ""] = (t.sections[r.section || ""] || 0) + c;
    });
    var hubs = Object.keys(byHub).map(function(k){ return byHub[k]; }).sort(function(a, b){ return b.total - a.total; });
    if (!hubs.length) { el.innerHTML = renderFeatures() + card("Clicks", rangeText(), '<div class="empty">No clicks recorded yet. Tracking started 2026-09-25.</div>'); return; }
    var out = "";
    hubs.forEach(function(h){
      var ts = Object.keys(h.targets).map(function(k){ return h.targets[k]; }).sort(function(a, b){ return b.clicks - a.clicks; });
      var max = ts.length ? ts[0].clicks : 0;
      var rows = ts.slice(0, 40).map(function(t){
        var where = Object.keys(t.sections).sort(function(a, b){ return t.sections[b] - t.sections[a]; }).slice(0, 2).map(function(sx){ return sx ? sx.split("/").map(prettyPart).join(" › ") : "—"; }).join(", ");
        return '<tr><td class="lbl">' + esc(clickName(t.target)) + '<span class="tag">' + esc(where) + '</span></td><td class="n">' + fmtNum(t.clicks) + '</td><td class="n">' + fmtNum(t.people) + '</td><td class="barcell">' + bar(t.clicks, max, false, fmtNum(t.clicks) + " clicks") + '</td></tr>';
      }).join("");
      out += card(hubCell(h.hub), fmtNum(h.total) + " clicks · " + rangeText() + (ts.length > 40 ? " · top 40 of " + ts.length : ""),
        '<div class="tbl-wrap"><table class="data"><thead><tr><th>Button / tab</th><th class="n">Clicks</th><th class="n">People</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>');
    });
    out = renderFeatures() + out;
    out += '<p class="note">Counted per button, tab or link (answer choices are grouped, never logged one by one). “People” is distinct devices. Pair this with Time by section: something with lots of time but few clicks is being read; something nobody opens is a candidate to cut.</p>';
    el.innerHTML = out;
  }

  /* ---------- exam check-ins + search terms (migration_v23): read when a hub is archived, see LESSONS.md ---------- */
  var DEBRIEF_EXTRA = { diagrams:"Diagrams helpful", pbox_img:"Patient Box pictures helpful" };
  function renderDebriefs(){
    var d = data.debriefs;
    if (!d || d.error) return card("Exam check-ins", "", '<div class="err">Couldn’t load exam check-ins (migration_v23).</div>');
    var groups = {};
    (d.data || []).forEach(function(r){ var k = r.hub + "\u0001" + r.exam; (groups[k] = groups[k] || []).push(r); });
    var keys = Object.keys(groups).sort().reverse();
    if (!keys.length) return card("Exam check-ins", "Pop-up on each person's first dashboard visit after an exam, plus a Check in button on the hub's card (live or archived) for 60 days.", '<div class="empty">None yet. The first ones come in the day after the next exam.</div>');
    return keys.map(function(k){
      var rows = groups[k], ans = rows.filter(function(r){ return r.answers; }), p = k.split("\u0001");
      function tally(id){
        var c = {}; ans.forEach(function(r){ var v = r.answers[id]; if (v != null && v !== "") c[v] = (c[v] || 0) + 1; });
        return Object.keys(c).sort(function(a, b){ return c[b] - c[a]; }).map(function(v){ return esc(v) + " <b>" + c[v] + "</b>"; }).join(" · ") || "—";
      }
      var ready = ans.filter(function(r){ return r.answers.ready; });
      var avg = ready.length ? (ready.reduce(function(s, r){ return s + Number(r.answers.ready); }, 0) / ready.length).toFixed(1) : "—";
      var body = '<p><b>Ready (1–5):</b> average ' + avg + ' · ' + tally("ready") + '</p><p><b>How it went:</b> ' + tally("went") + '</p><p><b>Hub vs exam:</b> ' + tally("match") + '</p>';
      /* any other 1-5 rating an exam added (extraQs in index.html, e.g. Occlusion's diagrams / pbox_img) */
      var extra = {}; ans.forEach(function(r){ Object.keys(r.answers).forEach(function(id){ if (id !== "ready" && typeof r.answers[id] === "number") extra[id] = 1; }); });
      Object.keys(extra).forEach(function(id){
        var vs = ans.filter(function(r){ return typeof r.answers[id] === "number"; });

      });

      body += '<h4 style="margin:14px 0 6px">Each answer next to that person’s use of the hub</h4><div class="tbl-wrap"><table class="data"><thead><tr><th class="n">Ready</th><th>How it went</th><th class="n">Time in hub</th><th class="n">Answers</th><th class="n">Accuracy</th></tr></thead><tbody>' + trs + '</tbody></table></div>';

    }).join("");

        body += '<h4 style="margin:14px 0 6px">' + esc(q.prompt || id) + '</h4>';

        if (q.kind === "text") {
          body += vals.length ? vals.slice(0, 60).map(function(v){ return '<div class="sv-text">' + esc(v) + '</div>'; }).join("") : '<div class="empty">No written answers yet.</div>';
        } else {
          var counts = {};
          vals.forEach(function(v){ (Array.isArray(v) ? v : [v]).forEach(function(x){ counts[x] = (counts[x] || 0) + 1; }); });
          var keys = q.kind === "scale" ? ["1", "2", "3", "4", "5"] : (q.options || []).map(String);
          Object.keys(counts).forEach(function(k){ if (keys.indexOf(String(k)) < 0) keys.push(String(k)); });

          body += keys.map(function(k){ return '<div class="sv-ans"><span>' + esc(k) + '</span><span style="flex:1;max-width:50%">' + bar(counts[k] || 0, max, false, (counts[k] || 0) + " votes") + '</span><b>' + (counts[k] || 0) + '</b></div>'; }).join("");
          var others = ans.map(function(a){ return a && a[id + "_other"]; }).filter(Boolean);
          if (others.length) body += '<p class="note">“Other” answers:</p>' + others.slice(0, 60).map(function(v){ return '<div class="sv-text">' + esc(v) + '</div>'; }).join("");
          if (q.kind === "scale" && vals.length) body += '<p class="note">Average ' + (vals.reduce(function(s, v){ return s + Number(v); }, 0) / vals.length).toFixed(1) + ' / 5</p>';
        }
      });
      var toggle = '<button class="icon-btn" type="button" data-sv-toggle="' + sv.survey_id + '" data-on="' + (sv.active ? "1" : "0") + '">' + (sv.active ? "Turn off" : "Turn on") + '</button>';
      out += card(esc(sv.title) + (sv.active ? ' <span class="pill">live on the dashboard</span>' : ''),
        fmtNum(sv.responses) + " answered · " + fmtNum(sv.skipped) + " said no thanks · created " + new Date(sv.created_at).toLocaleDateString(), body, toggle);
    });
    var qRow = function(n){ return '<div class="sv-q"><input class="sv-prompt" placeholder="Question ' + n + (n > 1 ? ' (optional)' : '') + '"><select class="sv-kind"><option value="choice">Pick one</option><option value="multi">Pick any</option><option value="scale">1–5 scale</option><option value="text">Written answer</option></select><input class="sv-opts" placeholder="Options, comma-separated (for pick one / pick any)"></div>'; };
    out += card("New survey", "Shows once to each person on the dashboard, bottom corner; answering or “No thanks” both hide it for good. Only one survey is live at a time.",
      '<form class="sv-form" id="svForm"><input id="svTitle" placeholder="Title, e.g. “Help shape the hubs”" required maxlength="80">' + qRow(1) + qRow(2) + qRow(3) + qRow(4) + qRow(5) +
      '<div class="row"><label class="switch"><input type="checkbox" id="svLive" checked> Go live now</label><button class="icon-btn" type="submit">Publish survey</button><span id="svMsg" class="note" style="margin:0"></span></div></form>');
    if (!list.length) out = card("Surveys", "", '<div class="empty">No surveys yet. Publish one below, or ask a Claude session to write one.</div>') + out;
    el.innerHTML = renderDebriefs() + renderSearches() + out;
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-sv-toggle]"); if (!b) return;

    supabase.rpc("admin_set_survey_active", { p_secret: secret, p_survey: Number(b.dataset.svToggle), p_active: b.dataset.on !== "1" })

  document.addEventListener("submit", function(e){
    if (e.target.id !== "svForm") return;
    e.preventDefault();
    var f = e.target, msg = $("#svMsg"), qs = [];
    f.querySelectorAll(".sv-q").forEach(function(row, i){
      var prompt = row.querySelector(".sv-prompt").value.trim(); if (!prompt) return;
      var kind = row.querySelector(".sv-kind").value;
      var q = { id: "q" + (i + 1), kind: kind, prompt: prompt };
      if (kind === "choice" || kind === "multi") {
        q.options = row.querySelector(".sv-opts").value.split(",").map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 8);

    var title = $("#svTitle").value.trim();
    var slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36);
    msg.textContent = "Publishing…";
    supabase.rpc("admin_upsert_survey", { p_secret: secret, p_slug: slug, p_title: title, p_questions: qs, p_active: $("#svLive").checked })
      .then(function(r){
        if (r && r.error) { msg.textContent = "Couldn’t publish: " + r.error.message; return; }

      });

  function pctOf(v, total){ return total ? Math.round(v / total * 100) + "%" : "—"; }

  function toughest(hub){
    return questionRows().filter(function(r){ return (r.attempts || 0) >= 3 && (hub === "all" || r.hub === hub); })
      .map(function(r){ return { hub: r.hub, qid: r.qid, attempts: r.attempts, pct: Math.round(r.correct / r.attempts * 100) }; })
      .sort(function(a, b){ return a.pct - b.pct || b.attempts - a.attempts; });
  }
  /* question text comes from each live hub's own SH_EXPORT, read from a hidden same-site
     frame (?sh_export=1 keeps that copy from logging any activity) */
  var QTEXT = {}, qtextLoaded = {};
  function loadQuestionText(hub){
    if (qtextLoaded[hub] || isArchived(hub)) return;
    qtextLoaded[hub] = true;
    var f = document.createElement("iframe");
    f.src = "../hubs/" + encodeURIComponent(hub) + "/index.html?sh_export=1";
    f.style.cssText = "position:absolute;width:1px;height:1px;border:0;left:-9999px";
    f.setAttribute("aria-hidden", "true"); f.tabIndex = -1;
    f.onload = function(){
      try {
        var ex = f.contentWindow.SH_EXPORT;
        (ex && ex.questions || []).forEach(function(q){ QTEXT[hub + "|" + q.id] = q; });
      } catch (e) {}
      f.remove();
      renderAll();
    };
    document.body.appendChild(f);
  }
  function topWrong(hub, qid){
    var q = QTEXT[hub + "|" + qid]; if (!q || !q.choices) return null;
    /* select-all: rows count how often each option was ticked; wrong = an option not in the key */
    var isKey = Array.isArray(q.correct) ? function(i){ return q.correct.indexOf(i) > -1; } : q.answer != null ? function(i){ return i === q.answer; } : null;
    if (!isKey) return null;
    var best = null;
    (data.choices && data.choices.data || []).forEach(function(c){
      if (c.hub === hub && c.qid === qid && !isKey(c.choice) && (!best || c.picks > best.picks)) best = c;
    });
    return best && q.choices[best.choice] ? { text: q.choices[best.choice], picks: best.picks } : null;
  }
  function toughTable(rows){
    rows.forEach(function(r){ loadQuestionText(r.hub); });
    return '<div class="tbl-wrap"><table class="data wide"><thead><tr><th>Question</th><th>Hub</th><th class="n">Answers</th><th class="n">Correct</th><th></th></tr></thead><tbody>' +
      rows.map(function(r){
        var q = QTEXT[r.hub + "|" + r.qid], w = topWrong(r.hub, r.qid);
        var cell = '<span class="mono">' + esc(r.qid) + '</span>' + (q ? '<div class="qtext">' + esc(q.text) + '</div>' +
          (q.choices && q.answer != null ? '<div class="qkey">Key: ' + esc(q.choices[q.answer]) + '</div>' : '') +
          (q.choices && Array.isArray(q.correct) ? '<div class="qkey">Key: ' + esc(q.correct.map(function(i){ return q.choices[i]; }).join('; ')) + '</div>' : '') +
          (w ? '<div class="qwrong">' + (Array.isArray(q.correct) ? 'Most ticked wrong option: ' : 'Most picked wrong: ') + esc(w.text) + ' (' + w.picks + ')</div>' : '') : '');
        return '<tr><td class="lbl">' + cell + '</td><td>' + hubCell(r.hub) + '</td><td class="n">' + fmtNum(r.attempts) + '</td><td class="n">' + r.pct + '%</td><td class="barcell">' + bar(r.pct, 100, r.pct < 50, r.pct + "% correct") + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  function renderQuestions(){
    var el = $('[data-panel="questions"]');
    if (data.qstats.error) { el.innerHTML = card("Questions", "", '<div class="err">Couldn’t load question data.</div>'); return; }
    var rows = questionRows();
    var byHub = {};
    rows.forEach(function(r){
      var h = byHub[r.hub] || (byHub[r.hub] = { hub: r.hub, att: 0, cor: 0, qs: 0, rated: 0 });
      h.att += r.attempts || 0; h.cor += r.correct || 0; h.qs++; if ((r.attempts || 0) >= 3) h.rated++;
    });
    var hubs = Object.keys(byHub).map(function(k){ return byHub[k]; }).sort(function(a, b){ return b.att - a.att; });
    var sumTbl = hubs.length ? '<div class="tbl-wrap"><table class="data wide"><thead><tr><th>Hub</th><th class="n">Questions</th><th class="n">Answers</th><th class="n">Accuracy</th><th></th></tr></thead><tbody>' +
      hubs.map(function(h){
        var p = h.att ? Math.round(h.cor / h.att * 100) : 0;
        return '<tr><td class="lbl">' + hubCell(h.hub) + '</td><td class="n">' + fmtNum(h.qs) + '</td><td class="n">' + fmtNum(h.att) + '</td><td class="n">' + p + '%</td><td class="barcell">' + bar(p, 100, p < 50, p + "% correct") + '</td></tr>';
      }).join("") + '</tbody></table></div>' : '<div class="empty">No answers yet.</div>';

    if (state.qHub !== "all" && !byHub[state.qHub]) state.qHub = "all";
    var chips = '<div class="chips" id="qChips"><button type="button" data-qhub="all" aria-pressed="' + (state.qHub === "all") + '">All hubs</button>' +
      hubs.map(function(h){ return '<button type="button" data-qhub="' + esc(h.hub) + '" aria-pressed="' + (state.qHub === h.hub) + '">' + esc(hubLabel(h.hub)) + '</button>'; }).join("") + '</div>';
    var tough = toughest(state.qHub).slice(0, 25);
    var toughBody = chips + (tough.length ? toughTable(tough) : '<div class="empty">No questions with 3+ answers here yet.</div>');

    el.innerHTML = card("Accuracy by hub", "all time", sumTbl) +
      card("Toughest questions", "lowest % correct, 25 max · questions with fewer than 3 answers are left out so one fluke doesn’t rank", toughBody) +
      '<p class="note">Red bars are under 50% correct. Question IDs match each hub’s own question bank.</p>';
  }

  function renderEngagement(){
    var el = $('[data-panel="engagement"]');
    var out = "";
    /* streaks */
    var sRows = data.streaks.data || [];
    var active = sRows.find(function(r){ return r.kind === "active"; });
    var record = sRows.find(function(r){ return r.kind === "record"; });
    var ns = (data.nukeSum.data && data.nukeSum.data[0]) || {};
    /* unlocks are recorded from 2026-10-03 (migration_v33); "never used" = no launch before their next unlock */
    var nu = (data.nukeUnlocks.data || []).filter(function(r){ return keepHub(r.hub); });
    var nuSum = nu.reduce(function(s, r){ s.unlocks += r.unlocks; s.unused += r.unused; return s; }, { unlocks: 0, unused: 0 });
    out += '<div class="kpis">' +
      kpi("Longest active streak", active ? active.streak : 0, active ? esc(active.display_name) : "no one on a streak") +
      kpi("All-time streak record", record ? record.streak : 0, record ? esc(record.display_name) : "—") +
      kpi("Tactical nukes", fmtNum(ns.total_launches), rangeText()) +
      kpi("Unique launchers", fmtNum(ns.unique_launchers), rangeText()) +
      kpi("Nukes unlocked", fmtNum(nuSum.unlocks), nuSum.unused + " never used · since Oct 3") +
    '</div>';

    /* mode opens grouped by hub */
    if (data.modes.error) out += card("Most-opened modes", "", '<div class="err">Couldn’t load mode data.</div>');
    else {
      var byHub = {};
      (data.modes.data || []).forEach(function(r){
        if (!r.hub || !keepHub(r.hub)) return;
        (byHub[r.hub] = byHub[r.hub] || []).push(r);
      });
      var hubs = Object.keys(byHub).sort(function(a, b){ return sumOpens(byHub[b]) - sumOpens(byHub[a]); });
      var rows = "";
      hubs.forEach(function(h){
        var list = byHub[h].sort(function(a, b){ return (b.opens || 0) - (a.opens || 0); });
        var max = list[0] ? list[0].opens : 0;
        rows += '<tr class="group"><td colspan="2">' + esc(hubLabel(h)) + (isArchived(h) ? ' · archived' : '') + '</td><td class="n">' + fmtNum(sumOpens(list)) + '</td></tr>';
        list.forEach(function(r){
          rows += '<tr class="child"><td class="lbl">' + esc(prettyPart(r.mode)) + '</td><td class="barcell">' + bar(r.opens, max, false, r.opens + " opens") + '</td><td class="n">' + fmtNum(r.opens) + '</td></tr>';
        });
      });
      out += card("Most-opened modes", "all time · how often each top-level mode was clicked open",
        rows ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Mode</th><th></th><th class="n">Opens</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">No data yet.</div>');
    }

    /* nukes */
    var nh = (data.nukeHub.data || []).filter(function(r){ return keepHub(r.hub); });
    var nr = data.nukeRecent.data || [];
    var unlockBy = {};
    nu.forEach(function(r){ unlockBy[r.hub] = r; });
    var nukeHubs = nh.map(function(r){ return r.hub; });
    nu.forEach(function(r){ if (nukeHubs.indexOf(r.hub) < 0) nukeHubs.push(r.hub); });
    var launchBy = {};
    nh.forEach(function(r){ launchBy[r.hub] = r.launches; });
    var nukeBody = (nukeHubs.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Hub</th><th class="n">Unlocked</th><th class="n">Never used</th><th class="n">Launches</th></tr></thead><tbody>' +
        nukeHubs.map(function(h){ var u = unlockBy[h] || {}; return '<tr><td class="lbl">' + hubCell(h) + '</td><td class="n">' + fmtNum(u.unlocks || 0) + '</td><td class="n">' + fmtNum(u.unused || 0) + '</td><td class="n">' + fmtNum(launchBy[h] || 0) + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<div class="empty">No unlocks or launches in this range.</div>');
    var recentBody = nr.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Who</th><th>Hub</th><th class="n">When</th></tr></thead><tbody>' +
        nr.map(function(r){ return '<tr><td class="lbl">' + esc(r.display_name) + '</td><td>' + hubCell(r.hub) + '</td><td class="n">' + fmtDate(r.launched_at) + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<div class="empty">No launches yet.</div>';
    out += '<div class="grid-2">' + card("Nukes by hub", rangeText(), nukeBody) + card("Recent nukes", "last 10", recentBody) + '</div>';
    el.innerHTML = out;
  }
  function sumOpens(list){ return list.reduce(function(s, r){ return s + (r.opens || 0); }, 0); }

  var showResolvedReports = false;
  function renderInbox(){
    var el = $('[data-panel="inbox"]');

  /* Timmy Time comments (widget/podcast.js, migration_v47): they post at once; three reports hide one; hide or restore any here */
  function podCommentsCard(){
    var pc = data.podComments || {};
    if (pc.error) return card("Podcast comments", "", '<div class="err">Couldn’t load podcast comments (is migration_v47 applied?).</div>');
    var rows = pc.data || [];
    var body = rows.length ? rows.map(function(c){
      var state = c.hidden ? (c.hidden_by === "self" ? "Deleted by its author" : c.hidden_by === "reports" ? "Hidden by reports" : "Hidden by you") : "Showing";
      return '<div class="report' + (c.hidden ? ' is-resolved' : '') + '" data-pod-id="' + esc(c.id) + '">' +
        '<div class="report-main"><div class="report-top"><span class="pill">' + esc(hubLabel(c.hub)) + '</span><span class="pill">' + esc(c.name) + '</span>' +
        (Number(c.reports) ? '<span class="pill flag">' + esc(c.reports) + (Number(c.reports) === 1 ? ' report' : ' reports') + '</span>' : '') +
        '<span class="report-date">' + fmtDate(c.created_at) + '</span></div>' +
        '<div class="report-note">' + esc(c.body) + '</div><div class="report-sent">' + esc(state) + '</div></div>' +
        (c.hidden_by === "self" ? '' : '<button class="resolve-btn pod-hide-btn' + (c.hidden ? ' is-done' : '') + '" type="button" data-hidden="' + (c.hidden ? '1' : '0') + '">' + (c.hidden ? 'Hidden · restore' : 'Hide') + '</button>') +

  /* ---------- Insights (migration_v49): every card pairs a number with the decision it drives ----------

    "weak-spots": "Weak spots", home: "Home", podcast: "Timmy Time", arcade: "Arcade", recall: "Active recall", other: "Other", unknown: "No section sent", retired: "Retired (Atlas)" };

    var quick = cell("under 10 min", "missed");
    var lateN = 0, lateOk = 0;
    g.forEach(function(x){ if (x.after === "missed" && (x.gap === "1 to 3 days" || x.gap === "3+ days")) { lateN += x.n; lateOk += x.ok; } });
    var late = pctOf(lateOk, lateN);
    var hubs = (r.data.by_hub || []).filter(function(h){ return showHub(h.hub); }).sort(hubOrder);
    var allRetries = 0, allKnown = 0;
    var hubRows = hubs.map(function(h){
      allRetries += h.retries || 0; allKnown += h.retries_of_right || 0;
      var known = pctOf(h.retries_of_right, h.retries);
      return '<tr><td class="lbl">' + hubName(h.hub) + '</td>' + nCell(pctOf(h.first_ok, h.first_tries) + "%", false, fmtNum(h.first_tries) + " first tries") +
        nCell(pctOf(h.quick_retries_of_missed_ok, h.quick_retries_of_missed) == null ? null : pctOf(h.quick_retries_of_missed_ok, h.quick_retries_of_missed) + "%", false, fmtNum(h.quick_retries_of_missed)) +
        nCell(pctOf(h.late_retries_of_missed_ok, h.late_retries_of_missed) == null ? null : pctOf(h.late_retries_of_missed_ok, h.late_retries_of_missed) + "%", false, fmtNum(h.late_retries_of_missed)) +
        nCell(known == null ? null : known + "%", known != null && known > R.knownRetries && h.retries >= R.minRetries, fmtNum(h.retries) + " retries") + '</tr>';
    }).join("");
    var D = [], known = pctOf(allKnown, allRetries);
    if (quick && late != null && quick.pct - late > R.spacingGap) D.push('<li><b>A quick retry overstates learning</b>: a miss re-asked within 10 minutes is right ' + quick.pct + '% of the time, a day or more later ' + late + '%. Count a miss as fixed (readiness, Weak Spots, mastery) only when it is right on a later day, and put yesterday’s misses first in the Daily Drill and on Home.</li>');
    if (known != null && known > R.knownRetries) D.push('<li><b>Most re-answers go to questions already right</b>: ' + known + '% of all retries. Point the bank’s default view and the drill at questions not yet answered or missed, and say so on Home.</li>');
    return card("Spacing: what a retry shows", "Every answer to a question the same person had answered before, by the time since their previous try at it.",
      '<div class="tbl-wrap"><table class="data"><thead><tr><th>Since the previous try</th><th class="n">After a miss</th><th></th><th class="n">After a right answer</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="tbl-wrap" style="margin-top:14px"><table class="data"><thead><tr><th>Hub</th><th class="n">First try</th><th class="n">Miss, retried &lt;10 min</th><th class="n">Miss, retried 1+ day later</th><th class="n">Retries of right answers</th></tr></thead><tbody>' + hubRows + '</tbody></table></div>' + decisions(D));
  }

  function insightFeatures(){
    var m = insights.main, R = INSIGHT_RULES;
    if (!m || m.error || !m.data) return "";
    var rows = (m.data.features || []).filter(function(f){ return (showHub(f.hub) || f.hub === "dashboard") && (f.viewers || 0) >= R.minPeople; });
    rows.sort(function(a, b){ return a.hub === "dashboard" ? -1 : b.hub === "dashboard" ? 1 : hubOrder(a, b); });
    var T = { p: 0, s: 0 }, P = { p: 0, e: 0 };
    var body = rows.map(function(f){
      var v = f.viewers || 0;
      T.p += f.tour_prompted || 0; T.s += f.tour_started || 0; P.p += f.pod_play || 0; P.e += f.pod_end || 0;
      var ts = pctOf(f.tour_started, f.tour_prompted), pe = pctOf(f.pod_end, f.pod_play);
      function reach(n){ return n ? fmtNum(n) + '<span class="sub2">' + pctOf(n, v) + '%</span>' : null; }
      return '<tr><td class="lbl">' + (f.hub === "dashboard" ? "Dashboard" : hubName(f.hub)) + '<span class="sub2">since ' + esc(f.since) + '</span></td>' + nCell(fmtNum(v)) +
        nCell(f.tour_prompted ? ts + "%" : null, f.tour_prompted >= 10 && ts < R.tourStart, f.tour_prompted ? fmtNum(f.tour_started) + " of " + fmtNum(f.tour_prompted) + ", " + fmtNum(f.tour_done) + " done" : "") +
        nCell(f.pod_play ? pe + "%" : null, f.pod_play >= 5 && pe < R.podEnd, f.pod_play ? fmtNum(f.pod_end) + " of " + fmtNum(f.pod_play) + " played" : "") +
        nCell(f.listen_people ? fmtNum(f.listen_people) : null, false, f.listen_people ? fmtMin(f.listen_mins) : "") +
        nCell(f.fig_seen ? pctOf(f.fig_used, f.fig_seen) + "%" : null, false, f.fig_seen ? fmtNum(f.fig_used) + " of " + fmtNum(f.fig_seen) + " who saw one" : "") +
        nCell(reach(f.highlighters)) + nCell(reach(f.pinners)) + nCell(reach(f.find_in_notes)) + nCell(reach(f.mind_maps)) +
        nCell(f.settings_people ? pctOf(f.pet_off, f.settings_people) + "%" : null, false, f.settings_people ? "effects off " + pctOf(f.fx_off, f.settings_people) + "%" : "") + '</tr>';
    }).join("");
    var D = [];
    var ts = pctOf(T.s, T.p), pe = pctOf(P.e, P.p);
    if (T.p >= 10 && ts < R.tourStart) D.push('<li><b>Few take the tour</b>: ' + ts + '% of tour prompts led to a start (' + fmtNum(T.s) + ' of ' + fmtNum(T.p) + ', each person counted once per page, so someone asked on two pages counts twice; most who start, finish). Stop asking on arrival: offer it from the menu and teach with one-line tips where a feature is used.</li>');
    if (P.p >= 5 && pe < R.podEnd) D.push('<li><b>Most stop the episode early</b>: ' + pe + '% of listeners heard 95% of an episode. Add chapters by lecture so people can jump to what they need, and put the highest-yield lectures first.</li>');
    return card("Features: who finds them", "From feature events (widget/clicks.js), 2026-10-20 on. Small numbers are the share of that page’s people (devices that loaded it).",
      rows.length ? '<div class="tbl-wrap"><table class="data matrix"><thead><tr><th>Page</th><th class="n">People</th><th class="n">Tour started</th><th class="n">Podcast to the end</th><th class="n">Listen</th><th class="n">Figures used</th><th class="n">Highlighter</th><th class="n">Pins</th><th class="n">Find in notes</th><th class="n">Mind maps</th><th class="n">Timmy off</th></tr></thead><tbody>' + body + '</tbody></table></div>' + decisions(D) : '<div class="empty">No feature events yet.</div>');
  }

  function insightVoice(){
    var m = insights.main, R = INSIGHT_RULES;
    if (!m || m.error || !m.data) return "";
    var D = [], open = [];
    var rep = (m.data.voice || []).filter(function(v){ return showHub(v.hub) || !v.hub; });
    var repBody = rep.map(function(v){
      if (v.open) open.push(esc(v.hub ? hubLabel(v.hub) : "site") + " " + v.open);
      return '<tr><td class="lbl">' + (v.hub ? hubName(v.hub) : "Site-wide") + '</td>' + nCell(fmtNum(v.reports)) + nCell(fmtNum(v.open), v.open > 0) +
        nCell(pctOf(v.replied, v.reports) + "%") + nCell(v.median_hours_to_resolve == null ? null : v.median_hours_to_resolve + " h") + nCell(esc(v.last_report)) + '</tr>';
    }).join("");
    if (open.length) D.push(flagLine(open, "Open reports", 'Answer them in Inbox; every reply reaches the sender (<code>vault/how-to/reply-to-reports.md</code>).'));
    var cov = [], bias = [];
    var ck = (m.data.checkins || []).filter(function(c){ return showHub(c.hub); });
    var ckBody = ck.map(function(c){
      var cv = pctOf(c.people, c.hub_people), ratio = c.hub_median_mins ? Math.round(10 * c.their_median_mins / c.hub_median_mins) / 10 : null;
      var fc = cv != null && cv < R.checkinCover, fbias = ratio != null && ratio > R.checkinBias;
      if (fc) cov.push(esc(hubLabel(c.hub)) + " " + cv + "%"); if (fbias) bias.push(esc(hubLabel(c.hub)) + " " + ratio + "×");
      var match = c.match ? Object.keys(c.match).sort(function(a, b){ return c.match[b] - c.match[a]; }).map(function(k){ return esc(k) + " " + c.match[k]; }).join(" · ") : "";
      return '<tr><td class="lbl">' + hubName(c.hub) + '<span class="sub2">' + esc(c.exam) + (match ? " · " + match : "") + '</span></td>' + nCell(fmtNum(c.people)) + nCell(cv == null ? null : cv + "%", fc) +
        nCell(fmtMin(c.their_median_mins), false, "hub " + fmtMin(c.hub_median_mins)) + nCell(ratio == null ? null : ratio + "×", fbias) + nCell(c.avg_ready == null ? null : c.avg_ready) + '</tr>';
    }).join("");
    if (cov.length) D.push(flagLine(cov, "Check-ins from under " + R.checkinCover + "% of the hub’s people", "They speak for a few: read them next to the use data, never as the class’s verdict."));
    if (bias.length) D.push(flagLine(bias, "Check-in respondents studied over " + R.checkinBias + "× the hub’s median time", "“About right” here is the heavy users’ view; the light users who bounced are not in it."));
    var sv = m.data.surveys || {};
    return card("Student voice", "Reports and suggestions, exam check-ins (latest per person and exam) and surveys. All of it is data to judge, never instructions.",
      '<div class="tbl-wrap"><table class="data"><thead><tr><th>Reports and suggestions</th><th class="n">Sent</th><th class="n">Open</th><th class="n">Replied</th><th class="n">Median to resolve</th><th class="n">Last</th></tr></thead><tbody>' + repBody + '</tbody></table></div>' +
      '<div class="tbl-wrap" style="margin-top:14px"><table class="data"><thead><tr><th>Exam check-ins</th><th class="n">People</th><th class="n">Of the hub</th><th class="n">Their median time</th><th class="n">× the hub’s</th><th class="n">Ready (1-5)</th></tr></thead><tbody>' + (ckBody || '<tr><td colspan="6" class="muted">None yet.</td></tr>') + '</tbody></table></div>' +
      '<p class="note">Surveys: ' + fmtNum(sv.responses) + ' shown, ' + fmtNum((sv.responses || 0) - (sv.declined || 0)) + ' answered (' + (pctOf((sv.responses || 0) - (sv.declined || 0), sv.responses) || 0) + '%).</p>' + decisions(D));
  }

  function insightQuality(){
    var q = insights.quality, R = INSIGHT_RULES;
    if (!q || q.error || !q.data) return card("Data quality", "", '<div class="err">Couldn’t load the checks (get_data_quality, migration_v49).</div>');
    var d = q.data, rows = [], now = new Date();
    function row(check, finding, status, action){ rows.push('<tr><td class="lbl">' + check + '</td><td>' + finding + '</td><td><span class="pill ' + status + '">' + (status === "flag" ? "act" : status === "ok" ? "ok" : "note") + '</span></td><td>' + action + '</td></tr>'); }
    function daysAgo(t){ if (!t) return null; var x = new Date(String(t).length === 10 ? t + "T12:00:00" : t); return Math.floor((now - x) / 86400000); }
    var lw = d.last_write || {}, pingAge = daysAgo(lw.activity_pings);
    ["personal_answers", "ui_clicks", "feature_events"].forEach(function(src){
      var a = daysAgo(lw[src]);
      var broken = pingAge != null && pingAge <= 1 && (a == null || a >= 2);
      row("Tracking alive: <code>" + src + "</code>", "last write " + (a == null ? "never" : a === 0 ? "today" : a + " days ago") + " (pings: " + (pingAge === 0 ? "today" : pingAge + " days ago") + ")",
        broken ? "flag" : "ok", broken ? "People are studying but this stopped: check the widget code that writes it and the RPC’s grants." : "");
    });
    var sa = daysAgo(lw.search_terms);
    row("Searches", "last search logged " + (sa == null ? "never" : sa + " days ago"), "info", "Few people use Search (kept by Sam’s call, 2026-09-29); “Find this in the notes” is tracked as an event instead.");
    var tr = d.test_rows || {}, tsum = Object.keys(tr).reduce(function(s, k){ return s + (Number(tr[k]) || 0); }, 0);
    row("Test data", tsum ? Object.keys(tr).filter(function(k){ return tr[k]; }).map(function(k){ return fmtNum(tr[k]) + " rows in " + k; }).join(", ") : "none", tsum ? "flag" : "ok",
      tsum ? "Left out of every insight already; delete them (retention task note)." : "");
    var us = d.unmapped_sections || [], recent = us.filter(function(s){ var a = daysAgo(s.last_day); return a != null && a <= 30; });
    row("Sections <code>sh_surface()</code> can’t place", us.length ? us.map(function(s){ return esc(hubLabel(s.hub)) + " “" + esc(s.section || "(none)") + "” " + fmtMin(s.pings * 25 / 60) + " (last " + esc(s.last_day) + ")"; }).join("; ") : "none",
      recent.length ? "flag" : us.length ? "info" : "ok", recent.length ? "A new mode or sub-view: add it to <code>sh_surface()</code> in a migration so cross-hub numbers count it." : us.length ? "Historical only (older hubs sent no section)." : "");
    var fam = d.event_families || [], fresh = fam.filter(function(f){ return daysAgo(f.first_day) <= 14; }), quiet = fam.filter(function(f){ return daysAgo(f.last_day) > 14; });
    row("New event families (14 days)", fresh.length ? fresh.map(function(f){ return "<code>" + esc(f.family) + "</code> " + fmtNum(f.people) + " people"; }).join(", ") : "none", fresh.length ? "flag" : "ok",
      fresh.length ? "Give each a row in <code>vault/reference/event-taxonomy.md</code> (meaning, unit, emitter)." : "");
    row("Event families gone quiet (14+ days)", quiet.length ? quiet.map(function(f){ return "<code>" + esc(f.family) + "</code> last " + esc(f.last_day); }).join(", ") : "none", quiet.length ? "info" : "ok",
      quiet.length ? "Retired feature, or tracking that broke? Check the feature is still on a live page." : "");
    var oc = d.overcount || {};
    row("Time counted twice", fmtNum(oc.visitor_hours) + " visitor-hours over 60 min of pings; " + fmtMin(oc.excess_minutes) + " extra", (oc.excess_minutes || 0) > 600 ? "flag" : "info", "Two hubs visible side by side both count. Small; subtract it if a hub’s total looks inflated.");
    var al = d.alias_writes || {}, id = d.identity || {};
    row("Devices and people", fmtNum(id.visitor_ids) + " device ids, " + fmtNum(id.linked_aliases) + " linked to another; " + fmtNum((al.activity_pings || 0) + (al.personal_answers || 0)) + " writes from a linked id after linking", "info", "“People” everywhere counts devices; real people are fewer.");
    var cm = (d.choices_missing || []).filter(function(c){ return isHubId(c.hub); }), cmLive = cm.filter(function(c){ return !isArchived(c.hub) && c.no_choices > 0; });
    row("Answers with no recorded pick", cm.length ? cm.map(function(c){ return esc(hubLabel(c.hub)) + " " + c.no_choices + " of " + c.answered_20; }).join(", ") : "none", cmLive.length ? "flag" : cm.length ? "info" : "ok",
      cmLive.length ? "On a live hub: check the question type sends <code>choice</code> or <code>picks</code> with its answered event (LESSONS: select-alls sent none until 11-04)." : "Older hubs predate choice tracking.");
    var sd = d.stats_drift || [];
    row("Class counters vs personal rows", sd.length ? sd.map(function(s){ return esc(hubLabel(s.hub)) + " " + fmtNum(s.question_stats) + " vs " + fmtNum(s.personal_answers); }).join(", ") : "agree", sd.length ? "flag" : "ok", sd.length ? "One of the two answer RPCs is failing for some calls." : "");
    var st = d.storage || {}, tables = st.tables || [];
    function per(name, field){ var t = tables.filter(function(x){ return x.table === name; })[0]; return t && t.rows ? t.mb / t.rows : 0; }
    var weekly = (st.pings_last_7_days || 0) * per("activity_pings") + (st.answers_last_7_days || 0) * (per("personal_answers") + per("xp_seen"));
    var weeks = weekly > 0 ? Math.floor((500 - (st.database_mb || 0)) / weekly) : null;
    var fs = (st.database_mb || 0) > R.dbMb || (weeks != null && weeks < R.dbWeeks);
    row("Storage", fmtNum(st.database_mb) + " MB of 500; about " + (Math.round(weekly * 10) / 10) + " MB a week lately" + (weeks != null ? " (~" + weeks + " weeks to 500)" : "") +
      '<span class="sub2">' + tables.slice(0, 4).map(function(t){ return esc(t.table) + " " + t.mb + " MB"; }).join(" · ") + '</span>', fs ? "flag" : "ok",
      "Retention schedule: <code>vault/reference/analytics-retention.md</code>.");
    return card("Data quality", "Checks that keep the numbers above honest. What each means: <code>vault/reference/analytics-data-quality.md</code>.",
      '<div class="tbl-wrap"><table class="data"><thead><tr><th>Check</th><th>Finding</th><th>Status</th><th>What to do</th></tr></thead><tbody>' + rows.join("") + '</tbody></table></div>');
  }

  function renderInsights(){
    var el = $('[data-panel="insights"]');
    if (!insights || insights.pending) return;
    el.innerHTML = '<p class="note" style="margin:0">Each card pairs a number with the decision it drives: a number past its threshold turns orange and its decision is listed under the card. All time, per hub; “Include archived hubs” adds the archived ones. Thresholds and reasons: <code>vault/reference/insights-dashboard.md</code>.</p>' +
      insightScorecard() + insightSurfaces() + insightSpacing() + insightFeatures() + insightVoice() + insightQuality();
  }

  function renderAll(){
    renderOverview(); renderTime(); renderQuestions(); renderClicks(); renderEngagement(); renderSurveys(); renderInbox(); updateInboxCount(); renderRecapPanel();
    renderInsights();
  }

  /* ---------- tabs & controls ---------- */
  function showTab(t){
    state.tab = t; savePrefs();
    $$(".tabs [role=tab]").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab === t)); });
    $$(".panel").forEach(function(p){ p.hidden = p.dataset.panel !== t; });
    window.scrollTo(0, 0);
    if (t === "insights" && secret && !insights) loadInsights();
  }
  $(".tabs").addEventListener("click", function(e){
    var b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab);
  });
  document.addEventListener("click", function(e){
    var g = e.target.closest("[data-goto]");
    if (g) { e.preventDefault(); showTab(g.dataset.goto); }
    var c = e.target.closest("[data-qhub]");
    if (c) { state.qHub = c.dataset.qhub; renderQuestions(); }
  });
  $("#rangeSeg").addEventListener("click", function(e){
    var b = e.target.closest("[data-days]"); if (!b) return;
    state.days = Number(b.dataset.days); savePrefs(); syncControls(); loadAll();
  });
  $("#showArchived").addEventListener("change", function(e){
    state.archived = e.target.checked; savePrefs(); renderAll();
  });
  $("#refreshBtn").addEventListener("click", function(){ loadAll(); if (state.tab === "insights") loadInsights(); else insights = null; });
  function syncControls(){
    $$("#rangeSeg [data-days]").forEach(function(b){ b.setAttribute("aria-pressed", String(Number(b.dataset.days) === state.days)); });
    $("#showArchived").checked = state.archived;
  }

  /* inbox interactions */
  $('[data-panel="inbox"]').addEventListener("change", function(e){
    if (e.target.id === "showResolved") { showResolvedReports = e.target.checked; renderInbox(); }
    /* "Tell everyone" opens its own box, started from the reply so it can be reworded for the class */
    if (e.target.classList.contains("report-all")) {
      var cardEl = e.target.closest(".report"), ev = cardEl.querySelector(".report-everyone");
      ev.hidden = !e.target.checked;
      var msg = cardEl.querySelector(".report-all-msg"), reply = cardEl.querySelector(".report-replybox").value.trim();
      if (e.target.checked && !msg.value.trim() && reply) {
        var row = (data.reports.data || []).find(function(r){ return r.kind === cardEl.getAttribute("data-kind") && r.id === Number(cardEl.getAttribute("data-id")); });
        msg.value = (row && row.hub ? hubLabel(row.hub) + ": " : "") + reply;
      }
      if (e.target.checked) msg.focus();
    }
  });
  $('[data-panel="inbox"]').addEventListener("click", function(e){
    var pb = e.target.closest(".pod-hide-btn");
    if (pb) {
      var pid = Number(pb.closest("[data-pod-id]").getAttribute("data-pod-id")), hide = pb.getAttribute("data-hidden") !== "1";
      pb.disabled = true;
      supabase.rpc("admin_hide_pod_comment", { p_secret: secret, p_id: pid, p_hidden: hide }).then(function(res){
        if (res && !res.error) {
          (data.podComments.data || []).forEach(function(c){ if (c.id === pid) { c.hidden = hide; c.hidden_by = hide ? "admin" : null; } });
          renderInbox();
        } else pb.disabled = false;
      }, function(){ pb.disabled = false; });
      return;
    }
    var btn = e.target.closest(".resolve-btn"); if (!btn) return;
    var cardEl = btn.closest(".report");
    var kind = cardEl.getAttribute("data-kind");
    var id = Number(cardEl.getAttribute("data-id"));
    var row = (data.reports.data || []).find(function(r){ return r.kind === kind && r.id === id; });
    if (!row) return;
    var next = !row.resolved;
    var box = cardEl.querySelector(".report-replybox");
    var reply = box ? box.value.trim() : "";
    var toAll = !!(cardEl.querySelector(".report-all") || {}).checked;
    var allTitle = toAll ? cardEl.querySelector(".report-all-title").value.trim() : "";
    var allMsg = toAll ? cardEl.querySelector(".report-all-msg").value.trim() : "";
    if (next && toAll && (!allTitle || !allMsg)) { alert("Write the notice to everyone first (title and message)."); return; }
    btn.disabled = true;
    supabase.rpc("set_report_resolved", { p_secret: secret, p_kind: kind, p_id: id, p_resolved: next, p_reply: reply || null }).then(function(res){
      if (!(res && res.error)) {
        row.resolved = next;
        if (next) { if (reply) row.reply = reply; row.resolved_at = new Date().toISOString(); row.reply_seen_at = null; }
        /* "Tell everyone": a notice every visitor sees once and keeps in their Inbox (widget/replies.js) */
        if (next && toAll) {
          supabase.rpc("admin_post_notice", { p_secret: secret, p_hub: null, p_title: allTitle, p_message: allMsg, p_days: 14 }).then(function(r2){
            if (r2 && r2.error) alert("Resolved, but the notice to everyone didn't send.");
          });
        }
      }
      renderInbox(); updateInboxCount(); renderOverview();
    }, function(){ btn.disabled = false; });
  });

  /* ---------- gate ---------- */
  var gate = $("#gate"), app = $("#app"), gateInput = $("#gateInput"), gateBtn = $("#gateBtn"), gateMsg = $("#gateMsg");
  function unlock(ok, msg){
    gate.hidden = ok; app.hidden = !ok;
    if (!ok) { gateMsg.textContent = msg || ""; try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
  }
  function tryUnlock(candidate){
    secret = candidate;
    gateBtn.disabled = true;
    gateMsg.textContent = "Checking…";
    supabase.rpc("get_reports", { p_secret: secret }).then(function(res){
      gateBtn.disabled = false;
      if (res && res.error) { unlock(false, "Wrong passphrase."); return; }
      try { sessionStorage.setItem(SESSION_KEY, secret); } catch (e) {}
      gateMsg.textContent = "";
      unlock(true);
      syncControls();
      showTab(state.tab);
      loadAll();
    }, function(){
      gateBtn.disabled = false;
      unlock(false, "Couldn't reach the server — try again.");
    });
  }
  gateBtn.addEventListener("click", function(){
    var v = (gateInput.value || "").trim();
    if (!v) { gateMsg.textContent = "Type the passphrase first."; return; }
    tryUnlock(v);
  });
  gateInput.addEventListener("keydown", function(e){ if (e.key === "Enter") gateBtn.click(); });
  try { var s = sessionStorage.getItem(SESSION_KEY); if (s) tryUnlock(s); } catch (e) {}
})();
</script>
</body>
