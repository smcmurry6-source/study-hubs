<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Study Hubs">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15202A">
<meta name="robots" content="noindex,nofollow">
<title>Hub Admin — Study Hub Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../widget/vendor/supabase-2.117.2.js"></script>
<script src="../widget/recap.js"></script>
<script src="../widget/archive.js"></script>
<script src="../widget/timmy.js" defer></script>
<style>
:root{
  --ink:#1B2432; --ink-2:#4A5468; --ink-3:#6E778C;
  --paper:#EEF0ED; --paper-2:#E3E6E0; --card:#FFFFFF;
  --line:#DADDD6; --line-strong:#C2C7BC;
  --accent:#4B4FA0; --accent-ink:#33356F; --accent-soft:#E6E5F5;
  --bar:#6A6FC4; --bar-track:#ECEDF4;
  --ok:#246B64; --ok-soft:#DCEAE7;
  --warn:#A94E34; --warn-soft:#F6E1D7;
  --shadow:0 1px 2px rgba(20,25,15,.05), 0 8px 24px -16px rgba(20,25,15,.25);
  --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E9ECE6; --ink-2:#BCC3B7; --ink-3:#8E9889;
    --paper:#161915; --paper-2:#1F231D; --card:#21251F;
    --line:#333A2F; --line-strong:#48513F;
    --accent:#9EA1E0; --accent-ink:#D0D2F3; --accent-soft:#2A2C52;
    --bar:#8E92DA; --bar-track:#2C3129;
    --ok:#6FC2B8; --ok-soft:#16302D;
    --warn:#E48C6C; --warn-soft:#3D251C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -16px rgba(0,0,0,.6);
  }
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; color:inherit;}
.num, td.n, .n{font-variant-numeric:tabular-nums;}
[hidden]{display:none !important;}

/* ---------- gate ---------- */
#gate{max-width:340px; margin:14vh auto 0; padding:0 16px; text-align:center;}
#gate h1{font-family:var(--font-display); font-weight:600; font-size:26px; margin:6px 0 0;}
.kicker{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
#gate input{width:100%; margin-top:20px; padding:12px 14px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--card); color:var(--ink); font-size:15px; text-align:center;}
#gate button{margin-top:10px; width:100%; padding:12px 14px; border:none; border-radius:var(--r-pill); background:var(--ink); color:var(--paper); font-weight:600; font-size:15px;}
#gateMsg{margin-top:12px; font-size:13px; color:var(--warn); min-height:18px;}

/* ---------- shell ---------- */
.topbar{position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.topbar-inner{max-width:1080px; margin:0 auto; padding:14px 16px 0;}
.title-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.title-row h1{font-family:var(--font-display); font-weight:600; font-size:22px; margin:0; letter-spacing:-.01em;}
.controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.seg{display:inline-flex; background:var(--paper-2); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px;}
.seg button{border:none; background:none; padding:5px 12px; border-radius:var(--r-pill); font-size:13px; font-weight:600; color:var(--ink-2);}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
.switch{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); cursor:pointer; user-select:none;}
.switch input{accent-color:var(--accent); width:16px; height:16px;}
.icon-btn{border:1px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:5px 12px; font-size:13px; font-weight:600; color:var(--ink-2);}
.tabs{display:flex; gap:4px; margin-top:12px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{border:none; background:none; padding:9px 12px 11px; font-size:14px; font-weight:600; color:var(--ink-3); border-bottom:2px solid transparent; white-space:nowrap;}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent);}
.tabs .count{display:inline-block; min-width:18px; margin-left:6px; padding:0 6px; border-radius:var(--r-pill); background:var(--warn-soft); color:var(--warn); font-size:11.5px; line-height:18px; text-align:center;}
.tabs .count.zero{background:var(--paper-2); color:var(--ink-3);}

main{max-width:1080px; margin:0 auto; padding:22px 16px 80px;}
.panel{display:flex; flex-direction:column; gap:18px;}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow); padding:18px 20px; min-width:0;}
.card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.card h2{font-size:16px; font-weight:700; margin:0;}
.card .sub{font-size:13px; color:var(--ink-3); margin:2px 0 0;}
.card-head .aside{font-size:12.5px; color:var(--ink-3);}
.grid-2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px;}
@media (max-width:760px){ .grid-2{grid-template-columns:1fr;} .card{padding:16px;} }

/* ---------- KPI tiles ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(132px,1fr)); gap:12px;}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2, minmax(0,1fr));} .kpi .value{font-size:24px;} }
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:14px 16px; box-shadow:var(--shadow);}
.kpi .label{font-size:12.5px; font-weight:600; color:var(--ink-2);}
.kpi .value{font-size:28px; font-weight:700; line-height:1.15; margin-top:4px; letter-spacing:-.01em;}
.kpi .value small{font-size:14px; font-weight:600; color:var(--ink-3); margin-left:3px;}
.kpi .hint{font-size:12px; color:var(--ink-3); margin-top:3px;}
.kpi.alert .value{color:var(--warn);}

/* ---------- data tables with inline bars ---------- */
.tbl-wrap{overflow-x:auto; margin:0 -4px;}
table.data{width:100%; border-collapse:collapse; font-size:14px;}
table.data th{font-size:12px; font-weight:600; color:var(--ink-3); text-align:left; padding:0 8px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.data td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.data tr:last-child td{border-bottom:none;}
table.data th.n, table.data td.n{text-align:right; white-space:nowrap;}
table.data td.lbl{font-weight:600;}
table.data td.lbl .muted{font-weight:400;}
table.data td.barcell{width:34%; min-width:110px;}
table.data tr.group td{padding-top:14px; font-size:14px; font-weight:700; color:var(--ink);}
table.data tr.group td .tag{display:block; font-size:12px; font-weight:500; color:var(--ink-3); margin-top:1px;}
.card-head .aside a{color:var(--accent); font-weight:600; text-decoration:none;}
.card-head .aside a:hover{text-decoration:underline;}
@media (max-width:560px){ table.data.wide td.barcell, table.data.wide th.barcell{display:none;} }
table.data tr.child td.lbl{padding-left:22px; font-weight:500; color:var(--ink-2);}
table.data tr:hover td{background:color-mix(in srgb, var(--accent-soft) 45%, transparent);}
table.data tr.group:hover td{background:none;}
.muted{color:var(--ink-3);}
.bar{position:relative; height:10px; border-radius:4px; background:var(--bar-track);}
.bar > span{position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--bar); min-width:3px;}
.bar.low > span{background:var(--warn);}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:var(--r-pill); background:var(--paper-2); color:var(--ink-2); white-space:nowrap;}
.pill.arch{background:transparent; border:1px solid var(--line-strong); color:var(--ink-3);}
.pill.flag{background:var(--warn-soft); color:var(--warn);}
.pill.suggestion{background:var(--accent-soft); color:var(--accent-ink);}

.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.chips button{border:1px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:4px 11px; font-size:13px; font-weight:600; color:var(--ink-2);}
.chips button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper);}

.sv-form{display:grid; gap:10px;}
.rc-wrap{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:20px; align-items:start;}
@media (max-width:760px){ .rc-wrap{grid-template-columns:1fr;} }
.rc-form{display:grid; gap:12px;}
.rc-form label{display:grid; gap:4px; font-size:13px; font-weight:600; color:var(--ink-2);}
.rc-form label.rc-check{display:flex; align-items:center; gap:8px;}
.rc-form input[type=text], .rc-form input[type=date], .rc-form select{font:inherit; font-size:14px; font-weight:400; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);}
.rc-btns{display:flex; gap:8px; flex-wrap:wrap;}
.rc-btns button{border:1px solid var(--line-strong); background:var(--card); border-radius:var(--r-pill); padding:8px 16px; font-size:14px; font-weight:600;}
.rc-btns button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.rc-btns button:disabled{opacity:.5; cursor:default;}
.rc-pub{display:grid; gap:8px; padding-top:12px; border-top:1px solid var(--line);}
.rc-note{font-size:12.5px; color:var(--ink-3); line-height:1.45; margin:0;}
.rc-preview canvas{display:block; width:100%; max-width:540px; height:auto; border-radius:12px; box-shadow:var(--shadow);}
.sv-form input, .sv-form select, .sv-form textarea{font:inherit; font-size:14px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);}
.sv-form .sv-q{display:grid; grid-template-columns:1fr 140px; gap:8px; padding:10px; border:1px dashed var(--line); border-radius:10px;}
.sv-form .sv-q input.sv-opts{grid-column:1 / -1;}
.sv-form .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.sv-ans{display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-bottom:1px dashed var(--line); font-size:14px;}
.sv-text{font-size:14px; padding:6px 0; border-bottom:1px dashed var(--line);}
.note{font-size:12.5px; color:var(--ink-3); margin:12px 0 0;}
.empty{color:var(--ink-3); font-size:14px; padding:18px 0; text-align:center;}
.err{color:var(--warn); font-size:14px; padding:12px 0;}

/* ---------- inbox ---------- */
.report{border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; display:flex; gap:14px; align-items:flex-start;}
.report + .report{margin-top:10px;}
.report.is-resolved{opacity:.55;}
.report-main{flex:1; min-width:0;}
.report-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
.report-date{font-size:12.5px; color:var(--ink-3);}
.report-note{font-size:14.5px; white-space:pre-wrap; overflow-wrap:anywhere;}
.report-reply{margin-top:8px; font-size:13.5px; white-space:pre-wrap; overflow-wrap:anywhere; border-left:3px solid var(--ok); padding-left:10px;}
.report-sent{display:block; margin-top:6px; font-size:12.5px; color:var(--ink-3);}
.report-replybox{display:block; width:100%; min-height:64px; margin-top:10px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--paper-2); color:inherit; font:inherit; font-size:14px; resize:vertical;}
.report-all-title{display:block; width:100%; margin-top:6px; padding:7px 10px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--paper-2); color:inherit; font:inherit; font-size:14px; font-weight:600;}
.report-everyone .report-replybox, .report-all-msg{display:block; width:100%; min-height:80px; margin-top:6px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--r-m); background:var(--paper-2); color:inherit; font:inherit; font-size:14px; resize:vertical;}
.report-everyone[hidden]{display:none;}
.report-opts{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.report-opts .report-sent{margin-top:4px;}
.resolve-btn{flex:none; border:1px solid var(--line-strong); background:var(--paper-2); color:var(--ink-2); padding:5px 12px; border-radius:var(--r-pill); font-size:12.5px; font-weight:600;}
.resolve-btn.is-done{border-color:var(--ok); color:var(--ok); background:var(--ok-soft);}
@media (max-width:560px){ .report{flex-direction:column; gap:10px;} }
.qtext{font-weight:500;white-space:normal;margin-top:3px;max-width:62ch;line-height:1.4}
.qkey{font-size:12.5px;color:var(--good,#1F8A5B);margin-top:3px;white-space:normal}
.qwrong{font-size:12.5px;color:var(--bad,#B3261E);margin-top:2px;white-space:normal}
/* ---------- keyboard focus (every control on this page) ---------- */
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

/* ---------- live ---------- */
.live-total{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:2px 0 4px;}
.live-total .value{font-size:44px; font-weight:700; line-height:1; letter-spacing:-.02em;}
.live-total .unit{font-size:15px; color:var(--ink-2); font-weight:600;}
.live-hub{border-top:1px solid var(--line); padding:12px 0;}
.live-hub:first-child{border-top:none; padding-top:2px;}
.live-hub-head{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; font-weight:600;}
.names{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; padding:0; list-style:none;}
.names li{font-size:13.5px; padding:4px 11px; border-radius:var(--r-pill); background:var(--paper-2); color:var(--ink); overflow-wrap:anywhere; max-width:100%;}
.msg-ok{color:var(--ok);} .msg-err{color:var(--warn);}

/* ---------- hubs: archive overrides ---------- */
.hub-group + .hub-group{margin-top:18px;}
.hub-group h3{font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); margin:0 0 8px;}
.hub-row{border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px;}
.hub-row + .hub-row{margin-top:10px;}
.hub-row-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.hub-row-head h4{font-size:15px; margin:0; flex:1 1 220px; min-width:0; overflow-wrap:anywhere;}
.state{display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:var(--r-pill); white-space:nowrap;}
.state.s-live{background:var(--ok-soft); color:var(--ok);}
.state.s-archived{background:var(--paper-2); color:var(--ink-2); border:1px solid var(--line-strong);}
.state.s-hidden{background:var(--warn-soft); color:var(--warn);}
.hub-meta{font-size:13.5px; color:var(--ink-2); margin:6px 0 0; overflow-wrap:anywhere;}
.hub-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.btn{min-height:40px; padding:8px 16px; border-radius:var(--r-pill); border:1px solid var(--line-strong); background:var(--card); color:var(--ink); font-size:14px; font-weight:600;}
.btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.btn:disabled{opacity:.5; cursor:default;}
.arch-form{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.arch-form fieldset{border:none; margin:0; padding:0; display:grid; gap:6px; min-width:0;}
.arch-form legend{font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:6px; padding:0;}
.arch-opt{display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; min-height:44px;}
.arch-opt input{margin:3px 0 0; accent-color:var(--accent); width:18px; height:18px; flex:none;}
.arch-opt b{font-size:14px;}
.arch-opt small{display:block; color:var(--ink-3); font-size:12.5px; line-height:1.4;}
.arch-opt:has(input:checked){border-color:var(--accent); background:var(--accent-soft);}
.arch-opt:has(input:disabled){opacity:.55; cursor:not-allowed;}
.arch-fields{display:grid; gap:10px; grid-template-columns:repeat(2, minmax(0,1fr)); margin-top:12px;}
@media (max-width:560px){ .arch-fields{grid-template-columns:1fr;} }
.arch-fields label{display:grid; gap:4px; font-size:13px; font-weight:600; color:var(--ink-2); min-width:0;}
.arch-fields small{font-weight:400; color:var(--ink-3); font-size:12px;}
.arch-fields input{font:inherit; font-size:15px; font-weight:400; padding:8px 10px; min-height:42px; width:100%; border:1px solid var(--line-strong); border-radius:8px; background:var(--card); color:var(--ink);}
.arch-fields input:disabled{opacity:.55;}
.arch-confirm{margin-top:12px; padding:12px 14px; border-radius:10px; border:1px solid var(--warn); background:var(--warn-soft); color:var(--ink);}
.arch-confirm p{margin:0;}
.arch-msg{font-size:13.5px; margin:10px 0 0;}
.arch-msg:empty{display:none;}
.log-list{list-style:none; margin:0; padding:0;}
.log-list li{padding:10px 0; border-top:1px solid var(--line); font-size:14px; overflow-wrap:anywhere;}
.log-list li:first-child{border-top:none; padding-top:0;}
.log-list .when{display:block; font-size:12.5px; color:var(--ink-3);}
.rules{margin:0; padding-left:20px; font-size:14px;}
.rules li + li{margin-top:6px;}
</style>
</head>
<body>

<div id="gate">
  <span class="kicker">Study hub admin</span>
  <h1>Enter passphrase</h1>
  <input type="password" id="gateInput" placeholder="passphrase" autocomplete="off">
  <button id="gateBtn" type="button">Unlock</button>
  <div id="gateMsg"></div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title-row">
        <h1>Hub admin</h1>
        <div class="controls">
          <div class="seg" id="rangeSeg" role="group" aria-label="Time range">
            <button type="button" data-days="7" aria-pressed="false">7 days</button>
            <button type="button" data-days="30" aria-pressed="true">30 days</button>
            <button type="button" data-days="90" aria-pressed="false">90 days</button>
          </div>
          <label class="switch"><input type="checkbox" id="showArchived"> Include archived hubs</label>
          <button class="icon-btn" id="refreshBtn" type="button">Refresh</button>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button role="tab" data-tab="live" aria-selected="false">Live<span class="count zero" id="liveCount" hidden>0</span></button>
        <button role="tab" data-tab="time" aria-selected="false">Time by section</button>
        <button role="tab" data-tab="questions" aria-selected="false">Questions</button>
        <button role="tab" data-tab="clicks" aria-selected="false">Clicks</button>
        <button role="tab" data-tab="engagement" aria-selected="false">Engagement</button>
        <button role="tab" data-tab="surveys" aria-selected="false">Surveys</button>
        <button role="tab" data-tab="recap" aria-selected="false">Recap</button>
        <button role="tab" data-tab="hubs" aria-selected="false">Hubs</button>
        <button role="tab" data-tab="inbox" aria-selected="false">Inbox<span class="count zero" id="inboxCount">0</span></button>
      </nav>
    </div>
  </header>

  <main>
    <section class="panel" data-panel="overview"></section>
    <section class="panel" data-panel="live" hidden></section>
    <section class="panel" data-panel="time" hidden></section>
    <section class="panel" data-panel="questions" hidden></section>
    <section class="panel" data-panel="clicks" hidden></section>
    <section class="panel" data-panel="engagement" hidden></section>
    <section class="panel" data-panel="surveys" hidden></section>
    <section class="panel" data-panel="inbox" hidden></section>
    <section class="panel" data-panel="recap" hidden></section>
    <section class="panel" data-panel="hubs" hidden></section>
  </main>
</div>

<script>
(function(){
  var SB_URL = "https://thytmzsgymydbzcqdnix.supabase.co";

  /* ---------- exam check-ins + search terms (migration_v23): read when a hub is archived, see LESSONS.md ---------- */
  var DEBRIEF_EXTRA = { diagrams:"Diagrams helpful", pbox_img:"Patient Box pictures helpful" };
  function renderDebriefs(){
    var d = data.debriefs;
    if (!d || d.error) return card("Exam check-ins", "", '<div class="err">Couldn’t load exam check-ins (migration_v23).</div>');
    /* newest first everywhere: the rows inside a group by created_at, and the groups by their newest check-in
       (never by hub name or exam label: those sort as text) */
    var groups = {};
    sortNewest(d.data || []).forEach(function(r){ var k = r.hub + "\u0001" + r.exam; (groups[k] = groups[k] || []).push(r); });
    var keys = Object.keys(groups).sort(function(a, b){ return newestAt(groups[b]) - newestAt(groups[a]) || (a < b ? -1 : a > b ? 1 : 0); });
    if (!keys.length) return card("Exam check-ins", "Pop-up on each person's first dashboard visit after an exam, plus a Check in button on the hub's card (live or archived) for 60 days.", '<div class="empty">None yet. The first ones come in the day after the next exam.</div>');
    return keys.map(function(k){
      var rows = groups[k], ans = rows.filter(function(r){ return r.answers; }), p = k.split("\u0001");
      function tally(id){
        var c = {}; ans.forEach(function(r){ var v = r.answers[id]; if (v != null && v !== "") c[v] = (c[v] || 0) + 1; });
        return Object.keys(c).sort(function(a, b){ return c[b] - c[a]; }).map(function(v){ return esc(v) + " <b>" + c[v] + "</b>"; }).join(" · ") || "—";
      }
      var ready = ans.filter(function(r){ return r.answers.ready; });
      var avg = ready.length ? (ready.reduce(function(s, r){ return s + Number(r.answers.ready); }, 0) / ready.length).toFixed(1) : "—";
      var body = '<p><b>Ready (1–5):</b> average ' + avg + ' · ' + tally("ready") + '</p><p><b>How it went:</b> ' + tally("went") + '</p><p><b>Hub vs exam:</b> ' + tally("match") + '</p>';
      /* any other 1-5 rating an exam added (extraQs in index.html, e.g. Occlusion's diagrams / pbox_img) */
      var extra = {}; ans.forEach(function(r){ Object.keys(r.answers).forEach(function(id){ if (id !== "ready" && typeof r.answers[id] === "number") extra[id] = 1; }); });
      Object.keys(extra).forEach(function(id){
        var vs = ans.filter(function(r){ return typeof r.answers[id] === "number"; });
        body += '<p><b>' + esc(DEBRIEF_EXTRA[id] || id) + ' (1–5):</b> average ' + (vs.reduce(function(s, r){ return s + r.answers[id]; }, 0) / vs.length).toFixed(1) + ' · ' + tally(id) + '</p>';
      });
      var notes = ans.filter(function(r){ return r.answers.missed; });
      body += '<h4 style="margin:14px 0 6px">What the hub could do better (before 2026-10-21: what it missed)</h4>' + (notes.length ? notes.map(function(r){ return '<div class="sv-text">' + esc(r.answers.missed) + '</div>'; }).join("") : '<div class="empty">No written answers.</div>');
      var trs = ans.map(function(r){ return '<tr><td class="n">' + esc(r.answers.ready || "—") + '</td><td>' + esc(r.answers.went || "—") + '</td><td class="n">' + fmtMin(r.minutes) + '</td><td class="n">' + fmtNum(r.answered) + '</td><td class="n">' + (r.accuracy == null ? "—" : r.accuracy + "%") + '</td></tr>'; }).join("");
      body += '<h4 style="margin:14px 0 6px">Each answer next to that person’s use of the hub</h4><div class="tbl-wrap"><table class="data"><thead><tr><th class="n">Ready</th><th>How it went</th><th class="n">Time in hub</th><th class="n">Answers</th><th class="n">Accuracy</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
      var who = {}; ans.forEach(function(r){ who[r.visitor_id] = 1; });
      return '<div data-checkin-group="' + esc(p[0]) + '" data-newest="' + newestAt(rows) + '">' + card("Exam check-in · " + hubCell(p[0]) + " · " + esc(p[1]), fmtNum(ans.length) + " check-ins from " + fmtNum(Object.keys(who).length) + " people (someone can send more than one) · newest " + esc(fmtDate(new Date(newestAt(rows)).toISOString())), body) + '</div>';
    }).join("");
  }
  function renderSearches(){

    var rows = (d.data || []).filter(function(r){ return keepHub(r.hub); });

  /* ---------- surveys: results, on/off, and a form to publish one ---------- */

          Object.keys(counts).forEach(function(k){ if (keys.indexOf(String(k)) < 0) keys.push(String(k)); });

          body += keys.map(function(k){ return '<div class="sv-ans"><span>' + esc(k) + '</span><span style="flex:1;max-width:50%">' + bar(counts[k] || 0, max, false, (counts[k] || 0) + " votes") + '</span><b>' + (counts[k] || 0) + '</b></div>'; }).join("");
          var others = ans.map(function(a){ return a && a[id + "_other"]; }).filter(Boolean);
          if (others.length) body += '<p class="note">“Other” answers:</p>' + others.slice(0, 60).map(function(v){ return '<div class="sv-text">' + esc(v) + '</div>'; }).join("");
          if (q.kind === "scale" && vals.length) body += '<p class="note">Average ' + (vals.reduce(function(s, v){ return s + Number(v); }, 0) / vals.length).toFixed(1) + ' / 5</p>';
        }

      var toggle = '<button class="icon-btn" type="button" data-sv-toggle="' + sv.survey_id + '" data-on="' + (sv.active ? "1" : "0") + '">' + (sv.active ? "Turn off" : "Turn on") + '</button>';

        fmtNum(sv.responses) + " answered · " + fmtNum(sv.skipped) + " said no thanks · created " + new Date(sv.created_at).toLocaleDateString(), body, toggle);
    });
    var qRow = function(n){ return '<div class="sv-q"><input class="sv-prompt" placeholder="Question ' + n + (n > 1 ? ' (optional)' : '') + '"><select class="sv-kind"><option value="choice">Pick one</option><option value="multi">Pick any</option><option value="scale">1–5 scale</option><option value="text">Written answer</option></select><input class="sv-opts" placeholder="Options, comma-separated (for pick one / pick any)"></div>'; };
    out += card("New survey", "Shows once to each person on the dashboard, bottom corner; answering or “No thanks” both hide it for good. Only one survey is live at a time.",
      '<form class="sv-form" id="svForm"><input id="svTitle" placeholder="Title, e.g. “Help shape the hubs”" required maxlength="80">' + qRow(1) + qRow(2) + qRow(3) + qRow(4) + qRow(5) +
      '<div class="row"><label class="switch"><input type="checkbox" id="svLive" checked> Go live now</label><button class="icon-btn" type="submit">Publish survey</button><span id="svMsg" class="note" style="margin:0"></span></div></form>');
    if (!list.length) out = card("Surveys", "", '<div class="empty">No surveys yet. Publish one below, or ask a Claude session to write one.</div>') + out;
    el.innerHTML = renderDebriefs() + renderSearches() + out;
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-sv-toggle]"); if (!b) return;
    b.disabled = true;
    supabase.rpc("admin_set_survey_active", { p_secret: secret, p_survey: Number(b.dataset.svToggle), p_active: b.dataset.on !== "1" })
      .then(function(){ return rpc("get_survey_results", { p_secret: secret }); })
      .then(function(r){ data.surveys = r; renderSurveys(); });

  document.addEventListener("submit", function(e){
    if (e.target.id !== "svForm") return;
    e.preventDefault();
    var f = e.target, msg = $("#svMsg"), qs = [];
    f.querySelectorAll(".sv-q").forEach(function(row, i){
      var prompt = row.querySelector(".sv-prompt").value.trim(); if (!prompt) return;
      var kind = row.querySelector(".sv-kind").value;
      var q = { id: "q" + (i + 1), kind: kind, prompt: prompt };
      if (kind === "choice" || kind === "multi") {
        q.options = row.querySelector(".sv-opts").value.split(",").map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 8);

      }
      if (qs) qs.push(q);
    });

    var title = $("#svTitle").value.trim();
    var slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36);
    msg.textContent = "Publishing…";
    supabase.rpc("admin_upsert_survey", { p_secret: secret, p_slug: slug, p_title: title, p_questions: qs, p_active: $("#svLive").checked })
      .then(function(r){
        if (r && r.error) { msg.textContent = "Couldn’t publish: " + r.error.message; return; }
        return rpc("get_survey_results", { p_secret: secret }).then(function(res){ data.surveys = res; renderSurveys(); });
      });
  });

  function pctOf(v, total){ return total ? Math.round(v / total * 100) + "%" : "—"; }

  function toughest(hub){
    return questionRows().filter(function(r){ return (r.attempts || 0) >= 3 && (hub === "all" || r.hub === hub); })
      .map(function(r){ return { hub: r.hub, qid: r.qid, attempts: r.attempts, pct: Math.round(r.correct / r.attempts * 100) }; })
      .sort(function(a, b){ return a.pct - b.pct || b.attempts - a.attempts; });
  }
  /* question text comes from each live hub's own SH_EXPORT, read from a hidden same-site
     frame (?sh_export=1 keeps that copy from logging any activity) */
  var QTEXT = {}, qtextLoaded = {};
  function loadQuestionText(hub){
    if (qtextLoaded[hub] || isArchived(hub)) return;
    qtextLoaded[hub] = true;
    var f = document.createElement("iframe");
    f.src = "../hubs/" + encodeURIComponent(hub) + "/index.html?sh_export=1";
    f.style.cssText = "position:absolute;width:1px;height:1px;border:0;left:-9999px";
    f.setAttribute("aria-hidden", "true"); f.tabIndex = -1;
    f.onload = function(){
      try {
        var ex = f.contentWindow.SH_EXPORT;
        (ex && ex.questions || []).forEach(function(q){ QTEXT[hub + "|" + q.id] = q; });
      } catch (e) {}
      f.remove();
      renderAll();
    };
    document.body.appendChild(f);
  }
  function topWrong(hub, qid){
    var q = QTEXT[hub + "|" + qid]; if (!q || !q.choices) return null;
    /* select-all: rows count how often each option was ticked; wrong = an option not in the key */
    var isKey = Array.isArray(q.correct) ? function(i){ return q.correct.indexOf(i) > -1; } : q.answer != null ? function(i){ return i === q.answer; } : null;
    if (!isKey) return null;
    var best = null;
    (data.choices && data.choices.data || []).forEach(function(c){
      if (c.hub === hub && c.qid === qid && !isKey(c.choice) && (!best || c.picks > best.picks)) best = c;
    });
    return best && q.choices[best.choice] ? { text: q.choices[best.choice], picks: best.picks } : null;
  }
  function toughTable(rows){
    rows.forEach(function(r){ loadQuestionText(r.hub); });
    return '<div class="tbl-wrap"><table class="data wide"><thead><tr><th>Question</th><th>Hub</th><th class="n">Answers</th><th class="n">Correct</th><th></th></tr></thead><tbody>' +
      rows.map(function(r){
        var q = QTEXT[r.hub + "|" + r.qid], w = topWrong(r.hub, r.qid);
        var cell = '<span class="mono">' + esc(r.qid) + '</span>' + (q ? '<div class="qtext">' + esc(q.text) + '</div>' +
          (q.choices && q.answer != null ? '<div class="qkey">Key: ' + esc(q.choices[q.answer]) + '</div>' : '') +
          (q.choices && Array.isArray(q.correct) ? '<div class="qkey">Key: ' + esc(q.correct.map(function(i){ return q.choices[i]; }).join('; ')) + '</div>' : '') +
          (w ? '<div class="qwrong">' + (Array.isArray(q.correct) ? 'Most ticked wrong option: ' : 'Most picked wrong: ') + esc(w.text) + ' (' + w.picks + ')</div>' : '') : '');
        return '<tr><td class="lbl">' + cell + '</td><td>' + hubCell(r.hub) + '</td><td class="n">' + fmtNum(r.attempts) + '</td><td class="n">' + r.pct + '%</td><td class="barcell">' + bar(r.pct, 100, r.pct < 50, r.pct + "% correct") + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  function renderQuestions(){
    var el = $('[data-panel="questions"]');
    if (data.qstats.error) { el.innerHTML = card("Questions", "", '<div class="err">Couldn’t load question data.</div>'); return; }
    var rows = questionRows();
    var byHub = {};
    rows.forEach(function(r){
      var h = byHub[r.hub] || (byHub[r.hub] = { hub: r.hub, att: 0, cor: 0, qs: 0, rated: 0 });
      h.att += r.attempts || 0; h.cor += r.correct || 0; h.qs++; if ((r.attempts || 0) >= 3) h.rated++;
    });
    var hubs = Object.keys(byHub).map(function(k){ return byHub[k]; }).sort(function(a, b){ return b.att - a.att; });
    var sumTbl = hubs.length ? '<div class="tbl-wrap"><table class="data wide"><thead><tr><th>Hub</th><th class="n">Questions</th><th class="n">Answers</th><th class="n">Accuracy</th><th></th></tr></thead><tbody>' +
      hubs.map(function(h){
        var p = h.att ? Math.round(h.cor / h.att * 100) : 0;
        return '<tr><td class="lbl">' + hubCell(h.hub) + '</td><td class="n">' + fmtNum(h.qs) + '</td><td class="n">' + fmtNum(h.att) + '</td><td class="n">' + p + '%</td><td class="barcell">' + bar(p, 100, p < 50, p + "% correct") + '</td></tr>';
      }).join("") + '</tbody></table></div>' : '<div class="empty">No answers yet.</div>';

    if (state.qHub !== "all" && !byHub[state.qHub]) state.qHub = "all";
    var chips = '<div class="chips" id="qChips"><button type="button" data-qhub="all" aria-pressed="' + (state.qHub === "all") + '">All hubs</button>' +
      hubs.map(function(h){ return '<button type="button" data-qhub="' + esc(h.hub) + '" aria-pressed="' + (state.qHub === h.hub) + '">' + esc(hubLabel(h.hub)) + '</button>'; }).join("") + '</div>';
    var tough = toughest(state.qHub).slice(0, 25);
    var toughBody = chips + (tough.length ? toughTable(tough) : '<div class="empty">No questions with 3+ answers here yet.</div>');

    el.innerHTML = card("Accuracy by hub", "all time", sumTbl) +
      card("Toughest questions", "lowest % correct, 25 max · questions with fewer than 3 answers are left out so one fluke doesn’t rank", toughBody) +
      '<p class="note">Red bars are under 50% correct. Question IDs match each hub’s own question bank.</p>';
  }

  function renderEngagement(){

    out += '<div class="kpis">' +
      kpi("Longest active streak", active ? active.streak : 0, active ? esc(active.display_name) : "no one on a streak") +

        list.forEach(function(r){
          rows += '<tr class="child"><td class="lbl">' + esc(prettyPart(r.mode)) + '</td><td class="barcell">' + bar(r.opens, max, false, r.opens + " opens") + '</td><td class="n">' + fmtNum(r.opens) + '</td></tr>';
        });
      });
      out += card("Most-opened modes", "all time · how often each top-level mode was clicked open",
        rows ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Mode</th><th></th><th class="n">Opens</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">No data yet.</div>');
    }

    /* nukes */
    var nh = (data.nukeHub.data || []).filter(function(r){ return keepHub(r.hub); });
    var nr = data.nukeRecent.data || [];
    var unlockBy = {};
    nu.forEach(function(r){ unlockBy[r.hub] = r; });
    var nukeHubs = nh.map(function(r){ return r.hub; });
    nu.forEach(function(r){ if (nukeHubs.indexOf(r.hub) < 0) nukeHubs.push(r.hub); });
    var launchBy = {};
    nh.forEach(function(r){ launchBy[r.hub] = r.launches; });
    var nukeBody = (nukeHubs.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Hub</th><th class="n">Unlocked</th><th class="n">Never used</th><th class="n">Launches</th></tr></thead><tbody>' +
        nukeHubs.map(function(h){ var u = unlockBy[h] || {}; return '<tr><td class="lbl">' + hubCell(h) + '</td><td class="n">' + fmtNum(u.unlocks || 0) + '</td><td class="n">' + fmtNum(u.unused || 0) + '</td><td class="n">' + fmtNum(launchBy[h] || 0) + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<div class="empty">No unlocks or launches in this range.</div>');
    var recentBody = nr.length ? '<div class="tbl-wrap"><table class="data"><thead><tr><th>Who</th><th>Hub</th><th class="n">When</th></tr></thead><tbody>' +
        nr.map(function(r){ return '<tr><td class="lbl">' + esc(r.display_name) + '</td><td>' + hubCell(r.hub) + '</td><td class="n">' + fmtDate(r.launched_at) + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<div class="empty">No launches yet.</div>';
    out += '<div class="grid-2">' + card("Nukes by hub", rangeText(), nukeBody) + card("Recent nukes", "last 10", recentBody) + '</div>';
    el.innerHTML = out;
  }
  function sumOpens(list){ return list.reduce(function(s, r){ return s + (r.opens || 0); }, 0); }

  var showResolvedReports = false;

    var h = x.h, r = admState(x), row = r.row, id = h.id, open = hubAdm.open && hubAdm.open.hub === id, page = hubAdm.pages[id];
    var out = '<div class="hub-row" data-arch-hub="' + esc(id) + '"><div class="hub-row-head"><h4>' + esc(h.title || hubLabel(id)) + '</h4>' + stateBadge(r.state) +
      (r.source === "manual" ? '<span class="pill flag">Set by hand</span>' : '<span class="pill">Automatic</span>') + '</div>';
    out += '<p class="hub-meta">' + esc(scheduleText(x, r)) + '</p>';
    if (row && row.active) out += '<p class="hub-meta"><b>Set by hand: ' + STATE_WORD[row.state] + '</b> ' + (row.until ? "until " + esc(when(row.until)) + ", then the dates decide again" : "until you change it") +
      '. Set ' + esc(when(row.set_at)) + '.' + (row.note ? ' Note: “' + esc(row.note) + '”' : '') + '</p>';
    else if (row && !row.active) out += '<p class="hub-meta muted">An earlier override (' + STATE_WORD[row.state] + ') ended ' + esc(when(row.until)) + '; the dates decide again.</p>';
    if (page === false) out += '<p class="hub-meta muted">Its page has been removed, so it can’t be set to Live.</p>';
    if (hubAdm.msg && hubAdm.msgHub === id && !open) out += '<p class="arch-msg ' + (hubAdm.msg.ok ? 'msg-ok' : 'msg-err') + '" role="status">' + esc(hubAdm.msg.text) + '</p>';
    out += '<div class="hub-actions"><button type="button" class="btn" data-arch-edit="' + esc(id) + '" aria-expanded="' + open + '" aria-controls="arch-form-' + esc(id) + '">Change…</button>' +
      (row && row.active && !open ? '<button type="button" class="btn" data-arch-auto="' + esc(id) + '">Back to automatic</button>' : '') + '</div>';
    if (open) out += formHTML(x, r);
    return out + '</div>';
  }
  function formHTML(x, r){
    var id = x.h.id, o = hubAdm.open, cur = r.source === "manual" ? r.state : "auto", pick = o.pick || cur, page = hubAdm.pages[id];
    var opts = [["auto", "Automatic", "The dates decide: " + STATE_WORD[r.auto].toLowerCase() + " right now."],
      ["live", "Live", STATE_WHAT.live[0].toUpperCase() + STATE_WHAT.live.slice(1) + "."],
      ["archived", "Archived", STATE_WHAT.archived[0].toUpperCase() + STATE_WHAT.archived.slice(1) + "."],
      ["hidden", "Hidden", STATE_WHAT.hidden[0].toUpperCase() + STATE_WHAT.hidden.slice(1) + "."]];
    var nm = "arch-st-" + id;
    var untilVal = o.until != null ? o.until : (r.row && r.row.active && r.row.until ? localInput(new Date(r.row.until)) : "");
    var out = '<form class="arch-form" id="arch-form-' + esc(id) + '" data-arch-form="' + esc(id) + '" novalidate>' +
      '<fieldset><legend>Show ' + esc(x.h.title || hubLabel(id)) + ' on the dashboard as</legend>' +
      opts.map(function(op){
        var dis = op[0] === "live" && page === false;
        return '<label class="arch-opt"><input type="radio" name="' + esc(nm) + '" value="' + op[0] + '"' + (pick === op[0] ? ' checked' : '') + (dis ? ' disabled' : '') + '>' +
          '<span><b>' + op[1] + (op[0] === cur ? ' (now)' : '') + '</b><small>' + esc(op[2]) + '</small></span></label>';
      }).join("") + '</fieldset>' +
      '<div class="arch-fields"><label>End time (optional)<input type="datetime-local" name="until" step="60" value="' + esc(untilVal) + '"' + (pick === "auto" ? ' disabled' : '') + '><small>Blank: until you change it. After it, the dates decide again.</small></label>' +
      '<label>Note for the log (optional)<input type="text" name="note" maxlength="300" autocomplete="off" value="' + esc(o.note != null ? o.note : "") + '" placeholder="Why, e.g. exam moved to Nov 21"><small>Only you see it, here and in the log.</small></label></div>' +
      (o.review ? '' : '<div class="hub-actions"><button type="submit" class="btn primary">Review change</button><button type="button" class="btn" data-arch-cancel="' + esc(id) + '">Cancel</button></div>');
    if (o.review) out += '<div class="arch-confirm" tabindex="-1" role="group" aria-label="Confirm the change"><p>' + esc(o.review.text) + '</p>' +
      '<div class="hub-actions"><button type="button" class="btn primary" data-arch-confirm="' + esc(id) + '"' + (hubAdm.busy ? ' disabled' : '') + '>' + (hubAdm.busy ? 'Saving…' : 'Confirm') + '</button>' +
      '<button type="button" class="btn" data-arch-back="' + esc(id) + '"' + (hubAdm.busy ? ' disabled' : '') + '>Go back</button></div></div>';
    if (hubAdm.msg && hubAdm.msgHub === id) out += '<p class="arch-msg ' + (hubAdm.msg.ok ? 'msg-ok' : 'msg-err') + '" role="status">' + esc(hubAdm.msg.text) + '</p>';
    return out + '</form>';
  }
  function localInput(d){ var p = function(n){ return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()); }
  function changeText(x, r, pick, until){
    var name = x.h.title || hubLabel(x.h.id);
    var keep = " Its page and link, its questions, the analytics and everyone’s progress stay as they are.";
    if (pick === "auto") {
      var after = window.shArchive.resolve(x.h, null, new Date(), hubAdm.dash.options, x.listed);
      return name + " goes back to Automatic: the dates decide, so it shows as " + STATE_WORD[after.state] + " now (" + STATE_WHAT[after.state] + ")." + keep;
    }
    return name + " will show as " + STATE_WORD[pick] + " on the dashboard from now " + (until ? "until " + when(until) + ", then the dates decide again" : "until you change it") +
      ": " + STATE_WHAT[pick] + "." + keep + " Students see it the next time they open the dashboard; an open dashboard checks again within 5 minutes.";
  }
  function renderHubAdmin(){
    var el = $('[data-panel="hubs"]'); if (!el) return;
    if (!window.shArchive) { el.innerHTML = card("Hubs", "", '<div class="err">widget/archive.js didn’t load. Reload the page.</div>'); return; }
    var head = card("How a hub’s dashboard state is decided", "",
      '<ol class="rules"><li><b>A state you set here wins</b> (Live, Archived or Hidden) until you set the hub back to Automatic, or until its end time if you give one.</li>' +
      '<li><b>Otherwise the dates in the dashboard’s code decide:</b> a hub archives at 10 pm on its last exam day (or its <code>archiveOn</code>) and its card goes 10 days later (or on its <code>hideCardOn</code>).</li>' +
      '<li><b>Nothing is deleted or moved.</b> The hub’s page and direct link, its questions, the analytics and everyone’s progress stay. Check-ins still follow the exam dates. Every change is in the log below.</li></ol>');
    if (!hubAdm.dash) { el.innerHTML = head + card("Hubs", "", hubAdm.dashErr ? '<div class="err">Couldn’t read the dashboard’s hub list (' + esc(hubAdm.dashErr.message || hubAdm.dashErr) + ').</div>' : '<div class="empty">Loading…</div>'); return; }
    var groups = { live: [], archived: [], hidden: [] };
    allAdmHubs().forEach(function(x){ groups[admState(x).state].push(x); });
    var body = (hubAdm.err ? '<div class="err">Couldn’t load the overrides' + (/function|does not exist|PGRST202|404/i.test(String(hubAdm.err.message || hubAdm.err.code || "")) ? ' (needs migration_v49)' : '') + '. Showing the dates only; changes can’t be saved.</div>' : '') +
      ["live", "archived", "hidden"].map(function(st){
        if (!groups[st].length) return "";
        return '<div class="hub-group"><h3>' + STATE_WORD[st] + ' · ' + groups[st].length + '</h3>' + groups[st].map(hubRowHTML).join("") + '</div>';
      }).join("");
    var log = hubAdm.log;
    var logBody = log == null ? '<div class="empty">' + (hubAdm.err ? 'The log needs migration_v49.' : 'Loading…') + '</div>'
      : !log.length ? '<div class="empty">No changes yet. Every override set here is listed, newest first.</div>'
      : '<ol class="log-list">' + log.slice().sort(function(a, b){ return (Date.parse(b.at) - Date.parse(a.at)) || (b.id - a.id); }).map(function(l){
          return '<li><span class="when">' + esc(when(l.at)) + '</span><b>' + esc(hubLabel(l.hub)) + ':</b> ' + STATE_WORD[l.old_state] + (l.old_until ? ' (until ' + esc(when(l.old_until)) + ')' : '') +
            ' → ' + STATE_WORD[l.new_state] + (l.new_until ? ' (until ' + esc(when(l.new_until)) + ')' : '') + (l.note ? ' · “' + esc(l.note) + '”' : '') + '</li>';
        }).join("") + '</ol>';
    el.innerHTML = head + card("Hubs on the dashboard", "What students see now, and why", body, '<button class="icon-btn" type="button" id="hubsRefresh">Refresh</button>') +
      card("Change log", "Newest first. One passphrase is shared, so a note is the way to say who and why.", logBody);
    if (hubAdm.focus) { var f = el.querySelector(hubAdm.focus); hubAdm.focus = null; if (f) f.focus(); }
  }
  function admHub(id){ return allAdmHubs().filter(function(x){ return x.h.id === id; })[0] || null; }
  function readForm(id){
    var f = document.querySelector('[data-arch-form="' + id + '"]'); if (!f) return null;
    var c = f.querySelector('input[type=radio]:checked');
    return { pick: c ? c.value : "auto", until: f.querySelector('[name=until]').value, note: f.querySelector('[name=note]').value };
  }
  var hubsPanel = $('[data-panel="hubs"]');
  hubsPanel.addEventListener("change", function(e){
    var f = e.target.closest("[data-arch-form]"); if (!f || !hubAdm.open) return;
    var v = readForm(f.dataset.archForm);
    hubAdm.open.pick = v.pick; hubAdm.open.until = v.until; hubAdm.open.note = v.note;
    if (e.target.type === "radio") {
      var reviewing = !!hubAdm.open.review;
      hubAdm.open.review = null; hubAdm.msg = null; f.querySelector('[name=until]').disabled = v.pick === "auto";
      /* a different choice while the confirmation is up: back to the form, focus kept on the choice */
      if (reviewing) { hubAdm.focus = '[data-arch-form="' + f.dataset.archForm + '"] input[value="' + v.pick + '"]'; renderHubAdmin(); }
    }
  });
  hubsPanel.addEventListener("input", function(e){
    var f = e.target.closest("[data-arch-form]"); if (!f || !hubAdm.open) return;
    var v = readForm(f.dataset.archForm); hubAdm.open.until = v.until; hubAdm.open.note = v.note;
  });
  hubsPanel.addEventListener("submit", function(e){
    var f = e.target.closest("[data-arch-form]"); if (!f) return;
    e.preventDefault();
    var id = f.dataset.archForm, x = admHub(id); if (!x || !hubAdm.open) return;
    var v = readForm(id), r = admState(x), until = null;
    hubAdm.open.pick = v.pick; hubAdm.open.until = v.until; hubAdm.open.note = v.note; hubAdm.msgHub = id;
    if (hubAdm.err) { hubAdm.msg = { ok: false, text: "The overrides didn’t load, so nothing can be saved. Refresh and try again." }; renderHubAdmin(); return; }
    if (v.pick !== "auto" && v.until) {
      until = new Date(v.until);
      if (isNaN(until) || until.getTime() < Date.now() + 60000) { hubAdm.msg = { ok: false, text: "The end time has to be in the future. Leave it blank to keep the state until you change it." }; hubAdm.focus = '[data-arch-form="' + id + '"] [name=until]'; renderHubAdmin(); return; }
      if (until.getTime() > Date.now() + 400 * 864e5) { hubAdm.msg = { ok: false, text: "The end time can be at most 400 days away." }; hubAdm.focus = '[data-arch-form="' + id + '"] [name=until]'; renderHubAdmin(); return; }
    }
    var curUntil = r.source === "manual" && r.until ? r.until.getTime() : null, cur = r.source === "manual" ? r.state : "auto";
    if (v.pick === cur && (v.pick === "auto" || (until ? until.getTime() : null) === curUntil)) { hubAdm.msg = { ok: false, text: "That is how it is set now: nothing to change." }; renderHubAdmin(); return; }
    hubAdm.msg = null;
    hubAdm.open.review = { pick: v.pick, until: until, text: changeText(x, r, v.pick, until), version: r.version };
    hubAdm.focus = '[data-arch-form="' + id + '"] .arch-confirm';
    renderHubAdmin();
  });
  hubsPanel.addEventListener("click", function(e){
    var b;
    if (e.target.closest("#hubsRefresh")) { hubAdm.dash = null; hubAdm.pages = {}; loadHubAdmin(); return; }
    if ((b = e.target.closest("[data-arch-edit]"))) {
      var id = b.dataset.archEdit;
      if (hubAdm.open && hubAdm.open.hub === id) { hubAdm.open = null; hubAdm.focus = '[data-arch-edit="' + id + '"]'; }
      else { hubAdm.open = { hub: id }; hubAdm.msg = null; hubAdm.focus = '[data-arch-form="' + id + '"] input[type=radio]:checked'; }
      renderHubAdmin(); return;
    }
    if ((b = e.target.closest("[data-arch-auto]"))) {
      var ida = b.dataset.archAuto, xa = admHub(ida); if (!xa) return;
      var ra = admState(xa);
      hubAdm.open = { hub: ida, pick: "auto", review: { pick: "auto", until: null, text: changeText(xa, ra, "auto", null), version: ra.version } };
      hubAdm.msg = null; hubAdm.focus = '[data-arch-form="' + ida + '"] .arch-confirm'; renderHubAdmin(); return;
    }
    if ((b = e.target.closest("[data-arch-cancel]"))) { var idc = b.dataset.archCancel; hubAdm.open = null; hubAdm.msg = null; hubAdm.focus = '[data-arch-edit="' + idc + '"]'; renderHubAdmin(); return; }
    if ((b = e.target.closest("[data-arch-back]"))) { var idb = b.dataset.archBack; hubAdm.open.review = null; hubAdm.focus = '[data-arch-form="' + idb + '"] [type=submit]'; renderHubAdmin(); return; }
    if ((b = e.target.closest("[data-arch-confirm]"))) {
      var idk = b.dataset.archConfirm, o = hubAdm.open; if (!o || !o.review || hubAdm.busy) return;
      hubAdm.busy = true; renderHubAdmin();
      var note = (o.note || "").trim();
      supabase.rpc("admin_set_hub_archive", { p_secret: secret, p_hub: idk, p_state: o.review.pick, p_until: o.review.until ? o.review.until.toISOString() : null,
        p_note: note || null, p_expect: o.review.version }).then(function(res){
        hubAdm.busy = false;
        var err = res && res.error;
        if (err) {
          var conflict = err.code === "40001" || /conflict/i.test(err.message || "");
          hubAdm.msgHub = idk;
          hubAdm.msg = { ok: false, text: conflict ? "This hub was changed in another tab or on another device since the page loaded. It has been reloaded: check it and try again." : "Couldn’t save: " + (err.message || "the server said no") + "." };
          if (conflict) { hubAdm.open = null; hubAdm.focus = '[data-arch-edit="' + idk + '"]'; return loadHubAdmin(); }
          renderHubAdmin(); return;
        }
        var saved = (res && res.data) || {};
        hubAdm.open = null; hubAdm.msgHub = idk;
        hubAdm.msg = { ok: true, text: saved.changed === false ? "Nothing changed: it was already set that way." : "Saved: " + STATE_WORD[o.review.pick] + (o.review.until ? " until " + when(o.review.until) : "") + ". It’s in the log below." };
        hubAdm.focus = '[data-arch-edit="' + idk + '"]';
        return loadHubAdmin();
      }, function(){ hubAdm.busy = false; hubAdm.msgHub = idk; hubAdm.msg = { ok: false, text: "Couldn’t reach the server. Nothing was changed; try again." }; renderHubAdmin(); });
    }
  });
  hubsPanel.addEventListener("keydown", function(e){
    if (e.key !== "Escape" || !hubAdm.open) return;
    var id = hubAdm.open.hub; hubAdm.open = null; hubAdm.msg = null; hubAdm.focus = '[data-arch-edit="' + id + '"]'; renderHubAdmin();
  });

  function onTab(t){
    if (t === "live") pollLive(false); else liveStop();
    if (t === "hubs" && !hubAdm.loading && (!hubAdm.dash || !hubAdm.rows)) loadHubAdmin();
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") liveStop(); else if (state.tab === "live") pollLive(false);
  });

  function renderAll(){
    renderOverview(); renderTime(); renderQuestions(); renderClicks(); renderEngagement(); renderSurveys(); renderInbox(); updateInboxCount(); renderRecapPanel();
  }

  /* ---------- tabs & controls ---------- */
  function showTab(t){
    state.tab = t; savePrefs();
    $$(".tabs [role=tab]").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab === t)); });
    $$(".panel").forEach(function(p){ p.hidden = p.dataset.panel !== t; });
    window.scrollTo(0, 0);
    onTab(t);
  }
  $(".tabs").addEventListener("click", function(e){
    var b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab);
  });
  document.addEventListener("click", function(e){
    var g = e.target.closest("[data-goto]");
    if (g) { e.preventDefault(); showTab(g.dataset.goto); }
    var c = e.target.closest("[data-qhub]");
    if (c) { state.qHub = c.dataset.qhub; renderQuestions(); }
  });
  $("#rangeSeg").addEventListener("click", function(e){
    var b = e.target.closest("[data-days]"); if (!b) return;
    state.days = Number(b.dataset.days); savePrefs(); syncControls(); loadAll();
  });
  $("#showArchived").addEventListener("change", function(e){
    state.archived = e.target.checked; savePrefs(); renderAll();
  });
  $("#refreshBtn").addEventListener("click", function(){
    loadAll();
    if (state.tab === "live") pollLive(true);
    if (state.tab === "hubs") { hubAdm.dash = null; hubAdm.pages = {}; loadHubAdmin(); }
  });
  function syncControls(){
    $$("#rangeSeg [data-days]").forEach(function(b){ b.setAttribute("aria-pressed", String(Number(b.dataset.days) === state.days)); });
    $("#showArchived").checked = state.archived;
  }

  /* inbox interactions */
  $('[data-panel="inbox"]').addEventListener("change", function(e){
    if (e.target.id === "showResolved") { showResolvedReports = e.target.checked; renderInbox(); }
    /* "Tell everyone" opens its own box, started from the reply so it can be reworded for the class */
    if (e.target.classList.contains("report-all")) {
      var cardEl = e.target.closest(".report"), ev = cardEl.querySelector(".report-everyone");
      ev.hidden = !e.target.checked;
      var msg = cardEl.querySelector(".report-all-msg"), reply = cardEl.querySelector(".report-replybox").value.trim();
      if (e.target.checked && !msg.value.trim() && reply) {
        var row = (data.reports.data || []).find(function(r){ return r.kind === cardEl.getAttribute("data-kind") && r.id === Number(cardEl.getAttribute("data-id")); });
        msg.value = (row && row.hub ? hubLabel(row.hub) + ": " : "") + reply;
      }
      if (e.target.checked) msg.focus();
    }
  });
  $('[data-panel="inbox"]').addEventListener("click", function(e){
    var pb = e.target.closest(".pod-hide-btn");
    if (pb) {
      var pid = Number(pb.closest("[data-pod-id]").getAttribute("data-pod-id")), hide = pb.getAttribute("data-hidden") !== "1";
      pb.disabled = true;
      supabase.rpc("admin_hide_pod_comment", { p_secret: secret, p_id: pid, p_hidden: hide }).then(function(res){
        if (res && !res.error) {
          (data.podComments.data || []).forEach(function(c){ if (c.id === pid) { c.hidden = hide; c.hidden_by = hide ? "admin" : null; } });
          renderInbox();
        } else pb.disabled = false;
      }, function(){ pb.disabled = false; });
      return;
    }
    var btn = e.target.closest(".resolve-btn"); if (!btn) return;
    var cardEl = btn.closest(".report");
    var kind = cardEl.getAttribute("data-kind");
    var id = Number(cardEl.getAttribute("data-id"));
    var row = (data.reports.data || []).find(function(r){ return r.kind === kind && r.id === id; });
    if (!row) return;
    var next = !row.resolved;
    var box = cardEl.querySelector(".report-replybox");
    var reply = box ? box.value.trim() : "";
    var toAll = !!(cardEl.querySelector(".report-all") || {}).checked;
    var allTitle = toAll ? cardEl.querySelector(".report-all-title").value.trim() : "";
    var allMsg = toAll ? cardEl.querySelector(".report-all-msg").value.trim() : "";
    if (next && toAll && (!allTitle || !allMsg)) { alert("Write the notice to everyone first (title and message)."); return; }
    btn.disabled = true;
    supabase.rpc("set_report_resolved", { p_secret: secret, p_kind: kind, p_id: id, p_resolved: next, p_reply: reply || null }).then(function(res){
      if (!(res && res.error)) {
        row.resolved = next;
        if (next) { if (reply) row.reply = reply; row.resolved_at = new Date().toISOString(); row.reply_seen_at = null; }
        /* "Tell everyone": a notice every visitor sees once and keeps in their Inbox (widget/replies.js) */
        if (next && toAll) {
          supabase.rpc("admin_post_notice", { p_secret: secret, p_hub: null, p_title: allTitle, p_message: allMsg, p_days: 14 }).then(function(r2){
            if (r2 && r2.error) alert("Resolved, but the notice to everyone didn't send.");
          });
        }
      }
      renderInbox(); updateInboxCount(); renderOverview();
    }, function(){ btn.disabled = false; });
  });

  /* ---------- gate ---------- */
  var gate = $("#gate"), app = $("#app"), gateInput = $("#gateInput"), gateBtn = $("#gateBtn"), gateMsg = $("#gateMsg");
  function unlock(ok, msg){
    gate.hidden = ok; app.hidden = !ok;
    if (!ok) { gateMsg.textContent = msg || ""; try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
  }
  function tryUnlock(candidate){
    secret = candidate;
    gateBtn.disabled = true;
    gateMsg.textContent = "Checking…";
    supabase.rpc("get_reports", { p_secret: secret }).then(function(res){
      gateBtn.disabled = false;
      if (res && res.error) { unlock(false, "Wrong passphrase."); return; }
      try { sessionStorage.setItem(SESSION_KEY, secret); } catch (e) {}
      gateMsg.textContent = "";
      unlock(true);
      syncControls();
      showTab(state.tab);
      loadAll();
    }, function(){
      gateBtn.disabled = false;
      unlock(false, "Couldn't reach the server — try again.");
    });
  }
  gateBtn.addEventListener("click", function(){
    var v = (gateInput.value || "").trim();
    if (!v) { gateMsg.textContent = "Type the passphrase first."; return; }
    tryUnlock(v);
  });
  gateInput.addEventListener("keydown", function(e){ if (e.key === "Enter") gateBtn.click(); });
  try { var s = sessionStorage.getItem(SESSION_KEY); if (s) tryUnlock(s); } catch (e) {}
})();
</script>
</body>
</html>
