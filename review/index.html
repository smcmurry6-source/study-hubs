<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png?v=2">

<title>Admin · Study Hubs</title>

<style>
/* The admin page (Sam only). Style: taste-skill's "framed sheet" app style (seed 373358903), kept to the dashboard's
   face: Instrument Sans and its ink, the frame tinted from the dashboard's blue-grey ground, the sheet white, and every
   hub shown with its dashboard class colour as a small dot (the same colours as the hub cards and the recap).
   One gutter (16), cards 8px inside a 16px sheet, controls 32px (44px on touch), no shadows at rest.
   Grid: 12 columns, 16px gap; at 1440 the sheet is 1440 - 228 - 8 = 1204 wide, 1156 inside its 24px padding:
   12 x 83 + 11 x 16 = 1172 ... columns are fr units, so the cards always land on the sheet's padding edges. */
:root{
  --frame:#EEF2F4; --sheet:#FFFFFF; --raised:#F4F6F8; --active:#E1E7EB;
  --border:#E2E7EA; --rule:#EDF0F2; --control:#C5CED5;
  --text:#15202A; --muted:#4A5864; --faint:#5A6874;
  --accent:#2F6FD6; --accent-soft:#E7EFFB; --primary:#15202A; --primary-ink:#FFFFFF;
  --positive:#1F7A50; --negative:#B42318;
  --pill-pos-bg:#DCF5E6; --pill-pos-ink:#0B3D23; --pill-neg-bg:#FDE8E4; --pill-neg-ink:#7E1D14;
  --pill-warn-bg:#FFF6DB; --pill-warn-ink:#7A4A06; --pill-bg:#EDF0F2; --pill-ink:#33404B;
  --font:'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --fs-title:24px; --fs-section:16px; --fs-body:14px; --fs-small:12px; --fs-kpi:24px; --fs-lead:32px;
  --sidebar:228px; --inset:8px; --pad:24px; --gap:16px; --card-pad:20px;
  --r-sheet:16px; --r-card:8px; --r-control:6px; --ctl:32px;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --frame:#000000; --sheet:#111111; --raised:#1B1B1B; --active:#262626;
    --border:#2A2A2A; --rule:#1F1F1F; --control:#4A4A4A;
    --text:#F3F3F3; --muted:#B4B4B4; --faint:#9A9A9A;
    --accent:#7AA7F2; --accent-soft:#16233A; --primary:#F3F3F3; --primary-ink:#000000;
    --positive:#4CC88A; --negative:#F07A6A;
    --pill-pos-bg:#14291D; --pill-pos-ink:#6BD9A0; --pill-neg-bg:#2E1814; --pill-neg-ink:#F59A8C;
    --pill-warn-bg:#2B2310; --pill-warn-ink:#E9B949; --pill-bg:#222222; --pill-ink:#E2E2E2;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{margin:0; background:var(--frame); color:var(--text); font:var(--fs-body)/20px var(--font); -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;}
button,input,select,textarea{font:inherit; color:inherit;}
a{color:inherit;}
[hidden]{display:none !important;}
.num, table, .kpi-value{font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
.muted{color:var(--muted);}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

/* ---------- sign-in ---------- */
.gate{min-height:100svh; display:grid; place-items:center; padding:16px;}
.gate-card{width:min(360px, 100%); background:var(--sheet); border:1px solid var(--border); border-radius:var(--r-sheet); padding:28px 24px;}
.gate-card img{display:block; width:36px; height:36px; border-radius:8px;}
.gate-card h1{font-size:22px; line-height:28px; font-weight:600; margin-top:16px; letter-spacing:-.01em;}
.gate-card p{color:var(--muted); margin-top:4px;}
.gate-card label{display:block; font-weight:500; margin-top:20px;}
.gate-card input{display:block; width:100%; height:40px; margin-top:8px; padding:0 12px; border:1px solid var(--control); border-radius:var(--r-control); background:var(--sheet);}
.gate-card .btn{width:100%; margin-top:16px; height:40px;}
#gateMsg{min-height:20px; margin-top:12px; color:var(--negative);}

/* ---------- shell: a tinted L-frame (sidebar) and a white sheet ---------- */
.app{display:grid; grid-template-columns:var(--sidebar) minmax(0,1fr); min-height:100svh;}
.sidebar{position:sticky; top:0; height:100svh; display:flex; flex-direction:column; padding:16px 12px; overflow:auto;}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 0; text-decoration:none;}
.brand img{width:28px; height:28px; border-radius:7px; flex:none;}
.brand b{display:block; font-weight:600; line-height:18px;}
.brand span{display:block; color:var(--muted); font-size:var(--fs-small); line-height:16px;}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:20px;}
.group-label{margin:20px 8px 6px; font-size:var(--fs-small); color:var(--faint);}
.nav-item{display:flex; align-items:center; gap:8px; min-height:32px; padding:6px 8px; border:0; border-radius:8px; background:none; color:var(--muted); text-decoration:none; text-align:left; cursor:pointer; transition:background-color .15s ease, color .15s ease;}
.nav-item:hover{background:var(--active); color:var(--text);}
.nav-item[aria-current="page"]{background:var(--active); color:var(--text); font-weight:500;}
.nav-item .count{margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--pill-neg-bg); color:var(--pill-neg-ink); font-size:var(--fs-small); line-height:20px; text-align:center; font-weight:600;}
.sidebar .bottom{margin-top:auto; padding-top:20px; display:flex; flex-direction:column; gap:2px;}
.sheet{min-width:0; margin:var(--inset) var(--inset) var(--inset) 0; background:var(--sheet); border:1px solid var(--border); border-radius:var(--r-sheet); padding:var(--pad); min-height:calc(100svh - 2 * var(--inset));}
.mbar, .sidebar .sheet-close{display:none;}

/* ---------- the view's title row: h1, the finding, scope controls and freshness ---------- */
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; margin-bottom:24px;}
.view-head h1{font-size:var(--fs-title); line-height:30px; font-weight:600; letter-spacing:-.01em;}
.view-head .sub{margin-top:4px; color:var(--muted); font-size:15px; line-height:22px; max-width:70ch;}
.view-tools{display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap;}
.stamp{color:var(--faint); font-size:var(--fs-small);}
.segmented{display:inline-flex; padding:2px; border-radius:8px; background:var(--raised); border:1px solid var(--border);}
.segmented button{height:26px; padding:0 10px; border:0; border-radius:6px; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap;}
.segmented button[aria-pressed="true"]{background:var(--sheet); color:var(--text); font-weight:500; outline:1px solid var(--border); outline-offset:-1px;}
.toggle{display:inline-flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap;}
.switch{appearance:none; -webkit-appearance:none; width:32px; height:20px; margin:0; border-radius:999px; background:var(--control); position:relative; cursor:pointer; flex:none; transition:background-color .2s ease;}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s var(--ease);}
.switch:checked{background:var(--text);} .switch:checked::after{transform:translateX(12px);}
@media (prefers-color-scheme: dark){ .switch::after{background:#111;} .switch:not(:checked)::after{background:#ddd;} }

/* ---------- buttons and fields ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:var(--ctl); padding:5px 12px; border-radius:var(--r-control); border:1px solid var(--control); background:var(--sheet); color:var(--text); font-weight:500; cursor:pointer; text-decoration:none; white-space:nowrap; transition:background-color .15s ease, transform .12s var(--ease);}
.btn:hover{background:var(--raised);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
.btn.primary:hover{opacity:.9;}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted);}
.btn.ghost:hover{background:var(--raised); color:var(--text);}
.btn.danger{color:var(--negative);}
.btn:disabled{opacity:.55; cursor:default; transform:none;}
.field{display:grid; gap:8px; min-width:0;}
.field > span, .field legend{font-weight:500;}
.field small, .hint{color:var(--muted); font-size:var(--fs-small); line-height:16px;}
.input{width:100%; min-height:38px; padding:8px 12px; border:1px solid var(--control); border-radius:var(--r-control); background:var(--sheet); color:var(--text);}
textarea.input{min-height:76px; resize:vertical; line-height:20px;}
.input::placeholder{color:var(--faint);}
.input:disabled{opacity:.55;}
.card-link{color:var(--text); font-weight:500; text-decoration:none; white-space:nowrap;}
.card-link::after{content:" \203A";}
.card-link:hover{text-decoration:underline; text-underline-offset:3px;}

/* ---------- cards and grid ---------- */
.grid{display:grid; grid-template-columns:repeat(12, minmax(0,1fr)); gap:var(--gap); align-items:start;}
.s12{grid-column:span 12;} .s8{grid-column:span 8;} .s7{grid-column:span 7;} .s6{grid-column:span 6;} .s5{grid-column:span 5;} .s4{grid-column:span 4;}
.stack{display:grid; gap:var(--gap); min-width:0;}
.grid > *, .stack > *{min-width:0;}   /* a wide table scrolls inside its card instead of widening the page */
.card{background:var(--sheet); border:1px solid var(--border); border-radius:var(--r-card); padding:var(--card-pad); min-width:0;}
.card-head{display:flex; align-items:baseline; justify-content:space-between; gap:4px 12px; flex-wrap:wrap; margin-bottom:16px;}
.card-head h2{font-size:var(--fs-section); line-height:22px; font-weight:600;}
.card-head .meta{margin-top:2px; color:var(--muted); font-size:13px; line-height:18px;}
.card-head .aside{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.card > h3, .sub-h{font-size:var(--fs-body); font-weight:600; margin:20px 0 8px;}
.note{color:var(--muted); font-size:13px; line-height:19px; margin-top:12px;}
.empty{display:grid; place-items:center; min-height:72px; padding:16px; border:1px dashed var(--control); border-radius:var(--r-control); color:var(--muted); text-align:center;}
.err{padding:12px 14px; border-radius:var(--r-control); background:var(--pill-neg-bg); color:var(--pill-neg-ink);}
.skeleton{display:block; height:12px; border-radius:4px; background:var(--raised);}
.loading-card .skeleton + .skeleton{margin-top:14px;}

/* KPIs: one container split by 1px dividers, a label over a figure; the answer figure leads */
.kpis{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); border:1px solid var(--border); border-radius:var(--r-card);}
.kpi{padding:14px 16px; min-width:0;}
.kpi + .kpi{border-left:1px solid var(--border);}
.kpi-label{color:var(--muted);}
.kpi-value{margin-top:6px; font-size:var(--fs-kpi); line-height:30px; font-weight:500; letter-spacing:-.01em;}
.kpi-value small{font-size:14px; color:var(--muted); font-weight:400; margin-left:3px;}
.kpi.lead .kpi-value{font-size:var(--fs-lead); line-height:38px; font-weight:600;}
.kpi-hint{margin-top:2px; color:var(--muted); font-size:var(--fs-small); line-height:16px;}
.card .kpis{margin-bottom:16px;}

/* tables: rules and alignment, grey sentence-case headers, numbers right-aligned in tabular figures */
.table-wrap{overflow-x:auto; margin:0 -8px;}
table.data{width:100%; border-collapse:collapse;}
table.data th{height:34px; padding:0 8px; text-align:left; font-weight:400; font-size:var(--fs-small); color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap;}
table.data td{padding:12px 8px; border-bottom:1px solid var(--rule); vertical-align:baseline;}
table.data tbody tr:last-child td{border-bottom:0;}
table.data th.n, table.data td.n{text-align:right; white-space:nowrap;}
table.data td.lbl{font-weight:500;}
table.data td.lbl .tag, table.data td .tag{display:block; font-weight:400; color:var(--muted); font-size:var(--fs-small); line-height:16px; margin-top:2px;}
table.data td.barcell{width:30%; min-width:96px; vertical-align:middle;}
table.data tr.group td{padding-top:18px; font-weight:600; border-bottom-color:var(--border);}
table.data tr.child td.lbl{padding-left:20px; font-weight:400;}
.bar{display:block; height:6px; border-radius:3px;}
.bar > i{display:block; height:100%; min-width:2px; border-radius:3px; background:var(--accent);}
.bar.grey > i{background:var(--control);}
.bar.low > i{background:var(--negative);}

/* hubs as themselves: the dashboard's class colour as a dot */
.hub{display:inline-flex; align-items:baseline; gap:8px; min-width:0;}
.hdot{width:8px; height:8px; border-radius:50%; background:var(--c, var(--faint)); flex:none; align-self:center;}
.pill{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px; font-size:var(--fs-small); font-weight:500; background:var(--pill-bg); color:var(--pill-ink); white-space:nowrap; flex:none;}
.pill.pos{background:var(--pill-pos-bg); color:var(--pill-pos-ink);}
.pill.neg{background:var(--pill-neg-bg); color:var(--pill-neg-ink);}
.pill.warn{background:var(--pill-warn-bg); color:var(--pill-warn-ink);}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.chips button{min-height:30px; padding:4px 10px; border:1px solid var(--border); border-radius:999px; background:var(--sheet); color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
.chips button[aria-pressed="true"]{background:var(--text); border-color:var(--text); color:var(--sheet);}

/* ---------- overview ---------- */
.todo{list-style:none; margin:0; padding:0;}
.todo li + li{border-top:1px solid var(--rule);}
.todo a{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:12px 0; text-decoration:none;}
.todo a:hover .todo-label{text-decoration:underline; text-underline-offset:3px;}
.todo-label{font-weight:500;}
.todo-n{font-size:20px; line-height:24px; font-weight:600;}
.todo-n.zero{color:var(--faint); font-weight:400;}
.todo-more{margin:-6px 0 12px; color:var(--muted); font-size:13px; line-height:18px;}
.todo-more span{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.qtext{font-weight:400; margin-top:4px; max-width:62ch; line-height:19px;}
.qkey{font-size:var(--fs-small); color:var(--positive); margin-top:4px; font-weight:400;}
.qwrong{font-size:var(--fs-small); color:var(--negative); margin-top:2px; font-weight:400;}
.qid{font-size:var(--fs-small); color:var(--muted); font-weight:400;}

/* ---------- live ---------- */
.live-total{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.live-total .value{font-size:36px; line-height:40px; font-weight:600; letter-spacing:-.01em;}
.live-total .unit{color:var(--muted); font-size:15px;}
.live-hub{padding:14px 0; border-top:1px solid var(--rule);}
.live-hub:first-child{border-top:0; padding-top:0;}
.live-hub-head{display:flex; justify-content:space-between; gap:12px; align-items:baseline; font-weight:500;}
.names{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; padding:0; list-style:none;}
.names li{padding:3px 10px; border-radius:999px; background:var(--raised); border:1px solid var(--border); overflow-wrap:anywhere; max-width:100%;}
.msg-ok{color:var(--positive);} .msg-err{color:var(--negative);}
ul.rules, ol.rules{margin:0; padding-left:18px; color:var(--muted); line-height:20px;}
.rules li + li{margin-top:8px;}
.rules b{color:var(--text); font-weight:500;}

/* ---------- inbox ---------- */
.report{padding:16px 0; border-top:1px solid var(--rule); display:grid; gap:10px;}
.report:first-child{border-top:0; padding-top:0;}
.report-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.report-date{color:var(--faint); font-size:var(--fs-small); margin-left:auto;}
.report-note{font-size:15px; line-height:22px; white-space:pre-wrap; overflow-wrap:anywhere;}
.report-reply{padding:10px 12px; border-radius:var(--r-control); background:var(--raised); white-space:pre-wrap; overflow-wrap:anywhere;}
.report-sent{color:var(--muted); font-size:13px;}
.report-actions{display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap;}
.report-actions .grow{flex:1;}
.report-everyone{display:grid; gap:8px; padding:12px; border:1px solid var(--border); border-radius:var(--r-control);}
.report.is-resolved .report-note{color:var(--muted);}
.inline-msg{font-size:13px;}

/* ---------- check-ins and surveys ---------- */
.tally{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border:1px solid var(--border); border-radius:var(--r-card); margin-bottom:4px;}
.tally > div{padding:12px 14px; min-width:0;}
.tally > div + div{border-left:1px solid var(--border);}
.tally .kpi-label{font-size:13px;}
.tally p{margin-top:6px; overflow-wrap:anywhere;}
.tally b{font-weight:600;}
.sv-text{padding:10px 0; border-top:1px solid var(--rule); font-size:15px; line-height:22px; overflow-wrap:anywhere;}
.sv-text:first-of-type{border-top:0;}
.sv-ans{display:grid; grid-template-columns:minmax(0,1fr) minmax(80px,40%) 40px; gap:12px; align-items:center; padding:6px 0;}
.sv-ans b{text-align:right; font-variant-numeric:tabular-nums; font-weight:500;}
details.more{margin-top:16px;}
details.more summary{cursor:pointer; font-weight:500; min-height:32px; display:flex; align-items:center;}
details.more[open] summary{margin-bottom:8px;}
.sv-form{display:grid; gap:16px;}
.sv-q{display:grid; grid-template-columns:minmax(0,1fr) 170px; gap:8px; padding:12px; border-radius:var(--r-card); background:var(--raised);}
.sv-q .sv-opts{grid-column:1 / -1;}
.form-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}

/* ---------- hubs ---------- */
.hub-group + .hub-group{margin-top:24px;}
.hub-group h3{font-size:13px; font-weight:500; color:var(--muted); margin:0 0 4px;}
.hub-row{padding:14px 0; border-top:1px solid var(--rule);}
.hub-group h3 + .hub-row{border-top:0;}
.hub-row-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.hub-row-head h4{font-size:15px; line-height:22px; font-weight:600; margin:0; flex:1 1 220px; min-width:0; overflow-wrap:anywhere; display:flex; align-items:center; gap:8px;}
.state{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:999px; font-size:var(--fs-small); font-weight:600; white-space:nowrap;}
.state.s-live{background:var(--pill-pos-bg); color:var(--pill-pos-ink);}
.state.s-archived{background:var(--pill-bg); color:var(--pill-ink);}
.state.s-hidden{background:var(--pill-warn-bg); color:var(--pill-warn-ink);}
.hub-meta{color:var(--muted); margin-top:6px; overflow-wrap:anywhere;}
.hub-meta b{color:var(--text); font-weight:500;}
.hub-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.arch-form{margin-top:12px; padding:16px; border-radius:var(--r-card); background:var(--raised);}
.arch-form fieldset{border:0; margin:0; padding:0; display:grid; gap:6px; min-width:0;}
.arch-form legend{font-weight:500; margin-bottom:8px; padding:0;}
.arch-opt{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r-control); background:var(--sheet); cursor:pointer; min-height:44px;}
.arch-opt input{margin:2px 0 0; accent-color:var(--text); width:18px; height:18px; flex:none;}
.arch-opt b{font-weight:500;}
.arch-opt small{display:block; color:var(--muted); font-size:13px; line-height:18px;}
.arch-opt:has(input:checked){border-color:var(--text); outline:1px solid var(--text); outline-offset:-2px;}
.arch-opt:has(input:disabled){opacity:.55; cursor:not-allowed;}
.arch-fields{display:grid; gap:16px; grid-template-columns:repeat(2, minmax(0,1fr)); margin-top:16px;}
.arch-confirm{margin-top:16px; padding:14px 16px; border-radius:var(--r-control); background:var(--pill-warn-bg); color:var(--pill-warn-ink); border:1px solid color-mix(in srgb, var(--pill-warn-ink) 30%, transparent);}
.arch-confirm p{margin:0; color:var(--text);}
.arch-msg{margin:10px 0 0;}
.log-list{list-style:none; margin:0; padding:0;}
.log-list li{padding:10px 0; border-top:1px solid var(--rule); overflow-wrap:anywhere;}
.log-list li:first-child{border-top:0; padding-top:0;}
.log-list .when{display:block; color:var(--faint); font-size:var(--fs-small);}

/* ---------- recap ---------- */
.rc-wrap{display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:24px; align-items:start;}
.rc-form{display:grid; gap:16px;}
.rc-check{display:flex; align-items:center; gap:8px; cursor:pointer;}
.rc-btns{display:flex; gap:8px; flex-wrap:wrap;}
.rc-pub{display:grid; gap:10px; padding-top:16px; border-top:1px solid var(--rule);}
.rc-preview canvas{display:block; width:100%; max-width:540px; height:auto; border-radius:var(--r-card); border:1px solid var(--border);}

/* ---------- tablet and phone: the frame folds into a 48px bar; the menu opens as a full-screen sheet ---------- */
@media (max-width:1100px){ .s8, .s7, .s5, .s4{grid-column:span 12;} }
@media (max-width:860px){
  .s6{grid-column:span 12;}
  .app{display:block;}
  .mbar{display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:10; height:52px; padding:0 12px; background:var(--frame);}
  .mbar .brand{padding:0; margin-right:auto;}
  .sidebar{position:fixed; inset:0; z-index:30; width:100%; height:100%; padding:12px 16px 24px; background:var(--sheet); visibility:hidden; transform:translateX(-100%); transition:transform .22s var(--ease), visibility 0s linear .22s;}
  .sidebar.open{visibility:visible; transform:none; transition:transform .22s var(--ease);}
  .sidebar .sheet-close{display:inline-flex; position:absolute; top:12px; right:16px;}
  .nav-item{min-height:44px; font-size:15px;}
  .sheet{margin:0; border:0; border-radius:0; padding:16px 16px 48px; min-height:calc(100svh - 52px);}
  .view-head{margin-bottom:16px;}
  .btn, .segmented button, .chips button{min-height:44px;}
  .segmented button{height:40px;}
  .kpis{grid-auto-flow:row; grid-template-columns:repeat(2, minmax(0,1fr));}
  .kpi + .kpi{border-left:0;}
  .kpi:nth-child(even){border-left:1px solid var(--border);}
  .kpi:nth-child(n+3){border-top:1px solid var(--border);}
  .kpis > .kpi:last-child:nth-child(odd){grid-column:1 / -1;}
  .tally{grid-template-columns:1fr;}
  .tally > div + div{border-left:0; border-top:1px solid var(--border);}
  .sv-q{grid-template-columns:1fr;}
  .rc-wrap{grid-template-columns:1fr;}
  .card{padding:16px;}
}
@media (max-width:560px){
  .view-tools{width:100%;}
  .view-tools .segmented{flex:1 1 100%; display:flex;}
  .view-tools .segmented button{flex:1;}
  .view-tools .stamp{margin-left:auto;}
  .arch-fields{grid-template-columns:1fr;}
  table.data .barcell{display:none;}
  .view-head .sub{font-size:14px;}
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{transition:none !important;}
}

  /* ---------- Time by section ---------- */

      hubs.map(function(r){
        return '<tr><td class="lbl">' + hubCell(r.hub) + '</td><td class="n">' + fmtNum(r.visitors) + '</td><td class="n">' + fmtMin(r.minutes) + '</td><td class="n">' + fmtMin(r.visitors ? r.minutes / r.visitors : 0) + '</td><td class="barcell">' + bar(r.minutes, maxH, "", fmtMin(r.minutes)) + '</td></tr>';
      }).join("") + '</tbody></table></div>' : empty("No study time in this range.");

    if (!tree.some(function(h){ return h.hub === state.timeHub; })) state.timeHub = tree.length ? tree[0].hub : null;

    var rows = "";
    if (h) {
      Object.keys(h.modes).map(function(k){ return h.modes[k]; }).sort(function(a, b){ return b.minutes - a.minutes; }).forEach(function(m){

        if (tag) return;
        subs.forEach(function(s){
          rows += '<tr class="child"><td class="lbl">' + esc(s.sub ? prettyPart(s.sub) : "Main view / before per-view tracking") + '</td><td class="n">' + fmtMin(s.minutes) + '</td><td class="n">' + pctOf(s.minutes, h.minutes) + '</td><td class="barcell">' + bar(s.minutes, h.minutes, "grey", pctOf(s.minutes, h.minutes)) + '</td></tr>';
        });

    }
    var secBody = h ? chips + '<div class="table-wrap"><table class="data"><thead><tr><th>Section</th><th class="n">Time</th><th class="n">Share</th><th class="barcell"><span class="visually-hidden">Share</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : empty("No section time in this range.");

      '</div><p class="note">Time comes from a heartbeat: every 25 seconds a hub is open and in view counts toward the section on screen. Since 2026-09-25 it stops after 15 minutes with no taps, clicks, keys or scrolling (unless Listen is playing). Per-view detail starts 2026-09-23; older time only knows the top-level mode.</p>';
    el.dataset.ready = "1";
  }

  /* ---------- Clicks and features ---------- */
  function clickName(t){
    var w = /^widget:/.test(t), x = t.replace(/^widget:/, "");
    var m = x.match(/^([a-z-]+)=(.*)$/);
    if (m) x = prettyPart(m[1].replace(/-/g, " ")) + ": " + m[2];
    else if (/^#/.test(x)) x = x.slice(1).replace(/[-_]/g, " ");
    else if (/^\./.test(x)) x = x.slice(1).replace(/[-_]/g, " ") + " (any)";
    return (w ? "Tools menu › " : "") + x;
  }
  /* feature events (migration_v37): what clicks and study time can't show */
  var FEATURE_GROUPS = [
    [/^view$/, "Page loads"],
    [/^tts:/, "Listen (lecture narration)"], [/^pod:/, "Timmy Time podcast"], [/^mmap:/, "Mind maps"],
    [/^fig/, "Diagrams"], [/^pet:/, "Timmy Tooth"], [/^egg:/, "Easter eggs"], [/^name:/, "Names"],
    [/^pref:/, "Settings changed"], [/^about:/, "About page"], [/^state:/, "Settings people have (daily snapshot)"], [/./, "Other"]
  ];
  var FEATURE_NOTES = {
    "tts:secs": "seconds of narration heard", "tts:end": "listened to the end", "tts:start-full": "started (As taught)", "tts:start-plain": "started (Plain English)", "tts:start-voice": "started (browser voice)",
    "egg:timmy-start": "typed TIMMY", "egg:timmy": "watched TIMMY to the end", "pet:intro": "opened his introduction", "pet:no-thanks": "said No thanks",
    "pet:adopt-button": "adopted (Adopt button)", "mmap:open": "opened a mind map", "name:set": "picked a name", "name:reset": "back to a random name", "view": "page loads"
  };
  function featureLabel(k){
    var m = /^pod:(.+):(play|secs|q1|q2|q3|q4)$/.exec(k);
    if (m) return m[1] + ": " + { play: "pressed play", secs: "seconds heard", q1: "heard 25%", q2: "heard 50%", q3: "heard 75%", q4: "heard 95% (finished)" }[m[2]];
    if (/^pet:no-thanks/.test(k)) return "said No thanks (" + k.split("-").pop() + ")";
    if (/^pet:adopt-closed/.test(k)) return "adopted by closing the intro (" + k.split("-").pop() + ")";
    if (/^fig-seen:/.test(k)) return k.slice(9) + " (on screen)";
    if (/^fig-part:/.test(k)) return k.slice(9) + " (tapped a part)";
    if (/^fig:/.test(k)) return k.slice(4) + " (moved a control)";
    return FEATURE_NOTES[k] || k.replace(/^[a-z]+:/, "");
  }
  function featuresCard(){
    var f = D("features");
    if (f.error) return card("Features", "", errBox("Couldn’t load feature events (migration_v37)."));
    var rows = (f.data || []).filter(function(r){ return (keepHub(r.hub) || r.hub === "dashboard" || r.hub === "about") && !/^zz-/.test(r.hub); });
    if (!rows.length) return card("Features", rangeText(), empty("No feature events yet. Tracking started 2026-10-20."));
    var by = {};
    rows.forEach(function(r){
      var k = by[r.kind] || (by[r.kind] = { kind: r.kind, people: 0, total: 0, pages: {} });
      k.people = Math.max(k.people, Number(r.people) || 0); k.total += Number(r.total) || 0; k.pages[r.hub] = Number(r.people) || 0;
    });
    var groups = {};
    Object.keys(by).forEach(function(k){
      var g = FEATURE_GROUPS.filter(function(x){ return x[0].test(k); })[0][1];
      (groups[g] = groups[g] || []).push(by[k]);
    });
    var body = FEATURE_GROUPS.map(function(x){ return x[1]; }).filter(function(g, i, a){ return groups[g] && a.indexOf(g) === i; }).map(function(g){
      var list = groups[g].sort(function(a, b){ return b.people - a.people || b.total - a.total; });
      return '<tr class="group"><td colspan="3">' + esc(g) + '</td></tr>' + list.slice(0, 40).map(function(k){
        var where = Object.keys(k.pages).sort(function(a, b){ return k.pages[b] - k.pages[a]; }).slice(0, 3).map(function(h){ return hubLabel(h) + " " + k.pages[h]; }).join(", ");
        var count = /secs$/.test(k.kind) ? fmtMin(k.total / 60) : fmtNum(k.total);
        return '<tr class="child"><td class="lbl">' + esc(featureLabel(k.kind)) + '<span class="tag">' + esc(where) + '</span></td><td class="n">' + fmtNum(k.people) + '</td><td class="n">' + count + '</td></tr>';
      }).join("");
    }).join("");
    return card("Features", rangeText() + " · from 2026-10-20", '<div class="table-wrap"><table class="data"><thead><tr><th>Event</th><th class="n">People</th><th class="n">Count</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="note">People is the most on any one page (distinct devices); the line under each event splits it by page. Settings snapshots are sent once a day per page.</p>');
  }
  function renderClicks(){
    var el = $('[data-panel="clicks"]');
    var c = D("clicks"), byHub = {};
    (c.data || []).forEach(function(r){
      if (!keepHub(r.hub) && r.hub !== "dashboard") return;
      var h = byHub[r.hub] || (byHub[r.hub] = { hub: r.hub, total: 0, targets: {} });
      var n = Number(r.clicks) || 0; h.total += n;
      var t = h.targets[r.target] || (h.targets[r.target] = { target: r.target, clicks: 0, people: Number(r.people) || 0, sections: {} });
      t.clicks += n; t.sections[r.section || ""] = (t.sections[r.section || ""] || 0) + n;
    });
    var hubs = Object.keys(byHub).map(function(k){ return byHub[k]; }).sort(function(a, b){ return b.total - a.total; });
    var total = hubs.reduce(function(s, h){ return s + h.total; }, 0);
    setHead(plural(total, "click") + " on " + plural(hubs.length, "page") + " in the " + rangeText(), viewAt("clicks"));
    var clicksCard;
    if (c.error) clicksCard = card("Clicks", "", errBox("Couldn’t load click data (migration_v14)."));
    else if (!hubs.length) clicksCard = card("Clicks", rangeText(), empty("No clicks recorded yet. Tracking started 2026-09-25."));
    else {
      if (!byHub[state.clickHub]) state.clickHub = hubs[0].hub;
      var h = byHub[state.clickHub];
      var ts = Object.keys(h.targets).map(function(k){ return h.targets[k]; }).sort(function(a, b){ return b.clicks - a.clicks; });
      var shown = state.clickAll ? ts : ts.slice(0, 15), max = ts.length ? ts[0].clicks : 0;
      var chips = '<div class="chips" role="group" aria-label="Page">' + hubs.map(function(x){ return '<button type="button" data-clickhub="' + esc(x.hub) + '" aria-pressed="' + (x.hub === h.hub) + '">' + dot(x.hub) + esc(hubLabel(x.hub)) + '</button>'; }).join("") + '</div>';
      var rows = shown.map(function(t){
        var where = Object.keys(t.sections).sort(function(a, b){ return t.sections[b] - t.sections[a]; }).slice(0, 2).map(function(sx){ return sx ? sx.split("/").map(prettyPart).join(" › ") : "–"; }).join(", ");
        return '<tr><td class="lbl">' + esc(clickName(t.target)) + '<span class="tag">' + esc(where) + '</span></td><td class="n">' + fmtNum(t.clicks) + '</td><td class="n">' + fmtNum(t.people) + '</td><td class="barcell">' + bar(t.clicks, max, "", fmtNum(t.clicks) + " clicks") + '</td></tr>';
      }).join("");
      clicksCard = card("Clicks in " + esc(hubLabel(h.hub)), fmtNum(h.total) + " clicks · " + rangeText(), chips +
        '<div class="table-wrap"><table class="data"><thead><tr><th>Button, tab or link</th><th class="n">Clicks</th><th class="n">People</th><th class="barcell"><span class="visually-hidden">Share</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        (ts.length > 15 ? '<p class="note"><button type="button" class="btn ghost" id="clickAll">' + (state.clickAll ? "Show the top 15" : "Show all " + ts.length) + '</button></p>' : '') +
        '<p class="note">Counted per button, tab or link (answer choices are grouped, never logged one by one). People is distinct devices. Lots of time but few clicks means it is being read; something nobody opens is a candidate to cut.</p>');
    }
    el.innerHTML = '<div class="grid"><div class="s7">' + clicksCard + '</div><div class="s5">' + featuresCard() + '</div></div>';
    el.dataset.ready = "1";
  }

  /* ---------- Searches (migration_v23): content the hubs didn't have ---------- */
  function renderSearches(){
    var el = $('[data-panel="searches"]'), d = D("searches");
    if (d.error) { el.innerHTML = errBox("Couldn’t load search terms (migration_v23)."); setHead("", 0); return; }

      list.map(function(r){ return '<tr><td class="lbl">' + esc(r.term) + '</td><td>' + hubCell(r.hub) + '</td><td class="n">' + fmtNum(r.searches) + '</td><td class="n">' + fmtNum(r.hits) + '</td></tr>'; }).join("") + '</tbody></table></div>'; }

  /* ---------- Exam check-ins (migration_v23): newest first, groups by their newest check-in ---------- */
  var DEBRIEF_EXTRA = { diagrams: "Diagrams helpful", pbox_img: "Patient Box pictures helpful" };
  function renderCheckins(){
    var el = $('[data-panel="checkins"]'), d = D("debriefs");
    if (d.error) { el.innerHTML = errBox("Couldn’t load exam check-ins (migration_v23). Try Refresh."); setHead("", 0); return; }
    /* newest first everywhere: the rows inside a group by created_at, and the groups by their newest check-in
       (never by hub name or exam label: those sort as text) */
    var groups = {};
    sortNewest(d.data || []).forEach(function(r){ var k = r.hub + "\u0001" + r.exam; (groups[k] = groups[k] || []).push(r); });
    var keys = Object.keys(groups).sort(function(a, b){ return newestAt(groups[b]) - newestAt(groups[a]) || (a < b ? -1 : a > b ? 1 : 0); });
    setHead(keys.length ? plural((d.data || []).length, "check-in") + " for " + plural(keys.length, "exam") + ", newest first" : "None yet", viewAt("checkins"));
    if (!keys.length) { el.innerHTML = empty("No check-ins yet. They come in the day after an exam: a pop-up on each person’s first dashboard visit, and a Check in button on the hub’s card for 60 days."); el.dataset.ready = "1"; return; }
    el.innerHTML = '<div class="stack">' + keys.map(function(k, gi){
      var rows = groups[k], ans = rows.filter(function(r){ return r.answers; }), p = k.split("\u0001");
      function tally(id){
        var c = {}; ans.forEach(function(r){ var v = r.answers[id]; if (v != null && v !== "") c[v] = (c[v] || 0) + 1; });
        return Object.keys(c).sort(function(a, b){ return c[b] - c[a]; }).map(function(v){ return esc(v) + " <b>" + c[v] + "</b>"; }).join(" · ") || "–";
      }
      var ready = ans.filter(function(r){ return r.answers.ready; });
      var avg = ready.length ? (ready.reduce(function(s, r){ return s + Number(r.answers.ready); }, 0) / ready.length).toFixed(1) : "–";
      var body = '<div class="tally"><div><div class="kpi-label">Ready, 1 to 5</div><p><b>' + avg + '</b> average · ' + tally("ready") + '</p></div>' +
        '<div><div class="kpi-label">How it went</div><p>' + tally("went") + '</p></div>' +
        '<div><div class="kpi-label">Hub against the exam</div><p>' + tally("match") + '</p></div></div>';
      /* any other 1-5 rating an exam added (extraQs in index.html, e.g. Occlusion's diagrams / pbox_img) */
      var extra = {}; ans.forEach(function(r){ Object.keys(r.answers).forEach(function(id){ if (id !== "ready" && typeof r.answers[id] === "number") extra[id] = 1; }); });
      Object.keys(extra).forEach(function(id){
        var vs = ans.filter(function(r){ return typeof r.answers[id] === "number"; });
        body += '<p class="note"><b>' + esc(DEBRIEF_EXTRA[id] || id) + ', 1 to 5:</b> average ' + (vs.reduce(function(s, r){ return s + r.answers[id]; }, 0) / vs.length).toFixed(1) + ' · ' + tally(id) + '</p>';
      });
      var notes = ans.filter(function(r){ return r.answers.missed; });
      body += '<h3 class="sub-h">What the hub could do better</h3>' + (notes.length ? notes.map(function(r){ return '<div class="sv-text">' + esc(r.answers.missed) + '</div>'; }).join("") : '<p class="muted">No written answers.</p>');
      var trs = ans.map(function(r){ return '<tr><td class="n">' + esc(r.answers.ready || "–") + '</td><td>' + esc(r.answers.went || "–") + '</td><td class="n">' + fmtMin(r.minutes) + '</td><td class="n">' + fmtNum(r.answered) + '</td><td class="n">' + (r.accuracy == null ? "–" : r.accuracy + "%") + '</td><td class="n">' + esc(fmtDate(r.created_at)) + '</td></tr>'; }).join("");
      body += '<details class="more"' + (gi === 0 ? ' open' : '') + '><summary>Each check-in next to that person’s use of the hub</summary><div class="table-wrap"><table class="data"><thead><tr><th class="n">Ready</th><th>How it went</th><th class="n">Time in hub</th><th class="n">Answers</th><th class="n">Accuracy</th><th class="n">Sent</th></tr></thead><tbody>' + trs + '</tbody></table></div></details>';
      var who = {}; ans.forEach(function(r){ who[r.visitor_id] = 1; });
      return '<div data-checkin-group="' + esc(p[0]) + '" data-newest="' + newestAt(rows) + '">' +
        card('<span class="hub">' + dot(p[0]) + '<span>' + esc(hubLabel(p[0])) + ' · ' + esc(p[1]) + '</span></span>',
          plural(ans.length, "check-in") + " from " + plural(Object.keys(who).length, "person", "people") + " · newest " + esc(fmtDate(new Date(newestAt(rows)).toISOString())), body) + '</div>';
    }).join("") + '</div>';
    el.dataset.ready = "1";
  }

  /* ---------- Surveys: results, on/off, and a form to publish one ---------- */
  function renderSurveys(){
    var el = $('[data-panel="surveys"]');
    var list = sortNewest(D("surveys").data || []);   /* newest survey first (the server sends them so too) */
    var liveOnes = list.filter(function(s){ return s.active; });
    setHead(liveOnes.length ? "“" + liveOnes[0].title + "” is live on the dashboard" : "No survey is live on the dashboard", viewAt("surveys"));
    var out = "";

          body += vals.length ? vals.slice(0, 60).map(function(v){ return '<div class="sv-text">' + esc(v) + '</div>'; }).join("") : '<p class="muted">No written answers yet.</p>';
        } else {

          var keys = q.kind === "scale" ? ["1", "2", "3", "4", "5"] : (q.options || []).map(String);
          Object.keys(counts).forEach(function(k){ if (keys.indexOf(String(k)) < 0) keys.push(String(k)); });
          var max = Math.max.apply(null, keys.map(function(k){ return counts[k] || 0; }).concat([0]));
          body += keys.map(function(k){ return '<div class="sv-ans"><span>' + esc(k) + '</span>' + bar(counts[k] || 0, max, "", (counts[k] || 0) + " votes") + '<b>' + (counts[k] || 0) + '</b></div>'; }).join("");
          var others = ans.map(function(a){ return a && a[id + "_other"]; }).filter(Boolean);
          if (others.length) body += '<p class="note">“Other” answers:</p>' + others.slice(0, 60).map(function(v){ return '<div class="sv-text">' + esc(v) + '</div>'; }).join("");
          if (q.kind === "scale" && vals.length) body += '<p class="note">Average ' + (vals.reduce(function(s, v){ return s + Number(v); }, 0) / vals.length).toFixed(1) + ' / 5</p>';
        }
      });
      var toggle = '<button class="btn" type="button" data-sv-toggle="' + sv.survey_id + '" data-on="' + (sv.active ? "1" : "0") + '">' + (sv.active ? "Turn off" : "Turn on") + '</button>';
      out += card(esc(sv.title) + (sv.active ? ' <span class="pill pos">live on the dashboard</span>' : ''),
        plural(sv.responses, "answer") + " · " + fmtNum(sv.skipped) + " said no thanks · created " + new Date(sv.created_at).toLocaleDateString(), body, toggle);
    });
    if (!list.length && !D("surveys").error) out = empty("No surveys yet. Publish one with the form, or ask a Claude session to write one.");
    var qRow = function(n){ return '<div class="sv-q"><label class="field"><span>Question ' + n + (n > 1 ? ' (optional)' : '') + '</span><input class="input sv-prompt"></label>' +
      '<label class="field"><span>Answer type</span><select class="input sv-kind"><option value="choice">Pick one</option><option value="multi">Pick any</option><option value="scale">1 to 5 scale</option><option value="text">Written answer</option></select></label>' +
      '<label class="field sv-opts-field"><span>Options, separated by commas</span><input class="input sv-opts"><small>For pick one and pick any: 2 to 8 options.</small></label></div>'; };
    var form = card("New survey", "Shows once to each person on the dashboard; answering or “No thanks” hides it for good. One survey is live at a time.",
      '<form class="sv-form" id="svForm"><label class="field"><span>Title</span><input class="input" id="svTitle" required maxlength="80" placeholder="Help shape the hubs"></label>' + qRow(1) + qRow(2) + qRow(3) + qRow(4) + qRow(5) +
      '<div class="form-actions"><label class="toggle"><input type="checkbox" class="switch" id="svLive" checked> Go live now</label><button class="btn primary" type="submit">Publish survey</button><span id="svMsg" class="inline-msg muted" role="status"></span></div></form>');
    el.innerHTML = '<div class="grid"><div class="s7 stack">' + out + '</div><div class="s5">' + form + '</div></div>';
    el.dataset.ready = "1";
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-sv-toggle]"); if (!b) return;
    b.disabled = true;
    supabase.rpc("admin_set_survey_active", { p_secret: secret, p_survey: Number(b.dataset.svToggle), p_active: b.dataset.on !== "1" })
      .then(function(){ return need(["surveys"], true); })
      .then(function(){ if (state.tab === "surveys") renderSurveys(); });
  });
  document.addEventListener("submit", function(e){
    if (e.target.id !== "svForm") return;
    e.preventDefault();
    var f = e.target, msg = $("#svMsg"), qs = [];
    f.querySelectorAll(".sv-q").forEach(function(row, i){
      var prompt = row.querySelector(".sv-prompt").value.trim(); if (!prompt) return;
      var kind = row.querySelector(".sv-kind").value;
      var q = { id: "q" + (i + 1), kind: kind, prompt: prompt };
      if (kind === "choice" || kind === "multi") {
        q.options = row.querySelector(".sv-opts").value.split(",").map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 8);
        if (q.options.length < 2) { msg.textContent = "Question " + (i + 1) + " needs at least two options."; qs = null; return; }
      }
      if (qs) qs.push(q);
    });
    if (!qs) return;
    var title = $("#svTitle").value.trim();
    if (!title) { msg.textContent = "Give the survey a title."; $("#svTitle").focus(); return; }
    if (!qs.length) { msg.textContent = "Add at least one question."; return; }
    var slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36);
    msg.textContent = "Publishing…";
    supabase.rpc("admin_upsert_survey", { p_secret: secret, p_slug: slug, p_title: title, p_questions: qs, p_active: $("#svLive").checked })
      .then(function(r){
        if (r && r.error) { msg.textContent = "Couldn’t publish: " + r.error.message; return; }
        return need(["surveys"], true).then(function(){ if (state.tab === "surveys") renderSurveys(); });
      });

  /* ---------- Questions ---------- */
  function toughest(hub){
    return questionRows().filter(function(r){ return (r.attempts || 0) >= 3 && (hub === "all" || r.hub === hub); })
      .map(function(r){ return { hub: r.hub, qid: r.qid, attempts: r.attempts, pct: Math.round(r.correct / r.attempts * 100) }; })
      .sort(function(a, b){ return a.pct - b.pct || b.attempts - a.attempts; });
  }
  /* question text comes from each live hub's own SH_EXPORT, read from a hidden same-site
     frame (?sh_export=1 keeps that copy from logging any activity) */
  var QTEXT = {}, qtextLoaded = {};
  function loadQuestionText(hub){
    if (qtextLoaded[hub] || isArchived(hub)) return;
    qtextLoaded[hub] = true;
    var f = document.createElement("iframe");
    f.src = "../hubs/" + encodeURIComponent(hub) + "/index.html?sh_export=1";
    f.style.cssText = "position:absolute;width:1px;height:1px;border:0;left:-9999px";
    f.setAttribute("aria-hidden", "true"); f.tabIndex = -1;
    f.onload = function(){
      try {
        var ex = f.contentWindow.SH_EXPORT;
        (ex && ex.questions || []).forEach(function(q){ QTEXT[hub + "|" + q.id] = q; });
      } catch (e) {}
      f.remove();
      if (state.tab === "overview" || state.tab === "questions") renderView(state.tab);
    };
    document.body.appendChild(f);
  }
  function topWrong(hub, qid){
    var q = QTEXT[hub + "|" + qid]; if (!q || !q.choices) return null;
    /* select-all: rows count how often each option was ticked; wrong = an option not in the key */
    var isKey = Array.isArray(q.correct) ? function(i){ return q.correct.indexOf(i) > -1; } : q.answer != null ? function(i){ return i === q.answer; } : null;
    if (!isKey) return null;
    var best = null;
    (D("choices").data || []).forEach(function(c){
      if (c.hub === hub && c.qid === qid && !isKey(c.choice) && (!best || c.picks > best.picks)) best = c;
    });
    return best && q.choices[best.choice] ? { text: q.choices[best.choice], picks: best.picks } : null;
  }
  function toughTable(rows, compact){
    rows.forEach(function(r){ loadQuestionText(r.hub); });
    return '<div class="table-wrap"><table class="data"><thead><tr><th>Question</th>' + (compact ? '' : '<th>Hub</th>') + '<th class="n">Answers</th><th class="n">Correct</th></tr></thead><tbody>' +
      rows.map(function(r){
        var q = QTEXT[r.hub + "|" + r.qid], w = topWrong(r.hub, r.qid);
        var cell = '<span class="qid">' + esc(r.qid) + '</span>' + (compact ? ' <span class="muted">· ' + esc(hubLabel(r.hub)) + '</span>' : '') + (q ? '<div class="qtext">' + esc(q.text) + '</div>' +
          (!compact && q.choices && q.answer != null ? '<div class="qkey">Key: ' + esc(q.choices[q.answer]) + '</div>' : '') +
          (!compact && q.choices && Array.isArray(q.correct) ? '<div class="qkey">Key: ' + esc(q.correct.map(function(i){ return q.choices[i]; }).join('; ')) + '</div>' : '') +
          (w ? '<div class="qwrong">' + (Array.isArray(q.correct) ? 'Most ticked wrong option: ' : 'Most picked wrong: ') + esc(w.text) + ' (' + w.picks + ')</div>' : '') : '');
        return '<tr><td class="lbl">' + cell + '</td>' + (compact ? '' : '<td>' + hubCell(r.hub) + '</td>') + '<td class="n">' + fmtNum(r.attempts) + '</td><td class="n' + (r.pct < 50 ? ' msg-err' : '') + '">' + r.pct + '%</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  function renderQuestions(){
    var el = $('[data-panel="questions"]');
    if (D("qstats").error) { el.innerHTML = errBox("Couldn’t load question data. Try Refresh."); setHead("", 0); return; }
    var rows = questionRows(), byHub = {}, att = 0, cor = 0;
    rows.forEach(function(r){
      var h = byHub[r.hub] || (byHub[r.hub] = { hub: r.hub, att: 0, cor: 0, qs: 0 });
      h.att += r.attempts || 0; h.cor += r.correct || 0; h.qs++; att += r.attempts || 0; cor += r.correct || 0;
    });
    var hubs = Object.keys(byHub).map(function(k){ return byHub[k]; }).sort(function(a, b){ return b.att - a.att; });
    setHead(att ? plural(att, "answer") + " so far · " + Math.round(cor / att * 100) + "% right across " + (state.archived ? "all hubs" : "the live hubs") : "No answers yet", viewAt("questions"));
    var sumTbl = hubs.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>Hub</th><th class="n">Questions</th><th class="n">Answers</th><th class="n">Right</th><th class="barcell"><span class="visually-hidden">Share right</span></th></tr></thead><tbody>' +
      hubs.map(function(h){
        var p = h.att ? Math.round(h.cor / h.att * 100) : 0;
        return '<tr><td class="lbl">' + hubCell(h.hub) + '</td><td class="n">' + fmtNum(h.qs) + '</td><td class="n">' + fmtNum(h.att) + '</td><td class="n">' + p + '%</td><td class="barcell">' + bar(p, 100, p < 50 ? "low" : "", p + "% correct") + '</td></tr>';
      }).join("") + '</tbody></table></div>' : empty("No answers yet.");
    if (state.qHub !== "all" && !byHub[state.qHub]) state.qHub = "all";
    var chips = '<div class="chips" role="group" aria-label="Hub"><button type="button" data-qhub="all" aria-pressed="' + (state.qHub === "all") + '">All hubs</button>' +
      hubs.map(function(h){ return '<button type="button" data-qhub="' + esc(h.hub) + '" aria-pressed="' + (state.qHub === h.hub) + '">' + dot(h.hub) + esc(hubLabel(h.hub)) + '</button>'; }).join("") + '</div>';
    var tough = toughest(state.qHub).slice(0, 25);
    el.innerHTML = '<div class="stack">' + card("Accuracy by hub", "all time", sumTbl) +
      card("Toughest questions", "lowest share right, 25 at most · questions with fewer than 3 answers are left out so one fluke doesn’t rank", chips + (tough.length ? toughTable(tough) : empty("No questions with 3 or more answers here yet."))) +
      '</div><p class="note">Under 50% right shows in red. Question ids match each hub’s own question bank.</p>';
    el.dataset.ready = "1";
  }

  /* ---------- Engagement ---------- */
  function sumOpens(list){ return list.reduce(function(s, r){ return s + (r.opens || 0); }, 0); }
  function renderEngagement(){
    var el = $('[data-panel="engagement"]');
    var sRows = D("streaks").data || [];
    var active = sRows.find(function(r){ return r.kind === "active"; });
    var record = sRows.find(function(r){ return r.kind === "record"; });
    var ns = (D("nukeSum").data && D("nukeSum").data[0]) || {};
    /* unlocks are recorded from 2026-10-03 (migration_v33); "never used" = no launch before their next unlock */
    var nu = (D("nukeUnlocks").data || []).filter(function(r){ return keepHub(r.hub); });
    var nuSum = nu.reduce(function(s, r){ s.unlocks += r.unlocks; s.unused += r.unused; return s; }, { unlocks: 0, unused: 0 });
    setHead("Streaks, tactical nukes and the modes people open", viewAt("engagement"));
    var out = kpis([
      { label: "Longest streak now", value: active ? fmtNum(active.streak) : "0", hint: active ? esc(active.display_name) : "no one on a streak" },
      { label: "Streak record", value: record ? fmtNum(record.streak) : "0", hint: record ? esc(record.display_name) : "–" },
      { label: "Nukes launched", value: fmtNum(ns.total_launches), hint: rangeText() },
      { label: "People who launched", value: fmtNum(ns.unique_launchers), hint: rangeText() },
      { label: "Nukes unlocked", value: fmtNum(nuSum.unlocks), hint: fmtNum(nuSum.unused) + " never used · since Oct 3" }
    ]);
    var modesCard;
    if (D("modes").error) modesCard = card("Most-opened modes", "", errBox("Couldn’t load mode data."));
    else {
      var byHub = {};
      (D("modes").data || []).forEach(function(r){ if (!r.hub || !keepHub(r.hub)) return; (byHub[r.hub] = byHub[r.hub] || []).push(r); });
      var hubs = Object.keys(byHub).sort(function(a, b){ return sumOpens(byHub[b]) - sumOpens(byHub[a]); });
      var rows = "";
      hubs.forEach(function(h){
        var list = byHub[h].sort(function(a, b){ return (b.opens || 0) - (a.opens || 0); });
        var max = list[0] ? list[0].opens : 0;
        rows += '<tr class="group"><td>' + hubCell(h) + '</td><td class="n">' + fmtNum(sumOpens(list)) + '</td><td class="barcell"></td></tr>';
        list.forEach(function(r){ rows += '<tr class="child"><td class="lbl">' + esc(prettyPart(r.mode)) + '</td><td class="n">' + fmtNum(r.opens) + '</td><td class="barcell">' + bar(r.opens, max, "grey", r.opens + " opens") + '</td></tr>'; });
      });
      modesCard = card("Most-opened modes", "all time · how often each top-level mode was opened",
        rows ? '<div class="table-wrap"><table class="data"><thead><tr><th>Mode</th><th class="n">Opens</th><th class="barcell"><span class="visually-hidden">Share</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : empty("No data yet."));
    }
    var nh = (D("nukeHub").data || []).filter(function(r){ return keepHub(r.hub); });
    var nr = D("nukeRecent").data || [];
    var unlockBy = {}; nu.forEach(function(r){ unlockBy[r.hub] = r; });
    var nukeHubs = nh.map(function(r){ return r.hub; }); nu.forEach(function(r){ if (nukeHubs.indexOf(r.hub) < 0) nukeHubs.push(r.hub); });
    var launchBy = {}; nh.forEach(function(r){ launchBy[r.hub] = r.launches; });
    var nukeBody = nukeHubs.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>Hub</th><th class="n">Unlocked</th><th class="n">Never used</th><th class="n">Launches</th></tr></thead><tbody>' +
      nukeHubs.map(function(h){ var u = unlockBy[h] || {}; return '<tr><td class="lbl">' + hubCell(h) + '</td><td class="n">' + fmtNum(u.unlocks || 0) + '</td><td class="n">' + fmtNum(u.unused || 0) + '</td><td class="n">' + fmtNum(launchBy[h] || 0) + '</td></tr>'; }).join("") + '</tbody></table></div>' : empty("No unlocks or launches in this range.");
    var recentBody = nr.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>Who</th><th>Hub</th><th class="n">When</th></tr></thead><tbody>' +
      nr.map(function(r){ return '<tr><td class="lbl">' + esc(r.display_name) + '</td><td>' + hubCell(r.hub) + '</td><td class="n">' + fmtDate(r.launched_at) + '</td></tr>'; }).join("") + '</tbody></table></div>' : empty("No launches yet.");
    el.innerHTML = '<div class="stack">' + out + '<div class="grid"><div class="s6">' + modesCard + '</div><div class="s6 stack">' + card("Nukes by hub", rangeText(), nukeBody) + card("Recent nukes", "last 10", recentBody) + '</div></div></div>';
    el.dataset.ready = "1";
  }

  /* ---------- Inbox: reports to answer, and podcast comments ---------- */
  function renderInbox(){

    setHead(open.length ? plural(open.length, "report") + " waiting for a reply" : "Nothing waiting for a reply", viewAt("inbox"));
    if (D("reports").error) { el.innerHTML = errBox("Couldn’t load reports. Try Refresh.") + podCommentsCard(); return; }
    var rows = all.filter(function(r){ return state.inbox === "all" || (state.inbox === "open" ? !r.resolved : r.resolved); });
    var filter = '<div class="segmented" role="group" aria-label="Show">' + [["open", "Open " + open.length], ["resolved", "Resolved"], ["all", "All " + all.length]].map(function(o){
      return '<button type="button" data-inbox="' + o[0] + '" aria-pressed="' + (state.inbox === o[0]) + '">' + o[1] + '</button>'; }).join("") + '</div>';
    var list = rows.length ? rows.map(function(r){
      var head = '<div class="report-top"><span class="pill' + (r.kind === "flag" ? ' neg' : '') + '">' + (r.kind === "flag" ? "Question report" : "Suggestion") + '</span>' +
        (r.hub ? hubCell(r.hub) : '') + '<span class="report-date">' + fmtDate(r.created_at) + '</span></div>';
      var note = '<div class="report-note">' + esc(r.note) + '</div>';

          '<div class="report-actions"><span class="report-sent grow">' + (r.can_notify ? (r.reply_seen_at ? 'Seen by the sender ' + fmtDate(r.reply_seen_at) : 'The sender sees it on their next visit') : 'Sent before replies existed: the sender can’t be notified') + '</span>' +
          '<button class="btn resolve-btn is-done" type="button">Reopen</button></div></div>';
      }

        '<label class="field"><span>' + (r.kind === "flag" ? 'What was fixed (the sender sees this)' : 'Reply to the sender (optional)') + '</span><textarea class="input report-replybox" maxlength="1500" id="' + rid + '"></textarea></label>' +
        /* what the whole class sees: its own wording, since the reply is written to one person */
        '<div class="report-everyone" hidden><label class="field"><span>Notice title, for everyone</span><input class="input report-all-title" maxlength="120" value="' + esc(r.kind === "flag" ? "A question was fixed after a student report" : "A classmate's suggestion was added") + '"></label>' +
        '<label class="field"><span>Notice message</span><textarea class="input report-all-msg" maxlength="1500"></textarea><small>Shown once on every hub and the dashboard, then kept in everyone’s Inbox for 60 days.</small></label></div>' +
        '<div class="report-actions"><label class="toggle"><input type="checkbox" class="switch report-all"> Also tell everyone</label><span class="report-sent grow">' + (r.can_notify ? 'The sender is notified when you resolve it.' : 'Sent before replies existed: only a notice to everyone reaches anyone.') + '</span>' +
        '<span class="inline-msg msg-err report-msg" role="status"></span><button class="btn primary resolve-btn" type="button">Resolve and notify</button></div></div>';
    }).join("") : empty(state.inbox === "open" ? "Nothing open. Every report has a reply." : "Nothing here yet.");
    el.innerHTML = '<div class="stack">' + card("Reports and suggestions", fmtNum(open.length) + " open · " + fmtNum(all.length) + " in all", list, filter) + podCommentsCard() + '</div>';
    el.dataset.ready = "1";

  /* ---------- Live: who is studying right now (admin_live_presence, migration_v50) ----------
     Live = at least one study ping in the last LIVE_MINUTES. widget/v3.js sends one for every 25 s a hub tab is
     visible and in use, and stops when the tab is hidden or after 15 minutes with no input. Names are the ones the
     class already sees on the leaderboards (a chosen name, else the random class name); the server never sends a
     visitor id, an email or a section. Polls every 30 s, only while this view is open and the page is visible; after an
     error it waits 1, 2, 4, then 5 minutes. Overview reads it once (a copy under 2 minutes old is reused).
     Reference: vault/reference/admin-operations.md. */
  var LIVE_MINUTES = 3, LIVE_EVERY = 30000;

  function liveOn(){ return !!secret && state.tab === "live" && document.visibilityState !== "hidden"; }

  function liveNext(){

          '<li><b>Names</b> are the leaderboard names: a name the student chose, otherwise their random class name. The page never gets a visitor id, an email or which section someone is on. Two linked devices count once; someone in two hubs shows in both and counts once in the total.</li>' +

  /* ---------- Hubs: the dashboard state of every hub, and a manual override (migration_v50) ----------

    var keep = " Its page and link, its questions, the analytics and everyone’s progress stay as they are.";
    if (pick === "auto") {
      var after = window.shArchive.resolve(x.h, null, new Date(), dash.src.options, x.listed);
      return name + " goes back to Automatic: the dates decide, so it shows as " + STATE_WORD[after.state] + " now (" + STATE_WHAT[after.state] + ")." + keep;
    }
    return name + " will show as " + STATE_WORD[pick] + " on the dashboard from now " + (until ? "until " + when(until) + ", then the dates decide again" : "until you change it") +
      ": " + STATE_WHAT[pick] + "." + keep + " Students see it the next time they open the dashboard; an open dashboard checks again within 5 minutes.";
  }
  function renderHubAdmin(){
    var el = $('[data-panel="hubs"]'); if (!el) return;
    if (!window.shArchive) { el.innerHTML = errBox("widget/archive.js didn’t load. Reload the page."); return; }
    var rules = card("How it’s decided", "",
      '<ol class="rules"><li><b>A state you set here wins</b> (Live, Archived or Hidden) until you set the hub back to Automatic, or until its end time if you give one.</li>' +
      '<li><b>Otherwise the dates in the dashboard’s code decide:</b> a hub archives at 10 pm on its last exam day (or its <code>archiveOn</code>) and its card goes 10 days later (or on its <code>hideCardOn</code>).</li>' +
      '<li><b>Nothing is deleted or moved.</b> The hub’s page and link, its questions, the analytics and everyone’s progress stay. Check-ins still follow the exam dates.</li></ol>');
    if (!dash.src) {
      setHead("What each hub shows on the dashboard, and why", 0);
      el.innerHTML = '<div class="grid"><div class="s8">' + card("Hubs", "", dash.err ? errBox("Couldn’t read the dashboard’s hub list (" + esc(dash.err.message || dash.err) + "). Try Refresh.") : '<div class="loading-card" aria-busy="true"><span class="skeleton" style="width:50%"></span><span class="skeleton" style="width:80%"></span></div>') + '</div><div class="s4">' + rules + '</div></div>';
      return;
    }
    var groups = { live: [], archived: [], hidden: [] };
    allAdmHubs().forEach(function(x){ groups[admState(x).state].push(x); });
    setHead(groups.live.length + " live · " + groups.archived.length + " archived · " + groups.hidden.length + " hidden on the dashboard", hubAdm.at);
    var body = (hubAdm.err ? errBox("Couldn’t load the overrides" + (needsMigration(hubAdm.err) ? " (needs migration_v50)" : "") + ". Showing the dates only; changes can’t be saved.") : '') +
      ["live", "archived", "hidden"].map(function(st){
        if (!groups[st].length) return "";
        return '<div class="hub-group"><h3>' + STATE_WORD[st] + ' · ' + groups[st].length + '</h3>' + groups[st].map(hubRowHTML).join("") + '</div>';
      }).join("");
    var log = hubAdm.log;
    var logBody = log == null ? '<p class="muted">' + (hubAdm.err ? 'The log needs migration_v50.' : 'Loading…') + '</p>'
      : !log.length ? '<p class="muted">No changes yet. Every change made here is listed, newest first.</p>'
      : '<ol class="log-list">' + log.slice().sort(function(a, b){ return (Date.parse(b.at) - Date.parse(a.at)) || (b.id - a.id); }).map(function(l){
          return '<li><span class="when">' + esc(when(l.at)) + '</span><b>' + esc(hubLabel(l.hub)) + ':</b> ' + STATE_WORD[l.old_state] + (l.old_until ? ' (until ' + esc(when(l.old_until)) + ')' : '') +
            ' → ' + STATE_WORD[l.new_state] + (l.new_until ? ' (until ' + esc(when(l.new_until)) + ')' : '') + (l.note ? ' · “' + esc(l.note) + '”' : '') + '</li>';
        }).join("") + '</ol>';
    el.innerHTML = '<div class="grid"><div class="s8">' + card("Hubs", "what students see on the dashboard now, and why", body) + '</div>' +
      '<div class="s4 stack">' + card("Change log", "newest first · one passphrase is shared, so a note says who and why", logBody) + rules + '</div></div>';
    if (hubAdm.focus) { var f = el.querySelector(hubAdm.focus); hubAdm.focus = null; if (f) f.focus(); }
  }
  function admHub(id){ return allAdmHubs().filter(function(x){ return x.h.id === id; })[0] || null; }
  function readForm(id){
    var f = document.querySelector('[data-arch-form="' + id + '"]'); if (!f) return null;
    var c = f.querySelector('input[type=radio]:checked');
    return { pick: c ? c.value : "auto", until: f.querySelector('[name=until]').value, note: f.querySelector('[name=note]').value };
  }
  var hubsPanel = $('[data-panel="hubs"]');
  hubsPanel.addEventListener("change", function(e){
    var f = e.target.closest("[data-arch-form]"); if (!f || !hubAdm.open) return;
    var v = readForm(f.dataset.archForm);
    hubAdm.open.pick = v.pick; hubAdm.open.until = v.until; hubAdm.open.note = v.note;
    if (e.target.type === "radio") {
      var reviewing = !!hubAdm.open.review;
      hubAdm.open.review = null; hubAdm.msg = null; f.querySelector('[name=until]').disabled = v.pick === "auto";
      /* a different choice while the confirmation is up: back to the form, focus kept on the choice */
      if (reviewing) { hubAdm.focus = '[data-arch-form="' + f.dataset.archForm + '"] input[value="' + v.pick + '"]'; renderHubAdmin(); }
    }
  });
  hubsPanel.addEventListener("input", function(e){
    var f = e.target.closest("[data-arch-form]"); if (!f || !hubAdm.open) return;
    var v = readForm(f.dataset.archForm); hubAdm.open.until = v.until; hubAdm.open.note = v.note;
  });
  hubsPanel.addEventListener("submit", function(e){
    var f = e.target.closest("[data-arch-form]"); if (!f) return;
    e.preventDefault();
    var id = f.dataset.archForm, x = admHub(id); if (!x || !hubAdm.open) return;
    var v = readForm(id), r = admState(x), until = null;
    hubAdm.open.pick = v.pick; hubAdm.open.until = v.until; hubAdm.open.note = v.note; hubAdm.msgHub = id;
    if (hubAdm.err) { hubAdm.msg = { ok: false, text: "The overrides didn’t load, so nothing can be saved. Refresh and try again." }; renderHubAdmin(); return; }
    if (v.pick !== "auto" && v.until) {
      until = new Date(v.until);
      if (isNaN(until) || until.getTime() < Date.now() + 60000) { hubAdm.msg = { ok: false, text: "The end time has to be in the future. Leave it blank to keep the state until you change it." }; hubAdm.focus = '[data-arch-form="' + id + '"] [name=until]'; renderHubAdmin(); return; }
      if (until.getTime() > Date.now() + 400 * 864e5) { hubAdm.msg = { ok: false, text: "The end time can be at most 400 days away." }; hubAdm.focus = '[data-arch-form="' + id + '"] [name=until]'; renderHubAdmin(); return; }
    }
    var curUntil = r.source === "manual" && r.until ? r.until.getTime() : null, cur = r.source === "manual" ? r.state : "auto";
    if (v.pick === cur && (v.pick === "auto" || (until ? until.getTime() : null) === curUntil)) { hubAdm.msg = { ok: false, text: "That is how it is set now: nothing to change." }; renderHubAdmin(); return; }
    hubAdm.msg = null;
    hubAdm.open.review = { pick: v.pick, until: until, text: changeText(x, r, v.pick, until), version: r.version };
    hubAdm.focus = '[data-arch-form="' + id + '"] .arch-confirm';
    renderHubAdmin();
  });
  hubsPanel.addEventListener("click", function(e){
    var b;
    if ((b = e.target.closest("[data-arch-edit]"))) {
      var id = b.dataset.archEdit;
      if (hubAdm.open && hubAdm.open.hub === id) { hubAdm.open = null; hubAdm.focus = '[data-arch-edit="' + id + '"]'; }
      else { hubAdm.open = { hub: id }; hubAdm.msg = null; hubAdm.focus = '[data-arch-form="' + id + '"] input[type=radio]:checked'; }
      renderHubAdmin(); return;
    }
    if ((b = e.target.closest("[data-arch-auto]"))) {
      var ida = b.dataset.archAuto, xa = admHub(ida); if (!xa) return;
      var ra = admState(xa);
      hubAdm.open = { hub: ida, pick: "auto", review: { pick: "auto", until: null, text: changeText(xa, ra, "auto", null), version: ra.version } };
      hubAdm.msg = null; hubAdm.focus = '[data-arch-form="' + ida + '"] .arch-confirm'; renderHubAdmin(); return;
    }
    if ((b = e.target.closest("[data-arch-cancel]"))) { var idc = b.dataset.archCancel; hubAdm.open = null; hubAdm.msg = null; hubAdm.focus = '[data-arch-edit="' + idc + '"]'; renderHubAdmin(); return; }
    if ((b = e.target.closest("[data-arch-back]"))) { var idb = b.dataset.archBack; hubAdm.open.review = null; hubAdm.focus = '[data-arch-form="' + idb + '"] [type=submit]'; renderHubAdmin(); return; }
    if ((b = e.target.closest("[data-arch-confirm]"))) {
      var idk = b.dataset.archConfirm, o = hubAdm.open; if (!o || !o.review || hubAdm.busy) return;
      hubAdm.busy = true; renderHubAdmin();
      var note = (o.note || "").trim();
      supabase.rpc("admin_set_hub_archive", { p_secret: secret, p_hub: idk, p_state: o.review.pick, p_until: o.review.until ? o.review.until.toISOString() : null,
        p_note: note || null, p_expect: o.review.version }).then(function(res){
        hubAdm.busy = false;
        var err = res && res.error;
        if (err) {
          var conflict = err.code === "40001" || /conflict/i.test(err.message || "");
          hubAdm.msgHub = idk;
          hubAdm.msg = { ok: false, text: conflict ? "This hub was changed in another tab or on another device since the page loaded. It has been reloaded: check it and try again." : "Couldn’t save: " + (err.message || "the server said no") + "." };
          if (conflict) { hubAdm.open = null; hubAdm.focus = '[data-arch-edit="' + idk + '"]'; return loadHubAdmin(); }
          renderHubAdmin(); return;
        }
        var saved = (res && res.data) || {};
        hubAdm.open = null; hubAdm.msgHub = idk;
        hubAdm.msg = { ok: true, text: saved.changed === false ? "Nothing changed: it was already set that way." : "Saved: " + STATE_WORD[o.review.pick] + (o.review.until ? " until " + when(o.review.until) : "") + ". It’s in the change log." };
        hubAdm.focus = '[data-arch-edit="' + idk + '"]';
        return loadHubAdmin();
      }, function(){ hubAdm.busy = false; hubAdm.msgHub = idk; hubAdm.msg = { ok: false, text: "Couldn’t reach the server. Nothing was changed; try again." }; renderHubAdmin(); });
    }
  });
  hubsPanel.addEventListener("keydown", function(e){
    if (e.key !== "Escape" || !hubAdm.open) return;
    var id = hubAdm.open.hub; hubAdm.open = null; hubAdm.msg = null; hubAdm.focus = '[data-arch-edit="' + id + '"]'; renderHubAdmin();
  });

  /* ---------- views and routing (#overview, #inbox, ...: the back button and links work) ---------- */
  var RENDER = { overview: renderOverview, inbox: renderInbox, time: renderTime, questions: renderQuestions, clicks: renderClicks, searches: renderSearches,
    engagement: renderEngagement, checkins: renderCheckins, surveys: renderSurveys, live: renderLive, hubs: renderHubAdmin, recap: renderRecapPanel };
  function renderView(t){
    var v = VIEWS[t], el = $('[data-panel="' + t + '"]');
    $("#viewTitle").textContent = v.t;
    $("#rangeSeg").hidden = !v.range; $("#archivedToggle").hidden = !v.past;
    if (t === "live") { renderLive(); return; }
    if (t === "hubs") { renderHubAdmin(); if (!hubAdm.loading && (!dash.src || !hubAdm.rows)) loadHubAdmin(); return; }
    if (t === "recap") { renderRecapPanel(); return; }
    var keys = v.needs || [];
    var ready = keys.every(fresh) && (!v.past || dash.src || dash.err);
    if (ready) { RENDER[t](); return; }
    loadingView(el); setHead("Loading…", 0);
    Promise.all([need(keys), v.past ? loadDash() : null]).then(function(){ if (state.tab === t) RENDER[t](); });
  }
  function showTab(t, fromHash){
    if (!VIEWS[t]) t = "overview";
    var changed = state.tab !== t;
    state.tab = t; savePrefs();
    $$(".nav [data-tab]").forEach(function(a){ if (a.dataset.tab === t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    $$(".view").forEach(function(p){ p.hidden = p.dataset.panel !== t; });
    if (!fromHash && location.hash !== "#" + t) { try { history.replaceState(null, "", "#" + t); } catch (e) {} }
    closeMenu();
    if (changed) window.scrollTo(0, 0);
    if (t === "live") pollLive(false); else liveStop();
    renderView(t);
  }
  window.addEventListener("hashchange", function(){ if (secret) showTab(location.hash.slice(1), true); });
  document.addEventListener("click", function(e){
    var a = e.target.closest('a[href^="#"]');
    if (a && secret) { var t = a.getAttribute("href").slice(1); if (VIEWS[t]) { e.preventDefault(); if (location.hash !== "#" + t) location.hash = t; else showTab(t, true); return; } }
    var c;
    if ((c = e.target.closest("[data-qhub]"))) { state.qHub = c.dataset.qhub; renderQuestions(); }
    if ((c = e.target.closest("[data-timehub]"))) { state.timeHub = c.dataset.timehub; renderTime(); }
    if ((c = e.target.closest("[data-clickhub]"))) { state.clickHub = c.dataset.clickhub; state.clickAll = false; renderClicks(); }
    if (e.target.closest("#clickAll")) { state.clickAll = !state.clickAll; renderClicks(); }
    if ((c = e.target.closest("[data-inbox]"))) { state.inbox = c.dataset.inbox; renderInbox(); }
  });
  $("#rangeSeg").addEventListener("click", function(e){
    var b = e.target.closest("[data-days]"); if (!b) return;
    state.days = Number(b.dataset.days); savePrefs(); syncControls(); renderView(state.tab);
  });
  $("#showArchived").addEventListener("change", function(e){ state.archived = e.target.checked; savePrefs(); renderView(state.tab); });
  $("#refreshBtn").addEventListener("click", function(){
    var t = state.tab;
    if (t === "live") { pollLive(true); return; }
    if (t === "hubs") { hubAdm.pages = {}; loadHubAdmin(true); return; }
    if (t === "recap") { loadPublished(); return; }
    var keys = VIEWS[t].needs || [];
    $("#viewStamp").textContent = "Updating…";
    need(keys, true).then(function(){ if (state.tab === t) RENDER[t](); });
  });
  function syncControls(){
    $$("#rangeSeg [data-days]").forEach(function(b){ b.setAttribute("aria-pressed", String(Number(b.dataset.days) === state.days)); });
    $("#showArchived").checked = state.archived;
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") liveStop(); else if (state.tab === "live") pollLive(false);
  });

  /* the phone menu: a full-screen sheet; Escape or Close returns focus to the Menu button */
  var menuBtn = $("#menuBtn"), sidebar = $("#sidebar");
  function openMenu(){ sidebar.classList.add("open"); menuBtn.setAttribute("aria-expanded", "true"); var a = sidebar.querySelector('[aria-current="page"]') || sidebar.querySelector(".nav-item"); if (a) a.focus(); }
  function closeMenu(){ if (!sidebar.classList.contains("open")) return; sidebar.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); if (getComputedStyle(menuBtn).display !== "none") menuBtn.focus(); }
  menuBtn.addEventListener("click", openMenu);
  $("#menuClose").addEventListener("click", closeMenu);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && sidebar.classList.contains("open")) closeMenu(); });

  /* inbox interactions */
  var inboxPanel = $('[data-panel="inbox"]');
  inboxPanel.addEventListener("change", function(e){
    /* "Also tell everyone" opens its own notice, started from the reply so it can be reworded for the class */
    if (e.target.classList.contains("report-all")) {
      var cardEl = e.target.closest(".report"), ev = cardEl.querySelector(".report-everyone");
      ev.hidden = !e.target.checked;
      var msg = cardEl.querySelector(".report-all-msg"), reply = cardEl.querySelector(".report-replybox").value.trim();
      if (e.target.checked && !msg.value.trim() && reply) {
        var row = (D("reports").data || []).find(function(r){ return r.kind === cardEl.getAttribute("data-kind") && r.id === Number(cardEl.getAttribute("data-id")); });
        msg.value = (row && row.hub ? hubLabel(row.hub) + ": " : "") + reply;
      }
      if (e.target.checked) msg.focus();
    }
  });
  inboxPanel.addEventListener("click", function(e){
    var pb = e.target.closest(".pod-hide-btn");
    if (pb) {
      var pid = Number(pb.closest("[data-pod-id]").getAttribute("data-pod-id")), hide = pb.getAttribute("data-hidden") !== "1";
      pb.disabled = true;
      supabase.rpc("admin_hide_pod_comment", { p_secret: secret, p_id: pid, p_hidden: hide }).then(function(res){
        if (res && !res.error) {
          (D("podComments").data || []).forEach(function(c){ if (c.id === pid) { c.hidden = hide; c.hidden_by = hide ? "admin" : null; } });
          renderInbox();
        } else pb.disabled = false;
      }, function(){ pb.disabled = false; });
      return;
    }
    var btn = e.target.closest(".resolve-btn"); if (!btn) return;
    var cardEl = btn.closest(".report");
    var kind = cardEl.getAttribute("data-kind");
    var id = Number(cardEl.getAttribute("data-id"));
    var row = (D("reports").data || []).find(function(r){ return r.kind === kind && r.id === id; });
    if (!row) return;
    var next = !row.resolved;
    var box = cardEl.querySelector(".report-replybox");
    var reply = box ? box.value.trim() : "";
    var toAll = !!(cardEl.querySelector(".report-all") || {}).checked;
    var allTitle = toAll ? cardEl.querySelector(".report-all-title").value.trim() : "";
    var allMsg = toAll ? cardEl.querySelector(".report-all-msg").value.trim() : "";
    var m = cardEl.querySelector(".report-msg");
    if (next && toAll && (!allTitle || !allMsg)) { if (m) m.textContent = "Write the notice to everyone first: a title and a message."; return; }
    btn.disabled = true; if (m) m.textContent = "";
    supabase.rpc("set_report_resolved", { p_secret: secret, p_kind: kind, p_id: id, p_resolved: next, p_reply: reply || null }).then(function(res){
      if (res && res.error) { btn.disabled = false; if (m) m.textContent = "Couldn’t save: " + (res.error.message || "the server said no") + "."; return; }
      row.resolved = next;
      if (next) { if (reply) row.reply = reply; row.resolved_at = new Date().toISOString(); row.reply_seen_at = null; }
      /* "Tell everyone": a notice every visitor sees once and keeps in their Inbox (widget/replies.js) */
      if (next && toAll) {
        supabase.rpc("admin_post_notice", { p_secret: secret, p_hub: null, p_title: allTitle, p_message: allMsg, p_days: 14 }).then(function(r2){
          if (r2 && r2.error) alert("Resolved, but the notice to everyone didn’t send.");
        });
      }
      updateInboxCount(); renderInbox();
    }, function(){ btn.disabled = false; if (m) m.textContent = "Couldn’t reach the server. Try again."; });
  });

  /* ---------- sign-in ---------- */
  var gate = $("#gate"), app = $("#app"), gateInput = $("#gateInput"), gateBtn = $("#gateBtn"), gateMsg = $("#gateMsg");
  function showApp(ok, msg){
    gate.hidden = ok; app.hidden = !ok;
    if (!ok) { secret = null; gateMsg.textContent = msg || ""; try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
  }
  function trySignIn(candidate){
    secret = candidate;
    gateBtn.disabled = true;
    gateMsg.textContent = "Checking…";
    supabase.rpc("get_reports", { p_secret: secret }).then(function(res){
      gateBtn.disabled = false;
      if (res && res.error) { showApp(false, "That passphrase didn’t work."); return; }
      try { sessionStorage.setItem(SESSION_KEY, secret); } catch (e) {}
      gateMsg.textContent = "";
      data.reports = { data: (res && res.data) || [], days: state.days, at: Date.now() };   /* the sign-in check already read the Inbox */
      updateInboxCount();
      showApp(true);
      syncControls();
      loadDash();
      var h = location.hash.slice(1);
      showTab(VIEWS[h] ? h : state.tab, VIEWS[h] ? true : false);
    }, function(){
      gateBtn.disabled = false;
      showApp(false, "Couldn’t reach the server. Try again.");
    });
  }
  $("#gateForm").addEventListener("submit", function(e){
    e.preventDefault();
    var v = (gateInput.value || "").trim();
    if (!v) { gateMsg.textContent = "Type the passphrase first."; gateInput.focus(); return; }
    trySignIn(v);
  });
  $("#lockBtn").addEventListener("click", function(){ liveStop(); data = {}; showApp(false, "Locked."); gateInput.value = ""; gateInput.focus(); });
  try { var s = sessionStorage.getItem(SESSION_KEY); if (s) trySignIn(s); } catch (e) {}
})();
</script>
</body>
</html>
