# After merge: the steps that used to be done by hand after every merge to main (Sam, 2026-11-15: "lets make all of that
# automatic"), worked out from what the push changed by tools/after-merge/run.js: a hub's answer keys, Ask Timmy's
# deploy with one real question, a new Timmy Time episode, the data fixes the push added, the changelog lines it added,
# and the post-release check. How it works and what to do when it fails: vault/how-to/after-a-merge.md.
#
# The secrets live in the `after-merge` environment (Settings → Environments), which only main may use, so a pull
# request's workflows can never read them: SB_KEY, ADMIN_SECRET and SUPABASE_ACCESS_TOKEN. Without them the steps
# that need them show as "blocked" and the run fails.
name: After merge
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      from:
        description: "Do the steps for everything since this commit (empty: the commit before main's latest)"
        required: false
      fix:
        description: "Also run this data fix (tools/data-fixes/<file>.sql), for one added before this workflow or one that didn't run"
        required: false
permissions:
  contents: read
# one at a time and never cancelled: a data fix or a key load must not be cut off halfway
concurrency:
  group: after-merge
  cancel-in-progress: false
jobs:
  after-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: after-merge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the push's range, the podcast before and after, the changelog lines added
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless Chromium (for the post-release check)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium || {
            echo "::warning::Ubuntu's package mirror was unreachable: Chromium installed without its system packages (the runner image has the ones it needs)"
            npx playwright install chromium
          }
      - name: The after-merge steps this push needs
        env:
          SB_KEY: ${{ secrets.SB_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FROM: ${{ inputs.from || github.event.before }}
          FIX: ${{ inputs.fix }}
        run: |
          args=(--to "$GITHUB_SHA")
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$FIX" ] && args+=(--fix "$FIX")
          node tools/after-merge/run.js "${args[@]}"
