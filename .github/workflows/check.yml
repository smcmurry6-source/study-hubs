name: Check hubs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the PR's merge commit and its base (HEAD^1), so the smoke test sees which hubs changed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and merge markers
        run: node tools/ci/syntax.js
      - name: Public-repo check (no secrets, course material or data files)
        if: ${{ !cancelled() }}
        run: node tools/release/secrets.js
      - name: Database permissions (RLS, grants, secret-gated functions) on a throwaway copy of supabase/schema.sql
        if: ${{ !cancelled() }}
        run: |
          ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q postgresql)
          node tools/release/rls.js
      - name: Admin operations on fixtures (live presence privacy, archive overrides, newest-first check-ins)
        if: ${{ !cancelled() }}
        run: node tools/release/admin-ops.js
      - name: Analytics retention on fixtures (the approved deletes, kept hourly totals, device linking, recap)
        if: ${{ !cancelled() }}
        run: node tools/release/retention.js
      - name: XP and the game layer on fixtures (migration_v54 waiting for its release; a replayed call, a double tap, a linked device)
        if: ${{ !cancelled() }}
        run: node tools/release/xp.js
      - name: Hub archive state (the dashboard's dates and admin overrides)
        if: ${{ !cancelled() }}
        run: node tools/ci/archive.js
      - name: Install headless Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Click through the hubs this PR changes (every hub on main or when a shared file changes) and lint their question banks
        env:
          SMOKE_CHANGED_FROM: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: node tools/ci/smoke.js
      - name: Preview safety (no production requests, noindex, fixtures)
        if: ${{ !cancelled() }}
        run: node tools/ci/preview.js
      - name: Vault notes, links and tasks
        if: ${{ !cancelled() }}
        run: node tools/ci/vault.js
      - name: Drawn Patient Box cases (realistic numbers, keys agree)
        run: node tools/ci/cases.js
      - name: The redesign's generated files are current (site art, the new hubs' content from the live hubs)
        if: ${{ !cancelled() }}
        run: node tools/figures/site/build.mjs --check && node tools/hub-next/build.mjs --check
