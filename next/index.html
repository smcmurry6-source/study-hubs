<title>Study Hubs</title>
<script>
/* The redesigned dashboard (phase 3 of the redesign, vault/tasks/2026-11-05-redesign-phase-3-dashboard.md). Nothing links
   here and it is only for the preview: anywhere but a preview (or a file/localhost copy) it sends the visitor to the live
   dashboard, so the class keeps seeing the live one until the redesign is released. */
(function(){
  var local = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (!window.SH_PREVIEW_CONFIG && !local) { location.replace("../" + location.hash); return; }
  /* the theme and text size before first paint (the keys every hub uses) */
  var r = document.documentElement; r.className += " shx sh-dash";
  try {
    var t = localStorage.getItem("sh_theme"); if (t === "light" || t === "dark") r.setAttribute("data-theme", t);
    var z = { small: .9, large: 1.15, xlarge: 1.3, xxlarge: 1.45 }[localStorage.getItem("sh_pref_size")]; if (z) r.style.zoom = z;
  } catch (e) {}
})();
</script>

   hubs.js, written from the live dashboard by tools/dash-next/build.mjs until the release. */

</script>
