<html lang="en" data-theme="light">

<meta charset="utf-8">

<title>perio-chart figure preview</title>
<style>
/* Boards hub tokens. Palette "chart and scrubs": a clean chart-paper ground, scrub-teal accent, ink-blue text.
   Type: Literata (display) · Atkinson Hyperlegible (body, built for legibility) · JetBrains Mono (labels).
   Token names follow the other hubs (--surface, --ink, --line, --accent...) because widget/v3.css reads them;
   --card is an alias for older widget rules. Theme: sh_theme (system / light / dark) sets <html data-theme>. */
:root{
  color-scheme: light;
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eaefee; --surface-3:#dbe3e2; --card:var(--surface);
  --ink:#17212b; --ink-soft:#46525e; --ink-faint:#68737e; --line:#d9e1e0; --line-strong:#bccaca;
  --accent:#17666f; --accent-ink:#11545c; --accent-soft:#d8ecee; --on-accent:#ffffff;
  --good:#2c7a4b; --good-soft:#dcefe3; --bad:#b4372f; --bad-soft:#f7dcd8; --caution:#946013; --caution-soft:#f5e8cc;
  --tag-amber:#a8701a; --tag-sage:#57834f; --tag-blue:#2f62a8; --tag-teal:#1f7f78; --tag-violet:#6a4fa5; --tag-red:#b3352d; --tag-green:#4d7a22; --tag-rose:#b9436a;
  --tag-amber-soft:#f5e6c8; --tag-sage-soft:#e1ecdc; --tag-blue-soft:#dce6f4; --tag-teal-soft:#d5ecea; --tag-violet-soft:#e7e0f3; --tag-red-soft:#f6dbd7; --tag-green-soft:#e2ecd2; --tag-rose-soft:#f5dbe3;
  --c-boards:#17666f; --c-boards-soft:#d8ecee;
  --shadow:0 1px 2px rgba(23,33,43,.06), 0 4px 14px rgba(23,33,43,.07);
  --radius:12px;
  --font-display:'Literata', Georgia, serif;
  --font-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#10161b; --surface:#172027; --surface-2:#1e2931; --surface-3:#28353e; --card:var(--surface);
    --ink:#e8eef1; --ink-soft:#b3bfc6; --ink-faint:#8a979f; --line:#2a3740; --line-strong:#3c4c56;
    --accent:#6cc5cc; --accent-ink:#8fd6dc; --accent-soft:#16343a; --on-accent:#0b1a1d;
    --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
    --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6;
    --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27;
    --c-boards:#6cc5cc; --c-boards-soft:#16343a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10161b; --surface:#172027; --surface-2:#1e2931; --surface-3:#28353e; --card:var(--surface);
  --ink:#e8eef1; --ink-soft:#b3bfc6; --ink-faint:#8a979f; --line:#2a3740; --line-strong:#3c4c56;
  --accent:#6cc5cc; --accent-ink:#8fd6dc; --accent-soft:#16343a; --on-accent:#0b1a1d;
  --good:#6fc28d; --good-soft:#1d3527; --bad:#ef8a78; --bad-soft:#40211c; --caution:#e2b056; --caution-soft:#3a2d15;
  --tag-amber:#e0a64a; --tag-sage:#93bf89; --tag-blue:#7fa9e0; --tag-teal:#5cc2bb; --tag-violet:#ad95e0; --tag-red:#ec7f70; --tag-green:#9bc567; --tag-rose:#ec86a6;
  --tag-amber-soft:#3a2c14; --tag-sage-soft:#223020; --tag-blue-soft:#1b2a3c; --tag-teal-soft:#15312f; --tag-violet-soft:#2a2240; --tag-red-soft:#3a1d19; --tag-green-soft:#25301a; --tag-rose-soft:#3a1c27;
  --c-boards:#6cc5cc; --c-boards-soft:#16343a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body)}
main{width:min(1160px,calc(100% - 28px));margin:24px auto 48px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 20px}
h1{font:700 24px/1.2 var(--font-display);margin:0}
.theme-toggle{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);padding:9px 13px;font:600 14px var(--font-body);cursor:pointer}
.sample{margin:18px 0;padding:18px 0 20px;border-top:1px solid var(--line)}
h2{font:700 19px/1.25 var(--font-display);margin:0 0 12px}
.figure-scroll{max-width:100%;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface);overscroll-behavior-inline:contain}
.figure-scroll svg{display:block;max-width:none}
.note{font-size:13px;color:var(--ink-soft);margin:4px 0 20px}
@media(max-width:600px){main{width:calc(100% - 20px);margin-top:14px}.page-head{align-items:flex-start}h1{font-size:21px}.sample{padding-top:14px}.figure-scroll{border-radius:6px}}
</style>
